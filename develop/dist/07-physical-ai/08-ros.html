const BANK={"id":"pai-ros","code":"PR","title":"Physical AI 3일차 · ROS 2 (노드·토픽·turtlesim·카메라·launch)","subtitle":"Node·Topic·Message · Graph·QoS·Image · TTL·watchdog·launch","course":"07 · Physical AI","source":"07-NEPES_physicalAI_자율주행자동차/08.ROS_v2/*.ipynb + ____/_____3___v2.pdf","salt":"pai-ros","version":1,"updated":"2026-10-15","tabs":[{"id":"t1","title":"ROS 통신 기본 · Node·Topic·Message","ref":"08.ROS_v2 01 · 슬라이드 p.52–56","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"ROS에서 카메라 프레임·온도처럼 계속 생기는 데이터를 전달하는 논리 이름은?","o":["Node","Topic","Message","Callback"],"a":1,"h":"자료는 ROS의 세 용어를 Node는 계산을 수행하는 실행 참가자, Message는 field와 type의 계약으로 정의합니다. 남은 하나가 /temperature처럼 publisher와 subscriber가 함께 가리키는 '연속 데이터의 이름'입니다. 계속 흘러가며 매 발행마다 응답을 기다리지 않는 통신 방식의 이름을 떠올려 보세요.","w":"Topic은 연속 데이터의 이름입니다. Node는 계산 주체, Message는 필드와 타입의 계약, Callback은 도착한 메시지를 처리하는 함수입니다.","an":"01_ros_basics §1 세 용어 · 슬라이드 p.52","src":"- **Node** 는 계산을 수행하는 실행 참가자입니다.\n- **Topic** 은 계속 생기는 데이터를 전달하는 논리 이름입니다.\n- **Message** 는 전달할 field와 type의 계약입니다."},{"id":"t1-02","ty":"mc","lv":1,"game":true,"p":"전달할 필드 이름과 자료형의 '계약'에 해당하는 것은?","o":["Topic","Node","Message","Domain"],"a":2,"h":"온도 메시지는 device_id·sequence·temperature_c·status·captured_ms를 함께 전달하며, 각 필드의 이름과 자료형을 미리 약속해 둡니다. 숫자처럼 보이는 문자열과 실제 숫자는 다르므로 타입까지 맞아야 계약을 지킨 것입니다. 계산 주체(Node)나 데이터 이름(Topic)이 아니라 '무엇을 어떤 타입으로 담는가'를 정한 단위를 고르세요.","w":"Message는 field와 type의 계약입니다. 숫자처럼 보이는 문자열과 실제 숫자를 구분하는 것도 이 계약의 일부입니다.","an":"01_ros_basics §1 · 슬라이드 p.54","src":"Message는 필드 이름과 타입이 있는 계약이다\n강사 설명 | 3일차 · ROS · 통신 60분 | 핵심 이론\n● 온도 메시지는 device_id·sequence·temperature_c·status·captured_ms를 \n함께 전달합니다."},{"id":"t1-03","ty":"mc","lv":2,"game":true,"p":"Subscriber 쪽에서 메시지가 도착할 때마다 실행되는 함수는?","o":["callback","launch","publisher","daemon"],"a":0,"h":"Publisher는 topic에 메시지를 발행하고, subscriber는 같은 topic을 구독해 둡니다. 메시지가 도착하면 subscriber 쪽에 등록해 둔 함수 하나가 그 한 건을 처리하며, 이 함수에서 긴 작업을 하면 다른 처리가 지연될 수 있습니다. 직접 호출하지 않고 '도착 시 불려지는' 함수를 부르는 이름을 떠올려 보세요.","w":"Subscriber는 topic을 구독하고 메시지가 도착하면 callback을 실행합니다. 긴 작업을 callback에 넣으면 다른 처리가 지연될 수 있습니다.","an":"01_ros_basics §1 · 슬라이드 p.53","src":"● Publisher는 topic에 메시지를 발행합니다. Subscriber는 같은 topic을 \n구독하고 도착하면 callback을 실행합니다."},{"id":"t1-04","ty":"mc","lv":2,"game":true,"p":"온도 메시지 계약에서 status가 'hot'이 되는 조건은?","o":["69.9도 이상","70.0도 이상","70.0도 초과","75.0도 이상"],"a":1,"h":"정답 코드는 온도를 유한한 숫자로 바꾼 뒤 <code>\"hot\" if temperature >= 70.0 else \"normal\"<\/code>로 status를 정합니다. 자료는 경계값으로 69.999는 normal, 70.0은 어느 쪽인지 함께 검사하라고 합니다. 비교 연산자가 <code>&gt;<\/code>인지 <code>&gt;=<\/code>인지에 주목하세요.","w":"70.0도 이상이면 hot, 그 아래면 normal입니다. 69.999는 normal, 70.0은 hot입니다.","an":"01_ros_basics §2 TODO Message schema · 슬라이드 p.63","src":"온도는 유한한 숫자로 바꾸고 70.0 이상이면 hot, 아니면 normal입니다. 69.999는 normal, 70.0은 hot입니다."},{"id":"t1-05","ty":"mc","lv":3,"game":true,"p":"<code>make_temperature_message<\/code>에 temperature_c로 NaN이 들어오면 올바른 처리는?","o":["0으로 바꿔 보낸다","normal로 보낸다","예외로 거부한다","문자열로 바꾼다"],"a":2,"h":"정답 코드의 <code>_number<\/code>는 <code>math.isfinite(value)<\/code>가 거짓이면 <code>ValueError<\/code>를 발생시킵니다. 계약 표도 temperature_c는 NaN·Inf가 아닌 유한수여야 하며, 잘못된 값을 임의 기본값으로 바꾸지 말라고 합니다. 값을 고치거나 조용히 넘기는 처리와, 호출자에게 문제를 드러내는 처리 중 어느 쪽인지 생각해 보세요.","w":"NaN·Inf는 정상 측정값처럼 메시지에 들어가면 안 되므로 ValueError로 거부합니다. 임의 기본값으로 바꾸면 입력 문제가 숨겨집니다.","an":"01_ros_basics §2 · 정답 해설","src":"`69.999`와 `70.0` 양쪽을 검사합니다. 잘못된 값을 임의 기본값으로 바꾸지 말고 명시적 예외로 거부합니다."},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"Publisher는 subscriber가 없어도 topic에 메시지를 발행할 수 있다.","a":true,"h":"Publisher와 subscriber는 서로의 Python 함수를 직접 호출하지 않고, topic이라는 이름을 사이에 두고 연결됩니다. 자료는 구독자의 존재 여부와 발행 가능 여부의 관계, 그리고 늦게 시작한 구독자가 과거 메시지를 모두 받지는 못한다는 점을 함께 설명합니다. 발행이 구독자를 기다려야 하는지 판단해 보세요.","w":"맞습니다. 구독자가 없어도 발행할 수 있습니다. 다만 늦게 시작한 구독자가 과거 메시지를 모두 받는 것은 아니며, 보존 여부는 QoS에 달려 있습니다.","an":"슬라이드 p.53","src":"● Publisher는 구독자가 없어도 발행할 수 있습니다. 늦게 시작한 구독자가 \n과거 메시지를 모두 받는 것은 아닙니다."},{"id":"t1-07","ty":"ox","lv":2,"game":true,"p":"노트북의 MiniBus 검증을 통과하면 실제 DDS·QoS 통신도 검증된 것이다.","a":false,"h":"노트북의 MiniBus는 메시지 흐름과 경계값을 모델·장치 없이 학습하는 순수 Python 모형으로, 한 프로세스 안에서 통신을 흉내 냅니다. 실제 ROS는 별도 프로세스·장치 사이에서 DDS 계층이 발견과 전달을 맡고 QoS가 보존 여부를 정합니다. 모형의 PASS가 이 실제 경로의 검증까지 대신할 수 있는지 생각해 보세요.","w":"틀렸습니다. MiniBus는 메시지 흐름과 경계값을 배우는 순수 Python 모형이며, 실제 DDS·QoS·네트워크 통신은 talker/listener로 따로 확인합니다.","an":"슬라이드 p.56 · p.62","src":"● 노트북 MiniBus는 메시지 흐름과 경계값을 모델·장치 없이 학습하는 순수 \nPython 모형입니다.\n● MiniBus 통과는 실제 DDS·QoS·네트워크·프로세스 통신 검증을 대신하지 \n않습니다."},{"id":"t1-08","ty":"match","lv":2,"game":false,"p":"온도 메시지 필드와 계약을 연결하세요.","pairs":[["device_id","앞뒤 공백 없는 비어 있지 않은 문자열"],["sequence","bool이 아닌 0 이상 정수 순번"],["temperature_c","유한한 숫자, 원래 측정값 보존"],["status","70.0도 기준 hot/normal 해석"],["captured_ms","촬영·측정 시각"]],"h":"계약 표는 device_id를 앞뒤 공백 없는 문자열로, sequence·captured_ms를 bool이 아닌 0 이상 정수로, temperature_c를 원본을 보존하는 유한수로 정합니다. status는 측정값과 따로 붙이는 해석이며 70.0도를 기준으로 나뉩니다. sequence는 메시지 순번, captured_ms는 촬영/측정 시각이므로 서로 바꿔 쓰지 않습니다.","w":"측정 온도와 hot이라는 해석을 별도 필드로 둡니다. sequence는 순번, captured_ms는 측정 시각이므로 서로 바꿔 쓰지 않습니다.","an":"01_ros_basics §2 계약 표 · 슬라이드 p.54","src":"| `device_id` | 앞뒤 공백 없는 비어 있지 않은 문자열 |\n| `sequence`, `captured_ms` | bool이 아닌 0 이상 정수 |\n| `temperature_c` | bool·문자열·NaN·Inf가 아닌 유한수, 원본 보존 |\n| `status` | 70.0도 이상 `hot`, 그 아래 `normal` |"},{"id":"t1-09","ty":"order","lv":2,"game":false,"p":"실제 ROS 통신을 확인하는 순서를 맞추세요.","steps":["패키지 build","각 터미널에서 source와 Domain 설정","A: 발행 노드 실행","B: 수신 노드 실행","C: node·topic 관찰과 메시지 저장"],"h":"자료의 전체 흐름은 메시지 TODO 검증 뒤 package를 build하고, 각 Bash에서 환경을 설정한 다음 A 발행 → B 수신 → C 토픽 관찰로 이어집니다. 세 터미널은 모두 같은 Domain을 맞춰야 서로를 발견합니다. 빌드가 없으면 실행 이름을 찾지 못하고, 발행·수신 node가 없으면 관찰할 것도 없다는 점에서 순서를 세워 보세요.","w":"빌드로 실행 진입점을 만들고, 각 터미널에 환경을 적용한 뒤 A가 발행, B가 수신, C가 topic을 관찰합니다.","an":"01_ros_basics 전체 과정 · §3-4","src":"메시지 TODO·모형 검증\n ↓\npackage build\n ↓\n각 Bash 환경 설정\n ↓\nA 발행\n ↓\nB 수신\n ↓\nC 토픽 관찰"},{"id":"t1-10","ty":"multi","lv":2,"game":true,"p":"온도 메시지 계약에서 <b>거부<\/b>해야 하는 입력을 모두 고르세요.","o":["앞 공백이 있는 ID","sequence=True","temperature_c=inf","temperature_c=69.999","captured_ms=1000"],"a":[0,1,2],"h":"정답 코드는 <code>device_id != device_id.strip()<\/code>이면 ID를 고치지 않고 거부하고, sequence·captured_ms는 <code>isinstance(x, bool)<\/code>이면 int의 하위형이어도 거부합니다. 온도는 <code>math.isfinite<\/code>로 NaN·Inf를 걸러냅니다. 각 보기가 이 세 검사 중 하나에 걸리는지 하나씩 대입해 보세요.","w":"공백 있는 ID는 자동 수정하지 않고 거부하고, bool은 정수에서 제외하며, Inf는 유한수가 아니므로 거부합니다. 69.999는 normal로 정상, captured_ms=1000도 정상입니다.","an":"01_ros_basics §2 · 따라 실행 1","src":"**작성 흐름 힌트:** ID 검사(공백을 자동 수정하지 않고 거부) → 두 정수의 bool 제외·범위 검사 → 온도 숫자·유한성 검사 → >=70.0으로 status 결정 → 새 dict."}]},{"id":"t2","title":"Workspace 빌드와 터미널 환경","ref":"08.ROS_v2 01 §3 · 슬라이드 p.57–60·p.100","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":false,"p":"colcon build 뒤 ROS가 사용할 실행 진입점이 설치되는 위치는?","o":["ros_ws/src","Data/build/08.ROS_v2/install","Data/build/08.ROS_v2/log","/opt/ros/humble"],"a":1,"h":"colcon build는 <code>ros_ws/src<\/code>의 소스를 읽어 결과를 네 폴더에 나눠 둡니다: 원본 소스, 빌드 중간 결과, ROS가 사용할 패키지·실행 진입점·환경 설정, 빌드 로그입니다. 이후 <code>install/setup.bash<\/code>를 source해야 <code>ros2 run<\/code>이 이 진입점을 찾습니다. 경로 표에서 '실행 진입점'이 적힌 행을 찾아보세요.","w":"install 폴더에 패키지·실행 진입점·환경 설정이 놓입니다. src는 원본 소스, log는 빌드 로그, /opt/ros/humble은 기본 ROS 설치 경로입니다.","an":"01_ros_basics §3-1 경로 표","src":"| `08.ROS_v2/ros_ws/src` | 원본 패키지 소스·설정 |\n| `Data/build/08.ROS_v2/build` | 빌드 중간 결과 |\n| `Data/build/08.ROS_v2/install` | ROS가 사용할 패키지·실행 진입점·환경 설정 |\n| `Data/build/08.ROS_v2/log` | 빌드 진행·오류 로그 |"},{"id":"t2-02","ty":"mc","lv":2,"game":true,"p":"<code>source<\/code> 명령이 하는 일로 옳은 것은?","o":["패키지를 컴파일한다","노드를 백그라운드로 실행","Domain 번호를 자동 배정","현재 셸에 환경을 적용"],"a":3,"h":"<code>source<\/code>는 스크립트를 새 프로세스로 실행하는 것이 아니라 지금 열려 있는 셸 안에서 읽어 들여, 그 안의 환경 변수를 이 셸에 남깁니다. 그래서 빌드 스크립트 안에서 한 source는 그 별도 Bash 프로세스에만 적용되고 끝납니다. 설정이 '어느 셸'에 남는지를 기준으로 보기를 고르세요.","w":"source는 스크립트를 현재 셸에서 읽어 환경 변수를 적용합니다. 그래서 새 터미널마다 다시 실행해야 합니다.","an":"01_ros_basics §3-3","src":"`source`는 스크립트를 **현재 셸에서 읽어 환경 변수를 적용** 합니다. 빌드 스크립트 내부의 `source`는 별도 Bash 프로세스에만 적용되므로, 빌드가 끝난 뒤 현재 터미널에서도 위 설정을 해야"},{"id":"t2-03","ty":"mc","lv":2,"game":true,"p":"<code>ros2: not found<\/code>가 나오면 가장 먼저 확인할 것은?","o":["개인 Domain 번호","기본 ROS setup source","topic 이름 오타","QoS 호환"],"a":1,"h":"<code>/opt/ros/humble/setup.bash<\/code>는 기본 ROS 설치 경로를 반영해 <code>ros2<\/code> 명령과 기본 패키지를 찾게 하고, 두 번째 install setup은 수업 패키지만 찾게 합니다. 오류 표는 <code>ros2<\/code> 자체가 없을 때 컨테이너 Terminal인지, Bash인지 확인한 뒤 어떤 source를 점검하라고 합니다. 명령 자체를 못 찾는 상황이 두 source 중 어느 쪽과 관련되는지 생각하세요.","w":"ros2 명령이 없으면 컨테이너 터미널인지 확인하고 bash에 들어간 뒤 /opt/ros/humble/setup.bash를 source했는지 봅니다.","an":"01_ros_basics 오류 표 · 슬라이드 p.100","src":"| `ros2: not found` | 컨테이너 Terminal인지 확인 → Bash 진입 → 기본 ROS `source` |"},{"id":"t2-04","ty":"mc","lv":2,"game":true,"p":"<code>Package ... not found<\/code>가 나오면 확인할 단계는?","o":["빌드 성공과 install source","카메라 장치 연결","Ollama 서버 실행","rqt_graph 실행"],"a":0,"h":"이 오류는 <code>ros2<\/code> 명령은 찾았지만 수업 패키지를 찾지 못한 상황입니다. 수업 패키지는 빌드로 install 폴더에 설치되고, 현재 터미널에서 두 번째 setup.bash를 source해야 보입니다. 패키지를 만들어 내는 단계와 그것을 현재 셸에 알리는 단계를 함께 떠올려 보세요.","w":"수업 패키지를 찾지 못하면 빌드가 성공했는지, 현재 터미널에서 install/setup.bash를 source했는지 확인합니다.","an":"01_ros_basics 오류 표 · §4","src":"`Package not found`는 build 성공·현재 install source를 확인합니다."},{"id":"t2-05","ty":"mc","lv":1,"game":true,"p":"<code>ros2 run 패키지 이름<\/code>에서 두 번째 이름이 가리키는 것은?","o":["노드 이름","topic 이름","실행 이름(진입점)","launch 파일"],"a":2,"h":"<code>ros2 run<\/code> 뒤에는 이름이 두 개 오며, 첫 이름은 패키지입니다. 두 번째 이름은 setup.py의 <code>console_scripts<\/code>에 <code>status_talker = 모듈:함수<\/code> 형태로 등록되어, 빌드 때 해당 함수에 연결되는 이름입니다. 파일 경로나 node 이름이 아니라 '등록된 실행 이름'이라는 점에 주목하세요.","w":"첫 이름은 패키지, 두 번째는 실행 이름입니다. console_scripts가 실행 이름을 Python의 main() 함수와 연결합니다.","an":"01_ros_basics §3-1","src":"`ros2 run` 뒤의 첫 이름은 패키지, 두 번째 이름은 실행 이름입니다."},{"id":"t2-06","ty":"ox","lv":2,"game":true,"p":"빌드 스크립트 안에서 source했으므로 빌드가 끝나면 터미널 B·C에도 환경이 자동 적용된다.","a":false,"h":"source는 스크립트를 실행한 그 셸에만 환경 변수를 적용합니다. 빌드 스크립트는 별도의 Bash 프로세스에서 돌기 때문에 그 안의 source는 스크립트가 끝나면 사라지고, 다른 터미널이나 Python 커널로 전파되지도 않습니다. 그래서 자료는 A·B·C 모두에서 설정 블록을 실행하라고 합니다.","w":"틀렸습니다. 빌드 스크립트 내부의 source는 별도 Bash 프로세스에만 적용됩니다. A·B·C 각 터미널에서 직접 source해야 합니다.","an":"01_ros_basics §3-3","src":"빌드 스크립트 내부의 `source`는 별도 Bash 프로세스에만 적용되므로, 빌드가 끝난 뒤 현재 터미널에서도 위 설정을 해야"},{"id":"t2-07","ty":"ox","lv":1,"game":true,"p":"같은 개인 실습의 A·B·C 터미널은 같은 ROS_DOMAIN_ID를 사용한다.","a":true,"h":"<code>ROS_DOMAIN_ID<\/code>는 같은 번호의 ROS 참가자끼리 발견·통신하도록 그룹을 나누는 값입니다. 개인 실습은 수기 서명 명부의 본인 번호를 쓰며, 발행·수신·관찰을 맡은 터미널이 서로 다른 번호면 서로를 보지 못합니다. 자료가 '모든 터미널'에 어떤 값을 적용하라고 하는지 확인하세요.","w":"맞습니다. 개인 실습의 모든 터미널은 같은 번호를 쓰고, 공동 통신 실습만 강사가 지정한 동일 번호를 씁니다.","an":"슬라이드 p.58–59","src":"● 모든 터미널에 같은 값을 적용합니다. 이미 실행 중인 노드는 종료 후 다시 \n실행하고, 목록이 이상하면 daemon을 재시작합니다."},{"id":"t2-08","ty":"match","lv":2,"game":false,"p":"오류 증상과 확인할 단계를 연결하세요.","pairs":[["source: not found","셸이 sh인지 확인하고 bash 실행"],["No executable found","실행 이름 오타와 등록 확인"],["발행되지만 수신 안 됨","Domain·topic 이름·타입 확인"],["setup.bash가 없음","빌드 미완료 여부 확인"]],"h":"오류 표는 증상마다 빠진 단계를 가리킵니다: <code>source<\/code> 명령 자체가 없으면 현재 셸 종류, 실행 이름을 못 찾으면 이름 오타와 <code>setup.py<\/code> 등록, 설치용 setup.bash가 없으면 빌드 완료 여부입니다. 발행은 되는데 수신이 안 되면 A·B·C의 Domain 번호와 topic 이름·타입을 봅니다. 각 메시지가 어느 단계의 실패인지 연결해 보세요.","w":"오류 메시지는 빠진 단계를 알려 줍니다. 셸·실행 이름·통신 그룹·빌드 순서로 원인을 좁힙니다.","an":"01_ros_basics 오류 메시지 표","src":"| `No executable found` | 실행 이름 오타와 `setup.py` 등록 확인, 설정 변경 후 재빌드 |\n| 설치용 `setup.bash`가 없음 | 빌드 미완료 또는 다른 자료 폴더 사용 여부 확인 |\n| 발행되지만 수신되지 않음 | A·B·C의 Domain 번호, topic 이름·타입, 프로세스 실행 상태 확인 |"},{"id":"t2-09","ty":"order","lv":1,"game":false,"p":"새 터미널에서 ROS를 쓰기 전 준비 순서를 맞추세요.","steps":["JupyterLab에서 Terminal 열기","bash 실행","기본 ROS setup.bash source","수업 install/setup.bash source","ROS_DOMAIN_ID 설정"],"h":"JupyterLab에서 연 Terminal은 sh일 수 있으므로 먼저 <code>bash<\/code>로 들어가야 <code>source<\/code>를 쓸 수 있습니다. 그다음 <code>/opt/ros/humble/setup.bash<\/code>로 기본 ROS를, install의 setup.bash로 수업 패키지를 찾게 하고, 마지막으로 <code>export ROS_DOMAIN_ID<\/code>로 통신 그룹을 정합니다. 앞 단계가 다음 단계의 전제가 되도록 순서를 세워 보세요.","w":"Terminal을 열고 bash로 들어간 뒤 기본 ROS와 수업 패키지 순으로 source하고 Domain을 설정합니다.","an":"슬라이드 p.59–60 · 01_ros_basics §3-3","src":"```bash\nbash\nsource /opt/ros/humble/setup.bash\nsource /workspace/Data/build/08.ROS_v2/install/setup.bash\nexport ROS_DOMAIN_ID=7 # 7을 본인 수기 서명 명부 번호로 변경\n```"},{"id":"t2-10","ty":"multi","lv":2,"game":true,"p":"다시 빌드가 필요한 경우를 모두 고르세요.","o":["install 산출물이 없을 때","실행 이름을 바꿨을 때","재부팅만 했을 때","의존성을 바꿨을 때","새 터미널을 열었을 때"],"a":[0,1,3],"h":"빌드 산출물은 호스트에 연결된 <code>Data<\/code>에 남으므로, 같은 자료 폴더와 호환 이미지라면 재부팅만으로는 다시 빌드할 필요가 없습니다. 자료는 패키지 설정·의존성·실행 이름을 바꿨거나 산출물이 없을 때 다시 빌드하라고 합니다. 또 <code>--symlink-install<\/code>로 Python 소스 변경은 연결되지만 실행 중인 node는 재시작해야 합니다.","w":"첫 사용·패키지 설정·실행 이름·의존성 변경이면 다시 빌드합니다. 재부팅만 했거나 새 터미널을 연 경우는 빌드가 아니라 source가 필요합니다.","an":"01_ros_basics §3-2","src":"빌드 산출물은 호스트에 연결된 `Data`에 남으므로, 같은 자료 폴더와 호환되는 이미지라면 재부팅했다고 매번 빌드할 필요는 없습니다. 패키지 설정·의존성·실행 이름을 바꾸거나 산출물이 없으면 다시 빌드합니다."}]},{"id":"t3","title":"Graph·CLI·QoS와 turtlesim","ref":"08.ROS_v2 02 · 슬라이드 p.64–72","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"topic 이름과 type을 함께 보여 주는 명령은?","o":["ros2 node list","ros2 topic list -t","ros2 topic hz","ros2 daemon stop"],"a":1,"h":"Graph를 읽는 CLI는 질문마다 다릅니다: <code>node list<\/code>는 실행 참가자, <code>info --verbose<\/code>는 endpoint·QoS, <code>echo<\/code>는 내용, <code>hz<\/code>는 빈도를 봅니다. topic 목록 명령에 type을 함께 표시하는 짧은 옵션을 붙이면 이름과 type을 한 번에 볼 수 있습니다. 목록(list) 계열 명령 중 topic을 다루는 것을 떠올려 보세요.","w":"ros2 topic list -t는 topic 이름과 type을 보여 줍니다. node list는 노드 목록, hz는 빈도입니다.","an":"02_turtlesim_tools §1 CLI 표 · 슬라이드 p.65","src":"● node list는 실행 참가자, topic list \n-t는 이름과 type을 보여줍니다."},{"id":"t3-02","ty":"mc","lv":2,"game":true,"p":"topic의 endpoint 수와 QoS까지 확인하는 명령은?","o":["ros2 topic echo --once","ros2 node list","ros2 topic hz","ros2 topic info --verbose"],"a":3,"h":"이름과 type이 맞아도 QoS가 호환되지 않으면 수신되지 않을 수 있어, 보내는 쪽·받는 쪽 endpoint와 QoS를 직접 비교해야 합니다. 자료의 CLI 표는 이 정보를 특정 topic의 정보(info) 명령에 자세히 보기 옵션을 붙여 확인하게 합니다. 내용(echo)이나 빈도(hz)를 보는 명령과 구분하세요.","w":"ros2 topic info --verbose는 publisher/subscriber endpoint와 QoS를 보여 줍니다.","an":"02_turtlesim_tools §1 CLI 표","src":"● info --verbose는 endpoint·QoS, \necho는 내용, hz는 빈도를 \n확인합니다."},{"id":"t3-03","ty":"mc","lv":2,"game":true,"p":"turtlesim이 사용하는 Twist 필드 조합은?","o":["linear.x와 angular.z","linear.y와 angular.x","linear.z와 angular.y","angular.x와 angular.z"],"a":0,"h":"<code>geometry_msgs/msg/Twist<\/code>에는 linear와 angular 두 벡터가 있고, 각각 x·y·z 성분을 가집니다. 평면 위의 turtlesim은 앞으로 가는 선속도 하나와 제자리에서 도는 회전 속도 하나만 쓰며, 둘 다 0이면 정지 명령입니다. 평면에서 '전진 방향 축'과 '수직축 회전'이 각각 어느 성분인지 생각해 보세요.","w":"Twist에는 linear와 angular 벡터가 있고 turtlesim은 linear.x(전진)와 angular.z(회전)를 씁니다. 0,0은 정지 명령입니다.","an":"슬라이드 p.67","src":"● geometry_msgs/msg/Twist에는 linear와 angular 벡터가 있습니다. \nturtlesim은 linear.x와 angular.z를 사용합니다."},{"id":"t3-04","ty":"mc","lv":2,"game":true,"p":"QoS의 History/depth가 정하는 것은?","o":["전달 신뢰성 정책","Domain 번호","대기열에 남길 메시지 수","노드 실행 순서"],"a":2,"h":"자료는 QoS를 두 축으로 나눕니다: Reliability는 reliable·best effort 같은 전달 정책이고, History/depth는 보관 개수에 관한 설정입니다. 최신 영상이 필요한 제어에서는 오래된 프레임이 쌓이는 비용을 고려해야 한다는 설명도 이 항목과 연결됩니다. '전달 방식'이 아니라 '몇 개를 남길지'에 해당하는 보기를 고르세요.","w":"Reliability는 전달 정책, History/depth는 대기열에 남길 메시지 수입니다. 이름과 type이 맞아도 QoS가 호환되지 않으면 수신되지 않을 수 있습니다.","an":"슬라이드 p.66","src":"● Reliability는 reliable·best effort 등의 전달 정책입니다. History/depth는 \n대기열에 남길 메시지 수를 정합니다."},{"id":"t3-05","ty":"mc","lv":3,"game":true,"p":"turtle_teleop_key를 실행했는데 방향키에 거북이가 반응하지 않습니다. 가장 먼저 확인할 것은?","o":["QoS depth 값","키보드 터미널의 입력 초점","rqt_graph 실행 여부","빌드 로그"],"a":1,"h":"turtle_teleop_key는 자신이 실행된 B 터미널에서 키 입력을 읽습니다. 자료는 거북이 그림을 클릭하는 것으로는 B에 키 입력이 전달되지 않으며, GUI가 뜬 것만으로 키 입력까지 성공한 것은 아니라고 합니다. 움직이지 않을 때 자료가 제시하는 확인 순서의 첫 항목을 떠올려 보세요.","w":"B 터미널 내부를 클릭해 입력 초점을 둬야 합니다. 그다음 A/B 프로세스 → 동일 Domain → 토픽 연결 순으로 확인합니다.","an":"02_turtlesim_tools §3 직접 조작하고 관찰하기","src":"4. 움직이지 않으면 B의 초점 → A/B 프로세스 → 동일한 Domain → 토픽 연결 순으로 확인합니다. GUI가 뜨는 것만으로 키 입력까지 성공한 것은 아닙니다."},{"id":"t3-06","ty":"ox","lv":2,"game":true,"p":"graph에 publisher와 subscriber가 모두 보이면 메시지 수신이 증명된 것이다.","a":false,"h":"Graph에 publisher와 subscriber가 함께 보이는 것은 연결 후보가 있다는 증거일 뿐입니다. 양쪽이 있어도 type이나 QoS가 호환되지 않으면 전달되지 않을 수 있어, 자료는 echo 수신이나 위치 변화 같은 별도 근거를 확인하라고 합니다. <code>describe_topic<\/code>의 <code>connected=True<\/code>도 같은 의미로만 해석합니다.","w":"틀렸습니다. connected=True는 연결 가능성일 뿐입니다. echo 출력이나 pose 변화 같은 별도 근거로 실제 수신을 확인합니다.","an":"02_turtlesim_tools 정답 해설 · 슬라이드 p.70–71","src":"**설명:** 연결 후보가 있다는 증거이며 실제 수신과 다릅니다. echo·위치 변화 같은 별도 근거를 확인합니다."},{"id":"t3-07","ty":"ox","lv":1,"game":true,"p":"cmd_vel은 요청한 속도이고 pose는 관측된 상태이다.","a":true,"h":"turtlesim에서 키보드 node는 <code>cmd_vel<\/code>에 Twist를 보내고, turtlesim은 자신의 위치·방향을 <code>pose<\/code>로 발행합니다. 자료는 한쪽을 commanded state, 다른 쪽을 관측된 state로 구분하며 둘을 같은 값으로 해석하지 말라고 합니다. 문장이 이 구분과 일치하는지 확인해 보세요.","w":"맞습니다. cmd_vel은 commanded state, pose는 observed state이므로 숫자나 단위가 같다고 해석하지 않습니다.","an":"02_turtlesim_tools §3","src":"cmd_vel은 요청한 commanded state이고 pose는 관측된 state입니다."},{"id":"t3-08","ty":"match","lv":1,"game":false,"p":"CLI 명령과 확인하는 내용을 연결하세요.","pairs":[["ros2 node list","실행 중인 노드 목록"],["ros2 topic list -t","topic 이름과 type"],["ros2 topic echo --once","실제 메시지 한 건"],["ros2 topic hz","메시지 수신 빈도"]],"h":"자료는 Graph를 네 가지 CLI로 읽습니다: <code>node list<\/code>는 실행 참가자, <code>topic list -t<\/code>는 이름과 type, <code>echo<\/code>는 메시지 내용, <code>hz<\/code>는 빈도를 봅니다. <code>--once<\/code>를 붙인 echo는 한 건만 받고 끝납니다. 각 명령이 '누가·무엇이·어떤 내용이·얼마나 자주' 중 어느 질문에 답하는지 연결해 보세요.","w":"node list는 참가자, topic list -t는 이름·type, echo는 내용, hz는 빈도를 보여 줍니다. echo와 hz는 Ctrl+C로 끝냅니다.","an":"슬라이드 p.65","src":"● node list는 실행 참가자, topic list \n-t는 이름과 type을 보여줍니다.\n● info --verbose는 endpoint·QoS, \necho는 내용, hz는 빈도를 \n확인합니다."},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"turtlesim에서 키 입력이 화면 움직임이 되는 흐름을 맞추세요.","steps":["A: turtlesim 화면과 pose 생성","B: 키보드로 명령 입력","cmd_vel로 선속도·각속도 전달","화면 움직임과 pose 갱신","C: node·topic·echo로 관찰"],"h":"A는 turtlesim 화면과 pose를 만들고, B는 키보드 입력을 받아 Twist 선속도·각속도를 <code>cmd_vel<\/code>로 보냅니다. 그 명령을 받은 turtlesim이 화면을 움직이고 pose를 갱신하며, C는 node·topic·echo로 이를 관찰합니다. C는 제어를 대신하지 않고 마지막에 결과를 확인하는 역할입니다.","w":"A가 turtlesim을 유지하고 B의 키 입력이 cmd_vel로 전달되어 pose가 바뀌며, C는 이를 관찰합니다.","an":"슬라이드 p.64","src":"1. A: turtlesim\n화면·pose 생성\n2. B: 조작 입력\n키보드 명령\n3. cmd_vel 전달\nTwist 선속도·각속도\n4. 화면 움직임 \npose가 갱신됨\n5. C: 관찰\nnode·topic·echo"},{"id":"t3-10","ty":"multi","lv":2,"game":true,"p":"Graph 완료 시 연결을 설명하는 근거로 알맞은 것을 모두 고르세요.","o":["endpoint(보내는 쪽·받는 쪽)","message type","실제 메시지나 pose 변화","GUI 창이 떴다는 사실","소스 파일이 존재한다는 사실"],"a":[0,1,2],"h":"자료는 연결을 세 가지 근거로 설명하라고 합니다: 누가 보내고 누가 받는지, 어떤 message type인지, 그리고 실제 message 내용이나 수신 빈도가 graph 그림과 일치하는지입니다. turtlesim에서는 pose 변화도 실제 데이터 근거가 됩니다. 단순히 GUI 창이 떴다거나 노드 이름만 본 것은 이 세 근거에 들어가지 않습니다.","w":"endpoint와 type, 실제 메시지 또는 pose 변화를 근거로 설명합니다. GUI가 뜨거나 소스가 있다는 사실만으로는 전달을 증명하지 못합니다.","an":"슬라이드 p.72","src":"● 누가 보내고 누가 받는지 endpoint를 확인하고, message type이 무엇인지 \n읽습니다.\n● 실제 message 내용과 수신 빈도를 확인한 뒤 graph 그림과 일치하는지 \n설명합니다."}]},{"id":"t4","title":"통신 방식 선택·Namespace·Domain","ref":"08.ROS_v2 01·02 자습 · 슬라이드 p.55·58·97","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":true,"p":"현재 운전 mode를 한 번 묻고 짧은 응답 하나를 받는 통신 방식은?","o":["Topic","Service","Action","Parameter"],"a":1,"h":"자료는 세 통신 방식을 보내는 모양으로 구분합니다: 계속 publish하며 응답을 기다리지 않는 방식, request 한 번에 response 한 번인 방식, goal 하나에 feedback 여러 번·result·cancel이 있는 방식입니다. 운전 mode를 한 번 묻는 것은 반복 데이터도, 오래 걸리는 목표도 아닙니다. 요청과 응답이 한 쌍인 방식을 고르세요.","w":"Service는 request 한 번, response 한 번입니다. 연속 데이터는 Topic, 오래 걸리는 목표는 Action입니다.","an":"슬라이드 p.55 · 01_ros_basics 자습","src":"● Service: 현재 모드 확인처럼 요청 하나에 짧은 응답 하나가 필요합니다."},{"id":"t4-02","ty":"mc","lv":2,"game":true,"p":"목표점까지 수 초간 이동하며 진행률·결과·취소가 필요한 통신 방식은?","o":["Topic","Service","Action","Message"],"a":2,"h":"자습 표에서 이 방식은 goal을 한 번 보내고, 상대가 feedback을 여러 번, result를 한 번 돌려주며 도중에 cancel할 수 있습니다. 대표 예는 목표 위치로 이동처럼 시간이 걸리는 작업입니다. 계속 흐르는 데이터나 짧은 요청·응답과 구분되는 '장기 목표용' 방식을 떠올려 보세요.","w":"Action은 goal 한 번에 feedback 여러 번, result 한 번을 주고 cancel이 가능합니다.","an":"슬라이드 p.55 · 01_ros_basics 자습 표","src":"| Action | goal 한 번 | feedback 여러 번, result 한 번, cancel 가능 | 목표 위치로 이동 |"},{"id":"t4-03","ty":"mc","lv":2,"game":true,"p":"namespace /robot_a에서 상대 이름 status의 최종 이름은?","o":["/status","/robot_a/status","/factory/status","robot_a/status"],"a":1,"h":"Namespace는 여러 robot이 같은 짧은 이름을 써도 겹치지 않도록 앞 경로를 붙입니다. 슬래시로 시작하지 않는 상대 이름이면 <code>namespace + '/' + 이름<\/code>으로 결합되고, 결과는 항상 '/'로 시작하는 절대 이름이 됩니다. <code>/robot_a<\/code>와 <code>status<\/code>를 이 규칙으로 합쳐 보세요.","w":"상대 이름 status는 namespace /robot_a 안에서 /robot_a/status가 됩니다.","an":"02_turtlesim_tools 자습 Namespace와 remap","src":"Namespace는 여러 robot이 같은 짧은 이름을 사용해도 최종 ROS 이름이 겹치지 않게 앞 경로를 붙입니다."},{"id":"t4-04","ty":"mc","lv":3,"game":true,"p":"namespace /robot_a에서 remap 없이 절대 이름 /factory/status의 최종 이름은?","o":["/robot_a/factory/status","/robot_a/status","/factory/status","/status"],"a":2,"h":"이름 판정 규칙은 remap을 먼저 보고, 선택된 이름이 이미 슬래시로 시작하면 절대 이름이므로 그대로 두며, 상대 이름일 때만 namespace 뒤에 붙입니다. 이 문항은 remap이 없고 원래 이름이 '/'로 시작합니다. 두 번째 규칙에서 판정이 끝나는지 확인해 보세요.","w":"절대 이름은 namespace만으로 바뀌지 않아 /factory/status 그대로입니다. 상대 목표로 remap해야 /robot_a/status가 됩니다.","an":"02_turtlesim_tools 자습 · 슬라이드 p.97","src":"- /factory/status처럼 슬래시로 시작한 절대 이름은 namespace만으로 바뀌지 않습니다."},{"id":"t4-05","ty":"mc","lv":2,"game":true,"p":"ROS_DOMAIN_ID의 역할은?","o":["같은 번호끼리 발견·통신","topic 이름 접두사","노드 실행 순서 지정","QoS depth 설정"],"a":0,"h":"<code>ROS_DOMAIN_ID<\/code>는 실습 통신 그룹을 나누는 번호로, 개인 실습에서는 수기 서명 명부의 본인 번호를 씁니다. 번호가 다른 참가자는 서로를 발견하지 못하므로 A·B·C 모두에 같은 값을 적용합니다. 다만 번호가 같다고 통신이 보장되지는 않으며, topic 이름·타입·QoS도 맞아야 합니다.","w":"같은 Domain 번호의 ROS 참가자끼리 발견하고 통신합니다. namespace(이름 접두사)와 혼동하지 않습니다.","an":"슬라이드 p.58 · 01_ros_basics §3-3","src":"| `ROS_DOMAIN_ID` | 같은 번호의 ROS 참가자끼리 발견·통신하도록 구분 |"},{"id":"t4-06","ty":"ox","lv":2,"game":true,"p":"Action을 쓰면 timeout·cancel 뒤 STOP 같은 안전 기능이 자동으로 보장된다.","a":false,"h":"Action은 goal 한 번, feedback 여러 번, result 한 번, cancel 가능이라는 통신 모양을 정한 것입니다. 자료는 Goal 검사, timeout, cancel 뒤 STOP, 속도 제한을 통신 방식과 별도로 남는 제어 계약으로 분류합니다. 통신 방식을 고르는 것만으로 이런 동작이 생기는지 판단해 보세요.","w":"틀렸습니다. Action도 안전 기능 자체는 아닙니다. Goal 검사, timeout, cancel 뒤 STOP, 속도 제한은 별도 제어 계약으로 남습니다.","an":"01_ros_basics 자습","src":"Action도 안전 기능 자체는 아닙니다. Goal 검사, timeout, cancel 뒤 STOP, 속도 제한은 별도 제어 계약으로 남습니다."},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"remap은 소스 코드를 고치지 않고 실행할 때 연결 이름을 바꾼다.","a":true,"h":"Remap은 node의 source에 적힌 연결 이름을 실행할 때 <code>-r 원래이름:=목적지<\/code> 같은 인자로 바꿉니다. 예를 들어 <code>status_talker --ros-args -r /factory/status:=status<\/code>는 코드 수정 없이 발행 topic을 바꿉니다. 송신과 수신 양쪽의 remap 목적지를 함께 맞춰야 한다는 점도 기억하세요.","w":"맞습니다. remap은 실행 시 연결 이름을 바꿉니다. 송신·수신 양쪽의 remap 목적지를 함께 맞춰야 통신합니다.","an":"02_turtlesim_tools 자습 · 슬라이드 p.97","src":"Remap은 source를 수정하지 않고 실행할 때 연결 이름을 바꿉니다."},{"id":"t4-08","ty":"match","lv":1,"game":false,"p":"상황과 알맞은 통신 방식을 연결하세요.","pairs":[["30 fps 카메라 프레임","Topic"],["설정값 한 번 조회","Service"],["진행률·취소가 필요한 이동 목표","Action"]],"h":"자습은 세 질문을 순서대로 적용합니다: 데이터가 계속 생기는가, 요청 하나에 응답 하나면 충분한가, 오래 걸리는 목표이며 feedback이나 cancel이 필요한가. 30 fps 영상은 매 frame 답을 기다리지 않고, mode 조회는 짧은 질의 하나이며, 이동 목표는 진행률·결과·취소가 필요합니다. 각 상황이 어느 질문에서 '예'가 되는지 보세요.","w":"계속 생기는 데이터는 Topic, 요청 하나에 응답 하나는 Service, 진행률과 취소가 필요한 장기 목표는 Action입니다.","an":"01_ros_basics 자습 예상 결과","src":"- camera_frames → topic: frame이 계속 생기고 publisher가 매 frame의 개별 답을 기다리지 않습니다.\n- read_mode → service: 짧은 질문 하나와 응답 하나가 한 쌍입니다.\n- move_goal → action: 오래 걸리며 feedback, result, cancel이 필요합니다."},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"최종 topic 이름을 정하는 판단 순서를 맞추세요.","steps":["remap 목적지가 있으면 그 이름을 먼저 선택","선택한 이름이 '/'로 시작하는지 판정","상대 이름이면 namespace 뒤에 붙임"],"h":"자료의 TODO는 최종 이름을 정하는 세 규칙을 순서대로 적습니다: remap target이 있으면 source name 대신 그것부터 보고, 선택한 이름이 '/'로 시작하면 그대로 두며, 상대 이름이면 namespace 뒤에 붙입니다. 결과는 항상 '/'로 시작하는 절대 이름이어야 합니다. remap이 판정보다 먼저 와야 하는 이유도 생각해 보세요.","w":"remap이 있으면 목적지부터 보고, 절대 이름이면 그대로 두며, 상대 이름이면 namespace를 붙입니다.","an":"02_turtlesim_tools 자습 TODO","src":"1. Remap target이 있으면 source name 대신 target부터 봅니다.\n2. 선택된 이름이 이미 슬래시로 시작하면 절대 이름이므로 그대로 둡니다.\n3. 상대 이름이면 namespace 뒤에 붙입니다."},{"id":"t4-10","ty":"multi","lv":2,"game":true,"p":"ROS_DOMAIN_ID 운영 규칙으로 옳은 것을 모두 고르세요.","o":["개인 실습은 각자 명부 번호","공동 실습은 강사가 정한 번호","모든 터미널에 같은 값 적용","번호만 같으면 통신이 보장됨","실행 중 노드에 자동 반영됨"],"a":[0,1,2],"h":"자료는 개인 실습과 공동 실습의 번호 규칙을 구분하고, 실행 중인 모든 터미널에 같은 값을 적용하라고 합니다. 번호는 1~101 안에서 중복 없이 운영하며, 번호만 같다고 통신이 보장되지는 않습니다. 이미 실행 중인 노드는 값을 바꾼 뒤 종료 후 다시 실행해야 합니다.","w":"개인 실습은 본인 번호, 공동 실습은 지정 번호를 모든 터미널에 같게 씁니다. 번호만 같다고 통신이 보장되지 않고, 실행 중인 노드는 종료 후 다시 실행해야 합니다.","an":"슬라이드 p.58","src":"● 개인 실습은 각자 번호를 사용합니다. 같은 토픽을 주고받는 공동 실습만 \n강사가 지정한 동일 번호를 씁니다.\n● 모든 터미널에 같은 값을 적용합니다."}]},{"id":"t5","title":"ROS Image·cv_bridge·대역폭","ref":"08.ROS_v2 03 · 슬라이드 p.73–83·96","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"mono8 encoding에서 픽셀당 byte 수는?","o":["1","2","3","4"],"a":0,"h":"정답 코드는 <code>{\"mono8\": 1, \"rgb8\": 3, \"bgr8\": 3}<\/code>로 encoding마다 픽셀당 byte 수를 정합니다. 숫자 8은 채널 하나가 8bit라는 뜻이고, mono는 흑백 한 채널, rgb/bgr는 세 채널입니다. 채널 수 × 1 byte로 계산해 보세요.","w":"mono8은 픽셀당 1 byte, rgb8·bgr8은 3 byte입니다.","an":"03_camera_opencv §1","src":"`mono8`은 pixel당 1 byte, `rgb8/bgr8`은 3 byte입니다. 활성 row는 `width×channels`이고 `step`은 padding 때문에 더 클 수 있습니다. Data 길이는 `step×height`입니다."},{"id":"t5-02","ty":"mc","lv":2,"game":true,"p":"ROS Image 메시지의 step이 의미하는 것은?","o":["프레임 순번","한 행의 byte 수","채널 수","촬영 시각"],"a":1,"h":"ROS Image는 height·width·encoding·step·data와 header 정보를 함께 보냅니다. 실제 픽셀 값이 들어 있는 활성 row는 <code>width×channels<\/code> byte지만, 행 끝 padding 때문에 다음 행이 시작되는 간격은 이보다 클 수 있습니다. 이 '다음 행까지의 거리'를 나타내는 필드가 무엇을 세는지 생각해 보세요.","w":"step은 한 행의 byte 수이며 행 끝 padding 때문에 width×채널 수보다 클 수 있습니다. data 길이는 step×height입니다.","an":"슬라이드 p.74 · 03_camera_opencv §1","src":"● step은 한 행의 byte 수입니다. 행 끝 padding 때문에 width×채널 수와 항상 \n같지는 않습니다."},{"id":"t5-03","ty":"num","lv":2,"game":false,"p":"640×480 bgr8 영상의 최소 row byte(step)는 몇 byte인가요?","a":1920,"unit":"byte","h":"계산식은 최소 step = width × 채널 수(byte)입니다. bgr8은 B·G·R 세 채널이 각각 1 byte이므로 채널 수는 3이고, 높이 480은 행 하나의 길이에 영향을 주지 않습니다. padding이 없을 때 한 행이 차지하는 최소 byte 수를 이 식으로 구해 보세요.","w":"bgr8은 픽셀당 3 byte이므로 640×3=1920 byte입니다. padding이 있으면 실제 step은 더 클 수 있습니다.","an":"슬라이드 p.74 · 03_camera_opencv §4","src":"`mono8`은 pixel당 1 byte, `rgb8/bgr8`은 3 byte입니다. 활성 row는 `width×channels`이고 `step`은 padding 때문에 더 클 수 있습니다."},{"id":"t5-04","ty":"mc","lv":2,"game":true,"p":"cv_bridge가 하는 일은?","o":["카메라 장치를 연다","QoS를 설정한다","topic을 remap한다","Image를 OpenCV 배열로 변환"],"a":3,"h":"Subscriber callback이 ROS Image를 받으면, 이 도구가 encoding에 맞춰 NumPy/OpenCV에서 다룰 수 있는 형태로 바꿉니다. 자료는 이 도구가 camera를 열지 않는다고 강조하며, 변환 후 shape·dtype을 확인하라고 합니다. ROS 메시지와 OpenCV 사이에서 무엇을 무엇으로 바꾸는지 떠올려 보세요.","w":"cv_bridge는 encoding에 맞춰 ROS Image를 BGR 배열로 변환할 뿐 카메라를 열지 않습니다.","an":"슬라이드 p.76 · 03_camera_opencv §3","src":"`cv_bridge`는 message를 BGR 배열로 변환할 뿐 camera를 열지 않습니다."},{"id":"t5-05","ty":"mc","lv":3,"game":true,"p":"mono8, width=2, height=2, step=3, data=[10,20,255,30,40,255]의 활성 픽셀 평균은?","o":["95","63.3","25","35"],"a":2,"h":"계산식은 (각 행의 앞 <code>width×channels<\/code> byte 합) ÷ (활성 byte 수)입니다. mono8·width=2이면 행마다 앞 2 byte만 활성이고, step=3이므로 각 행의 세 번째 byte(255)는 padding이라 제외합니다. 행 0은 <code>data[0:2]<\/code>, 행 1은 <code>data[3:5]<\/code>를 모아 평균을 내 보세요.","w":"활성 값은 10·20·30·40이므로 평균 25입니다. padding 255를 포함하면 영상에 없는 값으로 평균이 왜곡됩니다.","an":"03_camera_opencv 따라 실행 1 · 정답 해설","src":"encoding으로 채널 수를 정하고, 한 행의 유효 bytes는 width×channels입니다. step은 다음 행 시작까지의 거리이므로 뒤에 padding이 포함될 수 있습니다."},{"id":"t5-06","ty":"ox","lv":2,"game":true,"p":"여러 처리 노드가 같은 카메라 장치를 각자 직접 여는 구조가 권장된다.","a":false,"h":"자료의 구조는 <code>/dev/video0 → v4l2_camera → /camera/image_raw<\/code>이며, OpenCV·MediaPipe·YOLO 같은 처리기는 이 Image topic을 구독합니다. 각 처리기가 장치를 직접 열면 점유 충돌과 frame 시각 불일치가 생긴다고 설명합니다. 문장이 이 권장 구조와 맞는지 비교해 보세요.","w":"틀렸습니다. 각 처리기가 장치를 직접 열면 점유 충돌과 frame 시각 불일치가 생깁니다. 한 node가 열고 여러 node가 구독합니다.","an":"슬라이드 p.73 · 03_camera_opencv §1","src":"각 처리기가 장치를 직접 열면 점유 충돌과 frame 시각 불일치가 생깁니다."},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"교재 계약에서 age가 정확히 500ms인 프레임은 허용된다.","a":true,"h":"프레임 신선도는 <code>age = now_ms - captured_ms<\/code>로 계산하며, 교재 계약은 0≤age≤500ms일 때만 허용합니다. 음수 age는 미래 시각·시계 문제로, 상한을 넘은 age는 오래된 프레임으로 보고 <code>TimeoutError<\/code>를 냅니다. 부등호에 등호가 포함되는지 확인해 보세요.","w":"맞습니다. 정확한 0과 500ms는 허용하고 501ms와 미래 프레임(음수 age)은 거부합니다.","an":"03_camera_opencv §2 TODO · 슬라이드 p.75","src":"**주의할 경계:** RGB에서도 각 채널 byte 전체 평균이지 grayscale 변환이 아닙니다. 500ms는 허용, 501ms·미래 프레임은 TimeoutError입니다."},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"영상 규격과 raw 대역폭을 연결하세요.","pairs":[["640×480 bgr8 30fps","27.648 MB/s"],["1280×720 bgr8 30fps","82.944 MB/s"],["320×240 mono8 10fps","0.768 MB/s"]],"h":"계산식은 raw 대역폭(MB/s) = width × height × channels × fps ÷ 1,000,000입니다. bgr8은 채널 3, mono8은 채널 1이며, 가로·세로를 각각 두 배로 하면 픽셀 수와 대역폭은 네 배가 됩니다. 각 규격을 식에 넣어 계산한 뒤 값을 연결해 보세요. 이 값은 header·직렬화 overhead를 뺀 픽셀 payload만의 값입니다.","w":"raw payload는 W×H×C×fps입니다. 가로·세로를 두 배로 하면 픽셀 수와 대역폭은 네 배가 됩니다. header·직렬화·네트워크 overhead는 포함하지 않습니다.","an":"03_camera_opencv 자습 예상 결과 · 슬라이드 p.96","src":"● Raw payload는 W×H×C×fps입니다. 640×480 bgr8 30fps는 27.648MB/s, \n1280×720은 82.944MB/s입니다."},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"카메라 영상이 OpenCV 처리까지 가는 경로를 맞추세요.","steps":["카메라 노드가 장치를 단독으로 연다","stamp·layout을 담아 Image 발행","구독 노드가 타입·step·신선도 검사","cv_bridge로 배열 변환","OpenCV로 밝기 계산"],"h":"자료는 카메라를 한 곳에서 열고 전달하는 흐름을 장치 단독 소유 → stamp·layout을 담은 Image 발행 → 구독 쪽의 타입·step·freshness 검사 → 배열 변환 → OpenCV 처리 순서로 그립니다. 변환 전에 검사가 먼저 와야 오래되거나 모양이 잘못된 영상이 처리에 들어가지 않습니다. 이 단계들을 데이터가 흐르는 방향으로 배열해 보세요.","w":"카메라 노드 하나가 장치를 열어 Image를 발행하고, 구독 노드가 검사한 뒤 cv_bridge로 변환해 OpenCV 처리합니다.","an":"슬라이드 p.73","src":"1. 카메라 노드\n장치 단독 소유\n2. Image 발행\nstamp·layout 포함\n3. 구독·검사\n타입·step·freshness\n4. cv_bridge\n배열로 변환\n5. OpenCV 처리\n밝기·영상 확인"},{"id":"t5-10","ty":"multi","lv":2,"game":true,"p":"<code>mean_active_pixels<\/code>가 거부해야 하는 입력을 모두 고르세요.","o":["지원하지 않는 encoding","step이 width×채널보다 작음","data 길이 ≠ step×height","age가 501ms","age가 0ms"],"a":[0,1,2,3],"h":"이 함수는 지원 encoding, 최소 step(≥ width×channels), 정확한 data 길이(= step×height)를 검사해 위반하면 <code>ValueError<\/code>를 냅니다. 시간은 age가 음수이거나 <code>max_age_ms<\/code>보다 크면 <code>TimeoutError<\/code>지만, 양 끝 0과 500은 허용합니다. 각 보기를 이 조건에 대입해 경계 안쪽인지 바깥인지 판정해 보세요.","w":"encoding·step·data 길이 위반은 ValueError, age 501ms는 TimeoutError로 거부합니다. age 0ms는 허용 범위의 양 끝이라 정상입니다.","an":"03_camera_opencv §2 · 슬라이드 p.82","src":"width·height는 양수, 지원 encoding·충분한 step·정확한 data 길이 위반은 `ValueError`입니다. captured_ms·now_ms·max_age_ms는 bool 제외 정수여야 하고 captured_ms·max_age_ms는 0 이상입니다. age가 음수 또는 max_age_ms보다 크면 `TimeoutError`; 정확한 양끝 0·max_age_ms는 허용합니다."}]},{"id":"t6","title":"제스처 controller·TTL·launch","ref":"08.ROS_v2 04 · 슬라이드 p.84–95","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"point_forward 관측의 고정 속도 (linear.x, angular.z)는?","o":["(0.8, 0.0)","(0.0, 1.2)","(1.2, 0.0)","(0.0, 0.0)"],"a":0,"h":"Recognizer의 제스처는 관측일 뿐 속도가 아니며, controller만 제스처별 고정 속도표를 가집니다. 표에서 point_left/right는 회전만, open_palm은 정지이고, point_forward는 회전 없이 앞으로만 가는 값입니다. 속도표의 <code>(linear.x, angular.z)<\/code> 순서에 맞춰 읽어 보세요.","w":"point_forward=(0.8, 0), point_left/right=(0, ±1.2), open_palm=(0, 0)입니다. 속도표는 controller만 가집니다.","an":"04_gesture_launch §1 표 · 슬라이드 p.84","src":"| gesture | linear.x | angular.z |\n|---|---:|---:|\n| point_forward | 0.8 | 0.0 |\n| point_left/right | 0.0 | +1.2/-1.2 |\n| open_palm | 0.0 | 0.0 |"},{"id":"t6-02","ty":"mc","lv":2,"game":true,"p":"<code>to_twist<\/code>에서 open_palm은 어떻게 처리되나요?","o":["거부되어 accepted=False","승인되지만 속도는 0","0.8로 전진","왼쪽으로 회전"],"a":1,"h":"<code>to_twist<\/code>는 이름이 알려진 문자열이고 0≤age≤valid_for_ms일 때만 속도표의 값을 고르며, 그 외는 <code>accepted=False<\/code>로 STOP합니다. open_palm은 속도표에 들어 있는 알려진 이름이지만 그 속도는 (0, 0)입니다. 승인 여부(accepted)와 실제 움직임(속도)을 따로 판단해 보세요.","w":"open_palm은 유효하게 승인된 정지이므로 accepted=True이고 속도는 0입니다.","an":"04_gesture_launch §2 설명할 지점","src":"**실행 후 관찰:** open_palm은 알려진 이름이지만 속도는 0입니다. 승인 여부와 움직임을 구분하세요."},{"id":"t6-03","ty":"mc","lv":2,"game":true,"p":"입력이 끊겨 callback이 불리지 않을 때 zero Twist를 발행하는 장치는?","o":["launch","cv_bridge","watchdog","QoS"],"a":2,"h":"입력이 끊기면 subscriber callback 자체가 불리지 않으므로 callback 안에서만 정지를 처리하면 마지막 속도가 남을 수 있습니다. 자료는 별도 주기로 마지막 입력 시각을 검사해, 새 입력이 없어도 시간 조건이 지나면 zero Twist를 발행하는 장치를 둡니다. TTL이 '유효 기간'이라면 이것은 그 기간을 지켜보는 감시자입니다.","w":"입력이 끊기면 callback 자체가 불리지 않을 수 있으므로 별도 주기의 watchdog이 마지막 입력 시각을 검사해 zero Twist를 발행합니다.","an":"슬라이드 p.85 · 04_gesture_launch 생각하기","src":"**설명:** 입력이 끊기면 callback 자체가 불리지 않을 수 있습니다. 별도 주기의 watchdog이 마지막 입력 시각을 검사해야 합니다."},{"id":"t6-04","ty":"mc","lv":2,"game":true,"p":"이 수업 controller가 관측 시각부터 명령을 유지하는 TTL은?","o":["0.1초","0.5초","3초","180초"],"a":1,"h":"TTL은 관측 기반 명령이 얼마나 오래 유효한지 정하는 값으로, 이 수업 controller에서는 launch 코드의 노드 파라미터 <code>command_ttl_seconds<\/code>로 고정되어 있습니다. <code>to_twist<\/code>의 기본 <code>valid_for_ms=500<\/code>도 같은 길이입니다. 밀리초 값을 초 단위로 바꿔 생각해 보세요.","w":"controller는 관측 시각부터 최대 0.5초만 명령을 유지합니다. 입력 중단 후 0.5초가 지나면 정지합니다.","an":"슬라이드 p.85 · 04_gesture_launch §3","src":"● TTL은 관측 기반 명령이 얼마나 오래 유효한지 정합니다. 이 controller는 \n관측 시각부터 최대 0.5초만 유지합니다."},{"id":"t6-05","ty":"mc","lv":3,"game":true,"p":"<code>to_twist<\/code>에서 미지의 이름이면서 오래된 입력의 reason은?","o":["accepted","stale_or_future","timeout","unknown_or_missing"],"a":3,"h":"<code>to_twist<\/code>는 이름이 알려졌는지와 시간이 신선한지를 각각 계산합니다. 미지·누락 이름과 알려진 이름의 오래된/미래 입력은 서로 다른 reason을 받는데, 두 조건이 동시에 걸리면 자료가 정한 우선순위를 따릅니다. 이름 검사와 시간 검사 중 어느 쪽이 reason을 먼저 결정하는지 확인해 보세요.","w":"미지 이름이면서 오래된 경우 reason 우선순위는 unknown_or_missing입니다. 알려진 이름의 오래된/미래 입력만 stale_or_future입니다.","an":"04_gesture_launch §2 시간 계약","src":"미지 이름이면서 오래되었어도 reason 우선순위는 `'unknown_or_missing'`입니다."},{"id":"t6-06","ty":"ox","lv":2,"game":true,"p":"launch가 오류 없이 시작되면 카메라 입력과 메시지 연결도 성공한 것이다.","a":false,"h":"<code>ros2 launch<\/code>는 어떤 실행 파일을 어떤 설정으로 함께 시작할지 적은 구성을 읽을 뿐, 이동 규칙은 제어기 코드에 있습니다. 자료는 launch가 시작된 뒤에도 노드 목록·토픽·실제 메시지를 이어서 확인해야 한다고 합니다. 프로그램 시작 성공과 데이터 흐름 성공을 구분해 보세요.","w":"틀렸습니다. launch 성공은 연결 성공이 아닙니다. 노드 목록·토픽·실제 메시지를 이어서 확인해야 합니다.","an":"04_gesture_launch §3 launch 설명","src":"launch 파일은 거북이의 이동 알고리즘이 아닙니다. 이동 규칙은 제어기 코드에 있으며 launch는 그 프로그램을 시작하고 설정값을 전달합니다. launch가 오류 없이 시작해도 카메라 입력이나 메시지 연결까지 성공했다는 뜻은 아닙니다."},{"id":"t6-07","ty":"ox","lv":2,"game":true,"p":"with_turtlesim:=false는 화면 노드만 생략하고 제스처·속도 명령 발행은 계속된다.","a":true,"h":"<code>with_turtlesim<\/code>은 launch가 노드 실행 여부를 정할 때만 쓰는 launch 인자로, <code>IfCondition<\/code>이 붙은 turtlesim 노드에만 연결되어 있습니다. 제스처 source와 controller에는 이 조건이 없습니다. false로 바꿨을 때 어떤 노드만 영향을 받는지 생각해 보세요.","w":"맞습니다. with_turtlesim은 turtlesim 노드 실행 여부만 정합니다. 제스처 발행과 속도 명령 발행은 계속됩니다.","an":"04_gesture_launch §3 · 슬라이드 p.86","src":"`with_turtlesim:=false`는 화면 노드만 생략합니다. 제스처 발행과 속도 명령 발행은 계속됩니다."},{"id":"t6-08","ty":"match","lv":2,"game":false,"p":"launch 코드 요소와 역할을 연결하세요.","pairs":[["DeclareLaunchArgument","외부 인자 이름과 기본값 선언"],["LaunchConfiguration","실행 시점의 설정값 참조"],["IfCondition","노드 시작 여부 결정"],["output=\"screen\"","프로세스 출력을 터미널에 표시"]],"h":"launch 코드 요소 표는 각 요소의 역할을 나눕니다: 외부에서 받을 설정 이름과 기본값을 선언하는 것, 실행 시점의 설정값을 참조하는 것, 그 값으로 노드를 시작할지 정하는 조건입니다. <code>output=\"screen\"<\/code>은 노드 프로세스의 출력을 어디에 보여 줄지 정합니다. 선언·참조·조건·출력 순으로 짝을 지어 보세요.","w":"인자를 선언하고, 실행 시점 값을 참조하며, 조건으로 노드 실행을 정하고, output은 출력 위치를 정합니다. GUI 창 옵션이 아닙니다.","an":"04_gesture_launch §3 코드 요소 표","src":"| `DeclareLaunchArgument(\"with_turtlesim\", default_value=\"true\")` | 외부에서 받을 설정 이름과 기본값 선언 | 이름 오타, 기본값, 설명 확인 |\n| `LaunchConfiguration(\"with_turtlesim\")` | 실행 시점의 설정값 참조 | 일반 Python 문자열이나 즉시 평가된 bool이 아님 |\n| `condition=IfCondition(with_turtlesim)` | turtlesim을 시작할지 결정 |"},{"id":"t6-09","ty":"order","lv":2,"game":false,"p":"입력 중단 실험의 관찰 순서를 맞추세요.","steps":["입력(source) 터미널만 중단","마지막 관측의 age가 TTL을 넘음","watchdog이 만료 조건 확인","제어기가 zero Twist 발행","시각·속도 기록 후 전체 종료"],"h":"이 실험은 제어기를 유지한 채 입력 source만 끊어야 하며, 제어기까지 먼저 끄면 watchdog 관찰이 달라집니다. 입력이 멈추면 마지막 관측의 age가 커지고, watchdog이 만료 조건을 확인한 뒤 제어기가 정지 명령을 냅니다. 관찰 결과를 기록한 다음에야 launch와 잔여 노드를 정리합니다.","w":"입력만 끊고 제어기는 유지해야 watchdog을 관찰할 수 있습니다. 마지막 관측·zero·재입력 시각을 함께 기록합니다.","an":"슬라이드 p.88 · 04_gesture_launch §4","src":"1. 입력만 중단\nsource 터미널 정지\n2. 마지막 관측\nage·TTL 증가\n3. watchdog\n만료 조건 확인\n4. zero Twist\n제어기가 정지 발행\n5. 관찰 확인\n시각·속도 기록\n6. 전체 종료\nlaunch·잔여 노드"},{"id":"t6-10","ty":"multi","lv":2,"game":true,"p":"기본 controller가 이동을 허용하지 않는 관측을 모두 고르세요.","o":["UNKNOWN 제스처","미래 시각의 관측","TTL이 지난 관측","age 0ms의 point_forward","confidence 없는 이동 요청"],"a":[0,1,2,4],"h":"Controller는 허용 목록·시각·점수 조건을 통과한 관측에만 고정 속도를 적용하며, 알 수 없는 제스처와 미래·오래된 관측은 STOP입니다. 기본 경로에서는 점수(confidence)가 없는 이동은 거부하고, 점수 없는 정지만 허용합니다. 각 보기가 이름·시간·점수 조건 중 어디에 걸리는지 확인해 보세요.","w":"UNKNOWN·미래·오래된 관측은 STOP입니다. 기본 controller는 점수 없는(null) 이동도 거부합니다. age 0ms의 point_forward는 정상 허용입니다.","an":"슬라이드 p.84·87 · 04_gesture_launch §3","src":"기본 controller는 점수 없는 이동은 거부하고 점수 없는 `open_palm` 정지만 허용하며 camera stamp freshness와 watchdog도 검사합니다."}]}]};

/* 순위 저장소 — 공유 순위로 바꿀 때 이 객체만 교체 */
// 순위는 같은 조건(게임 모드 + 풀이 시간)끼리만 비교한다. key = 'timeattack:10'
const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

/* ── 유틸 ──────────────────────────────── */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function say(msg){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=msg,30);}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('📋 클립보드에 복사했습니다');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'📋 클립보드에 복사했습니다':'복사하지 못했습니다. 인쇄 기능을 이용하세요.');
}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

function addWrong(id,ans){const w=S.wrong[id]||{n:0};w.n++;w.last=ans;w.at=Date.now();w.solved=false;S.wrong[id]=w;}
function markSolved(id){if(S.wrong[id]&&!S.wrong[id].solved){S.wrong[id].solved=true;S.wrong[id].at=Date.now();}}
const wrongList=solved=>Object.keys(S.wrong).filter(id=>QMAP[id]&&!!S.wrong[id].solved===solved)
  .sort((a,b)=>QTAB[a].idx-QTAB[b].idx||ALLQ.indexOf(QMAP[a])-ALLQ.indexOf(QMAP[b]));

/* ── 문항 풀이 상태(학습·재도전 공용) ───── */
let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

function cardHTML(q,n){
  const [label,color]=TYPES[q.ty];
  const g=cur.graded, a=cur.ans[q.id], fa=finalAns(q), ok=g&&isCorrect(q,fa);
  const lock=g?' disabled':'';
  let body='';
  if(q.ty==='mc'||q.ty==='multi'){
    const multi=q.ty==='multi', mine=multi?(a||[]):[a];
    body='<div class="opts">'+q.o.map((o,i)=>{
      const right=multi?q.a.includes(i):q.a===i, picked=mine.includes(i);
      const cls=g?(right?' ans':picked?' miss':''):'';
      return `<label class="opt${cls}"><span class="onum">${i+1}</span><input type="${multi?'checkbox':'radio'}" name="r-${q.id}" data-act="${multi?'tick':'pick'}" data-q="${q.id}" data-i="${i}"${picked?' checked':''}${lock}><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(q.ty==='ox'){
    body='<div class="ox">'+[true,false].map(v=>{
      const cls=g?(q.a===v?' ans':a===v?' miss':''):'';
      return `<button type="button" class="${cls.trim()}" data-act="ox" data-q="${q.id}" data-v="${v?1:0}" data-fk="${q.id}-ox${v?1:0}" aria-pressed="${a===v}" aria-label="${v?'맞다 O':'틀리다 X'}"${lock}>${v?'O':'X'}</button>`;
    }).join('')+'</div>';
  }else if(q.ty==='match'){
    const m=a||{}, sel=cur.msel[q.id], linkedBy={};
    Object.entries(m).forEach(([l,r])=>linkedBy[r]=+l);
    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${PAL[i%PAL.length]})" data-act="ml" data-q="${q.id}" data-i="${i}" data-fk="${q.id}-l${i}"${lock}><span class="tag">${LETTER[i]}</span>${esc(p[0])}</button>`;
    }).join('');
    const right=cur.shuf[q.id].map(j=>{
      const by=linkedBy[j], linked=by!=null, cls=(linked?' linked':'')+(g&&linked?(by===j?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${linked?PAL[by%PAL.length]:'--line'})" data-act="mr" data-q="${q.id}" data-j="${j}" data-fk="${q.id}-r${j}"${lock}><span class="tag">${linked?LETTER[by]:''}</span>${esc(q.pairs[j][1])}</button>`;
    }).join('');
    body=`<div class="match"><div class="mcol mleft">${left}</div><div class="mcol mright">${right}</div></div>`;
  }else if(q.ty==='order'){
    const seq=a||[], full=seq.length===q.steps.length;
    body='<div class="olist">'+(cur.shuf[q.id]||range(q.steps.length)).map(si=>{
      const pos=seq.indexOf(si), on=pos>=0;
      const cls=(on?' on':'')+(g?(pos===si?' ok':' no'):'');
      const fix=g&&pos!==si?`<span class="ofix">정답 ${si+1}</span>`:'';
      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }
  const numAns=q.ty==='mc'?`${q.a+1}번 · `:q.ty==='multi'?q.a.map(i=>i+1).join('·')+'번 · ':'';
  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${mediaHTML(q)}${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>${voiceRow(q,q.id)}`}${body}${exp}</article>`;
}
const LV_NAME=['쉬움','보통','어려움'];
function lvHTML(lv){
  lv=lv||1;
  const dots=[1,2,3].map(k=>k<=lv?`<i class="d${k}">●</i>`:'<i class="off">○</i>').join('');
  return `<span class="lv lv${lv}" title="난이도 ${LV_NAME[lv-1]}"><span class="dots" aria-hidden="true">${dots}</span><em>${LV_NAME[lv-1]}</em></span>`;
}
// 자료 발췌: 이스케이프 후 마크다운 기호만 가볍게 서식으로 (**굵게**, `코드`, 머리 #)
const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
function hintHTML(q){
  if(!q.h)return '';
  const open=cur.hints.has(q.id), label=q.ty==='num'?'Hint · 계산식':'Hint';
  // 2단계: ① 자세한 힌트(h) ② 자료 보기 — 자료 원문 발췌(src) + 위치(an)
  const sopen=cur.srcs.has(q.id);
  const src=q.src?`<div class="srcwrap"><button type="button" class="srcbtn" data-act="src" data-q="${q.id}" data-fk="${q.id}-src" aria-expanded="${sopen}" aria-controls="src-${q.id}">`+
    `<span class="caret" aria-hidden="true">${sopen?'▾':'▸'}</span>📖 자료 보기</button>`+
    (sopen?`<blockquote class="src" id="src-${q.id}"><p>${srcText(q.src)}</p>${q.an?`<cite>${esc(q.an)}</cite>`:''}</blockquote>`:'')+`</div>`:'';
  return `<div class="hintwrap"><button type="button" class="hintbtn" data-act="hint" data-q="${q.id}" data-fk="${q.id}-hint" aria-expanded="${open}" aria-controls="hint-${q.id}">`+
    `<span class="caret" aria-hidden="true">${open?'▾':'▸'}</span>${label}</button>`+
    (open?`<div class="hint" id="hint-${q.id}">${q.h}${src}</div>`:'')+`</div>`;
}
function refreshCard(q){
  const el=document.getElementById('card-'+q.id);if(!el)return;
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  el.outerHTML=cardHTML(q,el.dataset.n);
  if(fk){const f=app.querySelector(`[data-fk="${fk}"]`);if(f&&!f.disabled)f.focus();}
  updateProgress();
}
const pad2=n=>String(n).padStart(2,'0');
const fmtCnt=(n,t)=>`(${pad2(n)}/${pad2(t)})`;
// 탭별 푼 문항 수: 지금 보는 탭 → 화면 상태, 그 외 → 풀던 답(drafts) → 채점 기록
function tabAnswered(t){
  const src=cur&&cur.mode==='study'&&cur.tab===t?cur.ans:(S.drafts[t.id]||(S.tabs[t.id]&&S.tabs[t.id].answers)||{});
  return t.qs.filter(q=>isAnswered(q,src[q.id])).length;
}
function updateProgress(){
  const p=document.getElementById('pbar');if(!p||!cur)return;
  const n=cur.list.filter(answered).length, cnt=fmtCnt(n,cur.list.length);
  p.style.width=pct(n,cur.list.length)+'%';
  document.getElementById('ptxt').textContent=`${n} / ${cur.list.length} 응답`;
  const g=document.getElementById('gradeCnt');if(g)g.textContent=cnt;
  if(cur.mode==='study'){
    const c=document.getElementById('qc-'+cur.tab.id);if(c)c.textContent=cnt;
    if(!cur.graded){  // 풀던 답 저장 → 탭을 옮겨도 유지
      if(n||Object.keys(cur.ans).some(k=>{const v=cur.ans[k];return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:v!=null&&v!=='';}))
        S.drafts[cur.tab.id]=JSON.parse(JSON.stringify(cur.ans));
      else delete S.drafts[cur.tab.id];
      save();
    }
  }
}

/* ── 음성 선택 · 문제 읽기 · 그림/오디오 (qb-voice.js가 없으면 모두 숨김) ── */
const hasVoice=()=>!!(window.QBVoice&&QBVoice.supported());
const hasRead=()=>!!(window.QBVoice&&QBVoice.canSpeak());
const IC_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const IC_VOL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const VC=new Map();  // 학습 모드 문항별 음성 컨트롤러
function voiceReset(){VC.clear();if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}}
function voiceRow(q,fkp){
  const mic=hasVoice()&&['mc','multi','ox'].includes(q.ty), rd=hasRead();
  if(!mic&&!rd)return '';
  const qa=fkp?` data-q="${q.id}"`:'';
  return `<div class="vrow noprint">`+
    (mic?`<button type="button" class="vbtn vmic" data-act="vmic"${qa} data-fk="${fkp}-vmic" data-state="idle" aria-pressed="false">${IC_MIC}<span>말하기</span></button>`:'')+
    (rd?`<button type="button" class="vbtn" data-act="vread"${qa} data-fk="${fkp}-vread">${IC_VOL}<span>문제 읽기</span></button>`:'')+
    (mic?`<span class="vstat" aria-live="polite"></span><span class="vhint">말하기 어려우면 눌러서 고르세요</span>`:'')+`</div>`;
}
function mediaHTML(q){
  let h='';
  if(q.img&&q.img.src)h+=`<figure class="qfig"><img src="${esc(q.img.src)}" alt="${esc(q.img.alt)}" loading="lazy">${q.img.caption?`<figcaption>${esc(q.img.caption)}</figcaption>`:''}</figure>`;
  if(q.audio&&q.audio.src)h+=`<div class="qaud"><audio controls preload="none" src="${esc(q.audio.src)}"></audio><details><summary>대본</summary><p>${esc(q.audio.transcript)}</p></details></div>`;
  return h;
}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
// 읽어 줄 글: 문제 + 화면에 보이는 순서의 보기("1번 …")
function readText(q,n,order){
  let t=(n?`${n}번 문제. `:'')+plain(q.p)+'.';
  if(q.img&&q.img.alt)t+=' 그림 설명. '+q.img.alt+'.';
  if(q.ty==='ox')t+=' 맞으면 O, 틀리면 X.';
  else if(q.ty==='mc'||q.ty==='multi')t+=(order||range(q.o.length)).map((oi,k)=>` ${k+1}번. ${plain(q.o[oi])}.`).join('');
  return t;
}
function readAloud(text){if(QBVoice.isSpeaking())QBVoice.cancelSpeak();else QBVoice.speak(text);}
// 음성으로 고른 것 = 보기를 직접 누른 것과 같은 경로(입력 click → 기존 change/click 처리)
function voicePick(q,r){
  if(!cur||cur.graded)return;
  const card=document.getElementById('card-'+q.id);if(!card)return;
  const el=r.kind==='ox'?card.querySelector(`[data-act="ox"][data-v="${r.v==='O'?1:0}"]`):card.querySelector(`input[data-i="${r.i}"]`);
  if(el&&!el.disabled)el.click();
}
function studyVoice(q){
  let c=VC.get(q.id);if(c)return c;
  const card=()=>document.getElementById('card-'+q.id);
  c=QBVoice.attach({bind:false,button:()=>card()&&card().querySelector('.vmic'),live:()=>card()&&card().querySelector('.vstat'),
    getOptions:()=>q.ty==='ox'?2:q.o.length,getType:()=>q.ty,select:r=>voicePick(q,r)});
  VC.set(q.id,c);return c;
}

/* 학습 화면 상호작용 */
function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;

    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);

  cur.armed=false;updateProgress();
}
function onSheetInput(el){

}

function viewStudy(tid,fresh){

function sheetResultHTML(){
  const n=cur.list.length, score=cur.list.filter(q=>isCorrect(q,finalAns(q))).length, p=pct(score,n);
  const msg=p===100?'만점입니다! 🎉':p>=80?'잘했어요. 틀린 문항의 해설과 자료 위치를 확인하세요.':p>=60?'절반 이상 이해했어요. 오답노트로 다시 풀어 보세요.':'자료를 한 번 더 읽고 다시 풀어 보세요.';
  return `<div class="panel"><div class="score">${score}<small> / ${n} · ${p}%</small></div><p class="msg">${msg}</p>

function gradeSheet(){
  const miss=cur.list.map((q,i)=>answered(q)?0:i+1).filter(Boolean);
  if(miss.length&&!cur.armed){
    cur.armed=true;
    document.getElementById('warn').textContent=`미응답 ${miss.length}문항 (Q${miss.join(', Q')}). 한 번 더 누르면 미응답은 오답으로 채점합니다.`;
    return;
  }
  const firstUnlock=!gameUnlocked();
  cur.graded=true;
  const snap={};let score=0;
  cur.list.forEach(q=>{
    const a=finalAns(q);
    if(a!=null)snap[q.id]=a;
    if(isCorrect(q,a)){score++;markSolved(q.id);}
    else addWrong(q.id,answerText(q,a));
  });
  if(cur.mode==='study'){
    S.tabs[cur.tab.id]={score,total:cur.list.length,answers:snap,touched:[...cur.touched],at:Date.now()};
    delete S.drafts[cur.tab.id];
  }
  save();
  renderSheet();
  window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
  say(`채점 결과 ${score}점, ${cur.list.length}문항 중`);
  if(cur.mode==='study'&&firstUnlock)setTimeout(()=>toast('⚡ 게임 모드와 해설지가 열렸습니다!'),300);
  else if(cur.mode==='study'&&allGraded())setTimeout(()=>toast('★ 모든 탭 완료! 종합 결과를 확인하세요.'),300);
}

  const M=GAME_MODES[gameSetup.mode];

  if(scope==='wrong'){const w=new Set(wrongList(false));return shuffle(base.filter(q=>w.has(q.id))).concat(shuffle(base.filter(q=>!w.has(q.id))));}

}

      <span class="lbl">출제 범위</span>
      <div class="chips">${chip('scope','all','전체 탭')}${chip('scope','played','풀어본 탭만')}${chip('scope','wrong','오답 우선',!wrongList(false).length)}</div>
      <div class="field"><label for="gnm">닉네임</label><input id="gnm" data-act="name" maxlength="20" value="${esc(S.name)}" placeholder="순위표에 표시"></div>
      <div class="rules"><p>⏱ 모든 문항 ${gameSetup.time}초 · 순위는 같은 풀이 시간끼리 비교</p><p>🎯 정답 100점 + 남은 1초당 10점 · 🔥 3연속 ×1.2, 5연속 ×1.5</p><p>⌨ 숫자 1~5로 선택, O/X 키, 복수 선택은 Enter로 제출</p></div>
      <button class="btn primary block" type="button" data-act="gstart">시작하기</button>
    </div>
  </div>`;
}
function startGame(){
  const pool=gamePool(gameSetup.scope).slice(0,gameSetup.count);
  if(!pool.length){toast('출제할 문항이 없습니다.');return;}
  G={qs:pool,i:0,score:0,combo:0,maxCombo:0,results:[],locked:false,mode:gameSetup.mode,time:gameSetup.time};
  renderGameQ();
}
function renderGameQ(){
  voiceReset();
  const q=G.qs[G.i];
  G.locked=false;G.elapsed=0;G.last=performance.now();G.limit=G.time*1000;G.warned=false;G.pick=[];
  G.view=q.ty==='ox'?[true,false]:shuffle(range(q.o.length));
  const opts=q.ty==='ox'
    ?`<div class="gox">${G.view.map((v,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}" aria-label="${v?'O 맞다':'X 틀리다'}">${v?'O':'X'}</button>`).join('')}</div>`
    :`<div class="gopts">${G.view.map((oi,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}"${q.ty==='multi'?' aria-pressed="false"':''}><kbd>${k+1}</kbd><span>${esc(q.o[oi])}</span></button>`).join('')}</div>`;
  app.innerHTML=`
  <div class="game play">
    <div class="gtop"><div class="hud"><span>${G.i+1} / ${G.qs.length}</span><span class="combo${G.combo>=3?' hot':''}">🔥 콤보 ${G.combo}</span><span class="pts">${G.score.toLocaleString()}점</span></div>
    <div class="timer" id="timer"><div id="tbar"></div></div><div class="tleft" id="tleft"></div></div>
    <div class="gtype">${TYPES[q.ty][0]}${q.ty==='multi'?' · 모두 고른 뒤 제출':''}</div>
    <div class="gq">${q.p}</div>${mediaHTML(q)}
    <div class="gbottom">${voiceRow(q,'g')}${opts}
    <div class="gfloat" id="gfloat" aria-live="polite"></div>
    <div class="gsub"><button class="btn" type="button" data-act="gquit">그만하기</button>
      ${q.ty==='multi'?'<button class="btn primary" type="button" data-act="gsubmit">제출 (Enter)</button>':''}</div></div>
  </div>`;
  if(hasVoice())G.vc=QBVoice.attach({bind:false,button:()=>app.querySelector('.vmic'),live:()=>app.querySelector('.vstat'),
    getOptions:()=>G.view.length,getType:()=>q.ty,
    select:r=>gameAnswer(r.kind==='ox'?(r.v==='O'?0:1):r.i),submit:q.ty==='multi'?gameSubmit:null});  // 말하면 클릭과 같게 바로 선택(·제출)
  G.raf=requestAnimationFrame(tick);
}
function tick(now){
  if(!G||G.locked)return;
  G.elapsed+=now-G.last;G.last=now;
  const rem=Math.max(0,G.limit-G.elapsed), ratio=rem/G.limit;
  const shown=RM.matches?Math.ceil(rem/1000)*1000/G.limit:ratio;
  const bar=document.getElementById('tbar'), tm=document.getElementById('timer');
  if(bar){bar.style.width=(Math.min(1,shown)*100)+'%';tm.className='timer'+(ratio<.25?' lo':ratio<.5?' mid':'');
    document.getElementById('tleft').textContent=(rem/1000).toFixed(1)+'초';}
  if(!G.warned&&rem<=5000){G.warned=true;say('5초 남았습니다');}
  if(rem<=0){judge(null,true);return;}
  G.raf=requestAnimationFrame(tick);
}
function judge(ans,timeout){
  if(!G||G.locked)return;
  G.locked=true;cancelAnimationFrame(G.raf);
  const q=G.qs[G.i], used=Math.min(G.elapsed,G.limit), ok=!timeout&&isCorrect(q,ans);
  let gain=0;
  if(ok){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const mult=G.combo>=5?1.5:G.combo>=3?1.2:1;
    gain=Math.round((100+Math.floor((G.limit-used)/100))*mult);G.score+=gain;}
  else G.combo=0;
  G.results.push({id:q.id,ok,ans,timeout,ms:used,gain});
  // 판정 표시
  app.querySelectorAll('[data-act="gans"]').forEach(b=>{
    const k=+b.dataset.k, v=G.view[k];
    const right=q.ty==='ox'?q.a===v:q.ty==='mc'?q.a===v:q.a.includes(v);
    const picked=q.ty==='ox'||q.ty==='mc'?ans===v:(ans||[]).includes(v);
    if(right)b.classList.add('ans');else if(picked)b.classList.add('miss');
    b.disabled=true;
  });
  const f=document.getElementById('gfloat');
  f.className='gfloat pop '+(ok?'ok':'no');
  f.textContent=ok?`+${gain}${G.combo>=3?` 🔥×${G.combo>=5?'1.5':'1.2'}`:''}`:timeout?'⏰ 시간 초과':'✗ 오답';
  if(timeout){const tm=document.getElementById('timer');tm&&tm.classList.add('out');}
  const sb=app.querySelector('[data-act="gsubmit"]');if(sb)sb.disabled=true;
  app.querySelector('.pts').textContent=G.score.toLocaleString()+'점';
  const c=app.querySelector('.combo');c.textContent='🔥 콤보 '+G.combo;c.classList.toggle('hot',G.combo>=3);
  G.next=setTimeout(()=>{if(!G)return;G.i++;G.i<G.qs.length?renderGameQ():finishGame();},ok?900:1400);
}
function gameAnswer(k){
  if(!G||G.locked)return;
  const q=G.qs[G.i];if(k<0||k>=G.view.length)return;
  if(q.ty==='multi'){
    const v=G.view[k], i=G.pick.indexOf(v);
    i<0?G.pick.push(v):G.pick.splice(i,1);
    const b=app.querySelector(`[data-act="gans"][data-k="${k}"]`);b&&b.setAttribute('aria-pressed',i<0);
  }else judge(G.view[k],false);
}
function gameSubmit(){if(G&&!G.locked&&G.qs[G.i].ty==='multi')judge(G.pick.slice(),false);}
function stopGame(){if(G){cancelAnimationFrame(G.raf);clearTimeout(G.next);G=null;}}
function finishGame(){
  const R=G.results, correct=R.filter(r=>r.ok).length, M=GAME_MODES[G.mode];
  R.forEach(r=>{const q=QMAP[r.id];if(r.ok)markSolved(r.id);else addWrong(r.id,r.timeout?'(시간 초과)':answerText(q,r.ans));});
  const rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:(S.name||'').trim()||'익명',score:G.score,
    correct,total:R.length,rate:pct(correct,R.length),avg:Math.round(R.reduce((s,r)=>s+r.ms,0)/R.length/100)/10,combo:G.maxCombo,mode:G.mode,time:G.time,at:Date.now()};
  const rank=Leaderboard.add(rec);
  save();
  const board=Leaderboard.load(boardKey(rec)), top=board.slice(0,10), mine=board.find(r=>r.id===rec.id);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;
  const row=(r,i)=>`<tr class="${r.id===rec.id?'me':''}"><td>${medal(i)}</td><td>${esc(r.name)}</td><td class="r">${r.score.toLocaleString()}</td><td class="r">${r.rate}%</td><td class="r">${r.correct}/${r.total}</td><td class="r">${new Date(r.at).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}</td></tr>`;
  const wrong=R.filter(r=>!r.ok);
  G=null;
  app.innerHTML=`
  <div class="game">
    <div class="panel center">
      <p class="note-sm" style="margin:0">최종 점수</p>
      <div class="score xl">${rec.score.toLocaleString()}</div>
      <p class="msg">${M.title} · ${rec.time}초 — ${rank===1?'🏆 이 조건 최고 기록!':`이 조건 순위 ${rank}위`}</p>
      <div class="bignum"><div><b>${correct}/${rec.total}</b><span>정답</span></div><div><b>${rec.rate}%</b><span>정답률</span></div><div><b>${rec.avg}초</b><span>평균 응답</span></div><div><b>${rec.combo}</b><span>최고 콤보</span></div></div>
    </div>
    <div class="panel"><h2 class="ph">🏆 순위 · ${M.title.replace(/^\S+\s/,'')} ${rec.time}초 · 이 브라우저 기록</h2>
      <table class="board"><thead><tr><th>#</th><th>이름</th><th class="r">점수</th><th class="r">정답률</th><th class="r">정답</th><th class="r">날짜</th></tr></thead>
      <tbody>${top.map(row).join('')}${rank>10&&mine?row(mine,rank-1):''}</tbody></table></div>
    ${wrong.length?`<details class="more panel"><summary>틀린 문항 ${wrong.length}개 · 해설 보기 (오답노트에 저장됨)</summary>
      ${wrong.map(r=>{const q=QMAP[r.id];return `<div class="keyitem"><div class="kq">${q.p}</div><p class="mine" style="margin:4px 0">내 답: ${esc(r.timeout?'(시간 초과)':answerText(q,r.ans))}</p><p class="ka">정답: ${esc(correctText(q))}</p><p class="kw">${q.w}</p><span class="an">📖 ${esc(q.an)}</span></div>`;}).join('')}</details>`:''}
    <div class="actions"><button class="btn primary" type="button" data-act="gagain">↻ 다시 하기</button><a class="btn" href="#notes">📒 오답노트</a><a class="btn" href="#home">홈</a></div>
  </div>`;
}

/* ── 라우터 · 이벤트 ───────────────────── */
function route(){
  stopGame();voiceReset();cur=null;app.classList.remove('sheet');
  const [v,arg]=(location.hash.slice(1)||'home').split('/');
  ({study:()=>viewStudy(arg),notes:viewNotes,retry:viewRetry,key:viewKey,game:()=>arg?viewGameSetup(arg):viewGamePick(),summary:viewSummary}[v]||viewHome)();
  window.scrollTo(0,0);
}
let resetArmed=false;
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act;
  if(cur&&['ox','ml','mr','ord','hint','src'].includes(act))return onSheetClick(el);
  switch(act){
    case 'grade':gradeSheet();break;
    case 'retab':viewStudy(cur.tab.id,true);window.scrollTo(0,0);break;  // 이전 점수는 다시 채점할 때까지 유지
    case 'onlywrong':cur.onlyWrong=!cur.onlyWrong;document.getElementById('cards').classList.toggle('onlywrong',cur.onlyWrong);el.textContent=cur.onlyWrong?'전체 보기':'오답만 보기';break;
    case 'copyreport':copy(reportMD());break;
    case 'copynotes':copy(`# ${BANK.title}\n\n- 이름: ${S.name||'-'} · ${today()}\n\n`+notesMD(false));break;
    case 'clearsolved':wrongList(true).forEach(id=>delete S.wrong[id]);save();viewNotes();break;
    case 'print':window.print();break;
    case 'reset':
      if(!resetArmed){resetArmed=true;el.textContent='정말 지울까요? 한 번 더 누르세요';setTimeout(()=>{resetArmed=false;if(el.isConnected)el.textContent='이 문제은행 기록 모두 지우기';},4000);break;}
      resetArmed=false;const nm=S.name;S=blank();S.name=nm;save();toast('기록을 지웠습니다');viewHome();break;
    case 'gset':gameSetup[el.dataset.g]=['count','time'].includes(el.dataset.g)?+el.dataset.v:el.dataset.v;viewGameSetup();break;
    case 'gstart':startGame();break;
    case 'gans':gameAnswer(+el.dataset.k);break;
    case 'vmic':{const q=G?null:QMAP[el.dataset.q];const c=G?G.vc:(q&&cur?studyVoice(q):null);if(c)c.toggle();break;}
    case 'vread':{
      if(G){const q=G.qs[G.i];readAloud(readText(q,0,q.ty==='ox'?null:G.view));break;}
      const q=QMAP[el.dataset.q], card=document.getElementById('card-'+el.dataset.q);
      if(q)readAloud(readText(q,card?card.dataset.n:0));break;}
    case 'gsubmit':gameSubmit();break;
    case 'gquit':stopGame();viewGameSetup(gameSetup.mode);break;
    case 'gagain':startGame();break;
  }
});
app.addEventListener('change',e=>{const el=e.target;if(cur&&el.dataset&&(el.dataset.act==='pick'||el.dataset.act==='tick'))onSheetChange(el);});
app.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.act==='name'){S.name=el.value;save();}
  else if(cur)onSheetInput(el);
});
document.addEventListener('keydown',e=>{
  if(!G||G.locked||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.target.matches&&e.target.matches('input,textarea'))return;
  const q=G.qs[G.i], k=e.key.toLowerCase();
  if(q.ty==='ox'){if(k==='o'||k==='1'){e.preventDefault();gameAnswer(0);}else if(k==='x'||k==='2'){e.preventDefault();gameAnswer(1);}return;}
  if(/^[1-9]$/.test(k)){e.preventDefault();gameAnswer(+k-1);}
  else if(k==='enter'&&q.ty==='multi'&&!(e.target.closest&&e.target.closest('.vrow'))){e.preventDefault();gameSubmit();}
});
window.addEventListener('pagehide',()=>{if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}});
document.addEventListener('visibilitychange',()=>{if(G&&!document.hidden)G.last=performance.now();});
// 탭 바 좌우 화살표
app.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('.tabchip');if(!t||(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'))return;
  const n=e.key==='ArrowRight'?t.nextElementSibling:t.previousElementSibling;if(n){e.preventDefault();n.focus();}
});
/* 테마 */
let theme=null;try{theme=localStorage.getItem('qb:theme');}catch(e){}
const applyTheme=()=>{if(theme)document.documentElement.dataset.theme=theme;else delete document.documentElement.dataset.theme;};
applyTheme();
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  theme=dark?'light':'dark';try{localStorage.setItem('qb:theme',theme);}catch(e){}applyTheme();
});
document.title=BANK.title+' · 문제은행';
window.addEventListener('hashchange',route);
route();
})();
</script>
