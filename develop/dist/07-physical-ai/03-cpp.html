C++의 `/`도 정수 나눗셈을 합니다. 실수 결과가 필요하면 적어도 하나를 `double`로 만드세요."},{"id":"t1-04","ty":"mc","lv":1,"game":true,"p":"컴파일 오류가 여러 개 나왔을 때 가장 먼저 고칠 것은?","o":["마지막 오류","가장 위의 첫 오류","경고 메시지","CalledProcessError 줄"],"a":1,"h":"컴파일 오류가 여러 개 나와도 뒤의 오류는 앞선 한 문제 때문에 연쇄적으로 생겼을 수 있습니다. 그래서 자료는 마지막 오류가 아니라 출력의 맨 위쪽에서 처음 나타난 오류부터 고치라고 안내합니다. 원인이 되는 첫 메시지를 고치면 뒤의 오류가 함께 사라지기도 합니다.","w":"가장 위의 첫 오류부터 고칩니다. 노트북 마지막의 <code>CalledProcessError<\/code>만 읽지 말고 그 위 컴파일러의 첫 오류를 찾습니다.","an":"01_cpp_basics · 1. 소스에서 실행 파일까지","src":"컴파일 오류가 여러 개여도 먼저 **가장 위의 첫 오류** 부터 고치세요. 뒤의 오류는 첫 문제 때문에 연쇄적으로 생겼을 수 있습니다."},{"id":"t1-05","ty":"num","lv":3,"game":false,"p":"영화표 결제 계산기: 한 장 12,000원 × 3장, 회원이고 30,000원 이상이면 10% 할인합니다. 최종 결제액은 몇 원인가요?","a":32400,"unit":"원","h":"계산식은 결제 전 금액 = 12,000 × 3, 할인액 = 결제 전 금액 × 10 / 100, 최종 결제액 = 결제 전 금액 − 할인액입니다. 회원이면서 결제 전 금액이 30,000원 이상일 때만 할인이 적용되고, 할인은 할인 전 합계에 한 번만 적용됩니다. 정수 연산이므로 곱한 뒤 100으로 나눕니다.","w":"결제 전 36,000원, 할인액 3,600원, 최종 32,400원입니다. 정수 계산에서는 곱한 뒤 100으로 나눕니다.","an":"01_cpp_basics · 6. 종합 실습 — 영화표 결제 계산기","src":"- 표 한 장의 가격과 장수를 곱해 할인 전 금액을 계산합니다.\n- 회원이면서 합계가 기준 이상이면 정수 연산으로 10% 할인액을 계산합니다.\n- 할인 전 금액에서 할인액을 빼 최종 결제액을 만듭니다."},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"<code>const<\/code> 변수는 초기화한 뒤 그 이름으로 값을 바꿀 수 없다.","a":true,"h":"<code>const double temperature{23.5};<\/code>를 읽으면 <code>double<\/code>은 타입, <code>temperature<\/code>는 이름, <code>{23.5}<\/code>는 최초 값입니다. 맨 앞의 <code>const<\/code>는 초기화 뒤 이 이름을 통해 값을 바꾸지 않겠다는 약속입니다. 이 약속을 어기는 대입이 가능한지 생각해 보세요.","w":"맞습니다. <code>const<\/code>는 초기화 뒤 이 이름을 통해 값을 바꾸지 않겠다는 약속입니다.","an":"01_cpp_basics · C++ 한 줄을 읽는 순서","src":"4. `const`: 초기화 뒤 이 이름을 통해 값을 바꾸지 않겠다는 약속입니다."},{"id":"t1-07","ty":"ox","lv":2,"game":true,"p":"컴파일이 성공하고 종료 코드가 0이면 계산 결과도 정답이다.","a":false,"h":"종료 코드 0은 프로그램이 정상적으로 끝났다는 뜻일 뿐입니다. 자료는 프로그램 출력까지 보였더라도 계산이 맞는지는 별도 문제이므로 기대값과 비교해야 한다고 강조합니다. 빌드 성공은 시작점이고 실행 결과까지 맞아야 완료입니다.","w":"틀렸습니다. 종료 코드 0은 정상 종료일 뿐 계산이 옳다는 보장이 아닙니다. 기대 출력과 비교해야 합니다.","an":"01_cpp_basics · 출력과 컴파일 로그를 구분하기","src":"프로그램 출력까지 보였더라도 계산이 맞는지는 별도 문제이므로 기대값과 비교해야 합니다. 종료 코드 0은 프로그램이 정상적으로 끝났다는 뜻이며, 계산 결과가 수학적으로 옳다는 보장은 아닙니다."},{"id":"t1-08","ty":"match","lv":1,"game":false,"p":"C++ 타입과 값의 예를 연결하세요.","pairs":[["int","42"],["double","3.14"],["bool","true"],["char","'A'"],["std::string","\"C++\""]],"h":"C++ 변수는 선언할 때 타입이 정해지며, 정수는 <code>int<\/code>, 소수가 있는 실수는 <code>double<\/code>, 참·거짓은 <code>bool<\/code>입니다. 문자 하나는 작은따옴표로, 여러 글자의 문자열은 큰따옴표로 쓰고 문자열 타입은 <code>&lt;string&gt;<\/code>이 필요합니다. 따옴표 모양과 값의 종류를 보고 짝을 지어 보세요.","w":"int는 정수, double은 실수, bool은 참·거짓, char는 문자 하나, std::string은 문자열(<code>&lt;string&gt;<\/code> 필요)입니다.","an":"01_cpp_basics · 2. 변수, 타입, 초기화","src":"Python 변수는 실행 중 값에 따라 타입이 정해지지만, C++ 변수는 선언할 때 타입이 정해집니다.\n\n| C++ 타입 | 예 | 의미 |\n|---|---|---|\n| `int` | `42` | 정수 |\n| `double` | `3.14` | 실수 |\n| `bool` | `true` | 참·거짓 |\n| `char` | `'A'` | 문자 하나 |\n| `std::string` | `\"C++\"` | 문자열 (`<string>` 필요) |"},{"id":"t1-09","ty":"order","lv":2,"game":false,"p":"C++ 빌드가 개념적으로 거치는 순서대로 정렬하세요.","steps":["전처리 (#include·매크로 펼치기)","컴파일 (목적 파일 생성)","링크 (심볼 연결)","실행 파일 완성"],"h":"자료는 빌드를 세 단계로 설명합니다. 먼저 <code>#include<\/code>와 매크로를 펼쳐 번역 단위를 만들고, 각 번역 단위를 목적 파일로 바꾼 뒤, 목적 파일과 라이브러리의 심볼을 연결해 실행 파일을 만듭니다. 입력을 펼치는 일 → 번역 → 연결의 흐름으로 정렬해 보세요.","w":"전처리 → 컴파일 → 링크 순서로 실행 파일이 만들어집니다.","an":"01_cpp_basics · 번역 단계와 오류의 위치","src":"C++ 빌드는 한 번에 일어나는 것처럼 보여도 개념적으로 **전처리 → 컴파일 → 링크** 를 거칩니다. 전처리는 `#include`와 매크로를 펼쳐 번역 단위(translation unit)를 만들고, 컴파일은 각 번역 단위를 목적 파일로 바꾸며, 링크는 목적 파일과 라이브러리의 심볼을 연결해 실행 파일을 만듭니다."},{"id":"t1-10","ty":"multi","lv":2,"game":true,"p":"이 과정의 <code>g++<\/code> 명령에서 실수를 조기에 찾는 경고 옵션을 <b>모두<\/b> 고르세요.","o":["-Wall","-Wextra","-Wpedantic","-o","-std=c++17"],"a":[0,1,2],"h":"과정의 <code>g++<\/code> 명령에서 <code>-std=c++17<\/code>은 언어 규칙 선택, <code>-o app<\/code>은 출력 파일 이름입니다. 실수를 조기에 찾는 경고는 'Warning'의 머리글자 W로 시작하는 옵션 세 개로 켭니다. 최적화(<code>-O<\/code>)나 디버그 정보(<code>-g<\/code>)는 경고 옵션이 아닙니다.","w":"<code>-Wall -Wextra -Wpedantic<\/code>이 경고 옵션입니다. <code>-o<\/code>는 출력 이름, <code>-std=c++17<\/code>은 언어 버전입니다.","an":"01_cpp_basics · 1. 소스에서 실행 파일까지","src":"- `-std=c++17`: 이번 과정의 언어 규칙 선택\n- `-Wall -Wextra -Wpedantic`: 실수를 조기에 찾는 경고"}]},{"id":"t2","title":"조건문·반복문과 결제 계산","ref":"01_cpp_basics §3–6","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"Python의 <code>and<\/code>에 대응하는 C++ 논리 연산자는?","o":["||","&&","!","&"],"a":1,"h":"C++의 비교 연산자는 <code>== != &lt; &lt;= &gt; &gt;=<\/code>, 논리 연산자는 기호 세 가지입니다. 자료는 이 논리 연산자가 Python의 <code>and / or / not<\/code>과 같은 역할을 한다고 설명합니다. 두 조건이 '모두' 참일 때를 나타내는 두 글자 기호를 고르세요.","w":"<code>&amp;&amp;<\/code>는 and, <code>||<\/code>는 or, <code>!<\/code>는 not입니다.","an":"01_cpp_basics · 3. 조건문","src":"비교 연산자는 `== != < <= > >=`, 논리 연산자는 `&& || !`입니다. Python의 `and / or / not`과 역할이 같습니다."},{"id":"t2-02","ty":"mc","lv":2,"game":true,"p":"성적처럼 경계가 있는 <code>if–else if<\/code> 사슬은 어떤 순서로 검사해야 하나요?","o":["높은 기준부터","낮은 기준부터","아무 순서나","같은 기준만"],"a":0,"h":"넓은 조건을 먼저 두면 좁은 조건이 실행될 기회를 잃습니다. 예를 들어 84점이 먼저 <code>&gt;= 60<\/code> 분기를 만나면 거기서 사슬이 끝나 B 등급을 받지 못합니다. <code>if<\/code>–<code>else if<\/code> 사슬은 한 분기만 실행된다는 점을 기준 순서와 연결해 보세요.","w":"넓은 조건을 먼저 두면 좁은 조건이 실행될 기회를 잃으므로 높은 값부터 검사합니다. 하나의 사슬에서는 정확히 한 분기만 실행됩니다.","an":"01_cpp_basics · 3. 조건문 · 예제 코드 해설 1","src":"넓은 조건을 먼저 두면 좁은 조건이 실행될 기회를 잃으므로 성적처럼 경계가 있는 조건은 높은 값부터 검사합니다."},{"id":"t2-03","ty":"mc","lv":2,"game":true,"p":"countdown 예제에서 <code>while<\/code> 반복을 끝내는 핵심은?","o":["조건 값을 바꾸는 --countdown","std::cout 출력","중괄호 생략","세미콜론"],"a":0,"h":"<code>countdown<\/code>은 3에서 시작해 조건 <code>countdown &gt; 0<\/code>을 확인하고 값을 출력한 뒤 하나 줄어듭니다. 상태가 3 → 2 → 1 → 0으로 바뀌어야 조건이 거짓이 되어 반복이 끝납니다. <code>std::cout<\/code>은 상태를 바꾸지 않으므로, 조건 값을 바꾸는 문장을 찾아보세요.","w":"<code>--countdown<\/code>이 상태를 줄여 조건을 거짓으로 만듭니다. 빠뜨리면 무한 반복이 됩니다. <code>std::cout<\/code>은 상태를 바꾸지 않습니다.","an":"01_cpp_basics · 예제 코드 해설 2","src":"> **흔한 오해:** `std::cout`은 반복 상태를 바꾸지 않습니다. `while`을 끝내는 핵심은 `--countdown`입니다. 이를 빠뜨리면 조건이 계속 참인 무한 반복이 됩니다."},{"id":"t2-04","ty":"mc","lv":3,"game":true,"p":"정수 계산에서 <code>discount_percent / 100<\/code>(=10/100)을 먼저 계산하면?","o":["정확한 할인액","컴파일 오류","실수로 자동 변환","0이 되어 할인 0"],"a":3,"h":"정수끼리 나누면 소수부가 버려지므로 10 / 100은 1보다 작은 값의 정수 부분만 남습니다. 이 값을 subtotal에 곱하면 할인액이 어떻게 되는지 생각해 보세요. 자료는 그래서 곱한 뒤 나누는 순서를 쓰라고 안내합니다.","w":"10/100은 정수 나눗셈으로 0이 되므로 할인액도 0입니다. 곱한 뒤 나눕니다: <code>subtotal * discount_percent / 100<\/code>.","an":"01_cpp_basics · 정답 해설","src":"조건이 거짓이면 초기값 discount=0이 유지됩니다. 정수 계산에서 `discount_percent / 100`을 먼저 계산하면 10/100=0이 되므로 곱한 뒤 나눕니다."},{"id":"t2-05","ty":"mc","lv":2,"game":true,"p":"1부터 10까지 반복하며 짝수만 더하는 예제의 첫 출력 합계는?","o":["25","30","55","20"],"a":1,"h":"<code>for (int number{1}; number &lt;= limit; ++number)<\/code>는 1부터 10까지(10 포함) 본문을 실행합니다. <code>number % 2<\/code>가 0인 회차에서만 <code>even_sum += number<\/code>가 실행되므로, 1~10 사이 짝수를 차례로 누적한 값이 첫 출력입니다. 0에서 시작해 누적 값이 어떻게 변하는지 손으로 추적해 보세요.","w":"<code>number % 2 == 0<\/code>인 2, 4, 6, 8, 10만 더해 누적값이 0→2→6→12→20→30이 됩니다.","an":"01_cpp_basics · 예제 코드 해설 2","src":"- `for (int number{1}; number <= limit; ++number)`는 `number`를 1로 만든 뒤, `number <= 10`인 동안 본문을 실행하고, 매 회 끝에 `number`를 1 증가시킵니다. 따라서 10도 포함됩니다.\n- `number % 2`는 2로 나눈 나머지입니다. 나머지가 0인 2, 4, 6, 8, 10에서만 `even_sum += number`가 실행됩니다. 누적 값은 `0 → 2 → 6 → 12 → 20 → 30`으로 변하므로 첫 출력의 합은 30입니다."},{"id":"t2-06","ty":"ox","lv":1,"game":true,"p":"<code>break<\/code>는 현재 회차만 건너뛰고 반복을 계속한다.","a":false,"h":"자료는 반복을 제어하는 두 키워드의 역할을 구분합니다. 하나는 반복 전체를 끝내고, 다른 하나는 현재 회차만 건너뛰고 다음 회차로 넘어갑니다. <code>break<\/code>가 둘 중 어느 쪽인지 떠올려 보세요.","w":"틀렸습니다. <code>break<\/code>는 반복 전체를 끝내고, <code>continue<\/code>가 현재 회차만 건너뜁니다.","an":"01_cpp_basics · 4. 반복문","src":"`break`는 반복 전체를 끝내고, `continue`는 현재 회차만 건너뜁니다. `while`에서는 조건에 쓰는 값이 반드시 종료 방향으로 바뀌는지 확인하세요."},{"id":"t2-07","ty":"ox","lv":1,"game":true,"p":"범위 기반 <code>for<\/code>는 컨테이너의 값을 순서대로 읽을 때 잘 맞는다.","a":true,"h":"자료는 상황별로 맞는 반복문을 나눕니다. 횟수와 인덱스가 중요하면 전통적인 <code>for<\/code>, 종료 시점을 조건으로 표현하면 <code>while<\/code>을 씁니다. <code>for (const int score : scores)<\/code>처럼 컨테이너의 원소를 하나씩 꺼내는 형태가 어떤 상황에 쓰이는지 생각해 보세요.","w":"맞습니다. 횟수·인덱스가 중요하면 전통적인 for, 컨테이너 값을 순서대로 읽으면 범위 기반 for가 잘 맞습니다.","an":"01_cpp_basics · 4. 반복문","src":"횟수와 인덱스가 중요하면 전통적인 `for`, 컨테이너의 값을 순서대로 읽으면 범위 기반 `for`, 종료 시점을 조건으로 표현하면 `while`이 잘 맞습니다."},{"id":"t2-08","ty":"match","lv":2,"game":false,"p":"상황에 알맞은 반복문을 연결하세요.","pairs":[["횟수와 인덱스가 중요","전통적인 for"],["컨테이너 값을 순서대로 읽기","범위 기반 for"],["종료 시점을 조건으로 표현","while"]],"h":"자료는 반복문을 세 가지 상황으로 나눕니다. 초기식·조건식·증감식으로 인덱스를 직접 다루는 형태, <code>for (const int score : scores)<\/code>처럼 원소를 꺼내는 형태, 조건만 적고 상태가 종료 방향으로 바뀌는지 확인하는 형태입니다. 인덱스·컨테이너·조건이라는 키워드를 각 문법과 짝지어 보세요.","w":"횟수·인덱스는 전통적인 for, 컨테이너 순회는 범위 기반 for, 조건으로 끝나는 반복은 while입니다.","an":"01_cpp_basics · 4. 반복문","src":"횟수와 인덱스가 중요하면 전통적인 `for`, 컨테이너의 값을 순서대로 읽으면 범위 기반 `for`, 종료 시점을 조건으로 표현하면 `while`이 잘 맞습니다."},{"id":"t2-09","ty":"order","lv":2,"game":false,"p":"영화표 결제 계산기의 데이터 흐름을 순서대로 정렬하세요.","steps":["subtotal(결제 전 금액) 계산","조건이 참이면 discount 계산","final_price 계산","세 결과 출력"],"h":"<code>main<\/code>의 계산 결과는 아래 방향으로만 흐릅니다. 가격과 장수로 할인 전 금액을 먼저 만들고, 회원 여부·기준과 비교한 조건이 참일 때만 할인액을 정한 뒤, 두 값으로 최종 금액을 한 번 정하고 세 값을 출력합니다. 앞 단계의 값이 다음 단계의 입력이 되는 순서를 따라가 보세요.","w":"할인 전 금액 → 조건부 할인액 → 최종 금액 → 출력 순서입니다. discount는 조건문 밖에서 0으로 초기화되어 조건이 거짓이면 0이 유지됩니다.","an":"01_cpp_basics · 실습 목적과 TODO 구현 명세","src":"의사코드로는 '할인 전 금액 계산 → 조건이 참이면 할인액 계산 → 두 값으로 최종 금액 계산 → 세 결과 출력' 순서입니다."},{"id":"t2-10","ty":"multi","lv":2,"game":true,"p":"영화표 계산기의 완료 기준을 <b>모두<\/b> 고르세요.","o":["결제 전 36000원","할인액 3600원","최종 결제액 32400원","할인을 두 번 적용","경고는 무시해도 됨"],"a":[0,1,2],"h":"완료 기준은 할인 전 금액 12,000 × 3, 회원이고 30,000원 이상일 때의 10% 할인액, 그리고 할인 전 금액에서 할인액을 뺀 최종 금액을 확인하는 것입니다. 할인은 합계에 한 번만 적용되고 경고 없이 빌드되어야 합니다. 각 항목을 직접 계산해 맞는 값을 고르세요.","w":"36000 / 3600 / 32400 출력이 기준입니다. 할인은 합계에 한 번만 적용하고 <code>-Wall -Wextra -Wpedantic<\/code> 경고도 없어야 합니다.","an":"01_cpp_basics · 완료 기준","src":"1. 할인 전 금액은 `12,000 × 3 = 36,000원`이다.\n2. 회원이고 30,000원 이상이므로 할인액은 `3,600원`이다.\n3. 최종 금액은 `36,000 - 3,600 = 32,400원`이다.\n4. 할인은 할인 전 합계에 한 번만 적용된다.\n5. `-Wall -Wextra -Wpedantic` 경고가 없다.\n\n출력은 `결제 전: 36000원`, `할인액: 3600원`, `최종 결제액: 32400원`이어야 합니다."}]},{"id":"t3","title":"함수와 값·참조 전달","ref":"02_functions_classes §1–2","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"반환할 값이 없는 함수의 반환 타입은?","o":["int","auto","void","bool"],"a":2,"h":"함수 머리의 맨 앞에는 반환 타입이 오고, <code>return<\/code>은 호출한 곳으로 결과를 전달합니다. 자료는 돌려줄 값이 없는 함수에는 '비어 있음'을 뜻하는 특별한 반환 타입을 쓴다고 설명합니다. <code>add_bonus<\/code>처럼 상태 변화로 결과를 전달하는 함수의 반환 타입을 떠올려 보세요.","w":"반환값이 없으면 <code>void<\/code>를 씁니다.","an":"02_functions_classes · 1. 함수: 입력 → 처리 → 반환","src":"- `int`(맨 앞): 반환 타입\n- `rectangle_area`: 함수 이름\n- `(int width, int height)`: 매개변수 목록\n- `return`: 호출한 곳으로 결과 전달\n\n반환할 값이 없으면 `void`를 씁니다."},{"id":"t3-02","ty":"mc","lv":2,"game":true,"p":"함수 오버로딩이 허용되려면 무엇이 달라야 하나요?","o":["반환 타입만","매개변수 개수 또는 타입","함수 이름","주석"],"a":1,"h":"컴파일러는 호출 지점에서 이름과 인자를 보고 어떤 함수를 부를지 정해야 합니다. 자료의 예는 <code>area(double radius)<\/code>와 <code>area(double width, double height)<\/code>처럼 같은 이름이지만 매개변수가 다릅니다. 반환 타입만 다른 두 함수는 호출 시 구분할 수 없어 허용되지 않습니다.","w":"오버로딩은 매개변수의 개수 또는 타입이 달라야 합니다. 반환 타입만 다르면 호출 시 구분할 수 없어 허용되지 않습니다.","an":"02_functions_classes · 선언 순서와 오버로딩","src":"함수 오버로딩은 매개변수의 **개수 또는 타입** 이 달라야 합니다. 반환 타입만 다르게 한 두 함수는 호출 시 구분할 수 없어 허용되지 않습니다."},{"id":"t3-03","ty":"mc","lv":2,"game":true,"p":"큰 <code>std::string<\/code>을 복사 없이 읽기만 할 때 알맞은 매개변수는?","o":["std::string","std::string&","const std::string&","std::string*"],"a":2,"h":"값 전달은 복사본을, <code>T&amp;<\/code>는 원본의 별칭을 넘겨 호출자의 값을 바꿀 수 있게 합니다. 자료는 큰 객체를 읽기만 할 때 '복사 비용은 피하지만 이 함수는 값을 바꾸지 않는다'는 계약을 쓰라고 합니다. 참조 기호와 <code>const<\/code>를 함께 쓴 형태를 찾아보세요.","w":"<code>const T&amp;<\/code>는 '복사 비용은 피하지만 값을 바꾸지 않는다'는 계약입니다.","an":"02_functions_classes · 2. 값, 참조, const 참조 전달","src":"| `void f(const std::string& text)` | 읽기 전용 별칭 | 큰 객체를 복사하지 않고 읽기 |\n\n`const T&`는 '복사 비용은 피하지만 이 함수는 값을 바꾸지 않는다'는 계약입니다. 참조 매개변수 `T&`로 출력값을 여러 개 만들 수도 있지만, 처음에는 가능하면 명확한 반환값을 우선하세요."},{"id":"t3-04","ty":"mc","lv":2,"game":true,"p":"<code>count{3}<\/code>에 <code>add_one_copy(count)<\/code>, <code>add_one_ref(count)<\/code>를 차례로 호출하면 마지막 count는?","o":["4","3","5","6"],"a":0,"h":"<code>add_one_copy<\/code>는 값으로 받으므로 복사본만 증가하고 원본 <code>count<\/code>는 그대로입니다. <code>add_one_ref<\/code>는 <code>int&amp;<\/code>로 원본의 별칭을 받아 원본을 1 증가시킵니다. 3에서 시작해 원본이 실제로 몇 번 바뀌는지 세어 보세요.","w":"첫 호출은 복사본만 4가 되고, 두 번째 참조 호출이 원본을 1 늘려 4가 됩니다. 시그니처의 <code>&amp;<\/code> 하나가 상태 변경 여부를 결정합니다.","an":"02_functions_classes · 45초 예측","src":"마지막 `count`는 얼마일까요? 첫 호출은 복사본만 4가 되고, 두 번째 호출은 원본의 별칭을 바꿉니다. 함수 시그니처의 `&` 하나가 호출자의 상태 변경 여부를 결정합니다."},{"id":"t3-05","ty":"mc","lv":2,"game":true,"p":"<code>add_bonus(int&amp; score, int bonus)<\/code>의 <code>int&amp;<\/code>를 <code>int<\/code>로 바꾸면?","o":["컴파일 오류","main의 score가 바뀌지 않음","score가 두 배가 됨","런타임 오류"],"a":1,"h":"<code>int&amp;<\/code> 참조 매개변수는 호출자가 넘긴 <code>score<\/code>의 별명이라 <code>score += bonus<\/code>가 원본을 75 → 80으로 바꿉니다. 이를 <code>int<\/code>로 바꿔도 컴파일 오류는 나지 않고, 함수 안의 복사본만 바뀝니다. 그때 <code>main()<\/code>의 원본 값이 어떻게 되는지 생각해 보세요.","w":"컴파일 오류가 아니라 복사본만 바뀌고 <code>main()<\/code>의 score는 그대로 남습니다. 호출자 상태를 바꿔야 하는지에 따라 값/참조를 고릅니다.","an":"02_functions_classes · 예제 코드 해설 1","src":"> **흔한 오해:** `add_bonus`에서 `int&`를 `int`로 바꾸면 코드가 컴파일되지 않는 것이 아니라 복사본만 80이 되고 `main()`의 `score`는 75로 남습니다."},{"id":"t3-06","ty":"ox","lv":1,"game":true,"p":"<code>return total;<\/code>과 <code>std::cout &lt;&lt; total;<\/code>은 같은 역할을 한다.","a":false,"h":"<code>return total;<\/code>은 호출자에게 값을 돌려주고, <code>std::cout &lt;&lt; total;<\/code>은 화면에 글자를 남깁니다. 출력만 한 함수의 결과는 다른 계산에 바로 사용할 수 없습니다. 두 문장이 값을 보내는 곳이 같은지 비교해 보세요.","w":"틀렸습니다. <code>return<\/code>은 호출자에게 값을 돌려주고 <code>std::cout<\/code>은 화면에 글자를 남깁니다. 출력만 한 결과는 다른 계산에 바로 쓸 수 없습니다.","an":"02_functions_classes · 함수 호출과 전달 방식을 상자로 그리기","src":"함수의 반환값과 출력도 구분하세요. `return total;`은 호출자에게 값을 돌려주고, `std::cout << total;`은 화면에 글자를 남깁니다. 출력만 한 함수의 결과를 다른 계산에 바로 사용할 수는 없습니다."},{"id":"t3-07","ty":"ox","lv":2,"game":true,"p":"함수가 지역 변수의 참조나 포인터를 반환하면 위험하다.","a":true,"h":"지역 변수는 함수가 끝나면 수명이 끝나 사라집니다. 그 변수를 가리키는 참조나 포인터를 함수 밖으로 돌려주면, 대상이 없는 dangling 상태가 됩니다. 참조도 대상보다 오래 살 수 없다는 점을 떠올려 보세요.","w":"맞습니다. 함수 종료 후 대상이 사라져 dangling 참조·포인터가 됩니다.","an":"02_functions_classes · 자주 하는 실수","src":"- 함수가 지역 변수의 참조나 포인터를 반환하면 함수 종료 후 대상이 사라져 위험합니다."},{"id":"t3-08","ty":"match","lv":2,"game":false,"p":"매개변수 형태와 의미를 연결하세요.","pairs":[["void f(int value)","복사본 전달"],["void f(int& value)","원본의 별칭(변경 가능)"],["void f(const std::string& text)","읽기 전용 별칭"]],"h":"매개변수에 <code>&amp;<\/code>가 없으면 복사본이 전달되어 원본은 바뀌지 않습니다. <code>&amp;<\/code>가 있으면 원본과 연결된 별칭이 되어 호출자의 값을 바꿀 수 있고, 여기에 <code>const<\/code>까지 붙으면 복사 없이 읽기만 할 수 있습니다. <code>&amp;<\/code>와 <code>const<\/code>의 유무로 짝을 지어 보세요.","w":"값 전달은 복사, <code>T&amp;<\/code>는 원본 별칭, <code>const T&amp;<\/code>는 읽기 전용 별칭입니다.","an":"02_functions_classes · 2. 값, 참조, const 참조 전달","src":"| 형태 | 의미 | 알맞은 상황 |\n|---|---|---|\n| `void f(int value)` | 복사본 전달 | 작고 복사가 싼 값, 원본 변경 불필요 |\n| `void f(int& value)` | 원본의 별칭 전달 | 호출자의 값을 바꿔야 함 |\n| `void f(const std::string& text)` | 읽기 전용 별칭 | 큰 객체를 복사하지 않고 읽기 |"},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"예제 <code>01_functions.cpp<\/code>의 <code>main()<\/code> 값 흐름을 순서대로 정렬하세요.","steps":["add(40, 35)가 75를 반환","add_bonus로 score가 80으로 변경","make_result가 결과 문자열 생성","std::cout으로 출력"],"h":"예제의 <code>main()<\/code>은 먼저 두 정수를 더한 반환값으로 <code>score<\/code>를 초기화합니다. 이어서 참조 매개변수 함수가 원본 점수를 바꾸고, 그 점수로 결과 문자열을 만든 뒤 화면에 출력합니다. 계산 → 원본 변경 → 문자열 생성 → 출력의 흐름으로 정렬해 보세요.","w":"add가 75를 반환하고, 참조 매개변수의 add_bonus가 원본을 80으로 바꾼 뒤, make_result가 문자열을 만들어 출력합니다.","an":"02_functions_classes · 예제 코드 해설 1","src":"1. `add(40, 35)`가 `75`를 반환하고, 그 값으로 변경 가능한 지역 변수 `score`가 초기화됩니다.\n2. `add_bonus(score, 5)`의 참조 매개변수가 같은 `score`를 가리키므로 원본 상태가 `75 → 80`으로 바뀝니다.\n3. `make_result(\"민지\", score)`가 `민지: 80점`이라는 새 문자열을 반환하고 `std::cout`이 이를 출력합니다."},{"id":"t3-10","ty":"multi","lv":1,"game":true,"p":"<code>int rectangle_area(int width, int height)<\/code>에 대한 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["앞의 int는 반환 타입","rectangle_area는 함수 이름","괄호 안은 매개변수 목록","return은 화면 출력","함수 정의 끝에 반드시 ;"],"a":[0,1,2],"h":"자료는 함수 머리를 네 부분으로 읽습니다. 맨 앞의 타입은 결과로 돌려줄 값의 종류, 그다음은 호출할 때 쓰는 이름, 괄호 안은 입력으로 받는 값들의 목록이며 본문의 <code>return<\/code>은 결과를 호출한 곳으로 전달합니다. 각 부분의 역할을 보기와 맞춰 보세요.","w":"맨 앞 int는 반환 타입, 그다음 함수 이름, 괄호 안은 매개변수 목록입니다. <code>return<\/code>은 호출한 곳으로 결과를 전달합니다.","an":"02_functions_classes · 1. 함수: 입력 → 처리 → 반환","src":"- `int`(맨 앞): 반환 타입\n- `rectangle_area`: 함수 이름\n- `(int width, int height)`: 매개변수 목록\n- `return`: 호출한 곳으로 결과 전달"}]},{"id":"t4","title":"구조체·클래스와 불변식","ref":"02_functions_classes §3–6","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":false,"p":"<code>struct<\/code>와 <code>class<\/code>의 기본 접근 권한은?","o":["둘 다 public","struct public · class private","struct private · class public","둘 다 private"],"a":1,"h":"C++에서 <code>struct<\/code>와 <code>class<\/code>는 거의 같은 기능을 가지며 기본 접근 권한만 다릅니다. 자료는 데이터 묶음은 <code>struct<\/code>, 규칙과 불변식을 지키는 객체는 <code>class<\/code>로 시작하라고 안내합니다. 필드를 그대로 열어 두는 쪽과 감춰 두는 쪽이 각각 어느 키워드인지 생각해 보세요.","w":"기본 접근 권한만 다릅니다. struct는 public, class는 private입니다.","an":"02_functions_classes · 4. 클래스: 유효한 상태를 지키는 경계","src":"C++에서 `struct`와 `class`는 거의 같은 기능을 가집니다. 기본 접근 권한만 `struct`는 `public`, `class`는 `private`입니다. 데이터 묶음은 `struct`, 규칙과 불변식(invariant)을 지키는 객체는 `class`로 시작하면 이해하기 쉽습니다."},{"id":"t4-02","ty":"mc","lv":2,"game":true,"p":"멤버 함수 뒤의 <code>const<\/code>(예: <code>int balance() const<\/code>)의 의미는?","o":["반환값이 상수","객체 상태를 바꾸지 않음","매개변수가 상수","함수 이름 고정"],"a":1,"h":"멤버 함수 뒤의 <code>const<\/code>는 반환값이 상수라는 뜻이 아닙니다. 그 함수를 호출해도 객체의 멤버(상태)가 바뀌지 않는다는 약속이라서, 조회 함수와 변경 함수를 구분해 읽을 수 있게 해 줍니다. <code>balance()<\/code>가 잔액을 읽기만 하는 함수라는 점과 연결해 보세요.","w":"뒤쪽 const는 이 멤버 함수가 객체 상태를 바꾸지 않는다는 뜻입니다. 빠뜨리면 const 객체·참조로 호출할 수 없습니다.","an":"02_functions_classes · 객체를 '상태 + 허용된 행동'으로 보기","src":"멤버 함수 뒤의 `const`는 반환값이 상수라는 뜻이 아니라, 그 함수를 통해 객체 상태를 바꾸지 않겠다는 뜻입니다. 따라서 조회 함수와 변경 함수를 구분해서 읽을 수 있습니다."},{"id":"t4-03","ty":"mc","lv":2,"game":true,"p":"인자 하나짜리 생성자에 <code>explicit<\/code>을 자주 붙이는 이유는?","o":["암시적 변환 방지","속도 향상","상속 허용","메모리 절약"],"a":0,"h":"인자 하나짜리 생성자가 있으면 컴파일러가 그 인자 타입의 값을 객체로 자동 변환하는 데 쓸 수 있습니다. 예를 들어 <code>int<\/code> 하나가 의도치 않게 <code>BankAccount<\/code>로 바뀌는 일이 생길 수 있습니다. <code>explicit<\/code>은 이런 '의도하지 않은' 자동 변환을 어떻게 다루는 키워드인지 떠올려 보세요.","w":"<code>explicit<\/code>은 의도하지 않은 암시적 변환을 막습니다.","an":"02_functions_classes · 4. 클래스","src":"생성자의 `: balance_{initial}`은 멤버 초기화 목록입니다. `balance() const`의 뒤쪽 `const`는 이 멤버 함수가 객체 상태를 바꾸지 않는다는 뜻입니다. 인자 하나짜리 생성자에는 의도하지 않은 암시적 변환을 막기 위해 `explicit`을 자주 사용합니다."},{"id":"t4-04","ty":"mc","lv":3,"game":true,"p":"클래스 멤버가 초기화되는 순서는?","o":["초기화 목록에 적은 순서","알파벳 순서","생성자 호출 순서","클래스에 선언된 순서"],"a":3,"h":"생성자의 멤버 초기화 목록에 적은 순서가 실제 초기화 순서를 정하지는 않습니다. 자료는 한 멤버의 초기값이 다른 멤버에 의존한다면 클래스 본문에 멤버를 적은 순서까지 계약의 일부라고 설명합니다. 컴파일러가 기준으로 삼는 순서가 어디에 적혀 있는지 생각해 보세요.","w":"멤버는 초기화 목록 순서가 아니라 클래스에 선언된 순서로 초기화됩니다. 멤버 간 의존이 있으면 선언 순서도 계약의 일부입니다.","an":"02_functions_classes · 객체 수명과 멤버 초기화 순서","src":"객체는 저장 공간이 확보되고 초기화가 완료된 뒤 사용할 수 있는 수명을 가집니다. 멤버는 초기화 목록에 적은 순서가 아니라 **클래스에 선언된 순서** 로 초기화되므로, 한 멤버의 초기값이 다른 멤버에 의존한다면 선언 순서까지 계약의 일부입니다. 자동 수명의 지역 객체는 블록을 벗어날 때 생성의 역순으로 소멸하며, 소멸 뒤 해당 객체를 가리키던 참조나 포인터를 사용하면 dangling 접근이 됩니다. 클래스가 생성자에서 불변식을 세우고 공개 멤버 함수가 이를 보존해야 하는 이유가 여기에 있습니다."},{"id":"t4-05","ty":"num","lv":3,"game":false,"p":"장바구니: 12,000원 책 2권과 1,000원 연필 3개를 담고, 회원이며 20,000원 이상이면 10% 할인합니다. 최종 금액은 몇 원인가요?","a":24300,"unit":"원","h":"계산식은 할인 전 합계 = 12,000 × 2 + 1,000 × 3, 최종 금액 = 합계 − 합계 × 10 / 100입니다. <code>discounted_total<\/code>은 회원이고 총액이 20,000원 이상일 때만 10%를 뺍니다. 먼저 합계가 기준을 넘는지 확인한 뒤 할인을 적용하세요.","w":"수량 5개, 할인 전 27,000원, 회원 10% 할인으로 24,300원입니다.","an":"02_functions_classes · 정답 해설","src":"12,000원 책 2권과 1,000원 연필 3개는 수량 5·총액 27,000입니다. 회원이고 20,000 이상이면 10%를 빼 24,300입니다. 수량이나 가격이 0 이하일 때 `line_total`은 0, `add`는 바로 반환하므로 상태가 그대로입니다."},{"id":"t4-06","ty":"ox","lv":1,"game":true,"p":"객체가 항상 지켜야 하는 규칙을 불변식(invariant)이라고 한다.","a":true,"h":"자료는 클래스가 <code>private<\/code> 상태를 직접 노출하지 않고 <code>public<\/code> 멤버 함수로만 바꾸게 해 유효한 상태를 지킨다고 설명합니다. 예를 들어 장바구니의 개수와 금액은 항상 서로 맞아야 합니다. 이렇게 객체가 언제나 지켜야 하는 규칙을 부르는 이름이 무엇인지 확인해 보세요.","w":"맞습니다. 멤버 함수는 입력을 먼저 검사하고 유효할 때 관련 상태를 함께 변경해 불변식을 지킵니다.","an":"02_functions_classes · 객체를 '상태 + 허용된 행동'으로 보기","src":"객체가 지켜야 하는 규칙을 **불변식(invariant)** 이라고 합니다. 예를 들어 잘못된 수량이 들어왔을 때 개수만 늘고 금액은 그대로라면 두 상태가 서로 맞지 않게 됩니다. 멤버 함수는 입력을 먼저 검사하고, 유효할 때 관련 상태를 함께 변경해야 합니다."},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"잘못된 수량이 들어오면 개수만 늘리고 금액은 그대로 두어도 된다.","a":false,"h":"장바구니의 <code>item_count_<\/code>와 <code>total_price_<\/code>는 항상 함께 일관되게 갱신되어야 합니다. 잘못된 수량이 들어왔을 때 개수만 늘고 금액은 그대로라면 두 상태가 서로 맞지 않게 됩니다. 멤버 함수는 입력을 먼저 검사하고 유효할 때만 관련 상태를 함께 바꿔야 합니다.","w":"틀렸습니다. 두 상태가 서로 맞지 않게 됩니다. 유효하지 않은 상품은 상태를 전혀 바꾸지 않아야 합니다.","an":"02_functions_classes · 실습 목적과 TODO 구현 명세","src":"- **제약:** 유효하지 않은 상품은 상태를 바꾸지 않고, `item_count_`와 `total_price_`는 항상 함께 일관되게 갱신하며 공개 인터페이스와 출력 형식은 유지합니다."},{"id":"t4-08","ty":"match","lv":2,"game":false,"p":"장바구니 실습의 이름과 책임을 연결하세요.","pairs":[["Product","이름·가격 데이터 묶음"],["line_total","한 상품 줄의 금액 계산"],["ShoppingCart::add","장바구니 상태 갱신"],["discounted_total","최종 할인 적용"]],"h":"장바구니 실습은 책임을 네 부분으로 나눕니다. 이름·가격을 묶는 구조체, 한 상품의 금액만 계산하는 함수, 개수와 금액 두 상태를 갱신하는 멤버 함수, 회원 여부로 마지막 할인을 정하는 함수입니다. 각 이름이 데이터·계산·상태·할인 중 무엇을 맡는지 짝지어 보세요.","w":"Product는 데이터를 묶고, line_total은 한 줄 금액, add는 상태 갱신, discounted_total은 최종 할인을 담당합니다.","an":"02_functions_classes · 정답 해설","src":"**책임 분리:** `Product`는 이름·가격을 묶고, `line_total`은 한 상품의 금액, `ShoppingCart.add`는 장바구니 상태 갱신, `discounted_total`은 최종 할인을 담당합니다."},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"장바구니 TODO의 권장 구현 순서대로 정렬하세요.","steps":["TODO 1 line_total","TODO 3·4 조회 함수","TODO 2 add","TODO 5 discounted_total"],"h":"자료는 먼저 한 줄 계산을 독립적으로 완성하고, 조회 함수로 상태를 관찰할 통로를 만든 뒤, <code>add<\/code>에서 두 상태를 함께 갱신하라고 권합니다. 할인 함수는 마지막에 연결해야 어느 단계에서 값이 어긋났는지 분리해 확인하기 쉽습니다. 계산 → 관찰 → 상태 갱신 → 할인 순서로 TODO 번호를 배치해 보세요.","w":"한 줄 계산을 먼저 완성하고, 조회 함수로 상태를 볼 통로를 만든 뒤, add로 상태를 갱신하고, 마지막에 할인을 연결합니다.","an":"02_functions_classes · TODO별 입력·출력·수정 범위","src":"권장 순서는 **TODO 1 → TODO 3·4 → TODO 2 → TODO 5** 입니다. 먼저 한 줄 계산을 독립적으로 완성하고, 조회 함수로 상태를 관찰할 통로를 만든 뒤, `add`에서 두 상태를 함께 갱신하세요. 마지막에 할인 함수를 연결하면 어느 단계에서 값이 어긋났는지 분리해 확인하기 쉽습니다."},{"id":"t4-10","ty":"multi","lv":2,"game":true,"p":"<code>discounted_total<\/code>의 결과로 맞는 것을 <b>모두<\/b> 고르세요.","o":["19,999원 회원 → 19,999원","20,000원 회원 → 18,000원","20,000원 비회원 → 20,000원","20,000원 비회원 → 18,000원","19,999원 회원 → 17,999원"],"a":[0,1,2],"h":"<code>discounted_total(total, is_member)<\/code>는 회원이면서 총액이 20,000원 이상일 때만 10%를 뺍니다. 기준은 '이상'이므로 20,000원 자체는 할인 대상이고 19,999원은 아닙니다. 비회원은 금액과 상관없이 총액이 그대로 반환됩니다.","w":"할인 조건은 회원이면서 20,000원 이상입니다. 19,999원은 할인되지 않고, 비회원도 할인되지 않습니다.","an":"02_functions_classes · 완료 기준","src":"assert(discounted_total(19'999, true) == 19'999);\n assert(discounted_total(20'000, true) == 18'000);\n assert(discounted_total(20'000, false) == 20'000);"}]},{"id":"t5","title":"컨테이너·포인터·CMake 입문","ref":"03_memory_stl_cmake","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"길이를 바꿀 수 있는 연속 배열 컨테이너는?","o":["array","tuple","vector","map"],"a":2,"h":"자료는 컨테이너를 목적별로 구분합니다. <code>array&lt;T,N&gt;<\/code>은 크기가 타입에 고정되고, <code>tuple<\/code>은 서로 다른 타입의 필드를 묶습니다. <code>push_back<\/code>으로 뒤에 값을 추가해 크기가 늘어나는 연속 배열이 무엇인지 찾아보세요.","w":"<code>vector<\/code>는 길이를 바꿀 수 있는 연속 배열, <code>array&lt;T,N&gt;<\/code>는 크기가 타입에 고정됩니다.","an":"03_memory_stl_cmake · 1. 자료구조를 고르는 기준","src":"`vector`는 길이를 바꿀 수 있는 연속 배열입니다. `array<T,N>`은 크기가 타입에 고정됩니다. `tuple`은 서로 다른 타입의 필드를 묶습니다."},{"id":"t5-02","ty":"mc","lv":2,"game":true,"p":"키 순서로 순회하는 컨테이너는?","o":["unordered_map","map","vector","queue"],"a":1,"h":"<code>map<\/code>과 <code>unordered_map<\/code>은 둘 다 키로 값을 찾습니다. 하나는 키를 정렬해 보관하므로 키 순서로 순회하고, 다른 하나는 해시 기반이라 순회 순서를 보장하지 않습니다. 이름에 'unordered'가 붙은 쪽이 어느 쪽인지 생각해 보세요.","w":"<code>map<\/code>은 키 순서로 순회하고 <code>unordered_map<\/code>은 순서를 보장하지 않습니다.","an":"03_memory_stl_cmake · 1. 자료구조를 고르는 기준","src":"`map`은 키 순서로 순회하지만 `unordered_map`은 순서를 보장하지 않습니다. 둘 다 키로 값을 찾습니다."},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"CMake의 configure 단계 명령은?","o":["cmake --build ...","cmake -S ... -B ...","ctest --test-dir ...","make install"],"a":1,"h":"CMake는 configure와 build를 다른 단계로 나눕니다. configure는 <code>CMakeLists.txt<\/code>를 읽어 소스 폴더(-S)와 빌드 폴더(-B)를 지정하고 빌드 규칙을 생성하며, build는 <code>--build<\/code> 옵션으로 실제 컴파일·링크를 합니다. 두 폴더를 지정하는 명령을 고르세요.","w":"<code>cmake -S … -B …<\/code>가 configure(규칙 준비), <code>cmake --build …<\/code>가 build(컴파일·링크)입니다.","an":"03_memory_stl_cmake · 3. CMake는 빌드 대상을 연결합니다","src":"configure(`cmake -S ... -B ...`)와 build(`cmake --build ...`)는 다른 단계입니다."},{"id":"t5-04","ty":"mc","lv":2,"game":true,"p":"CTest의 역할로 알맞은 것은?","o":["C++ 전용 컴파일러","헤더 검색 도구","링커","검사 프로그램 실행 도구"],"a":3,"h":"CTest는 C++ 코드를 검사하는 특별한 컴파일러가 아닙니다. 빌드된 <code>check_stats<\/code> 같은 검증 프로그램을 실행하고 그 종료 코드를 수집하는 역할을 합니다. 컴파일·링크는 <code>cmake --build<\/code>가 맡는다는 점과 구분해 보세요.","w":"CTest는 빌드된 검사 프로그램을 실행하고 종료 코드를 수집하는 테스트 실행 도구입니다.","an":"03_memory_stl_cmake · CMake 파일을 의존 그래프로 읽기","src":"CTest는 C++ 코드를 검사하는 특별한 컴파일러가 아닙니다. 빌드된 `check_stats` 프로그램을 실행하고 종료 코드를 수집하는 테스트 실행 도구입니다."},{"id":"t5-05","ty":"mc","lv":3,"game":true,"p":"센서 입력 {20, 30, 25}, 기준 30일 때 <code>summarize<\/code>의 결과 Summary{count, mean, alarm}는?","o":["{3, 25.0, true}","{3, 25.0, false}","{3, 30.0, true}","{2, 25.0, true}"],"a":0,"h":"<code>summarize<\/code>는 개수, 평균(합계/개수), 경보를 <code>Summary{count, mean, alarm}<\/code> 순서로 반환합니다. 경보는 평균과 무관하게 원소 하나라도 <code>&gt;= threshold<\/code>이면 켜집니다. 20·30·25의 개수와 평균을 계산하고, 30이 기준에 도달하는지 확인해 보세요.","w":"개수 3, 평균 25.0이고, 30인 값 하나가 기준에 도달했으므로 alarm은 true입니다.","an":"03_memory_stl_cmake · 4. 수업 핵심 TODO — 센서 통계","src":"**작성 흐름 힌트:** 헤더의 필드 순서 확인 → 빈 목록 반환 → 합계와 경보 누적 → 실수 평균 계산 → 구조체 반환. 평균은 합계/개수이고 경보는 평균과 무관하게 원소 하나라도 `>= threshold`이면 켜집니다."},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"<code>operator[]<\/code>는 <code>at()<\/code>처럼 범위를 검사하고 예외를 던진다.","a":false,"h":"자료는 원소 접근 방법 두 가지를 구분합니다. <code>at()<\/code>은 범위를 검사하고 범위 밖 접근에 예외를 던집니다. <code>operator[]<\/code>가 같은 방식으로 검사하는지 자료의 표현을 확인해 보세요.","w":"틀렸습니다. <code>at()<\/code>은 범위 밖 접근에 예외를 던지지만 <code>[]<\/code>는 같은 방식으로 검사하지 않습니다.","an":"03_memory_stl_cmake · 1. 자료구조를 고르는 기준","src":"`at()`은 범위를 검사하고 범위 밖 접근에 예외를 던집니다. `operator[]`는 같은 방식으로 검사하지 않습니다."},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"<code>const T*<\/code>는 그 포인터로 값을 바꾸지 못하게 할 뿐 메모리 수명을 연장하지 않는다.","a":true,"h":"값 전달은 복사본, 참조는 원본의 별칭, 포인터는 주소를 저장하는 값입니다. <code>const T*<\/code>의 <code>const<\/code>는 그 포인터를 통한 쓰기를 막는 장치일 뿐 메모리를 소유하거나 정리 시점을 바꾸지는 않습니다. 접근 수단이 있다고 소유권이나 수명이 생기는 것은 아니라는 점을 떠올려 보세요.","w":"맞습니다. 접근 수단이 있다고 소유권이나 수명이 생기는 것은 아닙니다.","an":"03_memory_stl_cmake · 2. 주소·참조·포인터와 수명","src":"값 전달은 복사본, 참조는 원본의 별칭, 포인터는 주소를 저장하는 값입니다.\n`const T*`는 해당 포인터로 값을 바꾸지 못하게 할 뿐 메모리 수명을 연장하지 않습니다."},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"CMake 선언과 역할을 연결하세요.","pairs":[["add_library(stats STATIC ...)","정적 라이브러리 선언"],["add_executable","실행 파일 선언"],["target_link_libraries","실행 파일과 라이브러리 연결"],["target_include_directories PUBLIC","소비 target에도 헤더 경로 전달"]],"h":"CMake 선언은 '만들기'와 '연결하기'로 나뉩니다. <code>add_library<\/code>와 <code>add_executable<\/code>은 각각 재사용할 라이브러리와 실행 파일을 선언하고, <code>target_link_libraries<\/code>와 <code>target_include_directories<\/code>는 target 사이의 링크 관계와 헤더 경로를 연결합니다. PUBLIC은 소비하는 target에도 설정을 전달한다는 뜻입니다.","w":"add_library는 라이브러리, add_executable은 실행 파일, target_link_libraries는 링크 관계, PUBLIC include 경로는 소비자에게도 전달됩니다.","an":"03_memory_stl_cmake · 3. CMake는 빌드 대상을 연결합니다","src":"`add_library(stats STATIC ...)`는 재사용할 정적 라이브러리, `add_executable`은 실행 파일을 선언합니다.\n`target_include_directories(stats PUBLIC ...)`의 PUBLIC은 소비하는 target에도 헤더 경로를 전달합니다.\n`target_link_libraries(check_stats PRIVATE stats)`가 검증 프로그램과 라이브러리를 연결합니다."},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"센서 통계 실습의 흐름을 순서대로 정렬하세요.","steps":["stats.cpp TODO 수정·저장","configure","build","CTest","개수·평균·경보 결과 해석"],"h":"실습은 먼저 TODO 소스를 수정·저장한 뒤, CMake가 규칙을 준비하고(configure), 실행물을 만들고(build), 검증 프로그램을 실행합니다(CTest). 마지막으로 개수·평균·경보 결과를 해석합니다. 규칙 준비 → 실행물 생성 → 결과 검증의 흐름을 따라 정렬해 보세요.","w":"저장 → configure(규칙 준비) → build(컴파일·링크) → CTest(검증) → 결과 해석 순서입니다. 빌드 성공만으로 정답이라고 결론 내리지 않습니다.","an":"03_memory_stl_cmake · 이 실습은 무엇을 위한 것인가요?","src":"stats.cpp TODO 수정·저장\n ↓\nconfigure\n ↓\nbuild\n ↓\nCTest\n ↓\n개수·평균·경보 결과 해석"},{"id":"t5-10","ty":"multi","lv":2,"game":true,"p":"동적 배열 예제(<code>values<\/code>, <code>view<\/code>, <code>owned<\/code>)에 대한 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["values는 delete[]를 한 번 수행","view는 해제하면 안 됨","owned(vector)는 자동 정리","view도 delete[] 해야 함","delete[] 후에도 읽어도 안전"],"a":[0,1,2],"h":"동적 배열 예제는 역할을 셋으로 나눕니다. <code>new<\/code>로 만든 배열을 소유하는 포인터는 짝이 맞는 해제를 정확히 한 번 해야 하고, 같은 배열을 바라보기만 하는 비소유 포인터는 해제 책임이 없습니다. vector는 내부 배열을 소유하다가 범위를 벗어날 때 스스로 정리합니다.","w":"소유 포인터 values만 delete[]를 정확히 한 번 하고, 비소유 view는 해제하지 않으며, vector는 범위 종료 시 자동 정리됩니다. 해제 후 접근은 정의되지 않은 동작입니다.","an":"03_memory_stl_cmake · 같은 count를 바라보는 세 방법","src":"| 이름 | 역할 | 해제 책임 |\n|---|---|---|\n| `values` | `new double[3]`가 만든 배열을 소유하는 포인터 | `delete[] values`를 정확히 한 번 수행 |\n| `view` | 같은 배열을 읽기 전용으로 바라보는 비소유 포인터 | 해제하면 안 됨 |\n| `owned` | vector 객체가 내부 배열을 소유 | 범위를 벗어날 때 자동 정리 |"}]},{"id":"t6","title":"공유 라이브러리와 Python ctypes","ref":"04_shared_library_python","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"C++ 함수를 C 형태 이름으로 외부에 노출하는 선언은?","o":["extern \"C\"","namespace","static","inline"],"a":0,"h":"C++은 오버로딩 등을 위해 심볼 이름을 변형(mangling)하므로, Python 로더가 함수 이름 그대로 찾기 어렵습니다. 그래서 헤더는 C++ 컴파일러가 읽을 때만 특별한 블록을 적용해 외부 심볼 이름을 C 호환 방식으로 공개합니다. 이 선언은 함수 몸체를 C 언어로 바꾸는 것이 아니라 이름 공개 방식만 바꿉니다.","w":"<code>extern \"C\"<\/code>는 함수 몸체를 C로 바꾸는 것이 아니라 외부 심볼 이름을 C 호환 방식으로 공개합니다.","an":"04_shared_library_python · 1. .so와 C ABI","src":"C++은 오버로딩 등을 위해 심볼 이름을 변형합니다. `extern \"C\"`는 여기서 사용할 C 형태의 함수 이름을 노출합니다."},{"id":"t6-02","ty":"mc","lv":2,"game":true,"p":"<code>sensor_mean<\/code>이 반환하는 0의 의미는?","o":["평균이 0","계산 성공","빈 입력","비유한 입력"],"a":1,"h":"sensor_mean의 반환 타입 int는 계산값이 아니라 성공·실패를 알리는 상태 코드 0/1/2입니다. 평균은 반환값이 아니라 <code>*out_mean<\/code> 주소에 기록되고, null 포인터나 n=0이면 1, 유한하지 않은 값이면 2를 돌려줍니다. 남은 코드 0이 어떤 상황을 뜻하는지 생각해 보세요.","w":"반환값은 상태 코드이며 0은 성공입니다. 평균은 <code>*out_mean<\/code>에 기록됩니다.","an":"04_shared_library_python · 정답 해설","src":"**입력 → 출력:** `sensor_mean(const double* values, size_t n, double* out_mean)`의 입력은 배열 주소·개수·결과를 쓸 주소입니다. 함수 반환값은 평균이 아니라 상태 코드 `0/1/2`이며 평균은 `*out_mean`에 기록합니다. `{20,30,25}`, n=3이면 상태 `0`, 평균 `25.0`입니다. 정확한 선언은 함께 제공된 헤더를 유지하세요."},{"id":"t6-03","ty":"mc","lv":2,"game":true,"p":"공유 라이브러리의 동적 심볼 표에서 <code>sensor_mean<\/code>을 확인하는 명령은?","o":["nm -D libsensor.so","ldd libsensor.so","cmake --build","ctest"],"a":0,"h":"CMake의 <code>add_library(sensor SHARED ...)<\/code>는 <code>libsensor.so<\/code>를 만듭니다. 심볼을 나열하는 <code>nm<\/code> 도구에 동적(Dynamic) 심볼 표 옵션을 붙이면, Python 로더가 이름으로 찾을 <code>sensor_mean<\/code>이 보이는지 확인할 수 있습니다. 심볼이 보여도 계산이 올바르다는 뜻은 아니므로 ABI 테스트가 따로 필요합니다.","w":"<code>nm -D<\/code>로 동적 심볼을 봅니다. 보이면 Python 로더가 이름으로 함수를 찾을 수 있지만, 계산이 맞다는 뜻은 아닙니다.","an":"04_shared_library_python · 빌드 로그와 nm -D 결과 읽기","src":"`nm -D libsensor.so`는 동적 심볼 표를 보여 줍니다. 여러 줄 중 `sensor_mean`이라는 읽을 수 있는 이름을 찾으세요. 보인다면 Python 로더가 이름으로 함수를 찾을 수 있다는 뜻입니다."},{"id":"t6-04","ty":"mc","lv":2,"game":true,"p":"ctypes에서 C++ <code>size_t<\/code>에 맞춰 지정하는 타입은?","o":["c_int","c_double","c_size_t","c_char_p"],"a":2,"h":"ctypes에서는 C++ 서명에 맞춰 <code>argtypes<\/code>와 <code>restype<\/code>를 직접 지정합니다. 자료는 <code>double*<\/code>는 <code>POINTER(c_double)<\/code>, 상태 <code>int<\/code>는 <code>c_int<\/code>처럼 C 타입 이름 앞에 <code>c_<\/code>를 붙인 타입으로 대응시킵니다. Jetson의 64비트 프로세스에서 크기·개수를 나타내는 부호 없는 정수 타입도 같은 규칙으로 맞춥니다.","w":"<code>double*<\/code>는 <code>POINTER(c_double)<\/code>, <code>size_t<\/code>는 <code>c_size_t<\/code>, 상태 int는 <code>c_int<\/code>입니다.","an":"04_shared_library_python · 4. ctypes에서 자료형 지정","src":"C++ `double*`는 `POINTER(c_double)`, `size_t`는 `c_size_t`, 상태 `int`는 `c_int`로 지정합니다."},{"id":"t6-05","ty":"mc","lv":3,"game":true,"p":"<code>.so<\/code>를 재빌드한 뒤 새 코드를 확실히 사용하려면?","o":["같은 커널에서 다시 import","새 프로세스나 커널 재시작","소스 파일만 저장","configure만 실행"],"a":1,"h":"<code>.so<\/code>를 Python 커널에서 한 번 로드한 뒤 같은 경로로 재빌드해도, 이미 로드된 라이브러리가 새 코드로 바뀐다고 보장할 수 없습니다. 그래서 이 노트북은 매 호출을 새 프로세스에서 수행합니다. 로드 상태를 비우려면 Python 실행 환경 자체를 어떻게 해야 할지 생각해 보세요.","w":"한 번 로드한 <code>.so<\/code>는 같은 경로로 재빌드해도 바뀐다고 보장할 수 없어 새 Python 프로세스나 커널 재시작 후 로드합니다.","an":"04_shared_library_python · 6. 재빌드·재생성과 흔한 문제","src":"- `.so`를 Python 커널에서 한 번 로드한 뒤 같은 경로로 재빌드해도 새 코드로 바뀐다고 보장할 수 없습니다. **새 Python 프로세스 또는 커널 재시작** 후 로드합니다."},{"id":"t6-06","ty":"ox","lv":1,"game":true,"p":"실패 상태 코드를 받았어도 <code>out_mean<\/code>의 값은 평균으로 써도 된다.","a":false,"h":"이 함수는 계산 결과와 오류를 서로 다른 통로로 전달합니다. 반환값 <code>int<\/code>는 호출 성공 여부이고, <code>out_mean<\/code>은 성공했을 때만 실제 평균이 기록되는 곳입니다. 자료는 상태 코드를 먼저 검사하고 성공했을 때만 출력 공간을 읽으라고 안내합니다.","w":"틀렸습니다. 성공했을 때만 출력 공간을 읽습니다. 실패 시 출력은 예전 값 그대로 보존됩니다.","an":"04_shared_library_python · 이 실습은 무엇을 위한 것인가요?","src":"**설명:** 안 됩니다. 상태 코드를 먼저 검사하고 성공했을 때만 출력 공간을 읽습니다."},{"id":"t6-07","ty":"ox","lv":2,"game":true,"p":"C++은 포인터만 보고 배열 길이를 알 수 없어 길이를 별도로 전달한다.","a":true,"h":"<code>const double* values<\/code>는 연속된 double 배열 첫 원소의 주소만 담습니다. 포인터 자체에는 길이 정보가 없으므로 <code>size_t n<\/code>으로 원소 수를 함께 넘기며, 포인터와 길이는 하나의 계약입니다. <code>n<\/code>이 실제 배열보다 크면 유효하지 않은 메모리에 접근할 수 있습니다.","w":"맞습니다. 포인터와 길이는 하나의 계약이며 Python wrapper가 만든 길이를 전달합니다.","an":"04_shared_library_python · 함수 선언을 한 조각씩 읽기","src":"| `size_t n` | 배열 원소 수 | 포인터 자체에는 길이 정보가 없어 별도 전달 |"},{"id":"t6-08","ty":"match","lv":2,"game":false,"p":"<code>sensor_mean<\/code>의 상태 코드와 의미를 연결하세요.","pairs":[["0","성공"],["1","null 포인터 또는 빈 입력"],["2","비유한 입력 또는 합계"]],"h":"<code>sensor_mean<\/code>은 결과를 쓰기 전에 인자를 먼저 검사하고, 이어서 입력과 누적 합의 유한성을 검사합니다. 포인터가 없거나 개수가 0이면 첫 번째 실패 코드, NaN·Inf처럼 유한하지 않은 값이면 두 번째 실패 코드를 돌려줍니다. 모든 검사를 통과한 경우에만 0이 아닌 실패 코드 없이 결과를 기록합니다.","w":"0은 성공, 1은 null/빈 입력, 2는 NaN·Inf 같은 비유한 입력이나 합계 overflow입니다.","an":"04_shared_library_python · 1. .so와 C ABI","src":"- 반환값 0은 성공, 1은 null/빈 입력, 2는 비유한 입력·합계입니다."},{"id":"t6-09","ty":"order","lv":2,"game":false,"p":"Python에서 C++ 평균 함수를 호출하는 경로를 순서대로 정렬하세요.","steps":["Python 리스트를 c_double 배열로 복사","주소·길이·결과 주소로 sensor_mean 호출","상태 코드 확인","성공 시 output.value 반환"],"h":"<code>SensorLibrary<\/code> wrapper는 먼저 Python 숫자를 연속된 C double 배열로 복사하고, 결과를 쓸 한 칸을 만들어 그 주소를 전달합니다. 호출 뒤에는 상태 코드를 검사해 실패를 예외로 바꾸고, 성공했을 때만 결과 칸의 값을 돌려줍니다. 변환 → 호출 → 상태 확인 → 결과 읽기의 순서를 따라가 보세요.","w":"wrapper가 C 배열을 만들고, 주소·길이·결과 주소를 넘겨 호출한 뒤, 상태 코드를 검사하고 성공일 때만 결과를 읽습니다.","an":"04_shared_library_python · Python wrapper를 위에서 아래로 추적하기","src":"6. `(ct.c_double * len(values))(*values)`는 Python 숫자를 연속된 C double 배열로 복사합니다.\n7. `ct.c_double()`은 C++이 결과를 쓸 한 칸을 만들고 0.0으로 초기화합니다.\n8. `ct.byref(output)`은 그 한 칸의 주소를 전달합니다.\n9. 상태 코드를 검사해 알려진 실패는 `ValueError`, 알 수 없는 상태는 `RuntimeError`로 바꿉니다.\n10. 성공했을 때만 `output.value`를 Python `float`로 돌려줍니다."},{"id":"t6-10","ty":"multi","lv":2,"game":true,"p":"ABI 테스트가 확인하는 항목을 <b>모두<\/b> 고르세요.","o":["빈 배열·NaN·Inf 입력","null 포인터","실패 시 출력 보존","GPU 사용 여부","C++이 2배 빠른지"],"a":[0,1,2],"h":"ABI 테스트는 '평균이 한 번 맞다'보다 넓은 언어 경계의 계약을 확인합니다. 자료의 표에는 정상 입력, 입력 보존, 빈/비유한 입력, null 포인터, 실패 원자성(실패 시 출력 메모리 유지), ABI 모양이 있습니다. 실행 속도처럼 표에 없는 항목은 제외하세요.","w":"정상·빈·비유한 입력, null 포인터, 실패 원자성(출력 보존), 입력 보존, ABI 모양을 확인합니다. 속도 비교는 목적이 아닙니다.","an":"04_shared_library_python · ABI 테스트가 확인하는 경계","src":"| 범주 | 대표 검사 | 찾으려는 문제 |\n|---|---|---|\n| 정상 입력 | 여러 값, 한 값, 음수, 임의 값 97개 | 합계·나눗셈·길이 처리 |\n| 입력 보존 | 호출 전후 Python list와 C 배열 비교 | `const` 입력을 실수로 변경했는지 |\n| 빈/비유한 입력 | 빈 배열, NaN, Inf, overflow | 상태 코드와 Python 예외 변환 |\n| null 포인터 | 입력 또는 출력 주소가 없음 | 역참조 전 인자 검사 |\n| 실패 원자성 | 출력에 123.0을 넣고 실패 호출 | 실패할 때 출력 메모리를 바꾸지 않는지 |\n| ABI 모양 | ctypes로 포인터·길이 직접 호출 | wrapper 밖에서도 C 함수 계약이 맞는지 |"}]},{"id":"t7","title":"STL 컨테이너 (자습)","ref":"90_selfstudy_stl","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"Python <code>list<\/code>의 기본 대응 C++ 컨테이너는?","o":["std::list","std::vector","std::array","std::deque"],"a":1,"h":"자료는 Python 자료구조를 '의도' 기준으로 C++ 컨테이너에 대응시킵니다. 크기가 변하는 순서 목록에는 연속 배열 컨테이너를 기본으로 고르며, 이름이 같은 <code>std::list<\/code>는 노드가 흩어진 연결 리스트라 임의 인덱싱을 제공하지 않습니다. 이름보다 동작이 같은 쪽을 고르세요.","w":"기본 대응은 <code>std::vector<\/code>입니다. <code>std::list<\/code>는 노드가 흩어진 연결 리스트로 임의 인덱싱을 제공하지 않습니다.","an":"90_selfstudy_stl · 1. Python에서 무엇으로 옮길까?","src":"> **중요:** Python `list`의 기본 대응은 C++의 `std::list`가 아니라 `std::vector`입니다. `std::list`는 노드가 흩어진 연결 리스트이며 임의 인덱싱을 제공하지 않습니다."},{"id":"t7-02","ty":"mc","lv":2,"game":true,"p":"<code>queue.pop()<\/code>의 동작은?","o":["맨 앞 값을 반환하고 제거","제거만 하고 값을 반환하지 않음","맨 뒤 값을 제거","큐를 모두 비움"],"a":1,"h":"<code>queue<\/code>는 <code>front()<\/code>로 맨 앞을 읽고 <code>pop()<\/code>으로 제거하는 제한된 인터페이스를 제공합니다. 자료는 <code>pop()<\/code> 전에 <code>front()<\/code>를 먼저 복사해 두라고 안내합니다. 왜 미리 복사해야 하는지 <code>pop()<\/code>의 반환값과 연결해 생각해 보세요.","w":"<code>pop()<\/code>은 제거만 하고 값을 반환하지 않습니다. <code>front()<\/code>로 먼저 복사해 둡니다.","an":"90_selfstudy_stl · 5. std::queue","src":"- `queue.pop()`은 제거한 값을 반환하지 않습니다. `front()`를 먼저 복사하세요."},{"id":"t7-03","ty":"mc","lv":2,"game":true,"p":"<code>unordered_map<\/code>에서 없는 키에 <code>operator[]<\/code>를 쓰면?","o":["예외 발생","end() 반환","기본값 항목을 새로 삽입","컴파일 오류"],"a":2,"h":"<code>at(key)<\/code>는 없는 키에서 예외를 던지고, <code>find<\/code>는 삽입 없이 존재 여부만 확인합니다. 반면 <code>operator[]<\/code>는 키가 없을 때 조용히 무언가를 해 버려서, 조회만 하려다 데이터가 바뀔 수 있습니다. 서점 실습의 <code>++served_count[customer]<\/code>가 처음 등장한 키에서 0부터 셀 수 있는 이유와 연결해 보세요.","w":"<code>[]<\/code>는 없는 키에 기본값 항목을 새로 삽입합니다. <code>at<\/code>은 예외, <code>find<\/code>는 삽입 없이 존재 여부만 확인합니다.","an":"90_selfstudy_stl · 4. unordered_map과 map","src":"`at(key)`는 없는 키에서 예외를 던지고, `find`는 삽입 없이 존재 여부를 확인합니다. 반면 `operator[]`는 키가 없으면 기본값을 가진 항목을 **새로 삽입** 합니다. 조회만 할 때 무심코 `[]`를 쓰면 데이터가 바뀔 수 있습니다."},{"id":"t7-04","ty":"mc","lv":2,"game":true,"p":"<code>for (auto value : values) { value *= 10; }<\/code> 실행 후 원본 {1, 2, 3}은?","o":["{10, 20, 30}","컴파일 오류","{0, 0, 0}","{1, 2, 3}"],"a":3,"h":"범위 기반 <code>for<\/code>에서 <code>auto value<\/code>는 각 원소의 복사본입니다. 원본을 바꾸려면 <code>auto&amp; value<\/code>, 읽기만 하려면 <code>const auto&amp; value<\/code>를 써야 합니다. 복사본에 10을 곱했을 때 원본 벡터가 달라지는지 생각해 보세요.","w":"<code>auto value<\/code>는 복사본이라 원본은 그대로입니다. 바꾸려면 <code>auto&amp;<\/code>, 읽기만 하려면 <code>const auto&amp;<\/code>를 씁니다.","an":"90_selfstudy_stl · 45초 예측","src":"`auto value`는 각 원소의 **복사본** 입니다. 원본을 바꾸려면 `auto& value`, 읽기만 하려면 `const auto& value`를 사용합니다."},{"id":"t7-05","ty":"mc","lv":3,"game":true,"p":"서점 주문 처리에서 A-102(연필 12개 요청, 연필 재고 10)는 어떻게 처리되나요?","o":["재고 부족 거절","처리 완료","없는 상품 거절","부분 처리"],"a":0,"h":"주문 처리는 조회 실패·재고 부족·성공 세 분기 중 하나만 실행합니다. 상품 키가 없으면 '없는 상품', 상품은 있지만 남은 수량보다 요청이 크면 다른 거절 사유로 기록되고, 거절 주문은 재고와 판매량을 바꾸지 않습니다. A-102는 연필 키는 있지만 10개 재고에 12개를 요청한 경우입니다.","w":"재고 부족으로 거절되고 재고는 그대로 남아 다음 A-103(연필 7개)이 성공합니다. 부분 처리는 하지 않습니다.","an":"90_selfstudy_stl · 8. 종합 실습 — 서점 주문 FIFO 처리","src":"| 2 | A-102 / 연필 / 12 | 상품은 있으나 초기 재고보다 요청이 큼 | TODO 2 | 거절 기록만 증가 |"},{"id":"t7-06","ty":"ox","lv":1,"game":true,"p":"<code>std::sort<\/code>는 정렬된 새 컨테이너를 반환한다.","a":false,"h":"<code>std::sort(scores.begin(), scores.end())<\/code>는 <code>[begin, end)<\/code> 범위의 원소를 오름차순으로 '제자리에서' 재배열합니다. 그래서 원본 순서를 유지해야 하면 먼저 복사하라고 자료는 안내합니다. Python의 <code>sorted<\/code>와 동작이 같은지 비교해 보세요.","w":"틀렸습니다. <code>sort<\/code>는 원본 순서를 제자리에서 바꿉니다. 원본 순서를 유지하려면 먼저 복사합니다.","an":"90_selfstudy_stl · 예제 코드 해설 1","src":"또한 `sort`는 새 컨테이너를 반환하지 않고 원본 순서를 바꿉니다."},{"id":"t7-07","ty":"ox","lv":2,"game":true,"p":"<code>vector<\/code>가 재할당하면 기존 원소를 가리키던 반복자·포인터·참조가 무효가 될 수 있다.","a":true,"h":"컨테이너의 원소 주소가 영원히 고정되는 것은 아닙니다. <code>vector<\/code>가 용량을 늘리며 재할당하면 원소들이 새 메모리로 옮겨지므로, 예전 주소를 가리키던 것들의 유효성이 문제가 됩니다. 자료가 반복 중 <code>push_back<\/code> 뒤 예전 반복자를 쓰지 말라고 하는 이유를 떠올려 보세요.","w":"맞습니다. 변경이 끝난 뒤 <code>begin()<\/code>/<code>find()<\/code>로 다시 얻어야 합니다.","an":"90_selfstudy_stl · 반복자·참조 무효화","src":"컨테이너의 원소 주소가 영원히 고정되는 것은 아닙니다. `vector`가 용량을 늘리며 재할당하면 기존 원소를 가리키던 **모든 반복자·포인터·참조** 가 무효가 되고, 재할당이 없더라도 삽입·삭제 지점 이후를 가리키던 것은 무효가 될 수 있습니다. 따라서 반복 중 `push_back`한 뒤 예전에 저장한 반복자를 계속 쓰지 말고, 변경이 끝난 뒤 `begin()`/`find()`로 다시 얻으세요. 반면 `map`의 삽입은 기존 원소의 반복자를 보통 유지하지만, 지운 원소를 가리키는 반복자는 어느 컨테이너에서든 다시 사용할 수 없습니다. 이 규칙은 값이 맞아 보여도 주소·별칭의 유효성이 이미 끝났을 수 있음을 뜻합니다."},{"id":"t7-08","ty":"match","lv":1,"game":false,"p":"Python의 의도와 C++의 기본 선택을 연결하세요.","pairs":[["list (크기가 변하는 목록)","std::vector"],["같은 타입·고정 길이","std::array"],["dict (키–값)","std::unordered_map"],["FIFO 대기열","std::queue"]],"h":"자료의 표는 Python의 의도별로 C++ 기본 선택을 정리합니다. 크기가 변하는 목록은 연속 동적 배열, 같은 타입·고정 길이는 길이가 타입에 들어가는 배열, 키–값은 해시 기반 맵, 먼저 들어온 것을 먼저 꺼내는 대기열은 FIFO 컨테이너가 기본입니다. 각 의도의 핵심 동작으로 짝을 지어 보세요.","w":"list→vector, 고정 길이→array, dict→unordered_map(정렬이 필요하면 map), FIFO→queue입니다.","an":"90_selfstudy_stl · 1. Python에서 무엇으로 옮길까?","src":"| Python의 의도 | C++의 기본 선택 | 다른 선택이 필요한 때 |\n|---|---|---|\n| 크기가 변하는 순서 목록 `list` | `std::vector<T>` | 양 끝 삽입·삭제가 잦으면 `std::deque<T>` |\n| 같은 타입, 고정 길이 | `std::array<T, N>` | 런타임 길이는 `vector` |\n| 서로 다른 타입의 고정 묶음 `tuple` | `std::tuple<...>` | 필드 의미가 중요하면 이름 있는 `struct` |\n| 키–값 `dict` | `std::unordered_map<K, V>` | 키 정렬·범위 탐색이 필요하면 `std::map<K, V>` |\n| FIFO queue | `std::queue<T>` | 양 끝을 직접 다뤄야 하면 `std::deque<T>` |"},{"id":"t7-09","ty":"order","lv":2,"game":false,"p":"<code>queue<\/code>에서 값을 안전하게 꺼내는 순서대로 정렬하세요.","steps":["empty()로 비었는지 확인","front()로 앞 값 복사","pop()으로 제거","복사한 값 처리"],"h":"빈 큐에서 <code>front()<\/code>나 <code>pop()<\/code>을 호출하면 안 되므로 먼저 조건 검사가 필요합니다. 또 <code>pop()<\/code>은 제거한 값을 반환하지 않으므로 제거 전에 앞 원소를 복사해 두어야 합니다. 작업 한 건을 정확히 한 번 제거한 뒤 복사한 값으로 처리하는 순서를 떠올려 보세요.","w":"비었는지 확인 → 앞 값 복사 → 제거 → 처리 순서입니다. 작업 한 건을 정확히 한 번 제거해야 무한 반복이나 건너뛰기를 피합니다.","an":"90_selfstudy_stl · 예제 코드 해설 2","src":"`while`의 한 회는 항상 **비었는지 확인 → 앞 원소 복사 → 큐에서 제거 → 횟수 증가 → 출력** 순서입니다."},{"id":"t7-10","ty":"multi","lv":2,"game":true,"p":"서점 주문 실습의 기대 결과로 맞는 것을 <b>모두<\/b> 고르세요.","o":["성공 주문 A-101·A-103","노트 재고 3","연필 재고 3","A-104 재고 부족 거절","판매 품목 수 3"],"a":[0,1,2],"h":"초기 재고는 노트 5, 연필 10이고 주문은 A-101(노트 2), A-102(연필 12), A-103(연필 7), A-104(지우개 1) 순서입니다. 거절된 주문은 재고를 바꾸지 않고, 지우개는 재고에 키 자체가 없습니다. 성공한 주문만 재고에서 빼서 남은 수량을 계산해 보세요.","w":"성공은 A-101·A-103, 노트·연필 재고는 각각 3, 판매 품목은 2개입니다. A-104는 '없는 상품'으로 거절됩니다.","an":"90_selfstudy_stl · 기대 결과","src":"성공 주문 수: 2\n실패 주문 수: 2\n노트 재고: 3\n연필 재고: 3\n판매 품목 수: 2\n```\n\n성공 순서는 `A-101`, `A-103`이고, 실패는 `A-102: 재고 부족`, `A-104: 없는 상품`입니다. 큐는 마지막에 비어 있어야 합니다."}]},{"id":"t8","title":"포인터와 메모리 수명 (자습)","ref":"91_selfstudy_memory","qs":[{"id":"t8-01","ty":"mc","lv":1,"game":true,"p":"식에서 <code>&amp;score<\/code>가 뜻하는 것은?","o":["score의 값","score의 주소","포인터 타입","참조 선언"],"a":1,"h":"같은 기호도 선언과 식에서 의미가 다릅니다. 선언의 <code>int*<\/code>는 'int를 가리키는 포인터 타입', 식의 <code>*score_ptr<\/code>은 주소를 따라가 객체에 접근하는 역참조입니다. <code>int* score_ptr{&amp;score};<\/code>에서 포인터에 저장되는 값이 무엇인지 생각해 보세요.","w":"식의 <code>&amp;score<\/code>는 주소 얻기, 식의 <code>*ptr<\/code>은 역참조, 선언의 <code>int*<\/code>는 포인터 타입입니다.","an":"91_selfstudy_memory · 1. 값, 주소, 포인터","src":"선언에서 `int*`는 'int를 가리키는 포인터 타입', 식에서 `&score`는 '주소 얻기', 식에서 `*score_ptr`은 '주소가 가리키는 객체에 접근하기(역참조)'입니다. 기호는 같아도 문맥에 따라 의미가 달라집니다."},{"id":"t8-02","ty":"mc","lv":2,"game":true,"p":"<code>const int* p<\/code>의 의미는?","o":["포인터 재지정 금지","이 포인터로 값 변경 금지","값과 주소 모두 고정","null 금지"],"a":1,"h":"포인터 선언에서는 <code>const<\/code>의 위치가 무엇을 고정하는지 정합니다. <code>*<\/code>의 왼쪽에 있으면 가리키는 값이 읽기 전용이 되고, 오른쪽에 있으면 포인터 변수 자체가 다른 주소로 바뀌지 못합니다. <code>const int* p<\/code>에서 <code>const<\/code>가 어느 쪽에 있는지 확인해 보세요.","w":"const가 *의 왼쪽이면 가리키는 값이 읽기 전용이고, 오른쪽(<code>int* const<\/code>)이면 포인터 자체가 고정됩니다.","an":"91_selfstudy_memory · 포인터에도 타입과 const가 있다","src":"`const`가 `*`의 왼쪽이면 가리키는 값이 읽기 전용이고, 오른쪽이면 포인터 변수 자체가 고정됩니다."},{"id":"t8-03","ty":"mc","lv":2,"game":true,"p":"<code>new[]<\/code>로 만든 배열을 해제하는 연산은?","o":["delete","free","delete[]","nullptr 대입"],"a":2,"h":"<code>new<\/code>로 만든 객체는 명시적으로 해제하기 전까지 살아 있으므로 소유자가 책임져야 합니다. 자료는 할당과 해제 연산을 정확히 짝지어야 한다고 강조하며, 단일 객체용 <code>delete<\/code>를 배열에 쓰면 정의되지 않은 동작입니다. 배열 할당 표기의 <code>[]<\/code>가 해제 쪽에도 어떻게 이어지는지 생각해 보세요.","w":"<code>new[]<\/code>는 <code>delete[]<\/code>와 짝지어야 합니다. 바꾸어 쓰면 정의되지 않은 동작입니다.","an":"91_selfstudy_memory · 4. 자동 수명과 동적 수명","src":"`new` ↔ `delete`, `new[]` ↔ `delete[]`를 정확히 짝지어야 합니다."},{"id":"t8-04","ty":"mc","lv":2,"game":true,"p":"RAII에서 자원이 정리되는 시점은?","o":["프로그램 종료 시","직접 delete 호출 시","sanitizer 실행 시","소유 객체 수명 종료 시"],"a":3,"h":"RAII(Resource Acquisition Is Initialization)는 객체가 자원을 얻고, 그 객체의 소멸자가 자원을 정리하게 만드는 설계입니다. 예를 들어 <code>std::vector<\/code>는 내부 배열을 얻고 자신이 사라질 때 자동으로 해제하므로 중간 <code>return<\/code>이나 예외가 있어도 정리가 빠지지 않습니다. 정리 시점이 무엇에 묶여 있는지 떠올려 보세요.","w":"RAII는 객체가 자원을 얻고 그 객체의 수명이 끝날 때 소멸자가 정리합니다. 중간 return·예외에도 정리가 빠지지 않습니다.","an":"91_selfstudy_memory · RAII가 직접 new/delete보다 안전한 이유","src":"RAII(Resource Acquisition Is Initialization)는 객체가 자원을 얻고, 그 객체의 수명이 끝날 때 소멸자가 자원을 정리하게 만드는 C++의 핵심 설계 방식입니다. `std::vector`는 내부 배열을 얻고 자신이 사라질 때 자동으로 해제하므로 중간 `return`이나 예외가 있어도 정리 코드가 빠지기 어렵습니다."},{"id":"t8-05","ty":"num","lv":3,"game":false,"p":"동적 센서 버퍼 {18.5, 21.0, 19.5, 22.0, 20.0}의 평균은?","a":20.2,"unit":"","h":"계산식은 평균 = (18.5 + 21.0 + 19.5 + 22.0 + 20.0) ÷ 5, 즉 합계를 원소 수로 나눈 값입니다. <code>sum_readings<\/code>가 포인터와 길이를 받아 합계를 구하고, 평균은 그 합계를 개수 5로 나눠 얻습니다. 먼저 다섯 샘플의 합계를 구한 뒤 나눠 보세요.","w":"합계 101을 5로 나눠 평균 20.2입니다. 최솟값은 18.5입니다.","an":"91_selfstudy_memory · 기대 결과","src":"| 1 `sum_readings` | 포인터와 길이를 받아 합계 `double`을 반환 | 입력 배열은 변경하지 않음 | null 또는 길이 0이면 `0.0`, 복사된 다섯 샘플이면 `101.0` |"},{"id":"t8-06","ty":"ox","lv":1,"game":true,"p":"참조는 <code>nullptr<\/code>를 가질 수 있고 다른 대상으로 재지정할 수 있다.","a":false,"h":"포인터 <code>T*<\/code>는 <code>nullptr<\/code>로 대상 없음을 표현할 수 있고 다른 주소로 재지정할 수 있습니다. 참조 <code>T&amp;<\/code>는 정상적이라면 항상 기존 객체를 가리키는 별칭이며, 초기화 뒤 다른 객체의 별칭으로 바뀌지 않습니다. 두 성질이 포인터와 참조 중 어느 쪽에 해당하는지 비교해 보세요.","w":"틀렸습니다. 정상적인 참조는 항상 객체를 가리키고 초기화 후 다른 대상으로 바뀌지 않습니다. 둘 다 가능한 것은 포인터입니다.","an":"91_selfstudy_memory · 2. 참조","src":"| 대상 없음 | `nullptr` 가능 | 정상적인 참조는 항상 객체를 가리킴 |\n| 다른 대상 가리키기 | 재지정 가능 | 초기화 후 다른 별칭으로 바뀌지 않음 |"},{"id":"t8-07","ty":"ox","lv":2,"game":true,"p":"<code>delete[]<\/code> 뒤 <code>nullptr<\/code> 대입은 같은 주소를 복사해 둔 다른 포인터까지 고쳐 주지 않는다.","a":true,"h":"포인터는 주소 비트만 저장할 뿐 그 주소에 살아 있는 객체가 있는지는 기록하지 않습니다. <code>nullptr<\/code> 대입은 그 포인터 변수 하나의 상태를 분명히 할 뿐입니다. 같은 주소를 복사해 둔 다른 포인터가 여전히 예전 주소를 담고 있을지 생각해 보세요.","w":"맞습니다. 해제된 배열의 모든 별칭은 더 이상 사용하면 안 됩니다.","an":"91_selfstudy_memory · 저장 공간과 객체 수명은 다르다","src":"포인터는 주소 비트를 저장하지만, 그 주소에 **살아 있는 객체가 있는지** 까지 기록하지 않습니다. `delete[]` 뒤에도 포인터 변수에는 예전 주소 숫자가 남을 수 있으나 배열 객체의 수명은 이미 끝났으므로 읽기·쓰기·두 번째 해제는 모두 유효하지 않습니다. `nullptr` 대입은 이 포인터 하나의 상태를 분명히 할 뿐, 같은 주소를 복사해 둔 다른 별칭을 고쳐 주지는 않습니다. 따라서 안전성을 판단할 때는 `null인가?`뿐 아니라 `누가 소유하는가?`, `대상이 아직 살아 있는가?`, `접근 길이가 맞는가?`를 함께 확인해야 합니다."},{"id":"t8-08","ty":"match","lv":2,"game":false,"p":"대표 수명 오류와 설명을 연결하세요.","pairs":[["memory leak","소유 포인터를 잃어 해제할 수 없음"],["dangling pointer","대상이 사라졌는데 주소만 남음"],["double delete","이미 해제한 메모리를 다시 해제"]],"h":"자료는 대표 수명 오류를 세 가지로 정리합니다. 해제할 수단(소유 포인터)을 잃어 메모리가 계속 남는 경우, 대상은 사라졌는데 주소만 남아 있는 경우, 이미 해제한 메모리를 다시 해제하거나 사용하는 경우입니다. '새는 것·매달린 것·두 번 지우는 것'으로 이름과 설명을 짝지어 보세요.","w":"누수는 해제 기회를 잃음, dangling은 사라진 대상을 가리킴, double delete는 두 번 해제입니다. 모두 정의되지 않은 동작으로 이어질 수 있습니다.","an":"91_selfstudy_memory · 5. 세 가지 대표 수명 오류","src":"- **memory leak:** 소유 포인터를 잃어 `delete`할 수 없게 됨\n- **dangling pointer:** 대상이 사라졌는데 주소만 남아 있음\n- **double delete / use-after-free:** 이미 해제한 메모리를 다시 해제하거나 사용"},{"id":"t8-09","ty":"order","lv":2,"game":false,"p":"sanitizer 보고서를 읽는 순서대로 정렬하세요.","steps":["첫 ERROR / runtime error 확인","READ·WRITE of size 확인","자신의 소스가 처음 나오는 위치 찾기","할당·해제 위치 비교"],"h":"sanitizer 보고서는 길기 때문에 위에서부터 네 부분을 찾습니다. 먼저 문제 종류를 알리는 첫 오류 줄, 다음은 잘못된 읽기인지 쓰기인지 알려 주는 줄, 그다음 stack trace에서 자신의 소스가 처음 나오는 위치입니다. 마지막으로 할당·해제 위치가 함께 나오면 수명 순서를 비교합니다.","w":"첫 오류로 종류를 알고, 읽기/쓰기를 구분하고, 자신의 소스 위치를 찾은 뒤, 할당·해제 위치를 비교합니다.","an":"91_selfstudy_memory · sanitizer 보고서를 읽는 순서","src":"1. 첫 `ERROR: AddressSanitizer` 또는 `runtime error:`가 문제 종류를 알려 줍니다.\n2. `READ of size ...` 또는 `WRITE of size ...`는 잘못된 읽기인지 쓰기인지 알려 줍니다.\n3. stack trace에서 `/workspace/03.C++/...cpp:줄`처럼 자신의 소스가 처음 나오는 위치를 찾습니다.\n4. 할당·해제 위치가 함께 나오면 같은 메모리의 수명 순서를 비교합니다."},{"id":"t8-10","ty":"multi","lv":2,"game":true,"p":"직접 <code>new<\/code>/<code>delete<\/code> 대신 우선 검토할 RAII 타입을 <b>모두<\/b> 고르세요.","o":["std::vector","std::unique_ptr","std::array","malloc","new[]"],"a":[0,1,2],"h":"자료는 실제 기능을 구현할 때 직접 <code>new[]<\/code>/<code>delete[]<\/code>를 쓰기보다 자원을 객체 수명에 묶는 표준 타입을 먼저 검토하라고 합니다. 여러 원소에는 동적 배열 컨테이너, 고정 길이에는 길이가 타입에 들어가는 배열, 단일 동적 객체의 독점 소유에는 스마트 포인터를 씁니다. 원시 포인터나 수동 해제가 필요한 선택지는 제외하세요.","w":"여러 원소는 vector, 고정 길이는 array, 단일 객체의 독점 소유는 unique_ptr를 먼저 검토합니다.","an":"91_selfstudy_memory · RAII가 직접 new/delete보다 안전한 이유","src":"실제 기능을 구현할 때는 먼저 `std::vector`, 고정 길이면 `std::array`, 단일 동적 객체의 독점 소유가 필요하면 `std::unique_ptr`를 검토하세요."}]},{"id":"t9","title":"CMake 빌드 시스템 (자습)","ref":"92_selfstudy_cmake","qs":[{"id":"t9-01","ty":"mc","lv":1,"game":true,"p":"라이브러리의 공개 헤더 include 경로를 <code>PUBLIC<\/code>으로 두는 이유는?","o":["라이브러리만 쓰므로","링크하는 앱·테스트도 필요","빌드 속도 향상","경고 끄기"],"a":1,"h":"<code>PUBLIC<\/code>은 이 target을 만들 때와 이 target을 사용하는 소비자 모두에게 설정이 필요할 때 씁니다. 라이브러리 공개 헤더는 <code>statistics.cpp<\/code>만 include하는 것이 아니라, 이를 링크하는 쪽에서도 include합니다. 공개 헤더를 읽어야 하는 쪽이 누구누구인지 생각해 보세요.","w":"라이브러리 자신뿐 아니라 링크하는 앱과 테스트도 그 헤더를 include해야 하므로 PUBLIC입니다.","an":"92_selfstudy_cmake · 3. 사용 요구사항과 PUBLIC/PRIVATE","src":"`statistics.cpp`뿐 아니라 이를 링크하는 앱과 테스트도 그 경로를 알아야 하므로 include 경로는 `PUBLIC`입니다."},{"id":"t9-02","ty":"mc","lv":2,"game":true,"p":"테스트 실행 파일만 만들고 <code>add_test<\/code>를 빠뜨리면?","o":["CTest가 테스트를 못 찾음","자동으로 등록됨","빌드 실패","링크 오류"],"a":0,"h":"테스트 실행 파일도 일반 target일 뿐이며, CTest에 '이 프로그램을 테스트로 실행하라'고 실행 방법을 등록하는 것은 <code>add_test<\/code>입니다. 등록이 없으면 빌드는 되어도 CTest 입장에서는 실행할 대상이 없습니다. 테스트가 0개로 끝나는 상황과 연결해 보세요.","w":"<code>add_test<\/code>를 빠뜨리면 CTest가 테스트를 찾지 못합니다. 0개 실행은 통과 증거가 아닙니다.","an":"92_selfstudy_cmake · 흔한 실수","src":"- 테스트 실행 파일만 만들고 `add_test`를 빠뜨린다. 이 경우 CTest는 테스트를 찾지 못합니다."},{"id":"t9-03","ty":"mc","lv":2,"game":true,"p":"이 target을 사용하는 소비자에게만 필요한 설정의 범위 키워드는?","o":["PRIVATE","PUBLIC","STATIC","INTERFACE"],"a":3,"h":"CMake의 범위 키워드는 설정이 누구에게 필요한지를 정합니다. <code>PRIVATE<\/code>는 이 target을 만들 때만, <code>PUBLIC<\/code>은 자신과 소비자 모두에게 필요합니다. 자신에게는 필요 없고 이 target을 사용하는 쪽에만 전달되는 세 번째 키워드를 떠올려 보세요.","w":"PRIVATE는 자신만, PUBLIC은 자신과 소비자, INTERFACE는 소비자에게만 필요한 설정입니다.","an":"92_selfstudy_cmake · 3. 사용 요구사항과 PUBLIC/PRIVATE","src":"- `PRIVATE`: 이 target을 만들 때만 필요\n- `INTERFACE`: 이 target을 사용하는 소비자에게만 필요\n- `PUBLIC`: 자신과 소비자 모두 필요"},{"id":"t9-04","ty":"mc","lv":2,"game":true,"p":"<code>median(std::vector&lt;double&gt; values)<\/code>가 벡터를 값으로 받는 이유는?","o":["속도 향상","복사본만 정렬해 원본 보존","예외 방지","링크 오류 방지"],"a":1,"h":"중앙값을 구하려면 값을 정렬해야 하지만, 호출자가 넘긴 벡터의 원래 순서는 유지해야 합니다. 그래서 <code>median<\/code>은 <code>const<\/code> 참조가 아니라 값으로 받아, 함수 안에서 별도의 벡터를 다룹니다. 정렬이 어느 벡터에 적용되는지 생각해 보세요.","w":"값으로 받은 복사본만 정렬하므로 호출자의 원래 순서가 유지됩니다.","an":"92_selfstudy_cmake · TODO 계약","src":"| `median` 구현 | 벡터를 **값으로 복사** 해 받아 중앙값 `double` 반환 | 함수 안의 복사본만 정렬되고 호출자의 원래 순서는 유지 |"},{"id":"t9-05","ty":"mc","lv":3,"game":true,"p":"{8, 3, 5, 4}의 중앙값은?","o":["5.0","4.0","3.5","4.5"],"a":3,"h":"중앙값은 먼저 값을 오름차순으로 정렬한 뒤 구합니다. 길이 n이 홀수이면 인덱스 <code>n/2<\/code>의 값, 짝수이면 인덱스 <code>n/2-1<\/code>과 <code>n/2<\/code> 두 값의 평균입니다. {8, 3, 5, 4}를 정렬하고 가운데 두 값의 평균 (a + b) ÷ 2를 계산해 보세요.","w":"정렬하면 {3, 4, 5, 8}이고 가운데 4와 5의 평균인 4.5입니다. 평균은 5.0입니다.","an":"92_selfstudy_cmake · TODO 계약","src":"**median:** 매개변수는 값으로 받은 복사본이므로 이를 정렬하고, 길이 n이 홀수이면 인덱스 `n/2`, 짝수이면 `n/2-1`과 `n/2`의 두 값 평균을 반환합니다."},{"id":"t9-06","ty":"ox","lv":1,"game":true,"p":"CTest가 오류 없이 끝났지만 테스트가 0개라면 통과 증거가 된다.","a":false,"h":"CTest가 오류 없이 끝났더라도 테스트가 0개라면 실제로 실행된 검사가 없습니다. 자료는 이때 테스트 활성화·등록과 빌드 디렉터리를 확인하라고 안내합니다. configure 성공은 설정 생성, build 성공은 산출물 생성일 뿐이고 실제 검사 성공은 그다음 단계입니다.","w":"틀렸습니다. 테스트 활성화·등록과 빌드 디렉터리를 확인해야 합니다.","an":"92_selfstudy_cmake · 이 실습은 무엇을 위한 것인가요?","src":"**질문:** CTest가 오류 없이 끝났는데 테스트가 0개라면?\n\n**설명:** 검사가 실행되지 않았으므로 통과 증거가 아닙니다. 테스트 활성화·등록과 빌드 디렉터리를 확인합니다. configure 성공은 설정 생성이고 build 성공은 산출물 생성이며 CTest의 실제 검사 성공이 다음 단계입니다."},{"id":"t9-07","ty":"ox","lv":2,"game":true,"p":"CMakeLists.txt에 새 target을 추가했다면 configure를 다시 실행한다.","a":true,"h":"configure는 <code>CMakeLists.txt<\/code>를 읽어 target 관계에 맞는 빌드 규칙(그래프)을 만들고, build는 그 규칙으로 컴파일·링크만 합니다. 새 target을 선언하면 빌드 그래프 자체가 바뀝니다. 자료는 report target 추가 뒤 어떤 단계를 다시 실행하라고 하는지 확인해 보세요.","w":"맞습니다. 새 target 선언 뒤에는 configure를 다시 실행해 빌드 그래프를 갱신합니다.","an":"92_selfstudy_cmake · 바로 아래 CMake TODO","src":"기존 앱·테스트 target은 유지합니다. 새 target 선언 뒤에는 configure를 다시 실행해야 합니다."},{"id":"t9-08","ty":"match","lv":2,"game":false,"p":"실패 위치와 먼저 확인할 것을 연결하세요.","pairs":[["configure","add_library·add_executable의 경로"],["library compile","include 경로와 구현 파일"],["link","target_link_libraries와 함수 서명"],["CTest","실패 테스트 출력과 구현 로직"]],"h":"오류 메시지에서 어떤 target을 만들던 중이었는지 보면 조사 범위가 줄어듭니다. configure 실패는 CMake 문법이나 없는 소스 경로, library compile은 헤더 검색과 구현, link는 선언과 정의 불일치나 연결 누락, CTest는 프로그램은 돌지만 계약을 만족하지 못한 경우입니다. 각 실패 원인에 맞는 확인 대상을 짝지어 보세요.","w":"configure는 경로·문법, compile은 include·구현, link는 연결·서명, CTest는 계약 불만족을 먼저 확인합니다.","an":"92_selfstudy_cmake · target 중심으로 오류 범위를 좁히기","src":"| 실패 위치 | 흔한 원인 | 먼저 확인할 선언 |\n|---|---|---|\n| configure | CMake 문법, 존재하지 않는 source 파일 | `add_library`, `add_executable`의 경로 |\n| library compile | 구현 문법·타입, 헤더 검색 | `target_include_directories`, 구현 파일 |\n| executable compile | main/report/test 자체의 오류 | 해당 target의 source와 include |\n| link | 선언과 정의 불일치, 라이브러리 연결 누락 | `target_link_libraries`, 함수 서명 |\n| CTest | 프로그램은 실행되지만 계약 불만족 | 실패 테스트 출력과 구현 로직 |"},{"id":"t9-09","ty":"order","lv":2,"game":false,"p":"CMake 프로젝트의 검증 흐름을 순서대로 정렬하세요.","steps":["CMakeLists 저장","configure로 그래프 생성","build로 컴파일·링크","앱 직접 실행","CTest로 등록된 테스트 실행"],"h":"CMake 흐름은 규칙 준비 → 실행물 생성 → 실행 → 테스트입니다. 파일을 저장한 뒤 configure가 빌드 그래프를 만들고, build가 라이브러리와 소비자를 컴파일·링크합니다. 그 뒤 앱을 직접 실행해 수치를 보고, 마지막으로 등록된 테스트를 실행합니다.","w":"저장 → configure → build → 앱 실행 → CTest 순서입니다. 각 단계의 성공은 다음 단계의 성공을 보장하지 않습니다.","an":"92_selfstudy_cmake · TODO 계약, 권장 순서","src":"흐름은 `CMakeLists 저장 → configure가 그래프 생성 → build가 라이브러리와 소비자를 컴파일·링크 → 앱 직접 실행 → CTest가 등록된 테스트 실행`입니다."},{"id":"t9-10","ty":"multi","lv":2,"game":true,"p":"include 경로 범위에 대한 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["PRIVATE: 이 target 빌드에만","PUBLIC: 자신과 소비자 모두","INTERFACE: 소비자에게만","PUBLIC: 소비자에게만","PRIVATE: 소비자에게만"],"a":[0,1,2],"h":"범위 키워드는 설정이 누구에게 전파되는지를 정합니다. 구현 파일만 필요한 설정은 이 target 빌드에만, 공개 헤더가 요구하는 설정은 자신과 소비자 모두에게, 자신은 쓰지 않고 사용하는 쪽에만 필요한 설정은 소비자에게만 전달됩니다. 각 키워드의 전파 범위를 정확히 맞게 설명한 보기를 고르세요.","w":"PRIVATE는 자신만, PUBLIC은 자신과 소비자, INTERFACE는 소비자에게만 사용 요구사항을 전달합니다.","an":"92_selfstudy_cmake · 3. 사용 요구사항과 PUBLIC/PRIVATE","src":"- `PRIVATE`: 이 target을 만들 때만 필요\n- `INTERFACE`: 이 target을 사용하는 소비자에게만 필요\n- `PUBLIC`: 자신과 소비자 모두 필요"}]}]};

const KEY='qb:'+BANK.id+':v1';

/* 순위 저장소 — 공유 순위로 바꿀 때 이 객체만 교체 */
// 순위는 같은 조건(게임 모드 + 풀이 시간)끼리만 비교한다. key = 'timeattack:10'
const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

/* ── 유틸 ──────────────────────────────── */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function say(msg){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=msg,30);}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('📋 클립보드에 복사했습니다');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'📋 클립보드에 복사했습니다':'복사하지 못했습니다. 인쇄 기능을 이용하세요.');
}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

/* ── 오답노트 ──────────────────────────── */
function addWrong(id,ans){const w=S.wrong[id]||{n:0};w.n++;w.last=ans;w.at=Date.now();w.solved=false;S.wrong[id]=w;}
function markSolved(id){if(S.wrong[id]&&!S.wrong[id].solved){S.wrong[id].solved=true;S.wrong[id].at=Date.now();}}
const wrongList=solved=>Object.keys(S.wrong).filter(id=>QMAP[id]&&!!S.wrong[id].solved===solved)
  .sort((a,b)=>QTAB[a].idx-QTAB[b].idx||ALLQ.indexOf(QMAP[a])-ALLQ.indexOf(QMAP[b]));

/* ── 문항 풀이 상태(학습·재도전 공용) ───── */
let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

function cardHTML(q,n){
  const [label,color]=TYPES[q.ty];
  const g=cur.graded, a=cur.ans[q.id], fa=finalAns(q), ok=g&&isCorrect(q,fa);
  const lock=g?' disabled':'';
  let body='';
  if(q.ty==='mc'||q.ty==='multi'){
    const multi=q.ty==='multi', mine=multi?(a||[]):[a];
    body='<div class="opts">'+q.o.map((o,i)=>{
      const right=multi?q.a.includes(i):q.a===i, picked=mine.includes(i);
      const cls=g?(right?' ans':picked?' miss':''):'';
      return `<label class="opt${cls}"><span class="onum">${i+1}</span><input type="${multi?'checkbox':'radio'}" name="r-${q.id}" data-act="${multi?'tick':'pick'}" data-q="${q.id}" data-i="${i}"${picked?' checked':''}${lock}><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(q.ty==='ox'){
    body='<div class="ox">'+[true,false].map(v=>{
      const cls=g?(q.a===v?' ans':a===v?' miss':''):'';
      return `<button type="button" class="${cls.trim()}" data-act="ox" data-q="${q.id}" data-v="${v?1:0}" data-fk="${q.id}-ox${v?1:0}" aria-pressed="${a===v}" aria-label="${v?'맞다 O':'틀리다 X'}"${lock}>${v?'O':'X'}</button>`;
    }).join('')+'</div>';
  }else if(q.ty==='match'){
    const m=a||{}, sel=cur.msel[q.id], linkedBy={};
    Object.entries(m).forEach(([l,r])=>linkedBy[r]=+l);
    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${PAL[i%PAL.length]})" data-act="ml" data-q="${q.id}" data-i="${i}" data-fk="${q.id}-l${i}"${lock}><span class="tag">${LETTER[i]}</span>${esc(p[0])}</button>`;
    }).join('');
    const right=cur.shuf[q.id].map(j=>{
      const by=linkedBy[j], linked=by!=null, cls=(linked?' linked':'')+(g&&linked?(by===j?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${linked?PAL[by%PAL.length]:'--line'})" data-act="mr" data-q="${q.id}" data-j="${j}" data-fk="${q.id}-r${j}"${lock}><span class="tag">${linked?LETTER[by]:''}</span>${esc(q.pairs[j][1])}</button>`;
    }).join('');
    body=`<div class="match"><div class="mcol mleft">${left}</div><div class="mcol mright">${right}</div></div>`;
  }else if(q.ty==='order'){
    const seq=a||[], full=seq.length===q.steps.length;
    body='<div class="olist">'+(cur.shuf[q.id]||range(q.steps.length)).map(si=>{
      const pos=seq.indexOf(si), on=pos>=0;
      const cls=(on?' on':'')+(g?(pos===si?' ok':' no'):'');
      const fix=g&&pos!==si?`<span class="ofix">정답 ${si+1}</span>`:'';
      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }
  const numAns=q.ty==='mc'?`${q.a+1}번 · `:q.ty==='multi'?q.a.map(i=>i+1).join('·')+'번 · ':'';
  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${mediaHTML(q)}${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>${voiceRow(q,q.id)}`}${body}${exp}</article>`;
}
const LV_NAME=['쉬움','보통','어려움'];
function lvHTML(lv){
  lv=lv||1;
  const dots=[1,2,3].map(k=>k<=lv?`<i class="d${k}">●</i>`:'<i class="off">○</i>').join('');
  return `<span class="lv lv${lv}" title="난이도 ${LV_NAME[lv-1]}"><span class="dots" aria-hidden="true">${dots}</span><em>${LV_NAME[lv-1]}</em></span>`;

// 자료 발췌: 이스케이프 후 마크다운 기호만 가볍게 서식으로 (**굵게**, `코드`, 머리 #)
const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
function hintHTML(q){
  if(!q.h)return '';
  const open=cur.hints.has(q.id), label=q.ty==='num'?'Hint · 계산식':'Hint';
  // 2단계: ① 자세한 힌트(h) ② 자료 보기 — 자료 원문 발췌(src) + 위치(an)
  const sopen=cur.srcs.has(q.id);
  const src=q.src?`<div class="srcwrap"><button type="button" class="srcbtn" data-act="src" data-q="${q.id}" data-fk="${q.id}-src" aria-expanded="${sopen}" aria-controls="src-${q.id}">`+
    `<span class="caret" aria-hidden="true">${sopen?'▾':'▸'}</span>📖 자료 보기</button>`+
    (sopen?`<blockquote class="src" id="src-${q.id}"><p>${srcText(q.src)}</p>${q.an?`<cite>${esc(q.an)}</cite>`:''}</blockquote>`:'')+`</div>`:'';
  return `<div class="hintwrap"><button type="button" class="hintbtn" data-act="hint" data-q="${q.id}" data-fk="${q.id}-hint" aria-expanded="${open}" aria-controls="hint-${q.id}">`+
    `<span class="caret" aria-hidden="true">${open?'▾':'▸'}</span>${label}</button>`+
    (open?`<div class="hint" id="hint-${q.id}">${q.h}${src}</div>`:'')+`</div>`;

function refreshCard(q){

const pad2=n=>String(n).padStart(2,'0');
const fmtCnt=(n,t)=>`(${pad2(n)}/${pad2(t)})`;
// 탭별 푼 문항 수: 지금 보는 탭 → 화면 상태, 그 외 → 풀던 답(drafts) → 채점 기록
function tabAnswered(t){

  const p=document.getElementById('pbar');if(!p||!cur)return;

/* ── 음성 선택 · 문제 읽기 · 그림/오디오 (qb-voice.js가 없으면 모두 숨김) ── */

const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
// 읽어 줄 글: 문제 + 화면에 보이는 순서의 보기("1번 …")
function readText(q,n,order){
  let t=(n?`${n}번 문제. `:'')+plain(q.p)+'.';

}
function readAloud(text){if(QBVoice.isSpeaking())QBVoice.cancelSpeak();else QBVoice.speak(text);}
// 음성으로 고른 것 = 보기를 직접 누른 것과 같은 경로(입력 click → 기존 change/click 처리)
function voicePick(q,r){
  if(!cur||cur.graded)return;
  const card=document.getElementById('card-'+q.id);if(!card)return;
  const el=r.kind==='ox'?card.querySelector(`[data-act="ox"][data-v="${r.v==='O'?1:0}"]`):card.querySelector(`input[data-i="${r.i}"]`);
  if(el&&!el.disabled)el.click();
}
function studyVoice(q){
  let c=VC.get(q.id);if(c)return c;
  const card=()=>document.getElementById('card-'+q.id);
  c=QBVoice.attach({bind:false,button:()=>card()&&card().querySelector('.vmic'),live:()=>card()&&card().querySelector('.vstat'),
    getOptions:()=>q.ty==='ox'?2:q.o.length,getType:()=>q.ty,select:r=>voicePick(q,r)});
  VC.set(q.id,c);return c;
}

/* ── 연속 음성 모드: 한 번 켜 두면 문제가 바뀌어도 마이크가 계속 켜져 있다 ──
   켜짐/꺼짐은 이 브라우저에 기억해 두므로 다음 문제은행·다음 문제에서도 다시 묻지 않는다(마이크 허용은 브라우저가 한 번만 묻는다). */
const VA={ctl:null,state:'off',msg:''};
const vaPref=()=>{try{return localStorage.getItem('qb:voice-auto')==='1';}catch(e){return false;}};
const vaSave=on=>{try{localStorage.setItem('qb:voice-auto',on?'1':'0');}catch(e){}};
const vaSup=q=>!!q&&['mc','multi','ox'].includes(q.ty);
function vaTarget(){   // 지금 음성으로 답할 문항
  if(G){const q=G.qs[G.i];return !G.locked&&vaSup(q)?{q,count:G.view.length,type:q.ty==='ox'?'ox':'mc'}:null;}
  if(cur&&!cur.graded&&cur.vi>=0){const q=cur.list[cur.vi];return vaSup(q)?{q,count:q.ty==='ox'?2:q.o.length,type:q.ty==='ox'?'ox':'mc'}:null;}
  return null;
}
function vaInit(){cur.vi=cur.list.findIndex(q=>vaSup(q)&&!answered(q));}
function vaMark(scroll){
  document.querySelectorAll('.vcur').forEach(e=>e.classList.remove('vcur'));
  if(G||!cur||cur.graded||cur.vi<0)return;
  const q=cur.list[cur.vi],c=q&&document.getElementById('card-'+q.id);
  if(!c)return;
  c.classList.add('vcur');
  if(scroll)c.scrollIntoView({block:'center',behavior:RM.matches?'auto':'smooth'});
}
function vaAdvance(){   // 다음 미응답 문항(뒤→앞 순서로 한 바퀴)으로 이동, 없으면 -1
  const L=cur.list,n=L.length,from=cur.vi;
  for(let d=1;d<=n;d++){const k=(from+d)%n;if(vaSup(L[k])&&!answered(L[k])){cur.vi=k;vaMark(true);vaStatus();return;}}
  cur.vi=-1;vaMark(false);
  VA.msg="모든 문항에 답했습니다. '채점'이라고 말하면 채점합니다.";vaApply();
}
function vaStatus(){
  if(G||!cur||cur.vi<0)return;
  const t=vaTarget(),card=document.getElementById('card-'+cur.list[cur.vi].id);
  if(t){VA.msg=`${card?card.dataset.n:cur.vi+1}번 문제 · ${t.type==='ox'?"'O' 또는 'X'":`1~${t.count}번`}로 말하세요${cur.list[cur.vi].ty==='multi'?" (모두 고르고 '다음')":''}`;vaApply();}
}
function vaApply(){
  const on=VA.ctl&&VA.ctl.want, bar=document.getElementById('vbar'), btn=document.getElementById('vaBtn');
  if(btn){btn.hidden=!hasVoice();btn.setAttribute('aria-pressed',String(!!on));btn.setAttribute('aria-label',on?'음성 모드 끄기':'음성 모드 켜기');}
  document.querySelectorAll('.vmic').forEach(b=>{b.dataset.state=on?(VA.state==='error'?'error':'listening'):'idle';b.setAttribute('aria-pressed',String(!!on));});
  if(bar){const show=on&&VA.state!=='off'&&(G||(cur&&!cur.graded));bar.hidden=!show;bar.dataset.state=VA.state;if(show)bar.textContent='🎙 '+(VA.msg||'듣는 중…');}
}
function vaCtl(){
  if(VA.ctl||!hasVoice())return VA.ctl;
  VA.ctl=QBVoice.auto({
    getTarget:()=>{const t=vaTarget();return t?{count:t.count,type:t.type}:null;},
    select:r=>{
      if(G){gameAnswer(r.kind==='ox'?(r.v==='O'?0:1):r.i);return;}
      const t=vaTarget();if(!t)return;
      voicePick(t.q,r);
      if(t.q.ty!=='multi')vaAdvance();else vaMark(false);
    },
    next:()=>{if(!G&&cur&&!cur.graded)vaAdvance();},
    submit:()=>{
      if(G){const q=G.qs[G.i];if(q&&q.ty==='multi')gameSubmit();}
      else if(cur&&!cur.graded)gradeSheet();
    },
    onState:(s,m)=>{VA.state=s;if(m!=null)VA.msg=m;vaApply();if(s==='listening'&&!m)vaStatus();}
  });
  return VA.ctl;
}
// 화면이 바뀔 때마다: 음성 모드가 켜져 있고 풀 문제가 있으면 듣기 유지/시작, 없으면 멈춤(설정은 유지)
function vaSync(){
  const c=vaCtl();if(!c){vaApply();return;}
  if(!G&&cur&&!cur.graded&&cur.vi===undefined)vaInit();
  const active=!!(G||(cur&&!cur.graded));
  if(vaPref()&&active){if(!c.want)c.start();else if(!G)vaStatus();}
  else if(c.want)c.stop();
  vaApply();vaMark(false);
}
function vaToggle(){
  const c=vaCtl();if(!c)return;
  const on=!vaPref();vaSave(on);
  if(on){
    toast('🎙 음성 모드 켜짐 · 문제가 바뀌어도 계속 듣습니다');
    const active=!!(G||(cur&&!cur.graded));
    if(active){if(!G&&cur.vi===undefined)vaInit();c.start();vaMark(true);vaStatus();}
  }else{c.stop();toast('음성 모드 꺼짐');}
  vaApply();
}

/* 학습 화면 상호작용 */
function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;
  else if(el.dataset.act==='tick'){
    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);
  }
  cur.armed=false;updateProgress();
}
function onSheetInput(el){
  if(el.dataset.act==='num'&&!cur.graded){cur.ans[el.dataset.q]=el.value;cur.armed=false;updateProgress();}
}

function viewStudy(tid,fresh){
  const tab=TABS.find(t=>t.id===tid)||TABS[0];
  cur=newSheet('study',tab.qs,tab);
  const rec=S.tabs[tab.id], draft=S.drafts[tab.id];
  if(fresh){delete S.drafts[tab.id];save();}
  else if(draft){Object.assign(cur.ans,JSON.parse(JSON.stringify(draft)));}  // 풀던 중이면 이어서
  else if(rec&&rec.answers){
    Object.assign(cur.ans,JSON.parse(JSON.stringify(rec.answers)));
    (rec.touched||[]).forEach(id=>cur.touched.add(id));
    cur.graded=true;
  }
  renderSheet();
}
function renderSheet(){
  voiceReset();
  const study=cur.mode==='study', tab=cur.tab;
  const tabbar=study?`<nav class="tabbar noprint" role="tablist" aria-label="탭">${TABS.map((t,i)=>{const r=S.tabs[t.id];

    ${cur.graded?`<button class="btn" type="button" data-act="onlywrong">${cur.onlyWrong?'전체 보기':'오답만 보기'}</button>`:''}
    ${study?'<button class="btn" type="button" data-act="retab">다시 풀기</button>':''}
    ${next}
  </div></div>`;

  if(on)on.parentElement.scrollLeft=on.offsetLeft-on.parentElement.offsetLeft-16;

}
function sheetResultHTML(){
  const n=cur.list.length, score=cur.list.filter(q=>isCorrect(q,finalAns(q))).length, p=pct(score,n);
  const msg=p===100?'만점입니다! 🎉':p>=80?'잘했어요. 틀린 문항의 해설과 자료 위치를 확인하세요.':p>=60?'절반 이상 이해했어요. 오답노트로 다시 풀어 보세요.':'자료를 한 번 더 읽고 다시 풀어 보세요.';
  return `<div class="panel"><div class="score">${score}<small> / ${n} · ${p}%</small></div><p class="msg">${msg}</p>
    ${cur.mode==='study'&&gameUnlocked()?'<a class="btn" href="#game">⚡ 게임 모드 도전</a>':''}</div>`;
}
function gradeSheet(){
  const miss=cur.list.map((q,i)=>answered(q)?0:i+1).filter(Boolean);
  if(miss.length&&!cur.armed){
    cur.armed=true;
    document.getElementById('warn').textContent=`미응답 ${miss.length}문항 (Q${miss.join(', Q')}). 한 번 더 누르면 미응답은 오답으로 채점합니다.`;
    return;
  }
  const firstUnlock=!gameUnlocked();
  cur.graded=true;
  const snap={};let score=0;
  cur.list.forEach(q=>{
    const a=finalAns(q);
    if(a!=null)snap[q.id]=a;
    if(isCorrect(q,a)){score++;markSolved(q.id);}
    else addWrong(q.id,answerText(q,a));
  });
  if(cur.mode==='study'){
    S.tabs[cur.tab.id]={score,total:cur.list.length,answers:snap,touched:[...cur.touched],at:Date.now()};
    delete S.drafts[cur.tab.id];
  }
  save();
  renderSheet();
  window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
  say(`채점 결과 ${score}점, ${cur.list.length}문항 중`);
  if(cur.mode==='study'&&firstUnlock)setTimeout(()=>toast('⚡ 게임 모드와 해설지가 열렸습니다!'),300);
  else if(cur.mode==='study'&&allGraded())setTimeout(()=>toast('★ 모든 탭 완료! 종합 결과를 확인하세요.'),300);
}

function gamePool(scope){
  const M=GAME_MODES[gameSetup.mode];
  const base=ALLQ.filter(q=>q.game&&!q.audio&&M.types.includes(q.ty));  // 오디오 문항은 제한시간 안에 들을 수 없어 제외
  if(scope==='played')return shuffle(base.filter(q=>S.tabs[QTAB[q.id].id]));
  if(scope==='wrong'){const w=new Set(wrongList(false));return shuffle(base.filter(q=>w.has(q.id))).concat(shuffle(base.filter(q=>!w.has(q.id))));}
  return shuffle(base);
}

function startGame(){
  const pool=gamePool(gameSetup.scope).slice(0,gameSetup.count);
  if(!pool.length){toast('출제할 문항이 없습니다.');return;}
  G={qs:pool,i:0,score:0,combo:0,maxCombo:0,results:[],locked:false,mode:gameSetup.mode,time:gameSetup.time};

}
function renderGameQ(){
  voiceReset();
  const q=G.qs[G.i];
  G.locked=false;G.elapsed=0;G.last=performance.now();G.limit=G.time*1000;G.warned=false;G.pick=[];
  G.view=q.ty==='ox'?[true,false]:shuffle(range(q.o.length));
  const opts=q.ty==='ox'
    ?`<div class="gox">${G.view.map((v,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}" aria-label="${v?'O 맞다':'X 틀리다'}">${v?'O':'X'}</button>`).join('')}</div>`
    :`<div class="gopts">${G.view.map((oi,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}"${q.ty==='multi'?' aria-pressed="false"':''}><kbd>${k+1}</kbd><span>${esc(q.o[oi])}</span></button>`).join('')}</div>`;
  app.innerHTML=`
  <div class="game play">
    <div class="gtop"><div class="hud"><span>${G.i+1} / ${G.qs.length}</span><span class="combo${G.combo>=3?' hot':''}">🔥 콤보 ${G.combo}</span><span class="pts">${G.score.toLocaleString()}점</span></div>

    <div class="gsub"><button class="btn" type="button" data-act="gquit">그만하기</button>
      ${q.ty==='multi'?'<button class="btn primary" type="button" data-act="gsubmit">제출 (Enter)</button>':''}</div></div>
  </div>`;
  vaSync();
  G.raf=requestAnimationFrame(tick);
}
function tick(now){
  if(!G||G.locked)return;
  G.elapsed+=now-G.last;G.last=now;
  const rem=Math.max(0,G.limit-G.elapsed), ratio=rem/G.limit;
  const shown=RM.matches?Math.ceil(rem/1000)*1000/G.limit:ratio;
  const bar=document.getElementById('tbar'), tm=document.getElementById('timer');
  if(bar){bar.style.width=(Math.min(1,shown)*100)+'%';tm.className='timer'+(ratio<.25?' lo':ratio<.5?' mid':'');
    document.getElementById('tleft').textContent=(rem/1000).toFixed(1)+'초';}
  if(!G.warned&&rem<=5000){G.warned=true;say('5초 남았습니다');}
  if(rem<=0){judge(null,true);return;}
  G.raf=requestAnimationFrame(tick);
}
function judge(ans,timeout){
  if(!G||G.locked)return;
  G.locked=true;cancelAnimationFrame(G.raf);
  const q=G.qs[G.i], used=Math.min(G.elapsed,G.limit), ok=!timeout&&isCorrect(q,ans);
  let gain=0;
  if(ok){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const mult=G.combo>=5?1.5:G.combo>=3?1.2:1;
    gain=Math.round((100+Math.floor((G.limit-used)/100))*mult);G.score+=gain;}
  else G.combo=0;
  G.results.push({id:q.id,ok,ans,timeout,ms:used,gain});
  // 판정 표시
  app.querySelectorAll('[data-act="gans"]').forEach(b=>{
    const k=+b.dataset.k, v=G.view[k];
    const right=q.ty==='ox'?q.a===v:q.ty==='mc'?q.a===v:q.a.includes(v);
    const picked=q.ty==='ox'||q.ty==='mc'?ans===v:(ans||[]).includes(v);
    if(right)b.classList.add('ans');else if(picked)b.classList.add('miss');
    b.disabled=true;
  });
  const f=document.getElementById('gfloat');
  f.className='gfloat pop '+(ok?'ok':'no');
  f.textContent=ok?`+${gain}${G.combo>=3?` 🔥×${G.combo>=5?'1.5':'1.2'}`:''}`:timeout?'⏰ 시간 초과':'✗ 오답';
  if(timeout){const tm=document.getElementById('timer');tm&&tm.classList.add('out');}
  const sb=app.querySelector('[data-act="gsubmit"]');if(sb)sb.disabled=true;
  app.querySelector('.pts').textContent=G.score.toLocaleString()+'점';
  const c=app.querySelector('.combo');c.textContent='🔥 콤보 '+G.combo;c.classList.toggle('hot',G.combo>=3);
  G.next=setTimeout(()=>{if(!G)return;G.i++;G.i<G.qs.length?renderGameQ():finishGame();},ok?900:1400);
}
function gameAnswer(k){
  if(!G||G.locked)return;
  const q=G.qs[G.i];if(k<0||k>=G.view.length)return;
  if(q.ty==='multi'){
    const v=G.view[k], i=G.pick.indexOf(v);
    i<0?G.pick.push(v):G.pick.splice(i,1);
    const b=app.querySelector(`[data-act="gans"][data-k="${k}"]`);b&&b.setAttribute('aria-pressed',i<0);
  }else judge(G.view[k],false);
}
function gameSubmit(){if(G&&!G.locked&&G.qs[G.i].ty==='multi')judge(G.pick.slice(),false);}
function stopGame(){if(G){cancelAnimationFrame(G.raf);clearTimeout(G.next);G=null;}}
function finishGame(){
  const R=G.results, correct=R.filter(r=>r.ok).length, M=GAME_MODES[G.mode];
  R.forEach(r=>{const q=QMAP[r.id];if(r.ok)markSolved(r.id);else addWrong(r.id,r.timeout?'(시간 초과)':answerText(q,r.ans));});

  const wrong=R.filter(r=>!r.ok);
  G=null;vaSync();
  setTopScore(`⚡ 게임 ${rec.score.toLocaleString()}점 <small>정답 ${correct}/${R.length}</small>`);

      <div class="bignum"><div><b>${correct}/${rec.total}</b><span>정답</span></div><div><b>${rec.rate}%</b><span>정답률</span></div><div><b>${rec.avg}초</b><span>평균 응답</span></div><div><b>${rec.combo}</b><span>최고 콤보</span></div></div>
    </div>
    <div class="panel"><h2 class="ph">🏆 순위 · ${M.title.replace(/^\S+\s/,'')} ${rec.time}초 · 이 브라우저 기록</h2>
      <table class="board"><thead><tr><th>#</th><th>이름</th><th class="r">점수</th><th class="r">정답률</th><th class="r">정답</th><th class="r">날짜</th></tr></thead>
      <tbody>${top.map(row).join('')}${rank>10&&mine?row(mine,rank-1):''}</tbody></table></div>
    ${wrong.length?`<details class="more panel"><summary>틀린 문항 ${wrong.length}개 · 해설 보기 (오답노트에 저장됨)</summary>
      ${wrong.map(r=>{const q=QMAP[r.id];return `<div class="keyitem"><div class="kq">${q.p}</div><p class="mine" style="margin:4px 0">내 답: ${esc(r.timeout?'(시간 초과)':answerText(q,r.ans))}</p><p class="ka">정답: ${esc(correctText(q))}</p><p class="kw">${q.w}</p><span class="an">📖 ${esc(q.an)}</span></div>`;}).join('')}</details>`:''}
    <div class="actions"><button class="btn primary" type="button" data-act="gagain">↻ 다시 하기</button><a class="btn" href="#notes">📒 오답노트</a><a class="btn" href="#home">홈</a></div>
  </div>`;
}
