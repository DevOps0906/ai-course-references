'use strict';
const BANK={"id":"pai-vla","code":"PVA","title":"Physical AI 5일차 · 학습된 VLA 정책과 시뮬레이션","subtitle":"VLA 원리·행동 묶음 · 시뮬레이션 추론·폐루프 · 조건별 평가와 자습","course":"07 · Physical AI","source":"07-NEPES_physicalAI_자율주행자동차/10.VLA_v2/*.ipynb + 5일차 슬라이드 v2","salt":"pai-vla","version":1,"updated":"2026-10-15","tabs":[{"id":"t1","title":"VLA 원리와 행동 묶음","ref":"01 · p.6–23","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"VLA 정책이 입력으로 받는 세 가지 정보는?","o":["텍스트·좌표·속도","영상·음성·지도","영상·언어·로봇 상태","좌표·FOLLOW·STOP"],"a":2,"h":"VLA 정책은 물체가 보이는 카메라 영상(Vision), 수행할 과제 지시(Language), 그리고 로봇의 현재 자세와 그리퍼 상태(State)를 함께 입력받습니다. 이 세 입력에서 이동·회전·그리퍼를 제어할 수치(Action)를 출력합니다.","w":"VLA는 카메라 영상(Vision), 작업 지시(Language), 로봇의 현재 자세·그리퍼 상태(State)를 받아 행동(Action)을 출력합니다.","an":"5일차 슬라이드 v2 · 01 무엇을 보고 어떤 행동을 출력할까요 (p.10)","src":"● Vision: 물체·로봇이 보이는 카메라 영상\n● Language: “검은 그릇을 접시 위에 놓아라”\n● State: 로봇의 현재 자세와 그리퍼 상태\n● Action: 이동·회전·그리퍼를 제어할 수치"},{"id":"t1-02","ty":"mc","lv":2,"game":true,"p":"이번 실습 정책이 한 번에 출력하는 행동 묶음의 형태는?","o":["50시점 × 행동 값 7개","10시점 × 행동 값 8개","1시점 × FOLLOW/STOP","50시점 × 상태 값 8개"],"a":0,"h":"이번 수업의 정책은 미래 시점 50개에 대해, 한 시점마다 이동3·회전3·그리퍼1의 행동 성분을 묶어 한 번에 예측합니다. 50은 시간 방향의 길이이고 나머지 축은 한 시점의 행동 성분 수입니다.","w":"SmolVLA는 미래 50시점 각각에 대해 행동 값 7개(이동3·회전3·그리퍼1)를 예측합니다. 상태 8개와 혼동하지 않습니다.","an":"5일차 슬라이드 v2 · 01 50개를 예측해도 먼저 10개만 실행 (p.14)","src":"이번 수업의 정책은 **50시점×7개 값** 을 예측합니다. 50은 시간 방향의 길이이고, 7은 한 시점의 행동 성분 수입니다. 로봇 50대나 관절 50개라는 뜻이 아닙니다."},{"id":"t1-03","ty":"num","lv":2,"game":false,"p":"정책이 행동 50개를 예측하고 기본 설정대로 앞 10개만 실행했습니다. 새 관측으로 다시 예측하면서 버려지는(교체되는) 남은 예측은 몇 개인가요?","a":40,"unit":"개","h":"정책은 미래 행동 50개를 예측하지만 기본 실행은 앞 10개만 적용한 뒤 새로 관측합니다. 교체되는 예측 수 = 예측 길이(50) − 실행한 행동 수(10)로 구하며, 남은 예측은 이어서 실행하지 않고 새 묶음으로 바꿉니다.","w":"50 − 10 = 40개입니다. 앞 10개를 실행한 뒤에는 남은 40개 대신 최신 관측으로 새 50개를 예측합니다.","an":"5일차 슬라이드 v2 · 01 50개를 예측해도 먼저 10개만 실행 (p.14)","src":"50은 예측하는 미래 행동 수, 10은 재관측 전 실행할 행동 수입니다.\n앞 10개 실행 → 새 관측 → 새 50개 예측: 이전의 남은 40개를 교체합니다."},{"id":"t1-04","ty":"mc","lv":2,"game":true,"p":"행동 표현의 두 기준(토큰/연속값, 한 시점/여러 시점)의 관계는?","o":["토큰은 한 시점만 표현","서로 독립적인 기준","연속값은 여러 시점 불가","같은 기준의 다른 이름"],"a":1,"h":"행동 표현은 '토큰이냐 연속값이냐'라는 표현 방식과 '한 시점이냐 여러 시점이냐'라는 시간 범위로 나눠 볼 수 있습니다. 자료는 토큰 방식도 여러 시점 행동을 표현할 수 있다고 설명하므로, 한 기준이 다른 기준을 결정하지 않습니다.","w":"표현 방식(토큰·연속값)과 시간 범위(한 시점·여러 시점)는 서로 독립입니다. 이번 실습은 '여러 시점의 연속값'을 예측합니다.","an":"5일차 슬라이드 v2 · 01 행동 표현과 행동 묶음은 서로 다른 기준 (p.11)","src":"표현 방식: 토큰 또는 연속값 / 시간 범위: 한 시점 또는 여러 시점\n두 기준은 독립적입니다. 토큰 방식도 여러 시점 행동을 표현할 수 있습니다."},{"id":"t1-05","ty":"mc","lv":2,"game":true,"p":"5일차 실습에서 하지 <b>않는<\/b> 것은?","o":["체크포인트로 가상 로봇 실행","관측→행동→재관측 추적","정책의 추가 학습(재학습)","실행 완료와 성공 구분"],"a":2,"h":"학습은 시연 데이터로 모델 가중치를 바꾸는 단계이고, 추론은 그 가중치로 행동을 계산하는 단계입니다. 오늘은 배포된 LIBERO용 체크포인트로 추론만 하며, 새 행동을 실행해도 자동으로 재학습하지 않습니다.","w":"5일차는 배포된 체크포인트로 행동을 계산하는 추론 실습입니다. 새 행동을 실행해도 가중치를 자동으로 다시 학습하지 않습니다.","an":"5일차 슬라이드 v2 · 01 오늘의 목표 · 시연을 학습하고 정책으로 실행 (p.6, p.12)","src":"학습은 모델의 가중치를 바꾸고, 추론은 그 가중치로 행동을 계산합니다.\n오늘은 배포된 정책을 사용하며 새 행동을 실행해도 자동 재학습하지 않습니다."},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"폐루프는 실행 중에 정책 가중치를 계속 학습하는 과정이다.","a":false,"h":"폐루프는 행동을 일부 실행한 뒤 바뀐 장면을 새로 관측하고, 그 관측으로 다시 추론해 다음 행동을 얻는 반복입니다. 이때 정책의 가중치는 고정되어 있으며 실행 중 가중치를 학습하는 것과는 구분됩니다.","w":"틀렸습니다. 폐루프는 새 관측으로 추론을 반복하는 과정이며, 가중치는 고정되어 있습니다.","an":"5일차 슬라이드 v2 · 01 행동한 뒤 다시 보는 이유: 폐루프 (p.13)","src":"학습이 끝난 체크포인트에 현재 입력을 넣어 행동을 얻는 것을 **추론(inference)** 이라고 합니다. 이번 수업은 이 추론을 사용하며, 실행할 때마다 모델 파라미터를 다시 학습하지 않습니다."},{"id":"t1-07","ty":"ox","lv":2,"game":true,"p":"50×7 행동 배열이 출력되었다면 작업에 성공한 것이다.","a":false,"h":"VLA가 영상·언어·상태에서 행동 묶음을 예측해 배열이 출력되었다는 것은 추론이 동작했다는 뜻일 뿐입니다. 그릇이 실제로 접시 위에 놓였는지 같은 작업 성공은 행동을 환경에 적용한 뒤 별도로 확인해야 합니다.","w":"틀렸습니다. 출력 배열이 있다는 것과 작업 성공은 다릅니다. 성공 여부는 환경의 판정과 영상으로 따로 확인합니다.","an":"5일차 슬라이드 v2 · 01 완성 코드로 확인하기 (p.16)","src":"VLA는 영상·언어·상태에서 행동 묶음을 예측합니다. 출력 배열이 존재한다는 것과 작업에 성공했다는 것은 다릅니다."},{"id":"t1-08","ty":"match","lv":2,"game":false,"p":"VLA의 네 요소와 예시를 연결하세요.","pairs":[["Vision","물체·로봇이 보이는 카메라 영상"],["Language","'검은 그릇을 접시 위에 놓아라'"],["State","로봇의 현재 자세와 그리퍼 상태"],["Action","이동·회전·그리퍼를 제어할 수치"]],"h":"V는 장면을 보는 카메라 영상, L은 '무엇을 하라'는 과제 지시 문장, State는 로봇이 지금 어떤 자세이고 그리퍼가 어떤 상태인지에 대한 정보입니다. Action은 정책이 출력하는 값으로, 제어기에 넘길 이동·회전·그리퍼 수치입니다.","w":"Vision·Language·State가 입력이고 Action이 출력입니다. 같은 영상이라도 지시가 다르면 다른 행동이 필요합니다.","an":"5일차 슬라이드 v2 · 01 무엇을 보고 어떤 행동을 출력할까요 (p.10)","src":"● Vision: 물체·로봇이 보이는 카메라 영상\n● Language: “검은 그릇을 접시 위에 놓아라”\n● State: 로봇의 현재 자세와 그리퍼 상태\n● Action: 이동·회전·그리퍼를 제어할 수치"},{"id":"t1-09","ty":"order","lv":2,"game":false,"p":"VLA가 행동한 뒤 다시 보는 폐루프 순서를 맞추세요.","steps":["영상·지시·상태를 정책에 입력","가중치가 고정된 정책이 행동 묶음 예측","제어기·환경에 앞부분 행동 적용","로봇·물체의 상태 변화","새 관측을 다시 정책에 입력"],"h":"폐루프는 영상·지시·상태를 정책에 넣는 것에서 시작해, 가중치가 고정된 정책이 미래 행동 묶음을 예측하고, 제어기가 그 앞부분을 환경에 적용하는 흐름입니다. 그 결과 로봇과 물체가 움직이고, 바뀐 장면이 새 관측으로 다시 정책 입력이 됩니다.","w":"관측 → 정책(가중치 고정) → 행동 묶음 → 앞부분 적용 → 상태 변화 → 새 관측 순서로 반복합니다.","an":"5일차 슬라이드 v2 · 01 행동한 뒤 다시 보는 이유: 폐루프 (p.13)","src":"1. 영상·지시·상태\n정책 입력\n2. 학습된 정책\n가중치 고정\n3. 행동 묶음\n미래 행동 예측\n4. 제어기 ·환경\n앞부분 적용\n5. 상태 변화\n로봇·물체 이동\n6. 새 관측\n다시 정책 입력"},{"id":"t1-10","ty":"multi","lv":2,"game":true,"p":"새 로봇에서 정책이 바로 잘 움직이지 않을 수 있는 이유로 자료가 든 것을 <b>모두<\/b> 고르세요.","o":["학습 때와 다른 카메라 시점","상태 순서·행동 단위 불일치","정규화 통계 불일치","저장 영상이 20fps라서","파일 이름이 길어서"],"a":[0,1,2],"h":"정책은 학습한 로봇·작업·카메라 조건의 영향을 받으므로, 이미지 크기만 맞춘다고 입력의 의미까지 같아지지는 않습니다. 카메라 시점, 상태 값의 순서, 행동 좌표계와 단위, 정규화 기준이 학습 때와 함께 맞아야 합니다.","w":"정책은 학습한 로봇·카메라 조건의 영향을 받으며 상태 순서·행동 단위·정규화도 맞아야 합니다. 영상 fps나 파일 이름은 원인이 아닙니다.","an":"5일차 슬라이드 v2 · 01 새 로봇에서 바로 잘 움직이지 않는 이유 (p.15)","src":"● 학습한 로봇·작업·카메라 조건의 영향을 받습니다.\n● 상태 순서·행동 단위·정규화도 맞아야 합니다.\n● 이번 수업은 LIBERO용 정책과 환경을 함께 사용합니다.\n● 모델 로드 → 추론 → 작업 성공을 따로 확인합니다.\n15 / 128 · 10.VLA_v2/01_vla_theory.ipynb\n함께 이해하기\n사진 크기만 맞아도 입력의 의미가 다를 수 있습니다.\n카메라 시점·상태 순서·행동 좌표계·단위·정규화를 함께 맞춰야 합니다."}]},{"id":"t2","title":"시뮬레이션 스택과 실행 모드","ref":"02 · p.24–38","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"작업 장면·초기 배치·성공 조건을 정하는 도구는?","o":["MuJoCo","SmolVLA","LIBERO","noVNC"],"a":2,"h":"네 도구는 역할을 나눠 맡습니다. 물리 계산은 MuJoCo, 관측·정책·행동 연결은 LeRobot과 수업 코드, 행동 예측은 SmolVLA가 담당하고, 남은 하나가 과제 장면·초기 배치·성공 조건을 정하는 과제 모음 도구입니다.","w":"LIBERO는 과제·초기 배치·성공 조건을 정합니다. MuJoCo는 물리·영상, SmolVLA는 행동 예측을 맡습니다.","an":"5일차 슬라이드 v2 · 02 네 도구는 가상 로봇 실습을 나누어 맡습니다 (p.24, p.27)","src":"● MuJoCo: 움직임·접촉 계산과 가상 영상 생성\n● LIBERO: 작업 장면·초기 배치·성공 조건\n● LeRobot + 수업 코드: 관측·정책·행동 연결\n● SmolVLA: 관측과 지시로 다음 행동 묶음 예측\n24 / 128 · 10.VLA_v2/02_simulation_stack.ipynb\n함께 이해하기\n그릇을 접시에 놓기: LIBERO가 과제·성공 조건을 정합니다."},{"id":"t2-02","ty":"mc","lv":1,"game":true,"p":"움직임·접촉 계산과 가상 카메라 영상 생성을 맡는 도구는?","o":["MuJoCo","LIBERO","LeRobot","SmolVLA"],"a":0,"h":"가상 로봇 실습에서 로봇·물체의 움직임과 접촉을 계산하고 가상 카메라 영상을 렌더링하는 것은 물리 엔진의 역할입니다. 과제 정의(LIBERO), 연결(LeRobot), 행동 예측(SmolVLA)과는 구분됩니다.","w":"MuJoCo가 로봇·물체·접촉 상태를 계산하고 가상 영상을 만듭니다.","an":"5일차 슬라이드 v2 · 02 네 도구의 책임 (p.24, p.32)","src":"● MuJoCo: 움직임·접촉 계산과 가상 영상 생성\n● LIBERO: 작업 장면·초기 배치·성공 조건\n● LeRobot + 수업 코드: 관측·정책·행동 연결\n● SmolVLA: 관측과 지시로 다음 행동 묶음 예측"},{"id":"t2-03","ty":"mc","lv":2,"game":true,"p":"inspect·infer·rollout 중 env.step과 재관측이 나타나는 모드는?","o":["inspect","infer","세 모드 모두","rollout"],"a":3,"h":"inspect는 초기 장면·영상·상태만 확인하고, infer는 관측에서 행동 묶음이 나오는지까지만 확인합니다. 행동을 env.step으로 실제 환경에 적용하고 새 관측을 받는 반복은 세 모드 중 확인 범위가 가장 넓은 모드에서만 일어납니다.","w":"inspect는 초기 장면 저장까지, infer는 예측 저장까지 합니다. 행동 적용(env.step)과 재관측은 rollout에서만 반복됩니다.","an":"5일차 슬라이드 v2 · 02 inspect → infer → rollout (p.30, p.33)","src":"● inspect: 초기 장면·두 영상·상태를 확인\n● infer: 관측에서 행동 묶음이 나오는지 확인\n● rollout: 행동 실행과 재관측을 반복"},{"id":"t2-04","ty":"mc","lv":2,"game":true,"p":"task와 seed를 유지하고 initial_state만 바꾸면 무엇을 비교하게 되나요?","o":["난수 경로","초기 배치","모델 버전","카메라 해상도"],"a":1,"h":"LIBERO 설정에서 task는 수행할 작업, initial_state는 준비된 초기 배치 번호, seed는 난수 설정입니다. 다른 두 요인을 고정하고 initial_state만 바꾸면 물체가 시작하는 배치의 차이만 비교하게 됩니다.","w":"initial_state는 물체가 시작할 배치를 고르는 번호이므로, 나머지를 고정하면 초기 배치의 영향만 비교할 수 있습니다.","an":"5일차 슬라이드 v2 · 02 LIBERO는 무엇을 성공으로 볼지도 정합니다 (p.27)","src":"task: 수행할 작업 / initial_state: 준비된 초기 배치 / seed: 난수 설정\n배치만 비교하려면 task와 seed를 유지하고 initial_state만 바꿉니다."},{"id":"t2-05","ty":"mc","lv":3,"game":true,"p":"run_episode의 result가 처음 시작할 때 가지는 status 값은?","o":["completed","error","incomplete","success"],"a":2,"h":"run_episode의 result는 처음에 '아직 끝나지 않음'을 뜻하는 상태로 시작합니다. 정상 범위가 끝나야 completed로 바뀌고, 예외가 나면 error와 함께 처음 상태가 그대로 보존됩니다.","w":"result는 incomplete로 시작해 정상 완료 시 completed로 바뀝니다. 예외가 나면 error와 함께 incomplete가 보존됩니다.","an":"5일차 슬라이드 v2 · 02 코드 추적: 공통 준비와 finally (p.34)","src":"result는 처음 incomplete로 시작합니다. 정상 범위가 끝나면 completed로 바뀌고 예외가 발생하면 error와 함께 incomplete가 보존됩니다."},{"id":"t2-06","ty":"ox","lv":1,"game":true,"p":"저장 영상의 fps(예: 20fps)는 정책의 판단 속도를 뜻한다.","a":false,"h":"물리 계산 스텝, 정책 추론 시간, 저장 영상의 재생 fps는 서로 다른 시간 개념입니다. fps는 저장한 프레임을 초당 몇 장으로 재생할지 정한 값일 뿐이고, 이번 실행기는 추론하는 동안 환경을 멈추는 동기 방식이므로 판단 횟수와 연결되지 않습니다.","w":"틀렸습니다. 저장 영상의 fps는 재생 속도이며 정책의 판단 속도나 실시간 성능이 아닙니다.","an":"5일차 슬라이드 v2 · 02 그림 생성·행동 추론·영상 재생은 별개 (p.26)","src":"| 저장 영상 fps | 저장한 프레임을 초당 몇 장으로 재생할지 정한 값 |\n\n이번 실행기는 **정책을 계산하는 동안 다음 환경 스텝을 진행하지 않는 동기 방식** 입니다."},{"id":"t2-07","ty":"ox","lv":2,"game":true,"p":"행동 묶음마다 초기 배치로 reset하면 과제가 계속 처음으로 돌아간다.","a":true,"h":"교재 실행기는 처음 한 번만 LIBERO reset으로 과제와 초기 배치를 정하고, 이후에는 행동 적용 → 재관측을 이어 갑니다. 만약 행동 묶음을 실행할 때마다 reset을 넣으면 로봇이 진행한 결과가 지워져 매번 시작 장면으로 되돌아갑니다.","w":"맞습니다. 그래서 실행기는 행동 묶음마다 reset하지 않고 새 관측으로 이어서 추론합니다.","an":"5일차 슬라이드 v2 · 02 직접 수정할 때 확인할 지점 (p.25, p.37)","src":"| 직접 구현·수정할 때 | 행동 묶음마다 reset하면 과제가 계속 처음으로 돌아갑니다."},{"id":"t2-08","ty":"match","lv":2,"game":false,"p":"네 도구와 맡은 역할을 연결하세요.","pairs":[["MuJoCo","물리 상태 변화와 렌더링"],["LIBERO","과제·초기 배치·성공 조건"],["LeRobot + 수업 코드","관측·정책·행동 연결"],["SmolVLA","입력에서 행동 묶음 예측"]],"h":"MuJoCo는 물리 시뮬레이션과 장면 렌더링, LIBERO는 어떤 물체를 어떻게 다룰지 과제·초기 상태·성공 조건을 제공합니다. LeRobot과 수업 코드는 환경과 정책 사이의 입력·출력을 맞추고, SmolVLA는 관측에서 행동 묶음을 예측하는 정책입니다.","w":"역할을 분리해 두면 오류가 난 위치를 찾기 쉽습니다. SmolVLA는 성공 판정기를 대체하지 않습니다.","an":"5일차 슬라이드 v2 · 02 네 도구의 책임 (p.32)","src":"- MuJoCo: 물리 상태 변화와 렌더링\n- LIBERO: 과제·초기 배치·성공 조건\n- LeRobot: 환경·정책·전후처리 연결\n- SmolVLA: 입력에서 행동 묶음을 예측하는 정책"},{"id":"t2-09","ty":"order","lv":2,"game":false,"p":"가상 장면에서 한 번의 실행이 도는 순서를 맞추세요.","steps":["LIBERO reset (과제·초기 배치)","MuJoCo 관측 (영상·로봇 상태)","입력 연결 (전처리·지시 구성)","SmolVLA 행동 예측·후처리","환경 step (앞부분 행동 적용)","성공·종료 검사"],"h":"한 번의 실행은 과제와 초기 배치를 정하는 reset에서 출발해 가상 영상과 로봇 상태를 관측하고, 전처리로 정책 입력을 구성합니다. 이어서 정책이 행동을 예측·후처리하면 환경 step으로 앞부분을 적용하고, 마지막에 성공·종료를 검사한 뒤 계속하면 다시 관측합니다.","w":"reset → 관측 → 입력 연결 → 행동 예측 → step → 성공·종료 검사 순서이며, 종료 전이면 새 관측으로 반복합니다.","an":"5일차 슬라이드 v2 · 02 가상 장면에서 한 번의 실행이 도는 순서 (p.25)","src":"1. LIBERO reset\n과제·초기 배치\n2. MuJoCo 관측\n영상·로봇 상태\n3. 입력 연결\n전처리·지시 구성\n4. SmolVLA\n행동 예측·후처리\n5. 환경 step\n앞부분 행동 적용\n6. 성공·종료 검사"},{"id":"t2-10","ty":"multi","lv":2,"game":true,"p":"MODEL LOADING·INFERENCE 화면과 관련해 옳은 것을 <b>모두<\/b> 고르세요.","o":["추론 중 환경은 대기한다","GUI 움직임은 실시간 성능이 아니다","추론 중에도 시뮬레이터가 진행된다","FINISHED 뒤 창을 닫아야 셀이 반환된다","noVNC 시점 변경이 정책 카메라를 바꾼다"],"a":[0,1,3],"h":"모델을 적재하거나 추론하는 동안에는 환경이 진행되지 않으므로 noVNC 화면이 멈춰 보여도 정상입니다. env.step은 ACTION EXECUTION 단계에서만 적용되고, GUI 움직임이나 저장 영상 fps는 실시간 성능을 뜻하지 않으며, 셀은 FINISHED 뒤 창을 닫아야 반환됩니다.","w":"추론 중 환경은 대기하고, ACTION EXECUTION에서 env.step이 적용됩니다. 관찰 창 시점을 바꿔도 정책 입력 카메라는 그대로입니다.","an":"5일차 슬라이드 v2 · 02 화면 정지와 실제 실행 상태 (p.26, p.35)","src":"● MODEL LOADING·INFERENCE 동안 환경은 대기합니다.\n● ACTION EXECUTION에서 env.step이 적용됩니다.\n● FINISHED 뒤 창을 닫아야 노트북 셀이 반환됩니다.\n● 영상 fps와 실제 벽시계 처리 속도는 다릅니다."}]},{"id":"t3","title":"전용 컨테이너와 준비 검사","ref":"03 · p.39–50","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"03 노트북 첫 셀에서 확인하는 교재 위치(컨테이너 안 경로)는?","o":["/opt/course","/home/작업폴더","/workspace","/workspace/Data/logs"],"a":2,"h":"첫 셀은 결과 파일을 만들지 않고 현재 Python 경로, 교재 위치, Data 위치만 출력합니다. 컨테이너에서는 호스트의 개인 자료 폴더가 bind mount된 루트 경로가 교재 기준이 되고, Data는 그 아래에 있습니다.","w":"교재는 /workspace, Data는 /workspace/Data이며 이후 결과는 Data/logs/day5에 저장됩니다.","an":"5일차 슬라이드 v2 · 03 첫 번째 셀: Python과 자료 위치 (p.40)","src":"- **Python:** 보통 `/opt/course/bin/python` 또는 같은 환경의 `python3` 경로가 나옵니다.\n- **교재:** 컨테이너에서는 `/workspace`가 기준입니다."},{"id":"t3-02","ty":"mc","lv":2,"game":true,"p":"preflight 출력의 offline=1이 뜻하는 것은?","o":["모든 파일이 충분함을 증명","로컬 캐시를 사용하도록 설정","인터넷 속도 측정 결과","GPU 비활성화"],"a":1,"h":"preflight 출력의 offline 항목은 Hugging Face 오프라인 설정을 보여 줍니다. 값이 1이면 인터넷에서 새로 내려받지 않고 이미 준비된 로컬 캐시를 쓰도록 설정했다는 뜻이며, 모든 파일이 충분하다는 증명은 아닙니다.","w":"offline=1은 로컬 캐시를 쓰도록 하는 설정일 뿐, 모든 파일이 충분하다는 증명은 아닙니다.","an":"5일차 슬라이드 v2 · 03 검사 출력은 이렇게 해석합니다 (p.42)","src":"● offline=1: 로컬 캐시를 사용하도록 설정\n42 / 128 · 10.VLA_v2/03_container.ipynb\n함께 이해하기\n값을 복사해 제출하기보다 각 항목이 확인하는 의미를 설명합니다.\noffline=1은 캐시 사용 설정이며, 모든 파일이 충분하다는 증명은 아닙니다."},{"id":"t3-03","ty":"mc","lv":2,"game":true,"p":"Docker 이미지와 컨테이너의 관계로 옳은 것은?","o":["컨테이너가 이미지의 준비본","둘은 같은 것","이미지는 GPU 드라이버","이미지는 준비본, 컨테이너는 실행본"],"a":3,"h":"이미지는 Python과 라이브러리가 갖춰진 실행 환경의 준비본이고, 그 이미지를 실제로 띄운 것이 실행 인스턴스입니다. 런처는 종료 시 제거되는 컨테이너를 쓰므로 결과는 bind mount된 Data 아래에 저장합니다.","w":"이미지는 실행 환경의 준비본이고, 컨테이너는 그 이미지로 띄운 실행 인스턴스입니다.","an":"5일차 슬라이드 v2 · 03 기초 복습: 호스트·컨테이너·커널 (p.44)","src":"- 이미지는 실행 환경의 준비본, 컨테이너는 실행 인스턴스입니다."},{"id":"t3-04","ty":"mc","lv":2,"game":true,"p":"preflight가 하지 <b>않는<\/b> 일은?","o":["rollout 실행과 모델 다운로드","manifest·revision 확인","CUDA 사용 가능 여부 확인","패키지 버전 출력"],"a":0,"h":"preflight는 manifest·revision·파일 크기, 캐시 폴더와 config.yaml, CUDA 사용 가능 여부, 패키지 버전을 확인해 출력하는 사전 검사입니다. 새 패키지나 모델을 내려받지 않으며, 실제 가상 영상 생성·정책 추론·행동 실행도 하지 않습니다.","w":"preflight는 모델 manifest·캐시·config·CUDA·패키지를 확인할 뿐, 다운로드와 rollout은 하지 않습니다.","an":"5일차 슬라이드 v2 · 03 코드 추적: preflight가 확인하는 범위 (p.46)","src":"- check_model: manifest·revision·파일 크기 확인\n- --hash 선택 시 큰 파일 SHA256까지 확인\n- 캐시 디렉터리·LIBERO config.yaml·CUDA 확인\n- 패키지 버전·장치 출력; 다운로드와 rollout은 하지 않음"},{"id":"t3-05","ty":"mc","lv":3,"game":true,"p":"noVNC 화면은 보이는데 CUDA 추론이 실패합니다. 먼저 확인할 곳은?","o":["SSH 터널 포트","전용 컨테이너·NVIDIA runtime","브라우저 탭 개수","노트북 글꼴"],"a":1,"h":"오류는 경로별로 나눠 봅니다. 브라우저 GUI(noVNC)가 보인다는 것은 접속 경로가 정상이라는 뜻일 뿐 GPU 계산 경로가 준비되었다는 뜻은 아니므로, CUDA 오류는 GPU를 연결해 주는 컨테이너 실행 환경 쪽을 먼저 확인합니다.","w":"noVNC 접속 실패와 CUDA 추론 실패는 다른 경로의 문제입니다. CUDA 오류는 전용 컨테이너와 NVIDIA runtime을 확인합니다.","an":"5일차 슬라이드 v2 · 03 실패 위치별 확인과 수정 (p.47)","src":"- CUDA 오류: 전용 컨테이너·NVIDIA runtime 확인\n- 접속 오류: 실행 프로세스·포트·SSH 터널 확인\n\nModuleNotFoundError라면 우선 커널과 이미지가 맞는지 확인합니다. 모델 파일 누락이라면 현재 ROOT와 Data 경로가 개인 자료 폴더를 가리키는지 확인합니다. 임의 pip install이나 온라인 다운로드로 증상만 지우면 강의의 고정 실행 환경과 달라져 다른 문제를 만들 수 있습니다.\n\nnoVNC 접속 실패와 CUDA 추론 실패는 다른 경로의 문제입니다. 브라우저 GUI가 보인다고 GPU 정책이 준비되었다는 뜻도, GPU가 인식된다고 SSH 터널이 올바르다는 뜻도 아닙니다."},{"id":"t3-06","ty":"ox","lv":1,"game":true,"p":"한 Jetson에서는 최대 2명이 각자 자료 폴더·컨테이너·두 포트를 사용한다.","a":true,"h":"한 Jetson 장비는 최대 두 사람이 함께 씁니다. 각 사람은 자기 자료 폴더와 자기 컨테이너, JupyterLab과 noVNC에 쓰는 포트 두 개를 따로 사용하며, GPU는 같은 물리 장치를 공유합니다.","w":"맞습니다. 한 Jetson 최대 2명이 각자 자료 폴더·컨테이너·두 포트를 사용하며, GPU는 같은 물리 장치를 공유할 수 있습니다.","an":"5일차 슬라이드 v2 · 03 준비 검사 완료 후 04로 (p.43)","src":"JupyterLab + 개인 noVNC 화면을 탭 두 개로 열어둡니다.\n03에서 빈 바탕 화면은 정상입니다. 04의 새 실험이 MuJoCo 창을 엽니다.\n한 Jetson 최대 2명: 각자 자료 폴더·컨테이너·두 포트를 사용합니다."},{"id":"t3-07","ty":"ox","lv":2,"game":true,"p":"검사가 실패하면 학생이 pip install이나 모델 다운로드로 환경을 바꿔 해결한다.","a":false,"h":"준비 검사는 설치가 아니라 실행 조건의 확인이며, 강의는 고정된 실행 환경을 전제로 합니다. 임의로 패키지를 설치하거나 온라인 다운로드로 증상만 지우면 고정 환경과 달라져 다른 문제를 만들 수 있으므로 강사 배포본과 마운트를 확인합니다.","w":"틀렸습니다. 학생은 pip install이나 모델 다운로드로 환경을 바꾸지 않고, 원인 위치를 찾아 안내된 방법으로 복구합니다.","an":"5일차 슬라이드 v2 · 03 직접 수정할 때 확인할 지점 (p.49)","src":"학생은 pip install이나 모델 다운로드로 환경을 바꾸지 않습니다. 호스트 런처와 컨테이너 명령을 구분하고 공유 GPU에서 정책은 순서대로 실행합니다."},{"id":"t3-08","ty":"match","lv":2,"game":false,"p":"오류 종류와 먼저 확인할 곳을 연결하세요.","pairs":[["import 오류","커널·이미지·Python 경로"],["모델/캐시 누락","개인 자료와 Data 마운트"],["CUDA 오류","전용 컨테이너·NVIDIA runtime"],["접속 오류","실행 프로세스·포트·SSH 터널"]],"h":"import 오류는 실행 중인 Python 환경 문제, 모델·캐시 누락은 자료 폴더 연결 문제, CUDA 오류는 GPU 연결 문제, 접속 오류는 서비스·포트·터널 문제로 나눠 봅니다. 각 증상이 어느 경로(환경·자료·계산·접속)에 속하는지 떠올리면 짝을 찾을 수 있습니다.","w":"오류 위치를 경로별로 나누면 엉뚱한 곳을 고치지 않게 됩니다.","an":"5일차 슬라이드 v2 · 03 실패 위치별 확인과 수정 (p.47)","src":"- import 오류: 커널·이미지·Python 경로 확인\n- 모델/캐시 누락: 개인 자료와 Data 마운트 확인\n- CUDA 오류: 전용 컨테이너·NVIDIA runtime 확인\n- 접속 오류: 실행 프로세스·포트·SSH 터널 확인"},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"열린 컨테이너에서 준비 검사를 진행하는 순서를 맞추세요.","steps":["현재 Python(노트북 커널) 확인","교재·Data 마운트·경로 확인","모델·캐시 자산 확인","GPU·패키지 실행 환경 확인","검사 결과 해석·첫 실패 복구","04로 이동해 실제 장면 생성"],"h":"준비 검사는 안쪽에서 바깥쪽으로 넓혀 갑니다. 먼저 현재 노트북 커널의 Python, 교재·Data 마운트, 모델·캐시 자산, GPU·패키지 환경을 차례로 확인하고, 결과를 해석해 첫 실패를 복구한 뒤 04에서 실제 장면을 만듭니다.","w":"커널 → 경로 → 모델·캐시 → GPU·패키지 → 결과 해석 → 04 이동 순서입니다.","an":"5일차 슬라이드 v2 · 03 두 번째 셀: preflight가 확인하는 범위 (p.41)","src":"1. 현재 Python\n노트북 커널 확인\n2. 교재·Data\n마운트·경로 확인\n3. 모델·캐시\n필요 자산 확인\n4. GPU·패키지 \n실행 환경 확인\n5. 검사 결과\n첫 실패 항목 복구\n6. 04로 이동\n실제 장면 생성"},{"id":"t3-10","ty":"multi","lv":2,"game":true,"p":"preflight 출력 항목과 의미가 바르게 짝지어진 것을 <b>모두<\/b> 고르세요.","o":["revision: 배포 모델의 고정 버전","device: 인식된 GPU","packages: 설치된 버전 목록","packages: 모든 조합의 동작 검증","offline=1: 파일 충분 증명"],"a":[0,1,2],"h":"revision은 준비된 모델 스냅샷의 식별자, device는 현재 Python에서 쓰는 CUDA 장치 이름, packages는 주요 라이브러리의 설치 버전입니다. offline=1은 로컬 캐시 사용 설정일 뿐 모든 파일이 충분하다는 증명이 아닙니다.","w":"packages는 설치 버전 목록이지 모든 조합의 동작 검증이 아니며, offline=1은 캐시 사용 설정일 뿐입니다.","an":"5일차 슬라이드 v2 · 03 검사 출력은 이렇게 해석합니다 (p.42)","src":"● revision: 배포 모델의 고정 버전\n● device: 현재 Python이 인식하는 GPU\n● packages: 설치된 라이브러리 버전\n● offline=1: 로컬 캐시를 사용하도록 설정\n42 / 128 · 10.VLA_v2/03_container.ipynb\n함께 이해하기\n값을 복사해 제출하기보다 각 항목이 확인하는 의미를 설명합니다.\noffline=1은 캐시 사용 설정이며, 모든 파일이 충분하다는 증명은 아닙니다."}]},{"id":"t4","title":"환경 reset과 초기 장면","ref":"04 · p.51–61","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":false,"p":"initial_state와 seed의 역할로 옳은 것은?","o":["둘 다 난수 설정","initial_state는 배치 번호, seed는 난수","seed가 배치 번호","둘 다 카메라 번호"],"a":1,"h":"initial_state=0과 1은 준비된 초기상태 목록에서 어느 물체 배치를 쓸지 고르는 값입니다. seed=7은 난수 경로를 고정하는 인자로, seed만 같다고 배치 번호가 다른 두 장면이 같아지지는 않습니다.","w":"initial_state=0/1은 준비된 초기 배치 목록의 번호이고, seed=7은 난수 경로를 고정하는 인자입니다.","an":"5일차 슬라이드 v2 · 04 기초 복습: 환경 생성·reset·초기상태 (p.55)","src":"initial_state=0과 1은 준비된 초기상태 목록에서 어느 배치를 사용할지 정합니다. seed=7은 난수 경로를 고정하는 인자입니다. seed만 같다고 초기 배치 번호가 다른 두 장면이 같아지는 것은 아닙니다."},{"id":"t4-02","ty":"mc","lv":2,"game":true,"p":"한 실행 안의 image와 image2를 비교하는 것은 어떤 비교인가요?","o":["재현 비교","성공률 비교","카메라 시점 비교","모델 비교"],"a":2,"h":"image와 image2는 같은 순간을 외부 카메라와 손목 카메라라는 서로 다른 위치에서 찍은 두 영상입니다. 한 실행 안에서 둘을 비교하는 것은 시점 차이를 보는 일이고, inspect-01과 inspect-02의 같은 카메라끼리 비교하는 재현 비교와는 구분됩니다.","w":"한 실행의 image↔image2는 시점 비교, inspect-01↔02의 같은 카메라는 재현 비교입니다.","an":"5일차 슬라이드 v2 · 04 두 시점 비교와 재현 비교를 구분 (p.52)","src":"● 한 실행의 image ↔ image2: 카메라 시점 비교\n● 외부·손목에서 같은 물체의 크기·가림 관찰\n● 01 ↔ 02의 같은 카메라: 초기 장면 재현 비교\n● 보인 물체 위치·차이와 파일명을 출력에서 확인\n52 / 128 · 10.VLA_v2/04_environment.ipynb\n함께 이해하기\n시점 비교: 한 실행 안의 image와 image2를 서로 비교합니다.\n재현 비교: inspect-01과 inspect-02의 같은 카메라끼리 비교합니다."},{"id":"t4-03","ty":"mc","lv":2,"game":true,"p":"NPZ에 저장되는 state는 몇 차원 벡터인가요?","o":["6차원","7차원","50차원","8차원"],"a":3,"h":"run_episode는 reset 직후 make_batch(obs, task)로 상태 벡터를 만들어 NPZ에 저장합니다. 이 벡터는 끝단 위치 3개, axis-angle 회전 3개, 그리퍼 관절 2개를 이어 붙인 것이므로 세 묶음의 개수를 더하면 차원을 알 수 있습니다.","w":"state는 make_batch가 만든 8차원 벡터입니다. 행동 7개, config의 오래된 shape=6과 혼동하지 않습니다.","an":"5일차 슬라이드 v2 · 04 코드 추적: 파일마다 다른 표현 (p.57)","src":"- NPZ image/image2는 원본 RGB 배열입니다.\n- PNG는 두 축 반전을 적용한 보기용 영상입니다.\n- state는 make_batch가 만든 8차원 벡터입니다.\n- result.json은 실행 조건·상태·시간을 기록합니다."},{"id":"t4-04","ty":"mc","lv":2,"game":true,"p":"PNG 파일이 NPZ의 원본 image와 다른 점은?","o":["두 축 반전한 보기용 영상","정규화된 상태값","행동 묶음 그래프","JSON 실행 기록"],"a":0,"h":"NPZ에는 환경이 준 원본 RGB 배열이 그대로 들어가고, PNG를 저장할 때는 <code>image[::-1,::-1].copy()<\/code>로 높이·너비 방향을 모두 뒤집습니다. 그래서 두 파일의 상하·좌우가 달라 보여도 모델 오류가 아니라 저장 목적이 다른 것입니다.","w":"NPZ image/image2는 원본 RGB 배열이고, PNG는 두 축 반전을 적용한 보기용 영상입니다.","an":"5일차 슬라이드 v2 · 04 코드 추적: 파일마다 다른 표현 (p.57)","src":"PNG 저장에서는 image[::-1,::-1].copy()로 방향을 바꿉니다. 따라서 NPZ의 raw와 PNG를 그대로 나란히 보고 상하·좌우가 다른 것을 모델 오류라고 생각하면 안 됩니다."},{"id":"t4-05","ty":"mc","lv":3,"game":true,"p":"새 실행이 FINISHED를 표시했습니다. 노트북 셀을 끝내려면?","o":["브라우저 탭을 닫는다","MuJoCo 창의 ×를 누른다","커널을 재시작한다","seed를 바꾼다"],"a":1,"h":"FINISHED는 초기화와 저장이 끝났다는 표시지만, 실행기는 마지막 장면을 관찰하도록 창을 유지하므로 셀의 [*]가 계속됩니다. 브라우저 탭만 닫아서는 셀이 끝나지 않으며, noVNC 화면 안의 시뮬레이터 창 오른쪽 위 닫기 버튼을 눌러야 셀이 완료됩니다.","w":"FINISHED는 저장 완료 표시입니다. noVNC 화면 안 MuJoCo 창의 ×를 눌러야 셀이 끝나며, 브라우저 탭만 닫으면 끝나지 않습니다.","an":"5일차 슬라이드 v2 · 04 목적 · 04 완료 (p.51, p.54)","src":"**noVNC에서 `FINISHED`를 확인하면 화면 안의 MuJoCo 창 오른쪽 위 ×를 눌러 닫아주세요.** 창을 닫아야 아래 셀이 완료되고 다음 단계로 진행됩니다."},{"id":"t4-06","ty":"ox","lv":1,"game":true,"p":"새 실행 이름만 적어 두면 결과 파일이 자동으로 생긴다.","a":false,"h":"결과 파일은 실행 이름을 정한 뒤 생성 셀 전체를 실제로 실행해야 만들어집니다. inspect-02처럼 새 이름을 써도 생성 셀을 실행하지 않고 읽기만 하면 읽을 파일이 없습니다.","w":"틀렸습니다. 새 이름만 적으면 파일이 생기지 않습니다. 생성 셀 전체를 실행해야 합니다.","an":"5일차 슬라이드 v2 · 04 완성 코드로 확인하기 (p.53)","src":"새 이름만 적으면 파일이 생기지 않습니다. inspect-02도 생성 셀 전체를 실행한 다음 읽으세요."},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"자동 픽셀 차이 값은 정책 성능 지표가 아니다.","a":true,"h":"자동 픽셀 차이는 두 영상 배열이 같은지 다른지를 수치로 보여 줄 뿐입니다. 그 차이가 물체 배치 때문인지 시점이나 색 때문인지 스스로 설명하지 않으며, 정책이 과제를 잘 수행했는지를 재는 값도 아닙니다.","w":"맞습니다. 픽셀 차이는 영상이 같은지 다른지를 수치로 보여 줄 뿐, 정책 성능이나 변화의 원인을 설명하지 않습니다.","an":"5일차 슬라이드 v2 · 04 초기0 반복·초기1 비교의 해석 (p.58)","src":"- 픽셀 차이는 영상 차이이며 정책 성능 지표가 아닙니다."},{"id":"t4-08","ty":"match","lv":2,"game":false,"p":"저장 파일과 담긴 내용을 연결하세요.","pairs":[["NPZ image/image2","원본 RGB 배열"],["PNG","두 축 반전한 보기용 영상"],["NPZ state","make_batch가 만든 8차원 벡터"],["result.json","실행 조건·상태·시간 기록"]],"h":"NPZ는 이름 붙은 배열 묶음으로 image·image2 원본 RGB와 make_batch가 만든 상태 벡터를 담습니다. PNG는 두 축을 반전한 사람이 보기 위한 영상이고, JSON 파일은 배열 대신 실행 조건과 결과 상태·시간을 읽기 좋게 기록합니다.","w":"NPZ는 이름 붙은 배열 묶음, JSON은 실행 조건과 결과 상태를 읽기 좋게 저장합니다.","an":"5일차 슬라이드 v2 · 04 코드 추적: 파일마다 다른 표현 (p.57)","src":"- NPZ image/image2는 원본 RGB 배열입니다.\n- PNG는 두 축 반전을 적용한 보기용 영상입니다.\n- state는 make_batch가 만든 8차원 벡터입니다.\n- result.json은 실행 조건·상태·시간을 기록합니다."},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"초기 장면을 만들고 결과를 읽는 순서를 맞추세요.","steps":["session·run·seed 기준 조건 지정","환경 초기화(첫 실행 대기)","inspect 저장(두 영상·상태)","noVNC에서 FINISHED 확인","MuJoCo 창 닫기","저장 결과 읽기·비교"],"h":"초기 장면 생성은 session·run·seed 같은 기준 조건을 정하는 것에서 시작해 환경을 초기화하고 두 영상·상태를 inspect 결과로 저장합니다. 이후 noVNC에서 FINISHED를 확인해 시뮬레이터 창을 닫아야 셀이 끝나고, 그 다음 저장 결과를 읽어 다른 run과 비교합니다.","w":"조건 지정 후 초기화·저장을 하고, FINISHED 확인 뒤 창을 닫아야 셀이 끝나 결과를 읽을 수 있습니다.","an":"5일차 슬라이드 v2 · 04 완성 코드로 확인하기 (p.53)","src":"1. session·run·seed\n기준 조건 지정\n2. 환경 초기화 \n첫 실행 대기\n3. inspect 저장\n두 영상·상태\n4. noVNC 관찰\nFINISHED 확인\n5. MuJoCo 창 닫기\n브라우저 탭은 유지\n6. 저장 결과 읽기\n다른 run으로 비교"},{"id":"t4-10","ty":"multi","lv":2,"game":true,"p":"04 노트북에서 아직 하지 <b>않는<\/b> 것을 모두 고르세요.","o":["정책 로드","환경 reset","물체 조작","두 카메라 영상 저장","행동 적용(env.step)"],"a":[0,2,4],"h":"04는 정책을 실행하기 전에 시작 장면을 검증하는 단계로, 환경 reset 후 물체·로봇·두 카메라가 보이는지만 확인합니다. inspect 모드는 정책을 로드하지 않고 초기 관측 저장에서 끝나므로, 행동 예측이나 env.step 같은 행동 적용도 아직 일어나지 않습니다.","w":"04는 reset 후 두 영상·상태를 저장합니다. 정책 로드·물체 조작·행동 적용은 06·07에서 합니다.","an":"5일차 슬라이드 v2 · 04의 목적: 정책이 볼 시작 장면을 검증 (p.51)","src":"04의 실험 순서\ninspect-01: 기준 장면 저장\ninspect-02: 같은 조건으로 비교\ninspect-03: 초기 배치만 변경\n정책 로드·물체 조작은 아직 하지 않음"}]},{"id":"t5","title":"관측 전처리와 행동 계약","ref":"05 · p.62–74","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"정책 입력 영상 한 장의 원본 형상은?","o":["(256,256,3) uint8","(3,256,256) float","(50,7) float","(8,) float32"],"a":0,"h":"정책에 들어가는 영상은 두 시점의 RGB 이미지이며, 각 원본은 높이·너비·색 채널 순서(HWC)로 저장된 정수 배열입니다. 0~255 범위의 8비트 정수 자료형이고 한 변이 256픽셀인 정사각형 영상입니다.","w":"영상은 (256,256,3) uint8 RGB 두 장이며, 전처리에서 CHW float(0~1)로 바뀝니다.","an":"5일차 슬라이드 v2 · 05의 목적: 사진과 상태를 모델 입력으로 (p.62)","src":"● 영상 2개: (256,256,3) uint8 → 두 시점의 RGB\n● 상태 8개: 현재 위치·방향·그리퍼 관절"},{"id":"t5-02","ty":"mc","lv":2,"game":true,"p":"8차원 상태의 구성으로 옳은 것은?","o":["위치3+회전3+그리퍼1+시간1","이동3+회전3+그리퍼1","위치3+회전3+그리퍼 관절2","위치2+회전3+그리퍼3"],"a":2,"h":"상태 벡터는 '지금 어떤 자세인가'를 나타내며, state[:3]은 끝단 위치, state[3:6]은 axis-angle 회전, state[6:]은 그리퍼 관절입니다. 슬라이스 범위의 길이를 세면 각 묶음의 개수를 알 수 있습니다.","w":"상태 = 끝단 위치 3 + axis-angle 회전 3 + 그리퍼 관절 2입니다. '이동3+회전3+그리퍼1'은 행동 7개의 구성입니다.","an":"5일차 슬라이드 v2 · 05 8차원 상태를 분해합니다 (p.64)","src":"state[:3] = 위치 / state[3:6] = axis-angle 회전 / state[6:] = 그리퍼 관절"},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"행동 7개의 구성으로 옳은 것은?","o":["위치3+회전3+그리퍼 관절2","이동3+회전3+그리퍼 제어1","이동2+회전2+그리퍼3","끝단 위치 7개"],"a":1,"h":"행동은 '다음에 어떻게 움직일까'를 제어기에 전달하는 명령으로, 끝단 이동·회전 성분과 그리퍼 성분으로 이뤄집니다. 그리퍼는 상태에서는 두 관절로 관측되지만, 명령은 하나의 열기/닫기 제어값으로 보낼 수 있어 상태보다 길이가 짧습니다.","w":"행동 = 끝단 이동 3 + 회전 3 + 그리퍼 제어 1입니다. 상태 8은 지금의 자세, 행동 7은 다음 명령입니다.","an":"5일차 슬라이드 v2 · 05 행동 7개는 로봇 제어기의 값입니다 (p.66)","src":"● 행동 = 끝단 이동 3 + 회전 3 + 그리퍼 제어 1\n● 정책이 여러 미래 시점의 행동을 묶어 예측합니다.\n● 06: 후처리한 50×7 결과 확인 / 아직 행동 적용 전\n● 07: 앞부분 행동을 적용한 뒤 새 관측으로 반복\n66 / 128 · 10.VLA_v2/05_observation_action.ipynb\n함께 이해하기\n상태 8 = 지금의 자세 / 행동 7 = 다음 이동·회전·그리퍼 명령\n두 그리퍼 관절 상태를 관측해도 동작은 하나의 제어값으로 명령할 수 있습니다."},{"id":"t5-04","ty":"num","lv":2,"game":false,"p":"uint8 픽셀 값 255를 float32로 바꾼 뒤 255로 나누면 얼마인가요?","a":1,"unit":"","h":"uint8 픽셀은 0~255 정수 범위이고, float로 바꾼 뒤 255로 나누면 0~1 범위로 옮겨집니다. 계산식은 255 ÷ 255이며, 최댓값 픽셀이 변환 후 범위의 최댓값이 되는지를 묻는 것입니다.","w":"255 ÷ 255 = 1입니다. uint8(0~255)을 255로 나누면 0~1 범위가 됩니다.","an":"5일차 슬라이드 v2 · 05 기초 복습: 축·자료형·값 범위 (p.68)","src":"uint8은 0~255 정수 범위입니다. float로 바꾸고 255로 나누면 0~1 범위가 됩니다."},{"id":"t5-05","ty":"mc","lv":3,"game":true,"p":"필수 camera2 영상이 없을 때 올바른 대응은?","o":["camera1을 복제해 채운다","가짜 camera3를 넣는다","형상만 맞추면 된다","입력 이름·전처리 설정 확인"],"a":3,"h":"카메라가 빠졌을 때 camera1을 복제하거나 임의 camera3를 넣으면 형상만 맞춘 다른 의미의 입력이 됩니다. 새 카메라나 해상도를 연결할 때는 make_batch 검사를 느슨하게 하지 말고 모델이 기대하는 입력 이름과 전처리 설정까지 맞는지 확인해야 합니다.","w":"카메라 누락을 가짜 이미지로 조용히 채우지 않습니다. 모델의 입력 이름·학습 시점·전처리 설정까지 확인해야 합니다.","an":"5일차 슬라이드 v2 · 05 입력 수정 시 같이 확인할 항목 (p.71)","src":"새 카메라나 다른 해상도를 연결한다면 make_batch 검사만 느슨하게 하지 말고 모델의 입력 이름·학습 시점·전처리 설정까지 확인해야 합니다. 필요한 camera2가 없을 때 camera1을 복제하거나 임의 camera3를 넣는 것은 수치 형상만 맞춘 다른 입력입니다."},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"상태 값의 회전은 roll·pitch·yaw 표현이다.","a":false,"h":"state[3:6]은 현재 끝단의 방향을 axis-angle 형식 3개 값으로 나타냅니다. 환경 원래의 quaternion을 make_batch가 이 형식으로 변환한 것이며, 각 값을 단순한 축별 각도로 해석하지 말라고 자료는 강조합니다.","w":"틀렸습니다. 상태의 회전은 axis-angle 표현이며 roll·pitch·yaw와 구분합니다.","an":"5일차 슬라이드 v2 · 05 8차원 상태를 분해합니다 (p.64)","src":"- `state[3:6]`: 현재 끝단의 방향을 axis-angle 형식의 3개 값으로 나타냅니다. 각각을 단순한 roll·pitch·yaw 각도로 해석하지 않습니다."},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"후처리된 행동 값 0.1을 곧바로 0.1m 이동으로 해석하면 안 된다.","a":true,"h":"행동 값은 제공된 후처리와 제어 규격을 거친 정규화된 제어 입력이지 절대 목표 좌표가 아닙니다. 수치의 단위는 각 성분과 환경 계약에서 확인해야 하므로, 값 하나를 곧바로 미터나 라디안 이동량으로 읽을 수 없습니다.","w":"맞습니다. 행동은 환경의 제어 입력이며, 단위는 각 성분과 환경 계약에서 확인합니다.","an":"5일차 슬라이드 v2 · 05 행동 7개는 로봇 제어기의 값 (p.66, p.20)","src":"상태 8 = 지금의 자세 / 행동 7 = 다음 이동·회전·그리퍼 명령\n두 그리퍼 관절 상태를 관측해도 동작은 하나의 제어값으로 명령할 수 있습니다.\n후처리된 0.1을 곧바로 0.1m 이동으로 해석하지 않습니다."},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"영상 변환 코드와 하는 일을 연결하세요.","pairs":[["raw[::-1, ::-1]","높이·너비 방향을 함께 반전"],["copy()","연속 메모리 버퍼 만들기"],["transpose(2, 0, 1)","HWC를 CHW로 축 변경"],["astype(float32)/255","자료형·값 범위 맞추기"]],"h":"<code>[::-1, ::-1]<\/code>은 첫 두 축(높이·너비)을 역순으로 읽고, copy()는 음수 stride 뷰를 독립된 연속 버퍼로 만듭니다. transpose(2,0,1)은 색 축을 맨 앞으로 옮기고, float32 변환 뒤 255로 나누면 자료형과 값 범위가 함께 맞춰집니다.","w":"두 축 반전 후 copy로 음수 stride 문제를 피하고, 색 축을 앞으로 옮긴 뒤 0~1로 바꿉니다.","an":"5일차 슬라이드 v2 · 05 코드 추적: 영상 변환 한 줄을 분해 (p.70, p.72)","src":"- raw[::-1,::-1]: 높이·너비 방향을 함께 반전\n- copy(): 연속 버퍼를 만들어 음수 stride 경계 처리\n- permute/transpose: HWC → CHW\n- float()/255: dtype와 범위를 맞춘 뒤 pre 호출"},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"저장된 영상을 정책 입력으로 바꾸는 순서를 맞추세요.","steps":["두 축 방향 반전","연속 메모리로 copy","HWC → CHW 축 변경","float32 변환 후 255로 나누기","preprocessor로 카메라 매핑·정규화"],"h":"변환은 '방향 → 메모리 → 축 → 자료형·범위' 순서로 진행됩니다. 먼저 두 축을 뒤집고 독립 버퍼로 복사한 뒤, HWC를 CHW로 바꾸고 실수로 만들어 0~1 범위로 옮기며, 마지막에 제공 preprocessor가 카메라 이름 매핑과 정규화를 적용합니다.","w":"방향 → copy → 축 → 자료형·범위 → preprocessor 순서이며, 상태는 8차원 그대로 유지합니다.","an":"5일차 슬라이드 v2 · 05 관측 계약을 정책 계약으로 (p.69, p.72)","src":"# 방향 → 축 → 자료형 → 범위\noriented = raw[::-1, ::-1].copy() \nchw = oriented.transpose(2, 0, 1) \nconverted = chw.astype(\"float32\")/255 \n# 이후 제공 preprocessor 적용"},{"id":"t5-10","ty":"multi","lv":2,"game":false,"p":"실제 preprocessor(processor)가 하는 일을 <b>모두<\/b> 고르세요.","o":["카메라를 camera1·camera2로 연결","언어 지시 토큰화","상태 8개를 학습 통계로 정규화","누락 카메라를 가짜 값으로 채움","config의 shape=6에 맞춰 상태 자르기"],"a":[0,1,2],"h":"실제 runner는 make_batch로 모은 입력을 배포된 preprocessor에 넣습니다. 이 단계에서 image·image2를 학습 때의 카메라 이름에 대응시키고, 문자열 지시를 tokenizer로 토큰 ID로 바꾸며, 상태 8개를 학습 평균·표준편차로 정규화합니다.","w":"processor는 카메라 매핑·지시 토큰화·상태 정규화 등을 합니다. 가짜 카메라 채우기와 오래된 shape=6 자르기는 하면 안 됩니다.","an":"5일차 슬라이드 v2 · 05 영상 변환 다음, 실제 processor가 하는 일 (p.65, p.73)","src":"● 두 카메라를 학습 때의 camera1·camera2로 연결\n● 언어 지시를 토큰으로 바꾸고 배치·장치를 준비\n● 상태 8개 각각을 저장된 통계로 정규화"}]},{"id":"t6","title":"행동 추론과 배열 읽기","ref":"06 · p.75–86","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"infer 모드에서 일어나지 <b>않는<\/b> 일은?","o":["초기 관측 reset","모델 로드","행동 묶음 예측","로봇에 행동 적용"],"a":3,"h":"infer 모드는 초기 관측에서 정책을 로드해 한 번 추론하고, 행동 묶음을 action-chunks.npy로 저장하는 데까지만 진행합니다. env.step을 호출하지 않으므로 06에서 로봇이 움직이지 않는 것이 정상입니다.","w":"infer는 자체 reset → 모델 로드 → 한 번 추론 → 저장까지 하고, env.step(행동 적용)은 호출하지 않습니다.","an":"5일차 슬라이드 v2 · 06의 목적 · 정책 로드와 추론 (p.75–76)","src":"추론은 행동 예측까지입니다. infer 모드에서는 로봇에 행동을 적용하지 않습니다."},{"id":"t6-02","ty":"mc","lv":2,"game":true,"p":"저장 배열 (1, 50, 7)에서 50이 뜻하는 것은?","o":["행동 성분 수","저장 묶음 수","미래 행동 시점 수","초 단위 시간"],"a":2,"h":"저장 배열 (1,50,7)에서 첫 축 1은 저장 묶음 수, 마지막 축 7은 한 시점의 행동 성분 수입니다. 가운데 축은 그래프의 가로축 0~49 순번에 해당하며, 초 단위 시간이 아니라 정책이 앞으로 낼 행동의 순서를 뜻합니다.","w":"50은 미래 행동 시점 수입니다. 그래프 가로축 0~49는 행동 순번이며 초 단위 시간이 아닙니다.","an":"5일차 슬라이드 v2 · 06 행동 배열 (1,50,7)과 그래프 (p.77)","src":"1=저장 묶음 / 50=미래 시점 / 7=행동 성분\n가로축은 0~49 행동 순번이며 초 단위 시간이나 실제 궤적이 아닙니다."},{"id":"t6-03","ty":"mc","lv":2,"game":true,"p":"한 묶음에서 성분별 최솟값 7개를 얻는 코드는?","o":["actions[0].min(axis=0)","actions[0].min(axis=1)","actions.min()","actions[0][:3]"],"a":0,"h":"actions[0]은 (50,7) 배열이고, axis=0으로 줄이면 50개 시점 방향이 없어지면서 성분마다 값이 하나씩 남습니다. axis=1로 줄이면 시점마다 서로 다른 성분을 섞으므로 다른 질문에 답하게 됩니다.","w":"actions[0].min(axis=0)은 50개 시점을 따라 성분별 최솟값 7개를 냅니다. axis=1은 시점마다 성분을 섞는 다른 질문입니다.","an":"5일차 슬라이드 v2 · 06 완성 코드로 확인하기 (p.79)","src":"`actions[0].min(axis=0)`은 50개 시점을 줄여 각 성분의 최솟값 7개를 줍니다. axis=1이면 시점마다 성분을 섞어 다른 질문에 답합니다."},{"id":"t6-04","ty":"mc","lv":2,"game":true,"p":"chunk_seconds가 측정하는 구간은?","o":["모델 로드 시간","전처리 뒤 추론·후처리·전송","전체 rollout 시간","영상 저장 시간"],"a":1,"h":"run_episode는 pre(make_batch(...))로 입력을 준비한 뒤 CUDA synchronize를 하고 타이머를 시작합니다. 그다음 정책 예측, post, detach·CPU 이동·NumPy 변환까지 마친 시각과의 차이를 기록하므로, 입력 준비와 모델 로드 시간은 이 구간 밖입니다.","w":"chunk_seconds는 입력 전처리 뒤 추론·후처리·전송 구간입니다. model_load_seconds와 execution_seconds는 별도 값입니다.","an":"5일차 슬라이드 v2 · 06 추론 소요 시간과 관측 빈도 · 코드 추적 (p.78, p.82)","src":"run_episode는 pre(make_batch(...)) 뒤 CUDA synchronize를 호출하고 tick을 기록합니다. 그 다음 정책 예측, post, detach·CPU 이동·NumPy 변환과 동기화를 마친 시각 차이를 chunk_seconds에 추가합니다."},{"id":"t6-05","ty":"mc","lv":3,"game":true,"p":"rollout에서 각 행동을 env.step에 넘기기 전에 적용하는 처리는?","o":["−1~1 범위로 clip","255로 나누기","HWC로 축 변환","후처리 생략"],"a":0,"h":"저장 배열은 postprocessor 이후의 예측값이지만, rollout에서는 각 행동을 그대로 넘기지 않고 np.clip으로 허용 범위 안에 잘라 env.step에 전달합니다. 그래서 범위를 넘는 예측은 그래프 값과 실제 적용값이 다를 수 있습니다.","w":"실제 rollout은 각 action을 np.clip(action,-1,1)한 뒤 env.step에 전달합니다. 그래서 저장된 예측과 적용값이 다를 수 있습니다.","an":"5일차 슬라이드 v2 · 06 출력 오류와 정책 변경 시 주의점 (p.83)","src":"저장 배열은 postprocessor 이후의 예측값입니다. 실제 rollout에서는 각 action을 np.clip(action,-1,1)한 뒤 env.step에 전달하므로 범위를 넘는 예측은 적용값과 다릅니다."},{"id":"t6-06","ty":"ox","lv":1,"game":true,"p":"config.load_vlm_weights=False는 영상·언어 부분을 쓰지 않겠다는 뜻이다.","a":false,"h":"load_vlm_weights=False는 완성 정책 파일에 이미 들어 있는 backbone 가중치를 중복으로 내려받지 않겠다는 설정입니다. 가중치를 생략하거나 영상·언어 처리 부분을 끄는 것이 아니라 다운로드 경로만 생략합니다.","w":"틀렸습니다. backbone 가중치를 중복 다운로드하지 않는 설정이며, 영상·언어 부분은 그대로 사용합니다.","an":"5일차 슬라이드 v2 · 06 기초 복습: 모델 적재와 추론은 다른 단계 (p.80)","src":"config.load_vlm_weights=False는 완성 정책에 들어 있는 backbone 가중치를 중복 다운로드하지 않는 설정입니다. 영상·언어 부분을 쓰지 않겠다는 뜻이 아닙니다."},{"id":"t6-07","ty":"ox","lv":2,"game":true,"p":"한 관측에서 50개를 예측하는 데 1초가 걸렸다면 관측을 50번 한 것이다.","a":false,"h":"한 번의 관측을 바탕으로 정책이 미래 행동 50개를 한꺼번에 예측하는 것이므로, 카메라를 50번 다시 본 것이 아닙니다. 추론 소요 시간과 관측 빈도는 서로 다른 개념이며, 재관측은 앞부분 실행 뒤에야 일어납니다.","w":"틀렸습니다. 한 관측에서 50개를 한 번에 예측한 것이며, 관측 50회가 아닙니다.","an":"5일차 슬라이드 v2 · 06 추론 소요 시간과 관측 빈도 (p.78)","src":"한 관측에서 50개 예측에 1초가 걸려도 관측 50회가 아닙니다."},{"id":"t6-08","ty":"match","lv":2,"game":false,"p":"코드·지표와 의미를 연결하세요.","pairs":[["eval()","평가 동작 설정"],["inference_mode()","기울기 기록 생략"],["model_load_seconds","디스크 가중치를 정책으로 준비한 시간"],["chunk_seconds","추론·후처리·CPU 이동 구간"]],"h":"eval()은 평가 시의 동작 방식을, inference_mode()는 기울기 추적 여부를 제어하므로 같은 기능이 아닙니다. model_load_seconds는 디스크의 학습 결과를 정책 객체로 준비하는 시간이고, chunk_seconds는 예측·후처리·CPU 이동까지의 구간입니다.","w":"모델 적재와 추론은 다른 단계이므로 시간도 따로 잽니다. 재사용한 결과의 숫자는 새 측정이 아닙니다.","an":"5일차 슬라이드 v2 · 06 기초 복습 · 코드 추적 (p.80, p.82)","src":"- 가중치 로드: 디스크의 학습 결과를 정책 객체로 준비\n- eval(): 평가 동작 설정; inference_mode(): 기울기 기록 생략"},{"id":"t6-09","ty":"order","lv":2,"game":false,"p":"infer에서 추론 결과가 저장되기까지의 순서를 맞추세요.","steps":["load_policy (가중치·pre/post)","pre(make_batch): 관측·task","predict_action_chunk (GPU)","post → CPU 배열","50×7 형상·유한성 검사","NPY·JSON·그래프 저장"],"h":"infer는 먼저 가중치와 전후처리기를 준비한 뒤, 현재 관측과 task로 입력 배치를 만들어 GPU에서 행동 묶음을 예측합니다. 결과는 후처리 후 CPU 배열로 옮겨 50×7 형상과 NaN/Inf 여부를 검사한 다음에야 파일로 저장됩니다.","w":"정책·전후처리를 준비하고, 전처리한 입력으로 GPU 추론 후 후처리해 CPU 배열로 옮기고, 형상·NaN 검사 뒤 저장합니다.","an":"5일차 슬라이드 v2 · 06 실행 아키텍처: GPU 예측과 CPU 저장 (p.81)","src":"- check_model → load_policy → pre/post 준비\n- pre(make_batch(obs,task)) → predict_action_chunk\n- post → detach → CPU → NumPy → batch 첫 항목\n- 50×7 검사 → action-chunks.npy·result.json"},{"id":"t6-10","ty":"multi","lv":2,"game":false,"p":"06 추론 결과를 다룰 때 옳은 설명을 <b>모두<\/b> 고르세요.","o":["형상 오류·NaN은 적용 전에 거부된다","post를 생략하면 내부 표현이 남을 수 있다","저장 예측과 clip 후 적용값은 다를 수 있다","재사용한 결과의 출력도 새 측정이다","값 변화가 크면 곧 작업 실패다"],"a":[0,1,2],"h":"runner는 shape가 (50,7)이 아니거나 NaN·Inf가 있으면 ValueError로 중단합니다. post를 거쳐야 모델 내부 표현이 환경 행동으로 복원되며, 실제 적용 전에는 np.clip이 들어가므로 저장값과 적용값이 다를 수 있습니다.","w":"재사용한 완료 결과의 숫자는 새 측정이 아니며, 큰 변화가 곧 작업 실패라는 뜻도 아닙니다.","an":"5일차 슬라이드 v2 · 06 출력 오류와 정책 변경 시 주의점 (p.83, p.85)","src":"- 형상 오류·NaN은 행동 적용 전에 거부됩니다.\n- post를 생략하면 모델 내부 출력 표현이 남을 수 있습니다.\n- 저장된 예측과 env.step의 clip 이후 값은 다를 수 있습니다.\n- 체크포인트 교체는 processor·통계·계약까지 함께 검토"}]},{"id":"t7","title":"폐루프 실행과 실행 길이","ref":"07 · p.87–100","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"기준 실행 seed7-h10의 조건은?","o":["초기1·seed7·execute10","초기0·seed7·execute10","초기0·seed10·execute7","초기0·seed7·execute5"],"a":1,"h":"07의 기준 실행은 실행 이름 seed7-h10에 조건이 드러나 있습니다. 첫 번째 준비된 배치 번호, 난수 seed 7, 한 번 예측 후 실행하는 행동 수 10을 쓰며, task0과 최대 280스텝은 유지합니다.","w":"기준 실행은 initial-state 0 · seed 7 · execute 10이며, task0·최대 280스텝을 유지합니다.","an":"5일차 슬라이드 v2 · 07 기준 실행: seed7-h10 (p.88)","src":"● initial-state 0 · seed 7 · execute 10"},{"id":"t7-02","ty":"num","lv":2,"game":false,"p":"최대 280스텝이고 조기 종료가 없다고 가정할 때, execute=10이면 추론은 몇 번 필요한가요?","a":28,"unit":"회","h":"조기 종료 없이 스텝 한도까지 간다고 가정하면, 한 번 추론할 때마다 execute 개수만큼 행동을 적용합니다. 계산식은 최대 스텝 수 ÷ execute(280 ÷ 10)이며, 실제 로그에서는 성공이 일찍 나오면 추론 횟수가 더 줄어듭니다.","w":"280 ÷ 10 = 28회입니다. 같은 가정에서 execute=5이면 56회가 필요합니다. 실제 횟수는 성공·종료·중단에 따라 달라집니다.","an":"5일차 슬라이드 v2 · 07 코드 추적: 스텝·추론 횟수·종료 (p.96)","src":"280을 10으로 나누면 28, 5로 나누면 56입니다. 이는 모든 예측이 정상이고 조기 종료 없이 스텝 한도까지 갔다는 계산 예시입니다. 실제 로그에서 성공이 일찍 나오면 steps와 chunk 수가 더 작아집니다. 따라서 추론 횟수가 적다고 효율만 좋아졌다고 결론 내리기 전에 종료 이유를 읽습니다."},{"id":"t7-03","ty":"mc","lv":2,"game":true,"p":"status=completed이면서 success=false인 결과의 의미는?","o":["실행 오류","사용자 중단","미실행","절차는 끝났지만 과제 미달성"],"a":3,"h":"status=completed는 실행 절차가 끝났다는 뜻이고, success는 환경이 판정한 과제 달성 여부입니다. 스텝 한도까지 정상 진행했지만 목표를 이루지 못하면 두 값이 이렇게 엇갈리며, 예외나 중단을 뜻하는 incomplete와는 다릅니다.","w":"completed는 실행 절차가 끝났다는 뜻이고, success=false는 과제를 달성하지 못했다는 뜻입니다. 스텝 한도 도달도 완료된 실패일 수 있습니다.","an":"5일차 슬라이드 v2 · 07 실행 완료·과제 실패·중단을 구분 (p.90)","src":"completed + success=false: 절차는 끝났지만 과제 미달성 가능"},{"id":"t7-04","ty":"mc","lv":2,"game":true,"p":"폐루프 코드에서 바깥 while 반복문이 하는 일은?","o":["앞 k개 행동 적용","재관측과 새 행동 묶음 추론","매 반복 환경 reset","영상 파일 저장"],"a":1,"h":"폐루프 코드는 두 겹의 반복문입니다. 안쪽 for는 한 묶음에서 앞 k개 행동을 하나씩 env.step으로 적용하고, 바깥 while은 남은 한도가 있는 동안 새로 얻은 관측으로 배치를 만들어 다음 묶음을 예측합니다.","w":"바깥 while은 현재 관측으로 새 chunk를 예측하고, 안쪽 for는 그 앞 k개를 적용합니다. 묶음마다 reset하지 않습니다.","an":"5일차 슬라이드 v2 · 07 실행 아키텍처: 바깥 while과 안쪽 for (p.95, p.98)","src":"바깥 while은 남은 실행 한도가 있는 동안 새 관측으로 chunk를 예측합니다. 안쪽 for는 chunk[:min(execute,args.steps-result[steps])]에서 행동을 꺼냅니다."},{"id":"t7-05","ty":"mc","lv":3,"game":true,"p":"남은 스텝 23, execute 10일 때 execution_plan(23, 10)의 결과는?","o":["[10, 10, 3]","[10, 13]","[23]","[3, 10, 10]"],"a":0,"h":"execution_plan은 <code>[min(execute, max_steps-start) for start in range(0,max_steps,execute)]<\/code>로 각 묶음에서 적용할 행동 수를 구합니다. start가 0, 10, 20일 때 남은 스텝과 execute 중 작은 값을 차례로 계산하면 마지막 묶음만 짧아집니다.","w":"앞에서부터 10, 10을 실행하고 남은 3을 실행하므로 [10, 10, 3]입니다. 실제 실행이 아닌 계산 예제입니다.","an":"5일차 슬라이드 v2 · 07 완료: 기준과 비교를 근거로 설명 (p.93)","src":"def execution_plan(max_steps, execute):\n return [min(execute, max_steps-start) for start in range(0,max_steps,execute)]\nprint('23스텝, horizon10:', execution_plan(23,10))"},{"id":"t7-06","ty":"ox","lv":1,"game":true,"p":"execute를 5로 바꾸면 모델이 예측하는 행동 수도 25개로 줄어든다.","a":false,"h":"execute는 한 번 예측한 묶음에서 실제로 적용할 행동 수일 뿐, 모델이 예측하는 묶음 길이(chunk 길이)와는 다른 설정입니다. execute를 5나 10으로 바꿔도 정책은 매번 같은 길이의 행동 묶음을 예측합니다.","w":"틀렸습니다. execute=5든 10이든 모델은 항상 50개를 예측합니다. 적용하는 개수만 달라집니다.","an":"5일차 슬라이드 v2 · 07 기초 복습: 폐루프와 실행 horizon (p.94)","src":"execute=10이면 한 예측에서 최대 10개, 5이면 최대 5개를 적용합니다. 두 경우 모두 모델은 50개를 예측합니다."},{"id":"t7-07","ty":"ox","lv":2,"game":true,"p":"모든 성분이 0인 행동 벡터를 실물 로봇의 보편적인 정지 명령으로 보면 안 된다.","a":true,"h":"for 안의 clip은 각 성분을 −1~1로 제한할 뿐이며, 행동 값의 의미는 환경의 제어 인터페이스에 달려 있습니다. 그래서 모든 성분이 0인 벡터가 어떤 로봇에서나 정지를 뜻한다고 일반화할 수 없습니다.","w":"맞습니다. 0 벡터를 실물 로봇의 정지 명령으로 일반화하지 않습니다. 행동의 의미는 장비와 환경 계약에 따라 다릅니다.","an":"5일차 슬라이드 v2 · 07 코드 추적 · 직접 수정할 때 (p.96, p.99)","src":"for 안의 clip은 행동의 각 성분을 −1~1로 제한합니다. 모든 성분을 0으로 만든 벡터를 실물 로봇의 보편적인 정지 명령이라고 일반화하지 않습니다. 행동 의미는 환경 제어 인터페이스에 달려 있습니다. 이 수업은 turtlesim Twist와 다른 행동 계약을 사용합니다."},{"id":"t7-08","ty":"match","lv":2,"game":false,"p":"결과 상태와 의미를 연결하세요.","pairs":[["status=completed","실행 절차가 끝남"],["success=true","환경 성공 조건을 만족"],["incomplete","예외·사용자 중단 등"],["스텝 한도 도달","완료된 실패일 수 있음"]],"h":"completed는 실행 절차가 끝났다는 상태, success=true는 rollout에서 환경 성공 조건을 만족했다는 판정입니다. incomplete는 예외나 사용자 중단으로 끝난 경우이고, 스텝 한도에 도달한 것은 절차는 끝났지만 과제는 못 이룬 경우일 수 있습니다.","w":"실행 완료·과제 성공·중단은 서로 다른 결과이므로 따로 기록합니다.","an":"5일차 슬라이드 v2 · 07 실행 완료·과제 실패·중단을 구분 (p.90)","src":"● status=completed: 실행 절차가 끝났습니다.\n● success=true: rollout에서 환경 성공 조건을 만족했습니다.\n● 스텝 한도 도달: 완료된 실패일 수 있습니다.\n● 예외·사용자 중단은 incomplete로 확인합니다."},{"id":"t7-09","ty":"order","lv":2,"game":false,"p":"실패를 분석할 때 영상에서 확인하는 작업 구간을 순서대로 맞추세요.","steps":["대상 선택","접근","잡기","옮기기","놓기"],"h":"집어서 옮기는 작업은 어떤 물체를 대상으로 할지 고르는 것부터 시작해, 그 물체로 다가가고, 그리퍼로 쥐고, 목표 위치로 이동한 뒤, 마지막에 내려놓는 흐름으로 진행됩니다. 영상에서 처음 실패한 구간을 이 순서에 맞춰 기록합니다.","w":"대상 선택 → 접근 → 잡기 → 옮기기 → 놓기 중 처음 차이가 난 구간을 기록하고, 한 번의 결과로 원인을 단정하지 않습니다.","an":"5일차 슬라이드 v2 · 07 실패를 다음 실험의 질문으로 (p.92)","src":"대상 선택·접근·잡기·옮기기·놓기 중 차이가 난 구간을 기록"},{"id":"t7-10","ty":"multi","lv":2,"game":true,"p":"h10과 h5를 공정하게 비교하려면 고정해야 하는 것을 <b>모두<\/b> 고르세요.","o":["과제","초기 상태 0","seed 7","execute 값","최대 280스텝"],"a":[0,1,2,4],"h":"h10과 h5 비교의 목적은 execute(실행 길이)의 영향만 보는 것입니다. 그러려면 execute 외의 조건인 과제, 초기 배치 번호, seed, 최대 스텝 수(그리고 모델)를 두 실행에서 똑같이 유지해야 합니다.","w":"과제·초기0·seed7·최대280·모델을 고정하고 execute만 바꿔야 horizon의 영향을 볼 수 있습니다.","an":"5일차 슬라이드 v2 · 07 h10/h5 비교와 직접 수정할 부분 (p.97, p.99)","src":"● 과제·초기0·seed7·최대280·모델을 고정합니다."}]},{"id":"t8","title":"조건별 평가와 해석","ref":"08 · p.101–114","qs":[{"id":"t8-01","ty":"mc","lv":1,"game":true,"p":"A(초기0/h10)와 B(초기0/h5)를 비교하면 알 수 있는 영향은?","o":["초기 배치","실행 길이(horizon)","모델 버전","seed"],"a":1,"h":"A와 B는 초기0·seed7·모델·최대280스텝을 모두 같게 두고 execute만 10과 5로 바꾼 조합입니다. 바뀐 조건이 하나뿐이므로 두 결과의 차이를 그 조건, 즉 한 번 예측 후 적용하는 행동 수의 영향으로 볼 수 있습니다.","w":"A↔B는 execute만 바뀌므로 실행 길이(horizon)의 영향을, A↔C는 초기 배치의 영향을 봅니다.","an":"5일차 슬라이드 v2 · 08의 목적 · 코드 추적: 공정한 두 비교 (p.101, p.110)","src":"A와 B는 초기0·seed7·모델·최대280스텝을 고정하고 execute만 10과 5로 바꿉니다."},{"id":"t8-02","ty":"mc","lv":2,"game":true,"p":"B(초기0/h5)와 C(초기1/h10)를 비교하기 어려운 이유는?","o":["둘 다 실패해서","결과 파일이 없어서","두 조건이 함께 달라서","seed가 달라서"],"a":2,"h":"공정한 비교는 한 번에 한 조건만 바꿔야 원인을 분리할 수 있습니다. B와 C를 직접 비교하면 실행 길이(horizon)와 초기 배치가 동시에 달라져, 어느 변화가 결과를 만들었는지 단정할 수 없습니다.","w":"B↔C는 실행 길이와 초기 배치가 둘 다 달라, 결과 차이의 원인을 하나로 설명할 수 없습니다.","an":"5일차 슬라이드 v2 · 08 공정한 두 비교 (p.101, p.110)","src":"B와 C를 직접 비교하면 horizon과 초기 배치가 동시에 달라져 어느 변화가 결과를 만들었는지 분리하기 어렵습니다."},{"id":"t8-03","ty":"mc","lv":2,"game":true,"p":"result.json이 없는 조건은 어떻게 집계하나요?","o":["과제 실패","incomplete","성공","미실행(missing_runs)"],"a":3,"h":"평가는 결과를 완료, 중단(incomplete), 결과 파일이 아예 없는 경우로 나눕니다. result.json이 없는 조건은 실패로 세지 않고 아직 실행하지 않은 것으로 따로 남겨 성공률 분모에 섞지 않습니다.","w":"result.json이 없으면 missing_runs(미실행)이며 과제 실패로 세지 않습니다.","an":"5일차 슬라이드 v2 · 08 완료·중단·미실행을 분리하여 집계 (p.103)","src":"● completed는 실행 절차가 끝났다는 상태입니다.\n● success는 환경이 판정한 과제 달성 여부입니다.\n● incomplete는 오류·중단이며 완료 실패와 다릅니다.\n● 파일이 없으면 미실행으로 남기고 분모를 구분합니다."},{"id":"t8-04","ty":"mc","lv":2,"game":true,"p":"완료된 실행이 0개일 때 '완료 기준 성공률'은?","o":["null","0%","100%","50%"],"a":0,"h":"완료 기준 성공률은 '완료 성공 ÷ 완료된 실행 수'로 계산하므로, 완료가 0개면 분모가 0이 됩니다. 자료는 이때 값을 0%로 바꾸지 말고 '값 없음'으로 남겨 분모가 없다는 사실을 드러내라고 안내합니다.","w":"완료가 0이면 완료 기준 성공률은 0%가 아니라 null입니다. 분모 0을 0%로 바꾸지 않습니다.","an":"5일차 슬라이드 v2 · 08 완료·중단·미실행을 분리하여 집계 (p.103)","src":"result.json 누락은 missing_runs이며 과제 실패로 세지 않습니다.\n완료가 0이면 완료 기준 성공률은 0%가 아닌 null입니다."},{"id":"t8-05","ty":"mc","lv":3,"game":true,"p":"성공률 집계에서 제외하는 실행 모드는?","o":["rollout","inspect·infer","execute=5 실행","초기1 실행"],"a":1,"h":"성공률은 과제를 실제로 수행한 rollout 결과만으로 계산합니다. 초기 장면만 확인하는 모드와 행동 예측까지만 하는 모드는 정상 완료 상태를 가질 수 있어도 로봇이 과제를 수행하지 않았으므로 집계에서 뺍니다.","w":"inspect와 infer도 completed 상태를 가질 수 있지만 과제 수행 rollout이 아니므로 성공률 집계에 넣지 않습니다.","an":"5일차 슬라이드 v2 · 08 기초 복습: 완료·성공·미실행 (p.108)","src":"inspect와 infer도 정상 완료 상태를 가질 수 있지만 과제 수행 rollout이 아니므로 성공률 집계에 넣지 않습니다."},{"id":"t8-06","ty":"ox","lv":1,"game":true,"p":"조건당 한 번의 결과만으로 일반적인 성공률을 말할 수 있다.","a":false,"h":"조건당 한 번의 결과는 탐색 실험에 해당합니다. 성공률을 일반화하려면 같은 조건의 반복과 추가 배치·seed가 있어야 변동을 볼 수 있고, 가상 환경 성과를 실물 로봇 성능으로 바로 옮겨서도 안 됩니다.","w":"틀렸습니다. 조건당 한 번은 탐색 실험입니다. 반복과 다양한 초기 조건이 있어야 성공률을 추정할 수 있습니다.","an":"5일차 슬라이드 v2 · 08 한 번의 결과로 일반 성공률을 말하지 않습니다 (p.105)","src":"● 조건당 한 번의 결과는 탐색 실험입니다.\n● 성공률 일반화에는 반복과 다양한 초기 조건이 필요합니다."},{"id":"t8-07","ty":"ox","lv":2,"game":true,"p":"저장 영상 20fps는 벽시계 기준 제어 20Hz를 뜻하지 않는다.","a":true,"h":"rollout.mp4는 fps=20으로 저장되지만 이는 재생 시간의 설정일 뿐입니다. 이 실행기는 추론 중 환경을 멈추는 동기 방식이므로 모델 추론을 포함한 실제 벽시계 시간이나 초당 제어 횟수를 기록한 값이 아닙니다.","w":"맞습니다. 영상 fps는 저장·재생 속도이며 벽시계 제어 주파수가 아닙니다. 시뮬레이션 성공도 실물 성능으로 바로 옮기지 않습니다.","an":"5일차 슬라이드 v2 · 08 한 번의 결과로 일반 성공률을 말하지 않습니다 (p.105)","src":"rollout.mp4는 fps=20으로 저장됩니다. 이는 재생 시간의 설정이며 모델 추론을 포함한 실제 벽시계 시간의 기록이 아닙니다."},{"id":"t8-08","ty":"match","lv":2,"game":false,"p":"평가 조건과 설정을 연결하세요.","pairs":[["A (기준)","초기0 · seed7 · execute10"],["B (실행 길이 비교)","초기0 · seed7 · execute5"],["C (배치 비교)","초기1 · seed7 · execute10"]],"h":"세 조건은 모두 seed7을 유지합니다. 기준 A에서 실행 길이만 줄인 것이 실행 길이 비교 조건이고, 실행 길이는 그대로 둔 채 초기 배치 번호만 바꾼 것이 배치 비교 조건입니다.","w":"모든 조건에서 task·모델·최대 스텝·seed7을 유지합니다.","an":"5일차 슬라이드 v2 · 08의 목적: 조건 차이와 결과를 연결 (p.101)","src":"● A: 초기0 · seed7 · execute10 — 기준\n● B: 초기0 · seed7 · execute5 — 실행 길이 비교\n● C: 초기1 · seed7 · execute10 — 배치 비교"},{"id":"t8-09","ty":"order","lv":2,"game":false,"p":"08 비교 실행 셀이 동작하는 순서를 맞추세요.","steps":["비교 조건 목록과 실행 이름 대응","결과 파일 확인(기존 기록 읽기)","누락 여부 판단","누락 조건만 실행","평가·영상 비교"],"h":"08의 비교 실행 셀은 먼저 비교 조건 목록과 실행 이름을 대응시키고, 기존 결과 파일을 읽어 확인합니다. 그다음 추가 실행이 필요한지 판단해 결과가 없는 조건만 실행하고, 마지막에 결과를 다시 읽어 평가와 영상을 비교합니다.","w":"조건 목록 → 기존 결과 확인 → 누락 판단 → 누락 조건만 실행(FINISHED 뒤 창 닫기) → 평가·영상 비교 순서입니다.","an":"5일차 슬라이드 v2 · 08 비교 실행 셀: 없는 조건만 실행 (p.102)","src":"1. 비교 조건 목록\n실행 이름 대응\n2. 결과 파일 확인\n기존 기록 읽기\n3. 누락 여부 판단\n추가 실행 필요?\n4. 기존 결과 사용\n새 실행·창 없음\n5. 누락 조건 실행\nFINISHED·창 닫기\n6. 평가·영상 비교\n결과 다시 읽기"},{"id":"t8-10","ty":"multi","lv":2,"game":true,"p":"4일차와 5일차를 비교한 설명으로 옳은 것을 <b>모두<\/b> 고르세요.","o":["4일차는 사람이 만든 ROS 제어기가 이동","5일차는 학습된 정책이 조작 행동 예측","성공 숫자만으로 우열을 정한다","4일차 입력은 웹캠·좌표 판단","5일차 결과가 실물 성능을 보장"],"a":[0,1,3],"h":"4일차는 웹캠과 좌표 판단을 입력으로 삼고, 실제 이동은 사람이 작성한 ROS 제어기가 수행했습니다. 5일차는 가상 영상·지시·로봇 상태를 입력으로 받아 학습된 정책이 로봇 팔과 그리퍼의 조작 행동을 직접 예측합니다.","w":"4일차는 웹캠·좌표 판단과 사람이 만든 제어기, 5일차는 가상 영상·지시·상태와 학습된 정책입니다. 과제가 달라 성공 숫자만으로 우열을 정하지 않습니다.","an":"5일차 슬라이드 v2 · 08 최종 설명: 입력·행동 주체·실패 원인 (p.106)","src":"4일차: 웹캠·좌표 판단 → 사람이 만든 ROS 제어기\n5일차: 가상 영상·지시·상태 → 학습된 정책의 조작 행동"}]},{"id":"t9","title":"자습 · 시연 데이터와 로컬 학습","ref":"09–11 · p.115–122","qs":[{"id":"t9-01","ty":"mc","lv":1,"game":true,"p":"선택 자습 09~13의 진행 순서는?","o":["데이터→설계→훈련→배포→평가","설계→데이터→훈련→평가→배포","훈련→데이터→설계→평가→배포","설계→훈련→데이터→배포→평가"],"a":1,"h":"선택 자습 09~13은 내 작업의 입력·행동 계약을 정하는 것부터 시작해, 시연 데이터를 모으고, 그 데이터로 미세조정한 뒤, 재현 평가를 거쳐 마지막에 장비에 내보내는 흐름입니다. 노트북 번호 순서가 곧 개발 단계 순서입니다.","w":"09 설계 → 10 데이터 → 11 훈련 → 12 평가 → 13 배포 순서입니다.","an":"5일차 슬라이드 v2 · 내 하드웨어로 VLA 훈련을 이어가는 선택 자습 (p.115)","src":"● 09 설계 → 10 데이터 → 11 훈련 → 12 평가 → 13 배포"},{"id":"t9-02","ty":"mc","lv":2,"game":true,"p":"시연 데이터를 train·val·test로 나눌 때 권장하는 단위는?","o":["개별 프레임 무작위","파일 크기","수집 그룹·episode 경계","카메라별"],"a":2,"h":"인접 프레임은 장면이 매우 비슷해서 프레임 단위로 무작위 분할하면 평가 세트에 학습 장면이 새어 들어갑니다. 그래서 수집 그룹을 먼저 나누고 그 안의 episode를 배정해, 시연 단위의 경계를 보존합니다.","w":"인접 프레임을 무작위로 나누면 정보가 새어 나갈 수 있으므로 수집 그룹과 episode 경계를 보존해 나눕니다.","an":"5일차 슬라이드 v2 · 10 훈련에 쓸 시연 데이터를 구성 (p.119)","src":"인접 프레임을 무작위로 나누면 정보가 새어 나갈 수 있습니다. 수집 그룹과 episode 경계를 보존하세요."},{"id":"t9-03","ty":"mc","lv":2,"game":true,"p":"시연을 수집할 때 학습용 action으로 기록해야 하는 값은?","o":["조작자의 원래 요청값","제한·보정 후 실제 전달 명령","정책의 예측값","관측 상태값"],"a":1,"h":"시연 수집에서는 조작자가 처음 요청한 값이 아니라, 제한과 보정을 거쳐 제어기에 실제로 전달된 명령을 학습용 action으로 남깁니다. 두 값이 다르면 원래 요청과 실제 전달값을 모두 감사 기록에 남깁니다.","w":"제한·보정을 거쳐 제어기에 실제 전달한 명령을 action으로 기록하고, 원래 요청과 다르면 둘 다 감사 기록에 남깁니다.","an":"10.VLA_v2/10_selfstudy_demonstration_data · 수집 순서","src":"3. 제한·보정을 거친 뒤 제어기에 실제 전달한 명령을 학습용 `action`으로 기록합니다. 원래 요청과 실제 전달값이 다르면 둘 다 감사 기록에 남깁니다."},{"id":"t9-04","ty":"mc","lv":2,"game":true,"p":"Jetson만 있을 때 훈련 가능 여부를 먼저 확인하는 방법은?","o":["batch 1로 역전파까지 확인","추론이 되면 가능하다고 판단","x86용 이미지 사용","바로 장시간 훈련"],"a":0,"h":"Jetson에서 추론이 된다고 훈련도 된다고 결론 낼 수 없습니다. 훈련에는 역전파 활성값·gradient·optimizer state가 추가되므로, Jetson만 있다면 가장 작은 배치 크기로 짧은 forward/backward 시범부터 해서 OOM·메모리·발열을 측정합니다.","w":"Jetson만 있다면 batch 1로 역전파까지 먼저 확인합니다. 추론이 된다는 사실만으로 훈련 가능 여부를 판단하지 않습니다.","an":"5일차 슬라이드 v2 · 먼저 내 장비에서 가능한 범위를 측정 (p.116)","src":"| Jetson만 있는 경우 | batch 1의 짧은 forward/backward 시범부터 | OOM 여부, 메모리 여유, 지속 속도·발열 |\n\nJetson에서 추론이 된다는 사실만으로 훈련 가능 여부를 결론 내릴 수 없습니다. 역전파 활성값·gradient·optimizer state가 추가됩니다. 특정 RAM 용량이면 된다고 보장하지 않고 자신의 구성에서 측정합니다."},{"id":"t9-05","ty":"mc","lv":3,"game":true,"p":"20 step 시험 학습은 끝났지만 작업이 실패합니다. 알맞은 다음 행동은?","o":["학습 성공이니 바로 배포","OOM이니 batch 증가","checkpoint 삭제 후 재시작","데이터·규모 검토 후 평가"],"a":3,"h":"20 step 시험은 설치와 저장 동작을 확인하는 것이지 학습 완료 기준이 아닙니다. 짧은 실행이 끝났는데 작업이 실패한다면 데이터 품질과 학습 규모를 살펴본 뒤, 12의 평가 절차에서 기준 모델과 같은 조건으로 비교합니다.","w":"20 step 완료는 설치·경로 점검일 뿐입니다. 데이터 품질과 학습 규모를 검토하고 12에서 기준 모델과 같은 조건으로 평가합니다.","an":"10.VLA_v2/11_selfstudy_local_training · 오류와 조치 표","src":"| 20 step 완료인데 작업 실패 | 설치 점검과 학습 완료는 다릅니다. 데이터 품질·학습 규모를 검토하고 12에서 평가합니다."},{"id":"t9-06","ty":"ox","lv":1,"game":true,"p":"ARM(Jetson)용 수업 이미지를 x86 GPU PC에서 그대로 사용하면 된다.","a":false,"h":"본수업 이미지는 ARM64 Jetson 의존성 패치가 들어간 추론 검증용입니다. 아키텍처가 다른 x86 GPU PC에서는 이 이미지를 복사해 실행하지 말고, 별도 환경에 LeRobot·PyTorch/CUDA 호환 조합을 고정해 준비 검사부터 진행합니다.","w":"틀렸습니다. ARM용 수업 이미지를 x86 PC에서 그대로 쓰지 않고, 해당 CUDA/PyTorch 조합의 별도 환경을 준비합니다.","an":"5일차 슬라이드 v2 · 먼저 내 장비에서 가능한 범위를 측정 (p.116)","src":"**환경 분리:** 본수업 이미지는 추론 검증용이고 ARM64 Jetson 의존성 패치가 있습니다. x86 GPU PC로 이 이미지를 그대로 복사해 실행하지 않습니다. PC에서는 별도 환경에 LeRobot 버전·PyTorch/CUDA 호환 조합을 고정하고 11의 준비 검사부터 진행합니다."},{"id":"t9-07","ty":"ox","lv":2,"game":true,"p":"추론용 가중치 로드와, optimizer 등을 복구하는 학습 재개는 서로 다른 작업이다.","a":true,"h":"체크포인트는 pretrained_model/(정책·설정·processor)과 training_state/(optimizer·scheduler·난수·step)로 나뉩니다. 추론에는 앞의 것만 있으면 되지만, 정확히 이어서 학습하려면 뒤의 학습 상태까지 복원해야 합니다.","w":"맞습니다. 학습 재개에는 step·optimizer 같은 학습 상태 복구가 필요하므로 짧은 실행으로 먼저 확인합니다.","an":"5일차 슬라이드 v2 · 자습 완료는 재현 가능한 증거로 (p.127)","src":"저장 디렉터리는 `checkpoints/<step>/pretrained_model/`과 `training_state/`로 나뉩니다. 전자는 정책·설정·processor 파일로 추론에 쓰고, 후자는 optimizer·scheduler·난수·step 복원에 필요합니다. 전체 체크포인트를 보존합니다. 정책 가중치만 다시 읽어 시작하는 것은 정확한 이어 학습과 다릅니다."},{"id":"t9-08","ty":"match","lv":2,"game":false,"p":"자습 노트북과 다루는 내용을 연결하세요.","pairs":[["09","프로젝트 계약과 하드웨어 역할"],["10","시연 데이터 구성과 분할"],["11","로컬 미세조정과 체크포인트"],["12","재현 평가와 실패 분석"],["13","배포 묶음과 롤백"]],"h":"자습 노트북은 번호 순서대로 설계(계약·하드웨어 역할), 데이터(시연 구성·분할), 훈련(미세조정·체크포인트), 평가(재현 평가·실패 분석), 배포(배포 묶음·롤백)를 다룹니다. 각 번호가 어느 개발 단계인지 떠올려 연결하세요.","w":"09~13은 정규 실습 이후 보유 하드웨어에서 진행하는 선택 자습입니다.","an":"5일차 슬라이드 v2 · 선택 자습 09~13 (p.115–125)","src":"● 09 설계 → 10 데이터 → 11 훈련 → 12 평가 → 13 배포"},{"id":"t9-09","ty":"order","lv":2,"game":false,"p":"긴 학습 전에 작은 경로부터 검증하는 순서를 맞추세요.","steps":["자산·환경 준비(모델·데이터 고정)","1배치 검사(shape·단위·유한값)","20 step 시험(역전파·저장)","소수 시연 진단(과적합 가능?)","본 학습·검증","checkpoint·재개 확인"],"h":"긴 학습 전에는 작은 경로부터 검증합니다. 모델·데이터를 고정하고 1배치의 shape·단위·유한값을 검사한 뒤, 20 step으로 역전파·저장을 시험하고, 소수 시연으로 과적합 가능성을 진단한 다음 본 학습을 하고 마지막에 checkpoint 재개를 확인합니다.","w":"작은 시연도 학습하지 못하면 장기 실행 전에 원인을 찾습니다. loss 감소가 작업 성공을 보장하지는 않습니다.","an":"5일차 슬라이드 v2 · 11 작은 훈련으로 환경부터 검증 (p.121)","src":"1. 자산·환경 준비\n모델·데이터 고정\n2. 1배치 검사\nshape·단위·유한값\n3. 20 step 시험\n역전파·저장 확인\n4. 소수 시연 진단\n과적합 가능한가\n5. 본 학습·검증\n자원·지표 기록\n6. checkpoint·재개\n새 프로세스 확인"},{"id":"t9-10","ty":"multi","lv":2,"game":true,"p":"로컬 학습 중 CUDA OOM이나 Killed가 났을 때 확인할 것을 <b>모두<\/b> 고르세요.","o":["batch 1·worker 0 설정","본인 중복 실행 여부","RAM 부족과 GPU 부족 구분","검사·정지 기능 제거","모델 다운로드 반복"],"a":[0,1,2],"h":"메모리 부족이나 프로세스 강제 종료가 나면 먼저 배치 크기와 데이터 로더 worker 수를 가장 작게 줄였는지, 자신이 같은 장비에서 다른 실행을 겹쳐 돌리고 있지 않은지 확인합니다. 또한 시스템 RAM이 부족한 것인지 GPU 메모리가 부족한 것인지 나눠서 봅니다.","w":"batch 1·worker 0과 중복 실행을 확인하고, RAM 부족과 GPU 부족을 구분합니다.","an":"10.VLA_v2/11_selfstudy_local_training · 오류와 조치 표","src":"| CUDA OOM / `Killed` | batch 1·worker 0과 본인 중복 실행을 확인합니다. RAM 부족과 GPU 부족을 구분합니다."}]},{"id":"t10","title":"자습 · 평가와 배포·운영","ref":"12–13 · p.123–127","qs":[{"id":"t10-01","ty":"mc","lv":1,"game":true,"p":"배포할 때 모델 가중치와 함께 묶어야 하는 것은?","o":["노트북 글꼴 설정","processor·실행 계약","브라우저 탭","영상 fps 값"],"a":1,"h":"배포는 가중치만 바꾸는 일이 아닙니다. 배포 묶음에는 정책 config·가중치와 함께 pre/postprocessor·통계, 그리고 카메라·state·action의 순서·단위·좌표계·시간을 정한 계약 파일이 함께 들어가야 같은 입력 해석이 보장됩니다.","w":"배포는 정책·processor·계약을 하나의 버전 묶음으로 저장하고 시험한 뒤, 문제 시 이전 묶음으로 롤백합니다.","an":"5일차 슬라이드 v2 · 13 모델과 실행 계약을 함께 배포 (p.125)","src":"pretrained_model/ 정책 config·safetensors·pre/postprocessor·통계\n cache/ 필요한 tokenizer·VLM 설정 등 오프라인 캐시\n contract.json 카메라·state·action의 순서/단위/좌표계/시간 계약"},{"id":"t10-02","ty":"mc","lv":2,"game":true,"p":"'저장 입력 재생' 단계에서 확인할 수 있는 것은?","o":["폐루프 작업 성공","실제 접촉 성능","shape·통계·출력 유한성","모든 장비의 일반 성능"],"a":2,"h":"평가 범위는 저장 관측 재생 → 시뮬레이션 폐루프 → 실제 장비의 제한된 시험 순서로 넓혀 갑니다. 저장된 입력을 다시 넣어 보는 첫 단계에서는 입출력 형태와 수치가 정상인지까지만 확인할 수 있고, 폐루프 작업 성공은 아직 말할 수 없습니다.","w":"저장 입력 재생은 shape·통계·출력 유한성·재로딩 일치를 확인할 뿐, 폐루프 작업 성공은 아직 말할 수 없습니다.","an":"10.VLA_v2/12_selfstudy_evaluation · loss가 내려가면 배포해도 되나요?","src":"| 저장 입력 재생 | shape·통계·출력 유한성·재로딩 일치 | 폐루프 작업 성공 |"},{"id":"t10-03","ty":"mc","lv":2,"game":true,"p":"실행이 '처음은 맞고 점점 이탈'할 때 먼저 조사할 것은?","o":["관절 순서·단위·좌표계","분포 이동·horizon·지연","데이터 누수·과적합","watchdog 누락"],"a":1,"h":"실패 관찰표에서 '처음은 맞고 점점 이탈'하는 경우는 실행이 진행될수록 학습 때와 다른 상황으로 벗어나거나, 행동을 너무 길게 이어 쓰거나, 지연이 쌓이는 문제를 의심합니다. 다음 작업으로는 짧은 horizon 비교와 복구 시연 수집을 제안합니다.","w":"점점 이탈하면 분포 이동·horizon·지연을 먼저 보고, 짧은 horizon 비교와 복구 시연 수집을 다음 작업으로 합니다.","an":"10.VLA_v2/12_selfstudy_evaluation · 실패를 다음 작업으로 연결하기","src":"| 처음은 맞고 점점 이탈 | 분포 이동·horizon·지연 | 짧은 horizon 비교, 복구 시연 수집 |"},{"id":"t10-04","ty":"mc","lv":2,"game":true,"p":"내 로봇에 대응하는 시뮬레이터가 없을 때 LIBERO 결과는?","o":["내 로봇 성공으로 대체","성공률 100%로 간주","내 로봇 성공을 대신하지 않음","배포 승인 근거"],"a":2,"h":"LIBERO는 본수업용 가상 과제이고, 본수업의 상태8·행동7도 LIBERO 계약입니다. 자신의 로봇과 대응되는 시뮬레이터가 없다면 LIBERO에서 성공했다는 결과를 그 로봇에서도 성공한다는 근거로 쓸 수 없습니다.","w":"대응 시뮬레이터가 없으면 LIBERO 결과를 자기 로봇의 성공으로 대체하지 않습니다.","an":"5일차 슬라이드 v2 · 12 학습 손실보다 작업 성공을 확인 (p.123)","src":"학습 loss는 시연에서의 objective 값입니다. 실제 환경에서는 정책 행동이 다음 관측을 바꾸므로 작은 오차가 누적될 수 있습니다. 따라서 **저장 관측 재생 → 시뮬레이션 폐루프 → 실제 장비의 제한된 시험** 순서로 평가 범위를 넓힙니다. 자신의 로봇과 대응되는 시뮬레이터가 없으면 LIBERO 성공을 그 로봇의 성공으로 대체하지 않습니다."},{"id":"t10-05","ty":"mc","lv":3,"game":true,"p":"센서 입력이 끊긴 뒤에도 로봇이 계속 움직인다면 확인할 것은?","o":["오래된 명령·watchdog 누락","카메라 해상도","loss 곡선","영상 fps"],"a":0,"h":"입력이 끊긴 뒤에도 로봇이 움직인다는 것은 이미 오래된 명령이 계속 적용되고 있거나, 입력 이상 시 정지를 수행할 감시 장치가 빠져 있다는 신호입니다. 다음 작업으로 제어기 중단 경로와 명령 수명 검사를 점검합니다.","w":"입력 끊김 후 계속 움직이면 오래된 명령과 watchdog 누락을 조사하고, 제어기 중단 경로와 명령 수명을 검사합니다.","an":"10.VLA_v2/12_selfstudy_evaluation · 실패를 다음 작업으로 연결하기","src":"| 입력 끊김 후 계속 움직임 | 오래된 명령·watchdog 누락 | 제어기 중단 경로와 13의 명령 수명 검사 |"},{"id":"t10-06","ty":"ox","lv":1,"game":true,"p":"배포는 학습한 가중치 파일을 복사하면 끝난다.","a":false,"h":"배포 구조에서는 센서 관측에 시간·유효성을 붙이고, policy worker가 학습 때와 같은 전처리로 행동을 계산하며, 제어 adapter가 단위·좌표계 변환과 범위 검사를 합니다. 독립 watchdog의 정지 절차까지 갖춰야 하므로 파일 복사만으로는 끝나지 않습니다.","w":"틀렸습니다. 배포는 가중치 파일 복사로 끝나지 않습니다. processor·계약·watchdog·정지 조건을 함께 확인합니다.","an":"10.VLA_v2/13_selfstudy_local_deployment · 배포는 가중치 복사로 끝나지 않습니다","src":"센서 관측에는 시간과 상태 유효성을 붙입니다. policy worker는 학습 때와 같은 전처리로 행동을 계산하고 후처리합니다. 제어 adapter는 로봇의 단위·좌표계로 변환하고 유효성·수명·범위를 검사합니다. 독립 watchdog이 추론 프로세스 장애에도 장비별 정지 절차를 수행합니다."},{"id":"t10-07","ty":"ox","lv":2,"game":true,"p":"배포 후 문제가 생기면 이전 버전 묶음으로 롤백할 수 있어야 한다.","a":true,"h":"새 버전은 출력만 기록 → 제한된 동작 → 반복 시험 → 채택 순서로 올립니다. 실패하면 이전 정책·processor·contract 묶음을 함께 복구해야 하므로, 이전 묶음을 버전별로 보존해 두는 것이 전제입니다.","w":"맞습니다. 버전 묶음 → 오프라인 재생 → 출력 기록 → 제한된 동작 → 반복 평가·채택 → 문제 시 롤백 순서입니다.","an":"5일차 슬라이드 v2 · 13 모델과 실행 계약을 함께 배포 (p.125)","src":"새 버전은 **출력만 기록 → 제한된 동작 → 반복 시험 → 채택** 순서로 올립니다. 프로세스 시작 때 모델 hash와 contract version을 로그에 남기고 장치 준비 전에는 actuator를 활성화하지 않습니다. 실패하면 이전 정책·processor·contract 묶음을 함께 복구합니다."},{"id":"t10-08","ty":"match","lv":2,"game":false,"p":"실패 관찰과 먼저 조사할 것을 연결하세요.","pairs":[["시작부터 반대 방향 이동","관절 순서·단위·좌표계·카메라 방향"],["잡기 직전 반복 실패","접촉 구간 시연·카메라 가림"],["loss만 좋고 시험 실패","데이터 누수·과적합·조건 편중"],["입력 끊김 후 계속 이동","오래된 명령·watchdog 누락"]],"h":"관찰별로 의심할 곳이 다릅니다. 처음부터 엉뚱한 방향이면 입력·출력의 순서·단위·좌표 계약을, 잡기 직전 실패는 접촉 구간 데이터와 시야 가림을, loss만 좋은 경우는 데이터 분할 문제를, 입력이 끊겨도 움직이면 명령 만료·감시 장치를 먼저 봅니다.","w":"관찰한 실패를 원인 후보와 다음 작업으로 연결해야 데이터·설정을 개선할 수 있습니다.","an":"10.VLA_v2/12_selfstudy_evaluation · 실패를 다음 작업으로 연결하기","src":"| 시작부터 반대 방향 이동 | 관절 순서·단위·좌표계·카메라 방향 | adapter 검사와 알려진 입력 재생 |\n| 잡기 직전 반복 실패 | 시연의 접촉 구간·카메라 가림 | 해당 구간의 시연·관측 개선 |\n| 처음은 맞고 점점 이탈 | 분포 이동·horizon·지연 | 짧은 horizon 비교, 복구 시연 수집 |\n| loss만 좋아지고 시험 실패 | 데이터 누수·과적합·조건 편중 | 그룹 분할 재검토, validation 비교 |\n| 입력 끊김 후 계속 움직임 | 오래된 명령·watchdog 누락 | 제어기 중단 경로와 13의 명령 수명 검사 |"},{"id":"t10-09","ty":"order","lv":2,"game":false,"p":"배포 묶음을 시험하고 되돌리는 순서를 맞추세요.","steps":["버전 묶음(정책·processor·계약)","오프라인 재생(파일 누락 확인)","출력만 기록(actuator 적용 전)","제한된 동작 단계 시험","반복 평가·채택","문제 시 롤백"],"h":"배포 묶음은 버전을 고정해 묶은 뒤, 오프라인 재생으로 파일 누락을 확인하고, 실제 actuator에 적용하기 전에 출력만 기록해 봅니다. 그다음 제한된 동작으로 단계적으로 시험하고 반복 평가 후 채택하며, 문제가 생기면 이전 묶음으로 되돌립니다.","w":"묶음 저장 → 오프라인 재생 → 출력만 기록 → 제한된 동작 → 반복 평가·채택 → 필요 시 롤백입니다.","an":"5일차 슬라이드 v2 · 13 모델과 실행 계약을 함께 배포 (p.125)","src":"1. 버전 묶음\n정책·processor·계약\n2. 오프라인 재생\n파일 누락 확인\n3. 출력만 기록\nactuator 적용 전\n4. 제한된 동작\n단계적으로 시험\n5. 반복 평가·채택\n버전·근거 기록\n6. 문제 시 롤백\n이전 묶음 복원"},{"id":"t10-10","ty":"multi","lv":2,"game":true,"p":"평가 결과를 기록할 때 서로 구분해야 하는 것을 <b>모두<\/b> 고르세요.","o":["성공","완료된 실패","실행 중단","미실행","loss 값 하나만"],"a":[0,1,2,3],"h":"평가 기록은 결과를 한 종류의 '실패'로 뭉뚱그리지 않습니다. 과제를 달성한 경우, 절차는 끝났지만 과제를 못 이룬 경우, 오류·중단으로 끝난 경우, 결과 파일이 아예 없는 경우를 각각 따로 세어 분모를 명시합니다.","w":"성공·완료 실패·중단·미실행을 분리해 기록하고, 분모가 0이면 성공률을 0%로 바꾸지 않습니다.","an":"5일차 슬라이드 v2 · 12 결과 분리 · 10.VLA_v2/12 오류와 조치 표 (p.123)","src":"| 평가 JSON 없음 / 성공률 null | 실행 경로와 완료/중단/미실행을 확인합니다. 분모 0을 0%로 바꾸지 않습니다. | 결과와 실행 기록 대응, 분모 명시 |"}]}]};

const TYPES={mc:['객관식','--ty-mc'],multi:['복수 선택','--ty-multi'],ox:['O / X','--ty-ox'],match:['짝 맞추기','--ty-match'],order:['순서 맞추기','--ty-order'],num:['계산','--ty-num']};

  match:'왼쪽 항목을 누른 뒤 짝이 되는 오른쪽 항목을 누르세요. 연결된 항목을 다시 누르면 풀립니다.',

/* 순위 저장소 — 공유 순위로 바꿀 때 이 객체만 교체 */
// 순위는 같은 조건(게임 모드 + 풀이 시간)끼리만 비교한다. key = 'timeattack:10'
const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

/* ── 유틸 ──────────────────────────────── */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function say(msg){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=msg,30);}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('📋 클립보드에 복사했습니다');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'📋 클립보드에 복사했습니다':'복사하지 못했습니다. 인쇄 기능을 이용하세요.');
}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

/* ── 오답노트 ──────────────────────────── */
function addWrong(id,ans){const w=S.wrong[id]||{n:0};w.n++;w.last=ans;w.at=Date.now();w.solved=false;S.wrong[id]=w;}
function markSolved(id){if(S.wrong[id]&&!S.wrong[id].solved){S.wrong[id].solved=true;S.wrong[id].at=Date.now();}}
const wrongList=solved=>Object.keys(S.wrong).filter(id=>QMAP[id]&&!!S.wrong[id].solved===solved)
  .sort((a,b)=>QTAB[a].idx-QTAB[b].idx||ALLQ.indexOf(QMAP[a])-ALLQ.indexOf(QMAP[b]));

/* ── 문항 풀이 상태(학습·재도전 공용) ───── */
let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

function cardHTML(q,n){
  const [label,color]=TYPES[q.ty];
  const g=cur.graded, a=cur.ans[q.id], fa=finalAns(q), ok=g&&isCorrect(q,fa);
  const lock=g?' disabled':'';
  let body='';
  if(q.ty==='mc'||q.ty==='multi'){
    const multi=q.ty==='multi', mine=multi?(a||[]):[a];
    body='<div class="opts">'+q.o.map((o,i)=>{
      const right=multi?q.a.includes(i):q.a===i, picked=mine.includes(i);
      const cls=g?(right?' ans':picked?' miss':''):'';
      return `<label class="opt${cls}"><span class="onum">${i+1}</span><input type="${multi?'checkbox':'radio'}" name="r-${q.id}" data-act="${multi?'tick':'pick'}" data-q="${q.id}" data-i="${i}"${picked?' checked':''}${lock}><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(q.ty==='ox'){
    body='<div class="ox">'+[true,false].map(v=>{
      const cls=g?(q.a===v?' ans':a===v?' miss':''):'';
      return `<button type="button" class="${cls.trim()}" data-act="ox" data-q="${q.id}" data-v="${v?1:0}" data-fk="${q.id}-ox${v?1:0}" aria-pressed="${a===v}" aria-label="${v?'맞다 O':'틀리다 X'}"${lock}>${v?'O':'X'}</button>`;
    }).join('')+'</div>';
  }else if(q.ty==='match'){
    const m=a||{}, sel=cur.msel[q.id], linkedBy={};
    Object.entries(m).forEach(([l,r])=>linkedBy[r]=+l);
    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${PAL[i%PAL.length]})" data-act="ml" data-q="${q.id}" data-i="${i}" data-fk="${q.id}-l${i}"${lock}><span class="tag">${LETTER[i]}</span>${esc(p[0])}</button>`;
    }).join('');
    const right=cur.shuf[q.id].map(j=>{
      const by=linkedBy[j], linked=by!=null, cls=(linked?' linked':'')+(g&&linked?(by===j?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${linked?PAL[by%PAL.length]:'--line'})" data-act="mr" data-q="${q.id}" data-j="${j}" data-fk="${q.id}-r${j}"${lock}><span class="tag">${linked?LETTER[by]:''}</span>${esc(q.pairs[j][1])}</button>`;
    }).join('');
    body=`<div class="match"><div class="mcol mleft">${left}</div><div class="mcol mright">${right}</div></div>`;
  }else if(q.ty==='order'){
    const seq=a||[], full=seq.length===q.steps.length;
    body='<div class="olist">'+(cur.shuf[q.id]||range(q.steps.length)).map(si=>{
      const pos=seq.indexOf(si), on=pos>=0;
      const cls=(on?' on':'')+(g?(pos===si?' ok':' no'):'');
      const fix=g&&pos!==si?`<span class="ofix">정답 ${si+1}</span>`:'';
      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }
  const numAns=q.ty==='mc'?`${q.a+1}번 · `:q.ty==='multi'?q.a.map(i=>i+1).join('·')+'번 · ':'';
  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${mediaHTML(q)}${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>${voiceRow(q,q.id)}`}${body}${exp}</article>`;
}
const LV_NAME=['쉬움','보통','어려움'];
function lvHTML(lv){
  lv=lv||1;
  const dots=[1,2,3].map(k=>k<=lv?`<i class="d${k}">●</i>`:'<i class="off">○</i>').join('');
  return `<span class="lv lv${lv}" title="난이도 ${LV_NAME[lv-1]}"><span class="dots" aria-hidden="true">${dots}</span><em>${LV_NAME[lv-1]}</em></span>`;
}
// 자료 발췌: 이스케이프 후 마크다운 기호만 가볍게 서식으로 (**굵게**, `코드`, 머리 #)
const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
function hintHTML(q){
  if(!q.h)return '';
  const open=cur.hints.has(q.id), label=q.ty==='num'?'Hint · 계산식':'Hint';
  // 2단계: ① 자세한 힌트(h) ② 자료 보기 — 자료 원문 발췌(src) + 위치(an)
  const sopen=cur.srcs.has(q.id);
  const src=q.src?`<div class="srcwrap"><button type="button" class="srcbtn" data-act="src" data-q="${q.id}" data-fk="${q.id}-src" aria-expanded="${sopen}" aria-controls="src-${q.id}">`+
    `<span class="caret" aria-hidden="true">${sopen?'▾':'▸'}</span>📖 자료 보기</button>`+
    (sopen?`<blockquote class="src" id="src-${q.id}"><p>${srcText(q.src)}</p>${q.an?`<cite>${esc(q.an)}</cite>`:''}</blockquote>`:'')+`</div>`:'';
  return `<div class="hintwrap"><button type="button" class="hintbtn" data-act="hint" data-q="${q.id}" data-fk="${q.id}-hint" aria-expanded="${open}" aria-controls="hint-${q.id}">`+
    `<span class="caret" aria-hidden="true">${open?'▾':'▸'}</span>${label}</button>`+
    (open?`<div class="hint" id="hint-${q.id}">${q.h}${src}</div>`:'')+`</div>`;
}
function refreshCard(q){
  const el=document.getElementById('card-'+q.id);if(!el)return;
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  el.outerHTML=cardHTML(q,el.dataset.n);
  if(fk){const f=app.querySelector(`[data-fk="${fk}"]`);if(f&&!f.disabled)f.focus();}
  updateProgress();
}
const pad2=n=>String(n).padStart(2,'0');
const fmtCnt=(n,t)=>`(${pad2(n)}/${pad2(t)})`;
// 탭별 푼 문항 수: 지금 보는 탭 → 화면 상태, 그 외 → 풀던 답(drafts) → 채점 기록
function tabAnswered(t){
  const src=cur&&cur.mode==='study'&&cur.tab===t?cur.ans:(S.drafts[t.id]||(S.tabs[t.id]&&S.tabs[t.id].answers)||{});
  return t.qs.filter(q=>isAnswered(q,src[q.id])).length;
}
function updateProgress(){
  const p=document.getElementById('pbar');if(!p||!cur)return;
  const n=cur.list.filter(answered).length, cnt=fmtCnt(n,cur.list.length);
  p.style.width=pct(n,cur.list.length)+'%';
  document.getElementById('ptxt').textContent=`${n} / ${cur.list.length} 응답`;
  const g=document.getElementById('gradeCnt');if(g)g.textContent=cnt;
  if(cur.mode==='study'){
    const c=document.getElementById('qc-'+cur.tab.id);if(c)c.textContent=cnt;
    if(!cur.graded){  // 풀던 답 저장 → 탭을 옮겨도 유지
      if(n||Object.keys(cur.ans).some(k=>{const v=cur.ans[k];return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:v!=null&&v!=='';}))
        S.drafts[cur.tab.id]=JSON.parse(JSON.stringify(cur.ans));
      else delete S.drafts[cur.tab.id];
      save();
    }
  }
}

/* ── 음성 선택 · 문제 읽기 · 그림/오디오 (qb-voice.js가 없으면 모두 숨김) ── */
const hasVoice=()=>!!(window.QBVoice&&QBVoice.supported());
const hasRead=()=>!!(window.QBVoice&&QBVoice.canSpeak());
const IC_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const IC_VOL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const VC=new Map();  // 학습 모드 문항별 음성 컨트롤러
function voiceReset(){VC.clear();if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}}
function voiceRow(q,fkp){
  const mic=hasVoice()&&['mc','multi','ox'].includes(q.ty), rd=hasRead();
  if(!mic&&!rd)return '';
  const qa=fkp?` data-q="${q.id}"`:'';
  return `<div class="vrow noprint">`+
    (mic?`<button type="button" class="vbtn vmic" data-act="vmic"${qa} data-fk="${fkp}-vmic" data-state="idle" aria-pressed="false">${IC_MIC}<span>말하기</span></button>`:'')+
    (rd?`<button type="button" class="vbtn" data-act="vread"${qa} data-fk="${fkp}-vread">${IC_VOL}<span>문제 읽기</span></button>`:'')+
    (mic?`<span class="vstat" aria-live="polite"></span><span class="vhint">말하기 어려우면 눌러서 고르세요</span>`:'')+`</div>`;
}
function mediaHTML(q){
  let h='';
  if(q.img&&q.img.src)h+=`<figure class="qfig"><img src="${esc(q.img.src)}" alt="${esc(q.img.alt)}" loading="lazy">${q.img.caption?`<figcaption>${esc(q.img.caption)}</figcaption>`:''}</figure>`;
  if(q.audio&&q.audio.src)h+=`<div class="qaud"><audio controls preload="none" src="${esc(q.audio.src)}"></audio><details><summary>대본</summary><p>${esc(q.audio.transcript)}</p></details></div>`;
  return h;
}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
// 읽어 줄 글: 문제 + 화면에 보이는 순서의 보기("1번 …")
function readText(q,n,order){
  let t=(n?`${n}번 문제. `:'')+plain(q.p)+'.';
  if(q.img&&q.img.alt)t+=' 그림 설명. '+q.img.alt+'.';
  if(q.ty==='ox')t+=' 맞으면 O, 틀리면 X.';
  else if(q.ty==='mc'||q.ty==='multi')t+=(order||range(q.o.length)).map((oi,k)=>` ${k+1}번. ${plain(q.o[oi])}.`).join('');
  return t;
}

function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;
  else if(el.dataset.act==='tick'){
    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);
  }
  cur.armed=false;updateProgress();
}
function onSheetInput(el){
  if(el.dataset.act==='num'&&!cur.graded){cur.ans[el.dataset.q]=el.value;cur.armed=false;updateProgress();}
}

function gradeSheet(){
  const miss=cur.list.map((q,i)=>answered(q)?0:i+1).filter(Boolean);
  if(miss.length&&!cur.armed){
    cur.armed=true;
    document.getElementById('warn').textContent=`미응답 ${miss.length}문항 (Q${miss.join(', Q')}). 한 번 더 누르면 미응답은 오답으로 채점합니다.`;
    return;
  }
  const firstUnlock=!gameUnlocked();
  cur.graded=true;
  const snap={};let score=0;
  cur.list.forEach(q=>{
    const a=finalAns(q);
    if(a!=null)snap[q.id]=a;
    if(isCorrect(q,a)){score++;markSolved(q.id);}
    else addWrong(q.id,answerText(q,a));
  });
  if(cur.mode==='study'){
    S.tabs[cur.tab.id]={score,total:cur.list.length,answers:snap,touched:[...cur.touched],at:Date.now()};
    delete S.drafts[cur.tab.id];
  }
  save();
  renderSheet();
  window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
  say(`채점 결과 ${score}점, ${cur.list.length}문항 중`);
  if(cur.mode==='study'&&firstUnlock)setTimeout(()=>toast('⚡ 게임 모드와 해설지가 열렸습니다!'),300);
  else if(cur.mode==='study'&&allGraded())setTimeout(()=>toast('★ 모든 탭 완료! 종합 결과를 확인하세요.'),300);
}
