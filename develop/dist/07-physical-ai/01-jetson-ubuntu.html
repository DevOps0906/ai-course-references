const BANK={"id":"pai-d1","code":"PA1","title":"Physical AI 1일차 · Jetson · Ubuntu · 실습 환경","subtitle":"Jetson·Ubuntu 기초 · Docker·원격 접속 · Python·C++ 연동","course":"07 · Physical AI","source":"07-NEPES_physicalAI_자율주행자동차/____/1___v2.pdf","salt":"pai-d1","version":1,"updated":"2026-10-15","tabs":[{"id":"t1","title":"Physical AI와 Jetson","ref":"시작과 전체 지도 · p.6–11","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"Physical AI에서 세 단계가 이어지는 순서로 맞는 것은?","o":["판단 → 인지 → 행동","인지 → 판단 → 행동","행동 → 인지 → 판단","인지 → 행동 → 판단"],"a":1,"h":"센서 입력에서 시작해 '무엇이 보이는가'를 먼저 알아야 조건을 따질 수 있습니다.","w":"인지는 센서에서 관측을 만들고, 판단은 관측을 작업 규칙과 비교하며, 행동은 허용된 명령을 실행하고 결과를 다시 관찰합니다.","an":"1일차 슬라이드 · Physical AI: 인지·판단·행동의 연결 (p.8)","src":"Physical AI: 인지·판단·행동의 연결\n1일차 · 시작과 전체 지도 | 도입 30분\n● 인지는 카메라 등 센서에서 관측을 \n만듭니다.\n● 판단은 관측과 작업 규칙을 \n비교합니다.\n● 행동은 허용된 명령을 실행하고 \n결과를 다시 관찰합니다.\n● 함께 해석하기: 인지는 보이는 \n정보를 만들고 판단은 작업 조건과 \n대조하며 행동은 검증된 결과를 \n사용합니다.\n센서 입력\n↓\n인지: 무엇이 보이는가\n↓\n판단: 조건을 만족하는가\n↓\n행동·결과 관찰"},{"id":"t1-02","ty":"mc","lv":1,"game":true,"p":"Jetson에서 모델의 많은 계산을 병렬로 수행하는 장치는?","o":["CPU","저장장치","캐리어보드","GPU"],"a":3,"h":"자료는 Jetson을 CPU와 GPU를 갖춘 소형 컴퓨터로 소개합니다. CPU는 프로그램 흐름·파일·네트워크·입출력을 처리하고, 모델의 많은 계산을 동시에(병렬로) 처리하는 일은 그래픽 처리 장치가 맡습니다.","w":"GPU는 모델의 많은 계산을 병렬로 수행하고, CPU는 프로그램 흐름·파일·네트워크·입출력을 처리합니다.","an":"1일차 슬라이드 · Jetson은 CPU와 GPU를 갖춘 소형 컴퓨터 (p.10)","src":"Jetson은 CPU와 GPU를 갖춘 소형 컴퓨터\n1일차 · 시작과 전체 지도 | 도입 30분\n● CPU는 프로그램 \n흐름·파일·네트워크·입출력을 \n처리합니다.\n● GPU는 모델의 많은 계산을 병렬로 \n수행합니다.\n● 메모리와 저장장치는 역할이 \n다르며, 모든 프로그램이 자동으로 \nGPU를 사용하는 것은 아닙니다."},{"id":"t1-03","ty":"mc","lv":1,"game":true,"p":"전원·USB·화면·네트워크 연결을 제공하는 부품은?","o":["캐리어보드","Jetson 모듈","GPU","컨테이너"],"a":0,"h":"주요 계산 장치를 담은 부품과 그 부품을 꽂아 연결을 제공하는 판을 구분해 보세요.","w":"Jetson 모듈은 주요 계산 장치를 담고, 캐리어보드는 전원·USB·화면·네트워크 연결을 제공합니다.","an":"1일차 슬라이드 · 모듈·캐리어보드·주변장치 구분 (p.11)","src":"모듈·캐리어보드 ·주변장치 구분\n1일차 · 시작과 전체 지도 | 도입 30분\n● Jetson 모듈은 주요 계산 장치를 \n담고, 캐리어보드는 \n전원·USB·화면·네트워크 연결을 \n제공합니다.\n● 교육 장비는 커스텀 보드이므로 \n포트 위치·전원 규격은 강사 실물 \n안내를 따릅니다."},{"id":"t1-04","ty":"mc","lv":2,"game":true,"p":"5일 과정 중 시뮬레이션에서 학습된 VLA 정책을 실행하는 날은?","o":["2일차","3일차","5일차","4일차"],"a":2,"h":"과정은 하나의 작업대 사례를 5일 동안 발전시킵니다. 1일차 센서 계산, 2일차 글·이미지 질문, 3일차 영상과 ROS 메시지, 4일차 사람이 설계한 Pseudo-VLA를 거쳐, 마지막 날에 MuJoCo·LIBERO에서 학습된 SmolVLA 정책을 실행합니다.","w":"5일차에는 MuJoCo·LIBERO에서 학습된 SmolVLA 정책을 실행합니다. 4일차는 사람이 설계한 Pseudo-VLA로 손 추종·정지를 평가합니다.","an":"1일차 슬라이드 · 5일 동안 하나의 작업대 사례를 발전시키기 (p.9)","src":"5일 동안 하나의 작업대 사례를 발전시키기\n1일차 · 시작과 전체 지도 | 도입 30분\n● 1일차: 센서 값을 계산하고 파일로 남깁니다.\n● 2일차: 글과 이미지에 질문하고 응답을 검증합니다.\n● 3일차: 영상 처리 결과를 ROS 메시지로 전달합니다.\n● 4일차: 사람이 설계한 Pseudo-VLA로 손 추종·정지를 평가합니다.\n● 5일차: MuJoCo·LIBERO에서 학습된 SmolVLA 정책을 실행합니다.\n● 함께 해석하기: 상황을 매번 새로 배우는 부담을 줄이고 입력 표현·판단 \n방식·행동 연결이 어떻게 달라지는지 보기 위해서입니다."},{"id":"t1-05","ty":"mc","lv":2,"game":true,"p":"1일차 8시간 흐름에서 가장 많은 시간(240분)을 쓰는 부분은?","o":["Ubuntu 기초","C++ 기초·빌드·Python 연동","환경 구성·Jupyter","Physical AI 소개"],"a":1,"h":"Python 기본 문법·자료구조는 120분입니다. 그보다 긴 부분을 찾으세요.","w":"소개 30분 → Ubuntu 30분 → 환경·Jupyter 60분 → Python 120분 → C++ 기초·빌드·Python 연동 240분으로 총 480분입니다.","an":"1일차 슬라이드 · 8시간의 학습 흐름 (p.7)","src":"8시간의 학습 흐름\n1일차 · 시작과 전체 지도 | 도입 30분\n● Physical AI·Jetson 소개 30분 → Ubuntu 기초 30분 → 환경 구성·Jupyter \n60분.\n● Python 기본 문법·자료구조 120분 → C++ 기초·빌드·Python 연동 240분.\n● 실습과 정리 시간을 포함한 480분이며 휴게·식사는 별도입니다."},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"모든 프로그램은 자동으로 GPU를 사용한다.","a":false,"h":"메모리와 저장장치의 역할이 다르듯, GPU 사용도 프로그램이 정하는 일입니다.","w":"틀렸습니다. 모든 프로그램이 자동으로 GPU를 사용하는 것은 아닙니다.","an":"1일차 슬라이드 · Jetson은 CPU와 GPU를 갖춘 소형 컴퓨터 (p.10)","src":"Jetson은 CPU와 GPU를 갖춘 소형 컴퓨터\n1일차 · 시작과 전체 지도 | 도입 30분\n● CPU는 프로그램 \n흐름·파일·네트워크·입출력을 \n처리합니다.\n● GPU는 모델의 많은 계산을 병렬로 \n수행합니다.\n● 메모리와 저장장치는 역할이 \n다르며, 모든 프로그램이 자동으로 \nGPU를 사용하는 것은 아닙니다."},{"id":"t1-07","ty":"ox","lv":2,"game":true,"p":"판단 단계는 관측을 작업 규칙(조건)과 비교하는 단계다.","a":true,"h":"Physical AI는 인지·판단·행동이 이어집니다. 인지는 센서에서 관측을 만들고, 판단은 그 관측을 작업 규칙과 비교해 '조건을 만족하는가'를 따지며, 행동은 허용된 명령을 실행하고 결과를 다시 관찰합니다.","w":"맞습니다. 판단은 인지가 만든 관측과 작업 규칙을 대조합니다.","an":"1일차 슬라이드 · Physical AI: 인지·판단·행동의 연결 (p.8)","src":"Physical AI: 인지·판단·행동의 연결\n1일차 · 시작과 전체 지도 | 도입 30분\n● 인지는 카메라 등 센서에서 관측을 \n만듭니다.\n● 판단은 관측과 작업 규칙을 \n비교합니다.\n● 행동은 허용된 명령을 실행하고 \n결과를 다시 관찰합니다.\n● 함께 해석하기: 인지는 보이는 \n정보를 만들고 판단은 작업 조건과 \n대조하며 행동은 검증된 결과를 \n사용합니다."},{"id":"t1-08","ty":"match","lv":2,"game":false,"p":"일차와 그날 작업대 사례에서 하는 일을 연결하세요.","pairs":[["1일차","센서 값을 계산하고 파일로 남긴다"],["2일차","글과 이미지에 질문하고 응답을 검증한다"],["3일차","영상 처리 결과를 ROS 메시지로 전달한다"],["4일차","Pseudo-VLA로 손 추종·정지를 평가한다"]],"h":"작업대 사례는 날마다 한 단계씩 올라갑니다. 1일차는 센서 값 계산과 파일 저장, 2일차는 글과 이미지에 질문하고 응답 검증, 3일차는 영상 처리 결과의 ROS 메시지 전달, 4일차는 Pseudo-VLA로 손 추종·정지 평가입니다.","w":"같은 작업대 사례를 5일 동안 발전시키며 입력 표현·판단 방식·행동 연결이 어떻게 달라지는지 봅니다.","an":"1일차 슬라이드 · 5일 동안 하나의 작업대 사례를 발전시키기 (p.9)","src":"5일 동안 하나의 작업대 사례를 발전시키기\n1일차 · 시작과 전체 지도 | 도입 30분\n● 1일차: 센서 값을 계산하고 파일로 남깁니다.\n● 2일차: 글과 이미지에 질문하고 응답을 검증합니다.\n● 3일차: 영상 처리 결과를 ROS 메시지로 전달합니다.\n● 4일차: 사람이 설계한 Pseudo-VLA로 손 추종·정지를 평가합니다.\n● 5일차: MuJoCo·LIBERO에서 학습된 SmolVLA 정책을 실행합니다."},{"id":"t1-09","ty":"order","lv":1,"game":false,"p":"Physical AI 한 바퀴의 흐름을 순서대로 정렬하세요.","steps":["센서 입력","인지: 무엇이 보이는가","판단: 조건을 만족하는가","행동·결과 관찰"],"h":"Physical AI의 흐름도는 센서 입력에서 시작합니다. 그다음 '무엇이 보이는가'를 만드는 인지, '조건을 만족하는가'를 따지는 판단을 거쳐, 마지막에 행동하고 그 결과를 다시 관찰합니다.","w":"센서 입력이 인지를 거쳐 판단으로 가고, 행동 뒤에는 결과를 다시 관찰합니다.","an":"1일차 슬라이드 · Physical AI: 인지·판단·행동의 연결 (p.8)","src":"Physical AI: 인지·판단·행동의 연결\n1일차 · 시작과 전체 지도 | 도입 30분\n● 인지는 카메라 등 센서에서 관측을 \n만듭니다.\n● 판단은 관측과 작업 규칙을 \n비교합니다.\n● 행동은 허용된 명령을 실행하고 \n결과를 다시 관찰합니다.\n● 함께 해석하기: 인지는 보이는 \n정보를 만들고 판단은 작업 조건과 \n대조하며 행동은 검증된 결과를 \n사용합니다.\n센서 입력\n↓\n인지: 무엇이 보이는가\n↓\n판단: 조건을 만족하는가\n↓\n행동·결과 관찰"},{"id":"t1-10","ty":"multi","lv":2,"game":true,"p":"CPU가 처리하는 일을 <b>모두<\/b> 고르세요.","o":["프로그램 흐름","파일·네트워크","입출력","모델의 대규모 병렬 계산","전원 공급"],"a":[0,1,2],"h":"Jetson에서 CPU는 프로그램 흐름·파일·네트워크·입출력을 처리합니다. 모델의 많은 계산을 병렬로 수행하는 것은 GPU의 몫이고, 전원·USB·화면 연결은 캐리어보드의 몫이므로 이 둘은 제외해 보세요.","w":"CPU는 프로그램 흐름·파일·네트워크·입출력을 처리합니다. 병렬 모델 계산은 GPU, 전원 연결은 캐리어보드 역할입니다.","an":"1일차 슬라이드 · Jetson은 CPU와 GPU를 갖춘 소형 컴퓨터 (p.10)","src":"Jetson은 CPU와 GPU를 갖춘 소형 컴퓨터\n1일차 · 시작과 전체 지도 | 도입 30분\n● CPU는 프로그램 \n흐름·파일·네트워크·입출력을 \n처리합니다.\n● GPU는 모델의 많은 계산을 병렬로 \n수행합니다.\n● 메모리와 저장장치는 역할이 \n다르며, 모든 프로그램이 자동으로 \nGPU를 사용하는 것은 아닙니다."}]},{"id":"t2","title":"터미널·경로·파일 다루기","ref":"Ubuntu 기초 · p.12–17","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"현재 폴더 위치를 출력하는 명령은?","o":["ls","cd","pwd","cat"],"a":2,"h":"pwd는 현재 작업 중인 폴더의 경로를 출력하는 명령으로, print working directory의 머리글자입니다. 상대 경로는 이 현재 위치를 기준으로 해석되므로, 명령을 실행하기 전에 위치를 먼저 확인합니다.","w":"pwd는 현재 폴더를 출력합니다. ls는 목록, cd는 이동, cat은 파일 내용 표시입니다.","an":"1일차 슬라이드 · 현재 위치와 절대·상대 경로 (p.13)","src":"현재 위치와 절대·상대 경로\n1일차 · Ubuntu 기초 | 따라 해보기 30분\n● pwd는 현재 폴더를 출력합니다. \n상대 경로는 현재 위치를 기준으로 \n해석됩니다.\n● /로 시작하면 절대 경로입니다. ..는 \n상위 폴더, .은 현재 폴더입니다.\n● Data와 data는 다른 이름입니다. \n컨테이너의 교재 시작 위치는 \n/workspace입니다."},{"id":"t2-02","ty":"mc","lv":1,"game":true,"p":"경로에서 <code>..<\/code>이 뜻하는 것은?","o":["현재 폴더","상위 폴더","홈 폴더","루트 폴더"],"a":1,"h":"경로에서 /로 시작하면 절대 경로이고, 나머지는 현재 위치를 기준으로 해석되는 상대 경로입니다. 점 하나(.)는 현재 폴더를 뜻하며, 점 두 개(..)는 한 단계 위로 올라가는 폴더를 뜻합니다.","w":"..는 상위 폴더, .은 현재 폴더, ~는 현재 사용자의 홈, /로 시작하면 절대 경로입니다.","an":"1일차 슬라이드 · 현재 위치와 절대·상대 경로 (p.13)","src":"현재 위치와 절대·상대 경로\n1일차 · Ubuntu 기초 | 따라 해보기 30분\n● pwd는 현재 폴더를 출력합니다. \n상대 경로는 현재 위치를 기준으로 \n해석됩니다.\n● /로 시작하면 절대 경로입니다. ..는 \n상위 폴더, .은 현재 폴더입니다.\n● Data와 data는 다른 이름입니다. \n컨테이너의 교재 시작 위치는 \n/workspace입니다."},{"id":"t2-03","ty":"mc","lv":2,"game":true,"p":"점으로 시작하는 숨김 항목까지 표시하는 명령은?","o":["ls -a","ls -l","ls -h","ls -r"],"a":0,"h":"ls는 이름만, ls -l은 권한·소유자·크기 같은 상세 정보를 보여 줍니다. 리눅스에서 이름이 점(.)으로 시작하는 항목은 숨겨지므로, '모두(all)'를 뜻하는 옵션을 붙여야 숨김 항목까지 표시됩니다.","w":"ls -a는 숨김 항목까지, ls -l은 권한·소유자·크기 같은 상세 정보를 보여 줍니다.","an":"1일차 슬라이드 · 파일·폴더 목록을 읽기 (p.14)","src":"파일·폴더 목록을 읽기\n1일차 · Ubuntu 기초 | 따라 해보기 30분\n● ls는 이름을, ls -l은 \n권한·소유자·크기 같은 상세 정보를 \n보여줍니다.\n● ls -a는 점으로 시작하는 숨김 \n항목까지 표시합니다.\n● ~는 현재 사용자의 홈입니다. \n호스트와 컨테이너에서 홈 경로가 \n다를 수 있습니다.\n● 경로 일부를 입력한 뒤 Tab으로 \n자동완성하고 ↑로 이전 명령을 \n불러옵니다."},{"id":"t2-04","ty":"mc","lv":2,"game":true,"p":"파일을 덮어쓰지 않고 끝에 내용을 추가하는 기호는?","o":[">","|",">>","<"],"a":2,"h":"셸에서 꺾쇠 기호는 명령의 출력을 파일로 보냅니다. 꺾쇠 하나(>)는 파일 내용을 덮어쓰고, 꺾쇠 두 개는 기존 내용을 지우지 않고 끝에 덧붙입니다. 실습의 echo second 명령에 쓰인 기호를 보세요.","w":">는 파일을 덮어쓰고 >>는 끝에 추가합니다. |는 파이프입니다.","an":"1일차 슬라이드 · 삭제·덮어쓰기는 대상을 먼저 확인하기 (p.16)","src":"삭제·덮어쓰기는 대상을 먼저 확인하기\n1일차 · Ubuntu 기초 | 따라 해보기 30분\n● rm은 지정 파일을 삭제합니다. \n연습용 파일만 대상으로 \n사용합니다.\n● >는 파일을 덮어쓰고 >>는 끝에 \n추가합니다.\n● 명령을 실행하기 전에 pwd와 ls로 \n위치와 이름을 확인합니다.\n● 함께 해석하기: 현재 위치와 실제 \n대상 경로를 목록으로 확인합니다."},{"id":"t2-05","ty":"mc","lv":2,"game":true,"p":"파일을 이동하거나 이름을 바꾸는 명령은?","o":["cp","rm","mkdir","mv"],"a":3,"h":"cp는 원본을 남긴 채 복사본을 만들고, '움직이다(move)'를 줄인 명령은 파일을 다른 위치로 옮기거나 같은 폴더에서 이름만 바꿀 때 씁니다. 실습에서 backup.txt를 saved.txt로 바꾼 명령을 떠올려 보세요.","w":"mv는 이동 또는 이름 변경이고, cp는 원본을 남기고 복사합니다.","an":"1일차 슬라이드 · 폴더 만들기·복사·이름 바꾸기 (p.15)","src":"폴더 만들기·복사·이름 바꾸기\n1일차 · Ubuntu 기초 | 따라 해보기 30분\n● mkdir -p는 필요한 상위 폴더까지 \n만듭니다.\n● cp는 원본을 남기고 복사합니다. \nmv는 이동 또는 이름 변경입니다.\n● 결과는 명령 메시지뿐 아니라 ls와 \n파일 내용으로 다시 확인합니다.\n● 함께 해석하기: 일반 파일 복사는 \n별도 파일을 만듭니다."},{"id":"t2-06","ty":"ox","lv":1,"game":true,"p":"리눅스에서 Data와 data는 같은 이름으로 취급된다.","a":false,"h":"리눅스의 파일 이름과 경로는 대소문자를 구분합니다. 자료는 상대 경로 Data가 현재 폴더에 따라 달라진다는 점과 함께, 첫 글자만 대문자인 Data와 모두 소문자인 data를 어떻게 취급하는지 짚어 줍니다.","w":"틀렸습니다. Data와 data는 다른 이름입니다. 명령과 경로의 대소문자·공백을 확인해야 합니다.","an":"1일차 슬라이드 · 현재 위치와 절대·상대 경로 (p.13)","src":"● /로 시작하면 절대 경로입니다. ..는 \n상위 폴더, .은 현재 폴더입니다.\n● Data와 data는 다른 이름입니다. \n컨테이너의 교재 시작 위치는 \n/workspace입니다.\n● 함께 해석하기: 상대 경로 Data는 \n현재 폴더에 따라 달라집니다."},{"id":"t2-07","ty":"ox","lv":2,"game":true,"p":"less로 긴 파일을 읽다가 q를 누르면 빠져나온다.","a":true,"h":"cat은 짧은 파일 전체를 한 번에 표시하고, less는 긴 파일을 위아래로 이동하며 읽는 명령입니다. less 화면에서 빠져나오는 키는 '그만두다(quit)'의 머리글자 한 글자입니다.","w":"맞습니다. less는 긴 파일을 이동하며 읽고 q로 나옵니다. head·tail은 앞·뒷부분을 확인합니다.","an":"1일차 슬라이드 · 파일 내용과 긴 로그 읽기 (p.17)","src":"● cat은 짧은 파일 전체를 표시합니다. \nless는 긴 파일을 이동하며 읽고 q로 \n나옵니다.\n● head와 tail은 앞부분과 뒷부분을 \n확인합니다."},{"id":"t2-08","ty":"match","lv":1,"game":false,"p":"명령과 하는 일을 연결하세요.","pairs":[["pwd","현재 폴더를 출력한다"],["mkdir -p","필요한 상위 폴더까지 만든다"],["cat","짧은 파일 전체를 표시한다"],["tail","파일의 뒷부분을 확인한다"],["rm","지정한 파일을 삭제한다"]],"h":"pwd는 현재 폴더 출력, mkdir -p는 필요한 상위 폴더까지 한 번에 생성합니다. cat은 짧은 파일 전체 표시, tail은 이름처럼 파일의 '꼬리' 부분 확인, rm은 '제거(remove)'의 줄임말로 지정 파일 삭제입니다.","w":"명령어 + 옵션 + 대상 순서로 읽고, 실행 결과는 ls와 파일 내용으로 다시 확인합니다.","an":"1일차 슬라이드 · 폴더 만들기·복사·이름 바꾸기 · 파일 내용 읽기 (p.15)","src":"● cat은 짧은 파일 전체를 표시합니다. \nless는 긴 파일을 이동하며 읽고 q로 \n나옵니다.\n● head와 tail은 앞부분과 뒷부분을 \n확인합니다."},{"id":"t2-09","ty":"order","lv":2,"game":false,"p":"Ubuntu 연습 폴더 실습의 순서를 맞추세요.","steps":["mkdir -p로 연습 폴더를 만든다","echo로 note.txt를 만든다","cp로 backup.txt를 복사한다","mv로 saved.txt로 이름을 바꾼다","rm으로 saved.txt를 삭제한다"],"h":"실습은 먼저 mkdir -p로 연습 폴더를 만들고 그 안에서 echo로 note.txt를 만듭니다. 이어서 cp로 복사본을 만들고, mv로 그 복사본의 이름을 바꾸며, 삭제는 pwd·ls로 대상을 확인한 뒤 맨 마지막에 합니다.","w":"폴더를 만든 뒤 파일을 생성·복사·이름 변경하고, 삭제 전에는 pwd·ls로 대상을 확인합니다.","an":"1일차 슬라이드 · 폴더 만들기·복사·이름 바꾸기 · p.16 삭제 (p.15)","src":"cd /workspace\nmkdir -p Data/outputs/ubuntu-practice\ncd Data/outputs/ubuntu-practice\necho hello > note.txt\ncp note.txt backup.txt\nmv backup.txt saved.txt\nls -l"},{"id":"t2-10","ty":"multi","lv":1,"game":true,"p":"터미널 명령 입력에 대한 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["명령어+옵션+대상 순서로 읽는다","안내의 $ 기호는 입력하지 않는다","대소문자와 공백은 의미가 있다","Enter 없이 자동 실행된다","Tab은 마지막 명령을 취소한다"],"a":[0,1,2],"h":"터미널 명령은 명령어 + 옵션 + 대상 순서로 읽고 Enter로 실행합니다. 자료의 안내에 붙은 $ 기호는 직접 입력하지 않으며, 대소문자와 공백도 의미가 있으므로 명령과 경로를 확인해야 합니다.","w":"명령은 Enter로 실행하며 $ 기호는 입력하지 않습니다. Tab은 자동완성, ↑는 이전 명령 불러오기입니다.","an":"1일차 슬라이드 · 터미널은 명령을 전달하는 창입니다 (p.12)","src":"● 명령어 + 옵션 + 대상 순서로 \n읽습니다. Enter로 실행하며 안내의 \n$ 기호는 입력하지 않습니다.\n● 대소문자와 공백은 의미가 있으므로 \n명령과 경로를 확인합니다.\npwd\nls\nls -l Data\n# $ 기호 없이 명령만 입력"}]},{"id":"t3","title":"검색·실행·환경변수·자원","ref":"Ubuntu 기초 · p.18–23","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"grep 결과에 줄 번호를 함께 표시하는 옵션은?","o":["-n","-l","-r","-v"],"a":0,"h":"grep은 지정한 문자열이 들어 있는 줄을 찾아 보여 줍니다. 여기에 '번호(number)'의 머리글자 옵션을 붙이면 각 줄이 파일의 몇 번째 줄인지 함께 표시되어, 실습의 학습안내.md 검색처럼 위치를 바로 찾을 수 있습니다.","w":"grep은 문자열이 있는 줄을 찾고, -n을 붙이면 줄 번호가 보입니다.","an":"1일차 슬라이드 · 검색과 파이프로 출력 좁히기 (p.18)","src":"● grep은 문자열이 있는 줄을 \n찾습니다. -n을 붙이면 줄 번호가 \n보입니다.\n● 파이프 |는 앞 명령의 출력을 뒤 \n명령의 입력으로 전달합니다.\n● 로그 전체를 복사하기보다 오류 \n이름·자기 파일 위치·직전 명령을 \n함께 확인합니다.\n● 함께 해석하기: 보통 앞 명령의 \n출력을 뒤 명령의 입력으로 \n넘깁니다.\ncd /workspace\ngrep -n \" 커널\" 학습안내.md"},{"id":"t3-02","ty":"mc","lv":1,"game":true,"p":"앞 명령의 출력을 뒤 명령의 입력으로 넘기는 기호는?","o":[">",">>","|","&"],"a":2,"h":"자료는 앞 명령의 출력을 뒤 명령의 입력으로 넘기는 기호를 '파이프'라고 부릅니다. 실습의 ls Data 뒤에 head -n 5를 연결할 때 두 명령 사이에 쓴 세로 막대 모양 기호를 떠올려 보세요.","w":"파이프 |는 앞 명령의 출력을 뒤 명령의 입력으로 전달합니다. 예: ls Data | head -n 5","an":"1일차 슬라이드 · 검색과 파이프로 출력 좁히기 (p.18)","src":"● 파이프 |는 앞 명령의 출력을 뒤 \n명령의 입력으로 전달합니다.\n● 로그 전체를 복사하기보다 오류 \n이름·자기 파일 위치·직전 명령을 \n함께 확인합니다.\n● 함께 해석하기: 보통 앞 명령의 \n출력을 뒤 명령의 입력으로 \n넘깁니다.\ncd /workspace\ngrep -n \" 커널\" 학습안내.md\nls Data | head -n 5"},{"id":"t3-03","ty":"mc","lv":2,"game":true,"p":"스크립트 내용을 현재 셸에 적용하는 명령은?","o":["export","source","bash","exit"],"a":1,"h":"export는 현재 셸과 이후 시작하는 자식 프로세스에 설정을 전달합니다. 반면 스크립트의 내용을 지금 열려 있는 셸에 그대로 적용하는 명령이 따로 있으며, 자료는 ROS 환경 준비에서 이 명령을 쓴다고 설명합니다.","w":"source는 스크립트 내용을 현재 셸에 적용합니다. export는 현재 셸과 이후 자식 프로세스에 설정을 전달합니다.","an":"1일차 슬라이드 · 환경변수와 source의 범위 (p.20)","src":"● export는 현재 셸과 이후 시작하는 \n자식 프로세스에 설정을 \n전달합니다.\n● source는 스크립트 내용을 현재 \n셸에 적용합니다. ROS 환경 \n준비에서 사용합니다.\n● 다른 터미널은 별도 환경일 수 \n있으므로 새 창에서 설정을 다시 \n확인합니다."},{"id":"t3-04","ty":"mc","lv":1,"game":true,"p":"메모리 사용량을 확인하는 명령은?","o":["df -h","ps -ef","free -h","pwd"],"a":2,"h":"자원 확인 명령 중 df -h는 파일시스템 저장 공간, ps·top은 실행 프로세스를 봅니다. 메모리 사용량은 '남은(free)'이라는 이름의 명령에 사람이 읽기 쉬운 단위(-h) 옵션을 붙여 확인합니다.","w":"free -h는 메모리, df -h는 파일시스템 저장 공간, ps·top은 실행 프로세스를 확인합니다.","an":"1일차 슬라이드 · 메모리·저장 공간·프로세스 확인 (p.22)","src":"● free -h는 메모리, df -h는 \n파일시스템 저장 공간을 \n확인합니다.\n● ps·top은 실행 프로세스, jtop은 \nJetson 자원 상태를 살펴보는 \n도구입니다."},{"id":"t3-05","ty":"mc","lv":2,"game":true,"p":"Jetson의 메모리·부하 같은 자원 상태를 살펴보는 도구는?","o":["ls","pwd","grep","jtop"],"a":3,"h":"ps·top은 실행 중인 프로세스를 보여 주는 일반 리눅스 도구입니다. Jetson의 자원 상태를 살펴보는 전용 도구는 top 앞에 Jetson의 첫 글자를 붙인 이름이며, 강사 호스트에서 모델 로드 전·중·후를 비교할 때 씁니다.","w":"jtop은 Jetson 자원 상태를 살펴보는 도구로, 강사 호스트에서 모델 로드 전·중·후를 비교합니다.","an":"1일차 슬라이드 · 메모리·저장 공간·프로세스 확인 (p.22)","src":"● ps·top은 실행 프로세스, jtop은 \nJetson 자원 상태를 살펴보는 \n도구입니다.\n● 강사 호스트에서 모델 로드 \n전·중·후의 메모리·부하를 \n비교합니다. 자원은 같은 장비에서 \n공유합니다."},{"id":"t3-06","ty":"ox","lv":2,"game":true,"p":"export로 설정한 변수는 이미 열려 있는 다른 터미널에도 자동으로 전달된다.","a":false,"h":"export는 현재 셸과 그 이후에 시작하는 자식 프로세스에만 설정을 전달합니다. 자료는 다른 터미널이 별도 환경일 수 있으므로 새 창에서 설정을 다시 확인하라고 하며, 새 터미널에 자동으로 전달되는지 짚어 줍니다.","w":"틀렸습니다. 다른 터미널은 별도 환경일 수 있으므로 새 창에서 설정을 다시 확인해야 합니다.","an":"1일차 슬라이드 · 환경변수와 source의 범위 (p.20)","src":"● export는 현재 셸과 이후 시작하는 \n자식 프로세스에 설정을 \n전달합니다.\n● source는 스크립트 내용을 현재 \n셸에 적용합니다. ROS 환경 \n준비에서 사용합니다.\n● 다른 터미널은 별도 환경일 수 \n있으므로 새 창에서 설정을 다시 \n확인합니다.\n● 함께 해석하기: 새 터미널에는 \n자동으로 전달되지 않습니다."},{"id":"t3-07","ty":"ox","lv":2,"game":true,"p":"docker exec로 연 추가 셸에서 exit해도 주 컨테이너는 계속 실행될 수 있다.","a":true,"h":"exit는 현재 셸만 나가는 명령입니다. docker exec는 이미 실행 중인 컨테이너에 추가 셸을 여는 것이므로, 그 셸을 나가도 Jupyter 서버 같은 주 프로세스가 돌고 있다면 컨테이너가 어떻게 되는지 생각해 보세요.","w":"맞습니다. exit는 현재 셸만 나가며, Jupyter 서버가 주 프로세스로 실행 중이면 컨테이너는 유지됩니다.","an":"1일차 슬라이드 · Ctrl+C·exit·창 닫기의 차이 (p.21)","src":"● Ctrl+C는 터미널의 현재 실행 \n프로그램에 중단을 요청합니다.\n● exit는 현재 셸을 나갑니다. docker \nexec로 연 셸에서 나와도 주 \n컨테이너는 계속 실행될 수 \n있습니다.\n● 브라우저 창을 닫는 것과 \n커널·서버를 종료하는 것은 \n다릅니다."},{"id":"t3-08","ty":"match","lv":2,"game":false,"p":"동작과 그 의미를 연결하세요.","pairs":[["Ctrl+C","현재 실행 프로그램에 중단을 요청한다"],["exit","현재 셸을 나간다"],["브라우저 창 닫기","커널·서버 종료와는 다르다"],["df -h","파일시스템 저장 공간을 확인한다"]],"h":"Ctrl+C는 터미널에서 실행 중인 프로그램에 중단을 요청하고, exit는 현재 셸을 나갑니다. 브라우저 창을 닫는 것은 커널·서버를 끝내는 것과 다르며, df -h는 파일시스템 저장 공간을 확인하는 명령입니다.","w":"창을 닫는 것과 커널·서버를 종료하는 것은 다릅니다. 무엇을 끝내는지 구분해야 합니다.","an":"1일차 슬라이드 · Ctrl+C·exit·창 닫기의 차이 (p.21)","src":"● Ctrl+C는 터미널의 현재 실행 \n프로그램에 중단을 요청합니다.\n● exit는 현재 셸을 나갑니다. docker \nexec로 연 셸에서 나와도 주 \n컨테이너는 계속 실행될 수 \n있습니다.\n● 브라우저 창을 닫는 것과 \n커널·서버를 종료하는 것은 \n다릅니다."},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"실습을 안전하게 마치는 순서를 맞추세요.","steps":["파일을 저장한다","Ctrl+C로 현재 프로그램을 중단한다","exit로 추가 셸을 종료한다","필요하면 호스트에서 컨테이너를 종료한다"],"h":"자료의 종료 흐름도는 작업 결과를 잃지 않는 것부터 시작합니다. 먼저 파일을 저장하고, 실행 중인 프로그램을 Ctrl+C로 멈춘 뒤, exit로 추가 셸을 나가며, 필요할 때만 마지막으로 호스트에서 컨테이너를 종료합니다.","w":"저장 → 프로그램 중단 → 추가 셸 종료 → 필요 시 컨테이너 종료 순서입니다.","an":"1일차 슬라이드 · Ctrl+C·exit·창 닫기의 차이 (p.21)","src":"파일 저장\n↓\n현재 프로그램 중단: Ctrl+C\n↓\n추가 셸 종료: exit\n↓\n필요 시 호스트에서 컨테이너 종료"},{"id":"t3-10","ty":"multi","lv":2,"game":true,"p":"Ubuntu 미니 실습 완료 확인에 포함된 활동을 <b>모두<\/b> 고르세요.","o":["개인 연습 폴더 만들기","파일 생성·복사·이름 변경","cat으로 확인 후 복사본 하나만 삭제","패키지 전체 재설치","원본 교재 폴더 삭제"],"a":[0,1,2],"h":"Ubuntu 미니 실습 완료 확인은 개인 연습 폴더에서 파일을 생성·복사·이름 변경하고, cat으로 내용을 확인한 뒤 연습용 복사본 하나만 삭제하는 활동입니다. 다른 사람의 파일이나 시스템 폴더는 다루지 않습니다.","w":"개인 폴더에서 파일을 생성·복사·이름 변경하고, cat으로 확인한 뒤 연습용 복사본 하나만 삭제합니다.","an":"1일차 슬라이드 · Ubuntu 미니 실습 완료 확인 (p.23)","src":"● 개인 연습 폴더를 만들고 파일을 생성·복사·이름 변경합니다.\n● cat으로 내용을 확인하고 연습용 복사본 하나만 삭제합니다.\n● 현재 경로·남은 파일·사용한 명령의 의미를 옆 사람에게 설명합니다.\n● 함께 해석하기: 현재 컨테이너 경로, 만든 파일의 위치, 저장 후 다시 읽은 \n내용으로 설명합니다."}]},{"id":"t4","title":"Docker와 실습 환경","ref":"로컬·원격 환경 구성 · p.2–5, 24–28, 36–37","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":true,"p":"Docker 이미지와 컨테이너의 관계로 옳은 것은?","o":["이미지와 컨테이너는 같은 말이다","이미지 하나로 컨테이너 하나만 만든다","컨테이너는 이미지로 시작한 실행 공간이다","이미지는 실행 중인 프로세스다"],"a":2,"h":"자료는 Docker 이미지를 '준비된 프로그램 환경'으로, 컨테이너를 '그 환경으로 시작한 실행 공간'으로 구분합니다. 한 이미지로 여러 개인 컨테이너를 만들 수 있다는 점에서 둘 중 무엇이 무엇에서 출발하는지 생각해 보세요.","w":"이미지는 준비된 프로그램 환경이고, 컨테이너는 그 환경으로 시작한 실행 공간입니다. 한 이미지로 여러 컨테이너를 만들 수 있습니다.","an":"1일차 슬라이드 · Docker 이미지와 컨테이너 (p.25)","src":"● 이미지는 준비된 프로그램 환경이고 \n컨테이너는 그 환경으로 시작한 \n실행 공간입니다.\n● 한 이미지로 여러 개인 컨테이너를 \n만들 수 있습니다.\n● 교재·Data는 바깥 압축을 풀어 \n배치하고, 내부 이미지 tar는 docker \nload로 읽습니다.\n● 함께 해석하기: load는 실행 환경 \n이미지를 Docker에 등록합니다."},{"id":"t4-02","ty":"mc","lv":1,"game":true,"p":"배포 파일 안의 이미지 tar를 Docker에 등록하는 명령은?","o":["docker run","docker load","docker exec","docker ps"],"a":1,"h":"배포 파일은 바깥 압축을 풀어 교재·Data를 배치하고, 그 안의 이미지 tar는 별도 명령으로 Docker에 읽어 들입니다. 이 명령은 docker 뒤에 '싣다·불러오다'를 뜻하는 영어 단어를 붙인 것이며, 실행 환경 이미지를 Docker에 등록합니다.","w":"docker load는 실행 환경 이미지를 Docker에 등록합니다. 바깥 압축 해제와 이미지 load는 다른 단계입니다.","an":"1일차 슬라이드 · Docker 이미지와 컨테이너 (p.25)","src":"● 교재·Data는 바깥 압축을 풀어 \n배치하고, 내부 이미지 tar는 docker \nload로 읽습니다.\n● 함께 해석하기: load는 실행 환경 \n이미지를 Docker에 등록합니다."},{"id":"t4-03","ty":"mc","lv":1,"game":true,"p":"실행 중인 컨테이너 목록을 보는 명령은?","o":["docker ps","docker load","docker stop","docker pull"],"a":0,"h":"docker exec는 이미 실행 중인 컨테이너에 추가 셸을 엽니다. 실행 중인 컨테이너 목록을 보려면 docker 뒤에 리눅스에서 프로세스 목록을 보는 명령과 같은 두 글자를 붙이며, 접속이 안 될 때 내 컨테이너가 살아 있는지도 이것으로 확인합니다.","w":"docker ps는 실행 중인 컨테이너를 보여 주며, 접속이 안 될 때 내 컨테이너가 실행 중인지 확인하는 데 씁니다.","an":"1일차 슬라이드 · 컨테이너 상태 확인과 추가 셸 (p.36)","src":"● docker ps는 실행 중인 컨테이너를 \n보여줍니다.\n● docker exec는 이미 실행 중인 \n컨테이너에 추가 명령·셸을 엽니다.\n● 추가 셸에서 exit해도 Jupyter \n서버가 주 프로세스로 실행 중이면 \n컨테이너는 계속 유지됩니다.\n● 함께 해석하기: 추가 셸은 같은 실행 \n환경에 명령 창을 하나 더 여는 \n것입니다.\n# Jetson 호스트 터미널\ndocker ps"},{"id":"t4-04","ty":"mc","lv":2,"game":true,"p":"컨테이너 안에서 개인 교재 폴더가 연결된 경로는?","o":["/home/nvidia","/opt/course","/workspace","/tmp"],"a":2,"h":"개인 PC 브라우저는 화면만 보여 주고 실제 코드는 Jetson의 컨테이너에서 실행됩니다. 호스트의 개인 교재 폴더는 컨테이너 안의 한 경로에 연결되며, 이 경로는 Jupyter 터미널에서 교재를 시작하는 위치이기도 합니다.","w":"Jupyter 터미널의 /workspace는 호스트의 개인 교재 폴더를 연결한 경로입니다.","an":"1일차 슬라이드 · 개인 PC·Jetson·컨테이너의 관계 (p.24)","src":"● 개인 PC의 브라우저는 화면을 \n보여주고 실제 실습 코드는 \nJetson의 컨테이너에서 실행됩니다.\n● Jetson 호스트는 Docker와 장치 \n연결을 관리합니다.\n● Jupyter 터미널의 /workspace는 \n개인 교재 폴더를 연결한 \n경로입니다.\n● 함께 해석하기: 브라우저는 \nJetson의 Jupyter에 접속하는 \n화면입니다."},{"id":"t4-05","ty":"mc","lv":2,"game":true,"p":"--rm으로 실행해 삭제된 컨테이너를 다시 쓰려면?","o":["docker start로 재시작한다","기존 생성 명령으로 다시 만든다","이미지를 다시 load한다","OS를 재설치한다"],"a":1,"h":"--rm 옵션으로 실행한 컨테이너는 종료되면 삭제됩니다. 이미 사라진 컨테이너는 docker start로 다시 시작할 대상이 없으므로, 자료는 처음 만들 때 쓴 명령(같은 run 스크립트)으로 어떻게 하라고 안내합니다.","w":"--rm으로 삭제된 컨테이너는 docker start가 아니라 기존 생성 명령(같은 run 스크립트)으로 다시 만듭니다.","an":"1일차 슬라이드 · 종료·재접속·재생성 순서 (p.99)","src":"● 파일 저장→실습 프로세스 \n종료→컨테이너 종료 순서로 \n진행합니다.\n● --rm으로 삭제된 컨테이너는 docker \nstart가 아니라 기존 생성 명령으로 \n다시 만듭니다.\n● 재접속 후 파일 보존을 확인하고 \n환경 셀부터 실행합니다.\n● 함께 해석하기: 연결된 호스트 개인 \n폴더는 보존됩니다."},{"id":"t4-06","ty":"ox","lv":1,"game":true,"p":"컨테이너를 다시 만들어도 연결된 호스트 개인 폴더의 파일은 남고 커널 변수는 초기화된다.","a":true,"h":"컨테이너를 재생성해도 호스트의 개인 폴더는 컨테이너 밖에 연결되어 있어 파일이 보존됩니다. 반면 커널 변수와 실행 중이던 프로세스는 메모리에만 있었으므로, 재접속 후에는 환경 셀부터 다시 실행해야 합니다.","w":"맞습니다. 재부팅·재생성 후 파일은 남고 변수·프로세스는 사라지므로 환경 셀부터 다시 실행합니다.","an":"1일차 슬라이드 · 종료·재접속·재생성 순서 (p.99)","src":"● --rm으로 삭제된 컨테이너는 docker \nstart가 아니라 기존 생성 명령으로 \n다시 만듭니다.\n● 재접속 후 파일 보존을 확인하고 \n환경 셀부터 실행합니다.\n● 함께 해석하기: 연결된 호스트 개인 \n폴더는 보존됩니다.\n# Jetson 호스트: 본인 컨테이너만\ndocker stop physical_ai_remote01\n# 이후 같은 run 스크립트로 재생성\n# 파일은 남고 커널 변수는 초기화"},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"이미지를 save하면 bind mount로 연결한 Data도 함께 포함된다.","a":false,"h":"자료는 이미지 save와 bind mount로 연결한 Data가 서로 다른 것이라고 강조합니다. 배포 묶음에서 Data와 이미지를 각각 준비하고, '이미지와 호스트 Data는 따로 보존'한다는 마지막 문장을 떠올려 보세요.","w":"틀렸습니다. 이미지 save에 bind mount Data가 포함되지 않으므로 배포 묶음의 Data와 이미지를 각각 준비합니다.","an":"1일차 슬라이드 · 저장 파일과 실행 상태는 다릅니다 (p.37)","src":"이미지 save에 bind mount Data가 포함되는 것은 아닙니다. 배포 묶음의 Data와 이미지를 각각 준비합니다.\n · 01.Setup/README.md\n1. 바깥 배포 묶음\n교재·Data·이미지 tar\n2. 이미지 load\nDocker 환경 등록\n3. 호스트 개인 폴더\n교재·필수 Data\n4. 컨테이너 mount\n내부 /workspace\n5. 실행 결과 저장\n개인 Data 아래\n6. 재생성 후 확인\n파일 유지·변수 재준비\n이미지와 호스트 Data는 따로 보존"},{"id":"t4-08","ty":"match","lv":2,"game":false,"p":"컨테이너 생성 인자와 의미를 연결하세요.","pairs":[["local","카메라 장치와 로컬 화면 연결을 준비한다"],["remote","로컬 GUI·USB 카메라를 전달하지 않는다"],["8888","로컬 Jupyter 포트 예시"],["8889","원격 Jupyter 포트 예시"]],"h":"컨테이너 생성 인자는 이미지·호스트 교재 폴더·모드·컨테이너 이름·포트 순서입니다. local 모드는 카메라 장치와 로컬 화면 연결을 준비하고, remote 모드는 로컬 GUI·USB 카메라를 전달하지 않습니다. 교재 예시에서 로컬은 8888, 원격은 8889 포트를 씁니다.","w":"인자는 이미지·호스트 교재 폴더·모드·컨테이너 이름·포트 순서이며, 이름·포트·Domain은 본인 배정값을 씁니다.","an":"1일차 슬라이드 · 로컬 컨테이너 생성 명령 읽기 · p.33 (p.28)","src":"● 인자는 이미지·호스트 교재 \n폴더·모드·컨테이너 이름·포트 \n순서입니다.\n● local 모드는 카메라 장치와 로컬 \n화면 연결을 준비합니다.\n● 앞 3쪽에서 생성했다면 상태·인자만 \n확인합니다. 없을 때만 실행합니다.\n● 21은 예시입니다. 독립 실습에서는 \n로컬·원격 모두 수강생별로 다른 \nDomain ID를 사용합니다."},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"교재 수신에서 개인 실습까지의 순서를 맞추세요.","steps":["교재 tar.gz를 해제한다","교재·Data를 배치한다","이미지 tar를 로드한다","개인 폴더를 준비한다","개인 컨테이너를 만든다","Jupyter에 접속한다"],"h":"배포본 흐름은 교재 tar.gz를 풀고 교재·Data를 배치하는 것에서 시작합니다. 그다음 이미지 tar를 호스트에 한 번 로드하고, 개인 폴더를 준비해 이름·포트·Domain을 정한 개인 컨테이너를 만든 뒤, 마지막에 Jupyter로 접속합니다.","w":"바깥 압축 해제와 내부 이미지 docker load는 다른 단계이며, 공용 이미지는 한 번 로드하고 개인 실행 환경을 만듭니다.","an":"1일차 슬라이드 · 배포 파일 하나에 교재·Data·이미지 3개 (p.102)","src":"바깥 압축 해제와 내부 이미지 docker load는 다른 단계입니다. 공용 이미지는 한 번 로드하고 개인 실행 환경을 만듭니다.\n · 01.Setup/README.md\n1. 교재 tar.gz 해제\nJetson 호스트\n2. 교재·Data 배치\n필수 자산 함께\n3. 이미지 tar 로드\n호스트에 한 번\n4. 개인 폴더 준비\n이미 있으면 재사용\n5. 개인 컨테이너\n이름·포트·Domain\n6. Jupyter 접속\n자료·커널 확인"},{"id":"t4-10","ty":"multi","lv":2,"game":true,"p":"로컬 담당자가 준비하는 항목을 <b>모두<\/b> 고르세요.","o":["OS·네트워크·저장 공간","Docker·NVIDIA 런타임","배포 이미지와 모델","수강생 개인 Jupyter 접속 확인","사용자마다 공용 Ollama 따로 생성"],"a":[0,1,2],"h":"자료는 준비 주체를 나눕니다. 로컬 담당자는 보드 전체에 필요한 OS·네트워크·저장 공간, Docker·NVIDIA 런타임, 배포 이미지와 모델을 준비하고, 수강생은 개인 폴더·컨테이너·포트와 Jupyter 접속을 확인합니다.","w":"로컬 담당자는 OS·네트워크·저장 공간, Docker·NVIDIA 런타임, 이미지와 모델을 준비합니다. 공용 Ollama는 한 명만 생성하고 나머지는 공유합니다.","an":"1일차 슬라이드 · 누가 무엇을 준비하는가 (p.26)","src":"● 로컬 담당자: OS·네트워크·저장 공간, Docker·NVIDIA 런타임, 배포 이미지와 \n모델을 준비합니다.\n● 수강생: 개인 폴더·컨테이너·포트와 Jupyter 접속을 확인합니다.\n● 공용 Ollama 서버는 같은 Jetson의 로컬 사용자 한 명만 생성·실행합니다.\n● 나머지 로컬·원격 사용자는 서버를 따로 만들지 않고 공용 API를 공유합니다.\n● 함께 해석하기: 로컬 담당자가 보드의 공용 서버를 준비하고 학생은 배정된 \n주소를 사용합니다."}]},{"id":"t5","title":"로컬·원격 접속","ref":"로컬·원격 환경 구성 · p.3–4, 29–35, 38, 105","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"로컬 사용자가 Jetson 브라우저에서 여는 Jupyter 주소는?","o":["http://localhost:8888","http://localhost:11434","http://Jetson-IP:22","http://localhost:80"],"a":0,"h":"로컬 사용자는 Jetson에 직접 앉아 Jetson의 브라우저를 씁니다. 같은 기계를 가리키는 이름 localhost에 로컬 컨테이너를 만들 때 지정한 포트(교재 예시 8888)를 붙인 주소로 접속하고, 교육용 공통 토큰을 입력합니다.","w":"로컬 사용자는 Jetson 브라우저에서 http://localhost:8888을 열고 교육용 공통 토큰으로 접속합니다.","an":"1일차 슬라이드 · 로컬 접속과 성공 확인 (p.29)","src":"● Jetson 브라우저에서 \nhttp://localhost:8888을 엽니다. \n교육용 공통 토큰은 nvidia입니다.\n● Jupyter 파일 목록에서 \n02.Python·03.C++와 Data를 \n확인합니다.\n● 터미널에서 /workspace와 Python \n경로를 확인하고 첫 환경 셀을 \n실행합니다."},{"id":"t5-02","ty":"mc","lv":2,"game":true,"p":"개인 PC 브라우저에서 localhost가 가리키는 것은?","o":["원격 Jetson","브라우저가 실행되는 그 PC","공용 Ollama 서버","컨테이너 내부"],"a":1,"h":"localhost는 '지금 이 기계 자신'을 가리키는 이름입니다. 자료는 개인 PC 브라우저에서 쓴 localhost가 원격 Jetson이 아니라 브라우저가 실행되는 컴퓨터를 뜻한다고 설명하며, 그래서 원격 접속은 Jetson-IP:할당포트를 씁니다.","w":"개인 PC의 localhost는 그 PC입니다. 원격 Jetson은 Jetson-IP:할당포트로 접속합니다.","an":"1일차 슬라이드 · 원격 접속: IP·포트·localhost (p.30)","src":"● 개인 PC의 localhost는 그 \nPC입니다. 원격 Jetson을 가리키지 \n않습니다.\n● 교재 기본 경로는 개인 PC \n브라우저에서 Jetson-IP:할당포트로 \n접속하는 방식입니다.\n● 함께 해석하기: localhost는 \n브라우저가 실행되는 그 PC입니다."},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"IP와 포트의 역할 구분으로 옳은 것은?","o":["IP는 서비스, 포트는 장비","둘 다 사용자 계정","둘 다 파일 경로","IP는 장비, 포트는 서비스"],"a":3,"h":"자료는 IP와 포트를 구분합니다. IP는 접속할 장비를 구분하고, 포트는 그 장비 안에서 어떤 서비스로 들어갈지 정하는 진입점입니다. 건물 주소와 그 건물의 출입문에 비유해 보세요.","w":"IP는 접속할 장비를, 포트는 그 장비의 서비스 진입점을 구분합니다.","an":"1일차 슬라이드 · 원격 접속: IP·포트·localhost (p.30)","src":"● IP는 접속할 장비를, 포트는 그 \n장비의 서비스 진입점을 \n구분합니다.\n● 개인 PC의 localhost는 그 \nPC입니다. 원격 Jetson을 가리키지 \n않습니다.\n● 교재 기본 경로는 개인 PC \n브라우저에서 Jetson-IP:할당포트로 \n접속하는 방식입니다."},{"id":"t5-04","ty":"mc","lv":1,"game":true,"p":"교재 예시에서 원격 사용자에게 배정한 ROS Domain ID는?","o":["21","22","8889","0"],"a":1,"h":"교재 예시에서 로컬 사용자는 ROS Domain 21을 씁니다. 원격 사용자 remote01은 포트 8889로 접속하고, 독립 실습을 위해 로컬과 다른 Domain ID를 배정받으며, 이 값은 컨테이너 생성 명령 앞의 ROS_DOMAIN_ID에도 적힙니다.","w":"로컬 예시는 Domain 21, 원격 예시(remote01)는 Domain 22·포트 8889입니다. 실제로는 본인 배정값을 씁니다.","an":"1일차 슬라이드 · 원격 사용자 · 개인 자료와 실습 환경 (p.4)","src":"● PC 접속: http://<Jetson-IP>:8889\n● 토큰: nvidia · 독립 ROS Domain: \n22\n● USB 실습은 로컬 화면을 함께 \n봅니다."},{"id":"t5-05","ty":"mc","lv":2,"game":true,"p":"접속이 안 될 때 가장 먼저 확인할 것은?","o":["교재 경로·첫 환경 셀","토큰·Jupyter 화면","주소의 Jetson IP와 개인 포트","컨테이너 실행 상태"],"a":2,"h":"접속 문제 확인 순서는 바깥에서 안쪽으로 좁혀 갑니다. 주소·포트·네트워크 → 컨테이너 실행 상태 → 토큰·Jupyter 화면 → 교재 경로·첫 환경 셀 순서이며, 첫 단계에서 localhost를 잘못 쓰지 않았는지도 봅니다.","w":"확인 순서는 주소·포트·네트워크 → 컨테이너 실행 상태 → 토큰·Jupyter 화면 → 교재 경로·첫 환경 셀입니다.","an":"1일차 슬라이드 · 접속이 안 될 때 확인할 순서 (p.38)","src":"● 주소의 Jetson IP와 개인 포트를 \n확인합니다. localhost를 잘못 쓰지 \n않았는지 봅니다.\n● 호스트에서 docker ps로 내 \n컨테이너가 실행 중인지 \n확인합니다.\n● 파일을 못 찾으면 컨테이너의 \npwd·ls, GPU 문제면 공용 작업 \n상태를 확인합니다.\n주소·포트·네트워크\n↓\n컨테이너 실행 상태\n↓\n토큰·Jupyter 화면\n↓\n교재 경로·첫 환경 셀"},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"SSH 접속과 브라우저의 Jupyter 접속은 별개다.","a":true,"h":"SSH는 개인 PC에서 ssh 계정@Jetson-IP로 접속해 원격 장비의 셸(명령 창)을 쓰는 방법입니다. 브라우저로 여는 Jupyter는 컨테이너 안의 서비스에 접속하는 것이므로, 두 접속이 서로 어떤 관계인지 생각해 보세요.","w":"맞습니다. SSH는 원격 호스트 셸을 사용하는 방법이고, 브라우저 Jupyter 접속과 별개입니다.","an":"1일차 슬라이드 · SSH와 원격 호스트 셸 (p.105)","src":"● SSH는 원격 장비의 셸을 사용하는 \n방법입니다. 브라우저의 Jupyter \n접속과 별개입니다.\n● 개인 PC에서 ssh \n계정@Jetson-IP로 접속한 뒤 \n호스트 명령을 실행합니다.\n● 계정·IP·네트워크·SSH 서비스는 \n강사가 준비한 값을 사용합니다.\n● 함께 해석하기: SSH 안에서는 \nJetson 호스트의 현재 경로가 \n바뀝니다."},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"remote 모드는 로컬 GUI와 USB 카메라를 컨테이너로 전달한다.","a":false,"h":"local 모드는 카메라 장치와 로컬 화면 연결을 준비합니다. 원격 사용자를 위한 remote 모드는 Jetson 앞의 화면(GUI)과 USB 카메라를 컨테이너에 넘겨주는지 자료에서 확인해 보세요. 그래서 USB 카메라 실습은 로컬 화면을 함께 봅니다.","w":"틀렸습니다. remote 모드는 로컬 GUI·USB 카메라를 전달하지 않습니다.","an":"1일차 슬라이드 · 원격 컨테이너 생성 (p.33)","src":"● 앞 4쪽에서 생성했다면 상태만 \n확인합니다. 없을 때만 호스트에서 \n실행합니다.\n● remote 모드는 로컬 GUI·USB \n카메라를 전달하지 않습니다.\n● 예시 이름·폴더·포트·Domain은 \n본인 배정값으로 바꿉니다.\n● 함께 해석하기: 같은 호스트에서 \n충돌할 수 있습니다."},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"로컬·원격 실습에서 항목과 운영 방식을 연결하세요.","pairs":[["공통","같은 교재·내부 경로와 GPU·모델 서버"],["개인","폴더·컨테이너·포트·ROS Domain을 구분"],["USB 카메라","로컬에서 한 번 실행하고 화면을 함께 본다"],["무거운 훈련·추론","순서를 정하고 기록은 각자 보존"]],"h":"로컬·원격 사용자는 같은 교재·내부 경로와 GPU·모델 서버를 공통으로 씁니다. 개인 폴더·컨테이너·포트·ROS Domain은 사용자마다 구분하고, USB 카메라는 로컬에서 한 번 실행해 함께 보며, 무거운 훈련·추론은 순서를 정합니다.","w":"교재 함수와 저장 규칙은 같고, 접속 주소·개인 폴더·포트·Domain과 실물 화면 관찰 방식이 다릅니다.","an":"1일차 슬라이드 · 로컬·원격의 공통점과 차이 (p.35)","src":"● 공통: 같은 교재·내부 경로와 GPU·모델 서버를 사용합니다.\n● 개인: 폴더·컨테이너·포트·ROS Domain을 구분합니다.\n● USB 카메라: 로컬에서 한 번 실행하고 같은 화면을 함께 봅니다.\n● 무거운 훈련·추론은 순서를 정하고 기록은 각자 보존합니다.\n● 함께 해석하기: 교재 함수와 저장 규칙은 같고 접속 주소·개인 \n폴더·포트·Domain과 실물 화면 관찰 방식이 다릅니다."},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"접속이 안 될 때 확인하는 순서를 맞추세요.","steps":["주소·포트·네트워크","컨테이너 실행 상태","토큰·Jupyter 화면","교재 경로·첫 환경 셀"],"h":"접속 문제는 바깥에서 안쪽으로 좁혀 확인합니다. 먼저 주소·포트·네트워크를 보고, 호스트에서 docker ps로 컨테이너가 실행 중인지 확인한 다음, 토큰·Jupyter 화면을 보고, 마지막으로 교재 경로와 첫 환경 셀을 확인합니다.","w":"주소의 Jetson IP·개인 포트를 먼저 보고, docker ps로 컨테이너, 그다음 토큰·화면, 마지막으로 교재 경로를 확인합니다.","an":"1일차 슬라이드 · 접속이 안 될 때 확인할 순서 (p.38)","src":"● 주소의 Jetson IP와 개인 포트를 \n확인합니다. localhost를 잘못 쓰지 \n않았는지 봅니다.\n● 호스트에서 docker ps로 내 \n컨테이너가 실행 중인지 \n확인합니다.\n● 파일을 못 찾으면 컨테이너의 \npwd·ls, GPU 문제면 공용 작업 \n상태를 확인합니다.\n주소·포트·네트워크\n↓\n컨테이너 실행 상태\n↓\n토큰·Jupyter 화면\n↓\n교재 경로·첫 환경 셀"},{"id":"t5-10","ty":"multi","lv":2,"game":true,"p":"같은 Jetson을 쓰는 사용자별로 구분해야 하는 값을 <b>모두<\/b> 고르세요.","o":["컨테이너 이름","포트","ROS_DOMAIN_ID","컨테이너 내부 경로 /workspace","교재 함수 이름"],"a":[0,1,2],"h":"같은 Jetson에서 여러 사용자가 컨테이너를 만들면 서로 충돌하지 않도록 구분해야 하는 값이 있습니다. 자료는 컨테이너 이름, 접속 포트, ROS 통신 영역 번호를 사용자별로 나누라고 하며, 내부 경로 /workspace는 모두 같다고 설명합니다.","w":"컨테이너 이름·포트·ROS_DOMAIN_ID는 사용자별로 구분합니다. 내부 경로 /workspace는 모두 같습니다.","an":"1일차 슬라이드 · 원격 사용자도 Jetson 위에 개인 폴더를 둡니다 (p.31)","src":"● 컨테이너 \n이름·포트·ROS_DOMAIN_ID를 \n사용자별로 구분합니다.\n● 내부 경로는 모두 /workspace로 \n같아도 연결된 호스트 폴더는 서로 \n다릅니다."}]},{"id":"t6","title":"Jupyter와 Python 기초","ref":"Jupyter 사용 · Python 1·2교시 · p.39–65","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"Jupyter에서 코드 셀을 실행하는 키는?","o":["Ctrl+S","Shift+Enter","Ctrl+C","Alt+Tab"],"a":1,"h":"Jupyter에서 Shift와 Enter를 함께 누르는 것과 Ctrl+S는 서로 다른 동작입니다. 자료는 하나는 셀 실행, 다른 하나는 파일 저장이라고 구분하며, 실행과 저장은 별개라고 강조합니다.","w":"Shift+Enter는 셀 실행, Ctrl+S는 파일 저장입니다. 실행과 저장은 별개입니다.","an":"1일차 슬라이드 · Jupyter에서 네 가지 화면 구분 (p.39)","src":"● Markdown 셀: 설명을 읽는 곳. Python 셀: 커널에 코드를 보내는 곳.\n● 파일 편집기: .py·.cpp를 수정하고 저장하는 곳. Terminal: 독립 프로그램을 \n실행하는 곳.\n● Shift+Enter는 셀 실행, Ctrl+S는 파일 저장입니다. 실행과 저장은 \n별개입니다.\n● 함께 해석하기: 터미널은 셸 명령, 코드 셀은 선택한 커널의 코드를 \n실행합니다. 파일 편집기는 수정·저장, 출력 영역은 실행 결과입니다."},{"id":"t6-02","ty":"mc","lv":1,"game":true,"p":"Jupyter의 커널이란?","o":["노트북 파일 자체","브라우저 탭","변수·함수를 기억하는 Python 프로세스","저장 공간"],"a":2,"h":"Jupyter의 커널은 노트북 셀의 코드를 받아 실행하는 Python 프로세스입니다. 앞서 실행한 변수와 함수를 기억하고 있기 때문에, 셀 1에서 temperature를 정의하면 셀 2에서 그 값을 출력할 수 있습니다.","w":"커널은 앞서 실행한 변수·함수를 기억하는 Python 프로세스입니다.","an":"1일차 슬라이드 · 커널과 셀 실행 순서 (p.40)","src":"● 커널은 앞서 실행한 변수·함수를 \n기억하는 Python 프로세스입니다.\n● 셀을 수정만 하고 실행하지 않으면 \n이전 함수가 메모리에 남습니다.\n● 상태가 헷갈리면 저장→커널 \n재시작→첫 환경 셀부터 순서대로 \n실행합니다.\n● 함께 해석하기: 변수를 정의한 \n설정·import 셀이 실행됐는지 먼저 \n봅니다.\n# Python 셀 1\ntemperature = 25\n# Python 셀 2\nprint(temperature)"},{"id":"t6-03","ty":"mc","lv":2,"game":true,"p":"노트북 상태가 헷갈릴 때 권장하는 순서는?","o":["저장 → 커널 재시작 → 첫 환경 셀부터 실행","커널 재시작 → 저장 안 함","마지막 셀만 다시 실행","브라우저 새로고침만 한다"],"a":0,"h":"커널은 실행된 코드만 기억하므로 셀 실행 순서가 꼬이면 상태가 헷갈릴 수 있습니다. 이때는 작업이 사라지지 않게 먼저 저장하고, 커널을 재시작한 뒤, 첫 환경 셀부터 순서대로 다시 실행하라고 자료는 안내합니다.","w":"상태가 헷갈리면 저장 → 커널 재시작 → 첫 환경 셀부터 순서대로 실행합니다.","an":"1일차 슬라이드 · 커널과 셀 실행 순서 (p.40)","src":"● 커널은 앞서 실행한 변수·함수를 \n기억하는 Python 프로세스입니다.\n● 셀을 수정만 하고 실행하지 않으면 \n이전 함수가 메모리에 남습니다.\n● 상태가 헷갈리면 저장→커널 \n재시작→첫 환경 셀부터 순서대로 \n실행합니다."},{"id":"t6-04","ty":"mc","lv":2,"game":true,"p":"배송비 규칙에서 회원이 40,000원을 주문하면 배송비는?","o":["0원","1,000원","3,000원","4,000원"],"a":1,"h":"배송비 규칙은 넓은 조건부터 검사합니다. 먼저 금액이 50,000원 이상이면 무료이고, 아니면 회원이면서 30,000원 이상일 때 할인 배송비 1,000원, 나머지는 3,000원입니다. 40,000원은 첫 조건을 통과하지 못한다는 점부터 확인해 보세요.","w":"50,000원 미만이고 회원이면서 30,000원 이상이므로 할인 배송비 1,000원입니다.","an":"1일차 슬라이드 · 배송비 규칙을 조건 순서로 옮기기 (p.47)","src":"● 50,000원 이상이면 회원 여부와 \n무관하게 무료입니다.\n● 그 미만에서 회원이면서 30,000원 \n이상이면 할인 배송비, 나머지는 \n기본 배송비입니다.\n● 가장 넓은 우선 조건을 먼저 \n검사하고 경계 양쪽을 확인합니다.\n● 함께 해석하기: 겹치는 조건이 \n있으면 먼저 만난 분기가 뒤의 \n규칙을 가릴 수 있습니다.\n1. 금액 ≥ 50,000 → 0원 반환\n2. 아니면 회원 & 금액 ≥ 30,000?\n3. 위 조건 참 → 1,000원 반환\n4. 나머지 → 3,000원 반환"},{"id":"t6-05","ty":"mc","lv":2,"game":true,"p":"센서 보고서에서 alarm이 참이 되는 조건은?","o":["평균이 30.0 이상","개수가 3 이상","최댓값이 30.0 이상","평균이 30.0 미만"],"a":2,"h":"센서 보고서에서 평균은 합계를 개수로 나눈 값이라 순간 최고값을 다 보여 주지 못합니다. 이 실습의 경보(alarm)는 평균이 아니라 값들 가운데 가장 큰 값이 기준 30.0에 닿았는지로 판단합니다.","w":"이 실습의 alarm은 평균이 아니라 max(values) ≥ 30.0일 때 참입니다.","an":"1일차 슬라이드 · 평균·개수·경보를 따로 읽기 (p.62)","src":"● 평균은 합계를 개수로 나눈 값이며 순간 최고값이나 변동을 모두 보여주지 \n않습니다.\n● [20,20,20]과 [10,20,30]은 평균이 같지만 변동은 다릅니다.\n● count·mean·alarm의 정의와 단위를 확인하고 누락값이 있는 그룹을 무조건 \n비교하지 않습니다.\n● 이 실습의 alarm은 평균이 아니라 max(values) ≥ 30.0일 때 참입니다.\n● 함께 해석하기: 평균은 합계/개수이고 경보는 과제가 정한 개별 값의 임계 \n조건입니다."},{"id":"t6-06","ty":"ox","lv":1,"game":true,"p":"셀을 수정만 하고 실행하지 않으면 이전 함수가 메모리에 남는다.","a":true,"h":"커널은 앞서 '실행된' 변수와 함수를 기억하는 Python 프로세스입니다. 셀 내용을 고치기만 하고 실행하지 않으면, 커널은 새 코드를 받은 적이 없으므로 메모리에 어떤 함수가 남아 있을지 생각해 보세요.","w":"맞습니다. 수정 후에는 그 셀을 다시 실행해야 새 코드가 반영됩니다.","an":"1일차 슬라이드 · 커널과 셀 실행 순서 (p.40)","src":"● 커널은 앞서 실행한 변수·함수를 \n기억하는 Python 프로세스입니다.\n● 셀을 수정만 하고 실행하지 않으면 \n이전 함수가 메모리에 남습니다.\n● 상태가 헷갈리면 저장→커널 \n재시작→첫 환경 셀부터 순서대로 \n실행합니다."},{"id":"t6-07","ty":"ox","lv":2,"game":true,"p":"Ctrl+S로 저장하면 셀도 함께 실행된다.","a":false,"h":"자료는 Jupyter에서 Shift+Enter는 셀 실행, Ctrl+S는 파일 저장이라고 구분하고, 실행과 저장은 별개라고 강조합니다. 저장 단축키를 눌렀을 때 셀의 코드가 커널로 보내지는지 생각해 보세요.","w":"틀렸습니다. Ctrl+S는 파일 저장, Shift+Enter는 셀 실행입니다.","an":"1일차 슬라이드 · Jupyter에서 네 가지 화면 구분 (p.39)","src":"● Markdown 셀: 설명을 읽는 곳. Python 셀: 커널에 코드를 보내는 곳.\n● 파일 편집기: .py·.cpp를 수정하고 저장하는 곳. Terminal: 독립 프로그램을 \n실행하는 곳.\n● Shift+Enter는 셀 실행, Ctrl+S는 파일 저장입니다. 실행과 저장은 \n별개입니다.\n● 함께 해석하기: 터미널은 셸 명령, 코드 셀은 선택한 커널의 코드를 \n실행합니다. 파일 편집기는 수정·저장, 출력 영역은 실행 결과입니다."},{"id":"t6-08","ty":"match","lv":2,"game":false,"p":"Python 오류와 먼저 확인할 것을 연결하세요.","pairs":[["NameError","이름 정의·철자·앞 셀 실행"],["TypeError","값의 타입과 함수 인자"],["AssertionError","검증 기대값과 내 반환값"],["KeyError","없는 key를 []로 조회했는지"]],"h":"NameError는 이름이 정의되지 않았을 때, TypeError는 값의 타입이 맞지 않을 때, AssertionError는 검증 기대값과 반환값이 다를 때 납니다. KeyError는 딕셔너리에 없는 key를 []로 조회했을 때 납니다.","w":"오류 종류, 발생 셀·행, 실제 입력·타입, 실행 순서를 함께 확인합니다.","an":"1일차 슬라이드 · Python 오류를 읽는 순서 · p.59 (p.53)","src":"● NameError: 이름 정의·철자·앞 셀 실행을 확인합니다.\n● TypeError: 값의 타입과 함수 인자를 확인합니다.\n● AssertionError: 검증 기대값과 내 함수 반환값을 비교합니다.\n● 수정 후에는 수정한 셀을 다시 실행해야 새 코드가 반영됩니다.\n● 함께 해석하기: 오류 종류, 발생 셀·행, 실제 입력·타입, 실행 순서를 함께 \n확인합니다."},{"id":"t6-09","ty":"order","lv":1,"game":false,"p":"TODO 실습의 진행 순서를 맞추세요.","steps":["목적·입출력 읽기","환경·예제 실행","TODO 구현","학습자 검증","해설과 비교","재검증·저장"],"h":"TODO 실습은 무엇을 만들지(목적·입출력) 읽고, 환경·예제를 실행해 결과를 예측하는 것으로 시작합니다. 그다음 TODO를 구현하고 학습자 검증으로 확인한 뒤, 해설과 비교하고 마지막에 재검증·저장합니다.","w":"검증 실패 시 TODO로 돌아갑니다. 정답 실행만으로 자신의 구현이 완성되지는 않습니다.","an":"1일차 슬라이드 · TODO와 검증 셀의 역할 (p.41)","src":"검증 실패 시 TODO로 돌아갑니다. 정답 실행만으로 자신의 구현이 완성되지는 않습니다.\n · 학습안내.md\n먼저 실습 | 02.Python/01_python_basics.ipynb\n수업 핵심 1~4절과 완료 점검 확인 후 다음 슬라이드로 진행합니다.\n1. 목적·입출력 읽기\n무엇을 만들까\n2. 환경·예제 실행\n결과 먼저 예측\n3. TODO 구현\n지정 부분 수정\n4. 학습자 검증\n경계 입력 확인\n5. 해설과 비교\n원인·처리 이해\n6. 재검증 ·저장\n자신의 답에 반영"},{"id":"t6-10","ty":"multi","lv":1,"game":true,"p":"자료구조 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["리스트는 순서대로 모은 여러 값","튜플은 바꾸지 않을 묶음","딕셔너리는 key로 값을 찾는다","튜플은 원소를 자유롭게 바꾼다","딕셔너리는 인덱스로만 조회한다"],"a":[0,1,2],"h":"자료구조는 조회 방식으로 고릅니다. 리스트는 순서대로 모은 여러 값, 튜플은 만든 뒤 바꾸지 않을 묶음, 딕셔너리는 이름인 key로 값을 찾는 구조입니다. 순서·수정·조회 방법을 기준으로 보기를 판단해 보세요.","w":"리스트는 순서 있는 값, 튜플은 바꾸지 않을 묶음, 딕셔너리는 이름(key)으로 값을 찾는 구조입니다.","an":"1일차 슬라이드 · 자료구조는 조회 방식으로 선택합니다 (p.54)","src":"● 리스트는 순서대로 모은 여러 값, 튜플은 바꾸지 않을 묶음에 적합합니다.\n● 딕셔너리는 이름인 key로 값을 찾는 구조입니다.\n● 자료의 이름만 외우기보다 순서·수정·조회 방법을 기준으로 선택합니다.\n● 함께 해석하기: 순서로 읽을지, 한 기록의 값을 묶을지, 이름으로 찾을지에 \n따라 선택합니다."}]},{"id":"t7","title":"C++ 기초·함수·메모리·CMake","ref":"C++ 1~3교시 · p.66–88","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"C++ 실행 파일의 시작 함수는?","o":["include","main","cout","return"],"a":1,"h":"C++ 실행 파일은 정해진 이름의 함수에서 시작합니다. 예제 코드에서 int 반환 타입과 빈 괄호를 가진 그 함수 안에 value 출력과 return 0;이 들어 있으며, 이름은 '주된'을 뜻하는 영어 단어입니다.","w":"main은 실행 파일의 시작 함수입니다. #include는 선언을 가져오고 std::cout은 출력에 씁니다.","an":"1일차 슬라이드 · main·중괄호·세미콜론 (p.69)","src":"● main은 실행 파일의 시작 \n함수입니다.\n● 중괄호는 실행 묶음을 만들고 \n세미콜론은 많은 문장을 끝냅니다.\n● #include는 필요한 선언을 가져오며 \nstd::cout은 출력에 사용합니다.\n● 함께 해석하기: 주로 중괄호가 \n범위를 정하고 세미콜론이 문장을 \n끝냅니다."},{"id":"t7-02","ty":"num","lv":2,"game":false,"p":"<code>int sum = 5; int count = 2; double a = sum / count;<\/code> 실행 후 a의 값은?","a":2,"unit":"","h":"계산식: 정수끼리 나누면 정수 결과 → sum / count (소수 부분 버림)","w":"정수끼리 나누면 정수 결과(2)가 되고, double에 저장해도 버린 소수는 되살아나지 않습니다. 2.5가 필요하면 static_cast<double>(sum) / count로 계산합니다.","an":"1일차 슬라이드 · 정수 나눗셈과 타입 변환 (p.71)","src":"● 정수끼리 나누면 정수 결과가 \n됩니다. 평균처럼 실수가 필요하면 \n계산 전에 변환합니다.\n● 계산이 끝난 뒤 double에 저장해도 \n이미 버린 소수는 되살아나지 \n않습니다.\n● 범위·타입을 알고 변환해야 의도한 \n결과를 얻습니다.\n● 함께 해석하기: 정수 나눗셈은 이 \n예제에서 2입니다."},{"id":"t7-03","ty":"mc","lv":2,"game":true,"p":"링크 오류 undefined reference가 나면 먼저 확인할 것은?","o":["문법·세미콜론","입력값 범위","정의 소스·라이브러리 연결","커널 재시작"],"a":2,"h":"C++ 오류는 단계별로 구분합니다. 컴파일 오류는 문법·타입·선언 문제이고, undefined reference 같은 링크 오류는 선언은 알지만 실제 구현을 찾지 못한 경우이므로, 그 구현이 담긴 소스나 라이브러리가 제대로 연결됐는지 확인합니다.","w":"컴파일 오류는 문법·타입·선언, 링크 오류는 정의 소스·라이브러리 연결, 실행 오류는 입력·주소·길이·수명을 확인합니다.","an":"1일차 슬라이드 · 컴파일·링크·실행 오류 구분 (p.88)","src":"● 컴파일 오류: 문법·타입·선언을 확인합니다.\n● 링크 오류 undefined reference: 정의 소스·라이브러리 연결을 확인합니다.\n● 실행 오류: 입력·주소·길이·수명·검증 기대값을 확인합니다.\n● Python의 CalledProcessError 위에 실제 C++ 오류가 출력될 수 있습니다.\n● 함께 해석하기: 문법·타입의 컴파일 오류, 구현 연결의 링크 오류, 실행 중 \n입력·계약 오류를 구분합니다."},{"id":"t7-04","ty":"mc","lv":2,"game":true,"p":"<code>void increment(int&amp; x)<\/code>에 a = 2를 넘겨 호출하면 a는?","o":["2","3","0","컴파일 오류"],"a":1,"h":"매개변수 타입에 &가 붙은 int&는 원본 변수에 대한 참조입니다. 참조 매개변수를 함수 안에서 바꾸면 호출한 쪽의 원본도 함께 바뀌므로, increment가 x에 1을 더한 뒤 a가 몇이 되는지 계산해 보세요.","w":"참조 전달이므로 함수 안에서 x를 바꾸면 호출한 쪽의 a도 3이 됩니다. 값 전달(int x)이었다면 a는 2로 남습니다.","an":"1일차 슬라이드 · 참조 전달: 원본을 다른 이름으로 사용 (p.76)","src":"● int&는 원본 변수에 대한 참조를 \n받습니다.\n● 참조 매개변수를 수정하면 호출한 \n쪽의 원본도 바뀝니다.\n● 변경이 함수의 의도인지 \n인터페이스와 검증에서 드러내야 \n합니다.\n● 함께 해석하기: 원본을 다른 \n이름으로 사용하는 방식입니다."},{"id":"t7-05","ty":"mc","lv":1,"game":true,"p":"cmake 명령에서 빌드 결과 폴더를 지정하는 옵션은?","o":["-S","--build","--test-dir","-B"],"a":3,"h":"cmake 설정 명령은 cmake -S 소스폴더 -B 빌드폴더 형태입니다. 두 옵션은 각각 Source와 Build의 머리글자이며, 빌드 결과를 Data/build 아래에 분리하면 교재 소스와 생성물을 구분하기 쉽습니다.","w":"-S는 소스 폴더, -B는 빌드 결과 폴더입니다. 결과를 Data/build 아래에 두면 교재 소스와 생성물을 구분하기 쉽습니다.","an":"1일차 슬라이드 · configure·build·test 명령 읽기 (p.86)","src":"● -S는 소스 폴더, -B는 빌드 결과 \n폴더입니다.\n● Data/build 아래에 결과를 분리하면 \n교재 소스와 생성물을 구분하기 \n쉽습니다.\n● 실제 실습은 노트북이 제공한 \n경로·명령을 그대로 확인합니다.\n● 함께 해석하기: 설정 생성, 산출물 \n빌드, 등록된 검사 실행입니다.\ncmake -S 소스폴더 -B 빌드폴더\ncmake --build 빌드폴더"},{"id":"t7-06","ty":"ox","lv":1,"game":true,"p":"C++ 소스를 수정하면 저장한 뒤 다시 빌드해야 실행 결과가 바뀐다.","a":true,"h":"C++는 소스 .cpp와 헤더를 컴파일해 목적 파일(.o)을 만들고, 링크해 실행 파일이나 .so를 만든 뒤에야 실행합니다. 소스를 고쳤더라도 이 과정을 다시 거치지 않으면 예전 실행 파일이 그대로 실행된다는 점을 생각해 보세요.","w":"맞습니다. 소스를 수정하면 저장한 뒤 다시 빌드해야 실행 결과가 바뀝니다.","an":"1일차 슬라이드 · 소스·헤더·목적 파일·실행 파일 (p.67)","src":"● 소스 .cpp는 구현, 헤더 .h/.hpp는 \n공개 선언을 담습니다.\n● 컴파일은 소스를 기계어 조각으로, \n링크는 필요한 조각을 실행 파일로 \n연결합니다.\n● 소스를 수정하면 저장한 뒤 다시 \n빌드해야 실행 결과가 바뀝니다.\n● 함께 해석하기: 선언·구현 소스가 \n컴파일되고 필요한 목적 파일이 \n링크되어야 실행 파일이 생깁니다."},{"id":"t7-07","ty":"ox","lv":2,"game":true,"p":"포인터에는 가리키는 배열의 길이 정보가 함께 들어 있다.","a":false,"h":"포인터는 배열 첫 원소의 주소만 저장합니다. 자료는 포인터만으로는 몇 개의 원소가 유효한지 알 수 없어서, 주소와 함께 길이(count)를 따로 넘기고 null·빈 입력·범위 밖 접근을 검사해야 한다고 설명합니다.","w":"틀렸습니다. 포인터만으로는 유효한 원소 수를 알 수 없으므로 주소와 길이를 함께 전달하고 null·빈 입력·범위를 검사합니다.","an":"1일차 슬라이드 · 포인터에는 배열 길이가 들어 있지 않습니다 (p.84)","src":"● 포인터만으로 몇 개의 원소가 \n유효한지 알 수 없습니다.\n● 주소와 길이를 함께 전달하고 \nnull·빈 입력·범위 밖 접근을 \n검사합니다.\n● const double*는 이 포인터를 통한 \n원소 변경을 제한합니다.\n● 함께 해석하기: 포인터 자체에는 \n길이가 없습니다."},{"id":"t7-08","ty":"match","lv":1,"game":false,"p":"C++ 빌드 구성 요소와 역할을 연결하세요.","pairs":[["소스 .cpp","구현을 담는다"],["헤더 .h/.hpp","공개 선언을 담는다"],["컴파일","소스를 목적 파일(.o)로 만든다"],["링크","목적 파일을 실행 파일·.so로 연결한다"]],"h":"소스 .cpp는 실제 처리(구현)를, 헤더 .h/.hpp는 다른 파일에 공개할 약속(선언)을 담습니다. 컴파일은 소스를 기계어 조각인 목적 파일로 만들고, 링크는 필요한 조각을 이어 실행 파일이나 .so로 만듭니다.","w":"선언·구현 소스가 컴파일되고 필요한 목적 파일이 링크되어야 실행 파일이 생깁니다.","an":"1일차 슬라이드 · 소스·헤더·목적 파일·실행 파일 (p.67)","src":"● 소스 .cpp는 구현, 헤더 .h/.hpp는 \n공개 선언을 담습니다.\n● 컴파일은 소스를 기계어 조각으로, \n링크는 필요한 조각을 실행 파일로 \n연결합니다.\n● 소스를 수정하면 저장한 뒤 다시 \n빌드해야 실행 결과가 바뀝니다.\n● 함께 해석하기: 선언·구현 소스가 \n컴파일되고 필요한 목적 파일이 \n링크되어야 실행 파일이 생깁니다."},{"id":"t7-09","ty":"order","lv":2,"game":false,"p":"CMake로 빌드하고 검사하는 순서를 맞추세요.","steps":["소스·설정 저장","configure","build","CTest","결과 판독","수정·재검사"],"h":"CMake 실습은 TODO를 수정한 소스·설정을 저장하는 것부터 시작합니다. 그다음 configure로 target 관계를 해석하고, build로 컴파일·링크하며, CTest로 등록된 검사를 실행해 첫 실패 위치를 읽고 수정·재검사합니다.","w":"저장 후 configure로 target 관계를 해석하고, build로 컴파일·링크, CTest로 검사한 뒤 첫 실패 위치부터 고칩니다.","an":"1일차 슬라이드 · CMake: 빌드 대상을 연결하는 도구 (p.85)","src":"빌드 오류와 검사 실패를 구분합니다. 산출물은 Data/build에, 수정 원본은 교재 폴더에 둡니다.\n · 03.C++/03_memory_stl_cmake.ipynb\n1. 소스·설정 저장\nTODO 수정 반영\n2. configure\ntarget 관계 해석\n3. build\n컴파일·링크\n4. CTest\n등록한 검사 실행\n5. 결과 판독\n첫 실패 위치 확인\n6. 수정·재검사\n소스부터 다시"},{"id":"t7-10","ty":"multi","lv":2,"game":false,"p":"vector·포인터 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["vector는 같은 타입 원소를 순서대로 저장","push_back은 끝에 원소를 추가","const double*는 그 포인터로 원소 변경을 제한","범위를 벗어난 지역 객체 주소도 안전","포인터만으로 원소 개수를 알 수 있다"],"a":[0,1,2],"h":"std::vector는 같은 타입 원소를 순서대로 저장하며, size로 길이를 보고 push_back으로 끝에 추가합니다. const double*는 그 포인터로 원소를 바꾸지 못하게 하며, 포인터 자체에는 길이 정보가 없다는 점도 함께 떠올려 보세요.","w":"지역 객체는 범위를 벗어나면 수명이 끝나 그 주소 사용이 유효하지 않고, 포인터에는 길이가 없습니다.","an":"1일차 슬라이드 · vector · p.82–84 포인터·수명 (p.81)","src":"● std::vector는 같은 타입 원소를 \n순서대로 저장합니다.\n● size로 길이를 확인하고 \npush_back으로 끝에 추가합니다.\n● 크기 변경으로 내부 메모리가 \n이동하면 기존 원소의 주소가 \n무효가 될 수 있습니다.\n● 함께 해석하기: 재할당이 일어나면 \n이전 포인터·참조·iterator가 무효가 \n될 수 있습니다."}]},{"id":"t8","title":"공유 라이브러리와 1일차 정리","ref":"C++ 4교시 · 1일차 정리 · p.89–101","qs":[{"id":"t8-01","ty":"mc","lv":1,"game":true,"p":"C++ 함수 이름에 C 언어 연결 방식을 지정하는 표기는?","o":["extern \"C\"","#include","const","static_cast"],"a":0,"h":"ABI는 함수 호출과 데이터 표현 같은 바이너리 수준의 약속입니다. C++ 함수 이름을 C 언어 방식으로 연결해 Python의 ctypes 같은 다른 언어가 찾을 수 있게 하려면, 함수 앞에 extern과 언어 이름을 따옴표로 붙인 표기를 씁니다.","w":"extern \"C\"는 C++ 함수 이름의 C 언어 연결 방식을 지정합니다. 이것만으로 모든 C++ 객체가 자동 호환되지는 않습니다.","an":"1일차 슬라이드 · C ABI: 언어 사이의 호출 약속 (p.90)","src":"● ABI는 함수 호출과 데이터 표현 등 바이너리 수준의 약속입니다.\n● extern \"C\"는 C++ 함수 이름의 C 언어 연결 방식을 지정합니다.\n● 이것만으로 모든 C++ 객체가 Python과 자동 호환되는 것은 아닙니다.\n● 함께 해석하기: 호출 이름과 형식을 연결하기 위한 경계이며 \n타입·길이·소유권·오류 처리도 따로 약속해야 합니다."},{"id":"t8-02","ty":"mc","lv":2,"game":true,"p":"sensor_mean 함수가 반환하는 int의 의미는?","o":["평균값","원소 개수","성공·실패 상태","배열 주소"],"a":2,"h":"sensor_mean의 values는 읽을 배열 주소, n은 원소 수, out_mean은 평균을 쓸 공간의 주소입니다. 평균은 out_mean이 가리키는 곳에 쓰이므로, 함수가 돌려주는 int는 계산값이 아니라 다른 정보를 담습니다.","w":"반환 int는 평균이 아니라 성공·실패 상태입니다. 성공했을 때만 출력 공간의 값을 평균으로 사용합니다.","an":"1일차 슬라이드 · sensor_mean 계약을 읽기 (p.91)","src":"● values는 읽을 double 배열 주소, \nn은 원소 수입니다.\n● out_mean은 평균을 쓸 공간의 \n주소입니다.\n● 함수 반환 int는 평균이 아니라 \n성공·실패 상태입니다.\n● 함께 해석하기: 실패 여부와 \n계산값은 다른 정보입니다."},{"id":"t8-03","ty":"mc","lv":2,"game":true,"p":"ctypes에서 C 함수가 반환하는 값의 타입을 지정하는 속성은?","o":["argtypes","restype","byref","c_double"],"a":1,"h":"ctypes로 C 함수를 부를 때는 Python 쪽에도 타입 약속을 맞춥니다. argtypes는 인자의 타입과 순서를 지정하고, 함수가 돌려주는 값의 타입은 '결과 타입(result type)'을 줄인 속성에 지정합니다.","w":"argtypes는 인자의 타입과 순서, restype은 반환값 타입을 지정합니다.","an":"1일차 슬라이드 · ctypes에서 타입을 정확히 지정하기 (p.92)","src":"● argtypes는 C 함수 인자의 타입과 \n순서를 지정합니다.\n● restype은 함수가 반환하는 값의 \n타입입니다.\n● double 포인터·size_t·double \n포인터·int 계약을 Python에서도 \n똑같이 맞춥니다."},{"id":"t8-04","ty":"mc","lv":2,"game":true,"p":"C++ 소스를 고쳤는데 결과가 그대로일 때 의심할 것은?","o":["이미 로드한 이전 .so를 사용 중","인터넷 연결 끊김","브라우저 캐시","모니터 해상도"],"a":0,"h":"소스를 고쳤는데 결과가 같다면, 먼저 소스를 저장하고 .so를 다시 빌드했는지 확인합니다. 그래도 같다면 Python 프로세스가 예전 라이브러리를 이미 로드해 쓰고 있을 수 있으므로, 새 프로세스나 커널에서 다시 로드해야 합니다.","w":"수정 소스를 저장하고 .so를 재빌드했는지, 프로세스가 이전 라이브러리를 이미 로드했는지 확인하고 새 프로세스에서 로드합니다.","an":"1일차 슬라이드 · 소스를 바꾼 뒤 결과가 그대로라면 (p.96)","src":"● 수정한 소스를 저장하고 .so를 다시 \n빌드했는지 확인합니다.\n● Python 프로세스가 이전 \n라이브러리를 이미 로드했을 수 \n있습니다.\n● 노트북 안내에 따라 새 프로세스 \n또는 커널에서 새 라이브러리를 \n로드합니다.\n● 함께 해석하기: 실제 로드 경로와 \n프로세스가 이미 읽은 라이브러리를 \n확인합니다."},{"id":"t8-05","ty":"mc","lv":1,"game":false,"p":"C++ 평균 결과 JSON의 저장 위치는?","o":["Data/build/sensor.so","02.Python/sensor.json","/tmp/mean.txt","Data/outputs/03.C++/sensor_mean.json"],"a":3,"h":"공유 라이브러리 실습은 ABI 검증과 Python/C++ 평균 비교를 마친 뒤 결과 JSON을 저장합니다. 실행 결과는 Data/outputs 아래, 과목 폴더(03.C++) 안에 함수 이름을 딴 .json 파일로 둡니다.","w":"ABI 검증과 Python/C++ 평균 비교 후 결과를 Data/outputs/03.C++/sensor_mean.json에 저장합니다.","an":"1일차 슬라이드 · 공유 라이브러리 빌드·호출 실습 (p.94)","src":"● 04_shared_library_python.ipynb의 sensor.cpp TODO를 확인합니다.\n● 필수: .so 빌드→ctypes 호출→유한성·실패 시 출력 보존 검사.\n● NaN·Inf·overflow 상세 원리와 심볼 해석은 복습·강사 시연입니다.\n● ABI 검증과 Python/C++ 평균 비교 후 결과 JSON을 저장합니다.\n● 저장 경로: Data/outputs/03.C++/sensor_mean.json"},{"id":"t8-06","ty":"ox","lv":2,"game":true,"p":"extern \"C\"만 쓰면 모든 C++ 객체가 Python과 자동으로 호환된다.","a":false,"h":"extern \"C\"는 C++ 함수 이름을 C 언어 방식으로 공개해 호출 이름과 형식을 연결하는 경계일 뿐입니다. 자료는 이것만으로 모든 C++ 객체가 Python과 자동 호환되지 않으며, 타입·길이·소유권·오류 처리를 따로 약속해야 한다고 설명합니다.","w":"틀렸습니다. 타입·길이·소유권·오류 처리도 따로 약속해야 합니다.","an":"1일차 슬라이드 · C ABI: 언어 사이의 호출 약속 (p.90)","src":"● ABI는 함수 호출과 데이터 표현 등 바이너리 수준의 약속입니다.\n● extern \"C\"는 C++ 함수 이름의 C 언어 연결 방식을 지정합니다.\n● 이것만으로 모든 C++ 객체가 Python과 자동 호환되는 것은 아닙니다.\n● 함께 해석하기: 호출 이름과 형식을 연결하기 위한 경계이며 \n타입·길이·소유권·오류 처리도 따로 약속해야 합니다."},{"id":"t8-07","ty":"ox","lv":1,"game":true,"p":"Python과 C++ 사이의 호출과 데이터 변환에도 비용이 든다.","a":true,"h":"기존 계산 부품 재사용, 필요한 성능, 하드웨어 연동은 계산을 C++로 분리할 이유가 될 수 있습니다. 그러나 자료는 Python과 C++ 사이를 오가는 호출과 데이터 변환에도 대가가 따른다고 하며, 그래서 호출비용을 실측하라고 합니다.","w":"맞습니다. 구현 결과 일치·호출비용 실측·유지보수 부담을 함께 비교합니다.","an":"1일차 슬라이드 · C++로 분리할 이유를 설명하기 (p.97)","src":"● 기존 계산 부품 재사용, 필요한 성능, 하드웨어 연동 요구가 분리 이유가 될 \n수 있습니다.\n● Python↔C++ 호출과 데이터 변환에도 비용이 듭니다.\n● 구현 결과 일치·호출비용 실측·유지보수 부담을 함께 비교합니다.\n● 함께 해석하기: 호출 비용과 전체 병목을 측정해야 합니다."},{"id":"t8-08","ty":"match","lv":2,"game":false,"p":"sensor_mean 호출 계약의 요소와 의미를 연결하세요.","pairs":[["values","읽을 double 배열의 주소"],["n","원소 수"],["out_mean","평균을 쓸 공간의 주소"],["restype","반환값의 타입 지정"],["argtypes","인자의 타입과 순서 지정"]],"h":"sensor_mean의 values는 읽을 double 배열의 주소, n은 원소 수, out_mean은 평균을 쓸 공간의 주소입니다. Python ctypes 쪽에서는 argtypes로 인자의 타입과 순서를, restype으로 반환값의 타입을 지정합니다.","w":"호출자는 C가 읽을 배열과 결과를 쓸 double 공간을 만들고, 호출 동안 배열을 유지하며 상태 코드를 먼저 검사합니다.","an":"1일차 슬라이드 · sensor_mean 계약 · p.92 ctypes (p.91)","src":"● values는 읽을 double 배열 주소, \nn은 원소 수입니다.\n● out_mean은 평균을 쓸 공간의 \n주소입니다.\n● 함수 반환 int는 평균이 아니라 \n성공·실패 상태입니다.\n● 함께 해석하기: 실패 여부와 \n계산값은 다른 정보입니다.\nint sensor_mean(\n const double* values,\n size_t n,\n double* out_mean\n);"},{"id":"t8-09","ty":"order","lv":2,"game":false,"p":"C++ 함수를 Python에서 호출하는 과정을 순서대로 정렬하세요.","steps":["C++ 구현과 함수 계약 확인",".so 공유 라이브러리 빌드","공개 심볼 확인","ctypes 입출력 타입 지정","주소·길이를 전달해 호출","상태 확인 후 결과 사용"],"h":"C++ 함수를 Python에서 부르려면 먼저 C++ 구현과 함수 계약을 확인하고 .so로 빌드합니다. 그다음 공개 심볼이 있는지 확인하고, ctypes로 입출력 타입을 지정한 뒤, 주소·길이를 넘겨 호출하고, 상태를 확인한 후에 결과를 씁니다.","w":"재빌드한 .so는 새 프로세스에서 다시 로드해 확인하고, 반환 상태와 계산 결과를 구분합니다.","an":"1일차 슬라이드 · 공유 라이브러리 .so는 재사용할 코드 묶음 (p.89)","src":"1. C++ 구현\n함수 계약 확인\n2. 공유 라이브러리\nso 빌드\n3. 심볼 확인\n공개 함수 존재\n4. ctypes 준비\n입출력 타입 지정\n5. 함수 호출\n주소·길이 전달\n6. 상태·결과 검사\n성공일 때 값 사용"},{"id":"t8-10","ty":"multi","lv":3,"game":true,"p":"계산을 C++로 분리할 이유가 될 수 있는 것을 <b>모두<\/b> 고르세요.","o":["기존 계산 부품 재사용","필요한 성능","하드웨어 연동 요구","호출 비용이 전혀 없어서","코드 줄 수를 늘리려고"],"a":[0,1,2],"h":"자료는 계산을 C++로 분리할 이유로 기존 계산 부품 재사용, 필요한 성능, 하드웨어 연동 요구를 듭니다. 다만 Python↔C++ 호출과 데이터 변환에도 비용이 들어서, 결과 일치·호출비용·유지보수 부담을 함께 비교하라고 합니다.","w":"기존 부품 재사용·필요한 성능·하드웨어 연동이 이유가 될 수 있으며, 호출·변환 비용과 전체 병목은 측정해야 합니다.","an":"1일차 슬라이드 · C++로 분리할 이유를 설명하기 (p.97)","src":"● 기존 계산 부품 재사용, 필요한 성능, 하드웨어 연동 요구가 분리 이유가 될 \n수 있습니다.\n● Python↔C++ 호출과 데이터 변환에도 비용이 듭니다.\n● 구현 결과 일치·호출비용 실측·유지보수 부담을 함께 비교합니다.\n● 함께 해석하기: 호출 비용과 전체 병목을 측정해야 합니다."}]},{"id":"t9","title":"부록: 개별 실습 초기 설정","ref":"1일차 v2 부록 · p.108–136","qs":[{"id":"t9-01","ty":"mc","lv":1,"game":true,"p":"부록이 기준으로 삼는 JetPack 버전은?","o":["5.1","6.0","6.2","7.0"],"a":2,"h":"부록의 준비물과 버전 기준은 Jetson Orin Nano Developer Kit와 JetPack / Jetson Linux R36.4.3 / Ubuntu 22.04 / ARM64를 묶어 적어 둡니다. 최신 안내가 다른 버전으로 바뀔 수 있으므로 같은 숫자의 SD 이미지를 명시적으로 고르라고 합니다.","w":"부록은 Orin Nano Developer Kit, JetPack 6.2 / Jetson Linux R36.4.3 / Ubuntu 22.04 / ARM64를 기준으로 합니다.","an":"1일차 슬라이드 · 준비물과 버전 기준 (p.111)","src":"• 장비: Jetson Orin Nano Developer Kit, 전원, DisplayPort 모니터, USB 키보드·마우스, 네트워크.\n• Windows PC와 microSD 리더를 준비합니다. 예제는 128GB microSD를 사용합니다.\n• 기준: JetPack 6.2 / Jetson Linux R36.4.3 / Ubuntu 22.04 / ARM64.\n• JetPack 6.2 전용 다운로드 페이지에서 Orin Nano Developer Kit SD card image를 선택합니다.\n• 최신 안내가 다른 JetPack 버전으로 바뀔 수 있으므로 6.2 SD 이미지를 명시적으로 선택합니다."},{"id":"t9-02","ty":"mc","lv":1,"game":true,"p":"Windows에서 JetPack SD 카드 이미지를 기록하는 도구는?","o":["balenaEtcher","Docker","jtop","colcon"],"a":0,"h":"Windows에서 SD 이미지를 기록할 때는 .img를 단순 복사하지 않고 전용 플래싱 도구를 씁니다. 이 도구에서 Flash from file로 .img를 고르고, Select target으로 SD 카드를 고른 뒤, Flash!로 기록·검증을 마칩니다.","w":"balenaEtcher로 .img를 SD 카드에 기록하고 검증까지 완료해야 합니다. 단순 파일 복사는 플래싱이 아닙니다.","an":"1일차 슬라이드 · balenaEtcher로 JetPack 6.2 기록 (p.113)","src":"• 1. NVIDIA 6.2 페이지에서 SD 이미지를 받고 압축을 풀어 .img 파일을 준비합니다.\n• 2. balenaEtcher의 Windows 버전을 설치하고 실행합니다.\n• 3. Flash from file → 준비한 JetPack 6.2 .img를 선택합니다.\n• 4. Select target → SD 카드의 용량·장치명을 대조하여 선택합니다.\n• 5. Flash! → Windows 권한 요청을 승인하고 기록·검증 완료까지 기다립니다.\n• 대상 SD 카드의 기존 데이터는 지워집니다. 필요한 파일은 기록 전에 복사합니다.\n완료: Etcher의 기록과 검증이 모두 성공했습니다. 단순 파일 복사는 플래싱이 아닙니다."},{"id":"t9-03","ty":"mc","lv":2,"game":true,"p":"docker 그룹에 사용자를 추가(usermod)한 뒤 해야 할 일은?","o":["바로 사용한다","로그아웃·재로그인 또는 SSH 재접속","이미지를 다시 받는다","ROS를 재설치한다"],"a":1,"h":"docker 그룹은 관리자 수준의 권한을 주며, sudo usermod -aG docker \"$USER\"로 사용자를 추가합니다. 그룹 변경은 이미 열린 로그인 세션에는 바로 적용되지 않으므로, 데스크톱이나 SSH 세션을 어떻게 해야 하는지 자료에서 확인해 보세요.","w":"usermod 이후 데스크톱 로그아웃·재로그인 또는 SSH 재접속을 하고, 새 터미널에서 hello-world를 실행해 확인합니다.","an":"1일차 슬라이드 · Docker 3 — 권한과 단독 실행 확인 (p.120)","src":"• docker 그룹은 관리자 수준의 접근 권한을 제공합니다. 개인 실습 계정에만 적용합니다.\n• usermod 이후 데스크톱 로그아웃·재로그인 또는 SSH 재접속을 수행합니다.\nsudo systemctl enable --now docker\nsudo usermod -aG docker \"$USER\"\n# After logout / login, in a NEW terminal:\nid -nG\ndocker version\ndocker run --rm hello-world"},{"id":"t9-04","ty":"mc","lv":2,"game":true,"p":"Ollama 서비스가 사용하는 포트는?","o":["8888","8889","11434","22"],"a":2,"h":"Ollama 설치 전에 ss -ltnp | grep으로 특정 포트를 먼저 확인해, 기존 Ollama가 있으면 중복 서버를 만들지 않습니다. 설치 후 API 확인도 curl http://localhost:포트/api/tags로 하며, 두 명령에 같은 다섯 자리 포트 번호가 나옵니다.","w":"Ollama는 11434 포트를 사용합니다. 기존 Ollama가 있으면 중복 서버를 설치·실행하지 않습니다.","an":"1일차 슬라이드 · LLM 1 — Ollama 설치와 서비스 (p.131)","src":"• 시작 조건: B 완료. Docker·ROS는 필요 없습니다. 호스트 직접 설치 예제입니다.\n• 먼저 11434 포트를 확인합니다. 기존 Ollama가 있으면 중복 서버를 설치·실행하지 않습니다.\n• 설치 스크립트는 공식 사이트에서 내려받아 내용을 확인한 뒤 실행합니다.\nss -ltnp | grep ':11434'"},{"id":"t9-05","ty":"mc","lv":2,"game":true,"p":"ROS 2 talker·listener 실습에서 두 터미널이 같아야 하는 값은?","o":["포트 번호","컨테이너 이름","Jupyter 토큰","ROS_DOMAIN_ID"],"a":3,"h":"talker와 listener는 서로 다른 터미널에서 실행하지만 같은 통신 영역에 있어야 메시지를 주고받습니다. 두 터미널 모두 source로 ROS 환경을 불러온 뒤 export로 같은 값을 지정하는 환경변수를 확인해 보세요.","w":"두 터미널의 Domain ID는 같아야 하며, 한 Jetson을 함께 쓰면 다른 사용자와는 구분합니다.","an":"1일차 슬라이드 · ROS 2 4 — talker와 listener 확인 (p.129)","src":"• 아래 A·B를 서로 다른 터미널에서 실행합니다. 두 터미널의 Domain ID는 같아야 합니다.\n• 한 Jetson을 함께 쓰는 경우 다른 사용자의 실습과 Domain ID를 구분합니다.\n# Terminal A:\nsource /opt/ros/humble/setup.bash\nexport ROS_DOMAIN_ID=21\nros2 run demo_nodes_cpp talker\n# Terminal B:\nsource /opt/ros/humble/setup.bash\nexport ROS_DOMAIN_ID=21\nros2 run demo_nodes_py listener\n완료: A의 Publishing 메시지가 B의 I heard로 수신됩니다. 각 터미널에서 Ctrl+C로 종료합니다."},{"id":"t9-06","ty":"ox","lv":2,"game":true,"p":"SD 카드 이미지를 다시 기록하면 보드의 QSPI 펌웨어 갱신도 완료된다.","a":false,"h":"이미 JetPack 6.x로 부팅한 장비는 6.2 SD 이미지만 기록하면 되지만, 출고 펌웨어나 JetPack 5.x 장비는 QSPI/UEFI 펌웨어를 먼저 갱신해야 합니다. 자료는 SD 카드 재기록만으로 보드의 QSPI 갱신이 끝나는지 따로 짚어 줍니다.","w":"틀렸습니다. SD 카드 재기록만으로 QSPI 갱신이 완료되지 않으므로 공식 안내에 따라 펌웨어를 먼저 갱신합니다.","an":"1일차 슬라이드 · SD 카드 기록 전에 펌웨어를 확인합니다 (p.112)","src":"• 이미 JetPack 6.x로 부팅한 장비: 6.2 SD 이미지 기록 절차로 진행합니다.\n• 출고 펌웨어 또는 JetPack 5.x 장비: 공식 안내에 따라 QSPI/UEFI 펌웨어를 먼저 갱신합니다.\n• SD 카드 이미지를 다시 기록하는 것만으로 보드의 QSPI 갱신이 완료되지는 않습니다.\n• 부팅 시 Esc로 UEFI 정보를 확인하고, 불명확하면 아래 공식 갱신 안내에서 장비 상태별 경로를 따릅니다.\n• 이후 예제는 JetPack 6.x용 펌웨어 준비가 끝났다는 조건으로 진행합니다."},{"id":"t9-07","ty":"ox","lv":1,"game":true,"p":"--rm으로 실행해 삭제된 컨테이너에는 docker start 대신 docker run을 다시 쓴다.","a":true,"h":"--rm 설정으로 실행한 컨테이너는 exit하면 삭제됩니다. 다운로드한 이미지와 /work에 저장한 파일은 남으므로, 다음에는 이미 사라진 컨테이너를 start로 깨우는 대신 앞에서 쓴 생성·실행 명령을 다시 씁니다.","w":"맞습니다. 이미지는 남고 /work에 저장한 파일은 호스트에 남으므로 같은 docker run 명령으로 다시 실행합니다.","an":"1일차 슬라이드 · L4T 5 — 종료와 재실행 (p.125)","src":"• 컨테이너 내부에서 exit하면 ‑‑rm 설정으로 컨테이너가 삭제됩니다.\n• 다운로드한 이미지는 남고, /work에 저장한 파일은 호스트 ~/jetson‑lab에 남습니다.\n• 다음 실행은 앞의 docker run 명령을 다시 사용합니다. 삭제된 컨테이너에는 docker start를 쓰지 않습니다."},{"id":"t9-08","ty":"match","lv":2,"game":false,"p":"부록의 설치 경로 기호와 내용을 연결하세요.","pairs":[["A","Windows에서 SD 이미지 플래싱"],["B","Jetson 첫 부팅·초기 설정"],["C","Docker 설치"],["E","호스트에 ROS 2 직접 설치"],["F","호스트에 Ollama·Python 설치"]],"h":"부록은 공통 경로 A(Windows 플래싱) → B(Jetson 첫 부팅·초기 설정) 다음에 필요한 절만 골라 실행합니다. 컨테이너를 쓰려면 C(Docker 설치)·D, ROS 2를 호스트에 직접 설치하려면 E, LLM 도구를 직접 설치하려면 F입니다.","w":"A→B는 공통이고, 컨테이너는 C→D, ROS 2는 E, LLM은 F를 독립적으로 실행합니다.","an":"1일차 슬라이드 · 필요한 경로만 독립적으로 실행합니다 (p.110)","src":"• 공통: A. Windows 플래싱 → B. Jetson 첫 부팅·초기 설정\n• 컨테이너 사용: B 완료 → C. Docker 설치 → D. L4T 이미지 받기·실행\n• ROS 2 직접 설치: B 완료 → E. 호스트 ROS 2 (Docker 불필요)\n• LLM 직접 설치: B 완료 → F. 호스트 Ollama·Python (Docker·ROS 불필요)\n• Windows PC는 이미지 기록용입니다. 이후 호스트 명령은 Jetson Ubuntu의 Bash에서 실행합니다."},{"id":"t9-09","ty":"order","lv":2,"game":false,"p":"balenaEtcher로 JetPack 이미지를 기록하는 순서를 맞추세요.","steps":["SD 이미지를 받아 .img로 준비","balenaEtcher 설치·실행","Flash from file로 .img 선택","Select target으로 SD 카드 선택","Flash! 후 기록·검증 완료 대기"],"h":"balenaEtcher 기록은 NVIDIA 6.2 페이지에서 SD 이미지를 받아 .img로 준비하는 것부터 시작합니다. 그다음 Etcher를 설치·실행하고, Flash from file로 원본을, Select target으로 대상 SD 카드를 고른 뒤, Flash!로 기록과 검증을 기다립니다.","w":"대상 SD 카드의 기존 데이터는 지워지므로 용량·장치명을 대조해 선택하고, 기록과 검증이 모두 성공해야 합니다.","an":"1일차 슬라이드 · balenaEtcher로 JetPack 6.2 기록 (p.113)","src":"• 1. NVIDIA 6.2 페이지에서 SD 이미지를 받고 압축을 풀어 .img 파일을 준비합니다.\n• 2. balenaEtcher의 Windows 버전을 설치하고 실행합니다.\n• 3. Flash from file → 준비한 JetPack 6.2 .img를 선택합니다.\n• 4. Select target → SD 카드의 용량·장치명을 대조하여 선택합니다.\n• 5. Flash! → Windows 권한 요청을 승인하고 기록·검증 완료까지 기다립니다.\n• 대상 SD 카드의 기존 데이터는 지워집니다. 필요한 파일은 기록 전에 복사합니다.\n완료: Etcher의 기록과 검증이 모두 성공했습니다. 단순 파일 복사는 플래싱이 아닙니다."},{"id":"t9-10","ty":"multi","lv":2,"game":true,"p":"LLM 부록(F)의 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["LLM 도구는 별도 가상환경에 설치","ROS의 시스템 Python과 분리","CPU 응답과 GPU 추론 성공을 구분","Ollama 서버와 Python은 같은 것","서비스 없이도 API 호출이 된다"],"a":[0,1,2],"h":"부록 F는 LLM 도구를 별도 가상환경에 설치해 ROS의 시스템 Python과 섞이지 않게 합니다. 또 서버와 Python은 별개라 API 호출에는 Ollama 서비스가 실행 중이어야 하며, 답변이 나와도 CPU 응답과 GPU 추론을 구분해 기록합니다.","w":"LLM 도구는 가상환경에 설치해 ROS의 시스템 Python과 분리하고, CPU 응답 성공과 GPU 추론 성공을 구분해 기록합니다. API 호출에는 Ollama 서비스가 실행 중이어야 합니다.","an":"1일차 슬라이드 · LLM 2·3 — 추론 확인·가상환경 (p.132)","src":"• LLM 도구는 별도 가상환경에 설치합니다. ROS의 시스템 Python과 분리합니다.\n• 서버와 Python은 별개입니다. Ollama 서비스가 실행 중이어야 다음 장의 API 호출이 됩니다."}]}]};
const app=document.getElementById('app');
if(!BANK){app.innerHTML='<p>문제은행 데이터가 없습니다. <code>python develop/build.py</code>로 빌드한 파일을 여세요.</p>';return;}

/* ── 상수 · 인덱스 ─────────────────────── */
const TYPES={mc:['객관식','--ty-mc'],multi:['복수 선택','--ty-multi'],ox:['O / X','--ty-ox'],match:['짝 맞추기','--ty-match'],order:['순서 맞추기','--ty-order'],num:['계산','--ty-num']};
const GUIDE={mc:'알맞은 답을 하나 고르세요.',multi:'알맞은 것을 모두 고르세요.',ox:'맞으면 O, 틀리면 X를 고르세요.',
  match:'왼쪽 항목을 누른 뒤 짝이 되는 오른쪽 항목을 누르세요. 연결된 항목을 다시 누르면 풀립니다.',
  order:'첫 번째부터 순서대로 클릭하세요. 번호가 붙은 항목을 다시 누르면 그 번호부터 뒤 번호가 지워집니다.',num:'숫자만 입력하세요.'};
/* 게임 모드 목록 — 새 게임은 여기에 항목을 추가한다 (설정·출제 유형·규칙 문구를 모드별로) */
const GAME_MODES={
  timeattack:{title:'⚡ 타임어택',desc:'제한시간 안에 풀수록 점수가 커집니다. 시간이 다 되면 오답!',
    types:['mc','ox','multi'],times:[5,7,10,15],defaultTime:10},
};
// 게임 선택 화면의 버튼 3칸: 모드 id 또는 null(준비 중). 새 게임을 만들면 null 자리에 id를 넣는다.
const GAME_SLOTS=['timeattack',null,null];
const PAL=['--ty-mc','--ty-order','--ty-match','--ty-num','--ty-multi'];
const LETTER='ABCDEFGH';
const TABS=BANK.tabs, QMAP={}, QTAB={};
TABS.forEach((t,ti)=>{t.idx=ti;t.qs.forEach(q=>{QMAP[q.id]=q;QTAB[q.id]=t;});});
const ALLQ=TABS.flatMap(t=>t.qs);
const RM=matchMedia('(prefers-reduced-motion: reduce)');

/* ── 저장소 (실패해도 동작) ─────────────── */
const KEY='qb:'+BANK.id+':v1';
const blank=()=>({name:'',tabs:{},wrong:{},board:[],drafts:{}});  // drafts: 채점 전 탭별 풀던 답
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const gameUnlocked=()=>Object.keys(S.tabs).length>0;
const allGraded=()=>TABS.every(t=>S.tabs[t.id]);

/* 순위 저장소 — 공유 순위로 바꿀 때 이 객체만 교체 */
// 순위는 같은 조건(게임 모드 + 풀이 시간)끼리만 비교한다. key = 'timeattack:10'
const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

/* ── 유틸 ──────────────────────────────── */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function say(msg){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=msg,30);}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('📋 클립보드에 복사했습니다');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'📋 클립보드에 복사했습니다':'복사하지 못했습니다. 인쇄 기능을 이용하세요.');
}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

/* ── 오답노트 ──────────────────────────── */
function addWrong(id,ans){const w=S.wrong[id]||{n:0};w.n++;w.last=ans;w.at=Date.now();w.solved=false;S.wrong[id]=w;}
function markSolved(id){if(S.wrong[id]&&!S.wrong[id].solved){S.wrong[id].solved=true;S.wrong[id].at=Date.now();}}
const wrongList=solved=>Object.keys(S.wrong).filter(id=>QMAP[id]&&!!S.wrong[id].solved===solved)
  .sort((a,b)=>QTAB[a].idx-QTAB[b].idx||ALLQ.indexOf(QMAP[a])-ALLQ.indexOf(QMAP[b]));

/* ── 문항 풀이 상태(학습·재도전 공용) ───── */
let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

function cardHTML(q,n){
  const [label,color]=TYPES[q.ty];
  const g=cur.graded, a=cur.ans[q.id], fa=finalAns(q), ok=g&&isCorrect(q,fa);
  const lock=g?' disabled':'';
  let body='';
  if(q.ty==='mc'||q.ty==='multi'){
    const multi=q.ty==='multi', mine=multi?(a||[]):[a];
    body='<div class="opts">'+q.o.map((o,i)=>{
      const right=multi?q.a.includes(i):q.a===i, picked=mine.includes(i);
      const cls=g?(right?' ans':picked?' miss':''):'';
      return `<label class="opt${cls}"><span class="onum">${i+1}</span><input type="${multi?'checkbox':'radio'}" name="r-${q.id}" data-act="${multi?'tick':'pick'}" data-q="${q.id}" data-i="${i}"${picked?' checked':''}${lock}><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(q.ty==='ox'){
    body='<div class="ox">'+[true,false].map(v=>{
      const cls=g?(q.a===v?' ans':a===v?' miss':''):'';
      return `<button type="button" class="${cls.trim()}" data-act="ox" data-q="${q.id}" data-v="${v?1:0}" data-fk="${q.id}-ox${v?1:0}" aria-pressed="${a===v}" aria-label="${v?'맞다 O':'틀리다 X'}"${lock}>${v?'O':'X'}</button>`;
    }).join('')+'</div>';
  }else if(q.ty==='match'){
    const m=a||{}, sel=cur.msel[q.id], linkedBy={};
    Object.entries(m).forEach(([l,r])=>linkedBy[r]=+l);
    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${PAL[i%PAL.length]})" data-act="ml" data-q="${q.id}" data-i="${i}" data-fk="${q.id}-l${i}"${lock}><span class="tag">${LETTER[i]}</span>${esc(p[0])}</button>`;
    }).join('');
    const right=cur.shuf[q.id].map(j=>{
      const by=linkedBy[j], linked=by!=null, cls=(linked?' linked':'')+(g&&linked?(by===j?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${linked?PAL[by%PAL.length]:'--line'})" data-act="mr" data-q="${q.id}" data-j="${j}" data-fk="${q.id}-r${j}"${lock}><span class="tag">${linked?LETTER[by]:''}</span>${esc(q.pairs[j][1])}</button>`;
    }).join('');
    body=`<div class="match"><div class="mcol mleft">${left}</div><div class="mcol mright">${right}</div></div>`;
  }else if(q.ty==='order'){
    const seq=a||[], full=seq.length===q.steps.length;
    body='<div class="olist">'+(cur.shuf[q.id]||range(q.steps.length)).map(si=>{
      const pos=seq.indexOf(si), on=pos>=0;
      const cls=(on?' on':'')+(g?(pos===si?' ok':' no'):'');
      const fix=g&&pos!==si?`<span class="ofix">정답 ${si+1}</span>`:'';
      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }
  const numAns=q.ty==='mc'?`${q.a+1}번 · `:q.ty==='multi'?q.a.map(i=>i+1).join('·')+'번 · ':'';
  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>`}${body}${exp}</article>`;
}
const LV_NAME=['쉬움','보통','어려움'];
function lvHTML(lv){
  lv=lv||1;
  const dots=[1,2,3].map(k=>k<=lv?`<i class="d${k}">●</i>`:'<i class="off">○</i>').join('');
  return `<span class="lv lv${lv}" title="난이도 ${LV_NAME[lv-1]}"><span class="dots" aria-hidden="true">${dots}</span><em>${LV_NAME[lv-1]}</em></span>`;
}
// 자료 발췌: 이스케이프 후 마크다운 기호만 가볍게 서식으로 (**굵게**, `코드`, 머리 #)
const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
function hintHTML(q){
  if(!q.h)return '';
  const open=cur.hints.has(q.id), label=q.ty==='num'?'Hint · 계산식':'Hint';
  // 2단계: ① 자세한 힌트(h) ② 자료 보기 — 자료 원문 발췌(src) + 위치(an)
  const sopen=cur.srcs.has(q.id);
  const src=q.src?`<div class="srcwrap"><button type="button" class="srcbtn" data-act="src" data-q="${q.id}" data-fk="${q.id}-src" aria-expanded="${sopen}" aria-controls="src-${q.id}">`+
    `<span class="caret" aria-hidden="true">${sopen?'▾':'▸'}</span>📖 자료 보기</button>`+
    (sopen?`<blockquote class="src" id="src-${q.id}"><p>${srcText(q.src)}</p>${q.an?`<cite>${esc(q.an)}</cite>`:''}</blockquote>`:'')+`</div>`:'';
  return `<div class="hintwrap"><button type="button" class="hintbtn" data-act="hint" data-q="${q.id}" data-fk="${q.id}-hint" aria-expanded="${open}" aria-controls="hint-${q.id}">`+
    `<span class="caret" aria-hidden="true">${open?'▾':'▸'}</span>${label}</button>`+
    (open?`<div class="hint" id="hint-${q.id}">${q.h}${src}</div>`:'')+`</div>`;
}
function refreshCard(q){
  const el=document.getElementById('card-'+q.id);if(!el)return;
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  el.outerHTML=cardHTML(q,el.dataset.n);
  if(fk){const f=app.querySelector(`[data-fk="${fk}"]`);if(f&&!f.disabled)f.focus();}
  updateProgress();
}
const pad2=n=>String(n).padStart(2,'0');
const fmtCnt=(n,t)=>`(${pad2(n)}/${pad2(t)})`;
// 탭별 푼 문항 수: 지금 보는 탭 → 화면 상태, 그 외 → 풀던 답(drafts) → 채점 기록
function tabAnswered(t){
  const src=cur&&cur.mode==='study'&&cur.tab===t?cur.ans:(S.drafts[t.id]||(S.tabs[t.id]&&S.tabs[t.id].answers)||{});
  return t.qs.filter(q=>isAnswered(q,src[q.id])).length;
}
function updateProgress(){
  const p=document.getElementById('pbar');if(!p||!cur)return;
  const n=cur.list.filter(answered).length, cnt=fmtCnt(n,cur.list.length);
  p.style.width=pct(n,cur.list.length)+'%';
  document.getElementById('ptxt').textContent=`${n} / ${cur.list.length} 응답`;
  const g=document.getElementById('gradeCnt');if(g)g.textContent=cnt;
  if(cur.mode==='study'){
    const c=document.getElementById('qc-'+cur.tab.id);if(c)c.textContent=cnt;
    if(!cur.graded){  // 풀던 답 저장 → 탭을 옮겨도 유지
      if(n||Object.keys(cur.ans).some(k=>{const v=cur.ans[k];return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:v!=null&&v!=='';}))
        S.drafts[cur.tab.id]=JSON.parse(JSON.stringify(cur.ans));
      else delete S.drafts[cur.tab.id];
      save();
    }
  }
}

/* 학습 화면 상호작용 */
function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;
  else if(el.dataset.act==='tick'){
    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);
  }
  cur.armed=false;updateProgress();
}
function onSheetInput(el){
  if(el.dataset.act==='num'&&!cur.graded){cur.ans[el.dataset.q]=el.value;cur.armed=false;updateProgress();}
}

/* ── 화면: 학습 ────────────────────────── */
function viewStudy(tid,fresh){
  const tab=TABS.find(t=>t.id===tid)||TABS[0];
  cur=newSheet('study',tab.qs,tab);
  const rec=S.tabs[tab.id], draft=S.drafts[tab.id];
  if(fresh){delete S.drafts[tab.id];save();}
  else if(draft){Object.assign(cur.ans,JSON.parse(JSON.stringify(draft)));}  // 풀던 중이면 이어서
  else if(rec&&rec.answers){
    Object.assign(cur.ans,JSON.parse(JSON.stringify(rec.answers)));
    (rec.touched||[]).forEach(id=>cur.touched.add(id));
    cur.graded=true;
  }
  renderSheet();
}
function renderSheet(){
  const study=cur.mode==='study', tab=cur.tab;
  const tabbar=study?`<nav class="tabbar noprint" role="tablist" aria-label="탭">${TABS.map((t,i)=>{const r=S.tabs[t.id];
      return `<a class="tabchip" role="tab" href="#study/${t.id}" aria-selected="${t===tab}"><b>${i+1}</b><span class="tl">${esc(t.title)}</span><span class="qc" id="qc-${t.id}">${fmtCnt(tabAnswered(t),t.qs.length)}</span>${r?`<span class="sc" title="채점 점수">✓${r.score}</span>`:''}</a>`;}).join('')}
      ${allGraded()?'<a class="tabchip sum" href="#summary">★ 종합</a>':''}</nav>`:'';
  const head=study?`<div class="tabhead"><h2>${tab.idx+1}. ${esc(tab.title)}</h2>${tab.ref?`<span class="part">${esc(tab.ref)}</span>`:''}</div>`
                  :`<div class="tabhead"><h2>🔁 오답 다시 풀기</h2><span class="part">${cur.list.length}문항</span></div>`;
  const next=study?(tab.idx+1<TABS.length?`<a class="btn" href="#study/${TABS[tab.idx+1].id}">다음 탭 →</a>`:(allGraded()?'<a class="btn" href="#summary">★ 종합 결과</a>':'')):'<a class="btn" href="#notes">오답노트로</a>';
  app.innerHTML=`<div class="sheet">
  <nav class="crumbs noprint"><a href="#home">← 홈</a><span>/</span><span>${study?'학습 모드':'오답노트'}</span></nav>
  ${tabbar}${head}
  <div class="progress"><div class="bar"><div id="pbar"></div></div><span id="ptxt"></span></div>

function gradeSheet(){
  const miss=cur.list.map((q,i)=>answered(q)?0:i+1).filter(Boolean);
  if(miss.length&&!cur.armed){
    cur.armed=true;
    document.getElementById('warn').textContent=`미응답 ${miss.length}문항 (Q${miss.join(', Q')}). 한 번 더 누르면 미응답은 오답으로 채점합니다.`;
    return;
  }
  const firstUnlock=!gameUnlocked();
  cur.graded=true;
  const snap={};let score=0;
  cur.list.forEach(q=>{
    const a=finalAns(q);
    if(a!=null)snap[q.id]=a;
    if(isCorrect(q,a)){score++;markSolved(q.id);}
    else addWrong(q.id,answerText(q,a));
  });
  if(cur.mode==='study'){
    S.tabs[cur.tab.id]={score,total:cur.list.length,answers:snap,touched:[...cur.touched],at:Date.now()};
    delete S.drafts[cur.tab.id];
  }
  save();
  renderSheet();
  window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
  say(`채점 결과 ${score}점, ${cur.list.length}문항 중`);
  if(cur.mode==='study'&&firstUnlock)setTimeout(()=>toast('⚡ 게임 모드와 해설지가 열렸습니다!'),300);
  else if(cur.mode==='study'&&allGraded())setTimeout(()=>toast('★ 모든 탭 완료! 종합 결과를 확인하세요.'),300);
}
