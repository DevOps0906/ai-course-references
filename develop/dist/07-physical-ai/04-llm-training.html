<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physical AI 2일차 · LLM 학습 원리 (RNN·LSTM·Seq2Seq·Transformer) · 문제은행</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Quiz Bank 디자인 토큰 v2
   타이포 기준: AI_Voice day07 워크시트 (본문 15px / 행간 1.55, 요소 13~14px)
   다크 팔레트: day07 워크시트(#0b1220 남색 + 앰버·틸 포인트) / 라이트: 같은 구조의 중립 팔레트
   build.py가 이 파일을 엔진 <style> 맨 앞에 그대로 넣는다. */
:root{
  /* 타이포 */
  --font:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","D2Coding",Consolas,"SF Mono",monospace;
  --fs-base:15px;--lh:1.55;
  --fs-h1:24px;--fs-h2:17px;--fs-q:15px;--fs-opt:14px;--fs-btn:13px;--fs-btn-pri:14px;
  --fs-sm:13px;--fs-xs:12px;--fs-2xs:11px;--fs-ox:22px;
  /* 형태 */
  --r-sm:6px;--r:8px;--r-md:10px;--r-lg:12px;--maxw:880px;

  /* 라이트 */
  --bg:#F5F6F8;--panel:#FFFFFF;--raised:#FFFFFF;--field:#FFFFFF;
  --ink:#141A26;--muted:#5A6375;--faint:#8A93A4;--line:#E2E6EC;--line-2:#CDD3DC;--soft:#F0F2F5;
  --title:#141A26;--link:#0E8C80;--accent:#B7791F;
  --ok:#15803D;--bad:#D23B32;--combo:#7C3AED;--gold:#B7891F;
  --btn-bg:#FFFFFF;--btn-line:#D5DAE2;--pri-bg:#141A26;--pri-line:#141A26;--pri-ink:#FFFFFF;
  --ty-mc:#0E8C80;--ty-multi:#7C3AED;--ty-ox:#64748B;--ty-match:#C2417A;--ty-order:#B7791F;--ty-num:#2563EB;
  --timer-hi:#16A34A;--timer-mid:#D97706;--timer-lo:#DC2626;
  --lv1:#16A34A;--lv2:#EAB308;--lv3:#DC2626;  /* 난이도 1·2·3 */
  --shadow:0 1px 2px rgb(16 24 40 / .04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220;--panel:#111A2E;--raised:#0E1628;--field:#0A0F1C;
  --ink:#DBE4F0;--muted:#8A9BB8;--faint:#5E6F8E;--line:#1F2B45;--line-2:#2A3A5C;--soft:#16203A;
  --title:#F5B942;--link:#2DD4BF;--accent:#F5B942;
  --ok:#4ADE80;--bad:#F87171;--combo:#C084FC;--gold:#F5B942;
  --btn-bg:#172239;--btn-line:#2A3A5C;--pri-bg:#123D33;--pri-line:#2DD4BF;--pri-ink:#2DD4BF;
  --ty-mc:#2DD4BF;--ty-multi:#C084FC;--ty-ox:#8A9BB8;--ty-match:#F472B6;--ty-order:#F5B942;--ty-num:#60A5FA;
  --timer-hi:#4ADE80;--timer-mid:#F5B942;--timer-lo:#F87171;
  --lv1:#4ADE80;--lv2:#FACC15;--lv3:#F87171;
  --shadow:none;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1220;--panel:#111A2E;--raised:#0E1628;--field:#0A0F1C;
  --ink:#DBE4F0;--muted:#8A9BB8;--faint:#5E6F8E;--line:#1F2B45;--line-2:#2A3A5C;--soft:#16203A;
  --title:#F5B942;--link:#2DD4BF;--accent:#F5B942;
  --ok:#4ADE80;--bad:#F87171;--combo:#C084FC;--gold:#F5B942;
  --btn-bg:#172239;--btn-line:#2A3A5C;--pri-bg:#123D33;--pri-line:#2DD4BF;--pri-ink:#2DD4BF;
  --ty-mc:#2DD4BF;--ty-multi:#C084FC;--ty-ox:#8A9BB8;--ty-match:#F472B6;--ty-order:#F5B942;--ty-num:#60A5FA;
  --timer-hi:#4ADE80;--timer-mid:#F5B942;--timer-lo:#F87171;
  --lv1:#4ADE80;--lv2:#FACC15;--lv3:#F87171;
  --shadow:none;
  color-scheme:dark;}
@media (max-width:560px){:root{--fs-base:14.5px;--fs-h1:20px;--fs-h2:16px;--fs-q:14.5px;--fs-ox:20px}}

/* ── 기본 ───────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:110px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-base);line-height:var(--lh);
  -webkit-font-smoothing:antialiased;letter-spacing:-.003em;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
b,strong{font-weight:650}
code{font-family:var(--mono);font-size:.88em;color:var(--link);background:var(--soft);padding:1px 5px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px 56px}
.muted{color:var(--muted)}
/* 상단 바 */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:calc(52px + env(safe-area-inset-top,0px));margin:0 -20px 22px;padding:env(safe-area-inset-top,0px) 20px 0;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.brand{font-size:var(--fs-xs);color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;letter-spacing:.01em}
.brand b{color:var(--ink);font-weight:600}
.iconbtn{font:inherit;font-size:14px;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);width:32px;height:32px;border-radius:var(--r);cursor:pointer;flex:0 0 auto;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--muted)}
/* 제목 */
h1{font-size:var(--fs-h1);line-height:1.3;margin:0 0 6px;letter-spacing:-.02em;font-weight:700;color:var(--title)}
h2{font-size:var(--fs-h2);line-height:1.4;margin:0;font-weight:650;letter-spacing:-.01em}
.ph{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 10px;letter-spacing:0}
.sh{font-size:var(--fs-sm);color:var(--muted);font-weight:600;margin:16px 0 6px}
.sub{color:var(--muted);margin:0 0 4px}
.meta{font-size:var(--fs-xs);color:var(--faint);margin:0 0 18px;font-family:var(--mono);letter-spacing:-.01em}
.crumbs{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:var(--fs-sm);color:var(--faint)}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink)}
.part{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--link);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:1px 7px;white-space:nowrap;max-width:100%;font-weight:500;letter-spacing:0}
.tabhead .part,.ngroup .part{white-space:normal;overflow-wrap:anywhere}  /* 긴 자료 위치(예: voice-ai 교시 라벨)는 줄바꿈 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.center{text-align:center}
.note-sm{font-size:var(--fs-sm);color:var(--muted)}
.lbl{display:block;font-size:var(--fs-xs);color:var(--muted);margin-bottom:2px}
/* 버튼 */
.btn{font:inherit;font-size:var(--fs-btn);display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);
  padding:7px 12px;border-radius:var(--r);cursor:pointer;text-decoration:none;min-height:34px;line-height:1.3;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pri-bg);color:var(--pri-ink);border-color:var(--pri-line);font-weight:650;font-size:var(--fs-btn-pri);padding:8px 18px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.locked{opacity:.5}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--btn-line))}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn .cnt{font-family:var(--mono);font-size:var(--fs-2xs);background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;min-width:18px;line-height:16px;text-align:center}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
button:focus-visible,a:focus-visible,input:focus-visible,.opt:focus-within{outline:2px solid var(--link);outline-offset:2px}
/* 입력 */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;max-width:300px}
.field label{font-size:var(--fs-xs);color:var(--muted)}
.field input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--field);color:var(--ink)}
.field input::placeholder{color:var(--faint)}
/* 진행 바 */
.bar{flex:1;height:4px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--link);transition:width .25s}
.progress{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:8px 0;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.progress span,.homeprog span{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.homeprog{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
/* 홈 탭 카드 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:6px}
.tcard{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;text-decoration:none;color:var(--ink);transition:border-color .15s;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--line-2)}
.tcard .tn{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint)}
.tcard .tt{font-weight:600;font-size:14px;line-height:1.45}
.tcard .ts{margin-top:auto;padding-top:8px;font-size:var(--fs-xs);color:var(--faint);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono)}
.tcard.done .ts b{color:var(--ok);font-weight:600}
.tcard.perfect{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.lockmsg{font-size:var(--fs-xs);color:var(--faint);margin:-6px 0 16px}
/* 탭 바 */
/* 학습 탭 선택: 웹(≥1024) 자유 배치 · 태블릿(560~1023) 3개 · 모바일(<560) 2개 */
.tabbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
@media (max-width:1023px){.tabbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}}
.tabchip{min-width:0;display:flex;align-items:center;gap:6px;font-size:var(--fs-btn);padding:6px 10px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);text-decoration:none;color:var(--ink);line-height:1.35;word-break:keep-all}
.tabchip .tl{min-width:0}
.tabchip .qc{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--muted);white-space:nowrap;margin-left:auto}
.tabchip[aria-selected="true"] .qc{color:var(--link)}
.tabchip .sc{white-space:nowrap}
.btn .qc{font-family:var(--mono);font-weight:500;opacity:.85}
.tabchip b{font-family:var(--mono);font-weight:600;color:var(--faint)}
.tabchip:hover{border-color:var(--muted)}
.tabchip[aria-selected="true"]{border-color:var(--link);color:var(--link);background:color-mix(in srgb,var(--link) 9%,var(--btn-bg))}
.tabchip[aria-selected="true"] b{color:var(--link)}
.tabchip .sc{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--ok)}
.tabchip.sum{border-color:color-mix(in srgb,var(--gold) 60%,var(--btn-line));color:var(--gold)}
.tabhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 2px}
.tabhead h2{color:var(--title)}
/* 문항 카드 */
.q{background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:var(--r-md);padding:12px 14px;margin:0 0 10px;box-shadow:var(--shadow)}
.q.correct{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));border-left-color:var(--ok)}
.q.wrong{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));border-left-color:var(--bad)}
.qhead{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.qn{font-family:var(--mono);font-size:var(--fs-xs);color:var(--faint);font-weight:500}
.tbadge{font-size:var(--fs-2xs);font-weight:600;padding:0 7px;line-height:18px;border-radius:var(--r-sm);color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent);background:color-mix(in srgb,var(--tc) 8%,transparent);white-space:nowrap}
/* 난이도: 점 1 녹색 · 점 2 노랑 · 점 3 빨강 (쉬움 ●○○ / 보통 ●●○ / 어려움 ●●●) + 글자 */
.lv{display:inline-flex;align-items:center;gap:4px;line-height:1}
.lv .dots{font-size:9px;letter-spacing:1px}
.lv i{font-style:normal}
.lv .d1{color:var(--lv1)} .lv .d2{color:var(--lv2)} .lv .d3{color:var(--lv3)} .lv .off{color:var(--line-2)}
.lv em{font-style:normal;font-size:var(--fs-2xs);font-weight:600}
.lv1 em{color:var(--lv1)} .lv2 em{color:color-mix(in srgb,var(--lv2) 80%,var(--ink))} .lv3 em{color:var(--lv3)}
.verdict{margin-left:auto;font-weight:650;font-size:var(--fs-xs)}
.correct .verdict{color:var(--ok)} .wrong .verdict{color:var(--bad)}
.qsrc{margin-left:auto;font-size:var(--fs-2xs);color:var(--faint)}
.qt{font-size:var(--fs-q);font-weight:500;margin:4px 0 8px}
.guide{font-size:var(--fs-xs);color:var(--faint);margin:-4px 0 8px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--panel);font-size:var(--fs-opt);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--line-2)}
.opt input{margin:4px 0 0;accent-color:var(--link);flex:0 0 auto;width:14px;height:14px}
.opt:has(input:checked){border-color:var(--link);background:color-mix(in srgb,var(--link) 7%,var(--panel))}
.opt.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.opt.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--panel))}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:360px}
.ox button{font:inherit;font-size:var(--fs-ox);font-weight:700;padding:8px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);cursor:pointer;line-height:1.3}
.ox button:hover{border-color:var(--muted)}
.ox button[aria-pressed="true"]{border-color:var(--link);color:var(--link);background:color-mix(in srgb,var(--link) 10%,var(--btn-bg))}
.ox button.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--btn-bg));color:var(--ok)}
.ox button.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--btn-bg));color:var(--bad)}
/* 짝 맞추기 */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px 14px}
.mcol{display:flex;flex-direction:column;gap:6px}
.mitem{font:inherit;font-size:var(--fs-opt);text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);padding:7px 10px;cursor:pointer;min-height:38px;display:flex;align-items:center;gap:8px;line-height:1.45}
.mitem:hover{border-color:var(--line-2)}
.mitem .tag{flex:0 0 auto;width:20px;height:20px;border-radius:var(--r-sm);border:1px dashed var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);font-weight:600}
.mitem.linked{border-color:color-mix(in srgb,var(--pc) 70%,var(--line))}
.mitem.linked .tag{border:0;background:var(--pc);color:var(--bg)}
.mitem.sel{border-color:var(--link);box-shadow:0 0 0 3px color-mix(in srgb,var(--link) 18%,transparent)}
.mitem.okm{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.mitem.nom{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.mleft .mitem{font-weight:600}
/* 순서 */
.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.oitem{font:inherit;font-size:var(--fs-opt);text-align:left;width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);cursor:pointer;transition:border-color .12s,background .12s}
.oitem:hover{border-color:var(--line-2)}
.oitem .num{width:22px;height:22px;border-radius:50%;border:1px dashed var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);font-weight:600;color:var(--muted);flex:0 0 auto}
.oitem.on{border-color:var(--link);background:color-mix(in srgb,var(--link) 7%,var(--panel))}
.oitem.on .num{border:0;background:var(--link);color:var(--bg)}
.oitem .txt{flex:1;line-height:1.45}
.oitem .ofix{flex:0 0 auto;font-size:var(--fs-2xs);color:var(--ok);font-weight:600}
.oitem.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.oitem.ok .num{background:var(--ok)}
.oitem.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.oitem.no.on .num{background:var(--bad)}
.numrow{display:flex;align-items:center;gap:8px;font-size:var(--fs-opt)}
.numrow input{font-family:var(--mono);font-size:14px;width:120px;padding:6px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--field);color:var(--ink);text-align:right}
.numrow input.ans{border-color:var(--ok)} .numrow input.miss{border-color:var(--bad)}
.locked .mitem,.locked .ox button,.locked .opt{pointer-events:none}
.locked .oitem{pointer-events:none}
.opt .onum{flex:0 0 auto;min-width:18px;height:18px;padding:0 4px;border-radius:var(--r-sm);border:1px solid var(--line-2);display:inline-grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);color:var(--muted);margin-top:1px}
.opt:has(input:checked) .onum{border-color:var(--link);color:var(--link)}
.opt.ans .onum{border-color:var(--ok);color:var(--ok)} .opt.miss .onum{border-color:var(--bad);color:var(--bad)}
/* 힌트 토글 (빨간색 = Hint) */
.hintwrap{margin:-2px 0 8px}
.hintbtn{font:inherit;font-size:var(--fs-xs);font-weight:650;display:inline-flex;align-items:center;gap:4px;color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:var(--r-sm);padding:2px 9px;cursor:pointer;line-height:1.5}
.hintbtn:hover{background:color-mix(in srgb,var(--bad) 13%,transparent)}
.hintbtn .caret{font-size:.85em}
.srcwrap{margin-top:8px}
.srcbtn{font:inherit;font-size:var(--fs-xs);font-weight:600;display:inline-flex;align-items:center;gap:4px;color:var(--link);background:transparent;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:1px 8px;cursor:pointer;line-height:1.5}
.srcbtn:hover{border-color:var(--link)}
.src{margin:6px 0 0;padding:6px 10px;border-left:3px solid var(--link);background:var(--soft);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:var(--fs-xs);color:var(--muted)}
.src p{margin:0;white-space:pre-wrap;word-break:break-word}
.src cite{display:block;margin-top:4px;font-style:normal;font-size:var(--fs-2xs);color:var(--faint)}
.hint{margin-top:6px;padding:6px 10px;border-left:3px solid var(--bad);background:color-mix(in srgb,var(--bad) 6%,transparent);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:var(--fs-sm);color:var(--ink)}
/* 해설 */
.exp{margin-top:10px;padding:2px 0 2px 10px;border-left:3px solid var(--line-2);font-size:var(--fs-sm);color:var(--muted)}
.correct .exp{border-left-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.wrong .exp{border-left-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.exp p{margin:0 0 3px}
.exp b{color:var(--ink);font-weight:650;margin-right:4px}
.an{font-family:var(--mono);color:var(--link);font-size:var(--fs-xs);margin:4px 0 0}
.mine{color:var(--bad)}
.onlywrong .q.correct{display:none}
.warn{color:var(--bad);font-size:var(--fs-sm);min-height:1.3em;margin:4px 0 0}
/* 결과 */
.score{font-family:var(--mono);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--title);letter-spacing:-.02em}
.score small{font-family:var(--font);font-size:14px;color:var(--muted);font-weight:400;letter-spacing:0}
.score.xl{font-size:44px}
.msg{margin:6px 0 10px;color:var(--muted);font-size:var(--fs-sm)}
.bd{display:grid;gap:7px;margin:6px 0}
.bd div{display:grid;grid-template-columns:minmax(90px,190px) 1fr 44px;gap:10px;align-items:center;font-size:var(--fs-sm)}
.bd .b{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bd .b i{display:block;height:100%;background:var(--tc,var(--link));border-radius:99px}
.bd span:last-child{text-align:right;font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted)}
.rcode{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.06em;color:var(--accent);background:var(--soft);padding:2px 8px;border-radius:var(--r-sm)}
/* 오답노트 · 해설지 */
.ngroup{margin:18px 0 8px;font-size:14px;font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ngroup .ref{font-family:var(--mono);font-size:var(--fs-2xs);font-weight:400;color:var(--faint)}
.note{background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px}
.note.solved{border-left-color:var(--ok)}
.note .qt{margin:0 0 8px}
.note dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:var(--fs-sm)}
.note dt{color:var(--faint)}
.note dd{margin:0}
.note .foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:var(--fs-xs);color:var(--faint);font-family:var(--mono)}
.note .foot span:first-child{color:var(--link)}
details.more{margin-top:14px;font-size:var(--fs-sm)}
details.more summary{cursor:pointer;color:var(--muted);padding:4px 0}
.keyitem{padding:10px 0;border-bottom:1px solid var(--line)}
.keyitem .kq{font-weight:500;font-size:14px}
.keyitem .ka{margin:4px 0 2px;color:var(--ok);font-weight:600;font-size:var(--fs-sm)}
.keyitem .kw{font-size:var(--fs-sm);color:var(--muted);margin:0}
.keylock{padding:12px;border:1px dashed var(--line-2);border-radius:var(--r-md);color:var(--faint);text-align:center;margin:8px 0;font-size:var(--fs-sm)}
.printhead{display:none}
/* 게임 */
.game{max-width:620px;margin:0 auto}
.gpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;gap:4px;min-height:120px;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);color:var(--ink);text-decoration:none;transition:border-color .15s,background .15s}
a.gcard:hover{border-color:var(--link);background:color-mix(in srgb,var(--link) 6%,var(--panel))}
.gcard .gn{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint);letter-spacing:.05em}
.gcard b{font-size:15px}
.gcard .gd{font-size:var(--fs-xs);color:var(--muted);line-height:1.5}
.gcard.soon{border-style:dashed;opacity:.6;cursor:not-allowed}
@media (max-width:560px){.gpick{gap:6px}.gcard{min-height:84px;padding:10px 8px;align-items:center;text-align:center;justify-content:center}.gcard b{font-size:13px;word-break:keep-all}.gcard .gd{display:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.chip{font:inherit;font-size:var(--fs-btn);padding:6px 12px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);cursor:pointer;min-height:32px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--link);color:var(--link);background:color-mix(in srgb,var(--link) 9%,var(--btn-bg));font-weight:600}
.chip:disabled{opacity:.4;cursor:not-allowed}
.rules{font-size:var(--fs-xs);color:var(--muted);border-left:3px solid var(--line-2);padding:2px 0 2px 10px;margin:4px 0 16px}
.rules p{margin:0 0 2px}
.play{display:flex;flex-direction:column;min-height:calc(100dvh - 130px)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--fs-sm);color:var(--muted);margin-bottom:8px}
.hud .pts{font-size:18px;font-weight:600;color:var(--title)}
.combo{font-family:var(--font);font-size:var(--fs-xs);padding:2px 9px;border-radius:var(--r-sm);border:1px solid var(--line-2);color:var(--muted)}
.combo.hot{border-color:var(--combo);color:var(--combo);background:color-mix(in srgb,var(--combo) 12%,transparent)}
.timer{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.timer>div{height:100%;width:100%;background:var(--timer-hi);border-radius:99px}
.timer.mid>div{background:var(--timer-mid)}
.timer.lo>div{background:var(--timer-lo)}
.timer.out{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tleft{font-family:var(--mono);font-size:var(--fs-xs);color:var(--faint);text-align:right;font-variant-numeric:tabular-nums;margin:4px 0 12px;min-height:1.2em}
.gtype{font-size:var(--fs-2xs);color:var(--faint);margin-bottom:4px;letter-spacing:.02em}
.gq{font-size:18px;font-weight:600;line-height:1.5;margin:0 0 16px;letter-spacing:-.01em}
.gbottom{margin-top:4px}
.gopts{display:grid;gap:8px}
.gopt{font:inherit;font-size:var(--fs-opt);text-align:left;display:flex;gap:12px;align-items:center;padding:10px 14px;min-height:46px;border:1px solid var(--btn-line);border-radius:var(--r-md);background:var(--panel);color:var(--ink);cursor:pointer;transition:background .12s,border-color .12s;line-height:1.45}
.gopt:hover{border-color:var(--muted)}
.gopt kbd{flex:0 0 auto;width:22px;height:22px;border-radius:var(--r-sm);border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint)}
.gopt[aria-pressed="true"]{border-color:var(--link);background:color-mix(in srgb,var(--link) 9%,var(--panel))}
.gopt.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.gopt.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.gox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gox .gopt{justify-content:center;font-size:28px;font-weight:700;min-height:76px}
.gfloat{text-align:center;font-weight:650;font-size:16px;min-height:1.6em;margin-top:10px;font-family:var(--mono)}
.gfloat.ok{color:var(--ok)} .gfloat.no{color:var(--bad)}
.gfloat.pop{animation:pop .45s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.gsub{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.board{width:100%;border-collapse:collapse;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.board th,.board td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.board th{font-size:var(--fs-xs);color:var(--faint);font-weight:500}
.board .r{text-align:right;font-family:var(--mono)}
.board tr.me td{background:color-mix(in srgb,var(--combo) 12%,transparent);font-weight:600}
.bignum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 2px}
.bignum div{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:left}
.bignum b{display:block;font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.bignum span{font-size:var(--fs-2xs);color:var(--faint)}
/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--panel);color:var(--ink);border:1px solid var(--line-2);
  padding:8px 14px;border-radius:var(--r);font-size:var(--fs-sm);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .18)}
.toast.show{opacity:1;transform:translateX(-50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* 문제풀이 페이지(학습·오답 재도전): 탭 제목(h2)을 뺀 모든 글자 10px — 사용자 지정 */
/* 문제풀이·오답노트·해설지 공통: 제목(h1·h2·탭 묶음 제목)을 뺀 글자 10px, 문제 11px, 자간 +0.03em, 행간 1.7 */
.sheet,.sheet :where(*:not(h1,h2,.ngroup,.ngroup *)){font-size:10px!important;letter-spacing:.03em!important}  /* :where = 명시도 0 → 아래 11px 규칙이 이김 */
.sheet :is(.qt,.opt,.exp,.exp p,.guide,.mitem,.oitem .txt,.hint,.warn,.msg,.sub,.note dt,.note dd,.note .foot,.kq,.ka,.kw,.keylock){line-height:1.7!important}
.sheet :is(.qt,.kq),.sheet :is(.qt,.kq) *{font-size:11px!important}  /* 문제 문장만 11px */
/* 한글이 섞인 숫자 요소는 mono 대신 본문 글꼴 + 고정폭 숫자 (mono 한글 자간이 벌어짐) */
.meta,.tcard .tn,.tcard .ts,.progress span,.homeprog span,.note .foot,.an,.hud,.tleft,.gfloat,.bignum b{font-family:var(--font);font-variant-numeric:tabular-nums;letter-spacing:0}
/* ── 반응형 ─────────────────────────────────────── */
@media (max-width:560px){
  .wrap{padding:0 16px 48px}
  .topbar{margin:0 -16px 18px;padding-left:16px;padding-right:16px}
  /* 홈 탭 카드: 모바일에서도 한 줄 3개 (사용자 지정) */
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .tcard{padding:8px 9px;gap:2px}
  .tcard .tn{font-size:10px}
  .tcard .tt{font-size:12px;line-height:1.35;word-break:keep-all}
  .tcard .ts{flex-direction:column;align-items:flex-start;gap:0;padding-top:6px;font-size:10px}
  .tabbar{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .tabchip{padding:6px 8px;gap:4px}
  .q{padding:12px}
  .match{grid-template-columns:1fr}
  .mright{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line-2)}
  .btn,.chip{min-height:40px}
  .actions .btn{flex:1 1 calc(50% - 8px)}
  .actions .btn.primary{flex-basis:100%}
  .ox{max-width:none}
  .ox button{min-height:48px}
  .oitem{min-height:40px}
  .bd div{grid-template-columns:96px 1fr 40px}
  .bignum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field{max-width:none}
  /* 게임: 보기를 엄지 영역(화면 아래)으로 */
  .play .gtop{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));background:var(--bg);padding:6px 0 0;z-index:4}
  .play .gbottom{margin-top:auto;padding-top:12px}
  .gq{font-size:17px}
  .gopt{min-height:50px}
  .board th:nth-child(6),.board td:nth-child(6){display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  :root{--bg:#fff;--panel:#fff;--raised:#fff;--ink:#000;--muted:#333;--faint:#555;--line:#bbb;--line-2:#999;--soft:#f1f1f1;--title:#000;--link:#055}
  body{background:#fff;color:#000;font-size:12.5px}
  .noprint,.topbar,.actions,.tabbar,.progress,.toast{display:none!important}
  .printhead{display:block;margin-bottom:12px;font-size:12px}
  .q,.note,.keyitem{break-inside:avoid;box-shadow:none}
}

const BANK={"id":"pai-llm-train","code":"PL1","title":"Physical AI 2일차 · LLM 학습 원리 (RNN·LSTM·Seq2Seq·Transformer)","subtitle":"훈련 원리(loss·gradient) · RNN·LSTM·Attention · Ollama 추론","source":"07-NEPES_physicalAI_자율주행자동차/____/2__.pdf (2일차 v1 슬라이드 LLM 파트) + 07-NEPES_physicalAI_자율주행자동차/04.LLM/00~06 ipynb","salt":"pai-llm-train","course":"07 · Physical AI","version":1,"updated":"2026-10-15","tabs":[{"id":"t1","title":"AI·머신러닝과 훈련 구조","ref":"2일차 p.10–13 · 00_training_core","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"언어 모델을 가장 잘 설명한 것은?","o":["앞 token으로 다음 token을 예측","사람이 if문으로 쓴 규칙","픽셀만 분류하는 모델","데이터 없이 동작하는 검색기"],"a":0,"h":"자료는 AI·머신러닝·딥러닝·언어 모델을 구분합니다. 언어 모델은 이미 나온 앞부분의 token들을 바탕으로 그다음에 올 token을 예측하는 모델이며, 모델 크기만으로 업무에 맞는지 판단할 수는 없다고 덧붙입니다.","w":"언어 모델은 앞의 token을 바탕으로 다음 token을 예측합니다. 규칙 작성은 머신러닝이 아닌 방식이고, 크기만으로 업무 적합성을 알 수는 없습니다.","an":"2일차 슬라이드 · AI·머신러닝·딥러닝 구분 (p.10)","src":"● AI는 지능적인 작업을 수행하는 방법을 넓게 부르는 말이며, 모든 AI가 \n신경망을 쓰는 것은 아닙니다.\n● 머신러닝은 예제에서 예측 규칙을 찾고, 딥러닝은 여러 층의 신경망으로 그 \n규칙을 표현합니다.\n● 언어 모델은 앞의 token을 바탕으로 다음 token을 예측하는 모델입니다. \n크기만으로 업무 적합성을 알 수는 없습니다.\n● 함께 해석하기: 규칙은 사람이 조건을 직접 작성하고 머신러닝은 데이터와 \n학습 목표로 조정한 모델을 사용합니다."},{"id":"t1-02","ty":"mc","lv":1,"game":true,"p":"훈련 중 optimizer가 실제로 바꾸는 값은?","o":["입력 데이터","정답 라벨","파라미터(가중치)","검증 데이터"],"a":2,"h":"훈련에서 입력은 모델이 보는 자료, 정답은 맞혀야 할 목표로 고정되어 있습니다. loss로 예측과 정답의 차이를 계산하면 optimizer가 gradient를 이용해 모델 안에서 학습 가능한 숫자, 즉 가중치를 바꿉니다.","w":"파라미터는 훈련 중 조정하는 숫자입니다. 입력·정답·검증 데이터는 바꾸지 않고, optimizer가 gradient로 가중치만 바꿉니다.","an":"2일차 슬라이드 · 훈련은 어떤 값을 바꾸는가 (p.11)","src":"● 입력은 모델이 보는 자료, 정답은 \n맞혀야 할 목표, 예측은 현재 \n파라미터로 계산한 결과입니다.\n● 파라미터는 훈련 중 조정하는 \n숫자입니다. loss는 예측과 정답의 \n차이를 계산한 한 개의 값입니다.\n● optimizer가 gradient를 이용해 \n파라미터를 바꾸고, 새로운 \n예제에서도 잘 맞는지 검증합니다.\n● 함께 해석하기: 모델의 학습 가능한 \n가중치입니다."},{"id":"t1-03","ty":"mc","lv":2,"game":true,"p":"입력이 1, 2, 3, 4, 5인 지연 복사 과제의 목표 출력은?","o":["1, 2, 3, 4, 5","BOS, 1, 2, 3, 4","2, 3, 4, 5, EOS","5, 4, 3, 2, 1"],"a":1,"h":"각 위치에서 '한 시점 전' 입력을 내야 합니다. 첫 위치에는 이전 입력이 없습니다.","w":"현재 위치에서 한 시점 전 입력을 출력하므로 목표는 BOS, 1, 2, 3, 4입니다. 0번 위치에는 이전 입력이 없어 BOS를 둡니다.","an":"2일차 슬라이드 · 숫자 다섯 개로 기억 과제 (p.12)","src":"● 입력이 1, 2, 3, 4, 5이면 LSTM의 목표 출력은 BOS, 1, 2, 3, 4입니다.\n● 현재 위치에서 한 시점 전의 입력을 출력해야 하므로 앞에서 본 정보를 \n기억해야 합니다.\n● 이 과제는 자연어 대화가 아니라 훈련 원리를 확인하는 지연 복사 \n과제입니다."},{"id":"t1-04","ty":"num","lv":1,"game":false,"p":"고정 seed로 만든 숫자 시퀀스 640개 중 512개를 훈련에 쓰면, 검증에 쓰는 시퀀스는 몇 개인가요?","a":128,"unit":"개","h":"고정 seed로 만든 숫자 시퀀스는 훈련용과 검증용으로 나눕니다. 계산식은 검증 개수 = 전체 시퀀스 수(640) − 훈련 시퀀스 수(512)이며, 검증 데이터는 훈련에 쓰지 않은 예제로 현재 모델을 평가합니다.","w":"640 − 512 = 128개를 검증에 씁니다. 검증 데이터는 훈련에 쓰지 않은, 보지 못한 예제로 현재 모델을 평가합니다.","an":"2일차 슬라이드 · 훈련용과 검증용으로 나누기 (p.13)","src":"● 고정 seed로 만든 서로 다른 숫자 시퀀스 640개 중 512개는 훈련, 128개는 \n검증에 사용합니다.\n● 훈련 데이터는 업데이트에 사용하고, 검증 데이터는 보지 못한 예제로 현재 \n모델을 평가합니다."},{"id":"t1-05","ty":"mc","lv":2,"game":true,"p":"머신러닝 모델의 예측 규칙은 무엇으로 조정되나요?","o":["사람이 직접 쓴 조건문","데이터와 학습 목표","프롬프트 길이","서버 포트 번호"],"a":1,"h":"규칙 기반 방식은 사람이 조건을 직접 작성합니다. 반면 머신러닝은 예제에서 예측 규칙을 찾으며, 자료는 머신러닝이 무엇과 무엇으로 조정한 모델을 사용한다고 설명하는지 확인해 보세요.","w":"규칙 기반은 사람이 조건을 직접 작성하고, 머신러닝은 데이터와 학습 목표로 조정한 모델을 사용합니다.","an":"2일차 슬라이드 · AI·머신러닝·딥러닝 구분 (p.10)","src":"● AI는 지능적인 작업을 수행하는 방법을 넓게 부르는 말이며, 모든 AI가 \n신경망을 쓰는 것은 아닙니다.\n● 머신러닝은 예제에서 예측 규칙을 찾고, 딥러닝은 여러 층의 신경망으로 그 \n규칙을 표현합니다.\n● 언어 모델은 앞의 token을 바탕으로 다음 token을 예측하는 모델입니다. \n크기만으로 업무 적합성을 알 수는 없습니다.\n● 함께 해석하기: 규칙은 사람이 조건을 직접 작성하고 머신러닝은 데이터와 \n학습 목표로 조정한 모델을 사용합니다."},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"모든 AI가 신경망을 사용하는 것은 아니다.","a":true,"h":"자료는 AI를 지능적인 작업을 수행하는 방법을 넓게 부르는 말이라고 설명합니다. 사람이 규칙을 직접 쓰는 프로그램도 AI에 포함될 수 있고, 여러 층의 신경망을 쓰는 것은 그중 딥러닝입니다.","w":"맞습니다. AI는 넓은 개념이고 신경망을 쓰는 것은 그중 딥러닝입니다.","an":"2일차 슬라이드 · AI·머신러닝·딥러닝 구분 (p.10)","src":"● AI는 지능적인 작업을 수행하는 방법을 넓게 부르는 말이며, 모든 AI가 \n신경망을 쓰는 것은 아닙니다.\n● 머신러닝은 예제에서 예측 규칙을 찾고, 딥러닝은 여러 층의 신경망으로 그 \n규칙을 표현합니다."},{"id":"t1-07","ty":"ox","lv":2,"game":true,"p":"검증 결과를 여러 번 보고 모델을 골랐다면, 그 검증 결과를 최종 업무 평가로 그대로 써도 된다.","a":false,"h":"검증 결과를 보고 선택했다면 '새 입력'을 평가한다는 의미가 어떻게 될까요?","w":"틀렸습니다. 검증 결과로 선택했다면 최종 업무 평가는 별도의 입력과 조건으로 다시 해야 합니다.","an":"2일차 슬라이드 · 훈련용과 검증용으로 나누기 (p.13)","src":"● 고정 seed로 만든 서로 다른 숫자 시퀀스 640개 중 512개는 훈련, 128개는 \n검증에 사용합니다.\n● 훈련 데이터는 업데이트에 사용하고, 검증 데이터는 보지 못한 예제로 현재 \n모델을 평가합니다.\n● 검증 결과를 반복해서 보고 선택했다면 최종 업무 평가는 별도의 입력과 \n조건으로 다시 해야 합니다.\n● 함께 해석하기: 새 입력을 평가한다는 의미가 약해집니다."},{"id":"t1-08","ty":"match","lv":2,"game":false,"p":"훈련 용어와 뜻을 연결하세요.","pairs":[["입력","모델이 보는 자료"],["정답","맞혀야 할 목표"],["예측","현재 파라미터로 계산한 결과"],["파라미터","훈련 중 조정하는 숫자"]],"h":"입력·정답은 데이터, 예측은 모델 출력, 파라미터는 모델 내부 값입니다.","w":"입력은 모델이 보는 자료, 정답은 맞혀야 할 목표, 예측은 현재 파라미터로 계산한 결과, 파라미터는 훈련 중 조정하는 숫자입니다.","an":"2일차 슬라이드 · 훈련은 어떤 값을 바꾸는가 (p.11)","src":"● 입력은 모델이 보는 자료, 정답은 \n맞혀야 할 목표, 예측은 현재 \n파라미터로 계산한 결과입니다.\n● 파라미터는 훈련 중 조정하는 \n숫자입니다. loss는 예측과 정답의 \n차이를 계산한 한 개의 값입니다."},{"id":"t1-09","ty":"order","lv":2,"game":false,"p":"훈련 한 번의 흐름을 순서대로 정렬하세요.","steps":["입력과 정답 준비","모델이 예측 계산","loss로 오차 계산","gradient로 변화 방향 계산","optimizer가 가중치 변경"],"h":"예측이 있어야 오차를 계산하고, 오차가 있어야 방향을 구할 수 있습니다.","w":"입력 + 정답 → 모델 예측 → loss(오차) → gradient(변화 방향) → optimizer(가중치 변경) 순서입니다.","an":"2일차 슬라이드 · 훈련은 어떤 값을 바꾸는가 (p.11)","src":"입력 + 정답\n↓\n모델 → 예측\n↓\nloss: 오차 계산\n↓\ngradient: 변화 방향\n↓\noptimizer: 가중치 변경"},{"id":"t1-10","ty":"multi","lv":2,"game":true,"p":"지연 복사 과제에 대한 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["한 시점 전 입력을 출력한다","앞에서 본 정보를 기억해야 한다","자연어 대화 과제이다","훈련 원리를 확인하는 과제이다","현재 token만 보고 풀 수 있다"],"a":[0,1,3],"h":"지연 복사 과제는 각 위치에서 한 시점 전 입력을 출력해야 하므로, 현재 token만 보고는 답할 수 없고 앞에서 본 정보를 기억해야 합니다. 자료는 이 과제가 자연어 대화가 아니라 훈련 원리를 확인하는 과제라고 설명합니다.","w":"지연 복사는 한 시점 전 입력을 내야 하므로 기억이 필요하며, 자연어 대화가 아니라 훈련 원리를 확인하는 과제입니다.","an":"2일차 슬라이드 · 기억 과제 (p.12) · 04.LLM/02_rnn_lstm 2절","src":"● 입력이 1, 2, 3, 4, 5이면 LSTM의 목표 출력은 BOS, 1, 2, 3, 4입니다.\n● 현재 위치에서 한 시점 전의 입력을 출력해야 하므로 앞에서 본 정보를 \n기억해야 합니다.\n● 이 과제는 자연어 대화가 아니라 훈련 원리를 확인하는 지연 복사 \n과제입니다.\n● 함께 해석하기: 이번 과제의 정해진 순서를 기억하고 재현하는 능력을 \n확인합니다."}]},{"id":"t2","title":"Token·Embedding·Tensor","ref":"2일차 p.14–16 · 01_training_basics","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"모델이 사용할 수 있는 token의 목록을 무엇이라고 하나요?","o":["vocabulary","embedding","logits","checkpoint"],"a":0,"h":"token은 모델이 읽는 단위입니다. 모델이 사용할 수 있는 token을 모두 모은 목록은 '어휘 집합'이라는 뜻의 영어 이름으로 부르며, 이번 숫자 과제에서는 0~9와 BOS·EOS 같은 특수 token이 이 목록에 들어갑니다.","w":"vocabulary는 사용 가능한 token 목록입니다. embedding은 token을 벡터로 바꾸는 표, logits는 점수, checkpoint는 저장 파일입니다.","an":"2일차 슬라이드 · Token은 입력 단위 (p.14)","src":"● token은 모델이 읽는 단위이고, vocabulary는 사용 가능한 token 목록입니다.\n● 이번 숫자 과제는 token ID 3~12로 숫자 0~9를 나타내고, 1과 2를 BOS와 \nEOS에 사용합니다.\n● 자연어의 token은 단어와 항상 같지 않습니다. 숫자 ID 자체의 크기가 뜻의 \n크기를 의미하지 않습니다."},{"id":"t2-02","ty":"mc","lv":1,"game":true,"p":"숫자 과제에서 BOS와 EOS에 사용하는 token ID는?","o":["0과 1","1과 2","3과 12","9와 10"],"a":1,"h":"숫자 0~9는 ID 3~12를 씁니다. 그보다 앞의 번호를 떠올려 보세요.","w":"이번 과제는 token ID 3~12로 숫자 0~9를 나타내고, 1과 2를 BOS와 EOS에 사용합니다.","an":"2일차 슬라이드 · Token은 입력 단위 (p.14)","src":"● token은 모델이 읽는 단위이고, vocabulary는 사용 가능한 token 목록입니다.\n● 이번 숫자 과제는 token ID 3~12로 숫자 0~9를 나타내고, 1과 2를 BOS와 \nEOS에 사용합니다.\n● 자연어의 token은 단어와 항상 같지 않습니다. 숫자 ID 자체의 크기가 뜻의 \n크기를 의미하지 않습니다."},{"id":"t2-03","ty":"mc","lv":1,"game":false,"p":"Embedding을 가장 잘 설명한 것은?","o":["확률 합을 1로 만드는 함수","정답과의 오차 값","token ID를 벡터로 바꾸는 학습 가능한 표","가중치를 저장한 파일"],"a":2,"h":"Embedding은 정수 token ID를 주소처럼 써서 표의 한 행을 찾고, 그 행에 담긴 여러 숫자로 된 벡터를 이후 신경망 계산의 입력으로 넘깁니다. 이 표의 값도 처음부터 정해진 것이 아니라 훈련 중 다른 파라미터와 함께 바뀝니다.","w":"Embedding은 각 token ID를 벡터에 대응시키는 학습 가능한 표입니다. 확률 변환은 softmax, 오차는 loss, 저장 파일은 checkpoint입니다.","an":"2일차 슬라이드 · Embedding (p.15)","src":"● Embedding은 각 token ID를 여러 \n숫자로 된 벡터에 대응시키는 학습 \n가능한 표입니다.\n● 정수 ID는 항목을 찾는 주소이고, \n찾은 벡터가 이후 신경망 계산의 \n입력이 됩니다.\n● 처음의 벡터가 의미를 완성한 것은 \n아닙니다. 과제의 loss를 줄이는 \n과정에서 다른 파라미터와 함께 \n바뀝니다."},{"id":"t2-04","ty":"mc","lv":1,"game":true,"p":"tensor shape [B,T,V]에서 T는 무엇인가요?","o":["한 번에 처리하는 예제 수","위치(시퀀스 길이)","출력 후보 token 수","모델 층 수"],"a":1,"h":"tensor의 shape는 각 축에 몇 개가 들어 있는지 알려 줍니다. [B,T,V]에서 B는 한 번에 처리하는 예제 수, V는 출력 후보 token 수이며, 남은 T는 한 예제 안에서 token이 놓이는 위치의 개수(길이)를 나타냅니다.","w":"B는 한 번에 처리하는 예제 수, T는 길이(위치), V는 출력 후보 token 수입니다.","an":"2일차 슬라이드 · Tensor shape (p.16)","src":"● tensor는 숫자를 여러 축으로 배열한 자료입니다. shape는 각 축에 몇 개가 \n들어 있는지 알려줍니다.\n● B는 한 번에 처리하는 예제 수, T는 길이, V는 출력 후보 token 수입니다.\n● logits의 [B,T,V]와 정답의 [B,T]는 같은 예제·위치를 가리켜야 합니다.\n● 함께 해석하기: 각 위치의 후보 token 점수를 잃습니다. B는 예제 묶음, T는 \n위치, V는 후보 종류입니다."},{"id":"t2-05","ty":"mc","lv":2,"game":true,"p":"logits [B,T,V]와 비교할 정답 tensor의 shape는?","o":["[B,T]","[B,V]","[T,V]","[B,T,V]"],"a":0,"h":"logits [B,T,V]는 각 예제의 각 위치마다 V개 후보의 점수를 가집니다. 정답은 각 위치마다 맞는 token ID 하나뿐이므로 후보 축 V가 필요 없고, 같은 예제·위치를 가리키는 앞의 두 축만 남습니다.","w":"정답은 위치마다 token ID 하나이므로 [B,T]입니다. logits의 [B,T,V]와 같은 예제·위치를 가리켜야 합니다.","an":"2일차 슬라이드 · Tensor shape (p.16)","src":"● B는 한 번에 처리하는 예제 수, T는 길이, V는 출력 후보 token 수입니다.\n● logits의 [B,T,V]와 정답의 [B,T]는 같은 예제·위치를 가리켜야 합니다.\n● 함께 해석하기: 각 위치의 후보 token 점수를 잃습니다. B는 예제 묶음, T는 \n위치, V는 후보 종류입니다."},{"id":"t2-06","ty":"ox","lv":1,"game":true,"p":"token ID 숫자가 크면 그 token의 의미도 크다.","a":false,"h":"이번 숫자 과제는 token ID 3~12로 숫자 0~9를 나타냅니다. 자료는 ID가 기호를 찾는 번호일 뿐이라고 설명하므로, 번호의 수치가 크다고 그 token의 의미도 커지는지 생각해 보세요.","w":"틀렸습니다. ID는 기호를 찾는 번호이며, 숫자 크기가 의미의 크기를 뜻하지 않습니다.","an":"2일차 슬라이드 · Token은 입력 단위 (p.14)","src":"● token은 모델이 읽는 단위이고, vocabulary는 사용 가능한 token 목록입니다.\n● 이번 숫자 과제는 token ID 3~12로 숫자 0~9를 나타내고, 1과 2를 BOS와 \nEOS에 사용합니다.\n● 자연어의 token은 단어와 항상 같지 않습니다. 숫자 ID 자체의 크기가 뜻의 \n크기를 의미하지 않습니다.\n● 함께 해석하기: ID는 기호를 찾는 번호입니다. 수치의 크기가 의미의 크기를 \n뜻하지 않습니다."},{"id":"t2-07","ty":"ox","lv":2,"game":true,"p":"처음 embedding 벡터는 의미가 완성된 상태가 아니고, loss를 줄이는 동안 다른 파라미터와 함께 바뀐다.","a":true,"h":"Embedding은 token ID를 벡터에 대응시키는 '학습 가능한' 표입니다. 자료는 처음 벡터가 의미를 완성한 상태가 아니며, 과제의 loss를 줄이는 과정에서 다른 파라미터와 함께 바뀐다고 설명합니다.","w":"맞습니다. embedding 표도 파라미터이므로 훈련 중 함께 조정됩니다.","an":"2일차 슬라이드 · Embedding (p.15)","src":"● 처음의 벡터가 의미를 완성한 것은 \n아닙니다. 과제의 loss를 줄이는 \n과정에서 다른 파라미터와 함께 \n바뀝니다."},{"id":"t2-08","ty":"match","lv":1,"game":false,"p":"tensor 표기와 뜻을 연결하세요.","pairs":[["B","한 번에 처리하는 예제 수"],["T","시퀀스 길이(위치)"],["V","출력 후보 token 수"],["shape","각 축에 몇 개가 있는지"]],"h":"tensor shape 표기에서 B는 batch(한 번에 처리하는 예제 수), T는 time(시퀀스 길이·위치), V는 vocabulary(출력 후보 token 수)의 머리글자입니다. shape 자체는 각 축에 몇 개가 들어 있는지를 알려 줍니다.","w":"B는 예제 묶음, T는 위치, V는 후보 종류이며, shape는 각 축의 개수를 알려줍니다.","an":"2일차 슬라이드 · Tensor shape (p.16)","src":"● tensor는 숫자를 여러 축으로 배열한 자료입니다. shape는 각 축에 몇 개가 \n들어 있는지 알려줍니다.\n● B는 한 번에 처리하는 예제 수, T는 길이, V는 출력 후보 token 수입니다.\n● logits의 [B,T,V]와 정답의 [B,T]는 같은 예제·위치를 가리켜야 합니다.\n● 함께 해석하기: 각 위치의 후보 token 점수를 잃습니다. B는 예제 묶음, T는 \n위치, V는 후보 종류입니다."},{"id":"t2-09","ty":"order","lv":1,"game":false,"p":"token이 신경망 계산에 들어가는 순서를 정렬하세요.","steps":["token ID","embedding 표의 행 찾기","숫자 벡터","LSTM 계산"],"h":"token은 먼저 정수 ID로 표현되고, 그 ID를 주소로 써서 embedding 표의 해당 행을 찾습니다. 찾은 행은 여러 숫자로 된 벡터이며, 이 벡터가 이후 LSTM 계산의 입력이 됩니다.","w":"token ID로 embedding 표의 행을 찾아 숫자 벡터를 얻고, 그 벡터가 LSTM 계산의 입력이 됩니다.","an":"2일차 슬라이드 · Embedding (p.15)","src":"token ID\n↓\nembedding 표의 행\n↓\n숫자 벡터\n↓\nLSTM 계산"},{"id":"t2-10","ty":"multi","lv":1,"game":true,"p":"token에 대한 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["token은 단어와 항상 같지 않다","ID는 기호를 찾는 번호이다","vocabulary는 token 종류 목록이다","ID 크기가 의미 크기다","token은 항상 한 글자다"],"a":[0,1,2],"h":"token은 모델이 읽는 단위로, 자연어에서는 단어와 항상 같지 않습니다. token ID는 기호를 찾는 번호일 뿐 크기가 의미를 뜻하지 않으며, vocabulary는 사용 가능한 token을 모은 목록입니다.","w":"자연어 token은 단어와 항상 같지 않고, ID는 번호일 뿐이며, vocabulary는 token 목록입니다.","an":"2일차 슬라이드 · Token은 입력 단위 (p.14)","src":"● token은 모델이 읽는 단위이고, vocabulary는 사용 가능한 token 목록입니다.\n● 이번 숫자 과제는 token ID 3~12로 숫자 0~9를 나타내고, 1과 2를 BOS와 \nEOS에 사용합니다.\n● 자연어의 token은 단어와 항상 같지 않습니다. 숫자 ID 자체의 크기가 뜻의 \n크기를 의미하지 않습니다.\n● 함께 해석하기: ID는 기호를 찾는 번호입니다. 수치의 크기가 의미의 크기를 \n뜻하지 않습니다."}]},{"id":"t3","title":"Logits·Loss·Gradient","ref":"2일차 p.17–22 · 00_training_core","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"logits는 무엇인가요?","o":["정규화 전 후보 점수","합이 1인 확률","정답 위치 번호","학습률 값"],"a":0,"h":"모델은 각 위치에서 후보 token마다 점수를 냅니다. 자료는 logits를 아직 정규화하지 않은 점수라서 음수나 1보다 큰 값도 가능하다고 설명하며, 합이 1이 되도록 바꾸는 것은 softmax의 몫입니다.","w":"logits는 각 후보에 주는 정규화 전 점수이며 음수나 1보다 큰 값도 가능합니다. 합이 1인 값은 softmax 이후입니다.","an":"2일차 슬라이드 · Logits와 확률 (p.17)","src":"● logits는 모델이 각 후보에 주는 정규화 전 점수입니다. 음수나 1보다 큰 값도 \n가능합니다.\n● softmax는 후보 점수를 합이 1인 값으로 바꿉니다. 높은 점수의 후보가 더 큰 \n값을 받습니다.\n● 이번 CrossEntropyLoss에는 raw logits를 전달합니다. 손실 함수 내부에서 \n필요한 변환을 처리합니다.\n● 함께 해석하기: logits는 정규화 전 점수입니다."},{"id":"t3-02","ty":"mc","lv":1,"game":true,"p":"후보 점수를 합이 1인 값으로 바꾸는 함수는?","o":["reshape","softmax","argmax","embedding"],"a":1,"h":"logits는 정규화 전 점수라 음수나 1보다 큰 값도 가능합니다. 이 후보 점수들을 합이 1인 값(확률처럼 해석할 수 있는 값)으로 바꾸고, 높은 점수의 후보가 더 큰 값을 받게 하는 함수의 이름을 떠올려 보세요.","w":"softmax는 후보 점수를 합이 1인 값으로 바꾸며, 높은 점수의 후보가 더 큰 값을 받습니다.","an":"2일차 슬라이드 · Logits와 확률 (p.17)","src":"● softmax는 후보 점수를 합이 1인 값으로 바꿉니다. 높은 점수의 후보가 더 큰 \n값을 받습니다.\n● 이번 CrossEntropyLoss에는 raw logits를 전달합니다. 손실 함수 내부에서 \n필요한 변환을 처리합니다."},{"id":"t3-03","ty":"mc","lv":2,"game":true,"p":"Cross entropy loss가 커지는 경우는?","o":["정답에 높은 확률을 줄 때","정답에 낮은 확률을 줄 때","batch가 클 때","epoch가 늘 때"],"a":1,"h":"Cross entropy는 모델이 정답 후보에 충분한 점수를 주었는지 평가하는 loss입니다. 정답 후보의 확률이 높을수록 loss는 작아지므로, 반대로 정답에 낮은 확률을 주면 loss가 어떻게 될지 생각해 보세요.","w":"정답에 낮은 확률을 주면 cross entropy loss가 커집니다.","an":"2일차 슬라이드 · Loss는 틀린 정도의 기준 (p.18)","src":"● Cross entropy는 정답 후보에 충분한 점수를 주었는지 평가합니다. 정답에 \n낮은 확률을 주면 loss가 커집니다.\n● loss는 업데이트 방향을 구하는 연속적인 값이고, 정확도는 맞힌 개수를 세는 \n지표입니다.\n● 정확도가 같아도 확신 정도가 다르면 loss가 다를 수 있으므로 훈련 전후 두 \n지표를 함께 읽습니다.\n● 함께 해석하기: loss는 예측 분포와 정답의 차이를 요약합니다."},{"id":"t3-04","ty":"mc","lv":2,"game":true,"p":"loss 구현에서 logits [B,T,V]는 어떤 shape로 바꾸나요?","o":["[B,T]","[V,B×T]","[B,T×V]","[B×T,V]"],"a":3,"h":"loss 계산은 각 점수 행과 정답 번호를 같은 순서로 맞춰야 합니다. 그래서 logits [B,T,V]에서 마지막 후보 축 V는 그대로 두고, 앞의 예제 축 B와 위치 축 T를 하나로 합쳐 2차원으로 폅니다.","w":"[B,T,V]는 [B×T,V], 정답 [B,T]는 [B×T]로 바꾸어 같은 순서로 비교합니다.","an":"2일차 슬라이드 · Loss 구현 확인 (p.19)","src":"● [B,T,V]는 [B×T,V], 정답 [B,T]는 [B×T]로 바꾸어 같은 순서로 비교합니다.\n● 파일 저장 후 check 검증 셀을 실행한 결과를 확인합니다. 완료 기준은 \nlearner_verification=PASS입니다.\n● 함께 해석하기: logits는 [6,5], target은 [6]으로 맞춥니다."},{"id":"t3-05","ty":"mc","lv":2,"game":true,"p":"역전파(backpropagation)를 바르게 설명한 것은?","o":["입력에서 출력으로 예측 계산","학습률을 자동으로 결정","출력 오차에서 거슬러 gradient 계산","모델을 파일로 저장"],"a":2,"h":"gradient는 파라미터를 조금 바꿀 때 loss가 어떻게 변하는지 나타냅니다. 이 값을 구하는 역전파는 이름의 '역(back)'처럼 계산이 끝난 출력 쪽 오차에서 시작해, 계산 경로를 반대로 따라가며 각 파라미터의 gradient를 구합니다.","w":"역전파는 출력의 오차에서 시작해 계산 경로를 거슬러 각 파라미터의 gradient를 계산합니다.","an":"2일차 슬라이드 · Gradient (p.21)","src":"● gradient는 파라미터를 조금 바꿀 때 loss가 어떻게 변하는지 나타냅니다.\n● 역전파는 출력의 오차에서 시작해 계산 경로를 거슬러 각 파라미터의 \ngradient를 계산합니다.\n● optimizer는 gradient와 학습률을 사용해 파라미터를 업데이트합니다. \n학습률이 지나치면 훈련이 불안정할 수 있습니다."},{"id":"t3-06","ty":"ox","lv":1,"game":true,"p":"이번 실습의 CrossEntropyLoss에는 softmax를 거친 확률이 아니라 raw logits를 전달한다.","a":true,"h":"logits는 정규화 전 점수이고, softmax는 이를 합이 1인 값으로 바꿉니다. 자료는 이번 CrossEntropyLoss에 어떤 값을 넘기는지와 함께, 필요한 변환을 어디에서 처리하는지 설명합니다.","w":"맞습니다. 손실 함수 내부에서 필요한 변환을 처리하므로 raw logits를 전달합니다.","an":"2일차 슬라이드 · Logits와 확률 (p.17)","src":"● softmax는 후보 점수를 합이 1인 값으로 바꿉니다. 높은 점수의 후보가 더 큰 \n값을 받습니다.\n● 이번 CrossEntropyLoss에는 raw logits를 전달합니다. 손실 함수 내부에서 \n필요한 변환을 처리합니다."},{"id":"t3-07","ty":"ox","lv":2,"game":true,"p":"정확도가 같으면 loss도 항상 같다.","a":false,"h":"정확도는 맞힌 개수만 세는 지표이고, loss는 정답 후보에 얼마나 확신 있게 점수를 주었는지까지 반영하는 연속적인 값입니다. 같은 개수를 맞혀도 확신 정도가 다르면 두 지표가 어떻게 될지 생각해 보세요.","w":"틀렸습니다. 정확도가 같아도 확신 정도가 다르면 loss가 다르므로 두 지표를 함께 읽습니다.","an":"2일차 슬라이드 · Loss는 틀린 정도의 기준 (p.18)","src":"● Cross entropy는 정답 후보에 충분한 점수를 주었는지 평가합니다. 정답에 \n낮은 확률을 주면 loss가 커집니다.\n● loss는 업데이트 방향을 구하는 연속적인 값이고, 정확도는 맞힌 개수를 세는 \n지표입니다.\n● 정확도가 같아도 확신 정도가 다르면 loss가 다를 수 있으므로 훈련 전후 두 \n지표를 함께 읽습니다."},{"id":"t3-08","ty":"match","lv":1,"game":false,"p":"용어와 역할을 연결하세요.","pairs":[["logits","정규화 전 후보 점수"],["softmax","합이 1인 값으로 변환"],["loss","예측과 정답의 차이 요약"],["gradient","loss가 파라미터 변화에 반응하는 방향"]],"h":"logits는 모델이 후보마다 준 정규화 전 점수이고, softmax는 그 점수를 합이 1인 값으로 바꿉니다. loss는 예측과 정답의 차이를 한 값으로 요약하고, gradient는 파라미터를 바꿀 때 loss가 어떻게 반응하는지 나타냅니다.","w":"logits는 점수, softmax는 확률화, loss는 오차 요약, gradient는 변화 방향입니다.","an":"2일차 슬라이드 · p.17–21","src":"● logits는 모델이 각 후보에 주는 정규화 전 점수입니다. 음수나 1보다 큰 값도 \n가능합니다.\n● softmax는 후보 점수를 합이 1인 값으로 바꿉니다. 높은 점수의 후보가 더 큰 \n값을 받습니다.\n● 이번 CrossEntropyLoss에는 raw logits를 전달합니다. 손실 함수 내부에서 \n필요한 변환을 처리합니다."},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"한 번의 훈련 단계를 순서대로 정렬하세요.","steps":["batch 입력·정답 정렬","forward로 logits 예측","loss로 정답과 비교","gradient 초기화와 backward","optimizer step으로 가중치 업데이트"],"h":"훈련 한 단계는 batch로 입력과 정답을 맞춰 준비하는 것부터 시작합니다. forward로 logits를 예측하고, loss로 정답과 비교한 뒤, gradient를 초기화하고 backward로 계산하며, 마지막에 optimizer step으로 가중치를 바꿉니다.","w":"batch 입력 → forward → loss → gradient 준비(초기화·backward) → optimizer step 순서이며, 검증에서는 갱신하지 않습니다.","an":"2일차 슬라이드 · 한 번의 훈련 단계 (p.22)","src":"1. batch 입력\n입력·정답 정렬\n2. forward\nlogits 예측\n3. loss\n정답과 비교\n4. gradient 준비\n초기화·backward\n5. optimizer step\n가중치 업데이트\n6. 검증·다음 batch\n평가에서는 갱신 없음"},{"id":"t3-10","ty":"multi","lv":2,"game":true,"p":"loss 구현 TODO에서 지켜야 할 것을 <b>모두<\/b> 고르세요.","o":["마지막 후보 축(V)을 보존한다","정답은 reshape(-1)로 한 축에 모은다","logits와 정답의 예제·시간 순서를 맞춘다","gradient 전달은 확인하지 않는다","정답에도 softmax를 적용한다"],"a":[0,1,2],"h":"loss 참고 구현은 logits.shape[-1]로 후보 수 v를 얻어 logits를 reshape(-1, v)로 펴고, 정답은 reshape(-1)로 한 축에 모읍니다. 이때 두 tensor의 예제·시간 순서가 같아야 각 점수 행과 정답이 맞게 짝지어집니다.","w":"후보 축 V를 보존하고, 정답은 한 축으로 모으며, 두 tensor의 예제·시간 순서가 같아야 합니다. gradient 전달까지 검증해야 합니다.","an":"2일차 슬라이드 · Loss 구현 확인 (p.19–20)","src":"● 이 코드는 강사가 안내하는 시점에 \n확인하는 참고 구현입니다. 마지막 \n후보 축을 보존하는 이유를 말로 \n설명합니다.\n● reshape(-1)는 모든 정답 위치를 한 \n축으로 모읍니다. logits와 targets의 \n예제·시간 순서는 같아야 합니다.\n● 숫자가 출력되는 것뿐 아니라 \ngradient가 모델로 전달되는지까지 \n검증해야 합니다."}]},{"id":"t4","title":"Batch·Epoch·학습률과 평가 지표","ref":"2일차 p.23·26–28·35","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":true,"p":"훈련 데이터 전체를 한 번 사용한 횟수를 무엇이라 하나요?","o":["batch","epoch","step","seed"],"a":1,"h":"훈련 설정에서 batch는 한 번의 업데이트에 묶는 예제 묶음이고, step은 한 번의 파라미터 업데이트입니다. 훈련 데이터 전체를 처음부터 끝까지 한 바퀴 사용한 분량을 세는 단위는 따로 있습니다.","w":"epoch는 훈련 데이터 전체를 한 번 사용한 횟수이고, batch는 한 업데이트에 묶는 예제입니다.","an":"2일차 슬라이드 · Batch·Epoch·학습률 (p.23)","src":"● batch는 한 업데이트에 묶는 예제이고, epoch는 훈련 데이터 전체를 한 번 \n사용한 횟수입니다.\n● 학습률은 업데이트 크기를 조절합니다. epoch를 늘린다고 항상 검증 성능이 \n좋아지지는 않습니다."},{"id":"t4-02","ty":"mc","lv":1,"game":true,"p":"학습률(learning rate)이 조절하는 것은?","o":["업데이트 크기","데이터 개수","vocabulary 크기","모델 층 수"],"a":0,"h":"optimizer는 gradient로 파라미터를 바꿀 방향을 정합니다. 학습률은 그 방향으로 한 번에 얼마나 크게 움직일지, 즉 업데이트의 크기를 정하며, 지나치게 크면 훈련이 불안정해질 수 있습니다.","w":"학습률은 업데이트 크기를 조절합니다. 지나치게 크면 훈련이 불안정할 수 있습니다.","an":"2일차 슬라이드 · Batch·Epoch·학습률 (p.23)","src":"● 학습률은 업데이트 크기를 조절합니다. epoch를 늘린다고 항상 검증 성능이 \n좋아지지는 않습니다.\n● 수업은 quick 설정으로 짧게 관찰하고, 긴 반복과 구조 비교는 자습 설정으로 \n진행합니다.\n● 함께 해석하기: batch는 한 번 처리할 예제 묶음, epoch는 데이터 전체를 돈 \n단위, learning rate는 갱신 크기와 관련됩니다."},{"id":"t4-03","ty":"mc","lv":2,"game":true,"p":"훈련 loss만 좋아지고 검증 결과가 나쁘다면 무엇을 의심하나요?","o":["학습률이 0이다","과적합이나 데이터 차이","GPU가 연결되지 않았다","token이 부족하다"],"a":1,"h":"loss 기록을 읽을 때는 훈련 loss와 검증 결과를 함께 봅니다. 훈련 데이터에서만 오차가 줄고 보지 못한 검증 데이터에서는 나쁘다면, 모델이 훈련 데이터에만 지나치게 맞춰졌거나 두 데이터가 서로 다를 가능성을 의심합니다.","w":"훈련 loss만 좋아지고 검증이 나쁘면 과적합이나 데이터 차이를 의심합니다.","an":"2일차 슬라이드 · Loss 기록을 읽는 세 질문 (p.27)","src":"● 훈련이 진행될수록 오차가 대체로 줄어드는지, 갑자기 커지는 구간이 있는지 \n확인합니다.\n● 훈련 loss만 좋아지고 검증 결과가 나쁘다면 과적합이나 데이터 차이를 \n의심합니다.\n● 짧은 숫자 실험에서의 개선은 해당 과제에 대한 관찰입니다. 다른 \n길이·사진·업무로 일반화하지 않습니다.\n● 함께 해석하기: 작은 변동이 있을 수 있으므로 전체 추세와 검증 지표를 함께 \n봅니다."},{"id":"t4-04","ty":"num","lv":2,"game":false,"p":"한 시퀀스의 5개 위치 중 4개를 맞혔다면 token 정확도는 몇 %인가요?","a":80,"unit":"%","h":"계산식: token 정확도 = 맞힌 위치 수 ÷ 전체 위치 수 × 100","w":"4 ÷ 5 × 100 = 80%입니다. 하지만 한 위치가 틀렸으므로 이 시퀀스의 전체 일치는 실패입니다.","an":"2일차 슬라이드 · Token 정확도와 전체 일치율 (p.28)","src":"● token 정확도는 각 위치를 얼마나 맞혔는지 세고, 시퀀스 전체 일치율은 모든 \n위치를 맞힌 예제를 셉니다.\n● 5개 중 4개가 맞으면 token 기준 80%지만 해당 시퀀스는 전체 일치에 \n실패합니다.\n● 같은 지표 이름도 과제가 다르면 직접 순위를 매기기 어렵습니다. \n입력·정답·평가 방식을 함께 적습니다.\n● 함께 해석하기: 여러 위치 중 하나라도 틀리면 전체 일치는 실패입니다."},{"id":"t4-05","ty":"mc","lv":2,"game":true,"p":"시퀀스 전체 일치율이 세는 것은?","o":["맞힌 token 수","loss가 줄어든 epoch 수","검증 예제 전체 수","모든 위치를 맞힌 예제 수"],"a":3,"h":"token 정확도는 각 위치를 얼마나 맞혔는지 세지만, 시퀀스 전체 일치율은 한 예제의 모든 위치를 다 맞혔을 때만 그 예제를 맞힌 것으로 셉니다. 여러 위치 중 하나라도 틀리면 전체 일치는 실패입니다.","w":"시퀀스 전체 일치율은 모든 위치를 맞힌 예제를 셉니다. token 정확도는 각 위치를 셉니다.","an":"2일차 슬라이드 · Token 정확도와 전체 일치율 (p.28)","src":"● token 정확도는 각 위치를 얼마나 맞혔는지 세고, 시퀀스 전체 일치율은 모든 \n위치를 맞힌 예제를 셉니다.\n● 5개 중 4개가 맞으면 token 기준 80%지만 해당 시퀀스는 전체 일치에 \n실패합니다.\n● 같은 지표 이름도 과제가 다르면 직접 순위를 매기기 어렵습니다. \n입력·정답·평가 방식을 함께 적습니다.\n● 함께 해석하기: 여러 위치 중 하나라도 틀리면 전체 일치는 실패입니다."},{"id":"t4-06","ty":"ox","lv":1,"game":true,"p":"epoch를 늘리면 검증 성능은 항상 좋아진다.","a":false,"h":"학습률은 업데이트 크기를 조절하고, epoch는 훈련 데이터 전체를 한 번 사용한 횟수입니다. 자료는 epoch를 늘리는 것과 검증 성능의 관계를 따로 짚으며, 훈련 데이터에 과하게 맞춰질 수 있다는 점을 떠올려 보세요.","w":"틀렸습니다. epoch를 늘린다고 항상 검증 성능이 좋아지지는 않습니다.","an":"2일차 슬라이드 · Batch·Epoch·학습률 (p.23)","src":"● 학습률은 업데이트 크기를 조절합니다. epoch를 늘린다고 항상 검증 성능이 \n좋아지지는 않습니다."},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"짧은 숫자 실험에서 얻은 개선은 다른 길이·사진·업무로 일반화하지 않는다.","a":true,"h":"자료는 loss 기록을 읽을 때 개선이 어떤 과제에서 관찰된 것인지 구분하라고 합니다. 짧은 숫자 실험의 개선은 그 과제에 대한 관찰일 뿐이므로, 다른 길이·사진·업무에도 그대로 통한다고 볼 수 있는지 생각해 보세요.","w":"맞습니다. 짧은 숫자 실험의 개선은 해당 과제에 대한 관찰입니다.","an":"2일차 슬라이드 · Loss 기록을 읽는 세 질문 (p.27)","src":"● 짧은 숫자 실험에서의 개선은 해당 과제에 대한 관찰입니다. 다른 \n길이·사진·업무로 일반화하지 않습니다."},{"id":"t4-08","ty":"match","lv":1,"game":false,"p":"훈련 설정과 뜻을 연결하세요.","pairs":[["batch","한 업데이트에 묶는 예제"],["epoch","훈련 데이터 전체를 한 번 사용"],["학습률","업데이트 크기 조절"],["quick 설정","수업에서 짧게 관찰하는 설정"]],"h":"batch는 한 업데이트에 묶는 예제, epoch는 훈련 데이터 전체를 한 번 사용한 횟수, 학습률은 업데이트 크기를 조절하는 값입니다. 수업에서는 quick 설정으로 짧게 관찰하고, 긴 반복과 구조 비교는 자습 설정으로 진행합니다.","w":"batch는 묶음, epoch는 전체 데이터 한 바퀴, 학습률은 갱신 크기, quick 설정은 수업용 짧은 관찰입니다.","an":"2일차 슬라이드 · Batch·Epoch·학습률 (p.23)","src":"● batch는 한 업데이트에 묶는 예제이고, epoch는 훈련 데이터 전체를 한 번 \n사용한 횟수입니다.\n● 학습률은 업데이트 크기를 조절합니다. epoch를 늘린다고 항상 검증 성능이 \n좋아지지는 않습니다.\n● 수업은 quick 설정으로 짧게 관찰하고, 긴 반복과 구조 비교는 자습 설정으로 \n진행합니다."},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"훈련 결과를 업무 판단으로 옮기는 순서를 정렬하세요.","steps":["실제 지표와 예측 예제로 개선을 설명","숫자 과제로 알 수 없는 현장 조건 명시","필요한 추가 데이터 기록","training_review를 JSON으로 저장"],"h":"훈련 결과를 업무 판단으로 옮길 때는 먼저 훈련 전후 무엇이 좋아졌는지 실제 지표와 예측 예제로 설명합니다. 그다음 숫자 과제로 알 수 없는 현장 조건을 밝히고, 필요한 추가 데이터를 적은 뒤, training_review를 JSON으로 저장합니다.","w":"개선을 지표로 설명하고, 알 수 없는 조건과 필요한 추가 데이터를 적은 뒤 training-review.json에 저장합니다.","an":"2일차 슬라이드 · 훈련 결과를 업무 판단으로 (p.35)","src":"● 훈련 전후 무엇이 좋아졌는지 실제 지표와 예측 예제로 설명합니다.\n● 숫자 과제로 알 수 없는 사진·길이·조명·현장 조건을 명시하고 필요한 추가 \n데이터를 적습니다.\n● 00 노트북 training_review를 작성하고 \nData/outputs/course-review/04.LLM/training-review.json에 저장합니다."},{"id":"t4-10","ty":"multi","lv":2,"game":true,"p":"loss 기록을 읽을 때 확인할 것을 <b>모두<\/b> 고르세요.","o":["오차가 대체로 줄어드는가","갑자기 커지는 구간이 있는가","검증 지표도 함께 좋은가","모델 이름이 유명한가","출력 문장이 자연스러운가"],"a":[0,1,2],"h":"슬라이드는 loss 기록을 읽는 세 가지 질문을 제시합니다. 훈련이 진행될수록 오차가 대체로 줄어드는지, 갑자기 커지는 구간이 있는지, 그리고 훈련 loss뿐 아니라 검증 결과도 함께 좋은지를 확인합니다.","w":"추세가 줄어드는지, 급증 구간이 있는지, 검증 결과와 함께 좋은지를 확인합니다.","an":"2일차 슬라이드 · Loss 기록을 읽는 세 질문 (p.27)","src":"● 훈련이 진행될수록 오차가 대체로 줄어드는지, 갑자기 커지는 구간이 있는지 \n확인합니다.\n● 훈련 loss만 좋아지고 검증 결과가 나쁘다면 과적합이나 데이터 차이를 \n의심합니다."}]},{"id":"t5","title":"RNN과 LSTM","ref":"2일차 p.24–25 · 02_rnn_lstm","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"RNN이 앞에서 읽은 정보를 다음 시점에 전달하는 상태는?","o":["hidden state","logits","vocabulary","checkpoint"],"a":0,"h":"RNN은 시퀀스를 한 위치씩 읽으며, 각 시점에서 현재 입력 x_t와 직전 상태를 결합해 새 상태를 만듭니다. 이 상태는 h_t로 표기하며, 이전까지 읽은 정보를 요약해 다음 시점에 넘기는 '숨은' 상태라는 이름을 가집니다.","w":"RNN은 현재 입력과 직전 hidden state를 결합해 새 hidden state를 만들어 다음 시점에 전달합니다.","an":"2일차 슬라이드 · RNN (p.24) · 04.LLM/02_rnn_lstm 1절","src":"LSTM은 hidden 외에 cell state도 전달합니다. 시퀀스 진행과 optimizer 업데이트는 다른 반복입니다."},{"id":"t5-02","ty":"mc","lv":1,"game":true,"p":"LSTM이 hidden state 외에 추가로 전달하는 상태는?","o":["attention weight","cell state","position embedding","padding mask"],"a":1,"h":"RNN은 hidden state 하나로 과거 정보를 전달합니다. LSTM은 여기에 비교적 직접적인 정보 통로를 하나 더 두고, sigmoid gate로 그 통로의 정보를 유지·입력·출력하도록 조절합니다. 이 통로는 c_t로 표기합니다.","w":"LSTM은 hidden 외에 cell state도 전달하며, gate로 정보의 유지·입력·출력을 조절합니다.","an":"2일차 슬라이드 · LSTM (p.24–25)","src":"LSTM은 hidden 외에 cell state도 전달합니다. 시퀀스 진행과 optimizer 업데이트는 다른 반복입니다."},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"반복 곱셈 때문에 앞 시점의 gradient가 거의 0이 되는 현상은?","o":["gradient 폭주","과적합","기울기 소실(vanishing)","teacher forcing"],"a":2,"h":"RNN의 역전파는 마지막 시점에서 앞쪽으로 여러 번 곱셈을 거칩니다. 곱하는 값이 반복해서 1보다 작으면 앞 시점의 gradient가 거의 0이 되어 '사라지고', 1보다 크면 매우 커지는 폭주가 생길 수 있습니다.","w":"역전파가 여러 번 1보다 작게 곱해지면 앞 시점 gradient가 0에 가까워지는 기울기 소실이 생깁니다.","an":"04.LLM/02_rnn_lstm 4절 · 긴 기억이 어려운 이유","src":"RNN은 여러 시점에서 같은 변환을 반복합니다. 역전파도 마지막에서 앞쪽으로 여러 번 곱셈을 거칩니다. 이 값들이 반복해서 1보다 작게 작용하면 앞 시점의 gradient가 거의 0이 되는 **vanishing gradient(기울기 소실)** 가 생기고, 1보다 크게 작용하면 매우 커지는 **exploding gradient(기울기 폭주)** 가 생길 수 있습니다."},{"id":"t5-04","ty":"mc","lv":2,"game":true,"p":"이 실습의 훈련 코드는 gradient norm을 얼마로 제한하나요?","o":["0.1","1.0","5.0","10"],"a":1,"h":"기울기가 폭주하면 loss가 불안정해지거나 nan이 될 수 있습니다. 이 실습의 훈련 코드는 gradient norm에 상한을 두는 gradient clipping으로 폭주를 완화하며, 자료의 4절에 그 상한값이 적혀 있습니다.","w":"실습 훈련 코드는 gradient norm을 1.0으로 제한하는 gradient clipping을 사용해 폭주를 막습니다.","an":"04.LLM/02_rnn_lstm 4절 · gradient 소실과 폭주","src":"기울기가 소실되면 오래전 정보와 관련된 파라미터가 거의 학습되지 않습니다. 폭주하면 loss가 불안정해지거나 `nan`이 될 수 있습니다. 이 실습의 훈련 코드는 gradient norm을 1.0으로 제한하는 **gradient clipping** 으로 폭주를 완화합니다. clipping은 긴 기억 문제를 전부 해결하는 방법은 아닙니다."},{"id":"t5-05","ty":"mc","lv":1,"game":true,"p":"LSTM에서 이전 cell state를 얼마나 유지할지 정하는 gate는?","o":["input gate","output gate","reset gate","forget gate"],"a":3,"h":"LSTM의 gate는 세 가지입니다. 하나는 현재 후보 정보를 얼마나 기록할지, 하나는 cell state 중 얼마를 hidden으로 보여 줄지 정합니다. 남은 하나는 이전 cell state에서 얼마나 유지할지, 곧 무엇을 '잊을지' 정하는 gate입니다.","w":"forget gate는 이전 cell state를 얼마나 유지할지, input gate는 새 정보를 얼마나 기록할지, output gate는 얼마를 hidden으로 보일지 정합니다.","an":"04.LLM/02_rnn_lstm 5절 · cell state와 gate","src":"**LSTM(Long Short-Term Memory)** 은 RNN의 hidden state 외에 비교적 직접적인 정보 통로인 **cell state** `c_t`를 둡니다. 그리고 0–1 값을 내는 sigmoid gate로 정보를 조절합니다.\n\n- **forget gate** : 이전 cell state에서 얼마나 유지할지 정함\n- **input gate** : 현재 후보 정보를 얼마나 기록할지 정함\n- **output gate** : cell state 중 얼마를 현재 hidden state로 보여줄지 정함"},{"id":"t5-06","ty":"ox","lv":2,"game":true,"p":"RNN은 시점마다 서로 다른 독립 모델을 만들어 사용한다.","a":false,"h":"RNN 그림은 시점마다 셀이 여러 개로 펼쳐져 보이지만, 자료는 같은 RNN 셀과 같은 파라미터를 모든 시점에 반복 사용한다고 설명합니다. 시점마다 독립된 모델을 만드는 것인지 확인해 보세요.","w":"틀렸습니다. 같은 RNN 셀과 같은 파라미터를 모든 시점에 반복 사용합니다.","an":"04.LLM/02_rnn_lstm 1절 · hidden state","src":"같은 RNN 셀과 같은 파라미터를 모든 시점에 반복 사용합니다. 그림에서 셀이 여러 개로 펼쳐져 보여도 시점마다 독립된 모델을 만드는 것이 아닙니다. hidden state는 과거 원문 전체를 그대로 저장하는 메모리라기보다, 과제에 도움이 되도록 압축된 실수 벡터입니다."},{"id":"t5-07","ty":"ox","lv":1,"game":true,"p":"LSTM의 gate는 사람이 정한 if문이 아니라 학습되는 연속 값이다.","a":true,"h":"LSTM은 cell state와 여러 gate로 정보의 유지·입력·출력을 조절합니다. 자료는 gate가 사람이 정한 if문인지, 아니면 데이터로 훈련되는 연속 값인지 설명하며, 과제에 도움이 되는 기억 방식이 훈련된다고 덧붙입니다.","w":"맞습니다. gate는 학습되는 연속 값이며 과제에 도움이 되는 기억 방식이 훈련됩니다.","an":"2일차 슬라이드 · LSTM (p.25)","src":"● LSTM은 cell state라는 기억 경로와 여러 gate로 정보의 유지·입력·출력을 \n조절합니다.\n● gate는 사람이 정한 if문이 아니라 학습되는 연속 값입니다. 과제에 도움이 \n되는 기억 방식이 훈련됩니다.\n● 이번 지연 복사는 바로 전 입력을 기억해야 하므로 LSTM의 동작을 작은 \n예제로 확인하기 좋습니다."},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"LSTM 구성 요소와 역할을 연결하세요.","pairs":[["forget gate","이전 cell state 유지 정도"],["input gate","현재 후보 정보 기록 정도"],["output gate","hidden으로 보일 정도"],["tanh","값을 -1~1 범위로 누름"]],"h":"forget gate는 이전 cell state를 얼마나 유지할지, input gate는 현재 후보 정보를 얼마나 기록할지, output gate는 cell state 중 얼마를 hidden으로 보여 줄지 정합니다. tanh는 값을 -1과 1 사이로 누르는 비선형 함수입니다.","w":"forget은 유지, input은 기록, output은 노출 정도를 정하며 tanh는 값을 -1~1로 누르는 비선형 함수입니다.","an":"04.LLM/02_rnn_lstm 1·5절","src":"- **forget gate** : 이전 cell state에서 얼마나 유지할지 정함\n- **input gate** : 현재 후보 정보를 얼마나 기록할지 정함\n- **output gate** : cell state 중 얼마를 현재 hidden state로 보여줄지 정함"},{"id":"t5-09","ty":"order","lv":1,"game":false,"p":"RNN이 한 시점을 처리하는 순서를 정렬하세요.","steps":["현재 token 입력","embedding 벡터로 표현","이전 hidden과 상태 계산","새 hidden을 다음 시점에 전달","예측하고 지표 확인"],"h":"RNN 한 시점의 절차도는 현재 token에서 시작합니다. token을 embedding으로 벡터로 바꾼 뒤, 앞 시점의 정보인 이전 hidden과 함께 상태를 계산하고, 새 hidden을 다음 시점에 넘기며, 마지막으로 예측해 과제 지표를 확인합니다.","w":"현재 token → embedding → 이전 hidden과 상태 계산 → 새 hidden 전달 → 예측·비교 순서입니다.","an":"2일차 슬라이드 · RNN (p.24)","src":"1. 현재 token\n순서 t의 입력\n2. embedding\n벡터로 표현\n3. 이전 hidden\n앞 시점의 정보\n4. 상태 계산\nRNN / LSTM\n5. 새 hidden\n다음 시점에 전달\n6. 예측·비교\n과제 지표 확인"},{"id":"t5-10","ty":"multi","lv":2,"game":true,"p":"RecurrentTagger의 shape에 대해 맞는 것을 <b>모두<\/b> 고르세요.","o":["embedding 출력은 [B,T,32]","RNN 출력 states는 [B,T,64]","logits는 [B,T,13]","batch_first=True면 첫 축이 T","LSTM 마지막 상태는 텐서 하나"],"a":[0,1,2],"h":"Embedding(V,32) → RNN(32,64) → Linear(64,V) 경로를 따라가 보세요.","w":"embedding [B,T,32], states [B,T,64], logits [B,T,13]입니다. batch_first=True면 첫 축이 B이고, LSTM 마지막 상태는 (h_n, c_n) 두 텐서입니다.","an":"04.LLM/02_rnn_lstm 3·5절 · shape 추적","src":"이 자료의 `RecurrentTagger`는 다음 경로를 사용합니다.\n\n```text\nsource [B,T] --Embedding(V,32)--> vectors [B,T,32]\n --RNN(32,64)------> states [B,T,64]\n --Linear(64,V)----> logits [B,T,13]\n --argmax(V축)-----> tokens [B,T]\n```"}]},{"id":"t6","title":"Checkpoint와 재사용 검증","ref":"2일차 p.26·29–30","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"checkpoint를 가장 잘 설명한 것은?","o":["훈련 결과를 다시 읽는 파일","현재 GPU 메모리 상태","검증 데이터 목록","생성 옵션 사전"],"a":0,"h":"훈련이 끝난 모델은 메모리에만 있으면 프로그램이 끝날 때 사라집니다. 자료의 절차도는 훈련·검증 뒤에 가중치·설정을 보존하는 파일을 저장하고, 새 프로세스에서 그 파일을 다시 읽어 추론한다고 설명합니다.","w":"checkpoint는 훈련 결과(가중치·설정)를 다시 읽기 위한 파일입니다.","an":"2일차 슬라이드 · Checkpoint (p.29)","src":"1. 고정 데이터 \n훈련·검증 분리\n2. 모델 훈련\nloss·지표 기록\n3. 검증 비교\n같은 과제·조건\n4. checkpoint 저장\n가중치·설정 보존\n5. 새 프로세스 \n저장 파일 로드\n6. 재추론 확인\n출력·조건 비교"},{"id":"t6-02","ty":"mc","lv":2,"game":true,"p":"저장한 모델을 재사용할 수 있는지 검증하려면 어디까지 확인해야 하나요?","o":["메모리 모델의 출력","새 프로세스에서 재로드 후 추론","파일 크기","훈련 loss"],"a":1,"h":"자료는 현재 메모리의 모델과 저장 파일이 다르다고 강조합니다. 저장한 파일만으로 모델을 다시 쓸 수 있는지 보려면 메모리 상태와 무관한 새 Python 프로세스에서 파일을 로드하고, 재추론 결과까지 확인해야 합니다.","w":"새 프로세스에서 저장 파일을 로드해 재추론까지 확인해야 재사용을 검증합니다.","an":"2일차 슬라이드 · Checkpoint (p.29)","src":"현재 메모리의 모델과 저장 파일은 다릅니다. 새 프로세스 재로드까지 확인해야 재사용을 검증합니다."},{"id":"t6-03","ty":"mc","lv":1,"game":true,"p":"checkpoint 재로드 셀이 저장 파일을 전달하는 스크립트는?","o":["train.py","check.py","infer.py","loss.py"],"a":2,"h":"00_training_core의 checkpoint 재로드 셀은 방금 저장한 파일을 별도 스크립트에 넘겨, 입력 1,2,3,4,5에 대한 예측을 다시 만듭니다. 그 스크립트 이름은 '추론하다'를 뜻하는 영어 단어에 .py를 붙인 것입니다.","w":"00_training_core의 재로드 셀은 방금 만든 파일을 infer.py에 전달합니다.","an":"2일차 슬라이드 · 재로드 결과 (p.30)","src":"● 00_training_core의 checkpoint 재로드 셀은 방금 만든 파일을 infer.py에 \n전달합니다.\n● 입력 1,2,3,4,5의 기대 출력은 BOS,1,2,3,4입니다. 실제 예측과 위치별로 \n비교합니다."},{"id":"t6-04","ty":"mc","lv":2,"game":false,"p":"LSTM 훈련 가중치가 저장되는 폴더는?","o":["Data/checkpoints/users/04.LLM","Data/outputs/course-review","exercises/","Data/ollama"],"a":0,"h":"run_training(\"lstm\") 셀은 훈련 결과 기록과 가중치를 서로 다른 폴더에 저장합니다. 결과 기록은 Data/outputs 아래에, 가중치는 이름에 checkpoint가 들어간 Data 아래 사용자별 04.LLM 폴더에 저장됩니다.","w":"결과 기록은 Data/outputs/04.LLM/<실행명>/, 가중치는 Data/checkpoints/users/04.LLM에 저장됩니다.","an":"2일차 슬라이드 · LSTM 훈련 (p.26)","src":"● 결과는 Data/outputs/04.LLM/<실행명>/, 가중치는 \nData/checkpoints/users/04.LLM에 저장됩니다."},{"id":"t6-05","ty":"mc","lv":2,"game":true,"p":"checkpoint 로드 때 missing/unexpected key 오류가 나는 원인은?","o":["학습률이 높다","저장·생성 모델의 층 구조가 다르다","GPU 메모리 부족","입력 길이가 다르다"],"a":1,"h":"checkpoint를 로드할 때는 저장된 가중치의 이름표(key)를 새로 만든 모델의 층 이름과 하나씩 맞춥니다. 자료는 저장한 모델과 생성한 모델의 층 이름·구조가 서로 다를 때 missing/unexpected key 오류가 난다고 설명합니다.","w":"저장한 모델과 생성한 모델의 층 이름·구조가 다르면 missing/unexpected key 오류가 납니다.","an":"04.LLM/04_transformer 8절 · 자주 생기는 오류","src":"- **checkpoint load 시 missing/unexpected key** : 저장한 모델과 생성한 모델의 층 이름·구조가 다릅니다."},{"id":"t6-06","ty":"ox","lv":2,"game":true,"p":"현재 메모리의 모델과 저장 파일은 같은 것이므로 재로드 확인은 필요 없다.","a":false,"h":"자료는 현재 메모리의 모델과 디스크에 저장한 파일이 서로 다르다고 강조합니다. 그래서 저장 파일로 재사용할 수 있는지는 새 프로세스에서 다시 로드해 추론해 봐야 검증됩니다.","w":"틀렸습니다. 메모리의 모델과 저장 파일은 다르므로 새 프로세스 재로드까지 확인해야 합니다.","an":"2일차 슬라이드 · Checkpoint (p.29)","src":"현재 메모리의 모델과 저장 파일은 다릅니다. 새 프로세스 재로드까지 확인해야 재사용을 검증합니다."},{"id":"t6-07","ty":"ox","lv":1,"game":true,"p":"LSTM 훈련은 별도 Python 프로세스로 실행되고, 끝나면 GPU 자원을 반환한다.","a":true,"h":"00_training_core의 run_training(\"lstm\") 셀은 훈련을 노트북 커널 안이 아니라 별도 Python 프로세스로 실행합니다. 그 프로세스가 끝나면 사용하던 GPU 자원이 어떻게 되는지 자료에서 확인해 보세요.","w":"맞습니다. 별도 Python 프로세스가 끝나면 GPU 자원을 반환합니다.","an":"2일차 슬라이드 · LSTM 훈련 (p.26)","src":"● 00_training_core의 run_training(\"lstm\") 셀을 실행합니다. 별도 Python \n프로세스가 끝나면 GPU 자원을 반환합니다."},{"id":"t6-08","ty":"match","lv":2,"game":false,"p":"파일·경로와 역할을 연결하세요.","pairs":[["Data/outputs/04.LLM/<실행명>/","훈련 결과 기록"],["Data/checkpoints/users/04.LLM","훈련 가중치"],["training-review.json","훈련 검토 기록"],["infer.py","저장 파일로 재추론"]],"h":"훈련 결과 기록은 Data/outputs/04.LLM/<실행명>/ 아래에, 가중치는 Data/checkpoints/users/04.LLM에 저장됩니다. training-review.json은 훈련 결과를 업무 판단으로 옮긴 검토 기록이고, infer.py는 저장 파일을 읽어 재추론하는 스크립트입니다.","w":"outputs에는 결과, checkpoints에는 가중치, training-review.json에는 검토 기록이 저장되고 infer.py로 재추론합니다.","an":"2일차 슬라이드 · p.26·30·35","src":"● 00_training_core의 run_training(\"lstm\") 셀을 실행합니다. 별도 Python \n프로세스가 끝나면 GPU 자원을 반환합니다.\n● 훈련 전후 검증 loss·token 정확도·시퀀스 전체 일치율과 실제 예측 예제를 \n비교합니다.\n● 결과는 Data/outputs/04.LLM/<실행명>/, 가중치는 \nData/checkpoints/users/04.LLM에 저장됩니다."},{"id":"t6-09","ty":"order","lv":2,"game":false,"p":"훈련 결과를 저장하고 다시 쓰는 순서를 정렬하세요.","steps":["고정 데이터로 훈련·검증 분리","모델 훈련과 지표 기록","같은 조건으로 검증 비교","checkpoint 저장","새 프로세스에서 로드","재추론 결과 확인"],"h":"저장과 재사용 절차도는 고정 데이터를 훈련·검증으로 나누는 것에서 시작합니다. 모델을 훈련하며 지표를 기록하고, 같은 조건으로 검증 비교한 뒤 checkpoint를 저장하며, 새 프로세스에서 파일을 로드해 재추론 결과를 확인합니다.","w":"데이터 분리 → 훈련 → 검증 비교 → checkpoint 저장 → 새 프로세스 로드 → 재추론 확인 순서입니다.","an":"2일차 슬라이드 · Checkpoint (p.29)","src":"1. 고정 데이터 \n훈련·검증 분리\n2. 모델 훈련\nloss·지표 기록\n3. 검증 비교\n같은 과제·조건\n4. checkpoint 저장\n가중치·설정 보존\n5. 새 프로세스 \n저장 파일 로드\n6. 재추론 확인\n출력·조건 비교"},{"id":"t6-10","ty":"multi","lv":2,"game":true,"p":"checkpoint 재로드 결과를 확인할 때 할 일을 <b>모두<\/b> 고르세요.","o":["기대 출력과 위치별로 비교","파일이 없으면 경로를 확인","본인 가중치인지 확인","메모리 모델로 대신 확인","정답 출력은 보지 않음"],"a":[0,1,2],"h":"재로드 셀은 저장 파일을 infer.py에 넘겨 다시 예측합니다. 결과는 입력 1,2,3,4,5의 기대 출력과 위치별로 비교하고, checkpoint가 없으면 앞 훈련 결과와 경로를, 그리고 그 가중치가 본인 exercise 결과인지 확인합니다.","w":"입력 1~5의 기대 출력 BOS,1,2,3,4와 위치별로 비교하고, 파일이 없으면 경로를, 본인 exercise 가중치인지도 확인합니다.","an":"2일차 슬라이드 · 재로드 결과 (p.30)","src":"● 00_training_core의 checkpoint 재로드 셀은 방금 만든 파일을 infer.py에 \n전달합니다.\n● 입력 1,2,3,4,5의 기대 출력은 BOS,1,2,3,4입니다. 실제 예측과 위치별로 \n비교합니다.\n● checkpoint가 없으면 앞 훈련 결과와 경로를 확인합니다. 본인의 exercise \n가중치인지도 확인합니다."}]},{"id":"t7","title":"Seq2Seq와 Attention","ref":"2일차 p.31–33 · 03_seq2seq_attention","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"Seq2Seq에서 입력 시퀀스를 읽는 부분은?","o":["decoder","encoder","optimizer","tokenizer"],"a":1,"h":"Seq2Seq는 읽기와 생성을 두 부분으로 나눕니다. 한 부분은 입력 시퀀스를 처음부터 끝까지 읽어 표현을 만들고, 다른 한 부분(decoder)은 BOS부터 출력 token을 하나씩 만듭니다. 입력을 '부호화'하는 쪽의 이름을 떠올려 보세요.","w":"encoder가 입력을 읽고 decoder가 출력 token을 차례로 생성합니다.","an":"2일차 슬라이드 · Seq2Seq (p.31)","src":"● Encoder가 입력을 읽고, decoder가 출력 token을 차례로 생성하는 \n구조입니다."},{"id":"t7-02","ty":"mc","lv":1,"game":true,"p":"교재 Seq2Seq 실습의 과제는?","o":["한 시점 지연 복사","문장 번역","숫자 역순 출력 후 EOS","이미지 분류"],"a":2,"h":"교재의 Seq2Seq 과제는 RNN/LSTM의 한 시점 지연 복사와 다릅니다. 숫자 입력 전체를 읽은 뒤 순서를 뒤집어 출력하고, 출력이 끝났음을 알리는 특수 token을 마지막에 생성합니다. 예를 들어 [3,8,5,9,4]의 정답은 [4,9,5,8,3,EOS]입니다.","w":"Seq2Seq 과제는 숫자 입력을 역순으로 출력하고 마지막에 EOS를 생성합니다. RNN/LSTM의 지연 복사와 과제가 다릅니다.","an":"2일차 슬라이드 · Seq2Seq (p.31)","src":"● 교재의 Seq2Seq 과제는 숫자 입력을 역순으로 출력하고 마지막에 EOS를 \n생성합니다.\n● RNN/LSTM의 한 시점 지연 복사와는 과제가 다르므로 두 정확도를 단순한 \n모델 순위로 비교하지 않습니다."},{"id":"t7-03","ty":"mc","lv":2,"game":true,"p":"훈련할 때 decoder에 직전 '정답' token을 넣는 방법은?","o":["teacher forcing","beam search","dropout","padding"],"a":0,"h":"훈련 초기에 decoder의 예측은 거의 무작위라서, 자기 예측만 다음 입력으로 넣으면 첫 오류가 뒤로 퍼집니다. 그래서 훈련할 때는 직전의 정답 token을 decoder 입력으로 넣으며, 선생님이 정답을 알려 주며 이끄는 모습에 빗댄 이름을 씁니다.","w":"teacher forcing은 훈련 때 직전 정답 token을 decoder 입력으로 주는 훈련 방법입니다.","an":"2일차 슬라이드 · Teacher forcing (p.32)","src":"훈련 초기에 decoder의 예측은 거의 무작위입니다. 이전 예측만 계속 다음 입력으로 넣으면 첫 오류가 뒤의 모든 위치에 퍼져 학습 신호가 불안정해질 수 있습니다. **teacher forcing** 은 훈련할 때 직전의 정답 token을 다음 decoder 입력으로 주는 방법입니다."},{"id":"t7-04","ty":"mc","lv":2,"game":true,"p":"훈련과 추론의 decoder 입력 조건 차이를 부르는 말은?","o":["vanishing gradient","target leakage","exposure bias","overfitting"],"a":2,"h":"teacher forcing은 훈련 때 직전 정답을 decoder에 넣지만, 추론 때는 정답을 알 수 없어 직전 자기 예측을 넣습니다. 이렇게 훈련과 추론에서 decoder가 '노출'되는 입력 조건이 달라지는 현상을 따로 부르는 이름이 있습니다.","w":"훈련은 정답, 추론은 직전 자기 예측을 넣으므로 생기는 조건 차이를 exposure bias라 합니다.","an":"04.LLM/03_seq2seq_attention 3절 · Teacher forcing과 shift-right","src":"Teacher forcing은 훈련 방법이지 모델 구조의 이름이 아닙니다. 추론 때는 정답을 알 수 없으므로 직전 **자기 예측** 을 넣습니다. 이 훈련과 추론 조건의 차이를 **exposure bias** 라고 부르며, 자유 생성 성능을 별도로 측정해야 하는 이유입니다."},{"id":"t7-05","ty":"mc","lv":2,"game":true,"p":"attention에서 softmax를 적용하는 축은?","o":["hidden 축 H","batch 축 B","vocabulary 축 V","입력 위치 축 T"],"a":3,"h":"attention score는 [B,1,T] 모양으로, 각 query가 입력 위치 T개에 대해 점수를 가집니다. softmax는 이 점수를 위치별 비중으로 바꿔야 하므로, 은닉 차원 H가 아니라 입력 위치를 나타내는 마지막 축에 적용해야 합니다.","w":"score [B,1,T]의 마지막 축인 입력 위치 T에 softmax를 적용해야 위치별 weights가 됩니다.","an":"04.LLM/03_seq2seq_attention 4절 · Attention","src":"- **attention softmax 축 오류** : `H`가 아니라 입력 위치 `T` 축인 마지막 축에 적용해야 각 query가 위치별 비중을 만들 수 있습니다."},{"id":"t7-06","ty":"ox","lv":2,"game":true,"p":"현재 위치의 정답을 같은 위치 입력으로 주면 target leakage(정답 누수)가 된다.","a":true,"h":"teacher forcing에서 decoder 입력으로 직전 정답을 주는 것은 표준 방법입니다. 하지만 현재 위치의 정답을 같은 위치 입력으로 주면 모델이 답을 미리 보게 되므로, target을 오른쪽으로 한 칸 옮기는(shift-right) 이유를 생각해 보세요.","w":"맞습니다. 현재 정답을 입력으로 주면 답을 미리 보는 누수이므로 shift-right를 합니다.","an":"04.LLM/03_seq2seq_attention 3절 · shift-right","src":"현재 위치의 정답을 입력으로 주면 답을 미리 보는 **target leakage(정답 누수)** 가 됩니다. 따라서 target을 오른쪽으로 한 칸 이동합니다."},{"id":"t7-07","ty":"ox","lv":1,"game":true,"p":"attention weight가 가장 큰 위치가 모델 판단의 완전한 이유다.","a":false,"h":"attention weight는 해당 층에서 value 벡터를 섞는 비중(혼합 계수)입니다. 자료는 다른 층, residual 경로, 출력 변환도 결과에 관여한다고 설명하므로, 가장 큰 weight 하나가 판단의 완전한 이유가 될 수 있는지 생각해 보세요.","w":"틀렸습니다. weight는 해당 층의 value 혼합 계수일 뿐 판단의 완전한 이유가 아닙니다.","an":"04.LLM/03_seq2seq_attention 6절 · 자주 생기는 오해","src":"- **\"attention weight가 가장 큰 위치가 모델 판단의 완전한 이유다\"** : weight는 해당 층의 value 혼합 계수입니다. 다른 층, residual 경로와 출력 변환도 결과에 관여합니다."},{"id":"t7-08","ty":"match","lv":2,"game":false,"p":"attention 구성 요소와 역할을 연결하세요.","pairs":[["Query","현재 decoder가 찾는 정보"],["Key","각 위치를 비교할 표지"],["Value","비중에 따라 가져올 내용"],["context","weights로 value를 섞은 결과"]],"h":"attention에서 Query는 현재 decoder가 찾는 정보, Key는 각 입력 위치가 어떤 정보인지 비교할 표지, Value는 선택 비중에 따라 실제로 가져올 내용입니다. 그 비중(weights)으로 Value를 섞은 결과를 context라고 합니다.","w":"Query는 찾는 정보, Key는 비교 표지, Value는 가져올 내용이며 context는 그 가중합입니다.","an":"2일차 슬라이드 · Attention (p.33) · 04.LLM/03_seq2seq_attention 4절","src":"- **Query(Q)** `[B,1,H]`: 현재 decoder가 찾고 있는 정보\n- **Key(K)** `[B,T,H]`: 각 encoder 위치가 어떤 정보인지 비교할 표지\n- **Value(V)** `[B,T,H]`: 선택 비중에 따라 실제로 가져올 내용"},{"id":"t7-09","ty":"order","lv":2,"game":false,"p":"최소 attention 계산 순서를 정렬하세요.","steps":["K를 전치해 [B,H,T]로","Q와 곱해 score [B,1,T]","sqrt(d_k)로 나누기","T 축 softmax로 weights","weights와 V를 곱해 context"],"h":"최소 attention은 Q와 K를 비교할 수 있게 K를 [B,H,T]로 전치하는 것부터 시작합니다. Q와 곱해 score [B,1,T]를 만들고 sqrt(d_k)로 나눈 뒤, T 축 softmax로 weights를 구하고, 마지막에 weights와 V를 곱해 context를 만듭니다.","w":"K 전치 → Q@Kᵀ로 score → sqrt(d_k)로 나누기 → T 축 softmax → weights@V로 context 순서입니다.","an":"04.LLM/03_seq2seq_attention 4절 · 계산 순서","src":"계산은 다음 순서입니다.\n1. `K.transpose(1,2)`는 `[B,T,H] → [B,H,T]`로 바뀝니다."},{"id":"t7-10","ty":"multi","lv":2,"game":false,"p":"teacher forcing과 생성에 대해 맞는 것을 <b>모두<\/b> 고르세요.","o":["teacher forcing은 훈련 방법이다","추론 때는 직전 자기 예측을 넣는다","TF loss가 낮아도 생성은 틀릴 수 있다","teacher forcing은 모델 구조 이름이다","생성 때도 정답을 넣는다"],"a":[0,1,2],"h":"teacher forcing은 모델 구조가 아니라 훈련 방법입니다. 추론 때는 정답 대신 직전 자기 예측을 넣으므로, teacher forcing loss가 낮아도 자유 생성에서는 앞부분의 오류가 뒤로 이어질 수 있어 생성 성능을 따로 측정해야 합니다.","w":"teacher forcing은 훈련 방법이고, 추론에서는 자기 예측을 넣으므로 teacher forcing loss만으로 자유 생성 성공을 판단하지 않습니다.","an":"2일차 슬라이드 · Teacher forcing (p.32) · 04.LLM/03_seq2seq_attention 5절","src":"4번과 5번은 서로 다른 실행 경로입니다. teacher forcing loss만으로 자유 생성 성공을 판단하지 않습니다."}]},{"id":"t8","title":"Transformer에서 Ollama 추론까지","ref":"2일차 p.34–49 · 04·05·06","qs":[{"id":"t8-01","ty":"mc","lv":1,"game":true,"p":"Gemma 같은 현대 텍스트 LLM의 주된 구조는?","o":["encoder-only","decoder-only Transformer","단층 RNN","GRU Seq2Seq"],"a":1,"h":"이번 실습 모델은 encoder-decoder Transformer이지만, 자료는 Gemma와 많은 현대 텍스트 LLM이 주로 다른 구조라고 설명합니다. 하나의 token 시퀀스에 causal self-attention을 써서 다음 token을 계속 예측하며, encoder 없이 decoder만 쓰는 구조입니다.","w":"많은 현대 텍스트 LLM은 decoder-only Transformer로 causal self-attention을 사용해 다음 token을 예측합니다.","an":"04.LLM/04_transformer 2절 · encoder와 decoder","src":"Gemma와 많은 현대 텍스트 LLM은 주로 **decoder-only Transformer** 입니다. 하나의 token 시퀀스에 causal self-attention을 사용해 다음 token을 계속 예측합니다. 따라서 이번 작은 모델은 Transformer의 핵심 연산을 보여 주지만 Gemma의 전체 구조와 동일하지 않습니다."},{"id":"t8-02","ty":"mc","lv":1,"game":true,"p":"causal mask가 차단하는 것은?","o":["과거 위치","현재 위치","미래 위치","PAD 위치"],"a":2,"h":"causal mask와 padding mask는 목적이 다릅니다. padding mask [B,T]는 길이를 맞추려고 넣은 PAD 위치를 무시하고, causal mask [T,T]는 한 출력 위치가 아직 생성되지 않은 뒤쪽 위치를 보지 못하게 막습니다.","w":"causal mask는 한 출력 위치가 미래 위치를 보지 못하게 합니다. PAD를 가리는 것은 padding mask입니다.","an":"2일차 슬라이드 · Transformer (p.34) · 04.LLM/04_transformer 4절","src":"- **causal mask** `[T,T]`: 한 출력 위치가 미래 출력 위치를 보지 못하게 합니다.\n- **padding mask** `[B,T]`: 길이를 맞추려고 넣은 PAD 위치를 attention에서 무시합니다.\n\n이번 데이터는 입력 길이가 모두 같아 padding mask를 생략합니다. 실제 자연어 batch에서는 두 mask가 동시에 필요할 수 있습니다. 둘 다 무언가를 가리지만 shape와 목적이 다릅니다."},{"id":"t8-03","ty":"mc","lv":1,"game":true,"p":"'Gemma 3 1B'에서 1B가 뜻하는 것은?","o":["약 10억 개 파라미터","1바이트 가중치","1번째 버전","1GB 메모리"],"a":0,"h":"모델 이름의 숫자와 B는 모델이 가진 파라미터의 규모를 나타냅니다. B는 영어 billion(10억)의 머리글자이므로, Gemma 3 1B는 대략 몇 개 규모의 파라미터를 가진 모델인지 계산해 보세요.","w":"1B는 대략 10억 개 규모의 파라미터를 뜻합니다.","an":"04.LLM/05_ollama_basics 1절","src":"이 모델의 약 1B는 대략 10억 개 규모의 파라미터를 뜻합니다. `Q4_K_M` 같은 표기는 많은 가중치를 약 4-bit 수준으로 표현한 **양자화(quantization)** 형식입니다. 양자화는 모델 파일과 메모리 사용량을 줄이고 엣지 장치 추론을 가능하게 하지만, 원래 정밀도와 완전히 동일한 계산은 아니며 품질·속도·메모리 사이에 trade-off가 있습니다."},{"id":"t8-04","ty":"mc","lv":2,"game":true,"p":"생성 옵션 temperature가 조절하는 것은?","o":["출력 token 상한","문맥 길이 한도","token 선택 변동성","모델 보관 시간"],"a":2,"h":"Ollama 생성 옵션 중 num_predict는 출력 token 상한, num_ctx는 문맥 길이 한도를 조절합니다. temperature는 다음 token 후보 분포를 평평하게 또는 뾰족하게 쓰는 정도로, token을 고를 때의 변동 폭을 조절하며 낮다고 정확성이 보장되지는 않습니다.","w":"temperature는 token 선택의 변동성을 조절합니다. 낮은 temperature도 정확성을 보장하지 않습니다.","an":"2일차 슬라이드 · 생성 옵션 (p.40)","src":"● temperature는 token 선택의 변동성, num_predict는 출력 token 상한, \nnum_ctx는 문맥 길이 한도를 조절합니다.\n● seed는 같은 환경의 비교 변동을 줄이고, keep_alive는 요청 뒤 모델을 \n메모리에 둘 시간을 제안합니다.\n● seed와 keep_alive는 이전 대화를 저장하는 기능이 아닙니다. 낮은 \ntemperature도 정확성을 보장하지 않습니다."},{"id":"t8-05","ty":"num","lv":2,"game":false,"p":"num_ctx=2048, num_predict=256일 때 입력은 최대 몇 token 이내로 계획하나요?","a":1792,"unit":"token","h":"num_ctx는 입력과 생성을 합친 전체 문맥 한도이고, num_predict는 생성할 출력 token의 상한입니다. 생성 여유를 남기려면 계산식 입력 예산 = num_ctx − num_predict로 입력을 계획합니다.","w":"2048 − 256 = 1,792 token 이내로 입력을 계획하면 생성 여유 256 token을 확보합니다.","an":"2일차 슬라이드 · 길이 제한과 Reset (p.49)","src":"● 예: num_ctx=2048, num_predict=256 → 입력 1,792 이내 + 생성 여유 256 \ntoken으로 계획합니다.\n● 전체 입력을 보존하기 위한 예산입니다. 초과 시 잘림·문맥 이동·오류 처리는 \n환경에 따라 다릅니다. num_predict만 늘려도 문맥 용량은 늘지 않습니다."},{"id":"t8-06","ty":"ox","lv":2,"game":true,"p":"Transformer는 문장 전체를 한 번에 생성한다.","a":false,"h":"Transformer는 훈련할 때 여러 위치를 병렬로 계산할 수 있습니다. 하지만 일반적인 자기회귀 생성은 직전 출력에 의존해 다음 token을 만들므로, 문장 전체가 한 번에 나오는지 token이 하나씩 나오는지 생각해 보세요.","w":"틀렸습니다. 훈련 때는 병렬 계산할 수 있지만 생성은 직전 출력에 의존해 token을 하나씩 만듭니다.","an":"04.LLM/04_transformer 8절 · 자주 생기는 오해","src":"- **\"Transformer는 문장을 한 번에 생성한다\"** : 훈련 시 여러 위치를 병렬 계산할 수 있지만, 일반적인 자기회귀 생성은 직전 출력에 의존해 token을 한 개씩 만듭니다."},{"id":"t8-07","ty":"ox","lv":1,"game":true,"p":"모델 파일 다운로드, 메모리 적재, 추론은 파라미터를 바꾸지 않는다.","a":true,"h":"작업 비교표는 모델 파일 다운로드/pull, 메모리 적재, 추론, 미세조정/훈련을 나란히 놓고 파라미터 변경 여부를 적어 둡니다. gradient와 optimizer로 가중치를 업데이트하는 작업만 파라미터를 바꾼다는 점을 떠올려 보세요.","w":"맞습니다. 다운로드·적재·추론은 파라미터를 바꾸지 않고, 미세조정·훈련만 가중치를 업데이트합니다.","an":"04.LLM/05_ollama_basics 1절 · 표","src":"| 작업 | 파라미터 변경 | 예 |\n|---|---:|---|\n| 모델 파일 다운로드/pull | 아니요 | 준비된 가중치 파일을 저장장치에 복사 |\n| 모델 메모리 적재 | 아니요 | 추론을 위해 가중치를 RAM/GPU에서 사용할 준비 |\n| 추론 | 아니요 | 프롬프트에 대한 token 생성 |\n| 미세조정/훈련 | 예 | gradient와 optimizer로 가중치 업데이트 |"},{"id":"t8-08","ty":"match","lv":1,"game":false,"p":"Ollama 생성 옵션과 뜻을 연결하세요.","pairs":[["temperature","token 선택 변동성"],["num_predict","출력 token 상한"],["num_ctx","문맥 길이 한도"],["keep_alive","요청 뒤 모델을 메모리에 둘 시간"]],"h":"temperature는 token 선택의 변동성, num_predict는 출력 token 상한, num_ctx는 문맥 길이 한도를 조절합니다. keep_alive는 요청이 끝난 뒤 모델을 메모리에 얼마나 남겨 둘지 제안하는 값이며, 이전 대화를 저장하는 기능은 아닙니다.","w":"temperature는 변동성, num_predict는 생성 상한, num_ctx는 문맥 길이, keep_alive는 메모리 유지 시간입니다.","an":"2일차 슬라이드 · 생성 옵션 (p.40)","src":"● temperature는 token 선택의 변동성, num_predict는 출력 token 상한, \nnum_ctx는 문맥 길이 한도를 조절합니다.\n● seed는 같은 환경의 비교 변동을 줄이고, keep_alive는 요청 뒤 모델을 \n메모리에 둘 시간을 제안합니다.\n● seed와 keep_alive는 이전 대화를 저장하는 기능이 아닙니다. 낮은 \ntemperature도 정확성을 보장하지 않습니다."},{"id":"t8-09","ty":"order","lv":2,"game":false,"p":"LLM이 서비스에 쓰이기까지의 단계를 정렬하세요.","steps":["사전학습(pretraining)","미세조정(fine-tuning)","instruction tuning","선호 정렬(alignment)","추론(inference)"],"h":"실제 LLM은 먼저 매우 많은 텍스트로 일반적인 언어 패턴을 배우는 비용이 큰 단계를 거칩니다. 그다음 특정 분야에 맞추는 미세조정, 지시를 따르게 하는 instruction tuning, 선호 신호로 답변을 다듬는 정렬을 거쳐, 마지막에 추론으로 사용됩니다.","w":"사전학습 → 미세조정 → instruction tuning → 선호 정렬 → 추론 순서이며, 실습의 Ollama는 마지막 추론만 수행합니다.","an":"04.LLM/04_transformer 7절 · 사전학습 LLM 사용으로","src":"1. **사전학습(pretraining)** : 매우 많은 텍스트에서 다음 token 예측 같은 목표로 일반적인 언어 패턴과 지식을 학습합니다. 데이터·계산 비용이 큽니다.\n2. **미세조정(fine-tuning)** : 특정 분야 데이터나 원하는 작업 형식에 맞춰 사전학습 파라미터를 추가로 조정합니다.\n3. **instruction tuning** : 지시와 적절한 답 형식의 예제로 사용자의 요청을 따르는 능력을 조정하는 미세조정 방식입니다.\n4. **선호 정렬(alignment)** : 사람 또는 모델의 선호 신호를 이용해 답변 행동을 더 조정할 수 있습니다. 구체적인 알고리즘은 모델마다 다릅니다."},{"id":"t8-10","ty":"multi","lv":2,"game":true,"p":"Python 대화 이력에 대해 맞는 것을 <b>모두<\/b> 고르세요.","o":["기억은 이전 messages 재전송","reset은 client 이력만 비움","성공한 대화만 이력에 확정","reset은 모델 가중치 삭제","서버가 대화를 자동 저장"],"a":[0,1,2],"h":"Chat API는 보낸 messages만 문맥으로 쓰므로, 대화를 이어 가려면 client가 이전 user·assistant 메시지를 다시 넣어 보냅니다. reset은 client 이력을 비울 뿐 서버나 가중치에 영향이 없고, 실패한 요청은 이력에 확정하지 않습니다.","w":"대화 기억은 이전 messages를 다시 보내는 것이고, reset은 client 이력만 비우며, 성공한 대화만 이력에 확정합니다.","an":"2일차 슬라이드 · p.45–49 · 04.LLM/06_ollama_python","src":"● API 요청은 보낸 messages를 문맥으로 사용합니다. 이전 요청이 자동으로 \n다음 요청에 포함되는 것은 아닙니다.\n● 이력을 유지하려면 이전 user와 assistant 메시지를 새 질문 앞에 넣습니다.\n● 서버에 모델이 적재되어 있다는 사실과 client가 대화 내용을 보존하는 것은 \n서로 다른 상태입니다.\n● ‘추가 token 입력’은 vocabulary 확장이 아니라 입력 길이 증가입니다. system \n지시·이전 대화·현재 질문·채팅 구분 token이 문맥을 사용합니다.\n● 함께 해석하기: 이 실습의 대화 문맥은 client가 messages에 포함해 다시 \n보내는 정보입니다."}]}]};

/* ── 저장소 (실패해도 동작) ─────────────── */
const KEY='qb:'+BANK.id+':v1';
const blank=()=>({name:'',tabs:{},wrong:{},board:[],drafts:{}});  // drafts: 채점 전 탭별 풀던 답
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const gameUnlocked=()=>Object.keys(S.tabs).length>0;
const allGraded=()=>TABS.every(t=>S.tabs[t.id]);

/* 순위 저장소 — 공유 순위로 바꿀 때 이 객체만 교체 */
// 순위는 같은 조건(게임 모드 + 풀이 시간)끼리만 비교한다. key = 'timeattack:10'
const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);

function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
