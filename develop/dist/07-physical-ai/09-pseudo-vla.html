'use strict';
const BANK={"id":"pai-pvla","code":"PPV","title":"Physical AI 4일차 · 좌표 기반 Pseudo-VLA","subtitle":"규칙·VLM 손 추종 · 지연·TTL · YOLO pose → LLM → ROS","course":"07 · Physical AI","source":"07-NEPES_physicalAI_자율주행자동차/09.Pseudo-VLA_v2/*.ipynb + ____/_____4___v2.pdf","salt":"pai-pvla","version":1,"updated":"2026-10-15","tabs":[{"id":"t1","title":"규칙 기반 손 추종과 좌표 매핑","ref":"01 · 슬라이드 p.12–27","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"규칙 기반 손 추종에서 손 중심은 어느 관절들의 평균인가요?","o":["0·4·8·12·16번","0·5·9·13·17번","손끝 5개","21개 전체"],"a":1,"h":"손 중심은 손끝을 빼고 손바닥을 이루는 관절들의 평균으로 계산합니다. 손끝까지 평균내면 손가락을 펴고 접는 것만으로 목표가 크게 흔들리기 때문입니다. 손목(0번)과 각 손가락 뿌리 번호를 떠올려 보세요.","w":"손바닥을 이루는 0·5·9·13·17번의 평균입니다. 손끝까지 평균내면 손가락 동작만으로 목표가 크게 흔들립니다.","an":"슬라이드 p.14·20","src":"hand_observation은 손이 정확히 하나이고 21개 좌표가 유효할 때 손바닥 중심을 계산합니다. 손끝까지 평균내면 손가락을 펴고 접는 것만으로 목표가 크게 흔들릴 수 있으므로 손바닥을 이루는 0·5·9·13·17번을 사용합니다."},{"id":"t1-02","ty":"mc","lv":2,"game":true,"p":"정규화 좌표 [0.2, 0.3]의 turtlesim 목표는? (mirror=false)","o":["(2.8, 7.3)","(2.8, 3.7)","(8.2, 7.3)","(1.2, 0.3)"],"a":0,"h":"target_xy는 x를 1+9x로, y는 영상 y축이 아래로 증가하므로 1+9(1−y)로 바꿉니다. mirror=false이니 x는 그대로 쓰고 x=0.2, y=0.3을 각각 식에 대입해 보세요.","w":"1+9×0.2=2.8, 1+9×(1−0.3)=7.3입니다. 영상 y는 아래로, turtlesim y는 위로 증가하므로 y를 반전합니다.","an":"슬라이드 p.14·22","src":"target_xy([x,y])는 (1+9x, 1+9(1-y))를 반환합니다. mirror=True이면 x \n대신 1-x를 사용합니다. 예를 들어 [0.2,0.3]은 (2.8,7.3)"},{"id":"t1-03","ty":"num","lv":3,"game":false,"p":"같은 좌표 [0.2, 0.3]에 mirror=true를 적용하면 목표 x는?","a":8.2,"unit":"","h":"mirror=true이면 x 대신 1−x를 사용하고 y 변환은 그대로입니다. 계산식은 목표 x = 1 + 9 × (1 − 0.2)이며, 화면 좌우를 뒤집은 위치가 거북이 목표가 됩니다.","w":"mirror=True면 x 대신 1−x를 씁니다. 1+9×0.8=8.2이고 y 값은 그대로입니다.","an":"슬라이드 p.22","tol":1e-06,"src":"target_xy([x,y])는 (1+9x, 1+9(1-y))를 반환합니다. mirror=True이면 x 대신 1-x를 사용합니다. 예를 들어 [0.2,0.3]은 (2.8,7.3), 미러링하면 (8.2,7.3)입니다."},{"id":"t1-04","ty":"mc","lv":2,"game":true,"p":"영상 좌표와 turtlesim 좌표의 y축 관계로 옳은 것은?","o":["둘 다 아래로 증가","영상 아래·거북이 위로 증가","둘 다 위로 증가","영상 위·거북이 아래로 증가"],"a":1,"h":"영상 좌표는 왼쪽 위가 원점이라 y가 화면 아래쪽으로 갈수록 커지지만, turtlesim은 수학 좌표처럼 위쪽으로 갈수록 y가 커집니다. 그래서 목표 y를 계산할 때 (1−y)로 뒤집어 줍니다.","w":"영상 y는 아래로, turtlesim y는 위로 증가합니다. y 반전과 x 미러링은 서로 다른 변환입니다.","an":"슬라이드 p.20","src":"- 영상 y는 아래로, turtlesim y는 위로 증가합니다."},{"id":"t1-05","ty":"mc","lv":2,"game":true,"p":"규칙 controller에서 손 모양(FIST/NON_FIST)이 정하는 것은?","o":["이동 방향","목표 좌표","이동 허용 여부","회전 속도"],"a":2,"h":"규칙 controller는 손 위치와 손 모양의 역할을 분리합니다. 손 위치(좌표)는 거북이가 갈 목표를 정하고, 손 모양은 방향이 아니라 지금 움직여도 되는지를 정합니다. 주먹이면 좌표가 있어도 정지합니다.","w":"손 모양은 이동 허용 여부를, 손 위치는 목표를 정합니다. 좌표가 있어도 주먹·도착·만료면 정지합니다.","an":"슬라이드 p.13·17","src":"손 모양은 이동 허용 여부를, 손 위치는 목표를 정합니다. 좌표가 있어도 주먹·도착·시간 만료라면 정지합니다."},{"id":"t1-06","ty":"ox","lv":2,"game":true,"p":"handedness 점수는 주먹 판정의 confidence로 사용할 수 있다.","a":false,"h":"handedness 점수는 '왼손인지 오른손인지'라는 다른 질문에 대한 점수입니다. 이를 주먹 판정의 신뢰도로 바꿔 쓰면 다른 질문의 점수를 끌어다 쓰는 셈이 되며, 점수를 임의로 1.0으로 만드는 것도 금지합니다.","w":"틀렸습니다. handedness는 왼손/오른손 점수이지 주먹 판정 confidence가 아닙니다. 점수를 임의로 1.0으로 만들지도 않습니다.","an":"슬라이드 p.18","src":"● 손가락 거리비는 교육용 휴리스틱입니다.\n● 주먹이 아닌 모양을 방향 명령으로 분류하지 않습니다.\n● handedness 점수는 주먹 판정 confidence가 아닙니다.\n● 점수를 임의로 1.0으로 만들지 않습니다.\n● 함께 해석하기: 다른 질문의 점수를 바꾸어 쓰는 것입니다."},{"id":"t1-07","ty":"ox","lv":1,"game":true,"p":"주먹을 쥐면 좌표가 남아 있어도 거북이는 정지한다.","a":true,"h":"손 모양은 이동 허용 여부를 정하므로, 주먹·도착·시간 만료 중 하나라도 해당하면 좌표가 남아 있어도 이동하지 않습니다. 이때 overlay에는 빨간 점과 STOP이 나타납니다.","w":"맞습니다. 주먹을 쥐면 좌표가 남아도 빨간 점과 STOP이 나타납니다.","an":"슬라이드 p.17","src":"손 모양은 이동 허용 여부를, 손 위치는 목표를 정합니다. 좌표가 있어도 주먹·도착·시간 만료라면 정지합니다.\n\n같은 손 위치에서 mirror만 바꾸면 목표 x가 반대쪽으로 바뀝니다. 주먹을 쥐면 좌표가 남아도 빨간 점과 STOP이 나타납니다."},{"id":"t1-08","ty":"match","lv":1,"game":false,"p":"overlay 표시와 의미를 연결하세요.","pairs":[["초록 점","전진·회전 중"],["빨간 점","좌표가 있지만 정지 중"],["NO TARGET","좌표가 없음"],["reason","도착·주먹·만료 구분"]],"h":"/vla/image_overlay에서 점의 색은 이동 상태를 나타내어 초록은 움직이는 중, 빨강은 좌표가 있지만 멈춘 상태입니다. 좌표 자체가 없으면 별도 문구가 뜨고, 왜 멈췄는지(도착·주먹·만료)는 reason 필드로 구분합니다.","w":"/vla/image_overlay에서 초록은 이동, 빨강은 좌표가 있는 정지, NO TARGET은 좌표 없음입니다. 정지 이유는 reason으로 구분합니다.","an":"슬라이드 p.16","src":"**화면 읽기:** /vla/image_overlay의 초록색 점은 전진·회전 중, 빨간색 점은 좌표가 있지만 정지 중입니다. 좌표가 없으면 NO TARGET입니다."},{"id":"t1-09","ty":"order","lv":2,"game":false,"p":"규칙으로 손 위치를 추종하는 흐름을 맞추세요.","steps":["영상에서 손 점 관측","손 상태 규칙으로 FOLLOW/STOP","목표 좌표로 변환","pose와 거리 검사","회전·전진·정지 속도 제어"],"h":"규칙 controller는 관측 → 판단 → 변환 → 검사 → 제어 순으로 진행합니다. 먼저 영상에서 손 점을 얻고, 손 상태로 FOLLOW/STOP을 정한 뒤, 목표를 turtlesim 좌표로 바꾸고, 현재 pose와 거리를 비교해 마지막에 속도를 냅니다.","w":"손 점을 관측하고 손 상태로 이동 허용을 판단한 뒤 목표 좌표로 변환하고, 현재 pose와 비교해 속도를 정합니다.","an":"슬라이드 p.13","src":"1. 영상·손 점\n관측 좌표 생성\n2. 손 상태 규칙\nFOLLOW / STOP\n3. 목표 좌표 변환\n영상 → turtlesim\n4. pose·거리 검사\n현재 위치와 비교\n5. 속도 제어\n회전·전진·정지"},{"id":"t1-10","ty":"multi","lv":2,"game":true,"p":"규칙 controller가 정지하는 경우를 모두 고르세요.","o":["주먹","손 없음","불확실한 관측","오래된 입력","화면 오른쪽의 비주먹 한 손"],"a":[0,1,2,3],"h":"규칙 controller는 비주먹 한 손이 확실할 때만 손 중심을 목표로 이동합니다. 그 외에 손 모양이 주먹이거나, 손이 보이지 않거나, 판단이 불확실하거나, 입력이 오래된 경우는 모두 정지 쪽으로 처리합니다.","w":"주먹·손 없음·불확실·오래된 입력은 정지합니다. 비주먹 한 손은 위치와 상관없이 목표로 이동합니다.","an":"슬라이드 p.12","src":"● 비주먹 한 손이면 손 중심을 목표로 이동합니다.\n● 목표 방향으로 회전한 뒤 전진하고 도착하면 정지합니다.\n● 주먹·손 없음·불확실·오래된 입력도 정지합니다."}]},{"id":"t2","title":"VLM 손 판단 JSON 계약","ref":"02 · 슬라이드 p.28–45","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"손 판단 JSON의 command에 허용되는 값은?","o":["FOLLOW·STOP","GO·WAIT","LEFT·RIGHT","YES·NO"],"a":0,"h":"손 판단 JSON은 command, hand_state, frame_id, reason 네 필드로 고정된 엄격한 계약입니다. command에는 '이동을 허용한다'와 '멈춘다'에 해당하는 두 값만 허용되며 속도나 좌표를 모델이 만들지 않습니다.","w":"command는 FOLLOW 또는 STOP만 허용합니다. 좌표와 속도는 모델에게 요청하지 않습니다.","an":"슬라이드 p.29","src":"● 필드는 command, hand_state, frame_id, reason입니다.\n● command는 FOLLOW 또는 STOP만 허용합니다."},{"id":"t2-02","ty":"mc","lv":2,"game":true,"p":"FOLLOW가 허용되려면 hand_state가 무엇이어야 하나요?","o":["FIST","NO_HAND","NON_FIST","UNKNOWN"],"a":2,"h":"FOLLOW 명령은 손 상태와 의미가 맞아야만 통과합니다. {command:FOLLOW, hand_state:FIST}처럼 주먹인데 추종하라는 조합은 형식이 맞아도 모순이라 None으로 거부되므로, 추종에는 주먹이 아닌 상태가 짝지어져야 합니다.","w":"FOLLOW에는 hand_state=NON_FIST가 필요합니다. FIST인데 FOLLOW인 응답은 모순이라 거부합니다.","an":"슬라이드 p.29·31","src":"● FOLLOW는 hand_state=NON_FIST와 함께만 허용합니다."},{"id":"t2-03","ty":"mc","lv":2,"game":true,"p":"중복 key를 먼저 거부하기 위해 쓰는 json.loads의 옵션은?","o":["object_hook","object_pairs_hook","parse_float","strict"],"a":1,"h":"보통 json.loads로 dict를 만들면 같은 key가 두 번 나온 흔적이 사라지고 뒤 값만 남습니다. 그래서 parse_hand_decision은 dict로 합치기 전에 key/value 쌍 목록을 받아보는 훅 옵션을 써서 중복 command를 거부합니다.","w":"object_pairs_hook으로 중복 key를 먼저 거부하고, 이어서 필드 개수·타입·허용값·관계를 검사합니다.","an":"슬라이드 p.40","src":"보통 json.loads로 dict를 만들면 동일 key가 두 번 나온 흔적이 사라지고 뒤 값이 남을 수 있습니다. parse_hand_decision은 object_pairs_hook으로 key/value 쌍을 검사해 command가 중복된 모호한 응답을 거부합니다."},{"id":"t2-04","ty":"mc","lv":3,"game":true,"p":"{command: STOP, hand_state: NON_FIST} 조합에 대한 parser의 처리는?","o":["모순이라 거부","보수적 정지로 허용","FOLLOW로 바꿈","재요청을 보냄"],"a":1,"h":"FOLLOW+FIST는 의미가 모순되어 None으로 거부되지만, 반대로 STOP과 NON_FIST 조합은 손이 열려 있어도 멈추겠다는 뜻이라 안전 쪽 판단일 수 있습니다. 그래서 parser는 이 조합을 금지하지 않습니다.","w":"STOP과 NON_FIST는 보수적인 정지일 수 있어 parser가 금지하지 않습니다. 파서의 승인 범위와 모델 정확도는 따로 읽습니다.","an":"슬라이드 p.40","src":"문법적으로 정상인 {command:FOLLOW, hand_state:FIST} 관계는 의미가 모순되므로 None입니다. 반대로 STOP과 NON_FIST의 조합은 보수적인 정지일 수 있어 parser가 금지하지 않습니다."},{"id":"t2-05","ty":"mc","lv":2,"game":true,"p":"정상 비주먹 손인데 모델이 STOP을 반환했다면 평가 분류는?","o":["잘못된 추종 허용","형식 오류","시간 초과","불필요한 정지"],"a":3,"h":"평가에서는 오류를 방향별로 나눕니다. 주먹·손 없음인데 FOLLOW이면 잘못된 추종 허용이고, 반대로 추종해야 할 정상 비주먹 손에서 멈추라는 판단이 나오면 정지가 필요 없었던 경우로 분류합니다.","w":"정상 비주먹인데 STOP이면 불필요한 정지입니다. 주먹·손 없음인데 FOLLOW이면 잘못된 추종 허용입니다.","an":"슬라이드 p.37","src":"● 주먹·손 없음인데 FOLLOW이면 잘못된 추종 허용입니다.\n● 정상 비주먹인데 STOP이면 불필요한 정지입니다."},{"id":"t2-06","ty":"ox","lv":2,"game":true,"p":"VLM 서버에 JSON schema를 전달하면 로컬 parser 검사는 생략해도 된다.","a":false,"h":"서버에 schema를 전달해도 애플리케이션 검증이 끝나는 것은 아닙니다. HTTP가 성공해도 message.content가 잘못된 JSON일 수 있고, JSON이 올바르더라도 실제 주먹을 NON_FIST로 오판할 수 있으므로 로컬 parser가 계속 검사합니다.","w":"틀렸습니다. schema를 요청해도 message.content가 잘못된 JSON일 수 있으므로 로컬 parser가 다시 검사합니다.","an":"슬라이드 p.38","src":"HAND_SCHEMA는 command·hand_state·frame_id·reason 네 필드의 형식을 요구합니다. 서버에 schema를 전달했다고 애플리케이션 검증이 끝나는 것은 아닙니다. HTTP가 성공해도 message.content가 잘못된 JSON일 수 있고, JSON이 올바르더라도 실제 주먹을 NON_FIST로 오판할 수 있습니다."},{"id":"t2-07","ty":"ox","lv":2,"game":true,"p":"02 단계에서는 JSON에 FOLLOW가 있어도 거북이에 속도를 보내지 않는다.","a":true,"h":"02 단원은 모델 응답을 읽고 형식과 의미를 검증하는 단계일 뿐, 실제 제어는 다음 실습(03)에서 이루어집니다. 그래서 JSON에 이동 허용 명령이 들어 있어도 아직 거북이 속도 명령으로 연결하지 않습니다.","w":"맞습니다. 02는 모델 응답을 읽고 검증하는 단계이며 실제 제어는 03에서 합니다.","an":"슬라이드 p.28·33","src":"이 단원은 모델 응답을 읽는 단계입니다. JSON에 FOLLOW가 있어도 아직 거북이에 속도를 보내지 않습니다."},{"id":"t2-08","ty":"match","lv":2,"game":false,"p":"손 판단 JSON 필드와 의미를 연결하세요.","pairs":[["command","FOLLOW 또는 STOP"],["hand_state","NON_FIST·FIST·NO_HAND·UNKNOWN"],["frame_id","이미지와 좌표를 잇는 ID"],["reason","설명 문장(제어 코드 아님)"]],"h":"command는 이동 허용/정지 명령, hand_state는 손 모양 상태(주먹 여부와 손 없음·불확실 포함)를 담습니다. frame_id는 이미지와 좌표를 같은 관측으로 잇는 식별자이고, reason은 사람이 읽는 설명일 뿐 제어 코드가 아닙니다.","w":"필드는 command·hand_state·frame_id·reason 네 개입니다. reason은 설명이며 제어 코드가 아니고, 자기 보고 confidence는 요구하지 않습니다.","an":"슬라이드 p.29–30","src":"● frame_id는 이미지와 좌표를 \n연결합니다.\n● 손 상태: NON_FIST · FIST\n● 그 외 상태: NO_HAND · UNKNOWN\n● reason은 설명이며 제어 코드가 \n아닙니다."},{"id":"t2-09","ty":"order","lv":2,"game":false,"p":"이동 전에 VLM 판단을 검증하는 순서를 맞추세요.","steps":["고정 이미지의 기대 기준 정하기","판단 범위를 지정한 prompt 구성","실제 픽셀로 VLM 요청","JSON 응답 계약 검사","장면과 대조해 평가 기록"],"h":"검증은 기준 → 요청 → 형식 → 의미 순서로 진행합니다. 먼저 고정 이미지의 기대 결과를 정하고, 판단 범위를 제한한 prompt로 실제 픽셀을 VLM에 보낸 뒤, 응답 JSON 계약을 검사하고 마지막에 장면과 대조해 기록합니다.","w":"기대 기준을 먼저 정하고 prompt로 요청한 뒤 JSON을 검사하고, 장면과 대조해 잘못된 FOLLOW·STOP을 기록합니다.","an":"슬라이드 p.28","src":"1. 고정 이미지 \n기대 기준 정하기\n2. prompt 구성\n판단 범위 지정\n3. VLM 요청\n실제 픽셀 입력\n4. JSON 검사\n응답 계약 확인\n5. 장면과 대조\n형식·의미 분리\n6. 평가 기록\n잘못된 FOLLOW·STOP"},{"id":"t2-10","ty":"multi","lv":2,"game":true,"p":"parser가 <b>거부<\/b>하는 응답을 모두 고르세요.","o":["JSON 앞뒤에 붙은 설명문","중복 key","FIST인데 FOLLOW","추가 key","FOLLOW + NON_FIST 정상"],"a":[0,1,2,3],"h":"parser는 형식·key·관계 세 층을 모두 검사합니다. JSON 앞뒤의 설명문이나 code fence, 중복·누락·추가 key, 잘못된 타입은 형식 단계에서 거부되고, 주먹 상태에 추종 명령이 붙은 모순도 의미 단계에서 거부됩니다.","w":"앞뒤 설명·code fence·중복/누락/추가 key·모순 관계는 거부합니다. FOLLOW와 NON_FIST의 정상 조합은 통과합니다.","an":"슬라이드 p.31","src":"● JSON 앞뒤 설명·code fence·객체 두 개를 거부합니다.\n● 중복·누락·추가 key와 잘못된 타입을 거부합니다.\n● FIST인데 FOLLOW인 모순된 응답도 거부합니다."}]},{"id":"t3","title":"VLM 판단을 ROS 행동으로","ref":"03 · 슬라이드 p.46–60","qs":[{"id":"t3-01","ty":"mc","lv":2,"game":true,"p":"VLM 모드에서 최종 이동 여부를 결정하는 것은?","o":["VLM 응답 그 자체","검사를 마친 제어기","카메라 노드","launch 파일"],"a":1,"h":"VLM 모드에서 모델의 FOLLOW/STOP은 '이동 제안'에 불과합니다. 최종 행동은 관측이 충분히 신선한지, 거북이 pose가 유효한지 등 시간·상태 검사를 모두 거친 쪽이 결정합니다.","w":"모델 판단은 제안이고, 관측 신선도와 거북이 상태까지 검사한 제어기가 최종 행동을 결정합니다.","an":"슬라이드 p.47","src":"모델 판단은 이동 제안입니다. 최종 행동은 관측의 신선도와 거북이 상태까지 검사한 제어기가 결정합니다."},{"id":"t3-02","ty":"mc","lv":2,"game":true,"p":"판단의 frame_id가 관측 frame과 다르면 제어기는?","o":["이전 좌표로 이동","목표가 있어도 STOP","판단을 새 좌표에 적용","TTL을 연장"],"a":1,"h":"좌표와 VLM 판단은 같은 이미지에서 나와야 하므로 둘의 frame_id가 일치해야 합니다. ID가 다르면 시간 관계가 맞지 않는 결합이므로 이전 FOLLOW 승인을 새 손 좌표에 재사용하지 않고, 목표 좌표가 있더라도 정지합니다.","w":"ID가 다르면 목표가 있어도 STOP입니다. frame_id 검사를 빼면 과거 판단을 새 좌표에 붙일 수 있습니다.","an":"슬라이드 p.57–58·64","src":"● 좌표와 VLM 판단의 frame_id가 \n일치해야 합니다.\n● 이전 FOLLOW 승인을 새 손 좌표에 \n재사용하지 않습니다.\n● ID 불일치는 목표가 있어도 \nSTOP입니다."},{"id":"t3-03","ty":"mc","lv":1,"game":true,"p":"목표까지 거리가 얼마 이하이면 도달 STOP인가요?","o":["0.05","0.5","1.2","0.15"],"a":3,"h":"목표까지 거리는 hypot으로 계산하고, 그 거리가 정해진 도착 반경 이하이면 target_reached로 정지합니다. 1.2는 선속도 상한, 1.5는 각속도 상한, 0.6은 회전 분기 기준이므로 혼동하지 마세요.","w":"목표 거리 ≤0.15이면 도달 STOP입니다.","an":"슬라이드 p.15·22","src":"● 목표−현재 pose에서 거리와 방향 오차를 구합니다.\n● 각도 차이가 크면 제자리 회전 후 전진합니다.\n● 선속도 ≤1.2, 각속도 절댓값 ≤1.5로 제한합니다.\n● 목표 거리 ≤0.15이면 도달 STOP입니다."},{"id":"t3-04","ty":"mc","lv":2,"game":true,"p":"이 제어기의 선속도 상한 / 각속도 절댓값 상한은?","o":["1.2 / 1.5","0.8 / 1.2","1.5 / 1.2","2.0 / 3.0"],"a":0,"h":"제어기는 계산된 속도를 그대로 내보내지 않고 상한으로 자릅니다. 선속도는 0 이상 일정 값 이하로, 각속도는 −a~a 대칭 범위로 제한하므로 각속도 범위의 절댓값을 함께 확인하세요.","w":"선속도 ≤1.2, 각속도 절댓값 ≤1.5로 제한합니다. 각도 오차가 크면 제자리 회전 후 전진합니다.","an":"슬라이드 p.15","src":"● 선속도 ≤1.2, 각속도 절댓값 ≤1.5로 제한합니다."},{"id":"t3-05","ty":"mc","lv":3,"game":true,"p":"여러 거부 조건이 동시에 있을 때 반환되는 reason은?","o":["가장 심각한 이유","마지막 검사의 이유","처음 걸린 검사의 이유","모든 이유의 목록"],"a":2,"h":"follow_motion의 검사는 코드에 쓰인 순서(촬영 age → 승인 TTL → pose age → 판정 형식 → frame 일치 …)대로 진행됩니다. 앞 검사에서 걸리면 뒤 검사는 실행되지 않으므로, 여러 문제가 동시에 있으면 가장 먼저 실패한 분기의 reason이 보입니다.","w":"처음 걸린 reason이 반환됩니다. 그래서 합성 비교에서는 조건을 하나씩만 바꿔 각 분기를 따로 드러냅니다.","an":"슬라이드 p.55","src":"검사는 코드에 쓰인 순서대로 진행됩니다. 여러 문제가 동시에 있으면 처음 걸린 reason이 반환됩니다. 예를 들어 판정 frame도 잘못되고 TTL도 만료라면 expired가 먼저 보일 수 있습니다."},{"id":"t3-06","ty":"ox","lv":2,"game":true,"p":"50ms timer는 새 추론 없이도 현재 승인의 만료를 검사한다.","a":true,"h":"ROS 노드는 느린 추론을 맡는 worker와 50ms 제어 timer를 분리합니다. tick은 future.done()이 참일 때만 결과를 가져오므로 모델이 처리 중이어도 기존 승인에 대한 시간 검사와 속도 발행을 계속할 수 있습니다.","w":"맞습니다. 모델이 처리 중이어도 timer가 기존 승인의 시간 검사와 속도 발행을 계속합니다.","an":"슬라이드 p.53","src":"Future는 나중에 완료될 작업의 핸들입니다. tick은 future.done()이 참일 때만 result()로 반환값을 가져옵니다. 따라서 모델이 처리 중이어도 기존 승인에 대한 시간 검사와 속도 발행은 계속할 수 있습니다."},{"id":"t3-07","ty":"ox","lv":2,"game":true,"p":"20Hz timer가 tick마다 issued_ms를 갱신해야 승인이 유지된다.","a":false,"h":"issued_ms는 승인이 발급된 시각으로, worker가 새 판단 결과를 회수할 때만 바뀝니다. 20Hz timer는 같은 승인에 대해 follow_motion을 반복 호출할 뿐 새 승인을 만들지 않으며, 매 tick 갱신하면 TTL 만료가 영원히 일어나지 않습니다.","w":"틀렸습니다. timer가 새 승인을 만들지 않으며, issued_ms를 매 tick 갱신하면 오래된 판단으로 계속 움직이게 됩니다.","an":"슬라이드 p.56·58","src":"ROS 노드는 영상 추론 worker와 제어 timer를 분리합니다. worker가 관측·판단·발급 시각을 갱신하고 timer는 같은 승인에 대해 follow_motion을 반복 호출합니다. 최종 command뿐 아니라 reason을 읽어 모델 STOP, 검사 거부, 목표 도착을 구분합니다.\n\n모드를 바꾸기 전에 이전 제어기를 종료합니다. frame_id 검사를 제거하면 과거 판단을 새 좌표에 붙일 수 있습니다. 20Hz timer가 새 승인을 만들지는 않으며 issued_ms를 매 tick 갱신하면 안 됩니다."},{"id":"t3-08","ty":"match","lv":2,"game":false,"p":"정지 원인과 의미를 연결하세요.","pairs":[["모델 STOP","모델이 주먹 등을 보고 정지 판단"],["검사 거부 STOP","malformed·wrong frame·timeout"],["목표 도달","남은 거리가 0.15 이하"],["pose 중단","거북이 위치 갱신이 끊김"]],"h":"같은 0 속도라도 원인이 다릅니다. 모델 STOP은 모델이 주먹 등을 보고 내린 판단이고, 검사 거부는 형식 오류·frame 불일치·시간 초과 때문이며, 목표 도달은 남은 거리 기준, pose 중단은 거북이 위치 갱신이 끊긴 경우입니다.","w":"모델 STOP, 형식·시간 검사 거부, 목표 도달, pose 중단은 서로 다른 정지 원인이므로 reason으로 구분합니다.","an":"슬라이드 p.48","src":"● 주먹을 보고 모델이 STOP을 반환한 이유를 확인합니다.\n● malformed·wrong frame·timeout의 거부를 따로 확인합니다.\n● 목표 도달과 pose 중단도 서로 다른 정지 원인입니다.\n● 같은 0 속도라도 결과의 의미는 다릅니다."},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"VLM 판단을 제어 전에 승인하는 흐름을 맞추세요.","steps":["같은 frame의 영상과 손 좌표","VLM의 FOLLOW/STOP 판단","시간과 frame 검사","pose와 목표 검사","검사 통과 시 제어기 실행"],"h":"VLM 판단도 규칙 모드와 같은 목표 제어기를 씁니다. 같은 frame의 영상·좌표에서 VLM이 FOLLOW/STOP을 내면, 시간과 frame을 대조하고 pose·목표를 검사한 뒤 통과했을 때만 제어기가 이동시킵니다.","w":"같은 frame의 좌표와 판단을 시간·frame 검사로 대조하고 pose와 목표를 확인한 뒤에만 제어기가 움직입니다.","an":"슬라이드 p.46","src":"1. 영상·손 좌표\n같은 frame으로\n2. VLM 판단\nFOLLOW / STOP\n3. 시간·frame 검사\n관측과 승인 대조\n4. pose·목표 검사\n유효한 현재 상태\n5. 제어기 실행\n검사 통과 시 이동"},{"id":"t3-10","ty":"multi","lv":2,"game":true,"p":"제어기가 매 tick 검사하는 시간 조건을 모두 고르세요.","o":["촬영 age","승인 TTL","pose age","모델 파일 크기","Ollama 버전"],"a":[0,1,2],"h":"제어기는 매 tick 세 가지 시각을 따로 검사합니다. 관측(영상)이 언제 찍혔는지, 판단 승인이 아직 유효한지, 거북이 상태(Pose)가 언제 수신됐는지이며, 하나라도 오래되면 STOP합니다.","w":"촬영 age → 승인 TTL → pose age를 검사합니다. 모델 파일 크기나 서버 버전은 시간 조건이 아닙니다.","an":"슬라이드 p.55·60","src":"● 촬영 age → 승인 TTL → pose age를 검사합니다."}]},{"id":"t4","title":"지연과 Latest-only mailbox","ref":"04 · 슬라이드 p.61–66·135","qs":[{"id":"t4-01","ty":"num","lv":2,"game":false,"p":"30fps 카메라에서 VLM 추론이 3초 걸리면 추론 중 약 몇 장의 프레임이 들어오나요?","a":90,"unit":"장","h":"30fps 카메라는 1초에 약 30장을 보냅니다. 계산식은 들어오는 장 수 = 30(장/초) × 3(초)이며, 이 장들을 모두 순서대로 처리하면 점점 과거 장면을 분석하게 되므로 최신 한 장만 기다리게 합니다.","w":"30×3=90장입니다. 모든 장을 순서대로 처리하면 과거 장면을 분석하게 되므로 최신 한 장을 기다리는 정책을 씁니다.","an":"슬라이드 p.61","src":"● 30fps 카메라는 1초에 약 30장을 \n보냅니다.\n● VLM이 3초 걸리면 추론 중 약 \n90장이 들어옵니다."},{"id":"t4-02","ty":"mc","lv":2,"game":true,"p":"Latest-only mailbox에서 put의 동작은?","o":["대기 값을 새 입력으로 교체","대기열 끝에 추가","진행 중 추론 취소","대기 프레임 삭제만"],"a":0,"h":"Latest-only mailbox에는 대기 칸이 한 장뿐입니다. put을 호출하면 이미 기다리던 값을 쌓아 두지 않고 새로 들어온 입력 한 장으로 바꿔 넣으며(오래된 입력은 거부, 깊은 복사로 보관), 그래서 FIFO처럼 큐가 쌓이지 않습니다.","w":"put은 대기 중인 값을 새 입력 한 장으로 교체합니다. 오래된 프레임은 거부하고 새 입력은 깊은 복사로 보관합니다.","an":"슬라이드 p.62·76","src":"● put: 대기 중인 값을 새 입력 한 장으로 교체합니다.\n● take: 대기 프레임을 꺼내고 칸을 비웁니다."},{"id":"t4-03","ty":"mc","lv":2,"game":true,"p":"Latest-only mailbox에서 take의 동작은?","o":["대기 프레임을 복사만 함","꺼내고 칸을 비움","새 프레임을 기다림","추론을 시작함"],"a":1,"h":"take는 대기 칸에 있던 프레임 하나를 반환하면서 동시에 슬롯을 소비합니다. 그래서 꺼낸 직후 다시 take를 호출하면 남은 것이 없어 None이 나옵니다.","w":"take는 대기 프레임을 꺼내고 칸을 비웁니다. 소비 후 다시 꺼내면 None입니다.","an":"슬라이드 p.62·79","src":"● put: 대기 중인 값을 새 입력 한 장으로 교체합니다.\n● take: 대기 프레임을 꺼내고 칸을 비웁니다."},{"id":"t4-04","ty":"mc","lv":3,"game":true,"p":"100ms마다 생성·250ms마다 처리할 때, 500ms에서 최신 한 장 방식이 고르는 프레임은?","o":["f0","f2","f4","f5"],"a":3,"h":"100ms마다 f0, f1, f2…가 생성되므로 500ms 시점에 가장 최근에 만들어진 프레임 번호는 500÷100으로 셀 수 있습니다. FIFO는 밀린 순서대로 오래된 프레임(f2)을 고르지만, 최신 한 장 방식은 대기 칸을 계속 덮어써 가장 최근 것을 고릅니다.","w":"500ms에 FIFO는 f2를, 최신 한 장 방식은 f5를 고릅니다. 설명용 가정이며 실측이 아닙니다.","an":"슬라이드 p.135","src":"● 100ms마다 생성, 250ms마다 처리한다고 가정합니다.\n● 500ms에서 FIFO는 f2, 최신 한 장은 f5를 선택합니다."},{"id":"t4-05","ty":"mc","lv":2,"game":true,"p":"ROS header 시각과 현재 시각은 어떤 clock으로 비교하나요?","o":["서로 다른 PC 시계","동일한 ROS node clock","Ollama 서버 시계","카메라 내부 시계"],"a":1,"h":"captured_ms는 ROS header의 촬영 시각이고 age는 현재 시각에서 이를 뺀 값입니다. 두 시각은 같은 기준의 시계에서 나와야 하며, 기준이 다른 시계를 섞으면 신선도와 TTL 판단이 천 배까지 어긋날 수 있습니다.","w":"header와 현재 시각은 같은 ROS node clock으로 비교합니다. 시뮬레이션이면 관련 node의 use_sim_time을 함께 맞춥니다.","an":"슬라이드 p.66","src":"● captured_ms는 영상이 촬영된 시각입니다.\n● age=현재 시각−촬영 시각이며 미래 값도 거부합니다.\n● ROS header와 현재 시각은 동일한 ROS node clock을 사용합니다.\n● simulation 사용 시 관련 node의 use_sim_time을 함께 맞춥니다."},{"id":"t4-06","ty":"ox","lv":2,"game":true,"p":"최신 슬롯(latest-only)은 진행 중인 추론을 취소한다.","a":false,"h":"최신 슬롯은 '아직 시작하지 않은' 대기 입력만 최신 한 장으로 교체합니다. 이미 worker가 처리 중인 A 프레임의 추론은 그대로 끝까지 진행되며, 완료 후에야 대기 중인 최신 프레임을 처리합니다.","w":"틀렸습니다. 최신 슬롯은 아직 시작 전인 대기 프레임만 교체하며 진행 중인 추론을 취소하지 않습니다.","an":"슬라이드 p.77·135","src":"● 100ms마다 생성, 250ms마다 처리한다고 가정합니다.\n● 500ms에서 FIFO는 f2, 최신 한 장은 f5를 선택합니다.\n● 최신 한 장도 진행 중인 추론을 취소하지 않습니다."},{"id":"t4-07","ty":"ox","lv":1,"game":true,"p":"MediaPipe 좌표와 VLM 판단은 같은 이미지(frame_id)에서 나와야 한다.","a":true,"h":"MediaPipe와 VLM은 선택한 동일 이미지에서 실행되고, 좌표와 판단을 같은 frame_id로 묶습니다. ID가 다르면 시간 관계가 맞지 않는 결합이므로 이전 FOLLOW 승인을 새 손 좌표에 재사용하지 않고 정지합니다.","w":"맞습니다. 선택한 동일 이미지에서 둘 다 실행하고 frame_id가 일치해야 합니다. 이전 FOLLOW를 새 좌표에 재사용하지 않습니다.","an":"슬라이드 p.64","src":"● MediaPipe와 VLM은 선택한 동일 \n이미지에서 실행합니다.\n● 좌표와 VLM 판단의 frame_id가 \n일치해야 합니다.\n● 이전 FOLLOW 승인을 새 손 좌표에 \n재사용하지 않습니다.\n● ID 불일치는 목표가 있어도 \nSTOP입니다."},{"id":"t4-08","ty":"match","lv":2,"game":false,"p":"구성요소와 역할을 연결하세요.","pairs":[["mailbox","대기 영상이 쌓이는 것을 막음"],["timeout","응답 없는 요청의 대기 한도"],["freshness","촬영 후 오래된 결과의 실행 거부"],["단일 worker","선택한 이미지에서 인지·판단 완료"]],"h":"네 구성요소는 각각 대기·요청·시간·실행을 담당합니다. mailbox는 영상이 쌓이지 않게, timeout은 응답 없는 요청을 얼마나 기다릴지, freshness는 너무 오래된 결과를 실행하지 않게, 단일 worker는 고른 이미지 하나로 인지와 판단을 끝내는 역할입니다.","w":"mailbox는 대기 영상을, timeout은 요청 대기를, freshness는 오래된 결과를 다룹니다. mailbox만으로 처리 중인 요청이 빨라지지는 않습니다.","an":"슬라이드 p.63·65","src":"● mailbox는 대기하는 영상이 쌓이는 것을 막습니다.\n● timeout은 응답 없는 요청의 대기 한도를 정합니다.\n● freshness는 촬영 후 너무 오래된 결과의 실행을 거부합니다."},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"카메라 입력이 제어까지 가는 처리 순서를 맞추세요.","steps":["카메라 수신과 captured_ms 기록","latest 대기 슬롯에 보관","단일 worker가 추론","결과 회수와 issued_ms 고정","매 tick TTL·age 검사 후 제어"],"h":"흐름은 수신 → 대기 → 실행 → 회수 → 검사 순입니다. 카메라에서 받은 프레임의 촬영 시각을 기록하고, 대기 슬롯에 한 장만 두었다가 worker가 추론하며, 결과를 회수할 때 승인 시각을 고정한 뒤 timer가 매 tick 시간 검사를 하고 제어합니다.","w":"수신한 프레임을 대기 슬롯에 두고 worker가 추론한 뒤 issued_ms를 고정하며, timer가 매 tick 시간을 검사합니다.","an":"슬라이드 p.73","src":"1. 카메라 수신\ncaptured_ms · frame\n2. latest 대기 슬롯\n아직 시작 전 한 장\n3. 단일 worker\n실행 중 입력은 유지\n4. 결과 회수\nissued_ms 고정\n5. 매 tick 시간 검사\nTTL · frame/pose age\n6. 제어·다음 요청\n만료 STOP · 최신 입력"},{"id":"t4-10","ty":"multi","lv":2,"game":true,"p":"04 본수업에서 확인하는 mailbox 동작을 모두 고르세요.","o":["put으로 대기값 교체","take 후 칸이 비어 None","교체 수 집계","오래된 입력 거부","peek 조회"],"a":[0,1,2,3],"h":"04 본수업은 mailbox의 put/take, 교체 횟수, 오래된 입력 거부, 깊은 복사를 확인합니다. 대기값을 꺼내지 않고 들여다보는 peek 조회는 참고 정답에만 있는 확장 기능이라 본수업 확인 대상이 아닙니다.","w":"본수업은 put/take·교체 수·오래된 입력 거부·복사를 확인합니다. peek 조회는 참고 정답의 확장 기능입니다.","an":"슬라이드 p.62","src":"● put: 대기 중인 값을 새 입력 한 장으로 교체합니다.\n● take: 대기 프레임을 꺼내고 칸을 비웁니다.\n● 본수업은 put/take·교체 수·오래된 입력 거부·복사를 확인합니다.\n● peek 조회는 참고 정답의 확장 기능입니다."}]},{"id":"t5","title":"판단 유지 시간(TTL)과 시간 검사","ref":"04 · 슬라이드 p.67–79·136","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"captured_ms가 뜻하는 것은?","o":["판단 승인 시각","영상 촬영 시각","pose 수신 시각","요청 시작 시각"],"a":1,"h":"세 시각 중 captured_ms는 카메라 header에서 얻는 값으로 관측의 나이를 재는 기준입니다. issued_ms는 처리 결과(승인)가 만들어진 시각, pose_ms는 거북이 위치를 마지막으로 받은 시각이므로 구분하세요.","w":"captured_ms는 영상이 촬영된 시각이며 관측의 나이 기준입니다. issued_ms는 승인의 나이 기준입니다.","an":"슬라이드 p.66·72","src":"captured_ms는 카메라 header에서 얻는 영상의 시각이고 issued_ms는 처리 결과가 만들어진 시각입니다. now-captured가 관측 age, now-issued가 승인 age입니다."},{"id":"t5-02","ty":"mc","lv":2,"game":true,"p":"TTL은 어느 시각을 기준으로 계산하나요?","o":["captured_ms","issued_ms","pose_ms","서버 시작 시각"],"a":1,"h":"TTL은 '판단을 얼마 동안 유지할지'를 제한하므로 판단 결과가 만들어져 승인된 시각부터 셉니다. 반면 max_age_ms는 영상이 촬영된 captured_ms 기준이라 두 제한은 서로 다른 시계를 봅니다.","w":"TTL은 issued_ms 기준, max_age_ms는 captured_ms 기준입니다. 서로 다른 시계를 제한합니다.","an":"슬라이드 p.72·77","src":"최신 슬롯은 추론 중인 프레임을 취소하지 않습니다. TTL은 issued_ms 기준이고 max_age_ms는 captured_ms 기준입니다."},{"id":"t5-03","ty":"num","lv":3,"game":false,"p":"issued=1600, TTL=400ms일 때 승인이 처음으로 expired가 되는 now(ms)는?","a":2000,"unit":"ms","h":"만료 조건은 now − issued ≥ TTL이며, 경계값과 정확히 같아지는 순간부터 만료입니다. 따라서 처음 expired가 되는 시각은 issued + TTL = 1600 + 400으로 계산합니다.","w":"now=1999면 age 399로 통과, now=2000이면 age 400으로 expired입니다. 제한값과 정확히 같으면 만료입니다.","an":"슬라이드 p.74","src":"- 예시 captured=1000, issued=1600, TTL=400ms\n- now=1999: 승인 age 399ms, TTL 검사 통과\n- now=2000: 승인 age 400ms, expired"},{"id":"t5-04","ty":"mc","lv":2,"game":true,"p":"04 TTL 실험에서 바꾸는 조건은?","o":["모델 종류","프레임 age 제한","TTL 400·1000·3000ms","초기 pose"],"a":2,"h":"04 실험은 한 번에 하나의 조건만 바꿔 비교합니다. 모델·영상·초기 pose·mirror와 프레임 age 5000ms·pose 500ms 제한은 그대로 두고, 판단 유지 시간 값만 세 가지로 바꿔 각각 실행합니다.","w":"모델·영상·초기 pose·mirror는 같게 두고 TTL만 400·1000·3000ms로 바꿔 비교합니다.","an":"슬라이드 p.68·136","src":"● 04는 TTL 400·1000·3000ms만 바꿔 비교합니다.\n● 프레임 age 5000ms·pose 500ms는 유지합니다."},{"id":"t5-05","ty":"mc","lv":3,"game":true,"p":"TTL을 3000ms로 늘려도 계속 전진하지 않는 이유는?","o":["TTL은 무시된다","모델이 느려진다","pose가 리셋된다","age·도착·새 STOP"],"a":3,"h":"TTL은 여러 종료 조건 중 하나일 뿐이며 시간 상한은 min(issued+ttl, captured+max_age)처럼 먼저 오는 한계가 정합니다. 프레임 age 제한, 목표 도착, 새 STOP 판단이 TTL보다 먼저 오면 그 시점에 멈춥니다.","w":"frame age 제한·목표 도착·새 STOP·검사 거부 중 먼저 온 조건이 TTL 전에 멈춥니다. 시간 상한은 min(issued+ttl, captured+max_age)입니다.","an":"슬라이드 p.69·74","src":"● 이전 관측의 목표 좌표를 유지하며 pose로 제어합니다.\n● 목표 도착·새 STOP·검사 거부면 TTL 전에도 멈춥니다."},{"id":"t5-06","ty":"ox","lv":2,"game":true,"p":"정지 이미지 요청 timeout 180초는 이동을 허용하는 시간과 같다.","a":false,"h":"정지 이미지 시험의 180초 timeout은 모델 적재까지 포함될 수 있는 요청을 얼마나 기다릴지 정하는 값입니다. ROS 제어에서는 이와 별개로 촬영 age 5초와 승인 TTL 400ms를 검사하므로 요청 대기·촬영 신선도·판단 유지 시간은 서로 다른 개념입니다.","w":"틀렸습니다. 180초는 모델 적재를 포함한 요청 대기 한도입니다. ROS에서는 촬영 age 5초와 승인 TTL 400ms를 따로 검사합니다.","an":"슬라이드 p.35","src":"● 정지 이미지 timeout 180초는 이동 허용 시간이 아닙니다.\n● ROS에서는 촬영 age 5초와 승인 TTL 400ms를 검사합니다."},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"긴 TTL은 끊김을 줄일 수 있지만 새 STOP 반응을 늦출 수 있다.","a":true,"h":"TTL이 짧으면 판단 사이에 정지 구간이 생기고, 길면 이전 FOLLOW를 더 오래 사용할 수 있습니다. 움직임이 부드러워지는 것과 손을 주먹으로 바꿨을 때 빠르게 반응하는 것은 다른 성질이라 둘을 함께 봐야 합니다.","w":"맞습니다. 그래서 움직임이 늘어난 것만으로 개선이라고 판단하지 않고 정지 반응도 함께 기록합니다.","an":"슬라이드 p.75·136","src":"TTL이 짧으면 판단 사이에 정지 구간이 생길 수 있고, 길면 이전 FOLLOW를 더 오래 사용할 수 있습니다. 움직임이 부드러워졌다는 것과 현재 손 상태에 빠르게 반응한다는 것은 다른 성질입니다. 손을 주먹으로 바꾼 뒤 모델이 새 STOP을 내기 전까지 기존 판단이 유효할 수 있음을 함께 설명합니다."},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"시간 제한과 값을 연결하세요.","pairs":[["프레임 age 제한","5000ms"],["pose age 제한","500ms"],["기본 승인 TTL","400ms"],["정지 이미지 요청 timeout","180초"]],"h":"실험에서는 프레임 age 제한(초 단위)과 pose age 제한(수백 ms)을 그대로 유지하고, 기본 승인 TTL은 수백 ms 수준입니다. 정지 이미지 요청 timeout은 모델 적재를 기다리는 값이라 분 단위에 가까운 가장 긴 값입니다.","w":"프레임 age 5000ms·pose 500ms는 유지하고 TTL만 바꿉니다. 정지 이미지 요청 timeout은 이동 허용 시간이 아닙니다.","an":"슬라이드 p.35·68","src":"● 정지 이미지 timeout 180초는 이동 허용 시간이 아닙니다.\n● ROS에서는 촬영 age 5초와 승인 TTL 400ms를 검사합니다."},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"판단 하나의 시간 흐름을 맞추세요.","steps":["영상 촬영(frame age 시작)","요청과 추론 대기","판단 도착과 승인 시각 기록","TTL·frame age 유효 구간 검사","만료·도착·새 STOP 중 먼저 온 종료"],"h":"판단 하나는 촬영 → 추론 → 승인 → 유효 구간 → 종료 순으로 흘러갑니다. 촬영 시각에서 frame age가 시작되고, 요청·추론을 기다린 뒤 판단이 도착하면 승인 시각을 기록하며, TTL·frame age 검사 구간을 거쳐 먼저 온 종료 조건에서 멈춥니다.","w":"촬영 후 추론을 거쳐 판단이 도착하면 승인 시각을 기록하고, 유효 구간 동안 검사하다 먼저 온 한계에서 멈춥니다.","an":"슬라이드 p.71","src":"1. 촬영 시각\nframe age 시작\n2. 요청·추론 \n대기\n최신 슬롯 갱신\n3. 판단 도착\n승인 시각 기록\n4. 유효 구간\nTTL·frame age \n검사\n5. 먼저 온 종료\n만료·도착·새 \nSTOP"},{"id":"t5-10","ty":"multi","lv":2,"game":true,"p":"이동이 허용되려면 모두 만족해야 하는 조건을 고르세요.","o":["촬영 age < 제한","승인 age < TTL","pose age < 제한","응답 시간 < 1초","판단 frame = 관측 frame"],"a":[0,1,2,4],"h":"이동은 세 시간 조건(촬영 age, 승인 TTL, pose age)이 모두 제한보다 작고, 판정 형식과 frame 일치까지 통과해야 허용됩니다. 비교는 0 이상이면서 제한보다 작아야 하므로 제한값과 같으면 만료입니다.","w":"세 시간 조건(촬영·승인·pose)과 frame 일치를 모두 만족해야 합니다. 응답 시간 1초 같은 규칙은 없습니다.","an":"슬라이드 p.55·72","src":"● 촬영 age → 승인 TTL → pose age를 검사합니다.\n● 판정 형식 → frame 일치 → 유효한 손 중심을 검사합니다."}]},{"id":"t6","title":"YOLO 객체 검출과 bbox","ref":"05 · 슬라이드 p.80–87·133","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"객체 검출 결과 한 건에 들어 있는 정보는?","o":["label·confidence·bbox","이미지 전체 종류만","픽셀별 mask만","17개 관절만"],"a":0,"h":"분류는 이미지 전체의 종류를 말하지만 검출은 객체마다 종류와 위치를 찾습니다. 그래서 검출 한 건에는 무엇인지(이름), 얼마나 확신하는지(점수), 어디에 있는지(사각형 좌표)가 함께 담깁니다.","w":"검출 한 건은 label·confidence·bounding box를 가집니다. 분류는 종류만, 분할은 mask를 냅니다.","an":"슬라이드 p.80","src":"● 분류는 이미지의 종류를, 검출은 \n객체의 종류와 위치를 찾습니다.\n● 검출 한 건에는 \nlabel·confidence·bounding box가 \n있습니다."},{"id":"t6-02","ty":"mc","lv":2,"game":true,"p":"bbox_xyxy=[x1,y1,x2,y2]에서 너비는?","o":["x2 + x1","x2 − x1","y2 − y1","x1 × y1"],"a":1,"h":"bbox_xyxy는 좌상단 (x1,y1)과 우하단 (x2,y2) 좌표입니다. 원점은 이미지 왼쪽 위이고 x는 오른쪽으로 증가하므로, 가로 길이는 오른쪽 x에서 왼쪽 x를 빼서 구합니다.","w":"너비=x2−x1, 높이=y2−y1입니다. 원점은 왼쪽 위이고 x는 오른쪽, y는 아래로 증가합니다.","an":"슬라이드 p.81","src":"● 원점은 이미지 왼쪽 위이고 x는 오른쪽, y는 아래로 증가합니다.\n● bbox_xyxy=[x1,y1,x2,y2]는 좌상단과 우하단 좌표입니다.\n● 0≤x1<x2≤width, 0≤y1<y2≤height를 검사합니다.\n● 너비=x2−x1, 높이=y2−y1입니다."},{"id":"t6-03","ty":"mc","lv":2,"game":true,"p":"threshold=0.70일 때 score 0.70인 박스는?","o":["제외","통과(경계 포함)","재검사","반올림 후 판단"],"a":1,"h":"threshold는 결과를 남길 최소 점수이며, 교재 계약은 경계값을 포함하는 '이상(≥)' 비교입니다. 따라서 0.699는 제외되지만 threshold와 정확히 같은 점수는 어떻게 처리되는지 생각해 보세요.","w":"0.70은 통과, 0.699는 제외됩니다. threshold는 결과를 남길 최소 점수입니다.","an":"슬라이드 p.82","src":"● threshold는 결과를 남길 최소 점수이며 교재는 경계를 포함합니다.\n● threshold=0.70이면 0.70은 통과, 0.699는 제외됩니다."},{"id":"t6-04","ty":"num","lv":3,"game":false,"p":"두 박스 면적이 각각 16, 교집합 9일 때 IoU는? (소수 넷째 자리)","a":0.3913,"unit":"","h":"IoU는 교집합 면적을 합집합 면적으로 나눈 값입니다. 합집합은 두 면적의 합에서 겹친 부분을 한 번 빼야 하므로 계산식은 9 ÷ (16 + 16 − 9)이며, 그 결과를 소수 넷째 자리까지 구하면 됩니다.","w":"합집합은 16+16−9=23이므로 IoU=9/23≈0.3913입니다. NMS는 점수가 높은 box를 남기고 많이 겹친 후보를 제거합니다.","an":"슬라이드 p.133","tol":0.0001,"src":"● IoU=교집합 면적÷합집합 면적입니다.\n● 각 면적 16, 교집합 9이면 IoU=9/23≈0.3913입니다."},{"id":"t6-05","ty":"mc","lv":2,"game":true,"p":"교재 리허설에서 road.png를 YOLO detect로 실행한 결과는?","o":["person 2개","car 4개","bus 1개","car 3개"],"a":3,"h":"교재 리허설에서 road.png를 YOLO detect(yolo26n.pt)로 돌리면 자동차만 몇 대 검출되었습니다. segmentation 모델로 돌린 선택 자습 결과(mask 4개)와는 모델과 결과 개수가 다르니 혼동하지 마세요.","w":"detect 리허설은 car 3개였습니다. 같은 이미지·weight·옵션인지 확인한 뒤 결과를 비교합니다.","an":"슬라이드 p.87","src":"● 교재 리허설에서는 car 3개를 \n검출했습니다."},{"id":"t6-06","ty":"ox","lv":2,"game":true,"p":"confidence 0.8은 그 장면에서 80% 확률로 맞다는 보정된 확률이다.","a":false,"h":"confidence는 모델이 제공한 0~1 점수일 뿐 보정된 확률이 아닙니다. 0.8이라는 숫자를 그 장면에서 80% 확률로 맞다고 단정할 수 없으며, 사람 박스 점수가 높아도 가려진 손목 점수는 낮을 수 있습니다.","w":"틀렸습니다. confidence는 모델이 제공한 0~1 점수이며 보정된 확률로 단정하지 않습니다.","an":"슬라이드 p.82·93","src":"confidence는 모델이 제공한 점수입니다. 0.8이라는 숫자를 이 장면에서 80% 확률로 맞다는 보정된 확률로 단정하지 않습니다."},{"id":"t6-07","ty":"ox","lv":1,"game":true,"p":"검출할 객체가 없어 결과가 0개인 것도 가능한 정상 결과이다.","a":true,"h":"검출 결과의 개수는 장면에 있는 객체 수를 따릅니다. 객체가 N개면 결과도 N개이므로, 대상이 없어서 결과가 비어 있는 것은 추론 오류가 아니라 정상적인 미검출로 구분해야 합니다.","w":"맞습니다. N=0도 가능한 결과입니다. 추론 오류와 정상적인 미검출을 구분해야 합니다.","an":"슬라이드 p.80·83","src":"● 객체 N개면 결과 N개이며 N=0도 \n가능한 결과입니다."},{"id":"t6-08","ty":"match","lv":1,"game":false,"p":"비전 태스크와 출력 결과를 연결하세요.","pairs":[["Detection","경계 상자"],["Instance Segmentation","픽셀 단위 마스크"],["Pose Estimation","핵심 포인트(관절)"],["Classification","라벨과 확률값"]],"h":"각 태스크는 출력 형태로 구분됩니다. 탐지는 사물의 위치를 사각형으로, 인스턴스 분할은 외곽을 픽셀 단위 마스크로, 자세 추정은 관절 위치(키포인트)로, 분류는 이미지 전체의 카테고리를 라벨과 확률로 돌려줍니다.","w":"검출은 상자, 분할은 마스크, 자세 추정은 핵심 포인트, 분류는 라벨과 확률을 출력합니다.","an":"Train_YOLO26n_in_Colab 지원 태스크 표","src":"| **객체 탐지 (Detection)** | 이미지 내 사물의 위치와 종류를 동시에 식별 | 사각형 경계 상자 (Bounding Box) |\n| **인스턴스 분할 (Segmentation)** | 객체의 정밀한 외곽 윤곽선을 픽셀 단위로 구분 | 마스크 (Mask) |\n| **자세 추정 (Pose Estimation)** | 사람이나 객체의 주요 관절 위치 및 포즈 추적 | 핵심 포인트 (Keypoint) |\n| **지향성 경계 상자 (OBB)** | 위성·항공 촬영 이미지 등 회전된 물체 정밀 측정 | 회전된 경계 상자 (Rotated Box) |\n| **이미지 분류 (Classification)** | 이미지 전체의 카테고리 판별 | 라벨 및 확률값 |"},{"id":"t6-09","ty":"order","lv":1,"game":false,"p":"객체 검출의 처리 흐름을 맞추세요.","steps":["H×W×3 이미지 입력","모델 추론","N개 box·score 출력","이름 있는 관측으로 변환"],"h":"검출은 입력 → 추론 → 후보 → 관측 순서로 진행됩니다. 높이×너비×3 이미지가 모델에 들어가 추론되고, 그 결과 여러 개의 사각형과 점수가 나오며, 마지막에 사람이 읽을 수 있는 이름 붙은 관측으로 바뀝니다.","w":"이미지를 추론해 N개의 box와 점수를 얻고 class ID를 label로 바꿔 이름 있는 관측으로 만듭니다.","an":"슬라이드 p.80","src":"이미지 H×W×3\n↓\n모델 추론\n↓\nN개 box·score\n↓\n이름 있는 관측"},{"id":"t6-10","ty":"multi","lv":2,"game":true,"p":"검출 결과 검사에서 거부하는 입력을 모두 고르세요.","o":["문자열 점수","NaN 점수","영상 밖 box","x1 > x2인 좌표","0.70 점수(기준 0.70)"],"a":[0,1,2,3],"h":"검출 결과 검사는 점수가 의미 있는 실수인지, 좌표가 영상 안에서 올바른 순서인지를 확인합니다. 문자열·bool·NaN·Inf 같은 점수와, 영상 밖으로 나간 box나 x1·x2가 뒤집힌 좌표는 입력 오류로 거부됩니다.","w":"문자열·bool·NaN·Inf 점수와 영상 밖·뒤집힌 box는 입력 오류로 거부합니다. 기준과 같은 0.70은 통과합니다.","an":"슬라이드 p.85","src":"● 문자열·bool·NaN·Inf를 점수로 받지 않습니다.\n● 영상 밖 box와 뒤집힌 좌표는 입력 오류로 거부합니다."}]},{"id":"t7","title":"사람 Pose 17관절과 선택","ref":"05 · 슬라이드 p.88–100","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"YOLO pose가 사람마다 반환하는 관절 수는?","o":["5개","21개","33개","17개"],"a":3,"h":"YOLO pose의 관절은 코, 양쪽 눈·귀·어깨·팔꿈치·손목·엉덩이·무릎·발목으로 구성되며 손가락 관절은 없습니다. 코 1개에 좌우 쌍 8종류를 더해 세어 보세요.","w":"코·눈·귀·어깨·팔꿈치·손목·엉덩이·무릎·발목으로 17개입니다. 21개는 MediaPipe 손 점입니다.","an":"슬라이드 p.89","src":"● 코·양쪽 눈·귀·어깨·팔꿈치·손목·엉덩이·무릎·발목입니다.\n● 각 관절을 이름·정규화 xy·confidence로 표현합니다.\n● x는 오른쪽, y는 아래로 증가하며 각각 [0,1]입니다.\n● 누락 관절은 xy=null로 표시하고 전체 17개 이름을 유지합니다."},{"id":"t7-02","ty":"mc","lv":1,"game":true,"p":"17관절에서 코는 몇 번인가요?","o":["0번","5번","9번","16번"],"a":0,"h":"17개 관절 목록은 코부터 시작해 눈·귀·어깨… 순서로 이어지고, 번호는 0부터 매깁니다. 슬라이드 제목이 코의 번호와 '손가락은 없다'는 점을 함께 알려 줍니다.","w":"코는 0번이며 손가락은 없습니다.","an":"슬라이드 p.89","src":"17개 관절: 코는 0번, 손가락은 없습니다"},{"id":"t7-03","ty":"mc","lv":2,"game":true,"p":"가장 큰 사람을 고르는 순서로 옳은 것은?","o":["면적 비교 후 신뢰도 검사","신뢰도 통과 후 최대 면적","최고 confidence 한 명","가장 가운데 사람"],"a":1,"h":"select_largest_person은 먼저 confidence와 box 유효성을 검사해 후보를 거르고, 그 후보들 중에서 (x2−x1)×(y2−y1)이 가장 큰 사람을 고릅니다. 점수가 낮은 큰 박스를 먼저 고른 뒤 버리는 순서와는 결과가 다릅니다.","w":"confidence ≥0.5인 유효 box만 후보로 두고 (x2−x1)×(y2−y1)이 가장 큰 사람을 고릅니다. 최고 confidence를 고르는 과제와 다릅니다.","an":"슬라이드 p.90·98","src":"select_largest_person은 confidence와 box의 유효성을 먼저 검사한 후 면적이 가장 큰 후보를 고릅니다. 점수가 낮은 큰 박스를 먼저 선택하고 나중에 버리는 순서와 결과가 다릅니다."},{"id":"t7-04","ty":"mc","lv":2,"game":true,"p":"누락된 관절의 xy는 어떻게 표기하나요?","o":["[0, 0]","[-1, -1]","null","관절 이름 삭제"],"a":2,"h":"누락 좌표를 [0,0]으로 대신하면 영상 모서리의 실제 위치와 구분할 수 없습니다. 그래서 누락 관절은 '값 없음'으로 표시하고(Python에서는 None), 17개 이름은 지운 채 당기지 않고 그대로 유지합니다.","w":"누락 관절은 xy=null로 표시하고 이름 17개를 유지합니다. [0,0]으로 대신하면 실제 위치와 구분되지 않습니다.","an":"슬라이드 p.89·95","src":"● 각 관절을 이름·정규화 xy·confidence로 표현합니다.\n● x는 오른쪽, y는 아래로 증가하며 각각 [0,1]입니다.\n● 누락 관절은 xy=null로 표시하고 전체 17개 이름을 유지합니다."},{"id":"t7-05","ty":"mc","lv":3,"game":true,"p":"threshold 0.8에서 면적은 더 크지만 점수 0.6인 사람은?","o":["선택된다","후보에서 제외된다","면적으로 우선된다","관절만 사용된다"],"a":1,"h":"사람 선택은 신뢰도 필터를 면적 비교보다 먼저 적용합니다. threshold가 0.8이면 점수 0.6인 사람은 면적 비교 단계에 들어가기 전에 걸러지므로 면적이 크다는 사실이 소용없습니다.","w":"큰 사람의 점수 0.6은 threshold 0.8에서 제외됩니다. 신뢰도 필터를 먼저 적용하기 때문입니다.","an":"슬라이드 p.100","src":"● threshold 0.5에서는 3개, 0.8에서는 1개가 남습니다.\n● 사람 선택은 신뢰도 통과 후 최대 면적입니다.\n● 큰 사람의 점수 .6은 threshold .8에서 제외됩니다."},{"id":"t7-06","ty":"ox","lv":2,"game":true,"p":"최대 면적 선택은 같은 사람을 계속 따라가는 신원 추적이다.","a":false,"h":"최대 면적 선택은 매 프레임 새로 수행되며 사람의 고유 ID를 유지하지 않습니다. 따라서 다른 사람이 더 가까이 오면 선택 대상이 바뀌며, 같은 인물을 계속 따라가려면 별도의 추적 정책이 필요합니다.","w":"틀렸습니다. 매 프레임 최대 면적을 다시 고르므로 다른 사람이 가까워지면 대상이 바뀝니다. 같은 사람 유지에는 별도 tracking이 필요합니다.","an":"슬라이드 p.90·120","src":"최대 면적은 보통 화면에서 큰 사람을 선택하는 간단한 기준입니다. 사람의 고유 ID를 유지하지 않으므로 두 사람이 앞뒤로 움직이면 선택 대상이 바뀝니다. 동일 인물을 계속 따라가려면 별도의 추적 정책과 소실·재선택 규칙이 필요합니다."},{"id":"t7-07","ty":"ox","lv":2,"game":true,"p":"관절 이름의 left/right는 화면의 좌우가 아니라 사람 자신의 좌우다.","a":true,"h":"pose 관절 이름의 left/right는 해부학적 좌우, 즉 사람 자신을 기준으로 한 좌우입니다. 카메라를 마주 보면 화면 왼쪽·오른쪽과 다를 수 있으며, 거울처럼 표시한다고 관절 이름을 바꾸면 안 됩니다.","w":"맞습니다. 거울처럼 표시한다고 관절 이름을 임의로 바꾸면 안 됩니다.","an":"슬라이드 p.108","src":"pose_prompt는 선택된 한 사람의 bbox와 17관절을 모두 포함하고 instruction과 target_keypoint를 명시합니다. 관절 이름의 left/right는 사람 자신의 좌우이며 화면 왼쪽·오른쪽과 다를 수 있습니다. 거울처럼 표시한다고 관절 이름을 임의로 바꾸면 안 됩니다."},{"id":"t7-08","ty":"match","lv":2,"game":false,"p":"점수·좌표와 쓰임을 연결하세요.","pairs":[["박스 confidence","사람 후보 선택"],["관절 confidence","목표 관절 승인"],["픽셀 xyxy","bbox 좌표"],["정규화 xy","관절 위치 [0,1]"]],"h":"박스 점수와 관절 점수는 별도 값이라 사람 선택 임계값과 목표 관절 임계값을 따로 둡니다. 좌표도 bbox_xyxy는 영상 픽셀 기준이고, keypoints.xyn은 0~1 정규화 좌표이므로 단위를 섞으면 안 됩니다.","w":"사람 선택 임계값과 목표 관절 임계값을 따로 둡니다. bbox 픽셀 좌표와 pose 정규화 좌표를 섞지 않습니다.","an":"슬라이드 p.93·98","src":"confidence는 모델이 제공한 점수입니다. 0.8이라는 숫자를 이 장면에서 80% 확률로 맞다는 보정된 확률로 단정하지 않습니다. 사람 박스 점수가 높아도 가려진 손목의 점수는 낮을 수 있습니다. 따라서 사람 선택 임계값과 목표 관절 임계값을 별도로 둡니다.\n\n일반 detection 계약의 bbox_xyxy는 영상 픽셀 기준이고, people_from_yolo의 boxes.xyxyn과 keypoints.xyn은 정규화 좌표입니다. 한쪽의 100이라는 픽셀 좌표를 다른 쪽의 0~1 계약에 넣으면 범위 검사에서 거부됩니다. 배열 길이뿐 아니라 단위와 좌표 기준을 확인해야 합니다."},{"id":"t7-09","ty":"order","lv":2,"game":false,"p":"검출에서 사람 전체 좌표까지 가는 순서를 맞추세요.","steps":["원본 이미지(좌표 기준 유지)","YOLO detection","YOLO pose로 사람 box·17관절","신뢰도·최대 면적으로 사람 선택","전체 관절 JSON 생성"],"h":"흐름은 검출 → pose → 선택 → JSON 순입니다. 원본 이미지의 좌표 기준을 유지한 채 detection과 pose를 각각 실행하고, 신뢰도와 면적으로 한 사람을 고른 뒤 누락까지 이름을 유지한 전체 관절 JSON을 만듭니다.","w":"같은 원본에 detection과 pose를 실행하고, 한 사람을 고른 뒤 누락까지 이름을 유지한 관절 JSON을 만듭니다.","an":"슬라이드 p.88","src":"1. 원본 이미지 \n좌표 기준 유지\n2. YOLO detection\nbox·class·score\n3. YOLO pose\n사람 box·17관절\n4. 사람 선택\n신뢰도·최대 면적\n5. 전체 관절 JSON\n누락도 이름 유지"},{"id":"t7-10","ty":"multi","lv":2,"game":true,"p":"05 결과 해설로 옳은 것을 모두 고르세요.","o":["threshold 0.5에서 3개 남음","threshold 0.8에서 1개 남음","누락 관절도 이름 유지","관절 conf가 없으면 승인","누락 좌표는 [0,0]"],"a":[0,1,2],"h":"05 결과 해설에서는 threshold를 0.5에서 0.8로 올리면 남는 박스 수가 줄어들고, 누락 관절도 이름을 지우지 않고 유지한다는 점을 확인합니다. keypoints.conf가 없으면 좌표가 있어도 관절 confidence는 0으로 채워집니다.","w":"0.5에서 3개, 0.8에서 1개가 남고 누락 관절도 이름 17개를 유지합니다. 관절 신뢰도가 없으면 0으로 채워 승인하지 않고, 누락은 null입니다.","an":"슬라이드 p.95·100","src":"● threshold 0.5에서는 3개, 0.8에서는 1개가 남습니다.\n● 사람 선택은 신뢰도 통과 후 최대 면적입니다.\n● 큰 사람의 점수 .6은 threshold .8에서 제외됩니다.\n● 누락 관절도 포함해 이름 17개를 유지합니다."}]},{"id":"t8","title":"Pose 좌표 → LLM → ROS","ref":"06 · 슬라이드 p.101–115","qs":[{"id":"t8-01","ty":"mc","lv":1,"game":true,"p":"06 단계 LLM 요청에 포함되지 <b>않는<\/b> 것은?","o":["frame_id","이미지","captured_ms","17관절 JSON"],"a":1,"h":"02·03의 VLM은 이미지 픽셀을 보고 손 모양을 판단했지만, 06에서는 YOLO가 먼저 관절을 추출하고 LLM은 그 구조화된 텍스트만 읽습니다. payload에 images 필드가 없으므로 정보 경로가 텍스트뿐입니다.","w":"06의 LLM 요청에는 이미지가 없습니다. frame_id·captured_ms·선택된 사람의 bbox와 17관절 JSON을 보냅니다.","an":"슬라이드 p.101–102","src":"02·03에서 VLM은 이미지 픽셀을 보고 손 모양을 판단했습니다. 이번에는 YOLO가 먼저 이미지에서 사람과 관절을 추출하고 LLM은 그 구조화된 텍스트를 읽습니다. 같은 모델 tag를 사용하더라도 payload에 images가 없으므로 이 요청의 정보 경로는 텍스트입니다. 검출기가 놓친 시각 정보를 LLM이 직접 다시 보는 구조가 아닙니다."},{"id":"t8-02","ty":"mc","lv":2,"game":true,"p":"응답 command가 STOP일 때 keypoint와 center는?","o":["마지막 좌표","null","[0, 0]","코 좌표"],"a":1,"h":"pose 응답 계약은 command·keypoint·center·frame_id·reason 필드로 되어 있습니다. 정지 명령에는 따라갈 목표가 없으므로 목표 관절 이름과 좌표 칸을 '값 없음'으로 비워 두어야 하며, 좌표가 남아 있으면 의미가 모호해 거부됩니다.","w":"STOP은 keypoint=null, center=null이어야 합니다. 값이 있으면 계약 위반입니다.","an":"슬라이드 p.103·110","src":"● 필드: command·keypoint·center·frame_id·reason\n● FOLLOW는 지시한 관절과 입력 xy가 일치해야 합니다.\n● STOP은 keypoint=null, center=null이어야 합니다."},{"id":"t8-03","ty":"mc","lv":2,"game":true,"p":"검증을 통과한 뒤 제어에 쓰는 최종 좌표는?","o":["LLM이 답한 좌표","두 좌표의 평균","검출기 원본 좌표","반올림 4자리 값"],"a":2,"h":"LLM은 좌표를 새로 만들지 않고 관측에 있는 관절을 선택하는 역할만 합니다. 검증이 통과하면 LLM이 답한 center 대신 관측의 원래 xy를 반환하므로, 제어에 쓰이는 좌표의 출처는 YOLO 검출 결과입니다.","w":"축별 오차를 통과하면 반환 center는 검출기 원본 좌표입니다. LLM은 관측에 있는 관절을 선택할 뿐입니다.","an":"슬라이드 p.105·110","src":"LLM은 좌표를 새로 발명하는 대신 관측에 존재하는 관절을 선택합니다. 최종 좌표는 검출기의 원래 값을 사용합니다."},{"id":"t8-04","ty":"mc","lv":3,"game":true,"p":"validator의 tolerance=0.002의 의미는?","o":["화면 넓은 영역 허용","거리 전체 허용치","관절 confidence 기준","축별 반올림 차이 허용"],"a":3,"h":"compact_pose_measurements는 전송용 복사본의 숫자를 소수 네 자리로 줄입니다. 그래서 LLM이 돌려준 좌표와 원본 관측 사이에 생기는 아주 작은 차이를 각 좌표 축마다 허용하는 값이며, 거리 전체나 넓은 영역을 허용하는 값이 아닙니다.","w":"tolerance는 각 좌표 축의 작은 전송 반올림 차이를 허용하는 기준입니다. 거리 전체나 넓은 영역을 뜻하지 않습니다.","an":"슬라이드 p.110","src":"compact_pose_measurements는 전송용 복사본의 숫자를 소수 네 자리로 줄입니다. 원본 observation을 반올림해서 덮어쓰는 것이 아닙니다. validator의 tolerance=0.002는 각 좌표 축에서 작은 전송 반올림 차이를 허용하는 기준입니다. 거리 전체를 뜻하거나 화면의 넓은 영역을 대충 허용하는 값이 아닙니다."},{"id":"t8-05","ty":"mc","lv":2,"game":false,"p":"추종 대상을 nose에서 left_wrist로 바꿀 때 함께 바꿔야 하는 것은?","o":["instruction과 target_keypoint","카메라 해상도","TTL 값","Domain 번호"],"a":0,"h":"자연어 지시와 검증 대상 관절이 서로 다르면 모델 답이 지시에는 맞아도 validator에서 거부됩니다. 그래서 launch에서 자유 지시문과 검증할 관절 이름 두 값을 함께 바꿔 서로 일치시켜야 합니다.","w":"지시(instruction)와 target_keypoint를 함께 바꿔야 합니다. 둘이 모순되면 모델 답이 자연어로는 맞아도 validator에서 거부됩니다.","an":"슬라이드 p.111·113","src":"target_keypoint와 instruction을 서로 모순되게 두면 모델의 답이 자연어에는 맞지만 validator에서 거부될 수 있습니다. launch에서 두 값을 함께 바꾸고 prompt 및 expected_keypoint가 어떻게 연결되는지 확인합니다."},{"id":"t8-06","ty":"ox","lv":2,"game":true,"p":"다른 frame_id의 응답이면 같은 이름의 코라도 거부한다.","a":true,"h":"validator는 응답의 frame_id가 실제 관측과 같은지를 가장 먼저 대조합니다. 관절 이름이 같더라도 다른 프레임에서 나온 판단이면 지금 관측의 좌표와 시간 관계가 맞지 않으므로 추종을 허용하지 않습니다.","w":"맞습니다. frame_id가 다르면 같은 관절 이름이어도 거부합니다.","an":"슬라이드 p.105","src":"● 다른 frame_id면 같은 이름의 코라도 거부합니다.\n● 다른 관절·누락·낮은 confidence는 추종을 허용하지 않습니다."},{"id":"t8-07","ty":"ox","lv":2,"game":true,"p":"tolerance를 크게 늘리는 것은 정책 변화 없이 거부만 줄이는 안전한 방법이다.","a":false,"h":"tolerance=0.002는 전송 시 소수 네 자리 반올림으로 생기는 작은 차이만 허용하는 값입니다. 이를 크게 늘려 거부를 없애면 관측 근거가 없는 좌표까지 승인하게 되므로, 단순 조정이 아니라 다른 정책으로 바뀌는 것입니다.","w":"틀렸습니다. tolerance를 크게 늘리면 관측 근거 없는 좌표까지 허용하는 다른 정책이 됩니다.","an":"슬라이드 p.111·113","src":"target_keypoint와 instruction을 서로 모순되게 두면 모델의 답이 자연어에는 맞지만 validator에서 거부될 수 있습니다. launch에서 두 값을 함께 바꾸고 prompt 및 expected_keypoint가 어떻게 연결되는지 확인합니다. tolerance를 크게 늘려 거부를 없애는 것은 관측 근거가 없는 좌표까지 허용하는 다른 정책입니다."},{"id":"t8-08","ty":"match","lv":2,"game":false,"p":"pose 응답 필드와 내용을 연결하세요.","pairs":[["command","FOLLOW 또는 STOP"],["keypoint","지시한 관절 이름"],["center","그 관절의 xy 좌표"],["frame_id","관측과 같은 ID"],["reason","판단 설명"]],"h":"pose 응답은 command·keypoint·center·frame_id·reason 다섯 필드입니다. command는 이동 허용/정지, keypoint는 지시받은 관절 이름, center는 그 관절의 좌표, frame_id는 관측과 맞춰 볼 ID, reason은 설명 문장입니다.","w":"필드는 command·keypoint·center·frame_id·reason입니다. 실제 제어에는 검출 원본 좌표를 씁니다.","an":"슬라이드 p.103","src":"● 필드: command·keypoint·center·frame_id·reason\n● FOLLOW는 지시한 관절과 입력 xy가 일치해야 합니다."},{"id":"t8-09","ty":"order","lv":2,"game":false,"p":"코 추종 파이프라인의 순서를 맞추세요.","steps":["YOLO26n pose로 사람·17관절 검출","가장 큰 사람의 전체 관절 JSON","텍스트 LLM에 코 추종 지시","frame·관절·좌표를 원본과 대조","검증된 코 좌표로 ROS 목표·속도"],"h":"코 추종은 검출 → 선택 → LLM → 검증 → 제어 순서입니다. YOLO26n pose로 관절을 얻고, 가장 큰 사람의 전체 관절을 JSON으로 만들어 텍스트 LLM에 지시를 보내며, 응답을 원본과 대조한 뒤 검증된 좌표로 ROS 목표와 속도를 만듭니다.","w":"pose 검출 결과에서 한 사람을 골라 LLM에 보내고, 응답을 원본과 대조한 뒤에만 ROS 목표로 씁니다.","an":"슬라이드 p.101","src":"1. YOLO26n pose\n사람·17관절 검출\n2. 가장 큰 사람\n전체 관절 JSON\n3. 텍스트 LLM\n코 추종 지시\n4. 원본 대조\nframe·관절·좌표\n5. ROS 목표·속도\n검증된 코 좌표"},{"id":"t8-10","ty":"multi","lv":2,"game":true,"p":"validator가 FOLLOW를 <b>거부<\/b>하는 경우를 모두 고르세요.","o":["다른 frame_id","지시와 다른 관절","낮은 관절 confidence","누락된 관절","축별 오차 0.001"],"a":[0,1,2,3],"h":"validator는 FOLLOW 응답이 관측 근거와 맞는지 확인합니다. 프레임이 다르거나, 지시하지 않은 관절을 골랐거나, 해당 관절이 누락됐거나 신뢰도가 낮으면 추종을 허용하지 않고, 축별 오차가 경계 이내인 경우만 통과시킵니다.","w":"다른 frame·다른 관절·누락·낮은 confidence는 추종을 허용하지 않습니다. 0.001은 tolerance 0.002 이내라 통과합니다.","an":"슬라이드 p.105","src":"● 다른 frame_id면 같은 이름의 코라도 거부합니다.\n● 다른 관절·누락·낮은 confidence는 추종을 허용하지 않습니다.\n● 축별 오차 경계는 포함하고 최종 xy는 검출값으로 복원합니다."}]},{"id":"t9","title":"Segmentation·YOLO 학습·결과 정리","ref":"07·Colab · 슬라이드 p.116–134","qs":[{"id":"t9-01","ty":"mc","lv":1,"game":true,"p":"binary mask에서 1(True)의 의미는?","o":["제외","포함","경계","불확실"],"a":1,"h":"binary mask는 각 픽셀이 해당 객체에 속하는지를 0/1(또는 False/True) 두 값으로만 표시하는 배열입니다. 0.2 같은 soft 값은 거부되며, 0은 제외를 뜻하니 1은 그 반대 의미입니다.","w":"1 또는 True는 포함, 0 또는 False는 제외입니다. 0.2 같은 soft 값은 binary mask 계약에서 거부합니다.","an":"슬라이드 p.124","src":"● 1 또는 True는 포함, 0 또는 False는 제외입니다."},{"id":"t9-02","ty":"num","lv":2,"game":false,"p":"2×3 mask에 포함 픽셀이 3개일 때 면적 비율 ratio는?","a":0.5,"unit":"","h":"ratio는 mask의 포함 픽셀 수를 영상 전체 픽셀 수로 나눈 무차원 비율입니다. 2×3 mask의 전체 칸은 W×H = 3×2이므로 계산식은 ratio = 3 ÷ (3 × 2)입니다.","w":"3÷(3×2)=0.5입니다. min_pixels와 같은 크기는 결과에 포함합니다.","an":"슬라이드 p.125","src":"● pixels는 mask의 포함 픽셀 \n수입니다.\n● ratio=pixels/(W×H)입니다."},{"id":"t9-03","ty":"mc","lv":2,"game":true,"p":"ROI coverage의 분모는?","o":["전체 화면 픽셀 수","ROI 픽셀 수","mask 개수","포함 픽셀 수"],"a":1,"h":"ROI는 검사할 관심 영역이고, ROI coverage는 그 영역 안에서 얼마나 채워졌는지를 나타냅니다. 그래서 분모는 전체 화면이 아니라 관심 영역 자체의 크기이며, 전체 화면 비율과 서로 다른 값입니다.","w":"ROI coverage는 ROI 내부 포함 픽셀 수÷ROI 픽셀 수입니다. 겹치는 mask를 단순히 더해 중복 계산하지 않습니다.","an":"슬라이드 p.126","src":"● ROI는 검사할 관심 영역입니다.\n● ROI coverage는 ROI 내부 포함 픽셀 수÷ROI 픽셀 수입니다.\n● 전체 화면 비율과 ROI 비율은 서로 다릅니다."},{"id":"t9-04","ty":"mc","lv":2,"game":true,"p":"YOLO26의 특징으로 맞는 것은?","o":["NMS 후처리 필수","분류 전용 모델","NMS-Free 엔드투엔드","CPU 미지원"],"a":2,"h":"YOLO26은 바운딩 박스를 정제할 때 필요했던 NMS 후처리 단계를 모델 구조 내부로 통합했습니다. 그 결과 별도 후처리 없이 입력부터 출력까지 한 번에 처리되어 CPU·임베디드 기기의 추론 병목이 줄었습니다.","w":"YOLO26은 NMS-Free 엔드투엔드 추론 구조로 엣지 기기의 지연을 줄였습니다. 검출·분할·pose 등 여러 태스크를 지원합니다.","an":"Train_YOLO26n_in_Colab YOLO26","src":"* **NMS-Free 엔드투엔드 아키텍처:** 바운딩 박스를 정제할 때 필수적이었던 NMS 후처리 단계를 모델 구조 내부로 통합하여, CPU 및 임베디드 기기에서 발생하는 추론 병목을 크게 완화했습니다."},{"id":"t9-05","ty":"mc","lv":2,"game":true,"p":"Colab 실습에서 학습한 모델을 배포용으로 변환한 형식은?","o":["ONNX","CSV","PNG","YAML"],"a":0,"h":"Colab 실습에서는 학습을 마친 모델에 <code>model.export(format=...)<\/code>를 호출해 여러 프레임워크에서 공통으로 쓰는 개방형 신경망 교환 형식으로 바꾼 뒤, OpenCV와 그 형식 전용 Runtime으로 추론합니다. export 인자에 들어간 형식 이름을 확인하세요.","w":"model.export(format='onnx')로 변환한 뒤 OpenCV와 ONNX Runtime으로 추론합니다. YAML은 데이터셋 설정 파일입니다.","an":"Train_YOLO26n_in_Colab ONNX 변환","src":"# ONNX로 모델 변환\nmodel.export(format='onnx')"},{"id":"t9-06","ty":"ox","lv":2,"game":true,"p":"mask의 픽셀 비율은 곧 실제 물리 면적(cm²)이다.","a":false,"h":"mask의 픽셀 비율은 영상 영역 중 몇 %인지 나타내는 무차원 값입니다. 카메라에 가까운 객체는 같은 실제 크기도 더 크게 보이고 원근·렌즈·가림·해상도도 영향을 주므로, 실제 cm²를 구하려면 보정과 기하 조건이 더 필요합니다.","w":"틀렸습니다. 가까운 물체는 더 크게 보이므로 실제 면적 계산에는 보정과 기하 조건이 더 필요합니다.","an":"슬라이드 p.123·127","src":"● 카메라에 가까운 객체는 같은 실제 크기도 더 크게 보입니다.\n● 원근·렌즈·가림·해상도가 픽셀 면적에 영향을 줍니다.\n● 실제 cm² 계산에는 보정과 기하 조건이 더 필요합니다."},{"id":"t9-07","ty":"ox","lv":2,"game":true,"p":"4일차의 좌표·검증·제어는 사람이 설계한 Pseudo-VLA이다.","a":true,"h":"4일차는 규칙·VLM·LLM의 판단을 사람이 직접 설계한 좌표 변환·검증·제어 코드에 연결했습니다. 학습된 행동 정책이 직접 행동을 내는 것은 5일차 VLA이고, 4일차는 그 이전 단계인 '유사' VLA입니다.","w":"맞습니다. 4일차는 판단을 사람이 만든 좌표·제어 코드에 연결한 Pseudo-VLA이며, 5일차는 전용 VLA 환경에서 학습된 정책을 실행합니다.","an":"슬라이드 p.121–122","src":"● 손 추종·TTL·YOLO·pose → LLM의 결과를 저장합니다.\n● 오늘의 좌표·검증·제어는 사람이 설계한 Pseudo-VLA입니다.\n● Segmentation은 07 노트북의 선택 자습으로 남깁니다.\n● 5일차에는 전용 VLA 환경에서 학습된 행동 정책을 실행합니다."},{"id":"t9-08","ty":"match","lv":1,"game":false,"p":"mask 후처리와 효과를 연결하세요.","pairs":[["erosion","경계를 줄임"],["dilation","경계를 늘림"],["opening","erosion 다음 dilation"]],"h":"erosion은 mask의 경계를 깎아 줄이고 dilation은 경계를 넓힙니다. opening은 두 연산을 차례로 적용하는데, 먼저 깎아서 고립 잡음을 없앤 뒤 다시 넓혀 원래 크기를 복원하는 순서입니다.","w":"opening은 고립 잡음을 줄일 수 있지만 작은 중요 객체도 지울 수 있으므로 원본과 픽셀 수를 함께 비교합니다.","an":"슬라이드 p.134","src":"● erosion은 경계를 줄이고 dilation은 늘립니다.\n● opening은 erosion 다음 dilation을 적용합니다."},{"id":"t9-09","ty":"order","lv":2,"game":false,"p":"Colab에서 YOLO26n을 VOC로 학습하는 순서를 맞추세요.","steps":["Ultralytics 설치","VOC 데이터셋 다운로드","XML 어노테이션을 YOLO 형식으로 변환","train/val 분할과 yaml 작성","YOLO26n 학습","ONNX 변환과 추론"],"h":"학습 과정은 준비 → 데이터 → 변환 → 설정 → 학습 → 배포 순서입니다. 먼저 패키지를 설치하고 VOC를 내려받은 뒤, XML 어노테이션을 YOLO 형식으로 바꾸고 train/val을 나눠 yaml을 쓴 다음 학습하고 마지막에 배포 형식으로 변환합니다.","w":"패키지와 데이터를 준비하고 어노테이션을 변환·분할해 yaml을 쓴 뒤 학습하고, ONNX로 변환해 추론합니다.","an":"Train_YOLO26n_in_Colab 실습","src":"### VOC의 xml 데이터셋을 YOLO 훈련을 위해 변환\n\n클래스 이름 텍스트파일로 저장"},{"id":"t9-10","ty":"multi","lv":2,"game":true,"p":"실습 결과를 정리할 때 지켜야 할 것을 모두 고르세요.","o":["측정 안 한 값은 미측정","항상 STOP을 성공으로 쓰지 않음","형식·선택·행동·지연을 나눠 비교","미측정 값을 0으로 채움","손·코 과제를 같은 입력으로 봄"],"a":[0,1,2],"h":"결과 정리에서는 형식·목표 선택·실제 행동·지연을 나누어 비교하고, 측정하지 않은 조건은 0이나 성공으로 채우지 않고 미측정으로 남깁니다. 항상 멈추기만 한 결과는 추종에 성공했다고 기록하지 않습니다.","w":"미측정은 미측정으로 남기고, 항상 STOP인 결과를 추종 성공으로 쓰지 않으며, 형식·목표 선택·행동·지연을 나눠 봅니다. 손 과제와 코 과제는 입력이 다릅니다.","an":"슬라이드 p.116–121","src":"● 형식·목표 선택·실제 행동·지연을 나누어 비교합니다.\n● 측정하지 않은 조건은 미측정으로 남깁니다."}]}]};

const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function say(msg){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=msg,30);}
async function copy(text){

  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();

}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

function cardHTML(q,n){
  const [label,color]=TYPES[q.ty];
  const g=cur.graded, a=cur.ans[q.id], fa=finalAns(q), ok=g&&isCorrect(q,fa);
  const lock=g?' disabled':'';
  let body='';
  if(q.ty==='mc'||q.ty==='multi'){
    const multi=q.ty==='multi', mine=multi?(a||[]):[a];
    body='<div class="opts">'+q.o.map((o,i)=>{
      const right=multi?q.a.includes(i):q.a===i, picked=mine.includes(i);
      const cls=g?(right?' ans':picked?' miss':''):'';
      return `<label class="opt${cls}"><span class="onum">${i+1}</span><input type="${multi?'checkbox':'radio'}" name="r-${q.id}" data-act="${multi?'tick':'pick'}" data-q="${q.id}" data-i="${i}"${picked?' checked':''}${lock}><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(q.ty==='ox'){
    body='<div class="ox">'+[true,false].map(v=>{
      const cls=g?(q.a===v?' ans':a===v?' miss':''):'';
      return `<button type="button" class="${cls.trim()}" data-act="ox" data-q="${q.id}" data-v="${v?1:0}" data-fk="${q.id}-ox${v?1:0}" aria-pressed="${a===v}" aria-label="${v?'맞다 O':'틀리다 X'}"${lock}>${v?'O':'X'}</button>`;
    }).join('')+'</div>';
  }else if(q.ty==='match'){
    const m=a||{}, sel=cur.msel[q.id], linkedBy={};
    Object.entries(m).forEach(([l,r])=>linkedBy[r]=+l);
    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${PAL[i%PAL.length]})" data-act="ml" data-q="${q.id}" data-i="${i}" data-fk="${q.id}-l${i}"${lock}><span class="tag">${LETTER[i]}</span>${esc(p[0])}</button>`;
    }).join('');
    const right=cur.shuf[q.id].map(j=>{
      const by=linkedBy[j], linked=by!=null, cls=(linked?' linked':'')+(g&&linked?(by===j?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${linked?PAL[by%PAL.length]:'--line'})" data-act="mr" data-q="${q.id}" data-j="${j}" data-fk="${q.id}-r${j}"${lock}><span class="tag">${linked?LETTER[by]:''}</span>${esc(q.pairs[j][1])}</button>`;
    }).join('');
    body=`<div class="match"><div class="mcol mleft">${left}</div><div class="mcol mright">${right}</div></div>`;
  }else if(q.ty==='order'){
    const seq=a||[], full=seq.length===q.steps.length;
    body='<div class="olist">'+(cur.shuf[q.id]||range(q.steps.length)).map(si=>{
      const pos=seq.indexOf(si), on=pos>=0;
      const cls=(on?' on':'')+(g?(pos===si?' ok':' no'):'');
      const fix=g&&pos!==si?`<span class="ofix">정답 ${si+1}</span>`:'';
      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }
  const numAns=q.ty==='mc'?`${q.a+1}번 · `:q.ty==='multi'?q.a.map(i=>i+1).join('·')+'번 · ':'';
  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${mediaHTML(q)}${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>${voiceRow(q,q.id)}`}${body}${exp}</article>`;
}
const LV_NAME=['쉬움','보통','어려움'];
function lvHTML(lv){
  lv=lv||1;
  const dots=[1,2,3].map(k=>k<=lv?`<i class="d${k}">●</i>`:'<i class="off">○</i>').join('');
  return `<span class="lv lv${lv}" title="난이도 ${LV_NAME[lv-1]}"><span class="dots" aria-hidden="true">${dots}</span><em>${LV_NAME[lv-1]}</em></span>`;
}
// 자료 발췌: 이스케이프 후 마크다운 기호만 가볍게 서식으로 (**굵게**, `코드`, 머리 #)
const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
function hintHTML(q){
  if(!q.h)return '';
  const open=cur.hints.has(q.id), label=q.ty==='num'?'Hint · 계산식':'Hint';
  // 2단계: ① 자세한 힌트(h) ② 자료 보기 — 자료 원문 발췌(src) + 위치(an)
  const sopen=cur.srcs.has(q.id);
  const src=q.src?`<div class="srcwrap"><button type="button" class="srcbtn" data-act="src" data-q="${q.id}" data-fk="${q.id}-src" aria-expanded="${sopen}" aria-controls="src-${q.id}">`+
    `<span class="caret" aria-hidden="true">${sopen?'▾':'▸'}</span>📖 자료 보기</button>`+
    (sopen?`<blockquote class="src" id="src-${q.id}"><p>${srcText(q.src)}</p>${q.an?`<cite>${esc(q.an)}</cite>`:''}</blockquote>`:'')+`</div>`:'';
  return `<div class="hintwrap"><button type="button" class="hintbtn" data-act="hint" data-q="${q.id}" data-fk="${q.id}-hint" aria-expanded="${open}" aria-controls="hint-${q.id}">`+
    `<span class="caret" aria-hidden="true">${open?'▾':'▸'}</span>${label}</button>`+
    (open?`<div class="hint" id="hint-${q.id}">${q.h}${src}</div>`:'')+`</div>`;
}
function refreshCard(q){
  const el=document.getElementById('card-'+q.id);if(!el)return;
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  el.outerHTML=cardHTML(q,el.dataset.n);
  if(fk){const f=app.querySelector(`[data-fk="${fk}"]`);if(f&&!f.disabled)f.focus();}
  updateProgress();
}
const pad2=n=>String(n).padStart(2,'0');
const fmtCnt=(n,t)=>`(${pad2(n)}/${pad2(t)})`;
// 탭별 푼 문항 수: 지금 보는 탭 → 화면 상태, 그 외 → 풀던 답(drafts) → 채점 기록
function tabAnswered(t){
  const src=cur&&cur.mode==='study'&&cur.tab===t?cur.ans:(S.drafts[t.id]||(S.tabs[t.id]&&S.tabs[t.id].answers)||{});
  return t.qs.filter(q=>isAnswered(q,src[q.id])).length;
}
function updateProgress(){
  const p=document.getElementById('pbar');if(!p||!cur)return;
  const n=cur.list.filter(answered).length, cnt=fmtCnt(n,cur.list.length);
  p.style.width=pct(n,cur.list.length)+'%';
  document.getElementById('ptxt').textContent=`${n} / ${cur.list.length} 응답`;
  const g=document.getElementById('gradeCnt');if(g)g.textContent=cnt;
  if(cur.mode==='study'){
    const c=document.getElementById('qc-'+cur.tab.id);if(c)c.textContent=cnt;
    if(!cur.graded){  // 풀던 답 저장 → 탭을 옮겨도 유지
      if(n||Object.keys(cur.ans).some(k=>{const v=cur.ans[k];return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:v!=null&&v!=='';}))
        S.drafts[cur.tab.id]=JSON.parse(JSON.stringify(cur.ans));
      else delete S.drafts[cur.tab.id];
      save();
    }
  }
}

/* ── 음성 선택 · 문제 읽기 · 그림/오디오 (qb-voice.js가 없으면 모두 숨김) ── */
const hasVoice=()=>!!(window.QBVoice&&QBVoice.supported());
const hasRead=()=>!!(window.QBVoice&&QBVoice.canSpeak());
const IC_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const IC_VOL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const VC=new Map();  // 학습 모드 문항별 음성 컨트롤러
function voiceReset(){VC.clear();if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}}
function voiceRow(q,fkp){
  const mic=hasVoice()&&['mc','multi','ox'].includes(q.ty), rd=hasRead();
  if(!mic&&!rd)return '';
  const qa=fkp?` data-q="${q.id}"`:'';
  return `<div class="vrow noprint">`+
    (mic?`<button type="button" class="vbtn vmic" data-act="vmic"${qa} data-fk="${fkp}-vmic" data-state="idle" aria-pressed="false">${IC_MIC}<span>말하기</span></button>`:'')+
    (rd?`<button type="button" class="vbtn" data-act="vread"${qa} data-fk="${fkp}-vread">${IC_VOL}<span>문제 읽기</span></button>`:'')+
    (mic?`<span class="vstat" aria-live="polite"></span><span class="vhint">말하기 어려우면 눌러서 고르세요</span>`:'')+`</div>`;
}
function mediaHTML(q){
  let h='';
  if(q.img&&q.img.src)h+=`<figure class="qfig"><img src="${esc(q.img.src)}" alt="${esc(q.img.alt)}" loading="lazy">${q.img.caption?`<figcaption>${esc(q.img.caption)}</figcaption>`:''}</figure>`;
  if(q.audio&&q.audio.src)h+=`<div class="qaud"><audio controls preload="none" src="${esc(q.audio.src)}"></audio><details><summary>대본</summary><p>${esc(q.audio.transcript)}</p></details></div>`;
  return h;
}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
// 읽어 줄 글: 문제 + 화면에 보이는 순서의 보기("1번 …")
function readText(q,n,order){
  let t=(n?`${n}번 문제. `:'')+plain(q.p)+'.';
  if(q.img&&q.img.alt)t+=' 그림 설명. '+q.img.alt+'.';
  if(q.ty==='ox')t+=' 맞으면 O, 틀리면 X.';
  else if(q.ty==='mc'||q.ty==='multi')t+=(order||range(q.o.length)).map((oi,k)=>` ${k+1}번. ${plain(q.o[oi])}.`).join('');
  return t;
}
function readAloud(text){if(QBVoice.isSpeaking())QBVoice.cancelSpeak();else QBVoice.speak(text);}
// 음성으로 고른 것 = 보기를 직접 누른 것과 같은 경로(입력 click → 기존 change/click 처리)
function voicePick(q,r){
  if(!cur||cur.graded)return;
  const card=document.getElementById('card-'+q.id);if(!card)return;
  const el=r.kind==='ox'?card.querySelector(`[data-act="ox"][data-v="${r.v==='O'?1:0}"]`):card.querySelector(`input[data-i="${r.i}"]`);
  if(el&&!el.disabled)el.click();
}
function studyVoice(q){
  let c=VC.get(q.id);if(c)return c;
  const card=()=>document.getElementById('card-'+q.id);
  c=QBVoice.attach({bind:false,button:()=>card()&&card().querySelector('.vmic'),live:()=>card()&&card().querySelector('.vstat'),
    getOptions:()=>q.ty==='ox'?2:q.o.length,getType:()=>q.ty,select:r=>voicePick(q,r)});
  VC.set(q.id,c);return c;
}

/* 학습 화면 상호작용 */
function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;
  else if(el.dataset.act==='tick'){
    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);
  }
  cur.armed=false;updateProgress();
}
function onSheetInput(el){
  if(el.dataset.act==='num'&&!cur.graded){cur.ans[el.dataset.q]=el.value;cur.armed=false;updateProgress();}
}

/* ── 화면: 학습 ────────────────────────── */
function viewStudy(tid,fresh){
  const tab=TABS.find(t=>t.id===tid)||TABS[0];
  cur=newSheet('study',tab.qs,tab);
  const rec=S.tabs[tab.id], draft=S.drafts[tab.id];
  if(fresh){delete S.drafts[tab.id];save();}
  else if(draft){Object.assign(cur.ans,JSON.parse(JSON.stringify(draft)));}  // 풀던 중이면 이어서
  else if(rec&&rec.answers){
    Object.assign(cur.ans,JSON.parse(JSON.stringify(rec.answers)));
    (rec.touched||[]).forEach(id=>cur.touched.add(id));
    cur.graded=true;
  }
  renderSheet();
}
function renderSheet(){
  voiceReset();
  const study=cur.mode==='study', tab=cur.tab;
  const tabbar=study?`<nav class="tabbar noprint" role="tablist" aria-label="탭">${TABS.map((t,i)=>{const r=S.tabs[t.id];

      ${allGraded()?'<a class="tabchip sum" href="#summary">★ 종합</a>':''}</nav>`:'';
  const head=study?`<div class="tabhead"><h2>${tab.idx+1}. ${esc(tab.title)}</h2>${tab.ref?`<span class="part">${esc(tab.ref)}</span>`:''}</div>`
                  :`<div class="tabhead"><h2>🔁 오답 다시 풀기</h2><span class="part">${cur.list.length}문항</span></div>`;
  const next=study?(tab.idx+1<TABS.length?`<a class="btn" href="#study/${TABS[tab.idx+1].id}">다음 탭 →</a>`:(allGraded()?'<a class="btn" href="#summary">★ 종합 결과</a>':'')):'<a class="btn" href="#notes">오답노트로</a>';
  app.innerHTML=`<div class="sheet">
  <nav class="crumbs noprint"><a href="#home">← 홈</a><span>/</span><span>${study?'학습 모드':'오답노트'}</span></nav>
  ${tabbar}${head}
  <div class="progress"><div class="bar"><div id="pbar"></div></div><span id="ptxt"></span></div>
  <div id="sheetResult">${cur.graded?sheetResultHTML():''}</div>
  <div id="cards" class="${cur.onlyWrong?'onlywrong':''}">${cur.list.map((q,i)=>cardHTML(q,i+1)).join('')}</div>
  <p class="warn" id="warn" role="status"></p>

function gradeSheet(){
  const miss=cur.list.map((q,i)=>answered(q)?0:i+1).filter(Boolean);
  if(miss.length&&!cur.armed){
    cur.armed=true;
    document.getElementById('warn').textContent=`미응답 ${miss.length}문항 (Q${miss.join(', Q')}). 한 번 더 누르면 미응답은 오답으로 채점합니다.`;
    return;
  }
  const firstUnlock=!gameUnlocked();
  cur.graded=true;
  const snap={};let score=0;
  cur.list.forEach(q=>{
    const a=finalAns(q);
    if(a!=null)snap[q.id]=a;
    if(isCorrect(q,a)){score++;markSolved(q.id);}
    else addWrong(q.id,answerText(q,a));
  });
  if(cur.mode==='study'){
    S.tabs[cur.tab.id]={score,total:cur.list.length,answers:snap,touched:[...cur.touched],at:Date.now()};
    delete S.drafts[cur.tab.id];
  }
  save();
  renderSheet();
  window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
  say(`채점 결과 ${score}점, ${cur.list.length}문항 중`);
  if(cur.mode==='study'&&firstUnlock)setTimeout(()=>toast('⚡ 게임 모드와 해설지가 열렸습니다!'),300);
  else if(cur.mode==='study'&&allGraded())setTimeout(()=>toast('★ 모든 탭 완료! 종합 결과를 확인하세요.'),300);
}

function startGame(){
  const pool=gamePool(gameSetup.scope).slice(0,gameSetup.count);
  if(!pool.length){toast('출제할 문항이 없습니다.');return;}
  G={qs:pool,i:0,score:0,combo:0,maxCombo:0,results:[],locked:false,mode:gameSetup.mode,time:gameSetup.time};
  renderGameQ();
}
function renderGameQ(){
  voiceReset();
  const q=G.qs[G.i];
  G.locked=false;G.elapsed=0;G.last=performance.now();G.limit=G.time*1000;G.warned=false;G.pick=[];
  G.view=q.ty==='ox'?[true,false]:shuffle(range(q.o.length));
  const opts=q.ty==='ox'
    ?`<div class="gox">${G.view.map((v,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}" aria-label="${v?'O 맞다':'X 틀리다'}">${v?'O':'X'}</button>`).join('')}</div>`
    :`<div class="gopts">${G.view.map((oi,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}"${q.ty==='multi'?' aria-pressed="false"':''}><kbd>${k+1}</kbd><span>${esc(q.o[oi])}</span></button>`).join('')}</div>`;
  app.innerHTML=`
  <div class="game play">
    <div class="gtop"><div class="hud"><span>${G.i+1} / ${G.qs.length}</span><span class="combo${G.combo>=3?' hot':''}">🔥 콤보 ${G.combo}</span><span class="pts">${G.score.toLocaleString()}점</span></div>
    <div class="timer" id="timer"><div id="tbar"></div></div><div class="tleft" id="tleft"></div></div>
    <div class="gtype">${TYPES[q.ty][0]}${q.ty==='multi'?' · 모두 고른 뒤 제출':''}</div>
    <div class="gq">${q.p}</div>${mediaHTML(q)}
    <div class="gbottom">${voiceRow(q,'g')}${opts}
    <div class="gfloat" id="gfloat" aria-live="polite"></div>
    <div class="gsub"><button class="btn" type="button" data-act="gquit">그만하기</button>
      ${q.ty==='multi'?'<button class="btn primary" type="button" data-act="gsubmit">제출 (Enter)</button>':''}</div></div>
  </div>`;
  if(hasVoice())G.vc=QBVoice.attach({bind:false,button:()=>app.querySelector('.vmic'),live:()=>app.querySelector('.vstat'),
    getOptions:()=>G.view.length,getType:()=>q.ty,
    select:r=>gameAnswer(r.kind==='ox'?(r.v==='O'?0:1):r.i),submit:q.ty==='multi'?gameSubmit:null});  // 말하면 클릭과 같게 바로 선택(·제출)
  G.raf=requestAnimationFrame(tick);
}
function tick(now){
  if(!G||G.locked)return;
  G.elapsed+=now-G.last;G.last=now;
  const rem=Math.max(0,G.limit-G.elapsed), ratio=rem/G.limit;
  const shown=RM.matches?Math.ceil(rem/1000)*1000/G.limit:ratio;
  const bar=document.getElementById('tbar'), tm=document.getElementById('timer');
  if(bar){bar.style.width=(Math.min(1,shown)*100)+'%';tm.className='timer'+(ratio<.25?' lo':ratio<.5?' mid':'');
    document.getElementById('tleft').textContent=(rem/1000).toFixed(1)+'초';}
  if(!G.warned&&rem<=5000){G.warned=true;say('5초 남았습니다');}
  if(rem<=0){judge(null,true);return;}
  G.raf=requestAnimationFrame(tick);
}
function judge(ans,timeout){
  if(!G||G.locked)return;
  G.locked=true;cancelAnimationFrame(G.raf);
  const q=G.qs[G.i], used=Math.min(G.elapsed,G.limit), ok=!timeout&&isCorrect(q,ans);
  let gain=0;
  if(ok){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const mult=G.combo>=5?1.5:G.combo>=3?1.2:1;
    gain=Math.round((100+Math.floor((G.limit-used)/100))*mult);G.score+=gain;}
  else G.combo=0;
  G.results.push({id:q.id,ok,ans,timeout,ms:used,gain});
  // 판정 표시
  app.querySelectorAll('[data-act="gans"]').forEach(b=>{
    const k=+b.dataset.k, v=G.view[k];
    const right=q.ty==='ox'?q.a===v:q.ty==='mc'?q.a===v:q.a.includes(v);
    const picked=q.ty==='ox'||q.ty==='mc'?ans===v:(ans||[]).includes(v);
    if(right)b.classList.add('ans');else if(picked)b.classList.add('miss');
    b.disabled=true;
  });
  const f=document.getElementById('gfloat');
  f.className='gfloat pop '+(ok?'ok':'no');
  f.textContent=ok?`+${gain}${G.combo>=3?` 🔥×${G.combo>=5?'1.5':'1.2'}`:''}`:timeout?'⏰ 시간 초과':'✗ 오답';
  if(timeout){const tm=document.getElementById('timer');tm&&tm.classList.add('out');}
  const sb=app.querySelector('[data-act="gsubmit"]');if(sb)sb.disabled=true;
  app.querySelector('.pts').textContent=G.score.toLocaleString()+'점';
  const c=app.querySelector('.combo');c.textContent='🔥 콤보 '+G.combo;c.classList.toggle('hot',G.combo>=3);
  G.next=setTimeout(()=>{if(!G)return;G.i++;G.i<G.qs.length?renderGameQ():finishGame();},ok?900:1400);
}
function gameAnswer(k){
  if(!G||G.locked)return;
  const q=G.qs[G.i];if(k<0||k>=G.view.length)return;
  if(q.ty==='multi'){
    const v=G.view[k], i=G.pick.indexOf(v);
    i<0?G.pick.push(v):G.pick.splice(i,1);
    const b=app.querySelector(`[data-act="gans"][data-k="${k}"]`);b&&b.setAttribute('aria-pressed',i<0);
  }else judge(G.view[k],false);
}
function gameSubmit(){if(G&&!G.locked&&G.qs[G.i].ty==='multi')judge(G.pick.slice(),false);}
function stopGame(){if(G){cancelAnimationFrame(G.raf);clearTimeout(G.next);G=null;}}
function finishGame(){
  const R=G.results, correct=R.filter(r=>r.ok).length, M=GAME_MODES[G.mode];
  R.forEach(r=>{const q=QMAP[r.id];if(r.ok)markSolved(r.id);else addWrong(r.id,r.timeout?'(시간 초과)':answerText(q,r.ans));});
  const rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:(S.name||'').trim()||'익명',score:G.score,
    correct,total:R.length,rate:pct(correct,R.length),avg:Math.round(R.reduce((s,r)=>s+r.ms,0)/R.length/100)/10,combo:G.maxCombo,mode:G.mode,time:G.time,at:Date.now()};
  const rank=Leaderboard.add(rec);
  save();
  const board=Leaderboard.load(boardKey(rec)), top=board.slice(0,10), mine=board.find(r=>r.id===rec.id);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;
  const row=(r,i)=>`<tr class="${r.id===rec.id?'me':''}"><td>${medal(i)}</td><td>${esc(r.name)}</td><td class="r">${r.score.toLocaleString()}</td><td class="r">${r.rate}%</td><td class="r">${r.correct}/${r.total}</td><td class="r">${new Date(r.at).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}</td></tr>`;
  const wrong=R.filter(r=>!r.ok);
  G=null;
  app.innerHTML=`
  <div class="game">
    <div class="panel center">
      <p class="note-sm" style="margin:0">최종 점수</p>
      <div class="score xl">${rec.score.toLocaleString()}</div>
      <p class="msg">${M.title} · ${rec.time}초 — ${rank===1?'🏆 이 조건 최고 기록!':`이 조건 순위 ${rank}위`}</p>
      <div class="bignum"><div><b>${correct}/${rec.total}</b><span>정답</span></div><div><b>${rec.rate}%</b><span>정답률</span></div><div><b>${rec.avg}초</b><span>평균 응답</span></div><div><b>${rec.combo}</b><span>최고 콤보</span></div></div>
    </div>
    <div class="panel"><h2 class="ph">🏆 순위 · ${M.title.replace(/^\S+\s/,'')} ${rec.time}초 · 이 브라우저 기록</h2>
      <table class="board"><thead><tr><th>#</th><th>이름</th><th class="r">점수</th><th class="r">정답률</th><th class="r">정답</th><th class="r">날짜</th></tr></thead>
      <tbody>${top.map(row).join('')}${rank>10&&mine?row(mine,rank-1):''}</tbody></table></div>
    ${wrong.length?`<details class="more panel"><summary>틀린 문항 ${wrong.length}개 · 해설 보기 (오답노트에 저장됨)</summary>
      ${wrong.map(r=>{const q=QMAP[r.id];return `<div class="keyitem"><div class="kq">${q.p}</div><p class="mine" style="margin:4px 0">내 답: ${esc(r.timeout?'(시간 초과)':answerText(q,r.ans))}</p><p class="ka">정답: ${esc(correctText(q))}</p><p class="kw">${q.w}</p><span class="an">📖 ${esc(q.an)}</span></div>`;}).join('')}</details>`:''}
    <div class="actions"><button class="btn primary" type="button" data-act="gagain">↻ 다시 하기</button><a class="btn" href="#notes">📒 오답노트</a><a class="btn" href="#home">홈</a></div>
  </div>`;
}

/* ── 라우터 · 이벤트 ───────────────────── */
function route(){
  stopGame();voiceReset();cur=null;app.classList.remove('sheet');
  const [v,arg]=(location.hash.slice(1)||'home').split('/');
  ({study:()=>viewStudy(arg),notes:viewNotes,retry:viewRetry,key:viewKey,game:()=>arg?viewGameSetup(arg):viewGamePick(),summary:viewSummary}[v]||viewHome)();
  window.scrollTo(0,0);
}
let resetArmed=false;
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act;
  if(cur&&['ox','ml','mr','ord','hint','src'].includes(act))return onSheetClick(el);
  switch(act){
    case 'grade':gradeSheet();break;
    case 'retab':viewStudy(cur.tab.id,true);window.scrollTo(0,0);break;  // 이전 점수는 다시 채점할 때까지 유지
    case 'onlywrong':cur.onlyWrong=!cur.onlyWrong;document.getElementById('cards').classList.toggle('onlywrong',cur.onlyWrong);el.textContent=cur.onlyWrong?'전체 보기':'오답만 보기';break;
    case 'copyreport':copy(reportMD());break;
    case 'copynotes':copy(`# ${BANK.title}\n\n- 이름: ${S.name||'-'} · ${today()}\n\n`+notesMD(false));break;
    case 'clearsolved':wrongList(true).forEach(id=>delete S.wrong[id]);save();viewNotes();break;
    case 'print':window.print();break;
    case 'reset':
      if(!resetArmed){resetArmed=true;el.textContent='정말 지울까요? 한 번 더 누르세요';setTimeout(()=>{resetArmed=false;if(el.isConnected)el.textContent='이 문제은행 기록 모두 지우기';},4000);break;}
      resetArmed=false;const nm=S.name;S=blank();S.name=nm;save();toast('기록을 지웠습니다');viewHome();break;
    case 'gset':gameSetup[el.dataset.g]=['count','time'].includes(el.dataset.g)?+el.dataset.v:el.dataset.v;viewGameSetup();break;
    case 'gstart':startGame();break;
    case 'gans':gameAnswer(+el.dataset.k);break;
    case 'vmic':{const q=G?null:QMAP[el.dataset.q];const c=G?G.vc:(q&&cur?studyVoice(q):null);if(c)c.toggle();break;}
    case 'vread':{
      if(G){const q=G.qs[G.i];readAloud(readText(q,0,q.ty==='ox'?null:G.view));break;}
      const q=QMAP[el.dataset.q], card=document.getElementById('card-'+el.dataset.q);
      if(q)readAloud(readText(q,card?card.dataset.n:0));break;}
    case 'gsubmit':gameSubmit();break;
    case 'gquit':stopGame();viewGameSetup(gameSetup.mode);break;
    case 'gagain':startGame();break;
  }
});
app.addEventListener('change',e=>{const el=e.target;if(cur&&el.dataset&&(el.dataset.act==='pick'||el.dataset.act==='tick'))onSheetChange(el);});
app.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.act==='name'){S.name=el.value;save();}
  else if(cur)onSheetInput(el);
});
document.addEventListener('keydown',e=>{
  if(!G||G.locked||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.target.matches&&e.target.matches('input,textarea'))return;
  const q=G.qs[G.i], k=e.key.toLowerCase();
  if(q.ty==='ox'){if(k==='o'||k==='1'){e.preventDefault();gameAnswer(0);}else if(k==='x'||k==='2'){e.preventDefault();gameAnswer(1);}return;}
  if(/^[1-9]$/.test(k)){e.preventDefault();gameAnswer(+k-1);}
  else if(k==='enter'&&q.ty==='multi'&&!(e.target.closest&&e.target.closest('.vrow'))){e.preventDefault();gameSubmit();}
});
window.addEventListener('pagehide',()=>{if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}});
document.addEventListener('visibilitychange',()=>{if(G&&!document.hidden)G.last=performance.now();});
// 탭 바 좌우 화살표
app.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('.tabchip');if(!t||(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'))return;
  const n=e.key==='ArrowRight'?t.nextElementSibling:t.previousElementSibling;if(n){e.preventDefault();n.focus();}
});
/* 테마 */
let theme=null;try{theme=localStorage.getItem('qb:theme');}catch(e){}
const applyTheme=()=>{if(theme)document.documentElement.dataset.theme=theme;else delete document.documentElement.dataset.theme;};
applyTheme();
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  theme=dark?'light':'dark';try{localStorage.setItem('qb:theme',theme);}catch(e){}applyTheme();
});
document.title=BANK.title+' · 문제은행';
window.addEventListener('hashchange',route);
route();
})();
</script>
