<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physical AI 2일차 · VLM (이미지 질문·카메라 기록·구조화 결과) · 문제은행</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Quiz Bank 디자인 토큰 v3 (3층: Primitive → Semantic → Component)
   다크 팔레트: day07 워크시트(#0b1220 남색 + 앰버·틸 포인트) / 라이트: 같은 구조의 중립 팔레트
   포인트색은 teal 하나(--color-brand). amber는 제목(다크)·경고·하이라이트 보조.
   v2 이름(--bg, --ink 등)은 파일 끝 Alias 블록이 시맨틱으로 연결한다.
   build.py가 이 파일을 엔진 <style> 맨 앞에 그대로 넣는다. */
:root{
  /* ── 1층 Primitive: 원시 값 ── */
  --white:#FFFFFF;--ink-900:#141A26;
  --slate-50:#F5F6F8;--slate-100:#F0F2F5;--slate-200:#E2E6EC;--slate-250:#D5DAE2;--slate-300:#CDD3DC;
  --slate-400:#8A93A4;--slate-500:#64748B;--slate-600:#5A6375;
  --navy-950:#0A0F1C;--navy-900:#0B1220;--navy-850:#0E1628;--navy-800:#111A2E;--navy-700:#16203A;--navy-650:#172239;
  --navy-600:#1F2B45;--navy-500:#2A3A5C;
  --ice-200:#DBE4F0;--steel-400:#8A9BB8;--steel-500:#5E6F8E;
  --teal-900:#123D33;--teal-700:#0B6F66;--teal-600:#0E8C80;--teal-400:#2DD4BF;
  --amber-900:#3A2A0C;--amber-700:#B45309;--amber-650:#D97706;--amber-600:#B7791F;--amber-400:#F5B942;--amber-100:#FEF3C7;
  --gold-600:#B7891F;
  --green-700:#15803D;--green-600:#16A34A;--green-400:#4ADE80;
  --red-650:#DC2626;--red-600:#D23B32;--red-400:#F87171;
  --yellow-500:#EAB308;--yellow-400:#FACC15;
  --violet-600:#7C3AED;--violet-400:#C084FC;
  --pink-700:#C2417A;--pink-400:#F472B6;
  --blue-600:#2563EB;--blue-400:#60A5FA;
  /* 과목 색: 흰 배경·남색 배경 모두 3:1 이상(아이콘·스트라이프용), 테마 공통 */
  --subject-it:#4F7FC0;--subject-korean:#B05A5A;--subject-english:#3F8F6E;
  --subject-science:#8A62B8;--subject-music:#B0762A;--subject-art:#C0508A;

  /* ── 2층 Semantic 고정부 ── */
  --font-sans:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","D2Coding",Consolas,"SF Mono",monospace;
  --fs-base:calc(16px*var(--fz));--lh:1.55;
  --fs-h1:calc(25px*var(--fz));--fs-h2:calc(18px*var(--fz));--fs-q:calc(16px*var(--fz));--fs-opt:calc(15px*var(--fz));--fs-btn:calc(14px*var(--fz));--fs-btn-pri:calc(15px*var(--fz));
  --fs-sm:calc(14px*var(--fz));--fs-xs:calc(13px*var(--fz));--fs-2xs:calc(12px*var(--fz));--fs-ox:calc(23px*var(--fz));
  --radius-sm:6px;--radius-control:8px;--radius-card:10px;--radius-lg:12px;--maxw:880px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;
  --ease:cubic-bezier(.2,0,0,1);--dur-fast:120ms;--dur:200ms;

  /* ── 라이트 시맨틱 + 컴포넌트 ── */
  --color-background:var(--slate-50);--color-surface:var(--white);--color-surface-raised:var(--white);--color-surface-muted:var(--slate-100);--color-field:var(--white);
  --color-text:var(--ink-900);--color-text-muted:var(--slate-600);--color-text-faint:var(--slate-400);
  --color-border:var(--slate-200);--color-border-strong:var(--slate-300);
  --color-heading:var(--ink-900);--legacy-title:var(--ink-900);--color-brand:var(--teal-600);--color-brand-text:var(--teal-700);--color-on-brand:var(--white);
  --color-accent:var(--amber-600);--color-success:var(--green-700);--color-warning:var(--amber-700);--color-danger:var(--red-600);
  --color-highlight:var(--amber-100);--color-focus:var(--teal-600);
  --button-bg:var(--white);--button-border:var(--slate-250);--button-text:var(--ink-900);
  --button-primary-bg:var(--ink-900);--button-primary-border:var(--ink-900);--button-primary-text:var(--white);
  --combo:var(--violet-600);--gold:var(--gold-600);
  --ty-mc:var(--teal-600);--ty-multi:var(--violet-600);--ty-ox:var(--slate-500);--ty-match:var(--pink-700);--ty-order:var(--amber-600);--ty-num:var(--blue-600);
  --timer-hi:var(--green-600);--timer-mid:var(--amber-650);--timer-lo:var(--red-650);
  --lv1:var(--green-600);--lv2:var(--yellow-500);--lv3:var(--red-650);
  --shadow:0 1px 2px rgb(16 24 40 / .04);
  color-scheme:light;

  /* ── Alias (v2 이름 → 시맨틱). 엔진 페이지 호환용. 새 코드는 --color-* 사용 ── */
  --font:var(--font-sans);--mono:var(--font-mono);
  --r-sm:var(--radius-sm);--r:var(--radius-control);--r-md:var(--radius-card);--r-lg:var(--radius-lg);
  --bg:var(--color-background);--panel:var(--color-surface);--raised:var(--color-surface-raised);--field:var(--color-field);
  --soft:var(--color-surface-muted);
  --ink:var(--color-text);--muted:var(--color-text-muted);--faint:var(--color-text-faint);
  --line:var(--color-border);--line-2:var(--color-border-strong);
  --title:var(--legacy-title);--link:var(--color-brand);--accent:var(--color-accent);
  --ok:var(--color-success);--bad:var(--color-danger);
  --btn-bg:var(--button-bg);--btn-line:var(--button-border);
  --pri-bg:var(--button-primary-bg);--pri-line:var(--button-primary-border);--pri-ink:var(--button-primary-text);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --color-background:var(--navy-900);--color-surface:var(--navy-800);--color-surface-raised:var(--navy-850);--color-surface-muted:var(--navy-700);--color-field:var(--navy-950);
  --color-text:var(--ice-200);--color-text-muted:var(--steel-400);--color-text-faint:var(--steel-500);
  --color-border:var(--navy-600);--color-border-strong:var(--navy-500);
  --color-heading:var(--color-text);--legacy-title:var(--amber-400);--color-brand:var(--teal-400);--color-brand-text:var(--teal-400);--color-on-brand:var(--navy-900);
  --color-accent:var(--amber-400);--color-success:var(--green-400);--color-warning:var(--amber-400);--color-danger:var(--red-400);
  --color-highlight:var(--amber-900);--color-focus:var(--teal-400);
  --button-bg:var(--navy-650);--button-border:var(--navy-500);--button-text:var(--ice-200);
  --button-primary-bg:var(--teal-900);--button-primary-border:var(--teal-400);--button-primary-text:var(--teal-400);
  --combo:var(--violet-400);--gold:var(--amber-400);
  --ty-mc:var(--teal-400);--ty-multi:var(--violet-400);--ty-ox:var(--steel-400);--ty-match:var(--pink-400);--ty-order:var(--amber-400);--ty-num:var(--blue-400);
  --timer-hi:var(--green-400);--timer-mid:var(--amber-400);--timer-lo:var(--red-400);
  --lv1:var(--green-400);--lv2:var(--yellow-400);--lv3:var(--red-400);
  --shadow:none;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --color-background:var(--navy-900);--color-surface:var(--navy-800);--color-surface-raised:var(--navy-850);--color-surface-muted:var(--navy-700);--color-field:var(--navy-950);
  --color-text:var(--ice-200);--color-text-muted:var(--steel-400);--color-text-faint:var(--steel-500);
  --color-border:var(--navy-600);--color-border-strong:var(--navy-500);
  --color-heading:var(--color-text);--legacy-title:var(--amber-400);--color-brand:var(--teal-400);--color-brand-text:var(--teal-400);--color-on-brand:var(--navy-900);
  --color-accent:var(--amber-400);--color-success:var(--green-400);--color-warning:var(--amber-400);--color-danger:var(--red-400);
  --color-highlight:var(--amber-900);--color-focus:var(--teal-400);
  --button-bg:var(--navy-650);--button-border:var(--navy-500);--button-text:var(--ice-200);
  --button-primary-bg:var(--teal-900);--button-primary-border:var(--teal-400);--button-primary-text:var(--teal-400);
  --combo:var(--violet-400);--gold:var(--amber-400);
  --ty-mc:var(--teal-400);--ty-multi:var(--violet-400);--ty-ox:var(--steel-400);--ty-match:var(--pink-400);--ty-order:var(--amber-400);--ty-num:var(--blue-400);
  --timer-hi:var(--green-400);--timer-mid:var(--amber-400);--timer-lo:var(--red-400);
  --lv1:var(--green-400);--lv2:var(--yellow-400);--lv3:var(--red-400);
  --shadow:none;
  color-scheme:dark;}
/* 기기별 글자 배율: 모든 글자 크기 = 원본 px × --fz. 웹 1.25 · 태블릿 1.2 · 모바일 1.15
   (웹 ≥1024px / 태블릿 561~1023px / 모바일 ≤560px. 값 하나만 바꾸면 해당 기기의 모든 글자가 함께 바뀜) */
:root{--fz:1.25}
@media (max-width:1023px){:root{--fz:1.2}}
@media (max-width:560px){:root{--fz:1.15}}
@media (max-width:560px){:root{--fs-base:calc(15.5px*var(--fz));--fs-h1:calc(21px*var(--fz));--fs-h2:calc(17px*var(--fz));--fs-q:calc(15.5px*var(--fz));--fs-ox:calc(21px*var(--fz))}}

/* ── 기본 ───────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:110px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-base);line-height:var(--lh);
  -webkit-font-smoothing:antialiased;letter-spacing:-.003em;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
b,strong{font-weight:650}
code{font-family:var(--mono);font-size:.88em;color:var(--link);background:var(--soft);padding:1px 5px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px 56px}
.muted{color:var(--muted)}
/* 상단 바 */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:calc(52px + env(safe-area-inset-top,0px));margin:0 -20px 22px;padding:env(safe-area-inset-top,0px) 20px 0;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.brand{font-size:var(--fs-xs);color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;letter-spacing:.01em}
.brand b{color:var(--ink);font-weight:600}
.iconbtn{font:inherit;font-size:calc(15px*var(--fz));border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);width:32px;height:32px;border-radius:var(--r);cursor:pointer;flex:0 0 auto;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--muted)}
/* 제목 */
h1{font-size:var(--fs-h1);line-height:1.3;margin:0 0 6px;letter-spacing:-.02em;font-weight:700;color:var(--title)}
h2{font-size:var(--fs-h2);line-height:1.4;margin:0;font-weight:650;letter-spacing:-.01em}
.ph{font-size:calc(15px*var(--fz));color:var(--muted);font-weight:600;margin:0 0 10px;letter-spacing:0}
.sh{font-size:var(--fs-sm);color:var(--muted);font-weight:600;margin:16px 0 6px}
.sub{color:var(--muted);margin:0 0 4px}
.meta{font-size:var(--fs-xs);color:var(--faint);margin:0 0 18px;font-family:var(--mono);letter-spacing:-.01em}
.crumbs{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:var(--fs-sm);color:var(--faint)}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink)}
.part{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--link);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:1px 7px;white-space:nowrap;max-width:100%;font-weight:500;letter-spacing:0}
.tabhead .part,.ngroup .part{white-space:normal;overflow-wrap:anywhere}  /* 긴 자료 위치(예: voice-ai 교시 라벨)는 줄바꿈 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.center{text-align:center}
.note-sm{font-size:var(--fs-sm);color:var(--muted)}
.lbl{display:block;font-size:var(--fs-xs);color:var(--muted);margin-bottom:2px}
/* 버튼 */
.btn{font:inherit;font-size:var(--fs-btn);display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);
  padding:7px 12px;border-radius:var(--r);cursor:pointer;text-decoration:none;min-height:34px;line-height:1.3;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pri-bg);color:var(--pri-ink);border-color:var(--pri-line);font-weight:650;font-size:var(--fs-btn-pri);padding:8px 18px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.locked{opacity:.5}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--btn-line))}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn .cnt{font-family:var(--mono);font-size:var(--fs-2xs);background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;min-width:18px;line-height:16px;text-align:center}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
button:focus-visible,a:focus-visible,input:focus-visible,.opt:focus-within{outline:2px solid var(--link);outline-offset:2px}
/* 입력 */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;max-width:300px}
.field label{font-size:var(--fs-xs);color:var(--muted)}
.field input{font:inherit;font-size:calc(15px*var(--fz));padding:7px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--field);color:var(--ink)}
.field input::placeholder{color:var(--faint)}
/* 진행 바 */
.bar{flex:1;height:4px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--link);transition:width .25s}
.progress{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:8px 0;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.progress span,.homeprog span{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.homeprog{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
/* 홈 탭 카드 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:6px}
.tcard{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;text-decoration:none;color:var(--ink);transition:border-color .15s;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--line-2)}
.tcard .tn{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint)}
.tcard .tt{font-weight:600;font-size:calc(15px*var(--fz));line-height:1.45}
.tcard .ts{margin-top:auto;padding-top:8px;font-size:var(--fs-xs);color:var(--faint);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono)}
.tcard.done .ts b{color:var(--ok);font-weight:600}
.tcard.perfect{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.lockmsg{font-size:var(--fs-xs);color:var(--faint);margin:-6px 0 16px}
/* 탭 바 */
/* 학습 탭 선택: 웹(≥1024) 자유 배치 · 태블릿(560~1023) 3개 · 모바일(<560) 2개 */
.tabbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
@media (max-width:1023px){.tabbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}}
.tabchip{min-width:0;display:flex;align-items:center;gap:6px;font-size:var(--fs-btn);padding:6px 10px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);text-decoration:none;color:var(--ink);line-height:1.35;word-break:keep-all}
.tabchip .tl{min-width:0}
.tabchip .qc{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--muted);white-space:nowrap;margin-left:auto}
.tabchip[aria-selected="true"] .qc{color:var(--link)}
.tabchip .sc{white-space:nowrap}
.btn .qc{font-family:var(--mono);font-weight:500;opacity:.85}
.tabchip b{font-family:var(--mono);font-weight:600;color:var(--faint)}
.tabchip:hover{border-color:var(--muted)}
.tabchip[aria-selected="true"]{border-color:var(--link);color:var(--link);background:color-mix(in srgb,var(--link) 9%,var(--btn-bg))}
.tabchip[aria-selected="true"] b{color:var(--link)}
.tabchip .sc{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--ok)}
.tabchip.sum{border-color:color-mix(in srgb,var(--gold) 60%,var(--btn-line));color:var(--gold)}
.tabhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 2px}
.tabhead h2{color:var(--title)}
/* 문항 카드 */
.q{background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:var(--r-md);padding:12px 14px;margin:0 0 10px;box-shadow:var(--shadow)}
.q.correct{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));border-left-color:var(--ok)}
.q.wrong{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));border-left-color:var(--bad)}
.qhead{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.qn{font-family:var(--mono);font-size:var(--fs-xs);color:var(--faint);font-weight:500}
.tbadge{font-size:var(--fs-2xs);font-weight:600;padding:0 7px;line-height:18px;border-radius:var(--r-sm);color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent);background:color-mix(in srgb,var(--tc) 8%,transparent);white-space:nowrap}
/* 난이도: 점 1 녹색 · 점 2 노랑 · 점 3 빨강 (쉬움 ●○○ / 보통 ●●○ / 어려움 ●●●) + 글자 */
.lv{display:inline-flex;align-items:center;gap:4px;line-height:1}
.lv .dots{font-size:calc(10px*var(--fz));letter-spacing:1px}
.lv i{font-style:normal}
.lv .d1{color:var(--lv1)} .lv .d2{color:var(--lv2)} .lv .d3{color:var(--lv3)} .lv .off{color:var(--line-2)}
.lv em{font-style:normal;font-size:var(--fs-2xs);font-weight:600}
.lv1 em{color:var(--lv1)} .lv2 em{color:color-mix(in srgb,var(--lv2) 80%,var(--ink))} .lv3 em{color:var(--lv3)}
.verdict{margin-left:auto;font-weight:650;font-size:var(--fs-xs)}
.correct .verdict{color:var(--ok)} .wrong .verdict{color:var(--bad)}
.qsrc{margin-left:auto;font-size:var(--fs-2xs);color:var(--faint)}
.qt{font-size:var(--fs-q);font-weight:500;margin:4px 0 8px}
.guide{font-size:var(--fs-xs);color:var(--faint);margin:-4px 0 8px}
/* 음성 선택 · 문제 읽기 · 그림/오디오 */
.vrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px}
.vbtn{font:inherit;font-size:var(--fs-btn);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);border-radius:var(--r);padding:4px 10px;min-height:32px;cursor:pointer}
.vbtn:hover{border-color:var(--muted)}
.vbtn svg{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vbtn[data-state="listening"]{border-color:var(--link);color:var(--link);box-shadow:0 0 0 3px color-mix(in srgb,var(--link) 28%,transparent);animation:vpulse 1.2s ease-in-out infinite}
.vbtn[data-state="heard"]{border-color:var(--ok)}
.vbtn[data-state="error"]{border-color:var(--bad)}
@keyframes vpulse{50%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){.vbtn[data-state="listening"]{animation:none}}
.vstat{font-size:var(--fs-xs);color:var(--muted)}
.vstat:empty{display:none}
.vhint{font-size:var(--fs-xs);color:var(--faint)}
.qfig{margin:6px 0 10px}
.qfig img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.qfig figcaption{font-size:var(--fs-xs);color:var(--muted);margin-top:4px}
.qaud{margin:6px 0 10px}
.qaud audio{display:block;width:100%;max-width:420px}
.qaud details{font-size:var(--fs-sm);color:var(--muted);margin-top:4px}
.qaud summary{cursor:pointer}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--panel);font-size:var(--fs-opt);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--line-2)}
.opt input{margin:4px 0 0;accent-color:var(--link);flex:0 0 auto;width:14px;height:14px}
.opt:has(input:checked){border-color:var(--link);background:color-mix(in srgb,var(--link) 7%,var(--panel))}
.opt.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.opt.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--panel))}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:360px}
.ox button{font:inherit;font-size:var(--fs-ox);font-weight:700;padding:8px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);cursor:pointer;line-height:1.3}
.ox button:hover{border-color:var(--muted)}
.ox button[aria-pressed="true"]{border-color:var(--link);color:var(--link);background:color-mix(in srgb,var(--link) 10%,var(--btn-bg))}
.ox button.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--btn-bg));color:var(--ok)}
.ox button.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--btn-bg));color:var(--bad)}
/* 짝 맞추기 */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px 14px}
.mcol{display:flex;flex-direction:column;gap:6px}
.mitem{font:inherit;font-size:var(--fs-opt);text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);padding:7px 10px;cursor:pointer;min-height:38px;display:flex;align-items:center;gap:8px;line-height:1.45}
.mitem:hover{border-color:var(--line-2)}
.mitem .tag{flex:0 0 auto;width:20px;height:20px;border-radius:var(--r-sm);border:1px dashed var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);font-weight:600}
.mitem.linked{border-color:color-mix(in srgb,var(--pc) 70%,var(--line))}
.mitem.linked .tag{border:0;background:var(--pc);color:var(--bg)}
.mitem.sel{border-color:var(--link);box-shadow:0 0 0 3px color-mix(in srgb,var(--link) 18%,transparent)}
.mitem.okm{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.mitem.nom{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.mleft .mitem{font-weight:600}
/* 순서 */
.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.oitem{font:inherit;font-size:var(--fs-opt);text-align:left;width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);cursor:pointer;transition:border-color .12s,background .12s}
.oitem:hover{border-color:var(--line-2)}
.oitem .num{width:22px;height:22px;border-radius:50%;border:1px dashed var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);font-weight:600;color:var(--muted);flex:0 0 auto}
.oitem.on{border-color:var(--link);background:color-mix(in srgb,var(--link) 7%,var(--panel))}
.oitem.on .num{border:0;background:var(--link);color:var(--bg)}
.oitem .txt{flex:1;line-height:1.45}
.oitem .ofix{flex:0 0 auto;font-size:var(--fs-2xs);color:var(--ok);font-weight:600}
.oitem.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.oitem.ok .num{background:var(--ok)}
.oitem.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.oitem.no.on .num{background:var(--bad)}
.numrow{display:flex;align-items:center;gap:8px;font-size:var(--fs-opt)}
.numrow input{font-family:var(--mono);font-size:calc(15px*var(--fz));width:120px;padding:6px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--field);color:var(--ink);text-align:right}
.numrow input.ans{border-color:var(--ok)} .numrow input.miss{border-color:var(--bad)}
.locked .mitem,.locked .ox button,.locked .opt{pointer-events:none}
.locked .oitem{pointer-events:none}
.opt .onum{flex:0 0 auto;min-width:18px;height:18px;padding:0 4px;border-radius:var(--r-sm);border:1px solid var(--line-2);display:inline-grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);color:var(--muted);margin-top:1px}
.opt:has(input:checked) .onum{border-color:var(--link);color:var(--link)}
.opt.ans .onum{border-color:var(--ok);color:var(--ok)} .opt.miss .onum{border-color:var(--bad);color:var(--bad)}
/* 힌트 토글 (빨간색 = Hint) */
.hintwrap{margin:-2px 0 8px}
.hintbtn{font:inherit;font-size:var(--fs-xs);font-weight:650;display:inline-flex;align-items:center;gap:4px;color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:var(--r-sm);padding:2px 9px;cursor:pointer;line-height:1.5}
.hintbtn:hover{background:color-mix(in srgb,var(--bad) 13%,transparent)}
.hintbtn .caret{font-size:.85em}
.srcwrap{margin-top:8px}
.srcbtn{font:inherit;font-size:var(--fs-xs);font-weight:600;display:inline-flex;align-items:center;gap:4px;color:var(--link);background:transparent;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:1px 8px;cursor:pointer;line-height:1.5}
.srcbtn:hover{border-color:var(--link)}
.src{margin:6px 0 0;padding:6px 10px;border-left:3px solid var(--link);background:var(--soft);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:var(--fs-xs);color:var(--muted)}
.src p{margin:0;white-space:pre-wrap;word-break:break-word}
.src cite{display:block;margin-top:4px;font-style:normal;font-size:var(--fs-2xs);color:var(--faint)}
.hint{margin-top:6px;padding:6px 10px;border-left:3px solid var(--bad);background:color-mix(in srgb,var(--bad) 6%,transparent);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:var(--fs-sm);color:var(--ink)}
/* 해설 */
.exp{margin-top:10px;padding:2px 0 2px 10px;border-left:3px solid var(--line-2);font-size:var(--fs-sm);color:var(--muted)}
.correct .exp{border-left-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.wrong .exp{border-left-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.exp p{margin:0 0 3px}
.exp b{color:var(--ink);font-weight:650;margin-right:4px}
.an{font-family:var(--mono);color:var(--link);font-size:var(--fs-xs);margin:4px 0 0}
.mine{color:var(--bad)}
.onlywrong .q.correct{display:none}
.warn{color:var(--bad);font-size:var(--fs-sm);min-height:1.3em;margin:4px 0 0}
/* 결과 */
.score{font-family:var(--mono);font-size:calc(33px*var(--fz));font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--title);letter-spacing:-.02em}
.score small{font-family:var(--font);font-size:calc(15px*var(--fz));color:var(--muted);font-weight:400;letter-spacing:0}
.score.xl{font-size:calc(45px*var(--fz))}
.msg{margin:6px 0 10px;color:var(--muted);font-size:var(--fs-sm)}
.bd{display:grid;gap:7px;margin:6px 0}
.bd div{display:grid;grid-template-columns:minmax(90px,190px) 1fr 44px;gap:10px;align-items:center;font-size:var(--fs-sm)}
.bd .b{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bd .b i{display:block;height:100%;background:var(--tc,var(--link));border-radius:99px}
.bd span:last-child{text-align:right;font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted)}
.rcode{font-family:var(--mono);font-size:calc(17px*var(--fz));font-weight:600;letter-spacing:.06em;color:var(--accent);background:var(--soft);padding:2px 8px;border-radius:var(--r-sm)}
/* 오답노트 · 해설지 */
.ngroup{margin:18px 0 8px;font-size:calc(15px*var(--fz));font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ngroup .ref{font-family:var(--mono);font-size:var(--fs-2xs);font-weight:400;color:var(--faint)}
.note{background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px}
.note.solved{border-left-color:var(--ok)}
.note .qt{margin:0 0 8px}
.note dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:var(--fs-sm)}
.note dt{color:var(--faint)}
.note dd{margin:0}
.note .foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:var(--fs-xs);color:var(--faint);font-family:var(--mono)}
.note .foot span:first-child{color:var(--link)}
details.more{margin-top:14px;font-size:var(--fs-sm)}
details.more summary{cursor:pointer;color:var(--muted);padding:4px 0}
.keyitem{padding:10px 0;border-bottom:1px solid var(--line)}
.keyitem .kq{font-weight:500;font-size:calc(15px*var(--fz))}
.keyitem .ka{margin:4px 0 2px;color:var(--ok);font-weight:600;font-size:var(--fs-sm)}
.keyitem .kw{font-size:var(--fs-sm);color:var(--muted);margin:0}
.keylock{padding:12px;border:1px dashed var(--line-2);border-radius:var(--r-md);color:var(--faint);text-align:center;margin:8px 0;font-size:var(--fs-sm)}
.printhead{display:none}
/* 게임 */
.game{max-width:620px;margin:0 auto}
.gpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;gap:4px;min-height:120px;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);color:var(--ink);text-decoration:none;transition:border-color .15s,background .15s}
a.gcard:hover{border-color:var(--link);background:color-mix(in srgb,var(--link) 6%,var(--panel))}
.gcard .gn{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint);letter-spacing:.05em}
.gcard b{font-size:calc(16px*var(--fz))}
.gcard .gd{font-size:var(--fs-xs);color:var(--muted);line-height:1.5}
.gcard.soon{border-style:dashed;opacity:.6;cursor:not-allowed}
@media (max-width:560px){.gpick{gap:6px}.gcard{min-height:84px;padding:10px 8px;align-items:center;text-align:center;justify-content:center}.gcard b{font-size:calc(14px*var(--fz));word-break:keep-all}.gcard .gd{display:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.chip{font:inherit;font-size:var(--fs-btn);padding:6px 12px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);cursor:pointer;min-height:32px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--link);color:var(--link);background:color-mix(in srgb,var(--link) 9%,var(--btn-bg));font-weight:600}
.chip:disabled{opacity:.4;cursor:not-allowed}
.rules{font-size:var(--fs-xs);color:var(--muted);border-left:3px solid var(--line-2);padding:2px 0 2px 10px;margin:4px 0 16px}
.rules p{margin:0 0 2px}
.play{display:flex;flex-direction:column;min-height:calc(100dvh - 130px)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--fs-sm);color:var(--muted);margin-bottom:8px}
.hud .pts{font-size:calc(19px*var(--fz));font-weight:600;color:var(--title)}
.combo{font-family:var(--font);font-size:var(--fs-xs);padding:2px 9px;border-radius:var(--r-sm);border:1px solid var(--line-2);color:var(--muted)}
.combo.hot{border-color:var(--combo);color:var(--combo);background:color-mix(in srgb,var(--combo) 12%,transparent)}
.timer{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.timer>div{height:100%;width:100%;background:var(--timer-hi);border-radius:99px}
.timer.mid>div{background:var(--timer-mid)}
.timer.lo>div{background:var(--timer-lo)}
.timer.out{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tleft{font-family:var(--mono);font-size:var(--fs-xs);color:var(--faint);text-align:right;font-variant-numeric:tabular-nums;margin:4px 0 12px;min-height:1.2em}
.gtype{font-size:var(--fs-2xs);color:var(--faint);margin-bottom:4px;letter-spacing:.02em}
.gq{font-size:calc(19px*var(--fz));font-weight:600;line-height:1.5;margin:0 0 16px;letter-spacing:-.01em}
.gbottom{margin-top:4px}
.gopts{display:grid;gap:8px}
.gopt{font:inherit;font-size:var(--fs-opt);text-align:left;display:flex;gap:12px;align-items:center;padding:10px 14px;min-height:46px;border:1px solid var(--btn-line);border-radius:var(--r-md);background:var(--panel);color:var(--ink);cursor:pointer;transition:background .12s,border-color .12s;line-height:1.45}
.gopt:hover{border-color:var(--muted)}
.gopt kbd{flex:0 0 auto;width:22px;height:22px;border-radius:var(--r-sm);border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint)}
.gopt[aria-pressed="true"]{border-color:var(--link);background:color-mix(in srgb,var(--link) 9%,var(--panel))}
.gopt.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.gopt.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.gox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gox .gopt{justify-content:center;font-size:calc(29px*var(--fz));font-weight:700;min-height:76px}
.gfloat{text-align:center;font-weight:650;font-size:calc(17px*var(--fz));min-height:1.6em;margin-top:10px;font-family:var(--mono)}
.gfloat.ok{color:var(--ok)} .gfloat.no{color:var(--bad)}
.gfloat.pop{animation:pop .45s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.gsub{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.board{width:100%;border-collapse:collapse;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.board th,.board td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.board th{font-size:var(--fs-xs);color:var(--faint);font-weight:500}
.board .r{text-align:right;font-family:var(--mono)}
.board tr.me td{background:color-mix(in srgb,var(--combo) 12%,transparent);font-weight:600}
.bignum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 2px}
.bignum div{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:left}
.bignum b{display:block;font-family:var(--mono);font-size:calc(18px*var(--fz));font-weight:600;font-variant-numeric:tabular-nums}
.bignum span{font-size:var(--fs-2xs);color:var(--faint)}
/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--panel);color:var(--ink);border:1px solid var(--line-2);
  padding:8px 14px;border-radius:var(--r);font-size:var(--fs-sm);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .18)}
.toast.show{opacity:1;transform:translateX(-50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* 문제풀이 페이지(학습·오답 재도전): 탭 제목(h2)을 뺀 모든 글자 10px — 사용자 지정 */
/* 문제풀이·오답노트·해설지 공통: 제목(h1·h2·탭 묶음 제목)을 뺀 글자 10px, 문제 11px, 자간 +0.03em, 행간 1.7 */
.sheet,.sheet :where(*:not(h1,h2,.ngroup,.ngroup *)){font-size:calc(11px*var(--fz))!important;letter-spacing:.03em!important}  /* :where = 명시도 0 → 아래 11px 규칙이 이김 */
.sheet :is(.qt,.opt,.exp,.exp p,.guide,.mitem,.oitem .txt,.hint,.warn,.msg,.sub,.note dt,.note dd,.note .foot,.kq,.ka,.kw,.keylock){line-height:1.7!important}
.sheet :is(.qt,.kq),.sheet :is(.qt,.kq) *{font-size:calc(12px*var(--fz))!important}  /* 문제 문장만 11px */
/* 한글이 섞인 숫자 요소는 mono 대신 본문 글꼴 + 고정폭 숫자 (mono 한글 자간이 벌어짐) */
.meta,.tcard .tn,.tcard .ts,.progress span,.homeprog span,.note .foot,.an,.hud,.tleft,.gfloat,.bignum b{font-family:var(--font);font-variant-numeric:tabular-nums;letter-spacing:0}
/* ── 반응형 ─────────────────────────────────────── */
@media (max-width:560px){
  .wrap{padding:0 16px 48px}
  .topbar{margin:0 -16px 18px;padding-left:16px;padding-right:16px}
  /* 홈 탭 카드: 모바일에서도 한 줄 3개 (사용자 지정) */
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .tcard{padding:8px 9px;gap:2px}
  .tcard .tn{font-size:calc(11px*var(--fz))}
  .tcard .tt{font-size:calc(13px*var(--fz));line-height:1.35;word-break:keep-all}
  .tcard .ts{flex-direction:column;align-items:flex-start;gap:0;padding-top:6px;font-size:calc(11px*var(--fz))}
  .tabbar{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .tabchip{padding:6px 8px;gap:4px}
  .q{padding:12px}
  .match{grid-template-columns:1fr}
  .mright{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line-2)}
  .btn,.chip{min-height:40px}
  .actions .btn{flex:1 1 calc(50% - 8px)}
  .actions .btn.primary{flex-basis:100%}
  .ox{max-width:none}
  .ox button{min-height:48px}
  .oitem{min-height:40px}
  .bd div{grid-template-columns:96px 1fr 40px}
  .bignum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field{max-width:none}
  /* 게임: 보기를 엄지 영역(화면 아래)으로 */
  .play .gtop{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));background:var(--bg);padding:6px 0 0;z-index:4}
  .play .gbottom{margin-top:auto;padding-top:12px}
  .gq{font-size:calc(18px*var(--fz))}
  .gopt{min-height:50px}
  .board th:nth-child(6),.board td:nth-child(6){display:none}
}

(function(){

function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}

<script>/* qb-voice.js — 음성으로 보기 번호 고르기(Web Speech API) + 문제 읽기(speechSynthesis)
   window.QBVoice: supported · canSpeak · parse · attach · speak · cancelSpeak · isSpeaking · stopListening
   parse()는 순수 함수라 node에서도 테스트한다. */
(function(root){
'use strict';

/* ── 말 → 선택 해석 (순수 함수) ───────────────── */
const SINO={일:1,이:2,삼:3,사:4,오:5,육:6,칠:7,팔:8,구:9,십:10};
const NAT={하나:1,둘:2,셋:3,넷:4,다섯:5,여섯:6,일곱:7,여덟:8,아홉:9,열:10};
const DET={한:1,두:2,세:3,네:4,첫:1};  // 한/두/세/네/첫 은 '번'·'번째'·'째'가 붙을 때만 번호
// 보기 글자 A~H. '이'(E)는 숫자 2와 겹쳐 숫자를 우선하므로 영문 e로만 받는다
const LET={a:1,b:2,c:3,d:4,e:5,f:6,g:7,h:8,에이:1,비:2,씨:3,디:4,에프:6,지:7,에이치:8};

const alt=o=>Object.keys(o).sort((x,y)=>y.length-x.length).join('|');
const PRE='(?:정답은|정답이|정답|답은|답이|답|내답은|제답은|저는|나는|전|선택|번호)?';
const SUF='(?:이에요|이요|예요|이야|이죠|이다|입니다|이라고생각해요|이라고|선택할게요?|선택|할게요?|할래요?|고를게요?|고를래요?|정답|같아요|요|으로|로|을|를|이|가|은|는)*';
const R_DIGIT=new RegExp('^'+PRE+'(\\d{1,2})(?:번째|번|째)?'+SUF+'$');
const R_STD=new RegExp('^'+PRE+'('+alt(Object.assign({},SINO,NAT))+')(?:번째|번|째)?'+SUF+'$');
const R_DET=new RegExp('^'+PRE+'('+alt(DET)+')(?:번째|번|째)'+SUF+'$');
const R_LET=new RegExp('^'+PRE+'('+alt(LET)+')(?:번)?'+SUF+'$');
const R_X=/틀|아니|아닙|아닌|안맞|맞지않|엑스|가위|^x(?:요|입니다)?$/;
const R_O=/^(?:o|오|동그라미|오케이|ok|예|네|응|그래요?|맞.*)(?:요|입니다|이요|예요|야|라고생각해요)?$/;
const R_SUBMIT=/제출|채점|확인|다풀었|다했/;

function norm(s){
  return String(s==null?'':s).normalize('NFKC').toLowerCase().replace(/[\s.,!?'"“”‘’~…·\-_()\[\]]/g,'');
}
function numOf(t){
  let m;
  if((m=R_DIGIT.exec(t)))return +m[1];
  if((m=R_STD.exec(t)))return SINO[m[1]]||NAT[m[1]];
  if((m=R_DET.exec(t)))return DET[m[1]];
  if((m=R_LET.exec(t)))return LET[m[1]];
  return 0;
}
function parseOne(raw,count,type){
  const t=norm(raw);if(!t)return null;
  if(type==='ox'){
    if(R_X.test(t))return {kind:'ox',v:'X'};
    if(R_O.test(t))return {kind:'ox',v:'O'};
    const n=numOf(t);  // ox에서 1번 = O, 2번 = X (게임 모드 키와 같음)
    if(n===1)return {kind:'ox',v:'O'};
    if(n===2)return {kind:'ox',v:'X'};
    return R_SUBMIT.test(t)?{kind:'submit'}:null;
  }
  const n=numOf(t)||numOf(t.replace(/(?:제출|채점|확인).*$/,''));  // '3번 제출'은 번호 우선
  if(n)return n>=1&&n<=count?{kind:'index',i:n-1}:null;  // 범위 밖이면 다음 후보로
  return R_SUBMIT.test(t)?{kind:'submit'}:null;
}
/* text: 문자열 또는 후보 배열. 범위 안에서 해석되는 첫 후보를 돌려준다 */
function parse(text,opt){
  opt=opt||{};
  const count=opt.count>0?opt.count:4, type=opt.type||'mc';
  const list=Array.isArray(text)?text:[text];
  for(const s of list){const r=parseOne(s,count,type);if(r)return r;}
  return null;
}

/* ── 브라우저 부분 ────────────────────────── */
const hasWin=typeof window!=='undefined';
const SR=()=>hasWin?(window.SpeechRecognition||window.webkitSpeechRecognition):null;
const supported=()=>!!SR();
const canSpeak=()=>hasWin&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';

const ERR={
  'not-allowed':'마이크 권한이 꺼져 있습니다. 주소창의 마이크 아이콘에서 허용하세요.',
  'service-not-allowed':'마이크 권한이 꺼져 있습니다. 주소창의 마이크 아이콘에서 허용하세요.',
  'network':'음성 인식은 인터넷 연결이 필요합니다.',
  'no-speech':'소리가 들리지 않았습니다. 다시 눌러 말해 주세요.',
  'audio-capture':'마이크를 찾을 수 없습니다.'
};
let active=null;  // 지금 듣는 중인 컨트롤러 (동시에 하나만)
function stopListening(){if(active){active.stop();active=null;}}

function describe(r){
  if(r.kind==='index')return `'${r.i+1}번'으로 들었습니다`;
  if(r.kind==='ox')return `'${r.v}'로 들었습니다`;
  return "'제출'로 들었습니다";
}

/* o: {button, live, getOptions, getType, select, submit, lang, bind}
   button·live는 요소 또는 요소를 돌려주는 함수(카드를 다시 그려도 새 요소를 찾도록).
   select(r): r = {kind:'index',i} | {kind:'ox',v}. submit(): 제출. bind:false면 클릭 리스너를 달지 않는다(위임용) */
function attach(o){
  const get=x=>typeof x==='function'?x():x;
  const ctl={listening:false,toggle(){},stop(){}};
  const b0=get(o.button);
  if(!supported()){if(b0)b0.hidden=true;return ctl;}
  const lang=o.lang||'ko-KR';
  let rec=null, done=false;
  function ui(state,msg){
    const b=get(o.button), l=get(o.live);
    if(b){b.dataset.state=state;b.setAttribute('aria-pressed',state==='listening'?'true':'false');}
    if(l&&msg!=null)l.textContent=msg;
  }
  ctl.stop=function(){
    ctl.listening=false;done=true;
    if(rec){try{rec.abort();}catch(e){}rec=null;}
    ui('idle');
  };
  function finish(state,msg){if(done)return;done=true;ctl.listening=false;rec=null;if(active===ctl)active=null;ui(state,msg);}
  function onResult(alts){
    const count=o.getOptions?o.getOptions():4, type=o.getType?o.getType():'mc';
    let r=parse(alts,{count,type});
    if(r&&r.kind==='submit'&&!o.submit)r=null;
    if(!r){
      const heard=(alts[0]||'').trim().slice(0,24);
      const guide=type==='ox'?"'O' 또는 'X'로 말해 주세요.":`1~${count}번 중에서 말해 주세요.`;
      finish('error',heard?`'${heard}'로 들었습니다. ${guide}`:'소리가 들리지 않았습니다. 다시 눌러 말해 주세요.');
      return;
    }
    finish('heard');
    try{if(r.kind==='submit')o.submit();else o.select(r);}catch(e){}
    ui('heard',describe(r));  // select가 카드를 다시 그렸더라도 새 요소에 상태를 적는다
  }
  ctl.toggle=function(){
    if(ctl.listening){ctl.stop();return;}
    stopListening();cancelSpeak();
    const Ctor=SR();
    try{rec=new Ctor();}catch(e){ui('error','음성 인식을 시작할 수 없습니다.');return;}
    done=false;ctl.listening=true;active=ctl;
    rec.lang=lang;rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=5;
    rec.onresult=ev=>{
      const res=ev.results&&ev.results[0], alts=[];
      if(res)for(let i=0;i<res.length;i++)alts.push(res[i].transcript);
      onResult(alts);
    };
    rec.onerror=ev=>{
      if(ev.error==='aborted')return;
      finish('error',ERR[ev.error]||'음성 인식에 실패했습니다. 다시 눌러 주세요.');
    };
    rec.onend=()=>{if(!done)finish('error',ERR['no-speech']);};
    ui('listening','듣는 중…');
    try{rec.start();}catch(e){finish('error','음성 인식을 시작할 수 없습니다. 잠시 뒤 다시 눌러 주세요.');}
  };
  if(o.bind!==false&&b0)b0.addEventListener('click',ctl.toggle);
  return ctl;
}

/* ── 읽어 주기 ────────────────────────────── */
function pickVoice(lang){
  try{
    const vs=speechSynthesis.getVoices();
    return vs.find(v=>v.lang===lang)||vs.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang.slice(0,2).toLowerCase()))||null;
  }catch(e){return null;}
}
function speak(text,lang){
  if(!canSpeak()||!text)return false;
  lang=lang||'ko-KR';
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text));
    u.lang=lang;const v=pickVoice(lang);if(v)u.voice=v;
    speechSynthesis.speak(u);return true;
  }catch(e){return false;}
}
function cancelSpeak(){if(canSpeak()){try{speechSynthesis.cancel();}catch(e){}}}
function isSpeaking(){try{return canSpeak()&&speechSynthesis.speaking;}catch(e){return false;}}

const API={supported,canSpeak,parse,attach,speak,cancelSpeak,isSpeaking,stopListening};
if(hasWin)root.QBVoice=API;
if(typeof module!=='undefined'&&module.exports)module.exports=API;
})(typeof window!=='undefined'?window:globalThis);
</script>

 main에 넘기는 모듈은?","o":["json","base64","pathlib","argparse"],"a":3,"h":"터미널 진입 코드에서 <code>ArgumentParser<\/code>를 만들고 <code>add_argument(\"image_path\")<\/code>로 위치 인자를 정의합니다. <code>parse_args()<\/code>로 읽은 값을 <code>main(args.image_path)<\/code>에 넘기는 파이썬 표준 모듈입니다.","w":"<code>argparse.ArgumentParser<\/code>로 <code>image_path<\/code> 위치 인자를 받고 <code>main(args.image_path)<\/code>를 호출합니다.","an":"6교시 · 01_vlm_basics · 터미널 진입 코드 · p.44","src":"if __name__ == \"__main__\":\n parser = argparse.ArgumentParser(description=__doc__)\n parser.add_argument(\"image_path\", help=\"설명할 이미지 파일 경로\")\n args = parser.parse_args()\n main(args.image_path)"},{"id":"t1-05","ty":"mc","lv":2,"game":true,"p":"압축 전 원본과 모델 설명을 비교할 때 특히 확인할 점은?","o":["모델 응답 속도","작은 물체나 글자 누락","GPU 온도","파일 이름 길이"],"a":1,"h":"해상도를 낮추고 JPEG 품질을 줄이면 세부 정보가 사라질 수 있습니다. 그래서 원본은 덮어쓰지 않고, 모델 설명과 원본을 나란히 놓고 크기가 작은 대상이나 텍스트가 빠졌는지를 확인합니다.","w":"원본은 덮어쓰지 않고, 축소·압축 때문에 작은 물체나 글자가 설명에서 누락되는지 원본과 비교합니다.","an":"6교시 · 01_vlm_basics · p.45","src":"원본 파일은 덮어쓰지 않습니다.\n작은 물체나 글자가 누락되는지 봅니다.\n파일 크기와 화질은 직접 확인합니다."},{"id":"t1-06","ty":"ox","lv":2,"game":true,"p":"작은 PNG를 JPEG로 저장하면 결과 바이트가 원본보다 클 수도 있다.","a":true,"h":"JPEG 변환이 항상 크기를 줄이는 것은 아닙니다. 자료는 원본이 작은 PNG일 때는 결과 JPEG 바이트가 오히려 늘어날 수 있으니 <code>len(compressed)<\/code>로 실제 바이트 수를 확인하라고 안내합니다.","w":"맞습니다. 작은 PNG에서는 결과 JPEG가 더 클 수 있으므로 실제 바이트 수를 확인합니다.","an":"6교시 · 01_vlm_basics · 1절","src":"작은 PNG에서는 결과 JPEG가 더 클 수도 있으므로 실제 바이트 수를 확인합니다."},{"id":"t1-07","ty":"ox","lv":1,"game":true,"p":"압축한 JPEG로 원본 이미지 파일을 덮어써야 한다.","a":false,"h":"참고 정답은 <code>BytesIO()<\/code> 메모리 버퍼에 JPEG를 저장하고 원본 파일은 with 블록 종료 시 닫기만 합니다. 원본과 모델 설명을 나중에 비교해야 하므로 원본 이미지는 그대로 보존합니다.","w":"틀렸습니다. 원본은 덮어쓰지 않고 메모리(BytesIO)에서 JPEG를 만듭니다.","an":"6교시 · 01_vlm_basics · 2절 TODO · p.45","src":"실패한 파일 경로나 지원하지 않는 이미지 오류는 원문을 읽고 수정합니다. 원본 이미지는 덮어쓰지 않습니다."},{"id":"t1-08","ty":"match","lv":2,"game":false,"p":"이미지 스크립트에서 쓰는 API와 역할을 연결하세요.","pairs":[["ImageOps.exif_transpose","EXIF 방향 보정"],["image.thumbnail","종횡비를 유지하며 축소"],["base64.b64encode","바이트를 전송 문자열로 변환"],["model.invoke","서버에 요청을 보내 답 받기"]],"h":"API 표 순서대로 보면 exif_transpose는 사진의 회전 정보를 바로잡고, thumbnail은 비율을 유지한 채 크기를 줄입니다. b64encode는 바이트를 문자열로 바꾸고, invoke는 서버로 요청을 보내 reply.content에서 답을 읽게 합니다.","w":"exif_transpose로 방향을 보정하고, thumbnail로 축소하고, b64encode로 문자열을 만들고, invoke로 모델에 요청합니다.","an":"6교시 · 01_vlm_basics · API 표","src":"파일을 열고 EXIF 방향을 보정합니다. 파일 핸들은 with 종료 시 닫힙니다. |\n| `convert`, `thumbnail` | `image.convert(\"RGB\")`; `image.thumbnail((768, 768))` | JPEG에 맞는 색상 모드로 바꾸고 종횡비를 유지해 축소합니다."},{"id":"t1-09","ty":"order","lv":2,"game":false,"p":"main(image_path)의 처리 순서를 맞추세요.","steps":["이미지 열기·방향 보정·RGB 변환","긴 변 768 이하로 축소","메모리에 JPEG(quality=80) 압축","Base64 data URI 만들기","Gemma 4 요청 후 터미널 출력"],"h":"main은 세 단계로 나뉩니다. 먼저 파일을 열어 방향 보정·RGB 변환·축소를 하고, 다음으로 메모리에서 JPEG 압축 후 Base64 data URI를 만들며, 마지막에 모델에 요청해 결과를 print합니다.","w":"TODO의 세 단계(열기·축소 / JPEG·Base64 / 요청·출력)를 세분하면 위 순서가 됩니다.","an":"6교시 · 01_vlm_basics · 2절 TODO · p.43","src":"1. 이미지 열기·방향 보정·RGB 변환·해상도 축소\n2. 메모리 JPEG 압축·Base64 data URI 생성\n3. Gemma 4 요청·터미널 출력"},{"id":"t1-10","ty":"multi","lv":2,"game":true,"p":"6교시 완료 확인 항목을 모두 고르세요.","o":["메모리에서 JPEG를 만들었다","설명이 터미널에 출력된다","JPEG 압축과 Base64를 구분한다","모든 프레임을 분석했다","사진 밖 장면까지 설명했다"],"a":[0,1,2],"h":"완료 확인 목록은 원본을 바꾸지 않고 메모리 JPEG를 만들었는지, 설명이 터미널에 나오는지, 압축과 전송용 인코딩을 구분하는지를 묻습니다. 한 장의 이미지로 원인이나 전후 움직임을 단정하는 것은 기준이 아니라 피할 행동입니다.","w":"원본 보존·터미널 출력·압축과 Base64 구분이 완료 기준입니다. 한 장의 이미지로 다른 프레임이나 사진 밖 장면을 알 수는 없습니다.","an":"6교시 · 01_vlm_basics · 4절 완료 확인","src":"- 원본 파일을 바꾸지 않고 메모리에서 JPEG를 만들었나요?\n- 이미지 설명이 터미널에 출력되나요?\n- JPEG 압축과 Base64를 구분할 수 있나요?\n- 해상도를 더 줄였을 때 놓치는 세부 정보가 있나요?\n\n한 장의 이미지로 보이지 않는 원인·전후 움직임을 단정하지 않는지도 확인합니다."}]},{"id":"t2","title":"근거 중심 이미지 질문","ref":"05.VLM/02_image_questions","qs":[{"id":"t2-01","ty":"mc","lv":2,"game":true,"p":"판단용 prompt에 분명히 쓸 네 가지에 해당하지 <b>않는<\/b> 것은?","o":["관찰 대상","근거 범위","불확실할 때 unknown","모델 이름"],"a":3,"h":"판단용 prompt에는 관찰 대상, 근거 범위(직접 보이는 내용만), 불확실성 표기(unknown), 출력 항목과 순서의 네 가지를 씁니다. 어떤 모델을 쓰는지는 이 네 가지 목록에 들어 있지 않습니다.","w":"관찰 대상, 이미지 근거 범위, 불확실하면 unknown, 출력 field와 순서를 명시합니다. 모델 이름은 prompt 계약 항목이 아닙니다.","an":"05.VLM/02_image_questions · 1절","src":"판단용 prompt에는 다음 네 가지를 분명히 씁니다.\n\n1. **관찰 대상:** 객체, 색, 위치, 위험 요소 중 무엇을 볼지\n2. **근거 범위:** 이미지에서 직접 보이는 내용만 사용할지\n3. **불확실성:** 보이지 않거나 애매하면 `unknown`\n4. **출력 항목:** 사람이 비교하거나 프로그램이 읽을 field와 순서"},{"id":"t2-02","ty":"mc","lv":1,"game":true,"p":"보이지 않거나 확실하지 않을 때 쓰라고 요구하는 값은?","o":["none","unknown","0","error"],"a":1,"h":"근거 중심 질문은 이미지에서 직접 확인되는 근거만 쓰라고 지시합니다. 보이지 않거나 애매한 항목은 추측하지 말고 정해진 영어 단어 하나로 '알 수 없음'을 표시하게 합니다.","w":"근거 중심 질문은 '보이지 않거나 확실하지 않으면 unknown이라고 쓰세요'를 포함합니다.","an":"05.VLM/02_image_questions · 1~2절","src":"이미지에서 직접 확인되는 근거만 사용하세요. 보이지 않거나 확실하지 않으면 unknown이라고 쓰세요."},{"id":"t2-03","ty":"mc","lv":2,"game":true,"p":"두 질문을 비교하는 '통제된 비교'의 조건은?","o":["prompt만 다르고 나머지는 같다","이미지도 함께 바꾼다","모델을 함께 바꾼다","질문과 모델을 모두 바꾼다"],"a":0,"h":"질문을 바꾸면서 이미지와 모델까지 함께 바꾸면 차이의 원인을 구분할 수 없습니다. 이미지 byte와 모델 option을 고정하고 한 가지 변수만 달리해야 차이를 그 변수 탓으로 돌릴 수 있습니다.","w":"이미지 byte와 모델 option은 같고 prompt만 달라야 차이의 원인을 질문으로 해석할 수 있습니다.","an":"05.VLM/02_image_questions · 3절","src":"이미지 byte와 모델 option은 같고 prompt만 다릅니다. 이것이 통제된 비교입니다."},{"id":"t2-04","ty":"mc","lv":2,"game":true,"p":"<code>num_predict<\/code>의 의미는?","o":["이미지 해상도","요청 횟수","생성 토큰 수의 상한","응답 대기 시간"],"a":2,"h":"실행 사례에서 넓은 질문은 num_predict=120 때문에 120토큰에서 문장 중간에 끊겼습니다. 이 옵션은 모델이 생성할 수 있는 토큰 개수에 상한을 두며, 토큰은 글자나 단어와 일대일로 대응하지 않습니다.","w":"num_predict는 생성 토큰 수의 상한입니다. 상한에 도달해 문장이 미완성이면 출력 잘림을 점검합니다.","an":"05.VLM/02_image_questions · 4절 실제 실행 사례","src":"`num_predict`는 생성 토큰 수의 상한입니다. 토큰은 글자나 단어와 일대일 대응하지 않습니다. 출력 토큰 수가 상한에 도달하고 문장이 미완성이면 출력 잘림을 점검합니다."},{"id":"t2-05","ty":"mc","lv":2,"game":true,"p":"<code>build_grounded_prompt<\/code>가 반환하는 것은?","o":["모델 응답 dict","정답 문자열","prompt 문자열 하나","이미지 바이트"],"a":2,"h":"<code>build_grounded_prompt<\/code>는 모델을 호출하거나 정답을 반환하지 않습니다. 질문·근거 지시·unknown 지시·field 순서를 한 문장으로 이어 붙인 답변 요구사항을 돌려주며, dict나 모델 응답은 반환하지 않습니다.","w":"함수는 모델을 호출하지 않고 질문·근거 지시·unknown 지시·field 순서를 담은 prompt 문자열 하나를 반환합니다.","an":"05.VLM/02_image_questions · 2절 TODO","src":"**입력 → 출력:** `question='무엇이 보이나요?'`, `required_fields=['animal','visible_evidence']`를 받아 **prompt 문자열 하나** 를 반환합니다. dict나 모델 응답을 반환하지 않습니다."},{"id":"t2-06","ty":"ox","lv":2,"game":true,"p":"두 질문의 답이 다르면 두 번째 질문이 더 좋은 질문이다.","a":false,"h":"답이 다르다는 사실만으로는 질문의 우열을 판단할 수 없습니다. 보이는 근거, 요구 형식, 가려진 정보의 보류를 각각 평가해야 하며 모델·이미지·옵션이 함께 바뀌면 원인을 질문에 돌릴 수 없습니다.","w":"틀렸습니다. 보이는 근거, 요구 형식, 가려진 정보의 보류를 각각 평가해야 판단할 수 있습니다.","an":"05.VLM/02_image_questions · 실행 전 질문","src":"**설명:** 다르다는 사실만으로는 판단할 수 없습니다. 보이는 근거, 요구 형식, 가려진 정보의 보류를 각각 평가해야 합니다. 질문 외 모델·이미지·옵션을 함께 바꾸면 원인을 질문 하나에 돌릴 수 없습니다."},{"id":"t2-07","ty":"ox","lv":1,"game":true,"p":"프롬프트를 자세히 써도 틀린 답이 사라지는 것은 아니다.","a":true,"h":"자세한 프롬프트가 모델의 인식 능력을 바꾸지는 않습니다. 자료는 프롬프트의 효과가 오답 제거가 아니라 답을 검토할 기준을 구체화하는 데 있다고 설명합니다.","w":"맞습니다. 자세한 prompt는 답을 검토할 기준을 구체화하는 효과가 있을 뿐 오답을 없애지는 않습니다.","an":"05.VLM/02_image_questions · 1절","src":"프롬프트를 자세히 쓴다고 틀린 답이 사라지지는 않습니다. 답을 검토할 기준을 구체화하는 효과가 있습니다."},{"id":"t2-08","ty":"match","lv":2,"game":false,"p":"비교 실험의 구성 요소와 설명을 연결하세요.","pairs":[["넓은 질문(broad)","필요한 정보가 불분명한 설명 요청"],["근거 중심 질문(grounded)","대상·근거·unknown·항목을 명시"],["manifest.json","입력 해시·모델·질문·옵션 고정"],["prompt-comparison.jsonl","요청마다 결과·원문·지연을 한 줄 기록"]],"h":"넓은 질문은 caption에는 쓸 수 있지만 어떤 정보가 필요한지 알 수 없고, 근거 중심 질문은 대상·근거 범위·unknown·출력 항목을 명시합니다. 비교 폴더의 manifest는 공통 조건을 고정하고, jsonl 파일은 요청이 끝날 때마다 결과·원문·지연을 한 줄씩 추가합니다.","w":"manifest는 공통 조건을, JSONL은 요청이 끝날 때마다 성공·오류·원문·지연을 한 줄씩 남깁니다.","an":"05.VLM/02_image_questions · 1·3절","src":"`manifest.json`은 입력 해시·모델·질문·옵션을 고정하고, `prompt-comparison.jsonl`에는 **요청 하나가 끝날 때마다** 성공 또는 오류·원문·지연을 한 줄씩 추가합니다."},{"id":"t2-09","ty":"order","lv":2,"game":false,"p":"이미지 질문 비교 실습의 흐름을 순서대로 맞추세요.","steps":["같은 이미지·모델 준비","기대 관찰 기록","질문 TODO 작성","요청별 기록","형식·의미·unknown 평가","실패 건만 재시도"],"h":"전체 과정은 같은 이미지·모델을 고정하는 것에서 시작해, 응답을 보기 전에 기대 관찰을 적고, 질문을 작성해 요청별로 기록합니다. 그 뒤 형식·의미·unknown 여부를 평가하고 마지막으로 실패한 요청만 다시 보냅니다.","w":"같은 조건에서 기대 관찰을 먼저 적고 질문을 만든 뒤, 요청별로 기록·평가하고 실패한 요청만 다시 보냅니다.","an":"05.VLM/02_image_questions · 전체 과정","src":"같은 이미지·모델\n ↓\n기대 관찰 기록\n ↓\n질문 TODO\n ↓\n요청별 기록\n ↓\n형식·의미·unknown 평가\n ↓\n실패 건만 재시도"},{"id":"t2-10","ty":"multi","lv":3,"game":true,"p":"<code>build_grounded_prompt<\/code>가 ValueError로 거부하는 입력을 모두 고르세요.","o":["빈 질문","문자열 하나를 field 목록으로 전달","중복된 field","서로 다른 field 두 개의 list","앞뒤 공백이 있는 질문"],"a":[0,1,2],"h":"함수는 빈 질문, 빈 field 목록, 문자열 하나를 목록처럼 준 경우, 중복 field와 빈 field를 ValueError로 거부합니다. 앞뒤 공백은 strip으로 정리되지만 정리한 뒤 같은 이름이 되면 중복으로 봅니다.","w":"빈 질문, list/tuple이 아닌 문자열 하나, 정리 후 중복되는 field는 거부합니다. 앞뒤 공백은 strip으로 정리됩니다.","an":"05.VLM/02_image_questions · 2절 TODO · 정답 해설","src":"빈 질문, 빈 field 목록, 문자열 하나를 목록처럼 준 경우, 중복 field와 빈 field는 `ValueError`로 거부합니다."}]},{"id":"t3","title":"카메라 관찰과 최신 프레임 기록","ref":"7교시 · p.47–52","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"카메라 프로그램이 모델에 보낼 프레임을 고르는 방식은?","o":["모든 프레임을 대기열에","최신 프레임 한 장 선택","10프레임씩 묶어 전송","첫 프레임만 반복"],"a":1,"h":"카메라는 계속 프레임을 만들지만 모델은 요청 하나를 처리하는 데 시간이 걸립니다. 모든 프레임을 대기열에 쌓으면 오래된 장면을 뒤늦게 분석하게 되므로, 프로그램은 이전 값을 교체하며 가장 새 장면 하나만 고릅니다.","w":"모든 프레임을 쌓으면 오래된 장면을 뒤늦게 분석하게 되므로 최신 프레임 한 장만 선택합니다.","an":"7교시 · 02_camera_records · 1절 · 슬라이드 p.47","src":"카메라는 계속 프레임을 만들지만 모델은 한 요청을 처리하는 데 시간이 필요합니다. 모든 프레임을 대기열에 쌓으면 오래된 장면을 뒤늦게 분석하게 됩니다. 이번 프로그램은 최신 프레임 한 장을 선택합니다."},{"id":"t3-02","ty":"mc","lv":2,"game":true,"p":"<code>--interval 10<\/code>의 의미는?","o":["요청 시작 간 최소 10초","정확히 10초마다 요청","10프레임마다 요청","최대 10회 요청"],"a":0,"h":"interval 값은 한 요청이 시작된 뒤 다음 요청이 시작되기까지의 최소 대기 시간(초)입니다. 모델 추론이 그보다 느리면 실제 관찰 간격은 더 길어지며, 영상의 모든 프레임을 분석하는 설정도 아닙니다.","w":"interval은 요청 시작 사이의 최소 간격입니다. 추론이 느리면 실제 관찰 간격은 10초보다 길어집니다.","an":"7교시 · 02_camera_records · 5절 · p.51","src":"interval=10은 요청 시작 사이의 최소 간격입니다. 모델이 더 느리면 실제 간격은 더 길어집니다. 영상의 모든 프레임을 분석하는 설정이 아닙니다."},{"id":"t3-03","ty":"mc","lv":1,"game":true,"p":"모델 요청 없이 카메라와 저장 경로만 확인하는 옵션은?","o":["--preview","--text-output","--dry-run","--max-requests"],"a":2,"h":"CLI 인자 표에 따르면 이 옵션은 프레임과 저장 경로만 확인하고 모델 요청은 보내지 않습니다. 실제 관찰 전에 <code>--max-requests 1<\/code>과 함께 먼저 실행하며, 이 행은 실제 VLM 관찰로 취급하지 않습니다.","w":"--dry-run은 프레임과 경로만 확인하고 모델 요청을 보내지 않습니다. dry_run 행은 실제 VLM 관찰이 아닙니다.","an":"7교시 · 02_camera_records · 2절 CLI 인자","src":"| `--dry-run` | `--max-requests 1 --dry-run` | 프레임·경로 확인. 모델 요청을 보내지 않습니다. |"},{"id":"t3-04","ty":"mc","lv":1,"game":true,"p":"관찰 기록이 저장되는 파일 형식은?","o":["CSV 표","XML 문서","SQLite DB","JSONL"],"a":3,"h":"관찰 로그는 <code>observations.jsonl<\/code>로 저장되며, 한 줄에 JSON 사전 하나를 담는 형식입니다. 관찰 행에는 id·촬영 시각·원본 경로·raw·status가 들어 있습니다.","w":"observations.jsonl에 한 줄당 관찰 하나(id·촬영 시각·원본 경로·raw·status)를 저장합니다.","an":"7교시 · 02_camera_records · 3절","src":"JSONL은 한 줄에 JSON 사전 하나를 저장하는 형식입니다. 첫 줄에는 실행 설정이 있을 수 있고, 관찰 행에는 id·촬영 시각·원본 경로·raw·status가 있습니다."},{"id":"t3-05","ty":"mc","lv":2,"game":true,"p":"카메라 장애 해결에 5분 이상 걸리면 어떻게 하나요?","o":["실습을 건너뛴다","녹화 입력으로 전환·표시","다른 사람 로그 사용","카메라를 두 번 연다"],"a":1,"h":"카메라 연결이 어려우면 <code>--source video<\/code>로 제공 영상을 입력합니다. 장애 해결이 5분 이상 걸리면 이렇게 전환하되, 녹화 입력임을 표시해 실제 카메라 관찰과 같은 종류로 섞지 않아야 합니다.","w":"--source video로 녹화 입력에 전환하고, 녹화 입력임을 표시합니다. 실제 카메라와 녹화 결과를 같은 관찰로 표시하지 않습니다.","an":"7교시 · 02_camera_records · 2절","src":"카메라 장애 해결에 5분 이상 걸리면 녹화 입력으로 전환합니다. 실제 카메라와 녹화 결과를 같은 종류의 관찰로 표시하지 않습니다."},{"id":"t3-06","ty":"ox","lv":1,"game":true,"p":"촬영 시각과 모델 응답 완료 시각은 같다.","a":false,"h":"모델은 프레임을 받은 뒤 답을 만드는 데 시간이 걸리므로 그 사이 장면이 바뀔 수 있습니다. 자료는 촬영 시각과 응답 완료 시각을 구분하고, 늦게 온 응답이 그 순간의 장면을 설명한 것은 아니라고 강조합니다.","w":"틀렸습니다. 촬영 시각과 응답 완료 시각은 다르며, 응답이 늦게 왔다고 그때의 최신 장면을 설명한 것은 아닙니다.","an":"7교시 · 02_camera_records · 4절 · p.50","src":"촬영 시각과 응답 완료 시각은 다르며, 응답이 늦게 왔다고 그때의 최신 장면을 설명한 것은 아닙니다."},{"id":"t3-07","ty":"ox","lv":1,"game":true,"p":"카메라는 로컬 담당자 한 명만 열고, 두 수강생이 장면 변경·관찰 기록 역할을 교대한다.","a":true,"h":"카메라 프로그램은 Jupyter Terminal에서 실행하며, 같은 카메라를 여러 프로세스가 열면 충돌합니다. 그래서 로컬 담당자 한 명만 장치를 열고, 두 수강생이 장면을 바꾸는 역할과 기록하는 역할을 번갈아 맡습니다.","w":"맞습니다. 로컬 담당자 한 명이 카메라를 열고 두 수강생이 역할을 교대합니다.","an":"7교시 · 02_camera_records · 2절 · p.48","src":"로컬 담당자 한 명만 카메라를 열고, 두 수강생이 장면 변경·관찰 기록 역할을 교대합니다."},{"id":"t3-08","ty":"match","lv":2,"game":false,"p":"camera_vlm.py의 구성과 역할을 연결하세요.","pairs":[["CaptureWorker","별도 스레드로 카메라 계속 읽기"],["LatestFrame","최신 한 장과 번호 보관"],["append_record","JSONL 한 행 저장"],["finally 블록","종료·오류 시 카메라·스레드 정리"]],"h":"코드 읽기 표는 구성별 역할을 설명합니다. 별도 스레드에서 카메라를 계속 읽는 클래스, 최신 한 장과 번호를 보관하는 클래스, JSONL 한 행을 쓰는 함수, 종료·오류·Ctrl+C에서도 자원을 정리하는 블록으로 나뉩니다.","w":"CaptureWorker는 모델 대기와 무관하게 촬영하고, LatestFrame은 최근 한 장만 덮어쓰며, append_record가 기록하고, finally가 자원을 정리합니다.","an":"7교시 · 02_camera_records · 전체 코드 읽기 표","src":"| CaptureWorker | 카메라를 별도 스레드에서 계속 읽기 | 모델 응답 대기 중에도 최신 프레임이 갱신됩니다. |\n| LatestFrame | 최신 한 장과 번호를 보관 | 모델이 모든 프레임을 분석하는 것은 아닙니다. |\n| observe / append_record | 모델 요청 / JSONL 저장 | 원본 경로·시각·응답·오류를 연결합니다. |\n| finally | 카메라·스레드·창 정리 | 종료·오류·Ctrl+C에서도 자원을 정리합니다. |"},{"id":"t3-09","ty":"order","lv":3,"game":false,"p":"camera_vlm.py main의 흐름을 순서대로 맞추세요.","steps":["실행 인자 읽기","모델 준비","입력(카메라/영상) 열기","최신 프레임 선택","요청 간격 검사","프레임 저장 후 추론·기록","자원 정리"],"h":"main은 parse_args로 인자를 읽고 모델을 준비한 뒤 입력을 엽니다. 반복 구간에서는 최신 프레임 선택 → 요청 간격 검사 → 저장·추론을 수행하고, 마지막에 finally에서 자원을 정리하며 끝납니다.","w":"parse_args → 모델 준비 → 입력 열기 → 최신 프레임 선택 → 간격 검사 → 저장·추론 → 종료 시 정리 순입니다.","an":"7교시 · 02_camera_records · main 설명","src":"parse_args → 모델 준비 → 입력 열기 → 최신 프레임 선택 → 요청 간격 검사 → 저장·추론 → 종료 순입니다."},{"id":"t3-10","ty":"multi","lv":2,"game":true,"p":"7교시 완료 확인 항목을 모두 고르세요.","o":["실제 입력 종류와 로그 경로 기록","관찰 ID에서 원본 이미지 확인","미관찰 구간과 모델 지연 설명","가장 최근 남의 로그 자동 선택","dry-run 행을 실제 관찰로 표시"],"a":[0,1,2],"h":"7교시 완료 확인 체크리스트는 실제 입력 종류와 로그 경로 기록, 관찰 ID에서 원본 이미지까지 확인, 미관찰 구간과 모델 지연 설명의 세 항목입니다. 실행 성공과 의미 정답은 구분해야 합니다.","w":"입력 종류·로그 경로 기록, ID→원본 확인, 미관찰 구간과 지연 설명이 완료 기준입니다. 남의 로그 자동 선택이나 dry-run을 관찰로 표시하는 것은 금지입니다.","an":"7교시 · 02_camera_records · 완료 확인 · p.49","src":"- [ ] 실제 입력 종류와 로그 경로를 기록했다.\n- [ ] 관찰 ID에서 원본 이미지까지 확인했다.\n- [ ] 미관찰 구간과 모델 지연을 설명했다."}]},{"id":"t4","title":"관찰 필터와 LLM 요약 검증","ref":"8교시 · p.53–58","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":true,"p":"8교시 짧은 관찰에 사용하는 소형 VLM은?","o":["Gemma 4","Moondream 1.8B","YOLOv8","Whisper"],"a":1,"h":"8교시 슬라이드는 짧은 영어 질문으로 장면을 설명하는 소형 모델을 소개합니다. Ollama 이름은 <code>moondream:1.8b<\/code>이고 문맥 2K이며, 같은 camera_vlm.py에 <code>--model<\/code>로 지정해 사용합니다.","w":"moondream:1.8b로 관찰을 남기고, 그 관찰 텍스트를 Gemma 4가 요약합니다.","an":"8교시 · 03_observation_summary · 1절 · 슬라이드 p.53","src":"Moondream 1.8B를 소개합니다 \n강사 설명 | 8교시 · VLM | 이론 후 ipynb 실습\n짧은 영어 질문으로 장면을 설명합니다.\n같은 camera_vlm.py를 재사용합니다."},{"id":"t4-02","ty":"mc","lv":2,"game":true,"p":"이번 실습의 '시간창'은 무엇을 뜻하나요?","o":["최근 N초","오류 없는 처음 N개","기록 순서상 마지막 N개 행","무작위 N개"],"a":2,"h":"이번 실습의 시간창은 초 단위 시간 구간이 아닙니다. 입력 파일이 기록 순서대로 쌓였다고 가정하고, <code>records[-max_records:]<\/code>처럼 끝에서부터 정해진 개수의 행을 먼저 고릅니다.","w":"시간창은 최근 N초가 아니라 기록 순서상 마지막 N개 행입니다. 자동 정렬은 하지 않습니다.","an":"8교시 · 03_observation_summary · 3절 · p.54","src":"이번 “시간창”은 **최근 N초가 아니라 기록 순서상 마지막 N개 행**입니다. 입력 파일이 기록 순서대로 쌓였다고 가정하며 자동 정렬은 하지 않습니다."},{"id":"t4-03","ty":"mc","lv":3,"game":true,"p":"[오래된 정상, 최근 정상, 최근 오류]에서 N=2이면 문맥에 들어가는 것은?","o":["최근 정상 하나","오래된 정상과 최근 정상","세 개 모두","아무것도 없음"],"a":0,"h":"필터는 오류를 지우기 전에 최근 N개 행을 먼저 선택합니다. N=2이면 마지막 두 행(최근 정상, 최근 오류)만 window가 되고, 그중 오류 행이 빠지며 오래된 정상 행으로 빈자리를 채우지 않습니다.","w":"마지막 2개(최근 정상, 최근 오류)를 먼저 고르고 오류를 제외하므로 최근 정상 하나만 남습니다. 오래된 정상으로 채우지 않습니다.","an":"8교시 · 03_observation_summary · 3절 예시","src":"예를 들어 `[오래된 정상, 최근 정상, 최근 오류]`에서 N=2이면 **최근 정상 한 개만** 반환합니다. 오래된 정상을 가져와 두 개로 채우지 않습니다."},{"id":"t4-04","ty":"mc","lv":2,"game":true,"p":"유효한 관찰이 하나도 없을 때 필터 함수의 반환값은?","o":["None 값","오류 메시지","'관찰 없음' 문장","빈 문자열"],"a":3,"h":"함수의 출력은 ID·시각이 붙은 문자열이며, 남는 정상 관찰이 없으면 오류를 내지 않고 내용이 없는 문자열을 돌려줍니다. 원본 목록·사전은 수정하지 않으며, 이 결과가 비면 이후 단계에서 모델을 호출하지 않습니다.","w":"유효 관찰이 없으면 빈 문자열을 반환하고, 원본 목록·사전은 수정하지 않습니다.","an":"8교시 · 03_observation_summary · 3절 · p.55","src":"출력은 ID·시각이 붙은 문자열입니다.\n빈 결과는 빈 문자열을 반환합니다."},{"id":"t4-05","ty":"mc","lv":2,"game":true,"p":"요약 단계에서 Gemma 4가 받는 입력은?","o":["원본 이미지","VLM이 만든 관찰 텍스트","카메라 영상","임베딩 벡터"],"a":1,"h":"요약 단계에서는 Moondream 또는 Gemma 4가 앞서 만든 결과물을 Gemma 4에게 전달하며, 이 요청에는 이미지가 들어가지 않습니다. 그래서 요약 모델은 원본을 다시 보지 못하고 VLM의 잘못된 설명이 요약으로 이어질 수 있습니다.","w":"요약 모델은 관찰 텍스트만 받으므로 원본을 다시 보지 않습니다. VLM의 잘못된 설명이 요약으로 이어질 수 있습니다.","an":"8교시 · 03_observation_summary · 4절 · p.56","src":"Moondream 또는 Gemma 4가 만든 **관찰 텍스트**를 이번에는 Gemma 4에게 전달합니다. 이 요청에는 이미지가 없습니다. 따라서 요약 모델은 원본을 다시 본 것이 아니며, VLM이 잘못 설명한 내용이 요약으로 이어질 수 있습니다."},{"id":"t4-06","ty":"ox","lv":1,"game":true,"p":"문맥이 비어 있으면 요약 모델을 호출하지 않는다.","a":true,"h":"코드는 <code>if context_text:<\/code>로 문맥이 있을 때만 <code>summary_chain.invoke<\/code>를 실행합니다. 근거가 없는 상태에서 모델을 부르면 추측 답변이 나오므로, 문맥이 비면 '요청을 보내지 않았다'는 메시지만 출력합니다.","w":"맞습니다. 빈 문맥에서는 추측 답변을 받지 않도록 호출하지 않고 status를 no_context로 둡니다.","an":"8교시 · 03_observation_summary · 4절","src":"# 빈 문맥에서는 추측 답변을 받지 않도록 모델을 호출하지 않습니다.\nif context_text:\n summary_status = \"request_error\"\n try:\n reply = summary_chain.invoke({\"context\": context_text, \"question\": question})"},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"관찰 기록의 status가 ok이면 관찰 내용은 사실과 맞다.","a":false,"h":"필드 표에서 status는 실행 상태를, raw는 모델이 생성한 관찰 원문을 뜻합니다. 실행이 성공했다는 것과 내용이 사실과 맞는다는 것은 별개이므로, 자료는 ok가 사실 정답을 뜻하지 않는다고 명시합니다.","w":"틀렸습니다. ok는 실행 상태일 뿐 사실 정답을 뜻하지 않습니다. raw와 원본 이미지를 대조해야 합니다.","an":"8교시 · 03_observation_summary · 2절 필드 표","src":"| `status` / `raw` | `row.get(\"raw\")` | 실행 상태 / 모델이 생성한 관찰 원문. ok는 사실 정답을 뜻하지 않습니다. |"},{"id":"t4-08","ty":"match","lv":1,"game":false,"p":"관찰 기록 필드와 의미를 연결하세요.","pairs":[["id","원본을 찾을 관찰 ID"],["captured_at_utc","촬영 시각"],["raw","모델이 생성한 관찰 원문"],["status","실행 상태"]],"h":"필드 표에 따르면 id는 원본을 찾기 위한 식별자, captured_at_utc는 장면이 찍힌 시각(응답 완료 시각과 다름)입니다. status는 실행이 어떻게 끝났는지, raw는 모델이 만든 관찰 문장 그대로를 담습니다.","w":"id로 원본을 찾고, captured_at_utc는 응답 완료 시각이 아닌 촬영 시각이며, raw는 원문, status는 실행 상태입니다.","an":"8교시 · 03_observation_summary · 2절 필드 표","src":"| `id` / `captured_at_utc` | `row[\"id\"]` | 원본을 찾을 ID / 촬영 시각. 응답 완료 시각과 다릅니다. |\n| `status` / `raw` | `row.get(\"raw\")` | 실행 상태 / 모델이 생성한 관찰 원문. ok는 사실 정답을 뜻하지 않습니다. |"},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"filter_observation_window의 구현 순서를 맞추세요.","steps":["max_records가 양의 정수인지 검사","최근 N개 행 선택","status ok·공백 아닌 raw만 선택","[ID | 시각] 원문 줄을 연결"],"h":"TODO 표는 1) max_records가 양의 정수인지 검사, 2) 끝에서 N개 window 선택, 3) 정상 상태이며 공백 아닌 raw만 고르기, 4) ID·시각·원문 줄을 줄바꿈으로 연결하는 순서입니다. 오류를 먼저 지우면 오래된 기록이 대신 들어오기 때문에 2단계가 3단계보다 앞섭니다.","w":"입력 검사 → 최근 N개 선택 → 정상 행 필터 → ID·시각·원문을 줄바꿈으로 연결 순서입니다.","an":"8교시 · 03_observation_summary · 3절 TODO 표","src":"| 1 | 양의 정수 max_records 검사 | 0·음수·소수·bool은 실수를 숨기지 않고 ValueError로 알립니다. |\n| 2 | `records[-max_records:]`로 window 선택 | 오류를 먼저 제거하면 오래된 기록이 대신 들어옵니다. |\n| 3 | status=ok, raw가 공백 아닌 문자열인 행 선택 | 실패·누락·빈 관찰을 LLM 근거로 사용하지 않습니다. |\n| 4 | `[ID / 시각] 원문` 문자열을 줄바꿈으로 연결 | ID에서 원본 이미지로 돌아갈 수 있습니다. |"},{"id":"t4-10","ty":"multi","lv":2,"game":true,"p":"요약 → 관찰 ID → 원본 검증에서 확인할 항목을 모두 고르세요.","o":["요약의 ID와 주장이 문맥에 있는가","VLM raw가 이미지와 일치하는가","관찰 사이 동선·원인을 지어내지 않았는가","요약 문장이 충분히 긴가","confidence가 0.9 이상인가"],"a":[0,1,2],"h":"5절 확인 표는 선택(오래된 기록으로 채우지 않았는지), 근거(요약의 ID와 주장이 문맥에 있는지), 원본(VLM raw가 이미지와 일치하는지), 미관찰(관찰 사이 동선·원인·안전을 지어내지 않았는지)의 네 질문으로 이루어집니다.","w":"근거(ID·주장), 원본(raw와 이미지 일치), 미관찰(지어내지 않기)을 확인합니다. 길이나 confidence는 검증 기준이 아닙니다.","an":"8교시 · 03_observation_summary · 5절 · p.57","src":"| 선택 | 오류를 제외한 뒤 오래된 기록으로 채우지 않았나요? |\n| 근거 | 요약의 ID와 주장이 실제 문맥에 있나요? |\n| 원본 | VLM raw 자체가 이미지와 일치하나요? |\n| 미관찰 | 관찰 사이의 동선·원인·안전을 지어내지 않았나요? |"}]},{"id":"t5","title":"구조화 결과와 안전한 실패","ref":"05.VLM/04_structured_results","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"이 단원 구조화 결과에서 label 허용값이 <b>아닌<\/b> 것은?","o":["clear","caution","unknown","go"],"a":3,"h":"계약 표에서 label은 string이며 정해진 세 값 중 하나만 허용합니다. 허용값은 비어 있음·주의·판단 불가를 뜻하는 영어 단어이고, 그 밖의 값은 JSON 문법이 맞아도 거부됩니다.","w":"label은 clear, caution, unknown 중 하나여야 합니다. 'go'처럼 계약에 없는 값은 JSON 문법이 맞아도 거부합니다.","an":"05.VLM/04_structured_results · 1절 계약 표","src":"| `label` | string | `clear`, `caution`, `unknown` 중 하나 |"},{"id":"t5-02","ty":"mc","lv":2,"game":true,"p":"confidence 필드의 계약은?","o":["bool 아닌 유한한 0–1 숫자","0–100 정수","true 또는 false","퍼센트 문자열"],"a":0,"h":"confidence는 number 자료형이며 bool(true/false)은 숫자처럼 보여도 거부합니다. NaN·무한대가 아닌 유한한 값이어야 하고 0과 1이라는 경계값까지 포함한 범위 안에 있어야 합니다.","w":"confidence는 bool이 아닌 유한한 0–1 숫자입니다. 0과 1은 정확한 경계로 허용합니다.","an":"05.VLM/04_structured_results · 1절 계약 표","src":"| `confidence` | number | bool이 아닌 유한한 0–1 값 |\n| `evidence` | string list | 1–3개의 이미지 근거, 각 1–120자 |\n\n`confidence=0`과 `confidence=1`은 정확한 경계이므로 허용합니다."},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"evidence 필드의 계약은?","o":["숫자 목록","문자열 1–3개, 각 1–120자","빈 목록도 허용","문자열 최대 10개"],"a":1,"h":"evidence는 string list로, 이미지에서 확인한 근거를 담습니다. 계약 표는 근거 개수와 각 근거 문자열의 길이(strip 후)를 모두 제한하며, 빈 목록이나 너무 긴 문장은 거부됩니다.","w":"evidence는 1–3개의 이미지 근거 문자열이며, 각 항목은 공백 정리 후 1–120자여야 합니다.","an":"05.VLM/04_structured_results · 1절 계약 표","src":"| `evidence` | string list | 1–3개의 이미지 근거, 각 1–120자 |"},{"id":"t5-04","ty":"mc","lv":2,"game":true,"p":"검증에 실패했을 때 호출 측의 fallback 결과는?","o":["caution","clear","unknown, confidence 0","직전 결과 유지"],"a":2,"h":"검증에 실패하면 <code>safe_assessment<\/code>는 판단 보류를 뜻하는 label과 가장 낮은 confidence로 fallback을 만들고 오류 문자열을 함께 돌려줍니다. 이후 행동 코드는 이 보류 label을 정지로 연결합니다.","w":"fallback은 label=unknown, confidence=0이며, 오류 문자열을 함께 기록해 '실제 unknown 장면'과 '검증 실패'를 구분합니다.","an":"05.VLM/04_structured_results · 5절","src":"- 오류일 때 `unknown`, confidence 0으로 바꾸는 fallback을 확인합니다."},{"id":"t5-05","ty":"mc","lv":3,"game":true,"p":"road.png에서 status=ok, label=clear인데 evidence에 '차량이 주행'이라고 적힌 사례는?","o":["정답","형식 통과·의미 오답","형식 오류","판단 보류"],"a":1,"h":"<code>status=ok<\/code>는 파싱과 key·자료형·허용값 검증을 통과했다는 뜻일 뿐 parser는 사진을 다시 보지 않습니다. 차량이 있으면 caution이라는 기준과 clear가 모순되므로, 형식과 의미를 따로 평가해 기록합니다.","w":"형식 검사는 통과했지만 장면 판단은 오답입니다. 평가 워크북에서는 false_allow로 기록합니다.","an":"05.VLM/04_structured_results · 5절 실제 실행 사례","src":"차량·사람이 있으면 `caution`이라는 요청 기준과 `clear`가 모순됩니다. **형식 검사는 통과했지만 장면 판단은 오답** 으로 기록합니다."},{"id":"t5-06","ty":"ox","lv":2,"game":true,"p":"confidence=0.95는 95% 확률로 정답이라는 뜻이다.","a":false,"h":"confidence 값은 모델이 스스로 보고한 숫자입니다. 자료는 이것을 실제 정답 확률로 단정하지 말라고 하며, 높은 confidence를 이유로 오답을 통과시켜서도 안 된다고 설명합니다.","w":"틀렸습니다. confidence는 모델의 자기 보고 숫자이며 실제 정답 확률로 단정하지 않습니다.","an":"05.VLM/04_structured_results · 1·5절","src":"`confidence=0.95`도 모델의 자기 보고 숫자이며 “95% 확률로 정답”이라는 뜻이 아닙니다."},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"Ollama 요청의 format에 schema를 넣어도 client parser는 여전히 필요하다.","a":true,"h":"Ollama 요청의 format에 schema를 넣으면 모델이 그 구조로 생성하도록 돕습니다. 하지만 네트워크 중단, 버전 차이, 예상 밖 문자열이 있을 수 있어 모델에게 요구하는 단계와 프로그램이 확인하는 단계는 따로 둡니다.","w":"맞습니다. 네트워크 중단·버전 차이·예상 밖 문자열을 고려해 프로그램은 신뢰하기 전에 다시 검증합니다.","an":"05.VLM/04_structured_results · 3절","src":"Ollama 요청의 `format`에 schema를 넣으면 모델이 해당 구조를 생성하도록 돕습니다. 그러나 네트워크 중단, 버전 차이, 예상 밖 문자열을 고려해 client parser는 여전히 필요합니다. **모델에게 요구하는 것** 과 **프로그램이 신뢰하기 전에 확인하는 것** 은 두 단계입니다."},{"id":"t5-08","ty":"match","lv":3,"game":false,"p":"입력 사례와 parser 판정을 연결하세요.","pairs":[["label이 fly인 JSON","허용되지 않은 label로 거부"],["confidence가 true","bool이라 거부"],["JSON이 아닌 설명 문장","JSON 문법 오류"],["confidence가 1","경계값이라 허용"]],"h":"label은 clear·caution·unknown만 허용되고, confidence는 bool이 아닌 0–1 숫자이며 0과 1은 정확한 경계라 허용됩니다. JSON으로 읽을 수 없는 문장은 가장 바깥 단계인 문법 검사에서 걸립니다.","w":"문법이 맞아도 계약에 없는 label·bool confidence는 거부하고, 정확한 경계 1은 허용합니다.","an":"05.VLM/04_structured_results · 1~2절","src":"반대로 JSON 문법이 맞아도 `label='fly'`, `confidence=27`처럼 시스템 계약에 없는 값일 수 있습니다.\n\n이 단원은 세 field만 허용합니다.\n\n| key | 자료형 | 계약 |\n|---|---|---|\n| `label` | string | `clear`, `caution`, `unknown` 중 하나 |\n| `confidence` | number | bool이 아닌 유한한 0–1 값 |\n| `evidence` | string list | 1–3개의 이미지 근거, 각 1–120자 |\n\n`confidence=0`과 `confidence=1`은 정확한 경계이므로 허용합니다."},{"id":"t5-09","ty":"order","lv":3,"game":false,"p":"parse_scene_result가 검사하는 순서(바깥 → 안)를 맞추세요.","steps":["JSON 문법","최상위가 object인지","정확한 key 집합","허용 label","confidence 숫자·범위","evidence 목록·길이"],"h":"정답 해설은 '바깥에서 안으로' 검증한다고 설명합니다. 문법이 맞는지, 최상위가 object인지, key 집합이 정확한지를 먼저 보고 그다음 label·confidence·evidence 값을 차례로 검사합니다.","w":"JSON 문법 → object 여부 → 정확한 key → 허용 label → confidence → evidence 순으로 검증하고, 성공하면 SceneAssessment를 만듭니다.","an":"05.VLM/04_structured_results · 2절 정답 해설","src":"**바깥에서 안으로 검증:** JSON 문법→object 여부→정확한 key 집합→허용 label→confidence 숫자·유한성·0–1 범위→evidence 목록과 문자열 길이 순서로 검사합니다."},{"id":"t5-10","ty":"multi","lv":3,"game":true,"p":"parse_scene_result가 거부하는 입력을 모두 고르세요.","o":["key가 하나 빠진 JSON","confidence가 NaN","evidence가 빈 목록","confidence가 0인 정상 결과","json 코드펜스로 감싼 정상 JSON"],"a":[0,1,2],"h":"이 단원 parser는 전체 code fence 안의 JSON은 허용하지만 앞뒤 설명, JSON list, 빠지거나 추가된 key, bool confidence, NaN·범위 밖 숫자, 빈 evidence는 거부합니다. confidence 0은 경계값이라 허용됩니다.","w":"빠진 key, NaN, 빈 evidence는 거부합니다. confidence=0은 경계로 허용하고, 05는 전체를 감싼 json code fence도 허용합니다(09의 행동 parser는 거부).","an":"05.VLM/04_structured_results · 2절 TODO","src":"그 밖의 앞뒤 설명, JSON list, 빠진/추가 key, bool confidence, NaN·범위 밖 숫자, 빈 evidence는 거부합니다."}]}]};

  match:'왼쪽 항목을 누른 뒤 짝이 되는 오른쪽 항목을 누르세요. 연결된 항목을 다시 누르면 풀립니다.',

  timeattack:{title:'⚡ 타임어택',desc:'제한시간 안에 풀수록 점수가 커집니다. 시간이 다 되면 오답!',

/* ── 저장소 (실패해도 동작) ─────────────── */
const KEY='qb:'+BANK.id+':v1';
const blank=()=>({name:'',tabs:{},wrong:{},board:[],drafts:{}});  // drafts: 채점 전 탭별 풀던 답
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw));}catch(e){}
try{const u=window.QB&&QB.user();if(!S.name&&u&&u.name)S.name=u.name;}catch(e){}  // 로그인 이름 동기화(사용자가 동작하기 전엔 저장하지 않음)
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const gameUnlocked=()=>Object.keys(S.tabs).length>0;
const allGraded=()=>TABS.every(t=>S.tabs[t.id]);

/* 순위 저장소 — 공유 순위로 바꿀 때 이 객체만 교체 */
// 순위는 같은 조건(게임 모드 + 풀이 시간)끼리만 비교한다. key = 'timeattack:10'
const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};
