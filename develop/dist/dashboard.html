<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대시보드 · 문제은행</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Quiz Bank 디자인 토큰 v3 (3층: Primitive → Semantic → Component)
   다크 팔레트: day07 워크시트(#0b1220 남색 + 앰버·틸 포인트) / 라이트: 같은 구조의 중립 팔레트
   포인트색은 teal 하나(--color-brand). amber는 제목(다크)·경고·하이라이트 보조.
   v2 이름(--bg, --ink 등)은 파일 끝 Alias 블록이 시맨틱으로 연결한다.
   build.py가 이 파일을 엔진 <style> 맨 앞에 그대로 넣는다. */
:root{
  /* ── 1층 Primitive: 원시 값 ── */
  --white:#FFFFFF;--ink-900:#141A26;
  --slate-50:#F5F6F8;--slate-100:#F0F2F5;--slate-200:#E2E6EC;--slate-250:#D5DAE2;--slate-300:#CDD3DC;
  --slate-400:#8A93A4;--slate-500:#64748B;--slate-600:#5A6375;
  --navy-950:#0A0F1C;--navy-900:#0B1220;--navy-850:#0E1628;--navy-800:#111A2E;--navy-700:#16203A;--navy-650:#172239;
  --navy-600:#1F2B45;--navy-500:#2A3A5C;
  --ice-200:#DBE4F0;--steel-400:#8A9BB8;--steel-500:#5E6F8E;
  --teal-900:#123D33;--teal-700:#0B6F66;--teal-600:#0E8C80;--teal-400:#2DD4BF;
  --amber-900:#3A2A0C;--amber-700:#B45309;--amber-650:#D97706;--amber-600:#B7791F;--amber-400:#F5B942;--amber-100:#FEF3C7;
  --gold-600:#B7891F;
  --green-700:#15803D;--green-600:#16A34A;--green-400:#4ADE80;
  --red-650:#DC2626;--red-600:#D23B32;--red-400:#F87171;
  --yellow-500:#EAB308;--yellow-400:#FACC15;
  --violet-600:#7C3AED;--violet-400:#C084FC;
  --pink-700:#C2417A;--pink-400:#F472B6;
  --blue-600:#2563EB;--blue-400:#60A5FA;
  /* 과목 색: 흰 배경·남색 배경 모두 3:1 이상(아이콘·스트라이프용), 테마 공통 */
  --subject-it:#4F7FC0;--subject-korean:#B05A5A;--subject-english:#3F8F6E;
  --subject-science:#8A62B8;--subject-music:#B0762A;--subject-art:#C0508A;

  /* ── 2층 Semantic 고정부 ── */
  --font-sans:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","D2Coding",Consolas,"SF Mono",monospace;
  --fs-base:var(--text-base);--lh:1.55;
  --fs-h1:var(--text-2xl);--fs-h2:var(--text-lg);--fs-q:var(--text-base);--fs-opt:var(--text-base);--fs-btn:var(--text-sm);--fs-btn-pri:var(--text-base);
  --fs-sm:var(--text-sm);--fs-xs:var(--text-sm);--fs-2xs:var(--text-xs);--fs-ox:var(--text-2xl);
  --radius-sm:6px;--radius-control:8px;--radius-card:10px;--radius-lg:12px;--maxw:880px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;
  --ease:cubic-bezier(.2,0,0,1);--dur-fast:120ms;--dur:200ms;

  /* ── 라이트 시맨틱 + 컴포넌트 ── */
  --color-background:var(--slate-50);--color-surface:var(--white);--color-surface-raised:var(--white);--color-surface-muted:var(--slate-100);--color-field:var(--white);
  --color-text:var(--ink-900);--color-text-muted:var(--slate-600);--color-text-faint:var(--slate-400);
  --color-border:var(--slate-200);--color-border-strong:var(--slate-300);
  --color-heading:var(--ink-900);--legacy-title:var(--ink-900);--color-brand:var(--teal-600);--color-brand-text:var(--teal-700);--color-on-brand:var(--white);
  --color-accent:var(--amber-600);--color-success:var(--green-700);--color-warning:var(--amber-700);--color-danger:var(--red-600);
  --color-highlight:var(--amber-100);--color-focus:var(--teal-600);
  --button-bg:var(--white);--button-border:var(--slate-250);--button-text:var(--ink-900);
  --button-primary-bg:var(--ink-900);--button-primary-border:var(--ink-900);--button-primary-text:var(--white);
  --combo:var(--violet-600);--gold:var(--gold-600);
  --ty-mc:var(--teal-600);--ty-multi:var(--violet-600);--ty-ox:var(--slate-500);--ty-match:var(--pink-700);--ty-order:var(--amber-600);--ty-num:var(--blue-600);
  --timer-hi:var(--green-600);--timer-mid:var(--amber-650);--timer-lo:var(--red-650);
  --lv1:var(--green-600);--lv2:var(--yellow-500);--lv3:var(--red-650);
  --shadow:0 1px 2px rgb(16 24 40 / .04);
  color-scheme:light;

  /* ── Alias (v2 이름 → 시맨틱). 엔진 페이지 호환용. 새 코드는 --color-* 사용 ── */
  --font:var(--font-sans);--mono:var(--font-mono);
  --r-sm:var(--radius-sm);--r:var(--radius-control);--r-md:var(--radius-card);--r-lg:var(--radius-lg);
  --bg:var(--color-background);--panel:var(--color-surface);--raised:var(--color-surface-raised);--field:var(--color-field);
  --soft:var(--color-surface-muted);
  --ink:var(--color-text);--muted:var(--color-text-muted);--faint:var(--color-text-faint);
  --line:var(--color-border);--line-2:var(--color-border-strong);
  --title:var(--legacy-title);--link:var(--color-brand);--accent:var(--color-accent);
  --ok:var(--color-success);--bad:var(--color-danger);
  --btn-bg:var(--button-bg);--btn-line:var(--button-border);
  --pri-bg:var(--button-primary-bg);--pri-line:var(--button-primary-border);--pri-ink:var(--button-primary-text);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --color-background:var(--navy-900);--color-surface:var(--navy-800);--color-surface-raised:var(--navy-850);--color-surface-muted:var(--navy-700);--color-field:var(--navy-950);
  --color-text:var(--ice-200);--color-text-muted:var(--steel-400);--color-text-faint:var(--steel-500);
  --color-border:var(--navy-600);--color-border-strong:var(--navy-500);
  --color-heading:var(--color-text);--legacy-title:var(--amber-400);--color-brand:var(--teal-400);--color-brand-text:var(--teal-400);--color-on-brand:var(--navy-900);
  --color-accent:var(--amber-400);--color-success:var(--green-400);--color-warning:var(--amber-400);--color-danger:var(--red-400);
  --color-highlight:var(--amber-900);--color-focus:var(--teal-400);
  --button-bg:var(--navy-650);--button-border:var(--navy-500);--button-text:var(--ice-200);
  --button-primary-bg:var(--teal-900);--button-primary-border:var(--teal-400);--button-primary-text:var(--teal-400);
  --combo:var(--violet-400);--gold:var(--amber-400);
  --ty-mc:var(--teal-400);--ty-multi:var(--violet-400);--ty-ox:var(--steel-400);--ty-match:var(--pink-400);--ty-order:var(--amber-400);--ty-num:var(--blue-400);
  --timer-hi:var(--green-400);--timer-mid:var(--amber-400);--timer-lo:var(--red-400);
  --lv1:var(--green-400);--lv2:var(--yellow-400);--lv3:var(--red-400);
  --shadow:none;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --color-background:var(--navy-900);--color-surface:var(--navy-800);--color-surface-raised:var(--navy-850);--color-surface-muted:var(--navy-700);--color-field:var(--navy-950);
  --color-text:var(--ice-200);--color-text-muted:var(--steel-400);--color-text-faint:var(--steel-500);
  --color-border:var(--navy-600);--color-border-strong:var(--navy-500);
  --color-heading:var(--color-text);--legacy-title:var(--amber-400);--color-brand:var(--teal-400);--color-brand-text:var(--teal-400);--color-on-brand:var(--navy-900);
  --color-accent:var(--amber-400);--color-success:var(--green-400);--color-warning:var(--amber-400);--color-danger:var(--red-400);
  --color-highlight:var(--amber-900);--color-focus:var(--teal-400);
  --button-bg:var(--navy-650);--button-border:var(--navy-500);--button-text:var(--ice-200);
  --button-primary-bg:var(--teal-900);--button-primary-border:var(--teal-400);--button-primary-text:var(--teal-400);
  --combo:var(--violet-400);--gold:var(--amber-400);
  --ty-mc:var(--teal-400);--ty-multi:var(--violet-400);--ty-ox:var(--steel-400);--ty-match:var(--pink-400);--ty-order:var(--amber-400);--ty-num:var(--blue-400);
  --timer-hi:var(--green-400);--timer-mid:var(--amber-400);--timer-lo:var(--red-400);
  --lv1:var(--green-400);--lv2:var(--yellow-400);--lv3:var(--red-400);
  --shadow:none;
  color-scheme:dark;}
/* ── 반응형 표준 3단계 ─────────────────────────────────────────────
   모바일  ≤767px      (기본값 = 이 :root. 1열 · 드로어 메뉴 · 터치 44px)
   태블릿  768~1023px  (@media (min-width:768px)로 덮어씀. 2열 혼합 · 드로어 메뉴 · 터치 40px)
   데스크탑 ≥1024px    (@media (min-width:1024px)로 덮어씀. 풀 레이아웃 · 고정 사이드바)
   모든 페이지의 @media 폭은 767 / 768 / 1023 / 1024 네 값만 쓴다(build.py lint_responsive가 검사).
   글자 크기는 --text-* 9단계로만 지정하고, 기기 단계별 값은 아래에서만 정의한다(rem 기준 16px).
   데스크탑·태블릿 값은 SmartAI-RAG-Tour(app.src.css)와 동일: 태블릿 = Tailwind 기본, 데스크탑 = 약 10% 축소(최소 11px).
   모바일은 본문 단계(xs~xl)를 태블릿과 같게 유지하고(읽기·입력 확대 방지), 큰 제목 단계(3xl~5xl)만 줄인다. */
:root{
  /* 모바일 (기본) */
  --text-xs:.75rem;     /* 12px */
  --text-sm:.875rem;    /* 14px */
  --text-base:1rem;     /* 16px */
  --text-lg:1.125rem;   /* 18px */
  --text-xl:1.25rem;    /* 20px */
  --text-2xl:1.5rem;    /* 24px */
  --text-3xl:1.75rem;   /* 28px */
  --text-4xl:2rem;      /* 32px */
  --text-5xl:2.5rem;    /* 40px */
  --page-pad:16px;      /* 페이지 좌우 여백 */
  --tap:44px;           /* 버튼·입력 최소 높이(터치) */
  --gap-grid:12px;      /* 카드 그리드 간격 */
}
@media (min-width:768px){:root{
  /* 태블릿 */
  --text-3xl:1.875rem;  /* 30px */
  --text-4xl:2.25rem;   /* 36px */
  --text-5xl:3rem;      /* 48px */
  --page-pad:24px;
  --tap:40px;
  --gap-grid:16px;
}}
@media (min-width:1024px){:root{
  /* 데스크탑 */
  --text-xs:.6875rem;   /* 12px -> 11px */
  --text-sm:.8125rem;   /* 14px -> 13px */
  --text-base:.9rem;    /* 16px -> 14.4px */
  --text-lg:1.0125rem;  /* 18px -> 16.2px */
  --text-xl:1.125rem;   /* 20px -> 18px */
  --text-2xl:1.35rem;   /* 24px -> 21.6px */
  --text-3xl:1.6875rem; /* 30px -> 27px */
  --text-4xl:2.025rem;  /* 36px -> 32.4px */
  --text-5xl:2.7rem;    /* 48px -> 43.2px */
  --page-pad:32px;
  --tap:36px;
  --gap-grid:16px;
}}

/* Quiz Bank 공용 컴포넌트 (대시보드·랜딩·로그인용. quiz.html은 포함하지 않음)
   시맨틱/컴포넌트 토큰만 사용. 규칙: 1px 선, 그림자·그라데이션·알약 금지, 숫자에 mono 금지, 모바일 터치 40px 이상. */
*,*::before,*::after{box-sizing:border-box}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.icon{width:1em;height:1em;flex:none;vertical-align:-.125em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}

/* 앱 셸 */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;background:var(--color-background);color:var(--color-text);font-family:var(--font-sans);font-size:var(--fs-base);line-height:var(--lh)}
.app.is-collapsed{grid-template-columns:64px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-3);background:var(--color-surface);border-right:1px solid var(--color-border)}
.sidebar a,.sidebar .nav-item{display:flex;align-items:center;gap:var(--space-3);min-height:40px;padding:0 var(--space-3);border-radius:var(--radius-control);color:var(--color-text-muted);text-decoration:none;font-size:var(--fs-opt);transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.sidebar a:hover{background:var(--color-surface-muted);color:var(--color-text)}
.sidebar a[aria-current="page"],.sidebar a.is-active{background:var(--color-surface-muted);color:var(--color-brand-text);font-weight:600}
.app.is-collapsed .sidebar .label{display:none}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:10;height:52px;display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-4);background:color-mix(in srgb,var(--color-surface) 85%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--color-border)}
.content{max-width:1120px;margin:0 auto;padding:var(--space-5) var(--page-pad)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:36px;padding:0 var(--space-4);border:1px solid var(--button-border);border-radius:var(--radius-control);background:var(--button-bg);color:var(--button-text);font:inherit;font-size:var(--fs-btn-pri);font-weight:600;text-decoration:none;cursor:pointer;transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.btn:hover{border-color:var(--color-brand)}
.btn-sm{height:32px;padding:0 var(--space-3);font-size:var(--fs-btn)}
.btn-lg{height:40px;padding:0 var(--space-5)}
.btn-primary{background:var(--button-primary-bg);border-color:var(--button-primary-border);color:var(--button-primary-text)}
.btn-secondary{background:var(--color-surface-muted)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--color-text-muted)}
.btn-ghost:hover{background:var(--color-surface-muted);border-color:transparent;color:var(--color-text)}
.btn-danger{background:transparent;border-color:var(--color-danger);color:var(--color-danger)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;pointer-events:none}
.btn.is-loading{position:relative;color:transparent;pointer-events:none}
.btn.is-loading::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--color-text-muted);border-top-color:transparent;border-radius:50%;animation:qb-spin .8s linear infinite}
@keyframes qb-spin{to{transform:rotate(360deg)}}

/* 필드 */
.field{display:flex;flex-direction:column;gap:var(--space-1)}
.field label,.label-text{font-size:var(--fs-sm);font-weight:600;color:var(--color-text)}
.field input,.field select,.field textarea{height:40px;padding:0 var(--space-3);border:1px solid var(--color-border-strong);border-radius:var(--radius-control);background:var(--color-field);color:var(--color-text);font:inherit;font-size:var(--fs-opt)}
.field textarea{height:auto;min-height:96px;padding:var(--space-2) var(--space-3)}
.field input::placeholder{color:var(--color-text-faint)}
.field .hint{font-size:var(--fs-xs);color:var(--color-text-muted)}
.field .error{font-size:var(--fs-xs);color:var(--color-danger)}
.field.is-invalid input,.field.is-invalid select,.field.is-invalid textarea{border-color:var(--color-danger)}

/* 표 */
.table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.table th,.table td{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--color-border);text-align:left;vertical-align:middle}
.table th{font-weight:600;color:var(--color-text-muted);background:var(--color-surface-muted)}
.table .num{text-align:right}

/* 배지 (알약 금지) */
.badge{display:inline-flex;align-items:center;gap:var(--space-1);padding:1px var(--space-2);border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-surface-muted);color:var(--color-text-muted);font-size:var(--fs-xs);font-weight:600;line-height:1.5}
.badge-brand{border-color:var(--color-brand);color:var(--color-brand-text)}
.badge-danger{border-color:var(--color-danger);color:var(--color-danger)}

/* 콜아웃 */
.callout{display:flex;gap:var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid var(--color-border);border-left:3px solid var(--color-brand);border-radius:var(--radius-control);background:var(--color-surface);font-size:var(--fs-sm)}
.callout-warning{border-left-color:var(--color-warning);background:var(--color-highlight)}
.callout-danger{border-left-color:var(--color-danger)}

/* 단계 레일 */
.step-rail{display:flex;gap:var(--space-2);margin:0;padding:0;list-style:none;counter-reset:step}
.step-rail>li{flex:1;display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius-control);color:var(--color-text-muted);font-size:var(--fs-sm);counter-increment:step}
.step-rail>li::before{content:counter(step);display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);font-variant-numeric:tabular-nums;font-size:var(--fs-xs)}
.step-rail>li.is-active{border-color:var(--color-brand);color:var(--color-text);font-weight:600}
.step-rail>li.is-active::before{background:var(--color-brand);border-color:var(--color-brand);color:var(--color-on-brand)}

/* 대비 비교(전·후) */
.contrast-pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.contrast-pair>*{padding:var(--space-4);border:1px solid var(--color-border);border-radius:var(--radius-card);background:var(--color-surface)}
.contrast-pair>.is-before{border-color:var(--color-danger)}
.contrast-pair>.is-after{border-color:var(--color-success)}

/* 대체 텍스트 표 (모바일 세로 쌓임) */
.alt-table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.alt-table th,.alt-table td{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--color-border);text-align:left}

/* 탭 */
.tabs{display:flex;gap:var(--space-1);border-bottom:1px solid var(--color-border)}
.tabs [role="tab"]{display:inline-flex;align-items:center;gap:var(--space-2);min-height:40px;padding:0 var(--space-4);border:0;border-bottom:2px solid transparent;background:none;color:var(--color-text-muted);font:inherit;font-size:var(--fs-opt);cursor:pointer}
.tabs [role="tab"]:hover{color:var(--color-text)}
.tabs [role="tab"][aria-selected="true"]{color:var(--color-brand-text);border-bottom-color:var(--color-brand);font-weight:600}
.tabs [role="tab"][aria-disabled="true"],.tabs [role="tab"]:disabled{color:var(--color-text-faint);cursor:not-allowed}

<script>/* QB 공용 코어 — 저장 키, mock 로그인, 테마, 과목 목록. 비밀번호는 저장하지 않는다. */
(function(){
'use strict';
var KEY_USER='qb:user', KEY_UI='qb:ui:v1', KEY_THEME='qb:theme';
function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function del(k){try{localStorage.removeItem(k);}catch(e){}}
function json(k,d){try{var r=get(k);return r?JSON.parse(r):d;}catch(e){return d;}}
var QB=window.QB={};
QB.SUBJECTS=[
  {id:'it',label:'IT'},{id:'korean',label:'국어'},{id:'english',label:'영어'},
  {id:'science',label:'과학'},{id:'music',label:'음악'},{id:'art',label:'미술'}
];
QB.user=function(){var u=json(KEY_USER,null);return u&&u.v===1&&u.name?u:null;};
QB.login=function(o){
  o=o||{};var prev=json(KEY_USER,null),now=new Date().toISOString();
  var u={v:1,name:String(o.name||'').trim().slice(0,20),email:String(o.email||'').trim(),
    provider:o.provider||'email',createdAt:(prev&&prev.createdAt)||now,lastLoginAt:now};
  set(KEY_USER,JSON.stringify(u));return u;
};
QB.logout=function(){del(KEY_USER);};
QB.rename=function(n){
  var u=QB.user();n=String(n||'').trim().slice(0,20);if(!u||!n)return null;
  u.name=n;set(KEY_USER,JSON.stringify(u));return u;
};
QB.safeNext=function(n){
  n=String(n||'');return /^dashboard\.html(#[A-Za-z0-9\/=&_-]*)?$/.test(n)?n:'dashboard.html';
};
QB.requireUser=function(next){
  var u=QB.user();if(u)return u;
  next=QB.safeNext(next==null?'dashboard.html'+location.hash:next);
  location.replace('login.html?next='+encodeURIComponent(next));return null;
};
QB.theme={
  get:function(){return get(KEY_THEME);},
  apply:function(){var t=get(KEY_THEME),r=document.documentElement;if(t)r.dataset.theme=t;else delete r.dataset.theme;},
  toggle:function(){
    var t=get(KEY_THEME),dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    set(KEY_THEME,dark?'light':'dark');QB.theme.apply();
  }
};
QB.ui={
  get:function(){var d=json(KEY_UI,null);return d&&typeof d==='object'?d:{sidebar:true,subject:'it'};},
  set:function(p){var d=Object.assign(QB.ui.get(),p||{});set(KEY_UI,JSON.stringify(d));return d;}
};
QB.theme.apply();
})();
</script>
<script>/* QB 학습 진행 계산 — 모든 은행의 localStorage(qb:<id>:v1)에서 연속 학습일·히트맵·XP·오답을 계산한다.
   읽기 전용. 저장 형식은 quiz.html의 S = {name, tabs:{id:{score,total,at}}, wrong:{id:{n,at,solved}}, board:[{name,score,at,...}]}.
   시각은 모두 Date.now() 밀리초. 날짜는 브라우저 로컬 시간대 기준. */
(function(root){
'use strict';
function pad(n){return n<10?'0'+n:''+n;}
function dayKey(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function sod(t){var d=new Date(t);d.setHours(0,0,0,0);return d;}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function num(v){return typeof v==='number'&&isFinite(v)?v:0;}
function store(o){return (o&&o.storage)||root.localStorage;}
function readBank(o,id){
  try{var r=store(o).getItem('qb:'+id+':v1');if(!r)return null;var s=JSON.parse(r);return s&&typeof s==='object'?s:null;}
  catch(e){return null;}
}
function userName(o){
  if(o&&o.name!=null)return String(o.name).trim();
  try{var u=root.QB&&root.QB.user&&root.QB.user();return u&&u.name?String(u.name).trim():'';}catch(e){return '';}
}
function banksOf(cat,o){
  var out=[];
  ((cat&&cat.stages)||[]).forEach(function(st){(st.courses||[]).forEach(function(c){(c.banks||[]).forEach(function(b){
    if(!o||!o.subject||(b.subject||'it')===o.subject)out.push(b);
  });});});
  return out;
}

var QBP={};
QBP.dayKey=dayKey;
QBP.banks=banksOf;

/* 저장소를 쓸 수 있는지 */
QBP.storageOk=function(o){
  try{var s=store(o),k='qb:__probe';s.setItem(k,'1');s.removeItem(k);return true;}catch(e){return false;}
};

/* 모든 은행을 한 번 읽어 이벤트·은행별 집계·XP 재료를 만든다. */
QBP.snapshot=function(cat,o){
  var name=userName(o),per={},events=[];
  var xpTab=0,xpWrong=0,xpGame=0,gameN=0,avgSum=0,correct=0,total=0;
  banksOf(cat,o).forEach(function(b){
    var s=readBank(o,b.id)||{},p={done:0,tabs:b.tabs||0,correct:0,total:0,open:0,solved:0,lastAt:0};
    var tabs=s.tabs&&typeof s.tabs==='object'?s.tabs:{};
    Object.keys(tabs).forEach(function(tid){
      var r=tabs[tid];if(!r||typeof r!=='object')return;
      p.done++;p.correct+=num(r.score);p.total+=num(r.total);
      if(num(r.at))events.push({at:r.at,bankId:b.id,kind:'tab',tabId:tid,score:num(r.score),total:num(r.total)});
    });
    var wr=s.wrong&&typeof s.wrong==='object'?s.wrong:{};
    Object.keys(wr).forEach(function(qid){
      var w=wr[qid];if(!w||typeof w!=='object')return;
      if(w.solved){p.solved++;if(num(w.at))events.push({at:w.at,bankId:b.id,kind:'wrong-solved',qid:qid});}
      else p.open++;
    });
    (Array.isArray(s.board)?s.board:[]).forEach(function(r){
      if(!r||typeof r!=='object'||!name||String(r.name||'').trim()!==name)return;
      xpGame+=num(r.score)/100;gameN++;avgSum+=num(r.avg);
      if(num(r.at))events.push({at:r.at,bankId:b.id,kind:'game',score:num(r.score),correct:num(r.correct),total:num(r.total),mode:r.mode||''});
    });
    p.pct=p.tabs?Math.round(p.done/p.tabs*100):0;
    xpTab+=p.correct*10;xpWrong+=p.solved*5;correct+=p.correct;total+=p.total;
    per[b.id]=p;
  });
  events.sort(function(a,b){return b.at-a.at;});
  events.forEach(function(e){var p=per[e.bankId];if(p&&e.at>p.lastAt)p.lastAt=e.at;});
  return {per:per,events:events,name:name,correct:correct,total:total,
    xp:{tab:xpTab,wrong:xpWrong,game:Math.round(xpGame),total:Math.round(xpTab+xpWrong+xpGame)},
    gameN:gameN,gameAvg:gameN?Math.round(avgSum/gameN*10)/10:null};
};
/* events(cat): 스냅샷 없이 이벤트 목록만 */
QBP.events=function(cat,o){return QBP.snapshot(cat,o).events;};

/* 합계: 채점한 탭 x/전체, 정답률, 남은 오답 */
QBP.totals=function(snap,cat,o){
  var banks=banksOf(cat,o),done=0,tabs=0,open=0,solved=0;
  banks.forEach(function(b){var p=snap.per[b.id];tabs+=b.tabs||0;if(p){done+=p.done;open+=p.open;solved+=p.solved;}});
  return {doneTabs:done,allTabs:tabs,accuracy:snap.total?Math.round(snap.correct/snap.total*100):null,
    unsolved:open,solved:solved,banks:banks.length,qs:banks.reduce(function(n,b){return n+(b.qs||0);},0)};
};
QBP.xp=function(snap){return snap.xp;};

/* 연속 학습일: 오늘 또는 어제로 끝나는 연속 일수 */
QBP.activeToday=function(events,now){
  var k=dayKey(now==null?Date.now():now);return events.some(function(e){return dayKey(e.at)===k;});
};
QBP.streak=function(events,now){
  var days={};events.forEach(function(e){days[dayKey(e.at)]=1;});
  var d=sod(now==null?Date.now():now);
  if(!days[dayKey(d)])d=addDays(d,-1);
  var n=0;while(days[dayKey(d)]){n++;d=addDays(d,-1);}
  return n;
};

/* 히트맵: 일요일 시작 주 단위, 열 우선(주 × 7). 단계 0~4 (0=없음, 1=1~2, 2=3~5, 3=6~9, 4=10+) */
function level(c){return c<=0?0:c<=2?1:c<=5?2:c<=9?3:4;}
QBP.heatmap=function(events,weeks,now){
  weeks=weeks||16;
  var today=sod(now==null?Date.now():now),count={};
  events.forEach(function(e){var k=dayKey(e.at);count[k]=(count[k]||0)+1;});
  var start=addDays(today,-today.getDay()-(weeks-1)*7),cells=[],active=0,max=0,total=0;
  for(var i=0;i<weeks*7;i++){
    var d=addDays(start,i),k=dayKey(d),future=d.getTime()>today.getTime(),c=future?0:(count[k]||0);
    if(c){active++;total+=c;if(c>max)max=c;}
    cells.push({date:k,count:c,level:level(c),future:future,dow:d.getDay()});
  }
  return {cells:cells,weeks:weeks,activeDays:active,max:max,total:total};
};

/* 최근 활동: 같은 은행·같은 날의 오답 해결은 한 줄로 묶는다 */
QBP.recent=function(events,n){
  var out=[],last=null;
  for(var i=0;i<events.length&&out.length<(n||8);i++){
    var e=events[i];
    if(e.kind==='wrong-solved'&&last&&last.kind==='wrong-solved'&&last.bankId===e.bankId&&dayKey(last.at)===dayKey(e.at)){last.count++;continue;}
    last=Object.assign({},e);if(last.kind==='wrong-solved')last.count=1;out.push(last);
  }
  return out;
};

/* 이어서 풀기: 최근에 푼 은행(전부 채점하지 않은 것) 먼저, 그다음 아직 시작하지 않은 은행을 카탈로그 순서로 */
QBP.continueList=function(cat,n,snap,o){
  snap=snap||QBP.snapshot(cat,o);
  var list=banksOf(cat,o).filter(function(b){var p=snap.per[b.id];return !p||p.done<(b.tabs||0);})
    .map(function(b,i){var p=snap.per[b.id]||{done:0,lastAt:0};return {bank:b,done:p.done,lastAt:p.lastAt||0,i:i};});
  list.sort(function(a,b){return (b.lastAt-a.lastAt)||(a.i-b.i);});
  return list.slice(0,n||3);
};

root.QBP=QBP;
if(typeof module!=='undefined'&&module.exports)module.exports=QBP;
})(typeof window!=='undefined'?window:globalThis);

const subLabel=id=>((CAT.subjects||[]).find(x=>x.id===id)||{}).label||id;

/* ── 데이터 ── */
const stageBanks=st=>st.courses.flatMap(c=>c.banks).filter(b=>allScope||(b.subject||'it')===sub);
let allBanks=[], byId={}, snap=null, tot=null, stageOf={};
function load(){
  allBanks=CAT.stages.flatMap(st=>stageBanks(st).map(b=>{stageOf[b.id]=st;return b;}));
  byId=Object.fromEntries(allBanks.map(b=>[b.id,b]));
  const so=allScope?{}:{subject:sub};
  snap=QBP.snapshot(CAT,Object.assign({name:user().name},so));
  tot=QBP.totals(snap,CAT,so);
}
function stageStat(st){
  const bs=stageBanks(st);let tabs=0,done=0,wrong=0,qs=0;
  bs.forEach(b=>{const p=snap.per[b.id]||{done:0,open:0};tabs+=b.tabs;qs+=b.qs;done+=p.done;wrong+=p.open;});
  return {n:bs.length,tabs,done,wrong,qs,pct:tabs?Math.round(done/tabs*100):0};
}
const dayLabel=t=>{
  const d=new Date(t),k=QBP.dayKey(t),now=Date.now(),hh=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return (k===QBP.dayKey(now)?'오늘':k===QBP.dayKey(now-864e5)?'어제':`${d.getMonth()+1}월 ${d.getDate()}일`)+' '+hh;
};

/* ── 사이드바 ── */
const SG=new Set();  /* 열린 하위 메뉴 그룹: 기본은 모두 닫힘, 라우트가 바뀔 때마다 초기화 */
const stageStatSub=st=>{
  const bs=st.courses.flatMap(c=>c.banks).filter(b=>(b.subject||'it')===sub);let tabs=0,done=0;
  bs.forEach(b=>{const p=snap.per[b.id]||{done:0};tabs+=b.tabs;done+=p.done;});
  return {n:bs.length,pct:tabs?Math.round(done/tabs*100):0};
};
function sideHTML(route){
  const cur=a=>a===route?' aria-current="page"':'';
  const nav=(r,icon,label,href)=>`<a href="${href||h(r)}" data-route="${r}" title="${esc(label)}"${cur(r)}>${ic(icon)}<span class="label">${esc(label)}</span></a>`;
  const grp=(id,icon,label,body,active)=>{const o=SG.has(id);
    return `<button class="grp-btn${active?' has-active':''}" type="button" data-grp="${id}" aria-expanded="${o}" aria-controls="sm-${id}">${ic(icon)}<span class="label">${label}</span>${ic('chevron-right','chev')}</button><div class="submenu" id="sm-${id}"${o?'':' hidden'}>${body}</div>`;};
  const subjects=(CAT.subjects||[]).map(s=>{
    const on=s.ready, act=route==='subject'&&s.id===sub;
    return on?`<a href="${hSub(s.id)}" data-route="subject" title="${esc(s.label)}"${act?' aria-current="page"':''}>${ic(SUBJ_ICON[s.id]||'book')}<span class="label">${esc(s.label)}</span></a>`
      :`<span class="nav-item is-off" aria-disabled="true" title="${esc(s.label)} 준비 중">${ic(SUBJ_ICON[s.id]||'book')}<span class="label">${esc(s.label)} · 준비 중</span></span>`;
  }).join('');
  const courses=CAT.stages.map(st=>{
    const s=stageStatSub(st),t=`${st.num} ${st.title}`;
    return s.n
      ?`<a class="course" href="#${st.num}&s=${sub}" data-route="${st.num}" title="${esc(t)}"${cur(st.num)}><span class="cn">${esc(st.num)}</span><span class="label"><span class="tt">${esc(st.title)}</span><span class="pbar" role="img" aria-label="진행률 ${s.pct}%"><i style="width:${s.pct}%"></i></span></span></a>`
      :`<span class="nav-item course is-off" aria-disabled="true" title="${esc(t)} 준비 중"><span class="cn">${esc(st.num)}</span><span class="label"><span class="tt">${esc(st.title)}</span><span class="tt">준비 중</span></span></span>`;
  }).join('');
  const learn=nav('wrong','alert-circle','남은 오답')+nav('history','history','학습 기록')+nav('upload','upload','문서로 문제 만들기');
  const isStage=CAT.stages.some(s=>s.num===route);
  return `<div class="side-head"><small>디지털노마드연구소</small><b>문제은행</b></div>
  <nav aria-label="주 메뉴">
    ${nav('','home','홈 (전체 대시보드)','#')}
    ${grp('subjects','layers','과목',subjects,route==='subject')}
    ${grp('courses','book',`과정 · ${esc(subLabel(sub))}`,courses,isStage)}
    ${grp('learn','history','학습',learn,['wrong','history','upload'].includes(route))}
  </nav>
  <button class="side-toggle" id="sideToggle" type="button" aria-expanded="${!shell.classList.contains('is-collapsed')}" aria-label="사이드바 접기">${ic('chevrons-left')}<span class="label">접기</span></button>`;
}
function bindSide(){
  side.querySelectorAll('.grp-btn').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.grp, o=b.getAttribute('aria-expanded')!=='true';
    o?SG.add(id):SG.delete(id);
    b.setAttribute('aria-expanded',String(o));
    $('#sm-'+id).hidden=!o;
  }));
  $('#sideToggle').addEventListener('click',()=>{
    const c=shell.classList.toggle('is-collapsed');QB.ui.set({sidebar:!c});
    $('#sideToggle').setAttribute('aria-expanded',String(!c));
  });
}
function navOpen(on,returnFocus){
  shell.classList.toggle('is-nav-open',on);
  $('#navBtn').setAttribute('aria-expanded',String(on));
  $('#navBtn').setAttribute('aria-label',on?'메뉴 닫기':'메뉴 열기');
  if(on){const a=$('#sidebar a');if(a)a.focus();}
  else if(returnFocus)$('#navBtn').focus();
}
$('#navBtn').addEventListener('click',()=>navOpen(!shell.classList.contains('is-nav-open')));
$('#scrim').addEventListener('click',()=>navOpen(false,true));

/* ── 탑바: 테마 · 계정 ── */
const isDark=()=>{const t=QB.theme.get();return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;};
function themeIcon(){$('#themeUse').setAttribute('href',isDark()?'#i-sun':'#i-moon');}
$('#themeBtn').addEventListener('click',()=>{QB.theme.toggle();themeIcon();});
themeIcon();
function acctRender(){
  const u=user();$('#acctName').textContent=u.name;$('#acctB').textContent=u.name;$('#acctE').textContent=u.email||'체험 계정';
  $('#acctBtn').setAttribute('aria-label','계정 메뉴, '+u.name);
}
function acctOpen(on){
  $('#acctPanel').hidden=!on;$('#acctBtn').setAttribute('aria-expanded',String(on));
  if(!on){$('#renameBox').hidden=true;$('#renameBtn').hidden=false;}
}
$('#acctBtn').addEventListener('click',()=>acctOpen($('#acctPanel').hidden));
$('#renameBtn').addEventListener('click',()=>{$('#renameBox').hidden=false;$('#renameBtn').hidden=true;$('#renameErr').textContent='';const i=$('#renameIn');i.value=user().name;i.focus();i.select();});
$('#renameCancel').addEventListener('click',()=>{$('#renameBox').hidden=true;$('#renameBtn').hidden=false;$('#renameBtn').focus();});
function doRename(){
  const v=$('#renameIn').value.trim();
  if(!v){$('#renameErr').textContent='이름을 1자 이상 입력하세요.';$('#renameIn').focus();return;}
  if(!QB.rename(v)){$('#renameErr').textContent='이름을 저장하지 못했습니다. 사이트 데이터 허용 후 다시 시도하세요.';return;}
  acctRender();acctOpen(false);$('#acctBtn').focus();route(true);

$('#renameOk').addEventListener('click',doRename);
$('#renameIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doRename();}});
$('#logoutBtn').addEventListener('click',()=>{QB.logout();location.href='index.html';});
document.addEventListener('click',e=>{if(!$('#acctPanel').hidden&&!e.target.closest('.acct'))acctOpen(false);});

/* ── 명령 팔레트 ── */
const pal={wrap:$('#palWrap'),input:$('#palIn'),list:$('#palList'),stat:$('#palStat'),items:[],idx:0,from:null};
const hay=b=>{const st=stageOf[b.id]||{};return [b.title,b.code,b.subtitle,st.num,st.title,(st.keys||[]).join(' ')].join(' ').toLowerCase();};
function palRender(){
  const terms=pal.input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  pal.items=allBanks.filter(b=>{const t=hay(b);return terms.every(x=>t.indexOf(x)>=0);}).slice(0,30);
  pal.idx=Math.min(pal.idx,Math.max(0,pal.items.length-1));
  pal.list.innerHTML=pal.items.length?pal.items.map((b,i)=>`<li role="option" id="po${i}" data-i="${i}" aria-selected="${i===pal.idx}"><span class="pt">${esc(b.title)}</span><span class="ps">${esc(b.code)} ${esc((stageOf[b.id]||{}).num||'')} ${esc((stageOf[b.id]||{}).title||'')}</span></li>`).join('')
    :'<li class="none" role="presentation">일치하는 문제은행이 없습니다.</li>';
  pal.stat.textContent=pal.items.length?`${pal.items.length}개 결과. 위아래 화살표로 이동하고 Enter로 엽니다.`:'결과 없음';
  pal.input.setAttribute('aria-activedescendant',pal.items.length?'po'+pal.idx:'');
}
function palMove(d){
  if(!pal.items.length)return;pal.idx=(pal.idx+d+pal.items.length)%pal.items.length;
  pal.list.querySelectorAll('li').forEach((li,i)=>li.setAttribute('aria-selected',String(i===pal.idx)));
  pal.input.setAttribute('aria-activedescendant','po'+pal.idx);
  const li=$('#po'+pal.idx);if(li)li.scrollIntoView({block:'nearest'});
}
function palOpen(){
  if(!pal.wrap.hidden)return;
  pal.from=document.activeElement;pal.wrap.hidden=false;shell.inert=true;
  pal.input.value='';pal.idx=0;palRender();pal.input.focus();
}
function palClose(){
  if(pal.wrap.hidden)return;
  pal.wrap.hidden=true;shell.inert=false;
  if(pal.from&&pal.from.focus)pal.from.focus();
}
function palGo(i){const b=pal.items[i];if(b)location.href=b.href;}
$('#palBtn').addEventListener('click',palOpen);
$('#palClose').addEventListener('click',palClose);
pal.wrap.addEventListener('mousedown',e=>{if(e.target===pal.wrap)palClose();});
pal.input.addEventListener('input',()=>{pal.idx=0;palRender();});
pal.list.addEventListener('click',e=>{const li=e.target.closest('li[data-i]');if(li)palGo(+li.dataset.i);});
pal.wrap.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();palMove(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();palMove(-1);}
  else if(e.key==='Enter'&&e.target===pal.input){e.preventDefault();palGo(pal.idx);}
  else if(e.key==='Tab'){e.preventDefault();(document.activeElement===pal.input?$('#palClose'):pal.input).focus();}
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal.wrap.hidden?palOpen():palClose();return;}
  if(e.key!=='Escape')return;
  if(!pal.wrap.hidden){palClose();}
  else if(!$('#acctPanel').hidden){acctOpen(false);$('#acctBtn').focus();}
  else if(shell.classList.contains('is-nav-open')){navOpen(false,true);}
});

/* ── 공통 조각 ── */
function subTabs(active){
  const one=(id,label,icon,on,sel)=>`<button role="tab" type="button" data-subject="${esc(id)}" style="--sc:var(--subject-${esc(id)},var(--color-brand))" aria-selected="${sel}"${on?'':' aria-disabled="true"'} tabindex="${sel?0:-1}">${ic(icon)}${esc(label)}</button>`;
  const subs=one('all','전체','home',true,active==='all')+(CAT.subjects||[]).map(s=>one(s.id,s.label,SUBJ_ICON[s.id]||'book',s.ready,s.ready&&active===s.id)).join('');
  return `<div class="tabs subtabs" role="tablist" aria-label="과목">${subs}</div>`;
}
function bindSubTabs(){
  const tabs=[...view.querySelectorAll('.subtabs [role=tab]')];
  tabs.forEach(t=>{
    t.addEventListener('click',()=>{
      if(t.getAttribute('aria-disabled')==='true'||t.getAttribute('aria-selected')==='true')return;
      const id=t.dataset.subject;
      if(id==='all'){location.hash='';return;}
      QB.ui.set({subject:id});location.hash='subject&s='+id;
    });
    t.addEventListener('keydown',e=>{
      const i=tabs.indexOf(t),n=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;
      if(n){e.preventDefault();const x=tabs[(i+n+tabs.length)%tabs.length];x.tabIndex=0;x.focus();}
    });
  });
}
const bar=pc=>`<span class="pbar" role="img" aria-label="진행률 ${pc}%"><i style="width:${pc}%"></i></span>`;
const foot=()=>`<p class="foot">진행률과 오답은 이 브라우저에만 저장됩니다. 갱신 ${esc(CAT.built)}</p>`;
function actLine(e){
  const b=byId[e.bankId];if(!b)return '';
  const text=e.kind==='tab'?`탭 채점 ${e.score}/${e.total}`:e.kind==='game'?`게임 ${fmt(e.score)}점`:`오답 ${e.count||1}개 해결`;
  const icon=e.kind==='game'?'trophy':'check';
  return `<li><a class="row-link" href="${esc(b.href)}">${ic(icon,'act-ic')}<span class="grow"><span class="rt">${esc(b.title)}</span><span class="rs">${esc(text)}</span></span><span class="when">${esc(dayLabel(e.at))}</span></a></li>`;
}
function blockedHTML(){
  return `<div class="card state" role="alert"><h2>기록을 저장할 수 없습니다</h2><p>이 브라우저는 기록 저장을 막고 있습니다. 사이트 데이터 허용 후 새로고침하세요.</p></div>`;
}

/* ── 홈 ── */
function homeView(){
  const isAll=allScope, slab=subLabel(sub);
  const name=user().name, cl=QBP.continueList(CAT,3,snap,allScope?{}:{subject:sub}), ev=snap.events;
  const streak=QBP.streak(ev), today=QBP.activeToday(ev), hm=QBP.heatmap(ev,16), xp=snap.xp;
  const empty=!ev.length&&!tot.doneTabs&&!tot.unsolved;
  const first=allBanks[0], go=cl[0]?cl[0].bank:first;
  const streakHint=streak===0?'오늘 탭을 하나 채점하면 연속 학습이 시작됩니다.':today?'오늘도 학습했습니다.':`오늘 학습하면 ${streak+1}일이 됩니다.`;
  const sum=`최근 16주 동안 ${hm.activeDays}일 학습했습니다.`+(hm.max?` 하루 최대 활동은 ${hm.max}회입니다.`:'');
  const acc=tot.accuracy==null?'기록 없음':tot.accuracy+'%';
  const accHint=snap.gameAvg!=null?`게임 평균 풀이 ${snap.gameAvg}초`:'채점한 문항 기준';
  const stageRows=CAT.stages.map(st=>{
    const s=stageStat(st);
    return s.n?`<tr data-go="${h(st.num)}"><th scope="row"><a href="${h(st.num)}"><span class="cn">${esc(st.num)}</span>${esc(st.title)}</a></th><td class="num hide-sm">${s.n}</td><td class="num">${s.done}/${s.tabs}</td><td class="num prog-td"><span class="prog">${bar(s.pct)}<span>${s.pct}%</span></span></td><td class="num">${s.wrong?`<span style="color:var(--color-danger)">${s.wrong}</span>`:'0'}</td></tr>`
      :`<tr class="is-off-row"><th scope="row"><span class="cn">${esc(st.num)}</span>${esc(st.title)}</th><td class="num hide-sm">0</td><td class="num" colspan="3">준비 중</td></tr>`;
  }).join('');
  const contHTML=cl.length?`<ul class="list">${cl.map(x=>{const b=x.bank,pc=b.tabs?Math.round(x.done/b.tabs*100):0;
    return `<li><a class="row-link" href="${esc(b.href)}"><span class="grow"><span class="rt">${esc(b.title)}</span><span class="rs">${esc(b.code)} ${x.done}/${b.tabs} 탭</span>${bar(pc)}</span>${ic('chevron-right')}</a></li>`;}).join('')}</ul>`
    :'<p class="hint">모든 문제은행의 탭을 채점했습니다.</p>';
  const recent=QBP.recent(ev,8).map(actLine).join('');
  const subjCards=(CAT.subjects||[]).map(s=>{
    const col=`style="--sc:var(--subject-${esc(s.id)},var(--color-brand))"`, icn=ic(SUBJ_ICON[s.id]||'book');
    if(!s.ready)return `<div class="card bank subj is-off" ${col} aria-disabled="true"><span class="code">${icn}${esc(s.label)}</span><span class="bt">준비 중</span><span class="bs">곧 문제은행이 추가됩니다.</span></div>`;
    const t=QBP.totals(snap,CAT,{subject:s.id}), pc=t.allTabs?Math.round(t.doneTabs/t.allTabs*100):0;
    return `<a class="card card-link bank subj" ${col} href="${hSub(s.id)}"><span class="code">${icn}${esc(s.label)}</span><span class="bt">${esc(s.label)} 대시보드</span>${bar(pc)}
      <span class="meta"><span>문제은행 ${t.banks}</span><span>문항 ${fmt(t.qs)}</span><span>${t.doneTabs}/${t.allTabs} 탭 채점</span>${t.unsolved?`<span class="wn">오답 ${t.unsolved}</span>`:''}</span></a>`;
  }).join('');
  const listSection=isAll
    ?`<section class="c12" aria-labelledby="w5"><h2 class="wt" id="w5">${ic('layers')}과목별 대시보드</h2><div class="banks">${subjCards}</div></section>`
    :`<section class="card c12" aria-labelledby="w5"><h2 class="wt" id="w5">${ic('book')}과정 진행률</h2>
      <table class="table"><caption class="sr-only">과정별 문제은행 수, 채점한 탭, 진행률, 남은 오답</caption>
      <thead><tr><th scope="col">과정</th><th scope="col" class="num hide-sm">문제은행</th><th scope="col" class="num">채점 탭</th><th scope="col" class="num">진행률</th><th scope="col" class="num">오답</th></tr></thead>
      <tbody>${stageRows}</tbody></table></section>`;
  view.innerHTML=`${subTabs(isAll?'all':sub)}
  ${isAll?'':`<nav class="crumbs" aria-label="경로"><a href="#">홈</a>${ic('chevron-right')}<span>${esc(slab)} 대시보드</span></nav>`}
  <div class="page-head">
    <div><h1 class="view-h1" tabindex="-1" id="h1">${isAll?`안녕하세요, ${esc(name)}님`:`${esc(slab)} 대시보드`}</h1>
    <p class="sub">${isAll?`전체 과목 · 문제은행 ${fmt(tot.banks)}개, ${fmt(tot.qs)}문항이 준비되어 있습니다.`:`${esc(slab)} · 문제은행 ${fmt(tot.banks)}개, ${fmt(tot.qs)}문항이 준비되어 있습니다.`}</p></div>
    ${go?`<a class="btn btn-primary btn-lg" href="${esc(go.href)}">${ic('play')}이어서 풀기</a>`:''}
  </div>
  ${empty?`<div class="card empty-card"><p>아직 푼 문제가 없습니다. 01 과정 첫 문제은행부터 시작하세요.</p>${first?`<a class="btn btn-primary" href="${esc(first.href)}">첫 문제은행 열기</a>`:''}</div>`:''}
  <div class="dgrid">
    <section class="card hero c4" aria-labelledby="w1"><h2 class="wt" id="w1">${ic('flame')}연속 학습</h2>
      <p class="big"><b>${streak}</b><span>일</span></p><p class="hint">${esc(streakHint)}</p></section>
    <section class="c8" aria-label="학습 요약"><div class="stats" style="height:100%">
      <div class="card stat"><span class="k">채점한 탭</span><span class="v">${tot.doneTabs}<small>/${tot.allTabs}</small></span></div>
      <div class="card stat"><span class="k">정답률</span><span class="v">${esc(acc)}</span><span class="hint" style="margin:0">${esc(accHint)}</span></div>
      <a class="card card-link stat" href="${h('wrong')}"><span class="k">남은 오답</span><span class="v${tot.unsolved?' is-danger':''}">${tot.unsolved}<small>문항</small></span></a>
    </div></section>
    ${empty?'':`<section class="card c7" aria-labelledby="w3"><h2 class="wt" id="w3">${ic('layers')}최근 16주 학습</h2>
      <div class="heatmap" aria-hidden="true">${hm.cells.map(c=>`<div class="cell${c.future?' is-future':''}" data-l="${c.level}" title="${c.date} 활동 ${c.count}회"></div>`).join('')}</div>
      <p class="sr-only">${esc(sum)}</p>
      <div class="hm-foot"><span>${esc(sum)}</span><span class="legend" aria-hidden="true">적음 ${[0,1,2,3,4].map(l=>`<span class="heatmap-key" data-l="${l}"></span>`).join('')} 많음</span></div></section>
    <section class="card c5" aria-labelledby="w4"><h2 class="wt" id="w4">${ic('play')}이어서 풀기</h2>${contHTML}</section>`}
    ${listSection}
    ${empty?'':`<section class="card c7" aria-labelledby="w6"><h2 class="wt" id="w6">${ic('history')}최근 활동</h2>
      ${recent?`<ul class="list">${recent}</ul><p class="hint"><a href="${h('history')}" style="color:var(--color-brand-text)">전체 기록 보기</a></p>`:'<p class="hint">아직 활동 기록이 없습니다.</p>'}</section>`}
    <section class="card ${empty?'c12':'c5'}" aria-labelledby="w7"><h2 class="wt" id="w7">${ic('trophy')}경험치</h2>
      <p class="xp"><b>${fmt(xp.total)}</b><span class="hint" style="margin:0">XP</span></p>
      <details class="xpd"><summary>계산식 보기</summary>
        <p>XP = 채점한 탭의 정답 수 × 10 + 해결한 오답 × 5 + 게임 점수 ÷ 100</p>
        <table class="table"><thead><tr><th scope="col">항목</th><th scope="col" class="num">XP</th></tr></thead><tbody>
          <tr><th scope="row">탭 정답 ${fmt(snap.correct)}개 × 10</th><td class="num">${fmt(xp.tab)}</td></tr>
          <tr><th scope="row">해결한 오답 ${fmt(tot.solved)}개 × 5</th><td class="num">${fmt(xp.wrong)}</td></tr>
          <tr><th scope="row">게임 점수 ÷ 100</th><td class="num">${fmt(xp.game)}</td></tr></tbody></table>
        <p class="hint">게임 점수는 지금 이름(${esc(name)})과 같은 기록만 더합니다.</p></details></section>
    <section class="card up-card c12" aria-labelledby="w8">${ic('upload')}
      <div class="grow"><h2 id="w8">문서로 문제 만들기 <span class="badge badge-brand">데모 · 준비 중</span></h2>
        <p class="hint">PDF 강의자료를 문제은행으로 바꾸는 흐름을 미리 볼 수 있습니다.</p></div>
      <a class="btn" href="${h('upload')}">데모 열기</a></section>
  </div>${foot()}`;
}

/* ── 과정 보기 ── */
function stageView(st){
  const s=stageStat(st);
  const card=b=>{const p=snap.per[b.id]||{done:0,open:0},pc=b.tabs?Math.round(p.done/b.tabs*100):0;
    return `<a class="card card-link bank${b.tabs&&p.done===b.tabs?' is-done':''}" href="${esc(b.href)}"><span class="code">${esc(b.code)}</span><span class="bt">${esc(b.title)}</span>${b.subtitle?`<span class="bs">${esc(b.subtitle)}</span>`:''}${bar(pc)}
      <span class="meta"><span>문항 ${b.qs}</span><span>탭 ${b.tabs}</span><span>${p.done?`${p.done}/${b.tabs} 탭 채점`:'미응시'}</span>${p.open?`<span class="wn">오답 ${p.open}</span>`:''}</span></a>`;};
  view.innerHTML=`${subTabs(sub)}
  <nav class="crumbs" aria-label="경로"><a href="#">홈</a>${ic('chevron-right')}<a href="${hSub(sub)}">${esc(subLabel(sub))}</a>${ic('chevron-right')}<span>${esc(st.num)} ${esc(st.title)}</span></nav>
  <div class="stage-h"><span class="cn">${esc(st.num)}</span><h1 class="view-h1" tabindex="-1" id="h1">${esc(st.title)}</h1></div>
  <p class="sub">문제은행 ${s.n}개, ${fmt(s.qs)}문항, 채점한 탭 ${s.done}/${s.tabs}</p>
  ${(st.keys||[]).length?`<div class="keys">${st.keys.map(k=>`<span class="badge">${esc(k)}</span>`).join('')}</div>`:''}
  ${st.courses.map(c=>{const bs=c.banks.filter(b=>allScope||(b.subject||'it')===sub);
    return `<section>${st.courses.length>1?`<h2 class="course-h">${esc(c.title)}</h2>`:'<div style="height:var(--space-5)"></div>'}
    ${bs.length?`<div class="banks">${bs.map(card).join('')}</div>`:'<p class="hint">준비 중</p>'}</section>`;}).join('')}
  ${foot()}`;
}

/* ── 남은 오답 ── */
function wrongView(){
  const groups=allBanks.map(b=>({b,p:snap.per[b.id]})).filter(x=>x.p&&x.p.open>0).sort((a,c)=>c.p.open-a.p.open);
  view.innerHTML=`<h1 class="view-h1" tabindex="-1" id="h1">남은 오답</h1>
  <p class="sub">${tot.unsolved?`${fmt(tot.unsolved)}문항이 남아 있습니다. 문제은행을 열어 오답 노트에서 다시 풀어 보세요.`:'남은 오답이 없습니다.'}</p>
  <div style="height:var(--space-5)"></div>
  ${groups.map(({b,p})=>`<div class="wgroup"><a class="card card-link" href="${esc(b.href)}#notes"><span><span class="rt" style="white-space:normal">${esc(b.title)}</span><span class="rs">${esc(b.code)}</span></span><span class="badge badge-danger">오답 ${p.open}</span></a></div>`).join('')}
  ${groups.length?'':`<div class="card empty-card"><p>남은 오답이 없습니다. 다른 문제은행도 풀어 보세요.</p>${allBanks[0]?`<a class="btn" href="${esc(allBanks[0].href)}">문제은행 열기</a>`:''}</div>`}`;
}

/* ── 학습 기록 ── */
function historyView(){
  const list=QBP.recent(snap.events,200).map(actLine).join('');
  view.innerHTML=`<h1 class="view-h1" tabindex="-1" id="h1">학습 기록</h1>
  <p class="sub">탭 채점, 오답 해결, 게임 기록을 최근 순서로 보여줍니다.</p>
  <div style="height:var(--space-5)"></div>
  <section class="card" aria-label="활동 목록">${list?`<ul class="list">${list}</ul>`:'<p class="hint">아직 활동 기록이 없습니다. 문제은행에서 탭을 채점하면 여기에 쌓입니다.</p>'}</section>`;
}

/* ── 문서로 문제 만들기 (데모) ── */
const STEPS=['업로드','OCR(글·그림 읽기)','분석','출제','검수'], STEP_MS=1500;
let teardown=null;
function uploadView(){
  const sample=allBanks[0]||null;
  view.innerHTML=`<h1 class="view-h1" tabindex="-1" id="h1">문서로 문제 만들기</h1>
  <div class="demo-line"><span class="badge badge-brand">데모 · 준비 중</span><span class="sub" style="margin:0">실제 업로드·자동 출제는 아직 지원하지 않습니다.</span></div>
  <div class="drop" id="drop">${ic('upload')}
    <p>PDF 파일을 여기에 끌어다 놓거나 파일을 선택하세요.</p>
    <input class="sr-only" type="file" id="pdf" accept=".pdf"><label class="btn" for="pdf">PDF 선택</label>
    <p class="hint" style="margin:0">파일 내용은 읽지 않고 이름과 크기만 표시합니다.</p></div>
  <p class="error" id="upErr" role="alert" style="color:var(--color-danger);font-size:var(--fs-sm);margin-top:var(--space-2)"></p>
  <div id="upRun" hidden>
    <p class="file-line">${ic('file-text')}<b id="upName"></b><span id="upSize"></span></p>
    <div class="prog-wrap"><div class="track" role="progressbar" aria-label="데모 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="upTrack"><i id="upFill" style="width:0"></i></div></div>
    <ol class="step-rail" id="upSteps" style="margin-top:var(--space-4)"></ol>
    <p class="sr-only" id="upLive" aria-live="polite"></p>
    <div class="up-result" id="upDone" hidden>
      <div class="callout"><p>데모 처리가 끝났습니다. 실제 문제는 만들어지지 않았고, 아래 샘플 문제은행은 이미 만들어 둔 것입니다.</p></div>
      ${sample?`<a class="btn btn-primary" href="${esc(sample.href)}">샘플 문제은행 열기</a>`:''}
      <button class="btn" id="upAgain" type="button" style="margin-top:var(--space-3)">다른 파일로 다시 해 보기</button></div>
  </div>`;
  const drop=$('#drop'), inp=$('#pdf'), err=$('#upErr'), runBox=$('#upRun'), stepsEl=$('#upSteps'), fill=$('#upFill'), track=$('#upTrack'), live=$('#upLive'), done=$('#upDone');
  let timer=null;
  const stop=()=>{if(timer){clearInterval(timer);timer=null;}};
  teardown=stop;
  const sizeText=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
  const paint=(idx,finished)=>{
    stepsEl.innerHTML=STEPS.map((s,i)=>{const d=finished||i<idx;return `<li class="${d?'is-done':i===idx?'is-active':''}"${i===idx&&!finished?' aria-current="step"':''}>${esc(s)}${d?'<span class="sr-only"> 완료</span>':''}</li>`;}).join('');
  };
  const setPct=p=>{fill.style.width=p+'%';track.setAttribute('aria-valuenow',String(Math.round(p)));};
  function finish(){stop();paint(STEPS.length,true);setPct(100);live.textContent='데모 처리가 끝났습니다.';done.hidden=false;const a=done.querySelector('a,button');if(a)a.focus({preventScroll:false});}
  function start(file){
    err.textContent='';
    if(!/\.pdf$/i.test(file.name)){err.textContent='PDF 파일(.pdf)만 선택할 수 있습니다. 파일 형식을 확인하고 다시 선택하세요.';return;}
    stop();done.hidden=true;runBox.hidden=false;
    $('#upName').textContent=file.name;$('#upSize').textContent=sizeText(file.size);
    if(reduce()){finish();return;}
    let t0=Date.now(),last=-1;
    const tick=()=>{
      const el=Date.now()-t0,idx=Math.min(STEPS.length-1,Math.floor(el/STEP_MS));
      if(el>=STEP_MS*STEPS.length){finish();return;}
      setPct(el/(STEP_MS*STEPS.length)*100);
      if(idx!==last){last=idx;paint(idx,false);live.textContent=`${STEPS[idx]} 단계 진행 중`;}
    };
    tick();timer=setInterval(tick,100);
  }
  inp.addEventListener('change',()=>{if(inp.files&&inp.files[0])start(inp.files[0]);inp.value='';});
  ['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('is-over');}));
  ['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('is-over');}));
  drop.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)start(f);});
  $('#upAgain').addEventListener('click',()=>{stop();runBox.hidden=true;err.textContent='';inp.focus();});
}

/* ── 라우팅 ── */
const TITLES={'':'홈',subject:'과목 대시보드',wrong:'남은 오답',history:'학습 기록',upload:'문서로 문제 만들기'};
function route(keepScroll){
  if(teardown){teardown();teardown=null;}
  const hs=parseHash();allScope=false;pickSubject(hs.s);
  const st=CAT.stages.find(s=>s.num===hs.r&&stageBanks(s).length);
  const r=st?st.num:(hs.r in TITLES?hs.r:'');
  allScope=!st&&r!=='subject';   /* 홈·오답·기록·업로드는 전체 과목, 과목 대시보드·과정은 선택한 과목 */
  load();
  SG.clear();
  if(st)SG.add('courses');else if(r==='subject')SG.add('subjects');else if(r==='wrong'||r==='history'||r==='upload')SG.add('learn');
  const title=st?`${st.num} ${st.title}`:r==='subject'?`${subLabel(sub)} 대시보드`:r===''?'전체 대시보드':TITLES[r];
  $('#pageTitle').textContent=title;
  document.title=`${title} · 문제은행`;
  side.innerHTML=sideHTML(r);bindSide();
  const storageOk=QBP.storageOk();
  if(r==='upload')uploadView();
  else if(st)stageView(st);
  else if(!storageOk)view.innerHTML=subTabs(allScope?'all':sub)+blockedHTML();
  else if(r==='wrong')wrongView();
  else if(r==='history')historyView();
  else homeView();   /* r==='' 전체, r==='subject' 과목 */
  bindSubTabs();
  view.querySelectorAll('tr[data-go]').forEach(tr=>tr.addEventListener('click',e=>{if(!e.target.closest('a'))location.hash=tr.dataset.go.slice(1);}));
  navOpen(false,false);
  if(!keepScroll){window.scrollTo(0,0);const h1=$('#h1');if(h1&&route.n++)h1.focus({preventScroll:true});}
}
route.n=0;
shell.classList.toggle('is-collapsed',QB.ui.get().sidebar===false);
acctRender();
addEventListener('hashchange',()=>route(false));
route(false);
})();
</script>
</body>
</html>
