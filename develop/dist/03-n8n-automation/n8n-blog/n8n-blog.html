<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>n8n 블로그 자동 발행 · 패션 블로그 자동화 4시간 · 문제은행</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Quiz Bank 디자인 토큰 v2
   타이포 기준: AI_Voice day07 워크시트 (본문 15px / 행간 1.55, 요소 13~14px)
   다크 팔레트: day07 워크시트(#0b1220 남색 + 앰버·틸 포인트) / 라이트: 같은 구조의 중립 팔레트
   build.py가 이 파일을 엔진 <style> 맨 앞에 그대로 넣는다. */
:root{
  /* 타이포 */
  --font:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","D2Coding",Consolas,"SF Mono",monospace;
  --fs-base:15px;--lh:1.55;
  --fs-h1:24px;--fs-h2:17px;--fs-q:15px;--fs-opt:14px;--fs-btn:13px;--fs-btn-pri:14px;
  --fs-sm:13px;--fs-xs:12px;--fs-2xs:11px;--fs-ox:22px;
  /* 형태 */
  --r-sm:6px;--r:8px;--r-md:10px;--r-lg:12px;--maxw:880px;

  /* 라이트 */
  --bg:#F5F6F8;--panel:#FFFFFF;--raised:#FFFFFF;--field:#FFFFFF;
  --ink:#141A26;--muted:#5A6375;--faint:#8A93A4;--line:#E2E6EC;--line-2:#CDD3DC;--soft:#F0F2F5;
  --title:#141A26;--link:#0E8C80;--accent:#B7791F;
  --ok:#15803D;--bad:#D23B32;--combo:#7C3AED;--gold:#B7891F;
  --btn-bg:#FFFFFF;--btn-line:#D5DAE2;--pri-bg:#141A26;--pri-line:#141A26;--pri-ink:#FFFFFF;
  --ty-mc:#0E8C80;--ty-multi:#7C3AED;--ty-ox:#64748B;--ty-match:#C2417A;--ty-order:#B7791F;--ty-num:#2563EB;
  --timer-hi:#16A34A;--timer-mid:#D97706;--timer-lo:#DC2626;
  --lv1:#16A34A;--lv2:#EAB308;--lv3:#DC2626;  /* 난이도 1·2·3 */
  --shadow:0 1px 2px rgb(16 24 40 / .04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220;--panel:#111A2E;--raised:#0E1628;--field:#0A0F1C;
  --ink:#DBE4F0;--muted:#8A9BB8;--faint:#5E6F8E;--line:#1F2B45;--line-2:#2A3A5C;--soft:#16203A;
  --title:#F5B942;--link:#2DD4BF;--accent:#F5B942;
  --ok:#4ADE80;--bad:#F87171;--combo:#C084FC;--gold:#F5B942;
  --btn-bg:#172239;--btn-line:#2A3A5C;--pri-bg:#123D33;--pri-line:#2DD4BF;--pri-ink:#2DD4BF;
  --ty-mc:#2DD4BF;--ty-multi:#C084FC;--ty-ox:#8A9BB8;--ty-match:#F472B6;--ty-order:#F5B942;--ty-num:#60A5FA;
  --timer-hi:#4ADE80;--timer-mid:#F5B942;--timer-lo:#F87171;
  --lv1:#4ADE80;--lv2:#FACC15;--lv3:#F87171;
  --shadow:none;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1220;--panel:#111A2E;--raised:#0E1628;--field:#0A0F1C;
  --ink:#DBE4F0;--muted:#8A9BB8;--faint:#5E6F8E;--line:#1F2B45;--line-2:#2A3A5C;--soft:#16203A;
  --title:#F5B942;--link:#2DD4BF;--accent:#F5B942;
  --ok:#4ADE80;--bad:#F87171;--combo:#C084FC;--gold:#F5B942;
  --btn-bg:#172239;--btn-line:#2A3A5C;--pri-bg:#123D33;--pri-line:#2DD4BF;--pri-ink:#2DD4BF;
  --ty-mc:#2DD4BF;--ty-multi:#C084FC;--ty-ox:#8A9BB8;--ty-match:#F472B6;--ty-order:#F5B942;--ty-num:#60A5FA;
  --timer-hi:#4ADE80;--timer-mid:#F5B942;--timer-lo:#F87171;
  --lv1:#4ADE80;--lv2:#FACC15;--lv3:#F87171;
  --shadow:none;
  color-scheme:dark;}
@media (max-width:560px){:root{--fs-base:14.5px;--fs-h1:20px;--fs-h2:16px;--fs-q:14.5px;--fs-ox:20px}}

/* ── 기본 ───────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:110px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-base);line-height:var(--lh);
  -webkit-font-smoothing:antialiased;letter-spacing:-.003em;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
b,strong{font-weight:650}
code{font-family:var(--mono);font-size:.88em;color:var(--link);background:var(--soft);padding:1px 5px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px 56px}
.muted{color:var(--muted)}
/* 상단 바 */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:calc(52px + env(safe-area-inset-top,0px));margin:0 -20px 22px;padding:env(safe-area-inset-top,0px) 20px 0;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.brand{font-size:var(--fs-xs);color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;letter-spacing:.01em}
.brand b{color:var(--ink);font-weight:600}
.iconbtn{font:inherit;font-size:14px;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);width:32px;height:32px;border-radius:var(--r);cursor:pointer;flex:0 0 auto;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--muted)}
/* 제목 */
h1{font-size:var(--fs-h1);line-height:1.3;margin:0 0 6px;letter-spacing:-.02em;font-weight:700;color:var(--title)}
h2{font-size:var(--fs-h2);line-height:1.4;margin:0;font-weight:650;letter-spacing:-.01em}
.ph{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 10px;letter-spacing:0}
.sh{font-size:var(--fs-sm);color:var(--muted);font-weight:600;margin:16px 0 6px}
.sub{color:var(--muted);margin:0 0 4px}
.meta{font-size:var(--fs-xs);color:var(--faint);margin:0 0 18px;font-family:var(--mono);letter-spacing:-.01em}
.crumbs{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:var(--fs-sm);color:var(--faint)}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink)}
.part{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--link);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:1px 7px;white-space:nowrap;max-width:100%;font-weight:500;letter-spacing:0}
.tabhead .part,.ngroup .part{white-space:normal;overflow-wrap:anywhere}  /* 긴 자료 위치(예: voice-ai 교시 라벨)는 줄바꿈 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.center{text-align:center}
.note-sm{font-size:var(--fs-sm);color:var(--muted)}
.lbl{display:block;font-size:var(--fs-xs);color:var(--muted);margin-bottom:2px}
/* 버튼 */
.btn{font:inherit;font-size:var(--fs-btn);display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);
  padding:7px 12px;border-radius:var(--r);cursor:pointer;text-decoration:none;min-height:34px;line-height:1.3;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pri-bg);color:var(--pri-ink);border-color:var(--pri-line);font-weight:650;font-size:var(--fs-btn-pri);padding:8px 18px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.locked{opacity:.5}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--btn-line))}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn .cnt{font-family:var(--mono);font-size:var(--fs-2xs);background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;min-width:18px;line-height:16px;text-align:center}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
button:focus-visible,a:focus-visible,input:focus-visible,.opt:focus-within{outline:2px solid var(--link);outline-offset:2px}
/* 입력 */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;max-width:300px}
.field label{font-size:var(--fs-xs);color:var(--muted)}
.field input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--field);color:var(--ink)}
.field input::placeholder{color:var(--faint)}
/* 진행 바 */
.bar{flex:1;height:4px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--link);transition:width .25s}
.progress{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:8px 0;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.progress span,.homeprog span{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.homeprog{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
/* 홈 탭 카드 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:6px}
.tcard{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;text-decoration:none;color:var(--ink);transition:border-color .15s;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--line-2)}
.tcard .tn{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint)}
.tcard .tt{font-weight:600;font-size:14px;line-height:1.45}
.tcard .ts{margin-top:auto;padding-top:8px;font-size:var(--fs-xs);color:var(--faint);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono)}
.tcard.done .ts b{color:var(--ok);font-weight:600}
.tcard.perfect{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.lockmsg{font-size:var(--fs-xs);color:var(--faint);margin:-6px 0 16px}
/* 탭 바 */
/* 학습 탭 선택: 웹(≥1024) 자유 배치 · 태블릿(560~1023) 3개 · 모바일(<560) 2개 */
.tabbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
@media (max-width:1023px){.tabbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}}
.tabchip{min-width:0;display:flex;align-items:center;gap:6px;font-size:var(--fs-btn);padding:6px 10px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);text-decoration:none;color:var(--ink);line-height:1.35;word-break:keep-all}
.tabchip .tl{min-width:0}
.tabchip .qc{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--muted);white-space:nowrap;margin-left:auto}
.tabchip[aria-selected="true"] .qc{color:var(--link)}
.tabchip .sc{white-space:nowrap}
.btn .qc{font-family:var(--mono);font-weight:500;opacity:.85}
.tabchip b{font-family:var(--mono);font-weight:600;color:var(--faint)}
.tabchip:hover{border-color:var(--muted)}
.tabchip[aria-selected="true"]{border-color:var(--link);color:var(--link);background:color-mix(in srgb,var(--link) 9%,var(--btn-bg))}
.tabchip[aria-selected="true"] b{color:var(--link)}
.tabchip .sc{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--ok)}
.tabchip.sum{border-color:color-mix(in srgb,var(--gold) 60%,var(--btn-line));color:var(--gold)}
.tabhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 2px}
.tabhead h2{color:var(--title)}
/* 문항 카드 */
.q{background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:var(--r-md);padding:12px 14px;margin:0 0 10px;box-shadow:var(--shadow)}
.q.correct{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));border-left-color:var(--ok)}
.q.wrong{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));border-left-color:var(--bad)}
.qhead{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.qn{font-family:var(--mono);font-size:var(--fs-xs);color:var(--faint);font-weight:500}
.tbadge{font-size:var(--fs-2xs);font-weight:600;padding:0 7px;line-height:18px;border-radius:var(--r-sm);color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent);background:color-mix(in srgb,var(--tc) 8%,transparent);white-space:nowrap}
/* 난이도: 점 1 녹색 · 점 2 노랑 · 점 3 빨강 (쉬움 ●○○ / 보통 ●●○ / 어려움 ●●●) + 글자 */
.lv{display:inline-flex;align-items:center;gap:4px;line-height:1}
.lv .dots{font-size:9px;letter-spacing:1px}
.lv i{font-style:normal}
.lv .d1{color:var(--lv1)} .lv .d2{color:var(--lv2)} .lv .d3{color:var(--lv3)} .lv .off{color:var(--line-2)}
.lv em{font-style:normal;font-size:var(--fs-2xs);font-weight:600}
.lv1 em{color:var(--lv1)} .lv2 em{color:color-mix(in srgb,var(--lv2) 80%,var(--ink))} .lv3 em{color:var(--lv3)}
.verdict{margin-left:auto;font-weight:650;font-size:var(--fs-xs)}
.correct .verdict{color:var(--ok)} .wrong .verdict{color:var(--bad)}
.qsrc{margin-left:auto;font-size:var(--fs-2xs);color:var(--faint)}
.qt{font-size:var(--fs-q);font-weight:500;margin:4px 0 8px}
.guide{font-size:var(--fs-xs);color:var(--faint);margin:-4px 0 8px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--panel);font-size:var(--fs-opt);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--line-2)}
.opt input{margin:4px 0 0;accent-color:var(--link);flex:0 0 auto;width:14px;height:14px}
.opt:has(input:checked){border-color:var(--link);background:color-mix(in srgb,var(--link) 7%,var(--panel))}
.opt.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.opt.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--panel))}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:360px}
.ox button{font:inherit;font-size:var(--fs-ox);font-weight:700;padding:8px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);cursor:pointer;line-height:1.3}
.ox button:hover{border-color:var(--muted)}
.ox button[aria-pressed="true"]{border-color:var(--link);color:var(--link);background:color-mix(in srgb,var(--link) 10%,var(--btn-bg))}
.ox button.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--btn-bg));color:var(--ok)}
.ox button.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--btn-bg));color:var(--bad)}
/* 짝 맞추기 */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px 14px}
.mcol{display:flex;flex-direction:column;gap:6px}
.mitem{font:inherit;font-size:var(--fs-opt);text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);padding:7px 10px;cursor:pointer;min-height:38px;display:flex;align-items:center;gap:8px;line-height:1.45}
.mitem:hover{border-color:var(--line-2)}
.mitem .tag{flex:0 0 auto;width:20px;height:20px;border-radius:var(--r-sm);border:1px dashed var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);font-weight:600}
.mitem.linked{border-color:color-mix(in srgb,var(--pc) 70%,var(--line))}
.mitem.linked .tag{border:0;background:var(--pc);color:var(--bg)}
.mitem.sel{border-color:var(--link);box-shadow:0 0 0 3px color-mix(in srgb,var(--link) 18%,transparent)}
.mitem.okm{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.mitem.nom{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.mleft .mitem{font-weight:600}
/* 순서 */
.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.oitem{font:inherit;font-size:var(--fs-opt);text-align:left;width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);cursor:pointer;transition:border-color .12s,background .12s}
.oitem:hover{border-color:var(--line-2)}
.oitem .num{width:22px;height:22px;border-radius:50%;border:1px dashed var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);font-weight:600;color:var(--muted);flex:0 0 auto}
.oitem.on{border-color:var(--link);background:color-mix(in srgb,var(--link) 7%,var(--panel))}
.oitem.on .num{border:0;background:var(--link);color:var(--bg)}
.oitem .txt{flex:1;line-height:1.45}
.oitem .ofix{flex:0 0 auto;font-size:var(--fs-2xs);color:var(--ok);font-weight:600}
.oitem.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.oitem.ok .num{background:var(--ok)}
.oitem.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.oitem.no.on .num{background:var(--bad)}
.numrow{display:flex;align-items:center;gap:8px;font-size:var(--fs-opt)}
.numrow input{font-family:var(--mono);font-size:14px;width:120px;padding:6px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--field);color:var(--ink);text-align:right}
.numrow input.ans{border-color:var(--ok)} .numrow input.miss{border-color:var(--bad)}
.locked .mitem,.locked .ox button,.locked .opt{pointer-events:none}
.locked .oitem{pointer-events:none}
.opt .onum{flex:0 0 auto;min-width:18px;height:18px;padding:0 4px;border-radius:var(--r-sm);border:1px solid var(--line-2);display:inline-grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);color:var(--muted);margin-top:1px}
.opt:has(input:checked) .onum{border-color:var(--link);color:var(--link)}
.opt.ans .onum{border-color:var(--ok);color:var(--ok)} .opt.miss .onum{border-color:var(--bad);color:var(--bad)}
/* 힌트 토글 (빨간색 = Hint) */
.hintwrap{margin:-2px 0 8px}
.hintbtn{font:inherit;font-size:var(--fs-xs);font-weight:650;display:inline-flex;align-items:center;gap:4px;color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:var(--r-sm);padding:2px 9px;cursor:pointer;line-height:1.5}
.hintbtn:hover{background:color-mix(in srgb,var(--bad) 13%,transparent)}
.hintbtn .caret{font-size:.85em}
.srcwrap{margin-top:8px}
.srcbtn{font:inherit;font-size:var(--fs-xs);font-weight:600;display:inline-flex;align-items:center;gap:4px;color:var(--link);background:transparent;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:1px 8px;cursor:pointer;line-height:1.5}
.srcbtn:hover{border-color:var(--link)}
.src{margin:6px 0 0;padding:6px 10px;border-left:3px solid var(--link);background:var(--soft);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:var(--fs-xs);color:var(--muted)}
.src p{margin:0;white-space:pre-wrap;word-break:break-word}
.src cite{display:block;margin-top:4px;font-style:normal;font-size:var(--fs-2xs);color:var(--faint)}
.hint{margin-top:6px;padding:6px 10px;border-left:3px solid var(--bad);background:color-mix(in srgb,var(--bad) 6%,transparent);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:var(--fs-sm);color:var(--ink)}
/* 해설 */
.exp{margin-top:10px;padding:2px 0 2px 10px;border-left:3px solid var(--line-2);font-size:var(--fs-sm);color:var(--muted)}
.correct .exp{border-left-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.wrong .exp{border-left-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.exp p{margin:0 0 3px}
.exp b{color:var(--ink);font-weight:650;margin-right:4px}
.an{font-family:var(--mono);color:var(--link);font-size:var(--fs-xs);margin:4px 0 0}
.mine{color:var(--bad)}
.onlywrong .q.correct{display:none}
.warn{color:var(--bad);font-size:var(--fs-sm);min-height:1.3em;margin:4px 0 0}
/* 결과 */
.score{font-family:var(--mono);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--title);letter-spacing:-.02em}
.score small{font-family:var(--font);font-size:14px;color:var(--muted);font-weight:400;letter-spacing:0}
.score.xl{font-size:44px}
.msg{margin:6px 0 10px;color:var(--muted);font-size:var(--fs-sm)}
.bd{display:grid;gap:7px;margin:6px 0}
.bd div{display:grid;grid-template-columns:minmax(90px,190px) 1fr 44px;gap:10px;align-items:center;font-size:var(--fs-sm)}
.bd .b{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bd .b i{display:block;height:100%;background:var(--tc,var(--link));border-radius:99px}
.bd span:last-child{text-align:right;font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted)}
.rcode{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.06em;color:var(--accent);background:var(--soft);padding:2px 8px;border-radius:var(--r-sm)}
/* 오답노트 · 해설지 */
.ngroup{margin:18px 0 8px;font-size:14px;font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ngroup .ref{font-family:var(--mono);font-size:var(--fs-2xs);font-weight:400;color:var(--faint)}
.note{background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px}
.note.solved{border-left-color:var(--ok)}
.note .qt{margin:0 0 8px}
.note dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:var(--fs-sm)}
.note dt{color:var(--faint)}
.note dd{margin:0}
.note .foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:var(--fs-xs);color:var(--faint);font-family:var(--mono)}
.note .foot span:first-child{color:var(--link)}
details.more{margin-top:14px;font-size:var(--fs-sm)}
details.more summary{cursor:pointer;color:var(--muted);padding:4px 0}
.keyitem{padding:10px 0;border-bottom:1px solid var(--line)}
.keyitem .kq{font-weight:500;font-size:14px}
.keyitem .ka{margin:4px 0 2px;color:var(--ok);font-weight:600;font-size:var(--fs-sm)}
.keyitem .kw{font-size:var(--fs-sm);color:var(--muted);margin:0}
.keylock{padding:12px;border:1px dashed var(--line-2);border-radius:var(--r-md);color:var(--faint);text-align:center;margin:8px 0;font-size:var(--fs-sm)}
.printhead{display:none}
/* 게임 */
.game{max-width:620px;margin:0 auto}
.gpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;gap:4px;min-height:120px;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);color:var(--ink);text-decoration:none;transition:border-color .15s,background .15s}
a.gcard:hover{border-color:var(--link);background:color-mix(in srgb,var(--link) 6%,var(--panel))}
.gcard .gn{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint);letter-spacing:.05em}
.gcard b{font-size:15px}
.gcard .gd{font-size:var(--fs-xs);color:var(--muted);line-height:1.5}
.gcard.soon{border-style:dashed;opacity:.6;cursor:not-allowed}
@media (max-width:560px){.gpick{gap:6px}.gcard{min-height:84px;padding:10px 8px;align-items:center;text-align:center;justify-content:center}.gcard b{font-size:13px;word-break:keep-all}.gcard .gd{display:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.chip{font:inherit;font-size:var(--fs-btn);padding:6px 12px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);cursor:pointer;min-height:32px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--link);color:var(--link);background:color-mix(in srgb,var(--link) 9%,var(--btn-bg));font-weight:600}
.chip:disabled{opacity:.4;cursor:not-allowed}
.rules{font-size:var(--fs-xs);color:var(--muted);border-left:3px solid var(--line-2);padding:2px 0 2px 10px;margin:4px 0 16px}
.rules p{margin:0 0 2px}
.play{display:flex;flex-direction:column;min-height:calc(100dvh - 130px)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--fs-sm);color:var(--muted);margin-bottom:8px}
.hud .pts{font-size:18px;font-weight:600;color:var(--title)}
.combo{font-family:var(--font);font-size:var(--fs-xs);padding:2px 9px;border-radius:var(--r-sm);border:1px solid var(--line-2);color:var(--muted)}
.combo.hot{border-color:var(--combo);color:var(--combo);background:color-mix(in srgb,var(--combo) 12%,transparent)}
.timer{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.timer>div{height:100%;width:100%;background:var(--timer-hi);border-radius:99px}
.timer.mid>div{background:var(--timer-mid)}
.timer.lo>div{background:var(--timer-lo)}
.timer.out{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tleft{font-family:var(--mono);font-size:var(--fs-xs);color:var(--faint);text-align:right;font-variant-numeric:tabular-nums;margin:4px 0 12px;min-height:1.2em}
.gtype{font-size:var(--fs-2xs);color:var(--faint);margin-bottom:4px;letter-spacing:.02em}
.gq{font-size:18px;font-weight:600;line-height:1.5;margin:0 0 16px;letter-spacing:-.01em}
.gbottom{margin-top:4px}
.gopts{display:grid;gap:8px}
.gopt{font:inherit;font-size:var(--fs-opt);text-align:left;display:flex;gap:12px;align-items:center;padding:10px 14px;min-height:46px;border:1px solid var(--btn-line);border-radius:var(--r-md);background:var(--panel);color:var(--ink);cursor:pointer;transition:background .12s,border-color .12s;line-height:1.45}
.gopt:hover{border-color:var(--muted)}
.gopt kbd{flex:0 0 auto;width:22px;height:22px;border-radius:var(--r-sm);border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint)}
.gopt[aria-pressed="true"]{border-color:var(--link);background:color-mix(in srgb,var(--link) 9%,var(--panel))}
.gopt.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.gopt.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.gox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gox .gopt{justify-content:center;font-size:28px;font-weight:700;min-height:76px}
.gfloat{text-align:center;font-weight:650;font-size:16px;min-height:1.6em;margin-top:10px;font-family:var(--mono)}
.gfloat.ok{color:var(--ok)} .gfloat.no{color:var(--bad)}
.gfloat.pop{animation:pop .45s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.gsub{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.board{width:100%;border-collapse:collapse;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.board th,.board td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.board th{font-size:var(--fs-xs);color:var(--faint);font-weight:500}
.board .r{text-align:right;font-family:var(--mono)}
.board tr.me td{background:color-mix(in srgb,var(--combo) 12%,transparent);font-weight:600}
.bignum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 2px}
.bignum div{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:left}
.bignum b{display:block;font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.bignum span{font-size:var(--fs-2xs);color:var(--faint)}
/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--panel);color:var(--ink);border:1px solid var(--line-2);
  padding:8px 14px;border-radius:var(--r);font-size:var(--fs-sm);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .18)}
.toast.show{opacity:1;transform:translateX(-50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* 문제풀이 페이지(학습·오답 재도전): 탭 제목(h2)을 뺀 모든 글자 10px — 사용자 지정 */
/* 문제풀이·오답노트·해설지 공통: 제목(h1·h2·탭 묶음 제목)을 뺀 글자 10px, 문제 11px, 자간 +0.03em, 행간 1.7 */
.sheet,.sheet :where(*:not(h1,h2,.ngroup,.ngroup *)){font-size:10px!important;letter-spacing:.03em!important}  /* :where = 명시도 0 → 아래 11px 규칙이 이김 */
.sheet :is(.qt,.opt,.exp,.exp p,.guide,.mitem,.oitem .txt,.hint,.warn,.msg,.sub,.note dt,.note dd,.note .foot,.kq,.ka,.kw,.keylock){line-height:1.7!important}
.sheet :is(.qt,.kq),.sheet :is(.qt,.kq) *{font-size:11px!important}  /* 문제 문장만 11px */
/* 한글이 섞인 숫자 요소는 mono 대신 본문 글꼴 + 고정폭 숫자 (mono 한글 자간이 벌어짐) */
.meta,.tcard .tn,.tcard .ts,.progress span,.homeprog span,.note .foot,.an,.hud,.tleft,.gfloat,.bignum b{font-family:var(--font);font-variant-numeric:tabular-nums;letter-spacing:0}
/* ── 반응형 ─────────────────────────────────────── */
@media (max-width:560px){
  .wrap{padding:0 16px 48px}
  .topbar{margin:0 -16px 18px;padding-left:16px;padding-right:16px}
  /* 홈 탭 카드: 모바일에서도 한 줄 3개 (사용자 지정) */
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .tcard{padding:8px 9px;gap:2px}
  .tcard .tn{font-size:10px}
  .tcard .tt{font-size:12px;line-height:1.35;word-break:keep-all}
  .tcard .ts{flex-direction:column;align-items:flex-start;gap:0;padding-top:6px;font-size:10px}
  .tabbar{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .tabchip{padding:6px 8px;gap:4px}
  .q{padding:12px}
  .match{grid-template-columns:1fr}
  .mright{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line-2)}
  .btn,.chip{min-height:40px}
  .actions .btn{flex:1 1 calc(50% - 8px)}
  .actions .btn.primary{flex-basis:100%}
  .ox{max-width:none}
  .ox button{min-height:48px}
  .oitem{min-height:40px}
  .bd div{grid-template-columns:96px 1fr 40px}
  .bignum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field{max-width:none}
  /* 게임: 보기를 엄지 영역(화면 아래)으로 */
  .play .gtop{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));background:var(--bg);padding:6px 0 0;z-index:4}
  .play .gbottom{margin-top:auto;padding-top:12px}
  .gq{font-size:17px}
  .gopt{min-height:50px}
  .board th:nth-child(6),.board td:nth-child(6){display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  :root{--bg:#fff;--panel:#fff;--raised:#fff;--ink:#000;--muted:#333;--faint:#555;--line:#bbb;--line-2:#999;--soft:#f1f1f1;--title:#000;--link:#055}
  body{background:#fff;color:#000;font-size:12.5px}
  .noprint,.topbar,.actions,.tabbar,.progress,.toast{display:none!important}
  .printhead{display:block;margin-bottom:12px;font-size:12px}
  .q,.note,.keyitem{break-inside:avoid;box-shadow:none}
}

 없이 작성"],"a":2,"h":"YAML은 들여쓰기로 구조를 표현하므로 공백 개수가 매우 중요합니다. 자료는 공백 2칸으로 맞추고, 탭 키는 쓰지 말고 스페이스만 사용하라고 강조합니다.","w":"YAML은 들여쓰기가 구조를 결정합니다. 공백 2칸으로 맞추고 탭(Tab)은 절대 쓰지 않습니다.","an":"사전 준비 Step 3-2 · 주의사항","src":"YAML은 **들여쓰기가 매우 중요**합니다. 공백 2칸으로 맞춰야 합니다.\n> - 탭(Tab)을 쓰면 안 됩니다. 반드시 **스페이스**만 사용."},{"id":"t1-05","ty":"mc","lv":1,"game":true,"p":"docker-compose.yml로 실행되는 3개 서비스에 <b>포함되지 않는<\/b> 것은?","o":["MariaDB","Redis","WordPress","n8n"],"a":1,"h":"docker-compose.yml의 services에는 WordPress용 데이터베이스(MariaDB), WordPress 블로그, n8n 워크플로우 자동화 세 개만 정의됩니다. 실행 결과에도 fashion_db, fashion_wordpress, fashion_n8n 컨테이너만 시작되며 캐시 서버 같은 다른 서비스는 없습니다.","w":"YAML에는 wordpress_db(MariaDB), wordpress, n8n 3개 서비스만 있습니다. Redis는 없습니다.","an":"사전 준비 Step 3-2 · YAML 내용","src":"✔ Network fashion-blog_blog_net Created\n ✔ Container fashion_db Started\n ✔ Container fashion_wordpress Started\n ✔ Container fashion_n8n Started"},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"Docker 설치 확인은 <code>docker --version<\/code>과 <code>docker compose version<\/code> 두 명령으로 한다.","a":true,"h":"'설치 확인 — 터미널 명령' 절에서는 PowerShell이나 Terminal을 열고 두 명령을 순서대로 실행합니다. 하나는 Docker 버전(27.x.x)을, 다른 하나는 Compose 버전(v2.x.x)을 출력하면 정상입니다.","w":"맞습니다. 두 명령이 각각 Docker와 Docker Compose 버전을 출력하면 정상 설치입니다.","an":"사전 준비 Step 2 · 설치 확인","src":"아래 두 명령을 순서대로 실행:\n\n```bash\ndocker --version\n```\n\n**예상 출력**:\n```\nDocker version 27.x.x, build xxxxxxxx\n```\n\n```bash\ndocker compose version"},{"id":"t1-07","ty":"ox","lv":2,"game":true,"p":"'command not found'가 나오면 docker-compose.yml을 다시 작성해야 한다.","a":false,"h":"'command not found'는 터미널이 docker 명령 자체를 찾지 못했다는 뜻입니다. 자료는 이때 Docker Desktop 앱이 실행 중인지 다시 확인하고, 그래도 안 되면 컴퓨터를 재부팅하라고 안내합니다.","w":"틀렸습니다. Docker Desktop이 실행 중인지 확인하고, 안 되면 재부팅합니다. YAML과는 무관합니다.","an":"사전 준비 Step 2 · ⚠️ command not found","src":"\"command not found\" 에러가 나면** → Docker Desktop이 실행 중인지 다시 확인. 여전히 안 되면 컴퓨터 재부팅."},{"id":"t1-08","ty":"match","lv":2,"game":false,"p":"서비스와 역할(포트)을 연결하세요.","pairs":[["wordpress","8080 포트 · 블로그 사이트"],["n8n","5678 포트 · 워크플로우 편집"],["wordpress_db","MariaDB · WordPress용 데이터베이스"]],"h":"docker-compose.yml의 ports 설정에서 \"8080:80\"은 WordPress에, \"5678:5678\"은 n8n에 붙어 있고, DB 서비스는 image: mariadb:11로 외부 포트를 열지 않습니다. docker compose ps 출력의 PORTS 열에서도 같은 대응을 확인할 수 있습니다.","w":"WordPress는 8080, n8n은 5678로 접속하고, wordpress_db는 WordPress 글을 저장하는 MariaDB입니다.","an":"사전 준비 Step 3-2 · YAML","src":"NAME IMAGE STATUS PORTS\nfashion_db mariadb:11 Up 3306/tcp\nfashion_n8n n8nio/n8n:latest Up 0.0.0.0:5678->5678/tcp\nfashion_wordpress wordpress:latest Up 0.0.0.0:8080->80/tcp"},{"id":"t1-09","ty":"order","lv":1,"game":false,"p":"사전 준비 단계를 순서대로 정렬하세요.","steps":["시스템 요구사항 확인","Docker Desktop 설치","프로젝트 폴더·docker-compose.yml 작성","docker compose up -d 실행","WordPress 카테고리 구조 만들기"],"h":"사전 준비는 Step 1부터 Step 5까지 번호 순서로 진행됩니다. 프로그램이 설치되어야 compose 파일을 실행할 수 있고, 컨테이너가 떠서 WordPress에 로그인해야 카테고리를 만들 수 있다는 의존 관계를 따라가 보세요.","w":"Step 1(사양) → 2(설치) → 3(YAML) → 4(실행·초기 설정) → 5(카테고리) 순서입니다.","an":"사전 준비 Step 1~5","src":"프로젝트 폴더(`fashion-blog`) 안에서:\n\n```bash\ndocker compose up -d"},{"id":"t1-10","ty":"multi","lv":1,"game":true,"p":"최소 사양에 해당하는 것을 <b>모두<\/b> 고르세요.","o":["RAM 8GB","저장공간 10GB 여유","CPU 가상화 지원","GPU 필수","RAM 32GB 이상"],"a":[0,1,2],"h":"최소 사양 표는 OS, RAM, 저장공간, CPU, 인터넷 다섯 항목의 최소값과 권장값을 보여 줍니다. 최소 열에는 메모리 8GB, 여유 공간 10GB, 가상화를 지원하는 CPU가 있고 16GB·20GB는 권장 열의 값입니다.","w":"최소 사양은 RAM 8GB(권장 16GB), 저장공간 10GB, 가상화 지원 CPU입니다. GPU나 32GB RAM은 요구하지 않습니다.","an":"사전 준비 Step 1 · 최소 사양","src":"| RAM | 8GB | 16GB |\n| 저장공간 | 10GB 여유 | 20GB 여유 |\n| CPU | 가상화 지원 | 동일 |"}]},{"id":"t2","title":"컨테이너 실행과 초기 설정","ref":"사전 준비 Step 4~6","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"컨테이너 3개를 백그라운드로 한 번에 실행하는 명령은?","o":["docker compose ps","docker compose stop","docker compose up -d","docker run n8n"],"a":2,"h":"프로젝트 폴더(fashion-blog) 안에서 compose 파일에 정의된 컨테이너를 한 번에 띄우는 명령을 씁니다. 'up'은 생성·시작을, 끝의 옵션 '-d'는 터미널을 붙잡지 않고 백그라운드로 실행한다는 뜻입니다.","w":"프로젝트 폴더에서 <code>docker compose up -d<\/code>를 실행하면 DB·WordPress·n8n이 함께 뜹니다. ps는 상태 확인입니다.","an":"사전 준비 Step 4-1","src":"프로젝트 폴더(`fashion-blog`) 안에서:\n\n```bash\ndocker compose up -d\n```\n\n**예상 출력**:\n```\n[+] Running 4/4\n ✔ Network fashion-blog_blog_net Created\n ✔ Container fashion_db Started\n ✔ Container fashion_wordpress Started\n ✔ Container fashion_n8n Started"},{"id":"t2-02","ty":"mc","lv":2,"game":true,"p":"컨테이너가 'Exit (1)' 상태일 때 원인을 확인하는 명령은?","o":["docker compose logs [이름]","docker compose down -v","docker --version","docker compose pull"],"a":0,"h":"docker compose ps에서 상태가 Up이 아니라 Exit (1)이면 컨테이너가 오류로 종료된 것입니다. 자료는 해당 컨테이너의 기록(로그)을 출력하는 compose 하위 명령에 컨테이너 이름을 붙여 원인을 보라고 하며, 대부분 포트 충돌이나 RAM 부족입니다.","w":"<code>docker compose logs [컨테이너명]<\/code>으로 원인을 봅니다. 대부분 포트 충돌이나 RAM 부족입니다.","an":"사전 준비 Step 4-2 · ❌ Exit (1)","src":"\"Exit (1)\" 상태라면**: `docker compose logs [컨테이너명]`으로 원인 확인. 대부분 포트 충돌 또는 RAM 부족."},{"id":"t2-03","ty":"mc","lv":2,"game":true,"p":"WordPress 설치 화면에서 로컬 테스트이므로 반드시 체크하는 항목은?","o":["자동 업데이트","댓글 허용","이메일 알림","검색 엔진 방지"],"a":3,"h":"WordPress 사이트 정보 입력 표의 마지막 항목은 검색 엔진이 사이트를 색인하지 못하게 막는 옵션입니다. 로컬 테스트용 사이트이므로 표에 '반드시 체크'라고 적혀 있습니다.","w":"로컬 테스트용이므로 '검색 엔진 방지'를 반드시 체크합니다.","an":"사전 준비 Step 4-4 · 사이트 정보 입력","src":"| 검색 엔진 방지 | ☑ **반드시 체크** (로컬 테스트이므로) |"},{"id":"t2-04","ty":"mc","lv":3,"game":true,"p":"http://localhost:8080이 안 열리고 포트 충돌이 원인일 때 해결법은?","o":["n8n 컨테이너를 삭제","포트를 '8090:80'으로 바꿔 재실행","DB 비밀번호를 변경","브라우저를 바꾼다"],"a":1,"h":"문제 1의 원인은 Docker가 꺼져 있거나 8080 포트를 다른 프로그램이 쓰는 경우입니다. 포트 충돌이면 docker-compose.yml에서 WordPress의 호스트 쪽 포트 번호를 다른 값으로 바꾼 뒤 docker compose up -d로 다시 띄웁니다.","w":"<code>docker compose ps<\/code>로 상태를 보고, 포트 충돌이면 '8090:80'으로 바꾼 뒤 <code>docker compose up -d<\/code>로 다시 실행합니다.","an":"사전 준비 Step 6 · 문제 1","src":"문제 1. `http://localhost:8080`이 안 열림**\n→ 원인: Docker가 안 떠 있거나, 포트 8080을 다른 프로그램이 사용 중\n→ 해결: `docker compose ps`로 `fashion_wordpress`가 Up인지 확인 / 8080 대신 `\"8090:80\"`으로 변경 후 `docker compose up -d`"},{"id":"t2-05","ty":"num","lv":2,"game":false,"p":"기본 '미분류'를 포함해, Step 5를 마친 뒤 카테고리 목록에 보여야 하는 카테고리는 모두 몇 개인가요?","a":6,"unit":"개","h":"Step 5에서 직접 추가하는 카테고리는 트렌드·스타일링·리뷰·쇼핑가이드·룩북입니다. 여기에 WordPress에 처음부터 있는 기본 카테고리 '미분류'를 더해 '추가한 5개 + 기본 1개'로 계산합니다.","w":"기본 '미분류' 1개 + 트렌드·스타일링·리뷰·쇼핑가이드·룩북 5개 = 6개입니다.","an":"사전 준비 Step 5","src":"3. 우측 카테고리 목록에 **총 6개** (기본 \"미분류\" + 5개 추가) 표시되면 완료"},{"id":"t2-06","ty":"ox","lv":1,"game":true,"p":"WordPress 초기 비밀번호는 한 번만 표시되므로 따로 메모해 둔다.","a":true,"h":"WordPress 설치 화면의 비밀번호는 생성된 값을 그대로 쓰는 것이 추천되며, 설치가 끝나면 다시 보여 주지 않습니다. 그래서 자료는 '비밀번호 메모 필수'라며 메모 앱에 저장해 두라고 안내합니다.","w":"맞습니다. 초기 비밀번호는 한 번만 보이므로 메모장 등에 저장해 둡니다.","an":"사전 준비 Step 4-4 · 📝","src":"비밀번호 메모 필수**: WordPress 초기 비밀번호는 한 번만 표시됩니다. Notepad나 메모 앱에 저장해 두세요."},{"id":"t2-07","ty":"ox","lv":2,"game":true,"p":"카테고리 ID는 모든 환경에서 트렌드=2, 스타일링=3으로 항상 같다.","a":false,"h":"카테고리 ID는 편집 링크 URL의 tag_ID 값으로 확인합니다. 메모 양식의 2~6은 예시일 뿐이며, 자료는 환경마다 ID가 다를 수 있으니 본인 환경의 값을 메모하라고 경고합니다.","w":"틀렸습니다. ID는 환경마다 다를 수 있으므로 본인 환경의 ID를 '편집' 링크 URL의 tag_ID에서 확인해 메모합니다.","an":"사전 준비 Step 5 · 카테고리 ID 메모","src":"환경마다 ID가 다를 수 있으니 **본인 환경의 ID를 메모**하세요."},{"id":"t2-08","ty":"match","lv":1,"game":false,"p":"카테고리와 슬러그를 연결하세요.","pairs":[["트렌드","trends"],["스타일링","styling"],["리뷰","reviews"],["쇼핑가이드","shopping"],["룩북","lookbook"]],"h":"카테고리 표의 슬러그는 이름을 영문 소문자로 옮긴 주소용 이름입니다. 트렌드·리뷰처럼 대부분 의미를 그대로 영어 복수형이나 단어로 바꾸지만, 쇼핑가이드는 앞부분만 줄인 형태를 씁니다.","w":"trends·styling·reviews·shopping·lookbook이 각 카테고리의 슬러그입니다.","an":"사전 준비 Step 5 · 카테고리 표","src":"| 트렌드 | `trends` | 시즌별 트렌드, 패션위크, 런웨이 |\n| 스타일링 | `styling` | 코디 가이드, 체형별 팁 |\n| 리뷰 | `reviews` | 제품·브랜드 리뷰 |\n| 쇼핑가이드 | `shopping` | 가격대별 추천 |\n| 룩북 | `lookbook` | AI 생성 스타일링 이미지 |"},{"id":"t2-09","ty":"order","lv":1,"game":false,"p":"WordPress 카테고리 하나를 추가하는 순서를 맞추세요.","steps":["'글 → 카테고리' 메뉴 열기","이름 입력","슬러그(영문 소문자) 입력","설명 입력","'새 카테고리 추가' 클릭"],"h":"관리자 화면 좌측 '글' 메뉴의 하위 메뉴에서 카테고리 화면을 엽니다. 각 카테고리는 이름 → 슬러그(영문 소문자) → 설명 순으로 입력하고, 마지막에 추가 버튼을 눌러 등록합니다.","w":"메뉴를 연 뒤 이름 → 슬러그 → 설명을 입력하고 '새 카테고리 추가'를 누릅니다.","an":"사전 준비 Step 5","src":"각 카테고리는:\n- 이름 입력 → 슬러그 입력 (영문 소문자) → 설명 입력 → **\"새 카테고리 추가\"** 버튼 클릭"},{"id":"t2-10","ty":"multi","lv":1,"game":true,"p":"사전 준비 완료(Step 6) 체크 항목을 <b>모두<\/b> 고르세요.","o":["3개 컨테이너 모두 Up","n8n 로그인 성공","카테고리 ID 메모","OpenAI $100 충전","WordPress 글 1개 발행"],"a":[0,1,2],"h":"Step 6의 6가지 체크 항목은 compose ps 결과, n8n 로그인, WordPress 사이트, 관리자 대시보드, 카테고리 5개 생성, 카테고리 ID 메모입니다. 모든 컨테이너가 Up 상태여야 하며, API Credential 등록은 1교시에서 하는 작업입니다.","w":"컨테이너 Up, n8n·WordPress 접속, 카테고리 생성과 ID 메모가 체크 항목입니다. 충전이나 글 발행은 해당하지 않습니다.","an":"사전 준비 Step 6","src":"- [ ] `docker compose ps` → 3개 컨테이너 모두 **Up**\n- [ ] `http://localhost:5678` → n8n 로그인 성공 (Workflows 페이지 보임)\n- [ ] `http://localhost:8080` → WordPress 사이트 표시\n- [ ] `http://localhost:8080/wp-admin` → 관리자 대시보드 로그인 성공\n- [ ] 카테고리 5개 (트렌드/스타일링/리뷰/쇼핑가이드/룩북) 생성 완료\n- [ ] 카테고리 ID 5개 메모 완료"}]},{"id":"t3","title":"Docker 내부 통신과 Credential","ref":"1교시 1-1~1-2","qs":[{"id":"t3-01","ty":"mc","lv":2,"game":true,"p":"n8n 워크플로우 안에서 WordPress API를 호출할 때 쓰는 주소는?","o":["http://localhost:8080","http://wordpress","http://localhost:5678","http://127.0.0.1"],"a":1,"h":"n8n 컨테이너 안에서 localhost는 n8n 자기 자신을 가리키므로 8080 포트로는 WordPress에 닿지 않습니다. 같은 Docker 네트워크 안에서는 compose 파일의 서비스 이름으로 서로를 찾습니다.","w":"Docker 네트워크 안에서는 서비스 이름 <code>http://wordpress<\/code>로 접근합니다. localhost:8080은 내 브라우저용 주소입니다.","an":"1교시 1-1 · Docker 내부 통신","src":"❌ http://localhost:8080 → n8n 안에서 localhost = n8n 자기 자신\n✅ http://wordpress → Docker 네트워크 안에서 서비스 이름으로 접근"},{"id":"t3-02","ty":"mc","lv":1,"game":true,"p":"n8n 2.x에서 Schedule·Webhook Trigger를 실제로 동작시키는 것은?","o":["Save","Execute step","Duplicate","Publish"],"a":3,"h":"n8n 2.x에서는 저장 동작이 두 가지로 나뉩니다. Save는 초안 저장이라 Manual Trigger만 동작하고, '실제 배포'에 해당하는 버튼을 눌러야 Webhook·Schedule Trigger가 활성화됩니다.","w":"Save는 초안 저장(Manual Trigger만 동작), Publish는 실제 배포로 Webhook·Schedule Trigger를 활성화합니다.","an":"1교시 1-1 · n8n 2.x 변경사항","src":"- **Save vs Publish**:\n - `Save` = 초안 저장 (Manual Trigger는 동작 OK)\n - `Publish` = 실제 배포 (Webhook, Schedule Trigger 활성화)"},{"id":"t3-03","ty":"mc","lv":2,"game":true,"p":"n8n 2.x에서 날짜를 원하는 형식으로 바꾸는 함수는?","o":[".toFormat()",".format()",".toString()",".parse()"],"a":0,"h":"n8n 2.x 변경사항의 '날짜 함수' 항목은 예전 방식의 .format()을 쓰지 말라고 합니다. 3교시 Slug 설정의 $now.to…('yyyyMMdd-HHmm')에서도 같은 함수를 볼 수 있습니다.","w":"n8n 2.x에서는 <code>.toFormat()<\/code>을 씁니다. 예: <code>$now.toFormat('yyyyMMdd-HHmm')<\/code>","an":"1교시 1-1 · 날짜 함수","src":"- **날짜 함수**: `.toFormat()` 사용 (`.format()` 아님)"},{"id":"t3-04","ty":"mc","lv":1,"game":true,"p":"OpenAI API 키를 만들 때 가장 주의할 점은?","o":["언제든 다시 볼 수 있다","n8n이 자동으로 가져온다","한 번만 표시되니 즉시 복사","결제 정보가 필요 없다"],"a":2,"h":"'Create secret key'를 누르면 sk-proj-로 시작하는 키가 생성되는데, 이 키는 창을 닫으면 다시 볼 수 없습니다. 그래서 생성 직후 바로 복사해 메모장에 임시 저장하라고 강조합니다.","w":"생성된 <code>sk-proj-...<\/code> 키는 한 번만 표시되므로 즉시 복사해 둡니다. 무료 크레딧 소진 후에는 결제 등록도 필요합니다.","an":"1교시 1-2 A · OpenAI 키 발급","src":"생성된 키를 즉시 복사** (`sk-proj-...`로 시작)\n - ⚠️ 키는 **한 번만** 표시됩니다. 다시 볼 수 없어요!"},{"id":"t3-05","ty":"mc","lv":2,"game":true,"p":"무료 티어가 있어 이 과정에서 이미지 생성에 쓰는 AI는?","o":["OpenAI","Google Gemini","Anthropic Claude","Stable Diffusion"],"a":1,"h":"1교시 1-2 B에서 등록하는 Google 계열 API는 분당 15회, 일 1500회까지 무료로 쓸 수 있어 교육용으로 충분합니다. 3교시에서는 이 API의 'Generate an Image' 기능으로 룩북 이미지를 만듭니다.","w":"Gemini는 분당 15회·일 1500회 무료 티어가 있어 교육용으로 충분하고, 3교시 이미지 생성에 씁니다.","an":"1교시 1-2 B · 🎁 무료 티어","src":"Gemini 무료 티어**: 분당 15회, 일 1500회까지 무료. 교육용으로 충분."},{"id":"t3-06","ty":"ox","lv":2,"game":true,"p":"n8n 2.x의 Code 노드에서는 <code>process.env<\/code>를 쓸 수 있다.","a":false,"h":"n8n 2.x의 Code 노드는 Task Runner에서 격리 실행됩니다. 격리 환경이므로 서버의 환경 변수 객체에 접근하는 코드는 사용할 수 없다고 명시되어 있습니다.","w":"틀렸습니다. Code 노드는 Task Runner에서 격리 실행되어 process.env를 쓸 수 없습니다.","an":"1교시 1-1 · Code 노드","src":"- **Code 노드**: Task Runner에서 격리 실행 (`process.env` 사용 불가)"},{"id":"t3-07","ty":"ox","lv":1,"game":true,"p":"이 과정은 OpenAI와 Gemini 2개 Credential이면 충분하고, Claude는 선택이다.","a":true,"h":"1-2 C의 Anthropic Claude API는 제목부터 '(선택) … 시간 남으면'으로 표시되어 있습니다. 자료는 이 과정에서 OpenAI와 Gemini 두 개면 충분하고 Claude는 심화 학습자용이라고 설명합니다.","w":"맞습니다. OpenAI + Gemini면 충분하고 Anthropic Claude는 심화 학습자용 선택입니다.","an":"1교시 1-2 C","src":"OpenAI + Gemini 2개면 충분**합니다. Claude는 심화 학습자용."},{"id":"t3-08","ty":"match","lv":2,"game":false,"p":"상황과 사용할 URL을 연결하세요.","pairs":[["내가 브라우저로 WordPress 접속","http://localhost:8080"],["n8n이 WordPress API 호출","http://wordpress"],["내가 브라우저로 n8n 접속","http://localhost:5678"]],"h":"사람이 브라우저로 접속할 때는 내 PC의 localhost에 각 서비스 포트(WordPress 8080, n8n 5678)를 붙여 씁니다. 반면 n8n 워크플로우 안에서 WordPress API를 부를 때는 Docker 네트워크의 서비스 이름을 씁니다.","w":"브라우저는 localhost 주소를, n8n 안에서는 서비스 이름(wordpress)을 씁니다.","an":"1교시 1-1 · URL 표","src":"| 상황 | URL |\n|------|-----|\n| 내가 브라우저에서 WordPress 접속 | `http://localhost:8080` |\n| n8n 워크플로우에서 WordPress API 호출 | `http://wordpress` ⭐ |\n| 내가 브라우저에서 n8n 접속 | `http://localhost:5678` |"},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"OpenAI Credential을 등록하는 순서를 맞추세요.","steps":["'Create new secret key'로 키 발급","생성된 키 즉시 복사","n8n Credentials → Add credential","'OpenAI API' 선택 후 키 붙여넣기","Save 후 연결 성공 메시지 확인"],"h":"먼저 OpenAI 플랫폼에서 새 비밀 키를 만들고, 한 번만 표시되므로 곧바로 복사해 둡니다. 그다음 n8n 좌측 Credentials에서 credential을 추가하고 'OpenAI API'를 골라 키를 붙여넣은 뒤, 저장하고 성공 메시지를 확인합니다.","w":"OpenAI에서 키를 만들어 바로 복사하고, n8n에서 OpenAI API Credential에 붙여넣은 뒤 Save해 'Connection tested successfully'를 확인합니다.","an":"1교시 1-2 A · Step 1~2","src":"1. n8n 화면 좌측 사이드바 → **\"Credentials\"** (열쇠 아이콘) 클릭\n2. 우측 상단 **\"+ Add credential\"** 버튼 클릭\n3. 검색창에 `openai` 입력\n4. **\"OpenAI API\"** 선택\n5. 입력:\n - **API Key**: 방금 복사한 `sk-proj-...` 붙여넣기\n - **Organization ID**: 비워둠\n6. 우측 상단 **\"Save\"** 클릭\n7. 하단에 **\"Connection tested successfully\"** 초록색 메시지 확인"},{"id":"t3-10","ty":"multi","lv":2,"game":false,"p":"Docker 내부 통신 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["브라우저는 localhost:8080 필요","n8n은 서비스 이름만 알면 됨","n8n 안의 localhost는 n8n 자신","n8n 안에서도 localhost:8080 사용","서비스 이름으로는 접근 불가"],"a":[0,1,2],"h":"자료의 비유에서 브라우저는 집 밖에서 초인종을 누르는 사람이라 집 주소(localhost:8080)가 필요하고, n8n은 같은 아파트 옆집 주민이라 호수 이름만 알면 됩니다. 또 n8n 안에서 localhost라고 쓰면 그것은 n8n 자기 자신을 뜻합니다.","w":"브라우저는 집 주소(localhost:8080)가, n8n은 호수 이름(wordpress)만 필요합니다. n8n 안에서 localhost는 n8n 자기 자신을 가리킵니다.","an":"1교시 1-1 · 💡 비유","src":"비유로 이해하기**:\n> - 브라우저는 집 밖에서 초인종을 누르는 사람 → 집 주소(`localhost:8080`) 필요\n> - n8n은 같은 아파트 옆집 주민 → 호수 이름(`wordpress`)만 알면 됨\n> - 둘은 같은 아파트(Docker 네트워크) 안에 삽니다."}]},{"id":"t4","title":"실습 1 · 트렌드 아이디어 생성기","ref":"1교시 1-3","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":false,"p":"실습 1 워크플로우의 노드 구성으로 맞는 것은?","o":["Schedule → OpenAI → WordPress","Manual Trigger → Edit Fields → OpenAI → Code","Webhook → Code → Gemini","Manual Trigger → Gemini → IF"],"a":1,"h":"실습 1은 4개 노드로 구성됩니다. 수동 실행 트리거 → 입력값을 정하는 필드 설정 노드 → AI 모델 호출 노드 → 응답 파싱과 시즌 판별을 하는 코드 노드 순으로 연결됩니다.","w":"실습 1은 Manual Trigger → Edit Fields → OpenAI → Code(파싱 + 시즌 판별) 4개 노드입니다.","an":"1교시 1-3 · 워크플로우 구조","src":"Manual Trigger → Edit Fields → OpenAI → Code (파싱 + 시즌 판별)\n```\n\n4개 노드로 구성됩니다."},{"id":"t4-02","ty":"mc","lv":1,"game":true,"p":"User 메시지에서 이전 노드 값을 쓰려고 Expression 모드로 바꿀 때 누르는 것은?","o":["Execute step","Add Field","Pin data","fx 버튼"],"a":3,"h":"User 메시지의 Role을 User로 정한 뒤, Content 영역 위에 있는 작은 함수 기호 버튼을 누르면 배경색이 바뀌며 Expression 모드로 전환됩니다. 그래야 {{ $json.스타일 }} 같은 표현식이 실제 값으로 치환됩니다.","w":"Content 위의 작은 fx 버튼을 누르면 Expression 모드로 바뀌어 <code>{{ }}<\/code> 치환이 작동합니다.","an":"1교시 1-3 Step 4-3","src":"- **Content** 영역 위의 **작은 fx 버튼** 클릭 → **Expression 모드로 전환** (배경 색깔 변함)"},{"id":"t4-03","ty":"mc","lv":2,"game":true,"p":"<code>{{ $json.스타일 }}<\/code>이 가리키는 값은?","o":["바로 이전 노드 출력의 '스타일'","Edit Fields 첫 값만","전역 환경변수 '스타일'","Code 노드의 변수"],"a":0,"h":"Expression {{ }} 표기는 이전 노드의 데이터를 현재 노드에서 쓰는 방법입니다. $json은 '바로 직전 노드가 출력한 JSON'을 뜻하고, 점 뒤의 이름은 그 안의 필드 이름입니다.","w":"<code>$json.스타일<\/code>은 바로 이전 노드 출력의 '스타일' 필드 값입니다.","an":"1교시 1-3 Step 4-3 · 💡 Expression","src":"Expression(`{{ }}`) 표기법**: 이전 노드의 데이터를 현재 노드에서 사용하는 방법입니다. `$json.스타일`은 \"바로 이전 노드 출력의 '스타일' 필드 값\"을 의미합니다."},{"id":"t4-04","ty":"mc","lv":2,"game":true,"p":"실습 1 OpenAI 노드의 Temperature 0.7이 뜻하는 것은?","o":["응답 최대 길이","응답 대기 시간(초)","창의성과 일관성의 균형","아이디어 개수"],"a":2,"h":"Temperature(Output Randomness)는 응답의 무작위성을 조절하며, 높을수록 다양하고 낮을수록 일정해집니다. 실습 1은 0.7로 두며, 자료는 이 값이 두 성질 사이의 균형점이라 패션 콘텐츠에 적절하다고 설명합니다.","w":"0.7은 창의성과 일관성의 균형으로 패션 콘텐츠에 적절한 값입니다.","an":"1교시 1-3 Step 4-4","src":"Output Randomness (Temperature)**: `0.7`\n\n> `0.7` = 창의성과 일관성의 균형. 패션 콘텐츠에 적절합니다."},{"id":"t4-05","ty":"mc","lv":3,"game":true,"p":"실습 1을 8월에 실행하면 Code 노드가 판별하는 시즌은?","o":["봄","여름","가을","겨울"],"a":1,"h":"Code 노드는 new Date().getMonth() + 1로 현재 월을 구한 뒤 3~5월, 6~8월, 9~11월, 나머지 달로 나누어 계절을 정합니다. 8이 어느 범위에 들어가는지 확인해 보세요.","w":"month가 6~8이면 '여름'입니다. 시즌은 현재 월을 읽어 자동 판별됩니다.","an":"1교시 1-3 Step 5-3 · 시즌 판별 코드","src":"} else if (month >= 6 && month <= 8) {\n season = '여름'; seasonEn = 'summer';\n mood = 'bright, vibrant, minimal';\n colors = '화이트, 스카이블루, 코럴, 옐로우';"},{"id":"t4-06","ty":"ox","lv":1,"game":true,"p":"실습 1의 Code 노드는 아이디어를 예상인기도가 높은 순으로 정렬해 반환한다.","a":true,"h":"코드 끝부분에 '인기도순 정렬' 주석과 함께 sort((a, b) => (b.예상인기도 || 0) - (a.예상인기도 || 0))가 있습니다. b에서 a를 빼는 비교 함수는 값이 큰 항목을 앞으로 보내는 내림차순 정렬입니다.","w":"맞습니다. 메타 정보를 붙인 뒤 예상인기도 내림차순으로 정렬합니다.","an":"1교시 1-3 Step 5-4","src":"// ── 인기도순 정렬 ──\nenrichedIdeas.sort((a, b) => (b.예상인기도 || 0) - (a.예상인기도 || 0));"},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"'JSON.parse 에러'가 나면 Temperature를 0.9로 올리는 것이 해결책이다.","a":false,"h":"JSON.parse 에러는 AI가 순수 JSON이 아니라 설명 텍스트를 섞어 반환할 때 생깁니다. 자료의 해결책은 System 프롬프트에 'JSON 배열만 반환'을 강조하고, Temperature는 오히려 0.5로 낮추는 것입니다.","w":"틀렸습니다. 'JSON 배열만 반환'을 System 프롬프트에 강조하고 Temperature를 0.5로 낮춥니다.","an":"1교시 체크포인트 · 문제 1","src":"문제 1. \"JSON.parse 에러\"**\n→ 원인: AI가 순수 JSON이 아닌 설명 텍스트를 함께 반환\n→ 해결: OpenAI System 프롬프트에 \"다른 설명 없이 JSON 배열만 반환\" 강조 추가, Temperature를 0.5로 낮추기"},{"id":"t4-08","ty":"match","lv":2,"game":false,"p":"OpenAI 노드 에러와 조치를 연결하세요.","pairs":[["401 Unauthorized","Credential 확인"],["Rate limit","1분 후 재시도"],["Invalid model","모델명 확인"]],"h":"4-5 테스트에서 안내하는 에러 대응입니다. 401은 인증 실패라 등록한 키 설정을, 호출 한도 초과는 잠시 기다린 뒤 재시도를, 모델 이름 오류는 지정한 모델명을 점검하라는 뜻입니다.","w":"401은 인증(Credential), Rate limit은 호출 한도, Invalid model은 모델명 문제입니다.","an":"1교시 1-3 Step 4-5","src":"- \"401 Unauthorized\" → Credential 확인\n - \"Rate limit\" → 1분 후 재시도\n - \"Invalid model\" → 모델명이 `gpt-4o-mini`인지 확인"},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"실습 1 Code 노드의 처리 순서를 맞추세요.","steps":["AI 응답의 코드 펜스 제거","JSON 파싱","현재 월로 시즌 판별","아이디어에 시즌 정보 추가","예상인기도 순 정렬"],"h":"코드 설명에 따르면 먼저 AI 응답에 붙는 ```json 코드 펜스를 지우고 JSON으로 파싱합니다. 이어 현재 월로 계절을 판별하고, 원본 아이디어에 시즌 정보를 덧붙인 뒤, 마지막에 인기도 높은 순으로 정렬합니다.","w":"코드 펜스 제거 → JSON 파싱(실패 시 원본 반환) → 시즌 판별 → 메타 정보 추가 → 인기도순 정렬 → 아이템 반환 순서입니다.","an":"1교시 1-3 Step 5-4 · 코드 설명","src":"- **라인 1~2**: AI 응답에 종종 포함되는 ``` ```json ``` ``` 코드 펜스 제거\n- **라인 4~10**: JSON 파싱 실패 시 원본 반환 (디버깅용)\n- **라인 13~32**: 현재 월을 읽어 4계절 중 하나로 자동 판별\n- **라인 35~40**: 각 시즌별 트렌드 키워드 매핑\n- **라인 43~52**: 원본 아이디어에 시즌 정보 추가\n- **라인 55**: 인기도 높은 순으로 정렬"},{"id":"t4-10","ty":"multi","lv":2,"game":true,"p":"Code 노드가 각 아이디어에 추가하는 필드를 <b>모두<\/b> 고르세요.","o":["시즌","시즌컬러","추천키워드","품질점수","카테고리ID"],"a":[0,1,2],"h":"enrichedIdeas를 만드는 map 안에서 원본 아이디어(...idea) 뒤에 번호, 시즌, 시즌무드, 시즌컬러, 추천키워드, 생성일시, 상태 필드를 추가합니다. 보기 중 이 목록에 실제로 있는 이름만 고르세요.","w":"번호·시즌·시즌무드·시즌컬러·추천키워드·생성일시·상태를 추가합니다. 품질점수와 카테고리ID는 2·3교시에 나옵니다.","an":"1교시 1-3 Step 5-3","src":"const enrichedIdeas = ideas.map((idea, index) => ({\n 번호: index + 1,\n ...idea,\n 시즌: season,\n 시즌무드: mood,\n 시즌컬러: colors,\n 추천키워드: seasonKeywords[season],\n 생성일시: now.toISOString().slice(0, 19).replace('T', ' '),\n 상태: '대기중'"}]},{"id":"t5","title":"패션 톤앤매너와 글 생성 흐름","ref":"2교시 2-1~2-2","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"좋은 패션 글의 5요소 중 '독자의 고민에서 시작'하는 요소는?","o":["시각적 묘사","공감 후크","트렌드 맥락","구매 가이드"],"a":1,"h":"좋은 패션 글의 5가지 요소는 독자 공감, 시각적 묘사, 실용적 팁, 트렌드 맥락, 구매 가이드로 이어집니다. 첫 요소는 \"출근 전 옷장 앞에서 30분씩 고민하시나요?\"처럼 독자의 고민으로 시선을 끌어당기는(hook) 도입부입니다.","w":"공감 후크는 독자의 고민으로 글을 엽니다. 나머지는 컬러·소재 묘사, 트렌드 배경, 구매처 안내입니다.","an":"2교시 2-1 · 5가지 요소","src":"1. **공감 후크**: 독자의 고민에서 시작 (\"출근 전 옷장 앞에서 30분씩 고민하시나요?\")"},{"id":"t5-02","ty":"mc","lv":2,"game":true,"p":"'뚱뚱한 체형' 대신 권하는 표현은?","o":["통통한 체형","큰 체형","살집 있는 체형","볼륨감 있는 체형"],"a":3,"h":"'피해야 할 것' 표는 체형을 부정적으로 묘사하는 말을 긍정적 표현으로 바꾸라고 합니다. 몸의 크기를 '볼륨'이라는 중립적 단어로 표현하는 대체어를 떠올려 보세요.","w":"체형 부정적 표현을 피하고 '볼륨감 있는 체형'처럼 긍정적으로 씁니다.","an":"2교시 2-1 · 피해야 할 것","src":"| \"뚱뚱한 체형\" | \"볼륨감 있는 체형\" |"},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"Google이 패션 글에서 중시하는 E-E-A-T의 첫 E는?","o":["Experience(실착 경험)","Efficiency(효율)","Engagement(참여)","Editing(편집)"],"a":0,"h":"E-E-A-T는 Google이 패션 글에서 중시하는 품질 기준으로, 두 번째 E는 Expertise(전문성)입니다. 첫 번째 E는 AI가 대신할 수 없는 '직접 입어 본 경험'을 뜻하므로 AI 글 작성 후 본인 경험을 꼭 추가하라고 합니다.","w":"E-E-A-T의 Experience는 실착 경험, Expertise는 전문성입니다. AI로 쓴 뒤 본인 경험을 꼭 추가합니다.","an":"2교시 2-1 · 💡 E-E-A-T","src":"E-E-A-T**: Google은 패션 글에서 Experience(실착 경험)과 Expertise(전문성)를 중시합니다. AI로 작성 후 본인 경험을 꼭 추가하세요."},{"id":"t5-04","ty":"mc","lv":2,"game":true,"p":"실습 2에서 OpenAI #1이 만드는 것은?","o":["2000자 본문","룩북 이미지","SEO 메타 + 글 구조 JSON","WordPress 초안"],"a":2,"h":"실습 2는 OpenAI 노드를 두 번 씁니다. 첫 번째는 검색 최적화용 메타 정보(meta_title, meta_description)와 h2_sections 같은 글 뼈대를 JSON으로 만들고, 두 번째가 그 뼈대를 받아 본문을 씁니다.","w":"OpenAI #1은 meta_title·h2_sections 등 SEO 메타와 구조를 JSON으로, OpenAI #2가 본문을 씁니다.","an":"2교시 2-2 · 워크플로우 구조","src":"→ OpenAI #1 (SEO 메타 + 구조 생성)\n → OpenAI #2 (본문 작성)"},{"id":"t5-05","ty":"mc","lv":3,"game":true,"p":"<code>$('Edit Fields').first().json.톤<\/code>을 쓰는 이유는?","o":["직전 노드 값만 쓰려고","여러 노드 건너 원본 입력 참조","톤 값을 덮어쓰려고","Edit Fields를 재실행하려고"],"a":1,"h":"$json은 바로 직전 노드의 출력만 가리키므로, OpenAI #1을 거친 뒤에는 Edit Fields의 '톤'이 직접 보이지 않습니다. $('노드이름').first().json은 이름으로 특정 노드의 첫 아이템을 지정해, 중간 노드를 건너뛰고도 처음 입력값을 가져옵니다.","w":"특정 노드의 첫 아이템을 지정하므로, 중간에 OpenAI #1이 있어도 Edit Fields의 원본 '톤'을 가져옵니다.","an":"2교시 2-2 Step 4 · 💡","src":"`$('Edit Fields').first().json.톤`의 의미**: \"Edit Fields 노드의 첫 번째 아이템의 json에서 '톤' 필드\" → 여러 노드를 건너뛰어도 원본 입력값을 참조할 수 있습니다."},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"실습 2 Edit Fields의 '목표글자수'는 Type을 Number로 선택한다.","a":true,"h":"실습 2의 Edit Fields에는 6개 필드가 있고 대부분 String입니다. 그러나 값이 2000인 '목표글자수'는 숫자로 다뤄야 하므로 Type을 따로 바꾸라는 경고가 붙어 있습니다.","w":"맞습니다. 목표글자수만 Number이고 나머지 필드는 String입니다.","an":"2교시 2-2 Step 2-3","src":"\"목표글자수\"**는 Type을 **Number**로 선택하세요 (다른 것들은 String)."},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"본문 작성 OpenAI #2는 SEO 메타(0.6)보다 Temperature를 낮게 둔다.","a":false,"h":"OpenAI #1(SEO 메타)의 Temperature는 0.6입니다. 본문 작성 노드의 Options에는 '(본문은 더 창의적으로)'라는 설명과 함께 다른 값이 들어가므로, 창의성을 높이려면 Temperature를 올려야 하는지 내려야 하는지 생각해 보세요.","w":"틀렸습니다. 본문은 0.8로 더 높게 두고 Maximum Tokens 3000을 추가합니다.","an":"2교시 2-2 Step 4-5","src":"- **Temperature**: `0.8` (본문은 더 창의적으로)\n- **Options → Add Option → Maximum Number of Tokens**: `3000`"},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"피해야 할 표현과 대체 표현을 연결하세요.","pairs":[["짧은 다리","다리 라인을 보완하고 싶은 분"],["이건 무조건 사야 해요","이런 스타일을 좋아하신다면 추천"],["바이어스 컷 실루엣","몸에 자연스럽게 흐르는 컷"],["이모지 5개+ 연속","섹션당 2~3개"]],"h":"표의 원칙은 신체 단점을 지적하지 않고, 구매를 강요하지 않으며, 전문용어는 쉬운 말로 풀고, 이모지는 절제하는 것입니다. 각 피해야 할 표현이 어떤 원칙을 어겼는지 보면 짝이 맞는 대체 표현을 찾을 수 있습니다.","w":"체형은 긍정적으로, 구매는 권유형으로, 전문용어는 쉬운 말로, 이모지는 절제해서 씁니다.","an":"2교시 2-1 · 피해야 할 것 표","src":"| \"짧은 다리\" | \"다리 라인을 보완하고 싶은 분\" |\n| \"이건 무조건 사야 해요\" | \"이런 스타일을 좋아하신다면 추천드려요\" |\n| \"바이어스 컷 실루엣\" (전문용어) | \"몸에 자연스럽게 흐르는 컷\" |\n| 이모지 5개+ 연속 | 섹션당 2~3개 적절히 |"},{"id":"t5-09","ty":"order","lv":1,"game":false,"p":"실습 2 워크플로우를 순서대로 정렬하세요.","steps":["Manual Trigger","Edit Fields (패션 주제 입력)","OpenAI #1 (SEO 메타·구조)","OpenAI #2 (본문 작성)","Code (품질 체크 + HTML)"],"h":"실습 2는 수동 트리거로 시작해 주제 입력 노드를 지나고, AI가 먼저 SEO 구조를 만든 뒤 그 구조로 본문을 씁니다. 마지막 코드 노드에서 품질을 점검하고 Markdown을 HTML로 바꿉니다.","w":"주제를 넣고 SEO 구조를 만든 뒤 본문을 쓰고, 마지막에 품질 체크와 HTML 변환을 합니다.","an":"2교시 2-2 · 워크플로우 구조","src":"→ Edit Fields (패션 주제 입력)\n → OpenAI #1 (SEO 메타 + 구조 생성)\n → OpenAI #2 (본문 작성)\n → Code (패션 특화 품질 체크 + HTML 변환)"},{"id":"t5-10","ty":"multi","lv":2,"game":true,"p":"본문 System 프롬프트의 작성 규칙에 들어 있는 것을 <b>모두<\/b> 고르세요.","o":["가격대 3단계 구분","체형·상황별 조언","'오늘의 핵심 정리' 체크리스트","체형을 솔직하게 지적","추측성 정보 적극 활용"],"a":[0,1,2],"h":"본문 System 프롬프트의 작성 규칙에는 Markdown 형식, 친근한 어투, 섹션별 스타일링 팁, 하이엔드/미드/SPA 가격대 구분, 체형·상황별 조언, 이모지 제한, 목표 글자수, 마지막 체크리스트 형태의 정리, 댓글 CTA가 있습니다. 규칙에 없는 보기를 걸러 내세요.","w":"가격대 3단계, 체형·상황별 조언, 핵심 정리 체크리스트가 규칙입니다. 체형 부정 표현과 추측성 정보는 피해야 할 것입니다.","an":"2교시 2-2 Step 4-3","src":"5. 아이템 추천 시 가격대 3단계 구분 (하이엔드/미드/SPA)\n6. 체형·상황별 조언 반드시 포함\n7. 이모지는 섹션 제목과 핵심 포인트에만 사용 (1섹션당 2~3개)\n8. 총 {{ $('Edit Fields').first().json.목표글자수 }}자 이상\n9. 마지막에 \"오늘의 핵심 정리\" 체크리스트 형태"}]},{"id":"t6","title":"품질 체크 Code와 등급","ref":"2교시 Step 5~6","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"품질 등급 S(발행 추천)의 기준 점수는?","o":["80점 이상","70점 이상","90점 이상","100점만"],"a":2,"h":"등급 판정 코드는 if (score >= 90) → S, >= 80 → A, >= 70 → B, 그 외 C 순서로 판정합니다. 가장 높은 등급이 붙는 조건식의 숫자를 확인하세요.","w":"S 90+, A 80+, B 70+, C 70 미만입니다.","an":"2교시 Step 5-4 · 등급 체계","src":"// ═══ 등급 판정 ═══\nlet grade;\nif (score >= 90) grade = 'S (발행 추천)';\nelse if (score >= 80) grade = 'A (소폭 수정 후 발행)';\nelse if (score >= 70) grade = 'B (수정 필요)';\nelse grade = 'C (재작성 필요)';"},{"id":"t6-02","ty":"mc","lv":2,"game":true,"p":"품질 체크에서 글자수가 1500자 미만이면 몇 점 감점되나요?","o":["20점","10점","15점","5점"],"a":0,"h":"점수는 100점에서 시작해 문제마다 감점합니다. 기본 체크의 첫 줄 if (charCount < 1500)이 참이면 score에서 일정 점수를 빼고 '글자수 부족'을 issues에 넣으니, score -= 뒤의 숫자를 보세요.","w":"charCount < 1500이면 20점, H2가 4개 미만이면 15점을 감점합니다.","an":"2교시 Step 5-3 · 점수 계산","src":"if (charCount < 1500) { score -= 20; issues.push(`글자수 부족 (${charCount}자)`); }"},{"id":"t6-03","ty":"mc","lv":2,"game":true,"p":"키워드 밀도가 몇 %를 넘으면 '키워드 남용'으로 감점되나요?","o":["0.5%","1%","5%","3%"],"a":3,"h":"키워드 밀도는 (키워드 등장 횟수 × 키워드 길이) ÷ 전체 글자수 × 100으로 계산합니다. 0.5% 미만이면 '밀도 낮음', 상한을 넘으면 '키워드 남용'으로 각각 10점을 감점합니다.","w":"밀도 0.5% 미만은 '낮음', 3% 초과는 '남용'으로 각각 10점 감점합니다.","an":"2교시 Step 5-3","src":"score -= 10; issues.push(`키워드 남용 (${density}%)`); }"},{"id":"t6-04","ty":"mc","lv":2,"game":true,"p":"품질 체크 Code가 Markdown 본문을 HTML로 바꾸는 이유는?","o":["글자수를 줄이려고","WordPress에 바로 넣으려고","SEO 점수를 올리려고","이미지를 만들려고"],"a":1,"h":"5-4 코드 이해 포인트에서 HTML 변환은 Markdown 본문을 블로그 플랫폼에 곧바로 넣을 수 있는 형태로 바꾸는 단계이며, 3교시에서 활용한다고 설명합니다. 3교시 WordPress 노드의 Content에 본문_HTML 필드가 들어갑니다.","w":"본문_HTML은 3교시 WordPress 노드의 Content에 그대로 들어갑니다.","an":"2교시 Step 5-4 · HTML 변환","src":"- **HTML 변환**: Markdown을 WordPress에 바로 넣을 수 있는 HTML로 변환 (3교시에서 활용)"},{"id":"t6-05","ty":"num","lv":3,"game":false,"p":"이슈가 '섹션 부족(H2 3개)'과 'CTA 없음' 두 가지뿐이라면 품질점수는 몇 점인가요?","a":80,"unit":"점","h":"품질점수는 100점에서 시작해 이슈마다 감점합니다. H2가 4개 미만이면 15점, 독자 참여 CTA가 없으면 5점을 빼므로 계산식은 100 − 15 − 5입니다.","w":"H2 4개 미만은 15점, CTA 없음은 5점 감점이므로 100 − 15 − 5 = 80점(A 등급)입니다.","an":"2교시 Step 5-3 · 점수 계산","src":"if (h2Count < 4) { score -= 15; issues.push(`섹션 부족 (H2 ${h2Count}개)`); }"},{"id":"t6-06","ty":"ox","lv":1,"game":true,"p":"품질점수가 70점 이상이면 '통과'로 표시된다.","a":true,"h":"반환 JSON의 통과여부 필드는 score >= 70 ? '✅ 통과' : '❌ 재작성 필요'로 정해집니다. 4교시 IF 품질 게이트도 같은 70점 기준을 씁니다.","w":"맞습니다. score >= 70이면 '✅ 통과', 아니면 '❌ 재작성 필요'입니다.","an":"2교시 Step 5-3 · 통과여부","src":"통과여부: score >= 70 ? '✅ 통과' : '❌ 재작성 필요',"},{"id":"t6-07","ty":"ox","lv":2,"game":true,"p":"이모지가 하나도 없어도 패션 블로그 품질 체크에서는 감점이 없다.","a":false,"h":"이모지 체크는 emojiCount === 0이면 '이모지 없음 (패션 블로그 권장)', 20개를 넘으면 '이모지 남용'으로 처리합니다. 두 경우 모두 score에서 5점을 뺍니다.","w":"틀렸습니다. 이모지 0개면 '패션 블로그 권장'에 따라 5점 감점, 20개 초과도 5점 감점입니다.","an":"2교시 Step 5-3","src":"if (emojiCount === 0) { score -= 5; issues.push(`이모지 없음 (패션 블로그 권장)`); }\nelse if (emojiCount > 20) { score -= 5; issues.push(`이모지 남용 (${emojiCount}개)`); }"},{"id":"t6-08","ty":"match","lv":1,"game":false,"p":"등급과 의미를 연결하세요.","pairs":[["S","발행 추천"],["A","소폭 수정 후 발행"],["B","수정 필요"],["C","재작성 필요"]],"h":"등급 문자열에는 괄호 안에 의미가 함께 적혀 있습니다. 점수가 높을수록 바로 내보낼 수 있고, 낮을수록 손볼 범위가 커져 가장 낮은 등급은 처음부터 다시 써야 합니다.","w":"S 발행 추천 · A 소폭 수정 후 발행 · B 수정 필요 · C 재작성 필요입니다.","an":"2교시 Step 5-3 · 등급 판정","src":"// ═══ 등급 판정 ═══\nlet grade;\nif (score >= 90) grade = 'S (발행 추천)';\nelse if (score >= 80) grade = 'A (소폭 수정 후 발행)';\nelse if (score >= 70) grade = 'B (수정 필요)';\nelse grade = 'C (재작성 필요)';"},{"id":"t6-09","ty":"order","lv":1,"game":false,"p":"품질 등급을 높은 것부터 정렬하세요.","steps":["S (90점 이상)","A (80점 이상)","B (70점 이상)","C (70점 미만)"],"h":"등급 체계는 점수 구간으로 나뉘며 90점 이상, 80점 이상, 70점 이상, 70점 미만으로 내려갑니다. 알파벳 순서(S 다음 A, B, C)가 곧 높은 등급에서 낮은 등급으로 가는 순서입니다.","w":"S → A → B → C 순서이며, B 이상이면 70점 이상으로 통과입니다.","an":"2교시 Step 5-4","src":"- **등급 체계**: S(90+) / A(80+) / B(70+) / C(70 미만)"},{"id":"t6-10","ty":"multi","lv":2,"game":true,"p":"'패션 블로그 특화' 체크 항목을 <b>모두<\/b> 고르세요.","o":["가격대 언급","스타일링 팁 수","체형/상황별 팁","이미지 해상도","발행 시간대"],"a":[0,1,2],"h":"코드의 '패션 블로그 특화 체크' 구역에는 가격대 언급, 스타일링 팁, 체형/상황별 팁, 이모지 수, CTA, 체크리스트 존재가 주석으로 정리되어 있습니다. 글자수·H2 개수·키워드 밀도는 '기본 SEO 체크'에 속합니다.","w":"가격대·스타일링 팁·체형/상황별 팁·이모지·CTA·체크리스트가 특화 체크입니다. 이미지나 발행 시간은 보지 않습니다.","an":"2교시 Step 5-3 · 패션 블로그 특화 체크","src":"// ═══ 패션 블로그 특화 체크 ═══\n// 1. 가격대 언급\nconst priceTerms = ['하이엔드', '미드', 'SPA', '합리적', '명품', '만원', '가격', '프리미엄'];\nconst hasPriceInfo = priceTerms.some(t => content.includes(t));"}]},{"id":"t7","title":"룩북 이미지와 Application Password","ref":"3교시 3-1~3-2","qs":[{"id":"t7-01","ty":"mc","lv":2,"game":true,"p":"카테고리 '쇼핑가이드'의 이미지 구도는?","o":["길거리 포토","flat lay (위에서 내려다보기)","무드보드 콜라주","인물 전신 에디토리얼"],"a":1,"h":"프롬프트 최적화 팁에는 카테고리별 구도가 정리되어 있습니다. 쇼핑가이드 프롬프트는 'Flat lay photography … overhead shot'으로, 아이템을 바닥에 펼쳐 놓고 위에서 찍는 구도입니다.","w":"쇼핑가이드는 아이템을 펼친 flat lay, 스타일링은 길거리, 트렌드는 무드보드, 리뷰는 제품 스튜디오, 룩북은 인물 전신입니다.","an":"3교시 3-1 · 💡 카테고리별 구도","src":"카테고리별 구도가 다릅니다:\n> - 쇼핑가이드 → flat lay (위에서 내려다보기)\n> - 스타일링 → 길거리 포토\n> - 트렌드 → 무드보드 콜라주\n> - 리뷰 → 제품 스튜디오 샷\n> - 룩북 → 인물 전신 에디토리얼"},{"id":"t7-02","ty":"mc","lv":1,"game":true,"p":"이미지 프롬프트에 'NO text'를 넣는 이유는?","o":["파일 크기를 줄이려고","저작권 표시를 넣으려고","생성 속도를 높이려고","이미지 속 한글이 깨지지 않게"],"a":3,"h":"이미지 AI는 그림 속 글자, 특히 한글을 제대로 그리지 못해 깨진 글자가 나오기 쉽습니다. 그래서 프롬프트 끝에 NO text, NO logos, NO watermarks를 붙여 글자 자체를 넣지 않도록 지시합니다.","w":"이미지 안에 한글이 깨져 나오지 않도록 'NO text'를 반드시 넣습니다.","an":"3교시 3-1 · 💡 프롬프트 최적화 팁","src":"영어가 이미지 AI에 더 잘 작동합니다\n> - \"NO text\" 반드시 포함 (이미지 안에 한글이 깨져 나오지 않도록)"},{"id":"t7-03","ty":"mc","lv":1,"game":true,"p":"이미지를 만드는 Google Gemini 노드의 Operation은?","o":["Generate an Image","Analyze","Message a model","Upload a File"],"a":0,"h":"Google Gemini 노드를 추가할 때 이미지 분석용 'Analyze'가 아니라 이미지를 만드는 작업을 찾아야 합니다. 설정 표에서 Resource는 Image, Model은 models/gemini-2.5-flash-image입니다.","w":"Resource Image, Operation 'Generate an Image', 모델 gemini-2.5-flash-image로 설정합니다.","an":"3교시 3-1 Step 3","src":"| **Resource** | `Image` |\n| **Operation** | `Generate an Image` |"},{"id":"t7-04","ty":"mc","lv":2,"game":true,"p":"로컬 HTTP에서 Application Password를 켜려면 wp-config.php에 무엇을 추가하나요?","o":["DB 비밀번호","HTTPS 인증서","application passwords 필터","새 관리자 계정"],"a":2,"h":"WordPress는 기본적으로 HTTPS에서만 Application Password를 켭니다. 로컬 HTTP에서는 wp-config.php의 '행복한 배포' 줄 위에 add_filter( 'wp_is_application_passwords_available', '__return_true' ); 한 줄을 넣어 활성화합니다.","w":"WordPress는 기본적으로 HTTPS에서만 활성화되므로 <code>add_filter( 'wp_is_application_passwords_available', '__return_true' );<\/code>를 추가합니다.","an":"3교시 3-2 Step 1","src":"WordPress는 기본적으로 HTTPS에서만 Application Password가 활성화됩니다. 로컬 HTTP 환경에서는 필터를 수동 추가해야 합니다."},{"id":"t7-05","ty":"mc","lv":2,"game":true,"p":"n8n WordPress Credential의 Password 칸에 넣는 것은?","o":["WordPress 로그인 비밀번호","Application Password","OpenAI API 키","DB 비밀번호"],"a":1,"h":"WordPress Credential 설정 표의 Password 칸 '주의' 열에는 '일반 로그인 비밀번호 아님!'이라고 적혀 있습니다. 3-2 Step 2에서 프로필 화면 맨 아래에서 발급해 복사해 둔 API 전용 비밀번호를 넣습니다.","w":"프로필에서 만든 Application Password를 넣습니다. URL은 http://wordpress입니다.","an":"3교시 3-2 Step 3","src":"| **Password** | (복사한 Application Password) | 일반 로그인 비밀번호 아님! |"},{"id":"t7-06","ty":"ox","lv":1,"game":true,"p":"이미지 AI에는 한국어보다 영어 프롬프트가 더 잘 작동한다.","a":true,"h":"3-1의 이미지 프롬프트 최적화 팁 첫 줄은 이미지 AI가 어떤 언어의 프롬프트를 더 잘 이해하는지 알려 줍니다. 실제로 Code_이미지프롬프트의 카테고리별 프롬프트도 모두 영어 문장으로 작성되어 있습니다.","w":"맞습니다. 그래서 이미지 프롬프트는 영어로 쓰고, 주제만 끼워 넣습니다.","an":"3교시 3-1 · 💡 팁","src":"영어가 이미지 AI에 더 잘 작동합니다\n> - \"NO text\" 반드시 포함 (이미지 안에 한글이 깨져 나오지 않도록)"},{"id":"t7-07","ty":"ox","lv":2,"game":true,"p":"Application Password가 유출되면 계정 비밀번호 전체를 바꾸는 수밖에 없다.","a":false,"h":"Application Password는 일반 비밀번호와 별도로 발급되는 API 전용 비밀번호입니다. 자료는 유출되더라도 필요하면 그 비밀번호만 개별 폐기할 수 있다는 점을 장점으로 듭니다.","w":"틀렸습니다. Application Password는 API 전용이라 유출돼도 해당 비밀번호만 개별 폐기할 수 있습니다.","an":"3교시 3-2 · 🎯 왜 필요한가","src":"일반 비밀번호로 API를 쓰면 보안이 약합니다. WordPress는 API 전용 비밀번호(`Application Password`)를 별도 발급할 수 있으며, 유출돼도 필요시 개별 폐기 가능합니다."},{"id":"t7-08","ty":"match","lv":2,"game":false,"p":"카테고리와 이미지 구도를 연결하세요.","pairs":[["스타일링","길거리 포토"],["트렌드","무드보드 콜라주"],["리뷰","제품 스튜디오 샷"],["룩북","인물 전신 에디토리얼"]],"h":"카테고리별 프롬프트에서 스타일링은 'street photography style', 트렌드는 'mood board collage', 리뷰는 'product photography … studio lighting', 룩북은 'Full-body fashion editorial portrait'를 씁니다. 영어 키워드를 우리말 구도 이름과 맞춰 보세요.","w":"카테고리마다 구도가 다르게 자동 선택되도록 Code_이미지프롬프트에 프롬프트를 나눠 두었습니다.","an":"3교시 3-1 · 💡 카테고리별 구도","src":"스타일링 → 길거리 포토\n> - 트렌드 → 무드보드 콜라주\n> - 리뷰 → 제품 스튜디오 샷\n> - 룩북 → 인물 전신 에디토리얼"},{"id":"t7-09","ty":"order","lv":2,"game":false,"p":"wp-config.php를 수정하는 순서를 맞추세요.","steps":["WordPress 컨테이너 접속","nano 에디터 설치","wp-config.php 열기","'행복한 배포' 줄 위에 필터 추가","저장 후 wordpress 재시작"],"h":"먼저 docker exec로 WordPress 컨테이너 안에 들어가고, apt-get으로 편집기를 설치한 뒤 그 편집기로 wp-config.php를 엽니다. Ctrl + W로 '행복한 배포'를 찾아 그 줄 위에 필터를 넣고, 저장·종료 후 docker compose restart wordpress로 재시작합니다.","w":"<code>docker exec -it fashion_wordpress bash<\/code> → nano 설치 → 편집 → 필터 추가 → <code>docker compose restart wordpress<\/code> 순서입니다.","an":"3교시 3-2 Step 1","src":"→ `행복한 배포` 검색 → Enter\n(한국어 WordPress는 \"행복한 배포!\" 또는 \"Happy publishing!\")\n\n해당 줄 바로 **위**에 아래 한 줄 추가:"},{"id":"t7-10","ty":"multi","lv":2,"game":true,"p":"WordPress Credential 연결 실패 시 확인할 것을 <b>모두<\/b> 고르세요.","o":["URL이 http://wordpress인가","Username이 정확한가","Application Password인가","Gemini 키가 맞는가","Temperature가 0.7인가"],"a":[0,1,2],"h":"연결 실패 체크리스트는 네 가지입니다. URL이 Docker 서비스 이름 주소인지, Username이 정확한지, 일반 비밀번호가 아닌 API 전용 비밀번호를 썼는지, 필터 추가 후 컨테이너를 재시작했는지 확인합니다.","w":"URL, Username, Application Password, 그리고 필터 추가 후 재시작 여부를 확인합니다. Gemini 키나 Temperature는 무관합니다.","an":"3교시 3-2 Step 3 · ❌ 연결 실패 시","src":"URL이 `http://wordpress` 인가? (localhost 아님)\n> - Username이 정확한가?\n> - Application Password (일반 비밀번호 아님)를 썼는가?\n> - wp-config.php 필터 추가 후 wordpress 컨테이너 재시작했는가?"}]},{"id":"t8","title":"초안 저장과 이미지 반영","ref":"3교시 3-3~3-4","qs":[{"id":"t8-01","ty":"mc","lv":1,"game":true,"p":"WordPress 노드로 글을 저장할 때 Status 값은?","o":["publish","draft","private","pending"],"a":1,"h":"WordPress 노드 Additional Fields의 Status 드롭다운에서 '초안으로 저장'하는 값을 고릅니다. 운영 5계명 1번도 AI 글을 바로 발행하지 말고 본인 확인 후 발행하라고 합니다.","w":"Status를 draft(초안)로 두고, 사람이 검토한 뒤 발행합니다.","an":"3교시 3-3 Step 2","src":"드롭다운 선택: `draft` (초안으로 저장)"},{"id":"t8-02","ty":"mc","lv":2,"game":true,"p":"n8n 기본 WordPress 노드로 이미지를 올릴 수 없는 이유는?","o":["이미지 용량 제한 때문에","Gemini가 PNG를 못 만들어서","Docker가 막아서","Post·Page·User만 지원해서"],"a":3,"h":"n8n의 기본 WordPress 노드가 지원하는 리소스는 글·페이지·사용자 세 가지뿐입니다. 이미지·파일 같은 Media 업로드는 지원하지 않으므로 REST API의 Media 엔드포인트를 HTTP Request로 직접 호출합니다.","w":"기본 WordPress 노드는 Post·Page·User만 지원하므로 /wp-json/wp/v2/media를 HTTP Request로 직접 호출합니다.","an":"3교시 3-4 · 📌 왜 별도 작업이 필요한가","src":"n8n의 **기본 WordPress 노드는 Post·Page·User만 지원**하고 Media(이미지/파일) 업로드는 지원하지 않습니다. 따라서 WordPress REST API의 Media 엔드포인트를 **HTTP Request 노드**로 직접 호출해야 합니다."},{"id":"t8-03","ty":"mc","lv":2,"game":true,"p":"이미지 업로드용 HTTP Request의 Body Content Type은?","o":["n8n Binary File","JSON","Form URLencoded","Raw Text"],"a":0,"h":"Send Body를 켠 뒤 Body Content Type에서 Form URLencoded나 JSON을 고르면 이미지가 전송되지 않습니다. 이미지 바이너리를 그대로 보내는 n8n 전용 형식을 선택하고, Input Data Field Name은 data로 둡니다.","w":"Body Content Type을 n8n Binary File로, Input Data Field Name을 data로 둬야 이미지가 전송됩니다.","an":"3교시 3-4 Step 1-5","src":"**Body Content Type** 드롭다운 → **`n8n Binary File`** 선택\n\n > ⚠️ `Form URLencoded`나 `JSON` 아님! 반드시 `n8n Binary File`을 선택해야 이미지 바이너리가 전송됩니다."},{"id":"t8-04","ty":"mc","lv":2,"game":true,"p":"미디어 업로드 응답에서 글의 대표 이미지로 연결하는 필드는?","o":["source_url","slug","id","mime_type"],"a":2,"h":"미디어 업로드 응답의 핵심 필드는 2개입니다. source_url은 본문 <img src>에 넣을 이미지 주소이고, 나머지 하나인 미디어 번호를 WordPress 글의 Featured Media에 연결합니다.","w":"id는 Featured Media로, source_url은 본문 이미지 주소로 씁니다.","an":"3교시 3-4 Step 1-7 · 핵심 필드","src":"**핵심 필드 2개**:\n- `id` → WordPress 글의 **Featured Media**로 연결할 번호\n- `source_url` → 본문 HTML에 **``**로 삽입할 URL"},{"id":"t8-05","ty":"mc","lv":3,"game":true,"p":"업로드 시 'rest_upload_sideload_error'가 나는 원인은?","o":["Application Password 오타","Content-Type과 실제 형식 불일치","카테고리 ID 불일치","Temperature 과다"],"a":1,"h":"업로드 요청 헤더의 Content-Type은 image/png로 지정되어 있습니다. 실제 이미지가 JPEG 등 다른 형식이면 헤더와 바이너리 형식이 어긋나 업로드 오류가 나므로, Gemini Output의 mimeType을 확인해 맞춰야 합니다.","w":"Content-Type 헤더와 실제 바이너리 형식이 다를 때 납니다. Gemini Output Binary 탭의 mimeType을 확인해 맞춥니다.","an":"3교시 체크포인트 · 문제 6","src":"\"rest_upload_sideload_error\"** → Content-Type과 실제 바이너리 형식 불일치. `image/png`이 맞는지 확인."},{"id":"t8-06","ty":"ox","lv":2,"game":true,"p":"이미 만든 'My WordPress' Credential을 HTTP Request의 Basic Auth로 재사용할 수 있다.","a":false,"h":"이미 만든 My WordPress Credential은 n8n WordPress 노드 전용입니다. 자료는 HTTP Request에서는 이것을 그대로 쓸 수 없어 User와 Application Password로 Basic Auth Credential을 따로 만들어야 한다고 설명합니다.","w":"틀렸습니다. HTTP Request용으로 Basic Auth Credential(My WordPress Basic Auth)을 따로 만들어야 합니다.","an":"3교시 3-4 Step 1-3 · 💡","src":"이미 `My WordPress` Credential이 있지만, 그건 n8n WordPress 노드 전용이라 HTTP Request에서는 재사용할 수 없습니다. Basic Auth용을 별도로 만들어야 합니다."},{"id":"t8-07","ty":"ox","lv":1,"game":true,"p":"대표 이미지(Featured Media)는 본문 이미지와 별도로 지정해야 한다.","a":true,"h":"Featured Media는 WordPress에서 '대표 이미지'라 부르며 글 목록·SNS 공유 시 썸네일로 쓰입니다. 본문에 <img>로 삽입된 이미지와는 다른 개념이라, 3-2에서 Featured Media ID 필드를 추가로 지정합니다.","w":"맞습니다. 본문 img와 별개로 WordPress 노드의 Featured Media ID 필드에 미디어 ID를 넣습니다.","an":"3교시 3-4 Step 3-2 · Q3-3","src":"Featured Media**는 WordPress에서 \"대표 이미지\"라고 부르며, 블로그 목록/SNS 공유 시 썸네일로 쓰이는 이미지입니다. 본문에 삽입된 이미지와 별개로 따로 지정해야 합니다."},{"id":"t8-08","ty":"match","lv":2,"game":false,"p":"업로드 응답 필드와 쓰임을 연결하세요.","pairs":[["id","Featured Media ID"],["source_url","본문 img 태그의 주소"],["slug","미디어 파일명"]],"h":"Code_미디어병합은 업로드 응답(media)에서 세 값을 꺼냅니다. media.id는 미디어ID로, media.source_url은 <img src>와 미디어URL로, media.slug는 미디어파일명으로 저장됩니다.","w":"Code_미디어병합에서 id는 미디어ID, source_url은 미디어URL, slug는 미디어파일명으로 넘깁니다.","an":"3교시 3-4 Step 2-3","src":"// WordPress Featured Media에 쓸 미디어 ID\n 미디어ID: media.id,\n 미디어URL: media.source_url,\n 미디어파일명: media.slug,"},{"id":"t8-09","ty":"order","lv":2,"game":false,"p":"3교시 최종 워크플로우의 후반부 순서를 맞추세요.","steps":["Google Gemini (이미지 생성)","HTTP Request (Media 업로드)","Code_미디어병합 (img 삽입)","WordPress (Post + Featured Media)","Code_최종보고"],"h":"3교시 최종 구조에서 이미지 프롬프트 다음은 이미지를 만들고(Binary 출력) → 그 이미지를 WordPress Media로 올린 뒤 → 응답의 ID와 URL로 본문에 img를 넣고 → 대표 이미지를 지정해 글을 만들고 → 마지막에 결과를 보고합니다. 업로드가 끝나야 ID를 쓸 수 있다는 의존 관계를 따라가 보세요.","w":"이미지를 만들고, 미디어 라이브러리에 올린 뒤, 본문에 넣고 글을 저장하고, 최종 보고를 출력합니다.","an":"3교시 3-4 · 최종 워크플로우 구조","src":"→ Google Gemini (이미지 생성, Binary 출력)\n → HTTP Request (WordPress Media 업로드) ⭐ 신규\n → Code_미디어병합 (Media ID + 본문에 img 삽입) ⭐ 신규\n → WordPress (Post Create + Featured Media) ⭐ 수정\n → Code_최종보고"},{"id":"t8-10","ty":"multi","lv":2,"game":true,"p":"Code_미디어병합이 하는 일을 <b>모두<\/b> 고르세요.","o":["업로드 실패 시 에러 반환","H1 뒤에 figure 이미지 삽입","미디어ID를 다음 노드로 전달","이미지를 새로 생성","글을 바로 발행"],"a":[0,1,2],"h":"코드 설명에 따르면 Code_미디어병합은 업로드 실패 시 에러를 반환해 WordPress 노드로 가지 않게 막고, <figure>로 감싼 이미지를 H1 제목 뒤(없으면 맨 앞)에 삽입합니다. 또 미디어ID·미디어URL을 다음 노드로 넘깁니다.","w":"업로드 실패를 막고, H1 뒤에 이미지 블록을 넣고, 미디어ID·URL을 WordPress 노드로 넘깁니다. 이미지 생성과 저장은 다른 노드가 합니다.","an":"3교시 3-4 Step 2-4","src":"- **라인 7~14**: 업로드 실패 시 에러 반환하여 WordPress 노드로 안 가도록 방어\n- **라인 17~27**: `` 태그로 이미지 래핑 (WordPress 기본 스타일과 호환)\n- **라인 30~37**: H1 제목 뒤에 이미지를 삽입 (제목 먼저, 그 다음 히어로 이미지)\n- **라인 40~51**: 다음 노드로 넘길 데이터 구성"}]},{"id":"t9","title":"올인원 파이프라인과 스케줄","ref":"4교시 4-1~4-2","qs":[{"id":"t9-01","ty":"mc","lv":1,"game":true,"p":"실습 4에서 Edit Fields에 남기는 입력 필드는?","o":["주제","카테고리","키워드","목표글자수"],"a":1,"h":"실습 4는 기존 Edit Fields의 6개 필드 중 하나만 남기고 나머지는 지웁니다. 주제·키워드·타겟독자 등은 이후 AI가 자동으로 만들기 때문이며, 남는 필드의 값 예시는 '스타일링'입니다.","w":"카테고리 하나만 남기고, 주제·키워드 등은 아이디어 생성 단계에서 자동으로 정해집니다.","an":"4교시 4-1 Step 2","src":"기존 6개 필드 중 **\"카테고리\" 필드만 남기고** 나머지는 삭제.\n\n| Name | Type | Value |\n|------|------|-------|\n| `카테고리` | String | `스타일링` |\n\n나머지는 이후 AI가 자동 생성하므로 필요 없습니다."},{"id":"t9-02","ty":"mc","lv":2,"game":true,"p":"품질 게이트로 쓰는 노드와 조건은?","o":["IF: 글자수 ≥ 3000","Switch: 카테고리별","Code: 등급 S만","IF: 품질점수 ≥ 70"],"a":3,"h":"품질 체크 Code 뒤에 조건 분기 노드를 넣고 이름을 IF_품질게이트로 바꿉니다. 조건은 Number 타입으로 {{ $json.품질점수 }}가 larger or equal 70인지 비교합니다.","w":"IF_품질게이트는 <code>{{ $json.품질점수 }}<\/code>가 70 이상(larger or equal)인지 검사합니다.","an":"4교시 4-1 Step 7","src":"- Type: **Number**\n- Value 1 (Expression): `{{ $json.품질점수 }}`\n- Operation: `larger or equal`\n- Value 2: `70`"},{"id":"t9-03","ty":"mc","lv":2,"game":true,"p":"Code_아이디어선택이 5개 아이디어 중 하나를 고르는 기준은?","o":["예상인기도가 가장 높은 것","제목이 가장 긴 것","첫 번째 아이디어","무작위 선택"],"a":0,"h":"Code_아이디어선택은 파싱한 아이디어 배열을 (b.예상인기도 || 0) - (a.예상인기도 || 0)로 내림차순 정렬한 뒤 ideas[0]을 best로 고릅니다. 정렬 후 맨 앞에 오는 것이 어떤 아이디어인지 생각해 보세요.","w":"예상인기도로 정렬한 뒤 첫 번째(최고) 아이디어를 고르고, 나머지는 후보아이디어로 보관합니다.","an":"4교시 4-1 Step 5","src":"// 인기도 가장 높은 것 1개 선택\nideas.sort((a, b) => (b.예상인기도 || 0) - (a.예상인기도 || 0));\nconst best = ideas[0];"},{"id":"t9-04","ty":"mc","lv":2,"game":true,"p":"요일별 로테이션 Code가 주말에 반환하는 값과 효과는?","o":["'트렌드' → 정상 실행","null → 오류 발생","빈 배열 → 워크플로우 중단","'룩북' → 정상 실행"],"a":2,"h":"dayMap에는 1(월)~5(금)만 정의되어 있어 일요일(0)·토요일(6)에는 category가 undefined입니다. 이때 코드는 return [];로 아이템을 하나도 내보내지 않아 다음 노드가 실행되지 않습니다.","w":"주말에는 <code>return []<\/code>로 빈 배열을 반환해 워크플로우가 자연스럽게 멈춥니다.","an":"4교시 4-2 Step 2","src":"const today = new Date().getDay();\nconst category = dayMap[today];\n\nif (!category) {\n // 주말 → 빈 배열 반환 → 워크플로우 중단\n return [];"},{"id":"t9-05","ty":"mc","lv":1,"game":true,"p":"Schedule Trigger가 실제로 매일 실행되게 하려면?","o":["Execute step을 누른다","워크플로우를 Active(Publish)로","Save만 한다","Credential을 새로 만든다"],"a":1,"h":"n8n 2.x에서 Save는 초안 저장일 뿐이라 Schedule Trigger가 동작하지 않습니다. 워크플로우 우측 상단의 Inactive 토글을 바꾸거나 배포 버튼을 눌러야 하며, Docker 컨테이너도 24시간 실행 중이어야 합니다.","w":"Inactive 토글을 Active(Publish)로 바꾸고, Docker 컨테이너가 계속 실행 중이어야 합니다.","an":"4교시 4-2 Step 3","src":"Schedule Trigger를 실제로 동작시키려면:\n\n- 워크플로우 우측 상단 **\"Inactive\" 토글을 \"Active\"로 변경** (또는 \"Publish\")\n- Docker 컨테이너가 24시간 실행 중이어야 스케줄 동작"},{"id":"t9-06","ty":"ox","lv":2,"game":true,"p":"PC가 꺼져 있어도 Docker의 Schedule Trigger는 계속 실행된다.","a":false,"h":"Schedule Trigger는 n8n 컨테이너가 돌아가는 내 PC 위에서 동작합니다. 자료는 로컬 PC가 꺼지면 Docker가 멈춰 Schedule도 중단되므로, 24시간 운영에는 VPS로 옮기라고 안내합니다.","w":"틀렸습니다. PC가 꺼지면 Schedule도 멈춥니다. 24시간 운영은 VPS(클라우드 서버)로 옮겨야 합니다.","an":"4교시 4-2 · ⚠️ 중요","src":"로컬 PC가 꺼져있으면 Schedule도 중단됩니다. 24시간 자동 운영이 필요하면 **VPS(클라우드 서버)**로 마이그레이션해야 합니다."},{"id":"t9-07","ty":"ox","lv":1,"game":true,"p":"품질점수가 70점 미만이면 FALSE 분기에서 '재작성 필요' 로그를 남긴다.","a":true,"h":"IF 노드의 false 출력에는 Code_재작성필요 노드가 연결됩니다. 이 노드는 품질 기준 미달 상태 메시지와 함께 주제, 품질점수, 이슈, 권장조치, 기록일시를 남깁니다.","w":"맞습니다. FALSE 분기의 Code_재작성필요가 주제·점수·이슈·권장조치를 기록합니다.","an":"4교시 4-1 Step 9","src":"출력 → 새 Code 노드 → 이름 `Code_재작성필요`:\n\n```javascript\nreturn [{\n json: {\n 상태: '❌ 품질 기준 미달 — 재작성 필요',"},{"id":"t9-08","ty":"match","lv":1,"game":false,"p":"요일과 자동 선택되는 카테고리를 연결하세요.","pairs":[["월","트렌드"],["화","스타일링"],["수","리뷰"],["목","쇼핑가이드"],["금","룩북"]],"h":"요일별 로테이션 코드의 dayMap은 getDay() 값 1~5를 키로, 카테고리를 값으로 가집니다. 카테고리 순서는 사전 준비 Step 5에서 만든 순서(트렌드→스타일링→리뷰→쇼핑가이드→룩북)를 월요일부터 그대로 따릅니다.","w":"dayMap은 월 트렌드 · 화 스타일링 · 수 리뷰 · 목 쇼핑가이드 · 금 룩북입니다.","an":"4교시 4-2 Step 2","src":"const dayMap = {\n 1: '트렌드', // 월\n 2: '스타일링', // 화\n 3: '리뷰', // 수\n 4: '쇼핑가이드', // 목\n 5: '룩북' // 금"},{"id":"t9-09","ty":"order","lv":2,"game":false,"p":"실습 4 파이프라인 앞부분을 순서대로 정렬하세요.","steps":["Edit Fields (카테고리)","Code_시즌판별","OpenAI (아이디어 5개)","Code_아이디어선택","OpenAI (SEO 구조)"],"h":"실습 4는 카테고리만 입력받은 뒤 코드로 시즌을 판별하고, AI가 아이디어 5개를 만들면 코드가 가장 인기 있는 1개를 고릅니다. 그 주제로 다시 AI가 SEO 구조를 만들고 본문 작성으로 이어집니다.","w":"카테고리를 받아 시즌을 판별하고, 아이디어 5개 중 최고 1개를 골라 SEO 구조를 만듭니다.","an":"4교시 4-1 · 완성 워크플로우 구조","src":"→ Edit Fields (카테고리만 입력)\n → Code #1 (시즌 판별 + 주제 후보 생성 힌트)\n → OpenAI #1 (아이디어 5개 생성)\n → Code #2 (최고 인기도 아이디어 1개 선택)\n → OpenAI #2 (SEO 구조 생성)"},{"id":"t9-10","ty":"multi","lv":2,"game":true,"p":"Code_시즌판별이 출력하는 정보를 <b>모두<\/b> 고르세요.","o":["시즌","시즌키워드","시즌이벤트","품질점수","대표이미지 URL"],"a":[0,1,2],"h":"Code_시즌판별은 현재 월로 계절을 정하고, 계절별 키워드 배열과 이벤트 문자열을 함께 정합니다. return 객체에는 카테고리, 계절, 계절 키워드, 계절 이벤트, 생성일시가 담깁니다.","w":"카테고리·시즌·시즌키워드·시즌이벤트·생성일시를 출력합니다. 품질점수와 이미지는 이후 단계에서 생깁니다.","an":"4교시 4-1 Step 3","src":"카테고리: category,\n 시즌: season,\n 시즌키워드: seasonKeywords,\n 시즌이벤트: seasonEvents,"}]},{"id":"t10","title":"운영 노하우와 핵심 정리","ref":"4교시 4-3 · 핵심 정리 · 치트시트","qs":[{"id":"t10-01","ty":"mc","lv":1,"game":true,"p":"패션 블로그 운영 5계명의 1번은?","o":["매일 3개 발행","Draft 저장 필수","이미지는 실사만","SEO는 수동 체크"],"a":1,"h":"운영 5계명의 첫째는 AI 글을 절대 바로 발행하지 말고 본인 확인 후 발행하라는 원칙입니다. 그래서 WordPress 노드의 Status도 초안 상태로 저장하도록 설정했습니다.","w":"1. Draft 저장 필수 · 2. E-E-A-T · 3. 시즌 타이밍 · 4. 다양한 체형 표현 · 5. API 비용 감시입니다.","an":"4교시 4-3 · 운영 5계명","src":"Draft 저장 필수**: AI 글을 절대 바로 발행하지 마세요. 본인 확인 후 발행."},{"id":"t10-02","ty":"mc","lv":2,"game":true,"p":"검색 유입을 극대화하려면 시즌 글을 언제 발행해야 하나요?","o":["시즌 시작 당일","시즌 중간","시즌이 끝난 직후","시즌 시작 1~2개월 전"],"a":3,"h":"운영 5계명 3번 '시즌 타이밍'은 검색 유입을 극대화하려면 시즌이 시작되기 전에 미리 발행하라고 합니다. 기간은 '개월' 단위로 제시되어 있습니다.","w":"시즌 시작 1~2개월 전에 발행해야 검색 유입이 극대화됩니다.","an":"4교시 4-3 · 운영 5계명 3","src":"시즌 타이밍**: 시즌 시작 **1~2개월 전**에 발행해야 검색 유입 극대화"},{"id":"t10-03","ty":"mc","lv":1,"game":true,"p":"월 20~30개 글 기준 예상 총비용은?","o":["월 $5~8","월 $50~80","완전 무료","월 $200"],"a":0,"h":"비용 표에서 Docker·n8n·WordPress·MariaDB는 무료이고, Google Gemini 이미지도 무료 티어입니다. 따라서 총합은 OpenAI GPT-4o-mini(본문+SEO) 비용과 같습니다.","w":"OpenAI 비용 약 $5~8만 듭니다. 대신 월 60~100시간을 절감합니다.","an":"4교시 4-3 · 💰 예상 비용","src":"| Docker / n8n / WordPress / MariaDB | **무료** |\n| OpenAI GPT-4o-mini (본문+SEO) | 약 $5~8 |\n| Google Gemini (이미지) | 무료 티어 |\n| **총합** | **월 $5~8** |"},{"id":"t10-04","ty":"mc","lv":2,"game":true,"p":"모든 데이터를 지우므로 절대 치면 안 되는 명령은?","o":["docker compose down","docker compose stop","docker compose down -v","docker compose restart"],"a":2,"h":"치트시트에서 stop과 down은 데이터를 유지합니다. 그러나 down에 볼륨까지 삭제하는 옵션을 붙이면 DB·WordPress·n8n 데이터가 모두 지워지므로 '절대 치지 마세요'라고 주석 처리되어 있습니다.","w":"<code>docker compose down -v<\/code>는 볼륨까지 삭제합니다. down·stop은 데이터를 유지합니다.","an":"Docker 기본 명령어 치트시트","src":"⚠️ 절대 치지 마세요 — 모든 데이터 삭제"},{"id":"t10-05","ty":"mc","lv":2,"game":false,"p":"핵심 정리에서 OpenAI 응답 텍스트를 가리키는 Expression은?","o":["{{ $json.text }}","{{ $json.message.content }}","{{ $json.content[0].text }}","{{ $now.toFormat() }}"],"a":1,"h":"핵심 Expression 정리에는 AI 서비스별 응답 경로가 나뉘어 있습니다. Gemini는 $json.text, Claude는 $json.content[0].text이고, OpenAI는 message 객체 안의 content 필드를 가리킵니다.","w":"OpenAI는 <code>$json.message.content<\/code>, Gemini는 <code>$json.text<\/code>, Claude는 <code>$json.content[0].text<\/code>입니다.","an":"4시간 학습 핵심 정리 · 핵심 Expression","src":"// Gemini 텍스트 응답\n{{ $json.text }}\n\n// Anthropic(Claude) 응답\n{{ $json.content[0].text }}\n\n// OpenAI 응답\n{{ $json.message.content }}"},{"id":"t10-06","ty":"ox","lv":1,"game":true,"p":"워크플로우를 JSON으로 내보내려면 ⋮ 메뉴의 Download를 누른다.","a":true,"h":"'워크플로우 내보내기 방법'은 각 워크플로우 우측 상단의 ⋮ 메뉴에서 내려받기 항목을 눌러 JSON 파일로 저장하는 것입니다. 가져올 때는 Create Workflow 드롭다운의 'Import from File'을 씁니다.","w":"맞습니다. 가져올 때는 Create Workflow 드롭다운의 'Import from File'을 씁니다.","an":"교육 산출물 · 워크플로우 내보내기","src":"우측 상단 **⋮** → **Download** → JSON 파일 저장"},{"id":"t10-07","ty":"ox","lv":2,"game":true,"p":"Gemini 이미지가 상업 사용 가능하니, 실제 브랜드 제품 사진도 허가 없이 쓸 수 있다.","a":false,"h":"자주 묻는 질문 Q3은 Gemini로 생성한 이미지 자체는 상업 사용이 가능하다고 답합니다. 다만 단서가 붙어 있어, 실제 브랜드 제품 사진은 별도 허가가 필요하다고 덧붙입니다.","w":"틀렸습니다. Gemini 생성 이미지는 상업 사용이 가능하지만, 실제 브랜드 제품 사진은 별도 허가가 필요합니다.","an":"자주 묻는 질문 Q3","src":"Gemini로 생성한 이미지는 상업 사용 가능합니다. 단, 실제 브랜드 제품 사진은 별도 허가 필요."},{"id":"t10-08","ty":"match","lv":1,"game":false,"p":"운영 주기와 할 일을 연결하세요.","pairs":[["매일","초안 검토 후 발행"],["주간","트렌드 키워드 업데이트"],["월간","API 비용 확인"]],"h":"운영 체크리스트는 주기를 매일·주간·월간으로 나눕니다. 매일은 초안 검토와 n8n 에러 확인, 주간은 키워드 업데이트와 경쟁 블로그 분석, 월간은 API 비용 확인과 Docker 이미지 업그레이드입니다.","w":"매일 초안 검토·에러 확인, 주간 키워드·경쟁 블로그 분석, 월간 API 비용·Docker 업그레이드입니다.","an":"4교시 4-3 · 운영 체크리스트","src":"| **매일** | 초안 검토 후 발행 / n8n 에러 확인 |\n| **주간** | 트렌드 키워드 업데이트 / 경쟁 블로그 분석 |\n| **월간** | API 비용 확인 / Docker 이미지 업그레이드 |"},{"id":"t10-09","ty":"order","lv":1,"game":false,"p":"자동 생성된 초안을 발행하기까지의 순서를 맞추세요.","steps":["검토 URL로 내용 확인","본인 실착 경험 1~2단락 추가","AI 이미지 적절성 확인","발행 버튼 클릭"],"h":"최종 보고 Code의 다음단계 배열은 검토 URL로 내용 확인 → 본인의 실착 경험·인사이트 추가 → AI 이미지 적절성 확인 → 발행 순서로 적혀 있습니다. 검토하고 보강한 뒤 마지막에 발행한다는 흐름입니다.","w":"최종 보고의 '다음단계' 순서입니다. 사람의 경험을 더해야 E-E-A-T를 충족합니다.","an":"3교시 3-3 Step 4 · 다음단계","src":"'1. 검토 URL 클릭하여 내용 확인',\n '2. 본인의 실착 경험·인사이트 1~2단락 추가',\n '3. AI 이미지 적절성 확인',\n '4. 발행 버튼 클릭'"},{"id":"t10-10","ty":"multi","lv":2,"game":true,"p":"'핵심 개념 Top 5'에 들어 있는 것을 <b>모두<\/b> 고르세요.","o":["Docker 내부 통신","Expression","Credential","RSS 트렌드 수집","MCP 연동"],"a":[0,1,2],"h":"핵심 개념 Top 5는 Docker 내부 통신, {{ }} 안에 JS로 이전 노드 데이터를 참조하는 표기, Code 노드, IF 노드, API 키를 한 번 등록해 여러 노드에서 공유하는 인증 정보입니다. 보기 중 이 다섯 개념에 해당하는 것을 고르세요.","w":"Top 5는 Docker 내부 통신 · Expression · Code 노드 · IF 노드 · Credential입니다. RSS·MCP는 다음 단계 학습입니다.","an":"4시간 학습 핵심 정리 · 핵심 개념 Top 5","src":"1. **Docker 내부 통신**: `localhost:8080` (브라우저) vs `http://wordpress` (n8n 안에서)\n2. **Expression**: `{{ }}` 안에 JS로 이전 노드 데이터 참조\n3. **Code 노드**: 복잡한 파싱, 조건 분기, 데이터 가공\n4. **IF 노드**: 품질 게이트처럼 분기 처리\n5. **Credential**: API 키는 한 번만 등록, 여러 노드에서 공유"}]}]};
const app=document.getElementById('app');
if(!BANK){app.innerHTML='<p>문제은행 데이터가 없습니다. <code>python develop/build.py</code>로 빌드한 파일을 여세요.</p>';return;}

/* ── 상수 · 인덱스 ─────────────────────── */
const TYPES={mc:['객관식','--ty-mc'],multi:['복수 선택','--ty-multi'],ox:['O / X','--ty-ox'],match:['짝 맞추기','--ty-match'],order:['순서 맞추기','--ty-order'],num:['계산','--ty-num']};
const GUIDE={mc:'알맞은 답을 하나 고르세요.',multi:'알맞은 것을 모두 고르세요.',ox:'맞으면 O, 틀리면 X를 고르세요.',
  match:'왼쪽 항목을 누른 뒤 짝이 되는 오른쪽 항목을 누르세요. 연결된 항목을 다시 누르면 풀립니다.',
  order:'첫 번째부터 순서대로 클릭하세요. 번호가 붙은 항목을 다시 누르면 그 번호부터 뒤 번호가 지워집니다.',num:'숫자만 입력하세요.'};
/* 게임 모드 목록 — 새 게임은 여기에 항목을 추가한다 (설정·출제 유형·규칙 문구를 모드별로) */
const GAME_MODES={
  timeattack:{title:'⚡ 타임어택',desc:'제한시간 안에 풀수록 점수가 커집니다. 시간이 다 되면 오답!',
    types:['mc','ox','multi'],times:[5,7,10,15],defaultTime:10},
};
// 게임 선택 화면의 버튼 3칸: 모드 id 또는 null(준비 중). 새 게임을 만들면 null 자리에 id를 넣는다.
const GAME_SLOTS=['timeattack',null,null];
const PAL=['--ty-mc','--ty-order','--ty-match','--ty-num','--ty-multi'];
const LETTER='ABCDEFGH';
const TABS=BANK.tabs, QMAP={}, QTAB={};
TABS.forEach((t,ti)=>{t.idx=ti;t.qs.forEach(q=>{QMAP[q.id]=q;QTAB[q.id]=t;});});
