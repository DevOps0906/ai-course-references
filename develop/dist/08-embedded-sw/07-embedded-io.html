const BANK={"id":"emb-io","code":"EIO","title":"임베디드 SW · 임베디드 입출력 (3일, Raspberry Pi GPIO·PWM)","subtitle":"Pi 설정·Device Tree · libgpiod GPIO·이벤트 · PWM·모터·초음파","course":"08 · 임베디드 · 시스템 SW","source":"08-AI_CAMPUS-main/EmbeddedIO-day1~3/*.pdf + src","salt":"emb-io","version":1,"updated":"2026-10-16","tabs":[{"id":"t1","title":"Pi 4 개요 · 40핀 · 전기 주의","ref":"EmbeddedIO Day1 p.2–9","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"Raspberry Pi 4의 GPIO 핀이 쓰는 신호 전압은?","o":["5 V","3.3 V","1.8 V","12 V"],"a":1,"h":"보드 소개 슬라이드는 Raspberry Pi 4의 GPIO 전압 바로 아래에 '5V 내성 없음'을 적어 둡니다. 전기적 주의 슬라이드도 GPIO에 5V를 넣으면 SoC가 망가진다고 경고합니다. 5V보다 낮은, 전용 신호 전압을 골라 보세요.","w":"Pi 4의 GPIO는 3.3 V이며 5 V 내성이 없습니다. 5 V는 전원 핀(물리 2·4번)에서 나오는 전압일 뿐 GPIO 신호 전압이 아닙니다.","an":"EmbeddedIO Day1 p.2","src":"3.3V\nGPIO 전압\n5V 내성 없음"},{"id":"t1-02","ty":"mc","lv":1,"game":true,"p":"Pi 4에서 하드웨어 PWM 2채널이 나오는 GPIO는?","o":["GPIO17 · 27","GPIO5 · 6","GPIO18 · 19","GPIO14 · 15"],"a":2,"h":"Pi 4는 ESP32의 LEDC 16채널과 달리 하드웨어 PWM이 2채널뿐이며, 그 두 채널이 나오는 핀이 정해져 있습니다. Day 3 핀 표에서 PWM0은 LED·서보, PWM1은 패시브 부저에 쓰이는 핀입니다. 서로 이웃한 두 BCM 번호를 떠올려 보세요.","w":"하드웨어 PWM은 GPIO18(PWM0)과 GPIO19(PWM1) 2채널뿐입니다. GPIO14·15는 UART, GPIO5·6은 버튼 입력에 쓰입니다.","an":"EmbeddedIO Day1 p.2 · p.5","src":"하드웨어 PWM LEDC 16 채널 2 채널 (GPIO18 · 19)"},{"id":"t1-03","ty":"mc","lv":2,"game":true,"p":"Pi 4에는 ADC가 없습니다. 이 과정에서 아날로그 값을 읽는 방법은?","o":["SoC 내장 12-bit ADC","외부 칩 PCF8591","하드웨어 PWM 채널","/dev/gpiomem 레벨 읽기"],"a":1,"h":"ESP32에는 12-bit ADC가 내장되어 있지만 Pi 4의 아날로그 입력 칸은 '없음'으로 적혀 있습니다. 그래서 Day 4 I2C 시간에 아날로그 값을 디지털로 바꿔 주는 별도의 칩을 버스에 붙여 읽습니다. 보드 밖에서 변환을 맡는 부품이라는 점이 핵심입니다.","w":"Pi 4는 ADC가 없어 I2C로 연결하는 PCF8591을 씁니다(Day 4). 12-bit ADC 내장은 ESP32 쪽 특징입니다.","an":"EmbeddedIO Day1 p.2 · p.5 ESP32 vs Pi 표","src":"아날로그 입력 ADC 내장 (12-bit) 없음 → PCF8591 (Day 4)"},{"id":"t1-04","ty":"mc","lv":2,"game":true,"p":"부팅 초기에 config.txt를 읽어 Device Tree를 만드는 것은?","o":["Linux 커널","사용자 프로그램","드라이버 probe","GPU 펌웨어(start4.elf)"],"a":3,"h":"부팅 흐름은 EEPROM 부트로더 → GPU 펌웨어 → Linux 커널 순서로 이어집니다. config.txt는 커널이 뜨기 전, 부팅 초기에 한 번만 읽혀 Device Tree로 만들어집니다. 부트로더 다음 단계에서 CPU가 아닌 쪽의 펌웨어가 이 일을 맡습니다.","w":"config.txt는 부팅 초기에 GPU 펌웨어(start4.elf)가 한 번만 읽어 Device Tree를 만듭니다. 커널과 드라이버는 그 결과를 받아 동작합니다.","an":"EmbeddedIO Day1 p.6 부팅 흐름","src":"config.txt 는 한 번만 읽힌다\n부팅 초기에 GPU 펌웨어가 읽어 Device Tree 를 만든다 .\n고치면 반드시 재부팅 ."},{"id":"t1-05","ty":"mc","lv":3,"game":true,"p":"<code>gpioset -c gpiochip0 17=1<\/code>을 실행하면 실제로 High가 되는 핀은?","o":["물리 11번","물리 17번","물리 29번","물리 12번"],"a":0,"h":"40핀 헤더에는 물리 번호(1~40)와 BCM 번호(GPIOxx)가 따로 있으며, <code>gpioset<\/code> 같은 코드에는 BCM 번호를 씁니다. 오늘 배선 표에서 GPIO17은 LED에 연결된 핀으로, 물리 번호와 짝지어 적혀 있습니다. 17이라는 숫자가 물리 위치가 아니라는 점에 주의하세요.","w":"코드는 BCM 번호를 쓰므로 17은 GPIO17, 즉 물리 11번 핀입니다. 물리 29번은 GPIO5(버튼), 물리 12번은 GPIO18입니다.","an":"EmbeddedIO Day1 p.7 40핀 헤더","src":"물리 이름 오늘 쓰는 곳\n11 GPIO17 LED (7 교시 )\n29 GPIO5 버튼 (8 교시 )\n9 GND 브레드보드 GND 레일\n코드는 BCM 번호\ngpioset -c gpiochip0 17=1\n→ 물리 11 번 핀"},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"config.txt를 고치면 재부팅하지 않아도 바로 적용된다.","a":false,"h":"config.txt는 부팅 초기에 GPU 펌웨어가 한 번만 읽어 Device Tree를 만듭니다. 이미 부팅이 끝난 뒤에는 다시 읽히지 않으므로, 고친 내용을 반영하려면 그 '한 번'이 다시 일어나야 합니다. 슬라이드가 '반드시' 해야 한다고 적은 일을 떠올려 보세요.","w":"config.txt는 부팅 때 한 번만 읽히므로 고치면 반드시 재부팅해야 합니다.","an":"EmbeddedIO Day1 p.6","src":"config.txt 는 한 번만 읽힌다\n부팅 초기에 GPU 펌웨어가 읽어 Device Tree 를 만든다 .\n고치면 반드시 재부팅 ."},{"id":"t1-07","ty":"ox","lv":1,"game":true,"p":"GPIO는 핀당 약 16mA까지라서 LED에는 220Ω 저항을 직렬로 단다.","a":true,"h":"전기적 주의 슬라이드는 GPIO가 핀당 흘릴 수 있는 전류를 16mA로 제한합니다. 그래서 LED에는 전류를 제한하는 저항을 직렬로 달고, 모터처럼 큰 전류가 필요한 부품은 드라이버 칩이나 릴레이를 거칩니다. 문장의 수치와 저항값이 슬라이드와 같은지 확인해 보세요.","w":"핀당 전류가 16mA 수준이므로 LED에는 반드시 220Ω을 직렬로 연결합니다. 모터처럼 큰 전류가 필요한 부품은 드라이버 칩이나 릴레이를 거칩니다.","an":"EmbeddedIO Day1 p.8","src":"핀당 16mA\nLED 에는 반드시 220Ω 직렬 . 모터는 드라이버 칩 ·\n릴레이를 거친다 ."},{"id":"t1-08","ty":"match","lv":2,"game":false,"p":"ESP32(MCU)와 비교한 Raspberry Pi 4의 특징을 항목과 연결하세요.","pairs":[["프로그램 올리기","보드 안에서 gcc로 빌드"],["핀 접근","커널 드라이버 → 장치 파일"],["전원 → 내 코드","약 20~40초(부팅)"],["실시간성","스케줄러 지연 존재"]],"h":"Pi 4는 Linux가 도는 컴퓨터라서 PC에서 빌드해 올리는 ESP32와 달리 보드 안에서 직접 컴파일합니다. 핀은 레지스터를 직접 만지지 않고 커널 드라이버가 만든 장치 파일로 접근하며, 부팅에 수십 초가 걸리고 스케줄러 때문에 µs 단위 예측이 어렵습니다. 각 항목을 '운영체제가 있다'는 관점에서 짝지어 보세요.","w":"Pi 4는 Linux가 돌아 보드 안에서 빌드하고, 핀은 커널 드라이버가 만든 장치 파일로 접근합니다. 부팅에 20~40초가 걸리고 스케줄러 지연이 있어 ESP32처럼 µs 단위 예측은 어렵습니다.","an":"EmbeddedIO Day1 p.5 ESP32 vs Pi 표","src":"운영체제 없음 (FreeRTOS 정도 ) Linux\n프로그램 올리기 PC 에서 빌드 → USB 업로드 보드 안에서 gcc 로 빌드\n전원 → 내 코드 1 초 미만 약 20~40 초 ( 부팅 )\n핀 접근 레지스터 · Arduino API 직접 커널 드라이버 → 장치 파일\n아날로그 입력 ADC 내장 (12-bit) 없음 → PCF8591 (Day 4)\n하드웨어 PWM LEDC 16 채널 2 채널 (GPIO18 · 19)\n실시간성 µs 예측 가능 스케줄러 지연 존재"},{"id":"t1-09","ty":"order","lv":2,"game":false,"p":"전원을 넣은 뒤 내 프로그램이 핀을 만지기까지의 순서로 놓으세요.","steps":["EEPROM 부트로더","GPU 펌웨어가 config.txt 읽기","Linux 커널과 드라이버 probe","/dev 장치 파일 생성","내 프로그램이 핀 접근"],"h":"전원을 넣으면 EEPROM 부트로더가 GPU 펌웨어(start4.elf)를 올리고, 펌웨어가 config.txt를 읽어 Device Tree를 만듭니다. 이어서 커널이 뜨고 드라이버가 probe되어 /dev 장치 파일을 만들며, 장치 파일이 생긴 뒤에야 사용자 프로그램이 핀에 닿습니다. 화살표 흐름을 그대로 따라가 보세요.","w":"부트로더 → GPU 펌웨어(config.txt, Device Tree) → 커널·드라이버 probe → /dev/gpiochip0 생성 → 사용자 프로그램 순입니다. ESP32는 ROM 부트로더 뒤 바로 setup()/loop()가 돕니다.","an":"EmbeddedIO Day1 p.6","src":"장치 파일이 생겨야 시작\n드라이버가 /dev/gpiochip0 을 만든 뒤에야 사용자 프로그램이\n핀에 닿는다 ."},{"id":"t1-10","ty":"multi","lv":3,"game":true,"p":"배선할 때 지켜야 할 전기적 주의를 모두 고르세요.","o":["GPIO에 5V를 넣지 않는다","배선 변경은 poweroff 후에 한다","5V 출력 센서는 분압 후 연결한다","모터는 GPIO 핀에 직접 연결한다","보드는 브레드보드 한쪽에만 꽂는다"],"a":[0,1,2],"h":"전기적 주의 슬라이드는 네 가지를 강조합니다. GPIO는 3.3V 전용이라 5V를 넣으면 SoC가 망가지고, 5V 핀이 바로 옆에 있으니 배선은 전원을 끈 뒤 바꾸며, HC-SR04 Echo처럼 5V를 내는 센서는 저항으로 분압해 연결합니다. 핀당 전류 한계(16mA)와 어긋나는 보기는 걸러 내세요.","w":"5V 입력 금지, poweroff 후 배선 변경, 5V 출력(HC-SR04 Echo 등)의 분압이 맞습니다. 모터는 드라이버 칩·릴레이를 거쳐야 하고, Extension Board는 브레드보드 가운데 홈에 걸쳐 꽂아야 단락이 나지 않습니다.","an":"EmbeddedIO Day1 p.8–9","src":"3.3V 전용\nGPIO 에 5V 를 넣으면 SoC 가 망가진다 . 보드\n교체 외에 방법이 없다 .\n!\n핀당 16mA\nLED 에는 반드시 220Ω 직렬 . 모터는 드라이버 칩 ·\n릴레이를 거친다 .\n!\n5V 단락 금지\n물리 2 · 4 번 (5V) 은 3V3 · GPIO 바로 옆 . 배선\n변경은 poweroff 후 .\n!\n5V 출력은 분압\nHC-SR04 Echo 처럼 5V 를 내는 센서는 저항 분압\n후 연결 (Day 3)."}]},{"id":"t2","title":"접속 설정 · Device Tree · UART","ref":"EmbeddedIO Day1 p.10–18 · Wi-Fi 고정 IP 문서","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"모니터 없이 USB로 첫 접속하려고 bootfs/user-data 끝에 넣는 설정은?","o":["enable_usb_gadget: true","dtoverlay=pwm-2chan","do_serial_hw 0","dtparam=spi=on"],"a":0,"h":"모니터 없이 첫 접속하려면 SD 카드를 Pi에 꽂기 전에 bootfs/user-data 맨 끝에 <code>rpi:<\/code> 블록을 추가합니다. 그 아래에 USB 가젯 기능을 켜는 키를 스페이스 2칸 들여 써 true로 두며, 탭을 쓰거나 키를 중복하면 YAML 오류로 전체가 무시됩니다. 이 설정은 cloud-init으로 첫 부팅에만 적용됩니다.","w":"<code>rpi:<\/code> 아래 <code>enable_usb_gadget: true<\/code>를 넣으면 첫 부팅 때 cloud-init이 USB gadget을 켭니다. 탭을 쓰거나 키가 중복되면 user-data 전체가 무시됩니다.","an":"EmbeddedIO Day1 p.11","src":"# bootfs/user-data 맨 끝\nrpi:\nenable_usb_gadget: true\n확인할 것 이유\n스페이스 2 칸 ( 탭 금지 ) YAML 오류면 user-data 전체 무시\nrpi: 가 이미 있으면 한 번만 키 중복 금지\nPi 에 꽂기 전에 첫 부팅에만 적용 (cloud-init)"},{"id":"t2-02","ty":"mc","lv":2,"game":true,"p":"PuTTY 접속 시 'Connection refused'가 뜨면 가장 먼저 의심할 원인은?","o":["충전 전용 USB 케이블","RNDIS 드라이버 미설치","Imager에서 SSH를 안 켬","PC 포트 전력 부족"],"a":2,"h":"USB 접속 진단 표는 증상마다 '멈춘 곳'과 해결을 짝지어 둡니다. Connection refused는 주소까지는 닿았지만 22번 포트에서 받아 주는 sshd가 없다는 뜻이며, 해결은 SD 카드를 굽는 단계로 돌아가는 것입니다. Imager 설정에서 빠뜨린 항목을 떠올려 보세요.","w":"Connection refused는 sshd가 없다는 뜻이라 Imager에서 SSH를 켜고 다시 굽습니다. 충전 전용 케이블이면 어댑터 자체가 안 보이고, 드라이버 문제는 '알 수 없는 장치'로 나타납니다.","an":"EmbeddedIO Day1 p.12 증상 표","src":"화면에 보이는 증상 멈춘 곳 해결\nncpa.cpl 에 새 어댑터가 없음 USB-C 케이블 데이터 케이블 · user-data 확인 · 3 분 대기\n장치 관리자 \" 알 수 없는 장치 (RNDIS)\" usb0 rpi-usb-gadget-driver-setup.exe 설치\nrpi-07.local 을 찾을 수 없음 주소 Host Name 에 10.12.194.1\nConnection refused sshd Imager 에서 SSH 켜고 다시 굽기"},{"id":"t2-03","ty":"mc","lv":1,"game":true,"p":"nmcli로 Wi-Fi를 잡기 전에 가장 먼저 해야 하는 일은?","o":["apt full-upgrade 실행","rpi-usb-gadget off","SSH 서비스 재시작","Wi-Fi 국가 코드 설정"],"a":3,"h":"nmcli 절차는 ① 설정 → ② 검색 → ③ 접속 → ④ 확인 순서입니다. ①을 빠뜨리면 rfkill이 무선을 차단해 AP 목록이 비어 보이고, 이때는 ①을 한 뒤 재부팅해야 합니다. <code>raspi-config nonint do_wifi_country<\/code>가 무엇을 정하는지 생각해 보세요.","w":"<code>raspi-config nonint do_wifi_country KR<\/code>로 국가 코드부터 설정해야 rfkill 차단이 풀립니다. AP 목록이 비어 있으면 국가 코드 설정 후 재부팅합니다.","an":"EmbeddedIO Day1 p.14","src":"# ① 국가 코드부터 ( 없으면 rfkill 차단)\nsudo raspi-config nonint do_wifi_country KR\n# ② 검색\nsudo nmcli dev wifi rescan\nnmcli dev wifi list"},{"id":"t2-04","ty":"mc","lv":1,"game":true,"p":"블루투스를 끄고 PL011 UART를 GPIO14·15로 돌려받는 config.txt 줄은?","o":["dtoverlay=pwm-2chan","dtoverlay=disable-bt","dtparam=i2c_arm=on","dtparam=spi=on"],"a":1,"h":"Pi 4의 PL011(ttyAMA0)은 독립 클럭이라 보율이 정확하지만 기본으로는 Bluetooth에 연결되어 있고, GPIO14·15에는 CPU 클럭을 따르는 mini UART(ttyS0)가 붙어 있습니다. 블루투스를 끄는 overlay를 config.txt에 넣으면 PL011을 GPIO로 돌려받습니다. <code>dtoverlay=<\/code> 뒤에 붙는 이름을 떠올려 보세요.","w":"<code>dtoverlay=disable-bt<\/code>는 블루투스를 끄고 PL011을 GPIO14·15로 돌려받습니다. Day 4 ESP32 통신의 전제이며, hciuart 서비스도 disable합니다.","an":"EmbeddedIO Day1 p.16 · p.18","src":"UART 클럭 기본 연결 특징\nPL011 (ttyAMA0) 독립 클럭 Bluetooth 보율이 정확\nmini UART (ttyS0) CPU 코어 클럭 GPIO14 · 15 클럭이 바뀌면 보율이 흔들림\ndisable-bt\n블루투스를 끄고 PL011 을 GPIO14 · 15 로 돌려받는다 . Day 4\nESP32 통신의 전제 ."},{"id":"t2-05","ty":"mc","lv":3,"game":true,"p":"재부팅 후 <code>ls -l /dev/serial0<\/code>가 ttyS0을 가리킵니다. 알맞은 조치는?","o":["config.txt를 다시 확인","정상이니 그대로 진행","dialout 그룹에서 빠지기","libgpiod 1.x로 낮추기"],"a":0,"h":"/dev/serial0은 '지금 GPIO에 연결된 UART'를 가리키는 별명입니다. 기대 결과는 PL011인 ttyAMA0이며, mini UART인 ttyS0을 가리킨다면 disable-bt overlay가 적용되지 않은 것입니다. 슬라이드는 이 경우 어느 파일을 다시 살피라고 하는지 확인해 보세요.","w":"serial0이 ttyAMA0(PL011)이면 정상이고 ttyS0(mini UART)이면 disable-bt 설정이 빠진 것이라 config.txt를 다시 봅니다. mini UART는 코어 클럭에 따라 보율이 흔들립니다.","an":"EmbeddedIO Day1 p.16 · p.18","src":"/dev/serial0\n\" 지금 GPIO 에 연결된 UART\" 를 가리키는 별명.\nttyAMA0 이면 OK, ttyS0 이면 config.txt 재확인 ."},{"id":"t2-06","ty":"ox","lv":2,"game":true,"p":"<code>dtoverlay=pwm-2chan  # PWM<\/code>처럼 줄 끝에 주석을 달아도 overlay는 정상 적용된다.","a":false,"h":"config.txt에서는 <code>#<\/code> 주석을 줄 끝에 붙이면 주석까지 overlay 이름의 일부로 읽힙니다. 그러면 'pwm-2chan # PWM'이라는 이름의 overlay를 찾게 되어 적용되지 않으므로, 주석은 별도 줄에 써야 합니다. 이 규칙에 비추어 문장을 판단해 보세요.","w":"줄 끝 주석은 overlay 이름의 일부로 읽혀 적용되지 않습니다. 주석은 반드시 별도 줄에 씁니다.","an":"EmbeddedIO Day1 p.16","src":"줄 끝 주석 금지 dtoverlay=pwm-2chan # PWM → 주석까지 overlay 이름으로 읽혀 적용되지 않는다 . 주석은 별도 줄에 ."},{"id":"t2-07","ty":"ox","lv":2,"game":true,"p":"<code>nmap -sn<\/code> 검색에 나타나지 않은 IP는 반드시 비어 있으므로 바로 고정 IP로 써도 된다.","a":false,"h":"nmap에 응답하지 않은 주소라도 정말 비어 있다고 단정할 수는 없습니다. 전원이 꺼져 있거나 응답을 차단하는 기기, DHCP 예약 주소는 검색 결과에 나타나지 않을 수 있습니다. 그래서 문서는 공유기 관리자 페이지에서 할당 범위와 예약 목록을 확인하라고 합니다.","w":"꺼져 있거나 응답을 차단하는 기기, DHCP 예약 주소는 검색에 안 나올 수 있습니다. 공유기의 DHCP 범위와 예약 목록을 확인한 뒤 고정 IP를 고릅니다.","an":"Wi-Fi 고정 IP 문서 §5 미사용 IP 후보 검색","src":"검색되지 않은 주소가 반드시 비어 있는 것은 아닙니다. 전원이 꺼져 있거나 응답을 차단하는 기기, DHCP 예약 주소는 나타나지 않을 수 있습니다. 공유기 관리자 페이지에서 DHCP 할당 범위와 예약 목록을 확인하고 고정 IP를 선정하세요."},{"id":"t2-08","ty":"match","lv":1,"game":false,"p":"Device Tree 구성 요소와 역할을 연결하세요.","pairs":[["bcm2711-rpi-4-b.dtb","보드 기본 설명서"],["dtparam","기존 장치의 설정을 바꿈"],["dtoverlay","조각(.dtbo)을 덧붙임"],["/dev/serial0","지금 GPIO에 연결된 UART 별명"]],"h":"Device Tree는 보드 기본 설명서(.dtb)에서 시작합니다. 여기에 dtparam은 이미 있는 장치의 설정을 바꾸고(i2c_arm=on), dtoverlay는 .dtbo 조각을 덧붙여(pwm-2chan) 최종 Device Tree를 만듭니다. /dev/serial0은 그와 별개로 현재 GPIO에 붙은 UART를 가리키는 별명입니다.","w":"기본 .dtb에 dtparam(i2c_arm=on 등)으로 설정을 바꾸고 dtoverlay(pwm-2chan 등)로 조각을 덧붙여 최종 Device Tree가 됩니다. serial0은 현재 GPIO UART를 가리키는 별명입니다.","an":"EmbeddedIO Day1 p.17–18","src":"bcm2711-rpi-4-b.dtb\n보드 기본 설명서\n(I2C · SPI 는 꺼져 있음 )\n+ dtparam\n기존 장치의 설정을 바꿈\ni2c_arm=on · spi=on\n+ dtoverlay\n조각을 덧붙임 (.dtbo)\npwm-2chan · disable-bt"},{"id":"t2-09","ty":"order","lv":2,"game":false,"p":"USB 접속에서 Wi-Fi 접속으로 갈아타는 순서로 놓으세요.","steps":["USB 꽂은 채 재부팅해 wlan0 확인","PC를 같은 Wi-Fi에 연결","wlan0 IP로 새 SSH 세션 접속","rpi-usb-gadget off 후 poweroff","5V 3A 어댑터로 부팅"],"h":"갈아타기는 USB 길을 살려 둔 채 Wi-Fi 길을 먼저 확인하는 순서입니다. 재부팅해 wlan0이 자동으로 붙는지 보고, PC를 같은 Wi-Fi에 붙여 wlan0 IP로 새 세션을 연 뒤에야 USB 가젯을 끄고 전원을 내립니다. 마지막에는 PC USB 대신 5V 3A 어댑터로 부팅합니다.","w":"wlan0 자동 연결과 Wi-Fi SSH를 먼저 확인한 뒤에만 gadget을 끕니다. 먼저 끄면 들어갈 길이 없고, 마지막에 어댑터 전원으로 바꿔 저전압(throttled)을 피합니다.","an":"EmbeddedIO Day1 p.15","src":"USB 꽂은 채 sudo reboot\nwlan0 이 자동으로 다시 붙는지 확인\n2\nPC 를 같은 Wi-Fi 에\n—\n3\nPuTTY 새 세션 = wlan0 IP\nUSB 가 꽂힌 동안 .local 은 USB 쪽으로 풀릴 수 있다\n4\nsudo rpi-usb-gadget off → poweroff\nWi-Fi 접속이 확인된 뒤에만 ! 먼저 끄면 들어갈 길이 없다"},{"id":"t2-10","ty":"multi","lv":3,"game":false,"p":"<code>nmcli connection modify<\/code>에서 'unknown connection' 오류가 났습니다. 알맞은 대응을 모두 고르세요.","o":["connection show로 프로필 이름 확인","연결된 기존 프로필 이름으로 modify","프로필이 없으면 먼저 wifi connect 시도","같은 이름이 있어도 connection add 추가","SSID와 프로필 이름은 항상 같다고 본다"],"a":[0,1,2],"h":"'unknown connection'은 SSID는 보여도 그 이름의 NetworkManager 연결 프로필이 없다는 뜻이며, SSID와 프로필 이름은 다를 수 있습니다. 먼저 <code>nmcli connection show<\/code>로 실제 프로필 이름을 확인하고, 기존 프로필이 연결되어 있으면 그 이름으로 modify합니다. 프로필이 아예 없다면 일반 연결부터 시도해 프로필을 만듭니다.","w":"이 오류는 그 이름의 프로필이 없다는 뜻입니다. 프로필 이름(예: preconfigured)을 확인해 그 이름으로 고치고, 없으면 연결을 먼저 시도합니다. 이미 있는 프로필을 중복 생성하면 안 됩니다.","an":"Wi-Fi 고정 IP 문서 §3","src":"기존 프로필이 정상적으로 Wi-Fi에 연결되어 있다면, **새 프로필을 중복 생성하지 말고 기존 프로필 이름으로** 이후 `connection modify` 명령을 실행하세요."}]},{"id":"t3","title":"장치 파일 · 권한 · libgpiod v2","ref":"EmbeddedIO Day1 p.19–24 · Day2 p.4–6","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"이 과정의 C 예제가 전제로 하는 libgpiod 버전은?","o":["1.x","2.x","0.x","3.x"],"a":1,"h":"개발 환경 슬라이드는 <code>pkg-config --modversion libgpiod<\/code>로 버전을 확인하게 하며, v1과 v2는 C API가 완전히 다르다고 경고합니다. 인터넷 예제 대부분은 <code>gpiod_line_request_output<\/code> 같은 옛 함수를 쓰지만, 이 환경에서는 <code>gpiod_request_config<\/code>가 보이는 새 API만 컴파일됩니다. 슬라이드 제목의 '반드시'가 가리키는 주 버전을 떠올려 보세요.","w":"libgpiod는 반드시 2.x를 씁니다. v1과 v2는 C API가 완전히 달라 인터넷의 v1 예제(gpiod_line_request_output 등)는 컴파일되지 않습니다.","an":"EmbeddedIO Day1 p.19 · Day2 p.4","src":"개발 환경 — libgpiod 는 반드시 2.x 6 교시\nsudo apt install -y build-essential \\\ngpiod libgpiod-dev i2c-tools\npkg-config --modversion libgpiod # 2.2.1\n패키지 쓰는 곳\nbuild-essential gcc · make\ngpiod gpioset · gpioinfo · gpiomon\nlibgpiod-dev gpiod.h (Day 2~5)\ni2c-tools i2cdetect (Day 4)\nv1 과 v2 는 C API 가 완전히 다르다\n인터넷 예제 대부분은 v1 (gpiod_line_request_output …)\nv2 예제에는 gpiod_request_config 같은 이름이 있다"},{"id":"t3-02","ty":"mc","lv":1,"game":true,"p":"<code>crw-rw---- root gpio /dev/gpiochip0<\/code>에서 sudo 없이 쓰게 해 주는 열쇠는?","o":["소유자 root","주 번호 254","문자 장치 c","gpio 그룹"],"a":3,"h":"<code>crw-rw----<\/code>는 소유자와 그룹만 읽고 쓸 수 있다는 뜻이고, 소유자는 root, 그룹은 gpio입니다. 따라서 root가 아닌 사용자는 그 그룹에 속해야 sudo 없이 장치 파일을 열 수 있습니다. Imager로 만든 사용자는 gpio·i2c·spi·dialout 그룹에 이미 들어 있습니다.","w":"권한이 소유자·그룹만 읽기·쓰기이므로 gpio 그룹이면 sudo 없이 씁니다. 254는 드라이버를 가리키는 주 번호, c는 문자 장치 표시입니다.","an":"EmbeddedIO Day1 p.20","src":"crw-rw---- 1 root gpio 254, 0 Oct 13 14:41 /dev/gpiochip0\nc\n문자 장치\n바이트 단위로 읽고 씀\nrw-rw----\n소유자 · 그룹만\n읽기 · 쓰기\ngpio\n이 그룹이면\nsudo 없이 사용\n254, 0\n주 번호 ( 드라이버 )\n부 번호 ( 몇 번째)\nImager 로 만든 사용자는 gpio · i2c · spi · dialout 그룹에 이미 들어 있다 . 하드웨어 프로그램은 sudo 로 실행하지 않는다 . \n그룹을 추가했다면 다시 로그인"},{"id":"t3-03","ty":"mc","lv":2,"game":true,"p":"GPIO8을 gpioset으로 요청하면 busy가 나는 이유는?","o":["spi0 CS0이 이미 쥐고 있어서","GPIO8은 5V 전용 핀이라서","libgpiod 1.x만 지원해서","pull-up을 안 줘서"],"a":0,"h":"GPIO 라인은 먼저 요청한 쪽이 소유하며, 같은 라인을 다시 요청하면 EBUSY가 납니다. 소유자는 프로세스뿐 아니라 커널 드라이버일 수도 있어서, SPI 같은 버스 드라이버가 쥔 핀은 일반 GPIO로 쓸 수 없습니다. GPIO8이 SPI 버스에서 맡는 역할을 떠올려 보세요.","w":"GPIO8은 SPI 드라이버(spi0 CS0)가 이미 쥐고 있어 busy입니다. 버스 핀은 일반 GPIO로 쓰지 않습니다.","an":"EmbeddedIO Day1 p.22","src":"드라이버도 소유자\nGPIO8 은 spi0 CS0 이 쥐고 있어 \nbusy. 버스 핀은 일반 GPIO 로 쓰지 \n않는다"},{"id":"t3-04","ty":"mc","lv":2,"game":true,"p":"sysfs GPIO(/sys/class/gpio)를 쓰지 않는 이유로 자료가 든 것은?","o":["mmap보다 빨라 위험해서","root만 읽을 수 있어서","번호가 바뀌고 해제가 안 돼서","ARM 보드에는 없어서"],"a":2,"h":"Linux에서 GPIO는 이제 /dev/gpiochip0 문자 장치로 다룹니다. 예전 sysfs 방식은 폐기되었는데, 자료는 GPIO17이 그 방식에서 529처럼 다른 숫자로 보이고 프로세스가 끝난 뒤 정리가 남지 않는다는 점을 이유로 듭니다. 번호와 해제, 두 문제를 함께 떠올려 보세요.","w":"sysfs GPIO는 폐기되었습니다. 번호가 바뀌고(17 → 529) 프로세스가 끝나도 자동 해제가 안 되기 때문입니다. 지금은 /dev/gpiochip0과 libgpiod를 씁니다.","an":"EmbeddedIO Day1 p.21","src":"드라이버만 레지스터를 만지고 , 내 프로그램은 open · read · write · ioctl 로 부탁한다 . sysfs GPIO(/sys/class/gpio) 는 폐기 \n— 번호가 바뀌고 (17 → 529) 해제가 안 남는다"},{"id":"t3-05","ty":"mc","lv":3,"game":true,"p":"Ctrl+C 핸들러를 sigaction으로 걸 때 SA_RESTART를 주지 않는 이유는?","o":["kill -9도 잡으려고","커널이 라인을 반납하게","시그널을 무시하려고","poll이 EINTR로 깨어나게"],"a":3,"h":"신호 핸들러는 <code>g_stop = 1<\/code>만 세우고, 실제 정리는 메인 루프가 <code>while (!g_stop)<\/code>을 다시 확인할 때 합니다. 그런데 프로그램은 대부분 poll이나 nanosleep 안에서 잠들어 있으므로, 신호가 왔을 때 이 시스템 콜이 자동 재시작되지 않고 중단되어 돌아와야 루프가 깨어납니다. 중단된 시스템 콜이 돌려주는 오류 코드를 떠올려 보세요.","w":"SA_RESTART가 없어야 poll·nanosleep이 EINTR로 깨어나 루프가 g_stop을 확인하고 LED를 끈 뒤 반납합니다. kill -9는 잡을 수 없어 이때는 커널이 라인만 해제합니다.","an":"EmbeddedIO Day2 p.6 · src/gpio_common.h","src":"sa.sa_handler = on_sigint; /* SA_RESTART 없음 */\nsigaction(SIGINT, &sa, NULL);\nwhile (!g_stop) { ... }\nset_value(req, 17, INACTIVE);\ngpiod_line_request_release(req);\n종료 방법 라인 LED 끄기\nCtrl+C ( 핸들러 있음 ) 반납 실행됨\nCtrl+C ( 핸들러 없음 ) 커널이 해제 실행 안 됨\nkill -9 커널이 해제 실행 안 됨\nSA_RESTART 를 주지 않아야 poll · nanosleep 이 EINTR 로 깨어나 루프가 g_stop 을 확인한다"},{"id":"t3-06","ty":"ox","lv":1,"game":true,"p":"Ctrl+C나 kill -9로 프로세스가 끝나면 커널이 fd를 닫고 라인을 해제한다.","a":true,"h":"라인 요청은 프로세스가 가진 fd에 묶여 있습니다. 프로세스가 어떤 식으로 끝나든 fd가 닫히면 커널이 라인을 정리하므로, 핸들러가 없거나 kill -9로 죽어도 라인은 반납됩니다. 다만 이 경우에는 LED 끄기 같은 내 정리 코드가 실행되지 않습니다.","w":"프로세스가 끝나면 fd가 닫히고 커널이 라인을 정리합니다. 다만 핸들러 없이 끝나면 LED 끄기 같은 마무리 코드는 실행되지 않습니다.","an":"EmbeddedIO Day1 p.22 · Day2 p.6","src":"자동 해제\nCtrl+C · kill -9 로 프로세스가 끝나면 fd \n가 닫히고 커널이 정리한다"},{"id":"t3-07","ty":"ox","lv":2,"game":true,"p":"하드웨어 프로그램은 권한 문제를 피하려고 항상 sudo로 실행하는 것이 원칙이다.","a":false,"h":"/dev/gpiochip0은 root 소유이지만 gpio 그룹에도 읽기·쓰기 권한이 있습니다. Imager로 만든 사용자는 gpio·i2c·spi·dialout 그룹에 이미 들어 있으므로 권한 문제는 그룹으로 해결하며, 슬라이드는 하드웨어 프로그램 실행 방식에 대해 분명한 원칙을 적어 둡니다. 그룹을 새로 추가했다면 다시 로그인해야 반영됩니다.","w":"사용자는 이미 gpio·i2c·spi·dialout 그룹에 들어 있으므로 하드웨어 프로그램을 sudo로 실행하지 않습니다. 그룹을 새로 추가했다면 다시 로그인합니다.","an":"EmbeddedIO Day1 p.20","src":"Imager 로 만든 사용자는 gpio · i2c · spi · dialout 그룹에 이미 들어 있다 . 하드웨어 프로그램은 sudo 로 실행하지 않는다 . \n그룹을 추가했다면 다시 로그인"},{"id":"t3-08","ty":"match","lv":1,"game":false,"p":"설치 패키지와 쓰는 곳을 연결하세요.","pairs":[["build-essential","gcc · make"],["gpiod","gpioset · gpioinfo · gpiomon"],["libgpiod-dev","gpiod.h 헤더"],["i2c-tools","i2cdetect"]],"h":"개발 환경 슬라이드는 패키지마다 쓰는 곳을 표로 정리합니다. build-essential은 컴파일러와 빌드 도구를, gpiod는 명령줄 GPIO 도구를, 이름에 -dev가 붙은 패키지는 C 코드가 include할 헤더를, i2c-tools는 I2C 버스 검색 도구를 줍니다. 각 패키지가 주는 것이 실행 파일인지 헤더인지 구분해 보세요.","w":"build-essential은 컴파일러, gpiod는 명령 도구, libgpiod-dev는 C 헤더, i2c-tools는 Day 4의 i2cdetect를 줍니다.","an":"EmbeddedIO Day1 p.19","src":"패키지 쓰는 곳\nbuild-essential gcc · make\ngpiod gpioset · gpioinfo · gpiomon\nlibgpiod-dev gpiod.h (Day 2~5)\ni2c-tools i2cdetect (Day 4)"},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"libgpiod v2로 출력 라인을 요청하는 순서로 놓으세요.","steps":["gpiod_chip_open으로 칩 열기","settings에 방향·초기값 지정","line_config에 offset과 settings 연결","request_config에 consumer 이름 지정","chip_request_lines로 커널에 요청"],"h":"libgpiod v2는 재료를 내 메모리에 차곡차곡 쌓은 뒤 마지막에 한 번 커널에 요청합니다. 먼저 칩을 열고, 방향·초기값을 담은 settings를 만들고, 어떤 offset에 그 settings를 쓸지 line_config로 묶고, 요청 전체의 consumer 이름을 request_config에 적습니다. 커널이 처음 알게 되는 것은 마지막 요청 단계입니다.","w":"chip → settings → line_config → request_config 순으로 재료를 만들고 request에서 처음 커널로 갑니다. 성공하면 이 프로세스가 라인의 소유자가 됩니다.","an":"EmbeddedIO Day2 p.5 · src/gpio_common.h","src":"① chip\ngpiod_chip_open\n② settings\n방향 · 초기값 · bias · \nedge\n③ line_config\noffset ↔ settings\n④ \nrequest_config\nconsumer 이름\n⑤ request\n커널에 요청 → 소유\n⑥ release\n반납"},{"id":"t3-10","ty":"multi","lv":3,"game":false,"p":"libgpiod v2 요청 과정에 대한 설명으로 옳은 것을 모두 고르세요.","o":["settings·config는 내 메모리 재료다","요청 직후 settings를 free해도 된다","settings 하나를 여러 라인에 재사용한다","칩을 닫으면 요청도 함께 풀린다","line_config 단계에서 커널이 소유한다"],"a":[0,1,2],"h":"슬라이드는 ②~④(settings·line_config·request_config)가 내 메모리의 재료일 뿐이고 커널은 아직 모른다고 설명합니다. 그래서 요청 직후 free해도 되고, 같은 settings를 여러 라인에 재사용할 수 있습니다. 커널이 처음 개입하는 것은 ⑤ request이며, 요청만 있으면 칩은 닫아도 됩니다.","w":"②~④는 커널이 아직 모르는 재료라 요청 직후 free해도 되고 여러 라인에 재사용할 수 있습니다. 요청이 성공하면 칩을 닫아도 요청은 유지됩니다.","an":"EmbeddedIO Day2 p.5 · src/gpio_common.h","src":"②~④ 는 내 메모리의 재료\n커널은 아직 모른다 . 요청 직후 free 해도 된다 .\n같은 settings 를 여러 라인에 재사용 .\n⑤ 에서 처음 커널로\n성공하면 이 프로세스가 소유자 — gpioinfo 에 consumer, 다른 \n요청은 busy.\n요청만 있으면 칩은 닫아도 된다"}]},{"id":"t4","title":"다중 출력 · 레지스터 · bias","ref":"EmbeddedIO Day2 p.7–12","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":true,"p":"<code>gpiod_line_request_set_values()<\/code> 값 배열의 순서를 정하는 것은?","o":["GPIO 번호 크기 순","물리 핀 번호 순","요청 때 넘긴 offsets 순","consumer 이름 순"],"a":2,"h":"신호등 예제는 <code>LINES[3] = { 17, 27, 22 }<\/code>로 세 라인을 한 번에 요청하고, 값 배열 <code>v[3] = { R, Y, G }<\/code>를 넘겨 세 LED를 시스템 콜 한 번으로 바꿉니다. 값 배열의 각 칸이 어느 핀에 대응하는지는 요청할 때 넘긴 것의 순서를 그대로 따릅니다. 코드 주석의 (17, 27, 22)를 눈여겨보세요.","w":"set_values()의 배열 순서는 요청할 때 넘긴 offsets 순서와 같습니다. 그래서 세 LED를 시스템 콜 한 번으로 동시에 바꿀 수 있습니다.","an":"EmbeddedIO Day2 p.7 · src/02_traffic.c","src":"LINES[3] = { 17, 27, 22 }; /* R Y G */\nreq = gpio_request(\"traffic\", LINES, 3, s);\nv[3] = { R, Y, G };\ngpiod_line_request_set_values(req, v);\n# 상태 R Y G ms\n0 초록 0 0 1 3000\n1 노랑 0 1 0 1000\n2 빨강 1 0 0 3000\n3 빨강 + 노랑 1 1 0 1000\nset_values() 의 배열 순서 = 요청할 때 넘긴 offsets 순서\n세 LED 를 시스템 콜 한 번으로 동시에 바꾼다 . 순서를 바꾸려면 코드가 아니라 표만 고친다"},{"id":"t4-02","ty":"mc","lv":2,"game":true,"p":"active-low로 설정한 라인에 코드가 ACTIVE(1)를 쓰면 핀 전압은?","o":["0 V","3.3 V","5 V","1.65 V"],"a":0,"h":"active-high(기본)에서는 ACTIVE(1)가 3.3V, INACTIVE(0)가 0V입니다. active-low로 설정하면 코드는 '1 = 켜짐'을 그대로 쓰고, 실제 전압 반전은 커널이 대신 해 줍니다. 3V3 → LED → GPIO처럼 Low에서 동작하는 배선을 떠올려 보세요.","w":"active-low에서는 ACTIVE가 0 V, INACTIVE가 3.3 V입니다. 3V3 → LED → GPIO 배선이나 Low에서 동작하는 모듈에 씁니다.","an":"EmbeddedIO Day2 p.8","src":"설정 ACTIVE (1) → INACTIVE (0) → 쓰는 곳\nactive-high ( 기본 ) 3.3 V 0 V GPIO → LED → GND ( 오늘 배선 )\nactive-low 0 V 3.3 V 3V3 → LED → GPIO, Low 동작 모듈\ndrive 1 을 쓰면 0 을 쓰면 쓰는 곳\nPUSH_PULL ( 기본 ) 3.3 V 로 밀어냄 0 V LED · 부저\nOPEN_DRAIN 손을 놓음 ( 외부 풀업 ) 0 V 한 선 공유 — I2C (Day 4)\nactive-low 면 코드는 \"1 = 켜짐 \" 그대로 , 전압 반전은 커널이 한다"},{"id":"t4-03","ty":"mc","lv":1,"game":true,"p":"I2C처럼 한 선을 여럿이 공유할 때 쓰는 drive 방식은?","o":["PUSH_PULL","ACTIVE_HIGH","PULL_DOWN","OPEN_DRAIN"],"a":3,"h":"PUSH_PULL(기본)은 1을 쓰면 3.3V로 밀어내고 0을 쓰면 0V로 당깁니다. 다른 방식은 1을 쓰면 핀이 손을 놓고 외부 풀업이 선을 올리게 하므로, 여러 장치가 한 선을 공유해도 서로 부딪히지 않습니다. Day 4 I2C에서 쓰는 방식을 떠올려 보세요.","w":"OPEN_DRAIN은 1에서 손을 놓고 0에서만 끌어내려 한 선 공유가 가능합니다. PUSH_PULL(기본)은 1에서 3.3 V로 밀어내 LED·부저에 씁니다.","an":"EmbeddedIO Day2 p.8","src":"drive 1 을 쓰면 0 을 쓰면 쓰는 곳\nPUSH_PULL ( 기본 ) 3.3 V 로 밀어냄 0 V LED · 부저\nOPEN_DRAIN 손을 놓음 ( 외부 풀업 ) 0 V 한 선 공유 — I2C (Day 4)"},{"id":"t4-04","ty":"mc","lv":3,"game":true,"p":"GPIO17을 레지스터로 출력 설정할 때 고칠 GPFSEL 위치는?","o":["GPFSEL0 · 비트 21~23","GPFSEL1 · 비트 21~23","GPFSEL1 · 비트 17~19","GPFSEL2 · 비트 7~9"],"a":1,"h":"GPFSEL 레지스터는 핀당 3비트로 기능을 정하므로 레지스터 하나에 10개 핀이 들어갑니다. 레지스터 번호는 <code>pin / 10<\/code>, 시작 비트는 <code>(pin % 10) × 3<\/code>으로 계산하고 그 자리부터 3비트를 001(출력)로 씁니다. 17을 이 두 식에 넣어 보세요.","w":"17 / 10 = 1이므로 GPFSEL1, (17 % 10) × 3 = 21이므로 비트 21~23에 001(출력)을 씁니다. SET·CLR·LEV 레지스터에서는 비트 번호가 핀 번호 17 그대로입니다.","an":"EmbeddedIO Day2 p.9 · src/03_gpiomem.c","src":"int reg = GPFSEL0 + pin / 10; /* GPIO17 → GPFSEL1 */\n int shift = (pin % 10) * 3; /* GPIO17 → 비트 21~23 */\n uint32_t v = gpio[reg];\n v &= ~(7u << shift); /* 3비트 지우기 */\n v |= ((uint32_t)fsel << shift); /* 000 = 입력, 001 = 출력 */"},{"id":"t4-05","ty":"mc","lv":2,"game":true,"p":"GND 쪽에 연결한 버튼 입력에 알맞은 bias는?","o":["PULL_UP","PULL_DOWN","DISABLED","AS_IS"],"a":0,"h":"입력 bias 표에서 PULL_UP은 내부 저항으로 3.3V에, PULL_DOWN은 GND에 연결합니다. 버튼의 한쪽이 GND에 붙어 있다면 평소에는 1로 끌어올려 두고, 누를 때 GND로 떨어져 0이 되도록 해야 합니다. 이렇게 하면 누름이 falling 엣지가 됩니다.","w":"GND 쪽 버튼은 PULL_UP으로 평소 1, 누르면 0입니다. PIR처럼 센서가 직접 0/1을 내는 경우는 DISABLED를 씁니다.","an":"EmbeddedIO Day2 p.11 · Day1 p.23","src":"bias 뜻 Arduino\nPULL_UP 내부 저항 → 3.3V INPUT_PULLUP\nPULL_DOWN 내부 저항 → GND INPUT_PULLDOWN (ESP32)\nDISABLED 저항 끔 — 센서가 직접 0/1 INPUT\nAS_IS 지금 상태 그대로 ( 기본값 ) —\n버튼 (GND 쪽 )\nPULL_UP — 평소 1, 누르면 0"},{"id":"t4-06","ty":"ox","lv":2,"game":true,"p":"/dev/gpiomem mmap은 수십 배 빠르므로 평소에도 libgpiod 대신 쓰는 것이 권장된다.","a":false,"h":"측정 예시에서 libgpiod 토글은 ioctl 시스템 콜이라 약 1µs, mmap 토글은 메모리 쓰기라 약 15ns 걸립니다. 하지만 mmap은 소유권(busy 보호)이 없고, Pi 5에는 이식되지 않으며, 인터럽트가 없고, 죽으면 핀이 출력으로 남는 문제가 있습니다. 슬라이드 제목의 '그래도'가 무엇을 뜻하는지 생각해 보세요.","w":"mmap은 약 15 ns로 libgpiod(약 1 µs)보다 빠르지만 소유권·이식성·인터럽트가 없고 정리 책임이 남아 평소에는 쓰지 않습니다.","an":"EmbeddedIO Day2 p.10 · src/04_speed.c","src":"mmap 은 수십 배 빠르다 — 그래도 평소엔 안 쓴다 3 교시\n약 1 µs\nlibgpiod 토글 1 회\n(ioctl 시스템 콜 )\n약 15 ns\nmmap 토글 1 회\n( 메모리 쓰기 )\nmmap 의 문제 설명\n소유권 없음 gpioinfo 에 안 보임 · busy 보호 없음\n이식성 없음 Pi 5(RP1) 는 레지스터가 전혀 다름\n인터럽트 없음 엣지를 보려면 계속 읽어야 함\n정리 책임 죽으면 핀이 출력으로 남음"},{"id":"t4-07","ty":"ox","lv":1,"game":true,"p":"bias 없이 아무것도 연결하지 않은 입력은 floating이라 값이 제멋대로 바뀐다.","a":true,"h":"입력 핀이 어디에도 연결되지 않으면 전압이 정해지지 않은 floating 상태가 됩니다. 그래서 Day 1 슬라이드는 bias를 '필수'라고 하며, GND 쪽 버튼에는 pull-up을 쓰라고 합니다. 문장이 이 설명과 같은지 확인해 보세요.","w":"연결 없는 입력은 floating이라 값이 흔들리므로 bias를 반드시 지정합니다.","an":"EmbeddedIO Day1 p.23 · Day2 p.11","src":"bias 는 필수\n연결 없는 입력은 floating — 값이 \n제멋대로 . GND 쪽 버튼에는 pull-up"},{"id":"t4-08","ty":"match","lv":1,"game":false,"p":"BCM2711 GPIO 레지스터와 역할을 연결하세요.","pairs":[["GPFSEL0~5","핀당 3비트 기능 선택"],["GPSET0","1을 쓴 핀을 High로"],["GPCLR0","1을 쓴 핀을 Low로"],["GPLEV0","핀 현재 레벨 읽기"]],"h":"BCM2711 GPIO 레지스터 표에서 GPFSEL0~5는 핀당 3비트로 기능(입력·출력)을 고르고 읽기-수정-쓰기로 다룹니다. GPSET0과 GPCLR0은 1을 쓴 비트의 핀만 각각 올리거나 내리는 쓰기 전용 레지스터이고, GPLEV0은 핀의 현재 레벨을 읽습니다. 이름의 SET·CLR·LEV가 힌트입니다.","w":"GPFSEL은 읽기-수정-쓰기로 기능을 고르고, GPSET0·GPCLR0은 쓰기 한 번으로 High·Low를 만들며, GPLEV0은 레벨을 읽습니다.","an":"EmbeddedIO Day2 p.9","src":"0x00~0x14 GPFSEL0~5 핀당 3 비트 기능 (000 입력 · \n001 출력 )\n읽기 - 수정 -\n쓰기\n0x1C GPSET0 1 을 쓴 핀 = High 쓰기 한 번\n0x28 GPCLR0 1 을 쓴 핀 = Low 쓰기 한 번\n0x34 GPLEV0 핀 현재 레벨 읽기"},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"신호등 상태표의 순서(상태 0→3)로 놓으세요.","steps":["초록 (3000 ms)","노랑 (1000 ms)","빨강 (3000 ms)","빨강 + 노랑 (1000 ms)"],"h":"신호등 상태표는 상태 번호 0~3마다 R·Y·G 값과 유지 시간(ms)을 적어 둡니다. 0번은 G만 켜진 상태로 시작하고, 3000ms짜리 상태 두 개 사이에 1000ms짜리 짧은 상태가 끼어들며, 마지막 상태는 두 LED가 함께 켜집니다. 표의 R Y G 비트를 차례로 읽어 보세요.","w":"상태표는 초록 3초 → 노랑 1초 → 빨강 3초 → 빨강+노랑 1초입니다. 순서를 바꾸려면 코드가 아니라 표만 고칩니다.","an":"EmbeddedIO Day2 p.7 · src/02_traffic.c","src":"# 상태 R Y G ms\n0 초록 0 0 1 3000\n1 노랑 0 1 0 1000\n2 빨강 1 0 0 3000\n3 빨강 + 노랑 1 1 0 1000"},{"id":"t4-10","ty":"multi","lv":3,"game":false,"p":"/dev/gpiomem mmap 방식의 문제점을 모두 고르세요.","o":["gpioinfo에 안 보이고 busy 보호 없음","Pi 5(RP1)에는 이식되지 않음","엣지를 보려면 계속 읽어야 함","죽으면 커널이 핀을 입력으로 복구","ioctl 시스템 콜이라 느림"],"a":[0,1,2],"h":"mmap 방식의 문제는 네 가지입니다. 커널이 소유권을 모르니 gpioinfo에 안 보이고 busy 보호가 없으며, Pi 5(RP1)는 레지스터가 전혀 달라 이식되지 않고, 인터럽트가 없어 엣지를 보려면 계속 읽어야 합니다. 마지막으로 프로그램이 죽으면 핀이 출력으로 남는 정리 책임 문제가 있습니다.","w":"mmap은 소유권·이식성·인터럽트가 없고, 프로세스가 죽으면 핀이 출력으로 남습니다. ioctl 시스템 콜을 쓰는 쪽은 libgpiod입니다.","an":"EmbeddedIO Day2 p.10","src":"mmap 의 문제 설명\n소유권 없음 gpioinfo 에 안 보임 · busy 보호 없음\n이식성 없음 Pi 5(RP1) 는 레지스터가 전혀 다름\n인터럽트 없음 엣지를 보려면 계속 읽어야 함\n정리 책임 죽으면 핀이 출력으로 남음"}]},{"id":"t5","title":"엣지 이벤트 · epoll · 반응속도","ref":"EmbeddedIO Day2 p.12–19","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":false,"p":"카운터 없이 커널이 바운싱을 걸러 주게 하는 libgpiod 설정 함수는?","o":["line_request_get_value","line_request_get_fd","line_settings_set_bias","settings_set_debounce_period_us"],"a":3,"h":"4교시 폴링 예제는 1ms마다 값을 읽어 20번 연속 같은 값일 때만 인정하는 카운터로 바운싱을 직접 걸렀습니다. 슬라이드 아래쪽에는 이 카운터 없이 커널이 걸러 주게 하는 libgpiod settings 함수가 소개되어 5교시부터 쓰입니다. 함수 이름에는 디바운스 기간과 단위(µs)가 그대로 들어 있습니다.","w":"<code>gpiod_line_settings_set_debounce_period_us()<\/code>로 커널 디바운스를 겁니다. get_value 폴링은 소프트웨어 카운터(20 ms 안정)가 필요합니다.","an":"EmbeddedIO Day2 p.12 · src/gpio_common.h","src":"커널 디바운스\ngpiod_line_settings_set_debounce_period_us()\n카운터 없이 커널이 걸러 준다 → 5 교시부터 사용"},{"id":"t5-02","ty":"mc","lv":1,"game":true,"p":"엣지 이벤트 타임스탬프와 같은 시계를 써서 바로 뺄 수 있는 도우미는?","o":["sleep_ms()","now_ns()","rand()","beep()"],"a":1,"h":"엣지 이벤트의 타임스탬프는 <code>gpiod_edge_event_get_timestamp_ns()<\/code>로 읽으며, 기준 시계는 CLOCK_MONOTONIC입니다. 공통 헤더 gpio_common.h에는 같은 시계로 현재 시각을 나노초로 돌려주는 도우미가 있어, 두 값을 단위 변환 없이 바로 뺄 수 있습니다. 반응속도 게임에서 t_on을 기록할 때 쓰는 함수를 떠올려 보세요.","w":"이벤트 타임스탬프는 CLOCK_MONOTONIC이고 gpio_common.h의 now_ns()도 같은 시계라 바로 뺄 수 있습니다.","an":"EmbeddedIO Day2 p.13 · src/gpio_common.h","src":"폴링 이벤트\nCPU 1~2 % 0 %\n시각 읽은 순간 커널 ts (ns)\n짧은 펄스 놓침 큐에 쌓임\n타임스탬프 = CLOCK_MONOTONIC → now_ns() 와 바로 뺄 수 있다 ."},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"epoll에서 준비된 fd를 read하지 않으면 어떻게 되나요?","o":["epoll_wait가 계속 즉시 반환","epoll_wait가 영원히 잠듦","커널이 fd를 닫음","이벤트가 자동 삭제됨"],"a":0,"h":"epoll_wait는 '준비된 fd'만 돌려주며, fd에 읽을 데이터가 남아 있는 한 그 fd는 계속 준비 상태로 남습니다. timerfd도 만료 횟수를 read해야 다시 대기하는 것처럼, 이벤트를 읽어 비우지 않으면 epoll_wait가 잠들 이유가 없어집니다. 그 결과 루프가 CPU를 계속 쓰는 상태가 됩니다.","w":"준비된 fd를 읽지 않으면 계속 준비 상태라 epoll_wait가 즉시 반환해 busy loop가 됩니다. timerfd도 read로 만료 횟수를 읽어야 다시 대기합니다.","an":"EmbeddedIO Day2 p.15–16 · src/07_evloop.c","src":"준비된 fd 를 read 하지 않으면 epoll_wait 가 계속 즉시 반환 → busy loop"},{"id":"t5-04","ty":"mc","lv":3,"game":true,"p":"반응속도 게임에서 부하와 무관하게 반응 시간을 재는 계산은?","o":["깨어난 뒤 now_ns() − t_on","rand() % 3000 − t_on","timestamp_ns(ev) − t_on","t_on − timestamp_ns(ev)"],"a":2,"h":"자료는 반응 시간을 재는 두 방법을 비교합니다. 깨어난 뒤 <code>now_ns()<\/code>로 시각을 읽으면 스케줄러 지연이 더해지지만, 인터럽트 순간에 커널이 이벤트에 찍어 둔 시각을 쓰면 부하와 무관합니다. 두 방법 모두 LED를 켠 시각 t_on을 빼는 계산입니다.","w":"커널 타임스탬프에서 LED를 켠 시각 t_on을 빼야 합니다. 깨어난 뒤 now_ns()를 쓰면 스케줄러 지연이 더해집니다.","an":"EmbeddedIO Day2 p.18 · src/react.c","src":"방법 계산 오차\n❌ 깨어난 뒤 now_ns() − t_on 스케줄러 지연이 더해짐\n✅ 커널 타임스탬프 timestamp_ns(ev) − t_on 인터럽트 순간 — 부하와 무관"},{"id":"t5-05","ty":"mc","lv":2,"game":true,"p":"react.c가 매 라운드 시작에 drain()을 부르는 이유는?","o":["다음 지연 시간을 정하려고","부저 소리 길이를 바꾸려고","CSV 기록 파일을 비우려고","남은 이벤트로 인한 부정 출발 방지"],"a":3,"h":"이전 라운드에서 버튼을 늦게 뗀 이벤트나 바운싱이 큐에 남아 있으면, 다음 라운드의 무작위 지연 중에 그 이벤트가 바로 읽힙니다. 그러면 사용자가 누르지 않았는데도 지연 중 누름으로 판정됩니다. drain()은 <code>poll(..., 0)<\/code>으로 남은 이벤트를 모두 읽어 버리는 함수입니다.","w":"이전 라운드의 뗌 이벤트나 바운싱이 큐에 남아 있으면 다음 지연 중 바로 읽혀 부정 출발이 됩니다. 그래서 라운드마다 큐를 비웁니다.","an":"EmbeddedIO Day2 p.18 · src/react.c","src":"drain() 이 필요한 이유\n이전 라운드에서 뗄 때의 이벤트 · 바운싱이 큐에 남아 있으면 다음 라운드 지연 중에 바로\n읽혀 \" 부정 출발 \" 이 된다 ."},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"Linux 엣지 이벤트 처리 코드는 ESP32 ISR처럼 printf 금지 같은 제약을 받는다.","a":false,"h":"ESP32의 attachInterrupt 코드는 ISR(인터럽트 문맥)에서 돌기 때문에 짧게, volatile, IRAM_ATTR, printf 금지 같은 제약이 붙습니다. Linux 엣지 이벤트는 커널이 인터럽트를 받아 큐에 넣고, 내 코드는 일반 프로세스에서 그 이벤트를 읽습니다. 표의 '제약' 행에서 Linux 쪽 칸을 확인해 보세요.","w":"Linux 엣지 이벤트는 일반 프로세스에서 처리하므로 ISR 제약이 없습니다. 대신 지연이 수십 µs~ms로 늘지만 시각은 커널이 정확히 찍습니다.","an":"EmbeddedIO Day2 p.14","src":"ESP32 attachInterrupt Linux 엣지 이벤트\n내 코드가 도는 곳 ISR ( 인터럽트 문맥 ) 일반 프로세스\n제약 짧게 · volatile · IRAM_ATTR · printf 금지 없음"},{"id":"t5-07","ty":"ox","lv":3,"game":true,"p":"react.c 실행 중 <code>yes > /dev/null<\/code>을 4개 띄워도 반응 기록은 거의 변하지 않는다.","a":true,"h":"react.c는 반응 시간을 깨어난 뒤의 시각이 아니라 이벤트의 커널 타임스탬프에서 t_on을 빼 계산합니다. 커널 타임스탬프는 인터럽트 순간에 찍히므로, CPU 부하로 프로세스가 늦게 깨어나도 값이 달라지지 않습니다. 슬라이드의 '부하 실험' 결과를 확인해 보세요.","w":"커널 타임스탬프로 재므로 CPU 부하가 있어도 기록이 거의 변하지 않습니다. 실험 뒤에는 <code>killall yes<\/code>로 정리합니다.","an":"EmbeddedIO Day2 p.19","src":"부하 실험\nyes > /dev/null & ×4\n→ 기록이 거의 변하지 않음"},{"id":"t5-08","ty":"match","lv":1,"game":false,"p":"이벤트 루프 함수와 하는 일을 연결하세요.","pairs":[["timerfd_create","타이머 fd 생성"],["timerfd_settime","첫 만료와 주기 설정"],["read(tfd, &exp, 8)","만료 횟수 읽기"],["epoll_wait","준비된 fd만 돌려받기"]],"h":"이벤트 루프는 timerfd_create로 타이머 fd를 만들고 timerfd_settime의 it_value(첫 만료)와 it_interval(주기)로 동작을 정합니다. 만료되면 8바이트 read로 만료 횟수를 읽어야 다시 대기하고, epoll_wait는 등록된 fd 가운데 준비된 것만 돌려줍니다. 이름의 create·settime·read·wait를 역할과 짝지어 보세요.","w":"timerfd_create로 타이머 fd를 만들고 settime으로 첫 만료와 주기를 정하며, read로 만료 횟수를 읽어야 다시 대기합니다. epoll_wait는 준비된 fd만 돌려줍니다.","an":"EmbeddedIO Day2 p.15–16","src":"tfd = timerfd_create(CLOCK_MONOTONIC, 0);\ntimerfd_settime(tfd, 0, &its, NULL);\nep = epoll_create1(0);\nepoll_ctl(ep, EPOLL_CTL_ADD, fd, &e); /* ×4 */\nn = epoll_wait(ep, evs, 4, -1);\nswitch (evs[i].data.u32) {\ncase TAG_BTN: read_edge_events …\ncase TAG_TIMER: read(tfd, &exp, 8) …\n}\n준비된 fd 를 read 하지 않으면 epoll_wait 가 계속 즉시 반환 → busy loop"},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"react.c 한 라운드의 흐름 순서로 놓으세요.","steps":["drain()으로 남은 이벤트 비우기","2~5초 무작위 지연 중 누름 감시","LED 켜고 t_on 기록","3초 안의 누름으로 ms 계산","LED 끄기"],"h":"react.c 한 라운드는 READY → GO → RESULT 상태 머신을 따릅니다. READY에서 쌓인 이벤트를 비우고 2~5초 무작위 지연 동안 누름(부정 출발)을 감시하며, GO에서 LED를 켜고 시각을 기록한 뒤 3초 안의 누름으로 ms를 계산합니다. 라운드 끝에서 LED를 끕니다.","w":"drain 후 무작위 지연(이때 누르면 FOUL), LED 켜고 t_on 기록, 3초 안의 누름 타임스탬프로 ms 계산, LED 끄기 순입니다.","an":"EmbeddedIO Day2 p.17 · p.19 · src/react.c","src":"drain();\nint delay = 2000 + rand() % 3000;\nif (wait_press(delay, &ts, &who) == 1) {\nfouls++; beep(800); continue; /* 부정 출발 */\n}\nset_line(LED, 1);\nlong long t_on = now_ns();\nif (wait_press(3000, &ts, &who) == 1) {\nlong ms = (ts - t_on) / 1000000;\nbeep(100);\n}\nset_line(LED, 0);"},{"id":"t5-10","ty":"multi","lv":2,"game":true,"p":"폴링과 비교한 엣지 이벤트 방식의 특징을 모두 고르세요.","o":["CPU 사용률이 거의 0%","시각은 커널 ts(ns)","짧은 펄스도 큐에 쌓임","잠들지 않고 계속 값을 읽음","sleep 없이 돌려야 정확"],"a":[0,1,2],"h":"폴링은 주기마다 깨어나 CPU를 조금씩 쓰고, 읽은 순간의 시각만 알며, 읽는 사이에 지나간 짧은 펄스를 놓칩니다. 엣지 이벤트는 poll()로 잠들어 있다가 커널이 깨워 주고, 시각은 인터럽트 순간의 커널 타임스탬프(ns)이며, 이벤트가 큐에 쌓입니다. 비교표의 세 행을 각각 대응시켜 보세요.","w":"엣지 이벤트는 poll()로 잠들어 CPU가 거의 0%이고, 커널 타임스탬프를 쓰며, 짧은 펄스도 큐에 쌓입니다. 계속 읽는 것은 폴링이고, sleep 없는 폴링은 CPU 100%가 됩니다.","an":"EmbeddedIO Day2 p.12–13","src":"폴링 이벤트\nCPU 1~2 % 0 %\n시각 읽은 순간 커널 ts (ns)\n짧은 펄스 놓침 큐에 쌓임"}]},{"id":"t6","title":"소프트웨어 · 하드웨어 PWM","ref":"EmbeddedIO Day3 p.4–10","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"주파수 200 Hz PWM의 주기는?","o":["5 ms","2 ms","20 ms","0.5 ms"],"a":0,"h":"PWM 용어 표에서 주파수는 1 / 주기로 정의되므로, 거꾸로 주기 = 1 / 주파수입니다. 1초를 200으로 나눈 값을 ms 단위로 바꿔 보세요. 한 번 켜졌다 꺼지기까지 걸리는 시간이 바로 주기입니다.","w":"1 / 200 Hz = 5 ms입니다. 듀티 20%면 1 ms 켜지고 4 ms 꺼집니다.","an":"EmbeddedIO Day3 p.4","src":"용어 뜻 예 (200 Hz, 20%)\n주기 period 한 번 켜졌다 꺼지기까지 5 ms\n주파수 1 / 주기 200 Hz"},{"id":"t6-02","ty":"mc","lv":2,"game":true,"p":"SW PWM에서 usleep 대신 clock_nanosleep(TIMER_ABSTIME)을 쓰는 이유는?","o":["CPU를 0%로 만들려고","하드웨어 PWM을 켜려고","지연이 누적되지 않게","sudo 없이 돌리려고"],"a":2,"h":"usleep(on); usleep(off);처럼 상대 시간으로 자면 깨어나는 지연이 매 주기 더해져 주파수가 점점 낮아집니다. 절대 시각 방식은 <code>next += PERIOD<\/code>로 목표 시각을 미리 계산하므로, 한 번 늦게 깨어나도 다음 목표는 그대로입니다. 오차가 쌓이는지 여부에 주목하세요.","w":"상대 시간 usleep은 깨어나는 지연이 매 주기 누적돼 주파수가 낮아집니다. 절대 시각을 쓰면 한 번 늦어도 다음 목표는 그대로입니다.","an":"EmbeddedIO Day3 p.4 · src/01_swpwm.c","src":"상대 시간 usleep(on); usleep(off);\n깨어나는 지연이 매 주기 더해져 누적 → 주파수가 점점 낮아진다 .\n절대 시각 clock_nanosleep(TIMER_ABSTIME)\nnext += PERIOD 로 목표를 계산 → 한 번 늦어도 다음 목표는\n그대로 ."},{"id":"t6-03","ty":"mc","lv":1,"game":false,"p":"실시간 쓰레드에서 페이지 폴트를 막으려고 부르는 함수는?","o":["setcap","mlockall","pthread_attr_setinheritsched","timerfd_create"],"a":1,"h":"SCHED_FIFO 실시간 쓰레드도 메모리 페이지가 준비되지 않아 멈추면(페이지 폴트) 지연이 생깁니다. 그래서 자료는 현재와 앞으로의 메모리를 모두 물리 메모리에 묶어 두는 함수를 <code>MCL_CURRENT | MCL_FUTURE<\/code> 인자와 함께 부릅니다. 이 함수에는 setcap의 cap_ipc_lock 권한이 필요합니다.","w":"<code>mlockall(MCL_CURRENT | MCL_FUTURE)<\/code>는 메모리를 고정해 페이지 폴트를 막습니다. setinheritsched(EXPLICIT)는 FIFO 설정이 무시되지 않게 하는 호출입니다.","an":"EmbeddedIO Day3 p.7 · src/02_rgb.c","src":"호출 하는 일\npthread_attr_setschedpolicy(SCHED_FIFO) 실시간 정책\npthread_attr_setschedparam (50) 우선순위 50\npthread_attr_setinheritsched(EXPLICIT) 빼면 위 설정이 무시됨\nmlockall(MCL_CURRENT | MCL_FUTURE) 페이지 폴트 방지"},{"id":"t6-04","ty":"mc","lv":2,"game":false,"p":"export 직후 duty_cycle부터 쓰면 Invalid argument가 나는 이유는?","o":["gpio 그룹이 아니라서","enable이 0이라서","채널이 GPIO19라서","period가 0이라 duty > period라서"],"a":3,"h":"/sys/class/pwm에서는 항상 duty ≤ period가 지켜져야 합니다. export 직후 채널의 period는 아직 설정되지 않아 0이므로, 이때 duty_cycle에 0보다 큰 값을 쓰면 이 부등식이 깨집니다. 그래서 주기를 늘릴 때는 period를 먼저 씁니다.","w":"export 직후 period가 0이라 duty를 먼저 쓰면 duty ≤ period를 어깁니다. 주기를 줄일 땐 duty 먼저, 늘릴 땐 period 먼저 씁니다.","an":"EmbeddedIO Day3 p.8 · src/pwm_sysfs.h","src":"순서 함정 — 항상 duty ≤ period\nexport 직후 period = 0 → duty 먼저 쓰면 Invalid argument. 주기를 줄일 땐 duty 먼저 , 늘릴 땐 period 먼저 ."},{"id":"t6-05","ty":"mc","lv":3,"game":true,"p":"패시브 부저로 라(A4, period 2 272 727 ns)를 낼 때 duty_cycle 값은?","o":["2 272 727","3 816 794","1 136 363","440"],"a":2,"h":"패시브 부저는 주기로 음정을 정하고, 소리가 가장 크게 들리도록 듀티를 50%로 둡니다. 05_melody의 tone()은 <code>period = 10⁹ / hz<\/code>로 주기를 구한 뒤 <code>duty = period / 2<\/code>로 듀티를 넣습니다. 주어진 period를 2로 나누되, ns 단위 정수이므로 소수점 아래는 버립니다.","w":"부저는 듀티 50%라 duty = 2 272 727 / 2 ≈ 1 136 363 ns입니다. 3 816 794는 도(C4)의 period, 440은 Hz 값입니다.","an":"EmbeddedIO Day3 p.10 · src/05_melody.c","src":"05_melody — tone(hz, ms)\nperiod = 10⁹ / hz, duty = period / 2\nenable 1 → ms 대기 → enable 0"},{"id":"t6-06","ty":"ox","lv":3,"game":true,"p":"make로 02_rgb를 다시 빌드해도 이전에 준 setcap 권한은 그대로 유지된다.","a":false,"h":"SCHED_FIFO와 mlockall은 일반 사용자에게 막혀 있어 <code>setcap cap_sys_nice,cap_ipc_lock+ep<\/code>로 실행 파일에 권한을 붙입니다. 이 권한은 파일 자체에 붙는 속성이므로, make로 다시 빌드해 새 파일이 생기면 사라집니다. 슬라이드의 '주의' 상자를 확인해 보세요.","w":"setcap은 실행 파일에 붙는 권한이라 make로 다시 빌드하면 setcap도 다시 해야 합니다. 빠뜨리면 pthread_create가 Operation not permitted로 실패합니다.","an":"EmbeddedIO Day3 p.7","src":"주의\n잠들지 않는 FIFO 루프는 시스템을 멈춘다 . make 로 다시 \n빌드하면 setcap 도 다시 ."},{"id":"t6-07","ty":"ox","lv":1,"game":true,"p":"서보 각도는 PWM 주기(period)를 바꿔서 조절한다.","a":false,"h":"서보는 20ms(50Hz) 고정 주기 안에서 High 펄스 폭이 0.5ms면 0°, 1.5ms면 90°, 2.5ms면 180°로 움직입니다. 부저는 반대로 듀티를 50%로 고정하고 주기를 바꿔 음정을 냅니다. 표의 '변경' 행에서 서보 쪽에 무엇이 적혀 있는지 확인해 보세요.","w":"서보는 주기 20 ms를 고정하고 duty_cycle(펄스 폭)을 바꿉니다. 주기를 바꾸는 것은 부저의 음정입니다.","an":"EmbeddedIO Day3 p.10","src":"서보 부저\n고정 주기 20 ms 듀티 50%\n변경 duty_cycle period"},{"id":"t6-08","ty":"match","lv":1,"game":false,"p":"서보 펄스 폭과 각도를 연결하세요.","pairs":[["0.5 ms","0°"],["1.5 ms","90°"],["2.5 ms","180°"]],"h":"서보는 20ms 주기 안의 펄스 폭으로 각도를 정합니다. 04_servo.c는 최소 500µs, 최대 2500µs 사이를 각도에 비례해 직선 보간하므로, 폭이 가장 짧으면 0°, 가장 길면 180°, 그 한가운데면 가운데 각도가 됩니다. 1.5ms가 0.5와 2.5의 가운데라는 점을 이용해 보세요.","w":"0.5 ms는 0°, 1.5 ms는 90°, 2.5 ms는 180°입니다. 서보마다 끝점이 달라 넘으면 떨며 전류를 먹으므로 보정 인자로 범위를 줄입니다.","an":"EmbeddedIO Day3 p.10 · src/04_servo.c","src":"펄스 폭 각도\n0.5 ms 0°\n1.5 ms 90°\n2.5 ms 180°"},{"id":"t6-09","ty":"order","lv":2,"game":false,"p":"sysfs로 PWM0을 1 kHz·25%로 켜는 순서로 놓으세요.","steps":["echo 0 > export","echo 1000000 > pwm0/period","echo 250000 > pwm0/duty_cycle","echo 1 > pwm0/enable"],"h":"sysfs PWM은 pwmchip0의 export에 채널 번호를 써서 pwm0 디렉터리를 만든 뒤 값을 설정합니다. export 직후 period가 0이므로 period를 먼저 쓰고 duty_cycle을 써야 duty ≤ period가 지켜지며, 마지막에 enable에 1을 씁니다. 값은 모두 ns 단위입니다.","w":"export로 채널을 만들고 period를 먼저 쓴 뒤 duty_cycle, 마지막에 enable을 씁니다. 값은 모두 ns입니다.","an":"EmbeddedIO Day3 p.8","src":"cd /sys/class/pwm/pwmchip0\necho 0 > export\necho 1000000 > pwm0/period # 1 kHz\necho 250000 > pwm0/duty_cycle # 25 %\necho 1 > pwm0/enable"},{"id":"t6-10","ty":"multi","lv":2,"game":true,"p":"소프트웨어 PWM과 비교한 하드웨어 PWM의 특징을 모두 고르세요.","o":["부하에도 깜빡임이 없다","CPU는 값을 바꿀 때만 일한다","GPIO18 · 19 두 채널뿐이다","아무 GPIO에서나 쓸 수 있다","주기마다 쓰레드가 깨어난다"],"a":[0,1,2],"h":"소프트웨어 PWM은 내 쓰레드가 주기마다 깨어나 핀을 뒤집으므로 부하가 걸리면 흔들리고 아무 GPIO에나 쓸 수 있습니다. 하드웨어 PWM은 PWM 회로가 파형을 만들기 때문에 부하 영향이 없고, CPU는 값을 바꿀 때만 일하며, 채널은 정해진 두 핀뿐입니다. 비교표의 하드웨어 PWM 열을 읽어 보세요.","w":"하드웨어 PWM은 PWM 회로가 파형을 만들어 yes × 4 부하에도 흔들리지 않고 CPU는 값 변경 때만 씁니다. 대신 GPIO18·19 두 채널뿐입니다.","an":"EmbeddedIO Day3 p.9 · src/03_hwpwm.c","src":"소프트웨어 PWM (01) 하드웨어 PWM (03)\n파형 내 쓰레드 PWM 회로\n부하 영향 깜빡임 없음\nCPU 주기마다 깨어남 값 바꿀 때만\n채널 아무 GPIO 2 개 (18 · 19)\n같은 yes × 4 부하에서 03_hwpwm 의 숨쉬기는 흔들리지 않는다"}]},{"id":"t7","title":"모터 · 릴레이 · 초음파 경보기","ref":"EmbeddedIO Day3 p.11–18","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"L293D에서 IN1 = 1, IN2 = 1이면 모터는?","o":["정회전","브레이크(급정지)","역회전","자유 정지"],"a":1,"h":"L293D 진리표는 IN1·IN2 조합으로 방향을 정합니다. 10은 정회전, 01은 역회전이고, 두 입력이 같을 때 0·0은 모터를 놓아 자유 정지시키며 1·1은 반대 동작을 합니다. 두 입력이 모두 1일 때 모터 양끝 전압이 같아져 회전이 붙잡힌다는 점을 생각해 보세요.","w":"IN1·IN2가 1·1이면 브레이크(급정지), 0·0이면 자유 정지입니다. 1·0은 정회전, 0·1은 역회전입니다.","an":"EmbeddedIO Day3 p.11 · src/06_dcmotor.c","src":"IN1 IN2 모터 (EN = 1 또는 PWM)\n1 0 정회전\n0 1 역회전\n1 1 브레이크 — 급정지\n0 0 자유 정지"},{"id":"t7-02","ty":"mc","lv":2,"game":true,"p":"DC 모터 EN의 PWM을 20 kHz로 두는 이유는?","o":["토크를 두 배로 하려고","역기전력을 없애려고","탈조를 막으려고","소리를 가청 밖으로 보내려고"],"a":3,"h":"DC 모터의 속도는 L293D EN 핀에 넣는 PWM 듀티로 조절합니다. 낮은 주파수로 스위칭하면 모터 코일이 그 주파수로 떨면서 '삐—' 소리를 내므로, 06_dcmotor는 주기를 50µs로 잡습니다. 사람 귀가 들을 수 있는 대역을 떠올려 보세요.","w":"20 kHz는 모터의 '삐—' 소리를 들리지 않는 대역으로 보냅니다. 역기전력은 안전한 방향 전환 순서로 대응하고, 탈조는 스테퍼의 문제입니다.","an":"EmbeddedIO Day3 p.11","src":"PWM 20 kHz — 모터 \" 삐— \" 소리를 들리지 않는 대역으로 ."},{"id":"t7-03","ty":"mc","lv":3,"game":true,"p":"28BYJ-48을 하프 스텝(1회전 4096스텝)으로 90° 돌리는 스텝 수는?","o":["1024","4096","512","2048"],"a":0,"h":"28BYJ-48은 감속기(약 1:64) 때문에 하프 스텝으로 4096스텝을 돌아야 축이 한 바퀴(360°) 돕니다. 원하는 각도만큼 돌리려면 <code>4096 × 각도 / 360<\/code>으로 스텝 수를 계산합니다. 각도 자리에 90을 넣어 보세요.","w":"4096 × 90 / 360 = 1024스텝입니다. 4096은 한 바퀴, 2048은 반 바퀴입니다.","an":"EmbeddedIO Day3 p.13 · src/08_stepper.c","src":"4096\n하프 스텝 1 회전\n( 감속기 약 1:64)\n1024\n90° = 4096 × 90 / 360"},{"id":"t7-04","ty":"mc","lv":3,"game":true,"p":"HC-SR04의 Echo 폭이 580 µs면 거리는 약 얼마인가요?","o":["약 2 m","약 50 cm","약 10 cm","약 1 cm"],"a":2,"h":"HC-SR04의 Echo High 폭은 소리가 물체까지 갔다 돌아오는 왕복 시간입니다. 소리 속도 343m/s는 0.0343cm/µs이므로 <code>cm = µs × 0.0343 / 2<\/code>로 계산하며, 왕복이라 2로 나눕니다. 간단히 1cm가 약 58µs에 해당한다는 기준을 써도 됩니다.","w":"580 × 0.0343 / 2 ≈ 10 cm입니다. 2900 µs가 약 50 cm, 11600 µs가 약 2 m입니다.","an":"EmbeddedIO Day3 p.15 · src/09_sonar.c","src":"4 cm = µs × 0.0343 / 2 왕복이라 2 로 나눔"},{"id":"t7-05","ty":"mc","lv":2,"game":true,"p":"09_sonar가 5회 측정값을 평균 대신 중앙값으로 고르는 이유는?","o":["계산이 더 빨라서","평균은 튀는 값에 끌려가서","Echo가 5V라서","커널 ts가 없어서"],"a":1,"h":"09_sonar는 측정 품질을 위해 측정 전 이벤트를 버리고 60ms 마감을 두며, 5회를 재서 그중 하나를 고릅니다. 반사나 지연으로 한 번 크게 틀린 값이 섞이면 산술 평균은 그 값 쪽으로 크게 이동하지만, 정렬한 뒤 가운데 값은 거의 영향을 받지 않습니다. 슬라이드의 괄호 설명을 확인해 보세요.","w":"평균은 튀는 값 하나에 끌려가지만 중앙값은 영향을 덜 받습니다. 그 밖에 측정 전 이벤트 버리기, 60 ms 마감, 측정 사이 60 ms 대기도 품질 장치입니다.","an":"EmbeddedIO Day3 p.16 · src/09_sonar.c","src":"09_sonar — 측정 품질 장치\n측정 전 이벤트 버리기 · 60 ms 마감 · 측정 사이 60 ms · 5 회 중앙값 ( 평균은 튀는 값에 끌려간다 )"},{"id":"t7-06","ty":"ox","lv":1,"game":true,"p":"릴레이의 NO(Normally Open) 단자는 평소 COM과 연결되어 있다.","a":false,"h":"릴레이 단자 표에서 COM은 공통 단자이고, NO(Normally Open)와 NC(Normally Closed)는 평소 상태가 반대입니다. 이름의 Open은 '평소 열림', Closed는 '평소 닫힘(연결)'을 뜻하며, 릴레이가 ON이 되면 두 단자의 상태가 서로 바뀝니다. NO가 평소에 어떤 상태인지 표에서 확인해 보세요.","w":"NO는 평소 열려 있다가 릴레이가 켜지면 COM과 연결됩니다. 평소 COM과 연결된 것은 NC입니다.","an":"EmbeddedIO Day3 p.12 · src/07_relay.c","src":"단자 평소 릴레이 ON\nCOM 공통 공통\nNO (Normally Open) 열림 COM 과 연결\nNC (Normally Closed) COM 과 연결 열림"},{"id":"t7-07","ty":"ox","lv":1,"game":true,"p":"스테퍼 모터는 다 돈 뒤에도 코일을 켜 둔 채로 두어야 한다.","a":false,"h":"스테퍼 모터 확인 표에는 '다 돈 뒤 코일 끄기'라는 항목이 있습니다. 코일에 전류를 흘린 채로 두면 모터가 뜨거워지고 전류를 계속 소비하기 때문입니다. 문장이 이 확인 항목과 일치하는지 비교해 보세요.","w":"다 돈 뒤에는 코일을 꺼야 합니다. 켜 둔 채면 뜨거워지고 전류를 계속 씁니다.","an":"EmbeddedIO Day3 p.14","src":"확인 이유\n다 돈 뒤 코일 끄기 켜 둔 채면 뜨거워지고 전류를 계속 씀"},{"id":"t7-08","ty":"match","lv":1,"game":false,"p":"거리 경보기의 거리 구간과 동작을 연결하세요.","pairs":[["50 cm 이상","초록 · 조용 · 서보 90°"],["20 ~ 50 cm","노랑 · 거리 × 10 ms 간격 삑"],["10 ~ 20 cm","빨강 · 더 빠른 삑"],["10 cm 미만","빨강 · 연속음 · 서보 0°"]],"h":"거리 경보기 규칙 표는 거리 구간마다 LED 색, 부저(PWM1 2kHz), 서보(PWM0) 동작을 정해 둡니다. 멀면 초록·조용·차단기 올림이고, 가까워질수록 노랑 → 빨강으로 바뀌며 삑 간격이 짧아지고(20~50cm는 간격 = 거리 × 10ms), 가장 가까운 구간에서만 연속음과 함께 서보가 0°로 내려갑니다.","w":"50 cm 이상은 초록·무음, 20~50 cm는 노랑과 거리 비례 간격, 10~20 cm는 빨강과 더 빠른 삑, 10 cm 미만은 연속음과 서보 0°(차단기 내림)입니다.","an":"EmbeddedIO Day3 p.17 · src/alarm.c","src":"거리 LED 부저 (PWM1 2 kHz) 서보 (PWM0)\n50 cm 이상 초록 조용 올림 90°\n20 ~ 50 cm 노랑 삑 — 간격 = 거리 × 10 ms 올림\n10 ~ 20 cm 빨강 삑 ( 더 빠르게 ) 올림\n10 cm 미만 빨강 연속음 내림 0°"},{"id":"t7-09","ty":"order","lv":2,"game":false,"p":"회전 중인 DC 모터의 방향을 안전하게 바꾸는 순서로 놓으세요.","steps":["EN 듀티 0","브레이크(IN 1·1)","200 ms 대기","반대 방향 설정","속도 복구"],"h":"회전 중에 바로 역전하면 역기전력과 전원이 겹쳐 전류가 급증합니다. 그래서 06_dcmotor는 먼저 EN 듀티를 0으로 힘을 빼고, IN1·IN2를 11로 급정지시킨 뒤 잠시 기다렸다가 반대 방향을 설정하고 속도를 되돌립니다. 슬라이드의 화살표 순서를 따라가 보세요.","w":"EN 듀티 0 → 브레이크 → 200 ms → 반대 방향 → 속도 복구 순입니다. 회전 중 바로 역전하면 역기전력과 전원이 겹쳐 전류가 급증합니다.","an":"EmbeddedIO Day3 p.11 · src/06_dcmotor.c","src":"06_dcmotor — 방향 전환은 안전 순서로\nEN 듀티 0 → 브레이크 (11) → 200 ms → 반대 방향 → 속도 복구 . 회전 중 바로 역전하면 역기전력 + 전원으로 전류 급증 ."},{"id":"t7-10","ty":"multi","lv":2,"game":false,"p":"alarm.c 구조에 대한 설명으로 옳은 것을 모두 고르세요.","o":["sensor_thread가 중앙값을 g_cm에 쓴다","g_cm은 mutex로 보호한다","main은 20 ms마다 출력을 갱신한다","부저는 PWM0, 서보는 PWM1이다","main이 매 루프 직접 초음파를 잰다"],"a":[0,1,2],"h":"alarm.c는 측정 쓰레드와 출력 루프로 나뉩니다. sensor_thread는 약 0.2초마다 3회 중앙값을 공유 변수 g_cm에 쓰고, main은 20ms마다 g_cm을 복사해 LED·부저·서보를 갱신합니다. 두 쓰레드가 같은 변수를 다루므로 mutex로 보호합니다.","w":"sensor_thread가 3회 중앙값을 mutex로 보호되는 g_cm에 쓰고, main은 g_cm을 복사해 20 ms마다 LED·부저·서보를 갱신합니다. 부저는 PWM1(GPIO19), 서보는 PWM0(GPIO18)입니다.","an":"EmbeddedIO Day3 p.17–18 · src/alarm.c","src":"쓰레드 하는 일 주기\nsensor_thread 3 회 중앙값 → g_cm (mutex) 약 0.2 초\nmain g_cm 복사 → LED · 부저 · 서보 20 ms"}]}]};

const TABS=BANK.tabs, QMAP={}, QTAB={};
TABS.forEach((t,ti)=>{t.idx=ti;t.qs.forEach(q=>{QMAP[q.id]=q;QTAB[q.id]=t;});});
const ALLQ=TABS.flatMap(t=>t.qs);
const RM=matchMedia('(prefers-reduced-motion: reduce)');

/* ── 저장소 (실패해도 동작) ─────────────── */
const KEY='qb:'+BANK.id+':v1';
const blank=()=>({name:'',tabs:{},wrong:{},board:[],drafts:{}});  // drafts: 채점 전 탭별 풀던 답
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw));}catch(e){}
try{const u=window.QB&&QB.user();if(!S.name&&u&&u.name)S.name=u.name;}catch(e){}  // 로그인 이름 동기화(사용자가 동작하기 전엔 저장하지 않음)
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const gameUnlocked=()=>Object.keys(S.tabs).length>0;
const allGraded=()=>TABS.every(t=>S.tabs[t.id]);

/* 순위 저장소 — 공유 순위로 바꿀 때 이 객체만 교체 */
// 순위는 같은 조건(게임 모드 + 풀이 시간)끼리만 비교한다. key = 'timeattack:10'
const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

/* ── 유틸 ──────────────────────────────── */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function say(msg){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=msg,30);}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('📋 클립보드에 복사했습니다');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'📋 클립보드에 복사했습니다':'복사하지 못했습니다. 인쇄 기능을 이용하세요.');
}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

/* ── 오답노트 ──────────────────────────── */
function addWrong(id,ans){const w=S.wrong[id]||{n:0};w.n++;w.last=ans;w.at=Date.now();w.solved=false;S.wrong[id]=w;}
function markSolved(id){if(S.wrong[id]&&!S.wrong[id].solved){S.wrong[id].solved=true;S.wrong[id].at=Date.now();}}
const wrongList=solved=>Object.keys(S.wrong).filter(id=>QMAP[id]&&!!S.wrong[id].solved===solved)
  .sort((a,b)=>QTAB[a].idx-QTAB[b].idx||ALLQ.indexOf(QMAP[a])-ALLQ.indexOf(QMAP[b]));

/* ── 문항 풀이 상태(학습·재도전 공용) ───── */
let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

function cardHTML(q,n){
  const [label,color]=TYPES[q.ty];
  const g=cur.graded, a=cur.ans[q.id], fa=finalAns(q), ok=g&&isCorrect(q,fa);
  const lock=g?' disabled':'';
  let body='';
  if(q.ty==='mc'||q.ty==='multi'){
    const multi=q.ty==='multi', mine=multi?(a||[]):[a];
    body='<div class="opts">'+q.o.map((o,i)=>{
      const right=multi?q.a.includes(i):q.a===i, picked=mine.includes(i);
      const cls=g?(right?' ans':picked?' miss':''):'';
      return `<label class="opt${cls}"><span class="onum">${i+1}</span><input type="${multi?'checkbox':'radio'}" name="r-${q.id}" data-act="${multi?'tick':'pick'}" data-q="${q.id}" data-i="${i}"${picked?' checked':''}${lock}><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(q.ty==='ox'){
    body='<div class="ox">'+[true,false].map(v=>{
      const cls=g?(q.a===v?' ans':a===v?' miss':''):'';
      return `<button type="button" class="${cls.trim()}" data-act="ox" data-q="${q.id}" data-v="${v?1:0}" data-fk="${q.id}-ox${v?1:0}" aria-pressed="${a===v}" aria-label="${v?'맞다 O':'틀리다 X'}"${lock}>${v?'O':'X'}</button>`;
    }).join('')+'</div>';
  }else if(q.ty==='match'){
    const m=a||{}, sel=cur.msel[q.id], linkedBy={};
    Object.entries(m).forEach(([l,r])=>linkedBy[r]=+l);
    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${PAL[i%PAL.length]})" data-act="ml" data-q="${q.id}" data-i="${i}" data-fk="${q.id}-l${i}"${lock}><span class="tag">${LETTER[i]}</span>${esc(p[0])}</button>`;
    }).join('');
    const right=cur.shuf[q.id].map(j=>{
      const by=linkedBy[j], linked=by!=null, cls=(linked?' linked':'')+(g&&linked?(by===j?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${linked?PAL[by%PAL.length]:'--line'})" data-act="mr" data-q="${q.id}" data-j="${j}" data-fk="${q.id}-r${j}"${lock}><span class="tag">${linked?LETTER[by]:''}</span>${esc(q.pairs[j][1])}</button>`;
    }).join('');
    body=`<div class="match"><div class="mcol mleft">${left}</div><div class="mcol mright">${right}</div></div>`;
  }else if(q.ty==='order'){
    const seq=a||[], full=seq.length===q.steps.length;
    body='<div class="olist">'+(cur.shuf[q.id]||range(q.steps.length)).map(si=>{
      const pos=seq.indexOf(si), on=pos>=0;
      const cls=(on?' on':'')+(g?(pos===si?' ok':' no'):'');
      const fix=g&&pos!==si?`<span class="ofix">정답 ${si+1}</span>`:'';
      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }
  const numAns=q.ty==='mc'?`${q.a+1}번 · `:q.ty==='multi'?q.a.map(i=>i+1).join('·')+'번 · ':'';
  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${mediaHTML(q)}${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>${voiceRow(q,q.id)}`}${body}${exp}</article>`;
}
const LV_NAME=['쉬움','보통','어려움'];
function lvHTML(lv){
  lv=lv||1;
  const dots=[1,2,3].map(k=>k<=lv?`<i class="d${k}">●</i>`:'<i class="off">○</i>').join('');
  return `<span class="lv lv${lv}" title="난이도 ${LV_NAME[lv-1]}"><span class="dots" aria-hidden="true">${dots}</span><em>${LV_NAME[lv-1]}</em></span>`;
}
// 자료 발췌: 이스케이프 후 마크다운 기호만 가볍게 서식으로 (**굵게**, `코드`, 머리 #)
const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
function hintHTML(q){
  if(!q.h)return '';
  const open=cur.hints.has(q.id), label=q.ty==='num'?'Hint · 계산식':'Hint';
  // 2단계: ① 자세한 힌트(h) ② 자료 보기 — 자료 원문 발췌(src) + 위치(an)
  const sopen=cur.srcs.has(q.id);
  const src=q.src?`<div class="srcwrap"><button type="button" class="srcbtn" data-act="src" data-q="${q.id}" data-fk="${q.id}-src" aria-expanded="${sopen}" aria-controls="src-${q.id}">`+
    `<span class="caret" aria-hidden="true">${sopen?'▾':'▸'}</span>📖 자료 보기</button>`+
    (sopen?`<blockquote class="src" id="src-${q.id}"><p>${srcText(q.src)}</p>${q.an?`<cite>${esc(q.an)}</cite>`:''}</blockquote>`:'')+`</div>`:'';
  return `<div class="hintwrap"><button type="button" class="hintbtn" data-act="hint" data-q="${q.id}" data-fk="${q.id}-hint" aria-expanded="${open}" aria-controls="hint-${q.id}">`+
    `<span class="caret" aria-hidden="true">${open?'▾':'▸'}</span>${label}</button>`+
    (open?`<div class="hint" id="hint-${q.id}">${q.h}${src}</div>`:'')+`</div>`;
}
function refreshCard(q){
  const el=document.getElementById('card-'+q.id);if(!el)return;
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  el.outerHTML=cardHTML(q,el.dataset.n);
  if(fk){const f=app.querySelector(`[data-fk="${fk}"]`);if(f&&!f.disabled)f.focus();}
  updateProgress();
}
const pad2=n=>String(n).padStart(2,'0');
const fmtCnt=(n,t)=>`(${pad2(n)}/${pad2(t)})`;
// 탭별 푼 문항 수: 지금 보는 탭 → 화면 상태, 그 외 → 풀던 답(drafts) → 채점 기록
function tabAnswered(t){
  const src=cur&&cur.mode==='study'&&cur.tab===t?cur.ans:(S.drafts[t.id]||(S.tabs[t.id]&&S.tabs[t.id].answers)||{});
  return t.qs.filter(q=>isAnswered(q,src[q.id])).length;
}
function updateProgress(){
  const p=document.getElementById('pbar');if(!p||!cur)return;
  const n=cur.list.filter(answered).length, cnt=fmtCnt(n,cur.list.length);
  p.style.width=pct(n,cur.list.length)+'%';
  document.getElementById('ptxt').textContent=`${n} / ${cur.list.length} 응답`;
  const g=document.getElementById('gradeCnt');if(g)g.textContent=cnt;
  if(cur.mode==='study'){
    const c=document.getElementById('qc-'+cur.tab.id);if(c)c.textContent=cnt;
    if(!cur.graded){  // 풀던 답 저장 → 탭을 옮겨도 유지
      if(n||Object.keys(cur.ans).some(k=>{const v=cur.ans[k];return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:v!=null&&v!=='';}))
        S.drafts[cur.tab.id]=JSON.parse(JSON.stringify(cur.ans));
      else delete S.drafts[cur.tab.id];
      save();
    }
  }
}

/* ── 음성 선택 · 문제 읽기 · 그림/오디오 (qb-voice.js가 없으면 모두 숨김) ── */
const hasVoice=()=>!!(window.QBVoice&&QBVoice.supported());
const hasRead=()=>!!(window.QBVoice&&QBVoice.canSpeak());
const IC_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const IC_VOL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const VC=new Map();  // 학습 모드 문항별 음성 컨트롤러
function voiceReset(){VC.clear();if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}}
function voiceRow(q,fkp){
  const mic=hasVoice()&&['mc','multi','ox'].includes(q.ty), rd=hasRead();
  if(!mic&&!rd)return '';
  const qa=fkp?` data-q="${q.id}"`:'';
  return `<div class="vrow noprint">`+
    (mic?`<button type="button" class="vbtn vmic" data-act="vmic"${qa} data-fk="${fkp}-vmic" data-state="idle" aria-pressed="false">${IC_MIC}<span>말하기</span></button>`:'')+
    (rd?`<button type="button" class="vbtn" data-act="vread"${qa} data-fk="${fkp}-vread">${IC_VOL}<span>문제 읽기</span></button>`:'')+
    (mic?`<span class="vstat" aria-live="polite"></span><span class="vhint">말하기 어려우면 눌러서 고르세요</span>`:'')+`</div>`;
}
function mediaHTML(q){
  let h='';
  if(q.img&&q.img.src)h+=`<figure class="qfig"><img src="${esc(q.img.src)}" alt="${esc(q.img.alt)}" loading="lazy">${q.img.caption?`<figcaption>${esc(q.img.caption)}</figcaption>`:''}</figure>`;
  if(q.audio&&q.audio.src)h+=`<div class="qaud"><audio controls preload="none" src="${esc(q.audio.src)}"></audio><details><summary>대본</summary><p>${esc(q.audio.transcript)}</p></details></div>`;
  return h;
}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
// 읽어 줄 글: 문제 + 화면에 보이는 순서의 보기("1번 …")
function readText(q,n,order){
  let t=(n?`${n}번 문제. `:'')+plain(q.p)+'.';
  if(q.img&&q.img.alt)t+=' 그림 설명. '+q.img.alt+'.';
  if(q.ty==='ox')t+=' 맞으면 O, 틀리면 X.';
  else if(q.ty==='mc'||q.ty==='multi')t+=(order||range(q.o.length)).map((oi,k)=>` ${k+1}번. ${plain(q.o[oi])}.`).join('');
  return t;
}
function readAloud(text){if(QBVoice.isSpeaking())QBVoice.cancelSpeak();else QBVoice.speak(text);}
// 음성으로 고른 것 = 보기를 직접 누른 것과 같은 경로(입력 click → 기존 change/click 처리)
function voicePick(q,r){
  if(!cur||cur.graded)return;
  const card=document.getElementById('card-'+q.id);if(!card)return;
  const el=r.kind==='ox'?card.querySelector(`[data-act="ox"][data-v="${r.v==='O'?1:0}"]`):card.querySelector(`input[data-i="${r.i}"]`);
  if(el&&!el.disabled)el.click();
}
function studyVoice(q){
  let c=VC.get(q.id);if(c)return c;
  const card=()=>document.getElementById('card-'+q.id);
  c=QBVoice.attach({bind:false,button:()=>card()&&card().querySelector('.vmic'),live:()=>card()&&card().querySelector('.vstat'),
    getOptions:()=>q.ty==='ox'?2:q.o.length,getType:()=>q.ty,select:r=>voicePick(q,r)});
  VC.set(q.id,c);return c;
}

/* 학습 화면 상호작용 */
function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;
  else if(el.dataset.act==='tick'){
    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);
  }
  cur.armed=false;updateProgress();
}
function onSheetInput(el){
  if(el.dataset.act==='num'&&!cur.graded){cur.ans[el.dataset.q]=el.value;cur.armed=false;updateProgress();}
}

function viewStudy(tid,fresh){

function sheetResultHTML(){
  const n=cur.list.length, score=cur.list.filter(q=>isCorrect(q,finalAns(q))).length, p=pct(score,n);
  const msg=p===100?'만점입니다! 🎉':p>=80?'잘했어요. 틀린 문항의 해설과 자료 위치를 확인하세요.':p>=60?'절반 이상 이해했어요. 오답노트로 다시 풀어 보세요.':'자료를 한 번 더 읽고 다시 풀어 보세요.';
  return `<div class="panel"><div class="score">${score}<small> / ${n} · ${p}%</small></div><p class="msg">${msg}</p>

function gradeSheet(){
  const miss=cur.list.map((q,i)=>answered(q)?0:i+1).filter(Boolean);
  if(miss.length&&!cur.armed){
    cur.armed=true;
    document.getElementById('warn').textContent=`미응답 ${miss.length}문항 (Q${miss.join(', Q')}). 한 번 더 누르면 미응답은 오답으로 채점합니다.`;
    return;
  }
  const firstUnlock=!gameUnlocked();
  cur.graded=true;
  const snap={};let score=0;
  cur.list.forEach(q=>{
    const a=finalAns(q);
    if(a!=null)snap[q.id]=a;
    if(isCorrect(q,a)){score++;markSolved(q.id);}
    else addWrong(q.id,answerText(q,a));
  });
  if(cur.mode==='study'){
    S.tabs[cur.tab.id]={score,total:cur.list.length,answers:snap,touched:[...cur.touched],at:Date.now()};
    delete S.drafts[cur.tab.id];
  }
  save();
  renderSheet();
  window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
  say(`채점 결과 ${score}점, ${cur.list.length}문항 중`);
  if(cur.mode==='study'&&firstUnlock)setTimeout(()=>toast('⚡ 게임 모드와 해설지가 열렸습니다!'),300);
  else if(cur.mode==='study'&&allGraded())setTimeout(()=>toast('★ 모든 탭 완료! 종합 결과를 확인하세요.'),300);
}

function gamePool(scope){
  const M=GAME_MODES[gameSetup.mode];
  const base=ALLQ.filter(q=>q.game&&!q.audio&&M.types.includes(q.ty));  // 오디오 문항은 제한시간 안에 들을 수 없어 제외

  if(scope==='wrong'){const w=new Set(wrongList(false));return shuffle(base.filter(q=>w.has(q.id))).concat(shuffle(base.filter(q=>!w.has(q.id))));}
  return shuffle(base);
}

      <div class="chips">${counts.map(n=>chip('count',n,n===poolN&&!([10,20,30].includes(n))?`전체 ${n}`:String(n))).join('')}</div>
      <span class="lbl">출제 범위</span>
      <div class="chips">${chip('scope','all','전체 탭')}${chip('scope','played','풀어본 탭만')}${chip('scope','wrong','오답 우선',!wrongList(false).length)}</div>
      <div class="field"><label for="gnm">닉네임</label><input id="gnm" data-act="name" maxlength="20" value="${esc(S.name)}" placeholder="순위표에 표시"></div>
      <div class="rules"><p>⏱ 모든 문항 ${gameSetup.time}초 · 순위는 같은 풀이 시간끼리 비교</p><p>🎯 정답 100점 + 남은 1초당 10점 · 🔥 3연속 ×1.2, 5연속 ×1.5</p><p>⌨ 숫자 1~5로 선택, O/X 키, 복수 선택은 Enter로 제출</p></div>
      <button class="btn primary block" type="button" data-act="gstart">시작하기</button>
    </div>
  </div>`;
}
function startGame(){
  const pool=gamePool(gameSetup.scope).slice(0,gameSetup.count);
  if(!pool.length){toast('출제할 문항이 없습니다.');return;}
  G={qs:pool,i:0,score:0,combo:0,maxCombo:0,results:[],locked:false,mode:gameSetup.mode,time:gameSetup.time};
  renderGameQ();
}
function renderGameQ(){
  voiceReset();
  const q=G.qs[G.i];
  G.locked=false;G.elapsed=0;G.last=performance.now();G.limit=G.time*1000;G.warned=false;G.pick=[];
  G.view=q.ty==='ox'?[true,false]:shuffle(range(q.o.length));
  const opts=q.ty==='ox'
    ?`<div class="gox">${G.view.map((v,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}" aria-label="${v?'O 맞다':'X 틀리다'}">${v?'O':'X'}</button>`).join('')}</div>`
    :`<div class="gopts">${G.view.map((oi,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}"${q.ty==='multi'?' aria-pressed="false"':''}><kbd>${k+1}</kbd><span>${esc(q.o[oi])}</span></button>`).join('')}</div>`;
  app.innerHTML=`
  <div class="game play">
    <div class="gtop"><div class="hud"><span>${G.i+1} / ${G.qs.length}</span><span class="combo${G.combo>=3?' hot':''}">🔥 콤보 ${G.combo}</span><span class="pts">${G.score.toLocaleString()}점</span></div>
    <div class="timer" id="timer"><div id="tbar"></div></div><div class="tleft" id="tleft"></div></div>
    <div class="gtype">${TYPES[q.ty][0]}${q.ty==='multi'?' · 모두 고른 뒤 제출':''}</div>
    <div class="gq">${q.p}</div>${mediaHTML(q)}
    <div class="gbottom">${voiceRow(q,'g')}${opts}
    <div class="gfloat" id="gfloat" aria-live="polite"></div>
    <div class="gsub"><button class="btn" type="button" data-act="gquit">그만하기</button>
      ${q.ty==='multi'?'<button class="btn primary" type="button" data-act="gsubmit">제출 (Enter)</button>':''}</div></div>
  </div>`;
  if(hasVoice())G.vc=QBVoice.attach({bind:false,button:()=>app.querySelector('.vmic'),live:()=>app.querySelector('.vstat'),
    getOptions:()=>G.view.length,getType:()=>q.ty,
    select:r=>gameAnswer(r.kind==='ox'?(r.v==='O'?0:1):r.i),submit:q.ty==='multi'?gameSubmit:null});  // 말하면 클릭과 같게 바로 선택(·제출)
  G.raf=requestAnimationFrame(tick);
}
function tick(now){
  if(!G||G.locked)return;
  G.elapsed+=now-G.last;G.last=now;
  const rem=Math.max(0,G.limit-G.elapsed), ratio=rem/G.limit;
  const shown=RM.matches?Math.ceil(rem/1000)*1000/G.limit:ratio;
  const bar=document.getElementById('tbar'), tm=document.getElementById('timer');
  if(bar){bar.style.width=(Math.min(1,shown)*100)+'%';tm.className='timer'+(ratio<.25?' lo':ratio<.5?' mid':'');
    document.getElementById('tleft').textContent=(rem/1000).toFixed(1)+'초';}
  if(!G.warned&&rem<=5000){G.warned=true;say('5초 남았습니다');}
  if(rem<=0){judge(null,true);return;}
  G.raf=requestAnimationFrame(tick);
}
function judge(ans,timeout){
  if(!G||G.locked)return;
  G.locked=true;cancelAnimationFrame(G.raf);
  const q=G.qs[G.i], used=Math.min(G.elapsed,G.limit), ok=!timeout&&isCorrect(q,ans);
  let gain=0;
  if(ok){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const mult=G.combo>=5?1.5:G.combo>=3?1.2:1;
    gain=Math.round((100+Math.floor((G.limit-used)/100))*mult);G.score+=gain;}
  else G.combo=0;
  G.results.push({id:q.id,ok,ans,timeout,ms:used,gain});
  // 판정 표시
  app.querySelectorAll('[data-act="gans"]').forEach(b=>{
    const k=+b.dataset.k, v=G.view[k];
    const right=q.ty==='ox'?q.a===v:q.ty==='mc'?q.a===v:q.a.includes(v);
    const picked=q.ty==='ox'||q.ty==='mc'?ans===v:(ans||[]).includes(v);
    if(right)b.classList.add('ans');else if(picked)b.classList.add('miss');
    b.disabled=true;
  });
  const f=document.getElementById('gfloat');
  f.className='gfloat pop '+(ok?'ok':'no');
  f.textContent=ok?`+${gain}${G.combo>=3?` 🔥×${G.combo>=5?'1.5':'1.2'}`:''}`:timeout?'⏰ 시간 초과':'✗ 오답';
  if(timeout){const tm=document.getElementById('timer');tm&&tm.classList.add('out');}
  const sb=app.querySelector('[data-act="gsubmit"]');if(sb)sb.disabled=true;
  app.querySelector('.pts').textContent=G.score.toLocaleString()+'점';
  const c=app.querySelector('.combo');c.textContent='🔥 콤보 '+G.combo;c.classList.toggle('hot',G.combo>=3);
  G.next=setTimeout(()=>{if(!G)return;G.i++;G.i<G.qs.length?renderGameQ():finishGame();},ok?900:1400);
}
function gameAnswer(k){
  if(!G||G.locked)return;
  const q=G.qs[G.i];if(k<0||k>=G.view.length)return;
  if(q.ty==='multi'){
    const v=G.view[k], i=G.pick.indexOf(v);
    i<0?G.pick.push(v):G.pick.splice(i,1);
    const b=app.querySelector(`[data-act="gans"][data-k="${k}"]`);b&&b.setAttribute('aria-pressed',i<0);
  }else judge(G.view[k],false);
}
function gameSubmit(){if(G&&!G.locked&&G.qs[G.i].ty==='multi')judge(G.pick.slice(),false);}
function stopGame(){if(G){cancelAnimationFrame(G.raf);clearTimeout(G.next);G=null;}}
function finishGame(){
  const R=G.results, correct=R.filter(r=>r.ok).length, M=GAME_MODES[G.mode];
  R.forEach(r=>{const q=QMAP[r.id];if(r.ok)markSolved(r.id);else addWrong(r.id,r.timeout?'(시간 초과)':answerText(q,r.ans));});
  const rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:(S.name||'').trim()||'익명',score:G.score,
    correct,total:R.length,rate:pct(correct,R.length),avg:Math.round(R.reduce((s,r)=>s+r.ms,0)/R.length/100)/10,combo:G.maxCombo,mode:G.mode,time:G.time,at:Date.now()};
  const rank=Leaderboard.add(rec);
  save();
  const board=Leaderboard.load(boardKey(rec)), top=board.slice(0,10), mine=board.find(r=>r.id===rec.id);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;
  const row=(r,i)=>`<tr class="${r.id===rec.id?'me':''}"><td>${medal(i)}</td><td>${esc(r.name)}</td><td class="r">${r.score.toLocaleString()}</td><td class="r">${r.rate}%</td><td class="r">${r.correct}/${r.total}</td><td class="r">${new Date(r.at).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}</td></tr>`;
  const wrong=R.filter(r=>!r.ok);
  G=null;
  app.innerHTML=`
  <div class="game">
    <div class="panel center">
      <p class="note-sm" style="margin:0">최종 점수</p>
      <div class="score xl">${rec.score.toLocaleString()}</div>
      <p class="msg">${M.title} · ${rec.time}초 — ${rank===1?'🏆 이 조건 최고 기록!':`이 조건 순위 ${rank}위`}</p>
      <div class="bignum"><div><b>${correct}/${rec.total}</b><span>정답</span></div><div><b>${rec.rate}%</b><span>정답률</span></div><div><b>${rec.avg}초</b><span>평균 응답</span></div><div><b>${rec.combo}</b><span>최고 콤보</span></div></div>
    </div>
    <div class="panel"><h2 class="ph">🏆 순위 · ${M.title.replace(/^\S+\s/,'')} ${rec.time}초 · 이 브라우저 기록</h2>
      <table class="board"><thead><tr><th>#</th><th>이름</th><th class="r">점수</th><th class="r">정답률</th><th class="r">정답</th><th class="r">날짜</th></tr></thead>
      <tbody>${top.map(row).join('')}${rank>10&&mine?row(mine,rank-1):''}</tbody></table></div>
    ${wrong.length?`<details class="more panel"><summary>틀린 문항 ${wrong.length}개 · 해설 보기 (오답노트에 저장됨)</summary>
      ${wrong.map(r=>{const q=QMAP[r.id];return `<div class="keyitem"><div class="kq">${q.p}</div><p class="mine" style="margin:4px 0">내 답: ${esc(r.timeout?'(시간 초과)':answerText(q,r.ans))}</p><p class="ka">정답: ${esc(correctText(q))}</p><p class="kw">${q.w}</p><span class="an">📖 ${esc(q.an)}</span></div>`;}).join('')}</details>`:''}
    <div class="actions"><button class="btn primary" type="button" data-act="gagain">↻ 다시 하기</button><a class="btn" href="#notes">📒 오답노트</a><a class="btn" href="#home">홈</a></div>
  </div>`;
}

/* ── 라우터 · 이벤트 ───────────────────── */
function route(){
  stopGame();voiceReset();cur=null;app.classList.remove('sheet');
  const [v,arg]=(location.hash.slice(1)||'home').split('/');
  ({study:()=>viewStudy(arg),notes:viewNotes,retry:viewRetry,key:viewKey,game:()=>arg?viewGameSetup(arg):viewGamePick(),summary:viewSummary}[v]||viewHome)();
  window.scrollTo(0,0);
}
let resetArmed=false;
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act;
  if(cur&&['ox','ml','mr','ord','hint','src'].includes(act))return onSheetClick(el);
  switch(act){
    case 'grade':gradeSheet();break;
    case 'retab':viewStudy(cur.tab.id,true);window.scrollTo(0,0);break;  // 이전 점수는 다시 채점할 때까지 유지
    case 'onlywrong':cur.onlyWrong=!cur.onlyWrong;document.getElementById('cards').classList.toggle('onlywrong',cur.onlyWrong);el.textContent=cur.onlyWrong?'전체 보기':'오답만 보기';break;
    case 'copyreport':copy(reportMD());break;
    case 'copynotes':copy(`# ${BANK.title}\n\n- 이름: ${S.name||'-'} · ${today()}\n\n`+notesMD(false));break;
    case 'clearsolved':wrongList(true).forEach(id=>delete S.wrong[id]);save();viewNotes();break;
    case 'print':window.print();break;
    case 'reset':
      if(!resetArmed){resetArmed=true;el.textContent='정말 지울까요? 한 번 더 누르세요';setTimeout(()=>{resetArmed=false;if(el.isConnected)el.textContent='이 문제은행 기록 모두 지우기';},4000);break;}
      resetArmed=false;const nm=S.name;S=blank();S.name=nm;save();toast('기록을 지웠습니다');viewHome();break;
    case 'gset':gameSetup[el.dataset.g]=['count','time'].includes(el.dataset.g)?+el.dataset.v:el.dataset.v;viewGameSetup();break;
    case 'gstart':startGame();break;
    case 'gans':gameAnswer(+el.dataset.k);break;
    case 'vmic':{const q=G?null:QMAP[el.dataset.q];const c=G?G.vc:(q&&cur?studyVoice(q):null);if(c)c.toggle();break;}
    case 'vread':{
      if(G){const q=G.qs[G.i];readAloud(readText(q,0,q.ty==='ox'?null:G.view));break;}
      const q=QMAP[el.dataset.q], card=document.getElementById('card-'+el.dataset.q);
      if(q)readAloud(readText(q,card?card.dataset.n:0));break;}
    case 'gsubmit':gameSubmit();break;
    case 'gquit':stopGame();viewGameSetup(gameSetup.mode);break;
    case 'gagain':startGame();break;
  }
});
app.addEventListener('change',e=>{const el=e.target;if(cur&&el.dataset&&(el.dataset.act==='pick'||el.dataset.act==='tick'))onSheetChange(el);});
app.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.act==='name'){S.name=el.value;save();}
  else if(cur)onSheetInput(el);
});
document.addEventListener('keydown',e=>{
  if(!G||G.locked||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.target.matches&&e.target.matches('input,textarea'))return;
  const q=G.qs[G.i], k=e.key.toLowerCase();
  if(q.ty==='ox'){if(k==='o'||k==='1'){e.preventDefault();gameAnswer(0);}else if(k==='x'||k==='2'){e.preventDefault();gameAnswer(1);}return;}
  if(/^[1-9]$/.test(k)){e.preventDefault();gameAnswer(+k-1);}
  else if(k==='enter'&&q.ty==='multi'&&!(e.target.closest&&e.target.closest('.vrow'))){e.preventDefault();gameSubmit();}
});
window.addEventListener('pagehide',()=>{if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}});
document.addEventListener('visibilitychange',()=>{if(G&&!document.hidden)G.last=performance.now();});
// 탭 바 좌우 화살표
app.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('.tabchip');if(!t||(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'))return;
  const n=e.key==='ArrowRight'?t.nextElementSibling:t.previousElementSibling;if(n){e.preventDefault();n.focus();}
});
/* 테마 */
let theme=null;try{theme=localStorage.getItem('qb:theme');}catch(e){}
const applyTheme=()=>{if(theme)document.documentElement.dataset.theme=theme;else delete document.documentElement.dataset.theme;};
applyTheme();
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  theme=dark?'light':'dark';try{localStorage.setItem('qb:theme',theme);}catch(e){}applyTheme();
});
document.title=BANK.title+' · 문제은행';
window.addEventListener('hashchange',route);
route();
})();
</script>
