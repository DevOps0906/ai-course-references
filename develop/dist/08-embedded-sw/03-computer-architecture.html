'use strict';
const BANK={"id":"emb-arch","code":"EAR","title":"임베디드 SW · 컴퓨터 구조 (3일)","subtitle":"4대 부품과 사양표 · 2진수·문자·색 · 게이트에서 명령 실행까지","course":"08 · 임베디드 · 시스템 SW","source":"08-AI_CAMPUS-main/컴퓨터구조_Day1~3.pdf","salt":"emb-arch","version":1,"updated":"2026-10-16","tabs":[{"id":"t1","title":"4대 부품과 역할","ref":"컴퓨터구조 Day1 S2–S5 p.8–46","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"CPU가 맡는 역할은?","o":["계산과 명령 처리","지금 쓰는 것 올려두기","꺼도 남는 파일 보관","입력과 출력 담당"],"a":0,"h":"수업은 CPU를 '일하는 손'에 비유했습니다. 손이 하는 일, 즉 주어진 일을 계산하고 명령을 처리하는 부품이 무엇인지 떠올려 보세요.","w":"CPU는 계산과 명령을 처리하는 '일하는 손'입니다. 올려두기는 메모리, 보관은 저장장치, 입출력은 키보드·모니터 같은 입출력장치의 일입니다.","an":"컴퓨터구조 Day1 S3 p.19–20","src":"CPU가 하는 일\n역할\n계산과 명령 처리\nS2에서 본 위치\n메인보드 가운데"},{"id":"t1-02","ty":"mc","lv":1,"game":true,"p":"본체 안에서 메모리(RAM)가 꽂혀 있는 위치는?","o":["메인보드 가운데 방열판 아래","CPU 바로 옆 슬롯","본체 바깥 단자","케이블로 연결된 상자"],"a":1,"h":"메모리는 길쭉한 막대 모양으로 메인보드 슬롯에 꽂혀 있습니다. 손(CPU)과 작업대(메모리)는 가까워야 일이 빠르다고 했으니 어느 부품 곁에 있는지 생각해 보세요.","w":"메모리는 길쭉한 막대 모양으로 CPU 바로 옆 슬롯에 꽂힙니다. 방열판 아래 네모난 칩은 CPU, 본체 바깥 단자는 입출력장치의 위치입니다.","an":"컴퓨터구조 Day1 S2 p.10–11","src":"부품 2 / 4\n메모리 (RAM)\n생김새\n길쭉한 막대 모양\n위치\nCPU 바로 옆 슬롯\n내부 사진에서 이 부품을 직접 짚어 봅니다"},{"id":"t1-03","ty":"mc","lv":1,"game":true,"p":"수업에서 저장장치(SSD/HDD)에 붙인 비유는?","o":["일하는 손","작업대","창고","출입구"],"a":2,"h":"저장장치는 전원을 꺼도 파일이 남는 곳이며, 지금 당장 쓰지 않는 것도 오래 보관합니다. 물건을 오래 쌓아 두는 공간을 떠올리면 비유가 보입니다.","w":"저장장치는 꺼도 남는 '창고'입니다. 손은 CPU, 작업대는 메모리, 출입구는 입출력장치의 비유입니다.","an":"컴퓨터구조 Day1 S4 p.29–30","src":"비유 — 저장장치는 창고\n뜻\n지금 안 쓰는 것도 오래 보관하는 곳\n앞으로 저장장치가 나오면 「창고」를 떠올립니다"},{"id":"t1-04","ty":"mc","lv":2,"game":true,"p":"메모리 슬롯이 CPU 바로 옆에 있는 이유로 수업에서 든 것은?","o":["열을 함께 식히려고","전원을 나눠 쓰려고","저장장치와 떨어뜨리려고","가까워야 일이 빨라서"],"a":3,"h":"수업은 CPU를 손, 메모리를 작업대로 비유했습니다. '거리 경주' 애니메이션처럼 손과 작업대 사이의 거리가 짧을수록 작업 속도가 어떻게 달라지는지 생각해 보세요.","w":"손과 작업대가 가까워야 일이 빠르기 때문에 메모리 슬롯은 CPU 바로 옆에 있습니다. 나머지 보기는 자료에서 이유로 들지 않았습니다.","an":"컴퓨터구조 Day1 S3 p.23","src":"둘이 붙어 있어야 하는 이유\n이유\n손과 작업대가 가까워야 일이 빠르다\n실제로도\n메모리 슬롯은 CPU 바로 옆에 있다"},{"id":"t1-05","ty":"mc","lv":3,"game":true,"p":"학생A가 저장(Ctrl+S) 없이 쓰던 글이 전원이 꺼지자 사라졌습니다. 글이 있던 곳은?","o":["메모리(작업대)","저장장치(창고)","입출력장치(출입구)","CPU(손)"],"a":0,"h":"저장하기 전의 글은 지금 쓰는 중인 내용이라 작업대에만 올라가 있습니다. 작업대는 끄면 사라지고 창고는 꺼도 남는다는 차이 표를 떠올려 보세요.","w":"저장하지 않은 작업은 메모리에만 올라가 있어 전원을 끄면 사라집니다. Ctrl+S는 그 내용을 꺼도 남는 저장장치로 옮기는 동작입니다.","an":"컴퓨터구조 Day1 S4 p.31 (전원 실험 · Ctrl+S의 정체)","src":"메모리와 저장장치의 차이\n메모리 (작업대)\n끄면 사라진다\n지금 쓰는 것만 올려둠\n저장장치 (창고)\n꺼도 남는다\n파일을 오래 보관함"},{"id":"t1-06","ty":"ox","lv":2,"game":true,"p":"메모리(RAM)에 올려둔 내용은 전원을 꺼도 그대로 남는다.","a":false,"h":"메모리(작업대)는 지금 쓰는 것만 올려두는 곳이고, 저장장치(창고)는 파일을 오래 보관하는 곳입니다. 전원 실험에서 둘 중 어느 쪽이 꺼지면 내용이 사라졌는지 떠올려 보세요.","w":"메모리는 끄면 사라지고 지금 쓰는 것만 올려둡니다. 꺼도 남는 곳은 저장장치입니다.","an":"컴퓨터구조 Day1 S4 p.31","src":"메모리와 저장장치의 차이\n메모리 (작업대)\n끄면 사라진다\n지금 쓰는 것만 올려둠\n저장장치 (창고)\n꺼도 남는다\n파일을 오래 보관함"},{"id":"t1-07","ty":"ox","lv":1,"game":true,"p":"키보드·마우스는 입력장치, 모니터는 출력장치에 해당한다.","a":true,"h":"입출력장치는 컴퓨터로 들어가고 나오는 출입구입니다. 사람이 컴퓨터에 무언가를 넣는 장치와 컴퓨터가 결과를 내보내 보여 주는 장치를 나눠 생각해 보세요.","w":"입력은 넣는 것(키보드·마우스), 출력은 내보내는 것(모니터)입니다. 둘을 합쳐 입출력장치, 비유로는 '출입구'라고 부릅니다.","an":"컴퓨터구조 Day1 S4 p.32–33","src":"입출력장치가 하는 일\n입력 — 넣는 것\n키보드 · 마우스\n출력 — 내보내는 것\n모니터"},{"id":"t1-08","ty":"match","lv":2,"game":false,"p":"4대 부품과 수업의 비유를 연결하세요.","pairs":[["CPU","일하는 손"],["메모리(RAM)","작업대"],["저장장치(SSD/HDD)","창고"],["입출력장치","출입구"]],"h":"CPU는 실제로 일을 하고, 메모리는 일할 재료를 펼쳐 두며, 저장장치는 꺼도 남게 보관하고, 입출력장치는 드나드는 문 역할을 합니다. 각 역할에 맞는 일상 사물을 짝지어 보세요.","w":"CPU는 손, 메모리는 작업대, 저장장치는 창고, 입출력장치는 출입구입니다. 이 네 비유는 Day 1 내내, 사양표를 읽을 때도 그대로 쓰입니다.","an":"컴퓨터구조 Day1 S4 정리 p.34","src":"정리 — 4대 부품, 역할 완성\nCPU\n일하는 손\n메모리\n작업대\n저장장치\n창고\n입출력장치\n출입구\nS2의 이름 4개에 오늘까지 역할 4개가 모두 붙었습니다"},{"id":"t1-09","ty":"order","lv":2,"game":false,"p":"프로그램이 화면에 뜨기까지 데이터가 지나가는 순서대로 나열하세요.","steps":["저장장치에서 프로그램을 꺼낸다","메모리에 올린다","CPU가 명령을 처리한다","결과가 화면으로 나간다"],"h":"프로그램은 처음에 창고(저장장치)에 보관돼 있습니다. 먼저 꺼내 작업대에 올린 뒤 손이 처리하고, 마지막에 결과가 출입구를 통해 화면으로 나갑니다.","w":"저장장치에서 꺼내 메모리에 올리고, CPU가 처리한 뒤 모니터로 내보냅니다. '로딩'은 창고에서 작업대로 옮기는 단계입니다.","an":"컴퓨터구조 Day1 S5 p.40–44","src":"한 그림으로\n네 부품이 데이터를 주고받는 순서\n저장장치\n꺼낸다\n→\n메모리\n올린다\n→\nCPU\n처리한다\n→\n화면\n보여준다\n실습에서는 이 화살표를 여러분이 직접 그립니다"},{"id":"t1-10","ty":"multi","lv":3,"game":true,"p":"전원을 껐다 다시 켰을 때 그대로 남아 있는 것을 모두 고르세요.","o":["SSD에 저장한 사진","Ctrl+S로 저장한 문서","RAM에만 있던 작업 내용","저장 안 한 열린 문서","HDD에 보관한 영상"],"a":[0,1,4],"h":"전원을 꺼도 남는 것은 창고(SSD/HDD)에 들어간 파일뿐입니다. Ctrl+S는 작업대의 내용을 창고로 옮기는 동작이고, 저장하지 않은 채 열려 있기만 한 내용은 작업대에만 있습니다.","w":"SSD·HDD 같은 저장장치에 들어간 파일은 꺼도 남습니다. RAM에만 있던 내용과 저장하지 않은 문서는 작업대 위에만 있었으므로 사라집니다.","an":"컴퓨터구조 Day1 S4 p.31 · 실습 4 p.35","src":"메모리와 저장장치의 차이\n메모리 (작업대)\n끄면 사라진다\n지금 쓰는 것만 올려둠\n저장장치 (창고)\n꺼도 남는다\n파일을 오래 보관함"}]},{"id":"t2","title":"사양표 읽기와 켜짐·꺼짐","ref":"컴퓨터구조 Day1 S6–S8 p.48–73 · Day2 S1 p.1–11","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"사양표에서 CPU의 GHz가 뜻하는 것은?","o":["1초에 일하는 횟수","일하는 손의 개수","한 번에 올려둘 양","보관할 수 있는 양"],"a":0,"h":"GHz는 CPU가 일하는 속도를 나타내는 숫자로, 클수록 빠르다고 했습니다. 비유로는 손이 얼마나 빨리 움직이는지, 즉 일정 시간 동안 몇 번 일하는지를 뜻합니다.","w":"GHz는 CPU가 1초에 일하는 횟수로, 클수록 빠릅니다. 손의 개수는 코어, 올려둘 양은 메모리 GB, 보관량은 저장장치 GB입니다.","an":"컴퓨터구조 Day1 S6 p.50","src":"GHz — CPU가 일하는 속도\n뜻\n1초에 일하는 횟수 — 클수록 빠르다\n비유로\n손이 움직이는 속도"},{"id":"t2-02","ty":"mc","lv":1,"game":true,"p":"CPU의 '코어'에 붙인 비유는?","o":["손이 움직이는 속도","작업대의 넓이","손이 몇 개인가","창고의 크기"],"a":2,"h":"코어가 여러 개면 여러 일을 동시에 할 수 있습니다. CPU를 '손'에 비유했으니, 동시에 여러 일을 하려면 손에서 무엇이 늘어나야 하는지 생각해 보세요.","w":"코어는 일하는 손의 개수입니다. 손이 움직이는 속도는 GHz, 작업대 넓이는 메모리 GB, 창고 크기는 저장장치 GB의 비유입니다.","an":"컴퓨터구조 Day1 S6 p.51","src":"코어 — 일하는 손의 개수\n뜻\n여러 개면 여러 일을 동시에\n비유로\n손이 몇 개인가"},{"id":"t2-03","ty":"mc","lv":2,"game":true,"p":"메모리(RAM)의 GB가 크다는 것은 비유로 무엇이 크다는 뜻인가요?","o":["창고의 크기","작업대의 넓이","손의 개수","출입구의 수"],"a":1,"h":"메모리의 GB는 한 번에 올려둘 수 있는 양을 뜻합니다. 메모리를 작업대에 비유했으니, 재료를 한꺼번에 많이 펼치려면 작업대의 어떤 크기가 커야 하는지 생각해 보세요.","w":"메모리 GB는 한 번에 올려둘 수 있는 양, 곧 작업대의 넓이입니다. 같은 GB라도 저장장치에 붙으면 창고의 크기를 뜻합니다.","an":"컴퓨터구조 Day1 S6 p.52–53","src":"GB — 메모리의 크기\n뜻\n한 번에 올려둘 수 있는 양\n비유로\n작업대의 넓이"},{"id":"t2-04","ty":"mc","lv":2,"game":true,"p":"시스템 정보의 저장장치 항목에서 찾아야 할 것은?","o":["속도(GHz)와 코어 수","크기(GB)만","이름과 코어 수","크기(GB)와 종류(SSD/HDD)"],"a":3,"h":"시스템 정보에서 CPU는 이름·속도·코어 수를 찾았습니다. 저장장치 항목에서는 얼마나 보관할 수 있는지를 나타내는 용량 단위와, SSD인지 HDD인지를 구분하는 정보를 함께 찾습니다.","w":"저장장치는 크기(GB)와 종류(SSD/HDD)를 찾습니다. 이름·GHz·코어 수는 CPU 항목, 크기(GB)만 찾는 것은 RAM 항목입니다.","an":"컴퓨터구조 Day1 S7 p.60–62","src":"저장장치 항목 찾기\n찾을 것\n크기(GB) · 종류(SSD/HDD)"},{"id":"t2-05","ty":"mc","lv":3,"game":true,"p":"전구 8개를 왼쪽부터 읽으니 꺼짐·켜짐·켜짐·꺼짐·켜짐·꺼짐·꺼짐·켜짐입니다. 기록할 값은?","o":["10010110","01101001","01101010","11101001"],"a":1,"h":"켜짐은 1, 꺼짐은 0으로 적고 반드시 왼쪽부터 차례로 옮겨 적습니다. 꺼짐·켜짐·켜짐·꺼짐·켜짐·꺼짐·꺼짐·켜짐을 한 칸씩 숫자로 바꿔 8자리를 만들어 보세요.","w":"왼쪽부터 0 1 1 0 1 0 0 1이므로 01101001입니다. 10010110은 0과 1을 거꾸로 약속했을 때의 값이고, 틀렸다면 읽는 방향부터 의심합니다.","an":"컴퓨터구조 Day2 S1 p.5–9","src":"두 상태를 숫자로 적으면\n켜짐은 1, 꺼짐은 0\n• 여덟 칸이면 여덟 자리 숫자\n• 오늘 하루 내내 쓸 표기\n1 / 0"},{"id":"t2-06","ty":"ox","lv":2,"game":true,"p":"부품 속 전기 상태에는 켜짐과 꺼짐 사이의 중간 상태도 있다.","a":false,"h":"부품 속 전기는 흐른다와 흐르지 않는다, 두 가지만 구분합니다. 수업에서는 켜짐과 꺼짐 두 상태뿐이며 그 사이 상태는 없다고 강조했습니다.","w":"부품은 켜짐과 꺼짐 두 상태만 구분하며 중간은 없습니다. 그래서 1과 0 두 숫자로 적을 수 있습니다.","an":"컴퓨터구조 Day2 S1 p.4–5","src":"부품은 두 가지만 구분한다\n전기가 흐른다, 흐르지 않는다\n• 켜짐과 꺼짐 — 두 상태뿐\n• 중간은 없다\nON / OFF"},{"id":"t2-07","ty":"ox","lv":1,"game":true,"p":"CPU 코어가 여러 개면 여러 일을 동시에 처리할 수 있다.","a":true,"h":"코어는 CPU 안에서 일하는 손의 개수에 해당합니다. '코어 경주'에서 손이 늘어나면 여러 작업을 나눠 맡아 한꺼번에 진행할 수 있었는지 떠올려 보세요.","w":"코어는 일하는 손의 개수이므로 여러 개면 여러 일을 동시에 합니다. 한 손이 빨라지는 것은 GHz의 몫입니다.","an":"컴퓨터구조 Day1 S6 p.51","src":"코어 — 일하는 손의 개수\n뜻\n여러 개면 여러 일을 동시에\n비유로\n손이 몇 개인가"},{"id":"t2-08","ty":"match","lv":2,"game":false,"p":"사양표의 숫자와 그 비유를 연결하세요.","pairs":[["CPU의 GHz","손이 움직이는 속도"],["CPU의 코어 수","손의 개수"],["메모리의 GB","작업대의 넓이"],["저장장치의 GB","창고의 크기"]],"h":"S7에서 숫자를 읽는 방식은 GHz는 손의 속도, 코어는 손의 개수, GB는 작업대와 창고의 크기였습니다. 메모리는 작업대(넓이), 저장장치는 창고(크기)라는 점을 구분해 연결하세요.","w":"GHz는 손의 속도, 코어는 손의 개수, 메모리 GB는 작업대 넓이, 저장장치 GB는 창고 크기입니다. 같은 GB라도 어느 부품 줄에 있는지로 뜻이 달라집니다.","an":"컴퓨터구조 Day1 S6 p.50–53 · S7 p.63","src":"숫자를 S6 방식으로 읽기\n1 GHz를 보면 — 손이 일하는 속도\n2 코어를 보면 — 손의 개수\n3 GB를 보면 — 작업대와 창고의 크기"},{"id":"t2-09","ty":"order","lv":1,"game":false,"p":"예시 사양표를 한 줄씩 읽는 순서대로 나열하세요.","steps":["CPU 줄에서 GHz와 코어 수를 찾는다","메모리 줄에서 GB를 찾는다","저장장치 줄에서 GB를 찾는다"],"h":"사양표는 부품 순서대로 한 줄씩 내려가며 읽습니다. 손(CPU)의 속도와 개수를 먼저 보고, 이어서 작업대(메모리), 마지막으로 창고(저장장치)의 크기를 확인합니다.","w":"CPU 줄의 GHz·코어 수, 메모리 줄의 GB, 저장장치 줄의 GB 순으로 읽습니다. 같은 순서를 S7에서 내 컴퓨터의 시스템 정보에 그대로 적용합니다.","an":"컴퓨터구조 Day1 S6 p.54","src":"사양표 한 줄씩 읽기\n예시 사양표에서 함께 찾아봅니다\n1 CPU 줄에서 GHz와 코어 수를 찾는다\n2 메모리 줄에서 GB를 찾는다\n3 저장장치 줄에서 GB를 찾는다"},{"id":"t2-10","ty":"multi","lv":3,"game":true,"p":"학생A가 시스템 정보에서 'GB'로 적힌 숫자를 찾고 있습니다. 해당 항목을 모두 고르세요.","o":["메모리(RAM) 크기","저장장치 크기","CPU 속도","CPU 코어 수","CPU 이름"],"a":[0,1],"h":"CPU 항목에서 찾는 숫자는 속도(GHz)와 코어 수였습니다. 반면 메모리와 저장장치는 작업대의 넓이와 창고의 크기를 나타내므로 둘 다 같은 용량 단위로 적혀 있습니다.","w":"GB는 메모리 크기와 저장장치 크기에 붙는 단위입니다. CPU 속도는 GHz, 코어는 개수로 적힙니다.","an":"컴퓨터구조 Day1 S7 p.60–63","src":"내 숫자 세 개 확인\n완성한 사양표에서 소리 내어 읽어 봅니다\n1 내 CPU 속도는 몇 GHz인가\n2 내 메모리는 몇 GB인가\n3 내 저장장치는 몇 GB인가"}]},{"id":"t3","title":"자릿값 변환과 단위","ref":"컴퓨터구조 Day2 S2–S3 p.12–31","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"8칸 2진수에서 가장 왼쪽 칸의 자릿값은?","o":["8","64","128","256"],"a":2,"h":"2진수 8칸은 오른쪽 끝 칸이 1이고 왼쪽으로 한 칸 갈 때마다 자릿값이 2배가 됩니다. 1, 2, 4, 8, …로 여덟 번째 칸까지 두 배씩 늘려 가 보세요.","w":"8칸의 자릿값은 왼쪽부터 128 64 32 16 8 4 2 1입니다. 256은 9번째 칸이 있어야 나오는 값입니다.","an":"컴퓨터구조 Day2 S2 p.14","src":"2진수의 자릿값\n자리마다 2배가 되는 수\n• 여덟 칸의 이름값\n• 이 표 하나로 오늘 오전이 끝난다\n128 64 32 16 8 4 2 1"},{"id":"t3-02","ty":"num","lv":2,"game":false,"p":"2진수 <code>10110010<\/code>을 10진수로 바꾸면?","a":178,"h":"2진수를 10진수로 바꿀 때는 1이 켜진 자리의 자릿값만 더합니다. 10110010에서 켜진 자리는 128, 32, 16, 2의 자리이므로 128 + 32 + 16 + 2를 계산하면 됩니다.","w":"1이 있는 자리의 자릿값 128, 32, 16, 2를 더하면 178입니다. 실습 2의 1부 정답 중 하나이며, 반대로 178을 덜어내기로 바꿔 검산합니다.","an":"컴퓨터구조 Day2 S2 p.15 · 정답 확인 p.19","src":"2진수를 10진수로\n켜진 자리의 자릿값을 더한다\n• 01100100은 64와 32와 4\n• 저울 접시에 자릿값이 굴러 떨어진다\n01100100 → 100"},{"id":"t3-03","ty":"mc","lv":3,"game":true,"p":"10진수 167을 8칸 2진수로 바꾸면?","o":["10100111","10100110","11100111","10010111"],"a":0,"h":"10진수를 2진수로 바꿀 때는 128부터 큰 자릿값 순서로 '들어가는가?'를 묻습니다. 들어가면 1을 적고 그만큼 덜어내며, 못 들어가면 0을 적습니다. 167에서 128, 32, 4, 2, 1을 차례로 덜어 보세요.","w":"167 − 128 = 39, 39 − 32 = 7, 7 = 4 + 2 + 1이므로 10100111입니다. 끝자리를 0으로 쓰면 166이 됩니다.","an":"컴퓨터구조 Day2 S2 p.16","src":"10진수를 2진수로\n큰 자릿값부터 덜어낸다\n• 128부터 순서대로 물어본다\n• 들어가면 1, 못 들어가면 0\n167 → 10100111"},{"id":"t3-04","ty":"mc","lv":1,"game":true,"p":"1바이트는 몇 비트인가요?","o":["4비트","1,024비트","16비트","8비트"],"a":3,"h":"한 칸(0 또는 1)이 비트이고, 아침에 본 전구 여덟 칸을 하나로 묶은 것이 바이트입니다. 글자 하나가 사는 크기이며, 단위 사다리에서 유일하게 예외적인 배율이라고 했습니다.","w":"8비트가 1바이트이며, 글자 하나가 사는 크기입니다. 단위 사다리에서 배율이 8인 유일한 예외입니다.","an":"컴퓨터구조 Day2 S3 p.24","src":"여덟 칸 묶음\n8비트가 1바이트\n• 글자 하나가 사는 크기\n• 사다리의 유일한 예외 배율 — 8\n8비트 = 1바이트"},{"id":"t3-05","ty":"mc","lv":2,"game":true,"p":"단위 사다리에서 바이트→KB→MB→GB로 한 칸 올라갈 때의 배율은?","o":["10배","1,024배","1,000배","8배"],"a":1,"h":"단위 사다리에서 바이트부터 KB, MB, GB로 올라갈 때마다 같은 배율로 커집니다. 수업은 이 배율이 10이나 1,000이 아니라 2를 열 번 곱한 수라고 강조했습니다.","w":"묶음이 커질 때마다 1,024배입니다. 8배는 비트→바이트에만 쓰이는 예외 배율입니다.","an":"컴퓨터구조 Day2 S3 p.25 · 정답 확인 p.29","src":"1024배씩 커지는 사다리\n바이트, KB, MB, GB\n• 묶음이 커질 때마다 1,024배\n• 10이 아니라 1,024\n×1024"},{"id":"t3-06","ty":"ox","lv":1,"game":true,"p":"비트는 0 아니면 1을 담는 가장 작은 칸이다.","a":true,"h":"아침 보너스 문제 '여덟 칸의 이름'에서 한 칸을 부르는 이름을 떠올려 보세요. 그 칸에는 0 아니면 1 하나만 담기며, 이보다 작은 단위는 없습니다.","w":"한 칸이 비트이고, 0 또는 1 하나를 담는 가장 작은 단위입니다. 여덟 칸을 묶으면 바이트가 됩니다.","an":"컴퓨터구조 Day2 S3 p.23","src":"여덟 칸의 이름\n한 칸이 비트다\n• 아침 보너스 문제의 정답\n• 0 아니면 1을 담는 가장 작은 칸\n1비트 = 0/1 한 칸"},{"id":"t3-07","ty":"ox","lv":2,"game":true,"p":"8칸 2진수로 52를 적을 때는 앞쪽 빈 칸을 생략해 110100으로 적는다.","a":false,"h":"2진수는 칸 수가 정해진 8칸짜리 방이라서 빈 방도 0으로 채워 적습니다. 52를 6자리로만 적으면 앞의 두 칸이 비게 되니, 빈 칸 처리 규칙을 적용해 보세요.","w":"2진수는 8칸짜리 방이므로 빈 방도 0으로 채워 00110100으로 적습니다. 칸 수가 정해져 있다는 점이 오후 정수 단원의 복선입니다.","an":"컴퓨터구조 Day2 S2 p.20","src":"빈 방도 0으로\n2진수는 8칸짜리 방이다\n• 110100이 아니라 00110100\n• 칸 수가 정해져 있다는 것 — 오후의 복선\n00110100"},{"id":"t3-08","ty":"match","lv":2,"game":false,"p":"일상 물건과 수업에서 짝지은 크기를 연결하세요.","pairs":[["문서 1쪽","30KB"],["사진 1장","4MB"],["노래 1곡","8MB"],["영화 1편","4GB"]],"h":"수업에서 문서·사진·노래·영화를 30KB, 4MB, 8MB, 4GB와 짝지었습니다. 문서가 가장 작고 영화가 가장 크며, 사진보다 노래가 조금 더 크다는 순서로 연결해 보세요.","w":"문서 30KB, 사진 4MB, 노래 8MB, 영화 4GB입니다. 단위와 물건을 짝지어 두면 내 컴퓨터의 GB가 얼마나 큰지 감이 옵니다.","an":"컴퓨터구조 Day2 S3 p.26 (용량 저울)","src":"일상 물건의 크기\n문서, 사진, 노래, 영화\n• 30KB, 4MB, 8MB, 4GB\n• 단위와 물건을 짝지어 둔다"},{"id":"t3-09","ty":"order","lv":1,"game":false,"p":"단위 사다리를 작은 것부터 큰 것 순으로 나열하세요.","steps":["비트","바이트","KB","MB","GB"],"h":"한 칸짜리 0/1이 가장 작은 단위이고, 그것을 8개 묶으면 다음 단위가 됩니다. 그 위로는 1,024배씩 커지며 킬로, 메가, 기가 순서로 올라갑니다.","w":"비트 → 바이트(×8) → KB → MB → GB(각 ×1,024)입니다. 사다리는 위로 자라서 GB 다음에는 TB가 옵니다.","an":"컴퓨터구조 Day2 S3 p.24–30","src":"여덟 칸 묶음\n8비트가 1바이트\n• 글자 하나가 사는 크기\n• 사다리의 유일한 예외 배율 — 8\n8비트 = 1바이트"},{"id":"t3-10","ty":"multi","lv":3,"game":true,"p":"10진수와 8칸 2진수가 바르게 짝지어진 것을 모두 고르세요.","o":["100 = 01100100","167 = 10100111","23 = 00010111","52 = 00110110","255 = 11111110"],"a":[0,1,2],"h":"각 보기의 2진수에서 1이 켜진 자리의 자릿값을 더해 10진수와 맞는지 왕복 검산해 보세요. 예를 들어 01100100은 64 + 32 + 4입니다. 8칸을 채우지 않았거나 자릿값 합이 다르면 틀린 짝입니다.","w":"100, 167, 23은 바르게 변환됐습니다. 00110110은 54이고(52는 00110100), 255는 8칸이 모두 1인 11111111입니다.","an":"컴퓨터구조 Day2 S2 p.15–19 · S4 p.34","src":"정답 확인\n여섯 문제의 답\n• 1부: 100, 23, 178\n• 2부: 00110100, 10001101, 11010001\n검산 = 왕복"}]},{"id":"t4","title":"정수 표현과 ASCII","ref":"컴퓨터구조 Day2 S4–S5 p.32–51","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":true,"p":"부호 없이 8칸(1바이트)에 담을 수 있는 정수 범위는?","o":["0 ~ 127","0 ~ 255","−128 ~ 127","1 ~ 256"],"a":1,"h":"부호 없이 8칸을 쓰면 가장 작은 수는 모든 칸이 0일 때입니다. 가장 큰 수는 8칸이 모두 1일 때로, 자릿값 128부터 1까지를 전부 더한 값입니다.","w":"8칸에는 0부터 255까지 담깁니다. −128~127은 맨 앞 칸을 부호로 쓸 때의 범위입니다.","an":"컴퓨터구조 Day2 S4 p.34","src":"8칸의 한계\n0부터 255까지\n• 담을 수 있는 가장 큰 수는 255\n• 256번째에는 무슨 일이 일어날까\n0 ~ 255"},{"id":"t4-02","ty":"mc","lv":1,"game":true,"p":"부호 없는 8칸에서 255에 1을 더하면 남는 값은?","o":["256","−1","−128","0"],"a":3,"h":"8칸에 담을 수 있는 가장 큰 수는 255이고, 칸이 모자라면 자동차 주행계처럼 처음으로 되감깁니다. 이렇게 넘치는 현상을 오버플로우라고 불렀습니다.","w":"칸이 모자라면 처음으로 되감겨 255 다음은 0이 됩니다. 이 현상을 넘침, 오버플로우라고 부릅니다.","an":"컴퓨터구조 Day2 S4 p.35","src":"넘침\n255 다음은 0이다\n• 칸이 모자라면 처음으로 되감긴다\n• 이름은 넘침 — 오버플로우\n255 → 0"},{"id":"t4-03","ty":"mc","lv":2,"game":true,"p":"8칸에서 −1을 나타내는 값은?","o":["10000001","00000001","11111111","11111110"],"a":2,"h":"음수는 수 바퀴에서 0을 기준으로 뒤로 되감아 만듭니다. 0에서 바로 한 칸 뒤의 칸은 8칸이 모두 같은 숫자로 채워진 모습입니다.","w":"0의 바로 뒤 칸이 −1이므로 11111111입니다. 11111110은 두 칸 뒤인 −2이고, 10000001처럼 부호만 바꾸는 방식은 쓰지 않습니다.","an":"컴퓨터구조 Day2 S4 p.37","src":"되감기로 만드는 음수\n0의 바로 뒤 칸이 -1\n• -1은 11111111\n• -5는 0에서 다섯 칸 뒤 — 2의 보수\n-1 = 11111111"},{"id":"t4-04","ty":"num","lv":2,"game":false,"p":"ASCII 표에서 대문자 <code>C<\/code>의 번호는?","a":67,"h":"ASCII에서 대문자 번호는 64에 알파벳 순번을 더한 수입니다. A가 1번째라 65, K가 11번째라 75이니, C의 순번을 64에 더해 계산해 보세요.","w":"대문자 번호는 64에 알파벳 순번을 더한 수이므로 64 + 3 = 67입니다. A는 65, K는 75로 같은 규칙을 따릅니다.","an":"컴퓨터구조 Day2 S5 p.44 · 정답 확인 p.48","src":"ASCII 표 읽는 법\n글자를 찾고 옆의 번호를 읽는다\n• 대문자 번호는 64에 알파벳 순번을 더한 수\n• A는 65, K는 75\nA = 65"},{"id":"t4-05","ty":"ox","lv":2,"game":true,"p":"부호 있는 8칸에서 맨 앞 칸이 1이면 그 수는 음수이다.","a":true,"h":"부호 있는 8칸에서는 맨 앞 칸을 부호 칸으로 쓰기로 약속했습니다. 그 칸이 0이면 양수, 1이면 반대 부호이며 범위는 -128부터 127이 됩니다.","w":"맨 앞 칸이 부호로, 0이면 양수, 1이면 음수입니다. 그래서 범위가 −128부터 127이 됩니다.","an":"컴퓨터구조 Day2 S4 p.36","src":"음수를 담는 약속\n맨 앞 칸이 부호다\n• 0이면 양수, 1이면 음수\n• 부호가 생기면 범위는 -128부터 127\n1_______"},{"id":"t4-06","ty":"mc","lv":3,"game":true,"p":"부호 있는 8칸의 01111111(127)에 1을 더하면?","o":["10000000, 읽으면 −128","10000000, 읽으면 128","00000000, 읽으면 0","11111111, 읽으면 −1"],"a":0,"h":"01111111에 1을 더하면 자리올림이 이어져 맨 앞 칸만 1이고 나머지는 0이 됩니다. 그런데 부호 있는 8칸에서 맨 앞 칸은 부호 칸이므로 이 값을 다시 읽으면 부호가 뒤집힙니다.","w":"127 다음은 10000000이고 부호 칸이 1이 되어 −128로 읽힙니다. 갑자기 음수가 되는 사고의 정체이며, 128은 부호 없는 눈으로 읽은 값입니다.","an":"컴퓨터구조 Day2 S4 p.39–40","src":"정답 확인\n음수와 넘침의 답\n• -5는 11111011 — 부호 칸은 1\n• 127 다음은 10000000, 읽으면 -128\n11111011"},{"id":"t4-07","ty":"ox","lv":1,"game":true,"p":"ASCII에서 대문자와 소문자는 같은 번호를 쓰고 모양만 다르다.","a":false,"h":"ASCII에서 대문자 A는 65, 소문자 a는 97입니다. 대문자와 소문자의 번호 차이는 언제나 32이며, 8칸 중 딱 한 칸만 다릅니다.","w":"A는 65, a는 97로 번호가 다르며 차이는 언제나 32입니다. 8칸 중 다른 칸은 하나뿐입니다.","an":"컴퓨터구조 Day2 S5 p.46","src":"대문자와 소문자\n번호가 다르다\n• 차이는 언제나 32\n• 8칸 중 다른 칸은 하나뿐\nA 65 / a 97"},{"id":"t4-08","ty":"match","lv":2,"game":false,"p":"용어와 설명을 연결하세요.","pairs":[["오버플로우","칸이 모자라 처음으로 되감기는 일"],["부호 칸","맨 앞 칸, 0이면 양수"],["ASCII","글자마다 번호를 붙인 약속표"],["2의 보수","0에서 뒤로 되감아 만든 음수"]],"h":"칸이 모자라 처음으로 되감기는 넘침에는 영어 이름이 있고, 음수 약속에서는 맨 앞 칸이 부호를 맡습니다. 글자마다 번호를 붙인 약속표와 0에서 뒤로 되감아 음수를 만드는 방법도 각각 이름이 있습니다.","w":"오버플로우는 넘침으로 인한 되감기, 부호 칸은 맨 앞 칸, ASCII는 글자 번호 약속표, 2의 보수는 되감기로 만든 음수 표기입니다.","an":"컴퓨터구조 Day2 S4 p.35–37 · S5 p.43","src":"넘침\n255 다음은 0이다\n• 칸이 모자라면 처음으로 되감긴다\n• 이름은 넘침 — 오버플로우\n255 → 0"},{"id":"t4-09","ty":"order","lv":1,"game":false,"p":"글자 하나를 8칸 2진수로 적는 순서대로 나열하세요.","steps":["ASCII 표에서 글자를 찾는다","옆의 번호(10진수)를 읽는다","번호를 8칸 2진수로 바꾼다","컨베이어로 검산한다"],"h":"글자를 8칸으로 적을 때는 글자, 번호, 2진수 순서로 진행합니다(K → 75 → 01001011). 표에서 글자와 번호를 찾은 뒤 오전에 배운 방법으로 8칸을 적고, 컨베이어 애니메이션은 다 적은 뒤 검산용으로만 씁니다.","w":"글자를 찾아 번호를 읽고, 오전에 배운 덜어내기로 8칸을 만든 뒤 컨베이어로 검산합니다. 컨베이어는 다 적은 뒤 검산으로만 씁니다.","an":"컴퓨터구조 Day2 S5 p.45–47","src":"글자에서 8칸까지\n글자, 번호, 2진수의 순서로\n• 번호까지 찾으면 나머지는 오전의 손놀림\n• 글자 하나가 정확히 1바이트\nK → 75 → 01001011"},{"id":"t4-10","ty":"multi","lv":3,"game":true,"p":"8칸 표현이 바르게 짝지어진 것을 모두 고르세요.","o":["−5 = 11111011","−1 = 11111111","K(75) = 01001011","A(65) = 01000011","−128 = 11111111"],"a":[0,1,2],"h":"음수는 0에서 몇 칸 뒤로 되감았는지로 만듭니다(-1은 바로 뒤 칸, -5는 다섯 칸 뒤). 글자는 ASCII 번호를 자릿값으로 나눠 8칸으로 적었는지, 0을 생략하지 않았는지 확인하세요.","w":"−5는 11111011, −1은 11111111, K(75)는 01001011이 맞습니다. A(65)는 01000001이고, −128은 10000000입니다.","an":"컴퓨터구조 Day2 S4 p.37–39 · S5 p.45","src":"되감기로 만드는 음수\n0의 바로 뒤 칸이 -1\n• -1은 11111111\n• -5는 0에서 다섯 칸 뒤 — 2의 보수\n-1 = 11111111"}]},{"id":"t5","title":"RGB와 16진수","ref":"컴퓨터구조 Day2 S6–S8 p.52–81","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"화면의 모든 색을 만드는 빛의 삼원색은?","o":["빨강·노랑·파랑","빨강·초록·파랑","빨강·초록·노랑","흰색·검정·회색"],"a":1,"h":"화면의 모든 색은 세 가지 빛을 조합해 만들고, 수업에서는 손전등 세 개로 확인했습니다. RGB라는 이름은 이 세 빛의 영어 머리글자입니다.","w":"빛의 삼원색은 빨강(R), 초록(G), 파랑(B)입니다. 빨강·노랑·파랑은 물감 쪽에서 익숙한 조합으로, 빛과는 다릅니다.","an":"컴퓨터구조 Day2 S6 p.53","src":"빛의 삼원색\n빨강, 초록, 파랑\n• 화면의 모든 색은 세 빛의 조합\n• 손전등 세 개로 확인한다"},{"id":"t5-02","ty":"mc","lv":1,"game":true,"p":"RGB에서 채널 하나가 가질 수 있는 값의 범위는?","o":["0 ~ 100","0 ~ 127","0 ~ 1023","0 ~ 255"],"a":3,"h":"RGB에서 채널 하나는 1바이트, 즉 8칸으로 저장됩니다. 앞에서 배운 부호 없는 1바이트의 범위가 색의 밝기 범위로 그대로 재사용됩니다.","w":"채널 하나는 1바이트이므로 0부터 255까지입니다. 정수 단원(S4)의 8칸 범위를 그대로 재사용합니다.","an":"컴퓨터구조 Day2 S6 p.55","src":"채널 하나는 0부터 255\n어디서 본 범위인가\n• 방금 배운 1바이트의 범위\n• 색은 S4를 그대로 재사용한다\n0 ~ 255 = 1바이트"},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"RGB 값 (255, 255, 0)이 나타내는 색은?","o":["초록","흰색","노랑","주황"],"a":2,"h":"(255, 255, 0)은 빨강과 초록 빛을 최대로 켜고 파랑은 끈 상태입니다. 빛은 물감과 달리 섞을수록 밝아지며, 빨강 빛과 초록 빛을 합치면 어떤 색이 되는지 떠올려 보세요.","w":"빨강 빛과 초록 빛을 합치면 노랑입니다. 빛은 섞을수록 밝아지므로 초록이 되지 않으며, 셋 다 켜야 흰색입니다.","an":"컴퓨터구조 Day2 S6 p.54 · 정답 확인 p.58","src":"섞을수록 밝아진다\n물감과 반대다\n• 빨강 빛과 초록 빛을 합치면 노랑\n• 셋 다 켜면 흰색\n빛 ≠ 물감"},{"id":"t5-04","ty":"mc","lv":2,"game":true,"p":"16진수 한 글자는 2진수 몇 칸을 묶은 것인가요?","o":["4칸","2칸","8칸","16칸"],"a":0,"h":"16진수는 0~9와 A~F, 모두 열여섯 개의 글자를 씁니다. 2진수 몇 칸을 묶어야 조합이 정확히 열여섯 가지가 되는지(2를 몇 번 곱해야 16인지) 생각해 보세요.","w":"2진수 4칸의 조합은 16가지라 0~9, A~F 한 글자로 읽습니다. 그래서 8칸(1바이트)은 16진수 두 글자가 됩니다.","an":"컴퓨터구조 Day2 S7 p.64–65","src":"4칸이 한 글자\n0부터 9, 그리고 A부터 F\n• 네 칸의 조합은 정확히 열여섯 가지\n• 각 조합에 이름표 하나씩\n1011 = B"},{"id":"t5-05","ty":"num","lv":3,"game":false,"p":"색상 코드 <code>#4B96FF<\/code>에서 초록(G) 채널의 10진수 값은?","a":150,"h":"색상 코드는 두 글자씩 끊어 빨강, 초록, 파랑 순서로 읽습니다. 초록은 가운데 두 글자 96이므로 9 × 16 + 6으로 10진수 값을 계산하면 됩니다.","w":"두 글자씩 빨강·초록·파랑이므로 초록은 96이고, 9 × 16 + 6 = 150입니다. 전체는 (75, 150, 255)입니다.","an":"컴퓨터구조 Day2 S7 p.66 · 정답 확인 p.68","src":"정답 확인\n두 글자로 접힌 답\n• 100은 16진수로 64 — 같은 수, 다른 표기\n• #4B96FF는 75와 150과 255\n100 = 64"},{"id":"t5-06","ty":"ox","lv":2,"game":true,"p":"빛은 물감처럼 섞을수록 어두워져서 세 빛을 모두 켜면 검정이 된다.","a":false,"h":"빛은 물감과 반대로 섞을수록 밝아집니다. 빨강 빛과 초록 빛을 합치면 노랑이 되고, 세 빛을 모두 켜면 가장 밝은 색이 됩니다.","w":"빛은 물감과 반대로 섞을수록 밝아지며, 셋 다 켜면 흰색입니다.","an":"컴퓨터구조 Day2 S6 p.54","src":"섞을수록 밝아진다\n물감과 반대다\n• 빨강 빛과 초록 빛을 합치면 노랑\n• 셋 다 켜면 흰색\n빛 ≠ 물감"},{"id":"t5-07","ty":"ox","lv":1,"game":true,"p":"10진수 100, 2진수 01100100, 16진수 64는 모두 같은 수이다.","a":true,"h":"10진, 2진, 16진은 표기가 다를 뿐 수는 하나라는 것이 S7의 결론입니다. 01100100의 켜진 자릿값을 더해 보고, 16진수 64는 6 × 16 + 4로 계산해 비교해 보세요.","w":"표기가 달라도 수는 하나이며, 용도에 맞는 옷을 입을 뿐입니다. 16진수는 새 계산이 아니라 2진수를 짧게 읽는 방법입니다.","an":"컴퓨터구조 Day2 S7 p.68–69","src":"같은 수 다른 표기\n10진, 2진, 16진\n• 표기가 달라도 수는 하나\n• 용도에 맞는 옷을 입을 뿐\n100 = 01100100 = 64"},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"2진수 4칸과 16진수 한 글자를 연결하세요.","pairs":[["1011","B"],["0100","4"],["1111","F"],["1010","A"]],"h":"4칸의 값은 자릿값 8, 4, 2, 1 중 켜진 자리를 더해 구합니다. 0~9는 숫자 그대로, 10부터 15까지는 A, B, C, D, E, F로 이름표를 붙여 읽습니다.","w":"1011은 11이라 B, 0100은 4, 1111은 15라 F, 1010은 10이라 A입니다. 0~9 다음부터 A~F가 이름표로 붙습니다.","an":"컴퓨터구조 Day2 S7 p.64 (열여섯 이름표)","src":"4칸이 한 글자\n0부터 9, 그리고 A부터 F\n• 네 칸의 조합은 정확히 열여섯 가지\n• 각 조합에 이름표 하나씩\n1011 = B"},{"id":"t5-09","ty":"order","lv":1,"game":false,"p":"01001011을 16진수로 읽는 순서대로 나열하세요.","steps":["8칸을 한가운데서 4칸·4칸으로 가른다","앞 4칸 0100을 한 글자로 읽는다","뒤 4칸 1011을 한 글자로 읽는다","두 글자를 이어 4B로 적는다"],"h":"16진수로 읽을 때는 8칸을 한가운데서 4칸, 4칸으로 가릅니다. 앞 네 칸을 한 글자로, 뒤 네 칸을 한 글자로 읽은 뒤 두 글자를 이어 적으면 여덟 칸이 두 글자가 됩니다.","w":"4칸씩 갈라 0100은 4, 1011은 B로 읽어 4B가 됩니다. 이 값은 K의 ASCII 번호 75와 같은 수입니다.","an":"컴퓨터구조 Day2 S7 p.65","src":"칼질은 한가운데\n4칸, 4칸으로 가른다\n• 앞 네 칸이 한 글자, 뒤 네 칸이 한 글자\n• 여덟 칸이 두 글자가 된다\n01001011 → 4B"},{"id":"t5-10","ty":"multi","lv":3,"game":true,"p":"색상 코드 <code>#FF6B00<\/code>에 대한 설명으로 옳은 것을 모두 고르세요.","o":["세 바이트로 이루어져 있다","FF는 빨강 채널 값이다","빨강 값은 10진수 255이다","6B는 파랑 채널 값이다","전체가 1바이트이다"],"a":[0,1,2],"h":"색상 코드는 세 바이트로, 두 글자씩 빨강, 초록, 파랑 순서로 배정됩니다. 첫 두 글자 FF는 1바이트의 최댓값이며, 픽셀 확대경에서 이 색은 (255, 107, 0)으로 읽혔습니다.","w":"#FF6B00은 두 글자씩 빨강 FF(255), 초록 6B(107), 파랑 00(0)인 세 바이트입니다. 6B는 초록 채널 값입니다.","an":"컴퓨터구조 Day2 S6 p.56 · S7 p.66","src":"색상 코드의 정체\n#FF6B00은 세 바이트다\n• 두 글자씩 빨강, 초록, 파랑\n• 웹에서 본 그 코드가 방금 배운 것\n#FF6B00"}]},{"id":"t6","title":"논리 연산과 가산기","ref":"컴퓨터구조 Day3 S1–S2 p.1–20","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"XOR 연산이 던지는 질문은?","o":["둘 다 1인가?","하나라도 1인가?","서로 다른가?","뒤집으면 무엇인가?"],"a":2,"h":"네 가지 비트 연산은 각각 하나의 질문으로 요약됩니다. AND는 '둘 다 1인가?', OR는 '하나라도 1인가?'였고, XOR는 두 입력이 같으면 0을 내며 토글과 비교에 쓰입니다.","w":"XOR은 '서로 다른가?'를 묻고, 같으면 0입니다. '둘 다 1인가?'는 AND, '하나라도 1인가?'는 OR, 뒤집기는 NOT입니다.","an":"컴퓨터구조 Day3 S1 p.4","src":"개념\n네 가지 질문\nAND — 둘 다 1인가?\n하나라도 0이면 꺼진다.\n용도: 거르기(마스크)\nOR — 하나라도 1인가?\n둘 다 0일 때만 꺼진다.\n용도: 켜기(세트)\nXOR — 서로 다른가?\n같으면 0.\n용도: 토글·비교\nNOT — 뒤집기\n입력이 하나뿐.\n용도: 반전"},{"id":"t6-02","ty":"mc","lv":1,"game":true,"p":"마스크로 원하는 비트만 '거르기'할 때 쓰는 연산은?","o":["AND","OR","XOR","NOT"],"a":0,"h":"마스크로 거르기는 마스크가 1인 자리만 통과시키고 나머지는 꺼 버리는 작업입니다. 하나라도 0이면 꺼지는, '둘 다 1인가?'를 묻는 연산이 이 용도에 쓰입니다.","w":"AND는 마스크가 1인 자리만 통과시키므로 거르기에 씁니다. OR은 켜기, XOR은 토글·비교, NOT은 반전에 씁니다.","an":"컴퓨터구조 Day3 S1 p.4","src":"개념\n네 가지 질문\nAND — 둘 다 1인가?\n하나라도 0이면 꺼진다.\n용도: 거르기(마스크)\nOR — 하나라도 1인가?\n둘 다 0일 때만 꺼진다.\n용도: 켜기(세트)\nXOR — 서로 다른가?\n같으면 0.\n용도: 토글·비교\nNOT — 뒤집기\n입력이 하나뿐.\n용도: 반전"},{"id":"t6-03","ty":"mc","lv":3,"game":true,"p":"8비트 연산 <code>204 & 15<\/code>의 결과는?","o":["15","204","219","12"],"a":3,"h":"&는 두 수의 같은 자리가 둘 다 1일 때만 1을 남깁니다. 204는 11001100, 15는 00001111이므로 하위 4비트만 통과해 1100이 남고, 이를 10진수로 읽으면 됩니다.","w":"15가 1인 하위 4비트만 통과해 00001100, 곧 12가 됩니다. 비트 연산은 자리마다 독립이라 자리올림이 없습니다.","an":"컴퓨터구조 Day3 S1 p.6","src":"시연\n8비트에 한꺼번에\n▪ 자리마다 독립 — 덧셈과 달리 자리올림이 없다\n▪ 204 & 15 = 12 — B가 1인 자리만 통과 (하위 4비트 추출)\n▪ 시연은 이 한 문제만 — 나머지 3문제는 여러분 몫\n논리 연산 실험대"},{"id":"t6-04","ty":"mc","lv":2,"game":true,"p":"반가산기에서 윗자리로 올릴 Carry를 만드는 게이트는?","o":["OR","AND","XOR","NOT"],"a":1,"h":"반가산기는 게이트 두 개로 만듭니다. 이 자리에 쓸 Sum은 '둘이 다른가?'를 묻는 게이트가, 윗자리로 올릴 Carry는 '둘 다 1인가?'를 묻는 게이트가 담당합니다.","w":"Carry는 AND, Sum은 XOR로 만듭니다. OR은 전가산기에서 올림 후보 둘을 마지막에 합칠 때만 쓰므로 가장 흔한 오답입니다.","an":"컴퓨터구조 Day3 S2 p.14 · 예상 오답 p.19","src":"시연\n반가산기 — 게이트 딱 2개\n▪ Sum = XOR : '둘이 다른가?' → 이 자리에 쓸 것\n▪ Carry = AND : '둘 다 1인가?' → 윗자리로 올릴 것\n▪ 곤란한 행은 1+1 하나뿐 — 그 행을 위해 존재한다\n반가산기"},{"id":"t6-05","ty":"mc","lv":2,"game":true,"p":"반가산기가 '반(半)'이라고 불리는 이유는?","o":["입력이 3개라서","아랫자리 올림(Cin) 입력이 없어서","XOR 게이트만 써서","8비트를 한 번에 더해서"],"a":1,"h":"반가산기는 입력이 두 개뿐이라 아랫자리가 없는 bit 0에서는 완벽합니다. 그러나 bit 1부터는 아랫자리에서 올라오는 올림이 들어올 문이 없어 부족해지고, 그래서 반가산기 2개와 OR 1개로 전가산기를 만듭니다.","w":"반가산기는 입력이 2개뿐이라 아랫자리 올림 Cin이 들어올 문이 없습니다. 그래서 반가산기 2개와 OR 1개를 이어 전가산기를 만듭니다.","an":"컴퓨터구조 Day3 S2 p.15","src":"개념\n왜 '반(半)'인가\nbit 0에서는 완벽\n아랫자리가 없으니 입력 2개면 충분\nbit 1부터는 부족\n아랫자리 올림 Cin이 들어올 문이 없\n다\n(회로도의 빨간 점선)\n해결 = 이어 붙이기\n반가산기 2개 + OR 1개 → 전가산기"},{"id":"t6-06","ty":"ox","lv":2,"game":true,"p":"XOR에 (1, 1)을 넣으면 결과는 1이다.","a":false,"h":"XOR의 질문은 '서로 다른가?'입니다. 1과 1은 서로 같은 값이므로 이 질문에 대한 답을 생각해 보고, '하나라도 1인가?'를 묻는 OR와 혼동하지 마세요.","w":"XOR은 '다른가?'를 묻고 1과 1은 같으므로 0입니다. OR('하나라도?')과 혼동해 1로 답하는 것이 가장 많은 오답입니다.","an":"컴퓨터구조 Day3 S1 p.5 · 예상 오답 p.9","src":"예상 오답과 교정\n가장 많이 나올 오답\n오답\nXOR에서 (1, 1) → 1\n왜: OR('하나라도?')과 혼동\n→\n교정 화법 — 토씨 그대로\n“ XOR의 질문은 '다른가?'입니다. 1과 1은 같으니\n까 0. OR의 질문과 소리 내어 구분해 보세요. ”"},{"id":"t6-07","ty":"ox","lv":1,"game":true,"p":"8비트 비트 연산은 자리마다 독립이라 덧셈과 달리 자리올림이 없다.","a":true,"h":"비트 연산은 8비트에 한꺼번에 적용하지만 각 자리를 따로 계산합니다. 204 & 15 시연에서도 B가 1인 자리만 통과했을 뿐 옆 자리로 넘어가는 값은 없었습니다.","w":"AND·OR·XOR·NOT은 각 자리를 따로 계산하므로 자리올림이 없습니다. 자리올림을 다루려면 가산기가 필요합니다.","an":"컴퓨터구조 Day3 S1 p.6","src":"시연\n8비트에 한꺼번에\n▪ 자리마다 독립 — 덧셈과 달리 자리올림이 없다\n▪ 204 & 15 = 12 — B가 1인 자리만 통과 (하위 4비트 추출)\n▪ 시연은 이 한 문제만 — 나머지 3문제는 여러분 몫\n논리 연산 실험대"},{"id":"t6-08","ty":"match","lv":1,"game":false,"p":"비트 연산과 그 용도를 연결하세요.","pairs":[["AND","거르기(마스크)"],["OR","켜기(세트)"],["XOR","토글·비교"],["NOT","반전"]],"h":"AND는 '둘 다 1인가?'라서 원하는 자리만 남기는 데, OR는 '하나라도 1인가?'라서 특정 자리를 켜는 데 씁니다. XOR는 같으면 0이 되어 뒤집기·비교에, 입력이 하나뿐인 NOT은 전체를 뒤집는 데 씁니다.","w":"AND는 거르기, OR은 켜기, XOR은 토글·비교, NOT은 반전에 씁니다. 이 네 용도는 S5 하드웨어 제어에서 그대로 다시 쓰입니다.","an":"컴퓨터구조 Day3 S1 p.4","src":"개념\n네 가지 질문\nAND — 둘 다 1인가?\n하나라도 0이면 꺼진다.\n용도: 거르기(마스크)\nOR — 하나라도 1인가?\n둘 다 0일 때만 꺼진다.\n용도: 켜기(세트)\nXOR — 서로 다른가?\n같으면 0.\n용도: 토글·비교\nNOT — 뒤집기\n입력이 하나뿐.\n용도: 반전"},{"id":"t6-09","ty":"order","lv":2,"game":false,"p":"게이트에서 8비트 덧셈기까지 조립하는 순서대로 나열하세요.","steps":["XOR과 AND로 반가산기를 만든다","반가산기 2개와 OR 1개로 전가산기를 만든다","전가산기 8개를 이어 8비트 덧셈기를 만든다"],"h":"게이트 두 개로 반가산기를 만든 뒤, 아랫자리 올림을 받기 위해 반가산기 둘을 OR로 이어 전가산기를 만듭니다. 마지막으로 전가산기를 8개 이어 붙이면 8비트 덧셈기가 됩니다.","w":"반가산기(게이트 2개) → 전가산기(반가산기 2개 + OR) → 전가산기 8개 연결 순입니다. 맨 왼쪽 전가산기의 Cout이 곧 CF가 됩니다.","an":"컴퓨터구조 Day3 S2 p.14–16","src":"시연\n전가산기 — 1을 세는 기계\n▪ Sum = 1이 홀수 개인가 (XOR 두 번)\n▪ Cout = 1이 2개 이상인가 (다수결)\n▪ 검산: A + B + Cin = 2×Cout + Sum\n▪ 8개 이으면 8비트 덧셈기 — 맨 왼쪽 Cout이 곧 CF\n전가산기"},{"id":"t6-10","ty":"multi","lv":3,"game":true,"p":"전가산기에 (A, B, Cin) = (1, 1, 1)을 넣었을 때 옳은 것을 모두 고르세요.","o":["Sum = 1","Cout = 1","2×Cout+Sum = 3","Sum = 0","Cout = 0"],"a":[0,1,2],"h":"전가산기의 Sum은 입력 중 1이 홀수 개인지, Cout은 1이 2개 이상인지를 나타냅니다. (1, 1, 1)은 1이 세 개이므로 두 조건을 따로 판단하고, 검산식 A + B + Cin = 2×Cout + Sum으로 확인해 보세요.","w":"1이 3개(홀수)라 Sum = 1, 2개 이상이라 Cout = 1입니다. 검산식 2×1+1 = 3이 입력 합 1+1+1과 일치합니다.","an":"컴퓨터구조 Day3 S2 p.16 · 확인 p.18","src":"시연\n전가산기 — 1을 세는 기계\n▪ Sum = 1이 홀수 개인가 (XOR 두 번)\n▪ Cout = 1이 2개 이상인가 (다수결)\n▪ 검산: A + B + Cin = 2×Cout + Sum\n▪ 8개 이으면 8비트 덧셈기 — 맨 왼쪽 Cout이 곧 CF\n전가산기"}]},{"id":"t7","title":"2의 보수 뺄셈과 플래그","ref":"컴퓨터구조 Day3 S3–S4 p.21–40","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"뺄셈 회로가 없는 CPU가 A − B를 계산하는 방법은?","o":["B를 2의 보수로 바꿔 더한다","B를 NOT만 해서 더한다","별도의 뺄셈기를 쓴다","A와 B를 OR로 합친다"],"a":0,"h":"CPU 안에는 뺄셈 회로가 없고 덧셈기 하나로 뺄셈까지 합니다. 빼는 수 B를 전부 뒤집고 1을 더해 −B 역할을 하는 값으로 바꾼 뒤, A에 그냥 더합니다.","w":"CPU는 B를 뒤집고 1을 더한 2의 보수(−B 역할)를 덧셈기로 더합니다. NOT만 하면 1의 보수라 결과가 1 모자랍니다.","an":"컴퓨터구조 Day3 S3 p.23–24","src":"개념\n−B 만드는 법 — 세 동작\n① 전부 뒤집는다\n~B — S2에서 배운 NOT\n(1의 보수)\n② 1을 더한다\n~B + 1 = 2의 보수 = −B 역할\n③ 그냥 더한다\nA + (−B)\n넘친 9번째 비트는 버림 (mod 256)"},{"id":"t7-02","ty":"mc","lv":2,"game":true,"p":"7 − 3 시연에서 3을 뒤집고 1을 더한 8비트 값(−3 역할)은?","o":["252","253","4","256"],"a":1,"h":"8비트에서 B + ~B = 255이므로 ~B + 1은 255 − B + 1로 계산할 수 있습니다. B가 3일 때 이 식에 대입하면 −3 역할을 하는 8비트 값이 나옵니다.","w":"~3은 252이고 1을 더하면 253입니다. 7 + 253 = 260에서 넘친 1(256)을 버리면 4가 됩니다.","an":"컴퓨터구조 Day3 S3 p.25–26","src":"왜 성립하는가\nB + ~B = 255 → +1이면 256 = 0\n8비트 세계에서 256은 0. 그래서 ~B+1은 정확히 −B 역할 — 버려진 256이 빌려온 256과 상쇄되어 장부\n가 맞는다"},{"id":"t7-03","ty":"num","lv":3,"game":false,"p":"9 − 13을 2의 보수 덧셈으로 계산한 8비트 결과를 부호 있는 10진수로 읽으면?","a":-4,"h":"13을 뒤집고 1을 더하면 243이 되고, 9 + 243을 계산합니다. 이 문제는 넘친 9번째 비트가 없는 경우이므로, 결과의 맨 앞 칸이 1이면 256을 빼서 부호 있는 값으로 읽습니다.","w":"~13 + 1 = 243이고 9 + 243 = 252는 넘침이 없어 버림도 없습니다. 252를 부호 있게 읽으면 −4입니다. +1을 빼먹으면 −5가 나오는 것이 대표 오답입니다.","an":"컴퓨터구조 Day3 S3 p.22–29","src":"이 섹션의 도착\n9−13을 반전 → +1 → 덧셈 → 버림의 전 과정으로 풀고\n애니메이션과 전 행 일치시킨다\n워크시트 · 실습 3 · 2의 보수 뺄셈 검산지"},{"id":"t7-04","ty":"mc","lv":2,"game":true,"p":"8비트 255 + 1을 실행했을 때 켜지는 플래그는?","o":["CF만","OF만","CF와 ZF","SF와 OF"],"a":2,"h":"255 + 1은 9번째 비트로 자리올림이 생기며 8비트가 한 바퀴 돌아 0이 됩니다. 자리올림을 알리는 플래그와 결과가 0인지를 알리는 플래그가 무엇이었는지 떠올려 보세요.","w":"255를 넘어 자리올림이 생기니 CF, 결과 8비트가 모두 0이니 ZF가 켜집니다. 부호 있는 눈으로는 −1 + 1 = 0이라 OF는 켜지지 않습니다.","an":"컴퓨터구조 Day3 S4 p.34 · 시연 p.36","src":"시연\n시연 순서\n▪ 255 + 1 → CF·ZF (한 바퀴 돌아 0)\n▪ 200 + 100 → CF만 — 판정 패널 정독\n▪ 128 + 128은 실습 후 다 같이 (셋이 동시에 켜짐)\n플래그 시뮬레이터"},{"id":"t7-05","ty":"mc","lv":2,"game":true,"p":"OF(오버플로 플래그)가 켜지는 상황은?","o":["부호 없는 결과가 255 초과","결과가 0","최상위 비트가 1","부호 있는 결과가 범위 밖"],"a":3,"h":"CF는 부호 없는 세계의 경고이고, OF는 부호 있는 세계의 경고입니다. 부호 있게 읽었을 때 결과가 −128 ~ 127 범위를 벗어나면 OF가 켜집니다.","w":"OF는 부호 있는 결과가 −128~127을 벗어날 때 켜집니다. 255 초과는 CF, 0은 ZF, 최상위 비트 1은 SF의 조건입니다.","an":"컴퓨터구조 Day3 S4 p.34","src":"개념\n신호등 4개\nCF — 자리올림/빌림\n부호 없는 세계의 경고\n(255를 넘거나, 빌려왔거나)\nZF — 결과가 0인가\n8비트가 전부 0일 때\nSF — 최상위 비트\n부호 있는 해석으로 음수인가\nOF — 범위 초과\n부호 있는 세계의 경고\n(−128 ~ 127을 벗어남)"},{"id":"t7-06","ty":"ox","lv":2,"game":true,"p":"8비트 200 + 100에서는 CF와 OF가 모두 1이 된다.","a":false,"h":"부호 없는 눈으로 보면 200 + 100 = 300은 8비트에 담기지 않아 CF가 켜집니다. 그러나 부호 있는 눈으로 200은 −56이고 −56 + 100 = 44로 범위 안이므로, OF는 따로 판단해야 합니다.","w":"부호 없는 눈으로는 300이라 CF = 1이지만, 부호 있는 눈으로는 −56 + 100 = 44로 범위 안이라 OF = 0입니다. CF와 OF를 같은 경고로 취급하는 것이 대표 오답입니다.","an":"컴퓨터구조 Day3 S4 p.35 · 예상 오답 p.39","src":"예상 오답과 교정\n가장 많이 나올 오답\n오답\n200 + 100에서 OF = 1\n왜: CF와 OF를 같은 경고로 취급\n→\n교정 화법 — 토씨 그대로\n“ 부호 있는 눈으로 다시 읽어 보세요 — 200은\n−56입니다. −56+100=44, 범위 안. OF는 부호 있\n는 세계의 눈으로만 판단합니다. ”"},{"id":"t7-07","ty":"ox","lv":1,"game":true,"p":"−B를 만들 때 뒤집기(1의 보수)에서 멈추면 결과가 정확히 1 모자란다.","a":true,"h":"−B를 만들려면 전부 뒤집은(1의 보수) 뒤 반드시 1을 더해야 합니다. 9 − 13을 뒤집기에서 멈춘 채 계산하면 −5가 나오는데, 이는 올바른 값과 비교해 얼마나 차이 나는지 생각해 보세요.","w":"~B만으로는 −B보다 1이 작아서 반드시 +1을 해야 합니다. 그래서 9 − 13을 1의 보수로 계산하면 −5가 나옵니다.","an":"컴퓨터구조 Day3 S3 예상 오답 p.29","src":"예상 오답과 교정\n가장 많이 나올 오답\n오답\n+1을 빼먹은 1의 보수 계산\n(9−13이 −5로 나옴)\n왜: '뒤집고'에서 멈춤\n→\n교정 화법 — 토씨 그대로\n“ 거기서 멈추면 정확히 1이 모자랍니다. −B가 되\n려면 반드시 +1 — 그래서 이름이 2의 보수. ”"},{"id":"t7-08","ty":"match","lv":1,"game":false,"p":"상태 플래그와 그 뜻을 연결하세요.","pairs":[["CF","자리올림/빌림 (부호 없는 경고)"],["ZF","결과 8비트가 모두 0"],["SF","최상위 비트 (음수인가)"],["OF","부호 있는 범위 초과"]],"h":"CF는 Carry로 부호 없는 세계의 자리올림/빌림 경고, ZF는 Zero로 8비트가 전부 0인지를 나타냅니다. SF는 Sign으로 최상위 비트를, OF는 Overflow로 부호 있는 범위(−128 ~ 127) 초과를 알립니다.","w":"CF는 자리올림/빌림, ZF는 결과가 0, SF는 최상위 비트, OF는 −128~127 범위 초과를 알립니다. 계산기는 답과 함께 이 신호등 4개를 켭니다.","an":"컴퓨터구조 Day3 S4 p.34","src":"개념\n신호등 4개\nCF — 자리올림/빌림\n부호 없는 세계의 경고\n(255를 넘거나, 빌려왔거나)\nZF — 결과가 0인가\n8비트가 전부 0일 때\nSF — 최상위 비트\n부호 있는 해석으로 음수인가\nOF — 범위 초과\n부호 있는 세계의 경고\n(−128 ~ 127을 벗어남)"},{"id":"t7-09","ty":"order","lv":1,"game":false,"p":"덧셈기로 A − B를 계산하는 과정을 순서대로 나열하세요.","steps":["B를 전부 뒤집는다 (~B)","1을 더해 2의 보수를 만든다","A에 더한다","넘친 9번째 비트는 버린다"],"h":"덧셈기로 뺄셈을 할 때는 먼저 B를 NOT으로 뒤집고, 1을 더해 2의 보수를 만듭니다. 그다음 A에 그냥 더하고, 8비트를 넘친 비트는 mod 256으로 처리합니다.","w":"~B를 만들고 1을 더해 −B 역할을 만든 뒤 A에 더하고, 넘친 9번째 비트는 버립니다(mod 256). 버려진 256이 빌려온 256과 상쇄되어 장부가 맞습니다.","an":"컴퓨터구조 Day3 S3 p.24–25","src":"개념\n−B 만드는 법 — 세 동작\n① 전부 뒤집는다\n~B — S2에서 배운 NOT\n(1의 보수)\n② 1을 더한다\n~B + 1 = 2의 보수 = −B 역할\n③ 그냥 더한다\nA + (−B)\n넘친 9번째 비트는 버림 (mod 256)"},{"id":"t7-10","ty":"multi","lv":3,"game":true,"p":"8비트 200 + 100에 대한 설명으로 옳은 것을 모두 고르세요.","o":["CF = 1","OF = 0","200은 부호 있게 −56","8비트 결과는 300","ZF = 1"],"a":[0,1,2],"h":"같은 비트를 부호 없는 눈과 부호 있는 눈으로 두 번 읽습니다. 부호 없이 보면 300은 8비트에 못 담아 경고가 켜지고, 부호 있게 보면 200은 음수로 읽혀 100을 더해도 44로 범위 안입니다.","w":"300은 8비트에 못 담으므로 CF = 1이고 남는 값은 44입니다. 부호 있는 눈으로는 −56 + 100 = 44로 범위 안이라 OF = 0이며, 결과가 0이 아니므로 ZF = 0입니다.","an":"컴퓨터구조 Day3 S4 p.35","src":"같은 비트 , 두 가지 읽기\n200 + 100 → CF = 1, OF = 0\n부호 없는 눈: 300은 8비트에 못 담음 → 경고 · 부호 있는 눈: (−56) + 100 = 44, 범위 안 → 문제 없음"}]},{"id":"t8","title":"하드웨어 제어와 명령 실행","ref":"컴퓨터구조 Day3 S5–S8 p.41–80","qs":[{"id":"t8-01","ty":"mc","lv":1,"game":true,"p":"제어 레지스터의 n번 비트를 '켜는' 관용구는?","o":["REG |= (1 << n);","REG &= (1 << n);","REG ^= (1 << n);","REG &= ~(1 << n);"],"a":0,"h":"비트를 켤 때는 '하나라도 1인가?'를 묻는 OR 연산을 씁니다. 1을 n번 왼쪽으로 민 마스크와 OR한 결과를 다시 레지스터에 넣어, 다른 비트는 보존한 채 n번 비트만 1로 만듭니다.","w":"켜기는 OR을 쓴 <code>REG |= (1 << n);<\/code>입니다. <code>^=<\/code>는 토글, <code>&= ~<\/code>는 끄기입니다.","an":"컴퓨터구조 Day3 S5 p.45","src":"개념\n네 가지 관용구\n할 일 코드 쓰는 연산\n켜기 REG |= (1 << n); OR\n끄기 REG &= ~(1 << n); AND + NOT\n토글 REG ^= (1 << n); XOR\n검사 REG & (1 << n) AND (읽기만)\n원칙 한 줄: 읽고 – 비트만 고치고 – 다시 쓴다. 다른 7비트는 보존."},{"id":"t8-02","ty":"mc","lv":2,"game":true,"p":"다른 비트는 그대로 두고 히터(bit 3)만 끄는 코드는?","o":["REG &= (1 << 3);","REG &= ~(1 << 3);","REG |= ~(1 << 3);","REG ^= ~(1 << 3);"],"a":1,"h":"끄기는 AND와 NOT을 함께 씁니다. bit 3만 1인 마스크를 그대로 AND하면 히터만 남고 나머지가 꺼지므로, 마스크를 ~로 뒤집어 bit 3만 0인 마스크로 AND해야 합니다.","w":"끄기는 뒤집은 마스크와 AND하는 <code>REG &= ~(1 << 3);<\/code>입니다. ~를 빼먹으면 히터만 남고 나머지가 전부 꺼져 정반대가 됩니다.","an":"컴퓨터구조 Day3 S5 p.45 · 예상 오답 p.49","src":"예상 오답과 교정\n가장 많이 나올 오답\n오답\n끄기 = REG &= (1 << 3);\n왜: ~(NOT) 누락\n→\n교정 화법 — 토씨 그대로\n“ 그 마스크로 AND하면 히터만 남고 나머지가 전\n부 꺼집니다 — 정반대죠. 끄려면 뒤집은 마스크\n~(1<<3). ”"},{"id":"t8-03","ty":"mc","lv":1,"game":true,"p":"인출 직후 PC(프로그램 카운터)가 가리키는 것은?","o":["지금 실행 중인 명령","방금 끝난 명령의 결과","다음에 가져올 명령의 칸","레지스터 A의 값"],"a":2,"h":"인출 박자에서는 PC가 가리키는 칸을 IR로 가져오고, 그 순간 PC가 +1 됩니다. 그래서 PC는 '지금' 명령이 아니라 '다음' 명령을 가리키는 손가락이라고 했습니다.","w":"PC는 '다음'을 가리키는 손가락으로, 인출하는 순간 이미 +1이 됩니다. PC가 '지금'을 가리킨다고 오해해 0, 1, 2, 3으로 적는 것이 대표 오답입니다.","an":"컴퓨터구조 Day3 S6 p.55 · 예상 오답 p.59","src":"예상 오답과 교정\n가장 많이 나올 오답\n오답\n인출 후 PC = 0, 1, 2, 3\n왜: PC가 '지금'을 가리킨다고 오해\n→\n교정 화법 — 토씨 그대로\n“ PC는 '다음'을 가리키는 손가락입니다. 가져오는\n그 순간 이미 +1. ”"},{"id":"t8-04","ty":"mc","lv":2,"game":true,"p":"해석 단계에서 8비트 명령의 상위 4비트가 뜻하는 것은?","o":["어디에 (주소)","플래그 값","실행 결과 값","무엇을 (명령 종류)"],"a":3,"h":"해석 단계에서는 8비트 명령을 반으로 나눠 읽습니다. 상위 4비트와 하위 4비트가 각각 '무엇을'과 '어디에' 중 하나를 맡으며, 이때 숫자가 명령이 됩니다.","w":"상위 4비트는 무엇을(명령 종류), 하위 4비트는 어디에(주소)입니다. 이 해석 순간에 숫자가 명령이 됩니다.","an":"컴퓨터구조 Day3 S6 p.55","src":"개념\n세 박자\n① 인출\nPC가 가리키는 칸을 IR로.\n아직 뜻은 모른다 · PC는 +1\n② 해석\n상위 4비트=무엇을, 하위 4비트=어디\n에.\n숫자가 명령이 되는 순간\n③ 실행\nLOAD / ADD / STORE / HALT.\nADD는 플래그를 남긴다 (S4)"},{"id":"t8-05","ty":"mc","lv":3,"game":true,"p":"메모리 0번지 값 00011010(26)을 명령으로 해석하면? (0001=LOAD, 0010=ADD)","o":["ADD 10","LOAD 10","LOAD 26","ADD 26"],"a":1,"h":"해석 단계에서는 상위 4비트가 무엇을(명령 종류), 하위 4비트가 어디에(주소)를 뜻합니다. 00011010을 앞 4칸 0001과 뒤 4칸 1010으로 나눠, 앞은 주어진 표로, 뒤는 10진수로 읽어 보세요.","w":"상위 0001은 LOAD, 하위 1010은 10번지이므로 LOAD 10입니다. 26 전체를 주소로 읽는 것은 4비트씩 나누는 해석 규칙을 놓친 것입니다.","an":"컴퓨터구조 Day3 S6 p.53–56 (명령 실행 사이클 애니메이션)","src":"개념\n세 박자\n① 인출\nPC가 가리키는 칸을 IR로.\n아직 뜻은 모른다 · PC는 +1\n② 해석\n상위 4비트=무엇을, 하위 4비트=어디\n에.\n숫자가 명령이 되는 순간\n③ 실행\nLOAD / ADD / STORE / HALT.\nADD는 플래그를 남긴다 (S4)"},{"id":"t8-06","ty":"ox","lv":2,"game":true,"p":"상태 플래그는 우리가 값을 쓰면 장치가 움직이는 레지스터이다.","a":false,"h":"상태 플래그(S4)는 CPU가 쓰고 우리가 읽는 쪽지입니다. 반대로 우리가 값을 써서 장치를 움직이는 것은 제어 레지스터로, 두 레지스터는 방향이 반대입니다.","w":"상태 플래그는 CPU가 쓰고 우리가 읽는 쪽지입니다. 우리가 쓰면 장치가 움직이는 것은 제어 레지스터로, 비트 하나가 장치 하나입니다.","an":"컴퓨터구조 Day3 S5 p.43","src":"도입\n상태 vs 제어 — 방향이 반대\n상태 플래그 (S4)\nCPU가 쓰고, 우리가 읽는 쪽지\n제어 레지스터 (지금)\n우리가 쓰면, 장치가 움직인다\n비트 하나 = 장치 하나"},{"id":"t8-07","ty":"ox","lv":1,"game":true,"p":"Random Access란 메모리의 어느 칸이든 같은 박자로 접근할 수 있다는 뜻이다.","a":true,"h":"주소 접근 시연에서 '자동 방문'으로 메모리의 구석 칸과 가운데 칸을 비교했습니다. 어느 칸이든 걸리는 박자가 똑같았기 때문에 이런 이름이 붙었습니다.","w":"구석이든 가운데든 어느 칸이든 같은 박자로 접근하기 때문에 Random Access라고 부릅니다.","an":"컴퓨터구조 Day3 S6 p.54","src":"시연\n주소 접근 — 인출의 밑바닥 (시연만)\n▪ 어느 칸이든 같은 박자 — 그래서 Random Access\n▪ '자동 방문'으로 확인: 구석이든 가운데든 똑같다\n▪ 산출물 없음 — 눈으로만"},{"id":"t8-08","ty":"match","lv":1,"game":false,"p":"비트 제어에서 할 일과 쓰는 연산을 연결하세요.","pairs":[["켜기","OR"],["끄기","AND + NOT"],["토글","XOR"],["검사","AND (읽기만)"]],"h":"켜기는 '하나라도 1인가?'의 연산, 끄기는 뒤집은 마스크로 거르는 연산 조합을 씁니다. 토글은 같으면 0이 되는 연산, 검사는 값을 바꾸지 않고 마스크로 거르기만 해서 읽습니다.","w":"켜기는 OR, 끄기는 AND와 NOT, 토글은 XOR, 검사는 AND로 읽기만 합니다. 원칙은 '읽고 – 비트만 고치고 – 다시 쓴다'이며 다른 7비트는 보존합니다.","an":"컴퓨터구조 Day3 S5 p.45","src":"개념\n네 가지 관용구\n할 일 코드 쓰는 연산\n켜기 REG |= (1 << n); OR\n끄기 REG &= ~(1 << n); AND + NOT\n토글 REG ^= (1 << n); XOR\n검사 REG & (1 << n) AND (읽기만)\n원칙 한 줄: 읽고 – 비트만 고치고 – 다시 쓴다. 다른 7비트는 보존."},{"id":"t8-09","ty":"order","lv":2,"game":false,"p":"두 수를 더하는 시뮬레이터 프로그램의 명령을 실행 순서대로 나열하세요.","steps":["LOAD 10 — M[10]을 A로","ADD 11 — A+M[11]을 A로","STORE 12 — A를 M[12]로","HALT — 정지"],"h":"덧셈 프로그램은 LOAD→ADD→STORE→HALT 네 명령으로 이뤄집니다. 먼저 첫 수를 A에 올리고, 둘째 수를 더한 뒤, 결과를 메모리에 내려놓고, 마지막에 멈춥니다.","w":"LOAD로 첫째 수를 A에 올리고, ADD로 둘째 수를 더한 뒤, STORE로 결과를 메모리에 남기고 HALT로 멈춥니다. 각 명령은 인출–해석–실행 세 박자로 처리됩니다.","an":"컴퓨터구조 Day3 S6 p.52 · S7 p.62","src":"이 섹션의 도착\nLOAD→ADD→STORE→HALT 네 명령을\n인출–해석–실행 박자로 손 추적해 추적표 17칸을 채운다\n워크시트 · 실습 6 · 명령 실행 추적표"},{"id":"t8-10","ty":"multi","lv":3,"game":true,"p":"명령 실행의 '인출' 박자에서 일어나는 일을 모두 고르세요.","o":["PC가 가리키는 칸을 IR로","PC가 1 증가한다","아직 명령의 뜻은 모른다","ADD가 플래그를 남긴다","A의 값을 메모리에 쓴다"],"a":[0,1,2],"h":"인출은 PC가 가리키는 칸을 IR로 가져오기만 하는 박자로, 이 순간 PC가 증가합니다. 명령의 뜻을 아는 것은 해석 박자, 실제 LOAD·ADD 등을 수행하고 플래그를 남기는 것은 실행 박자입니다.","w":"인출에서는 PC가 가리키는 칸을 IR로 가져오고 PC가 +1 되며, 뜻은 아직 모릅니다. 플래그를 남기거나 메모리에 쓰는 일은 실행 박자의 몫입니다.","an":"컴퓨터구조 Day3 S6 p.55","src":"개념\n세 박자\n① 인출\nPC가 가리키는 칸을 IR로.\n아직 뜻은 모른다 · PC는 +1\n② 해석\n상위 4비트=무엇을, 하위 4비트=어디\n에.\n숫자가 명령이 되는 순간\n③ 실행\nLOAD / ADD / STORE / HALT.\nADD는 플래그를 남긴다 (S4)"}]}]};

/* 게임 모드 목록 — 새 게임은 여기에 항목을 추가한다 (설정·출제 유형·규칙 문구를 모드별로) */

    types:['mc','ox','multi'],times:[5,7,10,15],defaultTime:10},
};

/* ── 저장소 (실패해도 동작) ─────────────── */
const KEY='qb:'+BANK.id+':v1';
const blank=()=>({name:'',tabs:{},wrong:{},board:[],drafts:{}});  // drafts: 채점 전 탭별 풀던 답

/* 순위 저장소 — 공유 순위로 바꿀 때 이 객체만 교체 */
// 순위는 같은 조건(게임 모드 + 풀이 시간)끼리만 비교한다. key = 'timeattack:10'
const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

/* ── 유틸 ──────────────────────────────── */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function say(msg){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=msg,30);}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('📋 클립보드에 복사했습니다');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'📋 클립보드에 복사했습니다':'복사하지 못했습니다. 인쇄 기능을 이용하세요.');
}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

/* ── 오답노트 ──────────────────────────── */
function addWrong(id,ans){const w=S.wrong[id]||{n:0};w.n++;w.last=ans;w.at=Date.now();w.solved=false;S.wrong[id]=w;}
function markSolved(id){if(S.wrong[id]&&!S.wrong[id].solved){S.wrong[id].solved=true;S.wrong[id].at=Date.now();}}
const wrongList=solved=>Object.keys(S.wrong).filter(id=>QMAP[id]&&!!S.wrong[id].solved===solved)
  .sort((a,b)=>QTAB[a].idx-QTAB[b].idx||ALLQ.indexOf(QMAP[a])-ALLQ.indexOf(QMAP[b]));

/* ── 문항 풀이 상태(학습·재도전 공용) ───── */
let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

function cardHTML(q,n){
  const [label,color]=TYPES[q.ty];
  const g=cur.graded, a=cur.ans[q.id], fa=finalAns(q), ok=g&&isCorrect(q,fa);
  const lock=g?' disabled':'';
  let body='';
  if(q.ty==='mc'||q.ty==='multi'){
    const multi=q.ty==='multi', mine=multi?(a||[]):[a];
    body='<div class="opts">'+q.o.map((o,i)=>{
      const right=multi?q.a.includes(i):q.a===i, picked=mine.includes(i);
      const cls=g?(right?' ans':picked?' miss':''):'';
      return `<label class="opt${cls}"><span class="onum">${i+1}</span><input type="${multi?'checkbox':'radio'}" name="r-${q.id}" data-act="${multi?'tick':'pick'}" data-q="${q.id}" data-i="${i}"${picked?' checked':''}${lock}><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(q.ty==='ox'){
    body='<div class="ox">'+[true,false].map(v=>{
      const cls=g?(q.a===v?' ans':a===v?' miss':''):'';
      return `<button type="button" class="${cls.trim()}" data-act="ox" data-q="${q.id}" data-v="${v?1:0}" data-fk="${q.id}-ox${v?1:0}" aria-pressed="${a===v}" aria-label="${v?'맞다 O':'틀리다 X'}"${lock}>${v?'O':'X'}</button>`;
    }).join('')+'</div>';
  }else if(q.ty==='match'){
    const m=a||{}, sel=cur.msel[q.id], linkedBy={};
    Object.entries(m).forEach(([l,r])=>linkedBy[r]=+l);
    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${PAL[i%PAL.length]})" data-act="ml" data-q="${q.id}" data-i="${i}" data-fk="${q.id}-l${i}"${lock}><span class="tag">${LETTER[i]}</span>${esc(p[0])}</button>`;
    }).join('');
    const right=cur.shuf[q.id].map(j=>{
      const by=linkedBy[j], linked=by!=null, cls=(linked?' linked':'')+(g&&linked?(by===j?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${linked?PAL[by%PAL.length]:'--line'})" data-act="mr" data-q="${q.id}" data-j="${j}" data-fk="${q.id}-r${j}"${lock}><span class="tag">${linked?LETTER[by]:''}</span>${esc(q.pairs[j][1])}</button>`;
    }).join('');
    body=`<div class="match"><div class="mcol mleft">${left}</div><div class="mcol mright">${right}</div></div>`;
  }else if(q.ty==='order'){
    const seq=a||[], full=seq.length===q.steps.length;
    body='<div class="olist">'+(cur.shuf[q.id]||range(q.steps.length)).map(si=>{
      const pos=seq.indexOf(si), on=pos>=0;
      const cls=(on?' on':'')+(g?(pos===si?' ok':' no'):'');
      const fix=g&&pos!==si?`<span class="ofix">정답 ${si+1}</span>`:'';
      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }
  const numAns=q.ty==='mc'?`${q.a+1}번 · `:q.ty==='multi'?q.a.map(i=>i+1).join('·')+'번 · ':'';
  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${mediaHTML(q)}${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>${voiceRow(q,q.id)}`}${body}${exp}</article>`;
}
const LV_NAME=['쉬움','보통','어려움'];
function lvHTML(lv){
  lv=lv||1;
  const dots=[1,2,3].map(k=>k<=lv?`<i class="d${k}">●</i>`:'<i class="off">○</i>').join('');
  return `<span class="lv lv${lv}" title="난이도 ${LV_NAME[lv-1]}"><span class="dots" aria-hidden="true">${dots}</span><em>${LV_NAME[lv-1]}</em></span>`;
}
// 자료 발췌: 이스케이프 후 마크다운 기호만 가볍게 서식으로 (**굵게**, `코드`, 머리 #)
const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
function hintHTML(q){
  if(!q.h)return '';
  const open=cur.hints.has(q.id), label=q.ty==='num'?'Hint · 계산식':'Hint';
  // 2단계: ① 자세한 힌트(h) ② 자료 보기 — 자료 원문 발췌(src) + 위치(an)
  const sopen=cur.srcs.has(q.id);
  const src=q.src?`<div class="srcwrap"><button type="button" class="srcbtn" data-act="src" data-q="${q.id}" data-fk="${q.id}-src" aria-expanded="${sopen}" aria-controls="src-${q.id}">`+
    `<span class="caret" aria-hidden="true">${sopen?'▾':'▸'}</span>📖 자료 보기</button>`+
    (sopen?`<blockquote class="src" id="src-${q.id}"><p>${srcText(q.src)}</p>${q.an?`<cite>${esc(q.an)}</cite>`:''}</blockquote>`:'')+`</div>`:'';
  return `<div class="hintwrap"><button type="button" class="hintbtn" data-act="hint" data-q="${q.id}" data-fk="${q.id}-hint" aria-expanded="${open}" aria-controls="hint-${q.id}">`+
    `<span class="caret" aria-hidden="true">${open?'▾':'▸'}</span>${label}</button>`+
    (open?`<div class="hint" id="hint-${q.id}">${q.h}${src}</div>`:'')+`</div>`;
}
function refreshCard(q){
  const el=document.getElementById('card-'+q.id);if(!el)return;
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  el.outerHTML=cardHTML(q,el.dataset.n);
  if(fk){const f=app.querySelector(`[data-fk="${fk}"]`);if(f&&!f.disabled)f.focus();}

const pad2=n=>String(n).padStart(2,'0');
const fmtCnt=(n,t)=>`(${pad2(n)}/${pad2(t)})`;
// 탭별 푼 문항 수: 지금 보는 탭 → 화면 상태, 그 외 → 풀던 답(drafts) → 채점 기록
function tabAnswered(t){
  const src=cur&&cur.mode==='study'&&cur.tab===t?cur.ans:(S.drafts[t.id]||(S.tabs[t.id]&&S.tabs[t.id].answers)||{});
  return t.qs.filter(q=>isAnswered(q,src[q.id])).length;
}
function updateProgress(){
  const p=document.getElementById('pbar');if(!p||!cur)return;
  const n=cur.list.filter(answered).length, cnt=fmtCnt(n,cur.list.length);
  p.style.width=pct(n,cur.list.length)+'%';
  document.getElementById('ptxt').textContent=`${n} / ${cur.list.length} 응답`;
  const g=document.getElementById('gradeCnt');if(g)g.textContent=cnt;
  if(cur.mode==='study'){
    const c=document.getElementById('qc-'+cur.tab.id);if(c)c.textContent=cnt;
    if(!cur.graded){  // 풀던 답 저장 → 탭을 옮겨도 유지
      if(n||Object.keys(cur.ans).some(k=>{const v=cur.ans[k];return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:v!=null&&v!=='';}))
        S.drafts[cur.tab.id]=JSON.parse(JSON.stringify(cur.ans));
      else delete S.drafts[cur.tab.id];
      save();
    }
  }
}

/* ── 음성 선택 · 문제 읽기 · 그림/오디오 (qb-voice.js가 없으면 모두 숨김) ── */
const hasVoice=()=>!!(window.QBVoice&&QBVoice.supported());
const hasRead=()=>!!(window.QBVoice&&QBVoice.canSpeak());
const IC_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const IC_VOL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const VC=new Map();  // 학습 모드 문항별 음성 컨트롤러
function voiceReset(){VC.clear();if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}}
function voiceRow(q,fkp){
  const mic=hasVoice()&&['mc','multi','ox'].includes(q.ty), rd=hasRead();

    (rd?`<button type="button" class="vbtn" data-act="vread"${qa} data-fk="${fkp}-vread">${IC_VOL}<span>문제 읽기</span></button>`:'')+
    (mic?`<span class="vstat" aria-live="polite"></span><span class="vhint">말하기 어려우면 눌러서 고르세요</span>`:'')+`</div>`;

function mediaHTML(q){
  let h='';
  if(q.img&&q.img.src)h+=`<figure class="qfig"><img src="${esc(q.img.src)}" alt="${esc(q.img.alt)}" loading="lazy">${q.img.caption?`<figcaption>${esc(q.img.caption)}</figcaption>`:''}</figure>`;
  if(q.audio&&q.audio.src)h+=`<div class="qaud"><audio controls preload="none" src="${esc(q.audio.src)}"></audio><details><summary>대본</summary><p>${esc(q.audio.transcript)}</p></details></div>`;
  return h;
}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
// 읽어 줄 글: 문제 + 화면에 보이는 순서의 보기("1번 …")
function readText(q,n,order){
  let t=(n?`${n}번 문제. `:'')+plain(q.p)+'.';
  if(q.img&&q.img.alt)t+=' 그림 설명. '+q.img.alt+'.';

function readAloud(text){if(QBVoice.isSpeaking())QBVoice.cancelSpeak();else QBVoice.speak(text);}
// 음성으로 고른 것 = 보기를 직접 누른 것과 같은 경로(입력 click → 기존 change/click 처리)
function voicePick(q,r){

  const el=r.kind==='ox'?card.querySelector(`[data-act="ox"][data-v="${r.v==='O'?1:0}"]`):card.querySelector(`input[data-i="${r.i}"]`);

function studyVoice(q){

function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;
  else if(el.dataset.act==='tick'){
    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);
  }
  cur.armed=false;updateProgress();
}
function onSheetInput(el){
  if(el.dataset.act==='num'&&!cur.graded){cur.ans[el.dataset.q]=el.value;cur.armed=false;updateProgress();}
}

function viewStudy(tid,fresh){

function gradeSheet(){
  const miss=cur.list.map((q,i)=>answered(q)?0:i+1).filter(Boolean);
  if(miss.length&&!cur.armed){
    cur.armed=true;
    document.getElementById('warn').textContent=`미응답 ${miss.length}문항 (Q${miss.join(', Q')}). 한 번 더 누르면 미응답은 오답으로 채점합니다.`;
    return;
  }
  const firstUnlock=!gameUnlocked();
  cur.graded=true;
  const snap={};let score=0;
  cur.list.forEach(q=>{
    const a=finalAns(q);
    if(a!=null)snap[q.id]=a;
    if(isCorrect(q,a)){score++;markSolved(q.id);}
    else addWrong(q.id,answerText(q,a));
  });
  if(cur.mode==='study'){
    S.tabs[cur.tab.id]={score,total:cur.list.length,answers:snap,touched:[...cur.touched],at:Date.now()};
    delete S.drafts[cur.tab.id];
  }
  save();
  renderSheet();
  window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
  say(`채점 결과 ${score}점, ${cur.list.length}문항 중`);
  if(cur.mode==='study'&&firstUnlock)setTimeout(()=>toast('⚡ 게임 모드와 해설지가 열렸습니다!'),300);
  else if(cur.mode==='study'&&allGraded())setTimeout(()=>toast('★ 모든 탭 완료! 종합 결과를 확인하세요.'),300);
}

let G=null;
const gameSetup={mode:'timeattack',count:10,scope:'all',time:GAME_MODES.timeattack.defaultTime};
function gamePool(scope){
  const M=GAME_MODES[gameSetup.mode];
  const base=ALLQ.filter(q=>q.game&&!q.audio&&M.types.includes(q.ty));  // 오디오 문항은 제한시간 안에 들을 수 없어 제외
  if(scope==='played')return shuffle(base.filter(q=>S.tabs[QTAB[q.id].id]));
  if(scope==='wrong'){const w=new Set(wrongList(false));return shuffle(base.filter(q=>w.has(q.id))).concat(shuffle(base.filter(q=>!w.has(q.id))));}
  return shuffle(base);
}

function viewGameSetup(modeId){
  stopGame();
  if(modeId&&GAME_MODES[modeId])gameSetup.mode=modeId;
  if(!gameUnlocked()){
    app.innerHTML=`<nav class="crumbs"><a href="#home">← 홈</a></nav><div class="game"><h1>⚡ 게임 모드 🔒</h1>
      <div class="keylock">학습 모드에서 <b>탭 하나</b>를 먼저 채점하면 열립니다.<br><br><a class="btn primary" href="#study/${TABS[0].id}">학습 시작</a></div></div>`;return;
  }
  const poolN=gamePool(gameSetup.scope).length;
  const counts=[10,20,30].filter(n=>n<poolN).concat([poolN]);
  if(!counts.includes(gameSetup.count))gameSetup.count=counts.includes(10)?10:counts[0];
  const M=GAME_MODES[gameSetup.mode];
  if(!M.times.includes(gameSetup.time))gameSetup.time=M.defaultTime;
  const chip=(grp,v,label,dis)=>`<button type="button" class="chip" data-act="gset" data-g="${grp}" data-v="${v}" aria-pressed="${gameSetup[grp]==v}"${dis?' disabled':''}>${label}</button>`;
  app.innerHTML=`
  <nav class="crumbs"><a href="#home">← 홈</a><span>/</span><a href="#game">게임 모드</a><span>/</span><span>${M.title.replace(/^\S+\s/,'')}</span></nav>
  <div class="game">
    <h1>${M.title}</h1>
    <p class="sub">${M.desc}</p>
    <div class="panel">
      ${Object.keys(GAME_MODES).length>1?`<span class="lbl">게임 종류</span>
      <div class="chips">${Object.entries(GAME_MODES).map(([id,m])=>chip('mode',id,m.title)).join('')}</div>`:''}
      <span class="lbl">풀이 시간 (문항당)</span>
      <div class="chips">${M.times.map(t=>chip('time',t,t+'초')).join('')}</div>
      <span class="lbl">문항 수</span>
      <div class="chips">${counts.map(n=>chip('count',n,n===poolN&&!([10,20,30].includes(n))?`전체 ${n}`:String(n))).join('')}</div>
      <span class="lbl">출제 범위</span>
      <div class="chips">${chip('scope','all','전체 탭')}${chip('scope','played','풀어본 탭만')}${chip('scope','wrong','오답 우선',!wrongList(false).length)}</div>
      <div class="field"><label for="gnm">닉네임</label><input id="gnm" data-act="name" maxlength="20" value="${esc(S.name)}" placeholder="순위표에 표시"></div>
      <div class="rules"><p>⏱ 모든 문항 ${gameSetup.time}초 · 순위는 같은 풀이 시간끼리 비교</p><p>🎯 정답 100점 + 남은 1초당 10점 · 🔥 3연속 ×1.2, 5연속 ×1.5</p><p>⌨ 숫자 1~5로 선택, O/X 키, 복수 선택은 Enter로 제출</p></div>
      <button class="btn primary block" type="button" data-act="gstart">시작하기</button>
    </div>
  </div>`;
}
function startGame(){
  const pool=gamePool(gameSetup.scope).slice(0,gameSetup.count);
  if(!pool.length){toast('출제할 문항이 없습니다.');return;}
  G={qs:pool,i:0,score:0,combo:0,maxCombo:0,results:[],locked:false,mode:gameSetup.mode,time:gameSetup.time};
  renderGameQ();
}
function renderGameQ(){
  voiceReset();
  const q=G.qs[G.i];
  G.locked=false;G.elapsed=0;G.last=performance.now();G.limit=G.time*1000;G.warned=false;G.pick=[];
  G.view=q.ty==='ox'?[true,false]:shuffle(range(q.o.length));
  const opts=q.ty==='ox'
    ?`<div class="gox">${G.view.map((v,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}" aria-label="${v?'O 맞다':'X 틀리다'}">${v?'O':'X'}</button>`).join('')}</div>`
    :`<div class="gopts">${G.view.map((oi,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}"${q.ty==='multi'?' aria-pressed="false"':''}><kbd>${k+1}</kbd><span>${esc(q.o[oi])}</span></button>`).join('')}</div>`;
  app.innerHTML=`
  <div class="game play">
    <div class="gtop"><div class="hud"><span>${G.i+1} / ${G.qs.length}</span><span class="combo${G.combo>=3?' hot':''}">🔥 콤보 ${G.combo}</span><span class="pts">${G.score.toLocaleString()}점</span></div>
    <div class="timer" id="timer"><div id="tbar"></div></div><div class="tleft" id="tleft"></div></div>
    <div class="gtype">${TYPES[q.ty][0]}${q.ty==='multi'?' · 모두 고른 뒤 제출':''}</div>
    <div class="gq">${q.p}</div>${mediaHTML(q)}
    <div class="gbottom">${voiceRow(q,'g')}${opts}
    <div class="gfloat" id="gfloat" aria-live="polite"></div>
    <div class="gsub"><button class="btn" type="button" data-act="gquit">그만하기</button>
      ${q.ty==='multi'?'<button class="btn primary" type="button" data-act="gsubmit">제출 (Enter)</button>':''}</div></div>
  </div>`;
  if(hasVoice())G.vc=QBVoice.attach({bind:false,button:()=>app.querySelector('.vmic'),live:()=>app.querySelector('.vstat'),
    getOptions:()=>G.view.length,getType:()=>q.ty,
    select:r=>gameAnswer(r.kind==='ox'?(r.v==='O'?0:1):r.i),submit:q.ty==='multi'?gameSubmit:null});  // 말하면 클릭과 같게 바로 선택(·제출)
  G.raf=requestAnimationFrame(tick);
}
function tick(now){
  if(!G||G.locked)return;
  G.elapsed+=now-G.last;G.last=now;
  const rem=Math.max(0,G.limit-G.elapsed), ratio=rem/G.limit;
  const shown=RM.matches?Math.ceil(rem/1000)*1000/G.limit:ratio;
  const bar=document.getElementById('tbar'), tm=document.getElementById('timer');
  if(bar){bar.style.width=(Math.min(1,shown)*100)+'%';tm.className='timer'+(ratio<.25?' lo':ratio<.5?' mid':'');
    document.getElementById('tleft').textContent=(rem/1000).toFixed(1)+'초';}
  if(!G.warned&&rem<=5000){G.warned=true;say('5초 남았습니다');}
  if(rem<=0){judge(null,true);return;}
  G.raf=requestAnimationFrame(tick);
}
function judge(ans,timeout){
  if(!G||G.locked)return;
  G.locked=true;cancelAnimationFrame(G.raf);
  const q=G.qs[G.i], used=Math.min(G.elapsed,G.limit), ok=!timeout&&isCorrect(q,ans);
  let gain=0;
  if(ok){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const mult=G.combo>=5?1.5:G.combo>=3?1.2:1;
    gain=Math.round((100+Math.floor((G.limit-used)/100))*mult);G.score+=gain;}
  else G.combo=0;
  G.results.push({id:q.id,ok,ans,timeout,ms:used,gain});
  // 판정 표시
  app.querySelectorAll('[data-act="gans"]').forEach(b=>{
    const k=+b.dataset.k, v=G.view[k];
    const right=q.ty==='ox'?q.a===v:q.ty==='mc'?q.a===v:q.a.includes(v);
    const picked=q.ty==='ox'||q.ty==='mc'?ans===v:(ans||[]).includes(v);
    if(right)b.classList.add('ans');else if(picked)b.classList.add('miss');
    b.disabled=true;
  });
  const f=document.getElementById('gfloat');
  f.className='gfloat pop '+(ok?'ok':'no');
  f.textContent=ok?`+${gain}${G.combo>=3?` 🔥×${G.combo>=5?'1.5':'1.2'}`:''}`:timeout?'⏰ 시간 초과':'✗ 오답';
  if(timeout){const tm=document.getElementById('timer');tm&&tm.classList.add('out');}
  const sb=app.querySelector('[data-act="gsubmit"]');if(sb)sb.disabled=true;
  app.querySelector('.pts').textContent=G.score.toLocaleString()+'점';
  const c=app.querySelector('.combo');c.textContent='🔥 콤보 '+G.combo;c.classList.toggle('hot',G.combo>=3);
  G.next=setTimeout(()=>{if(!G)return;G.i++;G.i<G.qs.length?renderGameQ():finishGame();},ok?900:1400);
}
function gameAnswer(k){
  if(!G||G.locked)return;
  const q=G.qs[G.i];if(k<0||k>=G.view.length)return;
  if(q.ty==='multi'){
    const v=G.view[k], i=G.pick.indexOf(v);
    i<0?G.pick.push(v):G.pick.splice(i,1);
    const b=app.querySelector(`[data-act="gans"][data-k="${k}"]`);b&&b.setAttribute('aria-pressed',i<0);
  }else judge(G.view[k],false);
}
function gameSubmit(){if(G&&!G.locked&&G.qs[G.i].ty==='multi')judge(G.pick.slice(),false);}
function stopGame(){if(G){cancelAnimationFrame(G.raf);clearTimeout(G.next);G=null;}}
function finishGame(){
  const R=G.results, correct=R.filter(r=>r.ok).length, M=GAME_MODES[G.mode];
  R.forEach(r=>{const q=QMAP[r.id];if(r.ok)markSolved(r.id);else addWrong(r.id,r.timeout?'(시간 초과)':answerText(q,r.ans));});
  const rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:(S.name||'').trim()||'익명',score:G.score,
    correct,total:R.length,rate:pct(correct,R.length),avg:Math.round(R.reduce((s,r)=>s+r.ms,0)/R.length/100)/10,combo:G.maxCombo,mode:G.mode,time:G.time,at:Date.now()};
  const rank=Leaderboard.add(rec);
  save();
  const board=Leaderboard.load(boardKey(rec)), top=board.slice(0,10), mine=board.find(r=>r.id===rec.id);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;
  const row=(r,i)=>`<tr class="${r.id===rec.id?'me':''}"><td>${medal(i)}</td><td>${esc(r.name)}</td><td class="r">${r.score.toLocaleString()}</td><td class="r">${r.rate}%</td><td class="r">${r.correct}/${r.total}</td><td class="r">${new Date(r.at).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}</td></tr>`;
  const wrong=R.filter(r=>!r.ok);
  G=null;
  app.innerHTML=`
  <div class="game">
    <div class="panel center">
      <p class="note-sm" style="margin:0">최종 점수</p>
      <div class="score xl">${rec.score.toLocaleString()}</div>
      <p class="msg">${M.title} · ${rec.time}초 — ${rank===1?'🏆 이 조건 최고 기록!':`이 조건 순위 ${rank}위`}</p>
      <div class="bignum"><div><b>${correct}/${rec.total}</b><span>정답</span></div><div><b>${rec.rate}%</b><span>정답률</span></div><div><b>${rec.avg}초</b><span>평균 응답</span></div><div><b>${rec.combo}</b><span>최고 콤보</span></div></div>
    </div>
    <div class="panel"><h2 class="ph">🏆 순위 · ${M.title.replace(/^\S+\s/,'')} ${rec.time}초 · 이 브라우저 기록</h2>
      <table class="board"><thead><tr><th>#</th><th>이름</th><th class="r">점수</th><th class="r">정답률</th><th class="r">정답</th><th class="r">날짜</th></tr></thead>
      <tbody>${top.map(row).join('')}${rank>10&&mine?row(mine,rank-1):''}</tbody></table></div>
    ${wrong.length?`<details class="more panel"><summary>틀린 문항 ${wrong.length}개 · 해설 보기 (오답노트에 저장됨)</summary>
      ${wrong.map(r=>{const q=QMAP[r.id];return `<div class="keyitem"><div class="kq">${q.p}</div><p class="mine" style="margin:4px 0">내 답: ${esc(r.timeout?'(시간 초과)':answerText(q,r.ans))}</p><p class="ka">정답: ${esc(correctText(q))}</p><p class="kw">${q.w}</p><span class="an">📖 ${esc(q.an)}</span></div>`;}).join('')}</details>`:''}
    <div class="actions"><button class="btn primary" type="button" data-act="gagain">↻ 다시 하기</button><a class="btn" href="#notes">📒 오답노트</a><a class="btn" href="#home">홈</a></div>
  </div>`;
}

/* ── 라우터 · 이벤트 ───────────────────── */
function route(){
  stopGame();voiceReset();cur=null;app.classList.remove('sheet');
  const [v,arg]=(location.hash.slice(1)||'home').split('/');
  ({study:()=>viewStudy(arg),notes:viewNotes,retry:viewRetry,key:viewKey,game:()=>arg?viewGameSetup(arg):viewGamePick(),summary:viewSummary}[v]||viewHome)();
  window.scrollTo(0,0);
}
let resetArmed=false;
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act;
  if(cur&&['ox','ml','mr','ord','hint','src'].includes(act))return onSheetClick(el);
  switch(act){
    case 'grade':gradeSheet();break;
    case 'retab':viewStudy(cur.tab.id,true);window.scrollTo(0,0);break;  // 이전 점수는 다시 채점할 때까지 유지
    case 'onlywrong':cur.onlyWrong=!cur.onlyWrong;document.getElementById('cards').classList.toggle('onlywrong',cur.onlyWrong);el.textContent=cur.onlyWrong?'전체 보기':'오답만 보기';break;
    case 'copyreport':copy(reportMD());break;
    case 'copynotes':copy(`# ${BANK.title}\n\n- 이름: ${S.name||'-'} · ${today()}\n\n`+notesMD(false));break;
    case 'clearsolved':wrongList(true).forEach(id=>delete S.wrong[id]);save();viewNotes();break;
    case 'print':window.print();break;
    case 'reset':
      if(!resetArmed){resetArmed=true;el.textContent='정말 지울까요? 한 번 더 누르세요';setTimeout(()=>{resetArmed=false;if(el.isConnected)el.textContent='이 문제은행 기록 모두 지우기';},4000);break;}
      resetArmed=false;const nm=S.name;S=blank();S.name=nm;save();toast('기록을 지웠습니다');viewHome();break;
    case 'gset':gameSetup[el.dataset.g]=['count','time'].includes(el.dataset.g)?+el.dataset.v:el.dataset.v;viewGameSetup();break;
    case 'gstart':startGame();break;
    case 'gans':gameAnswer(+el.dataset.k);break;
    case 'vmic':{const q=G?null:QMAP[el.dataset.q];const c=G?G.vc:(q&&cur?studyVoice(q):null);if(c)c.toggle();break;}
    case 'vread':{
      if(G){const q=G.qs[G.i];readAloud(readText(q,0,q.ty==='ox'?null:G.view));break;}
      const q=QMAP[el.dataset.q], card=document.getElementById('card-'+el.dataset.q);
      if(q)readAloud(readText(q,card?card.dataset.n:0));break;}
    case 'gsubmit':gameSubmit();break;
    case 'gquit':stopGame();viewGameSetup(gameSetup.mode);break;
    case 'gagain':startGame();break;
  }
});
app.addEventListener('change',e=>{const el=e.target;if(cur&&el.dataset&&(el.dataset.act==='pick'||el.dataset.act==='tick'))onSheetChange(el);});
app.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.act==='name'){S.name=el.value;save();}
  else if(cur)onSheetInput(el);
});
document.addEventListener('keydown',e=>{
  if(!G||G.locked||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.target.matches&&e.target.matches('input,textarea'))return;
  const q=G.qs[G.i], k=e.key.toLowerCase();
  if(q.ty==='ox'){if(k==='o'||k==='1'){e.preventDefault();gameAnswer(0);}else if(k==='x'||k==='2'){e.preventDefault();gameAnswer(1);}return;}
  if(/^[1-9]$/.test(k)){e.preventDefault();gameAnswer(+k-1);}
  else if(k==='enter'&&q.ty==='multi'&&!(e.target.closest&&e.target.closest('.vrow'))){e.preventDefault();gameSubmit();}
});
window.addEventListener('pagehide',()=>{if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}});
document.addEventListener('visibilitychange',()=>{if(G&&!document.hidden)G.last=performance.now();});
// 탭 바 좌우 화살표
app.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('.tabchip');if(!t||(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'))return;
  const n=e.key==='ArrowRight'?t.nextElementSibling:t.previousElementSibling;if(n){e.preventDefault();n.focus();}
});
/* 테마 */
let theme=null;try{theme=localStorage.getItem('qb:theme');}catch(e){}
const applyTheme=()=>{if(theme)document.documentElement.dataset.theme=theme;else delete document.documentElement.dataset.theme;};
applyTheme();
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  theme=dark?'light':'dark';try{localStorage.setItem('qb:theme',theme);}catch(e){}applyTheme();
});
document.title=BANK.title+' · 문제은행';
window.addEventListener('hashchange',route);
route();
})();
</script>
