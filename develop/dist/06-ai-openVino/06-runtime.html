<script>/* QB 공용 코어 — 저장 키, mock 로그인, 테마, 과목 목록. 비밀번호는 저장하지 않는다. */
(function(){
'use strict';
var KEY_USER='qb:user', KEY_UI='qb:ui:v1', KEY_THEME='qb:theme';
function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function del(k){try{localStorage.removeItem(k);}catch(e){}}
function json(k,d){try{var r=get(k);return r?JSON.parse(r):d;}catch(e){return d;}}
var QB=window.QB={};
QB.SUBJECTS=[
  {id:'it',label:'IT'},{id:'korean',label:'국어'},{id:'english',label:'영어'},
  {id:'science',label:'과학'},{id:'music',label:'음악'},{id:'art',label:'미술'}
];
QB.user=function(){var u=json(KEY_USER,null);return u&&u.v===1&&u.name?u:null;};
QB.login=function(o){
  o=o||{};var prev=json(KEY_USER,null),now=new Date().toISOString();
  var u={v:1,name:String(o.name||'').trim().slice(0,20),email:String(o.email||'').trim(),
    provider:o.provider||'email',createdAt:(prev&&prev.createdAt)||now,lastLoginAt:now};
  set(KEY_USER,JSON.stringify(u));return u;
};
QB.logout=function(){del(KEY_USER);};
QB.rename=function(n){
  var u=QB.user();n=String(n||'').trim().slice(0,20);if(!u||!n)return null;
  u.name=n;set(KEY_USER,JSON.stringify(u));return u;
};
QB.safeNext=function(n){
  n=String(n||'');return /^dashboard\.html(#[A-Za-z0-9\/=&_-]*)?$/.test(n)?n:'dashboard.html';
};
QB.requireUser=function(next){
  var u=QB.user();if(u)return u;
  next=QB.safeNext(next==null?'dashboard.html'+location.hash:next);
  location.replace('login.html?next='+encodeURIComponent(next));return null;
};
QB.theme={
  get:function(){return get(KEY_THEME);},
  apply:function(){var t=get(KEY_THEME),r=document.documentElement;if(t)r.dataset.theme=t;else delete r.dataset.theme;},
  toggle:function(){
    var t=get(KEY_THEME),dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    set(KEY_THEME,dark?'light':'dark');QB.theme.apply();
  }
};
QB.ui={
  get:function(){var d=json(KEY_UI,null);return d&&typeof d==='object'?d:{sidebar:true,subject:'it'};},
  set:function(p){var d=Object.assign(QB.ui.get(),p||{});set(KEY_UI,JSON.stringify(d));return d;}
};
QB.theme.apply();
})();
</script>
<script>/* qb-voice.js — 음성으로 보기 번호 고르기(Web Speech API) + 문제 읽기(speechSynthesis)
   window.QBVoice: supported · canSpeak · parse · attach · speak · cancelSpeak · isSpeaking · stopListening
   parse()는 순수 함수라 node에서도 테스트한다. */
(function(root){
'use strict';

/* ── 말 → 선택 해석 (순수 함수) ───────────────── */
const SINO={일:1,이:2,삼:3,사:4,오:5,육:6,칠:7,팔:8,구:9,십:10};
const NAT={하나:1,둘:2,셋:3,넷:4,다섯:5,여섯:6,일곱:7,여덟:8,아홉:9,열:10};
const DET={한:1,두:2,세:3,네:4,첫:1};  // 한/두/세/네/첫 은 '번'·'번째'·'째'가 붙을 때만 번호
// 보기 글자 A~H. '이'(E)는 숫자 2와 겹쳐 숫자를 우선하므로 영문 e로만 받는다
const LET={a:1,b:2,c:3,d:4,e:5,f:6,g:7,h:8,에이:1,비:2,씨:3,디:4,에프:6,지:7,에이치:8};

const alt=o=>Object.keys(o).sort((x,y)=>y.length-x.length).join('|');
const PRE='(?:정답은|정답이|정답|답은|답이|답|내답은|제답은|저는|나는|전|선택|번호)?';
const SUF='(?:이에요|이요|예요|이야|이죠|이다|입니다|이라고생각해요|이라고|선택할게요?|선택|할게요?|할래요?|고를게요?|고를래요?|정답|같아요|요|으로|로|을|를|이|가|은|는)*';
const R_DIGIT=new RegExp('^'+PRE+'(\\d{1,2})(?:번째|번|째)?'+SUF+'$');
const R_STD=new RegExp('^'+PRE+'('+alt(Object.assign({},SINO,NAT))+')(?:번째|번|째)?'+SUF+'$');
const R_DET=new RegExp('^'+PRE+'('+alt(DET)+')(?:번째|번|째)'+SUF+'$');
const R_LET=new RegExp('^'+PRE+'('+alt(LET)+')(?:번)?'+SUF+'$');
const R_X=/틀|아니|아닙|아닌|안맞|맞지않|엑스|가위|^x(?:요|입니다)?$/;
const R_O=/^(?:o|오|동그라미|오케이|ok|예|네|응|그래요?|맞.*)(?:요|입니다|이요|예요|야|라고생각해요)?$/;
const R_SUBMIT=/제출|채점|확인|다풀었|다했/;

function norm(s){
  return String(s==null?'':s).normalize('NFKC').toLowerCase().replace(/[\s.,!?'"“”‘’~…·\-_()\[\]]/g,'');
}
function numOf(t){
  let m;
  if((m=R_DIGIT.exec(t)))return +m[1];
  if((m=R_STD.exec(t)))return SINO[m[1]]||NAT[m[1]];
  if((m=R_DET.exec(t)))return DET[m[1]];
  if((m=R_LET.exec(t)))return LET[m[1]];
  return 0;
}
function parseOne(raw,count,type){
  const t=norm(raw);if(!t)return null;
  if(type==='ox'){
    if(R_X.test(t))return {kind:'ox',v:'X'};
    if(R_O.test(t))return {kind:'ox',v:'O'};
    const n=numOf(t);  // ox에서 1번 = O, 2번 = X (게임 모드 키와 같음)
    if(n===1)return {kind:'ox',v:'O'};
    if(n===2)return {kind:'ox',v:'X'};
    return R_SUBMIT.test(t)?{kind:'submit'}:null;
  }
  const n=numOf(t)||numOf(t.replace(/(?:제출|채점|확인).*$/,''));  // '3번 제출'은 번호 우선
  if(n)return n>=1&&n<=count?{kind:'index',i:n-1}:null;  // 범위 밖이면 다음 후보로
  return R_SUBMIT.test(t)?{kind:'submit'}:null;
}
/* text: 문자열 또는 후보 배열. 범위 안에서 해석되는 첫 후보를 돌려준다 */
function parse(text,opt){
  opt=opt||{};
  const count=opt.count>0?opt.count:4, type=opt.type||'mc';
  const list=Array.isArray(text)?text:[text];
  for(const s of list){const r=parseOne(s,count,type);if(r)return r;}
  return null;
}

/* ── 브라우저 부분 ────────────────────────── */
const hasWin=typeof window!=='undefined';
const SR=()=>hasWin?(window.SpeechRecognition||window.webkitSpeechRecognition):null;
const supported=()=>!!SR();
const canSpeak=()=>hasWin&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';

const ERR={
  'not-allowed':'마이크 권한이 꺼져 있습니다. 주소창의 마이크 아이콘에서 허용하세요.',
  'service-not-allowed':'마이크 권한이 꺼져 있습니다. 주소창의 마이크 아이콘에서 허용하세요.',
  'network':'음성 인식은 인터넷 연결이 필요합니다.',
  'no-speech':'소리가 들리지 않았습니다. 다시 눌러 말해 주세요.',
  'audio-capture':'마이크를 찾을 수 없습니다.'
};
let active=null;  // 지금 듣는 중인 컨트롤러 (동시에 하나만)
function stopListening(){if(active){active.stop();active=null;}}

function describe(r){
  if(r.kind==='index')return `'${r.i+1}번'으로 들었습니다`;
  if(r.kind==='ox')return `'${r.v}'로 들었습니다`;
  return "'제출'로 들었습니다";
}

/* o: {button, live, getOptions, getType, select, submit, lang, bind}
   button·live는 요소 또는 요소를 돌려주는 함수(카드를 다시 그려도 새 요소를 찾도록).
   select(r): r = {kind:'index',i} | {kind:'ox',v}. submit(): 제출. bind:false면 클릭 리스너를 달지 않는다(위임용) */
function attach(o){
  const get=x=>typeof x==='function'?x():x;
  const ctl={listening:false,toggle(){},stop(){}};
  const b0=get(o.button);
  if(!supported()){if(b0)b0.hidden=true;return ctl;}
  const lang=o.lang||'ko-KR';
  let rec=null, done=false;
  function ui(state,msg){
    const b=get(o.button), l=get(o.live);
    if(b){b.dataset.state=state;b.setAttribute('aria-pressed',state==='listening'?'true':'false');}
    if(l&&msg!=null)l.textContent=msg;
  }
  ctl.stop=function(){
    ctl.listening=false;done=true;
    if(rec){try{rec.abort();}catch(e){}rec=null;}
    ui('idle');
  };
  function finish(state,msg){if(done)return;done=true;ctl.listening=false;rec=null;if(active===ctl)active=null;ui(state,msg);}
  function onResult(alts){
    const count=o.getOptions?o.getOptions():4, type=o.getType?o.getType():'mc';
    let r=parse(alts,{count,type});
    if(r&&r.kind==='submit'&&!o.submit)r=null;
    if(!r){
      const heard=(alts[0]||'').trim().slice(0,24);
      const guide=type==='ox'?"'O' 또는 'X'로 말해 주세요.":`1~${count}번 중에서 말해 주세요.`;
      finish('error',heard?`'${heard}'로 들었습니다. ${guide}`:'소리가 들리지 않았습니다. 다시 눌러 말해 주세요.');
      return;
    }
    finish('heard');
    try{if(r.kind==='submit')o.submit();else o.select(r);}catch(e){}
    ui('heard',describe(r));  // select가 카드를 다시 그렸더라도 새 요소에 상태를 적는다
  }
  ctl.toggle=function(){
    if(ctl.listening){ctl.stop();return;}
    stopListening();cancelSpeak();
    const Ctor=SR();
    try{rec=new Ctor();}catch(e){ui('error','음성 인식을 시작할 수 없습니다.');return;}
    done=false;ctl.listening=true;active=ctl;
    rec.lang=lang;rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=5;
    rec.onresult=ev=>{
      const res=ev.results&&ev.results[0], alts=[];
      if(res)for(let i=0;i<res.length;i++)alts.push(res[i].transcript);
      onResult(alts);
    };
    rec.onerror=ev=>{
      if(ev.error==='aborted')return;
      finish('error',ERR[ev.error]||'음성 인식에 실패했습니다. 다시 눌러 주세요.');
    };
    rec.onend=()=>{if(!done)finish('error',ERR['no-speech']);};
    ui('listening','듣는 중…');
    try{rec.start();}catch(e){finish('error','음성 인식을 시작할 수 없습니다. 잠시 뒤 다시 눌러 주세요.');}
  };
  if(o.bind!==false&&b0)b0.addEventListener('click',ctl.toggle);
  return ctl;
}

/* ── 읽어 주기 ────────────────────────────── */
function pickVoice(lang){
  try{
    const vs=speechSynthesis.getVoices();
    return vs.find(v=>v.lang===lang)||vs.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang.slice(0,2).toLowerCase()))||null;
  }catch(e){return null;}
}
function speak(text,lang){
  if(!canSpeak()||!text)return false;
  lang=lang||'ko-KR';
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text));
    u.lang=lang;const v=pickVoice(lang);if(v)u.voice=v;
    speechSynthesis.speak(u);return true;
  }catch(e){return false;}
}
function cancelSpeak(){if(canSpeak()){try{speechSynthesis.cancel();}catch(e){}}}
function isSpeaking(){try{return canSpeak()&&speechSynthesis.speaking;}catch(e){return false;}}

const API={supported,canSpeak,parse,attach,speak,cancelSpeak,isSpeaking,stopListening};
if(hasWin)root.QBVoice=API;
if(typeof module!=='undefined'&&module.exports)module.exports=API;
})(typeof window!=='undefined'?window:globalThis);
</script>
<script>
(()=>{
'use strict';
const BANK={"id":"ov-runtime","code":"RT","title":"OpenVINO 심화와 비전 AI 프로젝트","subtitle":"추론 파이프라인·전후처리 · 디바이스 최적화·INT8 · 물류 자동 계수","course":"06 · 인텔 Physical AI · OpenVINO","source":"06-ai-openVino/OpenVINO_런타임활용.pdf","salt":"ov-runtime","version":1,"updated":"2026-10-15","tabs":[{"id":"t1","title":"추론 파이프라인과 Core","ref":"1-1 · p.4–16","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"OpenVINO 추론 파이프라인 4단계 중, 특정 디바이스에 맞춰 실행 가능한 형태로 바꾸는 단계는?","o":["컴파일 (compile_model)","모델 읽기 (read_model)","추론 (infer)","후처리 (postprocess)"],"a":0,"h":"OpenVINO 추론은 모델 읽기 → ? → 추론 → 후처리의 4단계로 진행됩니다. 읽기 단계의 ov.Model은 디바이스와 무관하므로, 그다음 단계에서 CPU/GPU/NPU 중 하나를 지정해 디바이스별 최적화를 거쳐야 실행할 수 있습니다. 자료는 이 단계를 '비용이 큰 단계'라고 설명합니다.","w":"compile_model이 ov.Model을 특정 디바이스용으로 최적화·컴파일합니다. read_model은 디바이스와 무관하게 파일을 읽기만 합니다.","an":"1-1 · 개요 p.4–5","src":"모델 읽기 (read_model)\nIR/ONNX 파일을 디바이스와 무관한 ov.Model 객체로 불러옵니다.\n컴파일 (compile_model)\n특정 디바이스(CPU/GPU/NPU)에 맞춰 실행 가능한 형태로 변환합니다."},{"id":"t1-02","ty":"mc","lv":2,"game":true,"p":"<code>core.read_model()<\/code> 직후의 ov.Model 객체에 대한 설명으로 옳은 것은?","o":["바로 GPU에서 추론할 수 있다","아직 어떤 디바이스에서도 실행할 수 없다","컴파일 캐시가 자동 저장된다","가중치 없이 구조만 읽는다"],"a":1,"h":"<code>read_model<\/code>은 IR/ONNX 파일을 파싱해 디바이스와 무관한 ov.Model 객체를 만드는 단계입니다. 자료의 NOTE는 컴파일 전까지 이 객체가 순수한 그래프 구조일 뿐이라고 강조합니다. 실제 추론은 <code>compile_model<\/code>이 돌려주는 CompiledModel로만 실행됩니다.","w":"read_model 단계는 디바이스 독립적인 순수 그래프 구조일 뿐이라 컴파일 전까지 실행할 수 없습니다.","an":"1-1 · CORE p.6–7","src":"NOTE read_model 단계에서는 아직 어떤 디바이스에서도 실행할 수 없습니다. 컴파일 전까지는 순수한 그래프 구조일 뿐입니다."},{"id":"t1-03","ty":"mc","lv":1,"game":true,"p":"IR 모델 파일 중 학습된 가중치와 편향 값을 담은 파일은?","o":[".xml",".mapping",".bin",".onnx"],"a":2,"h":"IR 모델은 확장자가 다른 여러 파일로 나뉩니다. .xml은 레이어와 연결 관계 같은 네트워크 구조를 담고, .mapping은 원본 프레임워크와 IR의 텐서 이름을 연결합니다. 학습된 숫자 값(weight·bias)은 사람이 읽을 수 없는 바이너리 형식 파일에 따로 저장됩니다.","w":".bin은 가중치·편향을 담은 바이너리, .xml은 네트워크 구조, .mapping은 원본 프레임워크 텐서 이름과의 매핑입니다.","an":"1-1 · 파일구조 p.9","src":".xml 모델의 네트워크 구조(레이어, 연결 관계)를 담은 파일입니다.\n.bin 학습된 가중치(weight)와 편향(bias) 값을 담은 바이너리 파일입니다."},{"id":"t1-04","ty":"mc","lv":2,"game":true,"p":"웹캠·배치처럼 반복 추론이 많을 때 더 효율적인 추론 방식은?","o":["Callable 방식","매 프레임 compile_model","read_model 재호출","InferRequest 방식"],"a":3,"h":"추론 방법은 두 가지입니다. <code>compiled_model(inputs)<\/code>처럼 함수처럼 바로 호출하는 방식은 코드가 짧지만 반복 호출이 많으면 약간의 오버헤드가 있습니다. 반면 요청 객체를 한 번 만들어 계속 재사용하는 방식은 웹캠·배치 같은 반복 추론에 더 효율적이고 비동기로 확장하기도 쉽습니다.","w":"create_infer_request()로 만든 InferRequest를 재사용하면 반복 추론에 효율적이고 start_async로 비동기 확장도 쉽습니다. Callable은 짧은 스크립트에 적합합니다.","an":"1-1 · 추론실행 p.10–12","src":"InferRequest 방식\n— create_infer_request()로 요청 객체를 만들어 재사용합니다.\n— 반복 추론(웹캠, 배치)에 더 효율적입니다.\n— 비동기 추론(start_async)으로 확장하기 쉽습니다."},{"id":"t1-05","ty":"mc","lv":2,"game":false,"p":"컴파일 결과를 디스크에 캐싱하도록 설정하는 코드는?","o":["core.set_property({\"CACHE_DIR\": ...})","core.get_property(\"CACHE\")","model.save_cache()","ov.cache_on()"],"a":0,"h":"Core 객체에는 캐시 경로 같은 전역 설정 값을 지정하는 메서드가 있습니다. 여기에 'CACHE_DIR' 키와 저장할 폴더 경로를 딕셔너리로 넘긴 뒤 <code>compile_model<\/code>을 호출하면, 다음 실행부터 디스크의 캐시를 재사용해 컴파일 시간이 크게 줄어듭니다.","w":"core.set_property({\"CACHE_DIR\": \"./model_cache\"})로 캐시 경로를 지정하면 다음 실행부터 컴파일 결과를 재사용합니다.","an":"1-1 · 캐싱 p.14","src":"core.set_property({\"CACHE_DIR\": \"./model_cache\"})\ncompiled_model = core.compile_model(model=model, device_name=\"GPU\")\n# 다음 실행부터는 캐시를 재사용해 컴파일 시간이 크게 줄어듭니다"},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"GPU·NPU는 컴파일에 시간이 걸리므로 캐싱을 켜두면 앱 시작 속도가 크게 개선된다.","a":true,"h":"캐싱이 없으면 앱을 실행할 때마다 컴파일을 새로 하며, GPU/NPU는 커널 최적화 때문에 이 과정이 수 초씩 걸릴 수 있습니다. 캐싱을 켜면 최초 1회만 컴파일하고 이후에는 디스크의 결과를 불러오기만 합니다. 웹캠 앱처럼 빠른 시작이 중요한 경우를 생각해 보세요.","w":"맞습니다. 캐싱 없이 실행하면 GPU/NPU는 매번 수 초씩 컴파일하므로, 캐시를 쓰면 최초 1회만 컴파일합니다.","an":"1-1 · 캐싱 p.14–15","src":"NOTE 특히 GPU· NPU는 컴파일(커널 최적화)에 시간이 걸리므로, 캐싱을 켜두면 애플리케이션 시작 속도가 크게 개선됩니다."},{"id":"t1-07","ty":"ox","lv":2,"game":true,"p":"한 번 만든 컴파일 캐시는 모델·디바이스 조합이 바뀌어도 그대로 재사용된다.","a":false,"h":"캐싱을 쓰면 최초 1회만 컴파일해 결과를 디스크에 저장하고, 이후 실행은 그 캐시를 불러오기만 합니다. 하지만 컴파일 결과는 특정 모델을 특정 디바이스에 맞게 최적화한 것이므로, 그 조합이 달라지면 캐시도 새로 만들어야 합니다.","w":"틀렸습니다. 모델·디바이스 조합이 바뀌면 캐시도 새로 생성됩니다.","an":"1-1 · 캐싱 p.15","src":"캐싱 사용 시\n— 최초 1회만 컴파일하고 결과를 디스크에 저장합니다.\n— 이후 실행은 캐시를 불러오기만 하면 됩니다.\n— 모델·디바이스 조합이 바뀌면 캐시도 새로 생성됩니다."},{"id":"t1-08","ty":"match","lv":2,"game":false,"p":"Core 객체의 메서드와 역할을 연결하세요.","pairs":[["core.read_model()","모델 파일을 ov.Model로 읽기"],["core.compile_model()","특정 디바이스용으로 컴파일"],["core.available_devices","사용 가능한 디바이스 목록"],["core.get_property()","디바이스·모델 속성 값 조회"]],"h":"Core 객체의 메서드는 이름이 역할을 그대로 드러냅니다. read는 파일을 ov.Model로 읽고, compile은 특정 디바이스용으로 컴파일하며, available_devices는 현재 시스템에서 쓸 수 있는 디바이스 목록을 돌려줍니다. get_property는 디바이스나 컴파일된 모델의 속성 값을 조회할 때 씁니다.","w":"read_model은 읽기, compile_model은 컴파일, available_devices는 디바이스 목록, get_property는 속성 조회, set_property는 캐시 경로 등 설정입니다.","an":"1-1 · CORE API p.13","src":"core.read_model() 모델 파일을 ov.Model로 읽어옵니다.\ncore.compile_model() 모델을 특정 디바이스용으로 컴파일합니다.\ncore.available_devices 현재 시스템에서 사용 가능한 디바이스 목록을 반환합니다.\ncore.get_property() 디바이스나 컴파일된 모델의 속성 값을 조회합니다."},{"id":"t1-09","ty":"order","lv":1,"game":false,"p":"OpenVINO 추론 파이프라인 4단계를 순서대로 정렬하세요.","steps":["모델 읽기 (read_model)","컴파일 (compile_model)","추론 (infer)","후처리 (postprocess)"],"h":"파이프라인은 파일을 디바이스와 무관한 ov.Model로 불러오는 데서 시작합니다. 그다음 특정 디바이스에 맞게 변환하고, 전처리된 입력을 넣어 raw 결과 텐서를 얻습니다. 마지막으로 raw 텐서를 클래스·박스처럼 사람이 이해할 수 있는 결과로 바꿉니다.","w":"어떤 모델이든 읽기 → 컴파일 → 추론 → 후처리의 같은 틀로 다룹니다.","an":"1-1 · 개요 p.4","src":"모델 읽기 (read_model)\nIR/ONNX 파일을 디바이스와 무관한 ov.Model 객체로 불러옵니다.\n컴파일 (compile_model)\n특정 디바이스(CPU/GPU/NPU)에 맞춰 실행 가능한 형태로 변환합니다.\n추론 (infer)\n전처리된 입력을 넣고 결과 텐서를 얻습니다.\n후처리 (postprocess)\nraw 출력 텐서를 사람이 이해할 수 있는 결과(클래스, 박스 등)로 바꿉니다."},{"id":"t1-10","ty":"multi","lv":2,"game":true,"p":"InferRequest 방식의 특징을 <b>모두<\/b> 고르세요.","o":["요청 객체를 만들어 재사용한다","반복 추론에 효율적이다","start_async로 비동기 확장이 쉽다","디바이스 지정 없이 실행된다","코드가 가장 짧다"],"a":[0,1,2],"h":"<code>create_infer_request()<\/code>로 만든 요청 객체는 한 번 만들어 두고 계속 다시 쓰는 방식입니다. 자료는 이 방식이 웹캠·배치처럼 반복 추론이 많은 상황에 효율적이고, <code>start_async<\/code>를 이용한 비동기 추론으로 확장하기 쉽다고 설명합니다. 코드가 가장 짧은 것은 callable 방식의 특징입니다.","w":"InferRequest는 재사용·반복 추론 효율·비동기 확장이 장점입니다. 코드가 짧은 것은 Callable 방식의 장점이고, 디바이스는 컴파일 때 정해집니다.","an":"1-1 · 추론실행 p.10","src":"InferRequest 방식\n— create_infer_request()로 요청 객체를 만들어 재사용합니다.\n— 반복 추론(웹캠, 배치)에 더 효율적입니다.\n— 비동기 추론(start_async)으로 확장하기 쉽습니다."}]},{"id":"t2","title":"입력 전처리와 PrePostProcessor","ref":"1-2 · p.17–25","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"OpenCV로 읽은 이미지의 기본 채널 순서는?","o":["RGB","BGR","CHW","NCHW"],"a":1,"h":"원본 이미지와 모델 입력은 크기·채널 순서·값 범위·차원 순서가 다를 수 있습니다. 자료에 따르면 대부분의 모델은 RGB 순서로 학습되지만, OpenCV는 이와 반대 순서로 이미지를 읽습니다. 그래서 수동 전처리 코드는 <code>cv2.cvtColor<\/code>로 순서를 뒤집습니다.","w":"OpenCV는 BGR, 대부분의 모델은 RGB 기준이라 cv2.COLOR_BGR2RGB 변환이 필요합니다.","an":"1-2 · 개요 p.17","src":"채널 순서\nOpenCV는 BGR, 대부분의 모델은 RGB를 기준으로 학습됩니다."},{"id":"t2-02","ty":"mc","lv":2,"game":true,"p":"배치·채널·높이·너비 순서이며 YOLO 등 PyTorch 계열 모델의 기본 레이아웃은?","o":["NHWC","HWC","NCHW","CHWN"],"a":2,"h":"레이아웃 이름의 글자는 N=배치, C=채널, H=높이, W=너비를 뜻합니다. OpenCV 이미지와 TensorFlow 계열은 채널이 맨 뒤에 오는 형태를 쓰고, PyTorch 계열(YOLO 포함)은 채널이 배치 바로 뒤에 오는 형태를 씁니다. OpenVINO의 많은 모델도 후자를 기대합니다.","w":"NCHW는 PyTorch 계열(YOLO 포함)의 기본이고, NHWC는 OpenCV 이미지·TensorFlow 계열에서 흔합니다.","an":"1-2 · 레이아웃 p.18","src":"NCHW\n— 배치, 채널, 높이, 너비 순서입니다.\n— PyTorch 계열 모델(YOLO 포함)의 기본 형태입니다."},{"id":"t2-03","ty":"mc","lv":2,"game":true,"p":"수동 전처리 코드에서 <code>resized.transpose(2, 0, 1)<\/code>이 하는 일은?","o":["BGR → RGB 변환","배치 차원 추가","0~1 정규화","HWC → CHW 변환"],"a":3,"h":"OpenCV로 읽은 이미지는 (높이, 너비, 채널) 순서라 축 번호가 H=0, W=1, C=2입니다. <code>transpose(2, 0, 1)<\/code>은 2번 축(채널)을 맨 앞으로 보내고 그 뒤에 0번·1번 축을 놓아 축을 다시 배열합니다. 결과로 어떤 차원 순서가 되는지 생각해 보세요.","w":"transpose(2,0,1)은 (H,W,C)를 (C,H,W)로 바꿉니다. 배치 차원은 np.expand_dims, 정규화는 /255.0이 담당합니다.","an":"1-2 · 수동전처리 p.19","src":"resized = cv2.resize(image, (640, 640)) # 모델 입력 크기로\nchw = resized.transpose(2, 0, 1) # HWC -> CHW"},{"id":"t2-04","ty":"mc","lv":2,"game":true,"p":"PrePostProcessor(PPP)가 수동 전처리보다 빠를 수 있는 이유는?","o":["전처리를 그래프에 넣어 디바이스에서 실행","코드가 더 짧아서","이미지를 압축해서","CPU만 사용해서"],"a":0,"h":"수동 전처리(NumPy/OpenCV)는 CPU에서 실행되어 디바이스 자원을 활용하지 못하고, 전처리량이 많으면 병목이 됩니다. PPP는 전처리 단계를 모델 그래프 안에 포함시키므로, 추론과 같은 장소에서 함께 실행된다는 점이 핵심입니다.","w":"PPP는 전처리 단계를 모델 그래프 안에 포함시켜 실제 추론 디바이스에서 함께 실행합니다. 수동 전처리는 CPU에서 돌아 병목이 될 수 있습니다.","an":"1-2 · 비교 p.20","src":"PrePostProcessor (PPP)\n— 전처리 단계를 모델 그래프 안에 포함시킵니다.\n— 실제 추론 디바이스에서 함께 실행되어 더 빠릅니다.\n— 코드는 조금 더 길지만 한 번 설정하면 재사용이 쉽습니다."},{"id":"t2-05","ty":"mc","lv":2,"game":false,"p":"PPP 설정을 모두 반영한 새 ov.Model을 만드는 메서드는?","o":[".input().model()",".build()",".input().preprocess()",".output().tensor()"],"a":1,"h":"PPP는 <code>.input().tensor()<\/code>로 실제 입력을, <code>.input().preprocess()<\/code>로 전처리 연산을, <code>.input().model()<\/code>로 모델의 레이아웃을 설정합니다. 이 설정들은 마지막 호출 하나로 조립되어 새로운 ov.Model이 되고, 그 모델을 <code>compile_model<\/code>에 넘깁니다.","w":".build()가 설정을 반영한 새 ov.Model을 만들고, 이 모델을 compile_model에 넘깁니다.","an":"1-2 · PPP p.22–24","src":".input().tensor() 실제로 넣을 입력 데이터의 shape·타입·레이아웃을 설명합니다.\n.input().preprocess() resize, mean/scale 등 전처리 연산을 그래프에 추가합니다.\n.input().model() 모델이 원래 기대하는 레이아웃을 지정합니다.\n.output().tensor() 출력 텐서의 타입 등을 지정합니다.\n.build() 설정을 반영한 새로운 ov.Model을 만듭니다."},{"id":"t2-06","ty":"ox","lv":2,"game":true,"p":"PPP의 mean/scale 값은 모델이 학습될 때 쓴 정규화 값과 반드시 일치해야 한다.","a":true,"h":"PPP 정규화 코드는 <code>.mean([123.675, 116.28, 103.53])<\/code>과 <code>.scale([58.395, 57.12, 57.375])<\/code>로 입력 값을 변환합니다. 모델은 학습 때 특정 정규화를 거친 입력 분포를 보고 배웠으므로, 다른 값을 쓰면 입력 분포가 학습 때와 어긋나게 됩니다.","w":"맞습니다. mean/scale이 학습 시 값과 다르면 입력 분포가 달라져 결과가 틀어집니다.","an":"1-2 · PPP p.23","src":"NOTE mean/scale 값은 모델이 학습될 때 사용된 정규화 값과 반드시 일치해야 합니다."},{"id":"t2-07","ty":"ox","lv":1,"game":true,"p":"PPP의 <code>.input().tensor()<\/code>는 모델이 원래 기대하는 레이아웃을 지정한다.","a":false,"h":"PPP 메서드는 두 쪽을 구분합니다. <code>.input().tensor()<\/code>는 실제로 우리가 넣을 입력 데이터의 shape·타입·레이아웃을 설명하고, <code>.input().model()<\/code>은 모델 쪽 레이아웃을 지정합니다. 예제에서 tensor()에는 NHWC, model()에는 NCHW가 지정된 것을 비교해 보세요.","w":"틀렸습니다. .input().tensor()는 실제로 넣을 입력의 shape·타입·레이아웃을, .input().model()이 모델이 기대하는 레이아웃을 지정합니다.","an":"1-2 · PPP p.21–24","src":".input().tensor() 실제로 넣을 입력 데이터의 shape·타입·레이아웃을 설명합니다.\n.input().preprocess() resize, mean/scale 등 전처리 연산을 그래프에 추가합니다.\n.input().model() 모델이 원래 기대하는 레이아웃을 지정합니다."},{"id":"t2-08","ty":"match","lv":2,"game":false,"p":"원본 이미지와 모델 입력이 어긋나는 유형과 그 예를 연결하세요.","pairs":[["크기 불일치","카메라 이미지 vs 224x224·640x640"],["채널 순서","OpenCV BGR vs 모델 RGB"],["값의 범위","0~255 → 0~1 또는 정규화 값"],["차원 순서","HWC 이미지 → CHW"]],"h":"자료는 원본 이미지와 모델 입력이 어긋나는 네 유형을 듭니다. 크기는 해상도 숫자(224x224, 640x640), 채널 순서는 색 순서(BGR/RGB), 값의 범위는 픽셀 값 0~255의 변환, 차원 순서는 HWC와 CHW 같은 축 배열에 관한 문제입니다.","w":"전처리는 크기·채널 순서·값 범위·차원 순서 네 가지를 모델이 원하는 형태로 맞추는 일입니다.","an":"1-2 · 개요 p.17","src":"크기 불일치\n카메라 이미지는 보통 모델이 원하는 224x224, 640x640 등과 다릅니다.\n채널 순서\nOpenCV는 BGR, 대부분의 모델은 RGB를 기준으로 학습됩니다.\n값의 범위\n픽셀 값 0~255를 모델이 원하는 0~1 또는 정규화된 값으로 바꿔야 합니다.\n차원 순서\nHWC(높이,너비,채널) 이미지를 모델이 원하는 CHW로 바꿔야 할 때가 많습니다."},{"id":"t2-09","ty":"order","lv":2,"game":false,"p":"수동 전처리 코드의 순서를 맞추세요.","steps":["cv2.imread로 이미지 읽기","BGR → RGB 변환","모델 입력 크기로 resize","HWC → CHW transpose","배치 차원 추가 + 0~1 정규화"],"h":"수동 전처리 코드는 <code>cv2.imread<\/code>로 파일을 읽은 뒤 <code>cvtColor<\/code>로 색 순서를 바꾸고, <code>cv2.resize<\/code>로 모델 입력 크기를 맞춥니다. 이어서 <code>transpose<\/code>로 축 순서를 바꾸고, 마지막 줄에서 <code>np.expand_dims<\/code>와 <code>/ 255.0<\/code>을 함께 적용합니다.","w":"manual_preprocess.py는 읽기, 색 변환, 리사이즈, transpose, expand_dims와 /255.0 순서로 진행합니다.","an":"1-2 · 수동전처리 p.19","src":"image = cv2.imread(\"photo.jpg\")\nimage = cv2.cvtColor(image, cv2.COLOR_BGR2RGB) # BGR -> RGB\nresized = cv2.resize(image, (640, 640)) # 모델 입력 크기로\nchw = resized.transpose(2, 0, 1) # HWC -> CHW\ninput_tensor = np.expand_dims(chw, 0) / 255.0 # 배치 차원 + 0~1 정규화"},{"id":"t2-10","ty":"multi","lv":3,"game":true,"p":"수동 전처리와 PPP의 결과가 다를 때 의심할 원인을 <b>모두<\/b> 고르세요.","o":["resize 보간 방식 차이","mean/scale 값 불일치","모델 파일 확장자","웹캠 장치 번호"],"a":[0,1],"h":"실습은 같은 이미지를 수동 전처리와 PPP로 각각 준비해 결과를 비교하게 합니다. 두 방식에서 이미지 크기를 바꾸는 계산 방법(보간)이나 정규화에 쓰는 숫자가 서로 다르면 결과가 달라집니다. 채널 수나 파일 이름처럼 결과와 무관한 항목은 원인이 아닙니다.","w":"실습 TIP처럼 결과가 다르면 resize 보간 방식이나 mean/scale 값이 어긋났을 가능성이 큽니다.","an":"1-2 · 실습 p.25","src":"TIP\n결과가 다르다면 resize 보간 방식이나 mean/scale 값이 서로 어긋났을 가능성이 큽니다."}]},{"id":"t3","title":"출력 후처리와 트러블슈팅","ref":"1-3 · p.26–35","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"분류 모델의 확률 벡터에서 가장 높은 값을 찾는 후처리는?","o":["NMS","박스 디코딩","argmax","keypoint 추출"],"a":2,"h":"모델의 raw 출력은 숫자 텐서일 뿐이라 사람이 이해할 수 있는 결과로 바꾸는 후처리가 필요합니다. 분류 모델은 클래스별 확률 벡터를 내놓으므로, 그중 가장 높은 값의 '위치(인덱스)'를 찾으면 예측 클래스가 됩니다. NumPy에서 최댓값의 인덱스를 돌려주는 함수를 떠올려 보세요.","w":"분류 모델은 클래스별 확률 벡터에서 argmax로 가장 높은 값을 찾습니다. NMS·박스 디코딩은 검출, keypoint는 자세 추정 후처리입니다.","an":"1-3 · 개요 p.26","src":"분류 모델\n클래스별 확률 벡터에서 가장 높은 값(argmax)을 찾습니다."},{"id":"t3-02","ty":"mc","lv":2,"game":true,"p":"SSD 계열 검출 출력에서 <code>detection[2]<\/code>가 뜻하는 값은?","o":["클래스 ID","우하단 y좌표","좌상단 x좌표","신뢰도(confidence)"],"a":3,"h":"SSD 계열 검출 출력은 한 줄에 7개 값이 있는 표 형태입니다. detection[1]은 클래스 ID, detection[3:5]와 [5:7]은 박스 좌표이고, 남은 detection[2]는 보통 0.5 이상만 사용하는 값입니다. 디코딩 코드에서 <code>if confidence > 0.5<\/code>로 걸러내는 변수를 확인해 보세요.","w":"detection[1]은 클래스 ID, detection[2]는 신뢰도, [3:5]는 좌상단, [5:7]은 우하단 좌표(0~1 정규화)입니다.","an":"1-3 · 검출후처리 p.28","src":"detection[1] 클래스 ID 검출된 객체의 클래스 번호\ndetection[2] 신뢰도(confidence) 보통 0.5 이상만 사용"},{"id":"t3-03","ty":"mc","lv":2,"game":true,"p":"SSD 출력의 0~1 좌표를 픽셀 좌표로 바꾸는 방법은?","o":["이미지 너비·높이를 곱한다","255를 곱한다","640으로 나눈다","argmax를 취한다"],"a":0,"h":"SSD 출력의 박스 좌표는 0~1로 정규화된 값입니다. 디코딩 코드는 <code>h, w = image.shape[:2]<\/code>로 이미지 크기를 얻은 뒤 <code>det[3]*w<\/code>, <code>det[4]*h<\/code>처럼 좌표마다 해당 축의 크기를 적용해 픽셀 좌표로 바꿉니다.","w":"정규화 좌표에 이미지 크기(w, h)를 곱하면 픽셀 좌표가 됩니다: xmin = int(det[3]*w).","an":"1-3 · 검출후처리 p.28–29","src":"h, w = image.shape[:2]\nfor det in detections:\nconfidence = det[2]\nif confidence > 0.5:\nxmin, ymin = int(det[3]*w), int(det[4]*h)\nxmax, ymax = int(det[5]*w), int(det[6]*h)"},{"id":"t3-04","ty":"mc","lv":3,"game":true,"p":"YOLO 계열 raw 출력 후처리로 강의가 권하는 방법은?","o":["직접 NMS를 구현한다","Ultralytics 내장 후처리를 쓴다","SSD 디코딩을 그대로 쓴다","후처리를 생략한다"],"a":1,"h":"YOLO 계열은 SSD와 달리 앵커 기반 raw 출력을 직접 디코딩하고 NMS까지 해야 합니다. 자료는 Ultralytics로 내보낸 모델이 자체 Results 객체로 이 과정을 대신 처리해 주므로, 직접 구현하기보다 그 기능을 활용하는 편이 안전하다고 권합니다.","w":"YOLO 계열은 앵커 기반 출력 디코딩과 NMS가 필요하므로, 직접 구현보다 Ultralytics 내장 후처리를 쓰는 것이 안전합니다.","an":"1-3 · YOLO p.31","src":"YOLO 계열\n— 앵커 기반 raw 출력을 직접 디코딩하고 NMS까지 해야 합니다.\n— Ultralytics로 내보낸 모델은 자체 Results 객체로 이 과정을 대신 처리\n해줍니다.\n— 직접 구현하기보다 Ultralytics의 내장 후처리를 활용하는 것이 안전"},{"id":"t3-05","ty":"mc","lv":2,"game":true,"p":"GPU 드라이버가 없는데 GPU를 지정했을 때 만나는 오류는?","o":["shape mismatch","파일 경로 오류","device not found","레이아웃 불일치"],"a":2,"h":"트러블슈팅 표는 GPU/NPU 드라이버가 설치되지 않았는데 해당 디바이스를 지정하면 실패한다고 설명합니다. 이때의 오류 이름은 지정한 디바이스를 시스템에서 '찾지 못했다'는 뜻입니다. GPU 벤치마크 코드의 주석에도 iGPU가 없을 때 같은 오류가 난다고 적혀 있습니다.","w":"GPU/NPU 드라이버 없이 해당 디바이스를 지정하면 device not found로 실패합니다.","an":"1-1~1-3 · 트러블슈팅 p.33","src":"device not found GPU/NPU 드라이버가 설치되지 않았는데 해당 디바이스를 지정하면 실패합니다."},{"id":"t3-06","ty":"ox","lv":1,"game":true,"p":".xml 파일과 같은 폴더에 .bin 파일이 없으면 모델 로딩에 실패한다.","a":true,"h":"IR 모델은 네트워크 구조를 담은 .xml과 학습된 가중치를 담은 .bin이 짝을 이룹니다. 트러블슈팅 표의 '파일 경로 오류' 항목은 .xml 파일 경로와 .bin 파일의 위치 관계가 맞지 않을 때 무엇이 일어나는지 설명합니다.","w":"맞습니다. 자주 만나는 로딩 오류인 '파일 경로 오류'입니다.","an":"1-1~1-3 · 트러블슈팅 p.33","src":"파일 경로 오류 .xml 파일 경로에 .bin 파일이 같은 폴더에 없으면 로딩에 실패합니다."},{"id":"t3-07","ty":"ox","lv":2,"game":true,"p":"검출 신뢰도 기준을 아주 낮게 잡을수록 놓치는 객체도, 오검출도 함께 줄어든다.","a":false,"h":"실습 TIP은 신뢰도 기준을 너무 낮게 잡으면 오검출이 늘고, 너무 높게 잡으면 실제 객체를 놓칠 수 있다고 설명합니다. 두 오류는 기준값을 한쪽으로 옮길 때 서로 반대로 움직이므로 0.5~0.7 사이에서 조절하라고 권합니다.","w":"틀렸습니다. 너무 낮으면 오검출이 늘고, 너무 높으면 실제 객체를 놓칩니다. 0.5~0.7 사이에서 조절합니다.","an":"1-3 · 실습 p.32","src":"TIP\n신뢰도 기준을 너무 낮게 잡으면 오검출이 늘고, 너무 높게 잡으면 실제 객체를 놓칠 수 있습니다. 0.5~0.7 사이에서 조절해보세요."},{"id":"t3-08","ty":"match","lv":2,"game":false,"p":"모델 종류와 출력 후처리 방식을 연결하세요.","pairs":[["분류 모델","확률 벡터에서 argmax"],["SSD 계열 검출","[박스·클래스·신뢰도] 표 해석"],["YOLO 계열 검출","앵커 디코딩 + NMS"],["자세 추정","관절별 좌표·신뢰도 추출"]],"h":"후처리 방식은 모델 종류마다 다릅니다. 분류는 확률 벡터에서 최댓값 위치를 찾고, SSD는 이미 [박스, 클래스, 신뢰도] 표로 나온 출력을 해석합니다. YOLO는 앵커 기반 출력을 디코딩한 뒤 중복 박스를 제거해야 하고, 자세 추정은 관절별 좌표와 신뢰도를 꺼냅니다.","w":"후처리는 모델 종류마다 방식이 다르며, 같은 검출이라도 SSD와 YOLO가 다릅니다.","an":"1-3 · 개요 p.26","src":"분류 모델\n클래스별 확률 벡터에서 가장 높은 값(argmax)을 찾습니다.\n검출 모델 (SSD계열)\n[박스 좌표, 클래스, 신뢰도]로 구성된 표 형태 출력을 해석합니다.\n검출 모델 (YOLO계열)\n앵커 기반 출력을 디코딩하고 NMS로 중복 박스를 제거합니다.\n자세 추정 모델\n관절(keypoint)별 좌표와 신뢰도를 추출합니다."},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"1장 정리에서 제시한 전체 파이프라인 다섯 단계를 순서대로 정렬하세요.","steps":["읽기","전처리","컴파일","추론","후처리"],"h":"1장 정리 페이지는 분류·검출·자세추정 어디서나 똑같이 반복되는 다섯 단계를 제시합니다. 파일을 읽은 뒤 입력을 모델이 원하는 형태로 바꾸는 단계가 컴파일보다 앞에 놓이고, 컴파일 뒤에는 추론과 결과 해석이 이어집니다.","w":"1장 정리는 읽기 → 전처리 → 컴파일 → 추론 → 후처리의 다섯 단계가 모든 태스크에서 반복된다고 정리합니다.","an":"1-1~1-3 · 정리 p.34","src":"읽기 → 전처리 → 컴파일 → 추론 → 후처리. 이 다\n섯 단계는 분류든 검출이든 자세추정이든 항상 동\n일하게 반복됩니다."},{"id":"t3-10","ty":"multi","lv":2,"game":true,"p":"1장 핵심 API 요약에 포함된 항목을 <b>모두<\/b> 고르세요.","o":["CACHE_DIR","PrePostProcessor","argmax / SSD 디코딩 / NMS","nncf.quantize","cv2.VideoCapture"],"a":[0,1,2],"h":"1장 요약 표는 모델 로딩·추론뿐 아니라 컴파일 결과 캐싱, 전처리를 그래프에 넣는 도구, 모델 종류별 출력 후처리까지 정리합니다. 디바이스 우선순위 지정이나 양자화처럼 3장에서 다루는 내용은 1장 요약에 들어 있지 않습니다.","w":"1장 요약은 read/compile, callable/InferRequest, CACHE_DIR, PPP, 후처리 방식입니다. nncf는 3장, VideoCapture는 2장입니다.","an":"1-1~1-3 · 요약 p.35","src":"core.read_model / compile_model 모델을 읽고 디바이스에 맞게 컴파일합니다.\ncompiled_model(x) / InferRequest 추론을 실행하는 두 가지 방식입니다.\nCACHE_DIR 컴파일 결과를 캐싱해 재시작 속도를 높입니다.\nPrePostProcessor 전처리를 모델 그래프에 포함시켜 디바이스에서 실행합니다.\nargmax / SSD 디코딩 / NMS 모델 종류별 출력 후처리 방식입니다."}]},{"id":"t4","title":"분류·검출·자세 추정 모델","ref":"2-1~2-3 · p.36–53","qs":[{"id":"t4-01","ty":"mc","lv":2,"game":true,"p":"이 강의가 Open Model Zoo 대신 사전학습 모델로 쓰는 것은?","o":["ONNX Model Zoo","TensorFlow Hub","Open Model Zoo 최신판","Ultralytics YOLO26"],"a":3,"h":"Open Model Zoo는 과거 OpenVINO의 사전학습 모델 저장소였지만 지금은 유지보수 모드로 전환되어 새 모델이 추가되지 않습니다. 강의는 그 대신 2026년 1월 발표된 최신 플래그십 모델을 쓰며, 이 모델은 분류·검출·자세추정을 모두 지원하고 export 한 줄로 IR 변환이 됩니다.","w":"Open Model Zoo는 유지보수 모드라 새 모델이 추가되지 않으므로, 분류·검출·자세추정을 모두 지원하는 Ultralytics YOLO26을 사용합니다.","an":"2-1 · 모델 출처 p.37","src":"Open Model Zoo\n— 과거 OpenVINO의 사전학습 모델 저장소였습니다.\n— 현재는 유지보수 모드로 전환되어 새 모델이 추가되지 않습니다.\n— 기존 예제 코드에 남아있지만 신규 프로젝트에는 권장되지 않습니\n다.\nUltralytics YOLO26\n— 2026년 1월 발표된 최신 플래그십 모델로 분류·검출·자세추정을 모\n두 지원합니다.\n— `model.export(format=\"openvino\")` 한 줄로 OpenVINO IR 변환이 가능\n합니다.\n— 이 강의에서는 YOLO26을 기준으로 실습합니다."},{"id":"t4-02","ty":"mc","lv":2,"game":false,"p":"Ultralytics 모델을 OpenVINO IR로 내보내는 코드는?","o":["model.export(format=\"openvino\")","ov.convert(model)","model.save(\"ir\")","core.read_model(model)"],"a":0,"h":"Ultralytics 모델 객체에는 다른 형식으로 내보내는 메서드가 있고, 원하는 형식은 format 인자로 지정합니다. 실행하면 <code>yolo26n-cls_openvino_model/<\/code>처럼 '_openvino_model'이 붙은 폴더가 생성됩니다.","w":"model.export(format=\"openvino\")를 실행하면 ..._openvino_model/ 폴더가 생성됩니다.","an":"2-1 · 분류모델 p.38","src":"from ultralytics import YOLO\nmodel = YOLO(\"yolo26n-cls.pt\")\nmodel.export(format=\"openvino\", half=True)\n# 실행 후 yolo26n-cls_openvino_model/ 폴더가 생성됩니다"},{"id":"t4-03","ty":"mc","lv":2,"game":true,"p":"export 할 때 <code>half=True<\/code>의 효과는?","o":["INT8 양자화","FP16으로 내보내 크기·속도 개선","입력 해상도 절반","배치 크기 절반"],"a":1,"h":"half는 half precision, 즉 16비트 부동소수점을 뜻합니다. export에 <code>half=True<\/code>를 넘기면 32비트보다 낮은 정밀도로 모델을 내보내게 되며, 자료의 NOTE는 이것이 파일 크기와 속도 두 가지에 어떤 영향을 주는지 설명합니다.","w":"half=True는 FP16으로 내보내 파일 크기와 속도를 함께 개선합니다.","an":"2-1 · 분류모델 p.38","src":"NOTE half=True는 FP16으로 내보내 파일 크기와 속도를 함께 개선합니다."},{"id":"t4-04","ty":"mc","lv":1,"game":true,"p":"분류 결과에서 1위 클래스의 신뢰도를 담은 필드는?","o":["probs.top1","probs.top5","probs.top1conf","probs.top5conf"],"a":2,"h":"분류 결과의 probs 객체는 top1/top5와 각각의 신뢰도 필드를 제공합니다. <code>top1<\/code>은 가장 확률이 높은 클래스의 인덱스, <code>top5<\/code>는 상위 5개 인덱스 리스트입니다. 신뢰도(confidence)는 필드 이름 끝에 'conf'가 붙습니다.","w":"top1은 1위 클래스 인덱스, top1conf는 1위 신뢰도, top5·top5conf는 상위 5개의 인덱스·신뢰도입니다.","an":"2-1 · 결과해석 p.40","src":"probs.top1 가장 확률이 높은 클래스 인덱스\nprobs.top1conf 1위 클래스의 신뢰도(확률)\nprobs.top5 상위 5개 클래스 인덱스 리스트\nprobs.top5conf 상위 5개 클래스 신뢰도 리스트"},{"id":"t4-05","ty":"num","lv":1,"game":false,"p":"COCO 기준 자세 추정 모델이 사람마다 찾는 관절(keypoint)은 몇 개인가요?","a":17,"unit":"개","h":"COCO 기준 keypoint 인덱스는 0번 코부터 시작해 마지막 16번 발목(우)까지 이어집니다. 계산식은 코 1 + 눈 2 + 귀 2 + 어깨 2 + 팔꿈치 2 + 손목 2 + 엉덩이 2 + 무릎 2 + 발목 2이며, 인덱스가 0부터 시작하므로 '마지막 인덱스 + 1'로도 같은 값을 얻습니다.","w":"코·눈·귀·어깨·팔꿈치·손목·엉덩이·무릎·발목으로 모두 17개입니다. keypoints.xy의 shape은 (사람 수, 17, 2)입니다.","an":"2-3 · 개요·KEYPOINT p.48·51","src":"인덱스 부위 인덱스 부위\n0 코 9 왼쪽 손목\n1~2 눈(좌/우) 10 오른쪽 손목\n3~4 귀(좌/우) 11~12 엉덩이(좌/우)\n5~6 어깨(좌/우) 13~14 무릎(좌/우)\n7~8 팔꿈치(좌/우) 15~16 발목(좌/우)"},{"id":"t4-06","ty":"ox","lv":1,"game":true,"p":"Ultralytics 검출 결과에서는 NMS까지 내부에서 자동으로 처리된다.","a":true,"h":"검출 모델의 결과는 박스 좌표(xyxy), 클래스, 신뢰도의 리스트입니다. YOLO 계열은 원래 앵커 디코딩과 중복 박스 제거(NMS)가 필요하지만, 2-2 개요의 '후처리' 항목은 Ultralytics가 이 과정을 어디에서 처리하는지 알려 줍니다.","w":"맞습니다. 검출 결과는 Ultralytics 내부에서 NMS까지 처리되어 박스·클래스·신뢰도 리스트로 나옵니다.","an":"2-2 · 개요 p.42","src":"출력\n박스 좌표(xyxy), 클래스, 신뢰도의 리스트.\n후처리\nUltralytics 내부에서 NMS까지 자동으로 처리됩니다."},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"<code>box.xyxy<\/code>는 중심점·너비·높이를 0~1로 정규화한 좌표다.","a":false,"h":"boxes 객체의 좌표 필드는 이름으로 형식을 구분합니다. xyxy는 (x1, y1, x2, y2), 즉 좌상단과 우하단 좌표를 픽셀 단위로 담습니다. 이름 끝의 'n'은 normalized(0~1 정규화), 'wh'는 너비·높이를 뜻하므로 문장이 설명하는 필드가 어느 쪽인지 비교해 보세요.","w":"틀렸습니다. xyxy는 (x1,y1,x2,y2) 픽셀 좌표이고, 정규화된 중심점·너비·높이는 box.xywhn입니다.","an":"2-2 · 결과필드 p.46","src":"box.xyxy (x1, y1, x2, y2) 형태의 박스 좌표(픽셀 단위).\nbox.xywhn 중심점·너비·높이를 0~1로 정규화한 좌표."},{"id":"t4-08","ty":"match","lv":2,"game":false,"p":"비전 태스크와 대표 활용을 연결하세요.","pairs":[["분류 (yolo26n-cls)","이미지 태깅"],["검출 (yolo26n)","물류 계수, 보안"],["자세 추정 (yolo26n-pose)","동작 인식, 낙상 감지"]],"h":"세 모델 비교표에서 분류는 클래스 확률, 검출은 박스+클래스+신뢰도, 자세추정은 keypoint 좌표를 출력합니다. 이미지 전체에 라벨을 붙이는 일, 물건 개수를 세는 일, 사람의 관절 움직임을 보는 일 중 각 출력이 어디에 쓰일지 연결해 보세요.","w":"분류는 클래스 확률, 검출은 박스+클래스+신뢰도, 자세 추정은 keypoint 좌표를 출력합니다.","an":"2-1~2-3 · 비교 p.53","src":"구분 분류 검출 자세추정\n출력 클래스 확률 박스+클래스+신뢰도 keypoint 좌표\n모델 예시 yolo26n-cls yolo26n yolo26n-pose\n대표 활용 이미지 태깅 물류 계수, 보안 동작 인식, 낙상 감지"},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"Ultralytics 모델을 OpenVINO로 실행하는 순서를 맞추세요.","steps":["YOLO(\"yolo26n.pt\")로 모델 불러오기","export(format=\"openvino\")로 IR 내보내기","YOLO(\"yolo26n_openvino_model/\")로 다시 불러오기","이미지로 추론해 results 받기","result.plot()으로 시각화"],"h":"먼저 <code>YOLO(\"yolo26n.pt\")<\/code>로 PyTorch 모델을 불러와 <code>export(format=\"openvino\")<\/code>로 IR 폴더를 만듭니다. 그다음 생성된 <code>yolo26n_openvino_model/<\/code> 폴더를 다시 YOLO()로 불러와 이미지 추론을 하고, 결과는 <code>result.plot()<\/code>으로 이미지에 그립니다.","w":"pt 모델을 IR로 내보낸 뒤 IR 폴더를 다시 YOLO로 불러와 추론하고 result.plot()으로 결과를 그립니다.","an":"2-2 · 검출모델·시각화 p.43–45","src":"model.export(format=\"openvino\") Ultralytics 모델을 OpenVINO IR로 변환합니다.\nYOLO(\"...openvino_model/\") 변환된 IR 모델을 다시 불러와 추론에 사용합니다.\nresult.plot() 검출·분류·자세추정 결과를 이미지에 시각화합니다."},{"id":"t4-10","ty":"multi","lv":2,"game":true,"p":"검출 결과 boxes 객체에서 제공하는 필드를 <b>모두<\/b> 고르세요.","o":["box.xyxy","box.xywhn","box.cls","box.conf","box.top5"],"a":[0,1,2,3],"h":"검출 결과 boxes 객체는 좌표를 픽셀 단위(x1, y1, x2, y2)와 0~1 정규화(중심점·너비·높이) 두 형식으로 제공하고, 클래스 인덱스와 검출 신뢰도도 담습니다. top5처럼 'top'으로 시작하는 필드는 분류 결과(probs)에 속합니다.","w":"boxes에는 xyxy·xywhn·cls·conf가 있습니다. top5는 분류 결과 probs의 필드입니다.","an":"2-2 · 결과필드 p.46","src":"box.xyxy (x1, y1, x2, y2) 형태의 박스 좌표(픽셀 단위).\nbox.xywhn 중심점·너비·높이를 0~1로 정규화한 좌표.\nbox.cls 검출된 객체의 클래스 인덱스.\nbox.conf 검출 신뢰도(0~1)."}]},{"id":"t5","title":"웹캠 실시간 추론","ref":"2-4 · p.54–65","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":false,"p":"OpenCV로 웹캠 스트림을 여는 코드는?","o":["cv2.VideoCapture(0)","cv2.imread(0)","cv2.imshow(0)","cv2.waitKey(0)"],"a":0,"h":"OpenCV에서 영상 입력을 '캡처'하는 클래스에 장치 번호 0을 넘기면 기본 웹캠 스트림이 열립니다. 이후 <code>cap.isOpened()<\/code>로 열렸는지 확인하고 <code>cap.read()<\/code>로 프레임을 하나씩 받습니다.","w":"cv2.VideoCapture(0)으로 웹캠을 열고 cap.read()로 프레임을 하나씩 읽습니다.","an":"2-4 · 웹캠 p.55","src":"import cv2\ncap = cv2.VideoCapture(0)\nif not cap.isOpened():\nraise RuntimeError(\"웹캠을 열 수 없습니다\")\nret, frame = cap.read()\nprint(frame.shape)"},{"id":"t5-02","ty":"mc","lv":2,"game":true,"p":"<code>imshow<\/code> 창이 멈춘 것처럼 보일 때 빠뜨린 것은?","o":["cap.release()","cv2.waitKey(1)","result.plot()","verbose=False"],"a":1,"h":"트러블슈팅 표에 따르면 화면이 멈춘 것처럼 보이는 증상은 <code>imshow<\/code> 창이 갱신되지 않아서 생깁니다. OpenCV 창은 키 입력을 잠깐 기다리는 함수가 호출될 때 화면을 갱신하므로, 추론 루프 끝에서 1ms씩 이 함수를 불러 줘야 합니다.","w":"waitKey(1)이 없으면 imshow 창이 갱신되지 않습니다.","an":"2-4 · 트러블슈팅 p.61","src":"화면이 멈춘 것처럼 보임 waitKey(1)이 없으면 imshow 창이 갱신되지 않습니다."},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"순간 FPS를 구하는 식으로 맞는 것은?","o":["프레임 수 × 시간","시간 / 프레임 수","1 / (현재 시각 − 이전 시각)","해상도 / 시간"],"a":2,"h":"FPS 측정 코드는 매 프레임 <code>time.time()<\/code>으로 현재 시각(now)을 재고, 직전 프레임 시각(prev)과의 차이로 한 프레임에 걸린 초를 구합니다. 순간 FPS는 이 시간 차이의 역수, 즉 1.0을 (now - prev)로 나눈 값이며 여러 프레임을 평균 내면 더 안정적입니다.","w":"fps = 1.0 / (now − prev). 여러 프레임 평균을 내면 더 안정적입니다.","an":"2-4 · 성능확인 p.57","src":"fps = 1.0 / (now - prev)"},{"id":"t5-04","ty":"mc","lv":2,"game":true,"p":"다른 프로그램이 웹캠을 다시 쓸 수 있게 하려면 반드시 호출해야 하는 것은?","o":["cap.read()","cap.isOpened()","cv2.putText()","cap.release()"],"a":3,"h":"웹캠 자원 정리 코드는 두 줄입니다. 하나는 OpenCV가 띄운 창을 모두 닫는 <code>destroyAllWindows()<\/code>이고, 다른 하나는 VideoCapture 객체가 잡고 있는 웹캠 핸들을 놓아 주는 메서드입니다. 주석은 핸들을 해제해야 다른 프로그램이 다시 쓸 수 있다고 강조합니다.","w":"cap.release()로 웹캠 핸들을 해제하고 cv2.destroyAllWindows()로 창을 닫습니다.","an":"2-4 · 자원정리 p.59","src":"cap.release()\ncv2.destroyAllWindows()\n# 웹캠 핸들을 반드시 해제해야 다른 프로그램이 다시 사용할 수 있습니다"},{"id":"t5-05","ty":"mc","lv":3,"game":true,"p":"추론을 백그라운드로 돌려 다음 프레임 준비와 겹쳐 처리하는 방법은?","o":["start_async() 비동기 추론","동기 추론","verbose=False","imgsz 확대"],"a":0,"h":"동기 추론은 추론이 끝날 때까지 다음 코드가 대기하므로 CPU가 노는 시간이 생길 수 있습니다. 비동기 방식은 <code>InferRequest<\/code>의 메서드로 추론을 백그라운드에서 시작해 두고, 그동안 다음 프레임을 준비해 두 작업을 겹쳐 처리합니다.","w":"InferRequest의 start_async()로 비동기 추론을 하면 이전 프레임 추론과 다음 프레임 준비를 겹쳐 처리량을 높일 수 있습니다. 이 장 예제는 모두 동기 방식입니다.","an":"2-4 · 심화 p.63","src":"비동기(Async)\n— `InferRequest`의 `start_async()`로 추론을 백그라운드에서 실행합니\n다.\n— 다음 프레임을 준비하는 동안 이전 프레임 추론을 겹쳐 처리할 수\n있습니다.\n— 실시간 스트리밍에서 처리량을 끌어올릴 때 사용합니다."},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"동영상 파일은 경로만 넘기면 Ultralytics가 프레임을 순회하며 자동 처리한다.","a":true,"h":"자료는 처리 대상에 따라 코드가 얼마나 다른지 비교합니다. 이미지·동영상 파일은 <code>ov_model(\"file.mp4\")<\/code>처럼 경로만 넘기면 되고, 웹캠은 <code>cv2.VideoCapture(0)<\/code>로 직접 프레임을 받으며 루프·종료·자원 해제를 직접 관리해야 합니다. 동영상 파일의 프레임은 누가 순회하는지 확인해 보세요.","w":"맞습니다. 파일은 경로만 넘기면 되고, 웹캠은 VideoCapture로 루프·종료·자원 해제를 직접 관리해야 합니다.","an":"2-4 · 처리대상 p.60","src":"이미지 / 동영상 파일\n— `ov_model(\"file.jpg\")` 또는 `ov_model(\"file.mp4\")`처럼 경로만 넘기면\n됩니다.\n— 동영상은 내부적으로 프레임을 순회하며 자동 처리됩니다."},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"device를 바꿔 체감 속도를 비교할 때는 imgsz와 conf도 함께 바꿔야 공정하다.","a":false,"h":"실습 TIP은 device를 바꿔 가며 체감 속도를 비교할 때 같은 조건을 지켜야 한다고 말합니다. 공정한 비교 실험에서는 비교하려는 변수 하나만 바꾸고 나머지(imgsz, conf)는 고정해야 차이의 원인을 알 수 있습니다.","w":"틀렸습니다. 같은 조건에서 비교하려면 imgsz와 conf를 고정한 채 device만 바꿔야 합니다.","an":"2-4 · 실습 p.64","src":"TIP\n같은 조건에서 비교하려면 imgsz와 conf 값을 고정한 채 device만 바꿔야 합니다."},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"웹캠 연동 문제와 해결 방법을 연결하세요.","pairs":[["cap.isOpened() == False","장치 번호 확인·점유 프로그램 종료"],["화면이 멈춘 것처럼 보임","waitKey(1) 추가"],["FPS가 너무 낮음","해상도 축소·GPU/NPU 전환"],["창이 안 닫힘","destroyAllWindows() 호출"]],"h":"<code>cap.isOpened()<\/code>가 False면 웹캠 장치 번호가 다르거나 다른 프로그램이 점유 중인 경우입니다. 화면 정지는 imshow 창 갱신 문제, 낮은 FPS는 해상도와 device 설정 문제, 창이 남는 것은 창 정리 함수를 빠뜨린 문제입니다.","w":"자주 겪는 웹캠 문제는 장치 번호, waitKey, 해상도·디바이스, 창 정리로 해결합니다.","an":"2-4 · 트러블슈팅 p.61","src":"cap.isOpened() == False 웹캠 장치 번호(0, 1...)가 다르거나 다른 프로그램이 점유 중입니다.\n화면이 멈춘 것처럼 보임 waitKey(1)이 없으면 imshow 창이 갱신되지 않습니다.\nFPS가 너무 낮음 해상도를 낮추거나 device=\"gpu\"/\"npu\"로 바꿔보세요.\n창이 안 닫힘 destroyAllWindows()를 빠뜨리면 창이 남을 수 있습니다."},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"웹캠 추론 루프 한 바퀴의 순서를 맞추세요.","steps":["cap.read()로 프레임 읽기","모델로 추론","result.plot()으로 그리기","cv2.imshow로 표시","waitKey로 종료 키 확인"],"h":"추론 루프는 <code>while True<\/code> 안에서 먼저 <code>cap.read()<\/code>로 프레임을 받고, 모델에 넣어 결과를 얻습니다. 그 결과를 <code>plot()<\/code>으로 그린 이미지를 창에 띄운 뒤, 마지막으로 'q' 키가 눌렸는지 확인해 루프를 빠져나갑니다.","w":"webcam_infer_loop.py는 프레임 읽기 → 추론 → plot → imshow → waitKey 순서로 반복합니다.","an":"2-4 · 웹캠 p.56","src":"while True:\nret, frame = cap.read()\nif not ret:\nbreak\nresult = ov_model(frame, verbose=False)[0]\nplotted = result.plot()\ncv2.imshow(\"OpenVINO Webcam\", plotted)\nif cv2.waitKey(1) & 0xFF == ord(\"q\"):"},{"id":"t5-10","ty":"multi","lv":2,"game":true,"p":"실시간 추론을 더 매끄럽게 만드는 방법을 <b>모두<\/b> 고르세요.","o":["입력 해상도 축소","FP16/INT8 모델 사용","GPU/NPU/AUTO로 device 전환","verbose=False","conf를 0으로"],"a":[0,1,2,3],"h":"성능 팁은 네 가지입니다. 640보다 작은 imgsz로 내보내기, half=True나 양자화 모델 쓰기, CPU 대신 다른 가속 디바이스나 AUTO 지정하기, 그리고 콘솔 로그 오버헤드를 줄이는 설정입니다. 해상도를 오히려 키우는 것은 속도를 떨어뜨립니다.","w":"성능 팁은 해상도 축소, FP16/INT8, device 전환, 불필요한 출력 끄기(verbose=False)입니다. conf를 0으로 하면 오검출만 늘어납니다.","an":"2-4 · 성능 팁 p.62","src":"1 입력 해상도 축소\n640보다 작은 imgsz로 내보내면 속도가 크게 향상됩니다.\n2 FP16/INT8 활용\nhalf=True 또는 양자화된 모델을 쓰면 지연시간이 줄어듭니다.\n3 device 전환\nCPU 대신 GPU/NPU/AUTO를 지정해 처리량을 높일 수 있습니다.\n4 불필요한 출력 끄기\nverbose=False로 콘솔 로그 오버헤드를 줄입니다."}]},{"id":"t6","title":"디바이스 비교와 AUTO 모드","ref":"3-1~3-2 · p.66–80","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"저전력 상시 추론에 최적화된 전용 가속기는?","o":["CPU","NPU","iGPU","AUTO"],"a":1,"h":"자료는 디바이스를 세 가지로 나눕니다. CPU는 항상 사용 가능하고 범용적이지만 상대적으로 느리며, GPU(iGPU)는 병렬 연산에 강해 배치·고해상도에 유리합니다. 나머지 하나는 신경망 연산 전용 가속기(Neural Processing Unit)로, 엣지 기기에서 전력 대비 효율이 좋습니다.","w":"NPU는 저전력 상시 추론용 전용 가속기, GPU는 병렬 연산·고해상도, CPU는 범용입니다.","an":"3-1 · 개요 p.66","src":"CPU\n항상 사용 가능하며 범용적이지만 상대적으로 느립니다.\nGPU(iGPU)\n병렬 연산에 강해 배치 처리·고해상도에 유리합니다.\nNPU\n저전력 상시 추론에 최적화된 전용 가속기입니다."},{"id":"t6-02","ty":"mc","lv":1,"game":false,"p":"시스템에서 사용 가능한 디바이스 목록을 확인하는 코드는?","o":["ov.devices()","core.read_model","core.available_devices","core.compile_model"],"a":2,"h":"디바이스 조회 코드는 <code>ov.Core()<\/code> 객체를 만든 뒤 그 '속성'을 출력해 ['CPU', 'GPU', 'NPU'] 같은 리스트를 얻습니다. 괄호를 붙여 호출하는 메서드가 아니라 속성이라는 점, 그리고 '사용 가능한(available)' 장치 목록이라는 점을 떠올려 보세요.","w":"print(core.available_devices)를 실행하면 예: ['CPU', 'GPU', 'NPU']가 출력됩니다.","an":"3-1 · 디바이스확인 p.67","src":"import openvino as ov\ncore = ov.Core()\nprint(core.available_devices)\n# 예: ['CPU', 'GPU', 'NPU']\nprint(core.get_property(\"CPU\", \"FULL_DEVICE_NAME\"))"},{"id":"t6-03","ty":"mc","lv":2,"game":true,"p":"benchmark_app에서 처리량/지연시간 우선 모드를 고르는 옵션은?","o":["-d","-niter","-api","-hint"],"a":3,"h":"benchmark_app 옵션 표에서 <code>-d<\/code>는 디바이스, <code>-niter<\/code>는 반복 횟수, <code>-api<\/code>는 sync/async를 정합니다. throughput과 latency 값을 받아 처리량 우선 또는 지연시간 우선 모드를 고르는 옵션은 '힌트'라는 이름을 씁니다.","w":"-d는 디바이스, -hint는 throughput/latency, -niter는 반복 횟수, -api는 sync/async입니다.","an":"3-1 · 벤치마크 p.68","src":"-d CPU / GPU / NPU 벤치마크를 실행할 디바이스를 지정합니다.\n-hint throughput / latency 처리량 우선 또는 지연시간 우선 모드를 선택합니다.\n-niter 반복 추론 횟수를 지정합니다.\n-api sync / async 동기/비동기 실행 방식을 선택합니다."},{"id":"t6-04","ty":"mc","lv":2,"game":true,"p":"AUTO에게 GPU를 먼저 시도하고 안 되면 CPU를 쓰게 하는 디바이스 문자열은?","o":["\"AUTO:GPU,CPU\"","\"GPU,CPU\"","\"AUTO\"","\"CPU:AUTO\""],"a":0,"h":"AUTO 모드는 compile_model의 디바이스 문자열에 'AUTO:' 뒤로 우선순위 리스트를 쉼표로 이어 붙여 지정합니다. 앞에 적힌 디바이스를 먼저 시도하고, 불가능하면 다음 순위 디바이스로 전환(fallback)합니다.","w":"\"AUTO:GPU,CPU\"는 GPU를 우선 시도하고 불가능하면 CPU로 전환(fallback)합니다.","an":"3-2 · 우선순위 p.76","src":"compiled_model = core.compile_model(model, \"AUTO:GPU,CPU\")\n# GPU를 우선 시도하고, 불가능하면 CPU로 전환(fallback)합니다"},{"id":"t6-05","ty":"mc","lv":3,"game":true,"p":"AUTO 모드가 초기 지연을 줄이는 방법은?","o":["모든 디바이스에서 동시에 추론","첫 요청을 컴파일이 빠른 CPU로 처리","캐시를 강제로 삭제","INT8로 자동 양자화"],"a":1,"h":"GPU 같은 목표 디바이스는 컴파일에 시간이 걸립니다. AUTO는 이 시간을 기다리지 않도록, 컴파일이 빠른 디바이스로 첫 요청을 즉시 처리하고 백그라운드에서 목표 디바이스 컴파일을 진행합니다. 컴파일이 끝나면 이후 추론은 목표 디바이스로 넘어갑니다.","w":"AUTO는 첫 요청을 CPU로 즉시 처리하고, 백그라운드에서 목표 디바이스를 컴파일한 뒤 이후 추론을 그쪽으로 넘깁니다.","an":"3-2 · 동작방식 p.77","src":"초기 컴파일\n— 첫 요청은 컴파일이 빠른 CPU로 즉시 처리해 초기 지연을 줄입니다.\n— 백그라운드에서 목표 디바이스(GPU 등) 컴파일을 진행합니다."},{"id":"t6-06","ty":"ox","lv":1,"game":true,"p":"AUTO 모드를 쓰면 하드웨어 구성이 다른 환경에 배포할 때 코드를 바꾸지 않아도 된다.","a":true,"h":"AUTO 플러그인은 사용 가능한 디바이스 중 모델과 힌트를 보고 가장 성능이 좋을 것으로 예측되는 것을 자동으로 고릅니다. 자료는 이 방식의 '장점'을 하드웨어 구성이 다른 여러 배포 환경과 관련지어 설명합니다.","w":"맞습니다. AUTO는 가장 적합한 디바이스를 자동으로 골라 하드웨어 차이를 코드 변경 없이 흡수합니다.","an":"3-2 · 개요 p.74","src":"동작\n모델과 힌트를 보고 가장 성능이 좋을 것으로 예측되는 디바이스를 선택합니다.\n장점\n하드웨어 구성이 다른 여러 환경에 배포할 때 코드를 바꾸지 않아도 됩니다."},{"id":"t6-07","ty":"ox","lv":2,"game":true,"p":"실시간 반응성이 중요하면 -hint throughput으로 최적화한다.","a":false,"h":"처리량(Throughput)은 초당 처리 프레임 수로, 여러 스트림을 동시에 처리할 때 중요합니다. 지연시간(Latency)은 한 번의 추론이 끝나는 데 걸리는 시간(ms)으로, 실시간 반응성이 중요한 애플리케이션에서 중요합니다. 각 지표에 맞는 -hint 값이 따로 있습니다.","w":"틀렸습니다. 실시간 반응성에는 지연시간이 중요하므로 -hint latency를 씁니다. throughput은 여러 스트림 동시 처리에 중요합니다.","an":"3-1 · 지표 p.72","src":"처리량 (Throughput)\n— 초당 처리 가능한 프레임 수(FPS).\n— 여러 스트림을 동시에 처리할 때 중요합니다.\n— -hint throughput으로 최적화합니다.\n지연시간 (Latency)\n— 한 번의 추론이 끝나는 데 걸리는 시간(ms).\n— 실시간 반응성이 중요한 애플리케이션에서 중요합니다.\n— -hint latency로 최적화합니다."},{"id":"t6-08","ty":"match","lv":2,"game":false,"p":"benchmark_app 옵션과 의미를 연결하세요.","pairs":[["-d","실행할 디바이스 지정"],["-hint","처리량 또는 지연시간 우선"],["-niter","반복 추론 횟수"],["-api","동기/비동기 실행 방식"]],"h":"옵션 이름은 영어 약자입니다. d는 device, niter는 number of iterations(반복 횟수), api는 실행 방식(sync/async)을 뜻합니다. hint는 throughput/latency 중 무엇을 우선할지 알려 주는 옵션입니다.","w":"benchmark_app은 -d, -hint, -niter, -api로 실험 조건을 맞춥니다.","an":"3-1 · 벤치마크 p.68","src":"-d CPU / GPU / NPU 벤치마크를 실행할 디바이스를 지정합니다.\n-hint throughput / latency 처리량 우선 또는 지연시간 우선 모드를 선택합니다.\n-niter 반복 추론 횟수를 지정합니다.\n-api sync / async 동기/비동기 실행 방식을 선택합니다."},{"id":"t6-09","ty":"order","lv":3,"game":false,"p":"AUTO 모드의 내부 동작 순서를 맞추세요.","steps":["모델과 힌트를 보고 목표 디바이스 예측","첫 요청은 CPU로 즉시 처리","백그라운드에서 목표 디바이스 컴파일","컴파일 완료 후 목표 디바이스로 추론 전환"],"h":"AUTO는 먼저 모델과 힌트를 보고 가장 성능이 좋을 디바이스를 예측합니다. 그 디바이스의 컴파일을 기다리는 동안 첫 요청은 컴파일이 빠른 CPU가 즉시 처리하고, 목표 디바이스 컴파일은 백그라운드에서 진행됩니다. 컴파일이 끝나면 이후 추론이 그 디바이스로 넘어갑니다.","w":"AUTO는 디바이스를 고른 뒤 CPU로 먼저 응답하고, 목표 디바이스 컴파일이 끝나면 전환합니다. 사용자 코드는 신경 쓸 필요가 없습니다.","an":"3-2 · 개요·동작방식 p.74·77","src":"초기 컴파일\n— 첫 요청은 컴파일이 빠른 CPU로 즉시 처리해 초기 지연을 줄입니다.\n— 백그라운드에서 목표 디바이스(GPU 등) 컴파일을 진행합니다.\n전환\n— 목표 디바이스 컴파일이 끝나면 이후 추론은 그 디바이스로 넘어갑\n니다."},{"id":"t6-10","ty":"multi","lv":2,"game":true,"p":"성능 힌트(performance_mode)에 대해 옳은 것을 <b>모두<\/b> 고르세요.","o":["THROUGHPUT은 처리량 최대화","LATENCY는 지연시간 최소화","기본값은 대체로 LATENCY","compile_model의 config로 전달","NPU에서만 쓸 수 있다"],"a":[0,1,2,3],"h":"<code>performance_mode<\/code>에는 처리량을 최대화하는 THROUGHPUT과 지연시간을 최소화하는 LATENCY가 있고, 기본값은 대체로 LATENCY입니다. 이 프로퍼티는 <code>compile_model<\/code>을 호출할 때 config 딕셔너리로 넘깁니다. benchmark_app의 <code>-niter<\/code>처럼 다른 도구의 옵션과 혼동하지 마세요.","w":"performance_mode는 THROUGHPUT/LATENCY 중 고르며 기본값은 대체로 LATENCY, compile_model 호출 시 config 딕셔너리로 전달합니다. 특정 디바이스 전용이 아닙니다.","an":"3-2 · 힌트 p.78–79","src":"performance_mode\n— THROUGHPUT: 처리량을 최대화합니다.\n— LATENCY: 지연시간을 최소화합니다.\n— 기본값은 대체로 LATENCY입니다.\n적용 방법\n— `ov.properties.hint.performance_mode` 프로퍼티로 설정합니다.\n— compile_model 호출 시 config 딕셔너리로 전달합니다."}]},{"id":"t7","title":"INT8 양자화와 NNCF","ref":"3-3 · p.81–96","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"현재 OpenVINO 공식 양자화 도구는?","o":["POT","benchmark_app","NNCF","PrePostProcessor"],"a":2,"h":"과거의 양자화 도구 POT(Post-training Optimization Tool)는 deprecated를 거쳐 완전히 removed 되었습니다. 현재 공식 도구는 Neural Network Compression Framework로, post-training 양자화와 학습 중 양자화(QAT)를 모두 지원합니다.","w":"과거 POT는 완전히 폐지되었고, 지금은 NNCF가 post-training 양자화와 QAT를 모두 지원합니다.","an":"3-3 · 도구 p.83","src":"현재: NNCF\n— Neural Network Compression Framework, OpenVINO 공식 양자화 도\n구입니다.\n— Post-training 양자화와 학습 중 양자화(QAT)를 모두 지원합니다."},{"id":"t7-02","ty":"mc","lv":2,"game":true,"p":"FP32 대비 INT8 모델 크기는 대략 얼마인가요?","o":["같다","약 1/2","약 1/8","약 1/4"],"a":3,"h":"정밀도 비교표는 FP32를 기준으로 모델 크기를 비교합니다. 32비트로 표현하던 값을 FP16은 16비트, INT8은 8비트로 표현하므로 크기는 비트 수의 비율(8/32)만큼 줄어든다고 생각하면 됩니다. 표에서 FP16은 약 1/2로 적혀 있습니다.","w":"모델 크기는 FP16이 약 1/2, INT8이 약 1/4입니다.","an":"3-3 · 정밀도비교 p.82","src":"항목 FP32 FP16 INT8\n정확도 기준(가장 높음) 거의 동일 약간 손실 가능\n속도 가장 느림 더 빠름 가장 빠름\n모델 크기 가장 큼 약 1/2 약 1/4\n주 사용처 학습·정밀 검증 일반 추론 엣지·실시간 추론"},{"id":"t7-03","ty":"mc","lv":2,"game":true,"p":"보정(Calibration) 데이터로 권장되는 양은?","o":["실제와 비슷한 300장 내외","10장 내외","학습 데이터 전체","검증셋 없이 1장"],"a":0,"h":"보정 데이터셋은 <code>nncf.Dataset(val_loader, transform_fn)<\/code>으로 만들고, transform_fn은 각 데이터를 모델 입력 형태로 전처리합니다. 자료는 보정 데이터가 실제 추론 데이터와 분포가 비슷해야 하며, <code>nncf.quantize<\/code>의 <code>subset_size<\/code>와 같은 수준이면 충분하다고 설명합니다.","w":"보정 데이터는 실제 추론 데이터와 분포가 비슷한 300장 내외면 충분합니다.","an":"3-3 · 데이터준비 p.85","src":"NOTE 보정 데이터는 실제 추론 데이터와 분포가 비슷한 300장 내외면 충분합니다."},{"id":"t7-04","ty":"mc","lv":2,"game":false,"p":"양자화된 모델을 IR 파일로 저장하는 함수는?","o":["nncf.save()","ov.save_model()","model.export()","core.set_property()"],"a":1,"h":"양자화가 끝난 quantized_model은 메모리에 있는 ov.Model입니다. 이를 <code>\"model_int8.xml\"<\/code> 같은 IR 파일로 쓰려면 openvino 모듈(ov)의 '저장' 함수를 호출하고, 이후 <code>core.compile_model(\"model_int8.xml\", \"CPU\")<\/code>로 실행합니다.","w":"ov.save_model(quantized_model, \"model_int8.xml\")로 저장한 뒤 compile_model로 실행합니다.","an":"3-3 · 저장및실행 p.87","src":"import openvino as ov\nov.save_model(quantized_model, \"model_int8.xml\")\ncore = ov.Core()\ncompiled = core.compile_model(\"model_int8.xml\", \"CPU\")"},{"id":"t7-05","ty":"mc","lv":3,"game":true,"p":"양자화 후 정확도 손실이 클 때 강의가 권하는 대응은?","o":["POT 예제 사용","검증을 생략","보정 데이터를 늘리거나 QAT 고려","FP32로 다시 학습만"],"a":2,"h":"양자화하면 CPU에서 처리량이 2~4배가량 개선되는 경우가 흔하지만, 정확도 손실이 생길 수 있습니다. 그래서 양자화 후에는 검증셋으로 mAP/accuracy를 재측정해야 합니다. 손실이 클 때는 보정에 쓰는 데이터를 보강하거나 학습 중 양자화 방식을 검토하라고 권합니다.","w":"양자화 후 검증셋으로 mAP/accuracy를 재측정하고, 손실이 크면 보정 데이터 양을 늘리거나 학습 중 양자화(QAT)를 고려합니다.","an":"3-3 · 트레이드오프 p.88","src":"정확도 확인\n— 양자화 후 검증셋으로 mAP/accuracy를 재측정해야 합니다.\n— 손실이 크면 보정 데이터 양을 늘리거나 QAT를 고려합니다."},{"id":"t7-06","ty":"ox","lv":1,"game":true,"p":"오래된 POT 기반 양자화 예제 코드는 지금도 그대로 동작한다.","a":false,"h":"POT는 과거 OpenVINO의 양자화 도구였지만 지금은 deprecated를 거쳐 removed 된 상태입니다. 주의사항 표는 오래된 POT 기반 예제를 참고하는 것을 '자주 하는 실수'로 꼽고, 대신 NNCF 문서를 보라고 안내합니다.","w":"틀렸습니다. POT는 완전히 제거되어 예제가 동작하지 않으니 NNCF 문서를 참고해야 합니다.","an":"3-3 · 도구·주의사항 p.83·90","src":"POT 예제 코드 참고 오래된 POT 기반 예제는 더 이상 동작하지 않으니 NNCF 문서를 참고하세요."},{"id":"t7-07","ty":"ox","lv":2,"game":true,"p":"FP16과 INT8의 처리량을 비교할 때는 같은 -hint, 같은 -niter 조건이어야 공정하다.","a":true,"h":"실습은 FP16 모델과 INT8 모델을 각각 benchmark_app으로 측정해 처리량 차이를 비교하게 합니다. 정밀도 외의 측정 조건(성능 힌트, 반복 횟수)이 다르면 차이가 어디서 왔는지 알 수 없으므로 TIP은 조건을 맞추라고 강조합니다.","w":"맞습니다. 측정 조건을 같게 해야 정밀도 차이만 비교할 수 있습니다.","an":"3-3 · 실습 p.89","src":"TASK\nFP16 모델과 INT8 양자화 모델을 각각 benchmark_app으로 측정해 처리량 차이를 비교해보세요.\nTIP\n같은 -hint, 같은 -niter 조건에서 비교해야 공정한 비교가 됩니다."},{"id":"t7-08","ty":"match","lv":2,"game":false,"p":"상황과 권장 디바이스 선택을 연결하세요.","pairs":[["개발·디버깅","예측 가능한 CPU"],["고해상도·배치 처리","병렬 연산에 강한 GPU"],["저전력 상시 추론","전력 효율 좋은 NPU"],["배포 환경이 다양할 때","AUTO 모드"]],"h":"선택 가이드는 네 상황을 다룹니다. 개발·디버깅에는 항상 사용 가능하고 예측 가능한 디바이스, 고해상도·배치에는 병렬 연산에 강한 디바이스, 엣지의 상시 추론에는 전력 효율이 좋은 디바이스가 맞습니다. 배포 환경이 다양할 때는 하드웨어 차이를 코드 변경 없이 흡수하는 모드를 씁니다.","w":"상황별 디바이스 선택 가이드의 네 가지 경우입니다.","an":"3-1~3-3 · 가이드 p.91","src":"1 개발·디버깅\n항상 사용 가능하고 예측 가능한 CPU를 우선 사용합니다.\n2 고해상도·배치 처리\n병렬 연산에 강한 GPU가 유리한 경우가 많습니다.\n3 저전력 상시 추론\n엣지 기기에서는 NPU가 전력 대비 효율이 좋습니다.\n4 배포 환경이 다양할 때\nAUTO 모드로 하드웨어 차이를 코드 변경 없이 흡수합니다."},{"id":"t7-09","ty":"order","lv":2,"game":false,"p":"NNCF로 INT8 모델을 만들어 실행하는 순서를 맞추세요.","steps":["pip install nncf","transform_fn과 nncf.Dataset으로 보정 데이터셋 만들기","nncf.quantize(model, dataset, subset_size=300)","ov.save_model로 model_int8.xml 저장","compile_model로 실행"],"h":"먼저 <code>pip install nncf<\/code>로 도구를 설치하고, <code>transform_fn<\/code>과 <code>nncf.Dataset<\/code>으로 보정 데이터셋을 만듭니다. 그다음 <code>nncf.quantize<\/code>로 INT8 모델을 만들고, 파일로 저장한 뒤 <code>compile_model<\/code>로 실행합니다.","w":"설치 후 보정 데이터셋을 만들고 nncf.quantize로 INT8 모델을 만든 뒤 저장·컴파일합니다.","an":"3-3 · 설치~저장및실행 p.84–87","src":"import nncf\ndef transform_fn(data_item):\nimage, _ = data_item\nreturn preprocess(image) # 모델 입력 형태로 전처리\ncalibration_dataset = nncf.Dataset(val_loader, transform_fn)"},{"id":"t7-10","ty":"multi","lv":2,"game":true,"p":"양자화에서 자주 하는 실수를 <b>모두<\/b> 고르세요.","o":["보정 데이터 부족","실제와 분포가 다른 보정 데이터","양자화 후 검증 생략","POT 예제 코드 참고","NNCF 버전 확인"],"a":[0,1,2,3],"h":"주의사항 표는 양자화에서 자주 하는 실수 네 가지를 듭니다. 너무 적은 샘플로 보정하기, 실제 서비스와 분포가 다른 데이터로 보정하기, 양자화 후 정확도 재측정 생략하기, 이미 동작하지 않는 오래된 도구의 예제 참고하기입니다. 버전에 맞는 NNCF 설치는 권장 사항입니다.","w":"보정 데이터 부족·분포 차이·검증 생략·POT 예제 참고가 자주 하는 실수입니다. OpenVINO 버전에 맞는 NNCF 설치는 오히려 권장 사항입니다.","an":"3-3 · 주의사항 p.90","src":"보정 데이터 부족 너무 적은 샘플로 보정하면 정확도 손실이 커질 수 있습니다.\n분포가 다른 보정 데이터 실제 서비스 데이터와 다른 분포면 양자화 효과가 왜곡됩니다.\n검증 생략 양자화 후 정확도 재측정을 생략하면 품질 저하를 놓칠 수 있습니다.\nPOT 예제 코드 참고 오래된 POT 기반 예제는 더 이상 동작하지 않으니 NNCF 문서를 참고하세요."}]},{"id":"t8","title":"물류 자동 계수 프로젝트","ref":"PART 2 · 4-1 · p.97–108","qs":[{"id":"t8-01","ty":"mc","lv":1,"game":true,"p":"물류 자동 계수 시스템을 이루는 세 요소의 조합은?","o":["분류 + 양자화 + 캐싱","전처리 + PPP + 벤치마크","자세추정 + NMS + AUTO","검출 + 추적 + 카운팅 로직"],"a":3,"h":"물류 자동 계수 시스템은 컨베이어나 게이트를 지나는 상자를 카메라로 자동으로 셉니다. 프레임마다 상자 위치를 찾고, 같은 상자를 여러 프레임에 걸쳐 같은 객체로 인식한 뒤, 기준선이나 존 통과 시 숫자를 올리는 세 단계가 결합됩니다.","w":"프레임마다 상자를 검출하고, 추적으로 같은 상자를 연결하고, 기준선·존 통과를 카운트합니다.","an":"4-1 · 개요 p.98","src":"컨베이어 벨트나 입출고 게이트를 지나는 상자·제\n품을 카메라로 자동으로 세는 시스템입니다. 객체\n검출 + 추적(Tracking) + 카운팅 로직의 조합으로\n만들어집니다."},{"id":"t8-02","ty":"mc","lv":2,"game":true,"p":"컨베이어처럼 한 방향 흐름에 적합한 계수 방식은?","o":["라인 크로싱","존 카운팅","argmax 카운팅","히스토그램 카운팅"],"a":0,"h":"계수 로직은 두 가지입니다. 하나는 화면에 가상의 선을 긋고 객체 중심이 그 선을 넘는 순간 세는 방식이고, 다른 하나는 관심 영역(ROI)에 들어오고 나가는 것을 기준으로 세는 방식입니다. 한 방향 흐름과 여러 방향 진입 중 어디에 각각 맞는지 비교해 보세요.","w":"라인 크로싱은 한 방향 흐름에, 존 카운팅은 여러 방향에서 진입하는 상황에 적합합니다.","an":"4-1 · 설계 p.100","src":"라인 크로싱(Line Crossing)\n— 화면에 가상의 선을 긋고, 객체 중심이 선을 넘는 순간 카운트.\n— 컨베이어처럼 한 방향 흐름에 적합합니다."},{"id":"t8-03","ty":"mc","lv":2,"game":true,"p":"<code>model.track()<\/code>에서 <code>persist=True<\/code>의 의미는?","o":["모델 파일을 저장","프레임이 바뀌어도 트래커 상태 유지","결과를 디스크에 기록","추적을 끈다"],"a":1,"h":"<code>model.track()<\/code>은 웹캠 등 연속 프레임에서 다중 객체를 추적하고 각 박스에 <code>box.id<\/code>를 부여합니다. 같은 상자가 다음 프레임에서도 같은 ID를 유지하려면 트래커가 이전 프레임의 상태를 기억해야 하며, persist(지속)라는 인자 이름이 그 역할을 나타냅니다.","w":"persist=True는 프레임이 바뀌어도 같은 트래커 상태를 이어가게 합니다. 예제는 tracker=\"bytetrack.yaml\"을 씁니다.","an":"4-1 · 추적 p.102","src":"NOTE persist=True는 프레임이 바뀌어도 같은 트래커 상태를 이어가게 합니다."},{"id":"t8-04","ty":"num","lv":2,"game":false,"p":"검출 박스 xyxy가 (100, 40, 300, 240)일 때 중심점의 x 좌표는? (픽셀)","a":200,"unit":"","h":"<code>get_centroid<\/code> 함수는 xyxy 박스 (x1, y1, x2, y2)에서 중심점을 구합니다. x 좌표는 cx = (x1 + x2) / 2, 즉 박스 왼쪽 끝과 오른쪽 끝의 평균입니다. 문제의 x1과 x2 값을 이 식에 대입해 보세요.","w":"get_centroid는 ((x1+x2)/2, (y1+y2)/2)를 반환하므로 cx = (100+300)/2 = 200, cy = (40+240)/2 = 140입니다.","an":"4-1 · 좌표계산 p.101","src":"def get_centroid(xyxy):\nx1, y1, x2, y2 = xyxy\nreturn ((x1 + x2) / 2, (y1 + y2) / 2)"},{"id":"t8-05","ty":"mc","lv":3,"game":true,"p":"같은 상자가 두 번 카운트되는 문제를 막는 방법은?","o":["라인을 화면 밖으로","신뢰도 기준을 0으로","카운트된 ID를 집합(set)에 저장","프레임레이트를 낮춤"],"a":2,"h":"트래킹 ID가 흔들리거나 겹친 상자가 잠깐 가려지면 하나의 상자가 두 번 카운트될 수 있습니다. 대응 전략은 이미 센 ID를 중복 없이 기억하는 자료구조에 저장해 두고, 다시 나타나도 세지 않는 것입니다. 트래커 매칭 임계값과 프레임레이트도 함께 조정합니다.","w":"트래킹 ID가 흔들려 중복 계수될 수 있으므로, 카운트된 ID를 set으로 관리해 재카운트를 막고 트래커 임계값·프레임레이트도 조정합니다.","an":"4-1 · 정확도·트러블슈팅 p.105–106","src":"대응 전략\n— 카운트된 ID는 집합(set)에 저장해 재카운트를 방지합니다."},{"id":"t8-06","ty":"ox","lv":2,"game":true,"p":"프레임레이트가 낮으면 빠른 상자가 기준선을 건너뛰어 놓칠 수 있다.","a":true,"h":"라인 크로싱은 이전 프레임과 현재 프레임 사이에 객체 중심이 선을 넘었는지로 판단합니다. 프레임과 프레임 사이 간격이 길면 빠르게 움직이는 상자가 그 사이에 많이 이동하므로, 트러블슈팅 표는 이럴 때 라인을 넓은 존으로 바꿔 보라고 권합니다.","w":"맞습니다. 이때는 라인을 넓은 존으로 바꿔 보는 것이 대응책입니다.","an":"4-1 · 트러블슈팅 p.106","src":"빠른 상자를 놓침 프레임레이트가 낮으면 선을 건너뛸 수 있습니다. 라인을 넓은 존으로 바꿔보세요."},{"id":"t8-07","ty":"ox","lv":1,"game":true,"p":"실전 배포 시 카메라는 자주 각도를 바꿔 주는 것이 계수 정확도에 좋다.","a":false,"h":"라인 크로싱은 화면의 고정된 위치에 가상의 선을 그어 둡니다. 배포 팁의 첫 항목은 카메라가 흔들리면 이 라인 위치가 실제 컨베이어 위치와 틀어져 계수 오류가 늘어난다고 설명합니다.","w":"틀렸습니다. 카메라가 흔들리면 라인 위치가 틀어져 계수 오류가 늘어나므로 고정해야 합니다.","an":"4-1 · 배포 팁 p.108","src":"1 카메라 고정\n흔들리면 라인 위치가 틀어져 계수 오류가 늘어납니다."},{"id":"t8-08","ty":"match","lv":2,"game":false,"p":"계수 시스템 구성 요소와 역할을 연결하세요.","pairs":[["카메라/영상","컨베이어 위를 촬영하는 고정 스트림"],["검출 모델","YOLO26 기반 상자 검출"],["추적기","프레임 간 같은 객체에 ID 부여"],["카운팅 로직","기준선/존 통과를 카운트로 변환"]],"h":"시스템 구성 요소 표는 네 요소를 정리합니다. 카메라/영상은 컨베이어 위를 촬영하고, 검출 모델은 YOLO26 기반으로 상자를 찾습니다. 추적기는 프레임 간 동일 객체를 연결(ID 부여)하고, 카운팅 로직은 기준선/존 통과 이벤트를 숫자로 바꿉니다.","w":"네 구성 요소가 차례로 영상 입력, 검출, 추적, 계수를 맡습니다.","an":"4-1 · 구성요소 p.99","src":"카메라/영상 컨베이어 위를 촬영하는 고정 카메라 스트림.\n검출 모델 YOLO26 기반 커스텀 검출 모델(상자 클래스).\n추적기 프레임 간 동일 객체를 연결(ID 부여).\n카운팅 로직 기준선/존 통과 이벤트를 카운트로 변환."},{"id":"t8-09","ty":"order","lv":3,"game":false,"p":"라인 크로싱 카운팅 로직의 처리 순서를 맞추세요.","steps":["박스의 추적 ID 읽기","get_centroid로 중심점 계산","이전 프레임의 y값(prev_y) 가져오기","prev_y < line_y ≤ cy 이면 count += 1","현재 cy를 prev_centroids에 저장"],"h":"라인 카운터 코드는 박스마다 <code>int(box.id)<\/code>로 추적 ID를 얻고, <code>get_centroid<\/code>로 중심점을 구합니다. 이어서 <code>prev_centroids.get(tid, cy)<\/code>로 이전 y값을 가져와 <code>prev_y &lt; line_y &lt;= cy<\/code>면 카운트를 올리고, 마지막에 현재 cy를 기록해 다음 프레임에 대비합니다.","w":"line_counter.py는 ID별로 이전 중심 y와 현재 y를 비교해 선을 넘는 순간만 카운트하고, 현재 위치를 다음 프레임을 위해 저장합니다.","an":"4-1 · 카운팅 p.103","src":"for box in r.boxes:\ntid = int(box.id)\ncx, cy = get_centroid(box.xyxy[0])\nprev_y = prev_centroids.get(tid, cy)\nif prev_y < line_y <= cy:\ncount += 1\nprev_centroids[tid] = cy"},{"id":"t8-10","ty":"multi","lv":2,"game":true,"p":"실전 배포 시 고려사항을 <b>모두<\/b> 고르세요.","o":["카메라 고정","조명 일정하게","카운트 로그 저장","주기적 재검증","신뢰도 기준 최소화"],"a":[0,1,2,3],"h":"배포 팁은 네 가지입니다. 흔들림이 라인 위치를 틀어지게 하지 않도록 카메라를 고정하고, 명암 변화가 검출 신뢰도를 흔들지 않도록 조명을 일정하게 합니다. 또한 시간대별 카운트를 기록해 두고, 실제 개수와 시스템 카운트를 주기적으로 비교합니다.","w":"카메라 고정·일정한 조명·시간대별 카운트 로그·실제 개수와의 주기적 비교가 배포 팁입니다. 신뢰도를 낮추면 오검출이 늘어납니다.","an":"4-1 · 배포 팁 p.108","src":"1 카메라 고정\n흔들리면 라인 위치가 틀어져 계수 오류가 늘어납니다.\n2 조명 일정하게\n명암 변화가 크면 검출 신뢰도가 불안정해집니다.\n3 카운트 로그 저장\n시간대별 카운트를 기록해두면 이상 발생 시 추적이 쉽습니다.\n4 주기적 재검증\n실제 개수와 시스템 카운트를 주기적으로 비교합니다."}]}]};

  order:'첫 번째부터 순서대로 클릭하세요. 번호가 붙은 항목을 다시 누르면 그 번호부터 뒤 번호가 지워집니다.',num:'숫자만 입력하세요.'};

/* 순위 저장소 — 공유 순위로 바꿀 때 이 객체만 교체 */
// 순위는 같은 조건(게임 모드 + 풀이 시간)끼리만 비교한다. key = 'timeattack:10'
const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

/* ── 유틸 ──────────────────────────────── */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function say(msg){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=msg,30);}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('📋 클립보드에 복사했습니다');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'📋 클립보드에 복사했습니다':'복사하지 못했습니다. 인쇄 기능을 이용하세요.');
}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

/* ── 오답노트 ──────────────────────────── */
function addWrong(id,ans){const w=S.wrong[id]||{n:0};w.n++;w.last=ans;w.at=Date.now();w.solved=false;S.wrong[id]=w;}
function markSolved(id){if(S.wrong[id]&&!S.wrong[id].solved){S.wrong[id].solved=true;S.wrong[id].at=Date.now();}}
const wrongList=solved=>Object.keys(S.wrong).filter(id=>QMAP[id]&&!!S.wrong[id].solved===solved)
  .sort((a,b)=>QTAB[a].idx-QTAB[b].idx||ALLQ.indexOf(QMAP[a])-ALLQ.indexOf(QMAP[b]));

/* ── 문항 풀이 상태(학습·재도전 공용) ───── */
let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

function cardHTML(q,n){
  const [label,color]=TYPES[q.ty];
  const g=cur.graded, a=cur.ans[q.id], fa=finalAns(q), ok=g&&isCorrect(q,fa);
  const lock=g?' disabled':'';
  let body='';
  if(q.ty==='mc'||q.ty==='multi'){
    const multi=q.ty==='multi', mine=multi?(a||[]):[a];
    body='<div class="opts">'+q.o.map((o,i)=>{
      const right=multi?q.a.includes(i):q.a===i, picked=mine.includes(i);
      const cls=g?(right?' ans':picked?' miss':''):'';
      return `<label class="opt${cls}"><span class="onum">${i+1}</span><input type="${multi?'checkbox':'radio'}" name="r-${q.id}" data-act="${multi?'tick':'pick'}" data-q="${q.id}" data-i="${i}"${picked?' checked':''}${lock}><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(q.ty==='ox'){
    body='<div class="ox">'+[true,false].map(v=>{
      const cls=g?(q.a===v?' ans':a===v?' miss':''):'';
      return `<button type="button" class="${cls.trim()}" data-act="ox" data-q="${q.id}" data-v="${v?1:0}" data-fk="${q.id}-ox${v?1:0}" aria-pressed="${a===v}" aria-label="${v?'맞다 O':'틀리다 X'}"${lock}>${v?'O':'X'}</button>`;
    }).join('')+'</div>';
  }else if(q.ty==='match'){
    const m=a||{}, sel=cur.msel[q.id], linkedBy={};
    Object.entries(m).forEach(([l,r])=>linkedBy[r]=+l);
    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${PAL[i%PAL.length]})" data-act="ml" data-q="${q.id}" data-i="${i}" data-fk="${q.id}-l${i}"${lock}><span class="tag">${LETTER[i]}</span>${esc(p[0])}</button>`;
    }).join('');
    const right=cur.shuf[q.id].map(j=>{
      const by=linkedBy[j], linked=by!=null, cls=(linked?' linked':'')+(g&&linked?(by===j?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${linked?PAL[by%PAL.length]:'--line'})" data-act="mr" data-q="${q.id}" data-j="${j}" data-fk="${q.id}-r${j}"${lock}><span class="tag">${linked?LETTER[by]:''}</span>${esc(q.pairs[j][1])}</button>`;
    }).join('');
    body=`<div class="match"><div class="mcol mleft">${left}</div><div class="mcol mright">${right}</div></div>`;
  }else if(q.ty==='order'){
    const seq=a||[], full=seq.length===q.steps.length;
    body='<div class="olist">'+(cur.shuf[q.id]||range(q.steps.length)).map(si=>{
      const pos=seq.indexOf(si), on=pos>=0;
      const cls=(on?' on':'')+(g?(pos===si?' ok':' no'):'');
      const fix=g&&pos!==si?`<span class="ofix">정답 ${si+1}</span>`:'';
      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }
  const numAns=q.ty==='mc'?`${q.a+1}번 · `:q.ty==='multi'?q.a.map(i=>i+1).join('·')+'번 · ':'';
  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${mediaHTML(q)}${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>${voiceRow(q,q.id)}`}${body}${exp}</article>`;
}
const LV_NAME=['쉬움','보통','어려움'];
function lvHTML(lv){
  lv=lv||1;
  const dots=[1,2,3].map(k=>k<=lv?`<i class="d${k}">●</i>`:'<i class="off">○</i>').join('');
  return `<span class="lv lv${lv}" title="난이도 ${LV_NAME[lv-1]}"><span class="dots" aria-hidden="true">${dots}</span><em>${LV_NAME[lv-1]}</em></span>`;
}
// 자료 발췌: 이스케이프 후 마크다운 기호만 가볍게 서식으로 (**굵게**, `코드`, 머리 #)
const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
function hintHTML(q){
  if(!q.h)return '';
  const open=cur.hints.has(q.id), label=q.ty==='num'?'Hint · 계산식':'Hint';
  // 2단계: ① 자세한 힌트(h) ② 자료 보기 — 자료 원문 발췌(src) + 위치(an)
  const sopen=cur.srcs.has(q.id);
  const src=q.src?`<div class="srcwrap"><button type="button" class="srcbtn" data-act="src" data-q="${q.id}" data-fk="${q.id}-src" aria-expanded="${sopen}" aria-controls="src-${q.id}">`+
    `<span class="caret" aria-hidden="true">${sopen?'▾':'▸'}</span>📖 자료 보기</button>`+
    (sopen?`<blockquote class="src" id="src-${q.id}"><p>${srcText(q.src)}</p>${q.an?`<cite>${esc(q.an)}</cite>`:''}</blockquote>`:'')+`</div>`:'';
  return `<div class="hintwrap"><button type="button" class="hintbtn" data-act="hint" data-q="${q.id}" data-fk="${q.id}-hint" aria-expanded="${open}" aria-controls="hint-${q.id}">`+
    `<span class="caret" aria-hidden="true">${open?'▾':'▸'}</span>${label}</button>`+
    (open?`<div class="hint" id="hint-${q.id}">${q.h}${src}</div>`:'')+`</div>`;
}
function refreshCard(q){
  const el=document.getElementById('card-'+q.id);if(!el)return;
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  el.outerHTML=cardHTML(q,el.dataset.n);
  if(fk){const f=app.querySelector(`[data-fk="${fk}"]`);if(f&&!f.disabled)f.focus();}
  updateProgress();
}
const pad2=n=>String(n).padStart(2,'0');
const fmtCnt=(n,t)=>`(${pad2(n)}/${pad2(t)})`;
// 탭별 푼 문항 수: 지금 보는 탭 → 화면 상태, 그 외 → 풀던 답(drafts) → 채점 기록
function tabAnswered(t){
  const src=cur&&cur.mode==='study'&&cur.tab===t?cur.ans:(S.drafts[t.id]||(S.tabs[t.id]&&S.tabs[t.id].answers)||{});
  return t.qs.filter(q=>isAnswered(q,src[q.id])).length;
}
function updateProgress(){
  const p=document.getElementById('pbar');if(!p||!cur)return;
  const n=cur.list.filter(answered).length, cnt=fmtCnt(n,cur.list.length);
  p.style.width=pct(n,cur.list.length)+'%';
  document.getElementById('ptxt').textContent=`${n} / ${cur.list.length} 응답`;
  const g=document.getElementById('gradeCnt');if(g)g.textContent=cnt;
  if(cur.mode==='study'){
    const c=document.getElementById('qc-'+cur.tab.id);if(c)c.textContent=cnt;
    if(!cur.graded){  // 풀던 답 저장 → 탭을 옮겨도 유지
      if(n||Object.keys(cur.ans).some(k=>{const v=cur.ans[k];return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:v!=null&&v!=='';}))
        S.drafts[cur.tab.id]=JSON.parse(JSON.stringify(cur.ans));
      else delete S.drafts[cur.tab.id];
      save();
    }
  }
}

/* ── 음성 선택 · 문제 읽기 · 그림/오디오 (qb-voice.js가 없으면 모두 숨김) ── */
const hasVoice=()=>!!(window.QBVoice&&QBVoice.supported());
const hasRead=()=>!!(window.QBVoice&&QBVoice.canSpeak());
const IC_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const IC_VOL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const VC=new Map();  // 학습 모드 문항별 음성 컨트롤러
function voiceReset(){VC.clear();if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}}
function voiceRow(q,fkp){
  const mic=hasVoice()&&['mc','multi','ox'].includes(q.ty), rd=hasRead();
  if(!mic&&!rd)return '';
  const qa=fkp?` data-q="${q.id}"`:'';
  return `<div class="vrow noprint">`+
    (mic?`<button type="button" class="vbtn vmic" data-act="vmic"${qa} data-fk="${fkp}-vmic" data-state="idle" aria-pressed="false">${IC_MIC}<span>말하기</span></button>`:'')+
    (rd?`<button type="button" class="vbtn" data-act="vread"${qa} data-fk="${fkp}-vread">${IC_VOL}<span>문제 읽기</span></button>`:'')+
    (mic?`<span class="vstat" aria-live="polite"></span><span class="vhint">말하기 어려우면 눌러서 고르세요</span>`:'')+`</div>`;
}
function mediaHTML(q){
  let h='';
  if(q.img&&q.img.src)h+=`<figure class="qfig"><img src="${esc(q.img.src)}" alt="${esc(q.img.alt)}" loading="lazy">${q.img.caption?`<figcaption>${esc(q.img.caption)}</figcaption>`:''}</figure>`;
  if(q.audio&&q.audio.src)h+=`<div class="qaud"><audio controls preload="none" src="${esc(q.audio.src)}"></audio><details><summary>대본</summary><p>${esc(q.audio.transcript)}</p></details></div>`;
  return h;
}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
// 읽어 줄 글: 문제 + 화면에 보이는 순서의 보기("1번 …")
function readText(q,n,order){
  let t=(n?`${n}번 문제. `:'')+plain(q.p)+'.';
  if(q.img&&q.img.alt)t+=' 그림 설명. '+q.img.alt+'.';
  if(q.ty==='ox')t+=' 맞으면 O, 틀리면 X.';
  else if(q.ty==='mc'||q.ty==='multi')t+=(order||range(q.o.length)).map((oi,k)=>` ${k+1}번. ${plain(q.o[oi])}.`).join('');
  return t;
}
function readAloud(text){if(QBVoice.isSpeaking())QBVoice.cancelSpeak();else QBVoice.speak(text);}
// 음성으로 고른 것 = 보기를 직접 누른 것과 같은 경로(입력 click → 기존 change/click 처리)
function voicePick(q,r){
  if(!cur||cur.graded)return;

function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;
  else if(el.dataset.act==='tick'){
    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);
  }
  cur.armed=false;updateProgress();
}
function onSheetInput(el){
  if(el.dataset.act==='num'&&!cur.graded){cur.ans[el.dataset.q]=el.value;cur.armed=false;updateProgress();}
}

function gradeSheet(){
  const miss=cur.list.map((q,i)=>answered(q)?0:i+1).filter(Boolean);
  if(miss.length&&!cur.armed){
    cur.armed=true;
    document.getElementById('warn').textContent=`미응답 ${miss.length}문항 (Q${miss.join(', Q')}). 한 번 더 누르면 미응답은 오답으로 채점합니다.`;
    return;
  }
  const firstUnlock=!gameUnlocked();
  cur.graded=true;
  const snap={};let score=0;
  cur.list.forEach(q=>{
    const a=finalAns(q);
    if(a!=null)snap[q.id]=a;
    if(isCorrect(q,a)){score++;markSolved(q.id);}
    else addWrong(q.id,answerText(q,a));
  });
  if(cur.mode==='study'){
    S.tabs[cur.tab.id]={score,total:cur.list.length,answers:snap,touched:[...cur.touched],at:Date.now()};
    delete S.drafts[cur.tab.id];
  }
  save();
  renderSheet();
  window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
  say(`채점 결과 ${score}점, ${cur.list.length}문항 중`);
  if(cur.mode==='study'&&firstUnlock)setTimeout(()=>toast('⚡ 게임 모드와 해설지가 열렸습니다!'),300);
  else if(cur.mode==='study'&&allGraded())setTimeout(()=>toast('★ 모든 탭 완료! 종합 결과를 확인하세요.'),300);
}

function gamePool(scope){
  const M=GAME_MODES[gameSetup.mode];
  const base=ALLQ.filter(q=>q.game&&!q.audio&&M.types.includes(q.ty));  // 오디오 문항은 제한시간 안에 들을 수 없어 제외
  if(scope==='played')return shuffle(base.filter(q=>S.tabs[QTAB[q.id].id]));
  if(scope==='wrong'){const w=new Set(wrongList(false));return shuffle(base.filter(q=>w.has(q.id))).concat(shuffle(base.filter(q=>!w.has(q.id))));}
  return shuffle(base);
}
