const BANK={"id":"ov-opencv","code":"CV","title":"OpenCV · 컴퓨터 비전 기초부터 객체 검출까지","subtitle":"이미지 데이터·색상 공간 · 필터링·모폴로지·윤곽선 · 비디오·객체 검출·DNN","course":"06 · 인텔 Physical AI · OpenVINO","source":"06-ai-openVino/OpenCV.pdf (요약판: OpenCV(비전모델만들기).pdf)","salt":"ov-opencv","version":1,"updated":"2026-10-15","tabs":[{"id":"t1","title":"컴퓨터 비전과 개발 환경","ref":"p.2–15","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"컴퓨터 비전의 정의로 가장 알맞은 것은?","o":["이미지에서 의미 있는 정보를 추출·해석","이미지 파일을 압축해 저장","사진을 꾸미는 편집 기술","3D 모델을 렌더링하는 기술"],"a":0,"h":"자료는 컴퓨터 비전을 '컴퓨터가 볼 수 있게 하는 기술'로 소개하며, 이미지나 비디오 같은 디지털 미디어에서 의미 있는 정보를 뽑아내 그 내용을 이해하고 해석하는 분야라고 정의합니다. 이미지를 만들거나 압축하는 일과 구분해 보세요.","w":"컴퓨터 비전은 이미지·비디오에서 의미 있는 정보를 추출하고 이해·해석하는 분야입니다. 압축·편집·렌더링은 비전의 목표가 아닙니다.","an":"컴퓨터 비전 개요 · p.4","src":"• 컴퓨터 비전은 말 그대로 컴퓨터가 볼 수 있게 하는 기술입니다.\n• 정의: 이미지나 비디오와 같은 디지털 미디어로부터 의미 있는 정보를 추출하고, 그 내용을 이해하고 해\n석하는 과학 및 기술 분야입니다.\n• 목표: 인간의 시각 시스템이 세상을 인식하는 것처럼, 기계가 시각 데이터를 인식, 처리, 분석하여 자율적\n인 의사 결정을 내릴 수 있도록 하는 것입니다."},{"id":"t1-02","ty":"mc","lv":1,"game":true,"p":"OpenCV의 핵심 기능은 어떤 언어로 구현되어 있나요?","o":["Python","Java","C/C++","JavaScript"],"a":2,"h":"Python에서 쓰지만, 속도가 빠른 이유는 내부 구현 언어에 있습니다.","w":"OpenCV는 C/C++로 작성되어 빠르며, Python·Java 등 여러 언어를 지원합니다. 특히 Python 연동이 뛰어납니다.","an":"OpenCV 정의·장점 · p.5, p.11","src":"• 오픈 소스 (Open Source): 누구나 무료로 사용할 수 있고, 방대한 커뮤니티의 지원을 받습니다.\n• 고성능 (High Performance): 핵심 기능은 C/C++로 구현되어 있어 속도가 빠르며, 다중 코어 프로\n세싱을 활용할 수 있습니다.\n• 광범위한 지원: 다양한 운영체제(Windows, Linux, macOS, Android, iOS) 및 프로그래밍 언어를 지\n원합니다."},{"id":"t1-03","ty":"mc","lv":2,"game":true,"p":"OpenCV와 CNN의 역할 분담에서 OpenCV가 맡는 일은?","o":["사물 분류와 패턴 학습","이미지 읽기·크기 조절 등 전처리","모델 가중치 학습","특징 추출 학습"],"a":1,"h":"역할 분담 표에서 OpenCV는 '조수', CNN/PyTorch는 '두뇌'에 비유됩니다. 조수는 인공지능이 이미지를 보기 전(전처리)에 이미지 읽기·크기 조절·색상 변환·노이즈 제거를 맡고, 두뇌는 패턴 학습과 분류(추론)를 맡습니다.","w":"OpenCV는 AI가 이미지를 보기 전의 읽기·크기 조절·색상 변환·노이즈 제거(전처리)를 맡고, CNN은 패턴 학습과 분류(추론)를 맡습니다.","an":"OpenCV와 CNN의 관계 · p.7","src":"구분 OpenCV (조수) CNN/PyTorch (두뇌)\n주요 역할 이미지 읽기, 크기 조절, 색상 변환, 노이즈 제거 이미지 속 패턴 학습, 사물 분류, 특징 추출\n작업 시점 인공지능이 이미지를 보기 전 (전처리) 인공지능이 이미지를 해석할 때 (추론)\n데이터 형태 NumPy 배열 (H, W, C) 텐서 (Tensor: C, H, W)"},{"id":"t1-04","ty":"mc","lv":2,"game":true,"p":"CNN/PyTorch가 다루는 텐서의 차원 순서는?","o":["(H, W, C)","(C, H, W)","(W, H, C)","(H, C, W)"],"a":1,"h":"OpenCV의 NumPy 배열은 (H, W, C)입니다. 텐서는 채널이 어디에 올까요?","w":"OpenCV 이미지는 NumPy 배열 (H, W, C), CNN 텐서는 (C, H, W)입니다. 그래서 모델에 넣기 전 차원 순서를 바꾸는 전처리가 필요합니다.","an":"OpenCV와 CNN의 관계 표 · p.7","src":"구분 OpenCV (조수) CNN/PyTorch (두뇌)\n주요 역할 이미지 읽기, 크기 조절, 색상 변환, 노이즈 제거 이미지 속 패턴 학습, 사물 분류, 특징 추출\n작업 시점 인공지능이 이미지를 보기 전 (전처리) 인공지능이 이미지를 해석할 때 (추론)\n데이터 형태 NumPy 배열 (H, W, C) 텐서 (Tensor: C, H, W)"},{"id":"t1-05","ty":"mc","lv":2,"game":true,"p":"무거운 딥러닝 프레임워크 없이 학습된 CNN 모델을 실행하게 해 주는 OpenCV 모듈은?","o":["cv2.ml","cv2.video","cv2.imgproc","cv2.dnn"],"a":3,"h":"최근 OpenCV에는 TensorFlow·PyTorch에서 이미 학습된 CNN 모델을 불러와 실행하는 모듈이 들어 있어, 무거운 딥러닝 프레임워크 없이도 간단한 AI 기능을 구현할 수 있습니다. 모듈 이름은 Deep Neural Network의 머리글자 소문자입니다.","w":"cv2.dnn 모듈은 TensorFlow·PyTorch 등에서 학습된 모델을 불러와 OpenCV만으로 실행할 수 있게 해 줍니다.","an":"OpenCV와 dnn 모듈 · p.9","src":"• 기술적 연결 고리: OpenCV의 dnn 모듈\n• 최근 OpenCV는 단순히 전처리만 하는 것을 넘어, 이미 학습된 CNN 모델(TensorFlow, PyTorch\n모델 등)을 불러와서 실행할 수 있는 cv2.dnn 모듈을 포함하고 있습니다. 덕분에 무거운 딥러\n닝 프레임워크 없이도 OpenCV만으로도 간단한 인공지능 기능을 구현할 수 있습니다."},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"Miniconda는 Python과 conda(환경 관리자)만 포함된 경량 버전이다.","a":true,"h":"Anaconda와 Miniconda 중 '가벼운' 쪽은 무엇을 포함할까요?","w":"맞습니다. Miniconda는 필요한 패키지만 설치해 환경을 깨끗하게 유지할 수 있고, Anaconda는 NumPy·Pandas 등이 포함된 종합 배포판입니다.","an":"개발 환경 설정 · p.12","src":"• Anaconda 또는 Miniconda 설치:\n• Anaconda: 데이터 과학에 필요한 대부분의 라이브러리(NumPy, Pandas 등)가 포함된 종합 배\n포판입니다. 초보자에게 편리합니다.\n• Miniconda: Python과 conda (환경 관리자)만 포함된 경량 버전입니다. 필요한 패키지만 설치\n하여 환경을 깨끗하게 유지할 수 있습니다."},{"id":"t1-07","ty":"ox","lv":2,"game":true,"p":"자료 기준으로 OpenCV 실습 환경에는 파이썬 3.13을 쓰는 것이 권장된다.","a":false,"h":"OpenCV 설치 페이지는 괄호 안에 파이썬 3.13까지는 지원하지 않는다고 적어 두었습니다. 이어지는 conda create 명령의 python= 뒤에 어떤 버전을 넣어 가상환경을 만드는지 확인해 보세요.","w":"틀렸습니다. 자료는 3.13까지는 지원하지 않는다고 안내하며, <code>conda create -n vision_env python=3.11<\/code>처럼 3.11을 사용합니다.","an":"OpenCV 라이브러리 설치 · p.14","src":"• OpenCV 설치 (파이썬 3.13까지는 지원을 안하고 있음) \n• conda create -n vision_env python=3.11 –y\n• conda activate vision_env"},{"id":"t1-08","ty":"match","lv":2,"game":false,"p":"컴퓨터 비전의 주요 작업과 설명을 연결하세요.","pairs":[["이미지 분류","이미지에 무엇이 있는지 식별"],["객체 검출","객체 위치를 사각형으로 표시"],["객체 추적","움직이는 객체의 경로를 따라감"],["이미지 분할","픽셀 단위로 객체 경계를 구분"]],"h":"무엇이(분류) · 어디에(검출) · 어디로(추적) · 정확한 경계(분할)","w":"분류는 '무엇', 검출은 '어디(박스)', 추적은 '시간에 따른 경로', 분할은 '픽셀 단위 경계'를 다룹니다.","an":"컴퓨터 비전 개요 · 주요 작업 · p.4","src":"• 주요 작업:\n• 이미지 분류 (Image Classification): 이미지에 무엇이 있는지 (예: \"고양이\" 또는 \"개\") 식별합니다.\n• 객체 검출 (Object Detection): 이미지 내에서 특정 객체의 위치를 사각형으로 표시합니다 (예: \"사\n람은 이 영역에 있어\").\n• 객체 추적 (Object Tracking): 비디오에서 움직이는 객체의 경로를 따라갑니다.\n• 이미지 분할 (Image Segmentation): 픽셀 단위로 객체의 경계를 정확히 구분합니다."},{"id":"t1-09","ty":"order","lv":2,"game":false,"p":"PowerShell에서 Conda 가상환경을 준비해 VS Code에 연결하는 순서를 맞추세요.","steps":["conda init powershell 실행","PowerShell 창을 닫았다가 다시 열기","conda create --name cv_env python=3.11","conda activate cv_env","VS Code에서 Python: Select Interpreter로 cv_env 선택"],"h":"init의 변경 사항은 창을 다시 열어야 적용됩니다. 만들기 → 켜기 → 연결 순서입니다.","w":"conda init 후 창을 다시 열어야 적용되고, 환경을 만든 뒤 활성화하고, 마지막으로 에디터에서 그 환경의 인터프리터를 선택합니다.","an":"PowerShell에서 Conda 환경 설정 · p.13, p.15","src":"• conda init powershell\n• 이 명령어를 실행한 후 PowerShell 창을 닫았다가 다시 열어야 변경 사항이 적용됩니다.\n• 가상환경 생성및 활성화 예시\n• Anaconda prompt 를 관리자 권한으로 작동시킨다 \n• conda create --name cv_env python=3.11\n• conda activate cv_env"},{"id":"t1-10","ty":"multi","lv":2,"game":true,"p":"자료가 든 OpenCV의 장점을 <b>모두<\/b> 고르세요.","o":["오픈 소스로 무료 사용","C/C++ 구현으로 빠른 속도","다양한 OS·언어 지원","모델 학습 기능 내장","유료 라이선스로 안정적"],"a":[0,1,2],"h":"자료의 장점은 '오픈 소스 · 고성능 · 광범위한 지원' 세 가지입니다.","w":"오픈 소스, 고성능(C/C++·다중 코어), 광범위한 OS·언어 지원이 장점입니다. OpenCV는 무료이며, DNN 모듈도 학습이 아니라 추론용입니다.","an":"OpenCV의 장점 · p.11","src":"• 오픈 소스 (Open Source): 누구나 무료로 사용할 수 있고, 방대한 커뮤니티의 지원을 받습니다.\n• 고성능 (High Performance): 핵심 기능은 C/C++로 구현되어 있어 속도가 빠르며, 다중 코어 프로\n세싱을 활용할 수 있습니다.\n• 광범위한 지원: 다양한 운영체제(Windows, Linux, macOS, Android, iOS) 및 프로그래밍 언어를 지\n원합니다."}]},{"id":"t2","title":"이미지 데이터 구조와 기본 함수","ref":"p.16–23","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"파이썬에서 OpenCV가 불러온 이미지는 어떤 형태인가요?","o":["NumPy ndarray","파이썬 리스트","Pandas DataFrame","PIL Image 객체"],"a":0,"h":"자료는 OpenCV가 파이썬에서 이미지를 불러오거나 처리하면 그 결과가 항상 특정 라이브러리의 N-차원 배열 형태가 된다고 설명합니다. 그래서 OpenCV 이미지를 다루는 것은 곧 그 배열을 다루는 것과 같습니다.","w":"OpenCV가 읽거나 처리한 결과는 항상 NumPy의 N차원 배열(ndarray)입니다.","an":"OpenCV의 데이터 구조 · p.17","src":"• OpenCV가 파이썬에서 이미지를 불러오거나 처리하면, 그 결과는 항상 NumPy의 N-차원 배열 \n(ndarray) 형태가 됩니다."},{"id":"t2-02","ty":"mc","lv":1,"game":true,"p":"512 × 512 컬러 이미지를 불러온 배열의 shape는?","o":["(512, 512)","(3, 512, 512)","(512, 512, 3)","(512, 3, 512)"],"a":2,"h":"컬러 이미지는 색을 표현하려고 여러 채널을 쓰므로 3차원 배열(행 × 열 × 채널 수)이 되고, 각 픽셀은 숫자 3개로 색을 표현합니다. 512 × 512 해상도라면 행과 열 뒤에 채널 수가 붙는 모양을 떠올려 보세요.","w":"컬러 이미지는 3차원 배열(행 × 열 × 채널)이라 (512, 512, 3)입니다. 흑백이면 (512, 512)입니다.","an":"OpenCV의 데이터 구조 · 컬러 이미지 · p.18","src":"• 컬러 이미지 (Color Image)\n• 컬러 이미지는 색상을 표현하기 위해 여러 개의 채널(Channel)을 사용합니다.\n• 차원: 3차원 배열 (행 X 열 X 채널 수).\n• 픽셀 값: 각 픽셀은 3개의 숫자 값으로 색상을 표현합니다.\n• OpenCV의 채널 순서 (BGR):OpenCV는 대부분의 경우 이미지를 Blue (파랑), Green (초록), \nRed (빨강) 순서의 3개 채널로 저장합니다. \n• (일반적인 웹/그래픽 환경의 RGB 순서와 다름에 주의해야 합니다.)\n• 예시: 512 X 512 해상도의 컬러 이미지 => (512, 512, 3) 크기의 3차원 배열."},{"id":"t2-03","ty":"mc","lv":1,"game":true,"p":"OpenCV가 컬러 이미지를 저장하는 기본 채널 순서는?","o":["RGB","BGR","GBR","HSV"],"a":1,"h":"OpenCV는 대부분의 경우 컬러 이미지를 파랑(Blue), 초록(Green), 빨강(Red) 순서의 3개 채널로 저장합니다. 자료는 이 순서가 일반적인 웹/그래픽 환경의 RGB 순서와 다르니 주의하라고 강조합니다.","w":"OpenCV는 Blue, Green, Red 순서(BGR)로 저장합니다. 일반적인 RGB와 반대 순서라 다른 라이브러리와 섞어 쓸 때 주의해야 합니다.","an":"OpenCV의 데이터 구조 · p.18","src":"• OpenCV의 채널 순서 (BGR):OpenCV는 대부분의 경우 이미지를 Blue (파랑), Green (초록), \nRed (빨강) 순서의 3개 채널로 저장합니다. \n• (일반적인 웹/그래픽 환경의 RGB 순서와 다름에 주의해야 합니다.)"},{"id":"t2-04","ty":"mc","lv":2,"game":true,"p":"<code>cv2.waitKey(0)<\/code>은 어떻게 동작하나요?","o":["키 입력을 무한 대기","0초 뒤 바로 종료","모든 창을 닫음","이미지를 저장"],"a":0,"h":"기본 이미지 조작 함수 표에서 cv2.waitKey(delay)는 키 입력을 기다리는 함수입니다. delay는 기다릴 시간(ms)이고, 표는 delay에 0을 넣었을 때의 특별한 동작을 따로 적어 둡니다.","w":"waitKey(delay)는 키 입력을 기다리며, delay가 0이면 무한 대기합니다. 창 닫기는 destroyAllWindows(), 저장은 imwrite()입니다.","an":"기본 이미지 조작 함수 · p.19","src":"대기 cv2.waitKey(delay) 키 입력을 대기합니다. delay가 0이면 무한 대기합니다.\n창 닫기 cv2.destroyAllWindows() 생성된 모든 이미지 창을 닫습니다."},{"id":"t2-05","ty":"num","lv":3,"game":false,"p":"너비 800 픽셀 배경의 가운데에 너비 500 픽셀 이미지를 놓으려면, 한쪽 여백은 몇 픽셀인가요?","a":150,"unit":"픽셀","h":"이미지를 배경 가운데에 놓으려면 남는 공간을 양쪽에 똑같이 나눠야 합니다. 계산식은 여백 = (배경 크기 − 출력할 이미지 크기) ÷ 2이며, 배경 너비 800과 이미지 너비 500을 넣어 계산합니다.","w":"(800 − 500) ÷ 2 = 150 픽셀입니다. 양쪽 여백이 같아야 이미지가 가운데에 놓입니다.","an":"양쪽에 여백 구하기 · p.23","src":"양쪽에 여백구하기\n• (배경크기 – 출력할이미지크기) /2"},{"id":"t2-06","ty":"ox","lv":1,"game":true,"p":"흑백 이미지의 픽셀 값은 0(검은색)부터 255(흰색)까지의 단일 숫자다.","a":true,"h":"흑백(그레이 스케일) 이미지는 밝기 정보만 가지는 2차원 배열(행 × 열)입니다. 각 픽셀 값은 검은색을 뜻하는 가장 작은 값부터 흰색을 뜻하는 가장 큰 값까지의 숫자 하나로 표현됩니다.","w":"맞습니다. 흑백 이미지는 2차원 배열이며 픽셀마다 0~255의 밝기 값 하나를 가집니다.","an":"OpenCV의 데이터 구조 · 흑백 이미지 · p.17","src":"• 흑백 이미지 (Gray Scale)\n• 흑백(그레이 스케일) 이미지는 밝기 정보만 가집니다. \n• 차원 : 2차원 배열 (행 X 열).\n• 픽셀 값: 0 (검은색)부터 255 (흰색)까지의 단일 숫자 값.\n• 예시: 512 X 512 해상도의 흑백 이미지 => (512, 512) 크기의 2차원 배열."},{"id":"t2-07","ty":"ox","lv":2,"game":true,"p":"해상도가 높을수록 이미지에 포함된 픽셀 수가 적다.","a":false,"h":"해상도는 이미지의 가로 픽셀 수와 세로 픽셀 수(예: 1920 × 1080)입니다. 자료는 해상도가 높을수록 포함된 픽셀 수와 이미지의 상세함이 어떻게 달라지는지 설명합니다.","w":"틀렸습니다. 해상도는 가로·세로 픽셀 수이며, 높을수록 픽셀이 많아 이미지가 상세해집니다.","an":"OpenCV 기본 구조 이해 · p.16","src":"• 컴퓨터 비전에서 이미지는 픽셀(Pixel)이라는 가장 작은 점들로 이루어진 격자(Grid)입니다.\n• 픽셀은 이미지를 구성하는 최소 단위이며, 각 픽셀은 밝기와 색상 정보를 숫자로 가지고 있습\n니다.\n• 해상도는 이미지의 가로 픽셀 수와 세로 픽셀 수 (예: 1920 X 1080). 해상도가 높을수록 더 많\n은 픽셀을 포함하며 이미지가 상세해집니다."},{"id":"t2-08","ty":"match","lv":1,"game":false,"p":"OpenCV 기본 함수와 기능을 연결하세요.","pairs":[["cv2.imread()","파일을 NumPy 배열로 읽기"],["cv2.imshow()","팝업 창에 이미지 표시"],["cv2.imwrite()","배열을 이미지 파일로 저장"],["cv2.destroyAllWindows()","생성된 모든 창 닫기"]],"h":"read · show · write · destroy — 함수 이름의 영어 동사를 보세요.","w":"imread는 읽기, imshow는 표시, imwrite는 저장, destroyAllWindows는 창 닫기입니다.","an":"기본 이미지 조작 함수 표 · p.19","src":"기능 OpenCV 함수 설명\n읽기 cv2.imread(filepath, flag) 이미지 파일을 불러와 NumPy 배열로 반환합니다. flag로 흑백/컬러 등을 지정할 수 있습니다.\n표시 cv2.imshow(winname, mat) 이미지를 팝업 창에 표시합니다.\n저장 cv2.imwrite(filepath, mat) NumPy 배열 형태의 이미지를 파일로 저장합니다.\n대기 cv2.waitKey(delay) 키 입력을 대기합니다. delay가 0이면 무한 대기합니다.\n창 닫기 cv2.destroyAllWindows() 생성된 모든 이미지 창을 닫습니다."},{"id":"t2-09","ty":"order","lv":1,"game":false,"p":"기본 예제(이미지 띄우기)의 실행 흐름을 순서대로 맞추세요.","steps":["cv2.imread()로 이미지 읽기","cv2.imshow()로 창에 표시","cv2.waitKey()로 키 입력 대기","cv2.destroyAllWindows()로 창 닫기"],"h":"이미지를 화면에 보여 주려면 먼저 파일을 배열로 읽어야 하고, 읽은 배열을 창에 표시합니다. 그다음 키 입력을 기다려야 창이 곧바로 꺼지지 않으며, 마지막으로 만든 모든 창을 닫습니다.","w":"읽기 → 표시 → 키 대기 → 창 닫기 순서입니다. waitKey가 없으면 창이 뜨자마자 프로그램이 끝납니다.","an":"기본 이미지 조작 함수 · 첫 번째 예제 · p.19–20","src":"기능 OpenCV 함수 설명\n읽기 cv2.imread(filepath, flag) 이미지 파일을 불러와 NumPy 배열로 반환합니다. flag로 흑백/컬러 등을 지정할 수 있습니다.\n표시 cv2.imshow(winname, mat) 이미지를 팝업 창에 표시합니다.\n저장 cv2.imwrite(filepath, mat) NumPy 배열 형태의 이미지를 파일로 저장합니다.\n대기 cv2.waitKey(delay) 키 입력을 대기합니다. delay가 0이면 무한 대기합니다.\n창 닫기 cv2.destroyAllWindows() 생성된 모든 이미지 창을 닫습니다."},{"id":"t2-10","ty":"multi","lv":2,"game":false,"p":"흑백(그레이 스케일) 이미지에 대한 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["2차원 배열(행 × 열)이다","밝기 정보만 가진다","픽셀마다 값이 3개다","512×512면 shape는 (512, 512)","채널 순서가 BGR이다"],"a":[0,1,3],"h":"흑백 이미지는 밝기 정보만 가지므로 채널이 하나뿐인 2차원 배열(행 × 열)이고, 픽셀 값은 0~255의 숫자 하나입니다. 512 × 512라면 shape에 채널 수가 붙지 않습니다. 숫자 3개와 BGR 순서는 컬러 이미지의 특징입니다.","w":"흑백 이미지는 밝기만 가진 2차원 배열이라 512×512면 (512, 512)입니다. 값 3개와 BGR 순서는 컬러 이미지의 특징입니다.","an":"OpenCV의 데이터 구조 · p.17–18","src":"• 흑백 이미지 (Gray Scale)\n• 흑백(그레이 스케일) 이미지는 밝기 정보만 가집니다. \n• 차원 : 2차원 배열 (행 X 열).\n• 픽셀 값: 0 (검은색)부터 255 (흰색)까지의 단일 숫자 값.\n• 예시: 512 X 512 해상도의 흑백 이미지 => (512, 512) 크기의 2차원 배열."}]},{"id":"t3","title":"픽셀·ROI·채널·산술 연산","ref":"p.24–33","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"컬러 이미지에서 좌표 (x, y)의 채널 c 값에 접근하는 인덱스는?","o":["img[x, y, c]","img[y, x, c]","img[c, y, x]","img[c, x, y]"],"a":1,"h":"OpenCV 이미지 배열은 행(높이) → 열(너비) → 채널 순서의 3차원 구조입니다. 행 번호는 세로 좌표 y, 열 번호는 가로 좌표 x에 해당하므로, 좌표를 (x, y)로 생각할 때 인덱스 안의 순서를 주의해서 배치해 보세요.","w":"배열은 행(y) → 열(x) → 채널 순서라 <code>img[y, x, c]<\/code>입니다. 좌표를 (x, y)로 생각하면 순서를 헷갈리기 쉽습니다.","an":"픽셀 접근 및 기본 조작 · p.24","src":"• 픽셀 값 접근 및 수정\n• 이미지 배열은 행(높이), 열(너비), 채널 순서의 3차원 구조를 갖습니다.\n• 컬러 이미지 (BGR): img[y, x, c]\n• 흑백 이미지 (Gray Scale): img[y, x]"},{"id":"t3-02","ty":"mc","lv":2,"game":true,"p":"픽셀을 다룰 때 자료가 권장하지 <b>않는<\/b> 방식은?","o":["NumPy 슬라이싱","OpenCV 함수 사용","for 루프로 픽셀 하나씩 순회","NumPy 벡터 연산"],"a":2,"h":"자료는 NumPy 배열 연산은 매우 빠르지만 반복문으로 픽셀을 하나씩 돌며 접근·수정하면 속도가 매우 느리다고 경고합니다. 대부분의 처리는 NumPy 슬라이싱이나 OpenCV/NumPy 함수로 하라고 권장합니다.","w":"for 루프로 픽셀을 하나씩 순회하면 매우 느립니다. 대부분의 처리는 NumPy 슬라이싱이나 OpenCV/NumPy 함수로 하는 것이 권장됩니다.","an":"픽셀 접근 및 기본 조작 · p.25","src":"• NumPy 배열 연산은 매우 빠르지만, 반복문(for 루프)을 사용하여 픽셀 하나하나를 순회하며 접근\n하고 수정하는 것은 속도가 매우 느립니다. 대부분의 이미지 처리는 NumPy 슬라이싱이나 \nOpenCV/NumPy 함수를 사용하는 것이 권장됩니다."},{"id":"t3-03","ty":"mc","lv":1,"game":true,"p":"이미지의 특정 직사각형 영역(ROI)을 잘라낼 때 쓰는 기능은?","o":["NumPy 배열 슬라이싱","cv2.split()","cv2.inRange()","cv2.merge()"],"a":0,"h":"ROI(관심 영역)는 이미지의 특정 직사각형 영역을 뽑거나 조작할 때 씁니다. 자료는 ROI가 별도 함수가 아니라 NumPy 배열의 기본 기능, 즉 img[y1:y2, x1:x2]처럼 범위를 잘라 내는 기능을 그대로 활용한다고 설명합니다.","w":"ROI는 NumPy 배열 슬라이싱(예: img[y1:y2, x1:x2])으로 추출합니다. split·merge는 채널, inRange는 색상 마스크용입니다.","an":"관심 영역(ROI) 설정 · p.26","src":"• 관심 영역 (ROI: Region of Interest) 설정\n• ROI는 이미지의 특정 직사각형 영역을 추출하거나 조작할 때 사용됩니다. 이는 NumPy의 배\n열 슬라이싱 기능을 그대로 활용합니다.\n• ROI 추출 및 복사 : 이미지의 일부를 잘라내어 새로운 변수(roi)에 저장합니다."},{"id":"t3-04","ty":"mc","lv":2,"game":true,"p":"컬러 이미지를 B, G, R 각각의 2차원 배열로 나누는 함수는?","o":["cv2.merge()","cv2.cvtColor()","cv2.inRange()","cv2.split()"],"a":3,"h":"함수 표에서 cvtColor는 색상 공간 변환, merge는 분리된 채널을 다시 3차원 컬러 이미지로 합치는 함수, inRange는 색 범위 마스크 함수입니다. 컬러 이미지를 B, G, R 2차원 배열로 '나누는' 함수의 영어 이름을 떠올려 보세요.","w":"cv2.split()은 채널을 분리하고, cv2.merge()는 분리된 채널을 다시 합칩니다.","an":"픽셀 접근 및 기본 조작 함수 표 · p.31","src":"cv2.cvtColor() 색상 공간 변환 BGR ->Gray, BGR->HSV 등 이미지의 색상 표현 방식을 변경합니다.\ncv2.split() 채널 분리 컬러 이미지를 B, G, R 등 개별 **2차원 배열(채널)**로 분리합니다.\ncv2.merge() 채널 재결합 분리된 2차원 채널들을 다시 3차원 컬러 이미지로 합칩니다.\ncv2.inRange() 색상 마스크 생성 특정 색상 범위(주로 HSV 공간)에 해당하는 픽셀만 추출하는 이진 마스크를 만듭니다."},{"id":"t3-05","ty":"mc","lv":3,"game":true,"p":"<code>img + 50<\/code> 대신 <code>cv2.add()<\/code>가 더 안전할 때가 있는 이유는?","o":["255를 넘지 않게 자동 처리","속도가 항상 더 빨라서","컬러에서만 동작해서","채널 순서를 바꿔 줘서"],"a":0,"h":"img + 50 같은 NumPy 연산자는 빠르지만, 결과가 0~255 범위를 넘으면 경고 없이 오버플로우될 수 있습니다. 반면 cv2.add()는 덧셈 결과의 픽셀 값을 범위 안으로 자동 처리하므로 밝기를 올릴 때 더 안전할 때가 있습니다.","w":"NumPy 연산은 0~255를 넘으면 경고 없이 오버플로우될 수 있지만, cv2.add()는 255를 넘지 않도록 자동 처리합니다.","an":"산술 및 비트 연산 · p.32","src":"cv2.add() 덧셈 연산 두 이미지 또는 이미지와 상수를 더해 밝기를 증가시킵니다. 픽셀 값이 255를 초과하지 않도록 자동 처리합니다.\ncv2.subtract() 뺄셈 연산 두 이미지 또는 이미지와 상수를 빼서 밝기를 감소시킵니다. 픽셀 값이 0 미만이 되지 않도록 자동 처리합니다.\ncv2.bitwise_and() 논리곱 연산 (마스킹) 원본 이미지와 마스크를 논리곱(AND)하여, 마스크 영역만 원본 이미지를 유지하도록 필터링합니다.\nNumPy 연산자 빠른 산술 연산\nimg + 50, img * 2와 같이 NumPy의 벡터화된 연산자를 사용하\n여 픽셀 값을 직접 조작합니다. (단, 0 ~255 범위를 초과할 경우 \n경고 없이 오버플로우될 수 있어 cv2함수가 더 안전할 때도 있\n습니다.)"},{"id":"t3-06","ty":"ox","lv":2,"game":true,"p":"OpenCV에서 픽셀을 순수한 빨간색으로 만들려면 [0, 0, 255]를 넣는다.","a":true,"h":"단일 픽셀 수정 예시는 모든 채널 값을 순수한 빨간색으로 설정하며, OpenCV는 [B, G, R] 순서라고 덧붙입니다. 빨강 채널이 리스트의 몇 번째 자리에 오는지 생각하면 순수한 빨간색의 값을 알 수 있습니다.","w":"맞습니다. BGR 순서라 빨간색은 [0, 0, 255]입니다. RGB 습관대로 [255, 0, 0]을 넣으면 파란색이 됩니다.","an":"픽셀 값 수정 · p.25","src":"• 단일 픽셀 값 수정 (Write)\n• 동일한 좌표의 모든 채널(BGR) 값을 순수한 빨간색으로 설정하는 예시입니다. (OpenCV는 BGR 순\n서: [B, G, R])"},{"id":"t3-07","ty":"ox","lv":2,"game":true,"p":"ROI를 다른 위치에 붙여넣을 때는 대상 영역과 ROI의 크기가 달라도 된다.","a":false,"h":"ROI를 이용한 붙여넣기는 추출한 ROI를 원본 이미지의 다른 위치에 복사하는 방법입니다. 자료는 이 방법에 크기 조건이 있다고 적어 두었으며, 배열 대입은 양쪽 모양이 맞아야 한다는 점을 떠올려 보세요.","w":"틀렸습니다. ROI 붙여넣기는 붙일 영역과 ROI의 크기가 같아야 합니다.","an":"ROI를 이용한 붙여넣기 · p.27","src":"• ROI를 이용한 붙여넣기 : 추출된 ROI를 원본 이미지의 다른 위치에 복사합니다. 이 방법은 이\n미지의 크기가 동일해야 합니다."},{"id":"t3-08","ty":"match","lv":2,"game":false,"p":"함수와 용도를 연결하세요.","pairs":[["cv2.cvtColor()","색상 공간 변환"],["cv2.merge()","분리된 채널을 재결합"],["cv2.inRange()","특정 색상 범위의 이진 마스크 생성"],["cv2.bitwise_and()","마스크 영역만 원본 유지"]],"h":"cvtColor는 BGR→Gray, BGR→HSV처럼 색 표현 방식을 바꾸고, merge는 분리된 채널을 다시 합칩니다. inRange는 특정 색 범위의 픽셀만 255로 뽑은 이진 마스크를 만들고, bitwise_and는 원본과 마스크를 논리곱해 마스크 영역만 남깁니다.","w":"cvtColor는 BGR→Gray/HSV 변환, merge는 채널 합치기, inRange는 색 범위 마스크, bitwise_and는 마스크 영역만 남기는 연산입니다.","an":"픽셀 접근 함수 · 산술 및 비트 연산 표 · p.31–32","src":"cv2.cvtColor() 색상 공간 변환 BGR ->Gray, BGR->HSV 등 이미지의 색상 표현 방식을 변경합니다.\ncv2.split() 채널 분리 컬러 이미지를 B, G, R 등 개별 **2차원 배열(채널)**로 분리합니다.\ncv2.merge() 채널 재결합 분리된 2차원 채널들을 다시 3차원 컬러 이미지로 합칩니다.\ncv2.inRange() 색상 마스크 생성 특정 색상 범위(주로 HSV 공간)에 해당하는 픽셀만 추출하는 이진 마스크를 만듭니다."},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"ROI로 이미지의 한 영역을 복사해 다른 곳에 붙이는 순서를 맞추세요.","steps":["복사할 영역의 y·x 범위 정하기","슬라이싱으로 ROI 추출해 변수에 저장","붙일 위치에 같은 크기 영역 지정","그 영역에 ROI 대입하기"],"h":"ROI 복사는 먼저 잘라 낼 영역의 y·x 범위를 정해 슬라이싱으로 추출하고 변수에 저장하는 것부터 시작합니다. 붙여넣을 때는 대상 위치에 ROI와 같은 크기의 영역을 지정한 뒤 그 영역에 ROI를 대입합니다.","w":"범위를 정해 ROI를 추출·저장한 뒤, 같은 크기의 대상 영역에 대입하면 복사가 끝납니다.","an":"관심 영역(ROI) · p.26–27","src":"• ROI를 이용한 붙여넣기 : 추출된 ROI를 원본 이미지의 다른 위치에 복사합니다. 이 방법은 이\n미지의 크기가 동일해야 합니다."},{"id":"t3-10","ty":"multi","lv":2,"game":true,"p":"<code>cv2.add()<\/code>·<code>cv2.subtract()<\/code>에 대한 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["add는 밝기를 높인다","subtract는 밝기를 낮춘다","subtract 결과는 0 미만이 되지 않는다","add 결과는 255를 넘을 수 있다","둘 다 흑백 이미지에만 쓴다"],"a":[0,1,2],"h":"cv2.add()는 이미지나 상수를 더해 밝기를 높이고 결과가 255를 넘지 않게, cv2.subtract()는 빼서 밝기를 낮추고 결과가 0 아래로 내려가지 않게 자동 처리합니다. 두 함수 모두 컬러 이미지에도 적용할 수 있습니다.","w":"add는 밝기 증가, subtract는 감소이며 각각 255 초과·0 미만이 되지 않도록 자동 처리합니다. 컬러 이미지에도 쓸 수 있습니다.","an":"산술 및 비트 연산 · p.32","src":"cv2.add() 덧셈 연산 두 이미지 또는 이미지와 상수를 더해 밝기를 증가시킵니다. 픽셀 값이 255를 초과하지 않도록 자동 처리합니다.\ncv2.subtract() 뺄셈 연산 두 이미지 또는 이미지와 상수를 빼서 밝기를 감소시킵니다. 픽셀 값이 0 미만이 되지 않도록 자동 처리합니다."}]},{"id":"t4","title":"도형·텍스트와 마우스 이벤트","ref":"p.34–45","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":true,"p":"이미지 위에 사각형을 그리는 함수는?","o":["cv2.line()","cv2.rectangle()","cv2.circle()","cv2.polylines()"],"a":1,"h":"도형 그리기 함수 표에는 선(line), 원(circle), 타원(ellipse), 다각형(polylines·fillPoly)과 함께 좌상단·우하단 좌표를 받는 함수가 있습니다. 객체 검출의 바운딩 박스를 그리는 이 함수는 '직사각형'을 뜻하는 영어 단어입니다.","w":"cv2.rectangle(이미지, 좌상단, 우하단, 색상, 두께)로 그립니다. 객체 검출 결과의 바운딩 박스도 이 함수로 그립니다.","an":"기본 도형 그리기 함수 표 · p.35","src":"함수 도형 매개변수\ncv2.line() 선 (시작 좌표, 끝 좌표, 색상, 두께)\ncv2.rectangle() 사각형 (좌상단 좌표, 우하단 좌표, 색상, 두께)\ncv2.circle() 원 (중심 좌표, 반지름, 색상, 두께)\ncv2.ellipse() 타원 (중심 좌표, 장축/단축 길이, 회전 각도, 시작 각도, 끝 각도, 색상, 두께)"},{"id":"t4-02","ty":"mc","lv":1,"game":true,"p":"이미지 위에 글자를 쓰는 함수는?","o":["cv2.putText()","cv2.writeText()","cv2.drawText()","cv2.imwrite()"],"a":0,"h":"텍스트 출력 함수는 (이미지, 텍스트, 시작 좌표, 폰트 종류, 폰트 크기, 색상, 두께)를 매개변수로 받습니다. 함수 이름은 텍스트를 이미지 위에 '놓는다'는 뜻의 동사와 Text를 붙인 것입니다.","w":"cv2.putText(이미지, 텍스트, 시작 좌표, 폰트, 크기, 색상, 두께)를 씁니다. imwrite는 파일 저장 함수입니다.","an":"텍스트 출력 함수 · p.35","src":"함수 용도 매개변수\ncv2.putText() 텍스트 출력 (이미지, 텍스트, 시작 좌표, 폰트 종류, 폰트 크기, 색상, 두께)"},{"id":"t4-03","ty":"mc","lv":2,"game":true,"p":"OpenCV의 그리기 함수는 원본 이미지에 어떤 영향을 주나요?","o":["새 이미지를 반환, 원본 유지","원본 NumPy 배열을 직접 수정","파일에 바로 저장","창에만 보이고 사라짐"],"a":1,"h":"자료는 OpenCV의 도형·텍스트 그리기가 디버깅과 검출 결과 시각화에 필수라고 설명하면서, 모든 그리기 작업이 원본 이미지의 NumPy 배열에 어떤 영향을 주는지 적어 둡니다. 원본을 보존하려면 복사본이 필요한 이유를 생각해 보세요.","w":"그리기 함수는 원본 이미지의 NumPy 배열을 직접 수정합니다. 원본을 보존하려면 복사본에 그려야 합니다.","an":"도형 그리기 및 텍스트 출력 · p.34","src":"• OpenCV는 이미지 위에 직접 도형을 그리거나 텍스트를 출력하는 기능을 제공합니다. 이는 디버깅, \n객체 검출 결과 시각화(바운딩 박스), 또는 사용자 인터페이스를 만드는 데 필수적입니다. 모든 그\n리기 작업은 원본 이미지의 NumPy 배열을 직접 수정합니다."},{"id":"t4-04","ty":"mc","lv":1,"game":true,"p":"마우스 이벤트가 발생하면 사용자 함수를 호출하도록 등록하는 함수는?","o":["cv2.namedWindow()","cv2.waitKey()","cv2.setMouseCallback()","cv2.imshow()"],"a":2,"h":"OpenCV 마우스 처리의 핵심은 이미지 창에서 마우스 동작(이벤트)이 생기면 미리 정의한 사용자 함수를 호출하도록 연결하는 것입니다. namedWindow는 창 이름만 정하며, 콜백 함수를 '설정(set)'하는 함수가 따로 있습니다.","w":"cv2.setMouseCallback('창 이름', 콜백_함수)로 등록합니다. namedWindow는 창 이름을 정하는 함수입니다.","an":"OpenCV 마우스 이벤트 처리 · p.38","src":"• OpenCV에서 마우스 이벤트를 처리하는 데 사용되는 핵심 함수는 콜백 함수를 등록하는 \ncv2.setMouseCallback() 함수입니다. 이 함수는 이미지 창에서 발생하는 다양한 마우스 동작(이벤\n트)을 감지하고, 해당 이벤트 발생 시 미리 정의된 사용자 함수를 호출하도록 연결해 줍니다.\n함수 용도 구문\ncv2.namedWindow() 창 이름 설정 cv2.namedWindow('창 이름')\ncv2.setMouseCallback() 이벤트 콜백 등록 cv2.setMouseCallback('창 이름', 콜백_함수)"},{"id":"t4-05","ty":"mc","lv":2,"game":true,"p":"마우스 콜백 함수에서 포인터의 현재 좌표를 알려주는 인자는?","o":["event","flags","param","x, y"],"a":3,"h":"콜백 함수는 def callback_function(event, x, y, flags, param) 형태로 정의합니다. event는 이벤트 종류, flags는 버튼·키 상태, param은 추가 데이터이고, 마우스 포인터의 현재 위치는 가로·세로 좌표 두 인자로 전달됩니다.","w":"x, y가 마우스 좌표, event는 이벤트 종류, flags는 버튼·키 상태, param은 추가 데이터입니다.","an":"콜백 함수의 구조 · p.41","src":"def callback_function(event, x, y, flags, param):\n# event: 발생한 마우스 이벤트의 종류 (아래 표 참고)\n# x, y: 마우스 포인터의 현재 좌표\n # flags: 마우스 버튼의 현재 상태 (예: Ctrl 키, Shift 키 등)\n# param: setMouseCallback호출 시 전달된 추가 데이터 (거의 사용 안 함)"},{"id":"t4-06","ty":"ox","lv":2,"game":true,"p":"콜백 함수는 개발자가 원할 때 직접 이름을 불러 호출하는 함수다.","a":false,"h":"콜백 함수는 개발자가 직접 실행하는 것이 아니라 이벤트가 생기거나 작업이 끝났을 때 시스템이나 다른 함수가 호출하는 함수입니다. 피자 가게 비유에서 번호를 부르는 쪽이 가게(시스템)라는 점을 떠올려 보세요.","w":"틀렸습니다. 콜백 함수는 이벤트가 발생했을 때 시스템이나 다른 함수가 호출합니다. 직접 부르는 것은 일반 함수 호출입니다.","an":"콜백 함수란 · p.39–40","src":"• 콜백함수는 개발자가 직접 함수를 실행하는 것이 아니라, 어떤 이벤트가 발생했거나 특정 작업이 \n끝났을 때 시스템이나 다른 함수에 의해 호출(Call)되는 함수를 말합니다.\n• 예시) 피자가게에서 피자를 주문했을때 \n• 내가 피자 가게에 직접 들어가서 피자가 다 됐는지 매분 매초 확인하는 것은 비효율적입니다.\n• 대신 \"피자가 다 구워지면 내 번호(콜백 함수)를 불러주세요(Call)\"라고 요청하고 나는 다른 일\n을 합니다.\n• 피자가 완성되면 가게(시스템)가 내 번호를 불러 피자를 건네줍니다."},{"id":"t4-07","ty":"ox","lv":1,"game":true,"p":"cv2.FONT_ITALIC은 기존 폰트에 이탤릭체를 더할 때 쓴다.","a":true,"h":"폰트 종류 목록에는 FONT_HERSHEY_SIMPLEX, DUPLEX, COMPLEX 같은 기본 폰트와 함께 FONT_ITALIC이 있습니다. 목록의 괄호 설명은 FONT_ITALIC을 기존 폰트와 어떻게 함께 쓰는지 알려 줍니다.","w":"맞습니다. FONT_HERSHEY_SIMPLEX 같은 기본 폰트에 FONT_ITALIC을 더해 기울임꼴을 만듭니다.","an":"폰트 종류 · p.36","src":"• cv2.FONT_HERSHEY_SIMPLEX\n• cv2.FONT_HERSHEY_DUPLEX\n• cv2.FONT_HERSHEY_COMPLEX\n• cv2.FONT_ITALIC (기존 폰트에 이탤릭체 추가)"},{"id":"t4-08","ty":"match","lv":1,"game":false,"p":"마우스 이벤트 상수와 의미를 연결하세요.","pairs":[["EVENT_LBUTTONDOWN","왼쪽 버튼을 누르는 순간"],["EVENT_LBUTTONUP","왼쪽 버튼을 놓는 순간"],["EVENT_MOUSEMOVE","마우스를 움직이는 동안"],["EVENT_LBUTTONDBLCLK","왼쪽 버튼 더블 클릭"]],"h":"DOWN 누름 · UP 놓음 · MOVE 이동 · DBLCLK 더블 클릭","w":"상수 이름의 끝부분(DOWN·UP·MOVE·DBLCLK)이 동작을 그대로 나타냅니다.","an":"주요 이벤트 상수 · p.43","src":"cv2.EVENT_LBUTTONDOWN 마우스 왼쪽 버튼을 누르는 순간\ncv2.EVENT_RBUTTONDOWN 마우스 오른쪽 버튼을 누르는 순간\ncv2.EVENT_MBUTTONDOWN 마우스 가운데 버튼을 누르는 순간\ncv2.EVENT_LBUTTONUP 마우스 왼쪽 버튼을 놓는 순간\ncv2.EVENT_MOUSEMOVE 마우스를 움직이는 동안\ncv2.EVENT_LBUTTONDBLCLK 마우스 왼쪽 버튼을 더블 클릭했을 때"},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"<code>setMouseCallback()<\/code>에 등록하는 콜백 함수의 인자를 정의 순서대로 맞추세요.","steps":["event","x","y","flags","param"],"h":"무슨 일(이벤트) → 어디서(좌표) → 어떤 상태(버튼·키) → 추가 데이터","w":"<code>def callback_function(event, x, y, flags, param)<\/code> 순서입니다. 항상 이 다섯 인자를 받도록 정의해야 합니다.","an":"콜백 함수의 구조 · p.41","src":"def callback_function(event, x, y, flags, param):\n# event: 발생한 마우스 이벤트의 종류 (아래 표 참고)\n# x, y: 마우스 포인터의 현재 좌표\n # flags: 마우스 버튼의 현재 상태 (예: Ctrl 키, Shift 키 등)\n# param: setMouseCallback호출 시 전달된 추가 데이터 (거의 사용 안 함)"},{"id":"t4-10","ty":"multi","lv":2,"game":true,"p":"마우스 플래그(flags)로 알 수 있는 상태를 <b>모두<\/b> 고르세요.","o":["Ctrl 키가 눌린 상태","Shift 키가 눌린 상태","왼쪽 버튼이 눌린 상태","마우스 휠 회전량","창의 크기"],"a":[0,1,2],"h":"마우스 플래그 상수는 EVENT_FLAG_ 뒤에 키나 버튼 이름이 붙어, 이벤트가 생긴 순간 Ctrl·Shift·Alt 키와 왼쪽·오른쪽·가운데 버튼이 눌린 상태를 알려 줍니다. 드래그 감지는 왼쪽 버튼 플래그로 합니다.","w":"플래그는 Ctrl·Shift·Alt 키와 왼쪽·오른쪽·가운데 버튼이 눌린 상태를 알려 줍니다. 드래그 감지에 EVENT_FLAG_LBUTTON을 씁니다.","an":"마우스 플래그 상수 · p.44","src":"cv2.EVENT_FLAG_CTRLKEY Ctrl 키가 눌린 상태\ncv2.EVENT_FLAG_SHIFTKEY Shift 키가 눌린 상태\ncv2.EVENT_FLAG_ALTKEY Alt 키가 눌린 상태\ncv2.EVENT_FLAG_LBUTTON 왼쪽 버튼이 눌린 상태 (드래그 감지)\ncv2.EVENT_FLAG_RBUTTON 오른쪽 버튼이 눌린 상태\ncv2.EVENT_FLAG_MBUTTON 가운데 버튼이 눌린 상태"}]},{"id":"t5","title":"색상 공간·임계 처리·마스크","ref":"p.46–66","qs":[{"id":"t5-01","ty":"mc","lv":2,"game":true,"p":"BGR 공간에서 '파란색만 찾기'가 어려운 이유는?","o":["색상과 밝기 정보가 섞여 있어서","채널이 1개뿐이라서","픽셀 값이 0~1이라서","해상도가 낮아서"],"a":0,"h":"BGR(RGB) 카메라는 빛의 삼원색을 합쳐 색을 표현하는데, 이때 '색상' 정보와 '밝기' 정보가 한 값에 함께 들어 있습니다. 그래서 같은 파란 옷도 그림자가 지거나 조명이 어두워지면 BGR 값 자체가 달라져 범위 지정이 어렵습니다.","w":"BGR은 색상과 밝기가 뒤섞여 있어 조명이 바뀌면 값이 크게 달라집니다. 그래서 색상을 분리한 HSV로 먼저 변환합니다.","an":"색상 공간과 임계 처리를 함께 다루는 이유 · p.47","src":"• RGB/BGR 공간의 한계 (왜 변환이 먼저 필요한가?)\n• 우리가 흔히 쓰는 BGR(또는 RGB) 카메라는 빛의 삼원색을 합쳐서 색을 표현합니다.\n• 문제점은 '색상(Color)' 정보와 '밝기(Brightness)' 정보가 뒤섞여 있다는 점입니다.\n• 예를 들어, 파란색 옷을 입고 있더라도 그림자가 지거나 조명이 어두워지면 BGR 값 자체가 완전히 \n달라집니다.\n• 이 상태에서 \"파란색만 찾아내라\"고 임계처리(범위 지정)를 하려고 하면, 조명 변화 때문에 인식이 \n엉망이 됩니다."},{"id":"t5-02","ty":"mc","lv":1,"game":true,"p":"HSV에서 H가 뜻하는 것은?","o":["명도(밝기)","채도","색상","대비"],"a":2,"h":"HSV는 색을 세 성분으로 나눈 색 공간입니다. H는 Hue, S는 Saturation(채도, 색의 순도), V는 Value(명도·밝기)의 머리글자이며, 그림자가 져도 비교적 일정하게 유지되는 성분이 H라는 점을 떠올려 보세요.","w":"H(Hue)는 색상, S(Saturation)는 채도, V(Value)는 명도입니다.","an":"BGR ↔ HSV · p.51","src":"• H (Hue): 색상 자체 (0° ~ 180°또는 0 ~ 255), 원래 360도, OpenCV에서는 180도를 사욧ㅇ\n• S (Saturation): 채도 (색의 순도)\n• V (Value): 명도/밝기"},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"OpenCV에서 H(색상) 값의 범위는?","o":["0~360","0~100","0~180","0~1"],"a":2,"h":"색상(Hue)은 원래 색상환의 각도로 0~360도를 씁니다. 하지만 OpenCV의 8비트 이미지는 0~255까지만 담을 수 있어서, 360도를 절반으로 줄인 범위를 H 값으로 사용합니다.","w":"색상은 원래 0~360도이지만 OpenCV(8비트)는 0~180을 사용합니다. 범위를 360 기준으로 잡으면 색을 못 찾습니다.","an":"BGR ↔ HSV · p.51","src":"• H (Hue): 색상 자체 (0° ~ 180°또는 0 ~ 255), 원래 360도, OpenCV에서는 180도를 사욧ㅇ"},{"id":"t5-04","ty":"mc","lv":2,"game":true,"p":"밝기가 부분적으로 크게 다를 때, 블록마다 기준값을 다르게 쓰는 임계 처리는?","o":["단순 임계 처리","적응형 임계 처리","오츠의 임계 처리","역 임계 처리"],"a":1,"h":"단순 임계 처리는 이미지 전체에 하나의 고정된 기준값을 적용하므로, 밝기가 부분마다 크게 다르면 잘 맞지 않습니다. 이미지를 작은 블록으로 나누어 블록마다 기준값을 다르게 정하는 방법은 '상황에 맞춘다'는 뜻의 이름을 가집니다.","w":"적응형 임계 처리(cv2.adaptiveThreshold)는 블록마다 기준값을 계산합니다. 단순 임계 처리는 전체에 하나의 기준값을 씁니다.","an":"적응형 임계 처리 · p.60","src":"• 적응형 임계 처리 (Adaptive Thresholding)\n• 이미지의 밝기가 부분적으로 크게 다를 때 유용합니다. 이미지 영역을 작은 블록으로 나누어 각 블\n록마다 기준값을 다르게 설정합니다."},{"id":"t5-05","ty":"mc","lv":3,"game":true,"p":"기준값을 직접 정하지 않고 히스토그램을 분석해 최적값을 자동으로 찾는 방법은?","o":["THRESH_BINARY","적응형 임계 처리","THRESH_BINARY_INV","오츠의 임계 처리"],"a":3,"h":"사용자가 기준값을 직접 정하지 않아도, 이미지의 히스토그램을 분석해 배경과 객체를 가장 잘 나누는 값을 자동으로 찾아 주는 임계 처리가 있습니다. 이 방법은 고안한 사람의 이름을 붙여 부릅니다.","w":"오츠(Otsu)의 임계 처리는 히스토그램으로 최적 기준값을 자동 계산합니다. THRESH_BINARY 계열은 기준값을 사용자가 정합니다.","an":"오츠의 임계 처리 · p.61","src":"• 오츠의 임계 처리 (Otsu's Thresholding)\n• 사용자가 기준값을 직접 지정할 필요 없이, 이미지의 히스토그램을 분석하여 배경과 객체를 가장 \n잘 분리할 수 있는 최적의 기준값을 자동으로 찾아 적용합니다."},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"이미지 마스크에서 흰색(255)은 '여기만 봐'라는 관심 영역을 뜻한다.","a":true,"h":"이미지 마스크는 0과 255 두 값만 가진 1채널 흑백 지도입니다. 한 색은 연산을 통과시키는 구멍으로 '여기만 봐(관심 영역)'를 뜻하고, 다른 색은 연산을 차단하는 가림막으로 '여기는 무시해(배경)'를 뜻합니다.","w":"맞습니다. 흰색(255)은 관심 영역, 검은색(0)은 무시할 배경입니다.","an":"이미지 마스크란 · p.54","src":"• 이미지 마스크의 2가지 핵심 색상\n• 마스크는 오직 두 가지 극단적인 값으로 이루어져 있습니다.\n• 하얀색 (255 또는 1): \"여기만 봐! (관심 영역)\" \n 연산을 통과시키는 구멍\n• 검은색 (0): \"여기는 무시해! (배경/제외 영역)\" \n 연산을 차단하는 가림막"},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"cv2.THRESH_BINARY_INV는 기준값보다 큰 픽셀을 255로 만든다.","a":false,"h":"cv2.THRESH_BINARY는 픽셀 값이 기준값보다 크면 maxval(255), 작거나 같으면 0으로 만듭니다. INV는 Inverse(반대)의 줄임말이므로, BINARY_INV에서 기준값보다 큰 픽셀이 어떤 값이 되는지 생각해 보세요.","w":"틀렸습니다. THRESH_BINARY가 큰 값을 255로 만들고, THRESH_BINARY_INV는 반대로 큰 값을 0, 작거나 같은 값을 255로 만듭니다.","an":"단순 임계 처리 · p.59","src":"• 주요 임계 처리 유형:\n• cv2.THRESH_BINARY: 픽셀 값이 기준값보다 크면 maxval(255), 작거나 같으면 0.\n• cv2.THRESH_BINARY_INV: 위와 반대 (크면 0, 작거나 같으면 255)."},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"임계 처리 방법과 특징을 연결하세요.","pairs":[["단순 임계 처리","이미지 전체에 고정 기준값 하나"],["적응형 임계 처리","블록마다 다른 기준값"],["오츠의 임계 처리","히스토그램으로 최적값 자동 계산"]],"h":"단순 임계 처리는 전체 이미지에 하나의 고정 기준값을 씁니다. 적응형 임계 처리는 이미지를 작은 블록으로 나누어 블록마다 기준값을 정하고, 오츠의 임계 처리는 히스토그램을 분석해 최적 기준값을 자동으로 찾습니다.","w":"단순은 하나의 고정값, 적응형은 블록별 기준값, 오츠는 히스토그램 기반 자동 기준값입니다.","an":"색상 공간 변환 및 임계 처리 · p.59–61","src":"• 1) 단순 임계 처리 (Simple Thresholding)\n• 전체 이미지에 하나의 고정된 기준값을 적용합니다.\n• 주요 임계 처리 유형:\n• cv2.THRESH_BINARY: 픽셀 값이 기준값보다 크면 maxval(255), 작거나 같으면 0.\n• cv2.THRESH_BINARY_INV: 위와 반대 (크면 0, 작거나 같으면 255)."},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"사진에서 파란 물체만 골라내는 처리 순서를 맞추세요.","steps":["BGR 이미지를 HSV로 변환","H·S·V 범위를 정해 cv2.inRange()로 마스크 생성","원본과 마스크를 bitwise_and로 합성","물체 영역만 남은 결과 확인"],"h":"색으로 물체를 고르려면 먼저 조명에 흔들리지 않는 색 기준이 필요하므로 BGR을 HSV로 바꿉니다. 그다음 H·S·V 범위로 inRange 이진 마스크를 만들고, 원본과 마스크를 bitwise_and로 합성해 물체 영역만 남깁니다.","w":"HSV로 조명에 강한 색상 기준을 만들고, inRange로 이진 마스크를 만든 뒤, AND 연산으로 마스크 영역만 남깁니다.","an":"함께 다루는 이유 · 정리 · 이미지 마스크 연산 · p.47–57","src":"• HSV 변환이 해결해 주는 역할 (1단계)\n• 색상(Hue), 채도(Saturation), 명도(Value)를 완전히 쪼개 놓은 공간입니다.\n• 그림자가 지거나 밝기가 변해도 색상(H) 값 자체는 비교적 일정하게 유지됩니다.\n• 즉, 컴퓨터가 \"아, 이건 조명에 상관없이 진짜 파란색이구나!\" 하고 판별할 수 있는 판을 깔아주는 역\n할을 합니다."},{"id":"t5-10","ty":"multi","lv":2,"game":true,"p":"<code>cv2.threshold(src, thresh, maxval, type)<\/code>에 대한 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["src는 흑백 이미지여야 한다","thresh는 기준값이다","maxval은 보통 255다","type은 블록 크기(홀수)다","결과는 HSV 이미지다"],"a":[0,1,2],"h":"cv2.threshold의 src는 입력 이미지로 반드시 Gray Scale이어야 하고, thresh는 기준값, maxval은 기준값을 넘었을 때 넣을 최댓값, type은 THRESH_BINARY 같은 처리 유형입니다. 블록 크기(blockSize)는 적응형 임계 처리 함수의 매개변수입니다.","w":"src는 반드시 Gray Scale, thresh는 기준값, maxval은 넘었을 때의 값(보통 255), type은 THRESH_BINARY 같은 유형입니다. 결과는 이진 이미지입니다.","an":"단순 임계 처리 함수 표 · p.59","src":"함수 cv2.threshold(src, thresh, maxval, type)\nsrc 입력 이미지 (반드시 Gray Scale이어야 함)\nthresh 기준값 (Threshold value)\nmaxval 기준값을 넘었을 때 할당할 최댓값 (보통 255)\ntype 임계 처리 유형 (예: cv2.THRESH_BINARY)"}]},{"id":"t6","title":"기하학적 변환","ref":"p.67–81","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"이미지 크기를 확대·축소하는 함수는?","o":["cv2.resize()","cv2.warpAffine()","cv2.flip()","cv2.getRotationMatrix2D()"],"a":0,"h":"크기 변환(Scaling)은 이미지를 확대하거나 축소하는 변환이며, 출력 크기 dsize나 배율 fx·fy, 보간법을 매개변수로 받습니다. 함수 이름은 크기(size)를 '다시(re-)' 정한다는 뜻입니다.","w":"cv2.resize(src, dsize, fx, fy, interpolation)로 크기를 바꿉니다. warpAffine은 행렬 기반 변환 적용 함수입니다.","an":"크기 변환 · p.74","src":"• 크기 변환 (Scaling) : 이미지의 크기를 확대하거나 축소합니다.\n• dsize (Desired Size): 변경하고자 하는 출력 크기 (튜플, 예: (가로, 세로))\n• fx, fy: 가로 및 세로 방향 스케일링 비율\n• interpolation (보간법): 픽셀 값을 채우는 방법 (이미지 품질 결정)\n• cv2.INTER_LINEAR (기본값): 속도가 빠르고 품질이 좋음 (축소/확대 시)\n• cv2.INTER_CUBIC: 품질이 가장 좋음 (주로 확대 시)\n• cv2.INTER_AREA: 축소 시 가장 좋은 결과를 보임\n함수 용도 구문\ncv2.resize() 이미지 크기 변경 cv2.resize(src, dsize, fx, fy, interpolation)"},{"id":"t6-02","ty":"mc","lv":2,"game":true,"p":"이미지를 <b>축소<\/b>할 때 가장 좋은 결과를 보이는 보간법은?","o":["INTER_LINEAR","INTER_CUBIC","INTER_AREA","INTER_NEAREST"],"a":2,"h":"보간법 목록에서 INTER_LINEAR는 빠르고 품질이 좋은 기본값, INTER_CUBIC은 주로 확대할 때 품질이 가장 좋은 방법입니다. 축소는 여러 픽셀을 하나로 합치는 일이므로 '면적'을 뜻하는 이름의 보간법이 가장 좋은 결과를 냅니다.","w":"INTER_AREA는 축소에 가장 좋고, INTER_CUBIC은 확대 품질이 가장 좋으며, INTER_LINEAR가 기본값입니다.","an":"크기 변환 · 보간법 · p.74","src":"• interpolation (보간법): 픽셀 값을 채우는 방법 (이미지 품질 결정)\n• cv2.INTER_LINEAR (기본값): 속도가 빠르고 품질이 좋음 (축소/확대 시)\n• cv2.INTER_CUBIC: 품질이 가장 좋음 (주로 확대 시)\n• cv2.INTER_AREA: 축소 시 가장 좋은 결과를 보임"},{"id":"t6-03","ty":"mc","lv":2,"game":true,"p":"이동 변환에 쓰는 변환 행렬 M의 크기는?","o":["2 × 2","2 × 3","3 × 3","4 × 4"],"a":1,"h":"이동 변환(Translation)은 이미지를 x축·y축 방향으로 평행하게 옮기며, 이동 거리를 담은 변환 행렬 M을 만들어 cv2.warpAffine(src, M, dsize)로 적용합니다. 자료는 이 행렬의 행과 열의 수를 함께 적어 둡니다.","w":"이동 거리를 담은 2 × 3 행렬 M을 만들어 cv2.warpAffine(src, M, dsize)로 적용합니다.","an":"이동 변환 · p.75","src":"• 이동 변환 (Translation)이미지를 x축과 y축 방향으로 평행하게 이동시킵니다.\n• 이동 거리를 정의하는 2 X 3 변환 행렬(M)을 사용합니다.\n함수 용도 구문\ncv2.warpAffine() 어파인 변환 적용 cv2.warpAffine(src, M, dsize)"},{"id":"t6-04","ty":"mc","lv":3,"game":true,"p":"원근 변환 행렬을 계산하려면 몇 쌍의 점이 필요한가요?","o":["2쌍","3쌍","4쌍","6쌍"],"a":2,"h":"어파인 변환은 원본 3점과 변환될 3점, 즉 3쌍의 점으로 변환 행렬을 계산합니다. 원근 변환은 깊이 정보까지 반영해 평행선이 소실점으로 모일 수 있으므로, 어파인보다 한 쌍 더 많은 점으로 행렬을 계산합니다.","w":"원근 변환은 4쌍의 점으로 cv2.getPerspectiveTransform()을 계산합니다. 어파인 변환은 3쌍입니다.","an":"원근 변환 · p.78","src":"• 원근 변환 (Perspective Transformation)\n• 이동, 회전, 크기 외에 깊이 정보를 반영하여 원근감이 있는 변환을 수행합니다. 직선은 직선으\n로 유지되지만, 평행선은 소실점(Vanishing Point)으로 수렴할 수 있습니다. (예: 평면 이미지를 \n3차원 공간에서 본 것처럼 변환)핵심: 4개의 쌍이 되는 점을 사용하여 변환 행렬($M$)을 계산\n합니다.\n함수 용도 구문\ncv2.getPerspectiveTransform() 원근 행렬 계산 cv2.getPerspectiveTransform(src_points, dst_points)"},{"id":"t6-05","ty":"num","lv":2,"game":false,"p":"640 × 480 이미지를 정중앙 기준으로 회전하려 합니다. 회전 중심 center의 x 좌표는?","a":320,"h":"회전 행렬은 cv2.getRotationMatrix2D(center, angle, scale)로 계산하며, 정중앙 기준 회전이면 center는 (w/2, h/2)입니다. 계산식은 중심 x = 이미지 너비 ÷ 2이고, 640 × 480에서 640이 너비입니다.","w":"중심은 (w/2, h/2)이므로 x = 640 ÷ 2 = 320, y = 480 ÷ 2 = 240입니다.","an":"회전 변환 · getRotationMatrix2D · p.76","src":"cv2.getRotationMatrix2D() 회전 행렬 계산 cv2.getRotationMatrix2D(center, angle, scale)\ncenter: 회전의 중심 좌표 (예: (w/2, h/2))\nangle: 회전 각도 (도 Degree, 양수는 반시\n계 방향)\nscale: 스케일링 비율 (1.0이면 크기 유지)"},{"id":"t6-06","ty":"ox","lv":2,"game":true,"p":"cv2.getRotationMatrix2D()의 angle이 양수이면 반시계 방향으로 회전한다.","a":true,"h":"getRotationMatrix2D(center, angle, scale)에서 angle은 회전 각도이며, 자료의 괄호 설명은 각도의 단위와 양수일 때의 회전 방향을 알려 줍니다. scale이 1.0이면 크기는 그대로 유지됩니다.","w":"맞습니다. angle은 도(Degree) 단위이며 양수는 반시계 방향입니다. scale이 1.0이면 크기는 유지됩니다.","an":"회전 변환 · p.76","src":"cv2.getRotationMatrix2D() 회전 행렬 계산 cv2.getRotationMatrix2D(center, angle, scale)\ncenter: 회전의 중심 좌표 (예: (w/2, h/2))\nangle: 회전 각도 (도 Degree, 양수는 반시\n계 방향)\nscale: 스케일링 비율 (1.0이면 크기 유지)"},{"id":"t6-07","ty":"ox","lv":2,"game":true,"p":"cv2.INTER_LINEAR는 확대할 때 품질이 가장 좋은 보간법이다.","a":false,"h":"보간법 목록에서 INTER_LINEAR는 기본값으로 속도가 빠르고 품질이 좋으며 축소·확대에 두루 씁니다. '품질이 가장 좋음(주로 확대 시)'이라고 설명된 보간법은 따로 있고, 축소에는 INTER_AREA가 가장 좋습니다.","w":"틀렸습니다. INTER_LINEAR는 빠르고 품질이 좋은 기본값이고, 확대 품질이 가장 좋은 것은 INTER_CUBIC입니다.","an":"크기 변환 · 보간법 · p.74","src":"• interpolation (보간법): 픽셀 값을 채우는 방법 (이미지 품질 결정)\n• cv2.INTER_LINEAR (기본값): 속도가 빠르고 품질이 좋음 (축소/확대 시)\n• cv2.INTER_CUBIC: 품질이 가장 좋음 (주로 확대 시)\n• cv2.INTER_AREA: 축소 시 가장 좋은 결과를 보임"},{"id":"t6-08","ty":"match","lv":2,"game":false,"p":"함수와 역할을 연결하세요.","pairs":[["cv2.getRotationMatrix2D()","회전 행렬 계산"],["cv2.getAffineTransform()","점 3쌍으로 어파인 행렬 계산"],["cv2.getPerspectiveTransform()","점 4쌍으로 원근 행렬 계산"],["cv2.warpPerspective()","원근 변환 적용"]],"h":"get으로 시작하는 함수는 변환 행렬을 '계산'하고, warp로 시작하는 함수는 그 행렬을 이미지에 '적용'합니다. 회전은 중심·각도·배율로, 어파인은 점 3쌍으로, 원근은 점 4쌍으로 행렬을 구합니다.","w":"get 함수들은 변환 행렬을 계산하고, warpAffine·warpPerspective가 그 행렬을 이미지에 적용합니다.","an":"기하학적 변환 · p.76–78","src":"• 원근 변환 (Perspective Transformation)\n• 이동, 회전, 크기 외에 깊이 정보를 반영하여 원근감이 있는 변환을 수행합니다. 직선은 직선으\n로 유지되지만, 평행선은 소실점(Vanishing Point)으로 수렴할 수 있습니다. (예: 평면 이미지를 \n3차원 공간에서 본 것처럼 변환)핵심: 4개의 쌍이 되는 점을 사용하여 변환 행렬($M$)을 계산\n합니다.\n함수 용도 구문\ncv2.getPerspectiveTransform() 원근 행렬 계산 cv2.getPerspectiveTransform(src_points, dst_points)\ncv2.warpPerspective() 변환 적용 cv2.warpPerspective(src, M, dsize)"},{"id":"t6-09","ty":"order","lv":2,"game":false,"p":"이미지를 중심 기준으로 회전시키는 순서를 맞추세요.","steps":["회전 중심 (w/2, h/2) 정하기","cv2.getRotationMatrix2D()로 회전 행렬 계산","cv2.warpAffine()으로 변환 적용","결과 이미지 확인"],"h":"회전은 먼저 회전 중심을 정해야 그 값으로 getRotationMatrix2D(center, angle, scale)를 호출해 회전 행렬을 계산할 수 있습니다. 행렬이 준비되면 warpAffine으로 이미지에 적용하고, 마지막으로 결과를 확인합니다.","w":"중심·각도·배율로 회전 행렬을 계산한 뒤 warpAffine으로 적용합니다.","an":"회전 변환 · p.76","src":"• 회전 변환 (Rotation)\n• 이미지를 특정 중심점을 기준으로 회전시킵니다.\n• 회전 행렬 계산: cv2.getRotationMatrix2D()\n• 변환 적용: cv2.warpAffine()\n함수 용도 구문\ncv2.getRotationMatrix2D() 회전 행렬 계산 cv2.getRotationMatrix2D(center, angle, scale)\ncenter: 회전의 중심 좌표 (예: (w/2, h/2))"},{"id":"t6-10","ty":"multi","lv":2,"game":true,"p":"<code>cv2.resize()<\/code>의 매개변수 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["dsize: 출력 크기 (가로, 세로)","fx, fy: 가로·세로 배율","interpolation: 보간법","M: 2 × 3 변환 행렬","center: 회전 중심 좌표"],"a":[0,1,2],"h":"cv2.resize(src, dsize, fx, fy, interpolation)는 출력 크기 dsize, 가로·세로 배율 fx·fy, 픽셀 값을 채우는 보간법 interpolation을 받습니다. 변환 행렬 M은 warpAffine, 회전 중심 center는 getRotationMatrix2D의 매개변수입니다.","w":"resize는 dsize, fx·fy, interpolation을 받습니다. M은 warpAffine, center는 getRotationMatrix2D의 매개변수입니다.","an":"크기 변환 · p.74","src":"• 크기 변환 (Scaling) : 이미지의 크기를 확대하거나 축소합니다.\n• dsize (Desired Size): 변경하고자 하는 출력 크기 (튜플, 예: (가로, 세로))\n• fx, fy: 가로 및 세로 방향 스케일링 비율\n• interpolation (보간법): 픽셀 값을 채우는 방법 (이미지 품질 결정)"}]},{"id":"t7","title":"필터링과 모폴로지","ref":"p.82–113","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"커널을 이미지 위에서 옮기며 겹친 값을 곱해 더해 새 픽셀 값을 만드는 연산은?","o":["컨볼루션","히스토그램","임계 처리","원근 변환"],"a":0,"h":"필터링은 주로 작은 행렬(커널, 예: 3 × 3)을 이미지의 각 픽셀에 겹쳐 놓고, 커널 값과 겹친 픽셀 값을 곱해 모두 더한 가중 평균을 새 픽셀 값으로 삼는 연산으로 수행됩니다. 이 연산은 '합성곱'이라고도 부릅니다.","w":"컨볼루션은 커널 값과 겹친 픽셀 값을 곱해 모두 더한 가중 평균을 새 픽셀 값으로 만듭니다.","an":"필터링 및 노이즈 제거 · 컨볼루션 · p.88","src":"• 컨볼루션(Convolution)의 이해\n• 컨볼루션은 이미지의 각 픽셀에 대해 주변 픽셀들을 함께 고려하여 새로운 픽셀 값을 결정하\n는 과정입니다.\n• 커널(Kernel) 또는 마스크(Mask): 컨볼루션 연산에 사용되는 작은 행렬(예: 3 X 3 또는 5 X 5)입\n니다. 커널의 값은 필터의 특성(블러링, 샤프닝 등)을 정의합니다.\n• 작동 방식: 커널을 이미지의 각 픽셀에 겹쳐 놓고, 커널의 값과 겹쳐진 이미지 픽셀 값을 곱한 \n후 모두 더하여(가중 평균) 출력 이미지의 새로운 픽셀 값으로 만듭니다."},{"id":"t7-02","ty":"mc","lv":2,"game":true,"p":"소금-후추 노이즈 제거에 특히 탁월한 필터는?","o":["평균 블러","가우시안 블러","미디언 블러","샤프닝"],"a":2,"h":"튀는 값(흰 점·검은 점)을 무시하려면 평균보다 '가운데 값'이 유리합니다.","w":"미디언 블러는 커널 안의 중앙값으로 대체하므로 소금-후추 노이즈 제거에 탁월합니다.","an":"미디언 필터 · p.90","src":"• 미디언 필터 (Median Blur)\n• 커널 영역 내 모든 픽셀 값 중 중앙값(Median)을 선택하여 중앙 픽셀을 대체합니다. 특히 소금\n-후추 노이즈(Salt-and-Pepper Noise) 제거에 탁월한 효과를 보입니다."},{"id":"t7-03","ty":"mc","lv":2,"game":true,"p":"중앙 픽셀에 더 높은 가중치를 두고 평균을 내는 필터는?","o":["평균 블러","가우시안 블러","미디언 블러","양방향 필터"],"a":1,"h":"평균 필터는 커널 영역의 단순 평균을 쓰지만, 이 필터는 커널 안 픽셀에 가중치를 두어 중앙 픽셀일수록 더 크게 반영합니다. 노이즈 제거 효과가 좋으면서 엣지 보존도 비교적 우수하며, 종 모양 정규분포에 붙은 수학자의 이름을 씁니다.","w":"가우시안 블러는 중앙에 가중치를 더 두어 노이즈를 줄이면서 엣지를 비교적 잘 보존합니다. 평균 블러는 단순 평균입니다.","an":"가우시안 필터 · p.89","src":"• 가우시안 필터 (Gaussian Blur)\n• 단순 평균과 달리, 커널 내의 픽셀에 가중치(중앙 픽셀에 더 높은 가중치)를 적용하여 평균\n을 계산합니다. 노이즈 제거 효과가 좋으면서도 엣지 보존 능력이 비교적 우수합니다."},{"id":"t7-04","ty":"mc","lv":2,"game":true,"p":"작은 흰색 노이즈를 없애고 외곽을 부드럽게 하는 '침식 후 팽창' 연산은?","o":["열림 (Opening)","닫힘 (Closing)","그라디언트","팽창 (Dilation)"],"a":0,"h":"복합 모폴로지 연산은 팽창과 침식을 조합합니다. 침식을 먼저 하면 작은 흰 노이즈가 깎여 사라지고, 이어서 팽창하면 남은 객체의 크기가 되돌아오면서 외곽이 부드러워집니다. 이 조합은 '열다'라는 뜻의 이름을 가집니다.","w":"열림은 침식 후 팽창으로 작은 흰 노이즈를 제거합니다. 닫힘은 팽창 후 침식으로 내부 구멍을 메웁니다.","an":"복합 모폴로지 연산 · p.105","src":"연산 조합 효과 함수\n열림 (Opening) 침식 후 팽창 작은 객체(흰색 노이즈)를 제거하고 객체의 외곽을 부드럽게 만듭니다. cv2.morphologyEx(src, cv2.MORPH_OPEN, kernel)"},{"id":"t7-05","ty":"mc","lv":3,"game":true,"p":"객체의 외곽선만 추출하는 모폴로지 그라디언트의 계산은?","o":["침식 − 팽창","팽창 − 침식","팽창 + 침식","원본 − 팽창"],"a":1,"h":"팽창은 객체 경계를 넓히고 침식은 경계를 줄입니다. 경계 찾기(Gradient)는 넓힌 결과와 줄인 결과의 차이를 구해, 두 모양이 겹치지 않는 테두리 부분만 남겨 외곽선을 추출합니다.","w":"그라디언트는 (팽창) − (침식)으로 객체의 외곽선(Edge)만 남깁니다.","an":"복합 모폴로지 연산 표 · p.105","src":"경계 찾기 (Gra\ndient) (팽창) - (침식) 객체의 외곽선(Edge)만을 추출합니다."},{"id":"t7-06","ty":"ox","lv":2,"game":true,"p":"cv2.medianBlur()의 커널 크기(ksize)는 반드시 홀수여야 한다.","a":true,"h":"미디언 필터는 커널 영역 안 모든 픽셀 값 중 가운데 값(중앙값)을 골라 중앙 픽셀을 바꿉니다. cv2.medianBlur(src, ksize)의 ksize 설명에는 커널 크기에 대한 조건이 괄호로 적혀 있으며, 가운데 칸이 정확히 하나 있어야 한다는 점을 떠올려 보세요.","w":"맞습니다. medianBlur의 ksize는 반드시 홀수입니다.","an":"미디언 필터 함수 · p.90","src":"• 미디언 필터 (Median Blur)\n• 커널 영역 내 모든 픽셀 값 중 중앙값(Median)을 선택하여 중앙 픽셀을 대체합니다. 특히 소금\n-후추 노이즈(Salt-and-Pepper Noise) 제거에 탁월한 효과를 보입니다.\n함수 cv2.GaussianBlur(src, ksize, sigmaX)\nsigmaX x 방향의 가우시안 표준 편차 (보통 0으로 설정하면 커널 크기로부터 자동 계산됨)\n함수 cv2.medianBlur(src, ksize)\nksize 커널의 크기 (반드시 홀수여야 함)"},{"id":"t7-07","ty":"ox","lv":2,"game":true,"p":"침식(Erosion)을 하면 객체가 커지고 내부의 작은 구멍이 메워진다.","a":false,"h":"침식은 구조 요소가 덮는 영역이 모두 흰색일 때만 중앙을 흰색으로 남기므로, 객체 경계가 수축(Shrink)합니다. 그 결과 객체 크기와 내부 구멍, 작은 흰 점 노이즈가 각각 어떻게 되는지 자료의 '효과' 항목에서 확인해 보세요.","w":"틀렸습니다. 침식은 객체를 수축시켜 작은 흰 노이즈를 지웁니다(내부 구멍은 커짐). 객체를 키우고 구멍을 메우는 것은 팽창입니다.","an":"침식 · 팽창 · p.101, p.103","src":"• 침식 (Erosion)\n• 원리: 구조 요소가 덮는 영역의 모든 픽셀이 흰색(255)일 때만 중앙 픽셀을 흰색으로 유지\n하고, 하나라도 검은색(0) 픽셀이 있으면 중앙 픽셀을 검은색(0) 으로 만듭니다.\n• 효과: 객체의 경계가 수축(Shrink)되어 객체 크기가 줄어듭니다. 객체 내부의 작은 구멍은 \n커지고, 작은 노이즈(흰색 점) 는 제거됩니다. 쓸데없는 점들 제거"},{"id":"t7-08","ty":"match","lv":2,"game":false,"p":"모폴로지 연산과 내용을 연결하세요.","pairs":[["침식 (Erosion)","경계 수축, 작은 흰 노이즈 제거"],["팽창 (Dilation)","경계 확장, 작은 구멍 메움"],["열림 (Opening)","침식 후 팽창"],["닫힘 (Closing)","팽창 후 침식"]],"h":"침식은 경계를 수축시켜 작은 흰 노이즈를 지우고, 팽창은 경계를 확장해 내부 작은 구멍을 메웁니다. 열림(Opening)은 깎은 뒤 키우고, 닫힘(Closing)은 키운 뒤 깎는 순서로 두 연산을 조합합니다.","w":"침식은 줄이고 팽창은 늘립니다. 열림=침식→팽창, 닫힘=팽창→침식입니다.","an":"모폴로지 연산 · p.101–105","src":"• 침식 (Erosion)\n• 원리: 구조 요소가 덮는 영역의 모든 픽셀이 흰색(255)일 때만 중앙 픽셀을 흰색으로 유지\n하고, 하나라도 검은색(0) 픽셀이 있으면 중앙 픽셀을 검은색(0) 으로 만듭니다.\n• 효과: 객체의 경계가 수축(Shrink)되어 객체 크기가 줄어듭니다. 객체 내부의 작은 구멍은 \n커지고, 작은 노이즈(흰색 점) 는 제거됩니다. 쓸데없는 점들 제거"},{"id":"t7-09","ty":"order","lv":3,"game":false,"p":"샤프닝(엣지 강조)이 이미지를 선명하게 만드는 원리를 순서대로 맞추세요.","steps":["원본 이미지를 블러링","원본에서 블러링 이미지를 빼 엣지 정보 얻기","그 차이를 원본에 다시 더하기","엣지가 강조된 선명한 이미지 완성"],"h":"샤프닝은 블러링과 반대로 엣지와 미세한 디테일을 강조합니다. 원본을 흐리게 만든 뒤, 원본에서 흐린 이미지를 빼면 엣지 정보만 남고, 그 차이를 원본에 다시 더하면 엣지가 강조된 선명한 이미지가 됩니다.","w":"원본에서 블러 이미지를 빼면 엣지 정보가 남고, 이를 원본에 더하면 엣지가 강조됩니다. cv2.filter2D()로 샤프닝 커널을 직접 적용할 수도 있습니다.","an":"엣지 강조 필터(샤프닝) · p.91","src":"• 엣지 강조 필터 (샤프닝: Sharpening)\n• 노이즈 제거 필터와 달리, 이미지의 엣지나 미세한 디테일을 강조하여 선명도를 높이는 필터입\n니다. \n• 작동 방식: 일반적으로 원본 이미지에서 블러링된 이미지를 뺀 후, 그 차이(엣지 정보)를 다시 \n원본 이미지에 더하여 엣지를 강조합니다. 이는 컨볼루션 연산을 통해 직접 구현될 수도 있습\n니다.커널 예시: 엣지를 강조하는 샤프닝 커널의 예입니다"},{"id":"t7-10","ty":"multi","lv":2,"game":true,"p":"구조 요소의 모양을 지정하는 상수를 <b>모두<\/b> 고르세요.","o":["cv2.MORPH_RECT","cv2.MORPH_ELLIPSE","cv2.MORPH_CROSS","cv2.MORPH_OPEN","cv2.MORPH_GRADIENT"],"a":[0,1,2],"h":"구조 요소(Structuring Element)는 모폴로지 연산의 결과를 결정하는 커널이며, cv2.getStructuringElement()로 모양과 크기를 정합니다. 모양 상수는 사각형·타원·십자형 세 가지이고, MORPH_OPEN 같은 상수는 morphologyEx의 연산 종류입니다.","w":"구조 요소 모양은 RECT(사각형)·ELLIPSE(타원)·CROSS(십자형)입니다. MORPH_OPEN·MORPH_GRADIENT는 morphologyEx의 연산 종류입니다.","an":"구조 요소 · p.100, p.105","src":"• 구조 요소 (Structuring Element)\n• 모폴로지 연산의 결과를 결정하는 커널(마스크)입니다.\n• 모양: cv2.MORPH_RECT (사각형), cv2.MORPH_ELLIPSE (타원), cv2.MORPH_CROSS (십자형)\n• 크기: (width, height) 튜플로 지정\n함수 용도 설명\ncv2.getStructuringElement() 구조 요소 생성 연산에 사용할 커널의 모양과 크기를 정의합니다"}]},{"id":"t8","title":"윤곽선·히스토그램·특징점","ref":"p.114–128","qs":[{"id":"t8-01","ty":"mc","lv":1,"game":true,"p":"가장 널리 쓰이며 노이즈에 강하고 얇은 엣지를 찾는 검출 알고리즘은?","o":["Canny","Harris","ORB","Otsu"],"a":0,"h":"엣지는 밝기 값이 급격히 변하는 지점이며 엣지 검출 필터로 찾습니다. 자료는 그중 가장 널리 쓰이고 효과적인 알고리즘이 노이즈에 강하고 얇고 정확한 엣지를 찾는다고 설명하며, 이 검출기는 개발자의 이름을 따서 부릅니다.","w":"Canny 엣지 검출기가 가장 널리 쓰입니다. Harris는 코너, ORB는 특징점, Otsu는 임계값 자동 계산입니다.","an":"경계선 검출 · p.114","src":"• 경계선 검출 (Edge Detection)\n• 경계선(Edge)은 이미지의 밝기 값(픽셀 값)이 급격하게 변하는 지점을 의미하며, 이는 엣지 검\n출 필터(커널)를 사용하여 찾습니다.\n• Canny 엣지 검출기 (Canny Edge Detector)\n• Canny는 가장 널리 사용되고 효과적인 엣지 검출 알고리즘입니다. 노이즈에 강하고 얇고 정확\n한 엣지를 검출합니다. 흑백이미지에서 더 잘됨"},{"id":"t8-02","ty":"mc","lv":2,"game":true,"p":"<code>cv2.findContours()<\/code>에서 가장 바깥쪽 윤곽선만 검출하는 mode는?","o":["RETR_LIST","RETR_EXTERNAL","CHAIN_APPROX_SIMPLE","RETR_TREE"],"a":1,"h":"cv2.findContours(image, mode, method)에서 mode는 윤곽선을 찾는 방법, method는 윤곽선을 저장하는 방법입니다. 자료의 mode 예시는 가장 바깥쪽 윤곽선만 검출하는 상수로, RETR_ 뒤에 '외부'를 뜻하는 영어 단어가 붙습니다.","w":"RETR_EXTERNAL은 가장 바깥 윤곽선만 찾습니다. CHAIN_APPROX_SIMPLE은 mode가 아니라 저장 방법(method)입니다.","an":"윤곽선 검출 · p.116","src":"함수 cv2.findContours(image, mode, method)\nmode 윤곽선을 찾는 방법 (예: cv2.RETR_EXTERNAL -가장 바깥쪽 윤곽선만 검출)\nmethod 윤곽선을 저장하는 방법 (예: cv2.CHAIN_APPROX_SIMPLE - 중요한 점만 저장하여 메모리 절약)"},{"id":"t8-03","ty":"mc","lv":2,"game":true,"p":"<code>cv2.drawContours()<\/code>에서 contourIdx를 -1로 주면?","o":["모든 윤곽선을 그린다","첫 윤곽선만 그린다","마지막 윤곽선만 그린다","아무것도 그리지 않는다"],"a":0,"h":"cv2.drawContours(image, contours, contourIdx, color, thickness)의 contourIdx는 findContours가 반환한 윤곽선 리스트에서 그릴 윤곽선의 인덱스입니다. 자료는 특정 번호 대신 -1을 넣었을 때의 의미를 괄호로 적어 둡니다.","w":"contourIdx가 -1이면 findContours가 반환한 모든 윤곽선을 그립니다.","an":"윤곽선 그리기 · p.117","src":"함수 cv2.drawContours(image, contours, contourIdx, color, thickness)\ncontours findContours에서 반환된 윤곽선 리스트\ncontourIdx 그릴 윤곽선의 인덱스 (-1이면 모든 윤곽선)"},{"id":"t8-04","ty":"mc","lv":2,"game":true,"p":"히스토그램이 왼쪽(0)에 치우쳐 있는 이미지는?","o":["전반적으로 밝은 이미지","대비가 좋은 이미지","전반적으로 어두운 이미지","채도가 높은 이미지"],"a":2,"h":"히스토그램의 가로축은 밝기 레벨 0~255이고, 0은 검은색, 255는 흰색 쪽입니다. 그래프가 왼쪽(0)에 몰려 있다면 픽셀 대부분이 어떤 밝기 영역에 있는지, 그리고 그런 사진의 전체 인상이 어떨지 생각해 보세요.","w":"왼쪽 치우침은 어두운 영역이 많은 어두운 이미지, 오른쪽 치우침은 밝은 이미지, 넓게 퍼지면 대비가 좋은 이미지입니다.","an":"히스토그램 해석 예시 · p.121","src":"• 히스토그램 해석 예시\n분포 형태 이미지 특성\n왼쪽(0)에 치우침 어두운 영역(그림자)이 많고, 전반적으로 어두운 이미지 (명암 대비 낮음)\n오른쪽(255)에 치우침 밝은 영역(하이라이트)이 많고, 전반적으로 밝은 이미지 (명암 대비 낮음)\n전체적으로 넓게 분포 명암 대비가 좋고, 다양한 밝기를 포함하는 이미지"},{"id":"t8-05","ty":"mc","lv":3,"game":true,"p":"SIFT·SURF의 느린 속도와 특허 문제를 해결해 상업적으로도 자유롭게 쓸 수 있는 알고리즘은?","o":["Harris","SURF","DoG","ORB"],"a":3,"h":"SIFT는 크기와 회전에 강인하지만, SIFT와 SURF는 속도가 느리고 특허 문제가 있었습니다. 이 단점을 해결하려고 만든 알고리즘은 매우 빠르고 상업적으로 자유롭게 쓸 수 있으며, cv2.ORB_create()로 생성합니다.","w":"ORB(Oriented FAST and Rotated BRIEF)는 매우 빠르고 상업적으로 자유롭게 쓸 수 있습니다. 회전·밝기 변화에도 어느 정도 강인합니다.","an":"특징점 검출 알고리즘 · p.127","src":"• 3) ORB (Oriented FAST and Rotated BRIEF)\n• SIFT와 SURF의 단점인 느린 속도와 특허 문제를 해결하기 위해 개발된 알고리즘입니다.\n• 특징: 속도가 매우 빠르며 SIFT만큼은 아니지만 회전과 밝기 변화에 어느 정도 강인합니다. 상업적으로도 자유롭게 사\n용할 수 있습니다.\n• 함수: cv2.ORB_create()"},{"id":"t8-06","ty":"ox","lv":2,"game":true,"p":"cv2.equalizeHist()는 컬러 이미지에 바로 적용할 수 있다.","a":false,"h":"히스토그램 평활화는 한쪽에 몰린 픽셀 값을 0~255 전체에 고르게 퍼뜨려 대비를 높입니다. cv2.equalizeHist(src)의 설명은 이 함수가 어떤 이미지용인지, 그리고 컬러 이미지에는 어떤 처리를 먼저 해야 하는지 괄호로 적어 둡니다.","w":"틀렸습니다. equalizeHist()는 흑백 이미지용이라 컬러 이미지는 흑백으로 변환한 뒤 적용해야 합니다.","an":"히스토그램 평활화 · p.123","src":"• 히스토그램 평활화 (Equalization)\n• 히스토그램 평활화는 이미지의 대비(Contrast)를 개선하는 데 사용됩니다.\n• 목표: 픽셀 값이 특정 범위에 몰려 있는 이미지를 전체 범위(0~255)에 고르게 퍼지도록 재분\n배하여 대비를 높입니다.\n• 효과: 어둡거나 밝아 대비가 낮은 이미지를 더 보기 좋게 개선합니다.\n함수 cv2.equalizeHist()\ncv2.equalizeHist(src) 흑백 이미지의 히스토그램을 평활화하여 대비를 개선합니다. (컬러 이미지에는 바로 적용할 수 없으며, 흑백 변환 후 적용해야 함)"},{"id":"t8-07","ty":"ox","lv":1,"game":true,"p":"SIFT는 특징점 주변의 밝기 분포를 128차원 벡터(기술자)로 표현한다.","a":true,"h":"SIFT의 원리는 스케일 공간 생성 → DoG로 특징점 검출 → 기술자(Descriptor) 생성의 세 단계입니다. 기술자 생성 단계에서는 특징점 주변 영역의 밝기 분포를 분석해 정해진 차원 수의 벡터로 변환합니다.","w":"맞습니다. SIFT는 크기·회전에 강인하며, 특징점 주변을 128차원 벡터 기술자로 변환합니다.","an":"SIFT · p.127","src":"• 2) SIFT (Scale-Invariant Feature Transform)\n• 가장 유명하고 강력한 특징점 알고리즘 중 하나입니다.\n• 특징: 이미지의 크기 변화(Scale)와 회전(Rotation)에 모두 강인합니다. (즉, 객체를 멀리서 보거나 기울여서 봐도 같은 \n특징점을 찾습니다.)\n• 원리:\n• 스케일 공간 생성: 여러 크기의 가우시안 블러를 적용한 이미지 피라미드를 만들어 크기 변화를 처리합니다.\n• 특징점 검출: 각 스케일 공간에서 DoG(Difference of Gaussians)를 사용하여 극값(Maxima/Minima)을 찾습니다.\n• 기술자(Descriptor) 생성: 특징점 주변 영역의 밝기 분포를 분석하여 128차원의 벡터로 변환합니다."},{"id":"t8-08","ty":"match","lv":2,"game":false,"p":"함수와 용도를 연결하세요.","pairs":[["cv2.calcHist()","히스토그램 계산"],["cv2.equalizeHist()","평활화로 대비 개선"],["cv2.compareHist()","두 히스토그램의 유사도 계산"],["cv2.cornerHarris()","코너 검출"]],"h":"히스토그램 함수는 이름의 동사로 구분됩니다. calc는 계산, equalize는 고르게 펴서 대비를 개선, compare는 두 히스토그램의 유사도 비교입니다. corner로 시작하는 함수는 Harris 방식으로 모서리를 찾는 함수입니다.","w":"calcHist는 계산, equalizeHist는 대비 개선, compareHist는 이미지 유사도 비교, cornerHarris는 Harris 코너 검출입니다.","an":"히스토그램 분석 · 특징점 검출 · p.120–126","src":"• 둘째, 히스토그램 평활화(Equalization)로 대비를 개선하는 데 씁니다. cv2.equalizeHist()나 지역별로 더 \n정교하게 처리하는 cv2.createCLAHE()가 이 히스토그램 분포를 넓게 펴서 흐릿하고 밋밋한 이미지를 선\n명하게 만들어줍니다.\n• 셋째, 두 이미지가 얼마나 비슷한지 비교하는 데 씁니다. cv2.compareHist()로 두 히스토그램의 유사도를 \n계산해서, 색감이나 밝기 분포가 비슷한 이미지를 찾는 이미지 검색·분류 작업에 활용됩니다."},{"id":"t8-09","ty":"order","lv":2,"game":false,"p":"Canny 엣지 검출기의 4단계를 순서대로 맞추세요.","steps":["가우시안 필터로 노이즈 제거","Sobel 등으로 밝기 변화율(경도) 계산","비최대 억제로 엣지를 1픽셀 두께로","히스테리시스 임계 처리로 최종 엣지 결정"],"h":"Canny 검출은 먼저 가우시안 필터로 노이즈를 줄여야 잘못된 엣지를 피할 수 있습니다. 그다음 Sobel 등으로 밝기 변화율과 방향을 계산하고, 비최대 억제로 엣지를 1픽셀 두께로 얇게 만든 뒤, 상·하위 두 임계값으로 최종 엣지를 결정합니다.","w":"노이즈 제거 → 경도 계산 → 비최대 억제 → 히스테리시스 임계 처리(상·하위 임계값) 순서입니다.","an":"Canny 엣지 검출기 단계 표 · p.115","src":"• Canny 엣지 검출기 (Canny Edge Detector)\n• 단계 설명\n1단계 노이즈 제거: 가우시안 필터로 이미지의 노이즈를 제거합니다.\n2단계 경도 계산: Sobel 필터 등을 사용하여 이미지의 밝기 변화율(Gradient)과 방향을 계산합니다.\n3단계 비최대 억제 (Non-Maximum Suppression): 엣지의 폭을 1픽셀로 줄여 얇은 엣지를 만듭니다.\n4단계 히스테리시스 임계 처리 (Hysteresis Thresholding): 두 개의 임계값(상위/하위)을 사용하여 최종 엣지를 연결하고 결정합니다."},{"id":"t8-10","ty":"multi","lv":2,"game":true,"p":"이상적인 특징점이 가져야 할 속성을 <b>모두<\/b> 고르세요.","o":["반복성 (Repeatability)","지역성 (Locality)","독특성 (Distinctiveness)","대칭성 (Symmetry)","단색성 (Monochrome)"],"a":[0,1,2],"h":"특징점은 주변과 구별되는 독특한 패턴을 가진 작은 영역입니다. 자료는 이상적인 특징점의 세 속성으로 크기·시점이 바뀌어도 다시 검출되는 성질, 작은 영역에서 계산되는 성질, 다른 특징점과 쉽게 구별되는 성질을 듭니다.","w":"특징점은 반복성·지역성·독특성을 가져야 합니다. 그래서 객체 인식, 이미지 정합, 3D 복원에 쓰입니다.","an":"특징점의 정의 · p.125","src":"• 특징점은 주변 픽셀과 구별되는 독특한 패턴을 갖는 이미지의 작은 영역입니다. 이상적인 특징점은 \n다음과 같은 속성을 가져야 합니다.\n• 반복성 (Repeatability): 이미지의 크기나 시점(Viewpoint)이 바뀌어도 다시 검출되어야 합니다.\n• 지역성 (Locality): 비교적 작은 영역에서 계산되어야 합니다.\n• 독특성 (Distinctiveness): 다른 특징점과 쉽게 구별될 수 있어야 합니다."}]},{"id":"t9","title":"비디오·추적·객체 검출과 DNN","ref":"p.129–163","qs":[{"id":"t9-01","ty":"mc","lv":1,"game":true,"p":"<code>VideoCapture<\/code>의 <code>.read()<\/code>가 반환하는 것은?","o":["ret(성공 여부)과 frame","frame 하나만","FPS와 코덱","파일 경로"],"a":0,"h":"VideoCapture는 카메라나 비디오 파일에서 프레임을 읽어 오는 객체이며, .read()는 프레임을 하나 읽습니다. 표 설명에 따르면 이 메서드는 읽기에 성공했는지를 True/False로 알려 주는 값과 읽어 온 이미지, 두 가지를 함께 돌려줍니다.","w":".read()는 ret(True/False)와 frame(이미지)을 반환합니다. 비디오는 프레임의 연속이라 매 프레임에 이미지 처리를 반복합니다.","an":"비디오 스트림 처리 · p.131","src":".read() 프레임 읽기 ret (성공 여부, True/False)와 frame (읽어온 이미지)을 반환합니다.\n.isOpened() 연결 확인 비디오 소스가 성공적으로 열렸는지 확인합니다.\n.release() 소스 해제 비디오 캡처 객체를 해제하여 카메라나 파일을 닫습니다."},{"id":"t9-02","ty":"mc","lv":2,"game":false,"p":"조명 변화와 배경의 작은 움직임에 강한 배경 모델을 만드는 함수는?","o":["cv2.absdiff()","cv2.createBackgroundSubtractorMOG2()","cv2.VideoWriter()","cv2.CascadeClassifier()"],"a":1,"h":"단순 프레임 차분은 카메라가 조금만 움직이거나 그림자가 바뀌어도 민감하게 반응합니다. 배경 모델링 방식은 미리 배경 모델을 만들어 현재 프레임과 비교하는데, OpenCV는 가우시안 혼합 모델(MOG2) 기반의 배경 차분기 생성 함수를 제공합니다.","w":"createBackgroundSubtractorMOG2()는 가우시안 혼합 모델로 배경을 만들고, .apply(frame)이 움직이는 전경 마스크를 돌려줍니다.","an":"배경 차분 · p.135","src":"• 배경 모델링을 통한 차분 (Background Modeling)\n• 원리: 고정된 배경 모델을 미리 구축하고, 현재 프레임과 이 배경 모델을 비교하여 움직이는 전경\n(Foreground) 객체만 분리합니다.\n• OpenCV 함수:\n• cv2.createBackgroundSubtractorMOG2(): 가우시안 혼합 모델(MOG2) 기반으로, 조명 변화나 \n배경의 작은 움직임에 더 강인한 배경 모델을 생성합니다.\n• .apply(frame): 현재 프레임에서 배경을 제거하여 움직이는 객체만 포함된 마스크(Mask)를 반\n환합니다."},{"id":"t9-03","ty":"mc","lv":2,"game":true,"p":"Haar 캐스케이드 분류기로 이미지에서 객체를 검출해 바운딩 박스 리스트를 돌려주는 메서드는?","o":["cv2.dnn.readNet()","cv2.dnn.blobFromImage()","net.forward()",".detectMultiScale()"],"a":3,"h":"Haar 캐스케이드는 cv2.CascadeClassifier()로 학습된 XML 파일을 불러와 분류기 객체를 만든 뒤, 그 객체의 메서드로 이미지에서 객체를 찾아 바운딩 박스 리스트를 돌려받습니다. 메서드 이름은 여러(Multi) 크기(Scale)로 검출(detect)한다는 뜻입니다.","w":"CascadeClassifier로 XML을 로드한 뒤 .detectMultiScale()로 검출합니다. readNet·blobFromImage·forward는 DNN 모듈 함수입니다.","an":"전통적인 검출 기법(하르 캐스케이드) · p.139","src":"• OpenCV 함수:\n• cv2.CascadeClassifier(): 학습된 Haar 캐스케이드 XML 파일을 로드하여 분류기 객체를 생성합\n니다.\n• .detectMultiScale(): 이미지에서 객체를 검출하고, 검출된 객체의 바운딩 박스 리스트를 반환합\n니다."},{"id":"t9-04","ty":"mc","lv":2,"game":true,"p":"YOLOv8 같은 PyTorch 모델을 ONNX로 내보낸 뒤 OpenCV에서 불러오는 함수는?","o":["readNetFromDarknet()","readNetFromONNX()","CascadeClassifier()","blobFromImage()"],"a":1,"h":"YOLOv3/v4는 .cfg와 .weights 파일을 readNetFromDarknet()으로 읽습니다. YOLOv5/v8 같은 PyTorch 기반 모델은 먼저 범용 교환 형식(Open Neural Network Exchange)으로 내보낸 뒤, 그 형식 이름이 붙은 cv2.dnn 함수로 불러옵니다.","w":"YOLOv5·v8은 ONNX로 내보낸 뒤 cv2.dnn.readNetFromONNX()로 불러옵니다. readNetFromDarknet은 YOLOv3·v4(.cfg/.weights)용입니다.","an":"YOLO 시리즈 · p.143","src":"• YOLOv3 / YOLOv4 (Darknet 프레임워크 기반)\n• OpenCV 연동: .cfg(구조)와 .weights(가중치) 파일을 cv2.dnn.readNetFromDarknet()으로 바로 읽어와 구현할 수 \n있어 OpenCV 교재나 강의에서 가장 많이 다루어졌습니다.\n• YOLOv5 / YOLOv8 등 최신 모델 (PyTorch 기반)\n• OpenCV 연동: PyTorch(ultralytics)로 학습된 모델을 ONNX(Open Neural Network Exchange) 포맷으로 내보내\n기(Export) 한 뒤, OpenCV의 cv2.dnn.readNetFromONNX()를 통해 불러와 구동할 수 있습니다."},{"id":"t9-05","ty":"mc","lv":1,"game":true,"p":"YOLOv8n의 'n'이 뜻하는 것은?","o":["Nano (가장 가벼운 모델)","Normal (표준 모델)","Next (차세대)","Night (야간용)"],"a":0,"h":"YOLOv8n이라는 이름은 YOLO(알고리즘 계열), v8(버전), n(모델 크기 접미사)으로 나뉩니다. 자료는 n이 YOLOv8 계열 중 가장 가벼운(경량) 모델을 뜻하는 접미사라고 설명하며, '아주 작은'이라는 뜻의 영어 단어입니다.","w":"n은 Nano로 YOLOv8 계열 중 가장 가볍고 빠른 모델입니다.","an":"YOLOv8n 구성 표 · p.152","src":"구성 요소 의미 설명\nYOLO You Only Look Once 검출과 분류를 단 하나의 신경망에서 동시에 처리하는 알고리즘 계열의 이름입니다 (1단계 검출기).\nv8 Version 8\nYOLO 알고리즘의 최신 주류 버전입니다. 이전 버전\n(v3, v4, v5, v7 등)에 비해 속도와 정확도가 크게 개\n선되었습니다.\nn Nano YOLOv8모델 계열 중 가장 가벼운(경량) 모델을 나타내는 접미사입니다."},{"id":"t9-06","ty":"ox","lv":2,"game":true,"p":"OpenCV DNN 모듈은 모델 학습과 추론을 모두 지원한다.","a":false,"h":"OpenCV DNN 모듈의 특징은 모델 호환성, 추론 실행, 경량화, 하드웨어 가속입니다. '추론(Inference) 실행' 항목은 모델을 학습시키는 기능이 있는지와, 이 모듈이 무엇에 특화되어 있는지를 설명합니다.","w":"틀렸습니다. DNN 모듈은 학습 기능이 없고, 이미 학습된 모델로 추론(예측)하는 데 특화되어 있습니다.","an":"OpenCV DNN 특징 · p.149","src":"• 모델 호환성: 다양한 딥러닝 프레임워크에서 학습된 모델을 로드할 수 있습니다. 예를 들어, \nTensorFlow의 .pb 파일, Caffe의 .prototxt와 .caffemodel, PyTorch의 .pt 파일 등을 지원합니다.\n• 추론(Inference) 실행: 모델을 학습시키는 기능은 제공하지 않지만, 이미지 분류, 객체 검출(YOLO, \nSSD), 시맨틱 분할 등 이미 학습이 완료된 모델을 사용하여 예측을 수행하는 데 특화되어 있습니다.\n• 경량화 및 속도: 복잡한 딥러닝 프레임워크 전체를 설치하지 않아도 되므로, 비교적 경량화된 환경\n에서 딥러닝 추론을 실행할 수 있습니다."},{"id":"t9-07","ty":"ox","lv":1,"game":true,"p":"실습용 coco.names 파일에는 COCO 데이터셋 기준 80가지 객체 이름이 들어 있다.","a":true,"h":"DNN 실습 예제는 YOLOv8 ONNX 모델 파일(yolov8n.onnx), 클래스 레이블 파일, 입력 이미지 세 가지를 준비합니다. 클래스 레이블 파일 coco.names의 괄호 설명은 어느 데이터셋 기준으로 몇 가지 객체 이름이 들어 있는지 알려 줍니다.","w":"맞습니다. coco.names는 COCO 기준 80가지 객체 이름 목록이며, yolov8n.onnx와 함께 실습에 사용합니다.","an":"OpenCV DNN 모듈 실습 예제 · p.151","src":"• 이미지 분류\n• YOLOv8\n• YOLOv8 ONNX모델 파일: yolov8n.onnx (YOLOv8 Nano 버전, 가장 가볍고 빠름)\n• 클래스 레이블 파일: coco.names (COCO 데이터셋 기준 80가지 객체 이름)\n• 입력 이미지: input_image.jpg (검출할 객체가 포함된 이미지)"},{"id":"t9-08","ty":"match","lv":2,"game":false,"p":"객체 검출 기법과 특징을 연결하세요.","pairs":[["Haar Cascade","명암 패턴, 빠르지만 조명·각도에 약함"],["HOG + SVM","기울기 방향 히스토그램, 보행자 검출"],["MobileNet-SSD","가벼운 백본, 저사양 기기 실시간"],["YOLO","한 번만 보고 위치·종류를 동시에"]],"h":"Haar Cascade는 흑백 명암 패턴으로 빠르게 찾지만 각도·조명 변화에 약하고, HOG + SVM은 기울기 방향 히스토그램으로 보행자를 찾습니다. MobileNet-SSD는 임베디드 기기의 실시간 검출용이고, YOLO는 전체 이미지를 한 번만 보고 위치와 종류를 함께 찾습니다.","w":"Haar는 명암 패턴, HOG+SVM은 기울기 히스토그램, MobileNet-SSD는 경량 백본, YOLO는 전체 이미지를 한 번에 보는 One-stage 검출기입니다.","an":"객체 검출 방법 비교 · p.141–143","src":"• Haar Cascade (하어 캐스케이드)\n• 주요 용도: 얼굴 검출, 눈 검출 등\n• 핵심 원리: 흑백 명암비의 패턴(Haar-like feature)을 이용해 사물의 특징을 스캔합니다.\n• 특징: 연산 속도가 매우 빨라 과거 실시간 웹캠 얼굴 인기에 주로 쓰였으나, 각도가 틀어지거나 조명이 변하면 오\n인식이 많습니다.\n• HOG + SVM (Histogram of Oriented Gradients)\n• 주요 용도: 보행자 검출\n• 핵심 원리: 이미지 픽셀의 기울기(Gradient) 방향 정보를 히스토그램으로 추출하고, SVM(서포트 벡터 머신) 알고\n리즘으로 분류합니다.\n• 특징: 사람의 형태(윤곽)를 찾는 데 특화되어 있으나, 복잡한 배경에서는 정확도가 떨어집니다."},{"id":"t9-09","ty":"order","lv":2,"game":false,"p":"OpenCV DNN 모듈로 객체를 검출해 보여 주는 순서를 맞추세요.","steps":["cv2.dnn.readNet...()으로 학습된 모델 로드","cv2.dnn.blobFromImage()로 입력 전처리","net.forward()로 순전파 실행","검출 결과를 바운딩 박스로 그려 표시"],"h":"DNN 검출은 먼저 cv2.dnn.readNet()으로 학습된 모델을 불러와야 합니다. 그다음 blobFromImage()로 이미지를 모델 입력 형태로 바꾸고, net.forward()로 순전파를 실행해 검출 결과를 얻은 뒤, 마지막에 결과를 바운딩 박스로 그려 보여 줍니다.","w":"모델을 로드하고, 이미지를 모델 입력 형태(blob)로 바꾼 뒤, forward로 추론하고, 결과를 박스로 그립니다.","an":"딥러닝 기반 검출(DNN Module) · p.140, 결과 시각화 p.8","src":"• OpenCV 함수:\n• cv2.dnn.readNet(): TensorFlow, Caffe, Darknet 등 다양한 프레임워크로 학습된 신경망 모델을 \n로드합니다.\n• cv2.dnn.blobFromImage(): 이미지를 모델의 입력 요구사항에 맞는 형태로 전처리합니다.\n• net.forward(): 로드된 모델을 통해 순전파(Forward Propagation)를 수행하여 검출 결과를 얻습\n니다."},{"id":"t9-10","ty":"multi","lv":2,"game":true,"p":"OpenCV Tracker 클래스가 제공하는 추적 알고리즘을 <b>모두<\/b> 고르세요.","o":["KCF","CSRT","GOTURN","MOG2","Canny"],"a":[0,1,2],"h":"객체 추적은 특정 객체가 프레임마다 어디로 움직이는지 예측해 따라가는 과정이며, OpenCV는 Tracker 클래스로 여러 추적 알고리즘을 제공합니다. MOG2는 배경 차분, Canny는 엣지 검출용이므로 추적 알고리즘 목록과 구분해 보세요.","w":"Tracker는 KCF·CSRT·GOTURN 등을 제공하며, .init()으로 첫 박스를 지정하고 .update()로 매 프레임 위치를 갱신합니다.","an":"객체 추적 · p.136","src":"• 객체 추적 (Object Tracking)\n• 객체 추적은 움직임 감지 후, 특정 객체가 시간의 흐름에 따라 비디오 프레임 내에서 어디로 이\n동하는지 정확히 예측하고 따라가는 과정입니다.\n• 용도: 차량 번호판 추적, 사람의 움직임 분석, 스포츠 분석 등.\n• OpenCV 기능: OpenCV는 Tracker 클래스를 통해 KCF, CSRT, GOTURN 등 다양한 추적 알고리\n즘을 제공합니다."}]}]};

const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');

function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

/* ── 오답노트 ──────────────────────────── */
function addWrong(id,ans){const w=S.wrong[id]||{n:0};w.n++;w.last=ans;w.at=Date.now();w.solved=false;S.wrong[id]=w;}
function markSolved(id){if(S.wrong[id]&&!S.wrong[id].solved){S.wrong[id].solved=true;S.wrong[id].at=Date.now();}}
const wrongList=solved=>Object.keys(S.wrong).filter(id=>QMAP[id]&&!!S.wrong[id].solved===solved)
  .sort((a,b)=>QTAB[a].idx-QTAB[b].idx||ALLQ.indexOf(QMAP[a])-ALLQ.indexOf(QMAP[b]));

/* ── 문항 풀이 상태(학습·재도전 공용) ───── */
let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

function cardHTML(q,n){
  const [label,color]=TYPES[q.ty];
  const g=cur.graded, a=cur.ans[q.id], fa=finalAns(q), ok=g&&isCorrect(q,fa);
  const lock=g?' disabled':'';
  let body='';
  if(q.ty==='mc'||q.ty==='multi'){
    const multi=q.ty==='multi', mine=multi?(a||[]):[a];
    body='<div class="opts">'+q.o.map((o,i)=>{
      const right=multi?q.a.includes(i):q.a===i, picked=mine.includes(i);
      const cls=g?(right?' ans':picked?' miss':''):'';
      return `<label class="opt${cls}"><span class="onum">${i+1}</span><input type="${multi?'checkbox':'radio'}" name="r-${q.id}" data-act="${multi?'tick':'pick'}" data-q="${q.id}" data-i="${i}"${picked?' checked':''}${lock}><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(q.ty==='ox'){
    body='<div class="ox">'+[true,false].map(v=>{
      const cls=g?(q.a===v?' ans':a===v?' miss':''):'';
      return `<button type="button" class="${cls.trim()}" data-act="ox" data-q="${q.id}" data-v="${v?1:0}" data-fk="${q.id}-ox${v?1:0}" aria-pressed="${a===v}" aria-label="${v?'맞다 O':'틀리다 X'}"${lock}>${v?'O':'X'}</button>`;
    }).join('')+'</div>';
  }else if(q.ty==='match'){
    const m=a||{}, sel=cur.msel[q.id], linkedBy={};
    Object.entries(m).forEach(([l,r])=>linkedBy[r]=+l);
    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${PAL[i%PAL.length]})" data-act="ml" data-q="${q.id}" data-i="${i}" data-fk="${q.id}-l${i}"${lock}><span class="tag">${LETTER[i]}</span>${esc(p[0])}</button>`;
    }).join('');
    const right=cur.shuf[q.id].map(j=>{
      const by=linkedBy[j], linked=by!=null, cls=(linked?' linked':'')+(g&&linked?(by===j?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${linked?PAL[by%PAL.length]:'--line'})" data-act="mr" data-q="${q.id}" data-j="${j}" data-fk="${q.id}-r${j}"${lock}><span class="tag">${linked?LETTER[by]:''}</span>${esc(q.pairs[j][1])}</button>`;
    }).join('');
    body=`<div class="match"><div class="mcol mleft">${left}</div><div class="mcol mright">${right}</div></div>`;
  }else if(q.ty==='order'){
    const seq=a||[], full=seq.length===q.steps.length;
    body='<div class="olist">'+(cur.shuf[q.id]||range(q.steps.length)).map(si=>{
      const pos=seq.indexOf(si), on=pos>=0;
      const cls=(on?' on':'')+(g?(pos===si?' ok':' no'):'');
      const fix=g&&pos!==si?`<span class="ofix">정답 ${si+1}</span>`:'';
      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }
  const numAns=q.ty==='mc'?`${q.a+1}번 · `:q.ty==='multi'?q.a.map(i=>i+1).join('·')+'번 · ':'';
  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>`}${body}${exp}</article>`;
}
const LV_NAME=['쉬움','보통','어려움'];
function lvHTML(lv){
  lv=lv||1;
  const dots=[1,2,3].map(k=>k<=lv?`<i class="d${k}">●</i>`:'<i class="off">○</i>').join('');
  return `<span class="lv lv${lv}" title="난이도 ${LV_NAME[lv-1]}"><span class="dots" aria-hidden="true">${dots}</span><em>${LV_NAME[lv-1]}</em></span>`;
}
// 자료 발췌: 이스케이프 후 마크다운 기호만 가볍게 서식으로 (**굵게**, `코드`, 머리 #)
const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
function hintHTML(q){
  if(!q.h)return '';
  const open=cur.hints.has(q.id), label=q.ty==='num'?'Hint · 계산식':'Hint';
  // 2단계: ① 자세한 힌트(h) ② 자료 보기 — 자료 원문 발췌(src) + 위치(an)
  const sopen=cur.srcs.has(q.id);
  const src=q.src?`<div class="srcwrap"><button type="button" class="srcbtn" data-act="src" data-q="${q.id}" data-fk="${q.id}-src" aria-expanded="${sopen}" aria-controls="src-${q.id}">`+
    `<span class="caret" aria-hidden="true">${sopen?'▾':'▸'}</span>📖 자료 보기</button>`+
    (sopen?`<blockquote class="src" id="src-${q.id}"><p>${srcText(q.src)}</p>${q.an?`<cite>${esc(q.an)}</cite>`:''}</blockquote>`:'')+`</div>`:'';
  return `<div class="hintwrap"><button type="button" class="hintbtn" data-act="hint" data-q="${q.id}" data-fk="${q.id}-hint" aria-expanded="${open}" aria-controls="hint-${q.id}">`+
    `<span class="caret" aria-hidden="true">${open?'▾':'▸'}</span>${label}</button>`+
    (open?`<div class="hint" id="hint-${q.id}">${q.h}${src}</div>`:'')+`</div>`;
}
function refreshCard(q){
  const el=document.getElementById('card-'+q.id);if(!el)return;
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  el.outerHTML=cardHTML(q,el.dataset.n);
  if(fk){const f=app.querySelector(`[data-fk="${fk}"]`);if(f&&!f.disabled)f.focus();}
  updateProgress();
}
const pad2=n=>String(n).padStart(2,'0');
const fmtCnt=(n,t)=>`(${pad2(n)}/${pad2(t)})`;
// 탭별 푼 문항 수: 지금 보는 탭 → 화면 상태, 그 외 → 풀던 답(drafts) → 채점 기록
function tabAnswered(t){
  const src=cur&&cur.mode==='study'&&cur.tab===t?cur.ans:(S.drafts[t.id]||(S.tabs[t.id]&&S.tabs[t.id].answers)||{});
  return t.qs.filter(q=>isAnswered(q,src[q.id])).length;
}
function updateProgress(){
  const p=document.getElementById('pbar');if(!p||!cur)return;
  const n=cur.list.filter(answered).length, cnt=fmtCnt(n,cur.list.length);
  p.style.width=pct(n,cur.list.length)+'%';
  document.getElementById('ptxt').textContent=`${n} / ${cur.list.length} 응답`;
  const g=document.getElementById('gradeCnt');if(g)g.textContent=cnt;
  if(cur.mode==='study'){
    const c=document.getElementById('qc-'+cur.tab.id);if(c)c.textContent=cnt;
    if(!cur.graded){  // 풀던 답 저장 → 탭을 옮겨도 유지
      if(n||Object.keys(cur.ans).some(k=>{const v=cur.ans[k];return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:v!=null&&v!=='';}))
        S.drafts[cur.tab.id]=JSON.parse(JSON.stringify(cur.ans));
      else delete S.drafts[cur.tab.id];
      save();
    }
  }
}

/* 학습 화면 상호작용 */
function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;
  else if(el.dataset.act==='tick'){
    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);
  }
  cur.armed=false;updateProgress();
}
function onSheetInput(el){
  if(el.dataset.act==='num'&&!cur.graded){cur.ans[el.dataset.q]=el.value;cur.armed=false;updateProgress();}
}

/* ── 화면: 학습 ────────────────────────── */
function viewStudy(tid,fresh){
  const tab=TABS.find(t=>t.id===tid)||TABS[0];
  cur=newSheet('study',tab.qs,tab);
  const rec=S.tabs[tab.id], draft=S.drafts[tab.id];
  if(fresh){delete S.drafts[tab.id];save();}
  else if(draft){Object.assign(cur.ans,JSON.parse(JSON.stringify(draft)));}  // 풀던 중이면 이어서
  else if(rec&&rec.answers){
    Object.assign(cur.ans,JSON.parse(JSON.stringify(rec.answers)));
    (rec.touched||[]).forEach(id=>cur.touched.add(id));
    cur.graded=true;
  }
  renderSheet();
}
function renderSheet(){
  const study=cur.mode==='study', tab=cur.tab;
  const tabbar=study?`<nav class="tabbar noprint" role="tablist" aria-label="탭">${TABS.map((t,i)=>{const r=S.tabs[t.id];
      return `<a class="tabchip" role="tab" href="#study/${t.id}" aria-selected="${t===tab}"><b>${i+1}</b><span class="tl">${esc(t.title)}</span><span class="qc" id="qc-${t.id}">${fmtCnt(tabAnswered(t),t.qs.length)}</span>${r?`<span class="sc" title="채점 점수">✓${r.score}</span>`:''}</a>`;}).join('')}
      ${allGraded()?'<a class="tabchip sum" href="#summary">★ 종합</a>':''}</nav>`:'';
  const head=study?`<div class="tabhead"><h2>${tab.idx+1}. ${esc(tab.title)}</h2>${tab.ref?`<span class="part">${esc(tab.ref)}</span>`:''}</div>`
                  :`<div class="tabhead"><h2>🔁 오답 다시 풀기</h2><span class="part">${cur.list.length}문항</span></div>`;
  const next=study?(tab.idx+1<TABS.length?`<a class="btn" href="#study/${TABS[tab.idx+1].id}">다음 탭 →</a>`:(allGraded()?'<a class="btn" href="#summary">★ 종합 결과</a>':'')):'<a class="btn" href="#notes">오답노트로</a>';
  app.innerHTML=`<div class="sheet">
  <nav class="crumbs noprint"><a href="#home">← 홈</a><span>/</span><span>${study?'학습 모드':'오답노트'}</span></nav>
  ${tabbar}${head}
  <div class="progress"><div class="bar"><div id="pbar"></div></div><span id="ptxt"></span></div>
  <div id="sheetResult">${cur.graded?sheetResultHTML():''}</div>
  <div id="cards" class="${cur.onlyWrong?'onlywrong':''}">${cur.list.map((q,i)=>cardHTML(q,i+1)).join('')}</div>
  <p class="warn" id="warn" role="status"></p>
  <div class="actions">
    ${cur.graded?'':`<button class="btn primary" type="button" data-act="grade">${study?'이 탭 채점하기':'채점하기'} <span class="qc" id="gradeCnt"></span></button>`}
    ${cur.graded?`<button class="btn" type="button" data-act="onlywrong">${cur.onlyWrong?'전체 보기':'오답만 보기'}</button>`:''}
    ${study?'<button class="btn" type="button" data-act="retab">다시 풀기</button>':''}
    ${next}
  </div></div>`;
  const on=app.querySelector('.tabchip[aria-selected="true"]');
  if(on)on.parentElement.scrollLeft=on.offsetLeft-on.parentElement.offsetLeft-16;
  updateProgress();
}
function sheetResultHTML(){
  const n=cur.list.length, score=cur.list.filter(q=>isCorrect(q,finalAns(q))).length, p=pct(score,n);
  const msg=p===100?'만점입니다! 🎉':p>=80?'잘했어요. 틀린 문항의 해설과 자료 위치를 확인하세요.':p>=60?'절반 이상 이해했어요. 오답노트로 다시 풀어 보세요.':'자료를 한 번 더 읽고 다시 풀어 보세요.';
  return `<div class="panel"><div class="score">${score}<small> / ${n} · ${p}%</small></div><p class="msg">${msg}</p>
    ${cur.mode==='study'&&gameUnlocked()?'<a class="btn" href="#game">⚡ 게임 모드 도전</a>':''}</div>`;
}
function gradeSheet(){
  const miss=cur.list.map((q,i)=>answered(q)?0:i+1).filter(Boolean);
  if(miss.length&&!cur.armed){
    cur.armed=true;
    document.getElementById('warn').textContent=`미응답 ${miss.length}문항 (Q${miss.join(', Q')}). 한 번 더 누르면 미응답은 오답으로 채점합니다.`;
    return;
  }
  const firstUnlock=!gameUnlocked();
  cur.graded=true;
  const snap={};let score=0;
  cur.list.forEach(q=>{
    const a=finalAns(q);
    if(a!=null)snap[q.id]=a;
    if(isCorrect(q,a)){score++;markSolved(q.id);}
    else addWrong(q.id,answerText(q,a));
  });
  if(cur.mode==='study'){
    S.tabs[cur.tab.id]={score,total:cur.list.length,answers:snap,touched:[...cur.touched],at:Date.now()};
    delete S.drafts[cur.tab.id];
  }
  save();
  renderSheet();
  window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
  say(`채점 결과 ${score}점, ${cur.list.length}문항 중`);
  if(cur.mode==='study'&&firstUnlock)setTimeout(()=>toast('⚡ 게임 모드와 해설지가 열렸습니다!'),300);
  else if(cur.mode==='study'&&allGraded())setTimeout(()=>toast('★ 모든 탭 완료! 종합 결과를 확인하세요.'),300);
}

/* ── 화면: 종합 결과 ───────────────────── */
function summaryStats(){
  let score=0,total=0;const byType={},byTab=[];
  TABS.forEach(t=>{const r=S.tabs[t.id];if(!r)return;let s=0;
    t.qs.forEach(q=>{const ok=isCorrect(q,r.answers?r.answers[q.id]:null);if(ok)s++;
      const b=byType[q.ty]||(byType[q.ty]=[0,0]);b[1]++;if(ok)b[0]++;});

function renderGameQ(){
  const q=G.qs[G.i];
  G.locked=false;G.elapsed=0;G.last=performance.now();G.limit=G.time*1000;G.warned=false;G.pick=[];

    :`<div class="gopts">${G.view.map((oi,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}"${q.ty==='multi'?' aria-pressed="false"':''}><kbd>${k+1}</kbd><span>${esc(q.o[oi])}</span></button>`).join('')}</div>`;
  app.innerHTML=`

    <div class="gq">${q.p}</div>
    <div class="gbottom">${opts}
    <div class="gfloat" id="gfloat" aria-live="polite"></div>
    <div class="gsub"><button class="btn" type="button" data-act="gquit">그만하기</button>
      ${q.ty==='multi'?'<button class="btn primary" type="button" data-act="gsubmit">제출 (Enter)</button>':''}</div></div>
  </div>`;
  G.raf=requestAnimationFrame(tick);
}
function tick(now){
  if(!G||G.locked)return;
  G.elapsed+=now-G.last;G.last=now;
  const rem=Math.max(0,G.limit-G.elapsed), ratio=rem/G.limit;
  const shown=RM.matches?Math.ceil(rem/1000)*1000/G.limit:ratio;
  const bar=document.getElementById('tbar'), tm=document.getElementById('timer');
  if(bar){bar.style.width=(Math.min(1,shown)*100)+'%';tm.className='timer'+(ratio<.25?' lo':ratio<.5?' mid':'');
    document.getElementById('tleft').textContent=(rem/1000).toFixed(1)+'초';}
  if(!G.warned&&rem<=5000){G.warned=true;say('5초 남았습니다');}
  if(rem<=0){judge(null,true);return;}
  G.raf=requestAnimationFrame(tick);
}
function judge(ans,timeout){
  if(!G||G.locked)return;
  G.locked=true;cancelAnimationFrame(G.raf);
  const q=G.qs[G.i], used=Math.min(G.elapsed,G.limit), ok=!timeout&&isCorrect(q,ans);
  let gain=0;
  if(ok){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const mult=G.combo>=5?1.5:G.combo>=3?1.2:1;
    gain=Math.round((100+Math.floor((G.limit-used)/100))*mult);G.score+=gain;}
  else G.combo=0;
  G.results.push({id:q.id,ok,ans,timeout,ms:used,gain});
  // 판정 표시
  app.querySelectorAll('[data-act="gans"]').forEach(b=>{
    const k=+b.dataset.k, v=G.view[k];
    const right=q.ty==='ox'?q.a===v:q.ty==='mc'?q.a===v:q.a.includes(v);
    const picked=q.ty==='ox'||q.ty==='mc'?ans===v:(ans||[]).includes(v);
    if(right)b.classList.add('ans');else if(picked)b.classList.add('miss');
    b.disabled=true;
  });
  const f=document.getElementById('gfloat');
  f.className='gfloat pop '+(ok?'ok':'no');
  f.textContent=ok?`+${gain}${G.combo>=3?` 🔥×${G.combo>=5?'1.5':'1.2'}`:''}`:timeout?'⏰ 시간 초과':'✗ 오답';
  if(timeout){const tm=document.getElementById('timer');tm&&tm.classList.add('out');}
  const sb=app.querySelector('[data-act="gsubmit"]');if(sb)sb.disabled=true;
  app.querySelector('.pts').textContent=G.score.toLocaleString()+'점';
  const c=app.querySelector('.combo');c.textContent='🔥 콤보 '+G.combo;c.classList.toggle('hot',G.combo>=3);
  G.next=setTimeout(()=>{if(!G)return;G.i++;G.i<G.qs.length?renderGameQ():finishGame();},ok?900:1400);
}
function gameAnswer(k){
  if(!G||G.locked)return;
  const q=G.qs[G.i];if(k<0||k>=G.view.length)return;
  if(q.ty==='multi'){
    const v=G.view[k], i=G.pick.indexOf(v);

    const b=app.querySelector(`[data-act="gans"][data-k="${k}"]`);b&&b.setAttribute('aria-pressed',i<0);
  }else judge(G.view[k],false);
}
function gameSubmit(){if(G&&!G.locked&&G.qs[G.i].ty==='multi')judge(G.pick.slice(),false);}
function stopGame(){if(G){cancelAnimationFrame(G.raf);clearTimeout(G.next);G=null;}}

  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act;
  if(cur&&['ox','ml','mr','ord','hint','src'].includes(act))return onSheetClick(el);
  switch(act){
    case 'grade':gradeSheet();break;
    case 'retab':viewStudy(cur.tab.id,true);window.scrollTo(0,0);break;  // 이전 점수는 다시 채점할 때까지 유지
    case 'onlywrong':cur.onlyWrong=!cur.onlyWrong;document.getElementById('cards').classList.toggle('onlywrong',cur.onlyWrong);el.textContent=cur.onlyWrong?'전체 보기':'오답만 보기';break;
    case 'copyreport':copy(reportMD());break;
    case 'copynotes':copy(`# ${BANK.title}\n\n- 이름: ${S.name||'-'} · ${today()}\n\n`+notesMD(false));break;
    case 'clearsolved':wrongList(true).forEach(id=>delete S.wrong[id]);save();viewNotes();break;
    case 'print':window.print();break;
    case 'reset':
      if(!resetArmed){resetArmed=true;el.textContent='정말 지울까요? 한 번 더 누르세요';setTimeout(()=>{resetArmed=false;if(el.isConnected)el.textContent='이 문제은행 기록 모두 지우기';},4000);break;}
      resetArmed=false;const nm=S.name;S=blank();S.name=nm;save();toast('기록을 지웠습니다');viewHome();break;
    case 'gset':gameSetup[el.dataset.g]=['count','time'].includes(el.dataset.g)?+el.dataset.v:el.dataset.v;viewGameSetup();break;
    case 'gstart':startGame();break;
    case 'gans':gameAnswer(+el.dataset.k);break;
    case 'gsubmit':gameSubmit();break;
    case 'gquit':stopGame();viewGameSetup(gameSetup.mode);break;
    case 'gagain':startGame();break;
  }
});
app.addEventListener('change',e=>{const el=e.target;if(cur&&el.dataset&&(el.dataset.act==='pick'||el.dataset.act==='tick'))onSheetChange(el);});
app.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.act==='name'){S.name=el.value;save();}
  else if(cur)onSheetInput(el);
});
document.addEventListener('keydown',e=>{
  if(!G||G.locked||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.target.matches&&e.target.matches('input,textarea'))return;
  const q=G.qs[G.i], k=e.key.toLowerCase();
  if(q.ty==='ox'){if(k==='o'||k==='1'){e.preventDefault();gameAnswer(0);}else if(k==='x'||k==='2'){e.preventDefault();gameAnswer(1);}return;}
  if(/^[1-9]$/.test(k)){e.preventDefault();gameAnswer(+k-1);}
  else if(k==='enter'&&q.ty==='multi'){e.preventDefault();gameSubmit();}
});
document.addEventListener('visibilitychange',()=>{if(G&&!document.hidden)G.last=performance.now();});
// 탭 바 좌우 화살표
app.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('.tabchip');if(!t||(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'))return;
  const n=e.key==='ArrowRight'?t.nextElementSibling:t.previousElementSibling;if(n){e.preventDefault();n.focus();}
});
/* 테마 */
let theme=null;try{theme=localStorage.getItem('qb:theme');}catch(e){}
const applyTheme=()=>{if(theme)document.documentElement.dataset.theme=theme;else delete document.documentElement.dataset.theme;};
applyTheme();
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  theme=dark?'light':'dark';try{localStorage.setItem('qb:theme',theme);}catch(e){}applyTheme();
});
document.title=BANK.title+' · 문제은행';
window.addEventListener('hashchange',route);
route();
})();
</script>
</body>
