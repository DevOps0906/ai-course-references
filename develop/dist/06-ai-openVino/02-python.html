w":".split(\",\")은 구분자로 문자열을 나눠 리스트를 만듭니다. .join()은 반대로 리스트를 이어 붙입니다.","an":"01 · 문자열 자주 쓰는 문자열 메서드 · p.9","src":".strip() 문자열 양 끝의 공백을 제거합니다. .split(\",\") 구분자를 기준으로 문자열을 리스트로 나눕니다. \"-\".join(list) 리스트의 요소들을 구분자로 이어 붙입니다."},{"id":"t1-05","ty":"mc","lv":1,"game":true,"p":"정수 나눗셈의 '몫'을 구하는 연산자는?","o":["%","**","//","/"],"a":2,"h":"산술 연산자 가운데 슬래시 하나(/)는 일반 나눗셈이고, %는 나머지, **는 거듭제곱입니다. 몫만 구하는 연산자는 나눗셈 기호를 두 번 이어 씁니다.","w":"//는 몫, %는 나머지, **는 거듭제곱, /는 일반 나눗셈입니다.","an":"01 · 연산자 연산자 한눈에 보기 · p.10","src":"+ - * / // % ** 산술 연산자 (몫 //, 나머지 %, 거듭제곱 **)"},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"비교 연산자(==, !=, > 등)의 결과는 항상 bool이다.","a":true,"h":"비교 연산자는 두 값을 비교해 참인지 거짓인지를 알려 줍니다. 자료의 연산자 표는 비교 결과의 자료형을 따로 명시합니다. NumPy에서 <code>a > 25<\/code>가 True/False로 이루어진 마스크를 만든 것도 같은 원리입니다.","w":"맞습니다. 비교 연산자의 결과는 항상 True 또는 False(bool)입니다.","an":"01 · 연산자 연산자 한눈에 보기 · p.10","src":"연산자 한눈에 보기 코드\n항목 설명\n+ - * / // % ** 산술 연산자 (몫 //, 나머지 %, 거듭제곱 **)\n== != > < >= <= 비교 연산자 — 결과는 항상 bool\nand or not 논리 연산자 — 조건을 조합할 때 사용\n= += -= *= /= 대입 연산자 — 변수에 값을 갱신하며 대입\nin / not in 멤버십 연산자 — 리스트·문자열 안에 있는지 확인"},{"id":"t1-07","ty":"ox","lv":2,"game":true,"p":"<code>int(\"28\")<\/code>의 결과는 문자열 \"28\"이다.","a":false,"h":"int()는 값을 정수로, float()는 실수로, str()는 문자열로 바꾸는 형변환 함수입니다. casting.py에서 <code>int(\"28\")<\/code>의 결과에 2를 더해 30이 나오고, type()이 &lt;class 'int'&gt;를 출력합니다. 덧셈이 된다는 점에서 결과의 자료형을 판단해 보세요.","w":"틀렸습니다. int(\"28\")은 문자열을 정수 28로 바꿉니다. 그래서 <code>age_int + 2<\/code>는 30이 됩니다.","an":"01 · 형변환 자료형 변환하기 · p.11","src":"casting.py\nage_str = \"28\"\nage_int = int(age_str) # \"28\" -> 28\nprice = float(\"19900\") # \"19900\" -> 19900.0\ntext = str(3.14) # 3.14 -> \"3.14\"\nprint(age_int + 2) # 30\nprint(type(age_int)) # <class 'int'>"},{"id":"t1-08","ty":"match","lv":1,"game":false,"p":"자료형과 예시를 연결하세요.","pairs":[["int","age = 25"],["float","pi = 3.14"],["str","name = 'AI'"],["bool","is_ready = True"],["NoneType","result = None"]],"h":"int는 소수점 없는 정수, float는 소수점이 있는 실수, str은 따옴표로 감싼 텍스트입니다. bool은 True/False 같은 참/거짓 값이고, NoneType은 값이 없음을 나타냅니다. 각 예시의 값 모양을 보고 짝을 찾아보세요.","w":"int는 정수, float은 실수, str은 따옴표로 감싼 텍스트, bool은 참/거짓, NoneType은 값이 없음입니다.","an":"01 · 자료형 파이썬 기본 자료형 표 · p.6","src":"int 정수(소수점 없는 숫자) age = 25 float 실수(소수점이 있는 숫자) pi = 3.14 str 문자열(따옴표로 감싼 텍스트) name = 'AI' bool 참/거짓 논리값 is_ready = True NoneType 값이 없음을 나타냄 result = None"},{"id":"t1-09","ty":"order","lv":1,"game":false,"p":"개발 환경을 확인하는 순서를 맞추세요.","steps":["source .venv/bin/activate로 가상환경 활성화","python --version으로 버전 확인","python으로 대화형 인터프리터 실행"],"h":"자료는 이전 우분투 개발환경 가이드에서 만든 .venv를 그대로 씁니다. 그래서 먼저 가상환경을 활성화해야 그 안의 파이썬으로 버전을 확인할 수 있습니다. 대화형 인터프리터 실행은 확인이 끝난 뒤 마지막에 합니다.","w":"가상환경 활성화 → 버전 확인 → 대화형 인터프리터 실행 순서입니다. 우분투 가이드에서 만든 .venv를 그대로 씁니다.","an":"01 · 개발환경 개발 환경 확인하기 · p.5","src":"$ source .venv/bin/activate 이전 가이드에서 만든 가상환경 활성화 $ python --version 파이썬 버전 확인 $ python 대화형 인터프리터 실행"},{"id":"t1-10","ty":"multi","lv":2,"game":false,"p":"문자열 메서드 설명으로 <b>옳은<\/b> 것을 모두 고르세요.","o":[".upper(): 첫 글자만 대문자로",".split(','): 나눠서 리스트로","'-'.join(list): 구분자로 이어 붙임",".replace(a, b): 첫 번째 a만 b로",".strip(): 양 끝 공백 제거"],"a":[1,2,4],"h":"split은 구분자로 잘라 리스트를 만들고, join은 리스트 요소를 구분자로 이어 붙이며, strip은 양 끝 공백을 지웁니다. replace(a, b)는 a를 '모두' 바꾸고, upper()는 전체를 대문자로 만들어 'PYTHON AI'가 됩니다. 각 보기 설명이 표와 맞는지 하나씩 대조해 보세요.","w":"strip·split·join 설명이 맞습니다. .upper()는 전체를 대문자로('PYTHON AI'), .replace(a, b)는 a를 모두 b로 바꿉니다.","an":"01 · 문자열 메서드 표 · p.8–9","src":".strip() 문자열 양 끝의 공백을 제거합니다. .split(\",\") 구분자를 기준으로 문자열을 리스트로 나눕니다. \"-\".join(list) 리스트의 요소들을 구분자로 이어 붙입니다. .replace(a, b) 문자열 안의 a를 b로 모두 바꿉니다."}]},{"id":"t2","title":"리스트·튜플·집합·딕셔너리","ref":"PART 1 · p.13–19","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"값을 추가·수정·삭제할 수 있는(mutable) 자료구조는?","o":["튜플(tuple)","리스트(list)","문자열(str)","정수(int)"],"a":1,"h":"자료는 두 자료구조를 비교합니다. [ ]로 만드는 쪽은 값을 추가·수정·삭제할 수 있어(mutable) 장바구니처럼 계속 바뀌는 데이터에 맞습니다. ( )로 만드는 쪽은 한 번 만들면 바꿀 수 없습니다(immutable).","w":"리스트는 [ ]로 만들며 값을 바꿀 수 있습니다(mutable). 튜플은 한 번 만들면 바꿀 수 없습니다(immutable).","an":"01 · 자료구조 리스트 vs 튜플 · p.13","src":"— [ ] 로 만들며 순서가 있는 자료구조입니다. — 값을 추가·수정·삭제할 수 있습니다 (mutable). — 장바구니처럼 계속 바뀌는 데이터에 적합합니다."},{"id":"t2-02","ty":"mc","lv":1,"game":true,"p":"좌표처럼 변하지 않는 값 묶음에 적합한 자료구조는?","o":["리스트(list)","딕셔너리(dict)","집합(set)","튜플(tuple)"],"a":3,"h":"( )로 만드는 자료구조는 순서가 있지만 한 번 만들면 값을 바꿀 수 없습니다(immutable). 그래서 좌표처럼 변하지 않는 값 묶음에 적합하며, 예제의 <code>point = (3, 5)<\/code>가 바로 그 예입니다.","w":"튜플은 ( )로 만들며 immutable이라 좌표처럼 변하지 않는 값에 적합합니다. <code>x, y = point<\/code>처럼 언패킹도 됩니다.","an":"01 · 자료구조 리스트 vs 튜플 · p.13·16","src":"— ( ) 로 만들며 순서가 있는 자료구조입니다. — 한 번 만들면 값을 바꿀 수 없습니다 (immutable). — 좌표처럼 변하지 않는 값 묶음에 적합합니다."},{"id":"t2-03","ty":"mc","lv":2,"game":true,"p":"<code>tags = {\"ai\", \"python\", \"ai\"}<\/code>에 담긴 요소는 몇 개인가요?","o":["2개","3개","1개","오류가 난다"],"a":0,"h":"중괄호로 만든 집합(set)은 같은 값을 두 번 넣어도 중복을 자동으로 없앱니다. 예제의 세 요소 중 'ai'가 두 번 나오므로, 서로 다른 값만 남겨 개수를 세어 보세요.","w":"집합은 중복을 자동으로 제거하므로 {'ai', 'python'} 2개만 남습니다.","an":"01 · 튜플·집합 튜플과 집합(set) · p.16","src":"tags = {\"ai\", \"python\", \"ai\"} # 집합: 중복 자동 제거 print(tags) # {'ai', 'python'}"},{"id":"t2-04","ty":"mc","lv":1,"game":true,"p":"키가 없어도 오류 없이 기본값을 돌려주는 딕셔너리 메서드는?","o":[".keys()",".items()",".get(key, 기본값)",".update()"],"a":2,"h":"딕셔너리에 없는 키에 대괄호로 바로 접근하면 KeyError가 납니다. 자료의 메서드 표에는 키를 찾지 못했을 때 오류 대신 미리 정한 값을 돌려주는 메서드가 있습니다. 첫 번째 인자는 키, 두 번째 인자는 대신 돌려받을 값입니다.","w":".get(key, 기본값)은 키가 없어도 오류 없이 기본값을 반환합니다. 대괄호로 없는 키에 접근하면 KeyError가 납니다.","an":"01 · 딕셔너리 자주 쓰는 딕셔너리 메서드 · p.18","src":".get(key, 기본값) 키가 없어도 오류 없이 기본값을 반환합니다."},{"id":"t2-05","ty":"mc","lv":2,"game":true,"p":"<code>fruits.insert(1, \"grape\")<\/code>가 하는 일은?","o":["리스트 끝에 grape를 추가한다","1번 요소를 grape로 바꾼다","grape를 하나 제거한다","1번 위치에 grape를 끼워 넣는다"],"a":3,"h":"append(x)는 위치를 정하지 않고 리스트 맨 끝에 붙입니다. insert는 첫 인자로 위치(인덱스), 둘째 인자로 값을 받아 그 자리에 끼워 넣습니다. 인덱스는 0부터 센다는 점도 함께 생각해 보세요.","w":"insert(위치, 값)는 지정한 위치에 값을 삽입합니다. 끝에 추가하는 것은 append입니다.","an":"01 · 리스트 리스트 다루기 · p.14","src":"fruits.append(\"mango\") # 끝에 추가 fruits.insert(1, \"grape\") # 1번 위치에 삽입 fruits.pop() # 마지막 요소 꺼내기"},{"id":"t2-06","ty":"ox","lv":1,"game":true,"p":"튜플은 한 번 만들면 값을 바꿀 수 없다.","a":true,"h":"자료는 리스트를 mutable, 튜플을 immutable로 구분합니다. immutable은 만든 뒤에 값을 바꿀 수 없다는 뜻이라, 좌표처럼 변하지 않는 값 묶음에 씁니다.","w":"맞습니다. 튜플은 immutable이라 만든 뒤 값을 바꿀 수 없습니다.","an":"01 · 자료구조 리스트 vs 튜플 · p.13","src":"튜플 (tuple) — ( ) 로 만들며 순서가 있는 자료구조입니다. — 한 번 만들면 값을 바꿀 수 없습니다 (immutable)."},{"id":"t2-07","ty":"ox","lv":2,"game":true,"p":"<code>.remove(x)<\/code>는 값이 x인 요소를 모두 제거한다.","a":false,"h":"리스트 메서드 표는 remove(x)가 값이 x인 요소 가운데 '어느 것'을 지우는지 정확히 적어 둡니다. 같은 값이 여러 개 있을 때 몇 개가 사라지는지 표의 표현을 확인해 보세요.","w":"틀렸습니다. .remove(x)는 값이 x인 첫 번째 요소만 제거합니다.","an":"01 · 리스트 자주 쓰는 리스트 메서드 · p.15","src":".remove(x) 값이 x인 첫 번째 요소를 제거합니다."},{"id":"t2-08","ty":"match","lv":1,"game":false,"p":"딕셔너리 메서드와 설명을 연결하세요.","pairs":[[".keys()","모든 키를 반환"],[".values()","모든 값을 반환"],[".items()","(키, 값) 쌍을 함께 반환"],[".update({...})","다른 딕셔너리로 내용 갱신"]],"h":"딕셔너리 메서드는 이름이 곧 돌려주는 대상입니다. keys는 키, values는 값, items는 (키, 값) 쌍을 함께 돌려줍니다. update는 다른 딕셔너리의 내용으로 현재 딕셔너리를 갱신합니다.","w":"keys는 키, values는 값, items는 (키, 값) 쌍을 돌려주고, update는 다른 딕셔너리로 갱신합니다.","an":"01 · 딕셔너리 메서드 표 · p.18","src":".keys() 딕셔너리의 모든 키를 반환합니다. .values() 딕셔너리의 모든 값을 반환합니다. .items() (키, 값) 쌍을 함께 반환합니다. .get(key, 기본값) 키가 없어도 오류 없이 기본값을 반환합니다. .update({...}) 다른 딕셔너리의 내용으로 갱신합니다."},{"id":"t2-09","ty":"order","lv":1,"game":false,"p":"lists.py 코드가 실행되는 순서를 맞추세요.","steps":["fruits 리스트 생성","append(\"mango\")로 끝에 추가","insert(1, \"grape\")로 1번 위치에 삽입","pop()으로 마지막 요소 꺼내기"],"h":"파이썬은 위에서 아래로 한 줄씩 실행합니다. lists.py는 리스트를 만든 다음 끝에 추가하고, 지정한 위치에 끼워 넣은 뒤, 마지막 요소를 꺼냅니다.","w":"리스트 생성 → append → insert → pop 순서로 실행된 뒤 슬라이싱과 len()으로 확인합니다.","an":"01 · 리스트 리스트 다루기 · p.14","src":"fruits = [\"apple\", \"banana\", \"cherry\"] fruits.append(\"mango\") # 끝에 추가 fruits.insert(1, \"grape\") # 1번 위치에 삽입 fruits.pop() # 마지막 요소 꺼내기"},{"id":"t2-10","ty":"multi","lv":2,"game":true,"p":"리스트 메서드 설명으로 <b>옳은<\/b> 것을 모두 고르세요.","o":[".reverse(): 내림차순 정렬",".index(x): x의 위치 반환",".append(x): 끝에 x 추가",".pop(): 첫 요소 꺼내기",".sort(): 오름차순 정렬"],"a":[1,2,4],"h":"append(x)는 끝에 추가, sort()는 오름차순 정렬, index(x)는 x가 있는 위치를 돌려줍니다. reverse()는 정렬하지 않고 순서만 뒤집으며, pop()은 인자가 없으면 마지막 요소를 꺼냅니다. 보기의 설명이 이와 맞는지 대조해 보세요.","w":"append·sort·index 설명이 맞습니다. .reverse()는 순서를 뒤집기만 하고, .pop()은 마지막 요소를 꺼냅니다.","an":"01 · 리스트 메서드 표 · p.14–15","src":".append(x) 리스트 끝에 요소 x를 추가합니다. .remove(x) 값이 x인 첫 번째 요소를 제거합니다. .sort() 리스트를 오름차순으로 정렬합니다. .reverse() 리스트의 순서를 뒤집습니다. .index(x) 값 x가 있는 위치(인덱스)를 반환합니다."}]},{"id":"t3","title":"제어문과 컴프리헨션","ref":"PART 1 · p.20–25","qs":[{"id":"t3-01","ty":"mc","lv":2,"game":true,"p":"<code>score = 85<\/code>일 때 conditions.py가 매기는 학점은?","o":["A","C","오류가 난다","B"],"a":3,"h":"if/elif/else는 위에서부터 조건을 검사해 처음으로 참이 되는 블록 하나만 실행합니다. 90 이상이면 A, 그렇지 않고 80 이상이면 B, 나머지는 C입니다. 85가 어느 조건에서 처음 참이 되는지 따져 보세요.","w":"85는 90 미만이고 80 이상이므로 elif 조건에 걸려 B가 됩니다.","an":"01 · 제어문 if / elif / else · p.20","src":"score = 85 if score >= 90: grade = \"A\" elif score >= 80: grade = \"B\" else: grade = \"C\""},{"id":"t3-02","ty":"mc","lv":1,"game":true,"p":"<code>range(5)<\/code>가 만드는 숫자 범위는?","o":["1부터 5까지","0부터 4까지","0부터 5까지","1부터 4까지"],"a":1,"h":"range(n)은 0에서 시작해 n 바로 앞까지의 정수를 만들고, 끝 숫자 n은 포함하지 않습니다. 그래서 실습에서도 1~20을 만들 때 <code>range(1, 21)<\/code>처럼 끝을 하나 더 크게 씁니다.","w":"range(5)는 0, 1, 2, 3, 4를 만듭니다. 1~20 범위는 range(1, 21)로 씁니다.","an":"01 · 제어문 for 반복문 · p.21","src":"for i in range(5): # 0부터 4까지 print(i, \"번째 반복\")"},{"id":"t3-03","ty":"mc","lv":1,"game":true,"p":"반복문에서 현재 회차만 건너뛰고 다음 회차로 넘어가는 키워드는?","o":["break","pass","continue","return"],"a":2,"h":"while_loop.py는 count가 3일 때 count를 1 올리고 어떤 키워드를 실행해, 출력 없이 다음 회차로 넘어갑니다. 반복문을 아예 끝내는 break와 달리, 이 키워드는 지금 회차의 나머지만 건너뜁니다.","w":"continue는 현재 회차를 건너뛰고, break는 반복문을 즉시 끝냅니다.","an":"01 · 제어문 while 반복문과 break·continue · p.22","src":"while 반복문과 break· continue 코드\nwhile_loop.py\ncount = 0\nwhile count < 5:\nif count == 3:\ncount += 1\ncontinue # 3만 건너뛰기\nprint(count)\ncount += 1\n# break는 반복문을 즉시 종료합니다"},{"id":"t3-04","ty":"mc","lv":1,"game":true,"p":"반복하면서 인덱스와 값을 함께 꺼낼 때 쓰는 함수는?","o":["enumerate()","zip()","range()","len()"],"a":0,"h":"loop_tools.py는 반복할 때 쓰는 도구 두 가지를 보여 줍니다. 하나는 <code>for i, name in ...(names)<\/code>처럼 순번과 값을 함께 꺼내고, 다른 하나는 두 리스트를 같은 위치끼리 짝지어 동시에 돕니다. 순번(인덱스)을 붙여 주는 쪽을 고르세요.","w":"enumerate()는 (인덱스, 값)을 함께 돌려줍니다. zip()은 두 리스트를 같은 위치끼리 묶습니다.","an":"01 · 제어문 range · enumerate · zip · p.23","src":"range · enumerate · zip 코드\nloop_tools.py\nnames = [\"지우\", \"민준\", \"서연\"]\nscores = [90, 85, 95]\nfor i, name in enumerate(names): # 인덱스와 값\nprint(i, name)\nfor name, score in zip(names, scores): # 두 리스트 동시에\nprint(name, score)"},{"id":"t3-05","ty":"mc","lv":2,"game":true,"p":"<code>nums = [1, 2, 3, 4, 5]<\/code>일 때 <code>[n for n in nums if n % 2 == 0]<\/code>의 결과는?","o":["[1, 3, 5]","[2, 4]","[1, 4, 9, 16, 25]","[4, 16]"],"a":1,"h":"리스트 컴프리헨션의 <code>if<\/code> 부분은 조건이 참인 요소만 남깁니다. <code>n % 2 == 0<\/code>은 2로 나눈 나머지가 0, 곧 짝수라는 뜻입니다. 1~5 가운데 이 조건을 만족하는 수만 순서대로 모아 보세요.","w":"조건 n % 2 == 0을 만족하는 짝수만 남아 [2, 4]가 됩니다. [1, 4, 9, 16, 25]는 n**2 컴프리헨션의 결과입니다.","an":"01 · 컴프리헨션 리스트 컴프리헨션 · p.24","src":"리스트 컴프리헨션 코드\ncomprehension.py\nnums = [1, 2, 3, 4, 5]\nsquares = [n**2 for n in nums]\nprint(squares) # [1, 4, 9, 16, 25]\nevens = [n for n in nums if n % 2 == 0]\nprint(evens) # [2, 4]"},{"id":"t3-06","ty":"ox","lv":1,"game":true,"p":"break는 반복문을 즉시 종료한다.","a":true,"h":"while_loop.py의 마지막 주석은 break의 동작을 설명합니다. continue가 현재 회차만 건너뛰는 것과 달리, break는 남은 회차와 상관없이 반복문을 빠져나옵니다.","w":"맞습니다. break는 반복문을 즉시 종료합니다.","an":"01 · 제어문 while 반복문과 break·continue · p.22","src":"while 반복문과 break· continue 코드\nwhile_loop.py\ncount = 0\nwhile count < 5:\nif count == 3:\ncount += 1\ncontinue # 3만 건너뛰기\nprint(count)\ncount += 1\n# break는 반복문을 즉시 종료합니다"},{"id":"t3-07","ty":"ox","lv":2,"game":true,"p":"while_loop.py는 count가 3일 때도 3을 출력한다.","a":false,"h":"count가 3이면 count를 1 올린 뒤 continue로 그 회차의 남은 코드(print 포함)를 건너뜁니다. 따라서 출력은 0, 1, 2 다음에 바로 4로 넘어갑니다. 3일 때 print 줄까지 실행되는지 따져 보세요.","w":"틀렸습니다. count가 3이면 continue로 건너뛰므로 0, 1, 2, 4만 출력됩니다.","an":"01 · 제어문 while 반복문과 break·continue · p.22","src":"while 반복문과 break· continue 코드\nwhile_loop.py\ncount = 0\nwhile count < 5:\nif count == 3:\ncount += 1\ncontinue # 3만 건너뛰기\nprint(count)\ncount += 1\n# break는 반복문을 즉시 종료합니다"},{"id":"t3-08","ty":"match","lv":2,"game":false,"p":"반복에 쓰는 도구와 역할을 연결하세요.","pairs":[["range","정수 범위를 만든다"],["enumerate","인덱스와 값을 함께 꺼낸다"],["zip","두 리스트를 같은 위치끼리 묶는다"],["break","반복문을 즉시 끝낸다"]],"h":"range는 정수 범위를 만들고, enumerate는 순번과 값을 함께 꺼냅니다. zip은 두 리스트를 같은 위치끼리 짝짓고, break는 반복문을 바로 끝냅니다. '번호', '짝짓기', '끝내기'라는 단서를 각 도구에 맞춰 보세요.","w":"range는 범위, enumerate는 인덱스+값, zip은 같은 위치끼리 묶기, break는 반복 종료입니다.","an":"01 · 제어문 · p.21–23","src":"range · enumerate · zip 코드\nloop_tools.py\nnames = [\"지우\", \"민준\", \"서연\"]\nscores = [90, 85, 95]\nfor i, name in enumerate(names): # 인덱스와 값\nprint(i, name)\nfor name, score in zip(names, scores): # 두 리스트 동시에\nprint(name, score)"},{"id":"t3-09","ty":"order","lv":1,"game":false,"p":"리스트 컴프리헨션의 문법 순서를 맞추세요. [ … ]","steps":["식 (예: n**2)","for 변수","in 범위","if 조건"],"h":"리스트 컴프리헨션은 대괄호 안에 '만들 값(식)'을 먼저 쓰고, 이어서 for 반복, 마지막에 걸러낼 조건을 씁니다. 실습 TIP이 이 순서를 그대로 적어 두었습니다.","w":"컴프리헨션은 [식 for 변수 in 범위 if 조건] 순서로 씁니다. 조건은 맨 뒤에 붙입니다.","an":"01 · 실습 직접 해보기 TIP · p.25","src":"1부터 20까지의 숫자 중 3의 배수만 리스트 컴프리헨션으로 뽑아 출력해보세요.\nTIP\n조건은 [식 for 변수 in 범위 if 조건] 순서로 씁니다. range(1, 21)로 1~20 범위를 만들 수 있습니다."},{"id":"t3-10","ty":"multi","lv":2,"game":false,"p":"실습 '1~20 중 3의 배수 뽑기'에 대한 설명으로 <b>옳은<\/b> 것을 모두 고르세요.","o":["range(1, 20)이면 20까지 포함된다","조건은 if n % 3 == 0으로 쓴다","결과는 [3, 6, 9, 12, 15, 18]이다","range(1, 21)로 1~20 범위를 만든다","if 조건은 for보다 앞에 쓴다"],"a":[1,2,3],"h":"3의 배수는 3으로 나눈 나머지가 0인 수이므로 조건은 <code>n % 3 == 0<\/code>입니다. range는 끝 숫자를 포함하지 않으므로 1~20을 만들려면 끝을 21로 둡니다. 그 범위에서 3의 배수를 직접 나열해 보기와 비교해 보세요.","w":"range(1, 21)이 1~20이고, n % 3 == 0인 수는 3·6·9·12·15·18입니다. 조건은 for 뒤에 씁니다.","an":"01 · 실습 직접 해보기 · p.25","src":"1부터 20까지의 숫자 중 3의 배수만 리스트 컴프리헨션으로 뽑아 출력해보세요.\nTIP\n조건은 [식 for 변수 in 범위 if 조건] 순서로 씁니다. range(1, 21)로 1~20 범위를 만들 수 있습니다."}]},{"id":"t4","title":"함수와 고차함수","ref":"PART 1 · p.26–39","qs":[{"id":"t4-01","ty":"mc","lv":2,"game":true,"p":"<code>def power(base, exp=2)<\/code>일 때 <code>power(3)<\/code>의 결과는?","o":["9","27","6","3"],"a":0,"h":"<code>exp=2<\/code>처럼 기본값이 있는 매개변수는 호출할 때 생략하면 기본값이 쓰입니다. power(3)은 base=3이고 exp는 기본값을 쓰므로, 3의 기본값 제곱(<code>base ** exp<\/code>)을 계산하면 됩니다.","w":"exp를 생략하면 기본값 2가 쓰여 3 ** 2 = 9입니다. power(3, 3)이면 27입니다.","an":"01 · 함수 매개변수 활용하기 · p.27","src":"매개변수 활용하기 코드\nparams.py\ndef power(base, exp=2): # 기본값 있는 매개변수\nreturn base ** exp\nprint(power(3)) # exp 생략 -> 9\nprint(power(3, 3)) # 27\ndef total(*args): # 개수 제한 없는 인자\nreturn sum(args)\nprint(total(1, 2, 3, 4)) # 10"},{"id":"t4-02","ty":"mc","lv":1,"game":true,"p":"개수 제한 없이 인자를 받는 매개변수 표기는?","o":["exp=2","self","*args","global"],"a":2,"h":"params.py의 total 함수는 인자를 1개든 4개든 개수 제한 없이 받아 sum()으로 더합니다. 매개변수 이름 앞에 별표 하나를 붙이면 넘어온 인자들이 튜플로 묶여 들어옵니다.","w":"*args는 개수 제한 없는 인자를 튜플로 받습니다. exp=2는 기본값이 있는 매개변수입니다.","an":"01 · 함수 매개변수 활용하기 · p.27","src":"def total(*args): # 개수 제한 없는 인자 return sum(args) print(total(1, 2, 3, 4)) # 10"},{"id":"t4-03","ty":"mc","lv":1,"game":true,"p":"함수 안에서 전역변수의 값을 수정하려면 필요한 키워드는?","o":["local","global","return","lambda"],"a":1,"h":"함수 밖(모듈 최상단)에서 선언한 변수는 프로그램 전체에서 읽을 수 있습니다. 하지만 함수 안에서 그 값을 고치려면, 이 변수가 지역변수가 아니라는 것을 키워드로 먼저 선언해야 합니다.","w":"함수 안에서 전역변수를 수정하려면 global 키워드가 필요합니다. 지역변수는 함수가 끝나면 사라집니다.","an":"01 · 함수 지역변수 vs 전역변수 · p.28","src":"전역변수 (global) — 함수 밖(모듈 최상단)에서 선언된 변수입니다. — 프로그램 전체에서 접근할 수 있습니다. — 함수 안에서 수정하려면 global 키워드가 필요합니다."},{"id":"t4-04","ty":"mc","lv":1,"game":true,"p":"<code>return a, b, c<\/code>처럼 콤마로 여러 값을 반환하면 어떻게 묶이나요?","o":["리스트","딕셔너리","집합","튜플"],"a":3,"h":"get_stats는 <code>return min(nums), max(nums), ...<\/code>처럼 콤마로 값 세 개를 돌려주고, 받는 쪽은 <code>lo, hi, avg = ...<\/code>로 바로 나눠 받습니다. 콤마로 묶인 값 묶음이 파이썬에서 어떤 변하지 않는 자료구조가 되는지 떠올려 보세요.","w":"콤마로 여러 값을 반환하면 자동으로 튜플로 묶이고, 받는 쪽에서 여러 변수로 나눠 받을 수 있습니다.","an":"01 · 함수 여러 값 반환하기 · p.30","src":"NOTE 콤마로 여러 값을 반환하면 자동으로 튜플로 묶이고, 받는 쪽에서 여러 변수로 바로 나눠 받을 수 있습니다."},{"id":"t4-05","ty":"num","lv":2,"game":false,"p":"<code>def apply_twice(func, x): return func(func(x))<\/code>일 때 <code>apply_twice(lambda x: x + 3, 10)<\/code>의 결과는?","a":16,"unit":"","h":"apply_twice는 받은 함수를 두 번 겹쳐 적용합니다. 계산식은 func(func(10)) = (10 + 3) + 3입니다. 안쪽 결과를 다시 바깥 함수에 넣는다는 점에 주의해 계산해 보세요.","w":"람다를 두 번 적용하므로 10 + 3 + 3 = 16입니다. 함수를 인자로 넘기는 방식은 전처리 파이프라인에 자주 쓰입니다.","an":"01 · 함수 함수를 인자로 전달하기 · p.38","src":"def apply_twice(func, x): return func(func(x))"},{"id":"t4-06","ty":"ox","lv":1,"game":true,"p":"재귀 함수에는 반드시 멈추는 조건(base case)이 있어야 한다.","a":true,"h":"재귀 함수는 자기 자신을 다시 호출합니다. factorial은 n이 1 이하가 되면 1을 돌려주며 호출을 멈추는데, 이 멈추는 조건(base case)이 없으면 호출이 끝없이 이어집니다.","w":"맞습니다. 멈추는 조건이 없으면 자기 자신을 끝없이 호출해 무한 반복에 빠집니다.","an":"01 · 함수 재귀 함수 · p.31","src":"재귀 함수 코드\nrecursion.py\ndef factorial(n):\nif n <= 1:\nreturn 1 # 멈추는 조건(base case)\nreturn n * factorial(n - 1)\nprint(factorial(5)) # 120\nNOTE 재귀 함수는 자기 자신을 다시 호출합니다. 반드시 멈추는 조건이 있어야 무한 반복에 빠지지 않습니다."},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"map()과 filter()의 결과는 print하면 바로 리스트로 보인다.","a":false,"h":"map과 filter는 결과를 바로 계산해 두지 않고, 필요할 때 하나씩 꺼내 쓰는 지연 실행(lazy) 객체를 돌려줍니다. 그래서 예제들도 결과를 <code>list(...)<\/code>로 감싼 뒤 출력합니다.","w":"틀렸습니다. map·filter는 지연 실행 객체라 list()로 감싸야 눈으로 확인할 수 있습니다.","an":"01 · 종합실습 TIP · p.39","src":"filter와 map은 결과가 바로 보이지 않는 지연 실행(lazy) 객체이므로, list()로 감싸야 눈으로 확인할 수 있습니다."},{"id":"t4-08","ty":"match","lv":1,"game":false,"p":"고차함수와 역할을 연결하세요.","pairs":[["map","모든 요소에 함수를 적용"],["filter","조건이 True인 요소만 남김"],["zip","여러 리스트를 같은 위치끼리 묶음"],["reduce","누적해 하나의 값으로 줄임"]],"h":"map(함수, 리스트)는 모든 요소에 함수를 하나씩 적용하고, filter(조건함수, 리스트)는 조건이 True인 요소만 남깁니다. zip은 같은 위치끼리 묶고, reduce는 왼쪽부터 누적해 하나의 값으로 모읍니다.","w":"map은 일괄 적용, filter는 조건 거르기, zip은 묶기, functools.reduce는 합계·최댓값처럼 하나로 모으는 계산입니다.","an":"01 · 고차함수 · p.32–36","src":"NOTE reduce는 리스트를 왼쪽부터 차례로 누적시켜 하나의 값으로 줄입니다. 합계·최댓값처럼 \"하나로 모으는\" 계산에 적합합니다."},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"종합실습의 처리 순서를 맞추세요.","steps":["filter로 80점 이상 점수만 뽑기","map으로 각 점수에 5점 보너스 더하기","zip으로 학생 이름과 짝짓기","결과 출력"],"h":"TASK 문장은 처리 순서를 그대로 적어 두었습니다. 먼저 조건(80점 이상)으로 걸러 내고, 남은 점수에 보너스를 더한 뒤, 이름과 짝지어 출력합니다.","w":"filter로 걸러낸 뒤 map으로 보너스를 더하고, zip으로 이름과 짝지어 출력합니다.","an":"01 · 종합실습 직접 해보기 · p.39","src":"학생 점수 리스트에서 filter로 80점 이상인 점수만 뽑고, map으로 각 점수에 5점을 보너스로 더한 뒤, zip으로 학생 이름과 짝지어 출력해보세요."},{"id":"t4-10","ty":"multi","lv":2,"game":true,"p":"람다 함수(lambda)가 적합한 경우를 모두 고르세요.","o":["sort의 key로 쓸 함수","이름 없이 한 줄로 쓸 함수","docstring으로 설명을 남길 함수","복잡한 로직을 자주 재사용할 함수","map·filter에 잠깐 쓸 함수"],"a":[0,1,4],"h":"자료는 일반 함수(def)를 이름을 붙여 여러 줄로 정의하는, 복잡하고 재사용이 잦은 기능용으로 봅니다. lambda는 이름 없이 한 줄로 정의하며, map·filter·sort의 key처럼 잠깐 쓰고 버릴 함수에 적합하다고 설명합니다.","w":"람다는 이름 없이 한 줄로, map·filter·sort의 key처럼 잠깐 쓸 때 적합합니다. 복잡한 로직·재사용·docstring은 def가 낫습니다.","an":"01 · 함수 일반 함수 vs 람다 함수 · p.37","src":"람다 함수 (lambda) — 이름 없이 한 줄로 간단히 정의합니다. — map· filter· sort의 key처럼 잠깐 쓰고 버릴 함수에 적합합니다. — 조건이 복잡해지면 오히려 일반 함수가 더 읽기 쉽습니다."}]},{"id":"t5","title":"모듈·예외처리·파일 입출력","ref":"PART 1 · p.40–45","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"NumPy를 불러오는 관례적인 코드는?","o":["import np as numpy","include numpy","import numpy as np","from np import numpy"],"a":2,"h":"모듈은 import로 불러오며, as를 붙이면 짧은 별칭으로 부를 수 있습니다. NumPy는 관례적으로 두 글자 별칭을 붙여 쓰고, 설치 확인 명령에서도 같은 코드가 쓰입니다.","w":"<code>import numpy as np<\/code>로 불러와 np라는 별칭을 쓰는 것이 관례입니다.","an":"01 · 모듈 모듈 불러오기 · p.40","src":"모듈 불러오기 코드\nmodules.py\nimport math\nfrom datetime import datetime\nimport numpy as np # 관례적으로 별칭을 붙입니다\nprint(math.sqrt(16)) # 4.0\nprint(datetime.now()) # 현재 날짜와 시간"},{"id":"t5-02","ty":"mc","lv":1,"game":true,"p":"난수 생성과 무작위 선택 기능을 제공하는 표준 라이브러리는?","o":["os","sys","json","random"],"a":3,"h":"자주 쓰는 표준 라이브러리 표에서 os는 경로·환경변수, sys는 인터프리터 정보, math는 수학 함수, datetime은 날짜와 시간을 맡습니다. 난수 생성과 무작위 선택을 맡는 모듈은 영어로 '무작위'라는 뜻의 이름입니다.","w":"random은 난수와 무작위 선택, os는 경로·환경변수, sys는 인터프리터 정보, json은 JSON 데이터를 다룹니다.","an":"01 · 모듈 자주 쓰는 표준 라이브러리 · p.41","src":"math 제곱근, 삼각함수 등 수학 함수를 제공합니다. random 난수 생성, 무작위 선택 기능을 제공합니다."},{"id":"t5-03","ty":"mc","lv":1,"game":true,"p":"숫자를 0으로 나눌 때 발생하는 예외는?","o":["ZeroDivisionError","ValueError","TypeError","IndexError"],"a":0,"h":"exceptions.py는 두 가지 예외를 따로 잡습니다. 숫자가 아닌 값을 넣으면 ValueError, 10을 0으로 나누려 하면 또 다른 예외가 나며 '0으로 나눌 수 없습니다.'를 출력합니다. 예외 이름에는 '0'과 '나눗셈'이 영어로 들어 있습니다.","w":"0으로 나누면 ZeroDivisionError가 발생합니다. 숫자가 아닌 입력을 int()로 바꾸면 ValueError입니다.","an":"01 · 예외처리 자주 만나는 예외 유형 · p.43","src":"IndexError 리스트 범위를 벗어난 인덱스에 접근할 때 발생합니다. KeyError 딕셔너리에 없는 키로 접근할 때 발생합니다. ZeroDivisionError 숫자를 0으로 나눌 때 발생합니다."},{"id":"t5-04","ty":"mc","lv":1,"game":true,"p":"딕셔너리에 없는 키로 접근하면 발생하는 예외는?","o":["IndexError","KeyError","ValueError","TypeError"],"a":1,"h":"예외 이름은 문제가 생긴 대상을 가리킵니다. 리스트 범위를 벗어나면 IndexError, 자료형이 안 맞으면 TypeError가 납니다. 딕셔너리는 키로 값을 찾으므로, 없는 키로 접근하면 그 '키'의 이름이 붙은 예외가 납니다.","w":"없는 키로 접근하면 KeyError, 리스트 범위를 벗어나면 IndexError입니다.","an":"01 · 예외처리 자주 만나는 예외 유형 · p.43","src":"KeyError 딕셔너리에 없는 키로 접근할 때 발생합니다."},{"id":"t5-05","ty":"mc","lv":2,"game":true,"p":"파일을 다룰 때 with 문을 쓰는 이유는?","o":["파일 내용을 암호화해서","파일을 자동으로 닫아 주어서","읽기 속도가 두 배가 되어서","파일이 없으면 자동으로 읽어서"],"a":1,"h":"open()으로 연 파일은 다 쓰면 닫아야 합니다. file_io.py는 with 블록 안에서 파일을 쓰고 읽은 뒤, 블록이 끝날 때 무슨 일이 일어나는지 마지막 주석에 적어 두었습니다.","w":"with 문을 쓰면 블록이 끝날 때 파일을 자동으로 닫아 줍니다.","an":"01 · 파일입출력 파일 읽고 쓰기 · p.44","src":"# with 문을 쓰면 파일을 자동으로 닫아줍니다"},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"<code>math.sqrt(16)<\/code>의 결과는 4.0이다.","a":true,"h":"math.sqrt는 제곱근을 구하는 함수이고, 결과를 실수(float)로 돌려줍니다. modules.py의 주석은 16을 넣었을 때의 출력값을 소수점 형태로 보여 줍니다.","w":"맞습니다. modules.py에서 <code>print(math.sqrt(16))<\/code>의 결과는 4.0입니다.","an":"01 · 모듈 모듈 불러오기 · p.40","src":"print(math.sqrt(16)) # 4.0"},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"<code>open(\"notes.txt\", \"w\")<\/code>는 파일 내용을 읽을 때 쓰는 모드다.","a":false,"h":"open()의 두 번째 인자는 파일을 여는 모드입니다. file_io.py는 'w'로 열어 f.write()로 글을 쓰고, 'r'로 열어 f.read()로 내용을 읽습니다. 각 모드 글자가 어떤 영어 단어의 머리글자인지 생각해 보세요.","w":"틀렸습니다. \"w\"는 쓰기(write) 모드이고, 읽을 때는 \"r\"(read) 모드를 씁니다.","an":"01 · 파일입출력 파일 읽고 쓰기 · p.44","src":"with open(\"notes.txt\", \"w\") as f: f.write(\"AI 개발 공부 중\\n\") with open(\"notes.txt\", \"r\") as f: content = f.read()"},{"id":"t5-08","ty":"match","lv":1,"game":false,"p":"표준 라이브러리와 용도를 연결하세요.","pairs":[["os","파일·폴더 경로, 환경변수"],["sys","인터프리터 정보와 실행 인자"],["math","제곱근·삼각함수"],["datetime","날짜와 시간"],["json","JSON 데이터 읽고 쓰기"]],"h":"모듈 이름이 다루는 대상을 그대로 말해 줍니다. os는 운영체제(경로·환경변수), sys는 시스템·인터프리터(실행 인자), math는 수학 함수입니다. datetime은 날짜와 시간, json은 JSON 데이터를 다룹니다.","w":"os는 운영체제 기능, sys는 인터프리터, math는 수학 함수, datetime은 날짜·시간, json은 JSON 데이터입니다.","an":"01 · 모듈 자주 쓰는 표준 라이브러리 표 · p.41","src":"os 파일·폴더 경로, 환경변수 등 운영체제 기능을 다룹니다. sys 인터프리터 관련 정보와 실행 인자를 다룹니다. math 제곱근, 삼각함수 등 수학 함수를 제공합니다. random 난수 생성, 무작위 선택 기능을 제공합니다. datetime 날짜와 시간을 다룹니다. json JSON 형식 데이터를 읽고 씁니다."},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"exceptions.py에 숫자가 아닌 값을 입력했을 때의 흐름을 맞추세요.","steps":["try에서 int(input())을 시도","ValueError 발생","except ValueError에서 '숫자가 아닙니다.' 출력","finally에서 '입력 처리 완료' 출력"],"h":"try 블록에서 <code>int(input())<\/code>이 숫자가 아닌 문자열을 받으면 형식 오류 예외가 납니다. 그러면 같은 이름의 except 블록이 메시지를 출력하고, finally 블록은 예외가 났든 안 났든 마지막에 항상 실행됩니다.","w":"int() 변환에 실패해 ValueError가 나고, 해당 except가 실행된 뒤 finally가 실행됩니다.","an":"01 · 예외처리 try / except · p.42","src":"try: num = int(input(\"숫자 입력: \")) result = 10 / num except ValueError: print(\"숫자가 아닙니다.\") except ZeroDivisionError: print(\"0으로 나눌 수 없습니다.\") finally: print(\"입력 처리 완료\")"},{"id":"t5-10","ty":"multi","lv":2,"game":false,"p":"예외 유형과 발생 상황을 <b>바르게<\/b> 짝지은 것을 모두 고르세요.","o":["ZeroDivisionError: 없는 키로 접근","KeyError: 숫자를 0으로 나눔","ValueError: 값의 형식이 잘못됨","TypeError: 자료형이 맞지 않는 연산","IndexError: 범위를 벗어난 인덱스"],"a":[2,3,4],"h":"자료의 예외 표에서 TypeError는 자료형이 맞지 않는 연산, ValueError는 값의 형식 오류, IndexError는 범위를 벗어난 인덱스입니다. KeyError는 딕셔너리에 없는 키, ZeroDivisionError는 0으로 나누기입니다. 보기의 짝이 표와 일치하는지 확인하세요.","w":"TypeError·IndexError·ValueError 설명이 맞습니다. KeyError는 없는 키 접근, ZeroDivisionError는 0으로 나눌 때입니다.","an":"01 · 예외처리 자주 만나는 예외 유형 표 · p.43","src":"TypeError 자료형이 맞지 않는 연산을 할 때 발생합니다. ValueError 값의 형식이 올바르지 않을 때 발생합니다. IndexError 리스트 범위를 벗어난 인덱스에 접근할 때 발생합니다. KeyError 딕셔너리에 없는 키로 접근할 때 발생합니다. ZeroDivisionError 숫자를 0으로 나눌 때 발생합니다."}]},{"id":"t6","title":"클래스 기초와 캡슐화","ref":"PART 2 · p.47–57·65–67","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"붕어빵 비유에서 '붕어빵 틀'에 해당하는 것은?","o":["인스턴스","메서드","클래스","속성"],"a":2,"h":"자료는 객체를 만들기 위한 '설계도'와, 그 설계도로 실제로 만들어진 '객체'를 구분합니다. 붕어빵 비유에서 찍어 낸 붕어빵 하나하나는 실제 객체이고, 여러 개를 찍어 내는 틀은 설계도에 해당합니다.","w":"클래스는 객체를 만드는 설계도(틀)이고, 인스턴스는 그 틀로 찍어낸 실제 객체입니다.","an":"02 · 개념 클래스 vs 인스턴스 · p.48","src":"— 객체를 만들기 위한 '설계도'입니다. — 붕어빵 틀에 비유할 수 있습니다. — 속성과 메서드의 틀을 정의합니다."},{"id":"t6-02","ty":"mc","lv":1,"game":true,"p":"인스턴스가 생성될 때 자동으로 호출되는 생성자 메서드는?","o":["__init__","__str__","__len__","__eq__"],"a":0,"h":"매직 메서드는 이름 앞뒤에 밑줄 두 개가 붙고, 특정 순간에 파이썬이 자동으로 호출합니다. 인스턴스를 만들 때 불리는 생성자는 '초기화(initialize)'의 줄임말을 이름으로 씁니다.","w":"__init__은 인스턴스가 만들어질 때 자동 호출되는 생성자입니다. __str__은 출력 형식, __len__은 len() 동작을 정의합니다.","an":"02 · 매직메서드 자주 쓰는 매직 메서드 · p.54","src":"__init__ 인스턴스가 생성될 때 자동으로 호출되는 생성자입니다."},{"id":"t6-03","ty":"mc","lv":1,"game":true,"p":"print()로 객체를 출력할 때 보여줄 문자열을 정하는 메서드는?","o":["__init__","__len__","__eq__","__str__"],"a":3,"h":"magic_str.py의 Dog 클래스는 print(Dog(...))을 했을 때 'Dog(이름=초코, 나이=3)'처럼 보이도록 문자열을 돌려주는 매직 메서드를 정의합니다. 개발자용 공식 표현은 __repr__, 사용자에게 보여 줄 '문자열'은 다른 매직 메서드가 맡습니다.","w":"__str__을 정의하면 print(Dog(\"초코\", 3))처럼 원하는 형식으로 출력됩니다.","an":"02 · 매직메서드 __str__로 출력 형식 정하기 · p.55","src":"__str__ print()로 출력할 때 보여줄 문자열을 정의합니다. __repr__ 개발자가 보는 객체의 공식적인 표현을 정의합니다."},{"id":"t6-04","ty":"mc","lv":2,"game":true,"p":"속성 이름 앞에 밑줄 두 개를 붙인 <code>__name<\/code>의 의미는?","o":["누구나 쓰는 공개 속성","강하게 숨김 처리된 비공개 속성","클래스 변수라는 표시","매직 메서드라는 표시"],"a":1,"h":"이름 앞의 밑줄은 '직접 건드리지 말라'는 비공개 표시입니다. 자료는 밑줄 하나(_name)를 관례적 비공개로, 밑줄 두 개(__name)는 그보다 더 강한 처리로 구분합니다.","w":"_name은 관례적 비공개, __name은 강하게 숨김 처리됩니다. 밑줄 없는 self.name은 공개 속성입니다.","an":"02 · 캡슐화 캡슐화란 · p.56","src":"— 이름 앞에 밑줄을 붙여 직접 건드리지 말라고 표시합니다. — _name은 관례적 비공개, __name은 강하게 숨김 처리됩니다."},{"id":"t6-05","ty":"mc","lv":2,"game":true,"p":"<code>@property<\/code>와 <code>@balance.setter<\/code>를 함께 쓰는 목적은?","o":["속성을 클래스 변수로 바꾸려고","인스턴스를 복사하려고","값을 읽고 쓸 때 검증 로직을 넣으려고","메서드를 외부에서 숨기려고"],"a":2,"h":"Account 예제는 잔액을 읽을 때는 @property, 쓸 때는 @balance.setter를 거치게 합니다. setter 안에서 값이 음수이면 ValueError를 일으키므로, 잘못된 값이 들어오는 것을 막을 수 있습니다.","w":"property와 setter를 쓰면 값을 쓸 때마다 검증할 수 있습니다. Account 예제는 음수 잔액에 ValueError를 일으킵니다.","an":"02 · 캡슐화 property로 값 검증하기 · p.57","src":"property로 값 검증하기 코드\nproperty_ex.py\nclass Account:\ndef __init__(self, balance):\nself._balance = balance\n@property\ndef balance(self):\nreturn self._balance\n@balance.setter\ndef balance(self, value):\nif value < 0:\nraise ValueError(\"잔액은 음수일 수 없습니다\")\nself._balance = value\nNOTE @property와 @속성명.setter를 함께 쓰면 값을 읽고 쓸 때마다 검증 로직을 끼워넣을 수 있습니다."},{"id":"t6-06","ty":"ox","lv":1,"game":true,"p":"메서드의 첫 번째 매개변수 self를 빠뜨리면 TypeError가 발생한다.","a":true,"h":"인스턴스 메서드는 호출될 때 인스턴스 자신이 첫 번째 인자로 자동 전달됩니다. 이 자리를 받을 매개변수 self가 없으면 인자 개수가 맞지 않아 오류가 나며, 자료의 '자주 하는 실수' 표가 그 오류 이름을 적어 둡니다.","w":"맞습니다. 메서드의 첫 매개변수는 항상 self이고, 빠뜨리면 TypeError가 납니다.","an":"02 · 실수방지 자주 하는 실수 · p.74","src":"self 빠뜨리기 메서드의 첫 매개변수 self를 빠뜨리면 TypeError가 발생합니다."},{"id":"t6-07","ty":"ox","lv":2,"game":true,"p":"클래스 변수는 인스턴스마다 서로 다른 값을 가진다.","a":false,"h":"클래스 변수는 class 블록 바로 아래에 선언하고 클래스 전체가 공유합니다. 인스턴스 변수는 __init__ 안에서 self.으로 선언해 인스턴스마다 따로 가집니다. class_var.py에서 a와 b의 species가 어떻게 출력됐는지 떠올려 보세요.","w":"틀렸습니다. 클래스 변수는 클래스 전체가 공유합니다. 인스턴스마다 다른 값은 __init__에서 self.로 만드는 인스턴스 변수입니다.","an":"02 · 변수 클래스 변수 vs 인스턴스 변수 · p.52–53","src":"클래스 변수 — 클래스 전체가 공유하는 변수입니다. — 모든 인스턴스가 같은 값을 참조합니다. — class 블록 바로 아래에 선언합니다."},{"id":"t6-08","ty":"match","lv":2,"game":false,"p":"메서드 종류와 설명을 연결하세요.","pairs":[["def method(self)","인스턴스 데이터(self)에 접근"],["@classmethod","클래스 자체(cls)를 다룸, 대안 생성자"],["@staticmethod","self·cls 없이 관련 함수를 정의"]],"h":"메서드 종류는 첫 매개변수로 구분합니다. self를 받으면 인스턴스 데이터를 다루고, @classmethod는 cls로 클래스 자체를 다루며 대안 생성자로도 쓰입니다. @staticmethod는 self도 cls도 받지 않는 독립 함수입니다.","w":"인스턴스 메서드는 self, 클래스 메서드는 cls를 받고, 스태틱 메서드는 둘 다 받지 않습니다.","an":"02 · 메서드종류 인스턴스·클래스·스태틱 메서드 · p.65","src":"인스턴스 · 클래스 · 스태틱 메서드 코드\n항목 설명\ndef method(self) 인스턴스 메서드 — 인스턴스 데이터(self)에 접근합니다.\n@classmethod 클래스 자체(cls)를 다루며, 대안 생성자로도 자주 쓰입니다.\n@staticmethod self· cls 없이 클래스와 관련된 독립적인 함수를 정의합니다."},{"id":"t6-09","ty":"order","lv":1,"game":false,"p":"실습 'Person 클래스 만들기'의 작성 순서를 맞추세요.","steps":["class Person: 선언","__init__(self, name, age)에서 속성 저장","introduce(self) 메서드 작성","인스턴스를 만들어 introduce() 호출"],"h":"클래스는 먼저 class 문으로 틀을 선언하고, __init__에서 name·age 같은 속성(데이터)을 저장합니다. 그다음 동작을 담은 메서드를 정의하고, 마지막으로 인스턴스를 만들어 그 메서드를 호출합니다.","w":"클래스를 선언하고 __init__에서 속성을 저장한 뒤 메서드를 만들고, 인스턴스를 만들어 호출합니다.","an":"02 · 실습 직접 해보기 · p.51","src":"Person 클래스를 만들어 name, age 속성과, 자기소개 문장을 반환하는 introduce() 메서드를 작성해보세요."},{"id":"t6-10","ty":"multi","lv":2,"game":true,"p":"<code>@dataclass<\/code>가 자동으로 만들어 주는 것을 모두 고르세요.","o":["__eq__","__repr__","__init__","__getitem__","@property 검증 로직"],"a":[0,1,2],"h":"@dataclass를 붙이면 반복적으로 쓰던 매직 메서드를 직접 작성하지 않아도 됩니다. Point(3, 5)를 print하면 'Point(x=3, y=5)'처럼 보이는 것도 그중 하나 덕분입니다. 자료의 NOTE가 자동 생성되는 메서드 이름을 나열합니다.","w":"@dataclass는 __init__, __repr__, __eq__ 등을 자동 생성합니다. __getitem__이나 검증 로직은 직접 작성해야 합니다.","an":"02 · DATACLASS dataclass로 간결하게 · p.67","src":"NOTE @dataclass를 쓰면 __init__, __repr__, __eq__ 등을 직접 작성하지 않아도 자동으로 생성됩니다."}]},{"id":"t7","title":"상속·다형성과 AI 클래스","ref":"PART 2 · p.58–78","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"자식 클래스의 __init__에서 부모 생성자를 호출하는 코드는?","o":["self.__init__(name)","super().__init__(name)","Animal = name","parent.init(name)"],"a":1,"h":"자식 클래스 Dog는 breed라는 속성을 더 받지만, name을 저장하는 일은 부모 Animal의 생성자에 맡깁니다. 부모 클래스를 가리키는 내장 함수를 호출한 뒤, 그 결과의 __init__에 name을 넘깁니다.","w":"<code>super().__init__(name)<\/code>로 부모 생성자를 호출한 뒤 자식만의 속성(breed)을 추가합니다.","an":"02 · 상속 super()로 부모 기능 활용하기 · p.60","src":"super()로 부모 기능 활용하기 코드\nsuper_ex.py\nclass Animal:\ndef __init__(self, name):\nself.name = name\nclass Dog(Animal):\ndef __init__(self, name, breed):\nsuper().__init__(name) # 부모 생성자 호출\nself.breed = breed\nd = Dog(\"초코\", \"푸들\")\nprint(d.name, d.breed)"},{"id":"t7-02","ty":"mc","lv":1,"game":true,"p":"부모 클래스의 메서드를 자식 클래스에서 다시 정의하는 것은?","o":["캡슐화","컴포지션","형변환","메서드 오버라이딩"],"a":3,"h":"자식 클래스는 부모의 메서드를 그대로 쓰거나, 같은 이름으로 다시 정의할 수 있습니다. override.py에서 Shape의 area()는 0을 돌려주지만, Circle은 같은 이름의 area()를 원의 넓이 공식으로 새로 작성했습니다.","w":"부모 메서드를 자식에서 재정의하는 것을 오버라이딩이라고 합니다.","an":"02 · 상속 메서드 오버라이딩 · p.61","src":"메서드 오버라이딩 코드\noverride.py\nclass Shape:\ndef area(self):\nreturn 0\nclass Circle(Shape):\ndef __init__(self, r):\nself.r = r\ndef area(self): # 부모 메서드 재정의\nreturn 3.14 * self.r ** 2\nprint(Circle(3).area()) # 28.26"},{"id":"t7-03","ty":"mc","lv":2,"game":true,"p":"'Car는 Engine을 가진다(has-a)' 관계에 알맞은 설계는?","o":["컴포지션","상속","다형성","추상 클래스"],"a":0,"h":"자료는 두 설계 방식을 관계로 구분합니다. '~는 ~이다(is-a)'이면 상속을 씁니다. '~는 ~를 가진다(has-a)'이면 클래스 안에 다른 클래스의 인스턴스를 속성으로 두는 방식을 쓰며, 이쪽이 더 유연하고 느슨하게 결합됩니다.","w":"has-a 관계는 클래스 안에 다른 클래스의 인스턴스를 속성으로 두는 컴포지션이 알맞습니다. is-a는 상속입니다.","an":"02 · 설계 컴포지션 vs 상속 · p.73","src":"— '~는 ~를 가진다' 관계일 때 사용합니다. (Car는 Engine을 가진다) — 클래스 안에 다른 클래스의 인스턴스를 속성으로 둡니다. — 더 유연하고 느슨하게 결합된 구조를 만들 수 있습니다."},{"id":"t7-04","ty":"mc","lv":2,"game":false,"p":"<code>__len__<\/code>과 <code>__getitem__<\/code>을 구현한 Dataset 클래스로 할 수 있는 것은?","o":["모델을 자동으로 학습하기","파일을 자동 저장하기","len(dataset), dataset[0]처럼 쓰기","예외를 자동 처리하기"],"a":2,"h":"매직 메서드는 내장 문법과 짝을 이룹니다. __len__은 len() 함수, __getitem__은 대괄호 인덱싱 <code>[idx]<\/code>에 대응합니다. ImageDataset이 이 둘을 구현하면 리스트처럼 다룰 수 있습니다.","w":"__len__과 __getitem__을 구현하면 len(dataset), dataset[0]처럼 자연스럽게 쓸 수 있습니다.","an":"02 · 실전예제 Dataset 클래스 · p.69","src":"NOTE __len__과 __getitem__을 구현하면 len(dataset), dataset[0]처럼 자연스럽게 사용할 수 있습니다."},{"id":"t7-05","ty":"num","lv":2,"game":false,"p":"<code>area()<\/code>가 <code>3.14 * self.r ** 2<\/code>일 때 <code>Circle(3).area()<\/code>의 결과는?","a":28.26,"unit":"","tol":0.01,"h":"Circle은 부모 Shape의 area()를 재정의해 원의 넓이를 돌려줍니다. 계산식은 3.14 × r²이고, Circle(3)이므로 r = 3을 넣습니다. ** 2는 제곱이라는 점에 주의해 계산해 보세요.","w":"3.14 × 3² = 3.14 × 9 = 28.26입니다. 부모 Shape의 area()(0 반환)를 Circle이 재정의했습니다.","an":"02 · 상속 메서드 오버라이딩 · p.61","src":"메서드 오버라이딩 코드\noverride.py\nclass Shape:\ndef area(self):\nreturn 0\nclass Circle(Shape):\ndef __init__(self, r):\nself.r = r\ndef area(self): # 부모 메서드 재정의\nreturn 3.14 * self.r ** 2\nprint(Circle(3).area()) # 28.26"},{"id":"t7-06","ty":"ox","lv":1,"game":true,"p":"추상 클래스 <code>Shape(ABC)<\/code>는 직접 인스턴스로 만들 수 없다.","a":true,"h":"ABC를 상속하고 @abstractmethod를 붙인 메서드는 '자식이 반드시 구현해야 하는 규칙'이 됩니다. 자료의 NOTE는 추상 클래스 자체로 인스턴스를 만들 수 있는지, 그리고 area()를 구현하지 않은 자식은 어떻게 되는지 설명합니다.","w":"맞습니다. Shape 자체는 인스턴스로 만들 수 없고, area()를 구현하지 않은 자식 클래스도 만들 수 없습니다.","an":"02 · 추상클래스 추상 클래스로 규칙 강제하기 · p.64","src":"추상 클래스로 규칙 강제하기 코드\nabstract.py\nfrom abc import ABC, abstractmethod\nclass Shape(ABC):\n@abstractmethod\ndef area(self):\npass # 자식이 반드시 구현\nclass Circle(Shape):\ndef __init__(self, r): self.r = r\ndef area(self): return 3.14 * self.r ** 2\nNOTE Shape 자체는 인스턴스로 만들 수 없고, area()를 구현하지 않은 자식 클래스도 만들 수 없습니다."},{"id":"t7-07","ty":"ox","lv":2,"game":true,"p":"<code>def __init__(self, items=[])<\/code>처럼 리스트를 기본값으로 쓰는 것이 권장된다.","a":false,"h":"기본값으로 둔 리스트는 함수를 정의할 때 한 번만 만들어집니다. 그래서 여러 인스턴스가 같은 리스트를 나눠 쓰게 됩니다. 자료의 '자주 하는 실수' 표는 이 '가변 기본값'을 실수 항목으로 소개합니다.","w":"틀렸습니다. 리스트 같은 가변 객체를 기본값으로 쓰면 안 됩니다.","an":"02 · 실수방지 자주 하는 실수 · p.74","src":"가변 기본값 def __init__(self, items=[])처럼 리스트를 기본값으로 쓰면 안 됩니다."},{"id":"t7-08","ty":"match","lv":2,"game":false,"p":"개념과 예를 연결하세요.","pairs":[["상속 (is-a)","Dog는 Animal이다"],["컴포지션 (has-a)","Car는 Engine을 가진다"],["다형성","도형마다 area() 계산 방식이 다르다"],["추상 클래스","자식이 area()를 반드시 구현한다"]],"h":"상속은 '~이다', 컴포지션은 '~를 가진다' 관계입니다. 다형성은 같은 이름의 메서드가 객체마다 다르게 동작하는 것이고, 추상 클래스는 자식에게 특정 메서드를 반드시 구현하도록 규칙을 강제합니다.","w":"상속은 is-a, 컴포지션은 has-a, 다형성은 같은 이름의 다른 동작, 추상 클래스는 구현을 강제합니다.","an":"02 · 상속·다형성·추상클래스·설계 · p.58–64·73","src":"상속 (is-a) — '~는 ~이다' 관계일 때 사용합니다. (Dog는 Animal이다) — 부모의 기능을 그대로 물려받습니다. — 계층이 깊어지면 오히려 복잡해질 수 있습니다. 컴포지션 (has-a) — '~는 ~를 가진다' 관계일 때 사용합니다. (Car는 Engine을 가진다)"},{"id":"t7-09","ty":"order","lv":2,"game":false,"p":"compose.py가 클래스를 조합해 쓰는 순서를 맞추세요.","steps":["ImageDataset으로 데이터셋 생성","SimpleClassifier로 분류기 생성","for문에서 dataset[i]로 경로·라벨 꺼내기","clf.predict로 결과 출력"],"h":"compose.py는 먼저 데이터를 담는 객체와 예측을 맡는 객체를 차례로 만듭니다. 그다음 for문에서 데이터셋을 인덱싱해 경로와 라벨을 꺼내고, 분류기의 predict로 결과를 출력합니다.","w":"데이터셋과 분류기를 만든 뒤 반복문에서 데이터를 꺼내 예측합니다. 각 클래스가 자기 역할만 책임집니다.","an":"02 · 실전예제 클래스 조합해서 쓰기 · p.71","src":"dataset = ImageDataset(paths, labels) clf = SimpleClassifier(my_model, threshold=0.6) for i in range(len(dataset)): path, label = dataset[i] result = clf.predict(load_image(path))"},{"id":"t7-10","ty":"multi","lv":2,"game":true,"p":"AI 개발에서 클래스를 쓰는 이유로 자료에 나온 것을 모두 고르세요.","o":["다른 프로젝트에서 그대로 재사용","코드 실행 속도가 항상 빨라짐","데이터셋·전처리·모델을 역할별로 분리","하이퍼파라미터 등 설정을 속성으로 관리","예외 처리가 필요 없어짐"],"a":[0,2,3],"h":"자료는 데이터셋·전처리·모델을 각각 클래스로 나누면 코드가 명확해지고 다른 프로젝트에서도 다시 쓸 수 있다고 말합니다. 또 하이퍼파라미터 같은 설정을 속성으로 묶어 관리하기 편하다고 설명합니다.","w":"클래스로 역할을 나누면 코드가 명확해지고 재사용하기 쉬우며, 설정값도 속성으로 관리할 수 있습니다.","an":"02 · AI 와 클래스 왜 클래스를 쓰는가 · p.68","src":"데이터셋, 전처리, 모델을 각각 클래스로 분리 하면 코드가 명확해지고, 다른 프로젝트에서도 그대로 재사용할 수 있습니다."}]},{"id":"t8","title":"NumPy 배열과 연산","ref":"PART 3 · p.80–99","qs":[{"id":"t8-01","ty":"mc","lv":1,"game":true,"p":"각 차원의 크기를 튜플로 돌려주는 배열 속성은?","o":[".ndim",".dtype",".size",".shape"],"a":3,"h":"배열의 주요 속성 표에서 ndim은 차원 수, dtype은 요소의 자료형, size는 전체 요소 개수를 돌려줍니다. 예: (2, 3)처럼 차원별 크기를 튜플로 돌려주는 속성은 '모양'이라는 뜻의 이름입니다.","w":".shape는 (2, 3)처럼 차원별 크기, .ndim은 차원 수, .dtype은 자료형, .size는 전체 요소 수입니다.","an":"03 · 배열속성 배열의 주요 속성 · p.83","src":"배열의 주요 속성 코드\n항목 설명\n.shape 각 차원의 크기를 튜플로 반환합니다. 예: (2, 3)\n.ndim 배열의 차원 수를 반환합니다.\n.dtype 배열 요소의 자료형을 반환합니다 (예: int64, float32).\n.size 배열에 담긴 전체 요소의 개수를 반환합니다."},{"id":"t8-02","ty":"mc","lv":1,"game":true,"p":"<code>np.arange(0, 10, 2)<\/code>가 만드는 값은?","o":["0, 2, 4, 6, 8, 10","0, 2, 4, 6, 8","2, 4, 6, 8, 10","0~1 사이 실수 5개"],"a":1,"h":"np.arange(시작, 끝, 간격)은 파이썬 range처럼 시작값부터 간격만큼 늘려 가며 끝값 바로 앞까지 만듭니다. 0에서 출발해 2씩 더하되, 10은 포함하지 않는다는 점에 주의하세요.","w":"arange(시작, 끝, 간격)은 끝 값을 빼고 0, 2, 4, 6, 8을 만듭니다. 0~1을 5등분하는 것은 linspace입니다.","an":"03 · 배열생성 ndarray 만들기 · p.82","src":"ndarray 만들기 코드\ncreate_array.py\nimport numpy as np\na = np.array([1, 2, 3]) # 리스트로부터 생성\nb = np.zeros((2, 3)) # 0으로 채운 2x3 배열\nc = np.ones((3, 3)) # 1로 채운 3x3 배열\nd = np.arange(0, 10, 2) # 0,2,4,6,8\ne = np.linspace(0, 1, 5) # 0~1을 5등분"},{"id":"t8-03","ty":"mc","lv":2,"game":true,"p":"<code>a = np.array([[1, 2, 3], [4, 5, 6]])<\/code>일 때 <code>a[:, 1]<\/code>의 결과는?","o":["[4 5 6]","[1 2 3]","[2 5]","[2 3]"],"a":2,"h":"2차원 배열은 <code>a[행, 열]<\/code>로 고르며, 콜론(:)은 '전부'를 뜻합니다. 따라서 <code>a[:, 1]<\/code>은 모든 행에서 1번 열(0부터 셈)의 값을 모읍니다. 각 행 [1, 2, 3]과 [4, 5, 6]에서 두 번째 값을 골라 보세요.","w":"a[:, 1]은 모든 행의 1번 열이라 [2 5]입니다. a[1, :]은 1행 전체 [4 5 6]입니다.","an":"03 · 인덱싱 인덱싱과 슬라이싱 · p.84","src":"인덱싱과 슬라이싱 코드\nindexing.py\na = np.array([[1, 2, 3], [4, 5, 6]])\nprint(a[0, 1]) # 2 — 0행 1열\nprint(a[:, 1]) # [2 5] — 모든 행의 1열\nprint(a[1, :]) # [4 5 6] — 1행 전체\nprint(a[0:2, 1:3]) # 부분 배열 슬라이싱"},{"id":"t8-04","ty":"mc","lv":1,"game":true,"p":"최댓값이 '위치한 인덱스'를 돌려주는 함수는?","o":["np.argmax","np.max","np.mean","np.std"],"a":0,"h":"np.max(a)는 최댓값 자체를 돌려줍니다. 이름 앞에 arg가 붙은 함수는 값이 아니라 그 값이 '어디에 있는지', 곧 인덱스를 돌려줍니다.","w":"np.argmax는 최댓값의 인덱스, np.max는 최댓값 자체를 돌려줍니다.","an":"03 · 통계함수 자주 쓰는 통계 함수 · p.88","src":"np.max(a) / np.min(a) 최댓값 / 최솟값을 구합니다. np.argmax(a) 최댓값이 위치한 인덱스를 반환합니다."},{"id":"t8-05","ty":"mc","lv":2,"game":true,"p":"<code>np.random.default_rng(seed=42)<\/code>처럼 seed를 고정하는 이유는?","o":["난수를 더 빨리 만들려고","실험 결과를 재현하려고","정규분포만 나오게 하려고","메모리를 아끼려고"],"a":1,"h":"난수는 seed(시작값)에 따라 정해진 순서로 만들어집니다. 그래서 seed를 고정하면 실행할 때마다 같은 난수가 나오고, 다른 사람이 같은 코드를 돌려도 같은 결과를 얻습니다.","w":"seed를 고정하면 실행할 때마다 같은 난수가 나와 실험 결과를 재현할 수 있습니다.","an":"03 · 난수 난수 생성하기 · p.92","src":"NOTE seed를 고정하면 실행할 때마다 같은 난수가 나와, 실험 결과를 재현할 수 있습니다."},{"id":"t8-06","ty":"ox","lv":1,"game":true,"p":"<code>[1, 2, 3] + 10<\/code>을 NumPy 배열로 계산하면 [11, 12, 13]이 된다.","a":true,"h":"크기가 다른 배열끼리 계산할 때 조건이 맞으면 작은 쪽이 자동으로 크기를 맞추는데, 이를 브로드캐스팅이라고 합니다. 스칼라 하나를 더하면 그 값이 배열의 모든 요소에 각각 적용됩니다.","w":"맞습니다. 브로드캐스팅으로 스칼라 10이 모든 요소에 더해집니다.","an":"03 · 브로드캐스팅 · p.86","src":"크기가 다를 때 — 조건이 맞으면 작은 배열이 자동으로 크기를 맞춥니다. — [1,2,3] + 10 = [11,12,13] — 스칼라가 배열 전체에 적용됩니다."},{"id":"t8-07","ty":"ox","lv":2,"game":true,"p":"NumPy 배열은 서로 다른 자료형을 섞어 담을 수 있어서 빠르다.","a":false,"h":"자료는 파이썬 리스트와 NumPy 배열을 비교합니다. 서로 다른 자료형을 섞어 담는 유연함은 리스트의 특징이며, 그 대가로 반복문으로 하나씩 계산해야 해 느립니다. NumPy 배열은 반대로 모든 요소의 자료형이 같습니다.","w":"틀렸습니다. NumPy 배열은 모든 요소가 같은 자료형이라 메모리를 효율적으로 쓰고 벡터 연산으로 빠르게 계산합니다.","an":"03 · 성능 NumPy가 리스트보다 빠른 이유 · p.98","src":"파이썬 리스트 — 서로 다른 자료형을 섞어 담을 수 있어 유연합니다. — 반복문으로 요소마다 계산해야 해 느립니다. NumPy 배열 — 모든 요소가 같은 자료형이라 메모리를 효율적으로 씁니다."},{"id":"t8-08","ty":"match","lv":2,"game":false,"p":"NumPy 함수와 역할을 연결하세요.","pairs":[["reshape","배열의 모양을 바꾼다"],["concatenate","배열을 이어붙인다"],["where","조건에 따라 값을 고른다"],["clip","값을 범위 안으로 잘라낸다"],["@ (dot)","행렬곱을 계산한다"]],"h":"함수 이름의 뜻이 역할입니다. reshape는 '모양 다시', concatenate는 '잇기', where는 '어디서(조건)', clip은 '자르기'입니다. @는 np.dot·matmul과 같은 행렬곱 연산자입니다.","w":"reshape는 모양 변경, concatenate는 결합, where는 조건 선택, clip은 범위 자르기, @는 행렬곱입니다.","an":"03 · 배열변형·결합·선형대수·조건연산 · p.89–95","src":"np.reshape / transpose 배열의 모양을 바꿉니다. np.sum / mean / std 통계값을 계산합니다. np.dot / matmul / @ 행렬곱을 계산합니다. np.where / clip 조건에 따라 값을 다룹니다."},{"id":"t8-09","ty":"order","lv":2,"game":false,"p":"실습 '4x5 배열에서 짝수만 뽑기'의 순서를 맞추세요.","steps":["np.arange(1, 21)로 1~20 생성","reshape(4, 5)로 4x5 배열 만들기","a % 2 == 0으로 불리언 마스크 만들기","a[mask]로 짝수만 1차원 출력"],"h":"실습 TIP은 먼저 1~20 정수 배열을 만들고 4x5로 모양을 바꾸라고 합니다. 그다음 짝수 조건으로 True/False 마스크를 만들고, 그 마스크로 인덱싱하면 조건에 맞는 값만 1차원으로 뽑힙니다.","w":"1~20을 만들어 4x5로 바꾼 뒤, 불리언 인덱싱으로 짝수만 뽑으면 1차원 배열이 됩니다.","an":"03 · 실습 직접 해보기 · p.91","src":"np.arange(1,21).reshape(4,5)로 배열을 만들고, 불리언 인덱싱(a[a % 2 == 0])으로 짝수를 뽑을 수 있습니다."},{"id":"t8-10","ty":"multi","lv":2,"game":true,"p":"NumPy가 파이썬 리스트보다 빠른 이유를 모두 고르세요.","o":["요소마다 파이썬 반복문으로 계산","모든 요소가 같은 자료형","반복문 없이 벡터 연산","C로 구현되어 있음","여러 자료형을 섞어 담을 수 있음"],"a":[1,2,3],"h":"자료는 NumPy 배열의 모든 요소가 같은 자료형이라 메모리를 효율적으로 쓴다고 설명합니다. 또 반복문 없이 벡터 연산으로 한 번에 계산하며, 내부가 C로 구현되어 순수 파이썬 반복문보다 빠르다고 합니다.","w":"같은 자료형, 벡터 연산, C 구현 덕분에 빠릅니다. 자료형 혼합과 요소별 반복문은 리스트의 특징입니다.","an":"03 · 개요·성능 · p.80·98","src":"NumPy 배열 — 모든 요소가 같은 자료형이라 메모리를 효율적으로 씁니다. — 반복문 없이 벡터 연산으로 한 번에 계산해 훨씬 빠릅니다."}]},{"id":"t9","title":"Pandas 표 데이터 다루기","ref":"PART 4 · p.101–120","qs":[{"id":"t9-01","ty":"mc","lv":1,"game":true,"p":"행과 열로 이루어진 표 형태의 Pandas 자료구조는?","o":["DataFrame","Series","ndarray","dict"],"a":0,"h":"Pandas의 두 자료구조 가운데 하나는 하나의 열(1차원 데이터)을 다루는 Series입니다. 다른 하나는 엑셀 표처럼 행과 열을 모두 가진 2차원 구조입니다.","w":"DataFrame은 표 전체, Series는 하나의 열(1차원 데이터)을 다룹니다.","an":"04 · 개요 Pandas란? · p.101","src":"DataFrame 행과 열로 이루어진 표 형태의 자료구조입니다. Series 하나의 열(1차원 데이터)을 다루는 자료구조입니다."},{"id":"t9-02","ty":"mc","lv":1,"game":true,"p":"컬럼별 자료형과 결측치 정보를 보여 주는 메서드는?","o":["df.head()","df.describe()","df.info()","df.shape"],"a":2,"h":"explore.py는 데이터를 훑어보는 메서드를 모아 보여 줍니다. head·tail은 앞뒤 몇 행을 미리 보고, describe는 숫자 컬럼의 통계를 요약하며, shape은 행·열 개수를 알려 줍니다. 컬럼별 자료형과 결측치 '정보'를 보여 주는 것은 남은 하나입니다.","w":"info()는 자료형·결측치 정보, head()는 앞 5행, describe()는 숫자 컬럼 통계, shape는 (행, 열) 개수입니다.","an":"04 · 탐색 데이터 훑어보기 · p.105","src":"print(df.head()) # 앞 5행 미리보기 print(df.tail(3)) # 뒤 3행 미리보기 print(df.info()) # 컬럼별 자료형·결측치 정보 print(df.describe()) # 숫자 컬럼의 통계 요약"},{"id":"t9-03","ty":"mc","lv":2,"game":true,"p":"위치(정수 순서) 기준으로 행을 선택하는 것은?","o":["loc","iloc","columns","head"],"a":1,"h":"loc는 인덱스 '라벨'을 기준으로, 다른 하나는 정수 '위치'를 기준으로 행을 고릅니다. 이름 앞의 i가 integer(정수 위치)를 뜻한다고 생각하면 구분하기 쉽습니다.","w":"iloc은 위치 기준, loc은 인덱스 라벨 기준으로 행을 선택합니다.","an":"04 · 선택 행 선택하기 (loc · iloc) · p.107","src":"print(df.loc[0]) # 인덱스 라벨 0번 행 print(df.iloc[0]) # 위치상 0번째 행"},{"id":"t9-04","ty":"mc","lv":1,"game":true,"p":"결측치를 지정한 값으로 채우는 함수는?","o":["dropna","isna","notna","fillna"],"a":3,"h":"결측치 함수의 이름은 동작 + na(결측치)로 이루어집니다. isna는 비었는지 확인하고, dropna는 결측치가 있는 행을 지웁니다. 지정한 값으로 '채우는' 함수는 fill로 시작합니다.","w":"fillna는 채우기, dropna는 결측치 행 제거, isna/notna는 비어 있는지 확인합니다.","an":"04 · 결측치 결측치 관련 함수 · p.110","src":".dropna() 결측치가 있는 행(또는 열)을 제거합니다. .fillna(값) 결측치를 지정한 값으로 채웁니다."},{"id":"t9-05","ty":"mc","lv":2,"game":true,"p":"Pandas에서 여러 조건을 합칠 때 알맞은 방법은?","o":["&, | 를 쓰고 각 조건을 괄호로 감싼다","and, or를 그대로 쓴다","조건 사이에 콤마를 넣는다","조건을 + 로 더한다"],"a":0,"h":"Pandas 조건식은 열 전체에 True/False를 계산하는 배열 연산이라, 파이썬 논리 연산자 and/or를 그대로 쓸 수 없습니다. 실습 TIP은 대신 쓸 기호와, 연산자 우선순위 때문에 각 조건을 어떻게 감싸야 하는지 알려 줍니다.","w":"여러 조건을 합칠 때는 and/or 대신 &, |를 쓰고 각 조건을 괄호로 감쌉니다.","an":"04 · 실습 직접 해보기 TIP · p.109","src":"여러 조건을 합칠 때는 and/or 대신 &, | 를 쓰고, 각 조건을 괄호로 감싸야 합니다."},{"id":"t9-06","ty":"ox","lv":1,"game":true,"p":"<code>df.to_csv(\"output.csv\", index=False)<\/code>는 인덱스를 빼고 저장한다.","a":true,"h":"to_csv는 DataFrame을 CSV 파일로 저장합니다. 기본으로는 왼쪽의 행 번호(인덱스)도 한 열로 함께 저장되는데, index 옵션을 False로 주면 이 동작이 바뀝니다. 코드 옆 주석을 그대로 읽어 보세요.","w":"맞습니다. index=False로 저장하면 인덱스 열이 파일에 들어가지 않습니다.","an":"04 · 파일입출력 CSV 읽고 쓰기 · p.104","src":"df.to_csv(\"output.csv\", index=False) # 저장 (인덱스는 제외)"},{"id":"t9-07","ty":"ox","lv":2,"game":true,"p":"한 열만 선택한 <code>df[\"이름\"]<\/code>의 결과는 DataFrame이다.","a":false,"h":"select_cols.py는 대괄호 안에 열 이름을 하나만 넣을 때와 리스트로 여러 개 넣을 때 결과가 다르다고 주석을 답니다. 열 하나는 1차원 자료구조, 여러 열은 표 자료구조로 나옵니다.","w":"틀렸습니다. 한 열을 고르면 Series, 여러 열을 [[ ]]로 고르면 DataFrame입니다.","an":"04 · 선택 열 선택하기 · p.106","src":"print(df[\"이름\"]) # 한 열 선택 -> Series print(df[[\"이름\", \"점수\"]]) # 여러 열 선택 -> DataFrame"},{"id":"t9-08","ty":"match","lv":1,"game":false,"p":"Pandas 함수와 역할을 연결하세요.","pairs":[["read_csv","CSV 파일 불러오기"],["groupby","그룹별로 묶어 집계"],["merge","공통 열 기준으로 병합"],["concat","위아래로 이어붙이기"],["sort_values","값 기준 정렬"]],"h":"함수 이름의 영어 뜻이 역할입니다. read_csv는 CSV 읽기, groupby는 그룹으로 묶어 집계, merge는 공통 열을 기준으로 합치기입니다. concat은 위아래로 잇기, sort_values는 값 기준 정렬입니다.","w":"read_csv는 불러오기, groupby는 그룹 집계, merge는 공통 열 병합, concat은 이어붙이기, sort_values는 정렬입니다.","an":"04 · 파일입출력·정렬·집계·병합 · p.104·113–117","src":"merged = pd.merge(scores, info, on=\"이름\") # 공통 열 기준 병합 combined = pd.concat([df1, df2]) # 위아래로 이어붙이기"},{"id":"t9-09","ty":"order","lv":2,"game":false,"p":"실습 '평균 점수가 가장 높은 학년 찾기'의 순서를 맞추세요.","steps":["groupby(\"학년\")으로 묶기","평균 점수와 인원수 집계","idxmax()로 평균이 가장 높은 학년 찾기","결과 출력"],"h":"먼저 groupby로 학년별로 묶고, agg로 평균 점수와 인원수를 함께 집계합니다. 그다음 값이 가장 큰 그룹의 라벨을 바로 돌려주는 함수로 학년을 찾아 출력합니다.","w":"학년별로 묶어 평균·인원을 구한 뒤, idxmax()로 값이 가장 큰 그룹의 라벨을 구합니다.","an":"04 · 실습 직접 해보기 · p.116","src":"학년별 평균 점수와 인원수를 groupby로 구하고, 평균 점수가 가장 높은 학년을 출력해보세요. TIP grouped.idxmax()를 쓰면 값이 가장 큰 그룹의 인덱스(라벨)를 바로 구할 수 있습니다."},{"id":"t9-10","ty":"multi","lv":2,"game":true,"p":"NumPy보다 Pandas가 적합한 경우를 모두 고르세요.","o":["순수한 행렬 연산 중심 작업","이미지·텐서 같은 대량 수치 배열","열마다 이름과 의미가 있는 표 데이터","엑셀·CSV 같은 실무 데이터","결측치 처리·필터링·그룹 집계"],"a":[2,3,4],"h":"자료는 순수한 숫자 배열·행렬 연산, 이미지·텐서 같은 같은 자료형의 대량 수치 데이터에는 NumPy를 권합니다. 반대로 열마다 이름과 의미가 있는 표, 결측치·필터링·그룹 집계, 사람이 읽는 엑셀·CSV 데이터에는 Pandas가 낫다고 봅니다.","w":"표 형태·결측치·집계·실무 데이터는 Pandas, 이미지·텐서·행렬 연산은 NumPy가 좋습니다.","an":"04 · 비교 언제 NumPy, 언제 Pandas? · p.119","src":"Pandas가 좋은 경우 — 열마다 이름과 의미가 있는 표 형태 데이터 — 결측치 처리, 필터링, 그룹 집계가 필요한 경우 — 엑셀· CSV처럼 사람이 읽는 실무 데이터"}]},{"id":"t10","title":"이미지처리 이론","ref":"PART 5 · p.122–138","qs":[{"id":"t10-01","ty":"mc","lv":1,"game":true,"p":"컬러 이미지를 배열로 나타낼 때의 모양은?","o":["(너비, 높이)","(채널, 픽셀)","(높이, 너비, 채널)","(픽셀, 해상도)"],"a":2,"h":"디지털 이미지는 픽셀이 격자로 모인 숫자 데이터이며, 컬러 이미지는 3차원 배열입니다. cv2.imread로 읽은 img.shape이 (480, 640, 3)처럼 나오는데, 세로 픽셀 수, 가로 픽셀 수, 색 성분 개수 순서입니다.","w":"컬러 이미지는 (높이, 너비, 채널) 모양의 3차원 배열입니다. 예: (480, 640, 3).","an":"05 · 개요 디지털 이미지란? · p.122·124","src":"배열로서의 이미지 컬러 이미지는 (높이, 너비, 채널) 모양의 3차원 배열입니다."},{"id":"t10-02","ty":"mc","lv":1,"game":true,"p":"OpenCV가 이미지를 읽을 때 기본 채널 순서는?","o":["RGB","HSV","Gray","BGR"],"a":3,"h":"OpenCV로 읽은 이미지는 일반적인 RGB와 채널 순서가 다릅니다. 그래서 RGB로 바꾸려면 cv2.cvtColor를 따로 써야 한다고 자료의 NOTE가 설명합니다. 빨강·초록·파랑의 순서를 뒤집어 생각해 보세요.","w":"OpenCV는 기본적으로 BGR 순서로 읽습니다. RGB로 바꾸려면 cv2.cvtColor를 씁니다.","an":"05 · 불러오기 이미지를 배열로 불러오기 · p.124","src":"NOTE OpenCV는 기본적으로 채널 순서를 BGR로 읽어옵니다. RGB로 바꾸려면 cv2.cvtColor를 사용합니다."},{"id":"t10-03","ty":"mc","lv":2,"game":true,"p":"특정 색상만 추출하는 작업에 유리한 색상 공간은?","o":["HSV","RGB","Grayscale","BGR"],"a":0,"h":"색상 공간 비교표에서 RGB는 세 채널을 섞어 색을 표현하고, Grayscale은 밝기 하나만 씁니다. 또 다른 공간은 색상(Hue)·채도(Saturation)·명도(Value)로 나눠 표현하므로, 특정 색만 골라내기 쉽습니다.","w":"HSV는 색상·채도·명도로 표현해 특정 색 추출에 유리합니다. Grayscale은 연산량을 줄이는 전처리에 씁니다.","an":"05 · 색상공간 주요 색상 공간 비교 · p.123","src":"HSV 색상(Hue)·채도(Saturation)·명도(Value)로 표현 특정 색상만 추출하는 작업에 유리"},{"id":"t10-04","ty":"mc","lv":2,"game":true,"p":"<code>cv2.convertScaleAbs(img, alpha, beta)<\/code>에서 beta가 조절하는 것은?","o":["대비 (곱셈)","밝기 (덧셈)","채널 순서","이미지 크기"],"a":1,"h":"convertScaleAbs는 픽셀마다 <code>alpha × 값 + beta<\/code>를 계산합니다. 곱하는 alpha는 밝고 어두운 차이를 키우고, 더하는 beta는 모든 픽셀을 똑같이 올리거나 내립니다. 예제에서 <code>beta=40<\/code>의 주석을 확인해 보세요.","w":"alpha는 대비(곱셈), beta는 밝기(덧셈)를 조절합니다. 값이 255를 넘으면 255에서 잘립니다.","an":"05 · 밝기·대비 밝기와 대비 조정하기 · p.127","src":"NOTE alpha는 대비(곱셈), beta는 밝기(덧셈)를 조절합니다. 값이 255를 넘으면 자동으로 255에서 잘립니다."},{"id":"t10-05","ty":"mc","lv":1,"game":true,"p":"CNN(합성곱 신경망)의 핵심 연산은?","o":["이진화","컨볼루션","데이터 증강","형변환"],"a":1,"h":"커널은 3x3, 5x5 같은 작은 숫자 격자로, 이미지 위를 이동하며 주변 픽셀과 곱하고 더합니다. 이 연산이 블러·샤프닝·엣지검출 효과를 내며, 합성곱 신경망은 이름 그대로 이 연산을 핵심으로 씁니다.","w":"커널이 이미지 위를 이동하며 곱하고 더하는 컨볼루션이 CNN의 핵심 연산입니다.","an":"05 · 컨볼루션 컨볼루션이란 · p.128","src":"— 커널 값에 따라 블러·샤프닝·엣지검출 등 다양한 효과를 냅니다. — CNN(합성곱 신경망)의 핵심 연산이 바로 이 컨볼루션입니다."},{"id":"t10-06","ty":"ox","lv":1,"game":true,"p":"픽셀 값을 255로 나누면 0~1 범위로 스케일링된다.","a":true,"h":"픽셀 값은 보통 0~255 범위의 정수이고, AI 모델은 작은 범위의 실수에서 더 안정적으로 학습합니다. 계산식은 픽셀값 / 255이며, 최솟값 0과 최댓값 255를 넣으면 결과 범위가 어떻게 되는지 확인해 보세요.","w":"맞습니다. 0~255 정수를 255로 나누면 0~1 범위의 실수가 됩니다.","an":"05 · 정규화 이미지 정규화란 · p.134–135","src":"— 0~1 스케일링: 픽셀 값을 255로 나눕니다. — 표준화: (값 - 평균) / 표준편차로 변환합니다."},{"id":"t10-07","ty":"ox","lv":2,"game":true,"p":"Canny의 threshold 값을 낮추면 검출되는 경계선이 줄어든다.","a":false,"h":"Canny는 두 threshold를 기준으로 경계선 후보를 고릅니다. 기준을 낮추면 약한 변화도 경계로 인정되므로, 검출되는 선의 양과 노이즈가 어떻게 바뀌는지 edge_detection.py의 NOTE에서 확인해 보세요.","w":"틀렸습니다. threshold가 낮을수록 더 많은 경계선을 검출하고, 노이즈도 함께 늘 수 있습니다.","an":"05 · 엣지검출 Canny 엣지 검출 · p.131","src":"NOTE threshold 값이 낮을수록 더 많은 경계선을 검출하지만, 노이즈도 함께 늘어날 수 있습니다."},{"id":"t10-08","ty":"match","lv":2,"game":false,"p":"필터·처리와 효과를 연결하세요.","pairs":[["블러","주변 픽셀 평균으로 부드럽게"],["샤프닝","경계를 강조해 또렷하게"],["엣지 검출","급격히 변하는 경계만 추출"],["이진화","기준보다 밝으면 255, 어두우면 0"]],"h":"블러는 주변 픽셀을 평균내 부드럽게 하고, 샤프닝은 경계를 강조해 또렷하게 합니다. 엣지 검출은 색이 급격히 변하는 경계선만 뽑습니다. 이진화는 기준값(예: 127)보다 밝으면 흰색, 어두우면 검은색으로 나눕니다.","w":"블러는 부드럽게, 샤프닝은 또렷하게, 엣지 검출은 경계 추출, 이진화(threshold)는 흑백 두 값으로 나눕니다.","an":"05 · 필터·이진화 · p.129·132","src":"블러(Blur) 주변 픽셀을 평균내어 이미지를 부드럽게 만듭니다. 샤프닝(Sharpen) 경계를 강조해 이미지를 또렷하게 만듭니다. 엣지 검출(Edge) 색이 급격히 변하는 경계선만 뽑아냅니다."},{"id":"t10-09","ty":"order","lv":1,"game":false,"p":"이미지를 AI 모델 입력으로 만드는 흐름을 맞추세요.","steps":["이미지 로드","배열로 변환","크기 조절","정규화","모델에 전달"],"h":"자료는 흐름을 전처리 단계와 모델 입력 단계로 나눕니다. 전처리에서는 이미지를 불러와 배열로 바꾼 뒤 크기를 맞추고 값 범위를 정규화합니다. 그렇게 준비된 배열을 마지막에 모델에 넘깁니다.","w":"이미지를 불러와 배열로 바꾸고, 크기 조절과 정규화를 거쳐(필요하면 증강) 모델에 전달합니다.","an":"05 · 흐름정리 이미지처리에서 AI 입력까지 · p.137","src":"전처리 단계 — 이미지 로드 -> 배열 변환 — 크기 조절, 정규화 — 필요시 증강 적용 모델 입력 단계 — 전처리된 배열을 모델에 전달"},{"id":"t10-10","ty":"multi","lv":2,"game":true,"p":"데이터 증강(Augmentation) 기법으로 자료에 나온 것을 모두 고르세요.","o":["이진화 (Threshold)","무작위 자르기 (Crop)","반전 (Flip)","회전 (Rotate)","색상 변화 (Color Jitter)"],"a":[1,2,3,4],"h":"데이터 증강은 원본 이미지를 조금씩 바꿔 학습 데이터의 다양성을 늘리는 방법입니다. 자료의 표는 각도 바꾸기, 좌우·상하 뒤집기, 일부 무작위로 잘라 쓰기, 밝기·대비·채도 바꾸기 네 가지를 소개합니다.","w":"회전·반전·무작위 자르기·색상 변화가 증강 기법입니다. 이진화는 이미지를 흑백 두 값으로 바꾸는 처리입니다.","an":"05 · 증강 데이터 증강 기법 · p.136","src":"회전 (Rotate) 이미지를 일정 각도 돌려 다양한 각도의 데이터를 만듭니다. 반전 (Flip) 좌우 또는 상하로 이미지를 뒤집습니다. 무작위 자르기 (Crop) 이미지의 일부분을 무작위로 잘라 사용합니다. 색상 변화 (Color Jitter) 밝기·대비·채도를 무작위로 바꿔 다양성을 높입니다."}]}]};

/* 게임 모드 목록 — 새 게임은 여기에 항목을 추가한다 (설정·출제 유형·규칙 문구를 모드별로) */

    types:['mc','ox','multi'],times:[5,7,10,15],defaultTime:10},
};

/* ── 저장소 (실패해도 동작) ─────────────── */
const KEY='qb:'+BANK.id+':v1';
const blank=()=>({name:'',tabs:{},wrong:{},board:[],drafts:{}});  // drafts: 채점 전 탭별 풀던 답

/* 순위 저장소 — 공유 순위로 바꿀 때 이 객체만 교체 */
// 순위는 같은 조건(게임 모드 + 풀이 시간)끼리만 비교한다. key = 'timeattack:10'
const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

/* ── 유틸 ──────────────────────────────── */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function say(msg){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=msg,30);}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('📋 클립보드에 복사했습니다');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'📋 클립보드에 복사했습니다':'복사하지 못했습니다. 인쇄 기능을 이용하세요.');
}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

/* ── 오답노트 ──────────────────────────── */
function addWrong(id,ans){const w=S.wrong[id]||{n:0};w.n++;w.last=ans;w.at=Date.now();w.solved=false;S.wrong[id]=w;}
function markSolved(id){if(S.wrong[id]&&!S.wrong[id].solved){S.wrong[id].solved=true;S.wrong[id].at=Date.now();}}
const wrongList=solved=>Object.keys(S.wrong).filter(id=>QMAP[id]&&!!S.wrong[id].solved===solved)
  .sort((a,b)=>QTAB[a].idx-QTAB[b].idx||ALLQ.indexOf(QMAP[a])-ALLQ.indexOf(QMAP[b]));

/* ── 문항 풀이 상태(학습·재도전 공용) ───── */
let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

function cardHTML(q,n){
  const [label,color]=TYPES[q.ty];
  const g=cur.graded, a=cur.ans[q.id], fa=finalAns(q), ok=g&&isCorrect(q,fa);
  const lock=g?' disabled':'';
  let body='';
  if(q.ty==='mc'||q.ty==='multi'){
    const multi=q.ty==='multi', mine=multi?(a||[]):[a];
    body='<div class="opts">'+q.o.map((o,i)=>{
      const right=multi?q.a.includes(i):q.a===i, picked=mine.includes(i);
      const cls=g?(right?' ans':picked?' miss':''):'';
      return `<label class="opt${cls}"><span class="onum">${i+1}</span><input type="${multi?'checkbox':'radio'}" name="r-${q.id}" data-act="${multi?'tick':'pick'}" data-q="${q.id}" data-i="${i}"${picked?' checked':''}${lock}><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(q.ty==='ox'){
    body='<div class="ox">'+[true,false].map(v=>{
      const cls=g?(q.a===v?' ans':a===v?' miss':''):'';
      return `<button type="button" class="${cls.trim()}" data-act="ox" data-q="${q.id}" data-v="${v?1:0}" data-fk="${q.id}-ox${v?1:0}" aria-pressed="${a===v}" aria-label="${v?'맞다 O':'틀리다 X'}"${lock}>${v?'O':'X'}</button>`;
    }).join('')+'</div>';
  }else if(q.ty==='match'){
    const m=a||{}, sel=cur.msel[q.id], linkedBy={};
    Object.entries(m).forEach(([l,r])=>linkedBy[r]=+l);
    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${PAL[i%PAL.length]})" data-act="ml" data-q="${q.id}" data-i="${i}" data-fk="${q.id}-l${i}"${lock}><span class="tag">${LETTER[i]}</span>${esc(p[0])}</button>`;
    }).join('');
    const right=cur.shuf[q.id].map(j=>{
      const by=linkedBy[j], linked=by!=null, cls=(linked?' linked':'')+(g&&linked?(by===j?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${linked?PAL[by%PAL.length]:'--line'})" data-act="mr" data-q="${q.id}" data-j="${j}" data-fk="${q.id}-r${j}"${lock}><span class="tag">${linked?LETTER[by]:''}</span>${esc(q.pairs[j][1])}</button>`;
    }).join('');
    body=`<div class="match"><div class="mcol mleft">${left}</div><div class="mcol mright">${right}</div></div>`;
  }else if(q.ty==='order'){
    const seq=a||[], full=seq.length===q.steps.length;
    body='<div class="olist">'+(cur.shuf[q.id]||range(q.steps.length)).map(si=>{
      const pos=seq.indexOf(si), on=pos>=0;
      const cls=(on?' on':'')+(g?(pos===si?' ok':' no'):'');
      const fix=g&&pos!==si?`<span class="ofix">정답 ${si+1}</span>`:'';
      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }
  const numAns=q.ty==='mc'?`${q.a+1}번 · `:q.ty==='multi'?q.a.map(i=>i+1).join('·')+'번 · ':'';
  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${mediaHTML(q)}${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>${voiceRow(q,q.id)}`}${body}${exp}</article>`;
}
const LV_NAME=['쉬움','보통','어려움'];
function lvHTML(lv){
  lv=lv||1;
  const dots=[1,2,3].map(k=>k<=lv?`<i class="d${k}">●</i>`:'<i class="off">○</i>').join('');
  return `<span class="lv lv${lv}" title="난이도 ${LV_NAME[lv-1]}"><span class="dots" aria-hidden="true">${dots}</span><em>${LV_NAME[lv-1]}</em></span>`;
}
// 자료 발췌: 이스케이프 후 마크다운 기호만 가볍게 서식으로 (**굵게**, `코드`, 머리 #)
const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
function hintHTML(q){
  if(!q.h)return '';
  const open=cur.hints.has(q.id), label=q.ty==='num'?'Hint · 계산식':'Hint';
  // 2단계: ① 자세한 힌트(h) ② 자료 보기 — 자료 원문 발췌(src) + 위치(an)
  const sopen=cur.srcs.has(q.id);
  const src=q.src?`<div class="srcwrap"><button type="button" class="srcbtn" data-act="src" data-q="${q.id}" data-fk="${q.id}-src" aria-expanded="${sopen}" aria-controls="src-${q.id}">`+
    `<span class="caret" aria-hidden="true">${sopen?'▾':'▸'}</span>📖 자료 보기</button>`+
    (sopen?`<blockquote class="src" id="src-${q.id}"><p>${srcText(q.src)}</p>${q.an?`<cite>${esc(q.an)}</cite>`:''}</blockquote>`:'')+`</div>`:'';
  return `<div class="hintwrap"><button type="button" class="hintbtn" data-act="hint" data-q="${q.id}" data-fk="${q.id}-hint" aria-expanded="${open}" aria-controls="hint-${q.id}">`+
    `<span class="caret" aria-hidden="true">${open?'▾':'▸'}</span>${label}</button>`+
    (open?`<div class="hint" id="hint-${q.id}">${q.h}${src}</div>`:'')+`</div>`;
}
function refreshCard(q){
  const el=document.getElementById('card-'+q.id);if(!el)return;
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  el.outerHTML=cardHTML(q,el.dataset.n);
  if(fk){const f=app.querySelector(`[data-fk="${fk}"]`);if(f&&!f.disabled)f.focus();}

const pad2=n=>String(n).padStart(2,'0');
const fmtCnt=(n,t)=>`(${pad2(n)}/${pad2(t)})`;
// 탭별 푼 문항 수: 지금 보는 탭 → 화면 상태, 그 외 → 풀던 답(drafts) → 채점 기록
function tabAnswered(t){
  const src=cur&&cur.mode==='study'&&cur.tab===t?cur.ans:(S.drafts[t.id]||(S.tabs[t.id]&&S.tabs[t.id].answers)||{});
  return t.qs.filter(q=>isAnswered(q,src[q.id])).length;
}
function updateProgress(){
  const p=document.getElementById('pbar');if(!p||!cur)return;
  const n=cur.list.filter(answered).length, cnt=fmtCnt(n,cur.list.length);
  p.style.width=pct(n,cur.list.length)+'%';
  document.getElementById('ptxt').textContent=`${n} / ${cur.list.length} 응답`;
  const g=document.getElementById('gradeCnt');if(g)g.textContent=cnt;
  if(cur.mode==='study'){
    const c=document.getElementById('qc-'+cur.tab.id);if(c)c.textContent=cnt;
    if(!cur.graded){  // 풀던 답 저장 → 탭을 옮겨도 유지
      if(n||Object.keys(cur.ans).some(k=>{const v=cur.ans[k];return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:v!=null&&v!=='';}))
        S.drafts[cur.tab.id]=JSON.parse(JSON.stringify(cur.ans));
      else delete S.drafts[cur.tab.id];
      save();
    }
  }
}

/* ── 음성 선택 · 문제 읽기 · 그림/오디오 (qb-voice.js가 없으면 모두 숨김) ── */
const hasVoice=()=>!!(window.QBVoice&&QBVoice.supported());
const hasRead=()=>!!(window.QBVoice&&QBVoice.canSpeak());
const IC_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const IC_VOL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const VC=new Map();  // 학습 모드 문항별 음성 컨트롤러
function voiceReset(){VC.clear();if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}}
function voiceRow(q,fkp){
  const mic=hasVoice()&&['mc','multi','ox'].includes(q.ty), rd=hasRead();

    (rd?`<button type="button" class="vbtn" data-act="vread"${qa} data-fk="${fkp}-vread">${IC_VOL}<span>문제 읽기</span></button>`:'')+
    (mic?`<span class="vstat" aria-live="polite"></span><span class="vhint">말하기 어려우면 눌러서 고르세요</span>`:'')+`</div>`;

function mediaHTML(q){
  let h='';
  if(q.img&&q.img.src)h+=`<figure class="qfig"><img src="${esc(q.img.src)}" alt="${esc(q.img.alt)}" loading="lazy">${q.img.caption?`<figcaption>${esc(q.img.caption)}</figcaption>`:''}</figure>`;
  if(q.audio&&q.audio.src)h+=`<div class="qaud"><audio controls preload="none" src="${esc(q.audio.src)}"></audio><details><summary>대본</summary><p>${esc(q.audio.transcript)}</p></details></div>`;
  return h;
}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
// 읽어 줄 글: 문제 + 화면에 보이는 순서의 보기("1번 …")
function readText(q,n,order){
  let t=(n?`${n}번 문제. `:'')+plain(q.p)+'.';
  if(q.img&&q.img.alt)t+=' 그림 설명. '+q.img.alt+'.';

function readAloud(text){if(QBVoice.isSpeaking())QBVoice.cancelSpeak();else QBVoice.speak(text);}
// 음성으로 고른 것 = 보기를 직접 누른 것과 같은 경로(입력 click → 기존 change/click 처리)
function voicePick(q,r){

  const el=r.kind==='ox'?card.querySelector(`[data-act="ox"][data-v="${r.v==='O'?1:0}"]`):card.querySelector(`input[data-i="${r.i}"]`);

function studyVoice(q){

function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;
  else if(el.dataset.act==='tick'){
    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);
  }
  cur.armed=false;updateProgress();
}
function onSheetInput(el){
  if(el.dataset.act==='num'&&!cur.graded){cur.ans[el.dataset.q]=el.value;cur.armed=false;updateProgress();}
}

function gradeSheet(){
  const miss=cur.list.map((q,i)=>answered(q)?0:i+1).filter(Boolean);
  if(miss.length&&!cur.armed){
    cur.armed=true;
    document.getElementById('warn').textContent=`미응답 ${miss.length}문항 (Q${miss.join(', Q')}). 한 번 더 누르면 미응답은 오답으로 채점합니다.`;
    return;
  }
  const firstUnlock=!gameUnlocked();
  cur.graded=true;
  const snap={};let score=0;
  cur.list.forEach(q=>{
    const a=finalAns(q);
    if(a!=null)snap[q.id]=a;
    if(isCorrect(q,a)){score++;markSolved(q.id);}
    else addWrong(q.id,answerText(q,a));
  });
  if(cur.mode==='study'){
    S.tabs[cur.tab.id]={score,total:cur.list.length,answers:snap,touched:[...cur.touched],at:Date.now()};
    delete S.drafts[cur.tab.id];
  }
  save();
  renderSheet();
  window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
  say(`채점 결과 ${score}점, ${cur.list.length}문항 중`);
  if(cur.mode==='study'&&firstUnlock)setTimeout(()=>toast('⚡ 게임 모드와 해설지가 열렸습니다!'),300);
  else if(cur.mode==='study'&&allGraded())setTimeout(()=>toast('★ 모든 탭 완료! 종합 결과를 확인하세요.'),300);
}

let G=null;
const gameSetup={mode:'timeattack',count:10,scope:'all',time:GAME_MODES.timeattack.defaultTime};
function gamePool(scope){
  const M=GAME_MODES[gameSetup.mode];
  const base=ALLQ.filter(q=>q.game&&!q.audio&&M.types.includes(q.ty));  // 오디오 문항은 제한시간 안에 들을 수 없어 제외
  if(scope==='played')return shuffle(base.filter(q=>S.tabs[QTAB[q.id].id]));
  if(scope==='wrong'){const w=new Set(wrongList(false));return shuffle(base.filter(q=>w.has(q.id))).concat(shuffle(base.filter(q=>!w.has(q.id))));}
  return shuffle(base);
}
