<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리눅스 실습 노트 · 우분투로 배우는 리눅스 기본 · 문제은행</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Quiz Bank 디자인 토큰 v3 (3층: Primitive → Semantic → Component)
   다크 팔레트: day07 워크시트(#0b1220 남색 + 앰버·틸 포인트) / 라이트: 같은 구조의 중립 팔레트
   포인트색은 teal 하나(--color-brand). amber는 제목(다크)·경고·하이라이트 보조.
   v2 이름(--bg, --ink 등)은 파일 끝 Alias 블록이 시맨틱으로 연결한다.
   build.py가 이 파일을 엔진 <style> 맨 앞에 그대로 넣는다. */
:root{
  /* ── 1층 Primitive: 원시 값 ── */
  --white:#FFFFFF;--ink-900:#141A26;
  --slate-50:#F5F6F8;--slate-100:#F0F2F5;--slate-200:#E2E6EC;--slate-250:#D5DAE2;--slate-300:#CDD3DC;
  --slate-400:#8A93A4;--slate-500:#64748B;--slate-600:#5A6375;
  --navy-950:#0A0F1C;--navy-900:#0B1220;--navy-850:#0E1628;--navy-800:#111A2E;--navy-700:#16203A;--navy-650:#172239;
  --navy-600:#1F2B45;--navy-500:#2A3A5C;
  --ice-200:#DBE4F0;--steel-400:#8A9BB8;--steel-500:#5E6F8E;
  --teal-900:#123D33;--teal-700:#0B6F66;--teal-600:#0E8C80;--teal-400:#2DD4BF;
  --amber-900:#3A2A0C;--amber-700:#B45309;--amber-650:#D97706;--amber-600:#B7791F;--amber-400:#F5B942;--amber-100:#FEF3C7;
  --gold-600:#B7891F;
  --green-700:#15803D;--green-600:#16A34A;--green-400:#4ADE80;
  --red-650:#DC2626;--red-600:#D23B32;--red-400:#F87171;
  --yellow-500:#EAB308;--yellow-400:#FACC15;
  --violet-600:#7C3AED;--violet-400:#C084FC;
  --pink-700:#C2417A;--pink-400:#F472B6;
  --blue-600:#2563EB;--blue-400:#60A5FA;
  /* 과목 색: 흰 배경·남색 배경 모두 3:1 이상(아이콘·스트라이프용), 테마 공통 */
  --subject-it:#4F7FC0;--subject-korean:#B05A5A;--subject-english:#3F8F6E;
  --subject-science:#8A62B8;--subject-music:#B0762A;--subject-art:#C0508A;

  /* ── 2층 Semantic 고정부 ── */
  --font-sans:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","D2Coding",Consolas,"SF Mono",monospace;
  --fs-base:var(--text-base);--lh:1.55;
  --fs-h1:var(--text-2xl);--fs-h2:var(--text-lg);--fs-q:var(--text-base);--fs-opt:var(--text-base);--fs-btn:var(--text-sm);--fs-btn-pri:var(--text-base);
  --fs-sm:var(--text-sm);--fs-xs:var(--text-sm);--fs-2xs:var(--text-xs);--fs-ox:var(--text-2xl);
  --radius-sm:6px;--radius-control:8px;--radius-card:10px;--radius-lg:12px;--maxw:880px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;
  --ease:cubic-bezier(.2,0,0,1);--dur-fast:120ms;--dur:200ms;

  /* ── 라이트 시맨틱 + 컴포넌트 ── */
  --color-background:var(--slate-50);--color-surface:var(--white);--color-surface-raised:var(--white);--color-surface-muted:var(--slate-100);--color-field:var(--white);
  --color-text:var(--ink-900);--color-text-muted:var(--slate-600);--color-text-faint:var(--slate-400);
  --color-border:var(--slate-200);--color-border-strong:var(--slate-300);
  --color-heading:var(--ink-900);--legacy-title:var(--ink-900);--color-brand:var(--teal-600);--color-brand-text:var(--teal-700);--color-on-brand:var(--white);
  --color-accent:var(--amber-600);--color-success:var(--green-700);--color-warning:var(--amber-700);--color-danger:var(--red-600);
  --color-highlight:var(--amber-100);--color-focus:var(--teal-600);
  --button-bg:var(--white);--button-border:var(--slate-250);--button-text:var(--ink-900);
  --button-primary-bg:var(--ink-900);--button-primary-border:var(--ink-900);--button-primary-text:var(--white);
  --combo:var(--violet-600);--gold:var(--gold-600);
  --ty-mc:var(--teal-600);--ty-multi:var(--violet-600);--ty-ox:var(--slate-500);--ty-match:var(--pink-700);--ty-order:var(--amber-600);--ty-num:var(--blue-600);
  --timer-hi:var(--green-600);--timer-mid:var(--amber-650);--timer-lo:var(--red-650);
  --lv1:var(--green-600);--lv2:var(--yellow-500);--lv3:var(--red-650);
  --shadow:0 1px 2px rgb(16 24 40 / .04);
  color-scheme:light;

  /* ── Alias (v2 이름 → 시맨틱). 엔진 페이지 호환용. 새 코드는 --color-* 사용 ── */
  --font:var(--font-sans);--mono:var(--font-mono);
  --r-sm:var(--radius-sm);--r:var(--radius-control);--r-md:var(--radius-card);--r-lg:var(--radius-lg);
  --bg:var(--color-background);--panel:var(--color-surface);--raised:var(--color-surface-raised);--field:var(--color-field);
  --soft:var(--color-surface-muted);
  --ink:var(--color-text);--muted:var(--color-text-muted);--faint:var(--color-text-faint);
  --line:var(--color-border);--line-2:var(--color-border-strong);
  --title:var(--legacy-title);--link:var(--color-brand);--accent:var(--color-accent);
  --ok:var(--color-success);--bad:var(--color-danger);
  --btn-bg:var(--button-bg);--btn-line:var(--button-border);
  --pri-bg:var(--button-primary-bg);--pri-line:var(--button-primary-border);--pri-ink:var(--button-primary-text);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --color-background:var(--navy-900);--color-surface:var(--navy-800);--color-surface-raised:var(--navy-850);--color-surface-muted:var(--navy-700);--color-field:var(--navy-950);
  --color-text:var(--ice-200);--color-text-muted:var(--steel-400);--color-text-faint:var(--steel-500);
  --color-border:var(--navy-600);--color-border-strong:var(--navy-500);
  --color-heading:var(--color-text);--legacy-title:var(--amber-400);--color-brand:var(--teal-400);--color-brand-text:var(--teal-400);--color-on-brand:var(--navy-900);
  --color-accent:var(--amber-400);--color-success:var(--green-400);--color-warning:var(--amber-400);--color-danger:var(--red-400);
  --color-highlight:var(--amber-900);--color-focus:var(--teal-400);
  --button-bg:var(--navy-650);--button-border:var(--navy-500);--button-text:var(--ice-200);
  --button-primary-bg:var(--teal-900);--button-primary-border:var(--teal-400);--button-primary-text:var(--teal-400);
  --combo:var(--violet-400);--gold:var(--amber-400);
  --ty-mc:var(--teal-400);--ty-multi:var(--violet-400);--ty-ox:var(--steel-400);--ty-match:var(--pink-400);--ty-order:var(--amber-400);--ty-num:var(--blue-400);
  --timer-hi:var(--green-400);--timer-mid:var(--amber-400);--timer-lo:var(--red-400);
  --lv1:var(--green-400);--lv2:var(--yellow-400);--lv3:var(--red-400);
  --shadow:none;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --color-background:var(--navy-900);--color-surface:var(--navy-800);--color-surface-raised:var(--navy-850);--color-surface-muted:var(--navy-700);--color-field:var(--navy-950);
  --color-text:var(--ice-200);--color-text-muted:var(--steel-400);--color-text-faint:var(--steel-500);
  --color-border:var(--navy-600);--color-border-strong:var(--navy-500);
  --color-heading:var(--color-text);--legacy-title:var(--amber-400);--color-brand:var(--teal-400);--color-brand-text:var(--teal-400);--color-on-brand:var(--navy-900);
  --color-accent:var(--amber-400);--color-success:var(--green-400);--color-warning:var(--amber-400);--color-danger:var(--red-400);
  --color-highlight:var(--amber-900);--color-focus:var(--teal-400);
  --button-bg:var(--navy-650);--button-border:var(--navy-500);--button-text:var(--ice-200);
  --button-primary-bg:var(--teal-900);--button-primary-border:var(--teal-400);--button-primary-text:var(--teal-400);
  --combo:var(--violet-400);--gold:var(--amber-400);
  --ty-mc:var(--teal-400);--ty-multi:var(--violet-400);--ty-ox:var(--steel-400);--ty-match:var(--pink-400);--ty-order:var(--amber-400);--ty-num:var(--blue-400);
  --timer-hi:var(--green-400);--timer-mid:var(--amber-400);--timer-lo:var(--red-400);
  --lv1:var(--green-400);--lv2:var(--yellow-400);--lv3:var(--red-400);
  --shadow:none;
  color-scheme:dark;}
/* ── 반응형 표준 3단계 ─────────────────────────────────────────────
   모바일  ≤767px      (기본값 = 이 :root. 1열 · 드로어 메뉴 · 터치 44px)
   태블릿  768~1023px  (@media (min-width:768px)로 덮어씀. 2열 혼합 · 드로어 메뉴 · 터치 40px)
   데스크탑 ≥1024px    (@media (min-width:1024px)로 덮어씀. 풀 레이아웃 · 고정 사이드바)
   모든 페이지의 @media 폭은 767 / 768 / 1023 / 1024 네 값만 쓴다(build.py lint_responsive가 검사).
   글자 크기는 --text-* 9단계로만 지정하고, 기기 단계별 값은 아래에서만 정의한다(rem 기준 16px).
   데스크탑·태블릿 값은 SmartAI-RAG-Tour(app.src.css)와 동일: 태블릿 = Tailwind 기본, 데스크탑 = 약 10% 축소(최소 11px).
   모바일은 본문 단계(xs~xl)를 태블릿과 같게 유지하고(읽기·입력 확대 방지), 큰 제목 단계(3xl~5xl)만 줄인다. */
:root{
  /* 모바일 (기본) */
  --text-xs:.75rem;     /* 12px */
  --text-sm:.875rem;    /* 14px */
  --text-base:1rem;     /* 16px */
  --text-lg:1.125rem;   /* 18px */
  --text-xl:1.25rem;    /* 20px */
  --text-2xl:1.5rem;    /* 24px */
  --text-3xl:1.75rem;   /* 28px */
  --text-4xl:2rem;      /* 32px */
  --text-5xl:2.5rem;    /* 40px */
  --page-pad:16px;      /* 페이지 좌우 여백 */
  --tap:44px;           /* 버튼·입력 최소 높이(터치) */
  --gap-grid:12px;      /* 카드 그리드 간격 */
}
@media (min-width:768px){:root{
  /* 태블릿 */
  --text-3xl:1.875rem;  /* 30px */
  --text-4xl:2.25rem;   /* 36px */
  --text-5xl:3rem;      /* 48px */
  --page-pad:24px;
  --tap:40px;
  --gap-grid:16px;
}}
@media (min-width:1024px){:root{
  /* 데스크탑 */
  --text-xs:.6875rem;   /* 12px -> 11px */
  --text-sm:.8125rem;   /* 14px -> 13px */
  --text-base:.9rem;    /* 16px -> 14.4px */
  --text-lg:1.0125rem;  /* 18px -> 16.2px */
  --text-xl:1.125rem;   /* 20px -> 18px */
  --text-2xl:1.35rem;   /* 24px -> 21.6px */
  --text-3xl:1.6875rem; /* 30px -> 27px */
  --text-4xl:2.025rem;  /* 36px -> 32.4px */
  --text-5xl:2.7rem;    /* 48px -> 43.2px */
  --page-pad:32px;
  --tap:36px;
  --gap-grid:16px;
}}

/* ── 기본 ───────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:110px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-base);line-height:var(--lh);
  -webkit-font-smoothing:antialiased;letter-spacing:-.003em;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
b,strong{font-weight:650}
code{font-family:var(--mono);font-size:.88em;color:var(--link);background:var(--soft);padding:1px 5px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--page-pad) 56px}
@media (max-width:1023px){.btn,.vbtn,.tabchip,.opt{min-height:var(--tap)}}
.muted{color:var(--muted)}
/* 상단 바 */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:calc(52px + env(safe-area-inset-top,0px));margin:0 -20px 22px;padding:env(safe-area-inset-top,0px) 20px 0;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.brand{font-size:var(--fs-xs);color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;letter-spacing:.01em}
.brand b{color:var(--ink);font-weight:600}
.iconbtn{font:inherit;font-size:var(--text-base);border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);width:32px;height:32px;border-radius:var(--r);cursor:pointer;flex:0 0 auto;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--muted)}
.topscore{flex:none;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:var(--text-sm);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.topscore small{font-size:var(--text-xs);font-weight:400;color:var(--muted)}
.topscore[hidden]{display:none}
@media (max-width:767px){.topscore{padding:2px 8px}.topscore small{display:none}}
/* 제목 */
h1{font-size:var(--fs-h1);line-height:1.3;margin:0 0 6px;letter-spacing:-.02em;font-weight:700;color:var(--title)}
h2{font-size:var(--fs-h2);line-height:1.4;margin:0;font-weight:650;letter-spacing:-.01em}
.ph{font-size:var(--text-base);color:var(--muted);font-weight:600;margin:0 0 10px;letter-spacing:0}
.sh{font-size:var(--fs-sm);color:var(--muted);font-weight:600;margin:16px 0 6px}
.sub{color:var(--muted);margin:0 0 4px}
.meta{font-size:var(--fs-xs);color:var(--faint);margin:0 0 18px;font-family:var(--mono);letter-spacing:-.01em}
.crumbs{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:var(--fs-sm);color:var(--faint)}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink)}
.part{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--link);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:1px 7px;white-space:nowrap;max-width:100%;font-weight:500;letter-spacing:0}
.tabhead .part,.ngroup .part{white-space:normal;overflow-wrap:anywhere}  /* 긴 자료 위치(예: voice-ai 교시 라벨)는 줄바꿈 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.center{text-align:center}
.note-sm{font-size:var(--fs-sm);color:var(--muted)}
.lbl{display:block;font-size:var(--fs-xs);color:var(--muted);margin-bottom:2px}
/* 버튼 */
.btn{font:inherit;font-size:var(--fs-btn);display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);
  padding:7px 12px;border-radius:var(--r);cursor:pointer;text-decoration:none;min-height:34px;line-height:1.3;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pri-bg);color:var(--pri-ink);border-color:var(--pri-line);font-weight:650;font-size:var(--fs-btn-pri);padding:8px 18px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.locked{opacity:.5}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--btn-line))}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn .cnt{font-family:var(--mono);font-size:var(--fs-2xs);background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;min-width:18px;line-height:16px;text-align:center}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
button:focus-visible,a:focus-visible,input:focus-visible,.opt:focus-within{outline:2px solid var(--link);outline-offset:2px}
/* 입력 */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;max-width:300px}
.field label{font-size:var(--fs-xs);color:var(--muted)}
.field input{font:inherit;font-size:var(--text-base);padding:7px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--field);color:var(--ink)}
.field input::placeholder{color:var(--faint)}
/* 진행 바 */
.bar{flex:1;height:4px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--link);transition:width .25s}
.progress{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:8px 0;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.progress span,.homeprog span{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.homeprog{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
/* 홈 탭 카드 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:6px}
.tcard{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;text-decoration:none;color:var(--ink);transition:border-color .15s;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--line-2)}
.tcard .tn{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint)}
.tcard .tt{font-weight:600;font-size:var(--text-base);line-height:1.45}
.tcard .ts{margin-top:auto;padding-top:8px;font-size:var(--fs-xs);color:var(--faint);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono)}
.tcard.done .ts b{color:var(--ok);font-weight:600}
.tcard.perfect{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.lockmsg{font-size:var(--fs-xs);color:var(--faint);margin:-6px 0 16px}
/* 탭 바 */
/* 학습 탭 선택: 웹(≥1024) 자유 배치 · 태블릿(560~1023) 3개 · 모바일(<560) 2개 */
.tabbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
@media (max-width:1023px){.tabbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}}
.tabchip{min-width:0;display:flex;align-items:center;gap:6px;font-size:var(--fs-btn);padding:6px 10px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);text-decoration:none;color:var(--ink);line-height:1.35;word-break:keep-all}
.tabchip .tl{min-width:0}
.tabchip .qc{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--muted);white-space:nowrap;margin-left:auto}
.tabchip[aria-selected="true"] .qc{color:var(--link)}
.tabchip .sc{white-space:nowrap}
.btn .qc{font-family:var(--mono);font-weight:500;opacity:.85}
.tabchip b{font-family:var(--mono);font-weight:600;color:var(--faint)}
.tabchip:hover{border-color:var(--muted)}

.lv1 em{color:var(--lv1)} .lv2 em{color:color-mix(in srgb,var(--lv2) 80%,var(--ink))} .lv3 em{color:var(--lv3)}
.verdict{margin-left:auto;font-weight:650;font-size:var(--fs-xs)}
.correct .verdict{color:var(--ok)} .wrong .verdict{color:var(--bad)}
.qsrc{margin-left:auto;font-size:var(--fs-2xs);color:var(--faint)}
.qt{font-size:var(--fs-q);font-weight:500;margin:4px 0 8px}
.guide{font-size:var(--fs-xs);color:var(--faint);margin:-4px 0 8px}
/* 음성 선택 · 문제 읽기 · 그림/오디오 */
.vrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px}
.vbtn{font:inherit;font-size:var(--fs-btn);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);border-radius:var(--r);padding:4px 10px;min-height:32px;cursor:pointer}
.vbtn:hover{border-color:var(--muted)}
.vbtn svg{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vbtn[data-state="listening"]{border-color:var(--link);color:var(--link);box-shadow:0 0 0 3px color-mix(in srgb,var(--link) 28%,transparent);animation:vpulse 1.2s ease-in-out infinite}
.vbtn[data-state="heard"]{border-color:var(--ok)}

.vabtn[hidden]{display:none}
.vbar{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;max-width:calc(100vw - 32px);padding:8px 14px;border-radius:999px;border:1px solid var(--link);background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:var(--text-sm);text-align:center}

.vbar[data-state="error"]{border-color:var(--bad)}
.vbar[data-state="heard"]{border-color:var(--ok)}
.sheet .card.vcur,.sheet article.vcur{outline:2px solid var(--link);outline-offset:3px}
.vstat:empty{display:none}

.qaud{margin:6px 0 10px}
.qaud audio{display:block;width:100%;max-width:420px}

.qaud summary{cursor:pointer}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--panel);font-size:var(--fs-opt);transition:border-color .12s,background .12s}

.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:360px}
.ox button{font:inherit;font-size:var(--fs-ox);font-weight:700;padding:8px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);cursor:pointer;line-height:1.3}

.ox button.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--btn-bg));color:var(--ok)}
.ox button.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--btn-bg));color:var(--bad)}
/* 짝 맞추기 */

.mcol{display:flex;flex-direction:column;gap:6px}

.oitem.ok .num{background:var(--ok)}
.oitem.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}

.locked .oitem{pointer-events:none}
.opt .onum{flex:0 0 auto;min-width:18px;height:18px;padding:0 4px;border-radius:var(--r-sm);border:1px solid var(--line-2);display:inline-grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);color:var(--muted);margin-top:1px}
.opt:has(input:checked) .onum{border-color:var(--link);color:var(--link)}
.opt.ans .onum{border-color:var(--ok);color:var(--ok)} .opt.miss .onum{border-color:var(--bad);color:var(--bad)}
/* 힌트 토글 (빨간색 = Hint) */

.hintbtn{font:inherit;font-size:var(--fs-xs);font-weight:650;display:inline-flex;align-items:center;gap:4px;color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:var(--r-sm);padding:2px 9px;cursor:pointer;line-height:1.5}

.src{margin:6px 0 0;padding:6px 10px;border-left:3px solid var(--link);background:var(--soft);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:var(--fs-xs);color:var(--muted)}

/* 해설 */

.wrong .exp{border-left-color:color-mix(in srgb,var(--bad) 55%,var(--line))}

.an{font-family:var(--mono);color:var(--link);font-size:var(--fs-xs);margin:4px 0 0}

/* 결과 */
.score{font-family:var(--mono);font-size:var(--text-4xl);font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--title);letter-spacing:-.02em}

/* 오답노트 · 해설지 */

details.more{margin-top:14px;font-size:var(--fs-sm)}

@media (max-width:767px){.gpick{gap:6px}.gcard{min-height:84px;padding:10px 8px;align-items:center;text-align:center;justify-content:center}.gcard b{font-size:var(--text-sm);word-break:keep-all}.gcard .gd{display:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.chip{font:inherit;font-size:var(--fs-btn);padding:6px 12px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);cursor:pointer;min-height:32px}
.chip:hover{border-color:var(--muted)}

  padding:8px 14px;border-radius:var(--r);font-size:var(--fs-sm);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .18)}

<script>/* QB 공용 코어 — 저장 키, mock 로그인, 테마, 과목 목록. 비밀번호는 저장하지 않는다. */
(function(){
'use strict';
var KEY_USER='qb:user', KEY_UI='qb:ui:v1', KEY_THEME='qb:theme';
function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function del(k){try{localStorage.removeItem(k);}catch(e){}}
function json(k,d){try{var r=get(k);return r?JSON.parse(r):d;}catch(e){return d;}}
var QB=window.QB={};
QB.SUBJECTS=[
  {id:'it',label:'IT'},{id:'korean',label:'국어'},{id:'english',label:'영어'},
  {id:'science',label:'과학'},{id:'music',label:'음악'},{id:'art',label:'미술'}
];
QB.user=function(){var u=json(KEY_USER,null);return u&&u.v===1&&u.name?u:null;};
QB.login=function(o){
  o=o||{};var prev=json(KEY_USER,null),now=new Date().toISOString();
  var u={v:1,name:String(o.name||'').trim().slice(0,20),email:String(o.email||'').trim(),
    provider:o.provider||'email',createdAt:(prev&&prev.createdAt)||now,lastLoginAt:now};
  set(KEY_USER,JSON.stringify(u));return u;
};
QB.logout=function(){del(KEY_USER);};
QB.rename=function(n){
  var u=QB.user();n=String(n||'').trim().slice(0,20);if(!u||!n)return null;
  u.name=n;set(KEY_USER,JSON.stringify(u));return u;
};
QB.safeNext=function(n){
  n=String(n||'');return /^dashboard\.html(#[A-Za-z0-9\/=&_-]*)?$/.test(n)?n:'dashboard.html';
};
QB.requireUser=function(next){
  var u=QB.user();if(u)return u;
  next=QB.safeNext(next==null?'dashboard.html'+location.hash:next);
  location.replace('login.html?next='+encodeURIComponent(next));return null;
};
QB.theme={
  get:function(){return get(KEY_THEME);},
  apply:function(){var t=get(KEY_THEME),r=document.documentElement;if(t)r.dataset.theme=t;else delete r.dataset.theme;},
  toggle:function(){
    var t=get(KEY_THEME),dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    set(KEY_THEME,dark?'light':'dark');QB.theme.apply();
  }
};
QB.ui={
  get:function(){var d=json(KEY_UI,null);return d&&typeof d==='object'?d:{sidebar:true,subject:'it'};},
  set:function(p){var d=Object.assign(QB.ui.get(),p||{});set(KEY_UI,JSON.stringify(d));return d;}
};
QB.theme.apply();
})();
</script>
<script>/* qb-voice.js — 음성으로 보기 번호 고르기(Web Speech API) + 문제 읽기(speechSynthesis)
   window.QBVoice: supported · canSpeak · parse · attach · auto(연속 듣기) · speak · cancelSpeak · isSpeaking · stopListening
   parse()는 순수 함수라 node에서도 테스트한다. */
(function(root){
'use strict';

/* ── 말 → 선택 해석 (순수 함수) ───────────────── */
const SINO={일:1,이:2,삼:3,사:4,오:5,육:6,칠:7,팔:8,구:9,십:10};
const NAT={하나:1,둘:2,셋:3,넷:4,다섯:5,여섯:6,일곱:7,여덟:8,아홉:9,열:10};
const DET={한:1,두:2,세:3,네:4,첫:1};  // 한/두/세/네/첫 은 '번'·'번째'·'째'가 붙을 때만 번호
// 보기 글자 A~H. '이'(E)는 숫자 2와 겹쳐 숫자를 우선하므로 영문 e로만 받는다
const LET={a:1,b:2,c:3,d:4,e:5,f:6,g:7,h:8,에이:1,비:2,씨:3,디:4,에프:6,지:7,에이치:8};

const alt=o=>Object.keys(o).sort((x,y)=>y.length-x.length).join('|');
const PRE='(?:정답은|정답이|정답|답은|답이|답|내답은|제답은|저는|나는|전|선택|번호)?';
const SUF='(?:이에요|이요|예요|이야|이죠|이다|입니다|이라고생각해요|이라고|선택할게요?|선택|할게요?|할래요?|고를게요?|고를래요?|정답|같아요|요|으로|로|을|를|이|가|은|는)*';
const R_DIGIT=new RegExp('^'+PRE+'(\\d{1,2})(?:번째|번|째)?'+SUF+'$');
const R_STD=new RegExp('^'+PRE+'('+alt(Object.assign({},SINO,NAT))+')(?:번째|번|째)?'+SUF+'$');
const R_DET=new RegExp('^'+PRE+'('+alt(DET)+')(?:번째|번|째)'+SUF+'$');
const R_LET=new RegExp('^'+PRE+'('+alt(LET)+')(?:번)?'+SUF+'$');
const R_X=/틀|아니|아닙|아닌|안맞|맞지않|엑스|가위|^x(?:요|입니다)?$/;
const R_O=/^(?:o|오|동그라미|오케이|ok|예|네|응|그래요?|맞.*)(?:요|입니다|이요|예요|야|라고생각해요)?$/;
const R_SUBMIT=/제출|채점|확인|다풀었|다했/;
const R_NEXT=/^(?:다음|다음문제|패스|건너뛰|건너뛸게|넘어가|넘어갈게|넘겨|스킵|skip)/;

function norm(s){
  return String(s==null?'':s).normalize('NFKC').toLowerCase().replace(/[\s.,!?'"“”‘’~…·\-_()\[\]]/g,'');
}
function numOf(t){
  let m;
  if((m=R_DIGIT.exec(t)))return +m[1];
  if((m=R_STD.exec(t)))return SINO[m[1]]||NAT[m[1]];
  if((m=R_DET.exec(t)))return DET[m[1]];
  if((m=R_LET.exec(t)))return LET[m[1]];
  return 0;
}
function parseOne(raw,count,type){
  const t=norm(raw);if(!t)return null;
  if(R_NEXT.test(t))return {kind:'next'};
  if(type==='ox'){
    if(R_X.test(t))return {kind:'ox',v:'X'};
    if(R_O.test(t))return {kind:'ox',v:'O'};
    const n=numOf(t);  // ox에서 1번 = O, 2번 = X (게임 모드 키와 같음)
    if(n===1)return {kind:'ox',v:'O'};
    if(n===2)return {kind:'ox',v:'X'};
    return R_SUBMIT.test(t)?{kind:'submit'}:null;
  }
  const n=numOf(t)||numOf(t.replace(/(?:제출|채점|확인).*$/,''));  // '3번 제출'은 번호 우선
  if(n)return n>=1&&n<=count?{kind:'index',i:n-1}:null;  // 범위 밖이면 다음 후보로
  return R_SUBMIT.test(t)?{kind:'submit'}:null;
}
/* text: 문자열 또는 후보 배열. 범위 안에서 해석되는 첫 후보를 돌려준다 */
function parse(text,opt){
  opt=opt||{};
  const count=opt.count>0?opt.count:4, type=opt.type||'mc';
  const list=Array.isArray(text)?text:[text];
  for(const s of list){const r=parseOne(s,count,type);if(r)return r;}
  return null;
}

/* ── 브라우저 부분 ────────────────────────── */
const hasWin=typeof window!=='undefined';
const SR=()=>hasWin?(window.SpeechRecognition||window.webkitSpeechRecognition):null;
const supported=()=>!!SR();
const canSpeak=()=>hasWin&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';

const ERR={
  'not-allowed':'마이크 권한이 꺼져 있습니다. 주소창의 마이크 아이콘에서 허용하세요.',
  'service-not-allowed':'마이크 권한이 꺼져 있습니다. 주소창의 마이크 아이콘에서 허용하세요.',
  'network':'음성 인식은 인터넷 연결이 필요합니다.',
  'no-speech':'소리가 들리지 않았습니다. 다시 눌러 말해 주세요.',
  'audio-capture':'마이크를 찾을 수 없습니다.'
};
let active=null;  // 지금 듣는 중인 컨트롤러 (동시에 하나만)
let autoCtl=null;  // 연속 듣기 컨트롤러(하나)
function stopListening(){if(active){active.stop();active=null;}if(autoCtl)autoCtl.stop();}

function describe(r){
  if(r.kind==='index')return `'${r.i+1}번'으로 들었습니다`;
  if(r.kind==='ox')return `'${r.v}'로 들었습니다`;
  if(r.kind==='next')return "'다음'으로 들었습니다";
  return "'제출'로 들었습니다";
}

/* o: {button, live, getOptions, getType, select, submit, lang, bind}
   button·live는 요소 또는 요소를 돌려주는 함수(카드를 다시 그려도 새 요소를 찾도록).
   select(r): r = {kind:'index',i} | {kind:'ox',v}. submit(): 제출. bind:false면 클릭 리스너를 달지 않는다(위임용) */
function attach(o){
  const get=x=>typeof x==='function'?x():x;
  const ctl={listening:false,toggle(){},stop(){}};
  const b0=get(o.button);
  if(!supported()){if(b0)b0.hidden=true;return ctl;}
  const lang=o.lang||'ko-KR';
  let rec=null, done=false;
  function ui(state,msg){
    const b=get(o.button), l=get(o.live);
    if(b){b.dataset.state=state;b.setAttribute('aria-pressed',state==='listening'?'true':'false');}
    if(l&&msg!=null)l.textContent=msg;
  }
  ctl.stop=function(){
    ctl.listening=false;done=true;
    if(rec){try{rec.abort();}catch(e){}rec=null;}
    ui('idle');
  };
  function finish(state,msg){if(done)return;done=true;ctl.listening=false;rec=null;if(active===ctl)active=null;ui(state,msg);}
  function onResult(alts){
    const count=o.getOptions?o.getOptions():4, type=o.getType?o.getType():'mc';
    let r=parse(alts,{count,type});
    if(r&&((r.kind==='submit'&&!o.submit)||r.kind==='next'))r=null;
    if(!r){
      const heard=(alts[0]||'').trim().slice(0,24);
      const guide=type==='ox'?"'O' 또는 'X'로 말해 주세요.":`1~${count}번 중에서 말해 주세요.`;
      finish('error',heard?`'${heard}'로 들었습니다. ${guide}`:'소리가 들리지 않았습니다. 다시 눌러 말해 주세요.');
      return;
    }
    finish('heard');
    try{if(r.kind==='submit')o.submit();else o.select(r);}catch(e){}
    ui('heard',describe(r));  // select가 카드를 다시 그렸더라도 새 요소에 상태를 적는다
  }
  ctl.toggle=function(){
    if(ctl.listening){ctl.stop();return;}
    stopListening();cancelSpeak();
    const Ctor=SR();
    try{rec=new Ctor();}catch(e){ui('error','음성 인식을 시작할 수 없습니다.');return;}
    done=false;ctl.listening=true;active=ctl;
    rec.lang=lang;rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=5;
    rec.onresult=ev=>{
      const res=ev.results&&ev.results[0], alts=[];
      if(res)for(let i=0;i<res.length;i++)alts.push(res[i].transcript);
      onResult(alts);
    };
    rec.onerror=ev=>{
      if(ev.error==='aborted')return;
      finish('error',ERR[ev.error]||'음성 인식에 실패했습니다. 다시 눌러 주세요.');
    };
    rec.onend=()=>{if(!done)finish('error',ERR['no-speech']);};
    ui('listening','듣는 중…');
    try{rec.start();}catch(e){finish('error','음성 인식을 시작할 수 없습니다. 잠시 뒤 다시 눌러 주세요.');}
  };
  if(o.bind!==false&&b0)b0.addEventListener('click',ctl.toggle);
  return ctl;
}


/* ── 연속 듣기: 한 번 켜 두면 문제가 바뀌어도 계속 듣는다 ─────────
   o: {getTarget, select, next, submit, onState, lang}
   getTarget() → {count,type} | null (null이면 들어도 무시). onState(state,msg): 'listening'|'heard'|'error'|'off'
   치명 오류(권한 거부·마이크 없음·네트워크)면 스스로 꺼지고, 그 밖의 끊김은 자동으로 다시 시작한다. */
const FATAL={'not-allowed':1,'service-not-allowed':1,'audio-capture':1,'network':1,'language-not-supported':1};
function auto(o){
  const lang=o.lang||'ko-KR';
  let rec=null,want=false,timer=null,quick=0,fatal=false;
  const ctl={get want(){return want;},get listening(){return !!rec;}};
  const state=(s,m)=>{try{o.onState&&o.onState(s,m);}catch(e){}};
  const later=(ms)=>{if(timer)clearTimeout(timer);timer=setTimeout(open,ms);};
  function handle(alts){
    const tg=o.getTarget?o.getTarget():null;
    if(!tg)return;
    const r=parse(alts,{count:tg.count,type:tg.type});
    if(!r||(r.kind==='submit'&&!o.submit)||(r.kind==='next'&&!o.next)){
      const heard=(alts[0]||'').trim().slice(0,24);
      state('listening',heard?`'${heard}'로 들었습니다. ${tg.type==='ox'?"'O' 또는 'X'로":`1~${tg.count}번 중에서`} 말해 주세요.`:'듣는 중…');
      return;
    }
    try{if(r.kind==='submit')o.submit();else if(r.kind==='next')o.next();else o.select(r);}catch(e){}
    state('heard',describe(r));
  }
  function open(){
    timer=null;
    if(!want||rec)return;
    if(isSpeaking()){later(400);return;}
    const Ctor=SR();
    if(!Ctor){want=false;state('off');return;}
    let r;try{r=new Ctor();}catch(e){want=false;state('error','음성 인식을 시작할 수 없습니다.');return;}
    rec=r;fatal=false;
    const t0=Date.now();let got=false;
    r.lang=lang;r.continuous=false;r.interimResults=false;r.maxAlternatives=5;
    r.onresult=ev=>{
      got=true;quick=0;
      const res=ev.results&&ev.results[ev.results.length-1],alts=[];
      if(res)for(let i=0;i<res.length;i++)alts.push(res[i].transcript);
      handle(alts);
    };
    r.onerror=ev=>{
      if(ev.error==='aborted'||ev.error==='no-speech')return;
      if(FATAL[ev.error]){fatal=true;want=false;state('error',ERR[ev.error]||'음성 인식을 사용할 수 없습니다.');}
    };
    r.onend=()=>{
      if(rec===r)rec=null;
      if(!want)return;
      if(!got&&Date.now()-t0<700){
        if(++quick>=6){want=false;state('error','음성 인식이 계속 끊깁니다. 마이크 버튼을 눌러 다시 켜 주세요.');return;}
      }else if(!got)quick=0;
      later(got?120:250);
    };
    try{r.start();}catch(e){rec=null;later(500);}
  }
  ctl.start=function(){
    if(!supported())return false;
    want=true;quick=0;state('listening','듣는 중… 보기 번호를 말하세요');
    open();return true;
  };
  ctl.stop=function(){
    const was=want;want=false;
    if(timer){clearTimeout(timer);timer=null;}
    if(rec){const r=rec;rec=null;try{r.abort();}catch(e){}}
    if(was)state('off');
  };
  ctl.pause=function(){if(rec){try{rec.abort();}catch(e){}}};
  autoCtl=ctl;
  return ctl;
}

/* ── 읽어 주기 ────────────────────────────── */
function pickVoice(lang){
  try{
    const vs=speechSynthesis.getVoices();
    return vs.find(v=>v.lang===lang)||vs.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang.slice(0,2).toLowerCase()))||null;
  }catch(e){return null;}
}
function speak(text,lang){
  if(!canSpeak()||!text)return false;
  lang=lang||'ko-KR';
  try{
    if(autoCtl)autoCtl.pause();  // 읽어 주는 소리를 듣고 답으로 오해하지 않도록 잠시 멈춤
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text));
    u.lang=lang;const v=pickVoice(lang);if(v)u.voice=v;
    speechSynthesis.speak(u);return true;
  }catch(e){return false;}
}
function cancelSpeak(){if(canSpeak()){try{speechSynthesis.cancel();}catch(e){}}}
function isSpeaking(){try{return canSpeak()&&speechSynthesis.speaking;}catch(e){return false;}}

const API={supported,canSpeak,parse,attach,auto,speak,cancelSpeak,isSpeaking,stopListening};
if(hasWin)root.QBVoice=API;
if(typeof module!=='undefined'&&module.exports)module.exports=API;
})(typeof window!=='undefined'?window:globalThis);
</script>

'use strict';
const BANK={"id":"ov-linux","code":"LX","title":"리눅스 실습 노트 · 우분투로 배우는 리눅스 기본","subtitle":"리눅스·우분투 개념 · 14가지 핵심 명령어 실습 · 권한·프로세스·쉘 스크립트","course":"06 · 인텔 Physical AI · OpenVINO","source":"06-ai-openVino/리눅스_실습_노트.pdf","salt":"ov-linux","version":1,"updated":"2026-10-15","tabs":[{"id":"t1","title":"리눅스와 우분투 개념","ref":"PART 1 · 01–09 (p.5–13)","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"엄밀히 말해 '리눅스(Linux)'는 무엇의 이름인가요?","o":["배포판","커널","쉘","패키지 관리자"],"a":1,"h":"자료의 구조도에서 응용 프로그램과 하드웨어 사이에 놓인 층은 메모리·프로세스·장치·파일 시스템을 관리하는 운영체제의 핵심입니다. 배포판은 바로 이 핵심 위에 여러 도구를 얹어 만든 것이라고 설명합니다. 그렇다면 '리눅스'라는 이름은 배포판 전체가 아니라 그 아래 핵심 층을 가리킵니다.","w":"리눅스는 메모리·프로세스·장치·파일 시스템을 관리하는 커널의 이름입니다. 배포판은 이 커널 위에 여러 도구를 묶은 것입니다.","an":"PART 1 · 04 커널이란 무엇인가 (p.8)","src":"커널 (Kernel) 메모리 · 프로세스 · 장치(하드웨어) · 파일 시스템을 관리하는 운영체제의핵심 하드웨어 CPU, 메모리, 디스크 등 실제 물리 장치 엄밀히 말해 '리눅스'는 커널의 이름이며, 배포판은 이 커널 위에 여러 도구를 얹은 것입니다."},{"id":"t1-02","ty":"mc","lv":1,"game":true,"p":"리눅스 커널이 처음 공개된 해와 공개한 사람은?","o":["벨 연구소 · 1969","리처드 스톨먼 · 1983","리누스 토르발스 · 1991","우분투 첫 릴리스 · 2004"],"a":2,"h":"자료의 연표는 1969년 벨 연구소의 유닉스 개발, 1983년 리처드 스톨먼의 GNU 프로젝트 시작으로 이어집니다. 그다음 해에 커널이 처음 공개되었고, 이듬해인 1992년에 GPL 라이선스를 채택했습니다. 1992년 바로 전 해와 그때 커널을 공개한 인물을 짝지어 보세요.","w":"1991년 리누스 토르발스가 리눅스 커널을 처음 공개했습니다. 1969년은 유닉스 개발, 1983년은 GNU 프로젝트 시작, 2004년은 우분투 첫 릴리스입니다.","an":"PART 1 · 02 리눅스의 탄생과 흐름 (p.6)","src":"1983 리처드 스톨먼, GNU 프로젝 트 시작 1991 리누스 토르발스, 리눅스 커 널 최초 공개 1992 GPL 라이선스 채택, 자유로운 배포 시작"},{"id":"t1-03","ty":"mc","lv":2,"game":true,"p":"우분투 버전 번호 '22.04'가 뜻하는 것은?","o":["2022년 4월 출시","22번째 버전의 4차 수정","4년간 지원하는 버전","커널 버전 22.04"],"a":0,"h":"우분투 버전 번호는 '출시 연도.월' 형식을 따릅니다. 앞자리 두 숫자는 연도의 뒷부분, 점 뒤 숫자는 출시된 달을 나타냅니다. 22와 04를 각각 연도와 월로 읽어 보세요.","w":"우분투 버전은 출시 연도.월 형식이라 22.04는 2022년 4월에 나온 버전(Jammy Jellyfish)입니다.","an":"PART 1 · 09 우분투 버전과 LTS (p.13)","src":"버전 번호 규칙 출시 연도.월 형식입니다. 22.04는 2022년 4월 출시를 의미합니다."},{"id":"t1-04","ty":"mc","lv":2,"game":true,"p":"우분투의 기반 배포판과 패키지 관리자로 알맞은 것은?","o":["RHEL · YUM","Fedora · DNF","CentOS · DNF","Debian · APT"],"a":3,"h":"주요 배포판 비교표는 배포판마다 '기반'과 '패키지 관리자'를 함께 적어 둡니다. 표에서 Debian은 안정성을 중시하는 '우분투의 뿌리'로 소개되고, 우분투는 그 계열의 패키지 관리자를 그대로 씁니다. 패키지 관리 실습에서 쓰는 <code>sudo apt ...<\/code> 명령도 단서가 됩니다.","w":"우분투는 Debian을 기반으로 하며 APT로 패키지를 관리합니다. CentOS·RHEL은 YUM/DNF, Fedora는 DNF를 씁니다.","an":"PART 1 · 07 주요 배포판 비교 (p.11)","src":"배포판 기반 패키지 관리자 특징 Ubuntu Debian APT 초보자 친화적, 방대한 커뮤니티와 문서 Debian - APT 안정성 중시, 우분투의 뿌리가 되는 배포판"},{"id":"t1-05","ty":"mc","lv":3,"game":true,"p":"회사 서버에 오래 안정적으로 쓸 우분투 버전을 고른다면?","o":["가장 최신 일반 버전","LTS 버전","보안 특화 배포판","임베디드용 배포판"],"a":1,"h":"LTS는 Long Term Support의 약자로, 짝수 연도 4월에 나오며 5년간 보안 업데이트를 받습니다. 자료는 안정성을 원한다면 이 버전을 고르라고 하고, 실무와 서버 환경에서는 이 버전을 쓰는 것이 일반적이라고 설명합니다.","w":"LTS(Long Term Support)는 5년간 보안 업데이트를 지원하므로 실무와 서버 환경에서 일반적으로 사용합니다.","an":"PART 1 · 09 우분투 버전과 LTS (p.13)","src":"L TS(Long Term Support) 짝수 연도 4월에 출시되며 5년간 보안 업데이트를 지원합니다. 안정성을 원한다면 L TS 실무와 서버 환경에서는 LTS 버전을 사용하는 것이 일반적입니다."},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"리눅스는 GPL(GNU General Public License)을 따르는 오픈소스다.","a":true,"h":"오픈소스는 소스코드가 공개되어 누구나 열람·수정·재배포할 수 있는 소프트웨어입니다. 자료의 '오픈소스의 정의' 항목은 리눅스가 따르는 라이선스 이름까지 함께 적어 둡니다. 1992년 연표의 'GPL 라이선스 채택'과도 연결해 보세요.","w":"맞습니다. 리눅스는 GPL을 따르므로 누구나 소스코드를 보고, 수정하고, 다시 배포할 수 있습니다.","an":"PART 1 · 03 오픈소스란 무엇인가 (p.7)","src":"오픈소스의 정의 — 소스코드가 공개되어 누구나 열람할 수 있습니다. — 누구나 코드를 수정하고 다시 배포할 수 있습니다. — 리눅스는 GPL(GNU General Public License)을 따릅니다."},{"id":"t1-07","ty":"ox","lv":2,"game":true,"p":"우분투 LTS는 홀수 연도 4월에 출시되어 3년간 보안 업데이트를 받는다.","a":false,"h":"자료는 LTS가 출시되는 연도의 조건(짝수/홀수)과 월, 보안 업데이트 기간을 함께 밝힙니다. 실습 기준 버전 22.04 LTS의 '22'가 짝수인지 보고, 지원 기간이 몇 년인지 문장과 비교해 보세요.","w":"틀렸습니다. LTS는 짝수 연도 4월에 출시되고 5년간 보안 업데이트를 지원합니다.","an":"PART 1 · 09 우분투 버전과 LTS (p.13)","src":"L TS(Long Term Support) 짝수 연도 4월에 출시되며 5년간 보안 업데이트를 지원합니다."},{"id":"t1-08","ty":"match","lv":2,"game":false,"p":"배포판 종류와 특징을 연결하세요.","pairs":[["서버용 배포판","안정성·장기 지원 중시, GUI 없이 운영"],["데스크톱용 배포판","GUI와 사용성에 신경 써 초보자도 쉬움"],["임베디드용 배포판","경량화되어 IoT 기기·라우터에 탑재"],["보안 특화 배포판","모의해킹·포렌식 도구를 미리 갖춤"]],"h":"배포판은 쓰이는 곳에 따라 특징이 달라집니다. 서버는 오래 안정적으로 돌아가야 하고, 데스크톱은 초보자가 쓰기 쉬워야 하며, 임베디드 기기는 작고 가벼워야 합니다. 보안 분야는 모의해킹·포렌식처럼 특정 목적의 도구를 미리 갖춰야 합니다.","w":"배포판은 같은 커널 위에서도 목적에 따라 서버용·데스크톱용·임베디드용·보안 특화로 나뉩니다.","an":"PART 1 · 06 배포판이란 (p.10)","src":"1 서버용 배포판 안정성과 장기 지원을 중시하며 GUI 없이 운영되는 경우가 많습니다. 2 데스크톱용 배포판 초보자도 쉽게 쓸 수 있도록 GUI와 사용성에 신경 쓴 배포판입니다. 3 임베디드용 배포판 경량화되어 IoT 기기나 라우터 같은 소형 장치에 탑재됩니다. 4 보안 특화 배포판 모의해킹, 포렌식 등 특정 목적에 맞춘 도구를 미리 갖춘 배포판입니다."},{"id":"t1-09","ty":"order","lv":2,"game":false,"p":"리눅스의 탄생과 흐름을 시간 순서대로 정렬하세요.","steps":["벨 연구소에서 유닉스 개발","GNU 프로젝트 시작","리눅스 커널 최초 공개","GPL 라이선스 채택","우분투 최초 릴리스"],"h":"자료의 연표는 1969 → 1983 → 1991 → 1992 → 2004 순서로 이어집니다. 유닉스가 먼저 생기고 GNU 프로젝트가 시작된 뒤, 커널이 공개되고 이듬해 라이선스가 정해졌습니다. 우분투는 그보다 훨씬 뒤인 2000년대에 처음 나왔습니다.","w":"1969 유닉스 → 1983 GNU 프로젝트 → 1991 리눅스 커널 공개 → 1992 GPL 채택 → 2004 우분투 첫 릴리스 순서입니다.","an":"PART 1 · 02 리눅스의 탄생과 흐름 (p.6)","src":"1969 AT&T 벨 연구소, 유닉스 (Unix) 개발 1983 리처드 스톨먼, GNU 프로젝 트 시작 1991 리누스 토르발스, 리눅스 커 널 최초 공개 1992 GPL 라이선스 채택, 자유로운 배포 시작 2004 우분투(Ubuntu) 최초 릴리스"},{"id":"t1-10","ty":"multi","lv":2,"game":true,"p":"자료가 소개한 '왜 우분투인가'의 이유를 <b>모두<\/b> 고르세요.","o":["쉬운 설치와 GUI","방대한 커뮤니티","강력한 APT","클라우드 기본 이미지","유료 라이선스 지원"],"a":[0,1,2,3],"h":"자료는 우분투를 고르는 이유를 네 가지로 듭니다. 설치와 사용이 쉬운 GUI, 문서와 포럼이 풍부한 커뮤니티, 명령 한 줄로 설치·삭제·업데이트하는 패키지 도구, 그리고 AWS·Azure 같은 클라우드에서 기본 이미지로 쓰인다는 점입니다.","w":"쉬운 설치와 GUI, 방대한 커뮤니티, 강력한 APT, AWS·Azure 등 클라우드의 표준 이미지가 우분투를 고르는 이유입니다. 유료 라이선스는 해당하지 않습니다.","an":"PART 1 · 08 왜 우분투인가 (p.12)","src":"왜 우분투인가 1 쉬운 설치와 GUI 처음 리눅스를 접해도 어렵지 않게 설치하고 사용할 수 있습니다. 2 방대한 커뮤니티 질문에 대한 답을 쉽게 찾을 수 있는 문서와 포럼이 풍부합니다. 3 강력한 APT 명령어 한 줄로 프로그램을 설치·삭제·업데이트할 수 있습니다. 4 클라우드의 표준 AWS, Azure 등 주요 클라우드에서 기본 이미지로 널리 쓰입니다."}]},{"id":"t2","title":"CLI·쉘·경로·권한 개념","ref":"PART 1 · 10–16 (p.14–20)","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"사용자의 명령을 해석해 커널에 전달하는 프로그램은?","o":["터미널","쉘","커널","콘솔"],"a":1,"h":"리눅스 아키텍처는 응용 프로그램 → (해석 층) → 커널 → 하드웨어 순서로 쌓여 있습니다. 터미널은 명령을 입력하고 결과를 보는 '창'일 뿐이고, 그 안에서 명령을 실제로 해석해 커널로 넘기는 프로그램은 따로 있습니다. 우분투에서 이 프로그램의 기본값은 bash입니다.","w":"쉘은 사용자의 명령을 해석해 커널에 전달합니다. 터미널은 명령을 입력하고 결과를 보는 창, 콘솔은 원래 물리 입출력 장치를 뜻하던 용어입니다.","an":"PART 1 · 11–12 터미널·쉘 (p.15–16)","src":"쉘 사용자의 명령을 해석해 커널에 전달하는 프로그램입니다. bash 가장 널리 쓰이는 기본 쉘로, 우분투의 기본값입니다."},{"id":"t2-02","ty":"mc","lv":1,"game":true,"p":"우분투의 기본 쉘은?","o":["zsh","sh","csh","bash"],"a":3,"h":"쉘은 사용자의 명령을 해석해 커널에 전달하는 프로그램이며, zsh·sh처럼 여러 종류가 있습니다. 자료는 그중 가장 널리 쓰이는 하나를 우분투의 기본값으로 소개합니다. 쉘 스크립트 첫 줄 <code>#!/bin/...<\/code>에 적히는 이름이기도 합니다.","w":"bash는 가장 널리 쓰이는 쉘이자 우분투의 기본값입니다. zsh·sh 같은 다른 쉘도 있습니다.","an":"PART 1 · 12 쉘이란 (p.16)","src":"bash 가장 널리 쓰이는 기본 쉘로, 우분투의 기본값입니다. zsh / sh bash 외에도 다양한 목적의 쉘이 존재합니다."},{"id":"t2-03","ty":"mc","lv":2,"game":true,"p":"프롬프트 <code>user@ubuntu:~$<\/code> 에서 <code>~<\/code> 가 나타내는 것은?","o":["현재 경로(홈 폴더)","호스트명","사용자명","관리자 권한 표시"],"a":0,"h":"프롬프트는 '사용자명 @ 호스트명 : 현재경로 $' 순서로 정보를 보여 줍니다. 따라서 콜론 뒤, $ 앞의 기호는 경로 자리입니다. 경로 표기에서 <code>.<\/code>은 현재 폴더, <code>..<\/code>은 상위 폴더이고, 물결표는 특정 사용자 폴더를 줄여 쓴 것입니다.","w":"콜론 뒤는 현재 경로이고, ~ 는 홈 폴더를 뜻합니다. user는 사용자명, ubuntu는 호스트명입니다.","an":"PART 1 · 12 쉘이란 · 14 절대경로 vs 상대경로 (p.16·18)","src":"상대경로 — 현재 위치를 기준으로 경로를 표현합니다. — 예: ./practice, ../practice — . 은 현재 폴더, .. 은 상위 폴더, ~ 는 홈을 뜻합니다."},{"id":"t2-04","ty":"mc","lv":1,"game":true,"p":"시스템 설정 파일이 모이는 디렉터리는?","o":["/home","/var","/etc","/tmp"],"a":2,"h":"파일시스템 계층 구조에서 각 디렉터리는 역할이 정해져 있습니다. /home은 개인 파일, /var는 로그처럼 변하는 데이터, /usr는 설치된 프로그램, /tmp는 임시 파일 자리입니다. 남은 것 중 시스템의 '설정'이 모이는 곳을 찾아보세요.","w":"/etc에는 시스템 설정 파일이 모입니다. /home은 사용자 파일, /var는 로그처럼 계속 변하는 데이터, /tmp는 재부팅 시 사라지는 임시 파일입니다.","an":"PART 1 · 13 파일시스템 계층 구조 (p.17)","src":"/home 사용자 개인 파일이 저 장되는 공간 /etc 시스템 설정 파일이 모 이는 곳 /var 로그 등 계속 변하는 데 이터"},{"id":"t2-05","ty":"mc","lv":2,"game":true,"p":"다음 중 '절대경로'는?","o":["./practice","../practice","practice","/home/user/practice"],"a":3,"h":"절대경로는 / 로 시작해 루트 기준 전체 경로를 쓰므로, 지금 어디에 있든 항상 같은 곳을 가리킵니다. 상대경로는 현재 위치 기준이라 <code>./<\/code>, <code>../<\/code>처럼 시작합니다. 보기 가운데 루트(/)에서 출발하는 경로를 고르세요.","w":"/ 로 시작하는 경로가 절대경로로, 위치와 상관없이 항상 같은 곳을 가리킵니다. ./ 와 ../ 는 현재 위치 기준의 상대경로입니다.","an":"PART 1 · 14 절대경로 vs 상대경로 (p.18)","src":"절대경로 — / 로 시작하며 루트 기준 전체 경로를 씁니다. — 예: /home/user/practice — 위치와 상관없이 항상 같은 곳을 가리킵니다."},{"id":"t2-06","ty":"ox","lv":1,"game":true,"p":"대부분의 서버는 GUI 없이 CLI로만 운영된다.","a":true,"h":"자료는 GUI를 마우스로 직관적으로 조작하는 방식, CLI를 텍스트 명령으로 빠르고 정확하게 제어하는 방식으로 비교합니다. CLI는 스크립트로 작업을 자동화할 수 있어 서버 운영에 유리하다고 설명합니다. 서버용 배포판도 GUI 없이 운영되는 경우가 많습니다.","w":"맞습니다. CLI는 빠르고 정확하며 스크립트로 자동화할 수 있어, 대부분의 서버가 GUI 없이 CLI로 운영됩니다.","an":"PART 1 · 10 GUI vs CLI (p.14)","src":"CLI (명령줄 인터페이스) — 텍스트 명령으로 빠르고 정확하게 제어합니다. — 스크립트로 작업을 자동화할 수 있습니다. — 대부분의 서버는 GUI 없이 CLI로만 운영됩니다."},{"id":"t2-07","ty":"ox","lv":2,"game":true,"p":"평소 작업도 root 계정으로 직접 로그인해서 하는 것이 권장된다.","a":false,"h":"root는 시스템의 모든 권한을 가진 최고 관리자 계정이라, 잘못 쓰면 시스템 전체에 영향을 줍니다. 그래서 자료는 평소엔 제한된 권한의 일반 사용자로 작업하고, 필요한 작업에만 sudo로 관리자 권한을 빌리라고 안내합니다.","w":"틀렸습니다. 평소에는 제한된 권한의 일반 사용자로 작업하고, 필요한 작업만 sudo로 관리자 권한을 빌립니다.","an":"PART 1 · 15 사용자와 권한 (p.19)","src":"root — 시스템의 모든 권한을 가진 최고 관리자 계정입니다. — 잘못 사용하면 시스템 전체에 영향을 줄 수 있습니다. — 평소에는 직접 로그인해 사용하지 않습니다."},{"id":"t2-08","ty":"match","lv":1,"game":false,"p":"디렉터리와 용도를 연결하세요.","pairs":[["/home","사용자 개인 파일"],["/var","로그 등 계속 변하는 데이터"],["/usr","설치된 프로그램과 라이브러리"],["/tmp","재부팅 시 사라지는 임시 파일"],["/bin · /sbin","필수 실행 명령어 파일"]],"h":"디렉터리 이름은 대개 영어 약자입니다. var는 variable(변하는), tmp는 temporary(임시), usr는 프로그램과 라이브러리, bin은 binary(실행 파일)를 떠올리게 합니다. home은 말 그대로 사용자 각자의 공간입니다.","w":"리눅스는 모든 것이 루트(/) 아래 정해진 위치에 놓입니다. 용도를 알면 파일을 어디서 찾을지 바로 알 수 있습니다.","an":"PART 1 · 13 파일시스템 계층 구조 (p.17)","src":"/home 사용자 개인 파일이 저 장되는 공간 /etc 시스템 설정 파일이 모 이는 곳 /var 로그 등 계속 변하는 데 이터 /usr 설치된 프로그램과 라이 브러리 /bin·/sbin 필수 실행 명령어 파일 /tmp 재부팅 시 사라지는 임 시 파일"},{"id":"t2-09","ty":"order","lv":2,"game":false,"p":"리눅스 아키텍처를 위(사용자 쪽)에서 아래(장치 쪽) 순서로 정렬하세요.","steps":["응용 프로그램","쉘","커널","하드웨어"],"h":"사용자가 실행하는 프로그램이 맨 위에 있고, 그 명령을 해석해 넘겨주는 인터페이스가 다음 층입니다. 그 아래에서 운영체제의 핵심이 하드웨어 자원을 관리하고, 맨 아래에는 CPU·메모리·디스크 같은 실제 장치가 있습니다.","w":"응용 프로그램 → 쉘(명령 해석) → 커널(하드웨어 자원 관리) → 하드웨어(CPU·메모리·디스크) 순서입니다.","an":"PART 1 · 05 리눅스 아키텍처 (p.9)","src":"리눅스 아키텍처 응용 프로그램 사용자가 실행하는 프로그램과 서비스 쉘 (Shell) 사용자의 명령을 해석해 커널에 전달하는 인터페이스 커널 (Kernel) 하드웨어 자원을 관리하는 운영체제의 핵심 하드웨어 CPU, 메모리, 디스크 등 실제 물리 장치"},{"id":"t2-10","ty":"multi","lv":2,"game":true,"p":"sudo에 대한 설명으로 옳은 것을 <b>모두<\/b> 고르세요.","o":["'superuser do'의 줄임말","특정 작업만 관리자 권한 빌림","root 계정으로 아예 전환","평소엔 일반 사용자로 작업","모든 명령에 붙이면 안전"],"a":[0,1,3],"h":"sudo는 'superuser do'의 줄임말로, 평소 일반 사용자로 일하다가 특정 작업에만 관리자 권한을 빌려 쓰는 명령입니다. 반면 <code>su -<\/code>는 그 계정으로 아예 들어가 권한을 통째로 쓰는 방식이라고 자료는 구분합니다.","w":"sudo는 'superuser do'의 줄임말로, 일반 사용자로 일하다가 특정 작업에만 관리자 권한을 빌립니다. 계정 전환은 su - 이고, 모든 명령에 sudo를 붙이는 것은 위험합니다.","an":"PART 1 · 15 사용자와 권한 (p.19) · TOPIC 11 TIP (p.64)","src":"일반 사용자 · sudo — 평소에는 제한된 권한의 일반 사용자로 작업합니다. — sudo 명령으로 특정 작업만 관리자 권한을 빌려 씁니다. — sudo는 'superuser do'의 줄임말입니다."}]},{"id":"t3","title":"이동·파일 조작·내용 보기","ref":"TOPIC 01–03 (p.21–32)","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"현재 위치(절대 경로)를 출력하는 명령은?","o":["ls","pwd","cd","whoami"],"a":1,"h":"TOPIC 01의 TASK는 /etc로 이동한 뒤 지금 위치를 확인하라고 합니다. 위치를 출력하는 명령은 'print working directory'의 머리글자를 딴 이름이며, 결과는 절대 경로로 나옵니다.","w":"pwd는 현재 작업 디렉터리의 절대 경로를 출력합니다. ls는 목록, cd는 이동, whoami는 사용자 확인입니다.","an":"TOPIC 01 터미널 기본 이동 (p.22·24)","src":"pwd 현재 위치(절대 경로)를 출력합니다. ls -al 숨김 파일까지 자세히 목록으로 봅니다. cd ~/Documents Documents 폴더로 이동합니다. cd .. 상위 폴더로 이동합니다. cd - 바로 직전 위치로 되돌아갑니다."},{"id":"t3-02","ty":"mc","lv":1,"game":true,"p":"바로 직전 위치로 되돌아가는 명령은?","o":["cd ..","cd ~","cd -","cd /"],"a":2,"h":"<code>cd ..<\/code>는 상위 폴더로, <code>cd ~/Documents<\/code>는 지정한 폴더로 이동합니다. 자료의 TASK는 /etc로 갔다가 cd 뒤에 기호 하나를 붙여 '바로 전 위치'로 돌아오게 합니다. 상위 폴더 이동과 직전 위치 복귀를 구분해 보세요.","w":"cd - 는 바로 직전 위치로 돌아갑니다. cd .. 는 상위 폴더, cd ~ 는 홈, cd / 는 루트로 이동합니다.","an":"TOPIC 01 터미널 기본 이동 (p.22·24)","src":"홈 디렉터리에서 시작해 /etc로 이동한 뒤, pwd로 위치를 확인하고 다시 cd -로 돌아오세요."},{"id":"t3-03","ty":"mc","lv":2,"game":true,"p":"중첩 폴더 practice/logs를 한 번에 만드는 명령은?","o":["mkdir -p practice/logs","mkdir -r practice/logs","touch -p practice/logs","mkdir -a practice/logs"],"a":0,"h":"mkdir는 폴더를 만드는 명령인데, 상위 폴더가 아직 없으면 중첩 경로를 한 번에 만들지 못합니다. 'parents'(상위 폴더까지)를 뜻하는 옵션을 붙이면 중간 폴더까지 함께 생성합니다.","w":"mkdir -p 는 중간 폴더가 없어도 중첩 폴더까지 한 번에 만듭니다. touch는 빈 파일을 만드는 명령입니다.","an":"TOPIC 02 파일·디렉터리 (p.26)","src":"mkdir -p practice/logs 중첩 폴더까지 한 번에 생성합니다."},{"id":"t3-04","ty":"mc","lv":2,"game":true,"p":"파일 이름을 바꿀 때 쓰는 명령은?","o":["cp","rename -f","rm","mv"],"a":3,"h":"리눅스에는 '이름 바꾸기' 전용 명령이 따로 없습니다. 자료는 파일을 옮기는 명령 하나로 이동과 이름 변경을 모두 한다고 설명합니다. 실전 예제의 <code>backup/note.txt backup/archive.txt<\/code>처럼 같은 폴더 안에서 옮기면 이름만 바뀝니다.","w":"mv는 파일을 이동하며, 같은 폴더 안에서 이름을 바꾸는 것도 mv로 합니다.","an":"TOPIC 02 파일·디렉터리 (p.26–27)","src":"mv note.bak archive/ 이동하며, 이름 바꾸기도 mv로 합니다."},{"id":"t3-05","ty":"mc","lv":2,"game":true,"p":"nano 편집기의 저장 / 종료 키는?","o":["Ctrl+S / Ctrl+Q","Ctrl+O / Ctrl+X",":wq / :q!","Esc / Enter"],"a":1,"h":"nano는 화면 아래에 단축키가 표시되는 쉬운 편집기로, Ctrl 조합으로 저장과 종료를 합니다. 저장은 파일을 써 낸다는 뜻의 'Write Out', 종료는 'Exit'에 해당하는 키입니다. <code>:wq<\/code>는 vim에서 쓰는 방식이니 헷갈리지 마세요.","w":"nano는 Ctrl+O로 저장하고 Ctrl+X로 종료합니다. :wq는 vim에서 쓰는 저장 후 종료 명령입니다.","an":"TOPIC 03 파일 내용 보기 & 편집 (p.30–31)","src":"nano 파일.txt 저장은 Ctrl+O, 종료는 Ctrl+X."},{"id":"t3-06","ty":"ox","lv":1,"game":true,"p":"rm으로 지운 파일은 휴지통을 거치므로 쉽게 되돌릴 수 있다.","a":false,"h":"GUI의 파일 탐색기와 달리, 터미널의 삭제 명령은 휴지통을 거치지 않고 즉시 지웁니다. 그래서 자료는 <code>-r<\/code>로 폴더를 지울 때 경로를 다시 한 번 확인하라고 강조합니다.","w":"틀렸습니다. rm은 휴지통을 거치지 않고 즉시 삭제되므로, 특히 -r을 쓸 때는 경로를 다시 확인해야 합니다.","an":"TOPIC 02 직접 해보기 TIP (p.28)","src":"rm은 휴지통을 거치지 않고 즉시 삭제되니, -r을 쓸 때는 경로를 다시 한 번 확인하세요."},{"id":"t3-07","ty":"ox","lv":1,"game":true,"p":"코드 화면의 $ 기호도 명령어와 함께 그대로 입력해야 한다.","a":false,"h":"코드 화면의 $는 쉘이 입력을 기다리고 있다는 프롬프트 표시입니다. 자료의 '이 자료를 보는 법'은 $ 뒤의 명령어만 그대로 입력하라고 안내합니다.","w":"틀렸습니다. $ 는 입력을 기다리는 표시일 뿐이며, $ 뒤의 명령어만 입력합니다.","an":"HOW TO USE · 3 $ 프롬프트 (p.3)","src":"3 $ 프롬프트 코드 화면의 $ 는 입력을 기다리는 표시일 뿐, 실제로 입력하지 않습 니다. $ 뒤의 명령어만 그대로 입력하세요."},{"id":"t3-08","ty":"match","lv":1,"game":false,"p":"파일 내용 보기 명령과 설명을 연결하세요.","pairs":[["cat 파일.txt","전체 내용을 그대로 출력"],["less 파일.txt","스크롤하며 보기 (q로 종료)"],["head -n 5 파일.txt","앞 5줄만 보기"],["tail -n 5 파일.txt","뒤 5줄만 보기"]],"h":"cat은 파일 전체를 한 번에 출력하고, less는 화면을 넘기며 보다가 q로 끝냅니다. head는 '머리', tail은 '꼬리'라는 뜻이라 각각 파일의 앞과 뒤를 보여 주며, <code>-n 5<\/code>는 줄 수를 정합니다.","w":"짧은 파일은 cat, 긴 파일은 less, 앞부분만은 head, 뒷부분(로그 등)은 tail로 봅니다.","an":"TOPIC 03 핵심 명령어 (p.30)","src":"cat 파일.txt 전체 내용을 그대로 출력합니다. less 파일.txt 스크롤하며 봅니다 (q로 종료). head -n 5 파일.txt 앞 5줄만 봅니다. tail -n 5 파일.txt 뒤 5줄만 봅니다."},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"vim으로 파일을 고치고 저장·종료하는 순서를 맞추세요.","steps":["vim 파일.txt 로 열기","i 를 눌러 입력 모드","내용 수정","Esc 로 입력 모드 나오기",":wq 로 저장 후 종료"],"h":"vim은 모드가 나뉜 편집기라 열자마자 글자를 칠 수 없습니다. 먼저 i로 입력 모드에 들어가 내용을 고치고, Esc로 입력 모드를 빠져나와야 저장·종료 명령을 칠 수 있습니다.","w":"vim은 i(입력) → 수정 → Esc → :wq 순서입니다. 낯설다면 nano부터 익숙해지는 것을 추천합니다.","an":"TOPIC 03 핵심 명령어 · TIP (p.30·32)","src":"vim 파일.txt i(입력) → 수정 → Esc → :wq(저장종료)."},{"id":"t3-10","ty":"multi","lv":2,"game":false,"p":"TASK: practice 폴더를 만들고 파일을 넣은 뒤 practice_copy로 통째 복사하고 원본을 삭제할 때 쓰는 명령을 <b>모두<\/b> 고르세요.","o":["mkdir practice","touch practice/a.txt","cp -r practice practice_copy","rm -r practice","tar -xzvf practice"],"a":[0,1,2,3],"h":"TASK는 폴더 만들기 → 파일 넣기 → 폴더째 복사 → 원본 폴더 삭제 순서입니다. 폴더를 통째로 복사하거나 지울 때는 하위까지 처리하는 <code>-r<\/code> 옵션이 필요합니다. 압축 해제처럼 이 흐름에 없는 작업은 빼세요.","w":"mkdir로 폴더, touch로 파일을 만들고, 폴더를 통째로 복사·삭제할 때는 cp -r, rm -r처럼 -r 옵션을 씁니다.","an":"TOPIC 02 직접 해보기 (p.28)","src":"practice 폴더를 만들고 파일 3개를 넣은 뒤, practice_copy로 전체를 복사하고 원본은 삭제해보세요."}]},{"id":"t4","title":"시스템 정보·APT·파일 검색","ref":"TOPIC 04–06 (p.33–44)","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":true,"p":"우분투 버전을 확인하는 명령은?","o":["uname -a","lsb_release -a","df -h","uptime"],"a":1,"h":"<code>uname -a<\/code>는 커널 정보를 보여 줄 뿐, 배포판 버전은 알려 주지 않습니다. 배포판(Linux Standard Base) 정보를 모두(<code>-a<\/code>) 출력하는 명령을 써야 우분투 버전이 나옵니다.","w":"lsb_release -a 는 우분투 버전을, uname -a 는 커널 정보를 보여 줍니다.","an":"TOPIC 04 시스템 정보 확인 (p.34)","src":"lsb_release -a 우분투 버전을 확인합니다. uname -a 커널 정보를 확인합니다."},{"id":"t4-02","ty":"mc","lv":1,"game":true,"p":"df -h, free -h 의 -h 옵션이 뜻하는 것은?","o":["도움말 보기","숨김 파일 포함","사람이 읽기 좋은 단위","홈 폴더 기준"],"a":2,"h":"df와 free는 옵션 없이 쓰면 숫자가 바이트·킬로바이트 단위로 길게 나옵니다. <code>-h<\/code>는 영어 'human-readable'의 약자로, 사람이 읽기 편한 GB/MB 단위로 바꿔 보여 줍니다.","w":"-h 는 human-readable의 약자로, 용량을 GB·MB처럼 사람이 읽기 좋은 단위로 바꿔 줍니다.","an":"TOPIC 04 직접 해보기 TIP (p.36)","src":"-h 옵션은 'human-readable'의 약자로, GB/MB 단위를 사람이 읽기 좋게 바꿔줍니다."},{"id":"t4-03","ty":"mc","lv":2,"game":true,"p":"새 프로그램을 설치하기 전에 항상 먼저 실행하는 명령은?","o":["sudo apt update","sudo apt upgrade","sudo apt autoremove","apt search tree"],"a":0,"h":"APT는 저장소의 패키지 목록을 내려받아 두고, 그 목록을 보고 설치합니다. 목록이 오래되면 최신 패키지를 찾지 못하므로, 자료는 설치하기 전에 목록부터 최신화하라고 합니다.","w":"sudo apt update 로 패키지 목록을 최신화한 뒤 install로 설치합니다. upgrade는 설치된 패키지 전체 업그레이드입니다.","an":"TOPIC 05 패키지 관리 (p.38)","src":"sudo apt update 패키지 목록을 최신화합니다 (설치 전 항상 먼저)."},{"id":"t4-04","ty":"mc","lv":2,"game":true,"p":"폴더 안 파일들에서 'error' 문자열을 줄 번호와 함께 찾는 명령은?","o":["find . -name \"error\"","locate error","grep -i error","grep -rn \"error\" ./logs"],"a":3,"h":"파일 '내용'에서 문자열을 찾는 명령은 grep입니다. 하위 폴더까지 뒤지려면 recursive(r), 줄 번호를 함께 보려면 number(n) 옵션을 붙입니다. find는 이름으로 찾는 명령이라 내용 검색에는 맞지 않습니다.","w":"grep -rn 은 폴더 안 파일 내용을 재귀적으로 검색하고 줄 번호를 함께 보여 줍니다. find·locate는 이름으로 찾는 명령입니다.","an":"TOPIC 06 파일 검색 (p.42)","src":"grep -rn \"error\" ./logs 폴더 안 파일에서 문자열을 검색합니다(줄번호 포함)."},{"id":"t4-05","ty":"mc","lv":3,"game":true,"p":"locate가 find보다 훨씬 빠른 이유는?","o":["디스크를 실시간 탐색해서","미리 만든 색인을 써서","이름만 검색해서","관리자 권한으로 돌아서"],"a":1,"h":"find는 명령을 칠 때마다 디스크를 실시간으로 훑어 느립니다. locate는 <code>sudo updatedb<\/code>로 미리 만들어 둔 목록을 조회하므로 훨씬 빠릅니다.","w":"find는 실시간으로 디스크를 탐색해 느리고, locate는 미리 만든 색인(updatedb)을 써서 훨씬 빠릅니다.","an":"TOPIC 06 직접 해보기 TIP (p.44)","src":"find는 실시간 탐색이라 느리고, locate는 미리 만든 색인을 써서 훨씬 빠릅니다."},{"id":"t4-06","ty":"ox","lv":1,"game":true,"p":"sudo apt update 는 패키지를 설치하는 명령이다.","a":false,"h":"APT 명령은 역할이 나뉘어 있습니다. update는 패키지 목록을 최신화하고, 실제 설치는 install, 업그레이드는 upgrade, 삭제는 remove가 맡습니다.","w":"틀렸습니다. apt update는 패키지 목록을 최신화할 뿐이고, 설치는 항상 apt install로 합니다.","an":"TOPIC 05 직접 해보기 TIP (p.40)","src":"apt update는 '설치'가 아니라 '목록 최신화'입니다. 설치는 항상 install로 합니다."},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"locate로 검색하기 전 색인을 갱신하려면 sudo updatedb를 실행한다.","a":true,"h":"locate는 미리 만든 색인으로 검색하므로, 새로 생긴 파일은 색인을 다시 만들어야 찾을 수 있습니다. 실전 예제는 <code>locate syslog<\/code> 바로 앞에서 색인 갱신 명령을 관리자 권한으로 실행합니다.","w":"맞습니다. locate는 색인 기반이므로 sudo updatedb로 색인을 갱신한 뒤 검색합니다.","an":"TOPIC 06 실전 예제 (p.43)","src":"$ sudo updatedb locate용 색인 갱신 $ locate syslog 색인 기반 검색"},{"id":"t4-08","ty":"match","lv":1,"game":false,"p":"시스템 정보 명령과 확인 내용을 연결하세요.","pairs":[["uname -a","커널 정보"],["df -h","디스크 사용량"],["free -h","메모리 사용량"],["uptime","부팅 후 경과 시간과 부하"],["du -sh 폴더명","특정 폴더 용량 합계"]],"h":"명령 이름이 곧 힌트입니다. uname은 시스템(커널) 이름, df는 disk free, free는 남은 메모리, du는 disk usage, uptime은 켜져 있던 시간을 뜻합니다. du는 특정 폴더 하나의 용량 합계를 볼 때 씁니다.","w":"시스템 상태를 볼 때는 버전(lsb_release)·커널(uname)·디스크(df/du)·메모리(free)·가동 시간(uptime)을 차례로 확인합니다.","an":"TOPIC 04 핵심 명령어 (p.34)","src":"uname -a 커널 정보를 확인합니다. df -h 디스크 사용량을 보기 좋은 단위로 봅니다. du -sh 폴더명 특정 폴더의 용량 합계를 봅니다. free -h 메모리 사용량을 확인합니다. uptime 부팅 후 경과 시간과 부하를 봅니다."},{"id":"t4-09","ty":"order","lv":1,"game":false,"p":"TASK: tree 패키지를 설치해 쓰고 삭제하는 순서를 맞추세요.","steps":["sudo apt update","sudo apt install tree","tree ~/practice","sudo apt remove tree"],"h":"설치하기 전에는 언제나 목록을 최신화하고, 그다음 install로 설치합니다. 설치한 tree로 폴더 구조를 그려 본 뒤, 다 쓰면 remove로 지웁니다.","w":"설치 전에는 항상 apt update로 목록을 최신화하고, install로 설치한 뒤 사용하고, 다 쓰면 remove로 삭제합니다.","an":"TOPIC 05 실전 예제·직접 해보기 (p.39–40)","src":"$ sudo apt update 패키지 목록 최신화 $ sudo apt install tree tree 프로그램 설치 $ tree ~/practice 폴더 구조를 그림으로 보기 $ sudo apt remove tree 프로그램 삭제"},{"id":"t4-10","ty":"multi","lv":2,"game":false,"p":"파일을 '이름(위치)'으로 찾는 명령을 <b>모두<\/b> 고르세요.","o":["find . -name \"*.log\"","find / -type d -name nginx","locate nginx.conf","grep -rn \"error\" ./logs","grep -i \"warning\" app.log"],"a":[0,1,2],"h":"자료는 '이름으로 찾기'와 '내용으로 찾기'에 서로 다른 명령을 씁니다. find는 <code>-name<\/code>으로 이름을 지정해 실시간으로 찾고, locate는 색인에서 파일 이름을 찾습니다. grep은 파일 안의 문자열을 찾는 명령입니다.","w":"이름으로 찾기는 find·locate, 내용으로 찾기는 grep입니다. 자료는 두 가지가 서로 다른 명령어를 쓴다고 강조합니다.","an":"TOPIC 06 파일 검색 (p.41–42)","src":"find . -name \"*.log\" 현재 폴더부터 이름으로 검색합니다. find / -type d -name nginx 특정 이름의 디렉터리를 찾습니다. grep -rn \"error\" ./logs 폴더 안 파일에서 문자열을 검색합니다(줄번호 포함). grep -i \"warning\" app.log 대소문자 구분 없이 검색합니다. locate nginx.conf 색인 기반으로 초고속 검색합니다."}]},{"id":"t5","title":"권한·압축·파이프·프로세스","ref":"TOPIC 07–10 (p.45–60)","qs":[{"id":"t5-01","ty":"mc","lv":2,"game":true,"p":"<code>chmod 644 note.txt<\/code> 의 결과는?","o":["모두 읽기·쓰기","소유자 rw · 그룹 r · 기타 r","소유자만 실행 가능","소유자 전체 · 나머지 r-x"],"a":1,"h":"숫자 권한은 세 자리가 차례로 소유자·그룹·기타를 뜻하고, 각 자리는 읽기 4 + 쓰기 2 + 실행 1의 합입니다. 6 = 4 + 2, 4 = 4로 나눠 각 자리에 어떤 권한이 있는지 풀어 보세요.","w":"6(4+2)=rw, 4=r 이므로 소유자는 읽기·쓰기, 그룹과 기타는 읽기만 가능합니다. '소유자 전체 · 나머지 r-x'는 755입니다.","an":"TOPIC 07 권한과 소유권 (p.46)","src":"chmod 644 note.txt 숫자 표기: 소유자rw, 그룹r, 기타r."},{"id":"t5-02","ty":"mc","lv":1,"game":true,"p":"실행 권한이 없는 스크립트를 ./script.sh로 실행하면 나오는 메시지는?","o":["Permission denied","command not found","No such file","Segmentation fault"],"a":0,"h":"<code>touch<\/code>로 막 만든 스크립트에는 실행 권한이 없어서 <code>./script.sh<\/code>로 실행하면 거부됩니다. 자료의 TASK는 이때 나오는 영어 오류 메시지를 확인한 뒤 <code>chmod +x<\/code>로 권한을 주고 다시 실행해 보라고 합니다.","w":"실행 권한이 없으면 'Permission denied'가 뜹니다. chmod +x 로 실행 권한을 추가하면 정상 실행됩니다.","an":"TOPIC 07 실전 예제·직접 해보기 (p.47–48)","src":"빈 스크립트 파일을 만들어 실행해보고 'Permission denied'가 뜨는지 확인한 뒤, chmod +x 후 다시 실행 해보세요."},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"tar 옵션 c와 x의 뜻으로 알맞은 것은?","o":["c 해제 · x 생성","c 압축 · x 목록","c 복사 · x 삭제","c 생성 · x 해제"],"a":3,"h":"tar 옵션은 영어 단어의 머리글자입니다. <code>-czvf<\/code>에서 c는 create, <code>-xzvf<\/code>에서 x는 extract에서 왔습니다. 자료는 둘을 반대로 외우기 쉬우니 주의하라고 합니다.","w":"c는 압축 파일 생성(create), x는 해제(extract)입니다. 반대로 외우기 쉬우니 주의하라고 자료가 강조합니다.","an":"TOPIC 08 압축 & 아카이브 TIP (p.52)","src":"c는 압축(create), x는 해제(extract) — 반대로 외우기 쉬우니 주의하세요."},{"id":"t5-04","ty":"mc","lv":2,"game":true,"p":"압축을 풀지 않고 backup.tar.gz의 내용물만 목록으로 보는 명령은?","o":["tar -czvf","tar -xzvf","tar -tvf","unzip -l"],"a":2,"h":"tar는 옵션 글자로 동작을 정합니다. c는 생성, x는 해제, 그리고 t는 내용물 목록(list)만 보여 줍니다. v는 진행 표시, f는 대상 파일 이름을 지정합니다.","w":"tar -tvf 는 풀지 않고 내용물 목록만 보여 줍니다. -czvf는 압축, -xzvf는 해제입니다.","an":"TOPIC 08 핵심 명령어 (p.50)","src":"tar -tvf backup.tar.gz 풀지 않고 내용물만 목록으로 봅니다."},{"id":"t5-05","ty":"mc","lv":3,"game":true,"p":"kill -9 를 쓰는 시점으로 알맞은 것은?","o":["처음부터 항상","kill로 정상 종료가 안 될 때","백그라운드 실행 직후","PID를 모를 때"],"a":1,"h":"<code>kill PID<\/code>는 프로세스에 종료 신호를 보내 스스로 정리하고 끝나도록 요청합니다. <code>-9<\/code>는 정리할 기회 없이 강제로 끝내므로, 자료는 정상 종료를 먼저 시도하고 응답이 없을 때만 쓰라고 합니다.","w":"먼저 kill(신호)로 정상 종료를 요청하고, 응답이 없을 때만 kill -9로 강제 종료합니다.","an":"TOPIC 10 프로세스 관리 TIP (p.59–60)","src":"kill -9는 최후의 수단입니다. 먼저 kill(신호)로 정상 종료를 시도하세요."},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"> 는 이어붙이기, >> 는 덮어쓰기이다.","a":false,"h":"꺾쇠 하나는 파일을 새로 써서 기존 내용을 지우고, 꺾쇠 둘은 기존 내용 끝에 '더' 붙입니다. 자료는 이 순서를 헷갈리면 기존 내용을 잃을 수 있다고 경고합니다.","w":"틀렸습니다. > 는 덮어쓰기, >> 는 이어붙이기입니다. 헷갈리면 기존 내용을 잃을 수 있습니다.","an":"TOPIC 09 파이프 & 리다이렉션 TIP (p.56)","src":"> 는 덮어쓰기, >> 는 이어붙이기입니다. 순서를 헷갈리면 기존 내용을 잃을 수 있으니 주의하세요."},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"nohup ./server.sh & 로 실행하면 터미널을 닫아도 계속 실행된다.","a":true,"h":"nohup은 'no hang up'의 줄임말로, 터미널이 끊길 때 오는 종료 신호를 무시하게 합니다. 끝의 &는 백그라운드 실행입니다. 자료는 이 조합을 터미널과의 연결이 끊긴 뒤의 동작으로 설명합니다.","w":"맞습니다. nohup과 &를 함께 쓰면 백그라운드에서 실행되고, 터미널을 닫아도 계속 실행됩니다.","an":"TOPIC 10 핵심 명령어 (p.58)","src":"nohup ./server.sh & 터미널을 닫아도 계속 실행되게 합니다."},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"파이프·리다이렉션 기호와 역할을 연결하세요.","pairs":[["|","앞 명령 출력을 다음 명령 입력으로"],[">","덮어쓰기로 파일에 저장"],[">>","이어붙여 파일에 저장"],["<","파일을 명령의 입력으로 사용"],["tee","화면 출력과 파일 저장을 동시에"]],"h":"꺾쇠가 가리키는 방향이 데이터가 흐르는 방향입니다. 파일 쪽을 가리키면 저장(하나는 덮어쓰기, 둘은 이어붙이기), 명령 쪽을 가리키면 파일을 입력으로 씁니다. 세로 막대는 앞 명령의 출력을 뒤 명령으로 넘기고, tee는 T자 배관처럼 출력을 두 갈래로 나눕니다.","w":"파이프(|)는 명령을 잇고, 리다이렉션(> >> <)은 파일과 입출력을 연결합니다. tee는 보면서 저장할 때 씁니다.","an":"TOPIC 09 핵심 명령어 (p.54)","src":"ls -al | grep \".txt\" ls 결과를 grep으로 필터링합니다. echo \"hello\" > file.txt 덮어쓰기로 저장합니다. echo \"world\" >> file.txt 이어붙여서 저장합니다."},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"TASK: 백그라운드 프로세스를 띄우고 종료하는 순서를 맞추세요.","steps":["sleep 300 & 로 실행","ps aux | grep sleep 으로 PID 확인","kill PID 로 종료 요청","응답 없으면 kill -9 PID"],"h":"먼저 &로 프로세스를 백그라운드에 띄우고, ps aux 결과를 grep으로 걸러 PID를 찾습니다. 그다음 kill로 정상 종료를 요청하고, 응답이 없을 때만 강제 종료합니다.","w":"프로세스를 띄우고 ps aux | grep 으로 PID를 찾은 뒤 kill로 종료합니다. kill -9는 응답이 없을 때만 씁니다.","an":"TOPIC 10 실전 예제·직접 해보기 (p.59–60)","src":"$ sleep 300 & 프로세스를 백그라운드로 실행 $ ps aux | grep sleep PID 확인 $ kill 8421 찾은 PID로 종료 요청 $ kill -9 8421 응답 없을 때 강제 종료"},{"id":"t5-10","ty":"multi","lv":3,"game":true,"p":"권한 문자열 <code>-rwxr-xr--<\/code> 에 대해 옳은 것을 <b>모두<\/b> 고르세요.","o":["소유자: 읽기·쓰기·실행","그룹: 읽기·실행","기타: 읽기만","그룹: 쓰기 가능","숫자로 754"],"a":[0,1,2,4],"h":"<code>ls -l<\/code>의 맨 앞 1글자는 파일 종류이고, 이어지는 9글자를 3글자씩 소유자·그룹·기타로 나눕니다. r·w·x는 읽기·쓰기·실행이며 숫자로는 r=4, w=2, x=1을 더합니다. rwx, r-x, r-- 각각의 합을 구해 보세요.","w":"rwx(7)·r-x(5)·r--(4)이므로 소유자는 전체, 그룹은 읽기·실행, 기타는 읽기만 가능하며 숫자로 754입니다. 그룹에는 w가 없습니다.","an":"TOPIC 07 권한과 소유권 (p.45–48)","src":"권한 앞자리 r,w,x는 각각 읽기·쓰기·실행을 뜻합니다."}]},{"id":"t6","title":"사용자·네트워크·로그·스크립트","ref":"TOPIC 11–14 · PART 3 (p.61–79)","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"현재 로그인한 사용자를 확인하는 명령은?","o":["id","whoami","passwd","adduser"],"a":1,"h":"실전 예제는 다른 계정으로 전환한 직후, 전환이 됐는지 확인하는 명령을 칩니다. 이 명령은 영어 문장 'who am I?'를 붙여 쓴 이름이고, 지금 로그인한 사용자를 알려 줍니다. id는 사용자/그룹 ID를 보여 주는 다른 명령입니다.","w":"whoami는 현재 사용자를 보여 줍니다. id는 사용자·그룹 ID, passwd는 비밀번호 변경, adduser는 사용자 추가입니다.","an":"TOPIC 11 사용자 & 그룹 관리 (p.62)","src":"whoami 현재 로그인한 사용자를 확인합니다. id 사용자/그룹 ID를 확인합니다."},{"id":"t6-02","ty":"mc","lv":2,"game":true,"p":"sudo와 su - 의 차이로 옳은 것은?","o":["둘은 같은 기능이다","su -는 명령 하나만 빌린다","sudo는 계정으로 전환한다","sudo는 명령 하나만 빌린다"],"a":3,"h":"둘 다 관리자 권한과 관련 있지만 범위가 다릅니다. 하나는 명령어 하나를 실행하는 동안만 권한을 빌리고, 다른 하나는 그 계정으로 아예 들어가 exit 할 때까지 그 계정으로 일합니다.","w":"sudo는 명령 하나에만 관리자 권한을 빌리고, su - 는 그 계정으로 아예 전환합니다. 전환한 계정에서는 exit으로 돌아옵니다.","an":"TOPIC 11 직접 해보기 TIP (p.64)","src":"sudo가 '이 명령어 하나만' 관리자 권한을 빌리는 것이라면, su -는 '그 계정으로 아예 들어가는' 방식입니다."},{"id":"t6-03","ty":"mc","lv":1,"game":true,"p":"응답을 4번만 확인해 인터넷 연결을 테스트하는 명령은?","o":["ping -c 4 8.8.8.8","curl -I 8.8.8.8","ip a","ss -tulpn"],"a":0,"h":"ping은 대상에 신호를 보내고 응답이 오는지 확인해 연결 상태를 진단합니다. 횟수를 정하지 않으면 Ctrl+C로 멈출 때까지 계속 보냅니다. 옵션 <code>-c<\/code>는 count(횟수)로, 뒤에 붙인 숫자만큼만 보냅니다.","w":"ping -c 4 는 응답을 4번만 확인합니다. 응답 없이 멈추면 Ctrl+C로 중단할 수 있습니다.","an":"TOPIC 12 네트워크 기초 (p.66–68)","src":"ping -c 4 example.com 4번만 응답을 확인해 연결을 테스트합니다."},{"id":"t6-04","ty":"mc","lv":2,"game":true,"p":"특정 서비스(ssh)의 로그만 골라 보는 명령은?","o":["dmesg | less","tail -f /var/log/syslog","journalctl -u ssh","journalctl -xe"],"a":2,"h":"journalctl은 systemd 기반 로그를 보는 명령입니다. <code>-xe<\/code>는 최근 로그를 에러 강조와 함께, <code>-f<\/code>는 실시간으로 보여 줍니다. 특정 서비스(unit) 하나만 고르려면 unit의 머리글자 옵션 뒤에 서비스 이름을 적습니다.","w":"journalctl -u ssh 는 ssh 서비스 로그만 보여 줍니다. -xe는 최근 로그 전체, dmesg는 커널 메시지입니다.","an":"TOPIC 13 로그 확인 (p.70)","src":"journalctl -xe 최근 시스템 로그를 에러 강조와 함께 봅니다. journalctl -u ssh 특정 서비스(ssh)의 로그만 봅니다. journalctl -f 실시간으로 로그를 따라갑니다."},{"id":"t6-05","ty":"mc","lv":1,"game":true,"p":"스크립트 첫 줄 <code>#!/bin/bash<\/code> 를 부르는 이름은?","o":["주석","셔뱅(shebang)","프롬프트","파이프"],"a":1,"h":"스크립트 첫 줄의 <code>#!<\/code>는 이 파일을 어떤 프로그램으로 실행할지 알려 줍니다. 자료는 TOPIC 14 TIP에서 #(sharp)와 !(bang)을 합친 별칭으로 이 줄을 부릅니다.","w":"#!/bin/bash 는 이 파일이 bash 스크립트임을 알리는 셔뱅(shebang)입니다.","an":"TOPIC 14 쉘 스크립트 맛보기 (p.74·76)","src":"스크립트 첫 줄의 #!/bin/bash를 셔뱅(shebang)이라고 부릅니다."},{"id":"t6-06","ty":"ox","lv":1,"game":true,"p":"su - 뒤에 계정명을 생략하면 root로 전환된다.","a":true,"h":"<code>su - 계정명<\/code>은 지정한 계정으로 전환하고, exit으로 원래 계정에 돌아옵니다. 자료의 명령표는 계정명 없이 <code>su -<\/code>만 쳤을 때 관리자 권한을 통째로 쓰는 계정으로 전환된다고 설명합니다.","w":"맞습니다. su - 만 입력하면 root로 전환되며, root 비밀번호가 필요합니다. exit으로 원래 계정에 돌아옵니다.","an":"TOPIC 11 직접 해보기 TIP (p.64)","src":"su - 뒤에 계정명을 생략하면 root로 전환됩니다. 전환한 계정에서 나가려면 언제든 exit을 입력하세요."},{"id":"t6-07","ty":"ox","lv":2,"game":true,"p":"journalctl은 전통적인 파일 기반 로그이고, /var/log는 systemd 기반 로그이다.","a":false,"h":"journalctl의 'journal'은 systemd가 모아 두는 로그 저장소를 뜻합니다. /var/log 아래의 syslog 같은 파일은 예전부터 써 온 텍스트 파일 로그로, <code>tail -f<\/code>로 볼 수 있습니다. 문장 속 두 대상의 설명이 서로 맞게 짝지어졌는지 확인하세요.","w":"틀렸습니다. 반대입니다. journalctl은 systemd 기반 로그, /var/log는 전통적인 파일 기반 로그입니다.","an":"TOPIC 13 직접 해보기 TIP (p.72)","src":"journalctl은 systemd 기반 로그, /var/log는 전통적인 파일 기반 로그입니다. 둘 다 알아두면 좋습니다."},{"id":"t6-08","ty":"match","lv":2,"game":false,"p":"네트워크 명령과 용도를 연결하세요.","pairs":[["ip a","인터페이스와 IP 주소 확인"],["curl -I URL","응답 헤더만 빠르게 확인"],["wget URL","파일 다운로드"],["ss -tulpn","열린 포트와 프로세스 확인"],["ssh user@IP","원격 서버 접속"]],"h":"ip a는 address(주소)를 보는 명령이고, curl의 <code>-I<\/code>는 본문 없이 헤더만 받아 옵니다. wget은 웹(web)에서 파일을 get(내려받기)하고, ss는 socket statistics로 열린 포트를 보여 줍니다. ssh는 Secure Shell로 원격 서버에 접속합니다.","w":"내 IP 확인(ip a) → 연결 확인(ping) → 응답 확인(curl) → 다운로드(wget) → 포트(ss) → 원격 접속(ssh)이 네트워크 진단의 기본기입니다.","an":"TOPIC 12 핵심 명령어 (p.66)","src":"ip a 네트워크 인터페이스와 IP 주소를 확인합니다. ping -c 4 example.com 4번만 응답을 확인해 연결을 테스트합니다. curl -I https://example.com 응답 헤더만 빠르게 확인합니다. wget https://example.com/file.zip 파일을 다운로드합니다. ss -tulpn 열려 있는 포트와 프로세스를 확인합니다. ssh user@192.168.0.10 원격 서버에 접속합니다."},{"id":"t6-09","ty":"order","lv":3,"game":false,"p":"backup.sh 스크립트가 실행되는 흐름을 순서대로 정렬하세요.","steps":["#!/bin/bash 로 bash 스크립트 선언","TARGET 변수에 백업 경로 저장","DATE 변수에 오늘 날짜 저장","if [ -d \"$TARGET\" ] 로 폴더 확인","tar로 압축하고 '백업 완료' 출력"],"h":"쉘 스크립트는 위에서 아래로 실행됩니다. 맨 위 셔뱅으로 bash 스크립트임을 알리고, 변수 두 개(경로·날짜)를 차례로 저장한 뒤, if 조건문으로 폴더가 있는지 확인합니다. 조건이 참이면 압축하고 결과를 출력합니다.","w":"셔뱅으로 시작해 변수(TARGET, DATE)를 준비하고, 폴더가 있으면 tar로 압축합니다. 실행 전에는 chmod +x로 권한을 줍니다.","an":"TOPIC 14 실전 예제 backup.sh (p.75)","src":"#!/bin/bash # 사용법: ./backup.sh TARGET=~/practice DATE=$(date +%Y%m%d) if [ -d \"$TARGET\" ]; then tar -czf \"backup_$DATE.tar.gz\" \"$TARGET\" echo \"백업 완료: backup_$DATE.tar.gz\""},{"id":"t6-10","ty":"multi","lv":2,"game":true,"p":"명령어 사용법·옵션을 확인하는 방법을 <b>모두<\/b> 고르세요.","o":["man <명령어>","<명령어> --help","tldr <명령어>","apt-cache search <키워드>","sudo apt autoremove"],"a":[0,1,2],"h":"자료의 '참고 자료' 페이지는 공식 매뉴얼 전체를 보는 방법, 옵션 요약을 빠르게 보는 방법, 예제 중심 커뮤니티 문서를 보는 방법을 소개합니다. 같은 페이지의 <code>apt-cache search<\/code>는 명령 사용법이 아니라 설치할 패키지를 검색하는 명령입니다.","w":"man은 공식 매뉴얼, --help는 옵션 요약, tldr은 예제 중심 문서입니다. apt-cache search는 설치 가능한 패키지 검색, autoremove는 불필요한 패키지 정리입니다.","an":"PART 3 · 참고 자료 & 더 배우기 (p.79)","src":"man <명령어> 해당 명령어의 공식 매뉴얼 전체를 확인합니다. 가장 정확한 1차 자료입니다. <명령어> --help 각 명령어가 지원하는 옵션을 빠르게 요약해서 보여줍니다. apt-cache search <키워드> 키워드와 관련된 설치 가능한 패키지를 검색합니다."}]}]};

const TYPES={mc:['객관식','--ty-mc'],multi:['복수 선택','--ty-multi'],ox:['O / X','--ty-ox'],match:['짝 맞추기','--ty-match'],order:['순서 맞추기','--ty-order'],num:['계산','--ty-num']};
