const BANK={"id":"git-basics","code":"GIT","title":"Git · GitHub 입문 · 8교시 실습","subtitle":"커밋과 브랜치 · 충돌과 되돌리기 · GitHub 협업","course":"02-dev-basics / git","source":"02-dev-basics/git/Git_실습교재.md","salt":"git-basics","version":1,"updated":"2026-10-15","tabs":[{"id":"t1","title":"Git 소개와 환경 구축","ref":"1교시","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"Git을 가장 정확하게 설명한 것은?","o":["분산 버전 관리 시스템","클라우드 저장소 서비스","코드 편집기","운영체제 명령어 모음"],"a":0,"h":"교재 1.1은 Git을 영어 이름 Distributed Version Control System으로 소개합니다. 저장소가 한 서버에만 있지 않고 각자의 PC에 나뉘어 있으며, 파일의 변경 이력을 관리한다는 두 특징을 함께 담은 보기를 고르면 됩니다.","w":"Git은 분산 버전 관리 시스템(DVCS)입니다. 클라우드 호스팅 서비스는 GitHub, 코드 편집기는 VS Code입니다.","an":"1교시 1.1 Git이란?","src":"## 1.1 Git이란?\n\n**Git**은 **분산 버전 관리 시스템(Distributed Version Control System)** 입니다."},{"id":"t1-02","ty":"mc","lv":1,"game":true,"p":"'Git vs GitHub' 비유에서 Git이 카메라라면 GitHub는?","o":["필름","인스타그램","앨범 프린터","삼각대"],"a":1,"h":"Git vs GitHub 표에서 Git은 내 PC에 설치하는 버전 관리 도구, GitHub는 클라우드에 있는 저장소 호스팅 서비스입니다. 카메라로 찍은 사진을 올려서 다른 사람과 공유하는 웹 서비스를 떠올리면 GitHub에 대응하는 비유가 나옵니다.","w":"Git은 내 PC의 도구(카메라), GitHub는 Git 저장소를 웹에 올려 공유하는 호스팅 서비스(인스타그램)입니다.","an":"1교시 1.1 Git vs GitHub 표","src":"### Git vs GitHub\n| 구분 | Git | GitHub |\n|:---:|:---|:---|\n| 정체 | 버전 관리 **도구** (소프트웨어) | Git 저장소 **호스팅 서비스** (웹) |\n| 위치 | 내 PC | 클라우드(웹) |\n| 비유 | 카메라 | 인스타그램 |"},{"id":"t1-03","ty":"mc","lv":2,"game":false,"p":"기본 브랜치 이름을 <code>main<\/code>으로 정하는 초기 설정 명령은?","o":["git branch -M main","git init main","git config --global init.defaultBranch main","git switch main"],"a":2,"h":"실습 1-3에서는 사용자 이름·이메일과 함께 <code>git config --global<\/code>로 초기 설정을 합니다. 새 저장소의 기본 브랜치 이름은 init 단계의 설정 항목(defaultBranch)으로 지정하므로, init 관련 키를 main 값과 함께 쓰는 명령을 찾으세요.","w":"<code>git config --global init.defaultBranch main<\/code>은 앞으로 만드는 저장소의 기본 브랜치명을 main으로 정합니다. <code>git branch -M main<\/code>은 6교시에서 현재 브랜치 이름을 바꿀 때 씁니다.","an":"1교시 실습 1-3 사용자 정보 설정","src":"# 기본 브랜치명을 main으로 설정\ngit config --global init.defaultBranch main\n# 설정 확인\ngit config --list\n```\n\n> 💡 **TIP**: `--global` 옵션은 PC 전체에 적용된다는 의미입니다. 특정 프로젝트만 다른 설정을 쓰려면 옵션 없이 사용합니다."},{"id":"t1-04","ty":"mc","lv":1,"game":true,"p":"Git이 제대로 설치됐는지 확인하는 명령은?","o":["git status","git init","git log","git --version"],"a":3,"h":"설치가 끝나면 Git Bash에서 Git의 버전 번호를 출력해 보는 것으로 확인합니다. 출력이 <code>git version 2.xx.x.windows.x<\/code> 형태로 나오면 설치에 성공한 것이니, 버전을 묻는 옵션을 붙인 명령을 고르세요.","w":"<code>git --version<\/code>으로 설치된 Git의 버전을 확인합니다.","an":"1교시 실습 1-1 설치 확인","src":"### [실습 1-1] Git for Windows 설치\n\n1. **공식 사이트 접속**\n - https://git-scm.com/download/win 접속\n - \"64-bit Git for Windows Setup\" 다운로드\n\n2. **설치 시 주요 옵션** (대부분 기본값 유지, 다음 항목만 확인)\n - **Default editor**: `Use Visual Studio Code as Git's default editor` 선택\n - **Adjusting your PATH environment**: `Git from the command line and also from 3rd-party software` 선택 (기본값)"},{"id":"t1-05","ty":"mc","lv":2,"game":true,"p":"<code>git config<\/code>의 <code>--global<\/code> 옵션은 무슨 뜻인가요?","o":["현재 폴더에만 적용","PC 전체에 적용","원격 저장소에 적용","이번 한 번만 적용"],"a":1,"h":"교재 1.3의 TIP은 --global 옵션이 붙은 설정은 내 PC의 모든 저장소에 공통으로 적용된다고 설명합니다. 특정 프로젝트에만 다른 이름·이메일을 쓰고 싶을 때는 이 옵션을 빼고 그 저장소 안에서 설정합니다.","w":"--global은 PC 전체(모든 저장소)에 적용됩니다. 특정 프로젝트만 다르게 하려면 옵션 없이 그 저장소에서 설정합니다.","an":"1교시 1.3 TIP","src":"# 설정 확인\ngit config --list\n```\n\n> 💡 **TIP**: `--global` 옵션은 PC 전체에 적용된다는 의미입니다. 특정 프로젝트만 다른 설정을 쓰려면 옵션 없이 사용합니다."},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"Git Bash는 리눅스 명령어를 사용하며 Windows 명령 프롬프트와 다르다.","a":true,"h":"실습 1-4는 Git Bash가 ls, pwd, touch처럼 리눅스(유닉스) 계열 명령어를 쓴다고 안내합니다. Windows 명령 프롬프트의 dir 같은 명령 체계와는 다르다는 점을 확인하고 판단하세요.","w":"맞습니다. Git Bash에서는 pwd, ls, cd, mkdir, touch 같은 리눅스 명령어를 씁니다.","an":"1교시 실습 1-4","src":"### [실습 1-4] Git Bash 기본 명령어 익히기\n\nGit Bash는 리눅스 명령어를 사용합니다. Windows 명령 프롬프트와 다릅니다.\n\n```bash\n# 현재 위치 확인\npwd\n# 현재 디렉토리 목록\nls\nls -al # 숨김파일 포함, 상세 정보\n# 디렉토리 이동\ncd Desktop\ncd .. # 상위 디렉토리로\n# 디렉토리 생성\nmkdir git-practice\n# 파일 생성\ntouch hello.txt\n# 화면 지우기\nclear # 또는 Ctrl + L\n```"},{"id":"t1-07","ty":"ox","lv":2,"game":true,"p":"Git은 웹 서비스이고, GitHub는 내 PC에 설치하는 도구이다.","a":false,"h":"Git vs GitHub 표의 '정체'와 '위치' 행을 보면 Git은 소프트웨어 도구로 내 PC에, GitHub는 호스팅 서비스로 클라우드(웹)에 있습니다. 문장이 두 대상의 위치를 바르게 짝지었는지 확인하세요.","w":"반대입니다. Git은 내 PC에 설치하는 버전 관리 도구, GitHub는 클라우드(웹)의 저장소 호스팅 서비스입니다.","an":"1교시 1.1 Git vs GitHub 표","src":"### Git vs GitHub\n| 구분 | Git | GitHub |\n|:---:|:---|:---|\n| 정체 | 버전 관리 **도구** (소프트웨어) | Git 저장소 **호스팅 서비스** (웹) |\n| 위치 | 내 PC | 클라우드(웹) |\n| 비유 | 카메라 | 인스타그램 |"},{"id":"t1-08","ty":"match","lv":1,"game":false,"p":"Git Bash 명령어와 하는 일을 연결하세요.","pairs":[["pwd","현재 위치 확인"],["ls -al","숨김 파일 포함 상세 목록"],["cd ..","상위 디렉토리로 이동"],["mkdir","디렉토리 생성"],["touch","빈 파일 생성"]],"h":"pwd는 print working directory의 줄임말로 지금 있는 폴더 경로를 보여 줍니다. ls에 -al을 붙이면 숨김 파일까지 자세히 보이고, cd ..은 한 단계 위로, mkdir은 make directory, touch는 내용 없는 파일을 만듭니다.","w":"pwd는 위치, ls -al은 숨김 파일까지 목록, cd ..는 상위 폴더, mkdir은 폴더 생성, touch는 파일 생성입니다.","an":"1교시 실습 1-4 Git Bash 기본 명령어","src":"# 현재 위치 확인\npwd\n# 현재 디렉토리 목록\nls\nls -al # 숨김파일 포함, 상세 정보\n# 디렉토리 이동\ncd Desktop\ncd .. # 상위 디렉토리로\n# 디렉토리 생성\nmkdir git-practice\n# 파일 생성\ntouch hello.txt\n# 화면 지우기\nclear # 또는 Ctrl + L\n```"},{"id":"t1-09","ty":"order","lv":1,"game":false,"p":"미니 과제 1 '실습 폴더 만들기'의 명령 순서를 맞추세요.","steps":["cd ~","cd Desktop","mkdir git-study","cd git-study","pwd"],"h":"미니 과제 1은 먼저 홈 디렉토리로 간 다음 바탕화면으로 이동합니다. 그곳에 실습 폴더를 만들고 그 폴더 안으로 들어간 뒤, 마지막에 현재 위치를 출력해 제대로 왔는지 확인합니다.","w":"홈 디렉토리에서 Desktop으로 이동해 git-study 폴더를 만들고, 들어가서 pwd로 위치를 확인합니다.","an":"1교시 미니 과제 1","src":"### [미니 과제 1] 실습 폴더 만들기\n\n```bash\ncd ~\ncd Desktop\nmkdir git-study\ncd git-study\npwd\n```"},{"id":"t1-10","ty":"multi","lv":1,"game":true,"p":"교재가 말하는 Git의 핵심 가치를 <b>모두<\/b> 고르세요.","o":["이력 관리","협업","백업","브랜치","코드 자동 작성"],"a":[0,1,2,3],"h":"교재가 든 Git의 핵심 가치는 네 가지입니다. 누가·언제·무엇을 바꿨는지 추적하는 것, 여러 사람이 동시에 작업하는 것, 분산 저장으로 안전성을 확보하는 것, 병렬로 다양한 시도를 하는 것에 해당하는 보기를 고르세요.","w":"핵심 가치는 이력 관리·협업·백업·브랜치 네 가지입니다. 코드를 자동으로 써 주는 기능은 Git에 없습니다.","an":"1교시 1.1 Git의 핵심 가치","src":"### Git의 핵심 가치\n- **이력 관리**: 누가, 언제, 무엇을, 왜 변경했는지 추적\n- **협업**: 여러 사람이 동시에 작업 가능\n- **백업**: 분산 저장으로 안전성 확보\n- **브랜치**: 병렬로 다양한 시도 가능"}]},{"id":"t2","title":"로컬 저장소와 첫 커밋","ref":"2교시","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"Git의 3단계 영역 중 '커밋할 파일을 모아두는 대기실'은?","o":["Working Directory","Staging Area","Repository","Remote"],"a":1,"h":"Git은 작업 영역(Working Directory) → 대기 영역 → 저장소(Repository)의 3단계로 파일을 관리합니다. <code>git add<\/code>를 하면 커밋에 넣을 파일이 가운데 영역으로 옮겨지고, <code>git commit<\/code>을 해야 저장소에 기록됩니다.","w":"Staging Area(Index)는 커밋 후보를 모아두는 대기실입니다. 실제 작업 공간은 Working Directory, 커밋된 버전은 Repository(.git)에 있습니다.","an":"2교시 2.1 Git의 3단계 영역","src":"## 2.1 Git의 3단계 영역\n\n```\n┌──────────────────┐ git add ┌──────────────────┐ git commit ┌──────────────────┐\n│ Working Directory │ ───────────→ │ Staging Area │ ─────────────→ │ Repository │\n│ (작업 영역) │ │ (스테이징 영역) │ │ (저장소) │\n│ 실제 파일 작업 │ │ 커밋 후보 모음 │ │ 버전 저장소 │"},{"id":"t2-02","ty":"mc","lv":1,"game":true,"p":"현재 폴더를 Git 저장소로 만드는 명령은?","o":["git start","git create","git init","git new"],"a":2,"h":"실습 2-1에서는 바탕화면에 작업 폴더를 만든 뒤 그 안에서 Git 저장소를 초기화합니다. 명령 이름은 initialize(초기화)의 줄임말이며, 실행하면 'Initialized empty Git repository'라는 결과가 출력됩니다.","w":"<code>git init<\/code>으로 저장소를 초기화하면 'Initialized empty Git repository'가 출력됩니다.","an":"2교시 실습 2-1","src":"# Git 저장소 초기화\ngit init\n# 결과: Initialized empty Git repository in ...\n# 숨김 폴더 .git이 생성됨\nls -al\n```\n\n> 💡 `.git` 폴더가 모든 Git 정보를 담고 있습니다. 이 폴더가 있어야 Git 저장소!"},{"id":"t2-03","ty":"mc","lv":2,"game":true,"p":"<code>git init<\/code> 후 생기며 모든 Git 정보를 담는 숨김 폴더는?","o":[".github",".gitignore",".config",".git"],"a":3,"h":"<code>git init<\/code>을 하면 이름이 점(.)으로 시작하는 숨김 폴더가 생기고, 이 폴더가 모든 Git 정보를 담습니다. 이 폴더가 있어야 Git 저장소이며, <code>ls -al<\/code>로 숨김 항목까지 봐야 나타납니다.","w":".git 폴더가 모든 Git 정보를 담고 있으며, 이 폴더가 있어야 Git 저장소입니다.","an":"2교시 실습 2-1 💡","src":"# 숨김 폴더 .git이 생성됨\nls -al\n```\n\n> 💡 `.git` 폴더가 모든 Git 정보를 담고 있습니다. 이 폴더가 있어야 Git 저장소!"},{"id":"t2-04","ty":"mc","lv":2,"game":true,"p":"새로 만든 파일이 <code>git add<\/code> 전 <code>git status<\/code>에 보이는 상태는?","o":["Untracked","Staged","Committed","Modified"],"a":0,"h":"실습 2-2에서 README.md를 만든 뒤 <code>git status<\/code>를 보면 'git add로 포함시키라'는 안내와 함께 새 파일이 표시됩니다. Git이 아직 추적하지 않는 파일이라는 뜻의 상태 이름을 고르세요.","w":"새 파일은 Untracked(추적 안 됨) 상태입니다. add하면 Staged, commit하면 Committed, 커밋 후 고치면 Modified가 됩니다.","an":"2교시 실습 2-2","src":"🔹 **Untracked**: Git이 추적하지 않는 새 파일 상태"},{"id":"t2-05","ty":"mc","lv":3,"game":true,"p":"다음 중 교재 기준 '좋은 커밋 메시지'는?","o":["수정함","버그 픽스","로그인 폼 이메일 검사 추가","진짜최종_v2"],"a":2,"h":"교재 2.4는 '수정함', '버그 픽스'처럼 무엇을 바꿨는지 알 수 없는 메시지를 나쁜 예로 듭니다. 어떤 화면의 어떤 기능을 어떻게 바꿨는지가 읽자마자 드러나는 구체적인 메시지가 좋은 예입니다.","w":"'수정함', '버그 픽스'는 무엇을 왜 바꿨는지 알 수 없는 나쁜 예입니다. 변경 내용을 구체적으로 쓴 메시지가 좋습니다.","an":"2교시 2.4 예시","src":"### 예시\n```\n❌ 나쁜 예: \"수정함\"\n❌ 나쁜 예: \"버그 픽스\"\n✅ 좋은 예: \"로그인 폼 이메일 유효성 검사 추가\"\n✅ 좋은 예: \"fix: prevent crash when user input is empty\"\n```"},{"id":"t2-06","ty":"ox","lv":1,"game":true,"p":"<code>git add .<\/code>는 현재 디렉토리의 모든 변경을 스테이징한다.","a":true,"h":"주요 add 옵션에서 파일명을 쓰면 그 파일만, 점(.)을 쓰면 현재 디렉토리의 모든 변경, -A는 저장소 전체(삭제 포함)를 스테이징합니다. 점이 '현재 디렉토리'를 뜻한다는 점을 기억하고 판단하세요.","w":"맞습니다. 특정 파일만 올리려면 <code>git add 파일명<\/code>, 저장소 전체(삭제 포함)는 <code>git add -A<\/code>를 씁니다.","an":"2교시 주요 add 옵션","src":"### 주요 add 옵션\n\n```bash\ngit add 파일명 # 특정 파일만\ngit add . # 현재 디렉토리 모든 변경\ngit add -A # 저장소 전체 모든 변경 (삭제 포함)\ngit add *.js # 패턴 매칭\n```"},{"id":"t2-07","ty":"ox","lv":2,"game":true,"p":"좋은 커밋 메시지 규칙에 따르면 제목 끝에 마침표를 찍는다.","a":false,"h":"좋은 커밋 메시지의 7가지 규칙에는 제목 50자 이내, 첫 글자 대문자, 명령문 형태 등이 있습니다. 4번 규칙이 제목 끝의 마침표에 대해 무엇이라고 하는지 확인하세요.","w":"틀렸습니다. 제목 끝에는 마침표를 찍지 않습니다(규칙 4).","an":"2교시 2.4 7가지 규칙","src":"### 좋은 커밋 메시지의 7가지 규칙\n1. 제목과 본문을 빈 줄로 분리\n2. 제목은 50자 이내로\n3. 제목 첫 글자는 대문자로 (영어 기준)\n4. 제목 끝에 마침표 X\n5. 제목은 **명령문**으로 작성 (\"Add\" O, \"Added\" X)\n6. 본문은 **무엇을, 왜** 변경했는지 설명\n7. 한 줄 72자 제한"},{"id":"t2-08","ty":"match","lv":2,"game":false,"p":"<code>git add<\/code> 옵션과 범위를 연결하세요.","pairs":[["git add 파일명","특정 파일만"],["git add .","현재 디렉토리의 모든 변경"],["git add -A","저장소 전체(삭제 포함)"],["git add *.js","패턴에 맞는 파일"]],"h":"주요 add 옵션 표에서 파일명은 그 파일 하나만, 점(.)은 현재 디렉토리의 모든 변경을 가리킵니다. -A는 All의 뜻대로 삭제까지 포함한 저장소 전체를, *.js 같은 별표 표현은 패턴에 맞는 파일만 스테이징합니다.","w":"파일명은 그 파일만, .은 현재 디렉토리, -A는 저장소 전체(삭제 포함), *.js는 패턴 매칭입니다.","an":"2교시 주요 add 옵션","src":"### 주요 add 옵션\n\n```bash\ngit add 파일명 # 특정 파일만\ngit add . # 현재 디렉토리 모든 변경\ngit add -A # 저장소 전체 모든 변경 (삭제 포함)\ngit add *.js # 패턴 매칭\n```"},{"id":"t2-09","ty":"order","lv":1,"game":false,"p":"저장소를 만들고 첫 커밋을 확인하기까지의 순서는?","steps":["git init","README.md 만들기","git add README.md","git commit -m \"최초 커밋\"","git log"],"h":"수료 체크리스트 1단계 순서대로 먼저 저장소를 초기화하고, 파일을 만든 다음 스테이징합니다. 그다음 메시지와 함께 커밋하고, 마지막에 이력 보기 명령으로 커밋이 기록됐는지 확인합니다.","w":"저장소를 초기화하고 파일을 만든 뒤, add로 스테이징하고 commit으로 저장한 다음 log로 확인합니다.","an":"2교시 실습 2-1~2-4","src":"### 1단계: 로컬\n- [ ] Git 설치 및 초기 설정\n- [ ] 저장소 생성 (`git init`)\n- [ ] 파일 스테이징 (`git add`)\n- [ ] 커밋 작성 (`git commit`)\n- [ ] 이력 확인 (`git log`)\n- [ ] 변경 사항 확인 (`git diff`)\n- [ ] .gitignore 작성"},{"id":"t2-10","ty":"multi","lv":2,"game":true,"p":"'좋은 커밋 메시지의 7가지 규칙'에 해당하는 것을 <b>모두<\/b> 고르세요.","o":["제목은 50자 이내","제목은 명령문으로","본문은 무엇을·왜","제목 끝에 마침표","한 줄 120자까지 허용"],"a":[0,1,2],"h":"7가지 규칙은 제목과 본문을 빈 줄로 분리, 제목 길이 제한, 첫 글자 대문자, 끝에 마침표 없음, 명령문 형태, 본문에 무엇을·왜, 한 줄 72자 제한입니다. 보기의 숫자나 문장 형태가 규칙과 정확히 같은지 비교하세요.","w":"제목 50자 이내, 명령문('Add' O), 본문은 무엇을·왜가 규칙입니다. 제목 끝 마침표는 금지, 한 줄은 72자 제한입니다.","an":"2교시 2.4 7가지 규칙","src":"### 좋은 커밋 메시지의 7가지 규칙\n1. 제목과 본문을 빈 줄로 분리\n2. 제목은 50자 이내로\n3. 제목 첫 글자는 대문자로 (영어 기준)\n4. 제목 끝에 마침표 X\n5. 제목은 **명령문**으로 작성 (\"Add\" O, \"Added\" X)\n6. 본문은 **무엇을, 왜** 변경했는지 설명\n7. 한 줄 72자 제한"}]},{"id":"t3","title":"히스토리와 변경 추적","ref":"3교시","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"커밋 이력을 한 줄씩 간단히 보는 명령은?","o":["git log -p","git log --stat","git log --oneline","git log -3"],"a":2,"h":"<code>git log<\/code>는 커밋 이력을 자세히 보여 주고, 옵션을 붙이면 형태를 바꿀 수 있습니다. 커밋 하나를 축약 해시와 메시지만으로 '한 줄(one line)'에 보여 주는 옵션을 고르세요.","w":"<code>--oneline<\/code>은 커밋을 한 줄로 보여 줍니다. -p는 변경 내용 전체, --stat은 파일 변경량, -3은 최근 3개입니다.","an":"3교시 실습 3-1","src":"# 한 줄로 보기\ngit log --oneline\n# 최근 3개만\ngit log -3\n# 그래프 형태로\ngit log --oneline --graph --all\n# 누가, 언제 변경했는지 + 파일 변경량\ngit log --stat\n# 모든 변경 내용까지\ngit log -p\n# 특정 파일의 이력만\ngit log --oneline README.md\n# 예쁘게 보기 (사용자 정의)\ngit log --pretty=format:\"%h - %an, %ar : %s\"\n```"},{"id":"t3-02","ty":"mc","lv":2,"game":true,"p":"스테이징 영역과 마지막 커밋을 비교하는 명령은?","o":["git diff","git diff --staged","git log -p","git status"],"a":1,"h":"옵션 없는 <code>git diff<\/code>는 작업 영역과 스테이징 영역을 비교합니다. 이미 add한 내용과 마지막 커밋을 비교하려면 '스테이징된'이라는 뜻의 옵션을 붙여야 합니다.","w":"<code>git diff --staged<\/code>(또는 --cached)는 스테이징 영역과 마지막 커밋을 비교합니다.","an":"3교시 실습 3-2","src":"# 작업 영역 vs 스테이징 영역 비교\ngit diff\n# 스테이징\ngit add README.md\n# 스테이징 영역 vs 마지막 커밋 비교\ngit diff --staged\n# 또는\ngit diff --cached\n# 커밋 후 비교\ngit commit -m \"README에 줄 추가\"\n# 두 커밋 비교 (해시는 git log에서 확인)\ngit log --oneline\ngit diff 첫번째해시 두번째해시\n```"},{"id":"t3-03","ty":"mc","lv":1,"game":true,"p":"<code>git log --pretty=format<\/code>에서 <code>%an<\/code>의 의미는?","o":["작성자 이름","작성자 이메일","커밋 해시","커밋 메시지"],"a":0,"h":"log 포맷 옵션 표에서 %h·%H는 커밋 해시, %ae는 작성자 이메일, %ad는 작성 날짜, %ar은 상대 시간입니다. a는 author, n은 name의 첫 글자라는 점에서 %an의 의미를 추론하세요.","w":"%an은 작성자 이름, %ae는 이메일, %h/%H는 해시, %s는 메시지입니다.","an":"3교시 log 포맷 옵션 표","src":"### log 포맷 옵션 정리\n\n| 옵션 | 의미 |\n|:---:|:---|\n| `%H` | 커밋 해시 (전체) |\n| `%h` | 커밋 해시 (축약) |\n| `%an` | 작성자 이름 |\n| `%ae` | 작성자 이메일 |\n| `%ad` | 작성 날짜 |\n| `%ar` | 상대 시간 (예: 3 hours ago) |\n| `%s` | 커밋 메시지 |"},{"id":"t3-04","ty":"mc","lv":2,"game":true,"p":"<code>git diff<\/code> 결과에서 <code>+<\/code>로 시작하는 줄은?","o":["삭제된 줄","변경 위치","추가된 줄","이전 파일 이름"],"a":2,"h":"diff 결과에서 ---는 이전 파일, +++는 이후 파일을 가리키고, @@ 줄은 바뀐 위치를 알려 줍니다. 각 줄 앞의 - 기호는 삭제된 줄, + 기호는 그 반대 의미를 나타냅니다.","w":"+는 추가된 줄, -는 삭제된 줄, @@는 변경 위치를 나타냅니다.","an":"3교시 diff 결과 읽기","src":"### diff 결과 읽기\n\n```diff\ndiff --git a/README.md b/README.md\nindex abc1234..def5678 100644\n--- a/README.md ← 비교 대상 (이전)\n+++ b/README.md ← 비교 대상 (이후)\n@@ -1,3 +1,4 @@ ← 변경 위치\n # 나의 첫 Git 프로젝트\n 이 프로젝트는 Git 학습용입니다.\n+새로운 줄 추가 ← + : 추가된 줄\n-삭제된 줄 ← - : 삭제된 줄\n```"},{"id":"t3-05","ty":"mc","lv":3,"game":true,"p":"이미 추적 중인 파일을 .gitignore로 무시하려면 먼저 무엇을 해야 하나요?","o":["git restore 파일명","git reset --hard","git add -A","git rm --cached 파일명"],"a":3,"h":"3.4의 주의 상자는 이미 추적 중인 파일은 .gitignore에 추가해도 무시되지 않는다고 말합니다. 파일은 디스크에 남겨 두고 Git의 추적만 해제하는 rm 명령(캐시에서만 제거하는 옵션)을 먼저 실행해야 합니다.","w":"이미 추적 중인 파일은 .gitignore에 추가해도 무시되지 않습니다. <code>git rm --cached 파일명<\/code>으로 추적을 해제한 뒤 추가합니다.","an":"3교시 3.4 💡 주의","src":"# .gitignore 커밋\ngit add .gitignore\ngit commit -m \".gitignore 추가\"\n```\n\n> 💡 **주의**: 이미 추적 중인 파일은 .gitignore에 추가해도 무시되지 않습니다. `git rm --cached 파일명`으로 추적 해제 후 추가하세요."},{"id":"t3-06","ty":"ox","lv":1,"game":true,"p":"옵션 없는 <code>git diff<\/code>는 작업 영역과 스테이징 영역을 비교한다.","a":true,"h":"실습 3-2의 주석을 보면 옵션 없는 diff와 --staged를 붙인 diff가 비교하는 대상이 서로 다릅니다. 아직 add하지 않은 변경을 보여 주는 쪽이 어느 두 영역을 비교하는지 확인하세요.","w":"맞습니다. 스테이징과 마지막 커밋을 비교하려면 --staged를 붙입니다.","an":"3교시 실습 3-2","src":"# 작업 영역 vs 스테이징 영역 비교\ngit diff\n# 스테이징\ngit add README.md\n# 스테이징 영역 vs 마지막 커밋 비교\ngit diff --staged\n# 또는\ngit diff --cached\n# 커밋 후 비교\ngit commit -m \"README에 줄 추가\"\n# 두 커밋 비교 (해시는 git log에서 확인)\ngit log --oneline\ngit diff 첫번째해시 두번째해시\n```"},{"id":"t3-07","ty":"ox","lv":2,"game":true,"p":".gitignore에 추가하면 이미 추적 중인 파일도 즉시 무시된다.","a":false,"h":".gitignore는 아직 추적되지 않은 파일에만 효과가 있습니다. 3.4의 주의 상자에 따르면 이미 추적 중인 파일은 <code>git rm --cached<\/code>로 추적을 해제해야 비로소 무시됩니다.","w":"틀렸습니다. 이미 추적 중인 파일은 <code>git rm --cached<\/code>로 추적을 해제해야 무시됩니다.","an":"3교시 3.4 💡 주의","src":"# .gitignore 커밋\ngit add .gitignore\ngit commit -m \".gitignore 추가\"\n```\n\n> 💡 **주의**: 이미 추적 중인 파일은 .gitignore에 추가해도 무시되지 않습니다. `git rm --cached 파일명`으로 추적 해제 후 추가하세요."},{"id":"t3-08","ty":"match","lv":2,"game":false,"p":"log 포맷 옵션과 의미를 연결하세요.","pairs":[["%h","커밋 해시(축약)"],["%ae","작성자 이메일"],["%ar","상대 시간"],["%s","커밋 메시지"]],"h":"log 포맷 옵션의 글자는 영어 단어의 첫 글자입니다. h는 hash(축약 해시), ae는 author email, ar은 author relative(상대 시간), s는 subject(커밋 메시지 제목)를 뜻합니다.","w":"%h는 축약 해시, %ae는 작성자 이메일, %ar은 '3 hours ago' 같은 상대 시간, %s는 커밋 메시지입니다.","an":"3교시 log 포맷 옵션 표","src":"### log 포맷 옵션 정리\n\n| 옵션 | 의미 |\n|:---:|:---|\n| `%H` | 커밋 해시 (전체) |\n| `%h` | 커밋 해시 (축약) |\n| `%an` | 작성자 이름 |\n| `%ae` | 작성자 이메일 |\n| `%ad` | 작성 날짜 |\n| `%ar` | 상대 시간 (예: 3 hours ago) |\n| `%s` | 커밋 메시지 |"},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"실습 3-3에서 파일 상태가 바뀌는 순서를 맞추세요.","steps":["새 파일 생성: Untracked","add 후: Staged","commit 후: Committed(clean)","파일 수정 후: Modified"],"h":"파일 상태 흐름도는 새 파일(추적 안 됨) → git add → 스테이징됨 → git commit → 커밋됨 순서로 진행합니다. 커밋으로 깨끗해진 파일을 다시 고치면 '수정됨' 상태가 되어 다시 add를 기다립니다.","w":"touch로 만든 파일은 Untracked, add하면 Staged, commit하면 Committed, 그 뒤 고치면 Modified가 됩니다.","an":"3교시 실습 3-3 · 파일 상태 흐름도","src":"## 3.3 파일 상태 시각화\n\n```\n파일 상태 흐름도:\n\n┌─────────────┐ git add ┌─────────────┐ git commit ┌─────────────┐\n│ Untracked │ ─────────→ │ Staged │ ──────────→ │ Committed │\n│ (추적 안됨) │ │ (스테이징됨) │ │ (커밋됨) │\n└─────────────┘ └─────────────┘ └─────────────┘\n ↑ │\n │ 파일 수정 │\n └──────────────────────────────┘\n ↓"},{"id":"t3-10","ty":"multi","lv":1,"game":true,"p":"실습 3-4의 .gitignore 예시에 들어 있는 항목을 <b>모두<\/b> 고르세요.","o":["*.log","node_modules/",".env","README.md","index.html"],"a":[0,1,2],"h":"실습 3-4의 .gitignore는 로그 파일, 의존성 폴더(node_modules, __pycache__), 환경 변수 파일처럼 공유하면 안 되거나 다시 만들 수 있는 항목을 넣습니다. 소스 코드나 README처럼 반드시 공유해야 하는 파일은 들어가지 않습니다.","w":"*.log(로그), node_modules/(의존성), .env(환경 변수)는 예시에 있습니다. README.md와 index.html은 공유해야 하는 파일입니다.","an":"3교시 실습 3-4","src":"# 환경 변수\n.env\n.env.local\n# IDE 설정\n.vscode/\n.idea/\n# 의존성\nnode_modules/\n__pycache__/\n*.pyc\n```\n\n```bash\n# 테스트\ntouch test.log\ngit status\n# → test.log는 보이지 않아야 함 (정상)\n# .gitignore 커밋\ngit add .gitignore\ngit commit -m \".gitignore 추가\"\n```"}]},{"id":"t4","title":"브랜치 생성과 병합","ref":"4교시","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":true,"p":"교재가 정의한 브랜치(Branch)는?","o":["독립된 작업 공간","원격 저장소 주소","커밋 메시지 규칙","임시 저장 공간"],"a":0,"h":"교재 4.1은 브랜치를 한 줄로 정의합니다. 메인 코드를 건드리지 않고 새 기능을 시험하거나 여러 사람이 동시에 작업할 수 있도록 따로 떼어 낸 '작업 공간'이라는 점을 떠올리세요.","w":"브랜치는 독립된 작업 공간입니다. 임시 저장은 stash, 원격 주소는 remote입니다.","an":"4교시 4.1 브랜치란?","src":"## 4.1 브랜치란?\n\n**브랜치(Branch)** = 독립된 작업 공간"},{"id":"t4-02","ty":"mc","lv":1,"game":true,"p":"브랜치 생성과 이동을 한 번에 하는 최신 방식 명령은?","o":["git branch -c 이름","git switch -c 이름","git merge -c 이름","git checkout 이름"],"a":1,"h":"switch vs checkout 표에서 <code>git switch<\/code>는 Git 2.23부터 생긴 브랜치 이동 명령입니다. 여기에 create를 뜻하는 -c 옵션을 붙이면 새 브랜치를 만들면서 바로 그 브랜치로 이동합니다.","w":"<code>git switch -c 이름<\/code>이 생성+이동입니다. 구식으로는 <code>git checkout -b 이름<\/code>을 씁니다.","an":"4교시 switch vs checkout 표","src":"### switch vs checkout\n\n| 명령 | 용도 |\n|:---|:---|\n| `git switch 브랜치` | 브랜치 이동 (Git 2.23+) |\n| `git switch -c 브랜치` | 생성+이동 |\n| `git checkout 브랜치` | 브랜치 이동 (구식) |\n| `git checkout -b 브랜치` | 생성+이동 (구식) |\n\n> 💡 `checkout`은 여러 용도로 쓰여 혼란스러워, `switch`와 `restore`로 분리되었습니다."},{"id":"t4-03","ty":"mc","lv":2,"game":true,"p":"브랜치 작업을 하려면 저장소에 최소한 무엇이 있어야 하나요?","o":["원격 저장소 연결","태그 1개","PR 1개","커밋 1개"],"a":3,"h":"실습 4-1에서는 브랜치를 만들기 전에 README.md를 만들어 '초기 커밋'부터 합니다. 주석에 브랜치 작업을 하려면 커밋이 최소 몇 개 필요하다고 적혀 있는지 확인하세요.","w":"브랜치 작업을 하려면 최소 1개의 커밋이 필요합니다.","an":"4교시 실습 4-1","src":"# 초기 커밋 (브랜치 작업하려면 최소 1개 커밋 필요)\necho \"# Branch 실습\" > README.md\ngit add .\ngit commit -m \"초기 커밋\"\n# 현재 브랜치 확인\ngit branch\n# → * main\n# 새 브랜치 생성\ngit branch feature-login\n# 브랜치 목록\ngit branch\n# feature-login\n# * main (별표는 현재 위치)\n```"},{"id":"t4-04","ty":"mc","lv":2,"game":true,"p":"병합 중 Vim 편집기가 열렸을 때 저장하고 나가는 방법은?","o":[":q!","ESC 후 :wq","Ctrl + C",":help"],"a":1,"h":"병합 커밋 메시지를 쓰라고 Vim 편집기가 열리면 먼저 ESC로 입력 모드를 빠져나옵니다. 그다음 콜론 명령으로 w(write, 저장)와 q(quit, 종료)를 함께 입력하면 저장하고 나갑니다. 저장 없이 나가려면 :q!를 씁니다.","w":"ESC → :wq가 저장 후 종료, :q!는 저장 없이 종료입니다.","an":"4교시 실습 4-5 💡","src":"> 💡 **Vim 편집기 빠져나오기**: `ESC` → `:wq` (저장 후 종료) 또는 `:q!` (저장 없이 종료)"},{"id":"t4-05","ty":"mc","lv":3,"game":true,"p":"병합되지 않은 브랜치를 강제로 삭제하는 명령은?","o":["git branch -d","git branch -m","git branch -D","git switch -d"],"a":2,"h":"실습 4-6에서 병합된 브랜치는 소문자 -d 옵션으로 안전하게 삭제합니다. 병합되지 않은 브랜치는 이 옵션으로 지워지지 않으므로, 주의 표시와 함께 대문자 옵션을 써서 강제로 삭제합니다.","w":"<code>git branch -d<\/code>는 병합된 브랜치 삭제, 대문자 <code>-D<\/code>는 병합 안 된 브랜치 강제 삭제(주의!)입니다.","an":"4교시 실습 4-6","src":"# 병합 안된 브랜치 강제 삭제 (주의!)\ngit branch -D feature-signup\n# 브랜치 목록 확인\ngit branch\n```"},{"id":"t4-06","ty":"ox","lv":1,"game":true,"p":"<code>git branch<\/code> 목록에서 별표(*)는 현재 위치한 브랜치를 뜻한다.","a":true,"h":"실습 4-1에서 <code>git branch<\/code>를 실행하면 브랜치 목록이 나오고, 그중 하나 앞에 별표가 붙어 <code>* main<\/code>처럼 보입니다. 주석이 별표의 의미를 무엇이라고 설명하는지 떠올리세요.","w":"맞습니다. 별표가 붙은 브랜치가 현재 위치입니다.","an":"4교시 실습 4-1","src":"# * main (별표는 현재 위치)\n```"},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"다른 브랜치로 이동해도 작업 폴더의 파일은 항상 똑같이 보인다.","a":false,"h":"실습 4-3에서 feature-login 브랜치에서 login.html을 커밋한 뒤 main으로 돌아와 ls를 하면 그 파일이 보이지 않습니다. 브랜치마다 작업 폴더의 파일 구성이 달라진다는 점을 확인하세요.","w":"틀렸습니다. 브랜치마다 파일이 다릅니다. main으로 이동하자 feature-login에서 만든 login.html이 사라졌습니다.","an":"4교시 실습 4-3","src":"# login.html이 사라짐 (브랜치마다 다른 파일)\nls\n```"},{"id":"t4-08","ty":"match","lv":2,"game":false,"p":"Git Flow의 브랜치와 역할을 연결하세요.","pairs":[["main","운영"],["develop","개발"],["feature/*","기능 개발"],["release/*","배포 준비"],["hotfix/*","긴급 수정"]],"h":"Git Flow는 운영용 main 아래 개발용 develop을 두고, 그 아래에 용도별 브랜치를 둡니다. feature는 기능, release는 출시(배포) 준비, hot fix는 급하게 고치는 일을 뜻하는 영어 그대로 역할을 연결하세요.","w":"Git Flow는 main(운영) 아래 develop(개발)을 두고 feature·release·hotfix 브랜치로 나눕니다.","an":"4교시 4.6 Git Flow","src":"### Git Flow\n```\nmain (운영)\n └─ develop (개발)\n ├─ feature/* (기능 개발)\n ├─ release/* (배포 준비)\n └─ hotfix/* (긴급 수정)\n```"},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"실습 4-4 Fast-Forward 병합의 순서를 맞추세요.","steps":["git switch -c feature-button","button.html 작성 후 add·commit","git switch main","git merge feature-button","git log --oneline --graph --all"],"h":"Fast-Forward 병합 실습은 새 브랜치를 만들어 이동한 뒤 button.html을 작성해 커밋합니다. 그다음 main으로 돌아와 그 브랜치를 merge하고, 마지막에 그래프 옵션을 붙인 log로 결과를 확인합니다.","w":"새 브랜치에서 작업·커밋한 뒤 main으로 돌아와 merge하고 그래프로 확인합니다.","an":"4교시 실습 4-4","src":"# 새 브랜치 만들고 작업\ngit switch -c feature-button\necho \"클릭\" > button.html\ngit add .\ngit commit -m \"버튼 추가\"\n# main으로 이동\ngit switch main\n# main에 feature-button 병합\ngit merge feature-button\n# 그래프 확인\ngit log --oneline --graph --all\n```"},{"id":"t4-10","ty":"multi","lv":1,"game":true,"p":"교재가 든 '브랜치가 필요한 이유'를 <b>모두<\/b> 고르세요.","o":["메인 코드를 건드리지 않고 새 기능 시험","여러 사람이 충돌 없이 동시 작업","버전별 관리","커밋 메시지 자동 작성","원격 저장소 자동 백업"],"a":[0,1,2],"h":"4.1 '왜 브랜치가 필요한가?'에는 세 가지 이유가 나옵니다. 메인 코드를 보호하며 새 기능을 시험하는 것, 여러 사람이 충돌 없이 동시에 작업하는 것, v1.0·v2.0처럼 버전별로 관리하는 것에 해당하는 보기를 고르세요.","w":"새 기능 시험, 동시 작업, 버전별 관리(v1.0, v2.0)가 이유입니다. 메시지 작성이나 백업은 브랜치의 역할이 아닙니다.","an":"4교시 4.1 왜 브랜치가 필요한가?","src":"### 왜 브랜치가 필요한가?\n- 메인 코드를 건드리지 않고 새 기능 시험\n- 여러 사람이 충돌 없이 동시 작업\n- 버전별 관리 (예: v1.0, v2.0)"}]},{"id":"t5","title":"충돌 해결과 되돌리기","ref":"5교시","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"머지 충돌(Merge Conflict)이 발생하는 경우는?","o":["다른 파일을 각각 수정","같은 파일 같은 줄을 다르게 수정","새 브랜치를 만들 때","커밋 메시지가 같을 때"],"a":1,"h":"5.1은 충돌 조건을 한 문장으로 정리합니다. 두 브랜치가 서로 다른 파일이나 다른 줄을 고쳤다면 Git이 자동으로 합치지만, 같은 파일의 같은 위치를 서로 다르게 고쳤다면 어느 쪽을 택할지 정할 수 없어 충돌이 납니다.","w":"같은 파일의 같은 줄을 두 브랜치에서 다르게 수정하면 충돌이 납니다.","an":"5교시 5.1 충돌이 발생하는 경우","src":"### 충돌이 발생하는 경우\n**같은 파일의 같은 줄**을 두 브랜치에서 다르게 수정했을 때"},{"id":"t5-02","ty":"mc","lv":2,"game":true,"p":"충돌 표시에서 <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD<\/code>부터 <code>=======<\/code>까지는?","o":["현재 브랜치의 내용","병합하려는 브랜치의 내용","공통 조상의 내용","원격 저장소의 내용"],"a":0,"h":"충돌 표시는 <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD<\/code>, <code>=======<\/code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt; 브랜치명<\/code>으로 두 내용을 나눕니다. HEAD는 지금 내가 있는 브랜치를 가리키므로, 위쪽 구역이 누구의 내용인지 추론하세요.","w":"HEAD ~ ======= 는 현재 브랜치(main), ======= ~ >>>>>>> feature-a 는 병합하려는 브랜치의 내용입니다.","an":"5교시 실습 5-2 충돌 표시","src":"**충돌 표시**:\n```\n<<<<<<< HEAD\nHello from Main\n=======\nHello from A\n>>>>>>> feature-a\n```\n\n**의미**:\n- `<<<<<<< HEAD` ~ `=======` : 현재 브랜치(main)의 내용\n- `=======` ~ `>>>>>>> feature-a` : 병합하려는 브랜치의 내용\n\n**해결 방법**:\n\nVS Code로 파일 열기:\n```bash\ncode greeting.txt\n```\n\nVS Code에서는 친절하게 버튼이 표시됩니다:"},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"파일 수정은 남기고 스테이징만 취소하는 명령은?","o":["git restore 파일","git restore --staged 파일","git reset --hard","git revert HEAD"],"a":1,"h":"실습 5-4에서는 restore 명령에 스테이징을 뜻하는 옵션을 붙여 add를 취소합니다. 5.2 표에서도 이 형태는 'Staging Area'에만 영향을 주어, 파일의 수정 내용은 작업 영역에 그대로 남습니다.","w":"<code>git restore --staged<\/code>는 스테이징만 취소합니다. 옵션 없는 restore는 작업 영역의 수정까지 되돌립니다.","an":"5교시 실습 5-4","src":"# 스테이징만 취소 (파일은 그대로)\ngit restore --staged sample.txt\ngit status\n# → 수정은 남아있지만 unstaged 상태\n```"},{"id":"t5-04","ty":"mc","lv":3,"game":true,"p":"이미 push한 커밋을 되돌릴 때 교재가 추천하는 명령은?","o":["git reset --hard","git reset --soft","git restore","git revert"],"a":3,"h":"reset은 이력 자체를 삭제하고, revert는 취소 내용을 담은 새 커밋을 만들어 이력을 보존합니다. 선택 기준 표는 혼자 쓰는 로컬 브랜치와 이미 push했거나 협업 중인 브랜치를 구분해 추천 명령을 다르게 제시합니다.","w":"이미 push했거나 협업 중인 브랜치는 반드시 revert를 씁니다. reset은 이력 자체를 바꿔 다른 사람과 어긋납니다.","an":"5교시 reset vs revert 선택 기준","src":"### reset vs revert 선택 기준\n\n| 상황 | 추천 |\n|:---|:---:|\n| 혼자 작업 중인 로컬 브랜치 | `reset` |\n| 이미 push한 커밋 | `revert` |\n| 협업 중인 브랜치 | **반드시 `revert`** |"},{"id":"t5-05","ty":"mc","lv":2,"game":true,"p":"작업 영역·스테이징·커밋을 모두 되돌리는 reset 모드는?","o":["--soft","--mixed","--hard","--keep"],"a":2,"h":"reset의 3가지 모드 표는 모드마다 작업 영역·스테이징·커밋 중 무엇을 되돌리는지 보여 줍니다. 세 칸이 모두 '되돌림'이고 경고 표시가 붙은 가장 강한 모드를 찾으세요. 공유 브랜치에서는 사용이 금지됩니다.","w":"--hard는 세 영역을 모두 되돌려 변경 내용이 완전히 사라집니다. 공유된 브랜치에서는 절대 쓰지 않습니다.","an":"5교시 reset의 3가지 모드 표","src":"### reset의 3가지 모드\n\n| 모드 | 작업 영역 | 스테이징 | 커밋 |\n|:---:|:---:|:---:|:---:|\n| `--soft` | 유지 | 유지 | 되돌림 |\n| `--mixed` (기본) | 유지 | 되돌림 | 되돌림 |\n| `--hard` | 되돌림 | 되돌림 | 되돌림 ⚠️ |"},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"<code>git reset<\/code>의 기본 모드는 <code>--mixed<\/code>이다.","a":true,"h":"reset의 3가지 모드 표에는 soft, mixed, hard가 있고 그중 하나에 '(기본)' 표시가 붙어 있습니다. 실습 5-5에서도 옵션 없이 <code>git reset HEAD~1<\/code>을 실행하면 이 모드로 동작합니다.","w":"맞습니다. --mixed는 커밋과 스테이징을 되돌리고 작업 영역은 유지합니다.","an":"5교시 reset의 3가지 모드 표","src":"### reset의 3가지 모드\n\n| 모드 | 작업 영역 | 스테이징 | 커밋 |\n|:---:|:---:|:---:|:---:|\n| `--soft` | 유지 | 유지 | 되돌림 |\n| `--mixed` (기본) | 유지 | 되돌림 | 되돌림 |\n| `--hard` | 되돌림 | 되돌림 | 되돌림 ⚠️ |"},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"<code>git revert<\/code>는 이력을 삭제해서 커밋을 되돌린다.","a":false,"h":"5.5는 reset과 revert를 대비합니다. reset은 이력을 삭제하지만 revert는 이전 커밋을 취소하는 새 커밋을 만들어 기존 이력을 그대로 남기므로, 이미 push한 커밋에도 안전합니다.","w":"틀렸습니다. reset이 이력을 삭제하고, revert는 새 커밋을 만들어 취소하므로 이력이 보존됩니다.","an":"5교시 5.5 git revert","src":"## 5.5 git revert - 안전한 되돌리기\n\n`reset`은 이력을 **삭제**하지만 `revert`는 새 커밋으로 **취소**합니다."},{"id":"t5-08","ty":"match","lv":3,"game":false,"p":"reset 모드와 결과를 연결하세요.","pairs":[["--soft","커밋만 되돌림(스테이징 유지)"],["--mixed","커밋·스테이징 되돌림(작업 영역 유지)"],["--hard","작업 영역까지 모두 되돌림"]],"h":"모드 표에서 soft는 커밋만, mixed는 커밋과 스테이징을, hard는 작업 영역까지 되돌립니다. soft → mixed → hard 순으로 되돌리는 범위가 한 칸씩 넓어진다고 생각하면 연결할 수 있습니다.","w":"soft는 커밋만, mixed는 커밋과 스테이징, hard는 작업 영역까지 되돌립니다.","an":"5교시 reset의 3가지 모드 표 · 실습 5-5","src":"### reset의 3가지 모드\n\n| 모드 | 작업 영역 | 스테이징 | 커밋 |\n|:---:|:---:|:---:|:---:|\n| `--soft` | 유지 | 유지 | 되돌림 |\n| `--mixed` (기본) | 유지 | 되돌림 | 되돌림 |\n| `--hard` | 되돌림 | 되돌림 | 되돌림 ⚠️ |"},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"실습 5-1~5-2의 충돌 발생과 해결 순서를 맞추세요.","steps":["git merge feature-a (충돌 발생)","git status로 충돌 파일 확인","파일을 열어 충돌 표시 정리","git add greeting.txt","git commit"],"h":"실습 5-1에서 main에 feature-a를 merge하면 CONFLICT 메시지가 나옵니다. 이어서 상태를 확인해 충돌 파일을 찾고, 파일을 열어 충돌 표시를 정리한 뒤 그 파일을 add하고 commit하면 병합이 끝납니다.","w":"충돌이 나면 status로 파일을 확인하고, 충돌 표시를 정리한 뒤 add와 commit으로 병합을 마칩니다.","an":"5교시 실습 5-1·5-2","src":"# 충돌 발생!\ngit merge feature-a\n```\n\n**오류 메시지**:\n```\nAuto-merging greeting.txt\nCONFLICT (content): Merge conflict in greeting.txt\nAutomatic merge failed; fix conflicts and then commit the result.\n```"},{"id":"t5-10","ty":"multi","lv":1,"game":true,"p":"VS Code가 충돌 파일에 보여 주는 버튼을 <b>모두<\/b> 고르세요.","o":["Accept Current Change","Accept Incoming Change","Accept Both Changes","Compare Changes","Delete All Changes"],"a":[0,1,2,3],"h":"VS Code는 충돌 구역 위에 선택 버튼을 띄웁니다. 현재 브랜치 쪽을 택하는 것, 들어오는(병합 대상) 쪽을 택하는 것, 둘 다 남기는 것, 두 내용을 나란히 비교하는 것까지 네 가지가 있습니다.","w":"Current(현재 브랜치)·Incoming(병합 브랜치)·Both(둘 다)·Compare(비교) 버튼이 있습니다. 모두 지우는 버튼은 없습니다.","an":"5교시 실습 5-2","src":"- **Accept Current Change**: 현재 브랜치 내용 선택\n- **Accept Incoming Change**: 병합 브랜치 내용 선택\n- **Accept Both Changes**: 둘 다 유지\n- **Compare Changes**: 비교\n\n또는 직접 편집:\n```\nHello from Main and A\n```\n\n저장 후:\n```bash"}]},{"id":"t6","title":"원격 저장소 GitHub","ref":"6교시","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"로컬 저장소를 GitHub 원격 저장소와 연결하는 명령은?","o":["git remote add origin URL","git clone URL","git push URL","git init URL"],"a":0,"h":"실습 6-3에서는 로컬 저장소에 원격(remote) 저장소를 '추가(add)'하면서 그 이름을 origin으로 지정하고 GitHub URL을 적습니다. 연결 후에는 <code>git remote -v<\/code>로 확인합니다.","w":"<code>git remote add origin URL<\/code>로 연결하고 <code>git remote -v<\/code>로 확인합니다.","an":"6교시 실습 6-3","src":"# 원격 저장소 연결 (URL은 본인 것으로!)\ngit remote add origin https://github.com/사용자명/my-first-github-repo.git\n# 연결 확인\ngit remote -v\n# → origin https://github.com/.../...git (fetch)\n# → origin https://github.com/.../...git (push)\n# 기본 브랜치 확인 후 main으로\ngit branch -M main\n# 원격으로 푸시\ngit push -u origin main\n```"},{"id":"t6-02","ty":"mc","lv":2,"game":true,"p":"GitHub에 push할 때 비밀번호 대신 쓰는 것은?","o":["SSH 비밀번호","Personal Access Token","휴대폰 OTP","이메일 인증 코드"],"a":1,"h":"교재는 GitHub이 비밀번호 인증을 폐지했다고 안내합니다. 프로필 → Settings → Developer settings에서 발급하는 토큰을 비밀번호 칸에 대신 입력하며, 이 토큰의 영문 이름을 고르세요.","w":"Personal Access Token(PAT)을 발급해 push 시 비밀번호 자리에 붙여 넣습니다.","an":"6교시 Personal Access Token 인증","src":"### Personal Access Token 인증\n\n최근 GitHub은 **비밀번호 인증을 폐지**했습니다. 대신 **Personal Access Token (PAT)** 사용:\n\n1. GitHub → 우측 상단 프로필 → **Settings**\n2. 좌측 메뉴 최하단 → **Developer settings**\n3. **Personal access tokens** → **Tokens (classic)**\n4. **Generate new token (classic)**\n5. 설정:\n - **Note**: `Git 실습용`\n - **Expiration**: 30 days\n - **Select scopes**: `repo` 체크\n6. **Generate token** → 토큰 복사 (한 번만 표시되니 주의!)"},{"id":"t6-03","ty":"mc","lv":2,"game":true,"p":"원격 변경을 가져오기만 하고 병합은 하지 않는 명령은?","o":["git pull","git push","git clone","git fetch"],"a":3,"h":"실습 6-4의 주석은 원격 내용을 가져오기만 하고 병합은 하지 않는 명령을 따로 구분합니다. pull은 가져온 뒤 자동으로 병합까지 하므로, '가져오다'라는 뜻의 다른 명령이 정답입니다.","w":"fetch는 가져오기만 하고, pull은 가져와서 자동 병합(fetch + merge)합니다.","an":"6교시 push, pull, fetch, clone 정리","src":"# fetch: 원격 내용 가져오기만 (병합 X)\ngit fetch\n# 가져온 후 직접 병합\ngit merge origin/main\n```"},{"id":"t6-04","ty":"mc","lv":1,"game":true,"p":"<code>git pull<\/code>은 어떤 두 동작을 합친 것인가요?","o":["clone + push","add + commit","fetch + merge","reset + merge"],"a":2,"h":"push, pull, fetch, clone 정리 표에서 pull은 원격 변경을 받아 자동으로 병합한다고 설명합니다. 원격 내용을 가져오기만 하는 명령과 브랜치를 합치는 명령, 두 동작을 이어서 한 것과 같습니다.","w":"pull = fetch(가져오기) + merge(병합)입니다.","an":"6교시 push, pull, fetch, clone 정리","src":"### push, pull, fetch, clone 정리\n\n| 명령어 | 의미 |\n|:---|:---|\n| `git clone URL` | 원격 저장소를 복제 (처음 한번) |\n| `git push` | 로컬 커밋을 원격으로 전송 |\n| `git pull` | 원격 변경 가져와서 자동 병합 (fetch + merge) |\n| `git fetch` | 원격 변경 가져오기만 (병합 안함) |"},{"id":"t6-05","ty":"mc","lv":2,"game":true,"p":"실습 6-2에서 원격 저장소를 만들 때 체크를 해제하는 항목은?","o":["Public","Add a README file","Repository name","Create repository"],"a":1,"h":"실습 6-2는 로컬에 이미 README.md 등 파일이 있는 상태에서 원격 저장소를 만듭니다. 원격에 파일을 자동으로 생성하는 옵션을 켜 두면 로컬 커밋과 겹쳐 push가 꼬이므로 그 항목은 체크하지 않습니다.","w":"로컬에 README가 이미 있으므로 'Add a README file'은 체크 해제합니다. 그래야 첫 push 때 충돌이 없습니다.","an":"6교시 실습 6-2","src":"### [실습 6-2] 원격 저장소 생성\n\n1. GitHub 로그인 후 우측 상단 **+** → **New repository**\n2. 설정:\n - **Repository name**: `my-first-github-repo`\n - **Description**: (선택) 간단한 설명\n - **Public** 선택 (Private도 무료)\n - **Add a README file** **체크 해제** (로컬에 이미 있음)\n - **.gitignore** : None\n - **License**: None\n3. **Create repository** 클릭\n4. 다음 화면에 표시되는 URL 복사 (HTTPS 또는 SSH)"},{"id":"t6-06","ty":"ox","lv":1,"game":true,"p":"<code>git clone<\/code>은 <code>init<\/code>과 <code>remote add<\/code>를 한 번에 처리한다.","a":true,"h":"실습 6-5에서 clone한 폴더에서 <code>git remote -v<\/code>를 하면 origin이 이미 설정되어 있습니다. 교재는 저장소를 초기화하는 명령과 원격을 연결하는 명령을 한 번에 처리하는 것이 clone이라고 정리합니다.","w":"맞습니다. clone하면 저장소가 만들어지고 origin 원격도 자동 설정됩니다.","an":"6교시 실습 6-5 💡","src":"> 💡 `init` + `remote add`를 한번에 처리하는 것이 `clone`"},{"id":"t6-07","ty":"ox","lv":2,"game":true,"p":"Personal Access Token은 발급 후 언제든 다시 열람할 수 있다.","a":false,"h":"Personal Access Token 발급 단계의 마지막에는 생성된 토큰을 바로 복사해 두라는 안내가 있습니다. 토큰 문자열은 생성 직후 한 번만 화면에 표시되므로 다시 열람할 수 없다는 점을 떠올리세요.","w":"틀렸습니다. 토큰은 한 번만 표시되므로 바로 복사해 두어야 합니다.","an":"6교시 PAT 발급 6단계","src":"### Personal Access Token 인증\n\n최근 GitHub은 **비밀번호 인증을 폐지**했습니다. 대신 **Personal Access Token (PAT)** 사용:\n\n1. GitHub → 우측 상단 프로필 → **Settings**\n2. 좌측 메뉴 최하단 → **Developer settings**\n3. **Personal access tokens** → **Tokens (classic)**\n4. **Generate new token (classic)**\n5. 설정:\n - **Note**: `Git 실습용`\n - **Expiration**: 30 days\n - **Select scopes**: `repo` 체크\n6. **Generate token** → 토큰 복사 (한 번만 표시되니 주의!)\n7. push 시 비밀번호 자리에 토큰 붙여넣기"},{"id":"t6-08","ty":"match","lv":1,"game":false,"p":"원격 명령과 의미를 연결하세요.","pairs":[["git clone URL","원격 저장소 복제(처음 한 번)"],["git push","로컬 커밋을 원격으로 전송"],["git pull","원격 변경을 받아 자동 병합"],["git fetch","원격 변경 가져오기만"]],"h":"정리 표에서 clone은 처음 한 번 원격 저장소를 통째로 복제합니다. push는 로컬 커밋을 밀어 올리고, pull은 끌어와 자동 병합하며, fetch는 원격 변경을 가져오기만 하고 병합하지 않습니다.","w":"clone은 처음 복제, push는 보내기, pull은 받아서 병합, fetch는 받기만 합니다.","an":"6교시 push, pull, fetch, clone 정리","src":"### push, pull, fetch, clone 정리\n\n| 명령어 | 의미 |\n|:---|:---|\n| `git clone URL` | 원격 저장소를 복제 (처음 한번) |\n| `git push` | 로컬 커밋을 원격으로 전송 |\n| `git pull` | 원격 변경 가져와서 자동 병합 (fetch + merge) |\n| `git fetch` | 원격 변경 가져오기만 (병합 안함) |"},{"id":"t6-09","ty":"order","lv":2,"game":false,"p":"Personal Access Token 발급 경로를 순서대로 맞추세요.","steps":["프로필 → Settings","Developer settings","Personal access tokens → Tokens (classic)","Generate new token (classic)","repo 체크 후 Generate token"],"h":"토큰은 GitHub 우측 상단 프로필의 Settings에서 시작해 개발자 설정(Developer settings)으로 들어갑니다. 그 안의 토큰 메뉴에서 classic 토큰을 새로 생성하고, repo 권한을 체크한 뒤 생성 버튼을 누릅니다.","w":"Settings → Developer settings → Tokens (classic) → Generate new token → repo 범위 체크 후 생성합니다.","an":"6교시 Personal Access Token 인증","src":"### Personal Access Token 인증\n\n최근 GitHub은 **비밀번호 인증을 폐지**했습니다. 대신 **Personal Access Token (PAT)** 사용:\n\n1. GitHub → 우측 상단 프로필 → **Settings**\n2. 좌측 메뉴 최하단 → **Developer settings**\n3. **Personal access tokens** → **Tokens (classic)**\n4. **Generate new token (classic)**\n5. 설정:\n - **Note**: `Git 실습용`\n - **Expiration**: 30 days\n - **Select scopes**: `repo` 체크\n6. **Generate token** → 토큰 복사 (한 번만 표시되니 주의!)\n7. push 시 비밀번호 자리에 토큰 붙여넣기"},{"id":"t6-10","ty":"multi","lv":1,"game":true,"p":"실습 6-6 README 템플릿에 들어 있는 섹션을 <b>모두<\/b> 고르세요.","o":["소개","시작하기","기술 스택","라이선스","연봉 정보"],"a":[0,1,2,3],"h":"실습 6-6 템플릿은 프로젝트 소개, 실행 방법(시작하기), 사용한 기술 스택, 작성자 정보, 라이선스 같은 섹션을 이모지 제목으로 구성합니다. 템플릿에 실제로 있는 제목만 고르세요.","w":"템플릿에는 소개·시작하기(설치·실행)·기술 스택·라이선스·작성자가 있습니다.","an":"6교시 실습 6-6","src":"### [실습 6-6] 멋진 README 만들기\n\n```markdown\n# 프로젝트 이름\n## 📖 소개\n프로젝트에 대한 간단한 설명을 적습니다.\n## 🚀 시작하기\n### 설치 방법\n```bash\ngit clone https://github.com/사용자명/프로젝트.git\ncd 프로젝트\nnpm install\n```\n### 실행\n```bash\nnpm start\n```\n## 🛠 기술 스택\n- HTML / CSS / JavaScript\n- React 18\n## 📝 라이선스\nMIT License\n## 👤 작성자\n- 이름: 홍길동\n- GitHub: [@username](https://github.com/username)\n```\n\n```bash\n# 커밋 후 푸시\ngit add README.md\ngit commit -m \"README 작성\"\ngit push\n```\n\n---\n### [미니 과제 6] 포트폴리오 시작하기\n\n1. GitHub에 `portfolio` 저장소 생성"}]},{"id":"t7","title":"협업 워크플로우","ref":"7교시","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"오픈소스나 외부 기여에 적합한 협업 방식은?","o":["공동 작업자로 직접 push","Fork & Pull Request","reset으로 이력 정리","stash로 공유"],"a":1,"h":"7.1은 두 협업 방식을 비교합니다. 같은 팀이면 직접 push 권한을 주는 방식을 쓰고, 오픈소스나 외부 기여처럼 신뢰 관계가 없을 때는 원본을 복사해 작업한 뒤 반영을 요청하는 안전한 방식을 씁니다.","w":"Fork & PR은 안전하지만 단계가 많고, 신뢰 관계의 팀은 Collaborator로 직접 push 권한을 줍니다.","an":"7교시 7.1 협업 방식 비교","src":"### 방법 2: Fork & Pull Request\n- 오픈소스, 외부 기여\n- 원본을 **복사**해서 작업 → 본인 저장소에 push → 원본에 PR 요청\n- 안전하지만 단계 많음"},{"id":"t7-02","ty":"mc","lv":2,"game":true,"p":"저장소 소유자가 협업자를 초대하는 메뉴는?","o":["Settings → Collaborators","Code → Download ZIP","Issues → New issue","Actions → Run"],"a":0,"h":"실습 7-1에서 저장소 소유자 A는 본인 저장소의 Settings로 들어가 협업자를 관리하는 메뉴를 엽니다. 거기서 짝의 GitHub 사용자명을 입력해 초대하면 B가 이메일로 수락합니다.","w":"Settings → Collaborators → Add people에서 상대의 GitHub 사용자명으로 초대합니다.","an":"7교시 실습 7-1","src":"### [실습 7-1] 협업자 초대\n\n**시나리오**: 2명씩 짝을 지어 실습 (강사가 짝 지정)\n\n**A 학생 (저장소 소유자)**:\n1. 본인 GitHub 저장소 → **Settings** → **Collaborators**\n2. **Add people** → B의 GitHub 사용자명 입력 → 초대\n3. B의 이메일/알림으로 초대장 전송됨\n\n**B 학생 (초대받은 협업자)**:\n1. 초대 수락 (이메일 링크 또는 알림)\n2. A의 저장소 클론\n```bash\ncd ~/Desktop\ngit clone https://github.com/A사용자명/저장소.git collab-test\ncd collab-test\n```\n3. 파일 수정, 커밋, 푸시\n```bash"},{"id":"t7-03","ty":"mc","lv":2,"game":true,"p":"Fork한 저장소에서 원본 저장소를 추적하려고 추가하는 원격 이름은?","o":["origin","main","upstream","forkbase"],"a":2,"h":"Fork한 저장소에서 origin은 내 Fork를 가리킵니다. 원본 저장소를 따로 추적하려면 강의 '상류'라는 뜻의 이름으로 원격을 추가하고, 이 원격에서 fetch와 merge로 최신 변경을 받습니다.","w":"본인 Fork는 origin, 원본은 upstream으로 추가해 <code>git fetch upstream<\/code>으로 최신 변경을 받습니다.","an":"7교시 upstream 설정","src":"# 원본 저장소를 upstream으로 추가\ngit remote add upstream https://github.com/원본소유자/저장소.git\n# 확인\ngit remote -v\n# origin https://github.com/내계정/저장소.git (fetch, push)\n# upstream https://github.com/원본소유자/저장소.git (fetch, push)\n# 원본의 최신 변경 가져오기\ngit fetch upstream\ngit merge upstream/main\n# 본인 Fork에도 반영"},{"id":"t7-04","ty":"mc","lv":2,"game":true,"p":"PR 설명에 <code>Fixes #123<\/code>을 쓰면 어떻게 되나요?","o":["이슈 #123이 새로 생성됨","머지 시 이슈 #123 자동 종료","123번 커밋이 되돌려짐","리뷰어가 123명 지정됨"],"a":1,"h":"GitHub PR 단축 기능에서 PR 설명에 '고친다'는 키워드와 이슈 번호를 함께 쓰면 그 PR이 해당 이슈와 연결됩니다. 교재는 이 PR이 머지될 때 연결된 이슈가 어떻게 처리된다고 설명하는지 떠올리세요.","w":"Fixes #123을 쓰면 PR이 머지될 때 이슈 #123이 자동으로 닫힙니다.","an":"7교시 GitHub PR 단축 기능","src":"### GitHub PR 단축 기능\n- `Fixes #123`: PR 머지 시 이슈 #123 자동 종료\n- `Co-authored-by`: 공동 작성자 표시\n- 리뷰어 지정 (Reviewers)\n- 라벨 추가 (bug, feature, docs 등)"},{"id":"t7-05","ty":"mc","lv":3,"game":false,"p":"교재가 '좋은 리뷰 코멘트'로 든 예에 가장 가까운 것은?","o":["이 코드 별로네","다시 짜 오세요","리뷰 없이 바로 머지","data→userList처럼 변수명을 명확히 하면 좋겠어요"],"a":3,"h":"7.5는 '이 코드 별로네'처럼 감정만 드러내는 코멘트를 나쁜 예로 듭니다. 좋은 코멘트는 무엇을 왜 고치면 좋은지 이유를 말하고 구체적인 개선 예시까지 함께 제시합니다.","w":"좋은 코멘트는 구체적인 개선 방향과 예시를 제시합니다. '별로네'는 나쁜 예입니다.","an":"7교시 7.5 좋은 리뷰 코멘트","src":"### 좋은 리뷰 코멘트\n- ❌ \"이 코드 별로네\"\n- ✅ \"여기서 변수명을 더 명확하게 하면 가독성이 좋아질 것 같아요. 예: `data` → `userList`\""},{"id":"t7-06","ty":"ox","lv":1,"game":true,"p":"공동 작업자(Collaborator) 방식은 빠르지만 사고 위험이 크다.","a":true,"h":"7.1 방법 1의 공동 작업자 방식은 같은 팀처럼 신뢰 관계일 때 저장소에 직접 push 권한을 줍니다. 단계가 적어 빠르지만 누구나 바로 원본을 바꿀 수 있어 사고 위험이 화살표(↑)로 표시되어 있습니다.","w":"맞습니다. 바로 push할 수 있어 빠르지만 실수가 곧바로 원본에 반영됩니다.","an":"7교시 7.1 방법 1","src":"### 방법 1: 공동 작업자 (Collaborator)\n- 같은 팀, 같은 회사 등 신뢰 관계\n- 저장소에 직접 push 권한 부여\n- 빠르지만 사고 위험 ↑"},{"id":"t7-07","ty":"ox","lv":2,"game":true,"p":"Fork는 원본 저장소를 직접 수정하는 기능이다.","a":false,"h":"Fork & Pull Request 방식은 원본을 '복사'해서 작업한다고 설명합니다. 실습 7-2에서 Fork를 누르면 본인 계정 아래에 저장소가 생기고, 그곳에 push한 뒤 원본에는 PR로 반영을 요청할 뿐입니다.","w":"틀렸습니다. Fork는 원본을 본인 계정으로 복사하는 것이고, 원본 반영은 Pull Request로 요청합니다.","an":"7교시 실습 7-2 1단계","src":"### 방법 2: Fork & Pull Request\n- 오픈소스, 외부 기여\n- 원본을 **복사**해서 작업 → 본인 저장소에 push → 원본에 PR 요청\n- 안전하지만 단계 많음"},{"id":"t7-08","ty":"match","lv":2,"game":false,"p":"협업 용어와 설명을 연결하세요.","pairs":[["Collaborator","저장소에 직접 push 권한"],["Fork","원본을 본인 계정으로 복사"],["Pull Request","원본에 변경 반영을 요청"],["upstream","Fork 후 원본을 가리키는 원격"]],"h":"공동 작업자는 원본 저장소에 직접 push할 권한을 받은 사람입니다. Fork는 원본을 내 계정으로 복사하는 것, Pull Request는 원본에 변경 반영을 요청하는 것, upstream은 Fork 후 원본을 가리키도록 추가한 원격 이름입니다.","w":"Collaborator는 직접 push, Fork는 복사, PR은 반영 요청, upstream은 원본 저장소를 가리키는 원격 이름입니다.","an":"7교시 7.1 · 7.3 · upstream 설정","src":"### 방법 2: Fork & Pull Request\n- 오픈소스, 외부 기여\n- 원본을 **복사**해서 작업 → 본인 저장소에 push → 원본에 PR 요청\n- 안전하지만 단계 많음"},{"id":"t7-09","ty":"order","lv":2,"game":false,"p":"Fork & Pull Request 5단계를 순서대로 맞추세요.","steps":["원본 저장소 Fork","본인 Fork를 Clone","브랜치 만들어 작업 후 push","Pull Request 생성","원본 소유자 리뷰 & 머지"],"h":"실습 7-2는 친구 저장소를 내 계정으로 복사하는 것부터 시작합니다. 그 복사본을 내 PC로 받아 새 브랜치에서 작업해 push하고, GitHub에서 PR을 만든 뒤 원본 소유자가 리뷰하고 머지합니다.","w":"Fork → Clone → 브랜치 작업·push → PR 생성 → 소유자 리뷰·머지 순서입니다.","an":"7교시 실습 7-2","src":"### [실습 7-2] Fork 실습\n\n**시나리오**: 짝 바꿔서 다른 친구의 저장소에 PR 보내기\n\n**1단계: Fork**\n1. 다른 친구의 GitHub 저장소 페이지로 이동\n2. 우측 상단 **Fork** 클릭\n3. 본인 계정으로 복사됨\n\n**2단계: Clone (본인 Fork)**\n```bash\ncd ~/Desktop\ngit clone https://github.com/본인사용자명/저장소.git fork-test\ncd fork-test\n```\n\n**3단계: 브랜치 생성 및 작업**\n```bash\ngit switch -c feature/my-contribution\n# 파일 수정\necho \"친구의 프로젝트에 기여합니다!\" >> CONTRIBUTORS.md\ngit add .\ngit commit -m \"CONTRIBUTORS 파일 추가\"\n# 본인 Fork에 푸시\ngit push -u origin feature/my-contribution\n```\n\n**4단계: Pull Request 생성**\n1. 본인 GitHub Fork 페이지로 이동\n2. 노란색 배너의 **Compare & pull request** 클릭"},{"id":"t7-10","ty":"multi","lv":1,"game":true,"p":"PR 작성 체크리스트에 있는 항목을 <b>모두<\/b> 고르세요.","o":["제목이 명확한가","변경 내용을 설명했는가","관련 이슈를 링크했는가","테스트했는가","커밋이 10개 이상인가"],"a":[0,1,2,3],"h":"PR 작성 시 체크리스트에는 제목의 명확성, 변경 내용 설명, 관련 이슈 링크(#123 형식), 테스트 여부, UI 변경 시 스크린샷 필요 여부가 있습니다. 리뷰어가 PR을 이해하고 믿을 수 있게 하는 항목을 고르세요.","w":"제목·설명·이슈 링크·테스트·(UI 변경 시) 스크린샷이 체크리스트입니다. 커밋 개수는 기준이 아닙니다.","an":"7교시 PR 작성 시 체크리스트","src":"### PR 작성 시 체크리스트\n- [ ] 제목이 명확한가?\n- [ ] 변경 내용을 설명했는가?\n- [ ] 관련 이슈를 링크했는가? (`#123` 형식)\n- [ ] 테스트했는가?\n- [ ] 스크린샷이 필요한가? (UI 변경 시)"}]},{"id":"t8","title":"stash·tag·rebase와 실전","ref":"8교시","qs":[{"id":"t8-01","ty":"mc","lv":1,"game":true,"p":"작업 중인 변경을 커밋하지 않고 잠시 치워 두는 명령은?","o":["git stash","git tag","git rebase","git cherry-pick"],"a":0,"h":"8.1은 커밋하지 않은 변경을 잠시 다른 곳에 보관했다가 나중에 다시 꺼내는 '임시 저장' 명령을 다룹니다. 이 명령을 실행하면 작업 영역이 깨끗해지고 <code>list<\/code>, <code>pop<\/code> 등으로 관리합니다.","w":"<code>git stash<\/code>로 임시 저장하고 급한 일을 한 뒤 <code>git stash pop<\/code>으로 꺼냅니다.","an":"8교시 8.1 git stash","src":"### stash 주요 명령어\n\n```bash\ngit stash # 임시 저장\ngit stash save \"메시지\" # 메시지와 함께 저장\ngit stash list # 목록 보기\ngit stash show stash@{0} # 내용 보기\ngit stash pop # 가장 최근 stash 꺼내기 (목록에서 삭제)\ngit stash apply stash@{0} # 적용만 (목록 유지)\ngit stash drop stash@{0} # 특정 stash 삭제\ngit stash clear # 전체 삭제\n```"},{"id":"t8-02","ty":"mc","lv":2,"game":true,"p":"<code>git stash pop<\/code>의 동작은?","o":["적용만 하고 목록 유지","최근 stash를 꺼내고 목록에서 삭제","모든 stash 삭제","stash 내용만 보기"],"a":1,"h":"stash 주요 명령어에서 apply는 stash를 적용만 하고 목록에 그대로 남깁니다. pop은 가장 최근 stash를 적용하면서 동시에 목록에서도 지운다는 점이 apply와의 차이입니다.","w":"pop은 꺼내면서 목록에서 지우고, apply는 적용만 하고 목록에 남깁니다.","an":"8교시 stash 주요 명령어","src":"### stash 주요 명령어\n\n```bash\ngit stash # 임시 저장\ngit stash save \"메시지\" # 메시지와 함께 저장\ngit stash list # 목록 보기\ngit stash show stash@{0} # 내용 보기\ngit stash pop # 가장 최근 stash 꺼내기 (목록에서 삭제)\ngit stash apply stash@{0} # 적용만 (목록 유지)\ngit stash drop stash@{0} # 특정 stash 삭제\ngit stash clear # 전체 삭제\n```"},{"id":"t8-03","ty":"mc","lv":2,"game":true,"p":"시맨틱 버저닝 <code>v1.2.3<\/code>에서 가운데 숫자 2의 의미는?","o":["PATCH: 버그 수정","MAJOR: 큰 변경","MINOR: 기능 추가","빌드 번호"],"a":2,"h":"시맨틱 버저닝은 v MAJOR.MINOR.PATCH 형식입니다. 맨 앞은 호환이 깨지는 큰 변경, 맨 뒤는 버그 수정이고, 가운데 숫자는 호환을 유지하면서 무언가를 더했을 때 올립니다.","w":"1은 MAJOR(호환이 깨지는 큰 변경), 2는 MINOR(호환 유지 기능 추가), 3은 PATCH(버그 수정)입니다.","an":"8교시 Semantic Versioning","src":"### Semantic Versioning (시맨틱 버저닝)\n\n```\nv 1 . 2 . 3\n │ │ └─ PATCH: 버그 수정\n │ └───── MINOR: 기능 추가 (호환 유지)\n └───────── MAJOR: 큰 변경 (호환 깨짐)\n```"},{"id":"t8-04","ty":"mc","lv":2,"game":true,"p":"방금 한 커밋의 메시지만 고치는 명령은?","o":["git revert HEAD","git reset --hard HEAD~1","git tag -a v1","git commit --amend -m"],"a":3,"h":"8.4 문제 1은 마지막 커밋 메시지를 잘못 쓴 상황입니다. commit 명령에 '고치다'라는 뜻의 옵션을 붙이고 -m으로 새 메시지를 주면 새 커밋을 추가하지 않고 직전 커밋의 메시지만 바뀝니다.","w":"<code>git commit --amend -m \"새 메시지\"<\/code>로 최근 커밋 메시지를 수정합니다. 빠뜨린 파일은 add 후 <code>--amend --no-edit<\/code>로 넣습니다.","an":"8교시 8.4 문제 1","src":"# 가장 최근 커밋 메시지 수정\ngit commit --amend -m \"수정된 메시지\"\n```"},{"id":"t8-05","ty":"mc","lv":3,"game":true,"p":"잘못된 브랜치에 한 커밋을 올바른 브랜치로 가져오는 명령은?","o":["git stash pop","git cherry-pick 해시","git fetch upstream","git push --tags"],"a":1,"h":"문제 3은 커밋 해시를 먼저 저장하고, 잘못 커밋한 브랜치에서 그 커밋을 되돌린 뒤 올바른 브랜치로 이동합니다. 마지막에 저장한 해시의 커밋 하나만 '골라 따 오는' 명령으로 가져옵니다.","w":"커밋 해시를 적어 두고 reset으로 되돌린 뒤, 올바른 브랜치에서 <code>git cherry-pick 해시<\/code>로 가져옵니다.","an":"8교시 8.4 문제 3","src":"### 문제 3: 잘못된 브랜치에 커밋함\n```bash\n# 1. 최근 커밋 해시 저장\ngit log --oneline # 예: abc1234\n# 2. 잘못 커밋한 브랜치에서 되돌리기\ngit reset --hard HEAD~1\n# 3. 올바른 브랜치로 이동\ngit switch correct-branch\n# 4. 커밋 가져오기\ngit cherry-pick abc1234\n```"},{"id":"t8-06","ty":"ox","lv":1,"game":true,"p":"주석 태그(annotated tag)는 <code>git tag -a<\/code>로 만들며 교재가 권장한다.","a":true,"h":"실습 8-2에는 이름만 붙이는 가벼운 태그와 <code>-a<\/code>, <code>-m<\/code>으로 메시지까지 남기는 태그가 나옵니다. 교재 주석에 어느 쪽에 '권장' 표시가 붙어 있는지 확인하세요.","w":"맞습니다. 메시지를 담는 주석 태그가 권장되고, 이름만 붙이는 가벼운 태그도 있습니다.","an":"8교시 실습 8-2","src":"# 주석 태그 (annotated tag, 권장)\ngit tag -a v1.1.0 -m \"버전 1.1.0 릴리스\"\n# 태그 목록\ngit tag\n# 특정 태그 정보\ngit show v1.1.0\n# 원격에 태그 푸시\ngit push origin v1.1.0\n# 모든 태그 푸시\ngit push origin --tags\n# 태그 삭제\ngit tag -d v1.0.0\ngit push origin --delete v1.0.0\n```"},{"id":"t8-07","ty":"ox","lv":2,"game":true,"p":"이미 push해서 다른 사람이 받아간 커밋도 rebase로 깔끔하게 정리하는 것이 좋다.","a":false,"h":"rebase는 커밋을 다시 써서 이력을 직선으로 정리합니다. 교재의 rebase 황금률은 이미 push해서 다른 사람이 받아 간 커밋을 어떻게 다뤄야 하는지 강하게 경고합니다.","w":"틀렸습니다. 다른 사람이 받아간 커밋은 절대 rebase하지 않습니다. rebase는 이력을 바꾸기 때문입니다.","an":"8교시 8.3 rebase 황금률","src":"# 그래프 확인 - 직선이 됨\ngit log --oneline --all --graph\n```\n\n> ⚠️ **rebase 황금률**: 이미 push해서 다른 사람이 받아간 커밋은 절대 rebase하지 말 것!"},{"id":"t8-08","ty":"match","lv":2,"game":false,"p":"stash 명령과 동작을 연결하세요.","pairs":[["git stash list","목록 보기"],["git stash apply","적용만(목록 유지)"],["git stash drop","특정 stash 삭제"],["git stash clear","전체 삭제"]],"h":"stash 주요 명령어에서 list는 목록 보기, show는 내용 보기입니다. apply는 적용만 하고 목록에 남기며, drop은 특정 stash 하나를 버리고, clear는 모든 stash를 비웁니다.","w":"list는 목록, apply는 목록을 남긴 채 적용, drop은 하나 삭제, clear는 전체 삭제입니다.","an":"8교시 stash 주요 명령어","src":"### stash 주요 명령어\n\n```bash\ngit stash # 임시 저장\ngit stash save \"메시지\" # 메시지와 함께 저장\ngit stash list # 목록 보기\ngit stash show stash@{0} # 내용 보기\ngit stash pop # 가장 최근 stash 꺼내기 (목록에서 삭제)\ngit stash apply stash@{0} # 적용만 (목록 유지)\ngit stash drop stash@{0} # 특정 stash 삭제\ngit stash clear # 전체 삭제\n```"},{"id":"t8-09","ty":"order","lv":2,"game":false,"p":"교재의 '협업 워크플로우 요약'을 순서대로 맞추세요.","steps":["main으로 이동 후 git pull","git switch -c feature/내작업","add·commit 반복","git push -u origin feature/내작업","GitHub에서 PR 생성","리뷰 & 머지 후 로컬 브랜치 정리"],"h":"협업 워크플로우는 main에서 최신 내용을 받는 것으로 시작해 작업 브랜치를 만들고, add·commit을 반복합니다. 그 브랜치를 원격에 push하고 GitHub에서 PR을 만든 뒤, 머지되면 로컬 브랜치를 정리합니다.","w":"최신 상태를 받고, 작업 브랜치에서 커밋한 뒤 push하고 PR을 만들어 리뷰·머지 후 로컬 브랜치를 지웁니다.","an":"8교시 협업 워크플로우 요약","src":"### 협업 워크플로우 요약\n\n```bash\n# 1. 최신 상태 받기\ngit switch main\ngit pull\n# 2. 작업 브랜치 만들기\ngit switch -c feature/내작업\n# 3. 작업 & 커밋 반복\ngit add .\ngit commit -m \"작업 내용\"\n# 4. 원격에 푸시\ngit push -u origin feature/내작업\n# 5. GitHub에서 PR 생성\n# 6. 리뷰 & 머지\n# 7. 로컬 브랜치 정리\ngit switch main\ngit pull\ngit branch -d feature/내작업\n```"},{"id":"t8-10","ty":"multi","lv":2,"game":true,"p":"종합 미니 프로젝트(GitHub Pages 블로그)에 대한 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["저장소 이름은 사용자명.github.io","Settings → Pages에서 활성화","Branch는 main / (root)","반드시 Private 저장소","배포 후 v1.0.0 태그 달기"],"a":[0,1,2,4],"h":"종합 미니 프로젝트는 '사용자명.github.io' 이름의 Public 저장소를 만들고 Settings의 Pages 메뉴에서 배포를 켭니다. 이때 브랜치는 main과 루트 폴더를 고르고, 배포가 끝나면 v1.0.0 태그를 달아 push합니다.","w":"저장소 이름은 사용자명.github.io, Public으로 만들고, Settings → Pages에서 main / (root)로 배포한 뒤 v1.0.0 태그를 답니다.","an":"8교시 8.5 종합 미니 프로젝트","src":"**1단계: 저장소 생성**\n1. GitHub에서 새 저장소 생성\n2. 이름: `사용자명.github.io` (정확히 본인 사용자명!)\n3. Public 선택, README 추가\n4. 로컬에 클론\n```bash\ncd ~/Desktop\ngit clone https://github.com/사용자명/사용자명.github.io.git\ncd 사용자명.github.io\n```\n**2단계: 기본 페이지 만들기**\n`index.html` 생성:\n```html\n<!DOCTYPE html>\n\n\n \n 나의 블로그\n \n\n\n \n 안녕하세요, 홍길동입니다 👋\n \n 홈\n 소개\n \n \n \n \n 최근 글\n Git 8시간 마스터하기!"}]}]};

const TYPES={mc:['객관식','--ty-mc'],multi:['복수 선택','--ty-multi'],ox:['O / X','--ty-ox'],match:['짝 맞추기','--ty-match'],order:['순서 맞추기','--ty-order'],num:['계산','--ty-num']};

  match:'왼쪽 항목을 누른 뒤 짝이 되는 오른쪽 항목을 누르세요. 연결된 항목을 다시 누르면 풀립니다.',
  order:'첫 번째부터 순서대로 클릭하세요. 번호가 붙은 항목을 다시 누르면 그 번호부터 뒤 번호가 지워집니다.',num:'숫자만 입력하세요.'};

/* ── 저장소 (실패해도 동작) ─────────────── */
const KEY='qb:'+BANK.id+':v1';
const blank=()=>({name:'',tabs:{},wrong:{},board:[],drafts:{}});  // drafts: 채점 전 탭별 풀던 답
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw));}catch(e){}
try{const u=window.QB&&QB.user();if(!S.name&&u&&u.name)S.name=u.name;}catch(e){}  // 로그인 이름 동기화(사용자가 동작하기 전엔 저장하지 않음)
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const gameUnlocked=()=>Object.keys(S.tabs).length>0;
const allGraded=()=>TABS.every(t=>S.tabs[t.id]);

/* 순위 저장소 — 공유 순위로 바꿀 때 이 객체만 교체 */
// 순위는 같은 조건(게임 모드 + 풀이 시간)끼리만 비교한다. key = 'timeattack:10'
const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function say(msg){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=msg,30);}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('📋 클립보드에 복사했습니다');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'📋 클립보드에 복사했습니다':'복사하지 못했습니다. 인쇄 기능을 이용하세요.');
}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

function addWrong(id,ans){const w=S.wrong[id]||{n:0};w.n++;w.last=ans;w.at=Date.now();w.solved=false;S.wrong[id]=w;}
function markSolved(id){if(S.wrong[id]&&!S.wrong[id].solved){S.wrong[id].solved=true;S.wrong[id].at=Date.now();}}
const wrongList=solved=>Object.keys(S.wrong).filter(id=>QMAP[id]&&!!S.wrong[id].solved===solved)
  .sort((a,b)=>QTAB[a].idx-QTAB[b].idx||ALLQ.indexOf(QMAP[a])-ALLQ.indexOf(QMAP[b]));

/* ── 문항 풀이 상태(학습·재도전 공용) ───── */
let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

function cardHTML(q,n){
  const [label,color]=TYPES[q.ty];
  const g=cur.graded, a=cur.ans[q.id], fa=finalAns(q), ok=g&&isCorrect(q,fa);
  const lock=g?' disabled':'';
  let body='';
  if(q.ty==='mc'||q.ty==='multi'){
    const multi=q.ty==='multi', mine=multi?(a||[]):[a];
    body='<div class="opts">'+q.o.map((o,i)=>{
      const right=multi?q.a.includes(i):q.a===i, picked=mine.includes(i);
      const cls=g?(right?' ans':picked?' miss':''):'';
      return `<label class="opt${cls}"><span class="onum">${i+1}</span><input type="${multi?'checkbox':'radio'}" name="r-${q.id}" data-act="${multi?'tick':'pick'}" data-q="${q.id}" data-i="${i}"${picked?' checked':''}${lock}><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(q.ty==='ox'){
    body='<div class="ox">'+[true,false].map(v=>{
      const cls=g?(q.a===v?' ans':a===v?' miss':''):'';
      return `<button type="button" class="${cls.trim()}" data-act="ox" data-q="${q.id}" data-v="${v?1:0}" data-fk="${q.id}-ox${v?1:0}" aria-pressed="${a===v}" aria-label="${v?'맞다 O':'틀리다 X'}"${lock}>${v?'O':'X'}</button>`;
    }).join('')+'</div>';
  }else if(q.ty==='match'){
    const m=a||{}, sel=cur.msel[q.id], linkedBy={};
    Object.entries(m).forEach(([l,r])=>linkedBy[r]=+l);
    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${PAL[i%PAL.length]})" data-act="ml" data-q="${q.id}" data-i="${i}" data-fk="${q.id}-l${i}"${lock}><span class="tag">${LETTER[i]}</span>${esc(p[0])}</button>`;
    }).join('');
    const right=cur.shuf[q.id].map(j=>{
      const by=linkedBy[j], linked=by!=null, cls=(linked?' linked':'')+(g&&linked?(by===j?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${linked?PAL[by%PAL.length]:'--line'})" data-act="mr" data-q="${q.id}" data-j="${j}" data-fk="${q.id}-r${j}"${lock}><span class="tag">${linked?LETTER[by]:''}</span>${esc(q.pairs[j][1])}</button>`;
    }).join('');
    body=`<div class="match"><div class="mcol mleft">${left}</div><div class="mcol mright">${right}</div></div>`;
  }else if(q.ty==='order'){
    const seq=a||[], full=seq.length===q.steps.length;
    body='<div class="olist">'+(cur.shuf[q.id]||range(q.steps.length)).map(si=>{
      const pos=seq.indexOf(si), on=pos>=0;
      const cls=(on?' on':'')+(g?(pos===si?' ok':' no'):'');
      const fix=g&&pos!==si?`<span class="ofix">정답 ${si+1}</span>`:'';
      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }
  const numAns=q.ty==='mc'?`${q.a+1}번 · `:q.ty==='multi'?q.a.map(i=>i+1).join('·')+'번 · ':'';
  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${mediaHTML(q)}${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>${voiceRow(q,q.id)}`}${body}${exp}</article>`;
}
const LV_NAME=['쉬움','보통','어려움'];
function lvHTML(lv){
  lv=lv||1;
  const dots=[1,2,3].map(k=>k<=lv?`<i class="d${k}">●</i>`:'<i class="off">○</i>').join('');
  return `<span class="lv lv${lv}" title="난이도 ${LV_NAME[lv-1]}"><span class="dots" aria-hidden="true">${dots}</span><em>${LV_NAME[lv-1]}</em></span>`;
}
// 자료 발췌: 이스케이프 후 마크다운 기호만 가볍게 서식으로 (**굵게**, `코드`, 머리 #)
const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
function hintHTML(q){
  if(!q.h)return '';
  const open=cur.hints.has(q.id), label=q.ty==='num'?'Hint · 계산식':'Hint';
  // 2단계: ① 자세한 힌트(h) ② 자료 보기 — 자료 원문 발췌(src) + 위치(an)
  const sopen=cur.srcs.has(q.id);
  const src=q.src?`<div class="srcwrap"><button type="button" class="srcbtn" data-act="src" data-q="${q.id}" data-fk="${q.id}-src" aria-expanded="${sopen}" aria-controls="src-${q.id}">`+
    `<span class="caret" aria-hidden="true">${sopen?'▾':'▸'}</span>📖 자료 보기</button>`+
    (sopen?`<blockquote class="src" id="src-${q.id}"><p>${srcText(q.src)}</p>${q.an?`<cite>${esc(q.an)}</cite>`:''}</blockquote>`:'')+`</div>`:'';
  return `<div class="hintwrap"><button type="button" class="hintbtn" data-act="hint" data-q="${q.id}" data-fk="${q.id}-hint" aria-expanded="${open}" aria-controls="hint-${q.id}">`+
    `<span class="caret" aria-hidden="true">${open?'▾':'▸'}</span>${label}</button>`+
    (open?`<div class="hint" id="hint-${q.id}">${q.h}${src}</div>`:'')+`</div>`;
}
function refreshCard(q){
  const el=document.getElementById('card-'+q.id);if(!el)return;
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  el.outerHTML=cardHTML(q,el.dataset.n);
  if(fk){const f=app.querySelector(`[data-fk="${fk}"]`);if(f&&!f.disabled)f.focus();}
  updateProgress();
}
const pad2=n=>String(n).padStart(2,'0');
const fmtCnt=(n,t)=>`(${pad2(n)}/${pad2(t)})`;
// 탭별 푼 문항 수: 지금 보는 탭 → 화면 상태, 그 외 → 풀던 답(drafts) → 채점 기록
function tabAnswered(t){
  const src=cur&&cur.mode==='study'&&cur.tab===t?cur.ans:(S.drafts[t.id]||(S.tabs[t.id]&&S.tabs[t.id].answers)||{});
  return t.qs.filter(q=>isAnswered(q,src[q.id])).length;
}
function updateProgress(){
  const p=document.getElementById('pbar');if(!p||!cur)return;
  const n=cur.list.filter(answered).length, cnt=fmtCnt(n,cur.list.length);
  p.style.width=pct(n,cur.list.length)+'%';
  document.getElementById('ptxt').textContent=`${n} / ${cur.list.length} 응답`;
  const g=document.getElementById('gradeCnt');if(g)g.textContent=cnt;
  if(cur.mode==='study'){
    const c=document.getElementById('qc-'+cur.tab.id);if(c)c.textContent=cnt;
    if(!cur.graded){  // 풀던 답 저장 → 탭을 옮겨도 유지
      if(n||Object.keys(cur.ans).some(k=>{const v=cur.ans[k];return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:v!=null&&v!=='';}))
        S.drafts[cur.tab.id]=JSON.parse(JSON.stringify(cur.ans));
      else delete S.drafts[cur.tab.id];
      save();
    }
  }
}

/* ── 음성 선택 · 문제 읽기 · 그림/오디오 (qb-voice.js가 없으면 모두 숨김) ── */
const hasVoice=()=>!!(window.QBVoice&&QBVoice.supported());
const hasRead=()=>!!(window.QBVoice&&QBVoice.canSpeak());
const IC_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const IC_VOL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const VC=new Map();  // 학습 모드 문항별 음성 컨트롤러
function voiceReset(){VC.clear();if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}}
function voiceRow(q,fkp){
  const mic=hasVoice()&&['mc','multi','ox'].includes(q.ty), rd=hasRead();
  if(!mic&&!rd)return '';
  const qa=fkp?` data-q="${q.id}"`:'';
  return `<div class="vrow noprint">`+
    (mic?`<button type="button" class="vbtn vmic" data-act="vmic"${qa} data-fk="${fkp}-vmic" data-state="idle" aria-pressed="false">${IC_MIC}<span>말하기</span></button>`:'')+
    (rd?`<button type="button" class="vbtn" data-act="vread"${qa} data-fk="${fkp}-vread">${IC_VOL}<span>문제 읽기</span></button>`:'')+
    (mic?`<span class="vstat" aria-live="polite"></span><span class="vhint">말하기 어려우면 눌러서 고르세요</span>`:'')+`</div>`;
}
function mediaHTML(q){
  let h='';
  if(q.img&&q.img.src)h+=`<figure class="qfig"><img src="${esc(q.img.src)}" alt="${esc(q.img.alt)}" loading="lazy">${q.img.caption?`<figcaption>${esc(q.img.caption)}</figcaption>`:''}</figure>`;
  if(q.audio&&q.audio.src)h+=`<div class="qaud"><audio controls preload="none" src="${esc(q.audio.src)}"></audio><details><summary>대본</summary><p>${esc(q.audio.transcript)}</p></details></div>`;
  return h;
}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
// 읽어 줄 글: 문제 + 화면에 보이는 순서의 보기("1번 …")
function readText(q,n,order){
  let t=(n?`${n}번 문제. `:'')+plain(q.p)+'.';
  if(q.img&&q.img.alt)t+=' 그림 설명. '+q.img.alt+'.';
  if(q.ty==='ox')t+=' 맞으면 O, 틀리면 X.';
  else if(q.ty==='mc'||q.ty==='multi')t+=(order||range(q.o.length)).map((oi,k)=>` ${k+1}번. ${plain(q.o[oi])}.`).join('');
  return t;
}
function readAloud(text){if(QBVoice.isSpeaking())QBVoice.cancelSpeak();else QBVoice.speak(text);}
// 음성으로 고른 것 = 보기를 직접 누른 것과 같은 경로(입력 click → 기존 change/click 처리)
function voicePick(q,r){
  if(!cur||cur.graded)return;
  const card=document.getElementById('card-'+q.id);if(!card)return;
  const el=r.kind==='ox'?card.querySelector(`[data-act="ox"][data-v="${r.v==='O'?1:0}"]`):card.querySelector(`input[data-i="${r.i}"]`);
  if(el&&!el.disabled)el.click();
}
function studyVoice(q){
  let c=VC.get(q.id);if(c)return c;
  const card=()=>document.getElementById('card-'+q.id);
  c=QBVoice.attach({bind:false,button:()=>card()&&card().querySelector('.vmic'),live:()=>card()&&card().querySelector('.vstat'),
    getOptions:()=>q.ty==='ox'?2:q.o.length,getType:()=>q.ty,select:r=>voicePick(q,r)});
  VC.set(q.id,c);return c;
}

/* 학습 화면 상호작용 */
function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;
  else if(el.dataset.act==='tick'){
    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);
  }
  cur.armed=false;updateProgress();
}
function onSheetInput(el){
  if(el.dataset.act==='num'&&!cur.graded){cur.ans[el.dataset.q]=el.value;cur.armed=false;updateProgress();}
}

/* ── 화면: 학습 ────────────────────────── */
function viewStudy(tid,fresh){
  const tab=TABS.find(t=>t.id===tid)||TABS[0];
  cur=newSheet('study',tab.qs,tab);
  const rec=S.tabs[tab.id], draft=S.drafts[tab.id];
  if(fresh){delete S.drafts[tab.id];save();}
  else if(draft){Object.assign(cur.ans,JSON.parse(JSON.stringify(draft)));}  // 풀던 중이면 이어서
  else if(rec&&rec.answers){
    Object.assign(cur.ans,JSON.parse(JSON.stringify(rec.answers)));
    (rec.touched||[]).forEach(id=>cur.touched.add(id));
    cur.graded=true;
  }
  renderSheet();
}
function renderSheet(){
  voiceReset();
  const study=cur.mode==='study', tab=cur.tab;
  const tabbar=study?`<nav class="tabbar noprint" role="tablist" aria-label="탭">${TABS.map((t,i)=>{const r=S.tabs[t.id];
      return `<a class="tabchip" role="tab" href="#study/${t.id}" aria-selected="${t===tab}"><b>${i+1}</b><span class="tl">${esc(t.title)}</span><span class="qc" id="qc-${t.id}">${fmtCnt(tabAnswered(t),t.qs.length)}</span>${r?`<span class="sc" title="채점 점수">✓${r.score}</span>`:''}</a>`;}).join('')}
      ${allGraded()?'<a class="tabchip sum" href="#summary">★ 종합</a>':''}</nav>`:'';
  const head=study?`<div class="tabhead"><h2>${tab.idx+1}. ${esc(tab.title)}</h2>${tab.ref?`<span class="part">${esc(tab.ref)}</span>`:''}</div>`
                  :`<div class="tabhead"><h2>🔁 오답 다시 풀기</h2><span class="part">${cur.list.length}문항</span></div>`;
  const next=study?(tab.idx+1<TABS.length?`<a class="btn" href="#study/${TABS[tab.idx+1].id}">다음 탭 →</a>`:(allGraded()?'<a class="btn" href="#summary">★ 종합 결과</a>':'')):'<a class="btn" href="#notes">오답노트로</a>';
  app.innerHTML=`<div class="sheet">

function gradeSheet(){
  const miss=cur.list.map((q,i)=>answered(q)?0:i+1).filter(Boolean);
  if(miss.length&&!cur.armed){
    cur.armed=true;
    document.getElementById('warn').textContent=`미응답 ${miss.length}문항 (Q${miss.join(', Q')}). 한 번 더 누르면 미응답은 오답으로 채점합니다.`;
    return;
  }
  const firstUnlock=!gameUnlocked();
  cur.graded=true;
  const snap={};let score=0;
  cur.list.forEach(q=>{
    const a=finalAns(q);
    if(a!=null)snap[q.id]=a;
    if(isCorrect(q,a)){score++;markSolved(q.id);}
    else addWrong(q.id,answerText(q,a));
  });
  if(cur.mode==='study'){
    S.tabs[cur.tab.id]={score,total:cur.list.length,answers:snap,touched:[...cur.touched],at:Date.now()};
    delete S.drafts[cur.tab.id];
  }
  save();
  renderSheet();
  window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
  say(`채점 결과 ${score}점, ${cur.list.length}문항 중`);
  if(cur.mode==='study'&&firstUnlock)setTimeout(()=>toast('⚡ 게임 모드와 해설지가 열렸습니다!'),300);
  else if(cur.mode==='study'&&allGraded())setTimeout(()=>toast('★ 모든 탭 완료! 종합 결과를 확인하세요.'),300);
}

  if(scope==='wrong'){const w=new Set(wrongList(false));return shuffle(base.filter(q=>w.has(q.id))).concat(shuffle(base.filter(q=>!w.has(q.id))));}

}

  G={qs:pool,i:0,score:0,combo:0,maxCombo:0,results:[],locked:false,mode:gameSetup.mode,time:gameSetup.time};

function renderGameQ(){
  voiceReset();
  const q=G.qs[G.i];
  G.locked=false;G.elapsed=0;G.last=performance.now();G.limit=G.time*1000;G.warned=false;G.pick=[];
  G.view=q.ty==='ox'?[true,false]:shuffle(range(q.o.length));
  const opts=q.ty==='ox'
    ?`<div class="gox">${G.view.map((v,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}" aria-label="${v?'O 맞다':'X 틀리다'}">${v?'O':'X'}</button>`).join('')}</div>`
    :`<div class="gopts">${G.view.map((oi,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}"${q.ty==='multi'?' aria-pressed="false"':''}><kbd>${k+1}</kbd><span>${esc(q.o[oi])}</span></button>`).join('')}</div>`;
  app.innerHTML=`
  <div class="game play">
    <div class="gtop"><div class="hud"><span>${G.i+1} / ${G.qs.length}</span><span class="combo${G.combo>=3?' hot':''}">🔥 콤보 ${G.combo}</span><span class="pts">${G.score.toLocaleString()}점</span></div>
    <div class="timer" id="timer"><div id="tbar"></div></div><div class="tleft" id="tleft"></div></div>
    <div class="gtype">${TYPES[q.ty][0]}${q.ty==='multi'?' · 모두 고른 뒤 제출':''}</div>
    <div class="gq">${q.p}</div>${mediaHTML(q)}
    <div class="gbottom">${voiceRow(q,'g')}${opts}
    <div class="gfloat" id="gfloat" aria-live="polite"></div>
    <div class="gsub"><button class="btn" type="button" data-act="gquit">그만하기</button>
      ${q.ty==='multi'?'<button class="btn primary" type="button" data-act="gsubmit">제출 (Enter)</button>':''}</div></div>
  </div>`;
  if(hasVoice())G.vc=QBVoice.attach({bind:false,button:()=>app.querySelector('.vmic'),live:()=>app.querySelector('.vstat'),
    getOptions:()=>G.view.length,getType:()=>q.ty,
    select:r=>gameAnswer(r.kind==='ox'?(r.v==='O'?0:1):r.i),submit:q.ty==='multi'?gameSubmit:null});  // 말하면 클릭과 같게 바로 선택(·제출)
  G.raf=requestAnimationFrame(tick);
}
function tick(now){
  if(!G||G.locked)return;
  G.elapsed+=now-G.last;G.last=now;
  const rem=Math.max(0,G.limit-G.elapsed), ratio=rem/G.limit;
  const shown=RM.matches?Math.ceil(rem/1000)*1000/G.limit:ratio;
  const bar=document.getElementById('tbar'), tm=document.getElementById('timer');
  if(bar){bar.style.width=(Math.min(1,shown)*100)+'%';tm.className='timer'+(ratio<.25?' lo':ratio<.5?' mid':'');
    document.getElementById('tleft').textContent=(rem/1000).toFixed(1)+'초';}
  if(!G.warned&&rem<=5000){G.warned=true;say('5초 남았습니다');}
  if(rem<=0){judge(null,true);return;}
  G.raf=requestAnimationFrame(tick);
}
function judge(ans,timeout){
  if(!G||G.locked)return;
  G.locked=true;cancelAnimationFrame(G.raf);
  const q=G.qs[G.i], used=Math.min(G.elapsed,G.limit), ok=!timeout&&isCorrect(q,ans);
  let gain=0;
  if(ok){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const mult=G.combo>=5?1.5:G.combo>=3?1.2:1;
    gain=Math.round((100+Math.floor((G.limit-used)/100))*mult);G.score+=gain;}
  else G.combo=0;
  G.results.push({id:q.id,ok,ans,timeout,ms:used,gain});
  // 판정 표시
  app.querySelectorAll('[data-act="gans"]').forEach(b=>{
    const k=+b.dataset.k, v=G.view[k];
    const right=q.ty==='ox'?q.a===v:q.ty==='mc'?q.a===v:q.a.includes(v);
    const picked=q.ty==='ox'||q.ty==='mc'?ans===v:(ans||[]).includes(v);
    if(right)b.classList.add('ans');else if(picked)b.classList.add('miss');
    b.disabled=true;
  });
  const f=document.getElementById('gfloat');
  f.className='gfloat pop '+(ok?'ok':'no');
  f.textContent=ok?`+${gain}${G.combo>=3?` 🔥×${G.combo>=5?'1.5':'1.2'}`:''}`:timeout?'⏰ 시간 초과':'✗ 오답';
  if(timeout){const tm=document.getElementById('timer');tm&&tm.classList.add('out');}
  const sb=app.querySelector('[data-act="gsubmit"]');if(sb)sb.disabled=true;
  app.querySelector('.pts').textContent=G.score.toLocaleString()+'점';
  const c=app.querySelector('.combo');c.textContent='🔥 콤보 '+G.combo;c.classList.toggle('hot',G.combo>=3);
  G.next=setTimeout(()=>{if(!G)return;G.i++;G.i<G.qs.length?renderGameQ():finishGame();},ok?900:1400);
}
function gameAnswer(k){
  if(!G||G.locked)return;
  const q=G.qs[G.i];if(k<0||k>=G.view.length)return;
  if(q.ty==='multi'){
    const v=G.view[k], i=G.pick.indexOf(v);
    i<0?G.pick.push(v):G.pick.splice(i,1);
    const b=app.querySelector(`[data-act="gans"][data-k="${k}"]`);b&&b.setAttribute('aria-pressed',i<0);
  }else judge(G.view[k],false);
}
function gameSubmit(){if(G&&!G.locked&&G.qs[G.i].ty==='multi')judge(G.pick.slice(),false);}
function stopGame(){if(G){cancelAnimationFrame(G.raf);clearTimeout(G.next);G=null;}}
function finishGame(){
  const R=G.results, correct=R.filter(r=>r.ok).length, M=GAME_MODES[G.mode];
  R.forEach(r=>{const q=QMAP[r.id];if(r.ok)markSolved(r.id);else addWrong(r.id,r.timeout?'(시간 초과)':answerText(q,r.ans));});
  const rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:(S.name||'').trim()||'익명',score:G.score,
    correct,total:R.length,rate:pct(correct,R.length),avg:Math.round(R.reduce((s,r)=>s+r.ms,0)/R.length/100)/10,combo:G.maxCombo,mode:G.mode,time:G.time,at:Date.now()};
  const rank=Leaderboard.add(rec);
  save();
  const board=Leaderboard.load(boardKey(rec)), top=board.slice(0,10), mine=board.find(r=>r.id===rec.id);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;
  const row=(r,i)=>`<tr class="${r.id===rec.id?'me':''}"><td>${medal(i)}</td><td>${esc(r.name)}</td><td class="r">${r.score.toLocaleString()}</td><td class="r">${r.rate}%</td><td class="r">${r.correct}/${r.total}</td><td class="r">${new Date(r.at).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}</td></tr>`;
  const wrong=R.filter(r=>!r.ok);
  G=null;
  app.innerHTML=`
  <div class="game">
    <div class="panel center">
      <p class="note-sm" style="margin:0">최종 점수</p>
      <div class="score xl">${rec.score.toLocaleString()}</div>
      <p class="msg">${M.title} · ${rec.time}초 — ${rank===1?'🏆 이 조건 최고 기록!':`이 조건 순위 ${rank}위`}</p>
      <div class="bignum"><div><b>${correct}/${rec.total}</b><span>정답</span></div><div><b>${rec.rate}%</b><span>정답률</span></div><div><b>${rec.avg}초</b><span>평균 응답</span></div><div><b>${rec.combo}</b><span>최고 콤보</span></div></div>
    </div>
    <div class="panel"><h2 class="ph">🏆 순위 · ${M.title.replace(/^\S+\s/,'')} ${rec.time}초 · 이 브라우저 기록</h2>
      <table class="board"><thead><tr><th>#</th><th>이름</th><th class="r">점수</th><th class="r">정답률</th><th class="r">정답</th><th class="r">날짜</th></tr></thead>
      <tbody>${top.map(row).join('')}${rank>10&&mine?row(mine,rank-1):''}</tbody></table></div>
    ${wrong.length?`<details class="more panel"><summary>틀린 문항 ${wrong.length}개 · 해설 보기 (오답노트에 저장됨)</summary>
      ${wrong.map(r=>{const q=QMAP[r.id];return `<div class="keyitem"><div class="kq">${q.p}</div><p class="mine" style="margin:4px 0">내 답: ${esc(r.timeout?'(시간 초과)':answerText(q,r.ans))}</p><p class="ka">정답: ${esc(correctText(q))}</p><p class="kw">${q.w}</p><span class="an">📖 ${esc(q.an)}</span></div>`;}).join('')}</details>`:''}
    <div class="actions"><button class="btn primary" type="button" data-act="gagain">↻ 다시 하기</button><a class="btn" href="#notes">📒 오답노트</a><a class="btn" href="#home">홈</a></div>
  </div>`;
}

/* ── 라우터 · 이벤트 ───────────────────── */
function route(){
  stopGame();voiceReset();cur=null;app.classList.remove('sheet');
  const [v,arg]=(location.hash.slice(1)||'home').split('/');
  ({study:()=>viewStudy(arg),notes:viewNotes,retry:viewRetry,key:viewKey,game:()=>arg?viewGameSetup(arg):viewGamePick(),summary:viewSummary}[v]||viewHome)();
  window.scrollTo(0,0);
}
let resetArmed=false;
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act;
  if(cur&&['ox','ml','mr','ord','hint','src'].includes(act))return onSheetClick(el);
  switch(act){
    case 'grade':gradeSheet();break;
    case 'retab':viewStudy(cur.tab.id,true);window.scrollTo(0,0);break;  // 이전 점수는 다시 채점할 때까지 유지
    case 'onlywrong':cur.onlyWrong=!cur.onlyWrong;document.getElementById('cards').classList.toggle('onlywrong',cur.onlyWrong);el.textContent=cur.onlyWrong?'전체 보기':'오답만 보기';break;
    case 'copyreport':copy(reportMD());break;
    case 'copynotes':copy(`# ${BANK.title}\n\n- 이름: ${S.name||'-'} · ${today()}\n\n`+notesMD(false));break;
    case 'clearsolved':wrongList(true).forEach(id=>delete S.wrong[id]);save();viewNotes();break;
    case 'print':window.print();break;
    case 'reset':
      if(!resetArmed){resetArmed=true;el.textContent='정말 지울까요? 한 번 더 누르세요';setTimeout(()=>{resetArmed=false;if(el.isConnected)el.textContent='이 문제은행 기록 모두 지우기';},4000);break;}
      resetArmed=false;const nm=S.name;S=blank();S.name=nm;save();toast('기록을 지웠습니다');viewHome();break;
    case 'gset':gameSetup[el.dataset.g]=['count','time'].includes(el.dataset.g)?+el.dataset.v:el.dataset.v;viewGameSetup();break;
    case 'gstart':startGame();break;
    case 'gans':gameAnswer(+el.dataset.k);break;
    case 'vmic':{const q=G?null:QMAP[el.dataset.q];const c=G?G.vc:(q&&cur?studyVoice(q):null);if(c)c.toggle();break;}
    case 'vread':{
      if(G){const q=G.qs[G.i];readAloud(readText(q,0,q.ty==='ox'?null:G.view));break;}
      const q=QMAP[el.dataset.q], card=document.getElementById('card-'+el.dataset.q);
      if(q)readAloud(readText(q,card?card.dataset.n:0));break;}
    case 'gsubmit':gameSubmit();break;
    case 'gquit':stopGame();viewGameSetup(gameSetup.mode);break;
    case 'gagain':startGame();break;
  }
});
app.addEventListener('change',e=>{const el=e.target;if(cur&&el.dataset&&(el.dataset.act==='pick'||el.dataset.act==='tick'))onSheetChange(el);});
app.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.act==='name'){S.name=el.value;save();}
  else if(cur)onSheetInput(el);
});
document.addEventListener('keydown',e=>{
  if(!G||G.locked||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.target.matches&&e.target.matches('input,textarea'))return;
  const q=G.qs[G.i], k=e.key.toLowerCase();
  if(q.ty==='ox'){if(k==='o'||k==='1'){e.preventDefault();gameAnswer(0);}else if(k==='x'||k==='2'){e.preventDefault();gameAnswer(1);}return;}
  if(/^[1-9]$/.test(k)){e.preventDefault();gameAnswer(+k-1);}
  else if(k==='enter'&&q.ty==='multi'&&!(e.target.closest&&e.target.closest('.vrow'))){e.preventDefault();gameSubmit();}
});
window.addEventListener('pagehide',()=>{if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}});
document.addEventListener('visibilitychange',()=>{if(G&&!document.hidden)G.last=performance.now();});
// 탭 바 좌우 화살표
app.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('.tabchip');if(!t||(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'))return;
  const n=e.key==='ArrowRight'?t.nextElementSibling:t.previousElementSibling;if(n){e.preventDefault();n.focus();}
});
/* 테마 */
let theme=null;try{theme=localStorage.getItem('qb:theme');}catch(e){}
const applyTheme=()=>{if(theme)document.documentElement.dataset.theme=theme;else delete document.documentElement.dataset.theme;};
applyTheme();
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  theme=dark?'light':'dark';try{localStorage.setItem('qb:theme',theme);}catch(e){}applyTheme();
});
document.title=BANK.title+' · 문제은행';
window.addEventListener('hashchange',route);
route();
})();
</script>
</body>
