const BANK={"id":"vibe-textbook","code":"VCT","title":"바이브코딩 교재 · AI 바이브 코딩 실전 과정 20H","subtitle":"생성형 AI와 모델 비교 · 프롬프트 엔지니어링 · 바이브 코딩과 업무 적용 전략","course":"02-dev-basics / vibe-coding","source":"02-dev-basics/vibe-coding/AI_바이브코딩_교재.pptx","salt":"vibe-textbook","version":1,"updated":"2026-10-16","tabs":[{"id":"t1","title":"생성형 AI의 개념과 원리","ref":"슬라이드 2~7, 16, 18, 21","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"생성형 AI 분야와 대표 도구의 짝이 올바른 것은?","o":["영상 생성 — Sora","음악 생성 — Midjourney","코드 생성 — Suno","이미지 생성 — Runway"],"a":0,"h":"교재는 생성형 AI를 텍스트·이미지·코드·영상·음악·3D로 나누고 분야마다 대표 도구를 적었습니다. Midjourney는 그림, Suno는 노래, Runway는 동영상을 만드는 쪽에 속하니 각 도구가 어느 분야 줄에 있었는지 떠올려 보세요.","w":"Sora는 Kling, Runway와 함께 영상 생성 도구입니다. Midjourney는 이미지, Suno는 음악 생성 도구이고 Runway는 영상 생성 도구라 나머지 짝은 모두 틀렸습니다.","an":"슬라이드 4 · 생성형 AI란 무엇인가?","src":"정의\n생성형 AI(Generative AI)는 텍스트, 이미지, 코드, 음악 등 새로운 콘텐츠를 스스로 생성할 수 있는 인공지능 기술입니다.\n텍스트 생성 — ChatGPT, Claude, Gemini\n이미지 생성 — DALL-E, Midjourney, Stable Diffusion\n코드 생성 — GitHub Copilot, Cursor, Claude Code\n영상 생성 — Sora, Kling, Runway\n음악 생성 — Suno, Udio\n3D 모델 — Meshy, Tripo AI"},{"id":"t1-02","ty":"mc","lv":1,"game":true,"p":"AI 발전 타임라인에서 ChatGPT가 출시되어 'AI 대중화의 시작'이 된 시기는?","o":["2017","2020","2022.11","2024"],"a":2,"h":"타임라인은 Transformer 발표 → GPT-3 공개 → ChatGPT 출시 → GPT-4·Claude 2·Gemini 경쟁 → 멀티모달·에이전트 → 바이브 코딩 순입니다. GPT-3로 대규모 언어모델 시대가 열린 뒤, 그다음 해가 아니라 그 2년 뒤 가을에 대중화가 시작되었습니다.","w":"ChatGPT 출시는 2022.11입니다. 2017년은 Transformer 아키텍처 발표, 2020년은 GPT-3 공개, 2024년은 멀티모달 AI·AI 에이전트 시대입니다.","an":"슬라이드 4 · AI 발전 타임라인","src":"AI 발전 타임라인\n2017\nTransformer 아키텍처 발표 (Google)\n2020\nGPT-3 공개 — 대규모 언어모델 시대\n2022.11\nChatGPT 출시 — AI 대중화의 시작\n2023\nGPT-4, Claude 2, Gemini 경쟁 본격화\n2024\n멀티모달 AI, AI 에이전트 시대\n2025\n바이브 코딩, AI 코파일럿 전성기"},{"id":"t1-03","ty":"mc","lv":2,"game":true,"p":"'FAQ 챗봇 구축, 고객 문의 분류, 응대 스크립트 생성, 감성 분석'은 어느 업종의 AI 활용 사례인가?","o":["마케팅/영업","인사/총무","기획/전략","고객서비스"],"a":3,"h":"업종별 사례에서 마케팅/영업은 SNS 콘텐츠·이메일 개인화, 인사/총무는 채용 공고·면접 질문, 기획/전략은 시장 조사·SWOT 분석을 다룹니다. 문의를 받고 응대하는 일을 맡는 부서를 떠올려 보세요.","w":"챗봇·문의 분류·응대 스크립트·감성 분석은 고객서비스 사례입니다. 마케팅/영업은 SNS 콘텐츠와 A/B 테스트 문구, 기획/전략은 경쟁사·SWOT 분석이 대표 사례입니다.","an":"슬라이드 7 · 업종별 AI 활용 실무 사례","src":"마케팅/영업\nSNS 콘텐츠 자동 생성, 고객 이메일 개인화, 시장 분석 보고서, A/B 테스트 문구 작성\n인사/총무\n채용 공고 작성, 면접 질문 생성, 사내 공지문 작성, 교육 자료 제작\n재무/회계\n재무제표 분석, 예산 시뮬레이션, 지출 보고서 자동 생성, 세금 관련 FAQ\n연구/개발\n논문 리뷰 요약, 실험 데이터 분석, 기술 문서 작성, 코드 리뷰 자동화\n고객서비스\nFAQ 챗봇 구축, 고객 문의 분류, 응대 스크립트 생성, 감성 분석\n기획/전략\n시장 조사 요약, 경쟁사 분석, SWOT 분석, 사업 계획서 초안 작성"},{"id":"t1-04","ty":"mc","lv":1,"game":true,"p":"'특정 목적에 맞게 AI 모델을 추가 학습시키는 과정'을 뜻하는 용어는?","o":["RAG","파인튜닝","프롬프트","할루시네이션"],"a":1,"h":"핵심 용어 표에서 RAG는 외부 지식을 검색한 뒤 답하는 방식, 프롬프트는 AI에게 주는 지시문, 할루시네이션은 사실이 아닌 정보를 만드는 현상입니다. 이미 만든 모델을 목적에 맞게 더 '튜닝'한다는 뜻의 영어 용어를 찾으세요.","w":"파인튜닝은 특정 목적에 맞게 모델을 추가 학습시키는 과정입니다. RAG는 모델을 다시 학습시키지 않고 외부 지식을 검색해 답변을 생성하는 방식입니다.","an":"슬라이드 16 · AI 핵심 용어 정리","src":"용어 | 설명\nLLM | Large Language Model — 대규모 언어모델 (GPT, Claude 등)\n프롬프트 | AI에게 전달하는 지시문/질문\n토큰 | AI가 텍스트를 처리하는 최소 단위 (한글 1글자 ≈ 2~3 토큰)\n할루시네이션 | AI가 사실이 아닌 정보를 생성하는 현상\nRAG | Retrieval-Augmented Generation — 외부 지식 검색 후 답변 생성\n파인튜닝 | 특정 목적에 맞게 AI 모델을 추가 학습시키는 과정\n멀티모달 | 텍스트+이미지+음성 등 다양한 형태를 동시에 처리하는 AI\n컨텍스트 윈도우 | AI가 한 번에 처리할 수 있는 텍스트의 최대 길이"},{"id":"t1-05","ty":"mc","lv":3,"game":false,"p":"해외 영업 담당자가 외국 바이어 이메일 번역·답변에 1시간씩 쓰고 있습니다. 교재 Before & After 사례대로 AI 번역+답변 초안을 쓰면 걸리는 시간은?","o":["5분","10분","30분","40분"],"a":1,"h":"Before & After 사례는 데이터 정리 2시간→5분, 보고서 초안 3시간→30분, 해외 업무 1시간→?, 회의록 40분→5분입니다. 해외 업무는 한 시간짜리 일이 한 자릿수가 아닌 두 자릿수 분 단위로 줄어듭니다.","w":"해외 업무는 1시간에서 10분으로 줄어듭니다. 5분은 데이터 정리·회의 관리, 30분은 보고서 초안, 40분은 회의록 작성의 Before 시간입니다.","an":"슬라이드 18 · AI 실무 적용 사례: Before & After","src":"데이터 정리\nBefore: 수동으로 엑셀 데이터 정리 (2시간)\nAfter:   AI에 데이터 업로드 → 자동 정리 (5분)\n문서 작성\nBefore: 보고서 초안 작성 (3시간)\nAfter:   AI가 초안 생성 → 수정/보완 (30분)\n해외 업무\nBefore: 외국 바이어 이메일 번역+답변 (1시간)\nAfter:   AI 번역+답변 초안 (10분)\n회의 관리\nBefore: 회의록 작성 및 할 일 정리 (40분)\nAfter:   AI가 회의 내용 요약+액션아이템 추출 (5분)"},{"id":"t1-06","ty":"ox","lv":2,"game":true,"p":"AI는 질문의 의미를 '이해'한다기보다 학습된 패턴으로 다음에 올 단어를 '예측'해 답을 만든다.","a":true,"h":"작동 원리의 추론 단계에서 AI는 프롬프트를 받으면 학습된 패턴을 기반으로 다음에 올 가장 적절한 단어를 고릅니다. 슬라이드 아래 Tip은 이 차이를 알면 AI를 더 효과적으로 쓸 수 있다고 강조합니다.","w":"맞습니다. 교재 Tip은 'AI는 이해하는 것이 아니라 패턴을 예측하는 것'이라고 설명합니다. 그래서 매번 약간 다른 결과가 나올 수 있습니다.","an":"슬라이드 5 · 생성형 AI의 작동 원리 Tip","src":"3\n추론 (Inference)\n사용자의 질문(프롬프트)을 받으면, 학습된 패턴을 기반으로 다음에 올 가장 적절한 단어를 예측합니다.\n4\n콘텐츠 생성\n예측을 반복하여 완성된 문장, 문단, 코드, 이미지 등을 생성합니다. 매번 약간 다른 결과가 나올 수 있습니다.\nTip: AI는 '이해'하는 것이 아니라 '패턴을 예측'하는 것입니다. 이 차이를 이해하면 AI를 더 효과적으로 활용할 수 있습니다."},{"id":"t1-07","ty":"ox","lv":1,"game":true,"p":"할루시네이션은 AI가 한 번에 처리할 수 있는 텍스트의 최대 길이를 넘었을 때 생기는 현상이다.","a":false,"h":"핵심 용어 표에서 처리 가능한 텍스트의 최대 길이는 따로 '컨텍스트 윈도우'라는 이름으로 정리되어 있습니다. 할루시네이션은 '환각'이라는 뜻처럼 내용의 사실 여부와 관련된 현상입니다.","w":"틀렸습니다. 할루시네이션은 AI가 사실이 아닌 정보를 생성하는 현상이고, 최대 처리 길이는 컨텍스트 윈도우입니다.","an":"슬라이드 16 · AI 핵심 용어 정리","src":"용어 | 설명\nLLM | Large Language Model — 대규모 언어모델 (GPT, Claude 등)\n프롬프트 | AI에게 전달하는 지시문/질문\n토큰 | AI가 텍스트를 처리하는 최소 단위 (한글 1글자 ≈ 2~3 토큰)\n할루시네이션 | AI가 사실이 아닌 정보를 생성하는 현상\nRAG | Retrieval-Augmented Generation — 외부 지식 검색 후 답변 생성\n파인튜닝 | 특정 목적에 맞게 AI 모델을 추가 학습시키는 과정\n멀티모달 | 텍스트+이미지+음성 등 다양한 형태를 동시에 처리하는 AI\n컨텍스트 윈도우 | AI가 한 번에 처리할 수 있는 텍스트의 최대 길이"},{"id":"t1-08","ty":"match","lv":2,"game":false,"p":"AI 핵심 용어와 설명을 연결하세요.","pairs":[["LLM","대규모 언어모델 (GPT, Claude 등)"],["토큰","AI가 텍스트를 처리하는 최소 단위"],["RAG","외부 지식 검색 후 답변 생성"],["멀티모달","텍스트+이미지+음성 등을 동시에 처리"],["컨텍스트 윈도우","한 번에 처리할 수 있는 텍스트의 최대 길이"]],"h":"LLM은 Large Language Model의 약자이고, 토큰은 한글 1글자가 2~3개쯤 되는 작은 단위입니다. RAG는 Retrieval(검색)으로 시작하고, 멀티모달은 '여러 형태', 컨텍스트 윈도우는 '한 번에 볼 수 있는 창'이라는 뜻에서 출발해 연결해 보세요.","w":"핵심 용어 표 그대로입니다. 표의 나머지 용어는 프롬프트(지시문/질문), 할루시네이션(사실이 아닌 정보 생성), 파인튜닝(추가 학습)입니다.","an":"슬라이드 16 · AI 핵심 용어 정리","src":"용어 | 설명\nLLM | Large Language Model — 대규모 언어모델 (GPT, Claude 등)\n프롬프트 | AI에게 전달하는 지시문/질문\n토큰 | AI가 텍스트를 처리하는 최소 단위 (한글 1글자 ≈ 2~3 토큰)\n할루시네이션 | AI가 사실이 아닌 정보를 생성하는 현상\nRAG | Retrieval-Augmented Generation — 외부 지식 검색 후 답변 생성\n파인튜닝 | 특정 목적에 맞게 AI 모델을 추가 학습시키는 과정\n멀티모달 | 텍스트+이미지+음성 등 다양한 형태를 동시에 처리하는 AI\n컨텍스트 윈도우 | AI가 한 번에 처리할 수 있는 텍스트의 최대 길이"},{"id":"t1-09","ty":"order","lv":2,"game":false,"p":"생성형 AI의 작동 원리 4단계를 순서대로 정렬하세요.","steps":["대규모 학습 (Pre-training)","미세 조정 (Fine-tuning)","추론 (Inference)","콘텐츠 생성"],"h":"먼저 인터넷의 방대한 텍스트로 언어 패턴을 익히고, 사람의 피드백(RLHF)으로 유용하고 안전하게 다듬습니다. 그 뒤 사용자의 질문을 받아 다음 단어를 예측하고, 이 예측을 반복해 결과물을 완성합니다.","w":"대규모 학습 → 미세 조정 → 추론 → 콘텐츠 생성 순서입니다. 학습과 조정은 사용 전에, 추론과 생성은 사용자가 질문할 때 일어납니다.","an":"슬라이드 5 · 생성형 AI의 작동 원리","src":"1\n대규모 학습 (Pre-training)\n인터넷의 방대한 텍스트 데이터를 학습하여 언어의 패턴, 문법, 지식을 습득합니다. 책 수백만 권을 읽은 것과 비슷합니다.\n2\n미세 조정 (Fine-tuning)\n사람의 피드백(RLHF)을 통해 유용하고 안전한 답변을 생성하도록 추가 훈련합니다.\n3\n추론 (Inference)\n사용자의 질문(프롬프트)을 받으면, 학습된 패턴을 기반으로 다음에 올 가장 적절한 단어를 예측합니다.\n4\n콘텐츠 생성\n예측을 반복하여 완성된 문장, 문단, 코드, 이미지 등을 생성합니다. 매번 약간 다른 결과가 나올 수 있습니다."},{"id":"t1-10","ty":"multi","lv":3,"game":true,"p":"팀에서 AI에게 맡길 일을 고르고 있습니다. 교재가 'AI가 잘하는 일'로 분류한 것을 <b>모두<\/b> 고르세요.","o":["표→문장 같은 형식 변환","다국어 번역 및 현지화","아이디어 브레인스토밍","법적 책임이 따르는 의사결정","100% 정확한 수학적 계산"],"a":[0,1,2],"h":"교재는 대량 텍스트 요약, 패턴 인식, 언어 간 옮기기와 현지화, 코드 생성, 아이디어 발산, 반복 문서, 데이터 모양 바꾸기, 초안 반복을 AI의 강점으로 꼽습니다. 반대로 책임이 따르는 판단이나 완벽한 정확성이 필요한 일은 가끔 실수가 있기 때문에 약점 쪽에 둡니다.","w":"형식 변환·번역·브레인스토밍은 AI가 잘하는 일입니다. 법적 책임이 따르는 의사결정과 100% 정확한 수학적 계산은 'AI가 못하는 일'에 있습니다.","an":"슬라이드 21 · AI가 특히 잘하는 일 vs 못하는 일","src":"AI가 잘하는 일\n대량 텍스트 요약 및 정리\n패턴 인식 및 데이터 분석\n다국어 번역 및 현지화\n코드 생성 및 디버깅\n아이디어 브레인스토밍\n반복적 문서 작성\n형식 변환 (표→문장, JSON→CSV 등)\n초안 작성 후 빠른 반복\nAI가 못하는 일\n실시간 사실 확인 (할루시네이션)\n감정적 공감과 미묘한 뉘앙스\n기업 내부 정보 접근/처리\n법적 책임이 따르는 의사결정\n물리적 작업 수행\n윤리적 판단이 필요한 상황\n아직 존재하지 않는 정보 생성\n100% 정확한 수학적 계산 (가끔 실수)"}]},{"id":"t2","title":"AI 모델 비교와 안전한 사용","ref":"슬라이드 8~15, 17, 19~20, 22~23, 67~71","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"주요 생성형 AI 모델 비교표에서 코딩 평가가 ★★★☆☆로 가장 낮은 도구는?","o":["Claude 4","Cursor AI","Copilot","Windsurf"],"a":2,"h":"비교표의 코딩 열에서 Claude 4와 Cursor AI는 별 다섯 개, ChatGPT·Gemini 2.5·Windsurf는 별 네 개입니다. 별 세 개인 도구는 코딩보다 Office 연동과 업무 자동화를 주요 특징으로 내세웁니다.","w":"Copilot은 Office 연동·업무 자동화가 강점이고 코딩은 ★★★☆☆입니다. Claude 4와 Cursor AI는 ★★★★★, Windsurf는 ★★★★☆입니다.","an":"슬라이드 8 · 주요 생성형 AI 모델 비교표","src":"모델 | 개발사 | 주요 특징 | 코딩 | 비용\nChatGPT (GPT-4o) | OpenAI | 범용 대화, 이미지, 플러그인 | ★★★★☆ | 무료/유료\nClaude 4 | Anthropic | 긴 문맥, 코드 분석, 안전성 | ★★★★★ | 무료/유료\nGemini 2.5 | Google | Google 연동, 멀티모달, 검색 | ★★★★☆ | 무료/유료\nCopilot | Microsoft | Office 연동, 업무 자동화 | ★★★☆☆ | 무료/유료\nCursor AI | Cursor | AI 코드 에디터, 바이브 코딩 최적화 | ★★★★★ | 무료/유료\nWindsurf | Codeium | AI IDE, 코드 자동완성+생성 | ★★★★☆ | 무료/유료"},{"id":"t2-02","ty":"mc","lv":1,"game":true,"p":"상황별 AI 도구 선택 가이드에서 '긴 문서 분석/요약'에 추천하는 도구는?","o":["Gemini","Claude","Copilot","Midjourney"],"a":1,"h":"가이드는 200K 토큰으로 책 한 권도 한 번에 분석할 수 있는 도구를 긴 문서용으로 꼽습니다. 웹 검색 연동은 최신 정보, Office 연동은 업무 자동화, 고품질 그림은 이미지 생성에 각각 추천됩니다.","w":"긴 문서 분석/요약은 200K 토큰 컨텍스트를 가진 Claude입니다. Gemini는 최신 정보 검색, Copilot은 Office 업무 자동화, Midjourney는 이미지 생성에 추천됩니다.","an":"슬라이드 12 · 상황별 AI 도구 선택 가이드","src":"긴 문서 분석/요약\nClaude — 200K 토큰으로 책 한 권도 한 번에 분석 가능\n코딩/프로그래밍\nCursor AI + Claude — 코드 생성과 디버깅에 최적화\n최신 정보 검색\nGemini / ChatGPT — 웹 검색 연동으로 실시간 정보 접근\nOffice 업무 자동화\nCopilot — Word, Excel, PPT 직접 연동\n이미지 생성\nChatGPT (DALL-E) / Midjourney — 고품질 이미지 생성\nTip: 하나의 AI에 의존하지 말고, 작업 유형에 따라 최적의 도구를 선택하세요. 'AI 멀티툴 전략'이 핵심!"},{"id":"t2-03","ty":"mc","lv":2,"game":true,"p":"교재 Tip이 제시한 '바이브 코딩에 가장 적합한 조합'에서 개발을 맡는 도구는?","o":["ChatGPT","Copilot","Gemini","Cursor AI"],"a":3,"h":"Tip의 조합은 세 도구로 개발·기획/분석·범용 역할을 나눕니다. 비교표에서 'AI 코드 에디터, 바이브 코딩 최적화'라는 특징을 가진 도구가 개발을 맡습니다.","w":"조합은 Cursor AI(개발) + Claude(기획/분석) + ChatGPT(범용)입니다. ChatGPT는 범용 역할이고 Copilot·Gemini는 이 조합에 들어 있지 않습니다.","an":"슬라이드 8 · 주요 생성형 AI 모델 비교 Tip","src":"Tip: 바이브 코딩에 가장 적합한 조합: Cursor AI(개발) + Claude(기획/분석) + ChatGPT(범용). 상황에 따라 조합하세요!\n모델 | 개발사 | 주요 특징 | 코딩 | 비용\nChatGPT (GPT-4o) | OpenAI | 범용 대화, 이미지, 플러그인 | ★★★★☆ | 무료/유료\nClaude 4 | Anthropic | 긴 문맥, 코드 분석, 안전성 | ★★★★★ | 무료/유료\nGemini 2.5 | Google | Google 연동, 멀티모달, 검색 | ★★★★☆ | 무료/유료\nCopilot | Microsoft | Office 연동, 업무 자동화 | ★★★☆☆ | 무료/유료\nCursor AI | Cursor | AI 코드 에디터, 바이브 코딩 최적화 | ★★★★★ | 무료/유료"},{"id":"t2-04","ty":"mc","lv":3,"game":true,"p":"같은 질문을 두 번 했더니 AI가 서로 다른 답을 내서, 중요한 결정 전에 교차 검증을 하기로 했습니다. 이와 관련된 AI의 한계는?","o":["일관성 부족","할루시네이션","맥락 이해 한계","최신 정보 부재"],"a":0,"h":"실무 적용 한계점은 다섯 가지입니다. 사실이 아닌 정보 생성, 보안 위험, 학습 기준일 이후 정보 부족, 사내 용어·문화 이해 부족과 달리, 이 한계는 답변이 매번 같지 않다는 점을 말합니다.","w":"답변이 매번 달라지는 것은 일관성 부족입니다. 할루시네이션은 그럴듯한 거짓 정보, 최신 정보 부재는 학습 기준일 이후 정보의 부정확함을 말합니다.","an":"슬라이드 13 · 생성형 AI 실무 적용 한계점","src":"할루시네이션 (환각)\nAI가 그럴듯하지만 사실이 아닌 정보를 생성. 반드시 팩트체크 필요\n데이터 보안 리스크\n기업 기밀/개인정보를 AI에 입력 시 외부 서버 전송 위험\n최신 정보 부재\n학습 데이터 기준일 이후 정보 부정확. RAG/웹검색으로 보완\n맥락 이해 한계\n사내 전문 용어, 조직 문화, 암묵적 규칙은 별도 설명 필요\n일관성 부족\n같은 질문에도 매번 다른 답변 생성. 중요 결정에는 교차 검증 필수"},{"id":"t2-05","ty":"mc","lv":3,"game":true,"p":"고객 이름과 계약 금액이 담긴 데이터를 AI로 분석하려 합니다. 교재 보안 Tip에 따라 AI에 입력하기 <b>전<\/b> 할 일은?","o":["원본 파일을 그대로 업로드한다","결과를 외부에 먼저 발표한다","이름은 'A고객', 금액은 대략치로 바꾼다","경쟁사 정보를 함께 질의한다"],"a":2,"h":"보안 Tip은 AI 입력 → 결과 검증 → 원본 복원보다 앞선 첫 단계를 강조합니다. 개인을 알아볼 수 있는 이름과 정확한 수치를 가려서 넣으라는 것이 핵심입니다.","w":"민감 정보 마스킹 → AI 입력 → 결과 검증 → 원본 복원 순서이므로 먼저 이름과 금액을 가립니다. 기밀 원본 업로드, 검증 없는 외부 발표, 경쟁사 민감 정보 질의는 '피해야 할 행동'입니다.","an":"슬라이드 15 · AI 사용 보안 가이드라인","src":"✅ 안전한 AI 사용법\n공개 가능한 일반 정보만 입력\n가명/마스킹 처리 후 데이터 분석\n사내 AI 사용 정책 확인 후 사용\n중요 결과물은 반드시 팩트체크\n❌ 피해야 할 행동\n고객 개인정보 직접 입력 금지\n사내 기밀 문서 원본 업로드 금지\nAI 답변을 검증 없이 외부 발표 금지\n경쟁사 관련 민감 정보 질의 금지\nTip: 기업에서 AI 사용 시, 반드시 '민감 정보 마스킹 → AI 입력 → 결과 검증 → 원본 복원' 순서를 지키세요. 이름은 'A고객', 금액은 대략치로 변환 후 입력합니다."},{"id":"t2-06","ty":"ox","lv":1,"game":true,"p":"AI가 만든 결과물에 대한 최종 책임은 AI 서비스 회사가 아니라 사용자에게 있다.","a":true,"h":"AI 윤리적 고려사항의 '책임과 투명성' 항목은 결과물의 책임 주체, AI 활용 사실 공개, 인간의 판단과 검증을 다룹니다. 그래서 AI 답변을 검증 없이 쓰지 말라고 강조합니다.","w":"맞습니다. 교재는 'AI 결과물의 최종 책임은 사용자'라고 명시하고, 인간의 판단과 검증을 반드시 포함하라고 합니다.","an":"슬라이드 14 · AI 윤리적 고려사항 · 책임과 투명성","src":"책임과 투명성\nAI 결과물의 최종 책임은 사용자\nAI 활용 사실 공개의 중요성\n인간의 판단과 검증 필수 포함\nAI 의존도를 적정 수준으로 관리"},{"id":"t2-07","ty":"ox","lv":1,"game":true,"p":"AI와 대화를 시작할 때는 자기소개 없이 바로 질문부터 하는 것이 좋다.","a":false,"h":"대화 시작 전략은 네 단계로, 첫 단계는 내가 어떤 팀에서 무슨 일을 하는지 알려 주는 것입니다. 이어서 목적, 제약 조건, 기대 결과를 차례로 밝힙니다.","w":"틀렸습니다. 대화 시작 전략 1번이 '자기소개부터 하세요'입니다. 그다음 목적 → 제약 조건 → 기대 결과를 알려 줍니다.","an":"슬라이드 67 · AI와 효과적으로 대화하는 전략","src":"대화 시작 전략\n1. 자기소개부터 하세요\n\"나는 마케팅팀에서 SNS를 담당해\"\n2. 목적을 명확히 밝히세요\n\"이번 달 인스타 콘텐츠 기획이 필요해\"\n3. 제약 조건을 알려주세요\n\"예산은 100만원, 기간은 2주야\"\n4. 기대 결과를 설명하세요\n\"표 형식으로 일정과 콘텐츠 아이디어를 정리\""},{"id":"t2-08","ty":"match","lv":2,"game":false,"p":"AI 모델(도구)과 개발사를 연결하세요.","pairs":[["ChatGPT (GPT-4o)","OpenAI"],["Claude 4","Anthropic"],["Gemini 2.5","Google"],["Copilot","Microsoft"],["Windsurf","Codeium"]],"h":"비교표의 개발사 열을 떠올려 보세요. Gemini는 검색 회사의 서비스라 검색 연동이, Copilot은 Office를 만든 회사의 서비스라 Office 연동이 특징입니다. Windsurf는 코드 자동완성 도구를 만든 회사의 AI IDE입니다.","w":"비교표의 개발사 열 그대로입니다. 표에는 이 밖에 Cursor사의 Cursor AI가 있으며, 모든 도구의 비용은 무료/유료입니다.","an":"슬라이드 8 · 주요 생성형 AI 모델 비교표","src":"모델 | 개발사 | 주요 특징 | 코딩 | 비용\nChatGPT (GPT-4o) | OpenAI | 범용 대화, 이미지, 플러그인 | ★★★★☆ | 무료/유료\nClaude 4 | Anthropic | 긴 문맥, 코드 분석, 안전성 | ★★★★★ | 무료/유료\nGemini 2.5 | Google | Google 연동, 멀티모달, 검색 | ★★★★☆ | 무료/유료\nCopilot | Microsoft | Office 연동, 업무 자동화 | ★★★☆☆ | 무료/유료\nCursor AI | Cursor | AI 코드 에디터, 바이브 코딩 최적화 | ★★★★★ | 무료/유료\nWindsurf | Codeium | AI IDE, 코드 자동완성+생성 | ★★★★☆ | 무료/유료"},{"id":"t2-09","ty":"order","lv":2,"game":false,"p":"AI 활용 업무 효율화 프레임워크(5D)를 순서대로 정렬하세요.","steps":["Discover (발견)","Design (설계)","Deploy (적용)","Document (문서화)","Develop (발전)"],"h":"먼저 업무일지로 반복 업무를 찾고, CRISP 템플릿으로 지시 방법을 짠 뒤 실제 업무에 써 보며 Before/After를 기록합니다. 그다음 잘된 프롬프트를 정리해 팀과 나누고, 마지막으로 계속 개선하며 범위를 넓힙니다.","w":"Discover → Design → Deploy → Document → Develop 순서입니다. 프롬프트 라이브러리 구축은 Document, 지속 개선과 새 도구 탐색은 Develop 단계입니다.","an":"슬라이드 20 · AI 활용 업무 효율화 프레임워크","src":"1\nDiscover\n(발견)\n반복적이고 시간이 많이 걸리는 업무를 찾아냅니다. 일주일간 업무일지를 작성해 보세요.\n2\nDesign\n(설계)\nAI에게 어떻게 지시할지 프롬프트를 설계합니다. CRISP 템플릿을 활용하세요.\n3\nDeploy\n(적용)\n실제 업무에 적용하고 결과를 측정합니다. Before/After 비교를 기록하세요.\n4\nDocument (문서화)\n효과적인 프롬프트와 워크플로우를 정리하여 팀과 공유합니다. 프롬프트 라이브러리를 구축하세요.\n5\nDevelop (발전)\n지속적으로 프롬프트를 개선하고, 새로운 AI 도구를 탐색하여 활용 범위를 확대합니다."},{"id":"t2-10","ty":"multi","lv":2,"game":true,"p":"Day 1 핵심 정리 체크리스트에 있는 항목을 <b>모두<\/b> 고르세요.","o":["AI 도구 계정을 2개 이상 생성했다","AI에게 질문하고 답변을 받아 봤다","CRISP 템플릿으로 프롬프트를 썼다","업무 적용 아이디어를 3개 이상 냈다","같은 질문의 AI별 답변을 비교했다"],"a":[0,1,3,4],"h":"Day 1 체크리스트는 생성형 AI 정의·원리, 세 AI의 차이, 계정 생성, 첫 질문 경험, 한계 이해, 업무 아이디어 도출, 보안 가이드라인, AI별 답변 비교의 8개입니다. 맥락·역할·지시·세부사항·선호를 담는 프롬프트 템플릿은 다음 날 배우는 내용입니다.","w":"CRISP 템플릿은 Day 2 체크리스트 항목입니다. 나머지 넷은 Day 1 체크리스트에 그대로 있습니다.","an":"슬라이드 23 · Day 1 핵심 정리 & 체크리스트","src":"오늘 배운 내용 체크리스트\n□ 생성형 AI의 정의와 작동 원리를 설명할 수 있다\n□ ChatGPT, Claude, Gemini의 차이점을 이해한다\n□ 최소 2개 이상의 AI 도구에 계정을 생성했다\n□ AI에게 질문을 하고 답변을 받아본 경험이 있다\n□ AI의 한계(할루시네이션, 보안)를 이해한다\n□ 내 업무에 AI를 적용할 수 있는 아이디어를 3개 이상 도출했다\n□ AI 보안 가이드라인을 이해하고 준수할 수 있다\n□ 같은 질문에 대한 AI별 답변 차이를 비교해 보았다"}]},{"id":"t3","title":"프롬프트 핵심 원칙과 CRISP","ref":"슬라이드 24~27, 31, 72, 75~77","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"교재에 따르면 같은 AI도 프롬프트에 따라 결과물 품질이 몇 배 이상 달라지는가?","o":["2배","5배","10배","100배"],"a":2,"h":"교재는 프롬프트를 AI에게 전달하는 지시문·질문·맥락 정보의 총합으로 정의합니다. 그리고 같은 AI라도 프롬프트만 바꾸면 품질이 한 자릿수를 넘어 두 자릿수 배로 달라진다고 강조합니다.","w":"교재는 '결과물 품질이 10배 이상 달라진다'고 설명합니다. 그래서 '보고서 써줘' 같은 나쁜 프롬프트 대신 역할·맥락·형식·대상을 지정하라고 합니다.","an":"슬라이드 25 · 프롬프트 엔지니어링이란?","src":"프롬프트(Prompt) = AI에게 전달하는 지시문, 질문, 맥락 정보의 총합\n같은 AI도 프롬프트에 따라 결과물 품질이 10배 이상 달라집니다."},{"id":"t3-02","ty":"mc","lv":2,"game":true,"p":"실수 사례에서 '코드 짜줘'를 개선한 After 프롬프트에 들어간 요구사항은?","o":["예산 500만원","입력값 검증 포함","핵심 수치는 볼드 처리","3문단, 500자 이내"],"a":1,"h":"실수 사례는 마케팅 전략·코드·요약 세 가지 Before를 After로 바꿉니다. 코드 After는 이름과 이메일을 입력받아 환영 메시지를 띄우는 HTML 폼이며, 사용자가 넣은 값이 올바른지 확인하는 조건이 붙어 있습니다.","w":"코드 After는 '입력값 검증 포함'으로 끝납니다. 예산 500만원은 마케팅 전략, 볼드 처리와 3문단·500자는 요약 After에 들어간 조건입니다.","an":"슬라이드 75 · 실제 프롬프트 실수 사례 & 개선","src":"❌ Before: 좋은 마케팅 전략 알려줘\n✅ After:    B2B SaaS 스타트업의 2025년 Q2 디지털 마케팅 전략을 수립해줘. 예산 500만원, 주 타겟은 중소기업 IT 담당자\n❌ Before: 코드 짜줘\n✅ After:    사용자가 이름과 이메일을 입력하면 환영 메시지를 표시하는 HTML 폼을 만들어줘. 입력값 검증 포함\n❌ Before: 요약해줘\n✅ After:    이 문서를 경영진 보고용으로 3문단, 500자 이내로 요약해줘. 핵심 수치는 볼드 처리"},{"id":"t3-03","ty":"mc","lv":1,"game":true,"p":"'500자 이내, 3단락, 업무 보고 형식으로'처럼 형식·길이·톤을 명확히 지정하는 프롬프트 원칙은?","o":["역할 부여 (Role)","맥락 제공 (Context)","예시 포함 (Example)","구체적 지시 (Specific)"],"a":3,"h":"핵심 5원칙은 역할 부여, 구체적 지시, 맥락 제공, 예시 포함, 단계적 요청입니다. 배경·목적을 알리는 것도, 결과물 샘플을 주는 것도 아니고 분량과 형식을 또렷하게 정하는 원칙을 찾으세요.","w":"형식·길이·톤을 명확히 지정하는 것은 구체적 지시(Specific)입니다. 맥락 제공은 배경 정보·목적·대상 독자를, 예시 포함은 원하는 결과물 예시를 주는 원칙입니다.","an":"슬라이드 26 · 프롬프트 작성 핵심 5원칙","src":"1\n역할 부여 (Role)\n\"너는 10년 경력의 데이터 분석가야\" — 전문가 역할을 부여하면 답변 품질 향상\n2\n구체적 지시 (Specific)\n\"500자 이내, 3단락, 업무 보고 형식으로\" — 형식, 길이, 톤 명확히 지정\n3\n맥락 제공 (Context)\n배경 정보, 목적, 대상 독자를 알려주면 상황에 맞는 답변 획득\n4\n예시 포함 (Example)\n원하는 결과물 예시를 제공하면 AI가 패턴을 이해하고 유사 품질 생성\n5\n단계적 요청 (Step-by-step)\n복잡한 작업은 여러 단계로 나누어 요청. 한 번에 모든 것 요구하지 않기"},{"id":"t3-04","ty":"mc","lv":2,"game":true,"p":"'초등학생도 이해할 수 있게 설명해줘'는 출력 형식 제어 중 어떤 제어에 해당하는가?","o":["톤 제어","길이 제어","MECE 분류","JSON 구조화"],"a":0,"h":"출력 형식 제어는 표·목록·마크다운·JSON·MECE 같은 형식 패턴과, 분량과 말투를 조절하는 방법으로 나뉩니다. '3줄로 요약'이나 'A4 1장'은 분량을 다루고, '격식체'나 '친근하고 캐주얼하게'는 말투를 다룹니다.","w":"초등학생 눈높이로 설명하라는 요청은 격식체·캐주얼·학술적 어조와 함께 톤 제어 예시입니다. 길이 제어는 '3줄로 요약해줘', 'A4 1장 분량' 같은 요청입니다.","an":"슬라이드 31 · 고급 기법 4: 출력 형식 제어","src":"길이와 톤 제어\n길이 제어:\n\"3줄로 요약해줘\"\n\"A4 1장 분량으로 작성해줘\"\n\"500자 이내로 작성해줘\"\n톤 제어:\n\"격식체/비즈니스 톤으로 작성해줘\"\n\"초등학생도 이해할 수 있게 설명해줘\"\n\"친근하고 캐주얼한 톤으로 작성해줘\"\n\"학술적이고 전문적인 어조로 작성해줘\""},{"id":"t3-05","ty":"mc","lv":3,"game":true,"p":"개발자가 없는 팀이 업무 자동화 아이디어를 AI에게 물을 때 쓰기 알맞은 조건 제한 프롬프트는?","o":["월 100만원 이하로 실행 가능한 방안만","1주일 내 적용 가능한 방법만","1인이 혼자 진행할 수 있는 규모로","코딩 없이 노코드 도구만 활용하여"],"a":3,"h":"조건 제한 프롬프트는 예산·시간·인력·기술 네 가지 제한으로 나뉩니다. 이 팀의 제약은 돈이나 기간, 사람 수가 아니라 프로그래밍을 할 사람이 없다는 기술적 조건입니다.","w":"개발 인력이 없으면 기술 제한 '코딩 없이 노코드 도구만 활용하여'가 맞습니다. 나머지는 각각 예산·시간·인력 제한입니다.","an":"슬라이드 76 · 네거티브 프롬프트 활용법 · 조건 제한","src":"조건 제한 프롬프트\n예산 제한:\n\"월 100만원 이하로 실행 가능한 방안만\"\n시간 제한:\n\"1주일 내 적용 가능한 방법만\"\n인력 제한:\n\"1인이 혼자 진행할 수 있는 규모로\"\n기술 제한:\n\"코딩 없이 노코드 도구만 활용하여\""},{"id":"t3-06","ty":"ox","lv":1,"game":true,"p":"프롬프트를 쓸 때는 '~하지 마'처럼 부정형으로 지시하기보다 '~해줘'처럼 원하는 것을 지시하는 편이 권장된다.","a":true,"h":"프롬프트 작성 시 주의사항의 '피해야 할 실수' 목록에는 모호한 질문, 과도한 요청, 맥락 없는 대화, 형식 미지정과 함께 지시 방식에 관한 항목이 있습니다. 괄호 안에 어떤 표현보다 어떤 표현을 쓰라는지 적혀 있습니다.","w":"맞습니다. 교재는 '부정형 지시 (~하지 마 보다 ~해줘)'를 피해야 할 실수로 꼽습니다. 다만 핵심만 원할 때 등 목적이 분명하면 네거티브 프롬프트를 활용할 수 있습니다.","an":"슬라이드 72 · 프롬프트 작성 시 주의사항","src":"피해야 할 실수\n너무 모호한 질문 (\"뭐 좋은 거 없어?\")\n한 번에 너무 많은 것을 요청\n부정형 지시 (\"~하지 마\" 보다 \"~해줘\")\n맥락 없이 이어지는 대화\n결과물 형식을 지정하지 않는 것"},{"id":"t3-07","ty":"ox","lv":2,"game":true,"p":"프롬프트 A/B 테스트는 같은 프롬프트를 서로 다른 AI에 넣어 결과를 비교하는 방법이다.","a":false,"h":"A/B 테스트의 1단계는 같은 목적의 프롬프트를 역할이나 구조를 달리해 2~3개 준비하는 것입니다. 2단계에서는 이것들을 한 AI에 각각 넣어 구체성·정확성·유용성으로 평가합니다.","w":"틀렸습니다. A/B 테스트는 동일 주제의 다른 프롬프트 2~3개를 같은 AI에 입력해 비교합니다. 같은 프롬프트를 여러 AI에 넣는 것은 Day 1의 AI별 답변 비교입니다.","an":"슬라이드 77 · 프롬프트 A/B 테스트 방법","src":"1\n동일 주제, 다른 프롬프트 2~3개 준비\n같은 목적의 프롬프트를 다른 방식으로 작성합니다. (예: 역할 다르게, 구조 다르게)\n2\n같은 AI에 각각 입력하여 결과 비교\n각 프롬프트의 결과물을 구체성, 정확성, 유용성 기준으로 평가합니다."},{"id":"t3-08","ty":"match","lv":2,"game":false,"p":"만능 프롬프트 템플릿 CRISP의 요소와 예시 문장을 연결하세요.","pairs":[["Context (맥락)","우리 팀은 B2B SaaS 스타트업의 마케팅팀이야"],["Role (역할)","너는 시니어 콘텐츠 마케터 역할을 해줘"],["Instruction (지시)","블로그 포스트 제목 10개를 제안해줘"],["Specifics (세부사항)","SEO 키워드 포함, 클릭유도 형식, 한글 30자 이내"],["Preference (선호)","표 형식으로 정리, 예상 CTR도 함께 표시"]],"h":"CRISP는 상황 설명 → 맡을 역할 → 해야 할 일 → 지켜야 할 조건 → 원하는 정리 방식 순서입니다. '우리 팀은…'은 배경, '너는…'은 역할, '제안해줘'는 할 일이고, 글자 수 같은 조건과 결과 표시 방식을 구분해 보세요.","w":"CRISP 슬라이드의 예시 그대로입니다. Specifics는 결과물이 지켜야 할 조건, Preference는 결과를 보여 줄 형식에 대한 선호입니다.","an":"슬라이드 27 · 만능 프롬프트 템플릿 (CRISP)","src":"C\nContext (맥락)\n\"우리 팀은 B2B SaaS 스타트업의 마케팅팀이야\"\nR\nRole (역할)\n\"너는 시니어 콘텐츠 마케터 역할을 해줘\"\nI\nInstruction (지시)\n\"블로그 포스트 제목 10개를 제안해줘\"\nS\nSpecifics (세부사항)\n\"SEO 키워드 포함, 클릭유도 형식, 한글 30자 이내\"\nP\nPreference (선호)\n\"표 형식으로 정리, 예상 CTR도 함께 표시\""},{"id":"t3-09","ty":"order","lv":1,"game":false,"p":"프롬프트 A/B 테스트 4단계를 순서대로 정렬하세요.","steps":["동일 주제, 다른 프롬프트 2~3개 준비","같은 AI에 각각 입력하여 결과 비교","최적 프롬프트 선정 & 라이브러리에 저장","지속적으로 개선 반복"],"h":"먼저 같은 목적으로 다르게 쓴 프롬프트를 마련하고, 한 AI에 넣어 결과를 견줍니다. 가장 좋은 것을 골라 라이브러리에 등록한 뒤, 업무 상황이 바뀌면 다시 다듬는 일을 이어갑니다.","w":"준비 → 비교 → 선정·저장 → 개선 반복 순서입니다. 마지막 단계에서 업무 상황이 바뀌면 프롬프트도 업데이트합니다.","an":"슬라이드 77 · 프롬프트 A/B 테스트 방법","src":"1\n동일 주제, 다른 프롬프트 2~3개 준비\n같은 목적의 프롬프트를 다른 방식으로 작성합니다. (예: 역할 다르게, 구조 다르게)\n2\n같은 AI에 각각 입력하여 결과 비교\n각 프롬프트의 결과물을 구체성, 정확성, 유용성 기준으로 평가합니다.\n3\n최적 프롬프트 선정 & 라이브러리에 저장\n가장 좋은 결과를 내는 프롬프트를 프롬프트 라이브러리에 등록합니다.\n4\n지속적으로 개선 반복\n업무 상황이 바뀌면 프롬프트도 업데이트하여 최적 상태를 유지합니다."},{"id":"t3-10","ty":"multi","lv":3,"game":true,"p":"동료의 프롬프트 습관 중 교재가 '피해야 할 실수'로 꼽은 것을 <b>모두<\/b> 고르세요.","o":["'뭐 좋은 거 없어?'처럼 묻는다","한 번에 많은 것을 요청한다","복잡한 작업을 단계별로 나눈다","맥락 없이 대화를 이어간다","결과물 형식을 지정하지 않는다"],"a":[0,1,3,4],"h":"주의사항 슬라이드는 피해야 할 실수 5개와 효과적인 전략 5개를 나란히 둡니다. 모호한 질문, 과도한 요청, 부정형 지시, 맥락 없는 대화, 형식 미지정이 실수 쪽이고, 작업을 나누어 맡기는 습관은 전략 쪽입니다.","w":"복잡한 작업을 단계별로 분리하는 것은 '효과적인 전략'입니다. 나머지 넷은 '피해야 할 실수' 목록에 있습니다.","an":"슬라이드 72 · 프롬프트 작성 시 주의사항","src":"피해야 할 실수\n너무 모호한 질문 (\"뭐 좋은 거 없어?\")\n한 번에 너무 많은 것을 요청\n부정형 지시 (\"~하지 마\" 보다 \"~해줘\")\n맥락 없이 이어지는 대화\n결과물 형식을 지정하지 않는 것\n효과적인 전략\n명확하고 구체적인 지시어 사용\n복잡한 작업은 단계별로 분리\n원하는 출력 형식을 미리 지정\n결과가 부족하면 추가 질문으로 보완\n좋은 결과가 나오면 프롬프트 저장"}]},{"id":"t4","title":"고급 프롬프트 기법과 실무 활용","ref":"슬라이드 28~30, 32~38, 73~74","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":true,"p":"프롬프트에 '배송 최고! → 긍정' 같은 예시를 넣어 분류 정확도를 높이는 기법은?","o":["Zero-Shot","Few-Shot","Chain-of-Thought","프롬프트 체이닝"],"a":1,"h":"고급 기법 1은 예시 없이 바로 묻는 방식과 예시 몇 개를 먼저 보여 주는 방식을 비교합니다. 긍정·부정·중립 예시를 보여 준 뒤 분석할 리뷰를 주자 결과의 정확도가 올라갔습니다.","w":"예시를 포함하는 방식은 Few-Shot입니다. Zero-Shot은 예시 없이 요청하고, Chain-of-Thought는 단계별 분석을 지시하는 기법입니다.","an":"슬라이드 28 · 고급 기법 1: Zero-Shot vs Few-Shot","src":"Zero-Shot (예시 없이)\n\"다음 리뷰의 감성을 분석해줘: '배송이 빨라서 좋았습니다'\"\n→ 결과: 긍정\nFew-Shot (예시 포함)\n\"리뷰 감성 분석을 해줘. 예시:\n- '배송 최고!' → 긍정\n- '포장이 찢어져 왔어요' → 부정\n- '그냥 그래요' → 중립\n분석할 리뷰: '가격 대비 품질이 아쉽네요'\"\n→ 결과: 부정 (정확도 향상!)"},{"id":"t4-02","ty":"mc","lv":2,"game":true,"p":"매출 15% 감소 예시에서 CoT 프롬프트가 일반 프롬프트보다 나은 결과를 낸 이유는?","o":["예시 리뷰를 여러 개 보여 줬다","유명 전문가의 역할을 부여했다","분석 단계를 1)~4)로 나눠 지시했다","결과를 JSON 형식으로 요청했다"],"a":2,"h":"일반 프롬프트는 원인과 대응 방안을 한 번에 물어 피상적인 답을 얻었습니다. CoT 프롬프트는 외부 원인 → 내부 원인 → 원인별 대응 → 단기·중기 실행 계획처럼 생각의 순서를 잡아 주어 체계적인 답을 얻었습니다.","w":"CoT는 '단계별로 분석해줘'라며 사고 과정을 단계로 나눠 지시합니다. 예시를 보여 주는 것은 Few-Shot, 역할 부여는 페르소나 기법입니다.","an":"슬라이드 29 · 고급 기법 2: Chain-of-Thought (CoT)","src":"일반 프롬프트\n\"우리 회사 매출이 작년 대비 15% 감소했어.\n원인과 대응 방안을 알려줘.\"\n→ 결과: 일반적/피상적 답변\nCoT 프롬프트\n\"우리 회사 매출이 작년 대비 15% 감소했어.\n단계별로 분석해줘:\n1) 가능한 외부 원인 3가지\n2) 가능한 내부 원인 3가지\n3) 각 원인별 구체적 대응 방안\n4) 단기(1개월)와 중기(6개월) 실행 계획\"\n→ 결과: 체계적이고 실행 가능한 답변!"},{"id":"t4-03","ty":"mc","lv":3,"game":true,"p":"사업 제안서를 다중 관점으로 평가받을 때 '기술적 실현가능성'을 보려면 어떤 관점을 요청하는가?","o":["CEO 관점","CFO 관점","고객 관점","CTO 관점"],"a":3,"h":"다중 관점 분석 기법은 하나의 제안서를 경영 전략, 재무, 기술, 시장의 네 역할로 나눠 평가하게 합니다. 회사에서 기술을 총괄하는 임원의 직함을 떠올려 보세요.","w":"CTO 관점이 기술적 실현가능성입니다. CEO는 전략적 가치, CFO는 재무적 타당성, 고객은 시장 수요와 가치를 봅니다.","an":"슬라이드 30 · 다중 관점 분석 기법","src":"다중 관점 분석 기법\n하나의 주제를 여러 역할로 분석하기:\n프롬프트: \"이 사업 제안서를 다음 관점에서 각각 평가해줘:\"\n1) CEO 관점: 전략적 가치\n2) CFO 관점: 재무적 타당성\n3) CTO 관점: 기술적 실현가능성\n4) 고객 관점: 시장 수요와 가치\n→ 하나의 프롬프트로 360도 분석 가능!"},{"id":"t4-04","ty":"mc","lv":1,"game":true,"p":"Day 2 실습 과제 평가 기준에서 '프롬프트 구체성'이 차지하는 비중은?","o":["10%","20%","30%","40%"],"a":2,"h":"평가 기준은 네 항목으로 합이 100%입니다. 창의성과 문서화가 같은 비중이고, CRISP 요소 포함 여부를 보는 구체성과 결과물 품질이 그보다 큰 같은 비중입니다.","w":"프롬프트 구체성과 결과물 품질이 각 30%, 창의성과 문서화가 각 20%입니다.","an":"슬라이드 37 · Day 2 실습 과제 & 평가","src":"평가 기준\n프롬프트 구체성 (30%) — CRISP 요소가 모두 포함되었는가?\n결과물 품질 (30%) — AI가 실제로 유용한 답변을 생성했는가?\n창의성 (20%) — 업무에 독창적으로 AI를 활용했는가?\n문서화 (20%) — 프롬프트 라이브러리가 체계적으로 정리되었는가?"},{"id":"t4-05","ty":"mc","lv":3,"game":true,"p":"AI가 월별 매출 분석 결과를 내놓았습니다. 자료 분석 실습 절차상 시각화를 요청하기 전에 할 일은?","o":["결과를 수동으로 교차검증한다","CSV 파일을 다시 업로드한다","페르소나를 바꿔 다시 묻는다","결과를 바로 보고서로 제출한다"],"a":0,"h":"자료 분석 실습은 데이터 업로드 → 분석 요청 → 결과 검증의 3단계입니다. 마지막 단계에서는 AI가 낸 숫자를 사람이 직접 맞는지 확인한 다음에 차트 등을 요청합니다.","w":"3단계 '결과 검증'은 AI 결과를 수동 교차검증한 뒤 시각화를 요청하는 것입니다. 파일 업로드는 1단계이고, 검증 없이 제출하는 것은 보안·윤리 가이드에도 어긋납니다.","an":"슬라이드 32 · 실습: 자료 분석 프롬프트 작성","src":"1\n데이터 업로드\nCSV/Excel 파일을 AI에 업로드하고 구조 설명\n2\n분석 요청\nCRISP 템플릿으로 구체적 분석 지시 작성\n3\n결과 검증\nAI 결과를 수동 교차검증 후 시각화 요청"},{"id":"t4-06","ty":"ox","lv":2,"game":true,"p":"프롬프트 라이브러리에는 효과가 좋았던 성공 사례만 기록하고 실패 사례는 지우는 것이 좋다.","a":false,"h":"라이브러리 관리 팁은 효과 등급 부여, 사용 날짜와 결과 품질 기록, 팀원 피드백 반영, 버전 관리를 권합니다. 마지막 팁은 잘된 것과 잘 안된 것을 대하는 방법에 관한 내용입니다.","w":"틀렸습니다. 관리 팁은 '성공 사례와 실패 사례 모두 기록'하라고 합니다. v1.0, v1.1처럼 버전 이력도 추적합니다.","an":"슬라이드 36 · 나만의 프롬프트 라이브러리 구축 · 관리 팁","src":"관리 팁\n각 프롬프트에 '효과 등급' 부여 (★~★★★★★)\n사용 날짜와 결과 품질을 함께 기록\n팀원들의 피드백을 반영하여 지속 개선\n버전 관리: v1.0, v1.1 등으로 이력 추적\n성공 사례와 실패 사례 모두 기록"},{"id":"t4-07","ty":"ox","lv":1,"game":true,"p":"회의록 정리 프롬프트에서 Action Items는 담당자·할 일·마감일·상태를 담은 표 형식으로 요청한다.","a":true,"h":"회의록 프롬프트는 기본 정보, 주요 논의, 결정 사항, Action Items, 다음 안건의 다섯 항목으로 정리를 요청합니다. 마지막 줄에서 Action Items만 따로 정리 형식과 열 구성을 못 박아 둡니다.","w":"맞습니다. 'Action Items는 반드시 표 형식으로 정리해줘 (담당자 | 할 일 | 마감일 | 상태)'라고 요청합니다.","an":"슬라이드 74 · 실습: AI로 회의록 정리하기","src":"형식:\n1) 회의 기본 정보 (일시, 참석자, 주제)\n2) 주요 논의 사항 (항목별 정리)\n3) 결정 사항 (확정된 내용만)\n4) Action Items (담당자 + 마감일 + 구체적 할 일)\n5) 다음 회의 안건\nAction Items는 반드시 표 형식으로 정리해줘 (담당자 | 할 일 | 마감일 | 상태)\""},{"id":"t4-08","ty":"match","lv":1,"game":false,"p":"데이터 시각화 프롬프트의 종류와 요청 예시를 연결하세요.","pairs":[["차트 생성","월별 막대+누적 꺾은선, Python matplotlib"],["대시보드","매출·고객수·전환율·이탈률 카드를 담은 KPI HTML"],["인포그래픽","회사 연혁 타임라인을 SVG로 생성"],["비교 분석","A제품 vs B제품 레이더 차트"]],"h":"업무 기획 실습 슬라이드 오른쪽의 데이터 시각화 프롬프트는 네 종류입니다. 그래프 그리기는 파이썬 라이브러리로, 여러 지표를 한 화면 카드로 보여 주는 것은 웹 페이지로, 연혁은 그림 파일로, 두 제품 비교는 거미줄 모양 차트로 요청합니다.","w":"슬라이드 33의 데이터 시각화 프롬프트 그대로입니다. 비교 분석 예시는 가격·품질·디자인·기능·AS 다섯 축으로 두 제품을 비교합니다.","an":"슬라이드 33 · 데이터 시각화 프롬프트","src":"데이터 시각화 프롬프트\n차트 생성:\n\"매출 데이터를 월별 막대+누적 꺾은선 차트로. Python matplotlib\"\n대시보드:\n\"KPI 대시보드 HTML. 매출, 고객수, 전환율, 이탈률 카드 표시\"\n인포그래픽:\n\"회사 연혁 타임라인 인포그래픽. SVG로 생성\"\n비교 분석:\n\"A제품 vs B제품 비교 레이더 차트. 가격, 품질, 디자인, 기능, AS\""},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"프롬프트 체이닝 실전 기법 5단계를 순서대로 정렬하세요.","steps":["브레인스토밍","평가 & 선별","구체화","실행 계획","최종 문서"],"h":"예시는 AI 교육 사업 아이디어 10개를 받는 데서 시작합니다. 이를 시장성·수익성·실현가능성으로 걸러 Top 3를 고르고, 1위를 린 캔버스로 다듬은 뒤 3개월 로드맵을 짜고, 마지막에 투자 제안서로 묶습니다.","w":"브레인스토밍 → 평가 & 선별 → 구체화 → 실행 계획 → 최종 문서 순서입니다. 앞 단계 결과를 다음 프롬프트의 입력으로 이어 붙이는 것이 체이닝입니다.","an":"슬라이드 35 · 프롬프트 체이닝 실전 기법","src":"1\n브레인스토밍\n\"AI 교육 사업 아이디어 10개 제안해줘\"\n2\n평가 & 선별\n\"위 10개를 시장성, 수익성, 실현가능성으로 평가하고 Top 3 선정\"\n3\n구체화\n\"1위 아이디어를 린 캔버스 형태로 구체화해줘\"\n4\n실행 계획\n\"이 사업의 3개월 실행 로드맵을 주차별로 작성해줘\"\n5\n최종 문서\n\"위 내용을 종합하여 투자 제안서 형태로 정리해줘\""},{"id":"t4-10","ty":"multi","lv":2,"game":false,"p":"Day 2 핵심 정리 체크리스트에 있는 항목을 <b>모두<\/b> 고르세요.","o":["Zero-Shot·Few-Shot·CoT 차이 이해","페르소나 기법으로 전문적 답변 유도","체이닝으로 복잡한 작업 단계 처리","AI 도구 계정 2개 이상 생성","프롬프트 라이브러리 초안 구축"],"a":[0,1,2,4],"h":"Day 2 체크리스트는 좋은·나쁜 프롬프트 구분, CRISP 5요소, 세 가지 고급 기법, 역할극, 체이닝, 자료 분석·기획·문서 작성 실습, 라이브러리, 출력 형식 제어의 8개입니다. 서비스 가입은 프롬프트를 배우기 전 첫날에 확인한 항목입니다.","w":"계정 2개 이상 생성은 Day 1 체크리스트 항목입니다. 나머지 넷은 Day 2 체크리스트에 있습니다.","an":"슬라이드 38 · Day 2 핵심 정리 & 체크리스트","src":"오늘 배운 내용 체크리스트\n□ 좋은 프롬프트와 나쁜 프롬프트의 차이를 설명할 수 있다\n□ CRISP 템플릿의 5가지 요소를 이해하고 작성할 수 있다\n□ Zero-Shot, Few-Shot, CoT 기법의 차이를 이해한다\n□ 역할극/페르소나 기법으로 전문적 답변을 이끌어낼 수 있다\n□ 프롬프트 체이닝으로 복잡한 작업을 단계적으로 처리할 수 있다\n□ 자료 분석, 업무 기획, 문서 작성 프롬프트를 직접 작성해 보았다\n□ 나만의 프롬프트 라이브러리 초안을 구축했다\n□ AI 결과물의 출력 형식(표, 목록, JSON 등)을 제어할 수 있다"}]},{"id":"t5","title":"바이브 코딩 개념과 도구","ref":"슬라이드 39~45 · 51 · 81 · 86","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"교재가 정의한 바이브 코딩(Vibe Coding)은?","o":["자연어 지시로 AI가 프로그램 제작","코드를 한 줄씩 직접 작성","AI 모델을 직접 학습시키기","알고리즘·자료구조부터 공부"],"a":0,"h":"Day 3 첫 개념 슬라이드는 바이브 코딩을 새로운 개발 방식으로 소개합니다. 프로그래밍 언어 대신 사람이 평소 쓰는 말로 AI에게 지시하고, 코드는 AI가 만들어 줍니다.","w":"바이브 코딩은 자연어로 AI에게 지시해 프로그램을 만드는 방식입니다. 코드를 직접 한 줄씩 쓰거나 문법·알고리즘부터 공부하는 것은 기존 개발 방식입니다.","an":"슬라이드 40 · 바이브 코딩(Vibe Coding)이란?","src":"바이브 코딩 = 자연어로 AI에게 지시하여 프로그램을 만드는 새로운 개발 방식"},{"id":"t5-02","ty":"mc","lv":2,"game":true,"p":"바이브 코딩 워크플로우에서 '생성된 코드를 실행하고 동작을 확인'하는 단계는?","o":["아이디어 구상","AI에게 지시","결과 확인","반복 & 완성"],"a":2,"h":"워크플로우는 구상 → 지시 → 확인 → 수정 요청 → 반복·완성의 5단계입니다. AI가 코드를 만든 직후, 수정 요청을 하기 전에 실제로 돌려 보는 3번째 단계를 찾으세요.","w":"3단계 '결과 확인'에서 생성된 코드를 실행하고 동작을 확인합니다. 'AI에게 지시'는 코드 생성을 요청하는 2단계입니다.","an":"슬라이드 41 · 바이브 코딩 워크플로우","src":"2\nAI에게 지시\n구체적인 프롬프트로 AI에게 코드 생성 요청\n3\n결과 확인\n생성된 코드를 실행하고 동작 확인\n4\n수정 요청\n원하는 대로 되지 않는 부분을 자연어로 수정 요청"},{"id":"t5-03","ty":"mc","lv":1,"game":true,"p":"Cursor AI에서 '자연어 → 전체 프로젝트 생성'을 담당하는 기능은?","o":["Tab","Composer","Chat","Apply"],"a":1,"h":"Cursor AI는 VS Code 기반 AI 네이티브 에디터로 여러 기능을 갖고 있습니다. Tab은 자동 완성, Chat은 코드베이스 질의응답, Apply는 변경 즉시 적용이며, 대규모 변경과 프로젝트 생성은 '작곡가'라는 뜻의 기능이 맡습니다.","w":"Composer가 자연어로 전체 프로젝트를 생성합니다. Tab은 AI 코드 자동 완성, Chat은 코드베이스 질의응답 기능입니다.","an":"슬라이드 42 · Cursor AI 상세 가이드","src":"VS Code 기반 AI 네이티브 에디터\nComposer: 자연어 → 전체 프로젝트 생성\nTab: AI 코드 자동 완성\nChat: 코드베이스에 대한 질의응답\nMulti-file Edit: 여러 파일 동시 수정\nApply: 코드 변경 즉시 적용"},{"id":"t5-04","ty":"mc","lv":3,"game":true,"p":"'매일 수동 데이터 정리에 2시간이 걸린다'고 적었다면 아이디어 구체화 5단계 중 어느 단계인가요?","o":["사용자 설정","기능 목록","입출력 정의","문제 정의"],"a":3,"h":"구체화 5단계의 첫 단계는 '내가 해결하고 싶은 문제는?'이라는 질문에 답하는 것입니다. 누가 쓰는지, 어떤 기능인지, 무엇을 넣고 무엇이 나오는지는 그다음 단계에서 정합니다.","w":"해결하고 싶은 불편(2시간 소요)을 적는 것은 1단계 '문제 정의'입니다. '우리 팀 5명이 사용'은 사용자 설정, 'CSV 업로드→대시보드'는 입출력 정의의 예입니다.","an":"슬라이드 45 · 코딩 아이디어 구체화 5단계","src":"1\n문제 정의\n내가 해결하고 싶은 문제는?\n예: \"매일 수동 데이터 정리에 2시간 소요\"\n2\n사용자 설정\n이 프로그램을 누가 사용?\n예: \"우리 팀 5명이 사용할 내부 도구\""},{"id":"t5-05","ty":"mc","lv":2,"game":true,"p":"엑셀 파일을 올려 자동 분석하고 생성된 파일을 바로 내려받는 흐름이 소개된 도구는?","o":["Cursor AI","Claude Artifacts","ChatGPT Canvas/Code","Live Server"],"a":2,"h":"Day 3의 세 도구 가이드 중 Python 코드 실시간 실행과 Code Interpreter가 내장된 도구가 데이터 분석 자동화를 맡습니다. 이 도구의 '시작하기'에는 파일 업로드 → 자동 분석 → 다운로드 흐름이 있습니다.","w":"ChatGPT Canvas/Code 가이드에 엑셀 업로드 → 자동 분석 → 파일 다운로드가 있습니다. Cursor는 코드 에디터, Artifacts는 웹 미리보기 중심 도구입니다.","an":"슬라이드 44 · ChatGPT Canvas/Code 가이드","src":"시작하기\nchat.openai.com 접속\n\"Python 코드를 작성해줘\"\nCanvas 모드에서 직접 수정\n엑셀 파일 업로드 → 자동 분석\n생성된 파일 바로 다운로드 가능"},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"바이브 코딩 방식에서는 '이 버그 고쳐줘'처럼 AI에게 디버깅을 맡길 수 있다.","a":true,"h":"교재는 기존 개발 방식과 바이브 코딩 방식을 나란히 비교합니다. 기존 방식은 오류가 나면 사람이 직접 고쳐야 하지만, 바이브 코딩 방식은 자연어 한마디로 AI에게 수정을 맡깁니다.","w":"맞습니다. 기존 방식은 오류 시 수동 디버깅, 바이브 코딩은 '이 버그 고쳐줘'로 AI가 디버깅합니다.","an":"슬라이드 40 · 기존 방식 vs 바이브 코딩 방식","src":"기존 개발 방식\n프로그래밍 언어 학습 (6개월~수년)\n문법, 알고리즘, 자료구조 공부\n코드 한 줄 한 줄 직접 작성\n오류 발생 시 수동 디버깅\n바이브 코딩 방식\n\"~만들어줘\" 자연어로 지시 (즉시 시작)\nAI가 코드 자동 생성 및 실행\n결과 확인 → 수정 요청 반복\n\"이 버그 고쳐줘\" AI가 디버깅"},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"웹 기술을 건물에 비유하면 CSS는 건물의 '전기/설비'에 해당한다.","a":false,"h":"HTML은 구조와 내용, CSS는 색상·크기·배치 같은 디자인, JavaScript는 클릭·계산 같은 동작을 맡습니다. 건물 비유로는 골조, 인테리어, 전기/설비가 각각 하나씩 대응합니다.","w":"틀렸습니다. CSS는 건물의 '인테리어'이고, '전기/설비'는 동작을 담당하는 JavaScript입니다.","an":"슬라이드 51 · 비개발자를 위한 웹 기술 기초","src":"CSS (디자인)\n웹페이지의 색상, 크기, 배치\n폰트, 여백, 그림자, 애니메이션\n스타일시트로 디자인 적용\n예시:\ncolor: blue;\nfont-size: 16px;\nbackground: #f0f0f0;\n비유: 건물의 '인테리어'\nJavaScript (동작)\n웹페이지에 기능/동작 추가\n클릭, 입력, 계산, 데이터 처리\n사용자와의 상호작용 담당\n예시:\n버튼 클릭 → 알림 표시\n입력 값 → 계산 결과 표시\n데이터 저장/불러오기\n비유: 건물의 '전기/설비'"},{"id":"t5-08","ty":"match","lv":1,"game":false,"p":"AI에게 요청할 때 쓰는 기술 용어와 의미를 연결하세요.","pairs":[["반응형 디자인","화면 크기에 따라 레이아웃이 자동으로 변함"],["모달 팝업","화면 위에 떠오르는 작은 창"],["호버 효과","마우스를 올렸을 때의 시각적 변화"],["프로그레스 바","진행 상황을 표시하는 막대"],["토글 버튼","켜기/끄기를 전환하는 스위치형 버튼"]],"h":"기술 용어표는 AI에게 정확한 이름으로 요청하도록 돕습니다. '떠오르다', '마우스를 올리다', '진행', '켜고 끄기', '화면 크기' 같은 핵심 단어를 용어의 뜻과 짝지어 보세요.","w":"반응형=화면 크기별 레이아웃 변화, 모달=떠오르는 창, 호버=마우스 오버 변화, 프로그레스 바=진행 막대, 토글=켜기/끄기 스위치입니다.","an":"슬라이드 81 · AI에게 요청할 때 알면 좋은 기술 용어","src":"반응형 디자인 | 화면 크기에 따라 자동으로 레이아웃이 변하는 디자인\n카드 UI | 콘텐츠를 카드 형태의 박스로 구분하는 인터페이스\n모달 팝업 | 화면 위에 떠오르는 작은 창 (알림, 상세 정보 등)\n호버 효과 | 마우스를 올렸을 때 나타나는 시각적 변화\n드래그 앤 드롭 | 요소를 마우스로 잡고 옮기는 인터랙션\n프로그레스 바 | 진행 상황을 시각적으로 표시하는 막대\n토글 버튼 | 켜기/끄기를 전환하는 스위치 형태의 버튼"},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"Cursor AI로 웹사이트 만들기 실습 단계를 순서대로 정렬하세요.","steps":["cursor.com에서 다운로드 & 설치","새 폴더 생성 → Cursor에서 열기","Ctrl+I로 Composer 모드 열기","포트폴리오 프롬프트 입력","'Accept All'로 생성된 파일 확인"],"h":"먼저 프로그램을 설치하고 작업할 폴더를 엽니다. 그다음 프로젝트 생성 모드를 열어 프롬프트를 넣고, 마지막으로 AI가 만든 파일을 모두 받아들여 확인합니다.","w":"Step 1 설치 → Step 2 폴더 열기 → Step 3 Ctrl+I(Composer) → Step 4 프롬프트 입력 → Step 5 Accept All 순서입니다. 이후 Live Server로 열어 보고 수정 요청을 이어 갑니다.","an":"슬라이드 86 · Cursor AI 실습 상세 가이드","src":"Step 1: cursor.com에서 다운로드 & 설치\nStep 2: 새 폴더 생성 → Cursor에서 열기 (File → Open Folder)\nStep 3: Ctrl+I (Composer 모드) 열기\nStep 4: 다음 프롬프트 입력:"},{"id":"t5-10","ty":"multi","lv":3,"game":true,"p":"설치 없이 Claude Artifacts로 HTML 앱을 바로 만들려 합니다. 가이드의 '시작하기'에 해당하는 것을 <b>모두<\/b> 고르세요.","o":["claude.ai 접속 → 계정 생성","'HTML로 만들어줘' 입력","우측 미리보기 패널 확인","cursor.com에서 다운로드","Ctrl+I로 Composer 열기"],"a":[0,1,2],"h":"Claude Artifacts는 웹에서 바로 코드를 실행하고 미리보기하므로 프로그램 설치가 필요 없습니다. 웹 주소로 접속해 만들 것을 말로 요청하고, 화면 옆에 뜨는 결과를 확인하는 흐름입니다.","w":"Artifacts 시작하기는 claude.ai 접속 → 'HTML로 만들어줘' 입력 → 우측 미리보기 확인입니다. 다운로드와 Composer는 Cursor AI의 사용 절차입니다.","an":"슬라이드 43 · Claude Artifacts 상세 가이드","src":"시작하기\nclaude.ai 접속 → 계정 생성\n\"HTML로 만들어줘\" 입력\n우측 미리보기 패널 확인\n\"여기서 색상을 파란색으로 바꿔줘\"\n복잡한 앱도 대화로 점진적 구축 가능"}]},{"id":"t6","title":"웹 앱 실습과 디버깅","ref":"슬라이드 46~50 · 52~55 · 80 · 82~84 · 87~90","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"'먼저 기본 뼈대만 만들어줘 → 기능 추가 → 디자인 개선'처럼 요청하는 코드 생성 패턴은?","o":["기능 명세형","점진적 확장형","참고 사이트형","리팩토링형"],"a":1,"h":"코드 생성 프롬프트 패턴은 다섯 가지입니다. 이 패턴은 한 번에 다 요청하지 않고 단계별로 넓혀 가며 품질을 높이는 핵심 전략으로 소개됩니다.","w":"단계별로 요청을 늘려 가는 것은 점진적 확장형입니다. 기능 명세형은 기능을 한 번에 나열하고, 리팩토링형은 기존 코드 품질을 높이는 요청입니다.","an":"슬라이드 50 · 코드 생성 프롬프트 핵심 패턴","src":"점진적 확장형\n\"먼저 기본 뼈대만 만들어줘\" → \"여기에 ~기능 추가\" → \"디자인 개선\"\n단계별 요청으로 품질을 높이는 핵심 전략"},{"id":"t6-02","ty":"mc","lv":3,"game":true,"p":"만든 앱에서 새로고침하면 입력한 데이터가 사라집니다. 교재가 권하는 요청은?","o":["CSS를 반응형으로 수정해줘","이벤트 핸들러를 확인해줘","localStorage로 저장 기능 추가해줘","Chart.js로 차트를 추가해줘"],"a":2,"h":"흔한 오류 목록은 증상마다 AI에게 할 말을 짝지어 둡니다. 새로고침 후에도 데이터를 남기려면 브라우저 안에 데이터를 보관하는 기능을 요청해야 합니다.","w":"데이터가 저장되지 않을 때는 'localStorage로 저장 기능 추가해줘'라고 요청합니다. 반응형 CSS는 레이아웃 깨짐, 이벤트 핸들러는 버튼 무반응에 대한 요청입니다.","an":"슬라이드 52 · 흔한 오류와 AI에게 요청하는 법","src":"흔한 오류와 AI에게 요청하는 법\n화면이 빈 페이지만 나올 때: \"코드를 실행하면 빈 화면만 보여. 콘솔 에러: [메시지]. 수정해줘\"\n버튼이 동작하지 않을 때: \"추가 버튼을 클릭해도 아무 반응이 없어. 이벤트 핸들러를 확인해줘\"\n레이아웃이 깨질 때: \"모바일에서 내용이 잘려서 보여. CSS를 반응형으로 수정해줘\"\n데이터가 저장되지 않을 때: \"새로고침하면 데이터가 사라져. localStorage로 저장 기능 추가해줘\""},{"id":"t6-03","ty":"mc","lv":1,"game":true,"p":"실전 프로젝트 '나만의 업무 도구 만들기'에서 시간이 가장 많이 배정된 단계는?","o":["아이디어 선정","기능 확장","시연 준비","프로토타입 개발"],"a":3,"h":"실전 프로젝트는 네 단계로, 선정과 시연 준비는 각각 15분, 기능 확장은 30분입니다. Claude Artifacts나 ChatGPT로 아이디어를 실제 웹 앱으로 처음 구현하는 단계에 한 시간이 배정됩니다.","w":"프로토타입 개발이 60분으로 가장 깁니다. 아이디어 선정 15분, 기능 확장 30분, 시연 준비 15분입니다.","an":"슬라이드 53 · 실전 프로젝트: 나만의 업무 도구 만들기","src":"1\n아이디어 선정 (15분)\n오전에 배운 아이디어 구체화 방법을 활용하여, 내 업무에 필요한 도구 아이디어를 선정합니다.\n2\n프로토타입 개발 (60분)\nClaude Artifacts 또는 ChatGPT를 사용하여 선택한 아이디어를 실제 웹 앱으로 구현합니다.\n3\n기능 확장 (30분)\n기본 기능이 동작하면, 추가 기능과 디자인 개선을 반복적으로 요청합니다.\n4\n시연 준비 (15분)"},{"id":"t6-04","ty":"mc","lv":2,"game":true,"p":"바이브 코딩의 흔한 실수 중 '모호한 지시'에 대한 해결법은?","o":["구체적 수치/색상/동작 명시","MVP부터 시작, 기능 1개씩 추가","반드시 테스트하고 수정 요청","에러 메시지를 AI에게 전달"],"a":0,"h":"흔한 실수는 네 가지이고 각각 해결법이 붙어 있습니다. 전략 2번에서 '예쁘게' 대신 '파란색 카드, 그림자'처럼 말하라고 한 것과 같은 맥락입니다.","w":"모호한 지시는 구체적인 수치·색상·동작을 명시해 해결합니다. MVP부터 시작은 '한 번에 모든 기능 요청', 테스트는 'AI 결과를 그대로 사용'의 해결법입니다.","an":"슬라이드 54 · 바이브 코딩 Best Practices","src":"흔한 실수와 해결법\n실수 1: 한 번에 모든 기능 요청\n→ 해결: MVP부터 시작, 기능 1개씩 추가\n실수 2: 모호한 지시\n→ 해결: 구체적 수치/색상/동작 명시\n실수 3: AI 결과를 그대로 사용\n→ 해결: 반드시 테스트하고 수정 요청\n실수 4: 에러 발생 시 포기\n→ 해결: 에러 메시지를 AI에게 전달!"},{"id":"t6-05","ty":"mc","lv":3,"game":true,"p":"모바일에서 상단 메뉴가 화면을 너무 많이 차지합니다. 반응형 '세부 요청' 예시로 알맞은 것은?","o":["제목은 24px 볼드, 본문은 14px","모바일에서 네비게이션을 햄버거 메뉴로","스크롤 시 fade-in 효과 추가","로딩 시 스켈레톤 UI 표시"],"a":1,"h":"반응형 요청은 기본 요청, 세부 요청, 테스트 요청으로 나뉩니다. 세부 요청에는 768px 이하 1열 레이아웃, 터치 영역 44px 등 모바일 화면 구성을 바꾸는 문장이 들어 있습니다.","w":"'모바일에서 네비게이션을 햄버거 메뉴로'가 반응형 세부 요청입니다. 글자 크기는 타이포그래피, fade-in과 스켈레톤 UI는 애니메이션 개선 프롬프트입니다.","an":"슬라이드 84 · 반응형 & 디자인 개선 프롬프트","src":"세부 요청:\n\"768px 이하에서는 1열 레이아웃으로 변경\"\n\"모바일에서 네비게이션을 햄버거 메뉴로\"\n\"터치 영역을 44px 이상으로 설정\""},{"id":"t6-06","ty":"ox","lv":1,"game":true,"p":"교재는 KPI 대시보드와 회의록 요약 도구를 초급 프로젝트 아이디어로 분류한다.","a":false,"h":"프로젝트 아이디어는 초급·중급·고급으로 나뉩니다. 초급에는 할 일 목록, 타이머, 단위 변환기처럼 단순한 도구가 있고, CSV 차트나 자동 추출이 필요한 도구는 한 단계 위에 있습니다.","w":"틀렸습니다. KPI 대시보드와 회의록 요약 도구는 중급 아이디어입니다. 초급은 할 일 목록 앱, 타이머, 단위 변환기 등입니다.","an":"슬라이드 47 · 바이브 코딩 프로젝트 아이디어 (중급)","src":"바이브 코딩 프로젝트 아이디어 (중급)\nDay 3\nKPI 대시보드\nCSV 데이터 업로드 → 자동 차트 생성, 주요 지표 카드 표시\n회의록 요약 도구\n회의 내용 입력 → 핵심 결정사항, 할 일, 담당자 자동 추출"},{"id":"t6-07","ty":"ox","lv":2,"game":true,"p":"AI에게 오류 수정을 요청할 때는 에러 메시지 전체를 복사해서 전달하는 것이 좋다.","a":true,"h":"오류 수정 요청 방법에는 메시지 전달, 발생 상황 설명, 기대 동작과 실제 동작의 차이 설명, 스크린샷 첨부가 있습니다. Best Practices도 에러 메시지를 AI에게 최고의 단서라고 말합니다.","w":"맞습니다. 에러 메시지 전체를 그대로 복사해 전달하면 AI가 원인을 더 정확히 찾습니다.","an":"슬라이드 52 · 오류 수정 요청 방법","src":"오류 수정 요청 방법\n에러 메시지 전체를 복사해서 전달\n어떤 상황에서 오류가 발생하는지 설명\n기대 동작 vs 실제 동작 차이 설명\n스크린샷 첨부 시 더 정확한 수정 가능"},{"id":"t6-08","ty":"match","lv":1,"game":false,"p":"코드 리뷰 프롬프트 패턴과 요청 문장을 연결하세요.","pairs":[["기본 리뷰","문제점과 개선점을 알려줘"],["보안 리뷰","보안 취약점을 점검해줘"],["성능 리뷰","성능을 개선할 방법을 알려줘"],["가독성 리뷰","더 읽기 쉽게 리팩토링해줘"],["테스트 요청","테스트 케이스를 작성해줘"]],"h":"코드 리뷰 패턴은 리뷰의 관점마다 요청 문장이 다릅니다. 패턴 이름의 핵심 단어(보안, 성능, 읽기, 테스트)가 요청 문장 안에 그대로 들어 있는지 살펴보세요.","w":"기본 리뷰=문제점·개선점, 보안=취약점 점검, 성능=개선 방법, 가독성=읽기 쉬운 리팩토링, 테스트=테스트 케이스 작성입니다.","an":"슬라이드 90 · AI에게 코드 리뷰 요청하기","src":"기본 리뷰:\n\"이 코드를 리뷰해줘. 문제점과 개선점을 알려줘\"\n보안 리뷰:\n\"이 코드의 보안 취약점을 점검해줘\"\n성능 리뷰:\n\"이 코드의 성능을 개선할 방법을 알려줘\"\n가독성 리뷰:\n\"이 코드를 더 읽기 쉽게 리팩토링해줘\"\n테스트 요청:\n\"이 코드의 테스트 케이스를 작성해줘\""},{"id":"t6-09","ty":"order","lv":2,"game":false,"p":"숫자 맞추기 게임의 기본 게임(Step 1)을 만든 뒤 이어지는 단계를 순서대로 정렬하세요.","steps":["카드 UI·파란색 테마로 디자인 개선","난이도 선택 기능 추가","30초 타이머와 보너스 점수","최고 기록을 localStorage에 저장","정답 시 confetti 애니메이션"],"h":"게임은 6단계에 걸쳐 점진적으로 발전합니다. 겉모습을 먼저 다듬고, 난이도와 시간 제한 같은 규칙을 더한 뒤, 기록을 남기고 마지막에 축하 효과를 붙입니다.","w":"Step 2 디자인 개선 → Step 3 난이도 → Step 4 타이머 → Step 5 기록 저장 → Step 6 효과 추가 순서입니다.","an":"슬라이드 83 · 실습: AI로 간단한 게임 만들기","src":"Step 2: 디자인 개선\n\"깔끔한 카드 UI로 꾸며줘. 파란색 테마, 그림자 효과.\"\nStep 3: 기능 추가\n\"난이도 선택 기능을 추가해줘 (쉬움: 1~50, 보통: 1~100, 어려움: 1~500)\"\nStep 4: 타이머 추가\n\"30초 타이머를 추가하고, 시간 내 맞추면 보너스 점수를 줘.\"\nStep 5: 기록 저장\n\"최고 기록(최소 시도 횟수)을 localStorage에 저장하고 표시해줘.\"\nStep 6: 효과 추가\n\"정답 시 confetti 애니메이션을 추가해줘.\""},{"id":"t6-10","ty":"multi","lv":2,"game":true,"p":"Day 3 체크리스트에 있는 항목을 <b>모두<\/b> 고르세요.","o":["아이디어 5단계 구체화","코드 생성 요청 5가지 패턴","프로젝트 발표와 피드백","30일 실무 적용 플랜 수립","웹 앱 프로토타입 1개 제작"],"a":[0,1,4],"h":"Day 3 체크리스트는 바이브 코딩 개념, 세 도구의 차이, 웹 기술 역할, 아이디어 구체화, 코드 요청 패턴, 디버깅, 프로토타입 제작, 점진적 개선을 다룹니다. 발표와 실무 적용 계획은 다음 날의 내용입니다.","w":"아이디어 5단계, 코드 요청 5패턴, 프로토타입 1개 제작이 Day 3 항목입니다. 발표·피드백과 30일 플랜은 Day 4 전체 과정 체크리스트에 있습니다.","an":"슬라이드 55 · Day 3 핵심 정리 & 체크리스트","src":"□ 코딩 아이디어를 5단계로 구체화할 수 있다\n□ AI에게 코드 생성을 요청하는 5가지 패턴을 알고 있다\n□ 에러 발생 시 AI에게 효과적으로 디버깅을 요청할 수 있다\n□ AI로 최소 1개의 웹 앱 프로토타입을 직접 만들어 보았다"}]},{"id":"t7","title":"업무 적용 전략과 AI 거버넌스","ref":"슬라이드 56~66 · 91~99","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"프로젝트 발표 평가 기준 중 비중이 가장 큰 항목은?","o":["창의성","완성도","실용성","프롬프트 활용"],"a":2,"h":"발표 평가 기준은 네 항목으로 합계 100%입니다. 창의성과 완성도가 같은 비중이고 프롬프트 활용이 가장 작으며, 실제 업무에 활용할 수 있는 정도를 보는 항목이 30%로 가장 큽니다.","w":"실용성이 30%로 가장 큽니다. 창의성·완성도는 각 25%, 프롬프트 활용은 20%입니다.","an":"슬라이드 57 · 발표 평가 기준","src":"발표 평가 기준\n창의성 (25%): 독창적인 아이디어와 접근 방식\n실용성 (30%): 실제 업무에 활용 가능한 정도\n완성도 (25%): 프로그램의 기능 구현 정도\n프롬프트 활용 (20%): AI와의 효과적인 소통 과정"},{"id":"t7-02","ty":"mc","lv":1,"game":true,"p":"AI 도입 로드맵에서 2단계(3개월)의 내용은?","o":["개인 업무에 AI 도구 도입","팀 단위 AI 활용 확대","부서 간 AI 협업 체계","조직 전사 AI 전환"],"a":1,"h":"로드맵은 1개월 → 3개월 → 6개월 → 12개월로 범위가 개인에서 조직 전체로 넓어집니다. 3개월 차에는 프롬프트 라이브러리를 만들고 도구를 표준화하는 작은 집단 단위가 대상입니다.","w":"2단계(3개월)는 팀 단위 AI 활용 확대입니다. 1단계는 개인 업무, 3단계는 부서 간 협업, 4단계는 조직 전사 전환입니다.","an":"슬라이드 59 · AI 도입 로드맵","src":"AI 도입 로드맵\n1단계 (1개월): 개인 업무에 AI 도구 도입 → 이메일, 보고서, 데이터 정리에 활용\n2단계 (3개월): 팀 단위 AI 활용 확대 → 프롬프트 라이브러리 구축, 팀별 AI 도구 표준화\n3단계 (6개월): 부서 간 AI 협업 체계 → 자동화 워크플로우 구축, AI 기반 의사결정 프로세스 도입\n4단계 (12개월): 조직 전사 AI 전환 → AI 거버넌스 체계 확립, KPI에 AI 활용도 반영"},{"id":"t7-03","ty":"mc","lv":2,"game":true,"p":"AI 결과물의 정확성과 편향성을 검증하고 판단하는 능력은 어떤 핵심 역량인가요?","o":["프롬프트 리터러시","AI 큐레이션 능력","창의적 문제 정의","비판적 사고력"],"a":3,"h":"AI 시대 핵심 역량은 네 가지입니다. 지시하는 능력, 도구를 고르고 조합하는 능력, 문제를 재정의하는 능력과 달리, 이 역량은 AI가 내놓은 결과를 의심하고 따져 보는 데 초점이 있습니다.","w":"비판적 사고력입니다. 프롬프트 리터러시는 효과적 지시와 평가, 큐레이션은 도구 선택·조합, 창의적 문제 정의는 문제를 AI가 풀 수 있는 형태로 바꾸는 능력입니다.","an":"슬라이드 60 · AI 시대에 필요한 핵심 역량","src":"프롬프트 리터러시\nAI에게 효과적으로 지시하고 결과물을 비판적으로 평가하는 능력\nAI 큐레이션 능력\n다양한 AI 도구를 상황에 맞게 선택하고 조합하는 능력\n비판적 사고력\nAI 결과물의 정확성과 편향성을 검증하고 판단하는 능력\n창의적 문제 정의\nAI가 해결할 수 있는 형태로 문제를 재정의하는 능력"},{"id":"t7-04","ty":"mc","lv":3,"game":true,"p":"효과 매트릭스의 팁대로 시간 절감 효과가 가장 큰 업무부터 적용한다면 첫 업무는?","o":["웹 도구 제작","회의록 정리","이메일 작성","데이터 분석"],"a":0,"h":"매트릭스의 시간 절감 열을 비교하세요. 회의록 정리 80%, 이메일 작성 70%, 데이터 분석 60%이고, Claude/Cursor로 하는 업무 하나가 이보다 높은 90%입니다.","w":"웹 도구 제작이 90%로 가장 큽니다. 회의록 정리 80%, 이메일 작성 70%, 데이터 분석 60% 순입니다.","an":"슬라이드 93 · 업무별 AI 활용 효과 매트릭스","src":"Tip: 시간 절감 효과가 가장 큰 업무부터 AI를 적용하세요. 작은 성공 경험이 AI 활용의 원동력입니다.\n업무 유형 | AI 도구 | 시간 절감 | 난이도 | 추천도\n이메일 작성 | ChatGPT/Claude | 70% | ★☆☆ | ★★★★★\n데이터 분석 | ChatGPT/Claude | 60% | ★★☆ | ★★★★☆\n보고서 작성 | Claude | 50% | ★★☆ | ★★★★★\n프레젠테이션 | Copilot/Claude | 40% | ★★☆ | ★★★★☆\n웹 도구 제작 | Claude/Cursor | 90% | ★★★ | ★★★★★\n회의록 정리 | ChatGPT/Claude | 80% | ★☆☆ | ★★★★★"},{"id":"t7-05","ty":"mc","lv":3,"game":true,"p":"30일 플랜을 따르는 학생A가 자주 쓰는 프롬프트를 정리해 팀과 공유하고 있다면 몇 주차인가요?","o":["1주차","2주차","3주차","4주차"],"a":1,"h":"30일 플랜은 일상 도입 → 프롬프트 정리 → 도구 제작 → 팀 확산 순서입니다. 노션이나 구글 독스에 카테고리별로 프롬프트를 모으는 일은 매일 AI를 써 본 다음 주에 합니다.","w":"2주차가 프롬프트 라이브러리 구축입니다. 1주차는 AI 일상 도입, 3주차는 바이브 코딩 프로젝트, 4주차는 팀 확산·사례 공유입니다.","an":"슬라이드 61 · AI 실무 적용 30일 플랜","src":"1주차\nAI 일상 도입\n매일 1개 업무를 AI로 처리해보기. 이메일, 보고서 요약, 데이터 정리부터 시작하세요.\n2주차\n프롬프트 라이브러리 구축\n자주 쓰는 프롬프트를 정리하고 팀과 공유합니다. 노션이나 구글 독스에 카테고리별 정리.\n3주차\n바이브 코딩 프로젝트"},{"id":"t7-06","ty":"ox","lv":1,"game":true,"p":"교재 FAQ는 AI가 '직업'이 아니라 '업무'를 대체한다고 답한다.","a":true,"h":"FAQ의 첫 질문은 AI가 일자리를 대체하는지입니다. 답변은 대체되는 대상이 무엇인지 구분하고, AI를 잘 활용하는 사람이 그렇지 못한 사람을 대체한다고 덧붙입니다.","w":"맞습니다. AI는 직업이 아닌 업무를 대체하며, AI를 잘 활용하는 사람이 경쟁력을 갖는다고 설명합니다.","an":"슬라이드 66 · 자주 묻는 질문 (FAQ)","src":"Q: AI가 내 일자리를 대체할까요?\nAI는 '직업'이 아닌 '업무'를 대체합니다. AI를 잘 활용하는 사람이 그렇지 못한 사람을 대체하게 됩니다."},{"id":"t7-07","ty":"ox","lv":2,"game":true,"p":"'완벽한 프롬프트를 써야 한다'는 생각은 교재가 권하는 성장형 마인드셋이다.","a":false,"h":"마인드셋 슬라이드는 버려야 할 생각(❌)과 가져야 할 생각(✅)을 짝지어 보여 줍니다. 프롬프트에 대해서는 처음부터 잘 쓰기보다 여러 번 고쳐 가며 나아진다는 쪽이 권장됩니다.","w":"틀렸습니다. '완벽한 프롬프트를 써야 한다'는 ❌이고, '프롬프트는 반복으로 개선된다'가 성장형 마인드셋입니다.","an":"슬라이드 97 · AI 활용 성공을 위한 마인드셋","src":"성장형 마인드셋\n\"AI를 배우는 것은 어렵다\" ❌\n\"AI를 매일 조금씩 써보면 늘는다\" ✅\n\"완벽한 프롬프트를 써야 한다\" ❌\n\"프롬프트는 반복으로 개선된다\" ✅"},{"id":"t7-08","ty":"match","lv":1,"game":false,"p":"업무 적용 전략의 AI 활용 4대 영역과 활용 예를 연결하세요.","pairs":[["단순 반복 업무 자동화","보고서·데이터 정리·이메일 자동화"],["의사결정 보조","데이터 분석·트렌드·리스크 분석"],["창의적 업무 확장","콘텐츠·디자인·브레인스토밍 협업"],["프로세스 혁신","바이브 코딩으로 도구·대시보드 구축"]],"h":"4대 영역은 반복 업무, 판단, 창작, 업무 방식 자체의 변화를 다룹니다. 매일 반복되는 일, 결정을 돕는 분석, 아이디어 협업, 새 시스템을 만드는 일을 각각 영역 이름과 짝지어 보세요.","w":"반복 업무 자동화=보고서·이메일, 의사결정 보조=분석·리스크, 창의적 업무 확장=콘텐츠·브레인스토밍, 프로세스 혁신=바이브 코딩으로 도구 구축입니다.","an":"슬라이드 58 · 업무 적용 전략: AI 활용 4대 영역","src":"단순 반복 업무 자동화\n매일 반복하는 보고서, 데이터 정리, 이메일 등을 AI로 자동화\n의사결정 보조\n데이터 분석, 트렌드 파악, 리스크 분석에 AI 활용\n창의적 업무 확장\n콘텐츠, 디자인, 아이디어 브레인스토밍에 AI를 협업 파트너로\n프로세스 혁신\n바이브 코딩으로 새로운 도구, 대시보드, 자동화 시스템 구축"},{"id":"t7-09","ty":"order","lv":2,"game":false,"p":"8분 프로젝트 발표 구조를 순서대로 정렬하세요.","steps":["도입: 해결할 문제를 한 문장으로 (1분)","시연: 핵심 기능 라이브 시연 (3분)","개발 과정: 프롬프트와 어려웠던 점 (2분)","적용 계획: 실제 업무 적용 방안 (2분)"],"h":"발표는 문제 → 해결 스토리라인으로 구성합니다. 청중이 공감할 문제를 먼저 말하고, 만든 결과를 보여 준 뒤, 만드는 과정과 앞으로의 활용을 차례로 설명합니다.","w":"도입(1분) → 시연(3분) → 개발 과정(2분) → 적용 계획(2분)으로 총 8분입니다.","an":"슬라이드 91 · 프로젝트 발표 잘하는 법","src":"발표 구조 (8분)\n도입 (1분):\n→ 해결하려는 문제를 한 문장으로 소개\n→ \"매일 2시간 걸리던 X를 AI로 해결!\"\n시연 (3분):\n→ 핵심 기능 중심으로 라이브 시연\n→ 실제 데이터로 보여주면 더 효과적\n개발 과정 (2분):\n→ 사용한 프롬프트와 어려웠던 점\n→ AI와의 대화 과정 공유\n적용 계획 (2분):\n→ 실제 업무에 어떻게 적용할지"},{"id":"t7-10","ty":"multi","lv":2,"game":true,"p":"Day 4의 '전체 과정 최종 체크리스트'에 있는 항목을 <b>모두<\/b> 고르세요.","o":["CRISP 템플릿으로 프롬프트 작성","프롬프트 라이브러리 구축·공유","AI 챔피언 선정","30일 AI 실무 적용 플랜 수립","경영진 보고용 계획서 작성"],"a":[0,1,3],"h":"전체 과정 체크리스트는 개인 학습자가 과정 전체에서 익힌 개념·기법·계획을 점검합니다. 팀 대표를 뽑거나 경영진 보고서를 쓰는 일은 별도의 팀 단위 'AI 도입 자가 진단' 체크리스트에 있습니다.","w":"CRISP 템플릿, 프롬프트 라이브러리, 30일 플랜은 전체 과정 체크리스트 항목입니다. AI 챔피언 선정과 경영진 보고 계획서는 AI 실무 적용 체크리스트(자가 진단)의 항목입니다.","an":"슬라이드 65 · 전체 과정 최종 체크리스트","src":"□ CRISP 프롬프트 템플릿을 활용하여 효과적인 프롬프트를 작성할 수 있다\n□ 프롬프트 체이닝, CoT, Few-Shot 등 고급 기법을 활용할 수 있다\n□ 바이브 코딩의 개념을 이해하고 간단한 웹 앱을 AI로 만들 수 있다\n□ AI로 만든 프로젝트를 발표하고 피드백을 받았다\n□ 내 업무에 AI를 적용할 구체적인 계획을 수립했다\n□ AI 보안 가이드라인과 윤리적 고려사항을 이해한다\n□ 프롬프트 라이브러리를 구축하고 팀과 공유할 수 있다\n□ AI 시대에 필요한 핵심 역량을 인지하고 있다\n□ 30일 AI 실무 적용 플랜을 수립했다"}]}]};

const TYPES={mc:['객관식','--ty-mc'],multi:['복수 선택','--ty-multi'],ox:['O / X','--ty-ox'],match:['짝 맞추기','--ty-match'],order:['순서 맞추기','--ty-order'],num:['계산','--ty-num']};

  match:'왼쪽 항목을 누른 뒤 짝이 되는 오른쪽 항목을 누르세요. 연결된 항목을 다시 누르면 풀립니다.',

/* 순위 저장소 — 공유 순위로 바꿀 때 이 객체만 교체 */
// 순위는 같은 조건(게임 모드 + 풀이 시간)끼리만 비교한다. key = 'timeattack:10'
const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

/* ── 유틸 ──────────────────────────────── */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function say(msg){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=msg,30);}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('📋 클립보드에 복사했습니다');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'📋 클립보드에 복사했습니다':'복사하지 못했습니다. 인쇄 기능을 이용하세요.');
}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

/* ── 오답노트 ──────────────────────────── */
function addWrong(id,ans){const w=S.wrong[id]||{n:0};w.n++;w.last=ans;w.at=Date.now();w.solved=false;S.wrong[id]=w;}
function markSolved(id){if(S.wrong[id]&&!S.wrong[id].solved){S.wrong[id].solved=true;S.wrong[id].at=Date.now();}}
const wrongList=solved=>Object.keys(S.wrong).filter(id=>QMAP[id]&&!!S.wrong[id].solved===solved)
  .sort((a,b)=>QTAB[a].idx-QTAB[b].idx||ALLQ.indexOf(QMAP[a])-ALLQ.indexOf(QMAP[b]));

/* ── 문항 풀이 상태(학습·재도전 공용) ───── */
let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

function cardHTML(q,n){
  const [label,color]=TYPES[q.ty];
  const g=cur.graded, a=cur.ans[q.id], fa=finalAns(q), ok=g&&isCorrect(q,fa);
  const lock=g?' disabled':'';
  let body='';
  if(q.ty==='mc'||q.ty==='multi'){
    const multi=q.ty==='multi', mine=multi?(a||[]):[a];
    body='<div class="opts">'+q.o.map((o,i)=>{
      const right=multi?q.a.includes(i):q.a===i, picked=mine.includes(i);
      const cls=g?(right?' ans':picked?' miss':''):'';
      return `<label class="opt${cls}"><span class="onum">${i+1}</span><input type="${multi?'checkbox':'radio'}" name="r-${q.id}" data-act="${multi?'tick':'pick'}" data-q="${q.id}" data-i="${i}"${picked?' checked':''}${lock}><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(q.ty==='ox'){
    body='<div class="ox">'+[true,false].map(v=>{
      const cls=g?(q.a===v?' ans':a===v?' miss':''):'';
      return `<button type="button" class="${cls.trim()}" data-act="ox" data-q="${q.id}" data-v="${v?1:0}" data-fk="${q.id}-ox${v?1:0}" aria-pressed="${a===v}" aria-label="${v?'맞다 O':'틀리다 X'}"${lock}>${v?'O':'X'}</button>`;
    }).join('')+'</div>';
  }else if(q.ty==='match'){
    const m=a||{}, sel=cur.msel[q.id], linkedBy={};
    Object.entries(m).forEach(([l,r])=>linkedBy[r]=+l);
    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${PAL[i%PAL.length]})" data-act="ml" data-q="${q.id}" data-i="${i}" data-fk="${q.id}-l${i}"${lock}><span class="tag">${LETTER[i]}</span>${esc(p[0])}</button>`;
    }).join('');
    const right=cur.shuf[q.id].map(j=>{
      const by=linkedBy[j], linked=by!=null, cls=(linked?' linked':'')+(g&&linked?(by===j?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${linked?PAL[by%PAL.length]:'--line'})" data-act="mr" data-q="${q.id}" data-j="${j}" data-fk="${q.id}-r${j}"${lock}><span class="tag">${linked?LETTER[by]:''}</span>${esc(q.pairs[j][1])}</button>`;
    }).join('');
    body=`<div class="match"><div class="mcol mleft">${left}</div><div class="mcol mright">${right}</div></div>`;
  }else if(q.ty==='order'){
    const seq=a||[], full=seq.length===q.steps.length;
    body='<div class="olist">'+(cur.shuf[q.id]||range(q.steps.length)).map(si=>{
      const pos=seq.indexOf(si), on=pos>=0;
      const cls=(on?' on':'')+(g?(pos===si?' ok':' no'):'');
      const fix=g&&pos!==si?`<span class="ofix">정답 ${si+1}</span>`:'';
      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }
  const numAns=q.ty==='mc'?`${q.a+1}번 · `:q.ty==='multi'?q.a.map(i=>i+1).join('·')+'번 · ':'';
  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${mediaHTML(q)}${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>${voiceRow(q,q.id)}`}${body}${exp}</article>`;
}
const LV_NAME=['쉬움','보통','어려움'];
function lvHTML(lv){
  lv=lv||1;
  const dots=[1,2,3].map(k=>k<=lv?`<i class="d${k}">●</i>`:'<i class="off">○</i>').join('');
  return `<span class="lv lv${lv}" title="난이도 ${LV_NAME[lv-1]}"><span class="dots" aria-hidden="true">${dots}</span><em>${LV_NAME[lv-1]}</em></span>`;
}
// 자료 발췌: 이스케이프 후 마크다운 기호만 가볍게 서식으로 (**굵게**, `코드`, 머리 #)
const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
function hintHTML(q){
  if(!q.h)return '';
  const open=cur.hints.has(q.id), label=q.ty==='num'?'Hint · 계산식':'Hint';
  // 2단계: ① 자세한 힌트(h) ② 자료 보기 — 자료 원문 발췌(src) + 위치(an)
  const sopen=cur.srcs.has(q.id);
  const src=q.src?`<div class="srcwrap"><button type="button" class="srcbtn" data-act="src" data-q="${q.id}" data-fk="${q.id}-src" aria-expanded="${sopen}" aria-controls="src-${q.id}">`+
    `<span class="caret" aria-hidden="true">${sopen?'▾':'▸'}</span>📖 자료 보기</button>`+
    (sopen?`<blockquote class="src" id="src-${q.id}"><p>${srcText(q.src)}</p>${q.an?`<cite>${esc(q.an)}</cite>`:''}</blockquote>`:'')+`</div>`:'';
  return `<div class="hintwrap"><button type="button" class="hintbtn" data-act="hint" data-q="${q.id}" data-fk="${q.id}-hint" aria-expanded="${open}" aria-controls="hint-${q.id}">`+
    `<span class="caret" aria-hidden="true">${open?'▾':'▸'}</span>${label}</button>`+
    (open?`<div class="hint" id="hint-${q.id}">${q.h}${src}</div>`:'')+`</div>`;
}
function refreshCard(q){
  const el=document.getElementById('card-'+q.id);if(!el)return;
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  el.outerHTML=cardHTML(q,el.dataset.n);
  if(fk){const f=app.querySelector(`[data-fk="${fk}"]`);if(f&&!f.disabled)f.focus();}
  updateProgress();
}
const pad2=n=>String(n).padStart(2,'0');
const fmtCnt=(n,t)=>`(${pad2(n)}/${pad2(t)})`;
// 탭별 푼 문항 수: 지금 보는 탭 → 화면 상태, 그 외 → 풀던 답(drafts) → 채점 기록
function tabAnswered(t){
  const src=cur&&cur.mode==='study'&&cur.tab===t?cur.ans:(S.drafts[t.id]||(S.tabs[t.id]&&S.tabs[t.id].answers)||{});
  return t.qs.filter(q=>isAnswered(q,src[q.id])).length;
}
function updateProgress(){
  const p=document.getElementById('pbar');if(!p||!cur)return;
  const n=cur.list.filter(answered).length, cnt=fmtCnt(n,cur.list.length);
  p.style.width=pct(n,cur.list.length)+'%';
  document.getElementById('ptxt').textContent=`${n} / ${cur.list.length} 응답`;
  const g=document.getElementById('gradeCnt');if(g)g.textContent=cnt;
  if(cur.mode==='study'){
    const c=document.getElementById('qc-'+cur.tab.id);if(c)c.textContent=cnt;
    if(!cur.graded){  // 풀던 답 저장 → 탭을 옮겨도 유지
      if(n||Object.keys(cur.ans).some(k=>{const v=cur.ans[k];return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:v!=null&&v!=='';}))
        S.drafts[cur.tab.id]=JSON.parse(JSON.stringify(cur.ans));
      else delete S.drafts[cur.tab.id];
      save();
    }
  }
}

/* ── 음성 선택 · 문제 읽기 · 그림/오디오 (qb-voice.js가 없으면 모두 숨김) ── */
const hasVoice=()=>!!(window.QBVoice&&QBVoice.supported());
const hasRead=()=>!!(window.QBVoice&&QBVoice.canSpeak());
const IC_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const IC_VOL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const VC=new Map();  // 학습 모드 문항별 음성 컨트롤러
function voiceReset(){VC.clear();if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}}
function voiceRow(q,fkp){
  const mic=hasVoice()&&['mc','multi','ox'].includes(q.ty), rd=hasRead();
  if(!mic&&!rd)return '';
  const qa=fkp?` data-q="${q.id}"`:'';
  return `<div class="vrow noprint">`+
    (mic?`<button type="button" class="vbtn vmic" data-act="vmic"${qa} data-fk="${fkp}-vmic" data-state="idle" aria-pressed="false">${IC_MIC}<span>말하기</span></button>`:'')+
    (rd?`<button type="button" class="vbtn" data-act="vread"${qa} data-fk="${fkp}-vread">${IC_VOL}<span>문제 읽기</span></button>`:'')+
    (mic?`<span class="vstat" aria-live="polite"></span><span class="vhint">말하기 어려우면 눌러서 고르세요</span>`:'')+`</div>`;
}
function mediaHTML(q){
  let h='';
  if(q.img&&q.img.src)h+=`<figure class="qfig"><img src="${esc(q.img.src)}" alt="${esc(q.img.alt)}" loading="lazy">${q.img.caption?`<figcaption>${esc(q.img.caption)}</figcaption>`:''}</figure>`;
  if(q.audio&&q.audio.src)h+=`<div class="qaud"><audio controls preload="none" src="${esc(q.audio.src)}"></audio><details><summary>대본</summary><p>${esc(q.audio.transcript)}</p></details></div>`;
  return h;
}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
// 읽어 줄 글: 문제 + 화면에 보이는 순서의 보기("1번 …")
function readText(q,n,order){
  let t=(n?`${n}번 문제. `:'')+plain(q.p)+'.';
  if(q.img&&q.img.alt)t+=' 그림 설명. '+q.img.alt+'.';
  if(q.ty==='ox')t+=' 맞으면 O, 틀리면 X.';
  else if(q.ty==='mc'||q.ty==='multi')t+=(order||range(q.o.length)).map((oi,k)=>` ${k+1}번. ${plain(q.o[oi])}.`).join('');
  return t;

function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;
  else if(el.dataset.act==='tick'){
    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);
  }
  cur.armed=false;updateProgress();
}
function onSheetInput(el){
  if(el.dataset.act==='num'&&!cur.graded){cur.ans[el.dataset.q]=el.value;cur.armed=false;updateProgress();}
}

function viewStudy(tid,fresh){

function gradeSheet(){
  const miss=cur.list.map((q,i)=>answered(q)?0:i+1).filter(Boolean);
  if(miss.length&&!cur.armed){
    cur.armed=true;
    document.getElementById('warn').textContent=`미응답 ${miss.length}문항 (Q${miss.join(', Q')}). 한 번 더 누르면 미응답은 오답으로 채점합니다.`;
    return;
  }
  const firstUnlock=!gameUnlocked();
  cur.graded=true;
  const snap={};let score=0;
  cur.list.forEach(q=>{
    const a=finalAns(q);
    if(a!=null)snap[q.id]=a;
    if(isCorrect(q,a)){score++;markSolved(q.id);}
    else addWrong(q.id,answerText(q,a));
  });
  if(cur.mode==='study'){
    S.tabs[cur.tab.id]={score,total:cur.list.length,answers:snap,touched:[...cur.touched],at:Date.now()};
    delete S.drafts[cur.tab.id];
  }
  save();
  renderSheet();
  window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
  say(`채점 결과 ${score}점, ${cur.list.length}문항 중`);
  if(cur.mode==='study'&&firstUnlock)setTimeout(()=>toast('⚡ 게임 모드와 해설지가 열렸습니다!'),300);
  else if(cur.mode==='study'&&allGraded())setTimeout(()=>toast('★ 모든 탭 완료! 종합 결과를 확인하세요.'),300);
}

  if(modeId&&GAME_MODES[modeId])gameSetup.mode=modeId;
  if(!gameUnlocked()){
    app.innerHTML=`<nav class="crumbs"><a href="#home">← 홈</a></nav><div class="game"><h1>⚡ 게임 모드 🔒</h1>
      <div class="keylock">학습 모드에서 <b>탭 하나</b>를 먼저 채점하면 열립니다.<br><br><a class="btn primary" href="#study/${TABS[0].id}">학습 시작</a></div></div>`;return;
  }
  const poolN=gamePool(gameSetup.scope).length;
  const counts=[10,20,30].filter(n=>n<poolN).concat([poolN]);
  if(!counts.includes(gameSetup.count))gameSetup.count=counts.includes(10)?10:counts[0];
  const M=GAME_MODES[gameSetup.mode];
  if(!M.times.includes(gameSetup.time))gameSetup.time=M.defaultTime;
  const chip=(grp,v,label,dis)=>`<button type="button" class="chip" data-act="gset" data-g="${grp}" data-v="${v}" aria-pressed="${gameSetup[grp]==v}"${dis?' disabled':''}>${label}</button>`;
  app.innerHTML=`
  <nav class="crumbs"><a href="#home">← 홈</a><span>/</span><a href="#game">게임 모드</a><span>/</span><span>${M.title.replace(/^\S+\s/,'')}</span></nav>
  <div class="game">
    <h1>${M.title}</h1>
    <p class="sub">${M.desc}</p>
    <div class="panel">
      ${Object.keys(GAME_MODES).length>1?`<span class="lbl">게임 종류</span>
      <div class="chips">${Object.entries(GAME_MODES).map(([id,m])=>chip('mode',id,m.title)).join('')}</div>`:''}
      <span class="lbl">풀이 시간 (문항당)</span>
      <div class="chips">${M.times.map(t=>chip('time',t,t+'초')).join('')}</div>
      <span class="lbl">문항 수</span>
      <div class="chips">${counts.map(n=>chip('count',n,n===poolN&&!([10,20,30].includes(n))?`전체 ${n}`:String(n))).join('')}</div>
      <span class="lbl">출제 범위</span>
      <div class="chips">${chip('scope','all','전체 탭')}${chip('scope','played','풀어본 탭만')}${chip('scope','wrong','오답 우선',!wrongList(false).length)}</div>
      <div class="field"><label for="gnm">닉네임</label><input id="gnm" data-act="name" maxlength="20" value="${esc(S.name)}" placeholder="순위표에 표시"></div>
      <div class="rules"><p>⏱ 모든 문항 ${gameSetup.time}초 · 순위는 같은 풀이 시간끼리 비교</p><p>🎯 정답 100점 + 남은 1초당 10점 · 🔥 3연속 ×1.2, 5연속 ×1.5</p><p>⌨ 숫자 1~5로 선택, O/X 키, 복수 선택은 Enter로 제출</p></div>
      <button class="btn primary block" type="button" data-act="gstart">시작하기</button>
    </div>
  </div>`;
}
function startGame(){
  const pool=gamePool(gameSetup.scope).slice(0,gameSetup.count);
  if(!pool.length){toast('출제할 문항이 없습니다.');return;}
  G={qs:pool,i:0,score:0,combo:0,maxCombo:0,results:[],locked:false,mode:gameSetup.mode,time:gameSetup.time};
  renderGameQ();
}
function renderGameQ(){
  voiceReset();
  const q=G.qs[G.i];
  G.locked=false;G.elapsed=0;G.last=performance.now();G.limit=G.time*1000;G.warned=false;G.pick=[];
  G.view=q.ty==='ox'?[true,false]:shuffle(range(q.o.length));
  const opts=q.ty==='ox'
    ?`<div class="gox">${G.view.map((v,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}" aria-label="${v?'O 맞다':'X 틀리다'}">${v?'O':'X'}</button>`).join('')}</div>`
    :`<div class="gopts">${G.view.map((oi,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}"${q.ty==='multi'?' aria-pressed="false"':''}><kbd>${k+1}</kbd><span>${esc(q.o[oi])}</span></button>`).join('')}</div>`;
  app.innerHTML=`
  <div class="game play">
    <div class="gtop"><div class="hud"><span>${G.i+1} / ${G.qs.length}</span><span class="combo${G.combo>=3?' hot':''}">🔥 콤보 ${G.combo}</span><span class="pts">${G.score.toLocaleString()}점</span></div>
    <div class="timer" id="timer"><div id="tbar"></div></div><div class="tleft" id="tleft"></div></div>
    <div class="gtype">${TYPES[q.ty][0]}${q.ty==='multi'?' · 모두 고른 뒤 제출':''}</div>
    <div class="gq">${q.p}</div>${mediaHTML(q)}
    <div class="gbottom">${voiceRow(q,'g')}${opts}
    <div class="gfloat" id="gfloat" aria-live="polite"></div>
    <div class="gsub"><button class="btn" type="button" data-act="gquit">그만하기</button>
      ${q.ty==='multi'?'<button class="btn primary" type="button" data-act="gsubmit">제출 (Enter)</button>':''}</div></div>
  </div>`;
  if(hasVoice())G.vc=QBVoice.attach({bind:false,button:()=>app.querySelector('.vmic'),live:()=>app.querySelector('.vstat'),
    getOptions:()=>G.view.length,getType:()=>q.ty,
    select:r=>gameAnswer(r.kind==='ox'?(r.v==='O'?0:1):r.i),submit:q.ty==='multi'?gameSubmit:null});  // 말하면 클릭과 같게 바로 선택(·제출)
  G.raf=requestAnimationFrame(tick);
}
function tick(now){
  if(!G||G.locked)return;
  G.elapsed+=now-G.last;G.last=now;
  const rem=Math.max(0,G.limit-G.elapsed), ratio=rem/G.limit;
  const shown=RM.matches?Math.ceil(rem/1000)*1000/G.limit:ratio;
  const bar=document.getElementById('tbar'), tm=document.getElementById('timer');
  if(bar){bar.style.width=(Math.min(1,shown)*100)+'%';tm.className='timer'+(ratio<.25?' lo':ratio<.5?' mid':'');
    document.getElementById('tleft').textContent=(rem/1000).toFixed(1)+'초';}
  if(!G.warned&&rem<=5000){G.warned=true;say('5초 남았습니다');}
  if(rem<=0){judge(null,true);return;}
  G.raf=requestAnimationFrame(tick);
}
function judge(ans,timeout){
  if(!G||G.locked)return;
  G.locked=true;cancelAnimationFrame(G.raf);
  const q=G.qs[G.i], used=Math.min(G.elapsed,G.limit), ok=!timeout&&isCorrect(q,ans);
  let gain=0;
  if(ok){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const mult=G.combo>=5?1.5:G.combo>=3?1.2:1;
    gain=Math.round((100+Math.floor((G.limit-used)/100))*mult);G.score+=gain;}
  else G.combo=0;
  G.results.push({id:q.id,ok,ans,timeout,ms:used,gain});
  // 판정 표시
  app.querySelectorAll('[data-act="gans"]').forEach(b=>{
    const k=+b.dataset.k, v=G.view[k];
    const right=q.ty==='ox'?q.a===v:q.ty==='mc'?q.a===v:q.a.includes(v);
    const picked=q.ty==='ox'||q.ty==='mc'?ans===v:(ans||[]).includes(v);
    if(right)b.classList.add('ans');else if(picked)b.classList.add('miss');
    b.disabled=true;
  });
  const f=document.getElementById('gfloat');
  f.className='gfloat pop '+(ok?'ok':'no');
  f.textContent=ok?`+${gain}${G.combo>=3?` 🔥×${G.combo>=5?'1.5':'1.2'}`:''}`:timeout?'⏰ 시간 초과':'✗ 오답';
  if(timeout){const tm=document.getElementById('timer');tm&&tm.classList.add('out');}
  const sb=app.querySelector('[data-act="gsubmit"]');if(sb)sb.disabled=true;
  app.querySelector('.pts').textContent=G.score.toLocaleString()+'점';
  const c=app.querySelector('.combo');c.textContent='🔥 콤보 '+G.combo;c.classList.toggle('hot',G.combo>=3);
  G.next=setTimeout(()=>{if(!G)return;G.i++;G.i<G.qs.length?renderGameQ():finishGame();},ok?900:1400);
}
function gameAnswer(k){
  if(!G||G.locked)return;
  const q=G.qs[G.i];if(k<0||k>=G.view.length)return;
  if(q.ty==='multi'){
    const v=G.view[k], i=G.pick.indexOf(v);
    i<0?G.pick.push(v):G.pick.splice(i,1);
    const b=app.querySelector(`[data-act="gans"][data-k="${k}"]`);b&&b.setAttribute('aria-pressed',i<0);
  }else judge(G.view[k],false);
}
function gameSubmit(){if(G&&!G.locked&&G.qs[G.i].ty==='multi')judge(G.pick.slice(),false);}
function stopGame(){if(G){cancelAnimationFrame(G.raf);clearTimeout(G.next);G=null;}}
function finishGame(){
  const R=G.results, correct=R.filter(r=>r.ok).length, M=GAME_MODES[G.mode];
  R.forEach(r=>{const q=QMAP[r.id];if(r.ok)markSolved(r.id);else addWrong(r.id,r.timeout?'(시간 초과)':answerText(q,r.ans));});
  const rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:(S.name||'').trim()||'익명',score:G.score,
    correct,total:R.length,rate:pct(correct,R.length),avg:Math.round(R.reduce((s,r)=>s+r.ms,0)/R.length/100)/10,combo:G.maxCombo,mode:G.mode,time:G.time,at:Date.now()};
  const rank=Leaderboard.add(rec);
  save();
  const board=Leaderboard.load(boardKey(rec)), top=board.slice(0,10), mine=board.find(r=>r.id===rec.id);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;
  const row=(r,i)=>`<tr class="${r.id===rec.id?'me':''}"><td>${medal(i)}</td><td>${esc(r.name)}</td><td class="r">${r.score.toLocaleString()}</td><td class="r">${r.rate}%</td><td class="r">${r.correct}/${r.total}</td><td class="r">${new Date(r.at).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}</td></tr>`;
  const wrong=R.filter(r=>!r.ok);
  G=null;
  app.innerHTML=`
  <div class="game">
    <div class="panel center">
      <p class="note-sm" style="margin:0">최종 점수</p>
      <div class="score xl">${rec.score.toLocaleString()}</div>
      <p class="msg">${M.title} · ${rec.time}초 — ${rank===1?'🏆 이 조건 최고 기록!':`이 조건 순위 ${rank}위`}</p>
      <div class="bignum"><div><b>${correct}/${rec.total}</b><span>정답</span></div><div><b>${rec.rate}%</b><span>정답률</span></div><div><b>${rec.avg}초</b><span>평균 응답</span></div><div><b>${rec.combo}</b><span>최고 콤보</span></div></div>
    </div>
    <div class="panel"><h2 class="ph">🏆 순위 · ${M.title.replace(/^\S+\s/,'')} ${rec.time}초 · 이 브라우저 기록</h2>
      <table class="board"><thead><tr><th>#</th><th>이름</th><th class="r">점수</th><th class="r">정답률</th><th class="r">정답</th><th class="r">날짜</th></tr></thead>
      <tbody>${top.map(row).join('')}${rank>10&&mine?row(mine,rank-1):''}</tbody></table></div>
    ${wrong.length?`<details class="more panel"><summary>틀린 문항 ${wrong.length}개 · 해설 보기 (오답노트에 저장됨)</summary>
      ${wrong.map(r=>{const q=QMAP[r.id];return `<div class="keyitem"><div class="kq">${q.p}</div><p class="mine" style="margin:4px 0">내 답: ${esc(r.timeout?'(시간 초과)':answerText(q,r.ans))}</p><p class="ka">정답: ${esc(correctText(q))}</p><p class="kw">${q.w}</p><span class="an">📖 ${esc(q.an)}</span></div>`;}).join('')}</details>`:''}
    <div class="actions"><button class="btn primary" type="button" data-act="gagain">↻ 다시 하기</button><a class="btn" href="#notes">📒 오답노트</a><a class="btn" href="#home">홈</a></div>
  </div>`;
}

/* ── 라우터 · 이벤트 ───────────────────── */
function route(){
  stopGame();voiceReset();cur=null;app.classList.remove('sheet');
  const [v,arg]=(location.hash.slice(1)||'home').split('/');
  ({study:()=>viewStudy(arg),notes:viewNotes,retry:viewRetry,key:viewKey,game:()=>arg?viewGameSetup(arg):viewGamePick(),summary:viewSummary}[v]||viewHome)();
  window.scrollTo(0,0);
}
let resetArmed=false;
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act;
  if(cur&&['ox','ml','mr','ord','hint','src'].includes(act))return onSheetClick(el);
  switch(act){
    case 'grade':gradeSheet();break;
    case 'retab':viewStudy(cur.tab.id,true);window.scrollTo(0,0);break;  // 이전 점수는 다시 채점할 때까지 유지
    case 'onlywrong':cur.onlyWrong=!cur.onlyWrong;document.getElementById('cards').classList.toggle('onlywrong',cur.onlyWrong);el.textContent=cur.onlyWrong?'전체 보기':'오답만 보기';break;
    case 'copyreport':copy(reportMD());break;
    case 'copynotes':copy(`# ${BANK.title}\n\n- 이름: ${S.name||'-'} · ${today()}\n\n`+notesMD(false));break;
    case 'clearsolved':wrongList(true).forEach(id=>delete S.wrong[id]);save();viewNotes();break;
    case 'print':window.print();break;
    case 'reset':
      if(!resetArmed){resetArmed=true;el.textContent='정말 지울까요? 한 번 더 누르세요';setTimeout(()=>{resetArmed=false;if(el.isConnected)el.textContent='이 문제은행 기록 모두 지우기';},4000);break;}
      resetArmed=false;const nm=S.name;S=blank();S.name=nm;save();toast('기록을 지웠습니다');viewHome();break;
    case 'gset':gameSetup[el.dataset.g]=['count','time'].includes(el.dataset.g)?+el.dataset.v:el.dataset.v;viewGameSetup();break;
    case 'gstart':startGame();break;
    case 'gans':gameAnswer(+el.dataset.k);break;
    case 'vmic':{const q=G?null:QMAP[el.dataset.q];const c=G?G.vc:(q&&cur?studyVoice(q):null);if(c)c.toggle();break;}
    case 'vread':{
      if(G){const q=G.qs[G.i];readAloud(readText(q,0,q.ty==='ox'?null:G.view));break;}
      const q=QMAP[el.dataset.q], card=document.getElementById('card-'+el.dataset.q);
      if(q)readAloud(readText(q,card?card.dataset.n:0));break;}
    case 'gsubmit':gameSubmit();break;
    case 'gquit':stopGame();viewGameSetup(gameSetup.mode);break;
    case 'gagain':startGame();break;
  }
});
app.addEventListener('change',e=>{const el=e.target;if(cur&&el.dataset&&(el.dataset.act==='pick'||el.dataset.act==='tick'))onSheetChange(el);});
app.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.act==='name'){S.name=el.value;save();}
  else if(cur)onSheetInput(el);
});
document.addEventListener('keydown',e=>{
  if(!G||G.locked||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.target.matches&&e.target.matches('input,textarea'))return;
  const q=G.qs[G.i], k=e.key.toLowerCase();
  if(q.ty==='ox'){if(k==='o'||k==='1'){e.preventDefault();gameAnswer(0);}else if(k==='x'||k==='2'){e.preventDefault();gameAnswer(1);}return;}
  if(/^[1-9]$/.test(k)){e.preventDefault();gameAnswer(+k-1);}
  else if(k==='enter'&&q.ty==='multi'&&!(e.target.closest&&e.target.closest('.vrow'))){e.preventDefault();gameSubmit();}
});
window.addEventListener('pagehide',()=>{if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}});
document.addEventListener('visibilitychange',()=>{if(G&&!document.hidden)G.last=performance.now();});
// 탭 바 좌우 화살표
app.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('.tabchip');if(!t||(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'))return;
  const n=e.key==='ArrowRight'?t.nextElementSibling:t.previousElementSibling;if(n){e.preventDefault();n.focus();}
});
/* 테마 */
let theme=null;try{theme=localStorage.getItem('qb:theme');}catch(e){}
const applyTheme=()=>{if(theme)document.documentElement.dataset.theme=theme;else delete document.documentElement.dataset.theme;};
applyTheme();
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  theme=dark?'light':'dark';try{localStorage.setItem('qb:theme',theme);}catch(e){}applyTheme();
});
document.title=BANK.title+' · 문제은행';
window.addEventListener('hashchange',route);
route();
})();
</script>
