'use strict';
const BANK={"id":"vibe-d2","code":"VC2","title":"바이브코딩 Day 2 · 프롬프트 엔지니어링 마스터","subtitle":"CRISP 템플릿 · Few-Shot·CoT·페르소나 · 프롬프트 체이닝","course":"02-dev-basics / vibe-coding","source":"02-dev-basics/vibe-coding/Day2_실습자료.md","salt":"vibe-d2","version":1,"updated":"2026-10-15","tabs":[{"id":"t1","title":"프롬프트 기초와 5요소","ref":"오전 1교시 · 실습 1","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"이 자료에서 말하는 프롬프트(Prompt)의 정의로 가장 알맞은 것은?","o":["AI가 학습한 데이터 전체","AI에게 주는 지시·질문·맥락의 총합","AI가 만든 최종 결과물","AI 모델의 설정 값"],"a":1,"h":"1교시는 프롬프트를 AI에게 전달하는 여러 가지를 합친 것으로 정의합니다. 단순히 질문 한 줄만이 아니라 시키는 말, 묻는 말, 배경이 되는 정보까지 모두 포함한다는 점을 떠올리세요.","w":"프롬프트는 AI에게 전달하는 지시문, 질문, 맥락 정보의 총합입니다. 학습 데이터나 결과물은 프롬프트가 아닙니다.","an":"1교시 · 프롬프트란 무엇인가?","src":"프롬프트(Prompt)는 AI에게 전달하는 **지시문, 질문, 맥락 정보의 총합**입니다.\n같은 AI라도 프롬프트에 따라 결과물 품질이 **10배 이상** 달라집니다.\n\n프롬프트를 이해하기 위해 비유를 하나 들어보겠습니다.\n\n**식당 주문에 비유하면:**"},{"id":"t1-02","ty":"mc","lv":1,"game":true,"p":"자료에 따르면 같은 AI라도 프롬프트에 따라 결과물 품질이 얼마나 달라질 수 있나요?","o":["거의 차이 없음","약 10% 정도","10배 이상","정확히 2배"],"a":2,"h":"프롬프트 정의 바로 다음 문장은 같은 AI라도 프롬프트에 따라 결과물 품질이 크게 달라진다고 말합니다. 굵게 강조된 배수 표현을 떠올리세요.","w":"같은 AI라도 프롬프트에 따라 결과물 품질이 10배 이상 달라진다고 설명합니다. 그래서 프롬프트 작성법을 배웁니다.","an":"1교시 · 프롬프트란 무엇인가?","src":"프롬프트(Prompt)는 AI에게 전달하는 **지시문, 질문, 맥락 정보의 총합**입니다.\n같은 AI라도 프롬프트에 따라 결과물 품질이 **10배 이상** 달라집니다.\n\n프롬프트를 이해하기 위해 비유를 하나 들어보겠습니다.\n\n**식당 주문에 비유하면:**"},{"id":"t1-03","ty":"mc","lv":2,"game":true,"p":"식당 주문 비유에서 '좋은 주문'에 해당하는 것은?","o":["맛있는 거 주세요","파스타 주세요","아무거나 빨리요","크림 파스타, 알덴테, 맵지 않게"],"a":3,"h":"식당 주문 비유에서 '맛있는 거 주세요'는 나쁜 주문, '파스타 주세요'는 보통 주문입니다. 좋은 주문은 메뉴 종류, 면 익힘 정도, 매운맛 여부, 시간까지 구체적으로 말해 정확히 원하는 것이 나오게 합니다.","w":"좋은 주문은 메뉴·조리 방식·맵기·시간까지 구체적으로 말합니다. AI도 구체적으로 시킬수록 정확한 결과가 나옵니다.","an":"1교시 · 식당 주문 비유","src":"**식당 주문에 비유하면:**\n- 나쁜 주문: \"맛있는 거 주세요\" → 뭘 줄지 모름\n- 보통 주문: \"파스타 주세요\" → 어떤 파스타? 맵기는?\n- 좋은 주문: \"크림 파스타, 면은 알덴테로, 매운맛 빼주시고, 15분 안에 부탁합니다\" → 정확히 원하는 것이 나옴\n\nAI에게도 똑같습니다. **구체적으로 시킬수록 정확한 결과**가 나옵니다."},{"id":"t1-04","ty":"mc","lv":2,"game":true,"p":"실습 1의 '좋은 이메일 프롬프트'에 포함되지 <b>않은<\/b> 항목은?","o":["상황(납품 3일 지연)","대안(70% 부분 납품)","수신자 개인 연락처","톤과 길이(200자 내외)"],"a":2,"h":"실습 1의 좋은 이메일 프롬프트는 상황(납품 3일 지연), 원인, 대안(부분 납품 70%), 톤, 길이, 형식을 항목으로 지정합니다. 받는 사람의 개인 정보 같은 항목은 들어 있지 않습니다.","w":"좋은 이메일 프롬프트에는 상황, 원인, 대안, 톤, 길이, 형식이 들어 있습니다. 수신자 연락처는 요청하지 않았습니다.","an":"실습 1 · 비교 1 이메일 작성","src":"거래처 담당자에게 보내는 비즈니스 이메일을 작성해줘.\n- 상황: 납품 일정이 3일 지연됨\n- 원인: 원자재 수급 지연\n- 대안: 부분 납품(70%)을 먼저 진행하고 잔여분은 3일 후 전달\n- 톤: 정중하지만 신뢰를 잃지 않는 톤\n- 길이: 200자 내외\n- 형식: 제목 → 인사 → 상황설명 → 대안제시 → 마무리\n```\n\n**비교 기록:**\n\n| 평가 항목 | 나쁜 프롬프트 결과 | 좋은 프롬프트 결과 |"},{"id":"t1-05","ty":"mc","lv":2,"game":true,"p":"5가지 구성 요소 중 '예산 500만원, 기간 3개월, 타겟은 IT 담당자'는 어디에 해당하나요?","o":["역할 (Role)","세부사항 (Specifics)","출력 형식 (Format)","맥락 (Context)"],"a":1,"h":"5가지 핵심 구성 요소 표에서 4번 요소는 '조건, 제약, 범위'를 설명합니다. 예산·기간·타겟처럼 결과물이 지켜야 할 조건을 정하는 요소의 이름을 고르세요.","w":"예산, 기간, 타겟 같은 조건과 제약은 세부사항(Specifics)입니다. 역할은 전문가 설정, 형식은 결과물 모양입니다.","an":"1교시 · 프롬프트의 5가지 핵심 구성 요소 표","src":"좋은 프롬프트에는 다음 5가지가 들어있습니다.\n\n| 순서 | 요소 | 설명 | 예시 |\n|------|------|------|------|\n| 1 | **역할 (Role)** | AI에게 전문가 역할을 부여 | \"너는 10년 경력의 마케팅 전문가야\" |\n| 2 | **맥락 (Context)** | 배경 정보, 상황, 목적 설명 | \"B2B SaaS 스타트업의 신규 서비스 론칭을 앞두고\" |\n| 3 | **지시 (Instruction)** | 구체적으로 해야 할 일 | \"마케팅 전략 보고서를 작성해줘\" |\n| 4 | **세부사항 (Specifics)** | 조건, 제약, 범위 | \"예산 500만원, 기간 3개월, 타겟은 IT 담당자\" |\n| 5 | **출력 형식 (Format)** | 원하는 결과물 형태 | \"표 형식, A4 2장, 핵심 볼드 처리\" |\n\n이 5가지를 쉽게 기억하는 방법이 바로 **CRISP 템플릿**입니다."},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"AI에게는 구체적으로 시킬수록 정확한 결과가 나온다.","a":true,"h":"식당 주문 비유의 결론 문장은 AI에게도 똑같다고 말합니다. 좋은 주문이 정확히 원하는 음식을 받게 하듯, AI에게 얼마나 자세히 시키느냐가 결과의 정확도와 어떤 관계인지 판단하세요.","w":"맞습니다. '맛있는 거 주세요'보다 구체적인 주문이 원하는 음식을 받는 것처럼, AI도 구체적일수록 정확합니다.","an":"1교시 · 식당 주문 비유","src":"AI에게도 똑같습니다. **구체적으로 시킬수록 정확한 결과**가 나옵니다."},{"id":"t1-07","ty":"ox","lv":2,"game":true,"p":"실습 1에서 데이터 분석 프롬프트는 '데이터 분석해줘'처럼 짧을수록 분석 깊이가 깊어진다.","a":false,"h":"실습 1 비교 2의 좋은 프롬프트는 역할(10년 경력 데이터 분석가), 분석 데이터, 분석 항목 네 가지, 표와 볼드 형식을 모두 지정합니다. 비교 기록표는 분석 깊이를 함께 평가하므로, 짧은 프롬프트와 어느 쪽이 깊은지 생각하세요.","w":"틀렸습니다. 좋은 프롬프트는 역할(10년 경력 분석가), 데이터, 분석 항목 4가지, 형식까지 지정해 분석 깊이를 높였습니다.","an":"실습 1 · 비교 2 데이터 분석","src":"#### 비교 2: 데이터 분석\n\n**나쁜 프롬프트:**\n```\n데이터 분석해줘\n```\n\n**좋은 프롬프트:**\n```\n너는 10년 경력의 데이터 분석가야.\n아래 매출 데이터를 분석해줘:\n\n월,매출(만원),고객수,반품률(%)\n1월,2350,156,2.1\n2월,2180,142,2.5\n3월,2890,178,1.8\n4월,3120,195,1.5\n5월,2760,168,2.3\n6월,3450,210,1.2\n\n분석 항목:\n1) 월별 매출 추이와 성장률\n2) 매출과 고객수의 상관관계\n3) 반품률이 가장 낮은 달과 그 특징\n4) 하반기 매출 예측\n\n형식: 각 항목별 표와 함께 인사이트를 정리해줘.\n핵심 수치는 볼드 처리해줘.\n```\n\n**비교 기록:**\n\n| 평가 항목 | 나쁜 프롬프트 결과 | 좋은 프롬프트 결과 |\n|----------|----------------|----------------|\n| 분석 깊이 (1~5) | | |\n| 표/구조화 수준 (1~5) | | |\n| 실무 활용도 (1~5) | | |\n#### 비교 3: 보고서 작성\n\n**나쁜 프롬프트:**\n```\n보고서 써줘\n```\n\n**좋은 프롬프트:**\n```\n역할: 경영기획팀 과장\n대상: 본부장급 임원"},{"id":"t1-08","ty":"match","lv":2,"game":false,"p":"프롬프트 5요소와 예시를 연결하세요.","pairs":[["역할 (Role)","너는 10년 경력의 마케팅 전문가야"],["맥락 (Context)","신규 서비스 론칭을 앞두고"],["지시 (Instruction)","마케팅 전략 보고서를 작성해줘"],["출력 형식 (Format)","표 형식, A4 2장, 핵심 볼드"]],"h":"5가지 핵심 구성 요소 표의 예시 열을 보세요. 역할은 AI에게 전문가 정체성을, 맥락은 배경과 상황을, 지시는 해야 할 일을, 출력 형식은 표·분량·볼드 같은 결과물 모양을 정합니다.","w":"역할은 AI에게 입힐 전문가 옷, 맥락은 배경, 지시는 할 일, 출력 형식은 결과물의 모양입니다.","an":"1교시 · 5가지 핵심 구성 요소 표","src":"좋은 프롬프트에는 다음 5가지가 들어있습니다.\n\n| 순서 | 요소 | 설명 | 예시 |\n|------|------|------|------|\n| 1 | **역할 (Role)** | AI에게 전문가 역할을 부여 | \"너는 10년 경력의 마케팅 전문가야\" |\n| 2 | **맥락 (Context)** | 배경 정보, 상황, 목적 설명 | \"B2B SaaS 스타트업의 신규 서비스 론칭을 앞두고\" |\n| 3 | **지시 (Instruction)** | 구체적으로 해야 할 일 | \"마케팅 전략 보고서를 작성해줘\" |\n| 4 | **세부사항 (Specifics)** | 조건, 제약, 범위 | \"예산 500만원, 기간 3개월, 타겟은 IT 담당자\" |\n| 5 | **출력 형식 (Format)** | 원하는 결과물 형태 | \"표 형식, A4 2장, 핵심 볼드 처리\" |\n\n이 5가지를 쉽게 기억하는 방법이 바로 **CRISP 템플릿**입니다."},{"id":"t1-09","ty":"order","lv":1,"game":false,"p":"자료의 표에 나온 '프롬프트 5가지 핵심 구성 요소'를 순서대로 정렬하세요.","steps":["역할 (Role)","맥락 (Context)","지시 (Instruction)","세부사항 (Specifics)","출력 형식 (Format)"],"h":"5가지 핵심 구성 요소 표의 순서 열은 1부터 5까지입니다. 누가 될지(역할)로 시작해 배경, 할 일, 조건 순으로 가고, 결과물의 모양을 정하는 요소가 마지막입니다.","w":"표의 순서는 역할 → 맥락 → 지시 → 세부사항 → 출력 형식입니다. 이를 쉽게 외우는 방법이 CRISP 템플릿입니다.","an":"1교시 · 5가지 핵심 구성 요소 표","src":"좋은 프롬프트에는 다음 5가지가 들어있습니다.\n\n| 순서 | 요소 | 설명 | 예시 |\n|------|------|------|------|\n| 1 | **역할 (Role)** | AI에게 전문가 역할을 부여 | \"너는 10년 경력의 마케팅 전문가야\" |\n| 2 | **맥락 (Context)** | 배경 정보, 상황, 목적 설명 | \"B2B SaaS 스타트업의 신규 서비스 론칭을 앞두고\" |\n| 3 | **지시 (Instruction)** | 구체적으로 해야 할 일 | \"마케팅 전략 보고서를 작성해줘\" |\n| 4 | **세부사항 (Specifics)** | 조건, 제약, 범위 | \"예산 500만원, 기간 3개월, 타겟은 IT 담당자\" |\n| 5 | **출력 형식 (Format)** | 원하는 결과물 형태 | \"표 형식, A4 2장, 핵심 볼드 처리\" |\n\n이 5가지를 쉽게 기억하는 방법이 바로 **CRISP 템플릿**입니다."},{"id":"t1-10","ty":"multi","lv":2,"game":true,"p":"실습 1 보고서 비교에서 '좋은 프롬프트'가 지정한 것을 <b>모두<\/b> 고르세요.","o":["역할: 경영기획팀 과장","대상: 본부장급 임원","분량: A4 1장 이내","AI 모델 이름","작성자 실명"],"a":[0,1,2],"h":"비교 3의 좋은 프롬프트는 맨 위에 역할·대상·목적을 적고, 아래쪽에 형식과 분량을 지정합니다. 보고서를 쓰는 사람의 직급, 보고받는 사람의 직급, 분량 제한에 해당하는 보기를 고르세요.","w":"좋은 보고서 프롬프트는 역할, 대상, 목적, 데이터, 형식, 분량을 지정했습니다. 모델 이름이나 실명은 없습니다.","an":"실습 1 · 비교 3 보고서 작성","src":"#### 비교 3: 보고서 작성\n\n**나쁜 프롬프트:**\n```\n보고서 써줘\n```\n\n**좋은 프롬프트:**\n```\n역할: 경영기획팀 과장\n대상: 본부장급 임원\n목적: 월간 경영 실적 보고\n\n아래 데이터를 바탕으로 월간 경영 보고서를 작성해줘:\n- 매출: 전월 대비 +5.2%, 전년 동기 대비 +12.8%\n- 영업이익률: 8.3% (목표 10% 대비 미달)\n- 신규 고객: 143건 (전월 128건 대비 +11.7%)\n- 고객 이탈률: 2.8% (전월 3.1%에서 개선)\n\n형식: 요약(3줄) → 주요 성과 → 개선 필요 사항 → 다음 달 계획\n분량: A4 1장 이내\n핵심 수치는 볼드, 개선이 필요한 항목은 별도 표시\n```\n\n**비교 기록:**\n\n| 평가 항목 | 나쁜 프롬프트 결과 | 좋은 프롬프트 결과 |\n|----------|----------------|----------------|\n| 보고서 형식 적절성 (1~5) | | |\n| 수치 활용 정도 (1~5) | | |\n| 임원 보고용 적합성 (1~5) | | |\n\n**핵심 깨달음 정리:**"}]},{"id":"t2","title":"CRISP 템플릿","ref":"오전 2교시 · 실습 2","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"CRISP의 'P'는 무엇을 뜻하나요?","o":["Purpose (목적)","Preference (선호)","Persona (인물)","Process (과정)"],"a":1,"h":"CRISP 표에서 각 알파벳은 영어 단어의 첫 글자입니다. P는 '결과물을 어떤 형식으로 원하는가?'라는 질문에 답하는 요소로, 괄호 안 한국어 뜻은 '좋아하는 방식'에 가깝습니다.","w":"CRISP의 P는 Preference(선호)로, 결과물을 어떤 형식으로 원하는지 정합니다.","an":"2교시 · CRISP 템플릿 표","src":"### CRISP 템플릿이란?\n\nCRISP는 효과적인 프롬프트를 만드는 **만능 공식**입니다.\n\n| 알파벳 | 의미 | 핵심 질문 |\n|--------|------|---------|\n| **C** | Context (맥락) | 어떤 상황인가? |\n| **R** | Role (역할) | AI가 어떤 전문가 역할을 해야 하는가? |\n| **I** | Instruction (지시) | 구체적으로 무엇을 해야 하는가? |\n| **S** | Specifics (세부사항) | 어떤 조건과 제약이 있는가? |\n| **P** | Preference (선호) | 결과물을 어떤 형식으로 원하는가? |\n\n**CRISP를 모두 채우면 반드시 좋은 결과가 나옵니다.**\n단, 매번 5가지를 다 넣을 필요는 없습니다. **최소 C + I + P (맥락 + 지시 + 형식)** 만 넣어도 결과가 크게 달라집니다."},{"id":"t2-02","ty":"mc","lv":1,"game":true,"p":"CRISP에서 '어떤 상황인가?'라는 질문에 답하는 요소는?","o":["Context (맥락)","Role (역할)","Instruction (지시)","Specifics (세부사항)"],"a":0,"h":"CRISP 표의 핵심 질문 열을 보세요. '어떤 상황인가?'는 배경 정보와 상황을 알려 주는 요소에 해당하며, 1교시 5요소 표의 '맥락'과 같은 것입니다.","w":"C는 Context(맥락)로 '어떤 상황인가?'에 답합니다. R은 역할, I는 지시, S는 조건과 제약입니다.","an":"2교시 · CRISP 템플릿 표","src":"### CRISP 템플릿이란?\n\nCRISP는 효과적인 프롬프트를 만드는 **만능 공식**입니다.\n\n| 알파벳 | 의미 | 핵심 질문 |\n|--------|------|---------|\n| **C** | Context (맥락) | 어떤 상황인가? |\n| **R** | Role (역할) | AI가 어떤 전문가 역할을 해야 하는가? |\n| **I** | Instruction (지시) | 구체적으로 무엇을 해야 하는가? |\n| **S** | Specifics (세부사항) | 어떤 조건과 제약이 있는가? |\n| **P** | Preference (선호) | 결과물을 어떤 형식으로 원하는가? |\n\n**CRISP를 모두 채우면 반드시 좋은 결과가 나옵니다.**\n단, 매번 5가지를 다 넣을 필요는 없습니다. **최소 C + I + P (맥락 + 지시 + 형식)** 만 넣어도 결과가 크게 달라집니다."},{"id":"t2-03","ty":"mc","lv":2,"game":true,"p":"매번 5가지를 다 넣기 어렵다면, 최소한 넣어야 결과가 크게 달라지는 조합은?","o":["R + S","C + I + P","R + I","S + P"],"a":1,"h":"자료는 CRISP를 모두 채우면 좋은 결과가 나오지만 매번 다섯 가지를 다 넣을 필요는 없다고 합니다. 최소한 상황, 할 일, 원하는 형식 세 가지만 넣어도 결과가 크게 달라진다고 강조합니다.","w":"자료는 최소 C + I + P(맥락 + 지시 + 형식)만 넣어도 결과가 크게 달라진다고 설명합니다.","an":"2교시 · CRISP 템플릿이란?","src":"**CRISP를 모두 채우면 반드시 좋은 결과가 나옵니다.**\n단, 매번 5가지를 다 넣을 필요는 없습니다. **최소 C + I + P (맥락 + 지시 + 형식)** 만 넣어도 결과가 크게 달라집니다."},{"id":"t2-04","ty":"mc","lv":2,"game":true,"p":"따라하기 A(마케팅 이메일)에서 '얼리버드 30% 할인, 선착순 50명'은 CRISP의 어느 칸에 있나요?","o":["C - 맥락","R - 역할","S - 세부사항","P - 선호"],"a":2,"h":"따라하기 A 템플릿에서 할인율과 선착순 인원은 대상, 과정명, 기간과 함께 같은 칸에 나열되어 있습니다. 조건과 제약을 적는 칸이 어디인지 떠올리세요.","w":"혜택과 기간 같은 조건은 [S - 세부사항] 칸에 들어 있습니다. 제목 3개·톤·길이는 [P - 선호]입니다.","an":"실습 2 · 따라하기 A","src":"[S - 세부사항]\n- 대상: 기존 가입 회원 (직장인 2030~4050)\n- 과정명: \"AI 바이브 코딩 실전 과정\"\n- 혜택: 얼리버드 30% 할인, 선착순 50명\n- 기간: 오픈일로부터 7일간\n- 이메일 제목도 3가지 버전으로 제안해줘\n\n[P - 선호]\n- 이메일 제목 3개 + 본문 1개\n- 톤: 친근하지만 전문적인 톤\n- 길이: 300자 내외"},{"id":"t2-05","ty":"mc","lv":3,"game":true,"p":"따라하기 B에서 첫 보고서를 받은 뒤 '요약을 2줄로, 리스크에 대응 방안 추가, 격식체로'를 입력한 이유는?","o":["AI가 오류를 냈기 때문","보고서를 삭제하기 위해","새 대화를 시작하기 위해","수정 요청을 반복해 결과물을 다듬기 위해"],"a":3,"h":"따라하기 B는 보고서를 받은 뒤 요약·리스크·톤을 고치는 후속 프롬프트를 이어서 입력합니다. 핵심 포인트는 AI와의 대화가 1회로 끝나지 않으며, 무엇을 반복하며 결과물을 다듬는지 설명합니다.","w":"AI와의 대화는 1회로 끝나지 않으며, 수정 요청을 반복해 원하는 결과물로 다듬는 것이 핵심입니다.","an":"실습 2 · 따라하기 B 후속 프롬프트","src":"**결과를 확인한 후, 아래 후속 프롬프트를 이어서 입력하세요:**\n\n```\n위 보고서에서 다음을 수정해줘:\n1) 요약 부분을 더 간결하게 2줄로 줄여줘\n2) 리스크 항목에 \"대응 방안\"도 함께 적어줘\n3) 톤을 좀 더 격식체로 변경해줘\n```\n\n**핵심 포인트:** AI와의 대화는 1회로 끝나지 않습니다. **수정 요청을 반복**하면서 원하는 결과물로 다듬어가는 것이 핵심입니다."},{"id":"t2-06","ty":"ox","lv":2,"game":true,"p":"CRISP를 쓰려면 매번 5가지 요소를 반드시 모두 넣어야 한다.","a":false,"h":"CRISP 설명의 두 번째 문장은 '단,'으로 시작합니다. 매번 다섯 가지 요소를 다 넣어야 하는지에 대해 무엇이라고 하는지, 그리고 최소 조합으로 무엇을 권하는지 확인하세요.","w":"틀렸습니다. 매번 다 넣을 필요는 없고, 최소 C + I + P만 넣어도 결과가 크게 달라집니다.","an":"2교시 · CRISP 템플릿이란?","src":"**CRISP를 모두 채우면 반드시 좋은 결과가 나옵니다.**\n단, 매번 5가지를 다 넣을 필요는 없습니다. **최소 C + I + P (맥락 + 지시 + 형식)** 만 넣어도 결과가 크게 달라집니다."},{"id":"t2-07","ty":"ox","lv":1,"game":true,"p":"따라하기 B의 팀장은 '핵심만 빠르게 파악하길 원하는 스타일'로 [S - 세부사항]에 적혀 있다.","a":true,"h":"따라하기 B의 [S - 세부사항] 칸에는 보고 대상과 특이사항이 적혀 있습니다. 대상 항목의 괄호 안에 팀장이 어떤 스타일인지 설명되어 있으니 문장과 비교하세요.","w":"맞습니다. 팀장의 스타일과 예산안 리스크 언급은 [S - 세부사항] 칸에 적혀 있습니다.","an":"실습 2 · 따라하기 B","src":"[S - 세부사항]\n- 대상: 팀장님 (핵심만 빠르게 파악하길 원하는 스타일)\n- 특이사항: 예산안 마감이 임박하여 일정 지연 리스크 언급 필요\n\n[P - 선호]\n- 형식: 요약(3줄) → 완료 → 진행중(진행률 포함) → 다음주 → 리스크/건의\n- 분량: A4 1장 이내\n- 핵심 수치와 일정은 볼드 처리\n- 표를 활용하여 한눈에 파악 가능하도록\n```"},{"id":"t2-08","ty":"match","lv":1,"game":false,"p":"CRISP 글자와 핵심 질문을 연결하세요.","pairs":[["C","어떤 상황인가?"],["R","어떤 전문가 역할을 해야 하는가?"],["I","구체적으로 무엇을 해야 하는가?"],["S","어떤 조건과 제약이 있는가?"],["P","결과물을 어떤 형식으로 원하는가?"]],"h":"CRISP 표의 핵심 질문을 보세요. C는 상황, R은 AI가 맡을 전문가 역할, I는 구체적으로 할 일, S는 조건과 제약, P는 결과물의 형식을 묻습니다. 각 글자의 영어 단어 뜻을 떠올리면 연결됩니다.","w":"C 맥락, R 역할, I 지시, S 세부사항, P 선호(형식)입니다.","an":"2교시 · CRISP 템플릿 표","src":"### CRISP 템플릿이란?\n\nCRISP는 효과적인 프롬프트를 만드는 **만능 공식**입니다.\n\n| 알파벳 | 의미 | 핵심 질문 |\n|--------|------|---------|\n| **C** | Context (맥락) | 어떤 상황인가? |\n| **R** | Role (역할) | AI가 어떤 전문가 역할을 해야 하는가? |\n| **I** | Instruction (지시) | 구체적으로 무엇을 해야 하는가? |\n| **S** | Specifics (세부사항) | 어떤 조건과 제약이 있는가? |\n| **P** | Preference (선호) | 결과물을 어떤 형식으로 원하는가? |\n\n**CRISP를 모두 채우면 반드시 좋은 결과가 나옵니다.**\n단, 매번 5가지를 다 넣을 필요는 없습니다. **최소 C + I + P (맥락 + 지시 + 형식)** 만 넣어도 결과가 크게 달라집니다."},{"id":"t2-09","ty":"order","lv":2,"game":false,"p":"따라하기 B가 요청한 보고서 형식의 순서를 맞추세요.","steps":["요약(3줄)","완료","진행중(진행률 포함)","다음주","리스크/건의"],"h":"따라하기 B의 [P - 선호]는 보고서 형식을 화살표로 이어 지정합니다. 3줄 요약으로 시작해 이번 주 완료 업무, 진행 중 업무(진행률 포함), 다음 주 계획 순으로 쓰고 리스크/건의로 마무리합니다.","w":"형식은 요약 → 완료 → 진행중 → 다음주 → 리스크/건의 순서입니다. 팀장이 핵심을 빨리 보도록 요약을 앞에 둡니다.","an":"실습 2 · 따라하기 B [P]","src":"- 형식: 요약(3줄) → 완료 → 진행중(진행률 포함) → 다음주 → 리스크/건의\n- 분량: A4 1장 이내\n- 핵심 수치와 일정은 볼드 처리\n- 표를 활용하여 한눈에 파악 가능하도록\n```\n\n**결과를 확인한 후, 아래 후속 프롬프트를 이어서 입력하세요:**"},{"id":"t2-10","ty":"multi","lv":2,"game":true,"p":"따라하기 A의 '결과 평가' 체크리스트 항목을 <b>모두<\/b> 고르세요.","o":["제목이 클릭하고 싶게 작성되었는가","혜택이 명확히 전달되는가","CTA 문구가 행동을 유도하는가","글자 수가 정확히 1,000자인가","영어로 작성되었는가"],"a":[0,1,2],"h":"따라하기 A의 결과 평가는 네 가지를 확인합니다. 제목이 클릭하고 싶게 쓰였는지, 혜택(할인·선착순)이 명확한지, 행동 유도 문구가 효과적인지, 바로 발송할 수준인지입니다.","w":"체크리스트는 제목의 매력, 혜택 전달, CTA 문구, 바로 발송 가능 여부 4가지입니다.","an":"실습 2 · 따라하기 A 결과 평가","src":"**결과 평가:**\n- [ ] 이메일 제목이 클릭하고 싶게 작성되었는가?\n- [ ] 혜택(할인, 선착순)이 명확히 전달되는가?\n- [ ] CTA 문구가 행동을 유도하는가?\n- [ ] 바로 발송할 수 있는 수준인가?"}]},{"id":"t3","title":"Zero-Shot과 Few-Shot","ref":"오후 1교시 · 기법 1 · 실습 3","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"예시 없이 바로 시키는 프롬프트 기법은?","o":["Few-Shot","Zero-Shot","Chain-of-Thought","프롬프트 체이닝"],"a":1,"h":"기법 1의 개념 설명은 두 방법을 대비합니다. 하나는 예시 없이 바로 시켜 AI가 알아서 판단하게 하고, 다른 하나는 예시를 먼저 보여 줍니다. 'Zero'라는 단어가 예시의 개수를 뜻한다는 점을 떠올리세요.","w":"Zero-Shot은 예시 없이 바로 요청하는 방법입니다. Few-Shot은 예시를 먼저 보여 줍니다.","an":"기법 1 · 개념 설명","src":"**Zero-Shot**은 예시 없이 바로 시키는 방법입니다.\n\"이 문장의 감성을 분석해줘\" → AI가 알아서 판단\n\n**Few-Shot**은 예시를 먼저 보여주고 시키는 방법입니다.\n\"이런 게 긍정이고, 이런 게 부정이야. 그러면 이건?\" → AI가 패턴을 학습\n\n**언제 Few-Shot을 쓰는가?**\n- 특정한 형식이나 스타일로 결과를 받고 싶을 때"},{"id":"t3-02","ty":"mc","lv":2,"game":true,"p":"Few-Shot을 쓰기에 알맞은 상황이 <b>아닌<\/b> 것은?","o":["특정 형식으로 결과를 받고 싶을 때","분류·평가 기준을 알려줘야 할 때","Zero-Shot 결과가 아쉬울 때","예시 없이 간단히 물을 때"],"a":3,"h":"Few-Shot을 쓰는 때는 특정 형식이나 스타일로 결과를 받고 싶을 때, 분류·평가 기준을 알려 줘야 할 때, Zero-Shot 결과가 만족스럽지 않을 때입니다. 예시 없이 바로 묻는 것은 반대 기법의 특징입니다.","w":"Few-Shot은 형식·기준이 필요하거나 Zero-Shot이 만족스럽지 않을 때 씁니다. 간단한 질문은 Zero-Shot으로 충분합니다.","an":"기법 1 · 언제 Few-Shot을 쓰는가?","src":"**언제 Few-Shot을 쓰는가?**\n- 특정한 형식이나 스타일로 결과를 받고 싶을 때\n- 분류/평가 기준을 AI에게 알려줘야 할 때\n- Zero-Shot 결과가 만족스럽지 않을 때"},{"id":"t3-03","ty":"mc","lv":2,"game":true,"p":"Few-Shot 감성 분석 예시에서 '보통이에요. 특별한 건 없네요'는 어떻게 분류되었나요?","o":["긍정 (★★★★★)","부정 (★★☆☆☆)","중립 (★★★☆☆)","분류 불가"],"a":2,"h":"Few-Shot 예시의 세 번째 리뷰는 '보통', '특별한 건 없다'는 표현을 근거로 듭니다. 강한 긍정도 불만도 아닌 중간 평가이며, 별은 다섯 개 중 세 개입니다.","w":"예시에서 이 리뷰는 중립(★★★☆☆)이며, 근거는 '보통', '특별한 건 없다' 같은 중간 평가 표현입니다.","an":"실습 3 · 비교 실험 1 Few-Shot 예시","src":"리뷰: \"보통이에요. 특별한 건 없네요\"\n감성: 중립 (★★★☆☆)\n근거: \"보통\", \"특별한 건 없다\" = 중간 평가\n\n[분석 대상]\n1. \"배송이 빨라서 너무 좋았어요\""},{"id":"t3-04","ty":"mc","lv":2,"game":true,"p":"Few-Shot 예시에서 각 리뷰마다 제시한 세 가지 항목은?","o":["리뷰 · 감성 · 근거","제목 · 날짜 · 작성자","점수 · 가격 · 배송","질문 · 답 · 해설"],"a":0,"h":"Few-Shot 프롬프트의 [예시]는 리뷰 세 개를 같은 형식으로 보여 줍니다. 각 예시는 원문, 긍정·부정·중립 판정과 별점, 그렇게 판단한 이유의 세 줄로 구성됩니다.","w":"Few-Shot 예시는 '리뷰 → 감성(별점) → 근거' 형식을 보여 주고, AI가 같은 형식으로 분석하게 합니다.","an":"실습 3 · 비교 실험 1","src":"[예시]\n리뷰: \"정말 만족합니다. 다음에도 꼭 구매할게요\"\n감성: 긍정 (★★★★★)\n근거: \"정말 만족\", \"꼭 구매\" 등 강한 긍정 표현\n\n리뷰: \"포장이 찢어져서 왔어요. 교환 요청합니다\"\n감성: 부정 (★★☆☆☆)\n근거: 제품 손상, 교환 요청 = 불만족\n\n리뷰: \"보통이에요. 특별한 건 없네요\"\n감성: 중립 (★★★☆☆)\n근거: \"보통\", \"특별한 건 없다\" = 중간 평가\n\n[분석 대상]\n1. \"배송이 빨라서 너무 좋았어요\"\n2. \"제품은 괜찮은데 포장이 좀 아쉬웠습니다\"\n3. \"다시는 안 삽니다. 완전 실망\"\n4. \"가격 대비 그냥 무난해요\"\n5. \"친구한테 추천했더니 같이 재구매했어요!\"\n```\n\n**비교 기록:**\n\n| 평가 항목 | Zero-Shot | Few-Shot |"},{"id":"t3-05","ty":"mc","lv":3,"game":false,"p":"회의록 요약 Few-Shot에서 결과의 구조화 수준이 높아지는 가장 큰 이유는?","o":["회의 내용이 더 짧아서","안건·결정·담당·마감일 표 형식을 예시로 보여줘서","AI 모델이 바뀌어서","Zero-Shot보다 늦게 입력해서"],"a":1,"h":"회의록 요약 Few-Shot은 일시·참석자와 함께 안건·논의 내용·결정 사항·담당·마감일 열로 된 표를 예시로 보여 줍니다. AI가 이 표 형식을 그대로 따라 하므로 결과가 구조화됩니다.","w":"Few-Shot은 '안건 | 논의 내용 | 결정 사항 | 담당 | 마감일' 표를 예시로 보여 주므로 AI가 같은 구조로 액션아이템까지 정리합니다.","an":"실습 3 · 비교 실험 2 회의록 요약","src":"**Few-Shot:**\n```\n아래 예시와 동일한 형식으로 회의 내용을 요약해줘.\n[예시 형식]\n회의 요약:\n◼ 일시: 2025-03-10 (월) 14:00~15:00\n◼ 참석: 이팀장, 박과장, 김대리, 최주임\n| 안건 | 논의 내용 | 결정 사항 | 담당 | 마감일 |\n|------|---------|---------|------|--------|\n| 예산 검토 | Q2 예산 10% 삭감 논의 | 불요불급 항목 삭감 후 재편성 | 박과장 | 3/15 |\n[요약할 회의 내용]\n\"오늘 회의에서는 먼저 지난주 마케팅 캠페인 결과를 공유했습니다. \nCTR이 2.3%로 목표(3%)에 미달했고, 김대리가 A/B 테스트를 제안했습니다. \n박과장이 예산 문제를 언급하며 기존 예산 내에서 진행하자고 했고, \n이팀장이 다음 주 수요일까지 개선안을 제출하라고 지시했습니다."},{"id":"t3-06","ty":"ox","lv":1,"game":true,"p":"Few-Shot은 예시를 먼저 보여주고 AI가 그 패턴을 따라 하게 하는 방법이다.","a":true,"h":"기법 1의 개념 설명은 Few-Shot을 예시를 먼저 보여 주고 시키는 방법이라고 정의합니다. \"이런 게 긍정이고, 이런 게 부정이야\"처럼 보여 주면 AI가 무엇을 학습한다고 했는지 확인하세요.","w":"맞습니다. Few-Shot은 예시를 먼저 보여 주어 AI가 패턴을 학습하게 합니다.","an":"기법 1 · 개념 설명","src":"**Few-Shot**은 예시를 먼저 보여주고 시키는 방법입니다.\n\"이런 게 긍정이고, 이런 게 부정이야. 그러면 이건?\" → AI가 패턴을 학습\n\n**언제 Few-Shot을 쓰는가?**\n- 특정한 형식이나 스타일로 결과를 받고 싶을 때"},{"id":"t3-07","ty":"ox","lv":2,"game":true,"p":"회의록 요약 실험에서 Zero-Shot과 Few-Shot은 서로 다른 회의 내용을 요약했다.","a":false,"h":"비교 실험 2에서 Zero-Shot 프롬프트와 Few-Shot 프롬프트의 [요약할 회의 내용]을 비교해 보세요. 마케팅 캠페인 CTR과 신규 채용 건을 다룬 회의 메모가 두 프롬프트에 어떻게 들어 있는지 확인하면 됩니다.","w":"틀렸습니다. 같은 회의 내용을 쓰고 형식 예시의 유무만 다르게 해서 결과를 비교했습니다.","an":"실습 3 · 비교 실험 2","src":"#### 비교 실험 2: 회의록 요약\n**Zero-Shot:**\n```\n아래 회의 내용을 요약해줘:\n\"오늘 회의에서는 먼저 지난주 마케팅 캠페인 결과를 공유했습니다. \nCTR이 2.3%로 목표(3%)에 미달했고, 김대리가 A/B 테스트를 제안했습니다. \n박과장이 예산 문제를 언급하며 기존 예산 내에서 진행하자고 했고, \n이팀장이 다음 주 수요일까지 개선안을 제출하라고 지시했습니다.\n두 번째 안건은 신규 채용 건으로, 개발자 2명과 디자이너 1명을 \n3월까지 채용 완료하기로 했고, 인사팀 최주임이 채용 공고를 \n이번 주 금요일까지 올리기로 했습니다.\"\n```\n**Few-Shot:**\n```\n아래 예시와 동일한 형식으로 회의 내용을 요약해줘.\n[예시 형식]\n회의 요약:\n◼ 일시: 2025-03-10 (월) 14:00~15:00\n◼ 참석: 이팀장, 박과장, 김대리, 최주임\n| 안건 | 논의 내용 | 결정 사항 | 담당 | 마감일 |"},{"id":"t3-08","ty":"match","lv":2,"game":false,"p":"Few-Shot 감성 분석 예시의 리뷰와 분류를 연결하세요.","pairs":[["정말 만족합니다. 다음에도 꼭 구매할게요","긍정 (★★★★★)"],["포장이 찢어져서 왔어요. 교환 요청합니다","부정 (★★☆☆☆)"],["보통이에요. 특별한 건 없네요","중립 (★★★☆☆)"]],"h":"Few-Shot 예시에서 '정말 만족', '꼭 구매'는 강한 긍정 표현, 제품 손상과 교환 요청은 불만족, '보통'과 '특별한 건 없다'는 중간 평가입니다. 별 개수도 다섯 개, 두 개, 세 개로 다릅니다.","w":"강한 긍정 표현은 긍정, 손상·교환 요청은 부정, '보통'은 중립으로 분류합니다.","an":"실습 3 · Few-Shot 예시","src":"[예시]\n리뷰: \"정말 만족합니다. 다음에도 꼭 구매할게요\"\n감성: 긍정 (★★★★★)\n근거: \"정말 만족\", \"꼭 구매\" 등 강한 긍정 표현\n\n리뷰: \"포장이 찢어져서 왔어요. 교환 요청합니다\"\n감성: 부정 (★★☆☆☆)\n근거: 제품 손상, 교환 요청 = 불만족\n\n리뷰: \"보통이에요. 특별한 건 없네요\"\n감성: 중립 (★★★☆☆)\n근거: \"보통\", \"특별한 건 없다\" = 중간 평가\n\n[분석 대상]\n1. \"배송이 빨라서 너무 좋았어요\"\n2. \"제품은 괜찮은데 포장이 좀 아쉬웠습니다\"\n3. \"다시는 안 삽니다. 완전 실망\"\n4. \"가격 대비 그냥 무난해요\"\n5. \"친구한테 추천했더니 같이 재구매했어요!\"\n```\n\n**비교 기록:**\n\n| 평가 항목 | Zero-Shot | Few-Shot |"},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"Few-Shot 프롬프트의 구성 순서를 맞추세요.","steps":["분석 지시와 '예시를 참고해 같은 형식으로' 요청","[예시] 리뷰·감성·근거 3쌍","[분석 대상] 리뷰 5개"],"h":"Few-Shot 프롬프트는 먼저 감성을 분석하고 예시를 참고해 같은 형식으로 답하라고 지시합니다. 이어서 [예시] 블록에 리뷰·감성·근거 세 쌍을 보여 주고, 마지막에 [분석 대상] 리뷰 다섯 개를 줍니다.","w":"Few-Shot은 먼저 할 일과 형식 요청을 쓰고, 예시를 보여 준 뒤, 마지막에 실제 분석 대상을 붙입니다.","an":"실습 3 · Few-Shot 프롬프트","src":"**Few-Shot 프롬프트:**\n```\n다음 고객 리뷰의 감성을 분석해줘.\n아래 예시를 참고하여 동일한 형식으로 분석해줘:\n\n[예시]\n리뷰: \"정말 만족합니다. 다음에도 꼭 구매할게요\"\n감성: 긍정 (★★★★★)\n근거: \"정말 만족\", \"꼭 구매\" 등 강한 긍정 표현\n\n리뷰: \"포장이 찢어져서 왔어요. 교환 요청합니다\"\n감성: 부정 (★★☆☆☆)\n근거: 제품 손상, 교환 요청 = 불만족\n\n리뷰: \"보통이에요. 특별한 건 없네요\"\n감성: 중립 (★★★☆☆)\n근거: \"보통\", \"특별한 건 없다\" = 중간 평가\n\n[분석 대상]\n1. \"배송이 빨라서 너무 좋았어요\"\n2. \"제품은 괜찮은데 포장이 좀 아쉬웠습니다\"\n3. \"다시는 안 삽니다. 완전 실망\"\n4. \"가격 대비 그냥 무난해요\"\n5. \"친구한테 추천했더니 같이 재구매했어요!\"\n```\n\n**비교 기록:**\n\n| 평가 항목 | Zero-Shot | Few-Shot |\n|----------|-----------|----------|"},{"id":"t3-10","ty":"multi","lv":2,"game":true,"p":"감성 분석 비교 기록표의 평가 항목을 <b>모두<\/b> 고르세요.","o":["분류 정확도","분석 형식 일관성","근거 설명 충실도","실무 활용 가능성","응답 속도(초)"],"a":[0,1,2,3],"h":"감성 분석의 비교 기록표는 Zero-Shot과 Few-Shot을 네 항목으로 평가합니다. 분류가 맞았는지, 형식이 일정했는지, 근거 설명이 충실했는지, 실무에 쓸 수 있는지를 각각 1~5점으로 매깁니다.","w":"평가 항목은 분류 정확도, 형식 일관성, 근거 설명 충실도, 실무 활용 가능성 4가지입니다. 응답 속도는 없습니다.","an":"실습 3 · 비교 기록","src":"| 분류 정확도 (1~5) | | |\n| 분석 형식 일관성 (1~5) | | |\n| 근거 설명 충실도 (1~5) | | |\n| 실무 활용 가능성 (1~5) | | |"}]},{"id":"t4","title":"Chain-of-Thought","ref":"오후 1교시 · 기법 2 · 실습 4","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":true,"p":"AI에게 '단계별로 생각해'라고 시키는 기법은?","o":["Few-Shot","네거티브 프롬프트","Chain-of-Thought","출력 형식 제어"],"a":2,"h":"기법 2의 개념 설명은 AI에게 한 번에 결론을 내지 말고 생각을 단계별로 이어 가게 시키는 기법을 소개합니다. '생각(Thought)의 사슬(Chain)'이라는 이름의 뜻을 떠올리세요.","w":"Chain-of-Thought(CoT)는 AI에게 단계별로 사고하도록 유도하는 기법입니다.","an":"기법 2 · 개념 설명","src":"Chain-of-Thought는 AI에게 **\"단계별로 생각해\"**라고 시키는 기법입니다.\n\n**왜 효과적인가?**\n- 복잡한 문제를 작은 단계로 나누면 AI가 더 정확하게 답변합"},{"id":"t4-02","ty":"mc","lv":2,"game":true,"p":"CoT가 효과적인 이유로 자료에 <b>없는<\/b> 것은?","o":["작은 단계로 나눠 더 정확해짐","각 단계 논리를 확인해 오류를 잡기 쉬움","피상적 답 대신 체계적 분석","답변 길이가 항상 짧아짐"],"a":3,"h":"CoT가 효과적인 이유는 세 가지입니다. 작은 단계로 나누면 더 정확해지고, 각 단계의 논리를 확인해 오류를 잡기 쉬우며, 피상적인 답 대신 깊이 있는 분석을 받을 수 있습니다. 답변 분량에 관한 이유는 없습니다.","w":"CoT는 정확도, 오류 확인, 체계적 분석에 도움이 됩니다. 답변이 항상 짧아진다는 설명은 없습니다.","an":"기법 2 · 왜 효과적인가?","src":"**왜 효과적인가?**\n- 복잡한 문제를 작은 단계로 나누면 AI가 더 정확하게 답변합니다\n- 각 단계의 논리를 확인할 수 있어서 오류를 잡기 쉽습니다\n- 피상적인 답변 대신 체계적이고 깊이 있는 분석을 받을 수 있습니다\n\n**언제 쓰는가?**\n- 분석 보고서, 전략 수립, 원인 분석 등 **복잡한 사고가 필요한 업무**\n- AI가 일반적이고 피상적인 답변만 줄 때\n- \"좀 더 깊이 있게 분석해줘\"로 안 될 때"},{"id":"t4-03","ty":"mc","lv":2,"game":true,"p":"CoT를 쓰기에 가장 알맞은 업무는?","o":["간단한 인사말 작성","매출 하락 원인 분석","오타 한 글자 수정","회의 시간 확인"],"a":1,"h":"CoT는 분석 보고서, 전략 수립, 원인 분석처럼 복잡한 사고가 필요한 업무에 씁니다. 실습 4 따라하기 A도 온라인 쇼핑몰의 분기 실적이 떨어진 이유를 단계별로 찾는 예제입니다.","w":"CoT는 분석 보고서, 전략 수립, 원인 분석처럼 복잡한 사고가 필요한 업무에 씁니다.","an":"기법 2 · 언제 쓰는가?","src":"**언제 쓰는가?**\n- 분석 보고서, 전략 수립, 원인 분석 등 **복잡한 사고가 필요한 업무**\n- AI가 일반적이고 피상적인 답변만 줄 때\n- \"좀 더 깊이 있게 분석해줘\"로 안 될 때"},{"id":"t4-04","ty":"mc","lv":2,"game":true,"p":"매출 하락 원인 분석 CoT에서 Step 4 '대응 방안'의 기간 구분은?","o":["단기(1주)·중기(1개월)·장기(3개월)","오전·오후·저녁","1분기~4분기","즉시·내일·다음 주"],"a":0,"h":"CoT 프롬프트의 Step 4는 원인별 대응 방안을 세 기간으로 나누고 예상 비용과 효과를 함께 쓰게 합니다. 짧은 기간부터 주·개월 단위로 괄호 안에 기간이 적혀 있습니다.","w":"Step 4는 각 원인별 대응 방안을 단기(1주), 중기(1개월), 장기(3개월)로 나누고 비용과 효과도 제시하게 합니다.","an":"실습 4 · 따라하기 A Step 4","src":"Step 4) 각 원인별 구체적 대응 방안\n- 단기(1주), 중기(1개월), 장기(3개월)로 구분\n- 예상 비용과 효과도 함께 제시\n\nStep 5) 대응 우선순위 매트릭스\n- 효과(높음/낮음) x 실행 난이도(쉬움/어려움) 2x2 매트릭스로 정리"},{"id":"t4-05","ty":"mc","lv":3,"game":true,"p":"Step 5 '우선순위 매트릭스'의 두 축은?","o":["비용 × 기간","효과 × 실행 난이도","인원 × 예산","매출 × 고객 수"],"a":1,"h":"Step 5는 2x2 매트릭스로 우선순위를 정합니다. 한 축은 대응의 효과가 높은지 낮은지, 다른 축은 실행하기 쉬운지 어려운지이며, 이를 바탕으로 가장 먼저 할 액션 3가지를 고릅니다.","w":"효과(높음/낮음)와 실행 난이도(쉬움/어려움)로 2x2 매트릭스를 만들고 먼저 실행할 액션 3가지를 고릅니다.","an":"실습 4 · 따라하기 A Step 5","src":"Step 5) 대응 우선순위 매트릭스\n- 효과(높음/낮음) x 실행 난이도(쉬움/어려움) 2x2 매트릭스로 정리\n- 가장 먼저 실행할 액션 3가지 선정\n\n표와 함께 정리해줘.\n```\n\n**비교 기록:**\n\n| 평가 항목 | 일반 프롬프트 | CoT 프롬프트 |\n|----------|------------|------------|"},{"id":"t4-06","ty":"ox","lv":1,"game":true,"p":"매출 하락 실습에서는 일반 프롬프트를 먼저 입력한 뒤 CoT 프롬프트를 입력해 결과를 비교한다.","a":true,"h":"따라하기 A는 '일반 프롬프트 (먼저 입력)'와 'CoT 프롬프트 (다음으로 입력)'로 나뉩니다. 일반 프롬프트 결과를 기록한 뒤 CoT 결과와 비교 기록표에서 분석 깊이 등을 비교합니다.","w":"맞습니다. 일반 프롬프트의 결과(대개 일반적인 답변)를 기록한 뒤 CoT 프롬프트로 비교합니다.","an":"실습 4 · 따라하기 A","src":"**일반 프롬프트 (먼저 입력):**\n```\n우리 회사 온라인 쇼핑몰의 3분기 매출이 전분기 대비 15% 하락했어.\n원인과 대응 방안을 알려줘.\n```\n\n→ 결과를 기록하세요. 아마 일반적인 답변이 나올 겁니다.\n\n**CoT 프롬프트 (다음으로 입력):**\n```\n우리 회사 온라인 쇼핑몰의 3분기 매출이 전분기 대비 15% 하락했어.\n\n단계별로 분석해줘:\n\nStep 1) 가능한 외부 원인 5가지\n- 각 원인의 발생 가능성을 상/중/하로 평가\n- 근거도 함께 제시\n\nStep 2) 가능한 내부 원인 5가지\n- 각 원인의 발생 가능성을 상/중/하로 평가\n- 확인 방법 제시 (어떤 데이터를 보면 알 수 있는지)\n\nStep 3) 가장 유력한 원인 Top 3 선정\n- 선정 이유를 논리적으로 설명\n\nStep 4) 각 원인별 구체적 대응 방안\n- 단기(1주), 중기(1개월), 장기(3개월)로 구분"},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"신규 사업 분석 CoT의 마지막 단계는 SWOT 분석이다.","a":false,"h":"신규 사업 아이디어 분석 CoT는 Step 1부터 Step 6까지 있습니다. SWOT 분석은 중간인 Step 3이고, 마지막 Step 6은 앞의 분석을 종합해 사업 추진 여부를 판단하는 결론입니다.","w":"틀렸습니다. 마지막 Step 6은 'Go/No-Go 결론'입니다. SWOT 분석은 Step 3입니다.","an":"실습 4 · 따라하기 B","src":"Step 3) SWOT 분석\n- 표 형식으로 강점/약점/기회/위협 정리\n\nStep 4) 수익 모델 설계\n- 가능한 수익 모델 3가지 비교\n- 각 모델의 예상 매출과 손익분기점\n\nStep 5) 리스크 분석\n- 주요 리스크 5가지와 대응 방안\n- 리스크 영향도/발생 확률 매트릭스\n\nStep 6) Go/No-Go 결론\n- 위 분석을 종합한 추천 의견\n- 조건부 Go라면 필요한 전제조건 제시\n```\n\n**결과 평가:**\n- [ ] 각 단계가 논리적으로 연결되는가?\n- [ ] 구체적인 수치/근거가 포함되어 있는가?"},{"id":"t4-08","ty":"match","lv":2,"game":false,"p":"매출 하락 분석 CoT의 단계와 내용을 연결하세요.","pairs":[["Step 1","외부 원인 5가지와 발생 가능성"],["Step 2","내부 원인 5가지와 확인 방법"],["Step 3","가장 유력한 원인 Top 3"],["Step 4","원인별 단기·중기·장기 대응"],["Step 5","효과×난이도 우선순위 매트릭스"]],"h":"매출 하락 CoT는 외부 원인 5가지와 내부 원인 5가지를 각각 발생 가능성과 함께 보고, 그중 유력한 Top 3를 고릅니다. 이어서 원인별 기간별 대응 방안을 세우고, 효과×난이도 매트릭스로 우선순위를 정합니다.","w":"원인을 외부·내부로 넓게 찾고, Top 3로 좁힌 뒤, 대응 방안과 우선순위로 마무리합니다.","an":"실습 4 · 따라하기 A","src":"단계별로 분석해줘:\n\nStep 1) 가능한 외부 원인 5가지\n- 각 원인의 발생 가능성을 상/중/하로 평가\n- 근거도 함께 제시\n\nStep 2) 가능한 내부 원인 5가지\n- 각 원인의 발생 가능성을 상/중/하로 평가\n- 확인 방법 제시 (어떤 데이터를 보면 알 수 있는지)\n\nStep 3) 가장 유력한 원인 Top 3 선정\n- 선정 이유를 논리적으로 설명\n\nStep 4) 각 원인별 구체적 대응 방안\n- 단기(1주), 중기(1개월), 장기(3개월)로 구분\n- 예상 비용과 효과도 함께 제시\n\nStep 5) 대응 우선순위 매트릭스\n- 효과(높음/낮음) x 실행 난이도(쉬움/어려움) 2x2 매트릭스로 정리\n- 가장 먼저 실행할 액션 3가지 선정\n\n표와 함께 정리해줘.\n```\n\n**비교 기록:**\n\n| 평가 항목 | 일반 프롬프트 | CoT 프롬프트 |\n|----------|------------|------------|\n| 분석 깊이 (1~5) | | |\n| 실행 가능성 (1~5) | | |\n| 논리적 구조 (1~5) | | |"},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"신규 사업 아이디어 분석 CoT의 단계 순서를 맞추세요.","steps":["시장 분석","고객 분석","SWOT 분석","수익 모델 설계","리스크 분석","Go/No-Go 결론"],"h":"신규 사업 분석 CoT는 시장을 먼저 보고 고객을 정의한 뒤, 강점·약점·기회·위협을 정리합니다. 이어서 돈을 버는 방법을 설계하고 리스크를 따진 다음, 마지막에 추진 여부를 결론 냅니다.","w":"시장 → 고객 → SWOT → 수익 모델 → 리스크 → Go/No-Go 순서로 앞 단계가 다음 단계의 근거가 됩니다.","an":"실습 4 · 따라하기 B","src":"#### 따라하기 B: 신규 사업 아이디어 분석\n\n```\n우리 팀에서 \"직장인 대상 AI 활용 교육 서비스\" 사업을 검토 중이야.\n\n단계별로 분석해줘:\n\nStep 1) 시장 분석\n- 시장 규모와 성장률 추정\n- 주요 경쟁사 3~5개와 그들의 강점/약점\n\nStep 2) 고객 분석\n- 타겟 고객 페르소나 3가지 정의\n- 각 페르소나의 핵심 니즈와 Pain Point\n\nStep 3) SWOT 분석\n- 표 형식으로 강점/약점/기회/위협 정리\n\nStep 4) 수익 모델 설계\n- 가능한 수익 모델 3가지 비교\n- 각 모델의 예상 매출과 손익분기점\n\nStep 5) 리스크 분석\n- 주요 리스크 5가지와 대응 방안\n- 리스크 영향도/발생 확률 매트릭스\n\nStep 6) Go/No-Go 결론\n- 위 분석을 종합한 추천 의견\n- 조건부 Go라면 필요한 전제조건 제시\n```\n\n**결과 평가:**\n- [ ] 각 단계가 논리적으로 연결되는가?\n- [ ] 구체적인 수치/근거가 포함되어 있는가?\n- [ ] 실제 경영진 보고에 쓸 수 있는 수준인가?\n- [ ] 추가로 보완이 필요한 단계는 어디인가?\n\n---"},{"id":"t4-10","ty":"multi","lv":2,"game":true,"p":"CoT를 쓰면 좋은 신호를 <b>모두<\/b> 고르세요.","o":["AI가 일반적·피상적 답만 줄 때","'더 깊이 있게 분석해줘'로 안 될 때","전략 수립처럼 복잡한 업무","인사말 한 줄을 쓸 때","오타만 고칠 때"],"a":[0,1,2],"h":"CoT를 쓰는 때는 복잡한 사고가 필요한 업무(분석 보고서·전략 수립·원인 분석), AI가 일반적이고 피상적인 답변만 줄 때, '좀 더 깊이 있게 분석해줘'로 해결되지 않을 때입니다.","w":"CoT는 복잡한 사고가 필요한 업무, 피상적인 답변, '더 깊이'로 해결되지 않을 때 씁니다.","an":"기법 2 · 언제 쓰는가?","src":"**언제 쓰는가?**\n- 분석 보고서, 전략 수립, 원인 분석 등 **복잡한 사고가 필요한 업무**\n- AI가 일반적이고 피상적인 답변만 줄 때\n- \"좀 더 깊이 있게 분석해줘\"로 안 될 때"}]},{"id":"t5","title":"역할극·페르소나와 출력 형식","ref":"기법 3·4 · 실습 5·6","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"AI에게 특정 인물·전문가의 관점을 부여하는 기법은?","o":["역할극 & 페르소나","Zero-Shot","네거티브 프롬프트","프롬프트 체이닝"],"a":0,"h":"기법 3은 AI에게 특정 인물이나 전문가의 관점을 부여하면 답변의 전문성과 깊이가 달라진다고 설명합니다. 누군가의 역할을 맡아 연기하게 하고, 가상의 인물 설정을 입히는 기법의 이름을 고르세요.","w":"역할극·페르소나는 AI에게 특정 전문가의 관점을 부여해 답변의 전문성과 깊이를 높이는 기법입니다.","an":"기법 3 · 개념 설명","src":"AI에게 **특정 인물이나 전문가의 관점**을 부여하면 답변의 전문성과 깊이가 크게 달라집니다.\n\n**단일 관점:** \"이 기획안을 평가해줘\" → 일반적인 평가"},{"id":"t5-02","ty":"mc","lv":2,"game":true,"p":"자료가 권하는 더 효과적인 역할 설정은?","o":["마케팅 전문가","개발자","B2B SaaS 10년 경력의 시니어 마케터","아무 역할 없이"],"a":2,"h":"효과적인 역할 설정 팁은 막연한 직업명보다 업종, 경력 연수, 직급까지 붙인 구체적인 역할을 권합니다. 구체적인 경력·전문 분야·성향까지 설정할수록 답변 품질이 올라갑니다.","w":"'마케팅 전문가'보다 'B2B SaaS 10년 경력의 시니어 마케터'처럼 구체적일수록 답변 품질이 올라갑니다.","an":"기법 3 · 효과적인 역할 설정 팁","src":"**효과적인 역할 설정 팁:**\n- \"마케팅 전문가\" 보다 → \"B2B SaaS 10년 경력의 시니어 마케터\"\n- \"개발자\" 보다 → \"프론트엔드 7년차 시니어 개발자, 코드 리뷰 담당\"\n- 구체적인 경력, 전문 분야, 성향까지 설정하면 답변 품질이 올라갑니다"},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"'누락·중복 없는 분류'가 필요할 때 쓰는 형식 지시는?","o":["타임라인으로","MECE 원칙에 따라","JSON 형식으로","번호 목록으로"],"a":1,"h":"형식 지시 표에서 '누락/중복 없는 분류'에 쓰는 지시는 컨설팅에서 자주 쓰는 원칙 이름입니다. Mutually Exclusive, Collectively Exhaustive의 머리글자로 된 네 글자 약어를 떠올리세요.","w":"MECE 원칙은 누락과 중복 없이 분류하게 합니다. 타임라인은 일정, JSON은 데이터 연동, 번호 목록은 절차에 씁니다.","an":"기법 4 · 형식 지시 표","src":"| 형식 지시 | 사용 상황 |\n|----------|---------|\n| \"표로 정리해줘\" | 비교, 목록, 데이터 정리 |\n| \"번호 목록으로\" | 순서가 있는 절차, 단계별 가이드 |\n| \"JSON 형식으로\" | 데이터 처리, 프로그래밍 연동 |\n| \"마크다운으로\" | 문서 공유, 위키 작성 |\n| \"MECE 원칙에 따라\" | 누락/중복 없는 분류 |\n| \"비교표로\" | A vs B 의사결정 |\n| \"타임라인으로\" | 일정, 역사, 프로세스 |\n| \"플로우차트 형태로\" | 프로세스, 의사결정 흐름 |"},{"id":"t5-04","ty":"mc","lv":2,"game":true,"p":"데이터 처리나 프로그래밍 연동이 목적일 때 알맞은 형식 지시는?","o":["마크다운으로","비교표로","JSON 형식으로","플로우차트 형태로"],"a":2,"h":"형식 지시 표에서 '데이터 처리, 프로그래밍 연동'에 쓰는 형식은 프로그램끼리 데이터를 주고받을 때 쓰는 중괄호 기반의 텍스트 형식입니다. 실습 8의 API 문서 예시에도 이 형식의 요청·응답이 나옵니다.","w":"JSON 형식은 데이터 처리와 프로그래밍 연동에 씁니다. 마크다운은 문서 공유, 비교표는 A vs B 의사결정에 씁니다.","an":"기법 4 · 형식 지시 표","src":"| 형식 지시 | 사용 상황 |\n|----------|---------|\n| \"표로 정리해줘\" | 비교, 목록, 데이터 정리 |\n| \"번호 목록으로\" | 순서가 있는 절차, 단계별 가이드 |\n| \"JSON 형식으로\" | 데이터 처리, 프로그래밍 연동 |\n| \"마크다운으로\" | 문서 공유, 위키 작성 |\n| \"MECE 원칙에 따라\" | 누락/중복 없는 분류 |\n| \"비교표로\" | A vs B 의사결정 |\n| \"타임라인으로\" | 일정, 역사, 프로세스 |\n| \"플로우차트 형태로\" | 프로세스, 의사결정 흐름 |"},{"id":"t5-05","ty":"mc","lv":3,"game":true,"p":"다중 관점 통합 분석(원샷)에서 각 관점마다 요청한 결과 구성은?","o":["긍정 2 · 우려 2 · 개선 제안 1","장점 5 · 단점 5","점수 1개","찬성 · 반대 투표"],"a":0,"h":"다중 관점 통합 분석 프롬프트는 마지막에 각 관점별로 세 가지를 표로 정리하라고 합니다. 좋은 점, 걱정되거나 묻고 싶은 점, 고칠 점을 각각 몇 개씩 요청했는지 확인하세요.","w":"CEO·CFO·CHRO·현장 팀장 관점마다 긍정 평가 2가지, 우려 2가지, 개선 제안 1가지를 표로 정리하게 했습니다.","an":"실습 5 · 따라하기 B","src":"각 관점별로:\n1) 긍정 평가 2가지\n2) 우려/질문 2가지\n3) 개선 제안 1가지\n를 표 형식으로 정리해줘.\n```"},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"'CEO / CFO / 고객 관점에서 각각 평가해줘'는 단일 관점보다 입체적인 분석을 얻는 방법이다.","a":true,"h":"기법 3은 단일 관점과 다중 관점을 비교합니다. \"이 기획안을 평가해줘\"는 일반적인 평가가 나오지만, 여러 직책의 관점에서 각각 평가하게 하면 360도 입체적 분석을 얻을 수 있습니다.","w":"맞습니다. 다중 관점은 360도 입체적 분석을 얻는 방법입니다.","an":"기법 3 · 개념 설명","src":"**단일 관점:** \"이 기획안을 평가해줘\" → 일반적인 평가\n**다중 관점:** \"CEO / CFO / 고객 관점에서 각각 평가해줘\" → 360도 입체적 분석\n\n**효과적인 역할 설정 팁:**"},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"실습 6에서 가장 실용적인 형식은 자료가 '표'로 정해 두었다.","a":false,"h":"실습 6의 마지막 '기록' 칸은 가장 실용적인 형식과 그 이유를 빈칸으로 남겨 둡니다. 자료가 특정 형식을 정답으로 정했는지, 학습자가 직접 비교해 적게 했는지 확인하세요.","w":"틀렸습니다. 같은 내용을 표·MECE·경영진 보고용으로 받아 보고, 가장 실용적인 형식은 학습자가 직접 판단해 기록합니다.","an":"실습 6 · 기록","src":"**기록:**\n- 가장 실용적인 형식: _______________\n- 그 이유: _______________"},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"실습 5 단일 역할 설정의 역할과 관점을 연결하세요.","pairs":[["15년 경력 마케팅 전략 컨설턴트","마케팅 전략 제안"],["20년 경력 CFO 출신 재무 컨설턴트","재무적 타당성 평가"],["35세 IT기업 과장(코딩 모름)","광고를 본 솔직한 첫 반응"]],"h":"따라하기 A는 같은 사업을 세 역할로 바꿔 묻습니다. 15년 경력 마케팅 컨설턴트에게는 전략 제안을, CFO 출신 재무 컨설턴트에게는 타당성 평가를, 코딩을 모르는 35세 과장에게는 광고를 본 솔직한 반응을 요청합니다.","w":"같은 사업을 마케팅, 재무, 고객 관점으로 바꿔 물으면 강조점과 우려가 달라집니다.","an":"실습 5 · 따라하기 A","src":"**프롬프트 2 (재무 관점):**\n```\n너는 20년 경력의 CFO 출신 재무 컨설턴트야.\n보수적인 관점에서 투자 대비 수익을 꼼꼼히 따지는 스타일이야.\n\n우리 회사가 \"직장인 대상 AI 교육 서비스\"를 시작하려고 해.\n재무적 관점에서 이 사업의 타당성을 평가해줘.\n```\n\n**프롬프트 3 (고객 관점):**\n```\n너는 35세 IT기업 과장이야. 직장 5년차이고, AI에 관심은 많지만\n코딩은 전혀 모르고, 업무가 바빠서 긴 교육은 부담스러워해.\n\n\"AI 교육 서비스\" 광고를 봤어. 솔직한 첫 반응과 \n수강을 결정하기 위해 알고 싶은 것 5가지를 말해줘.\n```\n\n**비교 기록:**\n\n| 항목 | 마케팅 관점 | 재무 관점 | 고객 관점 |"},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"실습 6 '경영진 보고용' 형식 요청의 구성 순서를 맞추세요.","steps":["Executive Summary (3줄)","주요 트렌드 5가지","우리 회사 시사점 (액션 아이템 3가지)"],"h":"형식 3의 경영진 보고용 요청은 위에서부터 짧은 요약, 트렌드 설명, 우리 회사에 주는 의미 순으로 구성되고 분량은 A4 1장입니다. 경영진이 결론을 먼저 보도록 3줄 요약이 맨 앞에 옵니다.","w":"경영진 보고용은 3줄 요약을 먼저, 트렌드 5가지를 본문으로, 마지막에 우리 회사 시사점을 둡니다.","an":"실습 6 · 형식 3","src":"**형식 3 — 경영진 보고용:**\n```\n2025년 AI 기술 트렌드를 경영진 보고용으로 정리해줘.\n- Executive Summary (3줄)\n- 주요 트렌드 5가지 (각각 한 문단)\n- 우리 회사 시사점 (액션 아이템 3가지)\n- 분량: A4 1장\n```\n\n**기록:**\n- 가장 실용적인 형식: _______________\n- 그 이유: _______________"},{"id":"t5-10","ty":"multi","lv":2,"game":true,"p":"다중 관점 통합 분석에서 사용한 4가지 관점을 <b>모두<\/b> 고르세요.","o":["CEO","CFO","CHRO (인사총괄)","현장 팀장","외부 감사인"],"a":[0,1,2,3],"h":"다중 관점 통합 분석은 네 관점으로 계획서를 평가합니다. 전략을 보는 최고경영자, 비용과 ROI를 보는 재무 책임자, 직원 수용도를 보는 인사총괄, 그리고 실무 적용을 보는 현장 관리자입니다.","w":"CEO(전략), CFO(재무), CHRO(인사), 현장 팀장(실무) 4가지 관점으로 계획서를 평가했습니다.","an":"실습 5 · 따라하기 B","src":"[관점 1 - CEO]\n전략적 가치, 경쟁력 확보, 조직 변화 관리 관점\n\n[관점 2 - CFO] \n투자 대비 수익(ROI), 비용 적정성, 리스크 관점\n\n[관점 3 - CHRO (인사총괄)]\n직원 수용도, 교육 효과, 조직문화 영향 관점\n\n[관점 4 - 현장 팀장]\n실무 적용 가능성, 업무 부담, 팀원 반응 예상 관점\n\n각 관점별로:\n1) 긍정 평가 2가지\n2) 우려/질문 2가지\n3) 개선 제안 1가지\n를 표 형식으로 정리해줘.\n```"}]},{"id":"t6","title":"프롬프트 체이닝","ref":"오후 2교시 · 실습 7","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"하나의 복잡한 업무를 여러 번의 대화로 나누어 점진적으로 완성하는 기법은?","o":["Few-Shot","프롬프트 체이닝","네거티브 프롬프트","출력 형식 제어"],"a":1,"h":"오후 2교시는 복잡한 업무 하나를 여러 번의 대화로 나누어 점진적으로 완성하는 기법을 다룹니다. 각 대화의 결과가 다음 대화로 고리처럼 이어진다는 뜻의 이름을 떠올리세요.","w":"프롬프트 체이닝은 복잡한 업무를 여러 대화로 나누어 단계적으로 완성하는 기법입니다.","an":"2교시 · 프롬프트 체이닝이란?","src":"하나의 복잡한 업무를 **여러 번의 대화로 나누어** 점진적으로 완성하는 기법입니다.\n\n**왜 체이닝을 쓰는가?**\n- 한 번에 모든 것을 시키면 AI가 각 부분의 품질을 균등하게"},{"id":"t6-02","ty":"mc","lv":2,"game":false,"p":"한 번에 모든 것을 시키면 생기는 문제로 자료가 든 것은?","o":["AI가 답을 거부한다","비용이 무료가 된다","각 부분의 품질을 균등하게 나눠 깊이가 얕아진다","형식이 자동으로 표가 된다"],"a":2,"h":"'왜 체이닝을 쓰는가?'의 첫 줄은 한 번에 모든 것을 시킬 때의 문제를 말합니다. AI가 각 부분의 품질을 균등하게 나누게 되어 어느 한 부분에도 집중하지 못한다는 점을 떠올리세요.","w":"한 번에 시키면 AI가 각 부분의 품질을 균등하게 나누게 됩니다. 단계별로 시키면 각 단계에 집중해 품질이 높아집니다.","an":"2교시 · 왜 체이닝을 쓰는가?","src":"**왜 체이닝을 쓰는가?**\n- 한 번에 모든 것을 시키면 AI가 각 부분의 품질을 균등하게 나누게 됨\n- 단계별로 시키면 각 단계에 집중하여 더 높은 품질 확보\n- 중간 결과를 확인하고 방향 수정이 가능\n\n**체이닝의 기본 패턴:**\n```\n1단계: 아이디어 발산 (브레인스토밍)\n ↓\n2단계: 평가 및 선별 (기준 제시 후 필터링)\n ↓"},{"id":"t6-03","ty":"mc","lv":2,"game":true,"p":"실습 7의 2단계(평가 및 선별)에서 쓴 평가 기준이 <b>아닌<\/b> 것은?","o":["시간 절감 효과","적용 난이도","팀원 수용도","예산 규모"],"a":3,"h":"실습 7의 2단계는 아이디어 10가지를 세 기준으로 5점 만점 채점해 Top 3를 고릅니다. 기준은 시간 절감 효과, 적용 난이도, 팀원 수용도이며, 1단계 조건이 이미 비용이 거의 없는 방법이었습니다.","w":"평가 기준은 시간 절감 효과, 적용 난이도, 팀원 수용도 3가지이며 총점으로 Top 3를 고릅니다.","an":"실습 7 · 2단계","src":"**2단계 — 평가 및 선별:**\n```\n위 10가지 아이디어를 다음 기준으로 평가하고 Top 3를 선정해줘.\n평가 기준:\n1) 시간 절감 효과 (높을수록 좋음)\n2) 적용 난이도 (낮을수록 좋음)\n3) 팀원 수용도 (높을수록 좋음)\n각 기준을 5점 만점으로 채점하고, 총점 기준 상위 3개를 선정해줘.\n평가 결과를 표로 정리해줘.\n```\n→ Top 3가 선정되었나요? 납득이 되나요?\n**3단계 — 구체화:**\n```\n위에서 선정된 Top 3 아이디어를 각각 구체화해줘.\n각 아이디어별로:\n1) 현재 업무 프로세스 (As-Is)\n2) AI 적용 후 프로세스 (To-Be)\n3) 필요한 AI 도구와 설정 방법"},{"id":"t6-04","ty":"mc","lv":2,"game":true,"p":"실습 7의 4단계(실행 계획)는 어떤 형태의 표로 정리하라고 했나요?","o":["간트 차트","SWOT 표","2x2 매트릭스","파이 차트"],"a":0,"h":"실습 7의 4단계는 4주 로드맵을 주차별 목표, 담당자, KPI, 리스크, 중간 점검 일정과 함께 요청합니다. 마지막 줄에 일정 막대를 표로 나타내는 프로젝트 관리용 차트 이름이 지정되어 있습니다.","w":"4주 로드맵을 간트 차트 형태의 표로 정리하게 했습니다.","an":"실습 7 · 4단계","src":"**4단계 — 실행 계획:**\n```\n위 3가지 아이디어를 실행하기 위한 4주 로드맵을 작성해줘.\n포함 사항:\n- 주차별 목표와 세부 활동\n- 담당자 배정 (팀원 A~E)\n- 성과 측정 지표 (KPI)\n- 예상 리스크와 대응 방안\n- 중간 점검 일정\n간트 차트 형태의 표로 정리해줘.\n```\n→ 실행 가능한 계획이 나왔나요?\n**5단계 — 최종 문서화:**\n```\n위의 모든 내용을 종합하여 \"팀 업무 효율화 프로젝트 제안서\"를 작성해줘.\n구조:\n1) 제안 배경 (현재 문제점)\n2) 추진 목표 (정량적 목표)"},{"id":"t6-05","ty":"mc","lv":3,"game":true,"p":"체이닝 실습에서 각 단계로 넘어가기 전에 반드시 해야 하는 일은?","o":["새 대화창 열기","프롬프트 전체 삭제","AI 모델 변경","이전 단계 결과 확인"],"a":3,"h":"실습 7은 5단계를 순서대로 하나씩 입력하라고 하며, 다음 단계로 넘어가기 전에 굵게 강조된 규칙을 지키라고 합니다. 단계마다 '→ 결과를 확인하세요'라는 안내가 붙어 있습니다.","w":"체이닝은 중간 결과를 확인하고 방향을 수정할 수 있다는 장점이 있습니다. 그래서 이전 결과를 확인한 뒤 다음 단계로 갑니다.","an":"실습 7 · 진행 규칙","src":"아래 5단계를 **순서대로 하나씩** AI에 입력하세요.\n**반드시 이전 단계의 결과를 확인한 후** 다음 단계로 넘어가세요."},{"id":"t6-06","ty":"ox","lv":1,"game":true,"p":"프롬프트 체이닝은 중간 결과를 확인하며 방향을 수정할 수 있다.","a":true,"h":"체이닝을 쓰는 이유 세 번째 줄을 보세요. 단계마다 나온 결과를 보면서 다음 단계로 넘어가기 때문에, 중간에 방향이 잘못되면 바로잡을 수 있습니다.","w":"맞습니다. 단계마다 결과를 보고 다음 지시를 조정할 수 있습니다.","an":"2교시 · 왜 체이닝을 쓰는가?","src":"**왜 체이닝을 쓰는가?**\n- 한 번에 모든 것을 시키면 AI가 각 부분의 품질을 균등하게 나누게 됨\n- 단계별로 시키면 각 단계에 집중하여 더 높은 품질 확보\n- 중간 결과를 확인하고 방향 수정이 가능\n\n**체이닝의 기본 패턴:**\n```\n1단계: 아이디어 발산 (브레인스토밍)\n ↓\n2단계: 평가 및 선별 (기준 제시 후 필터링)\n ↓"},{"id":"t6-07","ty":"ox","lv":2,"game":true,"p":"실습 7의 1단계에서는 비용이 많이 들더라도 효과가 큰 AI 도구 아이디어를 요청했다.","a":false,"h":"실습 7의 1단계는 행정팀 5명을 위한 AI 활용 아이디어 10가지를 요청하면서 조건 세 가지를 붙입니다. 첫 번째 조건이 비용에 관해 무엇이라고 했는지 확인하세요.","w":"틀렸습니다. 조건은 '비용이 거의 들지 않는 방법(무료 AI 도구)'과 '비개발자도 바로 적용 가능한 방법'이었습니다.","an":"실습 7 · 1단계","src":"**1단계 — 브레인스토밍:**\n```\n우리 팀(5명, 행정업무 담당)의 업무 효율화를 위한 AI 활용 아이디어를 \n10가지 제안해줘.\n조건:\n- 비용이 거의 들지 않는 방법 (무료 AI 도구 활용)\n- 비개발자도 바로 적용 가능한 방법\n- 각 아이디어에 예상 시간 절감 효과도 표시해줘\n```\n→ 결과를 확인하세요. 10가지 아이디어가 나왔나요?\n**2단계 — 평가 및 선별:**\n```\n위 10가지 아이디어를 다음 기준으로 평가하고 Top 3를 선정해줘.\n평가 기준:\n1) 시간 절감 효과 (높을수록 좋음)\n2) 적용 난이도 (낮을수록 좋음)\n3) 팀원 수용도 (높을수록 좋음)"},{"id":"t6-08","ty":"match","lv":2,"game":false,"p":"체이닝 실습의 단계와 결과물을 연결하세요.","pairs":[["1단계","아이디어 10가지"],["2단계","평가 후 Top 3"],["3단계","As-Is/To-Be와 프롬프트 예시"],["4단계","4주 로드맵"],["5단계","팀 업무 효율화 제안서"]],"h":"실습 7은 아이디어 10가지로 시작해 평가 후 Top 3를 고르고, As-Is/To-Be와 프롬프트 예시로 구체화합니다. 이어서 4주 로드맵을 만들고, 마지막에 팀 업무 효율화 제안서로 문서화합니다.","w":"아이디어를 넓게 낸 뒤 좁히고, 구체화하고, 일정을 세운 다음 문서로 정리합니다.","an":"실습 7 · 1~5단계","src":"**체이닝의 기본 패턴:**\n```\n1단계: 아이디어 발산 (브레인스토밍)\n ↓\n2단계: 평가 및 선별 (기준 제시 후 필터링)\n ↓\n3단계: 구체화 (선택된 아이디어 상세 전개)\n ↓\n4단계: 실행 계획 (타임라인, 담당자, 예산)\n ↓\n5단계: 최종 문서화 (보고서, 제안서 형태로 정리)\n```"},{"id":"t6-09","ty":"order","lv":1,"game":false,"p":"체이닝의 기본 패턴 5단계를 순서대로 정렬하세요.","steps":["아이디어 발산 (브레인스토밍)","평가 및 선별","구체화","실행 계획","최종 문서화"],"h":"체이닝의 기본 패턴은 넓게 아이디어를 펼치는 것에서 시작해, 기준으로 걸러 내고, 고른 것을 자세히 전개한 뒤, 일정·담당·예산을 짜고, 마지막에 보고서 형태로 정리합니다.","w":"기본 패턴은 발산 → 선별 → 구체화 → 실행 계획 → 최종 문서화입니다.","an":"2교시 · 체이닝의 기본 패턴","src":"**체이닝의 기본 패턴:**\n```\n1단계: 아이디어 발산 (브레인스토밍)\n ↓\n2단계: 평가 및 선별 (기준 제시 후 필터링)\n ↓\n3단계: 구체화 (선택된 아이디어 상세 전개)\n ↓\n4단계: 실행 계획 (타임라인, 담당자, 예산)\n ↓\n5단계: 최종 문서화 (보고서, 제안서 형태로 정리)\n```"},{"id":"t6-10","ty":"multi","lv":2,"game":true,"p":"3단계(구체화)에서 아이디어별로 요청한 항목을 <b>모두<\/b> 고르세요.","o":["현재 프로세스 (As-Is)","AI 적용 후 프로세스 (To-Be)","구체적인 프롬프트 예시 3개","도입 시 주의사항","팀원 연봉 비교"],"a":[0,1,2,3],"h":"실습 7의 3단계는 Top 3 아이디어마다 여섯 가지를 요청합니다. 현재 프로세스, AI 적용 후 프로세스, 필요한 도구와 설정, 프롬프트 예시 3개, Before/After 시간 비교, 도입 시 주의사항입니다.","w":"3단계는 As-Is, To-Be, 필요한 도구, 프롬프트 예시 3개, Before/After 시간 비교, 주의사항을 요청합니다.","an":"실습 7 · 3단계","src":"**3단계 — 구체화:**\n```\n위에서 선정된 Top 3 아이디어를 각각 구체화해줘.\n각 아이디어별로:\n1) 현재 업무 프로세스 (As-Is)\n2) AI 적용 후 프로세스 (To-Be)\n3) 필요한 AI 도구와 설정 방법\n4) 구체적인 프롬프트 예시 3개\n5) 예상 Before/After 시간 비교\n6) 도입 시 주의사항\n상세하게 작성해줘.\n```\n→ 프롬프트 예시까지 나왔나요? 실제로 써볼 만한가요?\n**4단계 — 실행 계획:**\n```\n위 3가지 아이디어를 실행하기 위한 4주 로드맵을 작성해줘.\n포함 사항:\n- 주차별 목표와 세부 활동\n- 담당자 배정 (팀원 A~E)\n- 성과 측정 지표 (KPI)"}]},{"id":"t7","title":"직무별 실전과 프롬프트 라이브러리","ref":"오후 3·4교시 · 실습 8~11 · 정리","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"'~하지 마'라는 지시로 결과물 품질을 높이는 기법은?","o":["Few-Shot","네거티브 프롬프트","Chain-of-Thought","페르소나"],"a":1,"h":"실습 9는 '~하지 마'라는 지시도 결과물 품질을 높이는 데 효과적이라고 설명합니다. 하면 안 되는 것을 알려 주는 부정형 지시라는 뜻의 기법 이름을 떠올리세요.","w":"네거티브 프롬프트는 '~하지 마'로 불필요한 내용을 제한해 품질을 높입니다.","an":"실습 9 · 네거티브 프롬프트","src":"\"~하지 마\"라는 지시도 AI 결과물의 품질을 높이는 데 매우 효과적입니다."},{"id":"t7-02","ty":"mc","lv":2,"game":true,"p":"서론이 너무 길 때 쓰는 네거티브 프롬프트는?","o":["인사말과 서론 없이 바로 본론부터 시작해","표로 정리해줘","단계별로 생각해","예시를 먼저 보여줄게"],"a":0,"h":"네거티브 프롬프트 모음 표의 첫 상황은 서론이 너무 길 때입니다. 인사말과 서론을 빼고 곧바로 핵심 내용부터 시작하라는 지시가 짝지어져 있습니다.","w":"서론이 길면 '인사말과 서론 없이 바로 본론부터 시작해'라고 지시합니다.","an":"실습 9 · 네거티브 프롬프트 모음","src":"**유용한 네거티브 프롬프트 모음:**\n\n| 상황 | 네거티브 프롬프트 |\n|------|----------------|\n| 서론이 너무 길 때 | \"인사말과 서론 없이 바로 본론부터 시작해\" |\n| 너무 전문적일 때 | \"전문 용어를 사용하지 말고 쉽게 설명해\" |\n| 너무 일반적일 때 | \"일반적인 조언 말고 구체적인 수치와 예시만 제시해\" |\n| 리스트만 나올 때 | \"불릿 포인트 대신 자연스러운 문장형으로 작성해\" |\n| 너무 길 때 | \"500자를 절대 넘지 마\" |\n| 불필요한 내용이 있을 때 | \"법적 면책 조항이나 부연 설명은 넣지 마\" |"},{"id":"t7-03","ty":"mc","lv":2,"game":true,"p":"실습 8 공문 초안 프롬프트의 [P]에 지정된 구조는?","o":["요약·본문·부록","서론·본론·결론","수신·참조·제목·본문·붙임","제목·해시태그·캡션"],"a":2,"h":"공문 초안 프롬프트의 [S]는 공공기관 공문 형식과 격식체를 요구하고, [P]는 공문 형식의 구조를 괄호 안에 다섯 부분으로 적습니다. 받는 곳, 함께 보는 곳, 제목, 본문, 첨부 순서입니다.","w":"공문 형식은 수신, 참조, 제목, 본문, 붙임 구조입니다.","an":"실습 8 · A. 행정/총무 프롬프트 1","src":"**프롬프트 1: 공문 초안 작성**\n```\n[C] 공공기관 행정팀 소속. 관련 부서에 협조 요청 공문을 보내야 함.\n[R] 공공기관 공문 작성 전문가\n[I] 아래 내용으로 공문 초안을 작성해줘.\n\n- 제목: 2025년 하반기 예산 수요조사 협조 요청\n- 수신: 각 부서장\n- 내용: 내년도 예산 편성을 위해 부서별 수요조사 실시\n- 제출 기한: 2025년 10월 15일(수)까지\n- 제출 방법: 첨부 양식 작성 후 기획재정팀 이메일 제출\n- 참고: 미제출 부서는 전년도 예산 기준으로 편성 예정\n\n[S] 공공기관 공문 형식 준수, 격식체, 문서번호 양식 포함\n[P] 공문 형식 (수신, 참조, 제목, 본문, 붙임 구조)\n```\n\n**프롬프트 2: 회의록 정리**\n```\n[C] 오늘 팀 회의(10:00~11:00) 내용을 정리해야 함\n[R] 전문 회의록 작성 비서\n[I] 아래 메모를 정식 회의록으로 정리해줘.\n\n[회의 메모 - 여기에 본인의 실제 회의 메모를 붙여넣으세요]\n예시:\n- 예산 건: 하반기 예산 5% 삭감 확정, 각 팀 자체 조정"},{"id":"t7-04","ty":"mc","lv":2,"game":true,"p":"프롬프트 라이브러리의 버전 관리 예시로 알맞은 것은?","o":["날짜만 기록","1차 → 최종 → 진짜최종","A → B → C","v1.0 → v1.1 → v2.0"],"a":3,"h":"라이브러리 관리 팁의 마지막 줄은 프롬프트를 개선할 때마다 버전 번호를 붙여 기록하라고 합니다. 작은 개선은 소수점 뒤 숫자를, 큰 개선은 앞자리 숫자를 올리는 방식입니다.","w":"라이브러리 관리 팁은 개선할 때마다 v1.0 → v1.1 → v2.0으로 기록하라고 합니다.","an":"실습 10 · 라이브러리 관리 팁","src":"**라이브러리 관리 팁:**\n- 노션, 구글 독스, 엑셀 중 편한 도구에 정리하세요\n- 효과 등급은 실제 사용 후 업데이트하세요\n- 팀원과 공유하면 서로의 프롬프트에서 배울 수 있습니다\n- 버전 관리: 개선할 때마다 v1.0 → v1.1 → v2.0으로 기록"},{"id":"t7-05","ty":"mc","lv":3,"game":true,"p":"실습 11 A/B 테스트에서 고른 버전은 어떻게 하나요?","o":["삭제한다","프롬프트 라이브러리에 등록한다","팀장에게 메일로 보낸다","AI에게 다시 평가시킨다"],"a":1,"h":"실습 11은 같은 목적의 프롬프트를 두 버전으로 써서 결과물 품질, 실무 활용도, 작성 난이도를 비교하고 하나를 선택합니다. 마지막 굵은 문장은 선택한 버전을 실습 10에서 만든 곳에 넣으라고 합니다.","w":"두 버전의 결과를 비교해 선택한 버전을 프롬프트 라이브러리에 등록합니다.","an":"실습 11 · 프롬프트 A/B 테스트","src":"**선택한 버전을 프롬프트 라이브러리에 등록하세요.**"},{"id":"t7-06","ty":"ox","lv":1,"game":true,"p":"실습 8의 직무별 프롬프트는 본인의 실제 업무 내용으로 수정해서 사용해야 한다.","a":true,"h":"실습 8의 안내는 본인과 가장 가까운 직무의 프롬프트를 고르라고 하면서 굵은 글씨로 한 가지 조건을 강조합니다. 예시 그대로가 아니라 무엇으로 바꿔 사용하라고 했는지 확인하세요.","w":"맞습니다. 예시 프롬프트를 그대로 쓰지 말고 본인 업무 내용으로 바꿔 사용하라고 강조합니다.","an":"실습 8 · 안내","src":"본인과 가장 가까운 직무를 선택하여 해당 프롬프트를 AI에 입력하세요.\n**반드시 본인의 실제 업무 내용으로 수정하여** 사용하세요."},{"id":"t7-07","ty":"ox","lv":2,"game":true,"p":"Day 2 정리표에서 CRISP 템플릿의 사용 상황은 '복잡한 분석에만'이다.","a":false,"h":"Day 2 학습 정리 표에서 CRISP 템플릿의 한줄 요약은 C+R+I+S+P 5요소로 구조화하는 것입니다. '사용 상황' 열이 CRISP를 특정 업무에만 쓰라고 했는지, 모든 프롬프트에 쓰라고 했는지 확인하세요.","w":"틀렸습니다. CRISP 템플릿은 '모든 프롬프트의 기본'입니다. 복잡한 분석은 Chain-of-Thought의 사용 상황입니다.","an":"Day 2 학습 정리 · 핵심 기법 표","src":"| 기법 | 한줄 요약 | 사용 상황 |\n|------|---------|---------|\n| CRISP 템플릿 | C+R+I+S+P 5요소로 구조화 | 모든 프롬프트의 기본 |\n| Zero-Shot | 예시 없이 바로 요청 | 간단한 작업, 일반적 질문 |\n| Few-Shot | 예시를 먼저 보여주고 요청 | 분류, 평가, 특정 형식 필요 시 |\n| Chain-of-Thought | 단계별로 사고하도록 유도 | 복잡한 분석, 전략 수립 |\n| 역할극/페르소나 | 특정 전문가 관점 부여 | 다각도 분석, 전문성 필요 시 |\n| 출력 형식 제어 | 표, 목록, MECE 등 형식 지정 | 모든 상황에서 활용 |\n| 프롬프트 체이닝 | 여러 단계로 나누어 요청 | 복잡한 프로젝트, 문서 작성 |\n| 네거티브 프롬프트 | \"~하지 마\"로 제한 | 불필요한 내용 제거 |"},{"id":"t7-08","ty":"match","lv":2,"game":false,"p":"기법과 한줄 요약을 연결하세요.","pairs":[["Zero-Shot","예시 없이 바로 요청"],["Few-Shot","예시를 먼저 보여주고 요청"],["Chain-of-Thought","단계별로 사고하도록 유도"],["프롬프트 체이닝","여러 단계로 나누어 요청"],["네거티브 프롬프트","'~하지 마'로 제한"]],"h":"Day 2 학습 정리 표의 한줄 요약 열을 보세요. 예시가 없는 기법과 예시를 먼저 보여 주는 기법, 단계별 사고, 여러 단계로 나누기, '~하지 마'로 제한하기가 각각 어떤 기법인지 연결하세요.","w":"오늘 배운 기법을 한 줄로 요약하면 위와 같습니다. 상황에 맞게 섞어 씁니다.","an":"Day 2 학습 정리 · 핵심 기법 표","src":"| 기법 | 한줄 요약 | 사용 상황 |\n|------|---------|---------|\n| CRISP 템플릿 | C+R+I+S+P 5요소로 구조화 | 모든 프롬프트의 기본 |\n| Zero-Shot | 예시 없이 바로 요청 | 간단한 작업, 일반적 질문 |\n| Few-Shot | 예시를 먼저 보여주고 요청 | 분류, 평가, 특정 형식 필요 시 |\n| Chain-of-Thought | 단계별로 사고하도록 유도 | 복잡한 분석, 전략 수립 |\n| 역할극/페르소나 | 특정 전문가 관점 부여 | 다각도 분석, 전문성 필요 시 |\n| 출력 형식 제어 | 표, 목록, MECE 등 형식 지정 | 모든 상황에서 활용 |\n| 프롬프트 체이닝 | 여러 단계로 나누어 요청 | 복잡한 프로젝트, 문서 작성 |\n| 네거티브 프롬프트 | \"~하지 마\"로 제한 | 불필요한 내용 제거 |"},{"id":"t7-09","ty":"order","lv":2,"game":false,"p":"실습 8 회의록 프롬프트가 요청한 회의록 형식의 순서를 맞추세요.","steps":["기본정보","안건별 논의내용","결정사항","액션아이템(담당자+마감일) 표"],"h":"실습 8의 회의록 정리 프롬프트는 [P]에 형식을 화살표로 지정합니다. 기본정보로 시작해 안건별 논의내용, 결정사항을 차례로 쓰고, 마지막에 담당자와 마감일이 들어간 액션아이템 표로 끝냅니다.","w":"회의록은 기본정보 → 안건별 논의 → 결정사항 → 액션아이템 표 순서입니다.","an":"실습 8 · A. 프롬프트 2","src":"**프롬프트 2: 회의록 정리**\n```\n[C] 오늘 팀 회의(10:00~11:00) 내용을 정리해야 함\n[R] 전문 회의록 작성 비서\n[I] 아래 메모를 정식 회의록으로 정리해줘.\n\n[회의 메모 - 여기에 본인의 실제 회의 메모를 붙여넣으세요]\n예시:\n- 예산 건: 하반기 예산 5% 삭감 확정, 각 팀 자체 조정\n- 인사 건: 신규 직원 2명 다음주 입사, 멘토 배정 필요\n- IT 건: 사내 시스템 업데이트 4/1, 당일 18~22시 점검\n\n[P] 형식: 기본정보 → 안건별 논의내용 → 결정사항 → 액션아이템(담당자+마감일) 표\n```"},{"id":"t7-10","ty":"multi","lv":2,"game":true,"p":"네거티브 프롬프트 모음에 있는 상황을 <b>모두<\/b> 고르세요.","o":["서론이 너무 길 때","너무 전문적일 때","리스트만 나올 때","너무 길 때","답이 너무 빠를 때"],"a":[0,1,2,3],"h":"네거티브 프롬프트 모음 표에는 서론이 길 때, 너무 전문적일 때, 너무 일반적일 때, 리스트만 나올 때, 너무 길 때, 불필요한 내용이 있을 때의 여섯 상황이 있습니다. 표에 실제로 있는 상황만 고르세요.","w":"모음에는 서론이 길 때, 너무 전문적일 때, 너무 일반적일 때, 리스트만 나올 때, 너무 길 때, 불필요한 내용이 있을 때가 있습니다.","an":"실습 9 · 네거티브 프롬프트 모음","src":"**유용한 네거티브 프롬프트 모음:**\n\n| 상황 | 네거티브 프롬프트 |\n|------|----------------|\n| 서론이 너무 길 때 | \"인사말과 서론 없이 바로 본론부터 시작해\" |\n| 너무 전문적일 때 | \"전문 용어를 사용하지 말고 쉽게 설명해\" |\n| 너무 일반적일 때 | \"일반적인 조언 말고 구체적인 수치와 예시만 제시해\" |\n| 리스트만 나올 때 | \"불릿 포인트 대신 자연스러운 문장형으로 작성해\" |\n| 너무 길 때 | \"500자를 절대 넘지 마\" |\n| 불필요한 내용이 있을 때 | \"법적 면책 조항이나 부연 설명은 넣지 마\" |"}]}]};

/* 순위 저장소 — 공유 순위로 바꿀 때 이 객체만 교체 */
// 순위는 같은 조건(게임 모드 + 풀이 시간)끼리만 비교한다. key = 'timeattack:10'
const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}

async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('📋 클립보드에 복사했습니다');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'📋 클립보드에 복사했습니다':'복사하지 못했습니다. 인쇄 기능을 이용하세요.');
}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

/* ── 오답노트 ──────────────────────────── */
function addWrong(id,ans){const w=S.wrong[id]||{n:0};w.n++;w.last=ans;w.at=Date.now();w.solved=false;S.wrong[id]=w;}
function markSolved(id){if(S.wrong[id]&&!S.wrong[id].solved){S.wrong[id].solved=true;S.wrong[id].at=Date.now();}}
const wrongList=solved=>Object.keys(S.wrong).filter(id=>QMAP[id]&&!!S.wrong[id].solved===solved)
  .sort((a,b)=>QTAB[a].idx-QTAB[b].idx||ALLQ.indexOf(QMAP[a])-ALLQ.indexOf(QMAP[b]));

/* ── 문항 풀이 상태(학습·재도전 공용) ───── */
let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

function cardHTML(q,n){
  const [label,color]=TYPES[q.ty];
  const g=cur.graded, a=cur.ans[q.id], fa=finalAns(q), ok=g&&isCorrect(q,fa);
  const lock=g?' disabled':'';
  let body='';
  if(q.ty==='mc'||q.ty==='multi'){
    const multi=q.ty==='multi', mine=multi?(a||[]):[a];
    body='<div class="opts">'+q.o.map((o,i)=>{
      const right=multi?q.a.includes(i):q.a===i, picked=mine.includes(i);
      const cls=g?(right?' ans':picked?' miss':''):'';
      return `<label class="opt${cls}"><span class="onum">${i+1}</span><input type="${multi?'checkbox':'radio'}" name="r-${q.id}" data-act="${multi?'tick':'pick'}" data-q="${q.id}" data-i="${i}"${picked?' checked':''}${lock}><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(q.ty==='ox'){
    body='<div class="ox">'+[true,false].map(v=>{
      const cls=g?(q.a===v?' ans':a===v?' miss':''):'';
      return `<button type="button" class="${cls.trim()}" data-act="ox" data-q="${q.id}" data-v="${v?1:0}" data-fk="${q.id}-ox${v?1:0}" aria-pressed="${a===v}" aria-label="${v?'맞다 O':'틀리다 X'}"${lock}>${v?'O':'X'}</button>`;
    }).join('')+'</div>';
  }else if(q.ty==='match'){
    const m=a||{}, sel=cur.msel[q.id], linkedBy={};
    Object.entries(m).forEach(([l,r])=>linkedBy[r]=+l);
    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${PAL[i%PAL.length]})" data-act="ml" data-q="${q.id}" data-i="${i}" data-fk="${q.id}-l${i}"${lock}><span class="tag">${LETTER[i]}</span>${esc(p[0])}</button>`;
    }).join('');
    const right=cur.shuf[q.id].map(j=>{
      const by=linkedBy[j], linked=by!=null, cls=(linked?' linked':'')+(g&&linked?(by===j?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${linked?PAL[by%PAL.length]:'--line'})" data-act="mr" data-q="${q.id}" data-j="${j}" data-fk="${q.id}-r${j}"${lock}><span class="tag">${linked?LETTER[by]:''}</span>${esc(q.pairs[j][1])}</button>`;
    }).join('');
    body=`<div class="match"><div class="mcol mleft">${left}</div><div class="mcol mright">${right}</div></div>`;
  }else if(q.ty==='order'){
    const seq=a||[], full=seq.length===q.steps.length;
    body='<div class="olist">'+(cur.shuf[q.id]||range(q.steps.length)).map(si=>{
      const pos=seq.indexOf(si), on=pos>=0;
      const cls=(on?' on':'')+(g?(pos===si?' ok':' no'):'');
      const fix=g&&pos!==si?`<span class="ofix">정답 ${si+1}</span>`:'';
      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }
  const numAns=q.ty==='mc'?`${q.a+1}번 · `:q.ty==='multi'?q.a.map(i=>i+1).join('·')+'번 · ':'';
  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${mediaHTML(q)}${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>${voiceRow(q,q.id)}`}${body}${exp}</article>`;
}
const LV_NAME=['쉬움','보통','어려움'];
function lvHTML(lv){
  lv=lv||1;
  const dots=[1,2,3].map(k=>k<=lv?`<i class="d${k}">●</i>`:'<i class="off">○</i>').join('');
  return `<span class="lv lv${lv}" title="난이도 ${LV_NAME[lv-1]}"><span class="dots" aria-hidden="true">${dots}</span><em>${LV_NAME[lv-1]}</em></span>`;
}
// 자료 발췌: 이스케이프 후 마크다운 기호만 가볍게 서식으로 (**굵게**, `코드`, 머리 #)
const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
function hintHTML(q){
  if(!q.h)return '';
  const open=cur.hints.has(q.id), label=q.ty==='num'?'Hint · 계산식':'Hint';
  // 2단계: ① 자세한 힌트(h) ② 자료 보기 — 자료 원문 발췌(src) + 위치(an)
  const sopen=cur.srcs.has(q.id);
  const src=q.src?`<div class="srcwrap"><button type="button" class="srcbtn" data-act="src" data-q="${q.id}" data-fk="${q.id}-src" aria-expanded="${sopen}" aria-controls="src-${q.id}">`+
    `<span class="caret" aria-hidden="true">${sopen?'▾':'▸'}</span>📖 자료 보기</button>`+
    (sopen?`<blockquote class="src" id="src-${q.id}"><p>${srcText(q.src)}</p>${q.an?`<cite>${esc(q.an)}</cite>`:''}</blockquote>`:'')+`</div>`:'';
  return `<div class="hintwrap"><button type="button" class="hintbtn" data-act="hint" data-q="${q.id}" data-fk="${q.id}-hint" aria-expanded="${open}" aria-controls="hint-${q.id}">`+
    `<span class="caret" aria-hidden="true">${open?'▾':'▸'}</span>${label}</button>`+
    (open?`<div class="hint" id="hint-${q.id}">${q.h}${src}</div>`:'')+`</div>`;
}
function refreshCard(q){
  const el=document.getElementById('card-'+q.id);if(!el)return;
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  el.outerHTML=cardHTML(q,el.dataset.n);
  if(fk){const f=app.querySelector(`[data-fk="${fk}"]`);if(f&&!f.disabled)f.focus();}
  updateProgress();
}
const pad2=n=>String(n).padStart(2,'0');
const fmtCnt=(n,t)=>`(${pad2(n)}/${pad2(t)})`;
// 탭별 푼 문항 수: 지금 보는 탭 → 화면 상태, 그 외 → 풀던 답(drafts) → 채점 기록
function tabAnswered(t){
  const src=cur&&cur.mode==='study'&&cur.tab===t?cur.ans:(S.drafts[t.id]||(S.tabs[t.id]&&S.tabs[t.id].answers)||{});
  return t.qs.filter(q=>isAnswered(q,src[q.id])).length;
}
function setTopScore(html){
  const el=document.getElementById('topScore');if(!el)return;
  el.hidden=!html;el.innerHTML=html||'';
}
function topScoreSheet(){
  if(!cur||!cur.graded){setTopScore('');return;}
  const n=cur.list.length, s=cur.list.filter(q=>isCorrect(q,finalAns(q))).length;
  let h=`🏁 ${cur.mode==='study'?'이 탭':'오답 풀이'} ${s}/${n}점 <small>${pct(s,n)}%</small>`;
  if(cur.mode==='study'&&allGraded()){const st=summaryStats();h+=` <small>· 종합 ${st.score}/${st.total}</small>`;}
  setTopScore(h);
}
function updateProgress(){
  const p=document.getElementById('pbar');if(!p||!cur)return;
  const n=cur.list.filter(answered).length, cnt=fmtCnt(n,cur.list.length);
  p.style.width=pct(n,cur.list.length)+'%';
  document.getElementById('ptxt').textContent=`${n} / ${cur.list.length} 응답`;
  const g=document.getElementById('gradeCnt');if(g)g.textContent=cnt;
  if(cur.mode==='study'){
    const c=document.getElementById('qc-'+cur.tab.id);if(c)c.textContent=cnt;
    if(!cur.graded){  // 풀던 답 저장 → 탭을 옮겨도 유지
      if(n||Object.keys(cur.ans).some(k=>{const v=cur.ans[k];return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:v!=null&&v!=='';}))
        S.drafts[cur.tab.id]=JSON.parse(JSON.stringify(cur.ans));
      else delete S.drafts[cur.tab.id];
      save();
    }
  }
}

/* ── 음성 선택 · 문제 읽기 · 그림/오디오 (qb-voice.js가 없으면 모두 숨김) ── */
const hasVoice=()=>!!(window.QBVoice&&QBVoice.supported());
const hasRead=()=>!!(window.QBVoice&&QBVoice.canSpeak());
const IC_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const IC_VOL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const VC=new Map();  // 학습 모드 문항별 음성 컨트롤러
function voiceReset(){VC.clear();if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}}
function voiceRow(q,fkp){
  const mic=hasVoice()&&['mc','multi','ox'].includes(q.ty), rd=hasRead();
  if(!mic&&!rd)return '';
  const qa=fkp?` data-q="${q.id}"`:'';
  return `<div class="vrow noprint">`+
    (mic?`<button type="button" class="vbtn vmic" data-act="vmic"${qa} data-fk="${fkp}-vmic" data-state="idle" aria-pressed="false">${IC_MIC}<span>말하기</span></button>`:'')+
    (rd?`<button type="button" class="vbtn" data-act="vread"${qa} data-fk="${fkp}-vread">${IC_VOL}<span>문제 읽기</span></button>`:'')+
    (mic?`<span class="vstat" aria-live="polite"></span><span class="vhint">말하기 어려우면 눌러서 고르세요</span>`:'')+`</div>`;
}
function mediaHTML(q){
  let h='';
  if(q.img&&q.img.src)h+=`<figure class="qfig"><img src="${esc(q.img.src)}" alt="${esc(q.img.alt)}" loading="lazy">${q.img.caption?`<figcaption>${esc(q.img.caption)}</figcaption>`:''}</figure>`;
  if(q.audio&&q.audio.src)h+=`<div class="qaud"><audio controls preload="none" src="${esc(q.audio.src)}"></audio><details><summary>대본</summary><p>${esc(q.audio.transcript)}</p></details></div>`;
  return h;
}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
// 읽어 줄 글: 문제 + 화면에 보이는 순서의 보기("1번 …")
function readText(q,n,order){
  let t=(n?`${n}번 문제. `:'')+plain(q.p)+'.';
  if(q.img&&q.img.alt)t+=' 그림 설명. '+q.img.alt+'.';
  if(q.ty==='ox')t+=' 맞으면 O, 틀리면 X.';
  else if(q.ty==='mc'||q.ty==='multi')t+=(order||range(q.o.length)).map((oi,k)=>` ${k+1}번. ${plain(q.o[oi])}.`).join('');
  return t;
}
function readAloud(text){if(QBVoice.isSpeaking())QBVoice.cancelSpeak();else QBVoice.speak(text);}
// 음성으로 고른 것 = 보기를 직접 누른 것과 같은 경로(입력 click → 기존 change/click 처리)
function voicePick(q,r){
  if(!cur||cur.graded)return;
  const card=document.getElementById('card-'+q.id);if(!card)return;
  const el=r.kind==='ox'?card.querySelector(`[data-act="ox"][data-v="${r.v==='O'?1:0}"]`):card.querySelector(`input[data-i="${r.i}"]`);
  if(el&&!el.disabled)el.click();
}
function studyVoice(q){
  let c=VC.get(q.id);if(c)return c;
  const card=()=>document.getElementById('card-'+q.id);
  c=QBVoice.attach({bind:false,button:()=>card()&&card().querySelector('.vmic'),live:()=>card()&&card().querySelector('.vstat'),
    getOptions:()=>q.ty==='ox'?2:q.o.length,getType:()=>q.ty,select:r=>voicePick(q,r)});
  VC.set(q.id,c);return c;
}

/* 학습 화면 상호작용 */
function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;
  else if(el.dataset.act==='tick'){
    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);
  }
  cur.armed=false;updateProgress();
}
function onSheetInput(el){
  if(el.dataset.act==='num'&&!cur.graded){cur.ans[el.dataset.q]=el.value;cur.armed=false;updateProgress();}
}

function viewStudy(tid,fresh){
  const tab=TABS.find(t=>t.id===tid)||TABS[0];
  cur=newSheet('study',tab.qs,tab);
  const rec=S.tabs[tab.id], draft=S.drafts[tab.id];
  if(fresh){delete S.drafts[tab.id];save();}
  else if(draft){Object.assign(cur.ans,JSON.parse(JSON.stringify(draft)));}  // 풀던 중이면 이어서
  else if(rec&&rec.answers){
    Object.assign(cur.ans,JSON.parse(JSON.stringify(rec.answers)));
    (rec.touched||[]).forEach(id=>cur.touched.add(id));
    cur.graded=true;
  }
  renderSheet();
}

function sheetResultHTML(){
  const n=cur.list.length, score=cur.list.filter(q=>isCorrect(q,finalAns(q))).length, p=pct(score,n);
  const msg=p===100?'만점입니다! 🎉':p>=80?'잘했어요. 틀린 문항의 해설과 자료 위치를 확인하세요.':p>=60?'절반 이상 이해했어요. 오답노트로 다시 풀어 보세요.':'자료를 한 번 더 읽고 다시 풀어 보세요.';
  return `<div class="panel"><div class="score">${score}<small> / ${n} · ${p}%</small></div><p class="msg">${msg}</p>
    ${cur.mode==='study'&&gameUnlocked()?'<a class="btn" href="#game">⚡ 게임 모드 도전</a>':''}</div>`;
}
function gradeSheet(){
  const miss=cur.list.map((q,i)=>answered(q)?0:i+1).filter(Boolean);
  if(miss.length&&!cur.armed){
    cur.armed=true;
    document.getElementById('warn').textContent=`미응답 ${miss.length}문항 (Q${miss.join(', Q')}). 한 번 더 누르면 미응답은 오답으로 채점합니다.`;
    return;
  }
  const firstUnlock=!gameUnlocked();
  cur.graded=true;
  const snap={};let score=0;
  cur.list.forEach(q=>{
    const a=finalAns(q);
    if(a!=null)snap[q.id]=a;
    if(isCorrect(q,a)){score++;markSolved(q.id);}
    else addWrong(q.id,answerText(q,a));
  });
  if(cur.mode==='study'){
    S.tabs[cur.tab.id]={score,total:cur.list.length,answers:snap,touched:[...cur.touched],at:Date.now()};
    delete S.drafts[cur.tab.id];
  }
  save();
  renderSheet();
  window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
  say(`채점 결과 ${score}점, ${cur.list.length}문항 중`);
  if(cur.mode==='study'&&firstUnlock)setTimeout(()=>toast('⚡ 게임 모드와 해설지가 열렸습니다!'),300);
  else if(cur.mode==='study'&&allGraded())setTimeout(()=>toast('★ 모든 탭 완료! 종합 결과를 확인하세요.'),300);
}

function summaryStats(){
  let score=0,total=0;const byType={},byTab=[];
  TABS.forEach(t=>{const r=S.tabs[t.id];if(!r)return;let s=0;
    t.qs.forEach(q=>{const ok=isCorrect(q,r.answers?r.answers[q.id]:null);if(ok)s++;
      const b=byType[q.ty]||(byType[q.ty]=[0,0]);b[1]++;if(ok)b[0]++;});
    byTab.push([t,s,t.qs.length]);score+=s;total+=t.qs.length;});
  return {score,total,byType,byTab};
}

let G=null;
const gameSetup={mode:'timeattack',count:10,scope:'all',time:GAME_MODES.timeattack.defaultTime};
function gamePool(scope){
  const M=GAME_MODES[gameSetup.mode];
  const base=ALLQ.filter(q=>q.game&&!q.audio&&M.types.includes(q.ty));  // 오디오 문항은 제한시간 안에 들을 수 없어 제외
  if(scope==='played')return shuffle(base.filter(q=>S.tabs[QTAB[q.id].id]));
  if(scope==='wrong'){const w=new Set(wrongList(false));return shuffle(base.filter(q=>w.has(q.id))).concat(shuffle(base.filter(q=>!w.has(q.id))));}
  return shuffle(base);
}

      ${q.ty==='multi'?'<button class="btn primary" type="button" data-act="gsubmit">제출 (Enter)</button>':''}</div></div>
  </div>`;
  if(hasVoice())G.vc=QBVoice.attach({bind:false,button:()=>app.querySelector('.vmic'),live:()=>app.querySelector('.vstat'),
    getOptions:()=>G.view.length,getType:()=>q.ty,
    select:r=>gameAnswer(r.kind==='ox'?(r.v==='O'?0:1):r.i),submit:q.ty==='multi'?gameSubmit:null});  // 말하면 클릭과 같게 바로 선택(·제출)
  G.raf=requestAnimationFrame(tick);
}
function tick(now){
  if(!G||G.locked)return;
  G.elapsed+=now-G.last;G.last=now;
  const rem=Math.max(0,G.limit-G.elapsed), ratio=rem/G.limit;
  const shown=RM.matches?Math.ceil(rem/1000)*1000/G.limit:ratio;
  const bar=document.getElementById('tbar'), tm=document.getElementById('timer');
  if(bar){bar.style.width=(Math.min(1,shown)*100)+'%';tm.className='timer'+(ratio<.25?' lo':ratio<.5?' mid':'');
    document.getElementById('tleft').textContent=(rem/1000).toFixed(1)+'초';}
  if(!G.warned&&rem<=5000){G.warned=true;say('5초 남았습니다');}
  if(rem<=0){judge(null,true);return;}
  G.raf=requestAnimationFrame(tick);
}
function judge(ans,timeout){
  if(!G||G.locked)return;
  G.locked=true;cancelAnimationFrame(G.raf);
  const q=G.qs[G.i], used=Math.min(G.elapsed,G.limit), ok=!timeout&&isCorrect(q,ans);
  let gain=0;
  if(ok){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const mult=G.combo>=5?1.5:G.combo>=3?1.2:1;
    gain=Math.round((100+Math.floor((G.limit-used)/100))*mult);G.score+=gain;}
  else G.combo=0;
  G.results.push({id:q.id,ok,ans,timeout,ms:used,gain});
  // 판정 표시
  app.querySelectorAll('[data-act="gans"]').forEach(b=>{
    const k=+b.dataset.k, v=G.view[k];
    const right=q.ty==='ox'?q.a===v:q.ty==='mc'?q.a===v:q.a.includes(v);
    const picked=q.ty==='ox'||q.ty==='mc'?ans===v:(ans||[]).includes(v);
    if(right)b.classList.add('ans');else if(picked)b.classList.add('miss');
    b.disabled=true;
  });
  const f=document.getElementById('gfloat');
  f.className='gfloat pop '+(ok?'ok':'no');
  f.textContent=ok?`+${gain}${G.combo>=3?` 🔥×${G.combo>=5?'1.5':'1.2'}`:''}`:timeout?'⏰ 시간 초과':'✗ 오답';
  if(timeout){const tm=document.getElementById('timer');tm&&tm.classList.add('out');}
  const sb=app.querySelector('[data-act="gsubmit"]');if(sb)sb.disabled=true;
  app.querySelector('.pts').textContent=G.score.toLocaleString()+'점';
  const c=app.querySelector('.combo');c.textContent='🔥 콤보 '+G.combo;c.classList.toggle('hot',G.combo>=3);
  G.next=setTimeout(()=>{if(!G)return;G.i++;G.i<G.qs.length?renderGameQ():finishGame();},ok?900:1400);
}
function gameAnswer(k){
  if(!G||G.locked)return;
  const q=G.qs[G.i];if(k<0||k>=G.view.length)return;
  if(q.ty==='multi'){
    const v=G.view[k], i=G.pick.indexOf(v);
    i<0?G.pick.push(v):G.pick.splice(i,1);
    const b=app.querySelector(`[data-act="gans"][data-k="${k}"]`);b&&b.setAttribute('aria-pressed',i<0);
  }else judge(G.view[k],false);
}
function gameSubmit(){if(G&&!G.locked&&G.qs[G.i].ty==='multi')judge(G.pick.slice(),false);}
function stopGame(){if(G){cancelAnimationFrame(G.raf);clearTimeout(G.next);G=null;}}
function finishGame(){
  const R=G.results, correct=R.filter(r=>r.ok).length, M=GAME_MODES[G.mode];
  R.forEach(r=>{const q=QMAP[r.id];if(r.ok)markSolved(r.id);else addWrong(r.id,r.timeout?'(시간 초과)':answerText(q,r.ans));});
  const rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:(S.name||'').trim()||'익명',score:G.score,
    correct,total:R.length,rate:pct(correct,R.length),avg:Math.round(R.reduce((s,r)=>s+r.ms,0)/R.length/100)/10,combo:G.maxCombo,mode:G.mode,time:G.time,at:Date.now()};
  const rank=Leaderboard.add(rec);
  save();
  const board=Leaderboard.load(boardKey(rec)), top=board.slice(0,10), mine=board.find(r=>r.id===rec.id);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;
  const row=(r,i)=>`<tr class="${r.id===rec.id?'me':''}"><td>${medal(i)}</td><td>${esc(r.name)}</td><td class="r">${r.score.toLocaleString()}</td><td class="r">${r.rate}%</td><td class="r">${r.correct}/${r.total}</td><td class="r">${new Date(r.at).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}</td></tr>`;
  const wrong=R.filter(r=>!r.ok);
  G=null;
  setTopScore(`⚡ 게임 ${rec.score.toLocaleString()}점 <small>정답 ${correct}/${R.length}</small>`);
  app.innerHTML=`
  <div class="game">
    <div class="panel center">
      <p class="note-sm" style="margin:0">최종 점수</p>
      <div class="score xl">${rec.score.toLocaleString()}</div>
      <p class="msg">${M.title} · ${rec.time}초 — ${rank===1?'🏆 이 조건 최고 기록!':`이 조건 순위 ${rank}위`}</p>
      <div class="bignum"><div><b>${correct}/${rec.total}</b><span>정답</span></div><div><b>${rec.rate}%</b><span>정답률</span></div><div><b>${rec.avg}초</b><span>평균 응답</span></div><div><b>${rec.combo}</b><span>최고 콤보</span></div></div>
    </div>
    <div class="panel"><h2 class="ph">🏆 순위 · ${M.title.replace(/^\S+\s/,'')} ${rec.time}초 · 이 브라우저 기록</h2>
      <table class="board"><thead><tr><th>#</th><th>이름</th><th class="r">점수</th><th class="r">정답률</th><th class="r">정답</th><th class="r">날짜</th></tr></thead>
      <tbody>${top.map(row).join('')}${rank>10&&mine?row(mine,rank-1):''}</tbody></table></div>
    ${wrong.length?`<details class="more panel"><summary>틀린 문항 ${wrong.length}개 · 해설 보기 (오답노트에 저장됨)</summary>
      ${wrong.map(r=>{const q=QMAP[r.id];return `<div class="keyitem"><div class="kq">${q.p}</div><p class="mine" style="margin:4px 0">내 답: ${esc(r.timeout?'(시간 초과)':answerText(q,r.ans))}</p><p class="ka">정답: ${esc(correctText(q))}</p><p class="kw">${q.w}</p><span class="an">📖 ${esc(q.an)}</span></div>`;}).join('')}</details>`:''}
    <div class="actions"><button class="btn primary" type="button" data-act="gagain">↻ 다시 하기</button><a class="btn" href="#notes">📒 오답노트</a><a class="btn" href="#home">홈</a></div>
  </div>`;
}

/* ── 라우터 · 이벤트 ───────────────────── */
function route(){
  stopGame();voiceReset();cur=null;app.classList.remove('sheet');setTopScore('');
  const [v,arg]=(location.hash.slice(1)||'home').split('/');
  ({study:()=>viewStudy(arg),notes:viewNotes,retry:viewRetry,key:viewKey,game:()=>arg?viewGameSetup(arg):viewGamePick(),summary:viewSummary}[v]||viewHome)();
  window.scrollTo(0,0);
}
let resetArmed=false;
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act;
  if(cur&&['ox','ml','mr','ord','hint','src'].includes(act))return onSheetClick(el);
  switch(act){
    case 'grade':gradeSheet();break;
    case 'retab':viewStudy(cur.tab.id,true);window.scrollTo(0,0);break;  // 이전 점수는 다시 채점할 때까지 유지
    case 'onlywrong':cur.onlyWrong=!cur.onlyWrong;document.getElementById('cards').classList.toggle('onlywrong',cur.onlyWrong);el.textContent=cur.onlyWrong?'전체 보기':'오답만 보기';break;
    case 'copyreport':copy(reportMD());break;
    case 'copynotes':copy(`# ${BANK.title}\n\n- 이름: ${S.name||'-'} · ${today()}\n\n`+notesMD(false));break;
    case 'clearsolved':wrongList(true).forEach(id=>delete S.wrong[id]);save();viewNotes();break;
    case 'print':window.print();break;
    case 'reset':
      if(!resetArmed){resetArmed=true;el.textContent='정말 지울까요? 한 번 더 누르세요';setTimeout(()=>{resetArmed=false;if(el.isConnected)el.textContent='이 문제은행 기록 모두 지우기';},4000);break;}
      resetArmed=false;const nm=S.name;S=blank();S.name=nm;save();toast('기록을 지웠습니다');viewHome();break;
    case 'gset':gameSetup[el.dataset.g]=['count','time'].includes(el.dataset.g)?+el.dataset.v:el.dataset.v;viewGameSetup();break;
    case 'gstart':startGame();break;
    case 'gans':gameAnswer(+el.dataset.k);break;
    case 'vmic':{const q=G?null:QMAP[el.dataset.q];const c=G?G.vc:(q&&cur?studyVoice(q):null);if(c)c.toggle();break;}
    case 'vread':{
      if(G){const q=G.qs[G.i];readAloud(readText(q,0,q.ty==='ox'?null:G.view));break;}
      const q=QMAP[el.dataset.q], card=document.getElementById('card-'+el.dataset.q);
      if(q)readAloud(readText(q,card?card.dataset.n:0));break;}
    case 'gsubmit':gameSubmit();break;
    case 'gquit':stopGame();viewGameSetup(gameSetup.mode);break;
    case 'gagain':startGame();break;
  }
});
app.addEventListener('change',e=>{const el=e.target;if(cur&&el.dataset&&(el.dataset.act==='pick'||el.dataset.act==='tick'))onSheetChange(el);});
app.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.act==='name'){S.name=el.value;save();}
  else if(cur)onSheetInput(el);
});
document.addEventListener('keydown',e=>{
  if(!G||G.locked||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.target.matches&&e.target.matches('input,textarea'))return;
  const q=G.qs[G.i], k=e.key.toLowerCase();
  if(q.ty==='ox'){if(k==='o'||k==='1'){e.preventDefault();gameAnswer(0);}else if(k==='x'||k==='2'){e.preventDefault();gameAnswer(1);}return;}
  if(/^[1-9]$/.test(k)){e.preventDefault();gameAnswer(+k-1);}
  else if(k==='enter'&&q.ty==='multi'&&!(e.target.closest&&e.target.closest('.vrow'))){e.preventDefault();gameSubmit();}
});
window.addEventListener('pagehide',()=>{if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}});
document.addEventListener('visibilitychange',()=>{if(G&&!document.hidden)G.last=performance.now();});
// 탭 바 좌우 화살표
app.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('.tabchip');if(!t||(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'))return;
  const n=e.key==='ArrowRight'?t.nextElementSibling:t.previousElementSibling;if(n){e.preventDefault();n.focus();}
});
/* 테마 */
let theme=null;try{theme=localStorage.getItem('qb:theme');}catch(e){}
const applyTheme=()=>{if(theme)document.documentElement.dataset.theme=theme;else delete document.documentElement.dataset.theme;};
applyTheme();
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  theme=dark?'light':'dark';try{localStorage.setItem('qb:theme',theme);}catch(e){}applyTheme();
});
document.title=BANK.title+' · 문제은행';
window.addEventListener('hashchange',route);
route();
})();
</script>
