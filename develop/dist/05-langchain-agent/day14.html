<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LangChain 14일차 · LangGraph 메일 에이전트 · LCEL 메일 분석기 · RAG 리뷰 루프 · 문제은행</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Quiz Bank 디자인 토큰 v3 (3층: Primitive → Semantic → Component)
   다크 팔레트: day07 워크시트(#0b1220 남색 + 앰버·틸 포인트) / 라이트: 같은 구조의 중립 팔레트
   포인트색은 teal 하나(--color-brand). amber는 제목(다크)·경고·하이라이트 보조.
   v2 이름(--bg, --ink 등)은 파일 끝 Alias 블록이 시맨틱으로 연결한다.
   build.py가 이 파일을 엔진 <style> 맨 앞에 그대로 넣는다. */
:root{
  /* ── 1층 Primitive: 원시 값 ── */
  --white:#FFFFFF;--ink-900:#141A26;
  --slate-50:#F5F6F8;--slate-100:#F0F2F5;--slate-200:#E2E6EC;--slate-250:#D5DAE2;--slate-300:#CDD3DC;
  --slate-400:#8A93A4;--slate-500:#64748B;--slate-600:#5A6375;
  --navy-950:#0A0F1C;--navy-900:#0B1220;--navy-850:#0E1628;--navy-800:#111A2E;--navy-700:#16203A;--navy-650:#172239;
  --navy-600:#1F2B45;--navy-500:#2A3A5C;
  --ice-200:#DBE4F0;--steel-400:#8A9BB8;--steel-500:#5E6F8E;
  --teal-900:#123D33;--teal-700:#0B6F66;--teal-600:#0E8C80;--teal-400:#2DD4BF;
  --amber-900:#3A2A0C;--amber-700:#B45309;--amber-650:#D97706;--amber-600:#B7791F;--amber-400:#F5B942;--amber-100:#FEF3C7;
  --gold-600:#B7891F;
  --green-700:#15803D;--green-600:#16A34A;--green-400:#4ADE80;
  --red-650:#DC2626;--red-600:#D23B32;--red-400:#F87171;
  --yellow-500:#EAB308;--yellow-400:#FACC15;
  --violet-600:#7C3AED;--violet-400:#C084FC;
  --pink-700:#C2417A;--pink-400:#F472B6;
  --blue-600:#2563EB;--blue-400:#60A5FA;
  /* 과목 색: 흰 배경·남색 배경 모두 3:1 이상(아이콘·스트라이프용), 테마 공통 */
  --subject-it:#4F7FC0;--subject-korean:#B05A5A;--subject-english:#3F8F6E;
  --subject-science:#8A62B8;--subject-music:#B0762A;--subject-art:#C0508A;

  /* ── 2층 Semantic 고정부 ── */
  --font-sans:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","D2Coding",Consolas,"SF Mono",monospace;
  --fs-base:15px;--lh:1.55;
  --fs-h1:24px;--fs-h2:17px;--fs-q:15px;--fs-opt:14px;--fs-btn:13px;--fs-btn-pri:14px;
  --fs-sm:13px;--fs-xs:12px;--fs-2xs:11px;--fs-ox:22px;
  --radius-sm:6px;--radius-control:8px;--radius-card:10px;--radius-lg:12px;--maxw:880px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;
  --ease:cubic-bezier(.2,0,0,1);--dur-fast:120ms;--dur:200ms;

  /* ── 라이트 시맨틱 + 컴포넌트 ── */
  --color-background:var(--slate-50);--color-surface:var(--white);--color-surface-raised:var(--white);--color-surface-muted:var(--slate-100);--color-field:var(--white);
  --color-text:var(--ink-900);--color-text-muted:var(--slate-600);--color-text-faint:var(--slate-400);
  --color-border:var(--slate-200);--color-border-strong:var(--slate-300);
  --color-heading:var(--ink-900);--legacy-title:var(--ink-900);--color-brand:var(--teal-600);--color-brand-text:var(--teal-700);--color-on-brand:var(--white);
  --color-accent:var(--amber-600);--color-success:var(--green-700);--color-warning:var(--amber-700);--color-danger:var(--red-600);
  --color-highlight:var(--amber-100);--color-focus:var(--teal-600);
  --button-bg:var(--white);--button-border:var(--slate-250);--button-text:var(--ink-900);
  --button-primary-bg:var(--ink-900);--button-primary-border:var(--ink-900);--button-primary-text:var(--white);
  --combo:var(--violet-600);--gold:var(--gold-600);
  --ty-mc:var(--teal-600);--ty-multi:var(--violet-600);--ty-ox:var(--slate-500);--ty-match:var(--pink-700);--ty-order:var(--amber-600);--ty-num:var(--blue-600);
  --timer-hi:var(--green-600);--timer-mid:var(--amber-650);--timer-lo:var(--red-650);
  --lv1:var(--green-600);--lv2:var(--yellow-500);--lv3:var(--red-650);
  --shadow:0 1px 2px rgb(16 24 40 / .04);
  color-scheme:light;

  /* ── Alias (v2 이름 → 시맨틱). 엔진 페이지 호환용. 새 코드는 --color-* 사용 ── */
  --font:var(--font-sans);--mono:var(--font-mono);
  --r-sm:var(--radius-sm);--r:var(--radius-control);--r-md:var(--radius-card);--r-lg:var(--radius-lg);
  --bg:var(--color-background);--panel:var(--color-surface);--raised:var(--color-surface-raised);--field:var(--color-field);
  --soft:var(--color-surface-muted);
  --ink:var(--color-text);--muted:var(--color-text-muted);--faint:var(--color-text-faint);
  --line:var(--color-border);--line-2:var(--color-border-strong);
  --title:var(--legacy-title);--link:var(--color-brand);--accent:var(--color-accent);
  --ok:var(--color-success);--bad:var(--color-danger);
  --btn-bg:var(--button-bg);--btn-line:var(--button-border);
  --pri-bg:var(--button-primary-bg);--pri-line:var(--button-primary-border);--pri-ink:var(--button-primary-text);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --color-background:var(--navy-900);--color-surface:var(--navy-800);--color-surface-raised:var(--navy-850);--color-surface-muted:var(--navy-700);--color-field:var(--navy-950);
  --color-text:var(--ice-200);--color-text-muted:var(--steel-400);--color-text-faint:var(--steel-500);
  --color-border:var(--navy-600);--color-border-strong:var(--navy-500);
  --color-heading:var(--color-text);--legacy-title:var(--amber-400);--color-brand:var(--teal-400);--color-brand-text:var(--teal-400);--color-on-brand:var(--navy-900);
  --color-accent:var(--amber-400);--color-success:var(--green-400);--color-warning:var(--amber-400);--color-danger:var(--red-400);
  --color-highlight:var(--amber-900);--color-focus:var(--teal-400);
  --button-bg:var(--navy-650);--button-border:var(--navy-500);--button-text:var(--ice-200);
  --button-primary-bg:var(--teal-900);--button-primary-border:var(--teal-400);--button-primary-text:var(--teal-400);
  --combo:var(--violet-400);--gold:var(--amber-400);
  --ty-mc:var(--teal-400);--ty-multi:var(--violet-400);--ty-ox:var(--steel-400);--ty-match:var(--pink-400);--ty-order:var(--amber-400);--ty-num:var(--blue-400);
  --timer-hi:var(--green-400);--timer-mid:var(--amber-400);--timer-lo:var(--red-400);
  --lv1:var(--green-400);--lv2:var(--yellow-400);--lv3:var(--red-400);
  --shadow:none;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --color-background:var(--navy-900);--color-surface:var(--navy-800);--color-surface-raised:var(--navy-850);--color-surface-muted:var(--navy-700);--color-field:var(--navy-950);
  --color-text:var(--ice-200);--color-text-muted:var(--steel-400);--color-text-faint:var(--steel-500);
  --color-border:var(--navy-600);--color-border-strong:var(--navy-500);
  --color-heading:var(--color-text);--legacy-title:var(--amber-400);--color-brand:var(--teal-400);--color-brand-text:var(--teal-400);--color-on-brand:var(--navy-900);
  --color-accent:var(--amber-400);--color-success:var(--green-400);--color-warning:var(--amber-400);--color-danger:var(--red-400);
  --color-highlight:var(--amber-900);--color-focus:var(--teal-400);
  --button-bg:var(--navy-650);--button-border:var(--navy-500);--button-text:var(--ice-200);
  --button-primary-bg:var(--teal-900);--button-primary-border:var(--teal-400);--button-primary-text:var(--teal-400);
  --combo:var(--violet-400);--gold:var(--amber-400);
  --ty-mc:var(--teal-400);--ty-multi:var(--violet-400);--ty-ox:var(--steel-400);--ty-match:var(--pink-400);--ty-order:var(--amber-400);--ty-num:var(--blue-400);
  --timer-hi:var(--green-400);--timer-mid:var(--amber-400);--timer-lo:var(--red-400);
  --lv1:var(--green-400);--lv2:var(--yellow-400);--lv3:var(--red-400);
  --shadow:none;
  color-scheme:dark;}
@media (max-width:560px){:root{--fs-base:14.5px;--fs-h1:20px;--fs-h2:16px;--fs-q:14.5px;--fs-ox:20px}}

/* ── 기본 ───────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:110px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-base);line-height:var(--lh);
  -webkit-font-smoothing:antialiased;letter-spacing:-.003em;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
b,strong{font-weight:650}
code{font-family:var(--mono);font-size:.88em;color:var(--link);background:var(--soft);padding:1px 5px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px 56px}
.muted{color:var(--muted)}
/* 상단 바 */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:calc(52px + env(safe-area-inset-top,0px));margin:0 -20px 22px;padding:env(safe-area-inset-top,0px) 20px 0;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.brand{font-size:var(--fs-xs);color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;letter-spacing:.01em}
.brand b{color:var(--ink);font-weight:600}
.iconbtn{font:inherit;font-size:15px;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);width:32px;height:32px;border-radius:var(--r);cursor:pointer;flex:0 0 auto;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--muted)}
/* 제목 */
h1{font-size:var(--fs-h1);line-height:1.3;margin:0 0 6px;letter-spacing:-.02em;font-weight:700;color:var(--title)}
h2{font-size:var(--fs-h2);line-height:1.4;margin:0;font-weight:650;letter-spacing:-.01em}
.ph{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 10px;letter-spacing:0}
.sh{font-size:var(--fs-sm);color:var(--muted);font-weight:600;margin:16px 0 6px}
.sub{color:var(--muted);margin:0 0 4px}
.meta{font-size:var(--fs-xs);color:var(--faint);margin:0 0 18px;font-family:var(--mono);letter-spacing:-.01em}
.crumbs{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:var(--fs-sm);color:var(--faint)}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink)}
.part{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--link);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:1px 7px;white-space:nowrap;max-width:100%;font-weight:500;letter-spacing:0}
.tabhead .part,.ngroup .part{white-space:normal;overflow-wrap:anywhere}  /* 긴 자료 위치(예: voice-ai 교시 라벨)는 줄바꿈 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.center{text-align:center}
.note-sm{font-size:var(--fs-sm);color:var(--muted)}
.lbl{display:block;font-size:var(--fs-xs);color:var(--muted);margin-bottom:2px}
/* 버튼 */
.btn{font:inherit;font-size:var(--fs-btn);display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);
  padding:7px 12px;border-radius:var(--r);cursor:pointer;text-decoration:none;min-height:34px;line-height:1.3;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pri-bg);color:var(--pri-ink);border-color:var(--pri-line);font-weight:650;font-size:var(--fs-btn-pri);padding:8px 18px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.locked{opacity:.5}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--btn-line))}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn .cnt{font-family:var(--mono);font-size:var(--fs-2xs);background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;min-width:18px;line-height:16px;text-align:center}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
button:focus-visible,a:focus-visible,input:focus-visible,.opt:focus-within{outline:2px solid var(--link);outline-offset:2px}
/* 입력 */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;max-width:300px}
.field label{font-size:var(--fs-xs);color:var(--muted)}
.field input{font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--field);color:var(--ink)}
.field input::placeholder{color:var(--faint)}
/* 진행 바 */
.bar{flex:1;height:4px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--link);transition:width .25s}
.progress{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:8px 0;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.progress span,.homeprog span{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.homeprog{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
/* 홈 탭 카드 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:6px}
.tcard{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;text-decoration:none;color:var(--ink);transition:border-color .15s;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--line-2)}
.tcard .tn{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint)}
.tcard .tt{font-weight:600;font-size:15px;line-height:1.45}
.tcard .ts{margin-top:auto;padding-top:8px;font-size:var(--fs-xs);color:var(--faint);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono)}
.tcard.done .ts b{color:var(--ok);font-weight:600}
.tcard.perfect{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.lockmsg{font-size:var(--fs-xs);color:var(--faint);margin:-6px 0 16px}
/* 탭 바 */
/* 학습 탭 선택: 웹(≥1024) 자유 배치 · 태블릿(560~1023) 3개 · 모바일(<560) 2개 */
.tabbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
@media (max-width:1023px){.tabbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}}
.tabchip{min-width:0;display:flex;align-items:center;gap:6px;font-size:var(--fs-btn);padding:6px 10px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);text-decoration:none;color:var(--ink);line-height:1.35;word-break:keep-all}
.tabchip .tl{min-width:0}
.tabchip .qc{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--muted);white-space:nowrap;margin-left:auto}
.tabchip[aria-selected="true"] .qc{color:var(--link)}
.tabchip .sc{white-space:nowrap}
.btn .qc{font-family:var(--mono);font-weight:500;opacity:.85}
.tabchip b{font-family:var(--mono);font-weight:600;color:var(--faint)}
.tabchip:hover{border-color:var(--muted)}
.tabchip[aria-selected="true"]{border-color:var(--link);color:var(--link);background:color-mix(in srgb,var(--link) 9%,var(--btn-bg))}
.tabchip[aria-selected="true"] b{color:var(--link)}
.tabchip .sc{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--ok)}
.tabchip.sum{border-color:color-mix(in srgb,var(--gold) 60%,var(--btn-line));color:var(--gold)}
.tabhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 2px}
.tabhead h2{color:var(--title)}
/* 문항 카드 */
.q{background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:var(--r-md);padding:12px 14px;margin:0 0 10px;box-shadow:var(--shadow)}
.q.correct{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));border-left-color:var(--ok)}
.q.wrong{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));border-left-color:var(--bad)}
.qhead{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.qn{font-family:var(--mono);font-size:var(--fs-xs);color:var(--faint);font-weight:500}
.tbadge{font-size:var(--fs-2xs);font-weight:600;padding:0 7px;line-height:18px;border-radius:var(--r-sm);color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent);background:color-mix(in srgb,var(--tc) 8%,transparent);white-space:nowrap}
/* 난이도: 점 1 녹색 · 점 2 노랑 · 점 3 빨강 (쉬움 ●○○ / 보통 ●●○ / 어려움 ●●●) + 글자 */
.lv{display:inline-flex;align-items:center;gap:4px;line-height:1}
.lv .dots{font-size:10px;letter-spacing:1px}
.lv i{font-style:normal}
.lv .d1{color:var(--lv1)} .lv .d2{color:var(--lv2)} .lv .d3{color:var(--lv3)} .lv .off{color:var(--line-2)}
.lv em{font-style:normal;font-size:var(--fs-2xs);font-weight:600}
.lv1 em{color:var(--lv1)} .lv2 em{color:color-mix(in srgb,var(--lv2) 80%,var(--ink))} .lv3 em{color:var(--lv3)}
.verdict{margin-left:auto;font-weight:650;font-size:var(--fs-xs)}
.correct .verdict{color:var(--ok)} .wrong .verdict{color:var(--bad)}
.qsrc{margin-left:auto;font-size:var(--fs-2xs);color:var(--faint)}
.qt{font-size:var(--fs-q);font-weight:500;margin:4px 0 8px}
.guide{font-size:var(--fs-xs);color:var(--faint);margin:-4px 0 8px}
/* 음성 선택 · 문제 읽기 · 그림/오디오 */
.vrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px}
.vbtn{font:inherit;font-size:var(--fs-btn);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);border-radius:var(--r);padding:4px 10px;min-height:32px;cursor:pointer}
.vbtn:hover{border-color:var(--muted)}
.vbtn svg{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vbtn[data-state="listening"]{border-color:var(--link);color:var(--link);box-shadow:0 0 0 3px color-mix(in srgb,var(--link) 28%,transparent);animation:vpulse 1.2s ease-in-out infinite}
.vbtn[data-state="heard"]{border-color:var(--ok)}
.vbtn[data-state="error"]{border-color:var(--bad)}
@keyframes vpulse{50%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){.vbtn[data-state="listening"]{animation:none}}
.vstat{font-size:var(--fs-xs);color:var(--muted)}
.vstat:empty{display:none}
.vhint{font-size:var(--fs-xs);color:var(--faint)}
.qfig{margin:6px 0 10px}
.qfig img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.qfig figcaption{font-size:var(--fs-xs);color:var(--muted);margin-top:4px}
.qaud{margin:6px 0 10px}
.qaud audio{display:block;width:100%;max-width:420px}
.qaud details{font-size:var(--fs-sm);color:var(--muted);margin-top:4px}
.qaud summary{cursor:pointer}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--panel);font-size:var(--fs-opt);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--line-2)}
.opt input{margin:4px 0 0;accent-color:var(--link);flex:0 0 auto;width:14px;height:14px}
.opt:has(input:checked){border-color:var(--link);background:color-mix(in srgb,var(--link) 7%,var(--panel))}
.opt.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.opt.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--panel))}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:360px}
.ox button{font:inherit;font-size:var(--fs-ox);font-weight:700;padding:8px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);cursor:pointer;line-height:1.3}
.ox button:hover{border-color:var(--muted)}
.ox button[aria-pressed="true"]{border-color:var(--link);color:var(--link);background:color-mix(in srgb,var(--link) 10%,var(--btn-bg))}
.ox button.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--btn-bg));color:var(--ok)}
.ox button.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--btn-bg));color:var(--bad)}
/* 짝 맞추기 */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px 14px}
.mcol{display:flex;flex-direction:column;gap:6px}
.mitem{font:inherit;font-size:var(--fs-opt);text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);padding:7px 10px;cursor:pointer;min-height:38px;display:flex;align-items:center;gap:8px;line-height:1.45}
.mitem:hover{border-color:var(--line-2)}
.mitem .tag{flex:0 0 auto;width:20px;height:20px;border-radius:var(--r-sm);border:1px dashed var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);font-weight:600}
.mitem.linked{border-color:color-mix(in srgb,var(--pc) 70%,var(--line))}
.mitem.linked .tag{border:0;background:var(--pc);color:var(--bg)}
.mitem.sel{border-color:var(--link);box-shadow:0 0 0 3px color-mix(in srgb,var(--link) 18%,transparent)}
.mitem.okm{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.mitem.nom{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.mleft .mitem{font-weight:600}
/* 순서 */
.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.oitem{font:inherit;font-size:var(--fs-opt);text-align:left;width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);cursor:pointer;transition:border-color .12s,background .12s}
.oitem:hover{border-color:var(--line-2)}
.oitem .num{width:22px;height:22px;border-radius:50%;border:1px dashed var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);font-weight:600;color:var(--muted);flex:0 0 auto}
.oitem.on{border-color:var(--link);background:color-mix(in srgb,var(--link) 7%,var(--panel))}
.oitem.on .num{border:0;background:var(--link);color:var(--bg)}
.oitem .txt{flex:1;line-height:1.45}
.oitem .ofix{flex:0 0 auto;font-size:var(--fs-2xs);color:var(--ok);font-weight:600}
.oitem.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.oitem.ok .num{background:var(--ok)}
.oitem.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.oitem.no.on .num{background:var(--bad)}
.numrow{display:flex;align-items:center;gap:8px;font-size:var(--fs-opt)}
.numrow input{font-family:var(--mono);font-size:15px;width:120px;padding:6px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--field);color:var(--ink);text-align:right}
.numrow input.ans{border-color:var(--ok)} .numrow input.miss{border-color:var(--bad)}
.locked .mitem,.locked .ox button,.locked .opt{pointer-events:none}
.locked .oitem{pointer-events:none}
.opt .onum{flex:0 0 auto;min-width:18px;height:18px;padding:0 4px;border-radius:var(--r-sm);border:1px solid var(--line-2);display:inline-grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);color:var(--muted);margin-top:1px}
.opt:has(input:checked) .onum{border-color:var(--link);color:var(--link)}
.opt.ans .onum{border-color:var(--ok);color:var(--ok)} .opt.miss .onum{border-color:var(--bad);color:var(--bad)}
/* 힌트 토글 (빨간색 = Hint) */
.hintwrap{margin:-2px 0 8px}
.hintbtn{font:inherit;font-size:var(--fs-xs);font-weight:650;display:inline-flex;align-items:center;gap:4px;color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:var(--r-sm);padding:2px 9px;cursor:pointer;line-height:1.5}
.hintbtn:hover{background:color-mix(in srgb,var(--bad) 13%,transparent)}
.hintbtn .caret{font-size:.85em}
.srcwrap{margin-top:8px}
.srcbtn{font:inherit;font-size:var(--fs-xs);font-weight:600;display:inline-flex;align-items:center;gap:4px;color:var(--link);background:transparent;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:1px 8px;cursor:pointer;line-height:1.5}
.srcbtn:hover{border-color:var(--link)}
.src{margin:6px 0 0;padding:6px 10px;border-left:3px solid var(--link);background:var(--soft);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:var(--fs-xs);color:var(--muted)}
.src p{margin:0;white-space:pre-wrap;word-break:break-word}
.src cite{display:block;margin-top:4px;font-style:normal;font-size:var(--fs-2xs);color:var(--faint)}
.hint{margin-top:6px;padding:6px 10px;border-left:3px solid var(--bad);background:color-mix(in srgb,var(--bad) 6%,transparent);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:var(--fs-sm);color:var(--ink)}
/* 해설 */
.exp{margin-top:10px;padding:2px 0 2px 10px;border-left:3px solid var(--line-2);font-size:var(--fs-sm);color:var(--muted)}
.correct .exp{border-left-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.wrong .exp{border-left-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.exp p{margin:0 0 3px}
.exp b{color:var(--ink);font-weight:650;margin-right:4px}
.an{font-family:var(--mono);color:var(--link);font-size:var(--fs-xs);margin:4px 0 0}
.mine{color:var(--bad)}
.onlywrong .q.correct{display:none}
.warn{color:var(--bad);font-size:var(--fs-sm);min-height:1.3em;margin:4px 0 0}
/* 결과 */
.score{font-family:var(--mono);font-size:33px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--title);letter-spacing:-.02em}
.score small{font-family:var(--font);font-size:15px;color:var(--muted);font-weight:400;letter-spacing:0}
.score.xl{font-size:45px}
.msg{margin:6px 0 10px;color:var(--muted);font-size:var(--fs-sm)}
.bd{display:grid;gap:7px;margin:6px 0}
.bd div{display:grid;grid-template-columns:minmax(90px,190px) 1fr 44px;gap:10px;align-items:center;font-size:var(--fs-sm)}
.bd .b{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bd .b i{display:block;height:100%;background:var(--tc,var(--link));border-radius:99px}
.bd span:last-child{text-align:right;font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted)}
.rcode{font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:.06em;color:var(--accent);background:var(--soft);padding:2px 8px;border-radius:var(--r-sm)}
/* 오답노트 · 해설지 */
.ngroup{margin:18px 0 8px;font-size:15px;font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ngroup .ref{font-family:var(--mono);font-size:var(--fs-2xs);font-weight:400;color:var(--faint)}
.note{background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px}
.note.solved{border-left-color:var(--ok)}
.note .qt{margin:0 0 8px}
.note dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:var(--fs-sm)}
.note dt{color:var(--faint)}
.note dd{margin:0}
.note .foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:var(--fs-xs);color:var(--faint);font-family:var(--mono)}
.note .foot span:first-child{color:var(--link)}
details.more{margin-top:14px;font-size:var(--fs-sm)}
details.more summary{cursor:pointer;color:var(--muted);padding:4px 0}
.keyitem{padding:10px 0;border-bottom:1px solid var(--line)}
.keyitem .kq{font-weight:500;font-size:15px}
.keyitem .ka{margin:4px 0 2px;color:var(--ok);font-weight:600;font-size:var(--fs-sm)}
.keyitem .kw{font-size:var(--fs-sm);color:var(--muted);margin:0}
.keylock{padding:12px;border:1px dashed var(--line-2);border-radius:var(--r-md);color:var(--faint);text-align:center;margin:8px 0;font-size:var(--fs-sm)}
.printhead{display:none}
/* 게임 */
.game{max-width:620px;margin:0 auto}
.gpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;gap:4px;min-height:120px;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);color:var(--ink);text-decoration:none;transition:border-color .15s,background .15s}
a.gcard:hover{border-color:var(--link);background:color-mix(in srgb,var(--link) 6%,var(--panel))}
.gcard .gn{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint);letter-spacing:.05em}
.gcard b{font-size:16px}
.gcard .gd{font-size:var(--fs-xs);color:var(--muted);line-height:1.5}
.gcard.soon{border-style:dashed;opacity:.6;cursor:not-allowed}
@media (max-width:560px){.gpick{gap:6px}.gcard{min-height:84px;padding:10px 8px;align-items:center;text-align:center;justify-content:center}.gcard b{font-size:14px;word-break:keep-all}.gcard .gd{display:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.chip{font:inherit;font-size:var(--fs-btn);padding:6px 12px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);cursor:pointer;min-height:32px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--link);color:var(--link);background:color-mix(in srgb,var(--link) 9%,var(--btn-bg));font-weight:600}
.chip:disabled{opacity:.4;cursor:not-allowed}
.rules{font-size:var(--fs-xs);color:var(--muted);border-left:3px solid var(--line-2);padding:2px 0 2px 10px;margin:4px 0 16px}
.rules p{margin:0 0 2px}
.play{display:flex;flex-direction:column;min-height:calc(100dvh - 130px)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--fs-sm);color:var(--muted);margin-bottom:8px}
.hud .pts{font-size:19px;font-weight:600;color:var(--title)}
.combo{font-family:var(--font);font-size:var(--fs-xs);padding:2px 9px;border-radius:var(--r-sm);border:1px solid var(--line-2);color:var(--muted)}
.combo.hot{border-color:var(--combo);color:var(--combo);background:color-mix(in srgb,var(--combo) 12%,transparent)}
.timer{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.timer>div{height:100%;width:100%;background:var(--timer-hi);border-radius:99px}
.timer.mid>div{background:var(--timer-mid)}
.timer.lo>div{background:var(--timer-lo)}
.timer.out{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tleft{font-family:var(--mono);font-size:var(--fs-xs);color:var(--faint);text-align:right;font-variant-numeric:tabular-nums;margin:4px 0 12px;min-height:1.2em}
.gtype{font-size:var(--fs-2xs);color:var(--faint);margin-bottom:4px;letter-spacing:.02em}
.gq{font-size:19px;font-weight:600;line-height:1.5;margin:0 0 16px;letter-spacing:-.01em}
.gbottom{margin-top:4px}
.gopts{display:grid;gap:8px}
.gopt{font:inherit;font-size:var(--fs-opt);text-align:left;display:flex;gap:12px;align-items:center;padding:10px 14px;min-height:46px;border:1px solid var(--btn-line);border-radius:var(--r-md);background:var(--panel);color:var(--ink);cursor:pointer;transition:background .12s,border-color .12s;line-height:1.45}
.gopt:hover{border-color:var(--muted)}
.gopt kbd{flex:0 0 auto;width:22px;height:22px;border-radius:var(--r-sm);border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint)}
.gopt[aria-pressed="true"]{border-color:var(--link);background:color-mix(in srgb,var(--link) 9%,var(--panel))}
.gopt.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.gopt.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.gox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gox .gopt{justify-content:center;font-size:29px;font-weight:700;min-height:76px}
.gfloat{text-align:center;font-weight:650;font-size:17px;min-height:1.6em;margin-top:10px;font-family:var(--mono)}
.gfloat.ok{color:var(--ok)} .gfloat.no{color:var(--bad)}
.gfloat.pop{animation:pop .45s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.gsub{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.board{width:100%;border-collapse:collapse;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.board th,.board td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.board th{font-size:var(--fs-xs);color:var(--faint);font-weight:500}
.board .r{text-align:right;font-family:var(--mono)}
.board tr.me td{background:color-mix(in srgb,var(--combo) 12%,transparent);font-weight:600}
.bignum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 2px}
.bignum div{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:left}
.bignum b{display:block;font-family:var(--mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.bignum span{font-size:var(--fs-2xs);color:var(--faint)}
/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--panel);color:var(--ink);border:1px solid var(--line-2);
  padding:8px 14px;border-radius:var(--r);font-size:var(--fs-sm);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .18)}
.toast.show{opacity:1;transform:translateX(-50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* 문제풀이 페이지(학습·오답 재도전): 탭 제목(h2)을 뺀 모든 글자 10px — 사용자 지정 */
/* 문제풀이·오답노트·해설지 공통: 제목(h1·h2·탭 묶음 제목)을 뺀 글자 10px, 문제 11px, 자간 +0.03em, 행간 1.7 */
.sheet,.sheet :where(*:not(h1,h2,.ngroup,.ngroup *)){font-size:11px!important;letter-spacing:.03em!important}  /* :where = 명시도 0 → 아래 11px 규칙이 이김 */
.sheet :is(.qt,.opt,.exp,.exp p,.guide,.mitem,.oitem .txt,.hint,.warn,.msg,.sub,.note dt,.note dd,.note .foot,.kq,.ka,.kw,.keylock){line-height:1.7!important}
.sheet :is(.qt,.kq),.sheet :is(.qt,.kq) *{font-size:12px!important}  /* 문제 문장만 11px */
/* 한글이 섞인 숫자 요소는 mono 대신 본문 글꼴 + 고정폭 숫자 (mono 한글 자간이 벌어짐) */
.meta,.tcard .tn,.tcard .ts,.progress span,.homeprog span,.note .foot,.an,.hud,.tleft,.gfloat,.bignum b{font-family:var(--font);font-variant-numeric:tabular-nums;letter-spacing:0}
/* ── 반응형 ─────────────────────────────────────── */
@media (max-width:560px){
  .wrap{padding:0 16px 48px}
  .topbar{margin:0 -16px 18px;padding-left:16px;padding-right:16px}
  /* 홈 탭 카드: 모바일에서도 한 줄 3개 (사용자 지정) */
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .tcard{padding:8px 9px;gap:2px}
  .tcard .tn{font-size:11px}
  .tcard .tt{font-size:13px;line-height:1.35;word-break:keep-all}
  .tcard .ts{flex-direction:column;align-items:flex-start;gap:0;padding-top:6px;font-size:11px}
  .tabbar{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .tabchip{padding:6px 8px;gap:4px}
  .q{padding:12px}
  .match{grid-template-columns:1fr}
  .mright{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line-2)}
  .btn,.chip{min-height:40px}
  .actions .btn{flex:1 1 calc(50% - 8px)}
  .actions .btn.primary{flex-basis:100%}
  .ox{max-width:none}
  .ox button{min-height:48px}
  .oitem{min-height:40px}
  .bd div{grid-template-columns:96px 1fr 40px}
  .bignum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field{max-width:none}
  /* 게임: 보기를 엄지 영역(화면 아래)으로 */
  .play .gtop{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));background:var(--bg);padding:6px 0 0;z-index:4}
  .play .gbottom{margin-top:auto;padding-top:12px}
  .gq{font-size:18px}
  .gopt{min-height:50px}
  .board th:nth-child(6),.board td:nth-child(6){display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  :root{--bg:#fff;--panel:#fff;--raised:#fff;--ink:#000;--muted:#333;--faint:#555;--line:#bbb;--line-2:#999;--soft:#f1f1f1;--title:#000;--link:#055}
  body{background:#fff;color:#000;font-size:13.5px}
  .noprint,.topbar,.actions,.tabbar,.progress,.toast{display:none!important}
  .printhead{display:block;margin-bottom:12px;font-size:13px}
  .q,.note,.keyitem{break-inside:avoid;box-shadow:none}
}

    <button class="iconbtn" id="themeBtn" type="button" aria-label="라이트/다크 전환">🌓</button>

</div>

<script>/* QB 공용 코어 — 저장 키, mock 로그인, 테마, 과목 목록. 비밀번호는 저장하지 않는다. */
(function(){
'use strict';
var KEY_USER='qb:user', KEY_UI='qb:ui:v1', KEY_THEME='qb:theme';
function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function del(k){try{localStorage.removeItem(k);}catch(e){}}
function json(k,d){try{var r=get(k);return r?JSON.parse(r):d;}catch(e){return d;}}
var QB=window.QB={};
QB.SUBJECTS=[
  {id:'it',label:'IT'},{id:'korean',label:'국어'},{id:'english',label:'영어'},
  {id:'science',label:'과학'},{id:'music',label:'음악'},{id:'art',label:'미술'}
];
QB.user=function(){var u=json(KEY_USER,null);return u&&u.v===1&&u.name?u:null;};
QB.login=function(o){
  o=o||{};var prev=json(KEY_USER,null),now=new Date().toISOString();
  var u={v:1,name:String(o.name||'').trim().slice(0,20),email:String(o.email||'').trim(),
    provider:o.provider||'email',createdAt:(prev&&prev.createdAt)||now,lastLoginAt:now};
  set(KEY_USER,JSON.stringify(u));return u;
};
QB.logout=function(){del(KEY_USER);};
QB.rename=function(n){
  var u=QB.user();n=String(n||'').trim().slice(0,20);if(!u||!n)return null;
  u.name=n;set(KEY_USER,JSON.stringify(u));return u;
};
QB.safeNext=function(n){
  n=String(n||'');return /^dashboard\.html(#[A-Za-z0-9\/=&_-]*)?$/.test(n)?n:'dashboard.html';
};
QB.requireUser=function(next){
  var u=QB.user();if(u)return u;
  next=QB.safeNext(next==null?'dashboard.html'+location.hash:next);
  location.replace('login.html?next='+encodeURIComponent(next));return null;
};
QB.theme={
  get:function(){return get(KEY_THEME);},
  apply:function(){var t=get(KEY_THEME),r=document.documentElement;if(t)r.dataset.theme=t;else delete r.dataset.theme;},
  toggle:function(){
    var t=get(KEY_THEME),dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    set(KEY_THEME,dark?'light':'dark');QB.theme.apply();
  }
};
QB.ui={
  get:function(){var d=json(KEY_UI,null);return d&&typeof d==='object'?d:{sidebar:true,subject:'it'};},
  set:function(p){var d=Object.assign(QB.ui.get(),p||{});set(KEY_UI,JSON.stringify(d));return d;}
};
QB.theme.apply();
})();

<script>/* qb-voice.js — 음성으로 보기 번호 고르기(Web Speech API) + 문제 읽기(speechSynthesis)
   window.QBVoice: supported · canSpeak · parse · attach · speak · cancelSpeak · isSpeaking · stopListening
   parse()는 순수 함수라 node에서도 테스트한다. */
(function(root){
'use strict';

/* ── 말 → 선택 해석 (순수 함수) ───────────────── */
const SINO={일:1,이:2,삼:3,사:4,오:5,육:6,칠:7,팔:8,구:9,십:10};
const NAT={하나:1,둘:2,셋:3,넷:4,다섯:5,여섯:6,일곱:7,여덟:8,아홉:9,열:10};
const DET={한:1,두:2,세:3,네:4,첫:1};  // 한/두/세/네/첫 은 '번'·'번째'·'째'가 붙을 때만 번호
// 보기 글자 A~H. '이'(E)는 숫자 2와 겹쳐 숫자를 우선하므로 영문 e로만 받는다
const LET={a:1,b:2,c:3,d:4,e:5,f:6,g:7,h:8,에이:1,비:2,씨:3,디:4,에프:6,지:7,에이치:8};

const alt=o=>Object.keys(o).sort((x,y)=>y.length-x.length).join('|');
const PRE='(?:정답은|정답이|정답|답은|답이|답|내답은|제답은|저는|나는|전|선택|번호)?';
const SUF='(?:이에요|이요|예요|이야|이죠|이다|입니다|이라고생각해요|이라고|선택할게요?|선택|할게요?|할래요?|고를게요?|고를래요?|정답|같아요|요|으로|로|을|를|이|가|은|는)*';
const R_DIGIT=new RegExp('^'+PRE+'(\\d{1,2})(?:번째|번|째)?'+SUF+'$');
const R_STD=new RegExp('^'+PRE+'('+alt(Object.assign({},SINO,NAT))+')(?:번째|번|째)?'+SUF+'$');
const R_DET=new RegExp('^'+PRE+'('+alt(DET)+')(?:번째|번|째)'+SUF+'$');
const R_LET=new RegExp('^'+PRE+'('+alt(LET)+')(?:번)?'+SUF+'$');
const R_X=/틀|아니|아닙|아닌|안맞|맞지않|엑스|가위|^x(?:요|입니다)?$/;
const R_O=/^(?:o|오|동그라미|오케이|ok|예|네|응|그래요?|맞.*)(?:요|입니다|이요|예요|야|라고생각해요)?$/;
const R_SUBMIT=/제출|채점|확인|다풀었|다했/;

function norm(s){
  return String(s==null?'':s).normalize('NFKC').toLowerCase().replace(/[\s.,!?'"“”‘’~…·\-_()\[\]]/g,'');
}
function numOf(t){
  let m;
  if((m=R_DIGIT.exec(t)))return +m[1];
  if((m=R_STD.exec(t)))return SINO[m[1]]||NAT[m[1]];
  if((m=R_DET.exec(t)))return DET[m[1]];
  if((m=R_LET.exec(t)))return LET[m[1]];
  return 0;
}
function parseOne(raw,count,type){
  const t=norm(raw);if(!t)return null;
  if(type==='ox'){
    if(R_X.test(t))return {kind:'ox',v:'X'};
    if(R_O.test(t))return {kind:'ox',v:'O'};
    const n=numOf(t);  // ox에서 1번 = O, 2번 = X (게임 모드 키와 같음)
    if(n===1)return {kind:'ox',v:'O'};
    if(n===2)return {kind:'ox',v:'X'};
    return R_SUBMIT.test(t)?{kind:'submit'}:null;
  }
  const n=numOf(t)||numOf(t.replace(/(?:제출|채점|확인).*$/,''));  // '3번 제출'은 번호 우선
  if(n)return n>=1&&n<=count?{kind:'index',i:n-1}:null;  // 범위 밖이면 다음 후보로
  return R_SUBMIT.test(t)?{kind:'submit'}:null;
}
/* text: 문자열 또는 후보 배열. 범위 안에서 해석되는 첫 후보를 돌려준다 */
function parse(text,opt){
  opt=opt||{};
  const count=opt.count>0?opt.count:4, type=opt.type||'mc';
  const list=Array.isArray(text)?text:[text];
  for(const s of list){const r=parseOne(s,count,type);if(r)return r;}
  return null;
}

/* ── 브라우저 부분 ────────────────────────── */
const hasWin=typeof window!=='undefined';
const SR=()=>hasWin?(window.SpeechRecognition||window.webkitSpeechRecognition):null;
const supported=()=>!!SR();
const canSpeak=()=>hasWin&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';

const ERR={
  'not-allowed':'마이크 권한이 꺼져 있습니다. 주소창의 마이크 아이콘에서 허용하세요.',
  'service-not-allowed':'마이크 권한이 꺼져 있습니다. 주소창의 마이크 아이콘에서 허용하세요.',
  'network':'음성 인식은 인터넷 연결이 필요합니다.',
  'no-speech':'소리가 들리지 않았습니다. 다시 눌러 말해 주세요.',
  'audio-capture':'마이크를 찾을 수 없습니다.'
};
let active=null;  // 지금 듣는 중인 컨트롤러 (동시에 하나만)
function stopListening(){if(active){active.stop();active=null;}}

function describe(r){
  if(r.kind==='index')return `'${r.i+1}번'으로 들었습니다`;
  if(r.kind==='ox')return `'${r.v}'로 들었습니다`;
  return "'제출'로 들었습니다";
}

/* o: {button, live, getOptions, getType, select, submit, lang, bind}
   button·live는 요소 또는 요소를 돌려주는 함수(카드를 다시 그려도 새 요소를 찾도록).
   select(r): r = {kind:'index',i} | {kind:'ox',v}. submit(): 제출. bind:false면 클릭 리스너를 달지 않는다(위임용) */
function attach(o){
  const get=x=>typeof x==='function'?x():x;
  const ctl={listening:false,toggle(){},stop(){}};
  const b0=get(o.button);
  if(!supported()){if(b0)b0.hidden=true;return ctl;}
  const lang=o.lang||'ko-KR';
  let rec=null, done=false;
  function ui(state,msg){
    const b=get(o.button), l=get(o.live);
    if(b){b.dataset.state=state;b.setAttribute('aria-pressed',state==='listening'?'true':'false');}
    if(l&&msg!=null)l.textContent=msg;
  }
  ctl.stop=function(){
    ctl.listening=false;done=true;
    if(rec){try{rec.abort();}catch(e){}rec=null;}
    ui('idle');
  };
  function finish(state,msg){if(done)return;done=true;ctl.listening=false;rec=null;if(active===ctl)active=null;ui(state,msg);}
  function onResult(alts){
    const count=o.getOptions?o.getOptions():4, type=o.getType?o.getType():'mc';
    let r=parse(alts,{count,type});
    if(r&&r.kind==='submit'&&!o.submit)r=null;
    if(!r){
      const heard=(alts[0]||'').trim().slice(0,24);
      const guide=type==='ox'?"'O' 또는 'X'로 말해 주세요.":`1~${count}번 중에서 말해 주세요.`;
      finish('error',heard?`'${heard}'로 들었습니다. ${guide}`:'소리가 들리지 않았습니다. 다시 눌러 말해 주세요.');
      return;
    }
    finish('heard');
    try{if(r.kind==='submit')o.submit();else o.select(r);}catch(e){}
    ui('heard',describe(r));  // select가 카드를 다시 그렸더라도 새 요소에 상태를 적는다
  }
  ctl.toggle=function(){
    if(ctl.listening){ctl.stop();return;}
    stopListening();cancelSpeak();
    const Ctor=SR();
    try{rec=new Ctor();}catch(e){ui('error','음성 인식을 시작할 수 없습니다.');return;}
    done=false;ctl.listening=true;active=ctl;
    rec.lang=lang;rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=5;
    rec.onresult=ev=>{
      const res=ev.results&&ev.results[0], alts=[];
      if(res)for(let i=0;i<res.length;i++)alts.push(res[i].transcript);
      onResult(alts);
    };
    rec.onerror=ev=>{
      if(ev.error==='aborted')return;
      finish('error',ERR[ev.error]||'음성 인식에 실패했습니다. 다시 눌러 주세요.');
    };
    rec.onend=()=>{if(!done)finish('error',ERR['no-speech']);};
    ui('listening','듣는 중…');
    try{rec.start();}catch(e){finish('error','음성 인식을 시작할 수 없습니다. 잠시 뒤 다시 눌러 주세요.');}
  };
  if(o.bind!==false&&b0)b0.addEventListener('click',ctl.toggle);
  return ctl;
}

/* ── 읽어 주기 ────────────────────────────── */
function pickVoice(lang){
  try{
    const vs=speechSynthesis.getVoices();
    return vs.find(v=>v.lang===lang)||vs.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang.slice(0,2).toLowerCase()))||null;
  }catch(e){return null;}
}
function speak(text,lang){
  if(!canSpeak()||!text)return false;
  lang=lang||'ko-KR';
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text));
    u.lang=lang;const v=pickVoice(lang);if(v)u.voice=v;
    speechSynthesis.speak(u);return true;
  }catch(e){return false;}
}
function cancelSpeak(){if(canSpeak()){try{speechSynthesis.cancel();}catch(e){}}}
function isSpeaking(){try{return canSpeak()&&speechSynthesis.speaking;}catch(e){return false;}}

const API={supported,canSpeak,parse,attach,speak,cancelSpeak,isSpeaking,stopListening};
if(hasWin)root.QBVoice=API;
if(typeof module!=='undefined'&&module.exports)module.exports=API;
})(typeof window!=='undefined'?window:globalThis);
</script>

일, 보통 메일, 광고성 메일, 그 밖의 메일로 나누며, 원치 않는 대량 메일만 따로 떼는 범주는 없습니다.","w":"범주는 긴급·일반·홍보·기타 네 가지입니다. '스팸'은 범주에 없으며 광고성 메일은 '홍보'로 분류합니다.","an":"14일차 · LangGraph 메일 에이전트 (첫 셀) §7 Node 4 태깅","src":"이메일을 다음 중 하나로 분류:\n- 긴급\n- 일반\n- 홍보\n- 기타"},{"id":"t1-04","ty":"mc","lv":2,"game":true,"p":"draft_reply 노드 프롬프트가 [필수 규칙] 1번으로 강제하는 첫 문장 형식은?","o":["Dear {sender_name},","안녕하세요 {sender_name}님,","요약 문장으로 시작","감사합니다로 시작"],"a":1,"h":"이 노드 제목은 '답장 생성 (sender_name 강제 삽입)'입니다. 앞 노드에서 뽑은 발신자 이름을 한국어 인사말 안에 넣고 존칭 '님'과 쉼표로 끝나게 해, 모든 답장이 같은 인사로 시작하게 만듭니다.","w":"첫 문장은 반드시 '안녕하세요 {sender_name}님,'입니다. 실행 결과에서도 답장이 추출된 발신자 이름과 '님,'으로 시작합니다.","an":"14일차 · LangGraph 메일 에이전트 (첫 셀) §6 Node 3","src":"# 6. Node 3 - 답장 생성 (sender_name 강제 삽입)\n# ============================================================\n\ndef draft_reply(state: EmailState):\n\n prompt = f\"\"\"\n너는 기업 이메일 답장 AI다.\n\n반드시 아래 형식을 지켜라:\n\n[필수 규칙]\n1. 첫 문장은 반드시:\n \"안녕하세요 {}님,\""},{"id":"t1-05","ty":"mc","lv":3,"game":true,"p":"실행 결과 Tags에 범주 하나가 아니라 '이 이메일은 긴급으로 분류할 수 있습니다…' 같은 긴 문장이 나왔습니다. 가장 알맞은 개선 방법은?","o":["출력 형식을 지정해 파싱","temperature를 1로 올림","노드 순서를 바꿈","END 연결을 제거"],"a":0,"h":"첫 셀의 태깅 프롬프트는 출력 형식을 정하지 않아 LLM이 설명 문장까지 붙였습니다. 뒤의 LCEL 메일 분석기는 프롬프트에 'Tag: &lt;태그&gt;' 같은 형식을 지정하고 <code>out.split('Tag:')<\/code>로 값만 잘라 내며, 없으면 기본값을 씁니다.","w":"출력 형식(Tag: …)을 지정하고 그 줄만 파싱하면 범주 값만 얻을 수 있습니다. temperature를 올리거나 노드 순서·END를 바꾸는 것은 출력 형식 문제와 관계가 없습니다.","an":"14일차 · LangGraph 메일 에이전트 (첫 셀) §10 결과 출력 · 14일차 · 메모리 기반 LCEL 이메일 Agent 이메일 태그 Agent","src":"'긴급', '일반', '홍보', '기타' 중 하나로 태깅하세요.\n\n출력 형식:\nTag: <태그>\n\n내용:\n{email_text}\n\n요약:\n{summary}\"\"\"\n\n out = run_chain(\n\n )\n\n return out.split(\"Tag: \")[-1].strip() if \"Tag: \" in out else \"기타\""},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"첫 셀의 LLM은 <code>ChatOpenAI(model='gpt-4o-mini', temperature=0.3)<\/code>으로 초기화한다.","a":true,"h":"§3 LLM 초기화 블록은 경량 모델과 함께 낮은 temperature를 지정합니다. temperature는 출력의 무작위성을 정하는 값으로, 0에 가까울수록 결과가 안정적이며 뒤 셀들에는 0으로 둔 경우도 있습니다.","w":"맞습니다. 첫 셀과 Production V2 셀은 plate, ChatOpenAI, StrOutputParser를 import하며, 문자열 변환은 마지막에 와야 합니다.","w":"PromptTemplate → ChatOpenAI → StrOutputParser 순입니다. 파서가 마지막에 와야 모든 Agent가 바로 문자열을 받아 splitlines·split으로 파싱할 수 있습니다.","an":"14일차 · 메모리 기반 LCEL 이메일 Agent · LCEL 실행 헬퍼 함수","src":"def run_chain(template_str, input_vars):\n \"\"\"\n [역할]\n Prompt → LLM → String 변환까지 한 번에 처리하는 공통 실행기\n\n [구조]\n PromptTemplate → ChatOpenAI → StrOutputParser\n \"\"\"\n\n # PromptTemplate 생성 (입력 변수 자동 매핑)\n prompt = PromptTemplate(\n input_variables=\n template=\n )\n\n # LCEL 체인 구성 (LangChain 최신 방식)\n chain =\n\n # 실행 (invoke)\n return\n# ==========================================\n# 1. 이메일 헤더 파싱 Agent"},{"id":"t4-02","ty":"mc","lv":1,"game":true,"p":"수신자 역할 추론 Agent의 범주에 <b>없는<\/b> 것은?","o":["상사","공급업체","고객","학생"],"a":3,"h":"detect_recipient_role 템플릿은 '범주: …'에 다섯 가지 업무 관계를 나열합니다. 윗사람, 같은 팀 사람, 서비스를 받는 쪽, 물건을 대 주는 쪽, 그 밖의 관계로 나뉩니다.","w":"범주는 상사·동료·고객·공급업체·기타입니다. '학생'은 범주에 없습니다.","an":"14일차 · 메모리 기반 LCEL 이메일 Agent · 수신자 역할 추론 Agent","src":"def detect_recipient_role(raw_header, email_text):\n \"\"\"\n [Agent 역할]\n - 이메일 내용 + 헤더 기반으로 수신자 관계 추론\n - Classification Agent\n \"\"\"\n\n template = \"\"\"이메일 헤더와 본문을 참고하여 수신자 역할을 추론하세요.\n범주: 상사, 동료, 고객, 공급업체, 기타"},{"id":"t4-03","ty":"mc","lv":2,"game":true,"p":"tag_email에서 LLM 출력에 'Tag: '가 없으면 반환되는 값은?","o":["일반","기타","빈 문자열","None"],"a":1,"h":"마지막 줄은 조건 표현식입니다: 'Tag: '가 출력에 있으면 split으로 뒤쪽 값을 잘라 쓰고, 없으면 else 뒤의 기본값을 씁니다. 기본값은 태깅 범주 네 개 중 '나머지'를 뜻하는 것입니다.","w":"<code>... if 'Tag: ' in out else '기타'<\/code>이므로 '기타'를 반환합니다. 형식이 어긋난 출력이 화면을 깨뜨리지 않게 하는 안전장치입니다.","an":"14일차 · 메모리 기반 LCEL 이메일 Agent · 이메일 태그 Agent","src":"'긴급', '일반', '홍보', '기타' 중 하나로 태깅하세요.\n\n출력 형식:\nTag: <태그>\n\n내용:\n{email_text}\n\n요약:\n{summary}\"\"\"\n\n out = run_chain(\n\n )\n\n return out.split(\"Tag: \")[-1].strip() if \"Tag: \" in out else \"기타\"\n# ==========================================\n# 전체 Agent Workflow (Orchestrator)\n# ==========================================\ndef process_email(raw_header, email_text):\n \"\"\"\n [역할]\n - 모든 Agent를 순차 실행하는 Orchestrator"},{"id":"t4-04","ty":"mc","lv":2,"game":true,"p":"문제) LCEL 메일분석기의 split_email 템플릿이 LLM에게 요구하는 출력 형식은?","o":["Role:","Tag:","HEADER: 와 BODY:","Sender Name:"],"a":2,"h":"split_email은 '통합 이메일 입력을 Header / Body로 자동 분리'하는 Agent입니다. 템플릿은 '반드시 아래 형식으로 출력'하라며 대문자 접두어 두 줄을 제시하고, 코드는 그 접두어로 시작하는 줄을 찾아 header·body 변수에 담습니다.","w":"'HEADER: &lt;헤더 내용&gt;'과 'BODY: &lt;본문 내용&gt;' 두 줄입니다. Sender Name·Role·Tag는 다른 Agent의 출력 형식입니다.","an":"14일차 · #문제) LCEL 기반의 메일분석기 · 이메일 분리 Agent","src":"def split_email(full_email):\n \"\"\"\n 역할 (Agent):\n - 통합 이메일 입력을 Header / Body로 자동 분리\n - LLM 기반 구조 분석 Agent\n \"\"\"\n\n template = \"\"\"\n다음 이메일을 분석해서 반드시 아래 형식으로 출력하세요.\n\nHEADER: <헤더 내용>\nBODY: <본문 내용>\n\n이메일:\n{email}\n\"\"\"\n\n result = run_chain(template, {\"email\": full_email})\n\n header = \"\" # 추출된 헤더 저장 변수\n body = \"\" # 추출된 본문 저장 변수"},{"id":"t4-05","ty":"mc","lv":3,"game":false,"p":"parse_email_header의 LLM 출력이 'Sender Name: 학생A' 줄을 포함할 때, 그 줄에서 이름만 꺼내는 코드로 알맞은 것은?","o":["line.split('Sender Name:')[-1].strip()","line.split(':')[0]","out.splitlines()[1]","line.strip('Sender')"],"a":0,"h":"출력 파싱은 <code>for line in out.splitlines():<\/code>로 한 줄씩 보며 접두어로 시작하는 줄을 찾습니다. 같은 셀의 tag_email은 접두어로 split한 뒤 마지막 조각을 고르고 앞뒤 공백을 지우는 방식으로 값을 꺼냅니다.","w":"<code>line.split('Sender Name:')[-1].strip()<\/code>은 접두어 뒤 부분을 공백 없이 돌려줍니다. ':'로 나눈 첫 조각은 접두어 자체이고, splitlines()[1]은 둘째 줄 전체입니다.","an":"14일차 · #문제) LCEL 기반의 메일분석기 · 발신자/날짜 추출 Agent","src":"# 1. 이메일 헤더 파싱 Agent\n# ==========================================\ndef parse_email_header(raw_header):\n \"\"\"\n [Agent 역할]\n - 이메일 헤더에서 발신자 이름 + 수신일 추출\n - 정보 구조화 단계 (Information Extraction Agent)\n \"\"\"\n\n template = \"\"\"헤더에서 발신자 이름과 수신일시를 추출하세요.\n출력형식:\nSender Name: <이름>\nReceived Date: <날짜>\n\n헤더:\n{raw_header}\"\"\"\n\n out =\n\n sender, date =\n\n\n # 결과 파싱\n for line in out.splitlines():"},{"id":"t4-06","ty":"ox","lv":1,"game":true,"p":"문제) LCEL 메일분석기의 Gradio UI는 헤더와 본문을 하나의 Textbox로 받는다.","a": ======\n# 7. 수신자 역할 추론 Agent\n# ==========================================\ndef detect_role(header, body):"},{"id":"t4-09","ty":"order","lv":1,"game":false,"p":"문제) LCEL 메일분석기에서 이메일 분리 뒤에 이어지는 Agent 순서를 맞추세요.","steps":["Header Parsing Agent","Role Detection Agent","Summarization Agent","Reply Generation Agent","Tagging Agent"],"h":"셀 위 구조도는 Input Email → Split Agent 다음에 다섯 Agent를 세로로 나열하고 Output으로 끝납니다. 발신자·날짜와 역할 같은 메타 정보를 먼저 얻고, 요약을 만든 뒤 그 모두를 이용해 답장을 쓰며, 분류는 맨 끝입니다.","w":"Header Parsing → Role Detection → Summarization → Reply Generation → Tagging 순입니다. 답변 생성에 발신자·날짜·역할·요약이 모두 필요하므로 앞 단계들이 먼저 실행됩니다.","an":"14일차 · #문제) LCEL 기반의 메일분석기 · LCEL-based Sequential Multi-Agent Pipeline","src":"# 실행\ndemo.launch()\n```\n#문제) LCEL 기반의 메일분석기입니다. 다음 비어있는 빈칸을 완성하세요.\n```python\n\"\"\"\nLCEL-based Sequential Multi-Agent Pipeline\nInput Email\n ↓\nSplit Agent\n ↓\nHeader Parsing Agent\n ↓\nRole Detection Agent\n ↓\nSummarization Agent\n ↓\nReply Generation Agent\n ↓\nTagging Agent\n ↓\nOutput"},{"id":"t4-10","ty":"multi","lv":3,"game":true,"p":"draft_reply가 <code>run_chain(template, {...})<\/code>에 넘기는 딕셔너리 키로 맞는 것을 모두 고르세요.","o":["summary","sender","role","tag","header"],"a":[0,1,2],"h":"run_chain에 넘기는 딕셔너리 키는 템플릿의 중괄호 변수와 같아야 합니다. draft_reply 템플릿에는 이메일 내용, 요약, 발신자, 수신일, 수신자 역할 다섯 변수가 있으며, 태그와 헤더 원문은 이 템플릿에 들어 있지 않습니다.","w":"템플릿 변수는 body(첫 버전은 email_text)·summary·sender·date·role이므로 summary·sender·role이 맞습니다. tag는 답장 뒤에 만들어지고, header는 이 템플릿 변수가 아닙니다.","an":"14일차 · #문제) LCEL 기반의 메일분석기 · 답변 생성 Agent","src":"def draft_reply(email_text, summary, sender, date, role):\n \"\"\"\n [Agent 역할]\n - 구조화된 정보를 기반으로 답변 이메일 생성\n - Generation Agent (핵심 LLM Agent)\n \"\"\"\n\n template = \"\"\"이메일 내용: {email_text}\n요약: {summary}\n발신자: {sender}\n수신일: {date}\n수신자 역할: {role}\n\n위 정보를 기반으로 전문적이고 간결한 답변 초안을 작성하세요.\"\"\"\n\n return run_chain(\n template,\n {\n\n\n }\n )\n# ==========================================\n# 5. 이메일 태그 Agent"}]},{"id":"t5","title":"RAG + LangGraph 리뷰 루프","ref":"14일차 RAG + Langgraph 하이브리드 구조","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"review_node에서 이메일 초안을 승인하는 기준은?","o":["5점 이상","7점 이상","8점 초과","10점일 때만"],"a":1,"h":"review 노드는 정확성·자연스러움·참고자료 반영 여부를 기준으로 0~10점을 매기게 하고, 반환 딕셔너리에서 비교 연산으로 approved를 정합니다. 주석은 '○점 이상이면 승인'이라고 적혀 있으며, 실행 결과 Score 8은 승인되었습니다.","w":"<code>'approved': score &gt;= 7<\/code>이므로 7점 이상이면 승인입니다. 6점 이하이면 rewrite 루프로 갑니다.","an":"14일차 · RAG + Langgraph 하이브리드 구조 §9 Review Node","src":"이메일 품질을 0~10으로 평가하세요.\n\n 기준:\n - 정확성\n - 자연스러움\n - 참고자료 반영 여부\n\n 이메일:\n {draft}\n\n 숫자만 출력하세요.\n \"\"\"\n )\n\n chain = prompt | llm | StrOutputParser()\n\n score_raw =\n\n\n # 안전한 정수 변환\n try:\n score = int(score_raw.strip())\n except:\n score = 0\n\n return {\n \"score\": score,\n \"approved\": score >= 7 # 7점 이상이면 승인\n }\n# ==========================================\n# 10. Agent 4 - Rewrite Node (개선 에이전트)"},{"id":"t5-02","ty":"mc","lv":1,"game":true,"p":"하이브리드 예제의 EmailState에서 <code>approved<\/code> 필드의 타입은?","o":["str","int","list","bool"],"a":3,"h":"EmailState는 email_text·context·draft(문자열), score(정수), approved 다섯 필드입니다. approved는 '승인 여부'처럼 예/아니오 두 값만 갖고, review_node에서 비교 연산 결과가 그대로 들어갑니다.","w":"approved는 bool입니다. 비교식 score &gt;= 7의 결과(True/False)가 저장되고, route 함수가 이를 보고 분기합니다.","an":"14일차 · RAG + Langgraph 하이브리드 구조 §6 LangGraph State 정의","src":"email_text: str # 사용자 입력\n context: str # RAG 검색 결과\n draft: str # 생성된 이메일 초안\n score: int # 품질 평가 점수\n approved: bool # 승인 여부\n# ==========================================\n# 7. Agent 1 - Retrieve Node (RAG 검색 에이전트)\n# ==========================================\ndef retrieve_node(state: EmailState):\n \"\"\"\n 역할:\n - 사용자 입력을 기반으로 FAISS에서 관련 문서 검색"},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"review_node에서 LLM이 돌려준 점수 문자열을 정수로 바꾸다 실패하면 score는 어떻게 됩니까?","o":["0으로 처리","7로 처리","다시 평가 요청","예외를 그대로 전파"],"a":0,"h":"주석 '안전한 정수 변환' 아래 try 블록은 <code>int(score_raw.strip())<\/code>을 시도하고, except 블록은 숫자로 바꿀 수 없을 때 가장 낮은 점수를 대입합니다. 이렇게 하면 승인 기준을 통과하지 못해 개선 루프로 가게 됩니다.","w":"except에서 score = 0이 되어 미승인으로 처리됩니다. LLM이 '숫자만 출력' 지시를 어겨도 그래프가 멈추지 않게 하는 장치입니다.","an":"14일차 · RAG + Langgraph 하이브리드 구조 §9 Review Node","src":"def review_node(state: EmailState):\n \"\"\"\n 역할:\n - 생성된 이메일 품질 평가\n - 0~10 점수 기반 승인 여부 판단\n \"\"\"\n\n prompt = PromptTemplate.from_template(\n \"\"\"\n 이메일 품질을 0~10으로 평가하세요.\n\n 기준:\n - 정확성\n - 자연스러움\n - 참고자료 반영 여부\n\n 이메일:\n {draft}\n\n 숫자만 출력하세요.\n \"\"\"\n )\n\n chain = prompt | llm | StrOutputParser()\n\n score_raw =\n\n\n # 안전한 정수 변환\n try:\n score = int(score_raw.strip())\n except:"},{"id":"t5-04","ty":"mc","lv":2,"game":true,"p":"<code>route(state)<\/code>는 approved가 False일 때 무엇을 반환합니까?","o":["END","review","rewrite","generate"],"a":2,"h":"route 독스트링은 'review 결과 기반 workflow 제어 - 승인 or 개선 루프 결정'입니다. 반환식은 승인되면 종료 문자열을, 아니면 개선 노드 이름을 돌려주며, add_conditional_edges의 매핑이 그 문자열을 실제 노드로 연결합니다.","w":"<code>'END' if state['approved'] else 'rewrite'<\/code>이므로 'rewrite'를 반환하고, 매핑에 따라 rewrite 노드로 갑니다.","an":"14일차 · RAG + Langgraph 하이브리드 구조 §13 Routing","src":"- review 결과 기반 workflow 제어\n - 승인 or 개선 루프 결정\n \"\"\"\n return \"END\" if state[\"approved\"] else \"rewrite\"\n\n\nbuilder.add_conditional_edges(\n \"review\",\n route,\n {\n \"END\": END, # 종료"},{"id":"t5-05","ty":"num","lv":3,"game":false,"p":"0~10점 정수 평가에서 승인(approved=True)되는 점수 값은 모두 몇 가지입니까?","a":4,"unit":"가지","h":"계산식: 최고점 − 승인 최저점 + 1 = 10 − 7 + 1. 점수는 0~10 정수이고 승인 조건은 score &gt;= 7이므로, 7부터 10까지 양 끝을 모두 포함한 개수를 세는 식입니다.","w":"7·8·9·10의 4가지입니다. 이 밖의 0~6점은 rewrite 루프로 갑니다.","an":"14일차 · RAG + Langgraph 하이브리드 구조 §9 Review Node","src":"# 안전한 정수 변환\n try:\n score = int(score_raw.strip())\n except:\n score = 0\n\n return {\n \"score\": score,\n \"approved\": score >= 7 # 7점 이상이면 승인\n }\n# ==========================================\n# 10. Agent 4 - Rewrite Node (개선 에이전트)\n# ==========================================\ndef rewrite_node(state: EmailState):\n \"\"\"\n 역할:\n - 평가 실패 시 이메일 개선"},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"rewrite 노드가 실행된 뒤에는 다시 review 노드로 돌아가 재평가를 받는다.","a":true,"h":"§13 아래에는 주석 'rewrite → review loop (iterative improvement)'와 함께 고정 엣지 하나가 추가되어 있습니다. 구조도도 Review Agent(quality judge) 아래에 'approve / rewrite loop'를 그립니다.","w":"맞습니다. <code>builder.add_edge('rewrite', 'review')<\/code>로 개선 후 재평가하는 반복 루프를 만듭니다.","an":"14일차 · RAG + Langgraph 하이브리드 구조 §13 Routing","src":"\"rewrite\": \"rewrite\" # 개선 루프\n }\n)\n# rewrite → review loop (iterative improvement)\nbuilder.add_edge(\"rewrite\", \"review\")\n# ==========================================\n# 14. Compile (실행 가능한 Agent 생성)"},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"이 하이브리드 예제의 RAG 문서는 실제 PDF 파일을 로드해 만든다.","a":false,"h":"구조도에는 PDF / Web Loader가 그려져 있지만, '4. RAG 데이터셋' 주석은 '실제 PDF/Web 대신 테스트용 정책 문서 역할'이라고 적습니다. 코드도 Document(page_content=...) 세 개를 직접 리스트로 만듭니다.","w":"틀렸습니다. 이메일 작성 정책 문장 3개를 Document로 직접 만들어 FAISS에 넣습니다. requests·BeautifulSoup import는 '확장용'입니다.","an":"14일차 · RAG + Langgraph 하이브리드 구조 §4 RAG 데이터셋","src":"# 4. RAG 데이터셋 (샘플 문서)\n# ==========================================\n# 실제 PDF/Web 대신 테스트용 정책 문서 역할\ndocs = [\n Document(page_content=\"이메일은 항상 정중하고 명확하게 작성해야 한다\"),\n Document(page_content=\"회의 일정 변경 시 최소 24시간 전에 통보한다\"),\n Document(page_content=\"고객 응대 이메일은 공손한 표현을 사용해야 한다\")\n]\n# ==========================================\n# 5. Vector DB 생성 (FAISS RAG)"},{"id":"t5-08","ty":"match","lv":1,"game":false,"p":"하이브리드 그래프의 노드와 역할을 연결하세요.","pairs":[["retrieve","FAISS에서 관련 정책 문서 검색"],["generate","참고자료 기반 이메일 초안 작성"],["review","0~10점 품질 평가"],["rewrite","미승인 초안을 더 명확하게 개선"]],"h":"노드는 retrieve(RAG 검색 에이전트), generate(이메일 생성 에이전트), review(LLM Judge·평가자), rewrite(개선 에이전트) 넷입니다. 각 노드 독스트링의 '역할:' 줄을 떠올리세요.","w":"retrieve는 FAISS에서 정책 문서 검색, generate는 참고자료 기반 초안 작성, review는 0~10점 품질 평가, rewrite는 더 전문적·명확하게 개선합니다.","an":"14일차 · RAG + Langgraph 하이브리드 구조 §7~§10 Agent 1~4","src":"score = 0\n\n return {\n \"score\": score,\n \"approved\": score >= 7 # 7점 이상이면 승인\n }\n# ==========================================\n# 10. Agent 4 - Rewrite Node (개선 에이전트)\n# ==========================================\ndef rewrite_node(state: EmailState):\n \"\"\"\n 역할:\n - 평가 실패 시 이메일 개선\n - 반복 loop 개선 구조\n \"\"\"\n\n prompt = PromptTemplate.from_template(\n \"\"\"\n 아래 이메일을 더 개선하세요.\n\n - 더 전문적으로\n - 더 명확하게\n - 참고자료 반영 강화"},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"초안이 처음 평가에서 미승인되었을 때의 실행 흐름을 맞추세요.","steps":["retrieve: 정책 문서 검색","generate: 이메일 초안 생성","review: 품질 점수 평가","rewrite: 미승인 초안 개선","review 재평가 후 승인 시 END"],"h":"set_entry_point는 검색 노드이고, 고정 엣지 retrieve → generate → review가 이어집니다. review 뒤에는 route가 승인 여부로 분기하며, 개선 노드는 다시 평가 노드로 돌아갑니다.","w":"retrieve → generate → review(미승인) → rewrite → review 재평가 후 승인 시 END 순입니다.","an":"14일차 · RAG + Langgraph 하이브리드 구조 §11~§13","src":"draft: str # 생성된 이메일 초안\n score: int # 품질 평가 점수\n approved: bool # 승인 여부\n# ==========================================\n# 7. Agent 1 - Retrieve Node (RAG 검색 에이전트)\n# ==========================================\ndef retrieve_node(state: EmailState):\n \"\"\"\n 역할:\n - 사용자 입력을 기반으로 FAISS에서 관련 문서 검색"},{"id":"t5-10","ty":"multi","lv":3,"game":true,"p":"'회의 일정 변경 요청 이메일 작성' 실행 결과와 코드에 대한 설명으로 맞는 것을 모두 고르세요.","o":["Score 8로 승인됨","24시간 전 통보 원칙 반영","평가 기준에 참고자료 반영 포함","점수 6으로 재작성됨","RAG 문서가 무시됨"],"a":[0,1,2],"h":"실행 출력 끝에는 'Score:'와 'Approved:' 두 줄이 찍혀 있고, 본문에는 회의 일정 변경을 미리 알려야 한다는 정책 문장이 녹아 있습니다. review 프롬프트의 평가 기준 세 가지도 함께 떠올리세요.","w":"결과는 Score 8, Approved True이고, 초안에 '최소 24시간 전에 통보' 원칙이 반영되었습니다. review 기준에는 참고자료 반영 여부가 들어 있습니다.","an":"14일차 · RAG + Langgraph 하이브리드 구조 §15·§16 실행 결과 · §9","src":"이메일 품질을 0~10으로 평가하세요.\n\n 기준:\n - 정확성\n - 자연스러움\n - 참고자료 반영 여부\n\n 이메일:\n {draft}\n\n 숫자만 출력하세요.\n \"\"\"\n )\n\n chain = prompt | llm | StrOutputParser()\n\n score_raw =\n\n\n # 안전한 정수 변환\n try:\n score = int(score_raw.strip())\n except:\n score = 0\n\n return {\n \"score\": score,\n \"approved\": score >= 7 # 7점 이상이면 승인"}]}]};

const TYPES={mc:['객관식','--ty-mc'],multi:['복수 선택','--ty-multi'],ox:['O / X','--ty-ox'],match:['짝 맞추기','--ty-match'],order:['순서 맞추기','--ty-order'],num:['계산','--ty-num']};

  match:'왼쪽 항목을 누른 뒤 짝이 되는 오른쪽 항목을 누르세요. 연결된 항목을 다시 누르면 풀립니다.',
  order:'첫 번째부터 순서대로 클릭하세요. 번호가 붙은 항목을 다시 누르면 그 번호부터 뒤 번호가 지워집니다.',num:'숫자만 입력하세요.'};
/* 게임 모드 목록 — 새 게임은 여기에 항목을 추가한다 (설정·출제 유형·규칙 문구를 모드별로) */

};

const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

/* ── 유틸 ──────────────────────────────── */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function say(msg){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=msg,30);}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('📋 클립보드에 복사했습니다');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'📋 클립보드에 복사했습니다':'복사하지 못했습니다. 인쇄 기능을 이용하세요.');
}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

/* ── 오답노트 ──────────────────────────── */
function addWrong(id,ans){const w=S.wrong[id]||{n:0};w.n++;w.last=ans;w.at=Date.now();w.solved=false;S.wrong[id]=w;}
function markSolved(id){if(S.wrong[id]&&!S.wrong[id].solved){S.wrong[id].solved=true;S.wrong[id].at=Date.now();}}
const wrongList=solved=>Object.keys(S.wrong).filter(id=>QMAP[id]&&!!S.wrong[id].solved===solved)
  .sort((a,b)=>QTAB[a].idx-QTAB[b].idx||ALLQ.indexOf(QMAP[a])-ALLQ.indexOf(QMAP[b]));

/* ── 문항 풀이 상태(학습·재도전 공용) ───── */
let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

function cardHTML(q,n){
  const [label,color]=TYPES[q.ty];
  const g=cur.graded, a=cur.ans[q.id], fa=finalAns(q), ok=g&&isCorrect(q,fa);
  const lock=g?' disabled':'';
  let body='';
  if(q.ty==='mc'||q.ty==='multi'){
    const multi=q.ty==='multi', mine=multi?(a||[]):[a];
    body='<div class="opts">'+q.o.map((o,i)=>{
      const right=multi?q.a.includes(i):q.a===i, picked=mine.includes(i);
      const cls=g?(right?' ans':picked?' miss':''):'';
      return `<label class="opt${cls}"><span class="onum">${i+1}</span><input type="${multi?'checkbox':'radio'}" name="r-${q.id}" data-act="${multi?'tick':'pick'}" data-q="${q.id}" data-i="${i}"${picked?' checked':''}${lock}><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(q.ty==='ox'){
    body='<div class="ox">'+[true,false].map(v=>{
      const cls=g?(q.a===v?' ans':a===v?' miss':''):'';
      return `<button type="button" class="${cls.trim()}" data-act="ox" data-q="${q.id}" data-v="${v?1:0}" data-fk="${q.id}-ox${v?1:0}" aria-pressed="${a===v}" aria-label="${v?'맞다 O':'틀리다 X'}"${lock}>${v?'O':'X'}</button>`;
    }).join('')+'</div>';
  }else if(q.ty==='match'){
    const m=a||{}, sel=cur.msel[q.id], linkedBy={};
    Object.entries(m).forEach(([l,r])=>linkedBy[r]=+l);
    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${PAL[i%PAL.length]})" data-act="ml" data-q="${q.id}" data-i="${i}" data-fk="${q.id}-l${i}"${lock}><span class="tag">${LETTER[i]}</span>${esc(p[0])}</button>`;
    }).join('');
    const right=cur.shuf[q.id].map(j=>{
      const by=linkedBy[j], linked=by!=null, cls=(linked?' linked':'')+(g&&linked?(by===j?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${linked?PAL[by%PAL.length]:'--line'})" data-act="mr" data-q="${q.id}" data-j="${j}" data-fk="${q.id}-r${j}"${lock}><span class="tag">${linked?LETTER[by]:''}</span>${esc(q.pairs[j][1])}</button>`;
    }).join('');
    body=`<div class="match"><div class="mcol mleft">${left}</div><div class="mcol mright">${right}</div></div>`;
  }else if(q.ty==='order'){
    const seq=a||[], full=seq.length===q.steps.length;
    body='<div class="olist">'+(cur.shuf[q.id]||range(q.steps.length)).map(si=>{
      const pos=seq.indexOf(si), on=pos>=0;
      const cls=(on?' on':'')+(g?(pos===si?' ok':' no'):'');
      const fix=g&&pos!==si?`<span class="ofix">정답 ${si+1}</span>`:'';
      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }
  const numAns=q.ty==='mc'?`${q.a+1}번 · `:q.ty==='multi'?q.a.map(i=>i+1).join('·')+'번 · ':'';
  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${mediaHTML(q)}${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>${voiceRow(q,q.id)}`}${body}${exp}</article>`;
}
const LV_NAME=['쉬움','보통','어려움'];
function lvHTML(lv){
  lv=lv||1;
  const dots=[1,2,3].map(k=>k<=lv?`<i class="d${k}">●</i>`:'<i class="off">○</i>').join('');
  return `<span class="lv lv${lv}" title="난이도 ${LV_NAME[lv-1]}"><span class="dots" aria-hidden="true">${dots}</span><em>${LV_NAME[lv-1]}</em></span>`;
}
// 자료 발췌: 이스케이프 후 마크다운 기호만 가볍게 서식으로 (**굵게**, `코드`, 머리 #)
const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
function hintHTML(q){
  if(!q.h)return '';
  const open=cur.hints.has(q.id), label=q.ty==='num'?'Hint · 계산식':'Hint';
  // 2단계: ① 자세한 힌트(h) ② 자료 보기 — 자료 원문 발췌(src) + 위치(an)
  const sopen=cur.srcs.has(q.id);
  const src=q.src?`<div class="srcwrap"><button type="button" class="srcbtn" data-act="src" data-q="${q.id}" data-fk="${q.id}-src" aria-expanded="${sopen}" aria-controls="src-${q.id}">`+
    `<span class="caret" aria-hidden="true">${sopen?'▾':'▸'}</span>📖 자료 보기</button>`+
    (sopen?`<blockquote class="src" id="src-${q.id}"><p>${srcText(q.src)}</p>${q.an?`<cite>${esc(q.an)}</cite>`:''}</blockquote>`:'')+`</div>`:'';
  return `<div class="hintwrap"><button type="button" class="hintbtn" data-act="hint" data-q="${q.id}" data-fk="${q.id}-hint" aria-expanded="${open}" aria-controls="hint-${q.id}">`+
    `<span class="caret" aria-hidden="true">${open?'▾':'▸'}</span>${label}</button>`+
    (open?`<div class="hint" id="hint-${q.id}">${q.h}${src}</div>`:'')+`</div>`;
}
function refreshCard(q){
  const el=document.getElementById('card-'+q.id);if(!el)return;
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  el.outerHTML=cardHTML(q,el.dataset.n);
  if(fk){const f=app.querySelector(`[data-fk="${fk}"]`);if(f&&!f.disabled)f.focus();}
  updateProgress();
}
const pad2=n=>String(n).padStart(2,'0');
const fmtCnt=(n,t)=>`(${pad2(n)}/${pad2(t)})`;
// 탭별 푼 문항 수: 지금 보는 탭 → 화면 상태, 그 외 → 풀던 답(drafts) → 채점 기록
function tabAnswered(t){
  const src=cur&&cur.mode==='study'&&cur.tab===t?cur.ans:(S.drafts[t.id]||(S.tabs[t.id]&&S.tabs[t.id].answers)||{});
  return t.qs.filter(q=>isAnswered(q,src[q.id])).length;
}
function updateProgress(){
  const p=document.getElementById('pbar');if(!p||!cur)return;
  const n=cur.list.filter(answered).length, cnt=fmtCnt(n,cur.list.length);
  p.style.width=pct(n,cur.list.length)+'%';
  document.getElementById('ptxt').textContent=`${n} / ${cur.list.length} 응답`;
  const g=document.getElementById('gradeCnt');if(g)g.textContent=cnt;
  if(cur.mode==='study'){
    const c=document.getElementById('qc-'+cur.tab.id);if(c)c.textContent=cnt;
    if(!cur.graded){  // 풀던 답 저장 → 탭을 옮겨도 유지
      if(n||Object.keys(cur.ans).some(k=>{const v=cur.ans[k];return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:v!=null&&v!=='';}))
        S.drafts[cur.tab.id]=JSON.parse(JSON.stringify(cur.ans));
      else delete S.drafts[cur.tab.id];
      save();
    }
  }
}

/* ── 음성 선택 · 문제 읽기 · 그림/오디오 (qb-voice.js가 없으면 모두 숨김) ── */
const hasVoice=()=>!!(window.QBVoice&&QBVoice.supported());
const hasRead=()=>!!(window.QBVoice&&QBVoice.canSpeak());
const IC_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const IC_VOL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const VC=new Map();  // 학습 모드 문항별 음성 컨트롤러
function voiceReset(){VC.clear();if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}}
function voiceRow(q,fkp){
  const mic=hasVoice()&&['mc','multi','ox'].includes(q.ty), rd=hasRead();
  if(!mic&&!rd)return '';
  const qa=fkp?` data-q="${q.id}"`:'';
  return `<div class="vrow noprint">`+
    (mic?`<button type="button" class="vbtn vmic" data-act="vmic"${qa} data-fk="${fkp}-vmic" data-state="idle" aria-pressed="false">${IC_MIC}<span>말하기</span></button>`:'')+
    (rd?`<button type="button" class="vbtn" data-act="vread"${qa} data-fk="${fkp}-vread">${IC_VOL}<span>문제 읽기</span></button>`:'')+
    (mic?`<span class="vstat" aria-live="polite"></span><span class="vhint">말하기 어려우면 눌러서 고르세요</span>`:'')+`</div>`;
}
function mediaHTML(q){
  let h='';
  if(q.img&&q.img.src)h+=`<figure class="qfig"><img src="${esc(q.img.src)}" alt="${esc(q.img.alt)}" loading="lazy">${q.img.caption?`<figcaption>${esc(q.img.caption)}</figcaption>`:''}</figure>`;
  if(q.audio&&q.audio.src)h+=`<div class="qaud"><audio controls preload="none" src="${esc(q.audio.src)}"></audio><details><summary>대본</summary><p>${esc(q.audio.transcript)}</p></details></div>`;
  return h;
}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
// 읽어 줄 글: 문제 + 화면에 보이는 순서의 보기("1번 …")
function readText(q,n,order){
  let t=(n?`${n}번 문제. `:'')+plain(q.p)+'.';
  if(q.img&&q.img.alt)t+=' 그림 설명. '+q.img.alt+'.';
  if(q.ty==='ox')t+=' 맞으면 O, 틀리면 X.';
  else if(q.ty==='mc'||q.ty==='multi')t+=(order||range(q.o.length)).map((oi,k)=>` ${k+1}번. ${plain(q.o[oi])}.`).join('');
  return t;
}
function readAloud(text){if(QBVoice.isSpeaking())QBVoice.cancelSpeak();else QBVoice.speak(text);}
// 음성으로 고른 것 = 보기를 직접 누른 것과 같은 경로(입력 click → 기존 change/click 처리)
function voicePick(q,r){
  if(!cur||cur.graded)return;
  const card=document.getElementById('card-'+q.id);if(!card)return;
  const el=r.kind==='ox'?card.querySelector(`[data-act="ox"][data-v="${r.v==='O'?1:0}"]`):card.querySelector(`input[data-i="${r.i}"]`);
  if(el&&!el.disabled)el.click();
}
function studyVoice(q){
  let c=VC.get(q.id);if(c)return c;
  const card=()=>document.getElementById('card-'+q.id);
  c=QBVoice.attach({bind:false,button:()=>card()&&card().querySelector('.vmic'),live:()=>card()&&card().querySelector('.vstat'),
    getOptions:()=>q.ty==='ox'?2:q.o.length,getType:()=>q.ty,select:r=>voicePick(q,r)});
  VC.set(q.id,c);return c;
}

/* 학습 화면 상호작용 */
function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;
  else if(el.dataset.act==='tick'){
    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);
  }
  cur.armed=false;updateProgress();
}
function onSheetInput(el){
  if(el.dataset.act==='num'&&!cur.graded){cur.ans[el.dataset.q]=el.value;cur.armed=false;updateProgress();}
}

/* ── 화면: 학습 ────────────────────────── */
function viewStudy(tid,fresh){
  const tab=TABS.find(t=>t.id===tid)||TABS[0];
  cur=newSheet('study',tab.qs,tab);
  const rec=S.tabs[tab.id], draft=S.drafts[tab.id];
  if(fresh){delete S.drafts[tab.id];save();}
  else if(draft){Object.assign(cur.ans,JSON.parse(JSON.stringify(draft)));}  // 풀던 중이면 이어서
  else if(rec&&rec.answers){
    Object.assign(cur.ans,JSON.parse(JSON.stringify(rec.answers)));
    (rec.touched||[]).forEach(id=>cur.touched.add(id));
    cur.graded=true;
  }
  renderSheet();
}
function renderSheet(){
  voiceReset();
  const study=cur.mode==='study', tab=cur.tab;
  const tabbar=study?`<nav class="tabbar noprint" role="tablist" aria-label="탭">${TABS.map((t,i)=>{const r=S.tabs[t.id];
      return `<a class="tabchip" role="tab" href="#study/${t.id}" aria-selected="${t===tab}"><b>${i+1}</b><span class="tl">${esc(t.title)}</span><span class="qc" id="qc-${t.id}">${fmtCnt(tabAnswered(t),t.qs.length)}</span>${r?`<span class="sc" title="채점 점수">✓${r.score}</span>`:''}</a>`;}).join('')}
      ${allGraded()?'<a class="tabchip sum" href="#summary">★ 종합</a>':''}</nav>`:'';
  const head=study?`<div class="tabhead"><h2>${tab.idx+1}. ${esc(tab.title)}</h2>${tab.ref?`<span class="part">${esc(tab.ref)}</span>`:''}</div>`
                  :`<div class="tabhead"><h2>🔁 오답 다시 풀기</h2><span class="part">${cur.list.length}문항</span></div>`;
  const next=study?(tab.idx+1<TABS.length?`<a class="btn" href="#study/${TABS[tab.idx+1].id}">다음 탭 →</a>`:(allGraded()?'<a class="btn" href="#summary">★ 종합 결과</a>':'')):'<a class="btn" href="#notes">오답노트로</a>';
  app.innerHTML=`<div class="sheet">
  <nav class="crumbs noprint"><a href="#home">← 홈</a><span>/</span><span>${study?'학습 모드':'오답노트'}</span></nav>
  ${tabbar}${head}
  <div class="progress"><div class="bar"><div id="pbar"></div></div><span id="ptxt"></span></div>
  <div id="sheetResult">${cur.graded?sheetResultHTML():''}</div>
  <div id="cards" class="${cur.onlyWrong?'onlywrong':''}">${cur.list.map((q,i)=>cardHTML(q,i+1)).join('')}</div>
  <p class="warn" id="warn" role="status"></p>
  <div class="actions">
    ${cur.graded?'':`<button class="btn primary" type="button" data-act="grade">${study?'이 탭 채점하기':'채점하기'} <span class="qc" id="gradeCnt"></span></button>`}
    ${cur.graded?`<button class="btn" type="button" data-act="onlywrong">${cur.onlyWrong?'전체 보기':'오답만 보기'}</button>`:''}
    ${study?'<button class="btn" type="button" data-act="retab">다시 풀기</button>':''}
    ${next}
  </div></div>`;
  const on=app.querySelector('.tabchip[aria-selected="true"]');
  if(on)on.parentElement.scrollLeft=on.offsetLeft-on.parentElement.offsetLeft-16;
