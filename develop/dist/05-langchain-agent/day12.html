_size는 상한일 뿐이라 첫 청크도 890자였습니다. 분할기는 자연스러운 경계를 우선해 자릅니다.","an":"12일차 PDF 로드 · 실행 결과","src":"# 하나의 Chunk 최대 문자 수\n #\n # 예)\n #\n # 500\n #\n # 약 400~500자 정도가 하나의 Chunk가 된다."},{"id":"t3-08","ty":"match","lv":2,"game":false,"p":"출력 코드와 확인하는 내용을 연결하세요.","pairs":[["len(documents)","PDF 페이지 수"],["len(texts)","생성된 청크 수"],["texts[0].page_content","첫 청크 본문"],["texts[0].metadata","첫 청크의 출처·페이지 정보"]],"h":"documents는 로더가 만든 페이지 단위 리스트, texts는 분할기가 만든 청크 리스트입니다. Document 하나는 page_content와 metadata 두 부분으로 되어 있습니다.","w":"documents 길이는 페이지 수, texts 길이는 청크 수입니다. page_content는 본문, metadata는 source·page 같은 정보입니다.","an":"12일차 PDF 로드 · Chunk 확인","src":"f\"PDF 페이지 수 : {len(documents)}\"\n)\n# 생성된 Chunk 수\nprint(\n f\"Chunk 수 : {len(texts)}\"\n)\n# 첫 번째 Chunk 길이\nprint(\n f\"첫 번째 Chunk 길이 : \"\n f\"{len(texts[0].page_content)}\"\n)\n# =========================================================\n# 첫 번째 Chunk 내용 확인"},{"id":"t3-09","ty":"order","lv":1,"game":false,"p":"PDF 전처리 실행 흐름대로 나열하세요.","steps":["PDF URL 지정","PyPDFLoader 생성","load()로 documents 생성","RecursiveCharacterTextSplitter 적용","texts(Chunk) 생성"],"h":"셀 끝 실행 흐름 주석은 'PDF URL → PyPDFLoader → documents → RecursiveCharacterTextSplitter → texts(Chunk) → Embedding → Vector DB'입니다.","w":"URL 지정 → 로더 생성 → 페이지 로드 → 분할기 적용 → 청크 생성 순입니다. 그다음 임베딩과 벡터 DB 단계가 이어집니다.","an":"12일차 PDF 로드 · 실행 흐름","src":"# 실행 흐름\n#\n# PDF URL\n# ↓\n# PyPDFLoader\n# ↓\n# documents\n# ↓\n# RecursiveCharacterTextSplitter\n# ↓\n# texts(Chunk)\n# ↓\n# Embedding\n# ↓\n# Vector DB\n# =========================================================\n```\n\n```python\n# =========================================================\n# 역할:\n# - 분할된 문서(Chunk) 확인"},{"id":"t3-10","ty":"multi","lv":3,"game":true,"p":"<code>texts[0].metadata<\/code> 출력에 들어 있던 키를 모두 고르세요.","o":["embedding","source","page","score","total_pages"],"a":[1,2,4],"h":"metadata는 PDF 파일 자체에서 읽은 정보입니다. 파일 위치, 페이지 번호, 전체 페이지 수 같은 값이 들어 있고, 벡터나 검색 점수는 아직 계산되지 않았습니다.","w":"source(파일 경로), page, total_pages가 있었습니다. 임베딩 벡터나 검색 점수는 metadata에 들어 있지 않습니다.","an":"12일차 PDF 로드 · texts 출력","src":"print(\"\\n파일 : \" + str(doc.metadata.get(\"source\", \"N/A\")))\n\n print(\"페이지 : \" + str(doc.metadata.get(\"page\", \"N/A\")))\n```\n\n```python\n!pip install -qU gradio\n```\n\n```python\n# =========================================================\n# 역할:\n# - LCEL 기반 PDF RAG 챗봇 + Gradio UI 연결\n# - Retriever + LLM + Prompt 결과를 UI로 출력"}]},{"id":"t4","title":"FAISS 검색기 · LCEL 체인","ref":"12일차 PDF 파일 기반 질의 응답 챗봇 · FAISS · LCEL Chain","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":true,"p":"12일차 PDF RAG에서 청크를 벡터로 바꾸는 데 쓴 모델은?","o":["ko-sbert-nli","bge-small-en","gpt-4o-mini","text-embedding-3-small"],"a":3,"h":"<code>OpenAIEmbeddings(model=...)<\/code> 셀을 보세요. 카톡 챗봇 주석은 이 모델의 특징을 '빠른 속도, 저렴한 비용, RAG에 적합'이라고 정리합니다.","w":"text-embedding-3-small을 썼습니다. ko-sbert-nli·bge-small-en은 11일차 HuggingFace 모델, gpt-4o-mini는 답변용 LLM입니다.","an":"12일차 FAISS Vector DB · OpenAI Embedding 모델 생성","src":"# Embedding Model 선택\n #\n # text-embedding-3-small\n #\n # 특징\n #\n # ✔ 빠른 속도\n # ✔ 저렴한 비용\n # ✔ RAG에 적합\n #\n # ----------------------------------------------------\n # --------------------------------------------------------\n # [Step 2]\n #\n # 생성된 Embedding 객체 반환\n #\n # 이후 PART 5에서"},{"id":"t4-02","ty":"mc","lv":2,"game":false,"p":"<code>as_retriever(search_type='similarity', search_kwargs={'k': 2})<\/code>로 만든 retriever의 검색 결과 문서 수는?","o":["1개","2개","3개","26개"],"a":1,"h":"search_kwargs의 k는 질문과 가장 유사한 문서를 몇 개 가져올지 정합니다. 실행 출력 '검색 문서 수 :'와 함께 확인하세요.","w":"k=2이므로 2개 문서를 가져오며 출력도 '검색 문서 수 : 2'였습니다. 26은 전체 청크 수입니다.","an":"12일차 FAISS · Retriever 테스트","src":"retriever =\n # ----------------------------------------------------\n # 검색 옵션 설정\n #\n # search_kwargs\n #\n # 검색 관련 파라미터 전달\n #\n # ----------------------------------------------------\n# ------------------------------------------------\n # k 의미\n #\n # Top-K 검색 개수\n #\n # 질문과 가장 유사한 문서를\n # 몇 개 가져올 것인지 결정\n #\n # 예)\n #\n # k=3\n #\n # 결과:\n #\n # Document 1\n # Document 2"},{"id":"t4-03","ty":"mc","lv":1,"game":true,"p":"import 셀 주석이 '실무에서는 Chroma보다 더 자주 사용'한다고 적은 벡터 DB는?","o":["FAISS","Chroma","tiktoken","PyPDFLoader"],"a":0,"h":"'(선택) ○○○○ Vector DB' 주석 아래 import 줄에 붙은 설명입니다. 11일차 비교표에서 인메모리·빠른 검색으로 정리된 쪽입니다.","w":"주석은 FAISS를 실무에서 더 자주 쓴다고 적었고, 이 PDF RAG도 FAISS로 벡터 DB를 만듭니다.","an":"12일차 PDF 파일 기반 질의 응답 챗봇 · import","src":"# (선택) FAISS Vector DB\n# =========================================================\n# 실무에서는 Chroma보다 FAISS를 더 자주 사용\nfrom langchain_community.vectorstores import FAISS"},{"id":"t4-04","ty":"mc","lv":2,"game":true,"p":"<code>chain.invoke('자율자동차의 지원은?')<\/code>을 실행하면 질문 문자열은 체인 앞 딕셔너리에서 어디로 전달되나요?","o":["프롬프트에만 직접","retriever에만","retriever와 question 모두","llm에만"],"a":2,"h":"체인 앞의 딕셔너리 <code>{'context': retriever | format_docs, 'question': RunnablePassthrough()}<\/code>는 같은 입력을 각 값에 나눠 보냅니다. 한쪽은 검색에, 다른 쪽은 그대로 전달에 씁니다.","w":"질문은 retriever(검색용)와 RunnablePassthrough(그대로 question)에 모두 전달됩니다. 그래서 프롬프트에 context와 question이 함께 채워집니다.","an":"12일차 LCEL RAG Chain 생성","src":"\"context\" : retriever | format_docs,\n \"question\" : RunnablePassthrough()\n }\n | prompt | llm | StrOutputParser()\n)\n# =========================================================\n# 테스트 실행\n# =========================================================\n\nresponse = chain.invoke(\"자율자동차의 지원은?\")"},{"id":"t4-05","ty":"mc","lv":3,"game":false,"p":"'자율자동차의 지원은?' 검색 결과 첫 문서 metadata가 <code>'page': 9, 'page_label': '10'<\/code>이었습니다. PDF의 몇 쪽 내용인가요?","o":["9쪽","10쪽","1쪽","11쪽"],"a":1,"h":"PyPDFLoader의 page는 0부터 세고, page_label은 사람이 보는 쪽 번호입니다. 앞서 첫 청크가 page 0, page_label '1'이었던 것과 비교하세요.","w":"page 9는 0부터 센 값이라 실제로는 10쪽(page_label '10')입니다. 출처를 사람에게 보여 줄 때 이 차이를 고려해야 합니다.","an":"12일차 Retriever가 찾은 문서 확인","src":"# - Retriever가 찾은 문서 확인\n# - 출처(Source) 확인\n# =========================================================\n# 검색 문서 조회\ndocs =\n# 검색된 문서 수\nprint(f\"검색 문서 수 : {len(docs)}\")\n# 첫 번째 문서 메타데이터 출력\nprint(docs[0].metadata)\n# 첫 번째 문서 내용 일부 출력\nprint(docs[0].page_content[:500])\n```\n\n```python\n# =========================================================\n# 역할:\n# - Chat Prompt 관련 클래스 Import\n# - LangChain 1.3.10 표준 적용"},{"id":"t4-06","ty":"ox","lv":1,"game":true,"p":"이 PDF RAG 체인의 ChatOpenAI는 gpt-4o-mini, temperature=0으로 만들었다.","a":true,"h":"LLM 생성 셀의 주석은 '사용할 모델'과 '동일 입력 → 동일 출력'입니다. 12일차 첫 셀의 챗봇도 같은 모델을 썼습니다.","w":"맞습니다. gpt-4o-mini를 temperature=0으로 써서 같은 질문에 일관된 답을 냅니다.","an":"12일차 LCEL RAG Chain · LLM 생성","src":"llm = ChatOpenAI(\n\n # 사용할 모델\n model=\"gpt-4o-mini\",\n\n # 동일 입력 → 동일 출력\n temperature=0\n)\n# =========================================================\n# Prompt 생성\n# =========================================================\n\nprompt = ChatPromptTemplate.from_template(\n \"\"\"\n 다음 문서를 기반으로 질문에 답변하시오."},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"StrOutputParser로 끝나는 chain.invoke의 결과는 AIMessage 객체라 .content로 꺼내야 한다.","a":false,"h":"<code>result<\/code>만 실행한 셀의 출력을 보면 따옴표로 감싼 문장 하나가 나옵니다. 파서가 체인 끝에서 메시지 객체를 변환해 주기 때문입니다.","w":"틀렸습니다. StrOutputParser가 문자열로 바꿔 주므로 result는 바로 문자열입니다. 파서가 없는 체인이라면 .content가 필요합니다.","an":"12일차 LCEL Chain 실행 · result 출력","src":"\"context\" : retriever | format_docs,\n \"question\": RunnablePassthrough()\n }\n | prompt | llm | StrOutputParser()"},{"id":"t4-08","ty":"match","lv":2,"game":false,"p":"코드와 역할을 연결하세요.","pairs":[["OpenAIEmbeddings","청크를 벡터로 변환"],["FAISS.from_documents","벡터 DB 생성"],["as_retriever","검색 인터페이스 생성"],["format_docs","문서 리스트를 문자열로 변환"]],"h":"FAISS 셀 실행 흐름은 'texts → OpenAIEmbeddings → Vector 생성 → FAISS → Retriever → Similarity Search'입니다. format_docs는 체인 안에서 검색 결과를 프롬프트용으로 바꿉니다.","w":"임베딩 모델이 벡터를 만들고, from_documents가 DB를, as_retriever가 검색기를 만듭니다. format_docs는 page_content를 이어 붙입니다.","an":"12일차 FAISS Vector DB · LCEL Chain","src":"# 벡터 DB 생성 및 리트리버 설정\n embeddings =\n vectordb =\n retriever =\n\n # LLM 및 프롬프트 정의\n llm =\n\n system_prompt = (\n \"아래 제공된 문맥(context)만을 바탕으로 질문에 답하세요.\\n\"\n \"상냥하고 친절하게 한국어로 답변해 주세요.\\n\\n\"\n \"Context:\\n{context}\\n\\n\"\n \"질문: {input}\"\n )\n prompt =\n # 문서들을 하나의 문자열로 합쳐주는 내부 보조 함수\n def format_docs(docs):\n return\n\n # 의존성 에러가 없는 최신 LCEL 파이프라인 체인 구축\n rag_chain =\n\n\n return \"PDF 임베딩 완료! 이제 질문을 입력하세요.\", rag_chain"},{"id":"t4-09","ty":"order","lv":1,"game":false,"p":"LCEL RAG 체인의 실행 흐름대로 나열하세요.","steps":["질문 입력","Retriever로 관련 문서 검색","format_docs로 context 생성","Prompt 생성 후 ChatOpenAI 호출","StrOutputParser로 답변 문자열"],"h":"체인 셀 끝 주석은 '질문 → Retriever → 관련 문서 검색 → format_docs() → Prompt 생성 → ChatOpenAI → StrOutputParser → 최종 답변 출력'입니다.","w":"질문 → 검색 → 문맥 문자열 → 프롬프트와 LLM → 문자열 답변 순입니다.","an":"12일차 LCEL RAG Chain · 실행 흐름","src":"# 벡터 DB 생성 및 리트리버 설정\n embeddings =\n vectordb =\n retriever =\n\n # LLM 및 프롬프트 정의\n llm =\n\n system_prompt = (\n \"아래 제공된 문맥(context)만을 바탕으로 질문에 답하세요.\\n\"\n \"상냥하고 친절하게 한국어로 답변해 주세요.\\n\\n\"\n \"Context:\\n{context}\\n\\n\"\n \"질문: {input}\"\n )\n prompt =\n # 문서들을 하나의 문자열로 합쳐주는 내부 보조 함수\n def format_docs(docs):\n return\n\n # 의존성 에러가 없는 최신 LCEL 파이프라인 체인 구축\n rag_chain =\n\n\n return \"PDF 임베딩 완료! 이제 질문을 입력하세요.\", rag_chain"},{"id":"t4-10","ty":"multi","lv":3,"game":true,"p":"'강의의 주요 내용은 무엇인가?' 질문의 결과에 대해 옳은 것을 모두 고르세요.","o":["검색된 청크 2개를 근거로 답했다","첫 검색 문서는 융합형 직업 내용이었다","PDF 11쪽 전체를 요약했다","AI 윤리 이슈를 언급했다","답변이 영어로만 나왔다"],"a":[0,1,3],"h":"retriever는 k=2라 청크 2개만 context로 들어갑니다. 첫 검색 문서는 '블렌딩' 과정으로 생기는 직업 이야기였고, 답변 후반은 차별과 편견 같은 윤리 문제를 다룹니다.","w":"답변은 검색된 2개 청크(융합형 직업, AI 윤리)에 근거했습니다. 문서 전체를 읽은 것이 아니므로 '주요 내용' 같은 넓은 질문은 일부만 반영될 수 있습니다.","an":"12일차 LCEL RAG Chain · 실행 결과","src":"\"k\": 2\n }\n)\n# =========================================================\n# Retriever 테스트\n# =========================================================\n\ntest_docs = retriever.invoke(\n \"강의의 주요 내용은 무엇인가?\"\n)\n# =========================================================\n# 검색 결과 확인\n# =========================================================\n\nprint(\n f\"검색 문서 수 : {len(test_docs)}\"\n)\n\nprint(\"\\n첫 번째 검색 문서\\n\")"}]},{"id":"t5","title":"System·Human 프롬프트 · LCEL 전환","ref":"12일차 System/Human Prompt · 문제) 기존 코드(보존) LCEL 전환","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"system/human 역할별 메시지로 프롬프트를 만든 메서드는?","o":["from_template","from_messages","from_documents","as_retriever"],"a":1,"h":"실행 흐름 주석은 'system_template 정의 → human_template 정의 → ChatPromptTemplate.○○○○ → LCEL Chain 입력 Prompt 완성'입니다. 인자로 ('system', …), ('human', …) 튜플 리스트를 받습니다.","w":"from_messages는 역할별 메시지 리스트로 프롬프트를 만듭니다. from_template은 문자열 하나로 만들 때 씁니다.","an":"12일차 System / Human Prompt 구성","src":"# 역할:\n# - System / Human Prompt 구성 (LCEL 실무 표준)\n# - RAG용 프롬프트 설계 (SOURCES 포함)\n# - ChatPromptTemplate 생성\n# - LangChain 1.3.10 LCEL 방식 적용\n# =========================================================\n# =========================================================\n# 실행 흐름\n#\n# system_template 정의\n# ↓\n# human_template 정의\n# ↓\n# ChatPromptTemplate.from_messages()\n# ↓\n# LCEL Chain 입력 Prompt 완성"},{"id":"t5-02","ty":"mc","lv":2,"game":true,"p":"system_template은 context에 답이 없을 때 어떻게 말하라고 지시하나요?","o":["추측해서 답하라","웹을 검색하라","질문을 다시 하라","'I don't know'라고 하라"],"a":3,"h":"system_template에는 'You MUST base your answer ONLY on the given context'와 'If the answer is not contained in the context, say …' 문장이 있습니다. 근거가 없으면 모른다고 인정하게 하는 규칙입니다.","w":"답이 context에 없으면 'I don't know'라고 말하게 합니다. 지어낸 답(환각)을 막는 RAG 프롬프트의 핵심 규칙입니다.","an":"12일차 System Prompt (RAG 규칙 정의)","src":"# System Prompt (RAG 규칙 정의)\n# =========================================================\n\nsystem_template = \"\"\"\nUse the following pieces of context to answer the user's question shortly.\n\nYou MUST base your answer ONLY on the given context.\n\nIf the answer is not contained in the context, say \"I don't know\"."},{"id":"t5-03","ty":"mc","lv":1,"game":false,"p":"'기존 코드(보존)'에서 LCEL로 바꾼 legacy 체인 클래스는?","o":["RetrievalQAWithSourcesChain","ConversationChain","LLMChain","SequentialChain"],"a":0,"h":"문제 셀 주석 3번째 줄이 '○○○ → LCEL 전환'입니다. 이름에 검색(Retrieval), 질의응답(QA), 출처(Sources)가 모두 들어 있습니다.","w":"기존 코드는 RetrievalQAWithSourcesChain.from_chain_type으로 출처 포함 QA 체인을 만들었고, 이를 LCEL 파이프로 다시 썼습니다.","an":"12일차 문제) 기존 코드 (보존)","src":"문제) 다음 기존 코드 (보존)를 참고하여 코드를 완성하시오.\n\n```python\n# =========================================================\n# 역할:\n# - ChatOpenAI 생성\n# - Retriever + Prompt + LLM LCEL 연결\n# - RetrievalQAWithSourcesChain → LCEL 전환\n# =========================================================\n# =========================================================\n# 실행 흐름\n#\n# 질문 입력\n# ↓\n# Retriever (FAISS / Chroma)\n# ↓\n# 문서 검색"},{"id":"t5-04","ty":"mc","lv":2,"game":true,"p":"기존 <code>result = chain(query)<\/code> 호출을 LCEL 방식으로 바꾼 코드는?","o":["chain.run(query)","chain.call(query)","chain.invoke(query)","chain.predict(query)"],"a":2,"h":"LCEL에서는 Retriever, 프롬프트, 체인 모두 같은 실행 메서드로 부릅니다. 같은 노트북에서 <code>retriever.○○○○(query)<\/code>로 문서를 가져온 것을 떠올리세요.","w":"LCEL 체인은 chain.invoke(query)로 실행합니다. 체인을 함수처럼 직접 호출하던 방식은 legacy 방식입니다.","an":"12일차 기존 코드 (보존) · LCEL Chain 실행","src":"query = \"인공지능으로 인한 이슈는?\"\n# =========================================================\n# 1. 답변 생성 (LCEL)\n# =========================================================\n\nresult = chain.invoke(query)\n\nprint(\"\\n====================\")\nprint(\"답변\")\nprint(\"====================\")\nprint(result)\n# =========================================================\n# 2. Source 문서 직접 검색 (실무 방식)"},{"id":"t5-05","ty":"mc","lv":3,"game":false,"p":"LCEL 체인은 <code>return_source_documents=True<\/code> 옵션이 없습니다. 노트북은 출처 문서를 어떻게 얻었나요?","o":["retriever.invoke(query)로 다시 검색","StrOutputParser에 sources 인자","prompt에 SOURCES 변수 추가","llm.invoke로 문서 요청"],"a":0,"h":"'Source 문서 직접 검색 (실무 방식)' 주석 아래 코드를 보세요. 체인과 별도로 검색기를 한 번 더 호출해 문서의 metadata에서 파일과 페이지를 꺼냅니다.","w":"retriever.invoke(query)로 같은 질문을 다시 검색해 doc.metadata의 source·page를 출력했습니다. 체인 결과는 문자열이라 문서 정보가 없기 때문입니다.","an":"12일차 Source 출력 · retriever.invoke","src":"# - RAG 결과 출력\n# - Retriever 기반 source_documents 확인\n# - 문서 내용 / 파일 / 페이지 출력\n# =========================================================\n# =========================================================\n# 실행 흐름\n#\n# query 입력\n# ↓\n# chain.invoke(query) → 답변 생성\n# ↓\n# retriever.invoke(query) → source 문서 검색\n# ↓\n# doc.page_content / metadata 출력"},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"이 프롬프트에서 system 메시지에는 {context}, human 메시지에는 {question} 변수가 들어 있다.","a":true,"h":"system_template 가운데에 구분선 아래 변수가 하나 있고, human_template은 'Question:' 다음에 변수가 하나 있습니다.","w":"맞습니다. 검색 문서는 system 쪽 {context}, 사용자 질문은 human 쪽 {question}에 들어갑니다.","an":"12일차 System / Human Prompt 구성","src":"{context}\n\nYou MUST answer in Korean and in Markdown format.\n\"\"\"\n# =========================================================\n# Human Prompt (사용자 질문)\n# =========================================================\n\nhuman_template = \"\"\"\nQuestion:\n{question}"},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"LCEL로 바꿀 때도 chain_type='stuff' 같은 legacy 옵션을 체인에 그대로 넘겨야 한다.","a":false,"h":"새 코드는 <code>retriever | format_docs<\/code>로 검색 문서를 직접 합쳐 프롬프트에 넣습니다. 새 코드 어디에도 chain_type 인자가 없습니다.","w":"틀렸습니다. LCEL에서는 format_docs가 문서를 하나의 문자열로 합쳐 context에 넣으므로 chain_type 옵션이 필요 없습니다.","an":"12일차 문제) 기존 코드 → LCEL 전환","src":"from langchain.chains import RetrievalQAWithSourcesChain\n\nchain_type_kwargs = {'prompt': prompt}\n\nllm = ChatOpenAI(model_name='gpt-3.5-turbo', temperature=0)\n\nchain = RetrievalQAWithSourcesChain.from_chain_type(\n llm=llm,\n chain_type='stuff',\n retriever=retriever,\n return_source_documents=True,\n chain_type_kwargs=chain_type_kwargs\n)"},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"기존 코드 요소와 LCEL 버전의 대응을 연결하세요.","pairs":[["langchain.chat_models의 ChatOpenAI","langchain_openai의 ChatOpenAI"],["model_name='gpt-3.5-turbo'","model='gpt-4o-mini'"],["chain(query)","chain.invoke(query)"],["chain_type_kwargs의 prompt","파이프로 연결한 prompt"]],"h":"보존된 기존 코드(주석 블록)와 그 아래 새 코드를 줄 단위로 비교하세요. import 위치, 모델 인자 이름, 호출 방식, 프롬프트 전달 방식이 바뀌었습니다.","w":"패키지는 langchain_openai로, 모델은 gpt-4o-mini로, 호출은 invoke로 바뀌었고 프롬프트는 <code>| prompt |<\/code>로 파이프에 직접 연결합니다.","an":"12일차 문제) 기존 코드 (보존) · LCEL 전환","src":"# 기존 코드 (보존)\n# =========================================================\n\n'''\nfrom langchain.chat_models import ChatOpenAI\nfrom langchain.chains import RetrievalQAWithSourcesChain\n\nchain_type_kwargs = {'prompt': prompt}\n\nllm = ChatOpenAI(model_name='gpt-3.5-turbo', temperature=0)\n\nchain = RetrievalQAWithSourcesChain.from_chain_type("},{"id":"t5-09","ty":"order","lv":1,"game":false,"p":"역할별 프롬프트를 만들어 답변까지 가는 흐름대로 나열하세요.","steps":["system_template 정의","human_template 정의","ChatPromptTemplate.from_messages()","LCEL 체인에 연결","ChatOpenAI가 답변 생성"],"h":"System/Human 프롬프트 셀 맨 위 실행 흐름 주석을 따라가세요. 마지막은 'Markdown + SOURCES 포함' 답변 생성입니다.","w":"system → human 템플릿 정의 → from_messages → 체인 연결 → LLM 답변 순입니다.","an":"12일차 System / Human Prompt · 실행 흐름","src":"# - RAG용 프롬프트 설계 (SOURCES 포함)\n# - ChatPromptTemplate 생성\n# - LangChain 1.3.10 LCEL 방식 적용\n# =========================================================\n# =========================================================\n# 실행 흐름\n#\n# system_template 정의\n# ↓\n# human_template 정의\n# ↓\n# ChatPromptTemplate.from_messages()\n# ↓\n# LCEL Chain 입력 Prompt 완성\n# ↓\n# ChatOpenAI 입력\n# ↓\n# 답변 생성 (Markdown + SOURCES 포함)"},{"id":"t5-10","ty":"multi","lv":3,"game":true,"p":"system_template의 규칙으로 옳은 것을 모두 고르세요.","o":["context만 근거로 답한다","반드시 영어로 답한다","관련 있으면 SOURCES를 포함한다","한국어 Markdown으로 답한다","답이 없으면 일반 지식으로 보충"],"a":[0,2,3],"h":"system_template은 'ONLY on the given context', 'Always include SOURCES when relevant', 'You MUST answer in Korean and in Markdown format' 문장으로 되어 있습니다. 답이 없을 때의 규칙도 따로 있습니다.","w":"context 근거, SOURCES 포함, 한국어 Markdown이 맞습니다. 답이 없으면 보충하지 말고 'I don't know'라고 해야 합니다.","an":"12일차 System Prompt (RAG 규칙 정의)","src":"system_template = \"\"\"\nUse the following pieces of context to answer the user's question shortly.\n\nYou MUST base your answer ONLY on the given context.\n\nIf the answer is not contained in the context, say \"I don't know\".\n\nAlways include SOURCES when relevant.\n\n----------------\n{context}\n\nYou MUST answer in Korean and in Markdown format."}]},{"id":"t6","title":"Gradio PDF 챗봇 · 업로드형","ref":"12일차 Gradio PDF 챗봇 · Colab + Gradio pdf 기반 QA 챗봇","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"Gradio 6.x 챗봇에 맞춰 바꾼 채팅 기록 형식은?","o":["(질문, 답변) 튜플","{role, content} 딕셔너리","문자열 한 줄","JSON 파일 경로"],"a":1,"h":"'변경 사항' 주석은 기존 tuple 기반 기록을 'Gradio 6.x messages format'으로 바꾼다고 설명합니다. user와 assistant를 키로 구분하는 형식입니다.","w":"{'role': 'user'/'assistant', 'content': …} 딕셔너리 형식입니다. 기존 (message, bot_message) 튜플은 legacy 방식으로 보존만 했습니다.","an":"12일차 Gradio PDF 챗봇 · 변경 사항","src":"# 변경 사항 (실무 적용 핵심)\n# =========================================================\n# 기존: tuple 기반 chat_history\n# (\"user\", \"text\")\n# (\"bot\", \"text\")\n# 변경: Gradio 6.x messages format 적용\n# {\"role\": \"user\", \"content\": \"...\"}\n# {\"role\": \"assistant\", \"content\": \"...\"}\n# 이유:\n# - Gradio Chatbot이 messages mode 강제 환경\n# - tuple 방식은 postprocess 단계에서 에러 발생"},{"id":"t6-02","ty":"mc","lv":2,"game":true,"p":"튜플 대신 messages 형식으로 바꾼 이유로 주석에 적힌 것은?","o":["응답 속도가 빨라서","토큰을 아껴서","튜플은 postprocess에서 에러","출처를 넣으려고"],"a":2,"h":"'이유:' 주석 두 줄은 'Gradio Chatbot이 messages mode 강제 환경'이라는 것과, 튜플 방식이 특정 처리 단계에서 문제를 일으킨다는 것입니다.","w":"Gradio Chatbot이 messages 모드를 강제하므로 튜플 방식은 postprocess 단계에서 에러가 납니다. 속도나 토큰과는 관계없습니다.","an":"12일차 Gradio PDF 챗봇 · 변경 사항","src":"# 이유:\n# - Gradio Chatbot이 messages mode 강제 환경\n# - tuple 방식은 postprocess 단계에서 에러 발생"},{"id":"t6-03","ty":"mc","lv":1,"game":false,"p":"업로드형 챗봇에서 PDF 파일을 받는 컴포넌트는?","o":["gr.File(file_types=['.pdf'])","gr.Textbox","gr.Chatbot","gr.Markdown"],"a":0,"h":"UI 주석 '7-2. PDF Upload'에 해당하는 컴포넌트입니다. 카톡 챗봇 완성 코드에서는 label='PDF 업로드'와 허용 확장자를 함께 지정했습니다.","w":"gr.File에 file_types=['.pdf']를 주어 PDF만 업로드하게 합니다. Textbox는 입력, Chatbot은 대화, Markdown은 제목 표시용입니다.","an":"12일차 Colab + Gradio pdf 기반 QA 챗봇 · GRADIO UI","src":"gr.Markdown(\"# 텔레그램 스타일 PDF Q&A 챗봇\")\n gr.Markdown(\"PDF를 업로드하고 자유롭게 질문하세요! (대화는 **10초 후 자동 삭제**됩니다.)\")\n\n qa_state = gr.State(None)\n\n with gr.Row():\n with gr.Column(scale=3):\n file_input = gr.File(label=\" PDF 업로드\", file_types=[\".pdf\"])\n status_output = gr.Markdown(\"상태: PDF 업로드 대기 중...\")\n\n with gr.Column(scale=7):\n chatbot = gr.Chatbot(elem_classes=\"chatbot\")\n msg = gr.Textbox(label=\"질문을 입력하세요....\")"},{"id":"t6-04","ty":"mc","lv":2,"game":true,"p":"build_rag 안에서 retriever와 rag_chain을 <code>global<\/code>로 선언한 이유는?","o":["실행 속도를 높이려고","예외를 숨기려고","변수를 지우려고","respond와 상태를 공유하려고"],"a":3,"h":"코드 4번 블록은 'GLOBAL STATE (RAG 저장용)'로 두 변수를 None으로 만들고, build_rag의 global 줄 주석은 '전역 상태 공유'입니다. 질문에 답하는 함수는 별도로 있습니다.","w":"PDF 업로드 때 만든 검색기·체인을 respond 함수가 다시 쓰려면 전역 변수에 저장해야 합니다. global이 없으면 함수 안 지역 변수로 끝나 버립니다.","an":"12일차 Colab + Gradio pdf 기반 QA 챗봇 · GLOBAL STATE","src":"# 4. GLOBAL STATE (RAG 저장용)\n# =========================================================\nretriever = None # Vector 검색기\nrag_chain = None # LCEL Chain\n# =========================================================\n# 5. PDF → VECTOR DB → LCEL RAG 생성\n# =========================================================\ndef build_rag(pdf_file):\n global # 전역 상태 공유\n # -----------------------------\n # 5-1. PDF 로드"},{"id":"t6-05","ty":"mc","lv":3,"game":true,"p":"출처 문자열 형식이 <code>[{i+1}] {source} ({page})<\/code>일 때, enumerate의 첫 문서가 page 9이면 어떻게 표시되나요?","o":["[0] 파일경로 (9)","[1] 파일경로 (10)","[1] 파일경로 (9)","[2] 파일경로 (9)"],"a":2,"h":"enumerate의 i는 0부터 시작하고 코드는 <code>i+1<\/code>을 씁니다. page 값은 metadata를 그대로 꺼내 쓰며 1을 더하지 않습니다.","w":"번호는 i+1이라 [1], 페이지는 metadata 값 그대로 (9)입니다. 사람이 보는 쪽 번호와 1 차이가 날 수 있다는 점에 주의합니다.","an":"12일차 Gradio PDF 챗봇 · source 문자열 구성","src":"# 3. source 문자열 구성\n # -----------------------------------------------------\n sources = \"\"\n for i, doc in enumerate(docs):\n sources += f\"\\n\\n[{i+1}] {doc.metadata.get('source', 'N/A')} ({doc.metadata.get('page','N/A')})\""},{"id":"t6-06","ty":"ox","lv":1,"game":true,"p":"업로드형 챗봇의 build_rag 함수는 준비가 끝나면 'RAG READY'를 반환한다.","a":true,"h":"build_rag 마지막 줄의 return 문을 보세요. 반환된 문자열은 업로드 이벤트의 출력으로 화면에 표시될 수 있습니다.","w":"맞습니다. 벡터 DB와 체인을 다 만든 뒤 'RAG READY'를 반환해 준비 완료를 알립니다.","an":"12일차 Colab + Gradio pdf 기반 QA 챗봇 · build_rag","src":"# 5-9. LCEL Chain 구성\n # -----------------------------\n rag_chain =\n return \"RAG READY\""},{"id":"t6-07","ty":"ox","lv":2,"game":true,"p":"Gradio PDF 챗봇의 respond는 chain.invoke 결과만 쓰고 retriever는 따로 호출하지 않는다.","a":false,"h":"respond 안 주석은 '1. LCEL Chain 실행 (답변 생성)', '2. Retriever 실행 (source 문서 검색)', '3. source 문자열 구성' 순입니다.","w":"틀렸습니다. 답변은 chain.invoke로, 출처는 retriever.invoke로 따로 얻어 bot_message = result + sources로 합칩니다.","an":"12일차 Gradio PDF 챗봇 · respond()","src":"# 1. LCEL Chain 실행 (답변 생성)\n # -----------------------------------------------------\n result = chain.invoke(message)\n # -----------------------------------------------------\n # 2. Retriever 실행 (source 문서 검색)\n # -----------------------------------------------------\n docs = retriever.invoke(message)\n # -----------------------------------------------------\n # 3. source 문자열 구성"},{"id":"t6-08","ty":"match","lv":2,"game":false,"p":"업로드형 챗봇 흐름 단계와 사용한 구성 요소를 연결하세요.","pairs":[["PDF 업로드","gr.File"],["페이지 로드","PyPDFLoader"],["벡터 DB 생성","FAISS"],["대화 표시","gr.Chatbot"]],"h":"FLOW DIAGRAM 주석은 'PDF 업로드 → PyPDFLoader → Text Split → Embedding → FAISS Vector DB → Retriever → LCEL Chain → Prompt + LLM → Gradio Chat UI'입니다.","w":"업로드는 gr.File, 로드는 PyPDFLoader, 벡터 DB는 FAISS, 대화 화면은 gr.Chatbot이 맡습니다.","an":"12일차 Colab + Gradio pdf 기반 QA 챗봇 · FLOW DIAGRAM","src":"# [FLOW DIAGRAM]\n#\n# PDF 업로드\n# ↓\n# PyPDFLoader\n# ↓\n# Text Split (chunking)\n# ↓\n# Embedding (OpenAI)\n# ↓\n# FAISS Vector DB 생성\n# ↓\n# Retriever (Top-K 검색)\n# ↓\n# LCEL Chain 구성\n# ↓\n# Prompt + LLM (GPT)\n# ↓\n# Response 생성\n# ↓\n# Gradio Chat UI (Kakao Style)"},{"id":"t6-09","ty":"order","lv":1,"game":false,"p":"Gradio PDF 챗봇 respond의 처리 순서대로 나열하세요.","steps":["chain.invoke(message)로 답변 생성","retriever.invoke(message)로 문서 검색","sources 문자열 구성","bot_message = result + sources","chat_history에 user·assistant 추가"],"h":"respond 안 주석 번호 1~6을 따라가세요. 마지막은 입력창을 비우고 기록을 반환하는 단계입니다.","w":"답변 생성 → 출처 검색 → 출처 문자열 → 최종 메시지 → 기록 추가 순입니다.","an":"12일차 Gradio PDF 챗봇 · respond()","src":"# - Retriever + LLM + Prompt 결과를 UI로 출력\n# - Gradio 6.x messages format 호환 처리\n# =========================================================\n# =========================================================\n# 실행 흐름\n#\n# 사용자 입력 (message)\n# ↓\n# chain.invoke(message)\n# ↓\n# LLM 답변 생성 (LCEL)\n# ↓\n# retriever.invoke(message)\n# ↓\n# 관련 문서 검색 (source_documents)\n# ↓\n# bot_message 구성 (answer + sources)"},{"id":"t6-10","ty":"multi","lv":3,"game":true,"p":"업로드형 build_rag의 빈칸 구성으로 FLOW와 주석에 맞는 것을 모두 고르세요.","o":["PyPDFLoader로 업로드 PDF 로드","Chroma에 디스크 저장","FAISS 벡터 DB 생성","상위 3개 검색 retriever","Whisper로 음성 변환"],"a":[0,2,3],"h":"import 셀은 FAISS와 PyPDFLoader를 가져오고, 빈칸 주석은 '업로드된 PDF 경로', 'vector DB 생성', '상위 3개 검색'입니다. 음성 처리나 Chroma는 이 셀에 등장하지 않습니다.","w":"업로드 PDF를 PyPDFLoader로 읽고, FAISS로 DB를 만들고, k=3 retriever를 만듭니다. Chroma와 Whisper는 이 셀에서 쓰지 않습니다.","an":"12일차 Colab + Gradio pdf 기반 QA 챗봇 · build_rag","src":"# [FLOW DIAGRAM]\n#\n# PDF 업로드\n# ↓\n# PyPDFLoader\n# ↓\n# Text Split (chunking)\n# ↓\n# Embedding (OpenAI)\n# ↓\n# FAISS Vector DB 생성\n# ↓\n# Retriever (Top-K 검색)\n# ↓\n# LCEL Chain 구성\n# ↓\n# Prompt + LLM (GPT)\n# ↓\n# Response 생성\n# ↓\n# Gradio Chat UI (Kakao Style)\n# =========================================================\n# =========================================================\n# 2. IMPORT"}]},{"id":"t7","title":"카카오톡 스타일 챗봇","ref":"12일차 문제) 카카오톡 대화창 · 카톡 말풍선 CSS","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"카톡 챗봇에서 load_pdf 함수가 맡은 역할은?","o":["PDF를 Document 리스트로 읽기","Document를 청크로 분할","임베딩 모델 생성","검색기 생성"],"a":0,"h":"load_pdf 설명문은 '이 함수는 \"PDF를 읽는 역할만\" 수행한다', 'Chunk 분할은 다음 PART에서 진행한다'고 적었습니다.","w":"load_pdf는 업로드한 PDF를 페이지 단위 Document 리스트로 읽기만 합니다. 분할은 split_documents가 맡습니다.","an":"12일차 카카오톡 대화창 · load_pdf()","src":"load_pdf()\n ============================================================\n 함수 역할\n ============================================================\n 사용자가 Gradio에서 업로드한 PDF 파일을 읽어\n LangChain Document 객체(List[Document])를 생성한다.\n 이 함수는 \"PDF를 읽는 역할만\" 수행한다.\n 즉,\n PDF\n ↓\n LangChain Document\n 까지만 수행하며,\n Chunk 분할은 다음 PART에서 진행한다."},{"id":"t7-02","ty":"mc","lv":2,"game":true,"p":"create_rag_chain의 프롬프트가 {context}와 {input} 변수를 쓰므로, LCEL 딕셔너리에서 질문을 받는 키 이름은?","o":["question","query","input","message"],"a":2,"h":"LCEL 체인의 딕셔너리 키 이름은 프롬프트 템플릿의 변수 이름과 같아야 값이 채워집니다. 이 함수의 프롬프트 주석은 '{input} 사용자 질문'이라고 적었습니다.","w":"프롬프트가 {input}을 쓰므로 키도 'input'이어야 합니다. 앞 셀들처럼 'question'을 쓰면 변수가 채워지지 않습니다.","an":"12일차 카카오톡 대화창 · create_rag_chain()","src":"# LLM 및 프롬프트 정의\n llm =\n\n system_prompt = (\n \"아래 제공된 문맥(context)만을 바탕으로 질문에 답하세요.\\n\"\n \"상냥하고 친절하게 한국어로 답변해 주세요.\\n\\n\"\n \"Context:\\n{context}\\n\\n\"\n \"질문: {input}\"\n )\n prompt =\n # 문서들을 하나의 문자열로 합쳐주는 내부 보조 함수\n def format_docs(docs):\n return\n\n # 의존성 에러가 없는 최신 LCEL 파이프라인 체인 구축\n rag_chain =\n\n\n return \"PDF 임베딩 완료! 이제 질문을 입력하세요.\", rag_chain"},{"id":"t7-03","ty":"mc","lv":1,"game":true,"p":"카톡 챗봇의 create_rag_chain에서 지정한 GPT 모델은?","o":["gpt-4o-mini","gpt-3.5-turbo","text-embedding-3-small","gpt-4o"],"a":1,"h":"9-1. LLM 생성 블록의 model 인자를 보세요. 주석은 이 모델을 '비용과 성능 균형이 좋은 모델'이라고 설명합니다. 앞 셀들과는 다른 모델입니다.","w":"create_rag_chain은 gpt-3.5-turbo를 temperature=0으로 씁니다. text-embedding-3-small은 임베딩 모델입니다.","an":"12일차 카카오톡 대화창 · create_rag_chain() 9-1","src":"# 검색된 Context를 기반으로\n # 최종 답변을 생성한다.\n # --------------------------------------------------------\n llm = ChatOpenAI(\n # ----------------------------------------------------\n # 사용할 GPT 모델\n #\n # 비용과 성능 균형이 좋은 모델\n # ----------------------------------------------------\n model=\"gpt-3.5-turbo\",\n# ----------------------------------------------------\n # temperature\n #\n # 답변의 창의성 조절\n #\n # 0"},{"id":"t7-04","ty":"mc","lv":2,"game":true,"p":"카톡 챗봇 respond에서 rag_chain이 None일 때(PDF 미업로드) 하는 일은?","o":["오류를 띄운다","빈 답변을 보낸다","업로드를 강제한다","일반 GPT로 답한다"],"a":3,"h":"respond 안 두 갈래의 주석은 'PDF 없으면 ○○ GPT'와 'PDF 있으면 RAG'입니다. PDF가 없을 때도 대화가 끊기지 않게 하는 설계입니다.","w":"rag_chain이 None이면 LLM을 직접 불러 일반 GPT로 답하고, PDF가 있으면 RAG 답변에 출처를 붙입니다.","an":"12일차 카카오톡 대화창 · respond()","src":"def respond(\n message,\n chat_history\n):\n\n global rag_chain\n global retriever\n\n\n # ==============================\n # PDF 없으면 일반 GPT\n # ==============================\n\n if rag_chain is None:\n\n llm =\n\n result =\n\n answer =\n\n\n # ==============================\n # PDF 있으면 RAG\n # ==============================\n\n else:\n\n result =\n\n answer =\n\n\n docs =\n\n\n sources = \"\\n\\n출처\\n\""},{"id":"t7-05","ty":"mc","lv":3,"game":false,"p":"Gradio 6에서 css 인자가 Blocks 생성자에서 launch()로 옮겨졌습니다. 카톡 코드가 CSS를 넘긴 방법은?","o":["gr.Chatbot(css=kakao_css)","demo.launch(..., css=kakao_css)","gr.Markdown(kakao_css)","gr.Textbox(css=kakao_css)"],"a":1,"h":"텔레그램 셀은 <code>gr.Blocks(css=...)<\/code>를 써서 'The parameters have been moved from the Blocks constructor to the launch() method in Gradio 6.0: css' 경고를 받았습니다. 카톡 코드 마지막 실행 줄을 보세요.","w":"카톡 코드는 <code>demo.launch(share=True, css=kakao_css)<\/code>로 CSS를 넘겨 Gradio 6 방식에 맞췄습니다.","an":"12일차 카카오톡 대화창 · Gradio · 텔레그램 셀 경고","src":"demo.launch(\n share=True,\n css=kakao_css\n)\n```\n개선된 챗봇\n - 텔레그램 스타일\n - 속도향상\n 1. st.rerun()없이 세션 상태로 처리 -> append()\n 2. QA 체인 한번만 생성 -> 불필요한 재연산 제거\n#다음 대화 시 이전 대화 사라지는 텔레그램\n```python\n!pip install -q streamlit langchain langchain-community langchain-openai chromadb pypdf pyngrok\n```\n```python\nimport time\nimport gradio as gr\nfrom langchain_openai import ChatOpenAI"},{"id":"t7-06","ty":"ox","lv":1,"game":true,"p":"카톡 스타일 gr.Chatbot에는 layout='bubble'과 elem_classes=['kakao-chat']을 지정했다.","a":true,"h":"카톡 Gradio 블록의 chatbot 생성 인자는 height, layout, render_markdown, elem_classes입니다. elem_classes는 CSS에서 선택자로 쓸 클래스 이름입니다.","w":"맞습니다. 말풍선 레이아웃과 CSS 클래스 'kakao-chat'을 지정해 카톡 모양을 입힙니다.","an":"12일차 카카오톡 대화창 · Gradio","src":"height=700,\n layout=\"bubble\",\n render_markdown=False,\n elem_classes=[\n \"kakao-chat\"\n ]\n )\n msg = gr.Textbox(\n label=None,\n placeholder=\"메시지를 입력하세요\",\n elem_classes=[\n \"kakao-input\"\n ]\n )\n file_input.upload(\n fn=process_pdf,\n inputs=file_input,\n outputs=status\n )\n msg.submit(\n fn=respond,\n inputs=[\n msg,\n chatbot\n ],\n outputs=[\n msg,\n chatbot\n ]\n )\ndemo.launch(\n share=True,\n css=kakao_css"},{"id":"t7-07","ty":"ox","lv":2,"game":true,"p":"카톡 챗봇의 create_rag_chain은 체인 끝에 StrOutputParser를 붙여 문자열을 반환한다.","a":false,"h":"9-4. LCEL Chain 구성 블록은 딕셔너리 다음에 '# Prompt 적용 | prompt'와 '# GPT 실행 | llm'만 있습니다. 파서가 없으면 결과는 메시지 객체입니다.","w":"틀렸습니다. 이 체인은 prompt | llm에서 끝나므로 결과가 메시지 객체이고, 답변 텍스트는 .content로 꺼내야 합니다.","an":"12일차 카카오톡 대화창 · create_rag_chain() 9-4","src":"# Prompt 적용\n |\n prompt\n # GPT 실행\n |\n llm\n )\n # ========================================================\n # 9-5. Chain 반환\n # ========================================================\n print(\"=\" * 60)\n print(\"LCEL RAG Chain 생성 완료\")\n print(\"=\" * 60)\n return rag_chain"},{"id":"t7-08","ty":"match","lv":1,"game":false,"p":"카톡 챗봇의 함수와 역할을 연결하세요.","pairs":[["split_documents","Document를 Chunk로 분할"],["create_embeddings","임베딩 모델 객체 생성"],["create_vectorstore","FAISS 벡터 DB 생성"],["create_retriever","검색 인터페이스 생성"]],"h":"PDF_AI_CHATBOT 구조도는 main() 아래에 함수를 하나씩 나열합니다. 함수 이름의 동사와 목적어가 곧 역할입니다.","w":"split_documents는 청크 분할, create_embeddings는 임베딩 모델, create_vectorstore는 FAISS DB, create_retriever는 검색기를 만듭니다.","an":"12일차 카카오톡 대화창 · 함수 구조","src":"분할된 Document Chunk와 Embedding Model을 이용하여\n FAISS Vector Database를 생성한다.\n RAG 시스템에서 FAISS는\n \"문서 저장소 + 빠른 유사도 검색 엔진\"\n 역할을 수행한다.\n ============================================================\n Parameter\n ============================================================\n docs : list[Document]\n split_documents() 함수에서 생성한\n Chunk Document 리스트\n embeddings : OpenAIEmbeddings\n create_embeddings() 함수에서 생성한"},{"id":"t7-09","ty":"order","lv":2,"game":false,"p":"카톡 챗봇의 함수 실행 흐름대로 나열하세요.","steps":["load_pdf()","split_documents()","create_vectorstore()","create_retriever()","create_rag_chain()"],"h":"흐름 다이어그램은 'PDF 업로드 → load_pdf → split_documents → create_embeddings → create_vectorstore → create_retriever → create_rag_chain → respond'입니다.","w":"읽기 → 분할 → (임베딩) → 벡터 DB → 검색기 → 체인 순입니다. 각 함수의 반환값이 다음 함수의 입력이 됩니다.","an":"12일차 카카오톡 대화창 · Flow Diagram","src":"PDF 업로드\n │\n ▼\nload_pdf()\n │\n ▼\nsplit_documents()\n │\n ▼\ncreate_embeddings()\n │\n ▼\ncreate_vectorstore()\n │\n ▼\ncreate_retriever()\n │\n ▼\ncreate_rag_chain()\n │\n ▼\nrespond()"},{"id":"t7-10","ty":"multi","lv":3,"game":true,"p":"카톡 스타일 CSS의 '적용 내용' 주석에 적힌 것을 모두 고르세요.","o":["메시지 10초 후 삭제","사용자 메시지 오른쪽 정렬","둥근 말풍선","음성 입력 버튼","AI 메시지 왼쪽 정렬"],"a":[1,2,4],"h":"CSS 역할 주석은 기본 Chatbot 화면을 카톡 말풍선 UI로 바꾼다고 하며, 정렬·말풍선·여백·배경 다섯 항목을 체크 표시로 나열합니다.","w":"사용자 오른쪽·AI 왼쪽 정렬, 둥근 말풍선(그리고 여백·배경)이 적용 내용입니다. 자동 삭제는 텔레그램 챗봇 기능입니다.","an":"12일차 카카오톡 대화창 · KakaoTalk Style CSS","src":"# CSS 역할\n# ------------------------------------------------------------\n#\n# Gradio 기본 Chatbot 화면을\n# 카카오톡 스타일의 말풍선 UI로 변경한다.\n#\n#\n# 적용 내용\n#\n# ✔ 사용자 메시지 오른쪽 정렬\n# ✔ AI 메시지 왼쪽 정렬\n# ✔ 둥근 말풍선\n# ✔ 메시지 여백\n# ✔ 채팅창 배경"}]},{"id":"t8","title":"텔레그램 스타일 자동 삭제","ref":"12일차 개선된 챗봇 · 텔레그램 스타일 챗봇","qs":[{"id":"t8-01","ty":"mc","lv":1,"game":true,"p":"텔레그램 챗봇 respond가 화면을 여러 번 갱신하려고 return 대신 쓴 키워드는?","o":["yield","await","break","raise"],"a":0,"h":"respond는 답변을 먼저 화면에 보여 주고, 잠시 기다린 뒤, 기록을 지운 화면을 다시 보여 줍니다. 함수를 끝내지 않고 중간 결과를 여러 번 내보내는 제너레이터 키워드입니다.","w":"yield로 중간 결과를 여러 번 내보내면 Gradio가 그때마다 화면을 갱신합니다. return은 한 번만 반환하고 함수가 끝납니다.","an":"12일차 다음 대화 시 이전 대화 사라지는 텔레그램 · respond()","src":"# 3. 먼저 답변을 화면에 즉시 표시\n yield\n\n # 4. 정확히 2초 동안 대기\n time.sleep(2)\n\n # 5. 대화 기록을 완전히 비워서 화면에서 삭제 (Gradio 6용 빈 리스트 전달)\n chat_history =\n yield\n# =========================\n# UI (요청하신 대로 아무 옵션도 넣지 않음)\n# =========================\nwith gr.Blocks() as demo:\n\n gr.Markdown(\"# 텔레그램 CHATBOT\")\n\n chatbot = gr.Chatbot() # 옵션 없이 원본 유지\n\n msg = gr.Textbox()\n\n msg.submit(\n respond,"},{"id":"t8-02","ty":"mc","lv":1,"game":true,"p":"첫 텔레그램 예제는 답변을 표시한 뒤 몇 초 기다렸다가 대화를 지우나요?","o":["10초","1초","2초","5초"],"a":2,"h":"주석 '4. 정확히 ○초 동안 대기' 아래에 <code>time.sleep(…)<\/code>이 있습니다. PDF Q&A 텔레그램 챗봇의 대기 시간과는 다릅니다.","w":"time.sleep(2)로 2초 기다린 뒤 기록을 비웁니다. 10초는 뒤의 PDF Q&A 텔레그램 챗봇 값입니다.","an":"12일차 다음 대화 시 이전 대화 사라지는 텔레그램 · respond()","src":"# 3. 먼저 답변을 화면에 즉시 표시\n yield\n\n # 4. 정확히 2초 동안 대기\n time.sleep(2)\n\n # 5. 대화 기록을 완전히 비워서 화면에서 삭제 (Gradio 6용 빈 리스트 전달)\n chat_history =\n yield\n# =========================\n# UI (요청하신 대로 아무 옵션도 넣지 않음)\n# =========================\nwith gr.Blocks() as demo:\n\n gr.Markdown(\"# 텔레그램 CHATBOT\")"},{"id":"t8-03","ty":"mc","lv":2,"game":true,"p":"대화를 화면에서 지우려고 chat_history에 넣는 값은?","o":["None","빈 리스트 []","0","False"],"a":1,"h":"주석 '5. 대화 기록을 완전히 비워서 화면에서 삭제 (Gradio 6용 ○ ○○○ 전달)'을 보세요. 초기화 버튼의 lambda도 같은 값을 돌려줬습니다.","w":"빈 리스트 []를 넘기면 채팅창이 비워집니다. 기본 챗봇의 초기화 버튼(lambda: [])과 같은 원리입니다.","an":"12일차 다음 대화 시 이전 대화 사라지는 텔레그램 · respond()","src":"# 만약 기존 대화 기록이 없거나 튜플 형태 등으로 꼬여있다면 딕셔너리 리스트로 초기화\n if not chat_history or not isinstance(chat_history, list):\n chat_history = []\n\n # 1. AI 답변 생성\n result =\n\n # 2. Gradio 6 규격에 맞게 딕셔너리 형태로 대화 추가\n\n\n # 3. 먼저 답변을 화면에 즉시 표시\n yield\n\n # 4. 정확히 2초 동안 대기\n time.sleep(2)\n\n # 5. 대화 기록을 완전히 비워서 화면에서 삭제 (Gradio 6용 빈 리스트 전달)"},{"id":"t8-04","ty":"mc","lv":2,"game":true,"p":"PDF Q&A 텔레그램 챗봇에서 만든 rag_chain을 보관한 컴포넌트는?","o":["gr.Textbox","gr.Markdown","gr.File","gr.State"],"a":3,"h":"UI 코드의 <code>qa_state = gr.○○○○(None)<\/code> 줄을 보세요. 화면에 보이지 않고 이벤트 사이에 값을 들고 다니는 컴포넌트입니다.","w":"gr.State(None)으로 만든 qa_state가 체인을 보관합니다. 업로드 이벤트가 값을 넣고, 질문 이벤트가 inputs로 꺼내 씁니다.","an":"12일차 일정시간 이후 대화 내용 사라지는 텔레그램 · Gradio UI","src":"# 3. Gradio UI 구성\n# ==========================================================\nwith gr.Blocks(css=\".chatbot {height: 500px;}\") as demo:\n gr.Markdown(\"# 텔레그램 스타일 PDF Q&A 챗봇\")\n gr.Markdown(\"PDF를 업로드하고 자유롭게 질문하세요! (대화는 **10초 후 자동 삭제**됩니다.)\")\n\n qa_state = gr.State(None)"},{"id":"t8-05","ty":"mc","lv":3,"game":false,"p":"<code>file_input.change(fn=process_pdf, inputs=file_input, outputs=[status_output, qa_state])<\/code>에서 process_pdf가 성공하면 qa_state에 들어가는 것은?","o":["상태 안내 문구","업로드 파일 경로","rag_chain 객체","None"],"a":2,"h":"process_pdf의 성공 반환문은 <code>return 'PDF 임베딩 완료! …', rag_chain<\/code>이고 실패 시에는 (오류 문구, None)입니다. 반환값은 outputs 순서대로 들어갑니다.","w":"첫 반환값(문구)은 status_output, 두 번째 rag_chain은 qa_state에 저장됩니다. 실패하면 qa_state는 None이 됩니다.","an":"12일차 일정시간 이후 대화 내용 사라지는 텔레그램 · process_pdf()","src":"file_input.change(\n fn=process_pdf,\n inputs=file_input,\n outputs=[status_output, qa_state]\n )\n\n msg.submit(\n fn=respond,\n inputs=[msg, chatbot, qa_state],\n outputs=[msg, chatbot]\n )\n\ndemo.launch(share=True)\n```\nAgent_Gradio\n\n\n\n머신러닝 모델 기반 서비스인 경우 그라디오를 사용하면 쉽게 사용자 인터페이스를 만들 수 있다."},{"id":"t8-06","ty":"ox","lv":1,"game":true,"p":"PDF Q&A 텔레그램 챗봇은 대화를 10초 후 자동으로 삭제한다.","a":true,"h":"화면 안내 Markdown과 respond 주석 '○○초 대기 후 메시지 폭파 (자동 삭제)'를 보세요.","w":"맞습니다. 이 챗봇은 답변 후 10초가 지나면 대화를 지웁니다. 첫 텔레그램 예제는 2초였습니다.","an":"12일차 일정시간 이후 대화 내용 사라지는 텔레그램","src":"# 챗봇 답변 추가\n\n\n yield \"\", chat_history\n\n # 10초 대기 후 메시지 폭파 (자동 삭제)\n\n\n\n yield \"\", chat_history\n# ==========================================================\n# 3. Gradio UI 구성\n# ==========================================================\nwith gr.Blocks(css=\".chatbot {height: 500px;}\") as demo:\n gr.Markdown(\"# 텔레그램 스타일 PDF Q&A 챗봇\")\n gr.Markdown(\"PDF를 업로드하고 자유롭게 질문하세요! (대화는 **10초 후 자동 삭제**됩니다.)\")"},{"id":"t8-07","ty":"ox","lv":2,"game":true,"p":"PDF Q&A 텔레그램 챗봇은 FAISS와 RecursiveCharacterTextSplitter로 RAG를 구성했다.","a":false,"h":"이 셀의 import 줄은 <code>langchain_community.vectorstores<\/code>와 <code>langchain_text_splitters<\/code>에서 각각 하나씩 가져옵니다. 카톡 챗봇과 다른 조합입니다.","w":"틀렸습니다. 이 챗봇은 Chroma와 CharacterTextSplitter를 import합니다. FAISS·RecursiveCharacterTextSplitter는 앞의 PDF 챗봇들 조합입니다.","an":"12일차 일정시간 이후 대화 내용 사라지는 텔레그램 · import","src":"from langchain_openai import ChatOpenAI, OpenAIEmbeddings\nfrom langchain_community.vectorstores import Chroma\nfrom langchain_community.document_loaders import PyPDFLoader\nfrom langchain_text_splitters import CharacterTextSplitter"},{"id":"t8-08","ty":"match","lv":2,"game":false,"p":"개선된 챗봇의 포인트와 설명을 연결하세요.","pairs":[["st.rerun() 없이 세션 상태 처리","append()로 기록 추가"],["QA 체인 한 번만 생성","불필요한 재연산 제거"],["time.sleep(2)","답변 표시 후 2초 대기"],["gr.State(None)","체인을 담는 상태 저장소"]],"h":"'개선된 챗봇' 설명은 속도 향상 방법 두 가지를 번호로 적었습니다. 나머지 둘은 텔레그램 예제 코드에서 대기와 상태 보관을 맡는 줄입니다.","w":"세션 상태를 append로 처리하고 체인을 한 번만 만들어 속도를 높입니다. sleep(2)는 대기, gr.State는 체인 보관입니다.","an":"12일차 개선된 챗봇 · 텔레그램 스타일","src":"개선된 챗봇\n - 텔레그램 스타일\n - 속도향상\n 1. st.rerun()없이 세션 상태로 처리 -> append()\n 2. QA 체인 한번만 생성 -> 불필요한 재연산 제거"},{"id":"t8-09","ty":"order","lv":1,"game":false,"p":"PDF Q&A 텔레그램 챗봇 respond의 처리 순서대로 나열하세요.","steps":["사용자 메시지 추가 후 yield","rag_chain.invoke로 답변 생성","챗봇 답변 추가 후 yield","10초 대기","기록을 비우고 yield"],"h":"respond 주석은 '사용자가 입력한 메시지 추가 → (LCEL 체인 실행) → 챗봇 답변 추가 → 10초 대기 후 메시지 폭파'입니다. 매 단계 뒤에 <code>yield '', chat_history<\/code>가 있습니다.","w":"질문 표시 → 답변 생성 → 답변 표시 → 대기 → 삭제 순입니다. yield 덕분에 각 단계가 화면에 바로 반영됩니다.","an":"12일차 일정시간 이후 대화 내용 사라지는 텔레그램 · respond()","src":"def respond(message, chat_history, rag_chain):\n if rag_chain is None:\n\n\n yield \"\", chat_history\n return\n\n if chat_history is None:\n chat_history =\n\n # 사용자가 입력한 메시지 추가\n\n\n yield \"\", chat_history\n\n # LCEL 체인은 입력 문자열을 그대로 던지면 스트링 응답을 바로 반환합니다.\n answer =\n\n # 챗봇 답변 추가\n\n\n yield \"\", chat_history\n\n # 10초 대기 후 메시지 폭파 (자동 삭제)"},{"id":"t8-10","ty":"multi","lv":3,"game":true,"p":"<code>respond(message, chat_history, rag_chain)<\/code> 동작으로 옳은 것을 모두 고르세요.","o":["rag_chain이 None이면 바로 끝낸다","PDF를 질문마다 다시 임베딩한다","기록이 None이면 빈 리스트로 만든다","입력창은 빈 문자열로 비운다","답변을 파일로 저장한다"],"a":[0,2,3],"h":"함수 첫 부분은 체인이 없을 때 <code>yield '', chat_history<\/code> 후 return하고, 다음은 기록 None 검사입니다. 체인은 업로드 때 한 번만 만들어 qa_state로 전달받습니다.","w":"체인이 없으면 바로 종료, 기록 None이면 빈 리스트, 모든 yield의 첫 값 ''로 입력창을 비웁니다. 임베딩은 업로드 때 한 번만 합니다.","an":"12일차 일정시간 이후 대화 내용 사라지는 텔레그램 · respond()","src":"def respond(message, chat_history, rag_chain):\n if rag_chain is None:\n\n\n yield \"\", chat_history\n return\n\n if chat_history is None:\n chat_history =\n\n # 사용자가 입력한 메시지 추가\n\n\n yield \"\", chat_history\n\n # LCEL 체인은 입력 문자열을 그대로 던지면 스트링 응답을 바로 반환합니다.\n answer =\n\n # 챗봇 답변 추가\n\n\n yield \"\", chat_history\n\n # 10초 대기 후 메시지 폭파 (자동 삭제)"}]}]};

const GUIDE={mc:'알맞은 답을 하나 고르세요.',multi:'알맞은 것을 모두 고르세요.',ox:'맞으면 O, 틀리면 X를 고르세요.',
  match:'왼쪽 항목을 누른 뒤 짝이 되는 오른쪽 항목을 누르세요. 연결된 항목을 다시 누르면 풀립니다.',
  order:'첫 번째부터 순서대로 클릭하세요. 번호가 붙은 항목을 다시 누르면 그 번호부터 뒤 번호가 지워집니다.',num:'숫자만 입력하세요.'};

const GAME_MODES={
  timeattack:{title:'⚡ 타임어택',desc:'제한시간 안에 풀수록 점수가 커집니다. 시간이 다 되면 오답!',
    types:['mc','ox','multi'],times:[5,7,10,15],defaultTime:10},
};

const GAME_SLOTS=['timeattack',null,null];
const PAL=['--ty-mc','--ty-order','--ty-match','--ty-num','--ty-multi'];
const LETTER='ABCDEFGH';
const TABS=BANK.tabs, QMAP={}, QTAB={};
TABS.forEach((t,ti)=>{t.idx=ti;t.qs.forEach(q=>{QMAP[q.id]=q;QTAB[q.id]=t;});});

const RM=matchMedia('(prefers-reduced-motion: reduce)');

/* ── 저장소 (실패해도 동작) ─────────────── */
const KEY='qb:'+BANK.id+':v1';
const blank=()=>({name:'',tabs:{},wrong:{},board:[],drafts:{}});  // drafts: 채점 전 탭별 풀던 답
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw));}catch(e){}
try{const u=window.QB&&QB.user();if(!S.name&&u&&u.name)S.name=u.name;}catch(e){}  // 로그인 이름 동기화(사용자가 동작하기 전엔 저장하지 않음)
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

/* 순위 저장소 — 공유 순위로 바꿀 때 이 객체만 교체 */
// 순위는 같은 조건(게임 모드 + 풀이 시간)끼리만 비교한다. key = 'timeattack:10'
const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

/* ── 유틸 ──────────────────────────────── */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function say(msg){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=msg,30);}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('📋 클립보드에 복사했습니다');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'📋 클립보드에 복사했습니다':'복사하지 못했습니다. 인쇄 기능을 이용하세요.');
}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

/* ── 오답노트 ──────────────────────────── */
function addWrong(id,ans){const w=S.wrong[id]||{n:0};w.n++;w.last=ans;w.at=Date.now();w.solved=false;S.wrong[id]=w;}
function markSolved(id){if(S.wrong[id]&&!S.wrong[id].solved){S.wrong[id].solved=true;S.wrong[id].at=Date.now();}}
const wrongList=solved=>Object.keys(S.wrong).filter(id=>QMAP[id]&&!!S.wrong[id].solved===solved)
  .sort((a,b)=>QTAB[a].idx-QTAB[b].idx||ALLQ.indexOf(QMAP[a])-ALLQ.indexOf(QMAP[b]));

/* ── 문항 풀이 상태(학습·재도전 공용) ───── */
let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

function cardHTML(q,n){
  const [label,color]=TYPES[q.ty];
  const g=cur.graded, a=cur.ans[q.id], fa=finalAns(q), ok=g&&isCorrect(q,fa);
  const lock=g?' disabled':'';
  let body='';
  if(q.ty==='mc'||q.ty==='multi'){
    const multi=q.ty==='multi', mine=multi?(a||[]):[a];
    body='<div class="opts">'+q.o.map((o,i)=>{
      const right=multi?q.a.includes(i):q.a===i, picked=mine.includes(i);
      const cls=g?(right?' ans':picked?' miss':''):'';
      return `<label class="opt${cls}"><span class="onum">${i+1}</span><input type="${multi?'checkbox':'radio'}" name="r-${q.id}" data-act="${multi?'tick':'pick'}" data-q="${q.id}" data-i="${i}"${picked?' checked':''}${lock}><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(q.ty==='ox'){
    body='<div class="ox">'+[true,false].map(v=>{
      const cls=g?(q.a===v?' ans':a===v?' miss':''):'';
      return `<button type="button" class="${cls.trim()}" data-act="ox" data-q="${q.id}" data-v="${v?1:0}" data-fk="${q.id}-ox${v?1:0}" aria-pressed="${a===v}" aria-label="${v?'맞다 O':'틀리다 X'}"${lock}>${v?'O':'X'}</button>`;
    }).join('')+'</div>';
  }else if(q.ty==='match'){
    const m=a||{}, sel=cur.msel[q.id], linkedBy={};
    Object.entries(m).forEach(([l,r])=>linkedBy[r]=+l);
    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${PAL[i%PAL.length]})" data-act="ml" data-q="${q.id}" data-i="${i}" data-fk="${q.id}-l${i}"${lock}><span class="tag">${LETTER[i]}</span>${esc(p[0])}</button>`;
    }).join('');
    const right=cur.shuf[q.id].map(j=>{
      const by=linkedBy[j], linked=by!=null, cls=(linked?' linked':'')+(g&&linked?(by===j?' okm':' nom'):'');
      return `<button type="button" class="mitem${cls}" style="--pc:var(${linked?PAL[by%PAL.length]:'--line'})" data-act="mr" data-q="${q.id}" data-j="${j}" data-fk="${q.id}-r${j}"${lock}><span class="tag">${linked?LETTER[by]:''}</span>${esc(q.pairs[j][1])}</button>`;
    }).join('');
    body=`<div class="match"><div class="mcol mleft">${left}</div><div class="mcol mright">${right}</div></div>`;
  }else if(q.ty==='order'){
    const seq=a||[], full=seq.length===q.steps.length;
    body='<div class="olist">'+(cur.shuf[q.id]||range(q.steps.length)).map(si=>{
      const pos=seq.indexOf(si), on=pos>=0;
      const cls=(on?' on':'')+(g?(pos===si?' ok':' no'):'');
      const fix=g&&pos!==si?`<span class="ofix">정답 ${si+1}</span>`:'';
      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }
  const numAns=q.ty==='mc'?`${q.a+1}번 · `:q.ty==='multi'?q.a.map(i=>i+1).join('·')+'번 · ':'';
  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${mediaHTML(q)}${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>${voiceRow(q,q.id)}`}${body}${exp}</article>`;
}
const LV_NAME=['쉬움','보통','어려움'];
function lvHTML(lv){
  lv=lv||1;
  const dots=[1,2,3].map(k=>k<=lv?`<i class="d${k}">●</i>`:'<i class="off">○</i>').join('');
  return `<span class="lv lv${lv}" title="난이도 ${LV_NAME[lv-1]}"><span class="dots" aria-hidden="true">${dots}</span><em>${LV_NAME[lv-1]}</em></span>`;
}
// 자료 발췌: 이스케이프 후 마크다운 기호만 가볍게 서식으로 (**굵게**, `코드`, 머리 #)
const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
function hintHTML(q){
  if(!q.h)return '';
  const open=cur.hints.has(q.id), label=q.ty==='num'?'Hint · 계산식':'Hint';
  // 2단계: ① 자세한 힌트(h) ② 자료 보기 — 자료 원문 발췌(src) + 위치(an)
  const sopen=cur.srcs.has(q.id);
  const src=q.src?`<div class="srcwrap"><button type="button" class="srcbtn" data-act="src" data-q="${q.id}" data-fk="${q.id}-src" aria-expanded="${sopen}" aria-controls="src-${q.id}">`+
    `<span class="caret" aria-hidden="true">${sopen?'▾':'▸'}</span>📖 자료 보기</button>`+
    (sopen?`<blockquote class="src" id="src-${q.id}"><p>${srcText(q.src)}</p>${q.an?`<cite>${esc(q.an)}</cite>`:''}</blockquote>`:'')+`</div>`:'';
  return `<div class="hintwrap"><button type="button" class="hintbtn" data-act="hint" data-q="${q.id}" data-fk="${q.id}-hint" aria-expanded="${open}" aria-controls="hint-${q.id}">`+
    `<span class="caret" aria-hidden="true">${open?'▾':'▸'}</span>${label}</button>`+
    (open?`<div class="hint" id="hint-${q.id}">${q.h}${src}</div>`:'')+`</div>`;
}
function refreshCard(q){
  const el=document.getElementById('card-'+q.id);if(!el)return;
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  el.outerHTML=cardHTML(q,el.dataset.n);
  if(fk){const f=app.querySelector(`[data-fk="${fk}"]`);if(f&&!f.disabled)f.focus();}
  updateProgress();
}
const pad2=n=>String(n).padStart(2,'0');
const fmtCnt=(n,t)=>`(${pad2(n)}/${pad2(t)})`;
// 탭별 푼 문항 수: 지금 보는 탭 → 화면 상태, 그 외 → 풀던 답(drafts) → 채점 기록
function tabAnswered(t){
  const src=cur&&cur.mode==='study'&&cur.tab===t?cur.ans:(S.drafts[t.id]||(S.tabs[t.id]&&S.tabs[t.id].answers)||{});
  return t.qs.filter(q=>isAnswered(q,src[q.id])).length;
}
function setTopScore(html){
  const el=document.getElementById('topScore');if(!el)return;
  el.hidden=!html;el.innerHTML=html||'';
}
function topScoreSheet(){
  if(!cur||!cur.graded){setTopScore('');return;}
  const n=cur.list.length, s=cur.list.filter(q=>isCorrect(q,finalAns(q))).length;
  let h=`🏁 ${cur.mode==='study'?'이 탭':'오답 풀이'} ${s}/${n}점 <small>${pct(s,n)}%</small>`;
  if(cur.mode==='study'&&allGraded()){const st=summaryStats();h+=` <small>· 종합 ${st.score}/${st.total}</small>`;}
  setTopScore(h);
}
function updateProgress(){
  const p=document.getElementById('pbar');if(!p||!cur)return;
  const n=cur.list.filter(answered).length, cnt=fmtCnt(n,cur.list.length);
  p.style.width=pct(n,cur.list.length)+'%';
  document.getElementById('ptxt').textContent=`${n} / ${cur.list.length} 응답`;
  const g=document.getElementById('gradeCnt');if(g)g.textContent=cnt;
  if(cur.mode==='study'){
    const c=document.getElementById('qc-'+cur.tab.id);if(c)c.textContent=cnt;
    if(!cur.graded){  // 풀던 답 저장 → 탭을 옮겨도 유지
      if(n||Object.keys(cur.ans).some(k=>{const v=cur.ans[k];return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:v!=null&&v!=='';}))
        S.drafts[cur.tab.id]=JSON.parse(JSON.stringify(cur.ans));
      else delete S.drafts[cur.tab.id];
      save();
    }
  }
}

/* ── 음성 선택 · 문제 읽기 · 그림/오디오 (qb-voice.js가 없으면 모두 숨김) ── */
const hasVoice=()=>!!(window.QBVoice&&QBVoice.supported());
const hasRead=()=>!!(window.QBVoice&&QBVoice.canSpeak());
const IC_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const IC_VOL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const VC=new Map();  // 학습 모드 문항별 음성 컨트롤러
function voiceReset(){VC.clear();if(window.QBVoice)QBVoice.cancelSpeak();}  // 연속 음성 모드는 화면이 바뀌어도 유지
function voiceRow(q,fkp){
  const mic=hasVoice()&&['mc','multi','ox'].includes(q.ty), rd=hasRead();
  if(!mic&&!rd)return '';
  const qa=fkp?` data-q="${q.id}"`:'';
  return `<div class="vrow noprint">`+
    (mic?`<button type="button" class="vbtn vmic" data-act="vmic"${qa} data-fk="${fkp}-vmic" data-state="idle" aria-pressed="false">${IC_MIC}<span>말하기</span></button>`:'')+
    (rd?`<button type="button" class="vbtn" data-act="vread"${qa} data-fk="${fkp}-vread">${IC_VOL}<span>문제 읽기</span></button>`:'')+
    (mic?`<span class="vstat" aria-live="polite"></span><span class="vhint">말하기 어려우면 눌러서 고르세요</span>`:'')+`</div>`;
}
function mediaHTML(q){
  let h='';
  if(q.img&&q.img.src)h+=`<figure class="qfig"><img src="${esc(q.img.src)}" alt="${esc(q.img.alt)}" loading="lazy">${q.img.caption?`<figcaption>${esc(q.img.caption)}</figcaption>`:''}</figure>`;
  if(q.audio&&q.audio.src)h+=`<div class="qaud"><audio controls preload="none" src="${esc(q.audio.src)}"></audio><details><summary>대본</summary><p>${esc(q.audio.transcript)}</p></details></div>`;
  return h;
}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
// 읽어 줄 글: 문제 + 화면에 보이는 순서의 보기("1번 …")
function readText(q,n,order){
  let t=(n?`${n}번 문제. `:'')+plain(q.p)+'.';
  if(q.img&&q.img.alt)t+=' 그림 설명. '+q.img.alt+'.';
  if(q.ty==='ox')t+=' 맞으면 O, 틀리면 X.';
  else if(q.ty==='mc'||q.ty==='multi')t+=(order||range(q.o.length)).map((oi,k)=>` ${k+1}번. ${plain(q.o[oi])}.`).join('');
  return t;
}
function readAloud(text){if(QBVoice.isSpeaking())QBVoice.cancelSpeak();else QBVoice.speak(text);}
// 음성으로 고른 것 = 보기를 직접 누른 것과 같은 경로(입력 click → 기존 change/click 처리)
function voicePick(q,r){
  if(!cur||cur.graded)return;
  const card=document.getElementById('card-'+q.id);if(!card)return;
  const el=r.kind==='ox'?card.querySelector(`[data-act="ox"][data-v="${r.v==='O'?1:0}"]`):card.querySelector(`input[data-i="${r.i}"]`);
  if(el&&!el.disabled)el.click();
}
function studyVoice(q){
  let c=VC.get(q.id);if(c)return c;
  const card=()=>document.getElementById('card-'+q.id);
  c=QBVoice.attach({bind:false,button:()=>card()&&card().querySelector('.vmic'),live:()=>card()&&card().querySelector('.vstat'),
    getOptions:()=>q.ty==='ox'?2:q.o.length,getType:()=>q.ty,select:r=>voicePick(q,r)});
  VC.set(q.id,c);return c;
}

/* ── 연속 음성 모드: 한 번 켜 두면 문제가 바뀌어도 마이크가 계속 켜져 있다 ──
   켜짐/꺼짐은 이 브라우저에 기억해 두므로 다음 문제은행·다음 문제에서도 다시 묻지 않는다(마이크 허용은 브라우저가 한 번만 묻는다). */
const VA={ctl:null,state:'off',msg:''};
const vaPref=()=>{try{return localStorage.getItem('qb:voice-auto')==='1';}catch(e){return false;}};
const vaSave=on=>{try{localStorage.setItem('qb:voice-auto',on?'1':'0');}catch(e){}};
const vaSup=q=>!!q&&['mc','multi','ox'].includes(q.ty);
function vaTarget(){   // 지금 음성으로 답할 문항
  if(G){const q=G.qs[G.i];return !G.locked&&vaSup(q)?{q,count:G.view.length,type:q.ty==='ox'?'ox':'mc'}:null;}
  if(cur&&!cur.graded&&cur.vi>=0){const q=cur.list[cur.vi];return vaSup(q)?{q,count:q.ty==='ox'?2:q.o.length,type:q.ty==='ox'?'ox':'mc'}:null;}
  return null;
}
function vaInit(){cur.vi=cur.list.findIndex(q=>vaSup(q)&&!answered(q));}
function vaMark(scroll){
  document.querySelectorAll('.vcur').forEach(e=>e.classList.remove('vcur'));
  if(G||!cur||cur.graded||cur.vi<0)return;
  const q=cur.list[cur.vi],c=q&&document.getElementById('card-'+q.id);
  if(!c)return;
  c.classList.add('vcur');
  if(scroll)c.scrollIntoView({block:'center',behavior:RM.matches?'auto':'smooth'});
}
function vaAdvance(){   // 다음 미응답 문항(뒤→앞 순서로 한 바퀴)으로 이동, 없으면 -1
  const L=cur.list,n=L.length,from=cur.vi;
  for(let d=1;d<=n;d++){const k=(from+d)%n;if(vaSup(L[k])&&!answered(L[k])){cur.vi=k;vaMark(true);vaStatus();return;}}
  cur.vi=-1;vaMark(false);
  VA.msg="모든 문항에 답했습니다. '채점'이라고 말하면 채점합니다.";vaApply();
}
function vaStatus(){
  if(G||!cur||cur.vi<0)return;
  const t=vaTarget(),card=document.getElementById('card-'+cur.list[cur.vi].id);
  if(t){VA.msg=`${card?card.dataset.n:cur.vi+1}번 문제 · ${t.type==='ox'?"'O' 또는 'X'":`1~${t.count}번`}로 말하세요${cur.list[cur.vi].ty==='multi'?" (모두 고르고 '다음')":''}`;vaApply();}
}
function vaApply(){
  const on=VA.ctl&&VA.ctl.want, bar=document.getElementById('vbar'), btn=document.getElementById('vaBtn');
  if(btn){btn.hidden=!hasVoice();btn.setAttribute('aria-pressed',String(!!on));btn.setAttribute('aria-label',on?'음성 모드 끄기':'음성 모드 켜기');}
  document.querySelectorAll('.vmic').forEach(b=>{b.dataset.state=on?(VA.state==='error'?'error':'listening'):'idle';b.setAttribute('aria-pressed',String(!!on));});
  if(bar){const show=on&&VA.state!=='off'&&(G||(cur&&!cur.graded));bar.hidden=!show;bar.dataset.state=VA.state;if(show)bar.textContent='🎙 '+(VA.msg||'듣는 중…');}
}
function vaCtl(){
  if(VA.ctl||!hasVoice())return VA.ctl;
  VA.ctl=QBVoice.auto({
    getTarget:()=>{const t=vaTarget();return t?{count:t.count,type:t.type}:null;},
    select:r=>{
      if(G){gameAnswer(r.kind==='ox'?(r.v==='O'?0:1):r.i);return;}
      const t=vaTarget();if(!t)return;
      voicePick(t.q,r);
      if(t.q.ty!=='multi')vaAdvance();else vaMark(false);
    },
    next:()=>{if(!G&&cur&&!cur.graded)vaAdvance();},
    submit:()=>{
      if(G){const q=G.qs[G.i];if(q&&q.ty==='multi')gameSubmit();}
      else if(cur&&!cur.graded)gradeSheet();
    },
    onState:(s,m)=>{VA.state=s;if(m!=null)VA.msg=m;vaApply();if(s==='listening'&&!m)vaStatus();}
  });
  return VA.ctl;
}
// 화면이 바뀔 때마다: 음성 모드가 켜져 있고 풀 문제가 있으면 듣기 유지/시작, 없으면 멈춤(설정은 유지)
function vaSync(){
  const c=vaCtl();if(!c){vaApply();return;}
  if(!G&&cur&&!cur.graded&&cur.vi===undefined)vaInit();
  const active=!!(G||(cur&&!cur.graded));
  if(vaPref()&&active){if(!c.want)c.start();else if(!G)vaStatus();}
  else if(c.want)c.stop();
  vaApply();vaMark(false);
}
function vaToggle(){
  const c=vaCtl();if(!c)return;
  const on=!vaPref();vaSave(on);
  if(on){
    toast('🎙 음성 모드 켜짐 · 문제가 바뀌어도 계속 듣습니다');
    const active=!!(G||(cur&&!cur.graded));
    if(active){if(!G&&cur.vi===undefined)vaInit();c.start();vaMark(true);vaStatus();}
  }else{c.stop();toast('음성 모드 꺼짐');}
  vaApply();
}

/* 학습 화면 상호작용 */
function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;
  else if(el.dataset.act==='tick'){
    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);
  }
  cur.armed=false;updateProgress();
}
function onSheetInput(el){
  if(el.dataset.act==='num'&&!cur.graded){cur.ans[el.dataset.q]=el.value;cur.armed=false;updateProgress();}
}

/* ── 화면: 학습 ────────────────────────── */
function viewStudy(tid,fresh){
  const tab=TABS.find(t=>t.id===tid)||TABS[0];
  cur=newSheet('study',tab.qs,tab);
  const rec=S.tabs[tab.id], draft=S.drafts[tab.id];
  if(fresh){delete S.drafts[tab.id];save();}
  else if(draft){Object.assign(cur.ans,JSON.parse(JSON.stringify(draft)));}  // 풀던 중이면 이어서
  else if(rec&&rec.answers){
    Object.assign(cur.ans,JSON.parse(JSON.stringify(rec.answers)));
    (rec.touched||[]).forEach(id=>cur.touched.add(id));
    cur.graded=true;
  }
  renderSheet();
}
function renderSheet(){
  voiceReset();
  const study=cur.mode==='study', tab=cur.tab;
  const tabbar=study?`<nav class="tabbar noprint" role="tablist" aria-label="탭">${TABS.map((t,i)=>{const r=S.tabs[t.id];
      return `<a class="tabchip" role="tab" href="#study/${t.id}" aria-selected="${t===tab}"><b>${i+1}</b><span class="tl">${esc(t.title)}</span><span class="qc" id="qc-${t.id}">${fmtCnt(tabAnswered(t),t.qs.length)}</span>${r?`<span class="sc" title="채점 점수">✓${r.score}</span>`:''}</a>`;}).join('')}
      ${allGraded()?'<a class="tabchip sum" href="#summary">★ 종합</a>':''}</nav>`:'';
  const head=study?`<div class="tabhead"><h2>${tab.idx+1}. ${esc(tab.title)}</h2>${tab.ref?`<span class="part">${esc(tab.ref)}</span>`:''}</div>`
                  :`<div class="tabhead"><h2>🔁 오답 다시 풀기</h2><span class="part">${cur.list.length}문항</span></div>`;
  const next=study?(tab.idx+1<TABS.length?`<a class="btn" href="#study/${TABS[tab.idx+1].id}">다음 탭 →</a>`:(allGraded()?'<a class="btn" href="#summary">★ 종합 결과</a>':'')):'<a class="btn" href="#notes">오답노트로</a>';
  app.innerHTML=`<div class="sheet">
  <nav class="crumbs noprint"><a href="#home">← 홈</a><span>/</span><span>${study?'학습 모드':'오답노트'}</span></nav>
  ${tabbar}${head}
  <div class="progress"><div class="bar"><div id="pbar"></div></div><span id="ptxt"></span></div>
  <div id="sheetResult">${cur.graded?sheetResultHTML():''}</div>
  <div id="cards" class="${cur.onlyWrong?'onlywrong':''}">${cur.list.map((q,i)=>cardHTML(q,i+1)).join('')}</div>
  <p class="warn" id="warn" role="status"></p>
  <div class="actions">
    ${cur.graded?'':`<button class="btn primary" type="button" data-act="grade">${study?'이 탭 채점하기':'채점하기'} <span class="qc" id="gradeCnt"></span></button>`}
    ${cur.graded?`<button class="btn" type="button" data-act="onlywrong">${cur.onlyWrong?'전체 보기':'오답만 보기'}</button>`:''}
    ${study?'<button class="btn" type="button" data-act="retab">다시 풀기</button>':''}
    ${next}
  </div></div>`;
  const on=app.querySelector('.tabchip[aria-selected="true"]');
  if(on)on.parentElement.scrollLeft=on.offsetLeft-on.parentElement.offsetLeft-16;
  updateProgress();
  topScoreSheet();
  vaSync();
}
function sheetResultHTML(){
  const n=cur.list.length, score=cur.list.filter(q=>isCorrect(q,finalAns(q))).length, p=pct(score,n);
  const msg=p===100?'만점입니다! 🎉':p>=80?'잘했어요. 틀린 문항의 해설과 자료 위치를 확인하세요.':p>=60?'절반 이상 이해했어요. 오답노트로 다시 풀어 보세요.':'자료를 한 번 더 읽고 다시 풀어 보세요.';
  return `<div class="panel"><div class="score">${score}<small> / ${n} · ${p}%</small></div><p class="msg">${msg}</p>
    ${cur.mode==='study'&&gameUnlocked()?'<a class="btn" href="#game">⚡ 게임 모드 도전</a>':''}</div>`;
}
function gradeSheet(){
  const miss=cur.list.map((q,i)=>answered(q)?0:i+1).filter(Boolean);
  if(miss.length&&!cur.armed){
    cur.armed=true;
    document.getElementById('warn').textContent=`미응답 ${miss.length}문항 (Q${miss.join(', Q')}). 한 번 더 누르면 미응답은 오답으로 채점합니다.`;
    return;
  }
  const firstUnlock=!gameUnlocked();
  cur.graded=true;
  const snap={};let score=0;
  cur.list.forEach(q=>{
    const a=finalAns(q);
    if(a!=null)snap[q.id]=a;
    if(isCorrect(q,a)){score++;markSolved(q.id);}
    else addWrong(q.id,answerText(q,a));
  });
  if(cur.mode==='study'){
    S.tabs[cur.tab.id]={score,total:cur.list.length,answers:snap,touched:[...cur.touched],at:Date.now()};
    delete S.drafts[cur.tab.id];
  }
  save();
  renderSheet();
  window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
  say(`채점 결과 ${score}점, ${cur.list.length}문항 중`);
  if(cur.mode==='study'&&firstUnlock)setTimeout(()=>toast('⚡ 게임 모드와 해설지가 열렸습니다!'),300);
  else if(cur.mode==='study'&&allGraded())setTimeout(()=>toast('★ 모든 탭 완료! 종합 결과를 확인하세요.'),300);
}

/* ── 화면: 종합 결과 ───────────────────── */
function summaryStats(){
  let score=0,total=0;const byType={},byTab=[];
  TABS.forEach(t=>{const r=S.tabs[t.id];if(!r)return;let s=0;
    t.qs.forEach(q=>{const ok=isCorrect(q,r.answers?r.answers[q.id]:null);if(ok)s++;
      const b=byType[q.ty]||(byType[q.ty]=[0,0]);b[1]++;if(ok)b[0]++;});
    byTab.push([t,s,t.qs.length]);score+=s;total+=t.qs.length;});
  return {score,total,byType,byTab};
}
function resultCode(score,total){return `${BANK.code||'QB'}-${letter(pct(score,total))}-${hash([S.name.trim(),score,total,BANK.salt].join('|'))}`;}

function groupByTab(ids){

  ids.forEach(id=>{const t=QTAB[id];if(t!==last){out.push(`<h3 class="ngroup"><span class="part">탭 ${t.idx+1}</span>${esc(t.title)}</h3>`);last=t;}out.push(noteHTML(id));});

let G=null;

function gamePool(scope){
  const M=GAME_MODES[gameSetup.mode];
  const base=ALLQ.filter(q=>q.game&&!q.audio&&M.types.includes(q.ty));  // 오디오 문항은 제한시간 안에 들을 수 없어 제외
  if(scope==='played')return shuffle(base.filter(q=>S.tabs[QTAB[q.id].id]));
  if(scope==='wrong'){const w=new Set(wrongList(false));return shuffle(base.filter(q=>w.has(q.id))).concat(shuffle(base.filter(q=>!w.has(q.id))));}
  return shuffle(base);
}

function startGame(){
  const pool=gamePool(gameSetup.scope).slice(0,gameSetup.count);

}
function renderGameQ(){
  voiceReset();
  const q=G.qs[G.i];
  G.locked=false;G.elapsed=0;G.last=performance.now();G.limit=G.time*1000;G.warned=false;G.pick=[];
  G.view=q.ty==='ox'?[true,false]:shuffle(range(q.o.length));
  const opts=q.ty==='ox'
    ?`<div class="gox">${G.view.map((v,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}" aria-label="${v?'O 맞다':'X 틀리다'}">${v?'O':'X'}</button>`).join('')}</div>`
    :`<div class="gopts">${G.view.map((oi,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}"${q.ty==='multi'?' aria-pressed="false"':''}><kbd>${k+1}</kbd><span>${esc(q.o[oi])}</span></button>`).join('')}</div>`;
  app.innerHTML=`
  <div class="game play">
    <div class="gtop"><div class="hud"><span>${G.i+1} / ${G.qs.length}</span><span class="combo${G.combo>=3?' hot':''}">🔥 콤보 ${G.combo}</span><span class="pts">${G.score.toLocaleString()}점</span></div>
    <div class="timer" id="timer"><div id="tbar"></div></div><div class="tleft" id="tleft"></div></div>
    <div class="gtype">${TYPES[q.ty][0]}${q.ty==='multi'?' · 모두 고른 뒤 제출':''}</div>
    <div class="gq">${q.p}</div>${mediaHTML(q)}
    <div class="gbottom">${voiceRow(q,'g')}${opts}
    <div class="gfloat" id="gfloat" aria-live="polite"></div>
    <div class="gsub"><button class="btn" type="button" data-act="gquit">그만하기</button>
      ${q.ty==='multi'?'<button class="btn primary" type="button" data-act="gsubmit">제출 (Enter)</button>':''}</div></div>
  </div>`;
  vaSync();
  G.raf=requestAnimationFrame(tick);
}
function tick(now){
  if(!G||G.locked)return;
  G.elapsed+=now-G.last;G.last=now;
  const rem=Math.max(0,G.limit-G.elapsed), ratio=rem/G.limit;
  const shown=RM.matches?Math.ceil(rem/1000)*1000/G.limit:ratio;
  const bar=document.getElementById('tbar'), tm=document.getElementById('timer');
  if(bar){bar.style.width=(Math.min(1,shown)*100)+'%';tm.className='timer'+(ratio<.25?' lo':ratio<.5?' mid':'');
    document.getElementById('tleft').textContent=(rem/1000).toFixed(1)+'초';}
  if(!G.warned&&rem<=5000){G.warned=true;say('5초 남았습니다');}
  if(rem<=0){judge(null,true);return;}
  G.raf=requestAnimationFrame(tick);
}
function judge(ans,timeout){
  if(!G||G.locked)return;
  G.locked=true;cancelAnimationFrame(G.raf);
  const q=G.qs[G.i], used=Math.min(G.elapsed,G.limit), ok=!timeout&&isCorrect(q,ans);
  let gain=0;
  if(ok){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const mult=G.combo>=5?1.5:G.combo>=3?1.2:1;
    gain=Math.round((100+Math.floor((G.limit-used)/100))*mult);G.score+=gain;}
  else G.combo=0;
  G.results.push({id:q.id,ok,ans,timeout,ms:used,gain});
  // 판정 표시
  app.querySelectorAll('[data-act="gans"]').forEach(b=>{
    const k=+b.dataset.k, v=G.view[k];
    const right=q.ty==='ox'?q.a===v:q.ty==='mc'?q.a===v:q.a.includes(v);
    const picked=q.ty==='ox'||q.ty==='mc'?ans===v:(ans||[]).includes(v);
    if(right)b.classList.add('ans');else if(picked)b.classList.add('miss');
    b.disabled=true;
  });
  const f=document.getElementById('gfloat');
  f.className='gfloat pop '+(ok?'ok':'no');
  f.textContent=ok?`+${gain}${G.combo>=3?` 🔥×${G.combo>=5?'1.5':'1.2'}`:''}`:timeout?'⏰ 시간 초과':'✗ 오답';
  if(timeout){const tm=document.getElementById('timer');tm&&tm.classList.add('out');}
  const sb=app.querySelector('[data-act="gsubmit"]');if(sb)sb.disabled=true;
  app.querySelector('.pts').textContent=G.score.toLocaleString()+'점';
  const c=app.querySelector('.combo');c.textContent='🔥 콤보 '+G.combo;c.classList.toggle('hot',G.combo>=3);
  G.next=setTimeout(()=>{if(!G)return;G.i++;G.i<G.qs.length?renderGameQ():finishGame();},ok?900:1400);
}
function gameAnswer(k){
  if(!G||G.locked)return;
  const q=G.qs[G.i];if(k<0||k>=G.view.length)return;
  if(q.ty==='multi'){
    const v=G.view[k], i=G.pick.indexOf(v);
    i<0?G.pick.push(v):G.pick.splice(i,1);
    const b=app.querySelector(`[data-act="gans"][data-k="${k}"]`);b&&b.setAttribute('aria-pressed',i<0);
  }else judge(G.view[k],false);
}
function gameSubmit(){if(G&&!G.locked&&G.qs[G.i].ty==='multi')judge(G.pick.slice(),false);}
function stopGame(){if(G){cancelAnimationFrame(G.raf);clearTimeout(G.next);G=null;}}
function finishGame(){
  const R=G.results, correct=R.filter(r=>r.ok).length, M=GAME_MODES[G.mode];
  R.forEach(r=>{const q=QMAP[r.id];if(r.ok)markSolved(r.id);else addWrong(r.id,r.timeout?'(시간 초과)':answerText(q,r.ans));});

  const rank=Leaderboard.add(rec);

  const row=(r,i)=>`<tr class="${r.id===rec.id?'me':''}"><td>${medal(i)}</td><td>${esc(r.name)}</td><td class="r">${r.score.toLocaleString()}</td><td class="r">${r.rate}%</td><td class="r">${r.correct}/${r.total}</td><td class="r">${new Date(r.at).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}</td></tr>`;
  const wrong=R.filter(r=>!r.ok);
  G=null;vaSync();
  setTopScore(`⚡ 게임 ${rec.score.toLocaleString()}점 <small>정답 ${correct}/${R.length}</small>`);
  app.innerHTML=`
  <div class="game">
    <div class="panel center">
      <p class="note-sm" style="margin:0">최종 점수</p>
      <div class="score xl">${rec.score.toLocaleString()}</div>
      <p class="msg">${M.title} · ${rec.time}초 — ${rank===1?'🏆 이 조건 최고 기록!':`이 조건 순위 ${rank}위`}</p>
      <div class="bignum"><div><b>${correct}/${rec.total}</b><span>정답</span></div><div><b>${rec.rate}%</b><span>정답률</span></div><div><b>${rec.avg}초</b><span>평균 응답</span></div><div><b>${rec.combo}</b><span>최고 콤보</span></div></div>
    </div>
    <div class="panel"><h2 class="ph">🏆 순위 · ${M.title.replace(/^\S+\s/,'')} ${rec.time}초 · 이 브라우저 기록</h2>
      <table class="board"><thead><tr><th>#</th><th>이름</th><th class="r">점수</th><th class="r">정답률</th><th class="r">정답</th><th class="r">날짜</th></tr></thead>
      <tbody>${top.map(row).join('')}${rank>10&&mine?row(mine,rank-1):''}</tbody></table></div>
    ${wrong.length?`<details class="more panel"><summary>틀린 문항 ${wrong.length}개 · 해설 보기 (오답노트에 저장됨)</summary>
      ${wrong.map(r=>{const q=QMAP[r.id];return `<div class="keyitem"><div class="kq">${q.p}</div><p class="mine" style="margin:4px 0">내 답: ${esc(r.timeout?'(시간 초과)':answerText(q,r.ans))}</p><p class="ka">정답: ${esc(correctText(q))}</p><p class="kw">${q.w}</p><span class="an">📖 ${esc(q.an)}</span></div>`;}).join('')}</details>`:''}
    <div class="actions"><button class="btn primary" type="button" data-act="gagain">↻ 다시 하기</button><a class="btn" href="#notes">📒 오답노트</a><a class="btn" href="#home">홈</a></div>
  </div>`;
}

  const n=e.key==='ArrowRight'?t.nextElementSibling:t.previousElementSibling;if(n){e.preventDefault();n.focus();}
});
/* 테마 */
let theme=null;try{theme=localStorage.getItem('qb:theme');}catch(e){}
const applyTheme=()=>{if(theme)document.documentElement.dataset.theme=theme;else delete document.documentElement.dataset.theme;};
applyTheme();
document.getElementById('vaBtn').addEventListener('click',vaToggle);
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  theme=dark?'light':'dark';try{localStorage.setItem('qb:theme',theme);}catch(e){}applyTheme();
});
document.title=BANK.title+' · 문제은행';
window.addEventListener('hashchange',route);
route();
})();
</script>
