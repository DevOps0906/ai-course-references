'use strict';
const BANK={"id":"ai-excel","code":"EX","title":"AI 엑셀 실무 · ChatGPT·Gemini로 하는 비즈니스 엑셀","subtitle":"함수 자동화 · 데이터 정제와 검증 · VBA 매크로","course":"01-ai-work / ai-excel","source":"01-ai-work/ai-excel/AI_엑셀_실무.md","salt":"ai-excel","version":1,"updated":"2026-10-15","tabs":[{"id":"t1","title":"AI와 대화하는 법","ref":"1교시 · 실습 1-1~1-4","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"이 자료의 '프롬프트 4원칙'에 <b>속하지 않는<\/b> 것은?","o":["역할","맥락","예시","보안"],"a":3,"h":"프롬프트 4원칙 표는 ①~④ 네 가지로, 전문가 역할을 주는 것, 데이터 구조·상황을 설명하는 것, 답 형태를 지정하는 것, 기대 결과 샘플을 보여 주는 것입니다. 데이터 보호는 4원칙이 아니라 '3원칙'에서 다룹니다.","w":"4원칙은 역할·맥락·형식·예시입니다. 보안은 '실습 내내 지킬 3원칙'(실데이터 입력 금지 등)에 해당하는 내용입니다.","an":"도입 · 프롬프트 4원칙 표","src":"## 🎯 프롬프트 4원칙 (모든 실습 공통)\n| 원칙 | 내용 | 예시 |\n|------|------|------|\n| ① 역할 | 전문가 역할 부여 | \"너는 엑셀 전문가야\" |\n| ② 맥락 | 데이터 구조·상황 설명 | \"A열 날짜, C열 부서, G열 금액인 표가 있어\" |\n| ③ 형식 | 답 형태 지정 | \"함수와 단계별 설명으로 답해줘\" |\n| ④ 예시 | 기대 결과 샘플 | \"예: 영업1팀 1월 → 110,020,000\" |"},{"id":"t1-02","ty":"mc","lv":2,"game":true,"p":"'A열 날짜, C열 부서, G열 금액인 표가 있어'라는 문장은 4원칙 중 무엇인가요?","o":["역할","형식","맥락","예시"],"a":2,"h":"프롬프트 4원칙 표의 예시 열을 보세요. 열마다 무슨 데이터가 들어 있는지 알려 주는 문장은 '데이터 구조·상황 설명'에 해당하는 원칙의 예시입니다.","w":"데이터 구조·상황을 알려 주는 문장은 '맥락'입니다. 역할은 '너는 엑셀 전문가야', 형식은 답의 모양, 예시는 기대 결과 샘플입니다.","an":"도입 · 프롬프트 4원칙 표","src":"## 🎯 프롬프트 4원칙 (모든 실습 공통)\n| 원칙 | 내용 | 예시 |\n|------|------|------|\n| ① 역할 | 전문가 역할 부여 | \"너는 엑셀 전문가야\" |\n| ② 맥락 | 데이터 구조·상황 설명 | \"A열 날짜, C열 부서, G열 금액인 표가 있어\" |\n| ③ 형식 | 답 형태 지정 | \"함수와 단계별 설명으로 답해줘\" |\n| ④ 예시 | 기대 결과 샘플 | \"예: 영업1팀 1월 → 110,020,000\" |"},{"id":"t1-03","ty":"mc","lv":1,"game":true,"p":"'매출 분석해줘'라고만 입력하면 어떤 답이 나오나요?","o":["지역별 순위표가 바로 나온다","일반적인 설명만 늘어놓는다","오류 메시지가 뜬다","함수를 셀에 자동 입력한다"],"a":1,"h":"실습 1-1 STEP 1은 ChatGPT에 맥락 없이 짧은 요청만 넣어 봅니다. AI가 무엇을 분석할지 몰라 구체적인 표 대신 어떤 답을 주는지, 그것이 '나쁜 프롬프트의 결과'라는 설명을 떠올리세요.","w":"무엇을 분석할지 모르니 AI는 일반적인 설명만 늘어놓습니다. 이것이 나쁜 프롬프트의 결과이고, 맥락 한 줄이 결과를 바꿉니다.","an":"실습 1-1 STEP 1","src":"### STEP 1. 나쁜 프롬프트를 먼저 경험\n🖥️ ChatGPT를 열고 딱 이렇게만 입력한다: `매출 분석해줘`\n→ AI가 무엇을 분석할지 몰라 일반적인 설명만 늘어놓는다. **이것이 나쁜 프롬프트의 결과**다."},{"id":"t1-04","ty":"mc","lv":1,"game":true,"p":"함수·VBA·코드 작업에 이 자료가 권하는 도구는?","o":["ChatGPT","Gemini","Google Drive","엑셀 자동 완성"],"a":0,"h":"도구 선택 기준 표는 두 도구의 강점을 나눕니다. 한쪽은 코드 생성·디버깅과 파일 업로드 분석에 강하고, 다른 쪽은 Google Sheets·Drive와 직접 연동됩니다. 함수·VBA·코드 작업 줄의 이유는 '코드 생성·디버깅 강점'입니다.","w":"함수·VBA·코드와 엑셀 파일 통째 분석은 ChatGPT, Google Sheets 작업과 Drive 문서 통합은 Gemini가 적합합니다.","an":"실습 1-2 · 도구 선택 기준","src":"### 도구 선택 기준 (외워두기)\n| 이럴 땐 | 이 도구 | 이유 |\n|---------|---------|------|\n| 함수·VBA·코드 | **ChatGPT** | 코드 생성·디버깅 강점 |\n| 엑셀 파일 통째 분석 | **ChatGPT** | 파일 업로드 분석 |\n| Google Sheets 작업 | **Gemini** | 시트 안에서 직접 연동 |\n| Drive 문서 통합 | **Gemini** | Workspace 통합 |"},{"id":"t1-05","ty":"mc","lv":3,"game":false,"p":"전임자의 수식 <code>=SUMPRODUCT((B2:B100=\"서울\")*(D2:D100=\"노트북\")*G2:G100)<\/code>을 200건(201행까지) 데이터에 그대로 쓸 때의 함정은?","o":["텍스트 조건의 따옴표가 빠졌다","범위가 100행까지라 뒤쪽 행이 빠진다","SUMPRODUCT는 365에서만 된다","곱셈 대신 덧셈을 써야 한다"],"a":1,"h":"실습 1-4 STEP 3은 전임자 수식의 범위가 B2:B100(99행)인데 실제 데이터는 201행까지 있다고 지적합니다. 데이터가 늘었는데 범위가 예전 그대로이면 범위 밖의 행이 계산에서 어떻게 되는지 생각하세요.","w":"범위가 B2:B100(99행)인데 데이터는 201행까지 있습니다. 데이터가 늘었는데 범위가 옛날 그대로인 것이 물려받은 수식의 흔한 함정이라, B2:B201로 고쳐야 합니다.","an":"실습 1-4 STEP 3~4","src":"⚠️ 값이 나오긴 하는데 — 잠깐. 이 수식의 범위는 **B2:B100(99행)**인데 우리 데이터는 **201행까지(200건)** 있다. **물려받은 수식의 흔한 함정**: 데이터가 늘었는데 범위는 옛날 그대로인 경우다."},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"실데이터·개인정보는 그대로 입력하지 않고 가상 데이터로 대체한다.","a":true,"h":"실습 내내 지킬 3원칙의 1번은 실데이터·개인정보를 그대로 입력하지 말라는 것입니다. 화살표 뒤에 무엇으로 대체하라고 했는지, 그리고 그 방법을 몇 교시에 배우는지 확인하세요.","w":"맞습니다. 3원칙의 첫째가 '실데이터·개인정보 그대로 입력 금지 → 가상 데이터로 대체'입니다.","an":"도입 · 실습 내내 지킬 3원칙","src":"## 🔒 실습 내내 지킬 3원칙\n1. **실데이터·개인정보는 그대로 입력 금지** → 가상 데이터로 대체(4교시에서 배움)\n2. **AI 결과는 반드시 검증** → AI는 그럴듯하게 틀린다(5교시에서 직접 확인)\n3. **민감 데이터는 \"구조만 설명\"** → 표를 붙여넣지 말고 열 구성만 알려주고 함수만 받기"},{"id":"t1-07","ty":"ox","lv":2,"game":true,"p":"프롬프트 체이닝은 새 대화창을 열어 매번 처음부터 다시 묻는 방식이다.","a":false,"h":"실습 1-3은 한 번에 완벽한 답을 기대하지 말고 이어서 요청하며 좁혀 가라고 합니다. STEP 1~4는 ChatGPT의 같은 대화창 안에서 순서대로 입력하는데, 이것이 새 대화창을 여는 방식과 같은지 판단하세요.","w":"틀렸습니다. 체이닝은 같은 대화창에서 이어서 요청하며 답을 좁혀 가는 방식입니다.","an":"실습 1-3","src":"> **핵심 기술.** 한 번에 완벽한 답을 기대하지 말고, **이어서 요청하며 좁혀간다.**"},{"id":"t1-08","ty":"match","lv":2,"game":false,"p":"작업과 알맞은 도구·이유를 연결하세요.","pairs":[["함수·VBA·코드","ChatGPT · 코드 생성·디버깅"],["엑셀 파일 통째 분석","ChatGPT · 파일 업로드 분석"],["Google Sheets 작업","Gemini · 시트 안에서 직접 연동"],["Drive 문서 통합","Gemini · Workspace 통합"]],"h":"도구 선택 기준 표는 작업마다 도구와 이유를 짝지어 줍니다. 코드 작업과 파일 통째 분석은 ChatGPT(코드 생성·디버깅, 파일 업로드 분석), Sheets 작업과 Drive 문서는 Gemini(시트 직접 연동, Workspace 통합)입니다.","w":"ChatGPT는 코드와 파일 업로드 분석에, Gemini는 Sheets·Drive 같은 Google Workspace 연동에 강합니다.","an":"실습 1-2 · 도구 선택 기준","src":"### 도구 선택 기준 (외워두기)\n| 이럴 땐 | 이 도구 | 이유 |\n|---------|---------|------|\n| 함수·VBA·코드 | **ChatGPT** | 코드 생성·디버깅 강점 |\n| 엑셀 파일 통째 분석 | **ChatGPT** | 파일 업로드 분석 |\n| Google Sheets 작업 | **Gemini** | 시트 안에서 직접 연동 |\n| Drive 문서 통합 | **Gemini** | Workspace 통합 |"},{"id":"t1-09","ty":"order","lv":2,"game":false,"p":"실습 1-3 프롬프트 체이닝에서 이어서 입력한 요청의 순서를 맞추세요.","steps":["지역별 매출을 요약해줘","그걸 표로, 매출 큰 순서로","각 지역 1위 제품도 열로 추가해줘","이 표를 보고용 3줄 코멘트로 정리해줘"],"h":"실습 1-3 체크포인트는 네 번의 짧은 요청으로 '요약 → 표 → 확장 → 보고문'까지 완성됐다고 정리합니다. 먼저 요약을 받고, 표로 바꾸고, 열을 추가하고, 마지막에 보고용 코멘트로 정리합니다.","w":"네 번의 짧은 요청으로 '요약 → 표 → 확장 → 보고문'까지 완성됩니다. 한 번에 완벽을 기대하지 않고 이어서 좁혀 가는 것이 핵심입니다.","an":"실습 1-3 STEP 1~4","src":"### STEP 1~4. 아래 순서대로 하나씩 이어 입력\n🖥️ ChatGPT에서 **같은 대화창 안에서** 순서대로:\n1. 💬 `지역별 매출을 요약해줘` → 일반적인 답이 온다\n2. 💬 `그걸 표로, 매출 큰 순서로` → 표로 바뀐다\n3. 💬 `각 지역 1위 제품도 열로 추가해줘` → 열이 추가된다\n4. 💬 `이 표를 보고용 3줄 코멘트로 정리해줘` → 요약문이 나온다\n\n✅ **체크포인트:** 4번의 짧은 요청으로 \"요약 → 표 → 확장 → 보고문\"까지 완성됐다.\n🤖 **AI 팁:** 답이 아쉬우면 `더 짧게` `이유도 붙여서` `표로`처럼 **이어서** 요청하라. 이것이 AI 활용의 가장 큰 힘이다."},{"id":"t1-10","ty":"multi","lv":2,"game":true,"p":"'실습 내내 지킬 3원칙'에 해당하는 것을 <b>모두<\/b> 고르세요.","o":["실데이터·개인정보 입력 금지","AI 결과는 반드시 검증","민감 데이터는 구조만 설명","항상 Gemini만 사용","함수는 직접 외워서 입력"],"a":[0,1,2],"h":"3원칙은 실데이터·개인정보 입력 금지(가상 데이터로 대체), AI 결과의 검증(그럴듯하게 틀리기 때문), 민감 데이터는 표를 붙여넣지 말고 열 구성만 알려 함수만 받기입니다.","w":"3원칙은 ① 실데이터·개인정보 그대로 입력 금지 ② AI 결과는 반드시 검증 ③ 민감 데이터는 '구조만 설명'입니다. 도구 고정이나 함수 암기는 원칙이 아닙니다.","an":"도입 · 실습 내내 지킬 3원칙","src":"## 🔒 실습 내내 지킬 3원칙\n1. **실데이터·개인정보는 그대로 입력 금지** → 가상 데이터로 대체(4교시에서 배움)\n2. **AI 결과는 반드시 검증** → AI는 그럴듯하게 틀린다(5교시에서 직접 확인)\n3. **민감 데이터는 \"구조만 설명\"** → 표를 붙여넣지 말고 열 구성만 알려주고 함수만 받기"}]},{"id":"t2","title":"집계·조회 함수","ref":"2교시 · 실습 2-1~2-4","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"'영업1팀'의 '1월' 금액처럼 <b>여러 조건<\/b>을 모두 만족하는 합계를 구하는 함수는?","o":["SUMIF","SUMIFS","COUNTIFS","AVERAGEIFS"],"a":1,"h":"실습 2-1은 '영업1팀'이면서 '1월'인 금액만 더하는 상황입니다. 단일 조건 합계 함수 SUMIF에 여러 조건을 받을 수 있도록 복수형 S가 붙은 함수를 고르세요.","w":"여러 조건의 합계는 SUMIFS입니다. SUMIF는 조건 하나, COUNTIFS는 개수, AVERAGEIFS는 평균을 구합니다.","an":"실습 2-1","src":"## 실습 2-1. 조건부 합계 SUMIFS (8분)\n### STEP 1. 파일과 셀 준비\n🖥️ `AI엑셀실습_통합.xlsx`의 **매출데이터** 시트를 열고 빈 셀 **J1**을 클릭한다.\n### STEP 2. 맥락을 담아 AI에 요청\n💬\n```\n너는 엑셀 전문가야. G=금액, C=부서, H=월인 표(2행부터 200행)가 있어.\n'영업1팀'의 '1월' 금액 합계를 구하는 SUMIFS 함수를 만들어줘.\n```\n### STEP 3. 받은 함수를 J1에 붙여넣고 Enter\n```excel\n=SUMIFS(G:G, C:C, \"영업1팀\", H:H, 1)\n```\n✅ **체크포인트:** J1 = **110,020,000**\n### STEP 4. 조건을 바꿔 확인"},{"id":"t2-02","ty":"mc","lv":2,"game":true,"p":"<code>=SUMIFS(G:G, C:C, \"영업1팀\", H:H, 1)<\/code>의 체크포인트 값은?","o":["37,400,000","21,070,000","110,020,000","168,490,000"],"a":2,"h":"실습 2-1 STEP 3은 받은 SUMIFS를 J1에 넣고 값을 확인합니다. 함수 치트시트의 SUMIFS 줄에도 같은 검증값이 있으며, STEP 4에서 영업2팀은 37,400,000, 영업3팀은 21,070,000으로 이보다 작습니다.","w":"영업1팀 1월 합계는 110,020,000입니다. 37,400,000은 영업2팀, 21,070,000은 영업3팀, 168,490,000은 1월 전체 매출입니다.","an":"실습 2-1 STEP 3~4","src":"### STEP 3. 받은 함수를 J1에 붙여넣고 Enter\n```excel\n=SUMIFS(G:G, C:C, \"영업1팀\", H:H, 1)\n```\n✅ **체크포인트:** J1 = **110,020,000**"},{"id":"t2-03","ty":"mc","lv":1,"game":true,"p":"서울에서 팔린 노트북의 <b>건수<\/b>를 세는 함수는?","o":["COUNTIFS","AVERAGEIFS","SUMIFS","XLOOKUP"],"a":0,"h":"실습 2-2는 '서울'과 '노트북' 두 조건을 모두 만족하는 행의 개수를 셉니다. 개수를 세는 COUNT 계열 함수 중 조건 여러 개를 받는 복수형 함수가 답이며, 결과는 6건입니다.","w":"조건 여러 개로 개수를 세면 COUNTIFS입니다. <code>=COUNTIFS(B:B, \"서울\", D:D, \"노트북\")<\/code> → 6건.","an":"실습 2-2","src":"## 실습 2-2. 개수·평균 COUNTIFS·AVERAGEIFS (7분)\n### STEP 1. 두 함수를 한 번에 요청\n💬\n```\n같은 표에서 1) 서울에서 팔린 노트북 건수(COUNTIFS)\n2) 노트북의 평균 금액(AVERAGEIFS)을 각각 만들어줘. B=지역, D=제품, G=금액.\n```\n### STEP 2. J2·J3에 각각 입력\n```excel\n=COUNTIFS(B:B, \"서울\", D:D, \"노트북\") ' J2\n=AVERAGEIFS(G:G, D:D, \"노트북\") ' J3\n```\n✅ **체크포인트:** J2 = **6건** / J3 = **11,400,000**\n## 실습 2-3. 값 조회 3형제 — XLOOKUP·INDEX-MATCH·VLOOKUP (10분)\n### STEP 1. 조회 대상 입력"},{"id":"t2-04","ty":"mc","lv":2,"game":true,"p":"구버전 엑셀에서도 되고 왼쪽 조회도 가능한 조회 방식은?","o":["XLOOKUP","VLOOKUP","INDEX-MATCH","FILTER"],"a":2,"h":"실습 2-3의 조회 3형제 주석을 보세요. XLOOKUP은 최신·권장(365), VLOOKUP은 찾는 값이 맨 왼쪽일 때만 쓸 수 있고, 나머지 하나는 모든 버전에서 되며 왼쪽 조회도 가능합니다.","w":"INDEX-MATCH는 모든 버전에서 되고 왼쪽 조회도 가능합니다. XLOOKUP은 365 권장, VLOOKUP은 찾는 값이 맨 왼쪽일 때만 됩니다.","an":"실습 2-3 STEP 3","src":"### STEP 3. K5·K6·K7에 각각 입력\n```excel\n=XLOOKUP(J5, D:D, F:F) ' 최신·권장 (365)\n=INDEX(F:F, MATCH(J5, D:D, 0)) ' 모든 버전 OK, 왼쪽 조회 가능\n=VLOOKUP(J5, D:F, 3, 0) ' 가장 익숙, 찾는 값이 맨 왼쪽일 때만\n```\n✅ **체크포인트:** 세 함수 모두 **800,000** (결과 동일, 호환성만 다름)\n💡 회사 PC가 구버전이면 INDEX-MATCH를 쓰면 된다."},{"id":"t2-05","ty":"mc","lv":3,"game":true,"p":"FILTER 결과가 펼쳐질 아래 칸에 다른 값이 있으면 나오는 오류는?","o":["#N/A","#REF!","#DIV/0!","#SPILL!"],"a":3,"h":"FILTER·SORT 같은 동적 배열 결과는 아래 칸으로 자동으로 펼쳐집니다(spill). 펼쳐질 자리에 다른 값이 있으면 그 이름을 딴 오류가 나며, 그 칸을 비우면 해결됩니다.","w":"#SPILL!은 동적 배열이 펼쳐질 자리가 막혔을 때 나옵니다. 아래 칸을 비우면 해결됩니다.","an":"실습 2-4 · 오류 해결표","src":"✅ **체크포인트:** **38건**이 자동으로 펼쳐진다(spill).\n⚠️ 아래 칸에 다른 값이 있으면 `#SPILL!` → 그 칸을 비우면 해결.\n💡 원본이 바뀌면 **자동 갱신** → \"매달 갱신되는 조건별 목록\"에 최적."},{"id":"t2-06","ty":"ox","lv":1,"game":true,"p":"SUMIFS에서 텍스트 조건의 따옴표(\" \")를 빼도 결과는 같다.","a":false,"h":"실습 2-1의 ⚠️는 텍스트 조건 \"영업1팀\"을 감싼 큰따옴표를 빼면 어떻게 된다고 경고합니다. 또 범위를 일부만 잡아도 값이 틀린다고 덧붙입니다.","w":"틀렸습니다. 텍스트 조건의 따옴표를 빼면 오류가 납니다. 범위를 일부만 잡아도 값이 틀립니다.","an":"실습 2-1 ⚠️","src":"⚠️ 텍스트 조건의 따옴표(`\" \"`)를 빼면 오류. 범위를 일부만 잡아도 값이 틀린다.\n🤖 **AI 팁:** 받은 뒤 `이 함수의 각 부분이 뭘 하는지 한 줄씩 설명해줘`라고 물"},{"id":"t2-07","ty":"ox","lv":2,"game":true,"p":"VLOOKUP은 찾는 값이 범위의 맨 왼쪽 열에 있을 때만 쓸 수 있다.","a":true,"h":"조회 3형제 중 VLOOKUP 줄 주석은 '가장 익숙, 찾는 값이 맨 왼쪽일 때만'입니다. 그래서 왼쪽 조회가 필요하거나 구버전이면 INDEX-MATCH를 쓰라고 합니다.","w":"맞습니다. VLOOKUP은 범위의 첫 열에서 값을 찾습니다. 왼쪽 조회가 필요하면 INDEX-MATCH나 XLOOKUP을 씁니다.","an":"실습 2-3 STEP 3","src":"### STEP 3. K5·K6·K7에 각각 입력\n```excel\n=XLOOKUP(J5, D:D, F:F) ' 최신·권장 (365)\n=INDEX(F:F, MATCH(J5, D:D, 0)) ' 모든 버전 OK, 왼쪽 조회 가능\n=VLOOKUP(J5, D:F, 3, 0) ' 가장 익숙, 찾는 값이 맨 왼쪽일 때만\n```\n✅ **체크포인트:** 세 함수 모두 **800,000** (결과 동일, 호환성만 다름)\n💡 회사 PC가 구버전이면 INDEX-MATCH를 쓰면 된다."},{"id":"t2-08","ty":"match","lv":2,"game":false,"p":"함수와 체크포인트 결과를 연결하세요.","pairs":[["COUNTIFS 서울·노트북 건수","6건"],["AVERAGEIFS 노트북 평균 금액","11,400,000"],["XLOOKUP 태블릿 단가","800,000"],["FILTER 1,000만원 이상 행","38건"]],"h":"함수 치트시트의 '✓ 결과' 열을 보세요. COUNTIFS는 서울·노트북 건수, AVERAGEIFS는 노트북 평균 금액, XLOOKUP은 태블릿 단가, FILTER는 1,000만원 이상 행 수를 결과로 보여 줍니다.","w":"COUNTIFS 6건, AVERAGEIFS 11,400,000, 조회 3형제 모두 800,000, FILTER 38건이 체크포인트입니다.","an":"실습 2-2~2-4 · 함수 치트시트","src":"## 함수 치트시트 (전부 검증된 값)\n| 함수 | 용도 | 예시 | ✓ 결과 |\n|------|------|------|--------|\n| SUMIFS | 조건부 합계 | `=SUMIFS(G:G,C:C,\"영업1팀\",H:H,1)` | 110,020,000 |\n| COUNTIFS | 조건부 개수 | `=COUNTIFS(B:B,\"서울\",D:D,\"노트북\")` | 6 |\n| AVERAGEIFS | 조건부 평균 | `=AVERAGEIFS(G:G,D:D,\"노트북\")` | 11,400,000 |\n| XLOOKUP | 값 조회 | `=XLOOKUP(J5,D:D,F:F)` | 태블릿→800,000 |\n| SUMIF | 단일조건 합계 | `=SUMIF(B:B,\"NB\",C:C)` | 노트북 3개 |\n| FILTER | 조건 필터 | `=FILTER(A2:H201,G2:G201>=10000000)` | 38건 |\n| IFS | 구간 분류 | `=IFS(G2<1000000,\"소액\",...)` | 소83/중50/고67 |"},{"id":"t2-09","ty":"order","lv":3,"game":false,"p":"<code>=SORT(FILTER(…, G2:G201>=10000000), 7, -1)<\/code>이 결과를 만드는 순서를 맞추세요.","steps":["FILTER가 금액 1,000만원 이상인 행만 고른다","SORT가 7번째 열(금액)을 기준으로 잡는다","-1에 따라 내림차순으로 정렬한다","결과가 아래로 자동으로 펼쳐진다(spill)"],"h":"'읽는 법'에 따르면 안쪽 FILTER가 먼저 조건(금액 1,000만원 이상)에 맞는 행만 고르고, 바깥 SORT가 7번째 열(금액)을 기준으로 -1, 즉 내림차순 정렬합니다. 결과는 아래로 자동으로 펼쳐집니다.","w":"FILTER로 조건에 맞는 행을 고른 뒤, SORT가 7번째 열(금액)을 기준으로 -1(내림차순) 정렬하고, 결과가 자동으로 펼쳐집니다(38건).","an":"실습 2-4 STEP 2","src":"### STEP 2. 빈 셀에 입력\n```excel\n=SORT(FILTER(매출데이터!A2:H201, 매출데이터!G2:G201>=10000000), 7, -1)\n```\n> 읽는 법: FILTER = 조건에 맞는 행만 / SORT의 `7` = 7번째 열(금액) 기준, `-1` = 내림차순.\n\n✅ **체크포인트:** **38건**이 자동으로 펼쳐진다(spill).\n⚠️ 아래 칸에 다른 값이 있으면 `#SPILL!` → 그 칸을 비우면 해결.\n💡 원본이 바뀌면 **자동 갱신** → \"매달 갱신되는 조건별 목록\"에 최적."},{"id":"t2-10","ty":"multi","lv":2,"game":true,"p":"조회 3형제(실습 2-3)에 대한 설명으로 맞는 것을 <b>모두<\/b> 고르세요.","o":["XLOOKUP은 최신·권장(365)","INDEX-MATCH는 모든 버전 가능","세 함수 결과는 모두 800,000","VLOOKUP만 왼쪽 조회 가능","XLOOKUP은 구버전에서도 된다"],"a":[0,1,2],"h":"조회 3형제 주석은 XLOOKUP을 최신·권장(365), INDEX-MATCH를 모든 버전 가능·왼쪽 조회 가능으로 설명합니다. 체크포인트는 세 함수 결과가 모두 같고 호환성만 다르다고 말합니다.","w":"세 함수의 결과는 모두 800,000으로 같고 호환성만 다릅니다. XLOOKUP은 365 권장, INDEX-MATCH는 모든 버전·왼쪽 조회 가능, VLOOKUP은 맨 왼쪽 열 조회만 됩니다.","an":"실습 2-3","src":"### STEP 3. K5·K6·K7에 각각 입력\n```excel\n=XLOOKUP(J5, D:D, F:F) ' 최신·권장 (365)\n=INDEX(F:F, MATCH(J5, D:D, 0)) ' 모든 버전 OK, 왼쪽 조회 가능\n=VLOOKUP(J5, D:F, 3, 0) ' 가장 익숙, 찾는 값이 맨 왼쪽일 때만\n```\n✅ **체크포인트:** 세 함수 모두 **800,000** (결과 동일, 호환성만 다름)\n💡 회사 PC가 구버전이면 INDEX-MATCH를 쓰면 된다."}]},{"id":"t3","title":"병합·급여·수수료","ref":"2교시 · 실습 2-5~2-7","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"주문내역의 제품코드로 제품마스터에서 제품명을 가져올 때 실습에서 쓴 함수는?","o":["SUMIF","XLOOKUP","RANK","TIMEVALUE"],"a":1,"h":"실습 2-5 STEP 2는 주문내역의 제품코드로 제품마스터에서 제품명과 단가를 가져오는 함수를 요청합니다. STEP 3의 D2·E2 수식은 2-3에서 '최신·권장'으로 소개된 조회 함수입니다.","w":"두 표 병합은 XLOOKUP으로 코드를 찾아 제품명·단가를 가져옵니다. 사번→부서, 거래처코드→상호도 같은 원리입니다.","an":"실습 2-5 STEP 3","src":"### STEP 3. D2·E2에 입력하고 6행까지 채우기\n```excel\n=XLOOKUP(B2, 제품마스터!A:A, 제품마스터!B:B) ' D2: 제품명\n=XLOOKUP(B2, 제품마스터!A:A, 제품마스터!C:C) ' E2: 단가\n```"},{"id":"t3-02","ty":"mc","lv":2,"game":true,"p":"코드가 마스터에 없어 생기는 #N/A 대신 '코드확인'이 보이게 감싸는 함수는?","o":["IFERROR","IFS","MAX","TRIM"],"a":0,"h":"실습 2-5의 ⚠️는 코드가 마스터에 없으면 #N/A가 나온다고 경고합니다. 수식에서 오류가 날 때 대신 보여 줄 값을 지정하는 함수로 XLOOKUP을 감싸면 보고서가 깨지지 않습니다.","w":"<code>=IFERROR(XLOOKUP(...), \"코드확인\")<\/code>처럼 감싸면 보고서가 깨지지 않습니다.","an":"실습 2-5 ⚠️","src":"⚠️ 코드가 마스터에 없으면 `#N/A` → `=IFERROR(XLOOKUP(...), \"코드확인\")`으로 감싸면 보고서가 안 깨진다.\n💡 사번→부서·직급, 거래처코드→상호 등 \"코드로 이름 붙이기\"는 전부 같은 원리."},{"id":"t3-03","ty":"num","lv":3,"game":false,"p":"실습 2-5에서 주문 5건의 금액이 2,400,000 · 800,000 · 500,000 · 900,000 · 1,200,000원일 때 <code>=SUM(F2:F6)<\/code>의 주문 총액은 몇 원인가요?","a":5800000,"unit":"원","h":"실습 2-5 STEP 4는 F열에 금액(=C2*E2)을 구한 뒤 F7에 =SUM(F2:F6)으로 총액을 냅니다. 계산식은 2,400,000 + 800,000 + 500,000 + 900,000 + 1,200,000이며, 이것이 주문 5건의 합계입니다.","w":"다섯 금액을 더하면 5,800,000원으로, 실습 2-5의 체크포인트 총액과 같습니다.","an":"실습 2-5 STEP 4 체크포인트","src":"### STEP 4. 금액과 총액\n🖥️ **F2** `=C2*E2` 입력 후 채우기 → **F7** `=SUM(F2:F6)`\n\n✅ **체크포인트:**\n| 주문 | 제품명 | 단가 | 금액 |\n|------|--------|------|------|\n| 1001 | 노트북 | 1,200,000 | 2,400,000 |\n| 1002 | 태블릿 | 800,000 | 800,000 |\n| 1003 | 키보드 | 50,000 | 500,000 |\n| 1004 | 모니터 | 300,000 | 900,000 |\n| 1005 | 노트북 | 1,200,000 | 1,200,000 |\n→ 주문 **총액 5,800,000원**"},{"id":"t3-04","ty":"mc","lv":2,"game":true,"p":"출퇴근 시각이 <b>텍스트<\/b>로 저장돼 있을 때 시간으로 바꿔 계산하는 함수는?","o":["DATE","NOW","TIMEVALUE","TEXTBEFORE"],"a":2,"h":"실습 2-6 STEP 1은 출퇴근 시각이 텍스트로 저장돼 있을 수 있다고 미리 알려 줍니다. 💡 설명처럼 텍스트라면 시간(TIME) 값(VALUE)으로 바꿔 주는 함수로 감싸서 빼기를 합니다.","w":"텍스트 시각은 TIMEVALUE로 감싸 시간 값으로 바꿉니다. 이미 시간 형식이면 <code>=(C2-B2)*24-1<\/code>로도 됩니다.","an":"실습 2-6 STEP 1","src":"### STEP 1. 근무시간 (E2)\n💬 `출근(B)·퇴근(C) 시각으로 근무시간을 구해줘. 점심 1시간 빼고. 시간이 텍스트로 저장돼 있을 수도 있어.`\n```excel\n=(TIMEVALUE(C2)-TIMEVALUE(B2))*24 - 1\n```\n> 💡 시간 형식이라면 `=(C2-B2)*24-1`로도 됨. 텍스트라면 위처럼 TIMEVALUE로 감싼다."},{"id":"t3-05","ty":"mc","lv":3,"game":true,"p":"<code>=MAX(0, (TIMEVALUE(C2)-TIME(18,0,0))*24)<\/code>에서 MAX(0, …)의 역할은?","o":["근무를 8시간으로 제한","18시를 텍스트로 바꿈","시급을 1.5배로 만듦","야근이 음수면 0으로 만듦"],"a":3,"h":"야근시간 수식은 퇴근 시각에서 18시를 빼고 24를 곱해 시간 단위로 바꿉니다. 18시 전에 퇴근하면 그 값이 음수가 되므로, '읽는 법'은 MAX(0, …)가 그런 경우를 어떻게 처리한다고 설명하는지 떠올리세요.","w":"퇴근이 18시 이전이면 계산값이 음수가 됩니다. MAX가 0과 비교해 음수를 0으로 만들어 '야근 없음'을 표현합니다. 8시간 제한은 급여식의 MIN(E2,8)입니다.","an":"실습 2-6 STEP 2","src":"### STEP 2. 야근시간 (F2) — 18시 이후만\n```excel\n=MAX(0, (TIMEVALUE(C2)-TIME(18,0,0))*24)\n```\n> 읽는 법: 퇴근−18시가 음수(야근 없음)면 MAX가 0으로 만들어 준다."},{"id":"t3-06","ty":"ox","lv":1,"game":true,"p":"<code>=SUM($G$2:G2)<\/code>처럼 시작점을 $로 고정하고 아래로 채우면 누계가 된다.","a":true,"h":"실습 2-7 STEP 2의 =SUM($G$2:G2)는 시작점 G2에 $를 붙여 고정하고 끝점은 고정하지 않습니다. 아래로 채우면 범위의 끝만 한 칸씩 늘어나 처음부터 그 행까지의 합계가 됩니다.","w":"맞습니다. 시작점 $G$2는 고정되고 끝점만 늘어나 러닝토탈(누계)이 됩니다. 6월 누계는 978,280,000입니다.","an":"실습 2-7 STEP 2","src":"### STEP 2. 누계(러닝토탈)\n💬 `금액의 누계를 구하는 함수를 만들어줘. 시작점을 고정하는 법도.`\n```excel\n=SUM($G$2:G2) ' $로 시작점 고정 → 아래로 채우면 누계\n```\n✅ 월별 누계: 1월 168,490,000 → 6월 **978,280,000**\n💡 성과급·할인율 같은 \"구간별 계산\", 재고·매출 \"누적 집계\"에 필수."},{"id":"t3-07","ty":"ox","lv":2,"game":true,"p":"500만 이상 5%·100만 이상 3%·그 미만 1% 규칙에서 1,200,000원의 수수료는 60,000원이다.","a":false,"h":"수수료 IFS는 위 조건부터 검사합니다. 1,200,000원은 500만원 미만이지만 100만원 이상이므로 두 번째 구간의 비율을 곱하며, 체크포인트에 그 결과가 나와 있습니다. 5%를 적용한 값과 비교해 보세요.","w":"틀렸습니다. 1,200,000원은 100만 이상 구간이라 3%가 적용되어 36,000원입니다. 60,000원은 5%를 잘못 적용한 값입니다.","an":"실습 2-7 STEP 1","src":"### STEP 1. 구간별 수수료\n💬 `G열 금액에 대해 500만원 이상 5%, 100만원 이상 3%, 그 미만 1% 수수료를 계산하는 함수를 만들어줘.`\n```excel\n=G2 * IFS(G2>=5000000, 0.05, G2>=1000000, 0.03, TRUE, 0.01)\n```\n✅ 6,000,000 → **300,000** / 1,200,000 → **36,000** / 300,000 → **3,000**"},{"id":"t3-08","ty":"match","lv":3,"game":false,"p":"근태 실습(시급 15,000원, 18시 이후 1.5배)에서 퇴근 시각과 하루 급여를 연결하세요.","pairs":[["18:00 퇴근","120,000원"],["19:00 퇴근","142,500원"],["20:00 퇴근","165,000원"],["22:00 퇴근","210,000원"]],"h":"급여는 =MIN(E2,8)*D2 + F2*D2*1.5로, 정규 최대 8시간분에 18시 이후 야근시간×1.5배를 더합니다. 시급 15,000원이면 정규 8시간이 120,000원이고, 야근 1시간마다 22,500원이 추가됩니다.","w":"정규 8시간분 120,000원에 야근 1시간당 22,500원이 더해집니다: 19시 142,500 · 20시 165,000 · 22시 210,000원.","an":"실습 2-6 체크포인트","src":"✅ **체크포인트:**\n| 사원 | 퇴근 | 근무 | 야근 | 급여 | 판정 |\n|------|------|------|------|------|------|\n| 김영업 | 18:00 | 8h | 0h | 120,000 | 정상 |\n| 이기획 | 20:00 | 10h | 2h | 165,000 | 야근 |\n| 박개발 | 22:00 | 12h | 4h | **210,000** | 야근 |\n| 최디자인 | 19:00 | 9h | 1h | 142,500 | 야근 |\n| 정인사 | 18:30 | 8.5h | 0.5h | 131,250 | 야근 |\n\n💡 시간제 강사료·아르바이트 급여·초과근무 수당 계산에 그대로. 시급·배율만 바꾸면 된다."},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"근태 시트에서 급여를 계산한 열의 순서를 맞추세요.","steps":["근무시간 (E2)","야근시간 (F2)","총 급여 (G2)","야근 여부 (H2)"],"h":"근태 실습은 STEP 1~4로 진행합니다. 먼저 출퇴근 시각으로 근무시간을 구하고, 18시 이후 야근시간을 구한 다음, 둘을 이용해 총 급여를 계산하고, 마지막에 야근 여부를 판정합니다.","w":"근무시간과 야근시간을 먼저 구해야 총 급여(정규 최대 8h + 야근×1.5)를 계산할 수 있고, 마지막에 야근 여부를 판정합니다.","an":"실습 2-6 STEP 1~4","src":"## 실습 2-6. 근무시간·급여 계산 — 근태 (10분) [현업 실습 B]\n\n📄 같은 파일의 `근태` 시트\n> **규칙:** 09:00 출근, 점심 1시간 제외, 18시 이후는 1.5배 수당, 시급 15,000원."},{"id":"t3-10","ty":"multi","lv":1,"game":true,"p":"근태 실습의 계산 규칙을 <b>모두<\/b> 고르세요.","o":["점심 1시간 제외","18시 이후 1.5배 수당","시급 15,000원","주말 근무 2배 수당","지각하면 시급 차감"],"a":[0,1,2],"h":"근태 실습의 규칙은 한 줄에 네 가지가 적혀 있습니다. 출근 시각, 점심시간 처리, 18시 이후 수당 배율, 시급이며, 이 규칙이 근무시간·야근·급여 수식에 그대로 반영됩니다.","w":"규칙은 09:00 출근, 점심 1시간 제외, 18시 이후 1.5배 수당, 시급 15,000원입니다. 주말·지각 규칙은 자료에 없습니다.","an":"실습 2-6 규칙","src":"> **규칙:** 09:00 출근, 점심 1시간 제외, 18시 이후는 1.5배 수당, 시급 15,000원."}]},{"id":"t4","title":"Gemini × Google Sheets","ref":"3교시 · 실습 3-1~3-5","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":true,"p":"엑셀 파일을 Google Sheets로 여는 방법은?","o":["엑셀에서 다른 이름으로 저장","Drive 업로드 → 연결 앱 → Sheets","ChatGPT에 파일 업로드","메일로 파일 전송"],"a":1,"h":"실습 3-1은 drive.google.com에서 '새로 만들기 → 파일 업로드'로 xlsx를 올립니다. 이어서 올린 파일을 우클릭해 '연결 앱' 메뉴에서 구글의 스프레드시트 앱을 고르면 Sheets로 열립니다.","w":"Drive에 업로드한 뒤 파일 우클릭 → 연결 앱 → Google Sheets로 엽니다. 그다음 우측 상단 Gemini(✦)로 사이드패널을 엽니다.","an":"실습 3-1","src":"## 실습 3-1. 파일을 Sheets로 올리기 (5분)\n### STEP 1. Drive 업로드\n🖥️ drive.google.com → **새로 만들기 → 파일 업로드** → `AI엑셀실습_통합.xlsx`.\n### STEP 2. Sheets로 열기\n🖥️ 올린 파일 우클릭 → **연결 앱 → Google Sheets**.\n### STEP 3. Gemini 켜기"},{"id":"t4-02","ty":"mc","lv":2,"game":true,"p":"셀 단위로 AI를 호출해 수백 개 문의를 한 번에 분류하는 Sheets 기능은?","o":["QUERY","FILTER","=AI() 함수","XLOOKUP"],"a":2,"h":"실습 3-3은 K2에 수식을 넣고 아래로 채워 J열의 문의를 하나씩 분류합니다. AI 팁은 이 함수가 셀 단위로 AI를 호출해 수백 개 문의를 한 번에 분류·요약한다고 설명합니다.","w":"=AI()는 셀마다 AI를 호출해 분류·요약을 합니다. 엑셀에는 없는 Sheets만의 기능입니다.","an":"실습 3-3","src":"🤖 **AI 팁:** =AI()는 **셀 단위로 AI를 호출**한다 → 수백 개 문의를 한 번에 분류·요약. 엑셀에는 없는 Sheets만의 기능.\n⚠️ Workspace 플랜에 따라 =AI()가 없을 수 있음 → 사이드패널에 \"J열을 분류해줘\"로 대체."},{"id":"t4-03","ty":"mc","lv":2,"game":true,"p":"검증표 기준 지역별 총매출 1위 지역은?","o":["서울","부산","대구","인천"],"a":3,"h":"실습 3-2의 지역별 총매출 검증표는 순위대로 정리되어 있습니다. 227,910,000원으로 1위인 지역이 부산(214,950,000)과 대구(213,450,000)를 앞섭니다.","w":"1위 인천 227,910,000 · 2위 부산 214,950,000 · 3위 대구 213,450,000 · 4위 서울 · 5위 광주 순입니다.","an":"실습 3-2 체크포인트","src":"✅ **체크포인트 (지역별 총매출):**\n| 순위 | 지역 | 총매출 |\n|------|------|--------|\n| 1 | 인천 | 227,910,000 |\n| 2 | 부산 | 214,950,000 |\n| 3 | 대구 | 213,450,000 |\n| 4 | 서울 | 172,780,000 |\n| 5 | 광주 | 149,190,000 |\n⚠️ Gemini의 답이 이 숫자와 **다르면 AI가 틀린 것**. 검증하는 습관!"},{"id":"t4-04","ty":"mc","lv":2,"game":true,"p":"QUERY 문 <code>group by B<\/code>의 뜻은?","o":["B열(지역) 값별로 묶어 집계","B열을 삭제","B열 기준 내림차순 정렬","B열 이름을 바꿈"],"a":0,"h":"QUERY 문은 SQL처럼 \"select B, sum(G) group by B\"로 씁니다. group by는 지정한 열의 같은 값끼리 묶어 sum 같은 집계를 하라는 뜻이며, 이 시트에서 B열은 지역입니다.","w":"group by B는 B열(지역) 값별로 묶어 sum(G)를 집계합니다. 정렬은 order by, 이름 붙이기는 label이 맡습니다.","an":"실습 3-4 STEP 2","src":"### STEP 2. 빈 셀에 입력\n```excel\n=QUERY(A1:H201, \"select B, sum(G) group by B order by sum(G) desc label sum(G) '총매출'\", 1)\n```\n✅ **체크포인트:** 실습 3-2 지역별 총매출과 **같은 숫자**가 나오면 성공."},{"id":"t4-05","ty":"mc","lv":3,"game":true,"p":"Gemini가 낸 지역별 총매출이 검증표와 다를 때 올바른 판단은?","o":["검증표가 틀렸다","AI가 틀린 것 — 검증 습관","반올림 차이니 무시한다","다른 지역으로 바꿔 묻는다"],"a":1,"h":"실습 3-2의 ⚠️는 Gemini의 답이 검증표 숫자와 다르면 누가 틀린 것인지 단정합니다. 3원칙의 'AI 결과는 반드시 검증'과 같은 메시지로, 검증하는 습관을 강조합니다.","w":"검증표는 실제 데이터로 검증된 값입니다. 다르면 AI가 틀린 것이므로, AI 답을 늘 검증하는 습관이 필요합니다.","an":"실습 3-2 ⚠️","src":"⚠️ Gemini의 답이 이 숫자와 **다르면 AI가 틀린 것**. 검증하는 습관!"},{"id":"t4-06","ty":"ox","lv":1,"game":true,"p":"=AI() 함수는 엑셀에는 없는 Google Sheets만의 기능이다.","a":true,"h":"실습 3-3의 AI 팁은 =AI() 함수가 셀 단위로 AI를 호출해 수백 개 문의를 한 번에 분류·요약한다고 설명하고, 마지막에 엑셀과 비교해 어떤 기능인지 덧붙입니다.","w":"맞습니다. 셀 단위 AI 호출은 Sheets만의 기능입니다.","an":"실습 3-3 🤖","src":"🤖 **AI 팁:** =AI()는 **셀 단위로 AI를 호출**한다 → 수백 개 문의를 한 번에 분류·요약. 엑셀에는 없는 Sheets만의 기능.\n⚠️ Workspace 플랜에 따라 =AI()가 없을 수 있음 → 사이드패널에 \"J열을 분류해줘\"로 대체."},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"=AI() 함수는 Workspace 플랜과 상관없이 항상 쓸 수 있다.","a":false,"h":"실습 3-3의 ⚠️는 Workspace 플랜에 따라 =AI()가 없을 수도 있다고 경고합니다. 그럴 때는 사이드패널에 \"J열을 분류해줘\"라고 요청하는 방식으로 대체합니다.","w":"틀렸습니다. 플랜에 따라 =AI()가 없을 수 있습니다. 그때는 사이드패널에 'J열을 분류해줘'라고 요청해 대체합니다.","an":"실습 3-3 ⚠️","src":"⚠️ Workspace 플랜에 따라 =AI()가 없을 수 있음 → 사이드패널에 \"J열을 분류해줘\"로 대체."},{"id":"t4-08","ty":"match","lv":2,"game":false,"p":"지역과 검증표의 총매출을 연결하세요.","pairs":[["인천","227,910,000"],["부산","214,950,000"],["대구","213,450,000"],["광주","149,190,000"]],"h":"지역별 총매출 검증표는 1위 인천, 2위 부산, 3위 대구, 4위 서울, 5위 광주 순입니다. 숫자가 클수록 순위가 높으니 금액의 크기를 비교해 연결하세요. QUERY 결과도 같은 숫자가 나와야 합니다.","w":"검증표 순서는 인천 > 부산 > 대구 > 서울(172,780,000) > 광주입니다. QUERY 결과도 이 숫자와 같아야 성공입니다.","an":"실습 3-2 · 3-4 체크포인트","src":"✅ **체크포인트 (지역별 총매출):**\n| 순위 | 지역 | 총매출 |\n|------|------|--------|\n| 1 | 인천 | 227,910,000 |\n| 2 | 부산 | 214,950,000 |\n| 3 | 대구 | 213,450,000 |\n| 4 | 서울 | 172,780,000 |\n| 5 | 광주 | 149,190,000 |\n⚠️ Gemini의 답이 이 숫자와 **다르면 AI가 틀린 것**. 검증하는 습관!"},{"id":"t4-09","ty":"order","lv":1,"game":false,"p":"Sheets에서 Gemini 분석을 시작하는 순서를 맞추세요.","steps":["Drive에 xlsx 파일 업로드","연결 앱 → Google Sheets로 열기","우측 상단 Gemini(✦)로 사이드패널 열기","사이드패널에 분석 요청 입력"],"h":"실습 3-1은 Drive에 파일을 업로드하고, 연결 앱에서 Google Sheets로 연 뒤, 우측 상단 Gemini(✦)를 눌러 사이드패널을 엽니다. 실습 3-2에서 그 패널에 분석 요청을 입력합니다.","w":"Drive 업로드 → Sheets로 열기 → Gemini 사이드패널 → 분석 요청 순서입니다.","an":"실습 3-1~3-2","src":"## 실습 3-1. 파일을 Sheets로 올리기 (5분)\n### STEP 1. Drive 업로드\n🖥️ drive.google.com → **새로 만들기 → 파일 업로드** → `AI엑셀실습_통합.xlsx`.\n### STEP 2. Sheets로 열기\n🖥️ 올린 파일 우클릭 → **연결 앱 → Google Sheets**.\n### STEP 3. Gemini 켜기\n🖥️ 우측 상단 **Gemini(✦)** 클릭 → 사이드패널이 열린다.\n## 실습 3-2. 사이드패널 분석 (15분)"},{"id":"t4-10","ty":"multi","lv":1,"game":true,"p":"회의록→액션아이템 실습에서 표로 정리한 열을 <b>모두<\/b> 고르세요.","o":["담당자","할 일","기한","회의 장소","참석 인원"],"a":[0,1,2],"h":"실습 3-5는 회의록 문장을 붙여넣고 '누가·무엇을·언제까지'를 표로 정리하게 합니다. 체크포인트는 결과가 3열 표로 변환된다고 하며, 프롬프트 따옴표 안에 세 열의 이름이 적혀 있습니다.","w":"회의록에서 '담당자·할 일·기한' 3열을 뽑아 표로 만듭니다. 장소·인원은 요청하지 않았습니다.","an":"실습 3-5","src":"## 실습 3-5. 줄글에서 표 데이터 추출 — 회의록→액션아이템 (10분)\n### STEP 1. 회의록을 그대로 붙여넣기\n💬\n```\n아래 회의록에서 '담당자·할 일·기한'을 표로 정리해줘.\n\"김대리가 다음주 금요일까지 매출자료 취합하고, 이과장은 20일까지 보고서 작성.\"\n```\n✅ **체크포인트:** 담당자/할일/기한 3열 표로 변환된다.\n💡 회의록·메일·메모 속 정보를 표로 정리하는 데 바로 활용.\n\n---\n# 4교시 — 파일 업로드 분석 & 업무 지표 (60분)"}]},{"id":"t5","title":"업로드 분석 & 업무 지표","ref":"4교시 · 실습 4-1~4-6","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"회사 데이터를 AI에 올릴 수 없을 때 이 자료가 권하는 연습 방법은?","o":["실데이터 일부만 올린다","같은 구조의 가상 데이터로 연습","화면을 캡처해 올린다","이름만 지우고 올린다"],"a":1,"h":"실습 4-1은 회사 데이터를 AI에 올릴 수 없을 때를 다룹니다. 열 구성은 그대로 두고 내용만 지어낸 데이터를 ChatGPT로 만들어 같은 절차를 연습하라고 합니다.","w":"같은 구조의 가짜(가상) 데이터를 만들어 절차를 연습합니다. 일부만 올리거나 캡처해도 실데이터 노출은 같습니다.","an":"실습 4-1","src":"## 실습 4-1. 보안용 가상 데이터 생성 (7분)\n\n> 회사 데이터를 못 올릴 때, **같은 구조의 가짜 데이터**로 절차를 연습한다."},{"id":"t5-02","ty":"mc","lv":2,"game":true,"p":"제품별 매출 구성비에서 노트북+태블릿이 차지하는 비중은?","o":["48.9%","38.1%","87%","100%"],"a":2,"h":"제품별 구성비는 노트북 48.9%, 태블릿 38.1%, 모니터 10.1%, 키보드 1.8%, 마우스 1.1%입니다. 두 제품의 비율을 더하면 파레토 법칙처럼 상위 소수가 대부분을 차지한다는 것을 알 수 있습니다.","w":"노트북 48.9% + 태블릿 38.1% = 약 87%입니다. 상위 소수가 대부분을 차지하는 파레토 현상입니다.","an":"실습 4-2 체크포인트","src":"✅ **체크포인트 (구성비):** 노트북 **48.9%** / 태블릿 **38.1%** / 모니터 10.1% / 키보드 1.8% / 마우스 1.1%\n→ 노트북+태블릿 = **87%** (파레토: 상위 소수가 대부분을 차지)"},{"id":"t5-03","ty":"mc","lv":1,"game":true,"p":"RFM 분석의 R이 뜻하는 것은?","o":["순위(Rank)","최근성(Recency)","매출(Revenue)","반복(Repeat)"],"a":1,"h":"RFM은 세 영어 단어의 머리글자로 우수 고객을 가려내는 기법입니다. R은 Recency로, 실습 4-6 STEP 1에서 기준일로부터 며칠 전에 구매했는지를 계산하는 지표입니다.","w":"RFM = 최근성(Recency) · 빈도(Frequency) · 금액(Monetary)입니다.","an":"실습 4-6","src":"> RFM = 최근성(**R**ecency)·빈도(**F**requency)·금액(**M**onetary)으로 우수 고객을 가려내는 대표 기법."},{"id":"t5-04","ty":"num","lv":3,"game":false,"p":"목표실적 시트에서 전체 목표가 1,380, 실적이 1,411일 때 전체 달성률은 몇 %인가요? (소수 첫째 자리까지)","a":102.2,"unit":"%","h":"전체 달성률은 =SUM(C2:C5)/SUM(B2:B5), 즉 전체 실적 합계 ÷ 전체 목표 합계입니다. 계산식은 1,411 ÷ 1,380 × 100이며, 100%를 넘으면 전체적으로 목표를 초과 달성했다는 뜻입니다.","w":"1,411 ÷ 1,380 = 약 1.022 → 102.2%입니다. 엑셀에서는 <code>=SUM(C2:C5)/SUM(B2:B5)<\/code>에 % 서식을 줍니다.","an":"실습 4-5 STEP 4","tol":0.05,"src":"### STEP 4. 전체 달성률 (빈 셀)\n```excel\n=SUM(C2:C5)/SUM(B2:B5)\n```\n\n✅ **체크포인트:**\n| 팀 | 목표 | 실적 | 달성률 | 판정 | 초과 | 순위 |\n|----|------|------|--------|------|------|------|\n| 영업1팀 | 450 | 502 | **111.6%** | 달성 | +52 | 1위 |\n| 영업2팀 | 300 | 241 | **80.3%** | 미달 | −59 | 4위 |"},{"id":"t5-05","ty":"mc","lv":3,"game":true,"p":"AI에게 7월 매출 예측을 받을 때 주의할 점으로 가장 알맞은 것은?","o":["근거를 요구하고 이상치 왜곡 고려","예측치를 확정 목표로 쓴다","한 가지 방식만 쓴다","5월 급등을 그대로 반영한다"],"a":0,"h":"실습 4-3 STEP 3의 ⚠️는 AI 예측이 참고용이라고 합니다. 예측에 대한 '근거 설명'을 꼭 요구하고, 5월 급등(+93.1%) 같은 이상치가 예측을 왜곡할 수 있음을 기억하라고 합니다.","w":"AI 예측은 참고용입니다. 근거 설명을 꼭 요구하고, 5월 급등 같은 이상치가 예측을 왜곡할 수 있음을 기억해야 합니다.","an":"실습 4-3 STEP 3 ⚠️","src":"### STEP 3. 간단 예측 (주의 포함)\n💬 `월별 추세로 7월 매출을 단순평균과 추세선 두 방식으로 예측하고, 그렇게 본 근거를 설명해줘.`\n⚠️ AI 예측은 **참고용**. \"근거 설명\"을 꼭 요구하고, 5월 급등 같은 이상치가 예측을 왜곡할 수 있음을 기억."},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"표 스크린샷 이미지도 AI에 올리면 엑셀에 붙여넣을 표 데이터로 바꿔 받을 수 있다.","a":true,"h":"실습 4-4는 PDF나 종이 보고서 속 표를 손으로 다시 치지 않는 방법입니다. 표 스크린샷을 올리고 CSV(또는 탭 구분 텍스트)로 정리해 달라고 하면, 체크포인트처럼 AI가 이미지를 읽어 표 데이터로 바꿔 줍니다.","w":"맞습니다. 이미지를 올리고 'CSV(또는 탭 구분 텍스트)로 정리해줘'라고 요청하면 표 데이터로 변환해 줍니다.","an":"실습 4-4","src":"## 실습 4-4. 이미지(표 스크린샷)를 데이터로 변환 (8분) ⭐\n\n> PDF·종이 보고서 속 표를 손으로 다시 치지 않는다."},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"RFM 실습에서 총점 6점인 고객은 VIP 등급이다.","a":false,"h":"등급 수식은 =IFS(I2>=8,\"VIP\", I2>=6,\"우수\", TRUE,\"일반\")입니다. 총점이 어느 기준 이상이어야 VIP인지 확인하고, 체크포인트에서 총점 6점인 C유통의 등급을 보세요.","w":"틀렸습니다. VIP는 총점 8점 이상이고, 6점은 '우수'입니다(C유통).","an":"실습 4-6 STEP 3","src":"### STEP 3. 총점(I2)·등급(J2)·VIP만 뽑기\n```excel\n=F2+G2+H2\n=IFS(I2>=8,\"VIP\", I2>=6,\"우수\", TRUE,\"일반\")\n=FILTER(A2:A6, I2:I6>=8) ' 엑셀 365 — VIP만 추출\n```\n\n✅ **체크포인트:**\n| 고객 | R | F | M | 총점 | 등급 |"},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"팀과 목표 달성률을 연결하세요.","pairs":[["영업1팀 (목표 450 · 실적 502)","111.6%"],["영업2팀 (목표 300 · 실적 241)","80.3%"],["영업3팀 (목표 280 · 실적 318)","113.6%"],["영업4팀 (목표 350 · 실적 350)","100.0%"]],"h":"달성률은 실적 ÷ 목표입니다. 실적이 목표보다 크면 100%를 넘고, 같으면 정확히 100%, 작으면 100% 미만입니다. 각 팀의 목표·실적 숫자로 직접 나누어 보면 연결할 수 있습니다.","w":"달성률은 C2/B2입니다. 목표와 실적이 같은 영업4팀은 정확히 100.0%, 실적이 목표보다 적은 영업2팀만 '미달'입니다.","an":"실습 4-5 체크포인트","src":"✅ **체크포인트:**\n| 팀 | 목표 | 실적 | 달성률 | 판정 | 초과 | 순위 |\n|----|------|------|--------|------|------|------|\n| 영업1팀 | 450 | 502 | **111.6%** | 달성 | +52 | 1위 |\n| 영업2팀 | 300 | 241 | **80.3%** | 미달 | −59 | 4위 |\n| 영업3팀 | 280 | 318 | 113.6% | 달성 | +38 | 3위 |\n| 영업4팀 | 350 | 350 | 100.0% | 달성 | 0 | 2위 |\n> 전체: 목표 1,380 / 실적 1,411 → **102.2%**\n\n💡 부서 KPI·예산 집행률·판매 목표 관리에 그대로."},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"RFM 고객 등급을 만드는 순서를 맞추세요.","steps":["최근성(며칠 전 구매) 계산","R·F·M 점수 매기기","세 점수를 더해 총점 계산","총점으로 VIP·우수·일반 등급 부여"],"h":"RFM 실습은 먼저 기준일에서 구매일을 빼 최근성을 구하고, R·F·M 각각에 1~3점을 매깁니다. 그다음 세 점수를 더해 총점을 내고, 총점 기준으로 VIP·우수·일반 등급을 붙입니다.","w":"기준일에서 구매일을 빼 최근성을 구하고, IFS로 R·F·M 점수를 매긴 뒤 합산해 등급을 붙입니다.","an":"실습 4-6 STEP 1~3","src":"### STEP 1. 최근성 = 며칠 전 구매했나 (E2)\n```excel\n=DATE(2024,6,30) - B2 ' 검증용 기준일. 실무에선 =TODAY()-B2\n```\n✅ A상사 5일 · B물산 60일 · C유통 20일 · D전자 76일 · E마트 2일\n### STEP 2. R·F·M 점수 (F·G·H열)\n💬\n```\n고객별 점수 함수를 만들어줘.\n- R: 15일 이내 3점, 30일 이내 2점, 그 외 1점\n- F(구매횟수): 10회 이상 3점, 5회 이상 2점, 그 외 1점\n- M(누적금액): 200만 이상 3점, 100만 이상 2점, 그 외 1점\n```\n```excel\n=IFS(E2<=15,3, E2<=30,2, TRUE,1) ' F열: R\n=IFS(C2>=10,3, C2>=5,2, TRUE,1) ' G열: F (C=구매횟수)\n=IFS(D2>=2000000,3, D2>=1000000,2, TRUE,1) ' H열: M (D=누적금액)\n```\n### STEP 3. 총점(I2)·등급(J2)·VIP만 뽑기\n```excel\n=F2+G2+H2\n=IFS(I2>=8,\"VIP\", I2>=6,\"우수\", TRUE,\"일반\")"},{"id":"t5-10","ty":"multi","lv":2,"game":true,"p":"RFM 실습 결과 <b>VIP<\/b> 등급 고객을 모두 고르세요.","o":["A상사","E마트","C유통","B물산","D전자"],"a":[0,1],"h":"RFM 체크포인트 표에서 총점 9점(R·F·M 모두 3점)인 고객이 두 곳 있습니다. 등급 기준은 총점 8점 이상이 VIP이고, 이탈 위험 고객으로는 D전자·B물산이 꼽혀 있습니다.","w":"A상사와 E마트가 총점 9점으로 VIP입니다. C유통은 6점 '우수', B물산·D전자는 3점 '일반'이자 이탈 위험 고객입니다.","an":"실습 4-6 체크포인트","src":"✅ **체크포인트:**\n| 고객 | R | F | M | 총점 | 등급 |\n|------|---|---|---|------|------|\n| A상사 | 3 | 3 | 3 | 9 | **VIP** |\n| E마트 | 3 | 3 | 3 | 9 | **VIP** |\n| C유통 | 2 | 2 | 2 | 6 | 우수 |\n| B물산 | 1 | 1 | 1 | 3 | 일반 |\n| D전자 | 1 | 1 | 1 | 3 | 일반 |\n\n💡 VIP엔 재구매 혜택, 이탈위험(낮은 R: D전자·B물산)엔 재방문 안내 → **마케팅 예산을 데이터로 배분**."}]},{"id":"t6","title":"데이터 정제·텍스트 처리","ref":"5교시 · 실습 5-1~5-5","qs":[{"id":"t6-01","ty":"mc","lv":2,"game":true,"p":"정제 결과에서 원래 '24.1.7'이던 날짜의 올바른 값은?","o":["2007-01-24","2024-01-07","2024-07-01","2001-07-24"],"a":1,"h":"정제실습 시트의 '24.1.7'은 yy.m.d 형식입니다. 프롬프트에 'yy.m.d는 2024년으로 해석'이라고 명시했으므로 24는 연도, 1은 월, 7은 일이 되어야 하며, 자동 변환 도구가 2007-01-24로 잘못 읽는 사고를 경고합니다.","w":"올바른 값은 2024-01-07입니다. 자동 변환 도구가 2007-01-24로 잘못 인식하는 사고가 실제로 나므로 결과를 눈으로 검증해야 합니다.","an":"실습 5-1 🔴 STEP 3","src":"### 🔴 STEP 3. 검증의 함정 직접 확인 (이 과정 전체에서 가장 중요)\n🖥️ 정제 결과에서 `24.1.7`이 들어 있던 행의 날짜를 확인한다.\n> `24.1.7`을 자동 변환 도구가 **2007-01-24로 잘못 인식**하는 사고가 실제로 난다.\n> - 잘못된 결과 ❌: 2007-01-24\n> - 올바른 결과 ✅: **2024-01-07**\n>\n> **대응 2가지:** ① 프롬프트에 \"yy.m.d는 2024년으로 해석\" **명시** ② 결과를 **눈으로 검증**.\n> 공문·보고서에 이런 오류가 들어가면 되돌릴 수 없다. **\"AI는 검증해야 한다\"의 살아있는 증거.**"},{"id":"t6-02","ty":"mc","lv":1,"game":true,"p":"정제실습 시트를 정제한 뒤 행 수의 변화(체크포인트)는?","o":["8행 → 5행","200행 → 38행","8행 → 8행","10행 → 5행"],"a":0,"h":"실습 5-1의 정제 요청은 공백 제거, 날짜 통일, 금액 숫자화, 빈 행·완전 중복 행 제거 후 정제 전후 행 수를 알려 달라고 합니다. 체크포인트에 정제 전과 후의 행 수가 화살표로 적혀 있습니다.","w":"공백·날짜·₩기호 정리 후 빈 행과 완전 중복 행을 제거하면 8행이 5행이 됩니다.","an":"실습 5-1 STEP 2 체크포인트","src":"### STEP 2. 해석 규칙을 **명시**해서 정제 요청\n💬\n```\n업로드한 파일의 '정제실습' 시트를 정제해줘.\n1) 텍스트 앞뒤 공백 제거\n2) 날짜를 YYYY-MM-DD로 통일 (yy.m.d 형식은 2024년으로 해석)\n3) 금액을 숫자로 변환(₩, 콤마 제거)\n4) 빈 행·완전 중복 행 제거\n정제 전후 행 수도 알려줘.\n```\n✅ **체크포인트:** **8행 → 5행**"},{"id":"t6-03","ty":"mc","lv":1,"game":true,"p":"'서울시 강남구 테헤란로 123'에서 첫 공백 앞의 '서울시'를 뽑는 365 함수는?","o":["VLOOKUP","COUNTIF","TEXTBEFORE","RANK"],"a":2,"h":"실습 5-2 STEP 1은 구분자 공백(\" \")을 기준으로 그 앞(before)의 텍스트를 잘라 내는 365 신함수를 씁니다. 구를 뽑을 때는 뒤쪽을 잘라 내는 함수와 겹쳐 씁니다.","w":"<code>=TEXTBEFORE(A2, \" \")<\/code>는 첫 공백 앞의 글자를 돌려줍니다. 구(강남구)는 TEXTAFTER와 겹쳐 씁니다.","an":"실습 5-2 STEP 1","src":"### STEP 1. 주소에서 시·구 분리 (A2 = `서울시 강남구 테헤란로 123`)\n```excel\n=TEXTBEFORE(A2, \" \") ' 시 → 서울시\n=TEXTBEFORE(TEXTAFTER(A2, \" \"), \" \") ' 구 → 강남구\n```\n✅ **서울시 / 강남구**"},{"id":"t6-04","ty":"mc","lv":2,"game":true,"p":"<code>=IFS(G2<1000000, \"소액\", G2<5000000, \"중액\", TRUE, \"고액\")<\/code>에서 TRUE의 뜻은?","o":["오류를 무시한다","빈 셀만 뜻한다","앞 조건을 반복한다","나머지 전부"],"a":3,"h":"IFS는 조건을 위에서부터 차례로 검사해 처음 참이 되는 값을 돌려줍니다. 마지막에 TRUE를 조건으로 두면 항상 참이므로, 앞의 조건에 걸리지 않은 경우를 모두 받아 줍니다.","w":"IFS는 조건을 위에서부터 검사하며, TRUE는 '나머지 전부'를 뜻합니다. 결과는 소액 83 · 중액 50 · 고액 67건입니다.","an":"실습 5-3 STEP 2","src":"> 읽는 법: 조건을 위에서부터 검사, `TRUE`는 \"나머지 전부\".\n✅ **체크포인트:** 소액 **83건** / 중액 **50건** / 고액 **67건** (COUNTIF로"},{"id":"t6-05","ty":"mc","lv":2,"game":true,"p":"C열에 '영업1팀/영업2팀/영업3팀'만 고를 수 있게 해 입력 실수를 막는 기능은?","o":["조건부 서식","데이터 유효성 검사(목록)","정규식","피벗 테이블"],"a":1,"h":"실습 5-4 STEP 2의 AI 답은 '데이터' 메뉴의 한 기능에서 제한 대상을 '목록'으로 바꾸고 원본에 세 팀 이름을 적으라고 합니다. 입력 실수를 원천 차단해 집계 오류를 예방합니다.","w":"데이터 → 데이터 유효성 검사 → 제한 대상 '목록'으로 드롭다운을 만듭니다. 조건부 서식은 색 표시, 정규식은 텍스트 추출입니다.","an":"실습 5-4 STEP 2","src":"### STEP 2. 드롭다운(데이터 유효성)\n💬 `C열에 '영업1팀/영업2팀/영업3팀'만 고를 수 있는 드롭다운을 만드는 법을 클릭 순서로 알려줘.`\n✅ AI 답: \"데이터 → 데이터 유효성 검사 → 제한 대상 '목록' → 원본에 `영업1팀,영업2팀,영업3팀`\"\n💡 입력 실수를 원천 차단 → 뒤 단계 집계 오류를 예방."},{"id":"t6-06","ty":"ox","lv":1,"game":true,"p":"TEXTBEFORE·TEXTAFTER는 365 신함수라 구버전에서는 LEFT·MID·FIND 조합으로 대신한다.","a":true,"h":"실습 5-2의 ⚠️는 TEXTBEFORE/AFTER가 엑셀 365에 새로 생긴 함수라고 말합니다. 구버전에서는 STEP 2에서 쓴 LEFT·MID·FIND 같은 함수 조합으로 바꿔 달라고 AI에 요청하라고 안내합니다.","w":"맞습니다. 구버전이면 AI에게 'LEFT·MID·FIND 조합으로 바꿔줘'라고 요청합니다.","an":"실습 5-2 ⚠️","src":"⚠️ TEXTBEFORE/AFTER는 365 신함수 → 구버전은 \"LEFT·MID·FIND 조합으로 바꿔줘\"라고 AI에 요청."},{"id":"t6-07","ty":"ox","lv":2,"game":true,"p":"자동 변환 도구로 날짜를 정리했다면 결과를 눈으로 검증할 필요는 없다.","a":false,"h":"날짜 함정 설명은 자동 변환 도구가 '24.1.7'을 2007-01-24로 잘못 인식하는 사고가 실제로 난다고 말합니다. 대응 2가지 중 두 번째와, '공문·보고서에 들어가면 되돌릴 수 없다'는 경고를 떠올리세요.","w":"틀렸습니다. 24.1.7 → 2007-01-24 같은 오인식이 실제로 일어나므로 결과를 반드시 눈으로 검증해야 합니다.","an":"실습 5-1 🔴","src":"> `24.1.7`을 자동 변환 도구가 **2007-01-24로 잘못 인식**하는 사고가 실제로 난다.\n> - 잘못된 결과 ❌: 2007-01-24\n> - 올바른 결과 ✅: **2024-01-07**\n>\n> **대응 2가지:** ① 프롬프트에 \"yy.m.d는 2024년으로 해석\" **명시** ② 결과를 **눈으로 검증**.\n> 공문·보고서에 이런 오류가 들어가면 되돌릴 수 없다. **\"AI는 검증해야 한다\"의 살아있는 증거.**"},{"id":"t6-08","ty":"match","lv":3,"game":false,"p":"A2='서울시 강남구 테헤란로 123', D2='NB-2024-001'일 때 수식과 결과를 연결하세요.","pairs":[["=TEXTBEFORE(A2, \" \")","서울시"],["=TEXTBEFORE(TEXTAFTER(A2, \" \"), \" \")","강남구"],["=LEFT(D2, FIND(\"-\",D2)-1)","NB"],["=MID(D2, FIND(\"-\",D2)+1, 4)","2024"]],"h":"TEXTBEFORE(A2, \" \")는 첫 공백 앞을, TEXTAFTER 안에 넣으면 첫 공백 뒤 문자열에서 다시 첫 공백 앞을 뽑습니다. LEFT(D2, FIND(\"-\",D2)-1)은 첫 하이픈 앞을, MID(D2, FIND(\"-\",D2)+1, 4)는 하이픈 다음 4글자를 가져옵니다.","w":"TEXTBEFORE는 공백 앞, TEXTAFTER→TEXTBEFORE는 두 번째 단어, LEFT+FIND는 첫 '-' 앞(NB), MID는 첫 '-' 다음 4글자(2024)를 뽑습니다.","an":"실습 5-2 STEP 1~2","src":"### STEP 1. 주소에서 시·구 분리 (A2 = `서울시 강남구 테헤란로 123`)\n```excel\n=TEXTBEFORE(A2, \" \") ' 시 → 서울시\n=TEXTBEFORE(TEXTAFTER(A2, \" \"), \" \") ' 구 → 강남구\n```\n✅ **서울시 / 강남구**\n### STEP 2. 코드에서 분류·연도 추출 (D2 = `NB-2024-001`)\n```excel\n=LEFT(D2, FIND(\"-\",D2)-1) ' NB\n=MID(D2, FIND(\"-\",D2)+1, 4) ' 2024\n```\n✅ **NB / 2024**\n⚠️ TEXTBEFORE/AFTER는 365 신함수 → 구버전은 \"LEFT·MID·FIND 조합으로 바꿔줘\"라고 AI에 요청.\n### STEP 3. 정규식으로 이메일·전화 뽑기\n💬\n```"},{"id":"t6-09","ty":"order","lv":2,"game":false,"p":"실습 5-1 정제 요청에 적은 단계의 순서를 맞추세요.","steps":["텍스트 앞뒤 공백 제거","날짜를 YYYY-MM-DD로 통일","금액을 숫자로 변환(₩·콤마 제거)","빈 행·완전 중복 행 제거"],"h":"실습 5-1의 정제 요청은 번호 1)~4)로 순서를 정합니다. 텍스트의 공백부터 지우고, 날짜 형식을 통일한 다음, 금액의 ₩·콤마를 없애 숫자로 바꾸고, 마지막에 빈 행과 중복 행을 지웁니다.","w":"프롬프트에 1) 공백 2) 날짜 통일(yy.m.d는 2024년) 3) 금액 숫자화 4) 빈 행·중복 제거 순으로 규칙을 명시했습니다.","an":"실습 5-1 STEP 2","src":"### STEP 2. 해석 규칙을 **명시**해서 정제 요청\n💬\n```\n업로드한 파일의 '정제실습' 시트를 정제해줘.\n1) 텍스트 앞뒤 공백 제거\n2) 날짜를 YYYY-MM-DD로 통일 (yy.m.d 형식은 2024년으로 해석)\n3) 금액을 숫자로 변환(₩, 콤마 제거)\n4) 빈 행·완전 중복 행 제거\n정제 전후 행 수도 알려줘.\n```\n✅ **체크포인트:** **8행 → 5행**"},{"id":"t6-10","ty":"multi","lv":2,"game":true,"p":"날짜 함정에 대한 '대응 2가지'를 <b>모두<\/b> 고르세요.","o":["해석 규칙을 프롬프트에 명시","결과를 눈으로 검증","날짜 열을 삭제","자동 변환 결과를 신뢰","날짜를 텍스트로만 저장"],"a":[0,1],"h":"날짜 함정의 대응 2가지는 ①과 ②로 적혀 있습니다. 하나는 프롬프트에 해석 규칙(\"yy.m.d는 2024년으로 해석\")을 미리 적어 두는 것이고, 다른 하나는 결과를 사람이 직접 확인하는 것입니다.","w":"대응은 ① 프롬프트에 'yy.m.d는 2024년으로 해석' 명시 ② 결과를 눈으로 검증, 두 가지입니다.","an":"실습 5-1 🔴 대응 2가지","src":"> **대응 2가지:** ① 프롬프트에 \"yy.m.d는 2024년으로 해석\" **명시** ② 결과를 **눈으로 검증**.\n> 공문·보고서에 이런 오류가 들어가면 되돌릴 수 없다. **\"AI는 검증해야 한다\"의 살아있는 증거.**"}]},{"id":"t7","title":"VBA 매크로 자동화","ref":"6교시 · 실습 6-1~6-6","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"저장할 때 매크로가 사라지지 않게 하는 파일 형식은?","o":[".xlsx",".csv",".xlsm",".pdf"],"a":2,"h":"실습 6-1 STEP 4는 파일을 'Excel 매크로 사용 통합 문서' 형식으로 다른 이름으로 저장하라고 경고합니다. 일반 .xlsx로 저장하면 매크로가 전부 사라지며, 확장자 끝 글자 m은 macro를 뜻합니다.","w":"'Excel 매크로 사용 통합 문서(*.xlsm)'로 저장해야 합니다. .xlsx로 저장하면 매크로가 전부 사라집니다.","an":"실습 6-1 STEP 4","src":"### STEP 4. ⚠️ 반드시 .xlsm으로 저장\n🖥️ `AI엑셀실습_통합.xlsx`를 다른 이름으로 저장 → 형식 **`Excel 매크로 사용 통합 문서(*.xlsm)`** (예: AI엑셀실습_통합.xlsm).\n> 이걸 안 하면 저장할 때 매크로가 전부 사라진다!"},{"id":"t7-02","ty":"mc","lv":1,"game":true,"p":"VBA 편집기를 열기 전에 리본에 표시해야 하는 탭은?","o":["데이터","개발 도구","수식","검토"],"a":1,"h":"실습 6-1 STEP 1은 파일 → 옵션 → 리본 사용자 지정에서 오른쪽 목록의 한 탭에 체크합니다. STEP 2에서 이 탭의 Visual Basic을 눌러 편집기를 엽니다.","w":"리본 사용자 지정에서 [개발 도구]를 체크하면 개발 도구 → Visual Basic으로 편집기를 열 수 있습니다.","an":"실습 6-1 STEP 1","src":"### STEP 1. 개발 도구 탭 표시\n🖥️ 파일 → 옵션 → **리본 사용자 지정** → 오른쪽 목록 **[개발 도구] 체크** → 확인."},{"id":"t7-03","ty":"mc","lv":2,"game":true,"p":"대화형 매크로(6-3)에서 사용자에게 제품명을 물어보는 기능은?","o":["MsgBox","AutoFit","ChartObjects","InputBox"],"a":3,"h":"실습 6-3의 매크로는 실행하면 입력창을 띄워 어떤 제품을 추출할지 묻습니다. 재미 포인트 괄호 안에 사용자의 입력을 받는 VBA 기능 이름이 적혀 있으며, 'Input(입력)'과 'Box(상자)'를 합친 이름입니다.","w":"InputBox가 입력창을 띄워 제품명을 묻고, 대답에 따라 그 제품의 행만 새 시트로 복사합니다. MsgBox는 알림만 보여 줍니다.","an":"실습 6-3","src":"> **재미 포인트:** 매크로가 **나에게 질문**하고, 대답에 따라 다르게 움직인다. (InputBox 활용)"},{"id":"t7-04","ty":"mc","lv":2,"game":false,"p":"시트 통합(6-2)을 요청할 때 '1월','2월','3월' 시트만 명시해야 하는 이유는?","o":["파일에 매출데이터·근태 등 다른 시트도 있어서","VBA는 시트 3개까지만 처리해서","시트 이름이 한글이어서","각 시트에 헤더가 없어서"],"a":0,"h":"실습 6-2 STEP 1은 이 파일에 매출데이터·근태 등 다른 시트도 함께 있다고 경고합니다. \"모든 시트\"를 합치라고 하면 관계없는 시트까지 섞이므로, 합칠 시트만 이름으로 명시해야 합니다.","w":"이 파일에는 매출데이터·근태 등 다른 시트도 있어서, '모든 시트'라고 하면 엉뚱한 데이터까지 합쳐집니다. 대상 시트를 명시해야 합니다.","an":"실습 6-2 STEP 1","src":"### STEP 1. AI에 요청 (⚠️ 대상 시트를 명시!)\n> 이 파일엔 매출데이터·근태 등 **다른 시트도 함께** 있다. \"모든 시트\"가 아니라 **'1월','2월','3월'만** 합치라고 명시해야 한다.\n💬\n```\n이 파일에는 여러 시트가 있어. 그중 '1월','2월','3월' 시트의 데이터만"},{"id":"t7-05","ty":"mc","lv":3,"game":false,"p":"6-5에서 실행 버튼을 '요약' 시트가 아니라 '매출데이터' 시트에 다는 이유는?","o":["버튼은 원본 시트에서만 작동해서","요약 시트는 읽기 전용이어서","요약 시트는 실행 때마다 지워졌다 다시 만들어져서","차트가 버튼을 가려서"],"a":2,"h":"실습 6-5 STEP 4는 버튼을 매출데이터 시트에 다는 이유를 괄호 속 ⚠️로 설명합니다. 요약 매크로는 실행할 때마다 '요약' 시트를 지우고 새로 만들기 때문에, 그곳에 둔 버튼은 함께 사라집니다.","w":"요약 시트는 실행할 때마다 삭제·재생성되므로 거기 둔 버튼은 사라집니다. 그래서 원본인 매출데이터 시트에 버튼을 답니다.","an":"실습 6-5 STEP 4 ⚠️","src":"### STEP 4. 버튼 달기\n🖥️ **매출데이터** 시트에서(⚠️ 요약 시트는 실행 때마다 삭제·재생성되므로 버튼을 거기 두면 사라진다) 개발 도구 → **삽입 → 단추(양식 컨트롤)** → 드래그로 그리기 → 매크로 지정 창에서 `요약전체` 선택 → 버튼 이름을 \"요약 새로고침\"으로 수정.\n✅ **체크포인트:** 버튼 클릭 → **표와 차트가 한 번에** 다시 만들어지고 작성일시가 갱신된다.\n💡 **이 순간이 자동화의 완성** — 매크로를 모르는 동료도 버튼만 누르면 표+차트 대시보드가 나온다."},{"id":"t7-06","ty":"ox","lv":1,"game":true,"p":"VBA를 몰라도 무엇을 자동화할지 한글로 설명하면 AI가 코드를 만들어 준다.","a":true,"h":"실습 6-2의 AI 팁은 실행 전에 코드가 하는 일을 줄별로 설명해 달라고 하라고 권합니다. 그리고 VBA를 몰라도 무엇을 자동화할지 어떤 언어로 설명하기만 하면 코드가 나온다고 말합니다.","w":"맞습니다. 자동화할 일을 한글로 설명하면 코드가 나오고, '줄별로 설명해줘'로 배우면서 쓸 수 있습니다.","an":"실습 6-2 🤖","src":"🤖 **AI 팁:** 실행 전 `이 코드가 무슨 일을 하는지 줄별로 설명해줘`로 학습. VBA를 몰라도 \"무엇을 자동화할지 한글로 설명\"만 하면 코드가 나온다."},{"id":"t7-07","ty":"ox","lv":2,"game":true,"p":"지역별 시트 분리 매크로(6-4)는 여러 번 다시 실행해도 데이터가 중복으로 쌓이지 않는다.","a":false,"h":"지역별분리 매크로는 지역 시트가 이미 있으면 그 시트의 마지막 행 아래에 데이터를 이어 붙입니다. 실습 6-4의 ⚠️는 다시 실행하면 어떻게 되는지와, 기존 지역 시트를 먼저 지우게 개선을 요청하라고 안내합니다.","w":"틀렸습니다. 다시 실행하면 중복으로 쌓입니다. AI에 '기존 지역 시트를 먼저 지우게 수정해줘'라고 개선을 요청합니다.","an":"실습 6-4 ⚠️","src":"⚠️ 다시 실행하면 중복으로 쌓인다 → AI에 `실행할 때 기존 지역 시트를 먼저 지우게 수정해줘`라고 개선 요청 (개선 요청도 연습!)."},{"id":"t7-08","ty":"match","lv":2,"game":false,"p":"매크로와 체크포인트 결과를 연결하세요.","pairs":[["시트통합","통합 완료! 총 21행"],["제품추출 (노트북)","노트북 42행 추출 완료"],["지역별분리","서울 44 · 인천 46 · 대구 40 …"],["요약대시보드","영업1팀 501,940,000"]],"h":"6교시 체크포인트는 시트 통합 21행(1월 9 + 2월 6 + 3월 6), 노트북 추출 42행, 지역 분리 행 수(서울 44 등), 대시보드의 영업1팀 총매출입니다. 각 매크로가 마지막에 띄우는 메시지나 결과를 떠올려 연결하세요.","w":"시트통합은 1월 9 + 2월 6 + 3월 6 = 21행, 노트북 추출 42행, 지역 분리 합계 200행, 요약은 부서별 총매출입니다.","an":"실습 6-2~6-5 체크포인트","src":"- [ ] **6교시:** 시트통합 21행 · 노트북 추출 42행 · 지역 분리(서울44 등) · 대시보드 501,940,000 · **막대 차트(영업1팀 최고)** · 버튼 클릭(표+차트) · .xlsm 저장\n- [ ] **7교시:** ChatGPT 단독 7단계 완주 · 날짜(2024-01-07)·수치 검증 · 회고 체크리스트 저장"},{"id":"t7-09","ty":"order","lv":1,"game":false,"p":"VBA 개발 환경을 준비하는 순서를 맞추세요.","steps":["리본 사용자 지정에서 [개발 도구] 체크","개발 도구 → Visual Basic 클릭","편집기에서 삽입 → 모듈",".xlsm 형식으로 다른 이름으로 저장"],"h":"실습 6-1은 네 단계입니다. 리본 사용자 지정에서 개발 도구 탭을 켜고, 그 탭의 Visual Basic으로 편집기를 열고, 삽입 메뉴로 모듈을 추가한 뒤, 매크로가 사라지지 않는 형식으로 다른 이름으로 저장합니다.","w":"개발 도구 탭을 켜고 편집기를 연 뒤 모듈을 추가하고, 매크로가 사라지지 않게 .xlsm으로 저장합니다.","an":"실습 6-1 STEP 1~4","src":"## 실습 6-1. 개발 환경 켜기 (8분)\n### STEP 1. 개발 도구 탭 표시\n🖥️ 파일 → 옵션 → **리본 사용자 지정** → 오른쪽 목록 **[개발 도구] 체크** → 확인.\n### STEP 2. 편집기 열기\n🖥️ **개발 도구 → Visual Basic** 클릭.\n### STEP 3. 모듈 추가\n🖥️ 편집기 메뉴 **삽입 → 모듈**. (코드는 여기에 붙여넣는다)\n### STEP 4. ⚠️ 반드시 .xlsm으로 저장"},{"id":"t7-10","ty":"multi","lv":2,"game":true,"p":"엑셀 파일이 느릴 때 AI가 짚은 흔한 원인을 <b>모두<\/b> 고르세요.","o":["전체 열 참조·휘발성 함수 과다","조건부 서식 누적","안 쓰는 서식·이미지","시트 이름이 한글","글꼴 크기가 작음"],"a":[0,1,2],"h":"실습 6-6 STEP 2에서 AI가 짚은 느린 파일의 원인은 전체 열 참조·휘발성 함수(NOW·INDIRECT) 과다, 조건부 서식 누적, 안 쓰는 서식·이미지입니다. 네 번째는 원인이 아니라 원인을 격리하는 점검 방법입니다.","w":"흔한 원인은 전체 열 참조·휘발성 함수(NOW·INDIRECT) 과다, 조건부 서식 누적, 안 쓰는 서식·이미지입니다. 수동 계산으로 바꿔 원인을 격리해 점검합니다.","an":"실습 6-6 STEP 2","src":"### STEP 2. 느린 파일 진단\n💬 `엑셀 파일이 너무 느려. 흔한 원인과 점검·해결 방법을 순서대로 알려줘.`\n✅ AI 답 요지: ① 전체 열 참조·휘발성 함수(NOW·INDIRECT) 과다 ② 조건부 서식 누적 ③ 안 쓰는 서식·이미지 ④ 수동 계산 전환으로 원인 격리."}]},{"id":"t8","title":"종합 프로젝트 & 오류 해결","ref":"7교시 · 참고 자료","qs":[{"id":"t8-01","ty":"mc","lv":1,"game":true,"p":"7교시 미니프로젝트에서 7단계를 모두 진행하는 곳은?","o":["단계마다 새 대화창","하나의 ChatGPT 대화창","Gemini와 번갈아 가며","엑셀 매크로 안에서만"],"a":1,"h":"7교시 프로젝트 규칙 첫 줄은 모든 단계를 어디에서 진행하라고 굵게 강조합니다. 1교시에서 배운 프롬프트 체이닝을 실전에 쓰려면 앞 단계의 대화가 이어져 있어야 한다는 점을 떠올리세요.","w":"모든 단계를 하나의 ChatGPT 대화창에서 이어서 진행합니다. 프롬프트 체이닝의 실전입니다.","an":"7교시 · 프로젝트 규칙","src":"> **프로젝트 규칙**\n> - 모든 단계를 **하나의 ChatGPT 대화창**에서 진행한다 (1교시의 프롬프트 체이닝 실전!)\n> - 각 단계 끝의 ✅를 확인하고 다음 단계로 넘어간다\n> - 막히면 \"다시\", \"더 자세히\", \"표로\"처럼 **이어서** 요청한다"},{"id":"t8-02","ty":"mc","lv":2,"game":true,"p":"프로젝트 5단계(예측)에서 AI에게 반드시 요구할 것은?","o":["예측의 근거 설명","차트 색상","메일 제목","시트 이름"],"a":0,"h":"STEP 5의 제목이 '근거를 요구하라'입니다. 7월 매출을 두 방식으로 예측하게 하면서, 어느 쪽을 왜 더 신뢰할지와 5월 급등이 예측을 어떻게 왜곡하는지 설명해 달라고 요청합니다.","w":"예측은 단순평균과 추세선 두 방식으로 구하고, 어느 쪽을 왜 신뢰할지 근거를 요구합니다. 5월 급등이 예측을 왜곡할 수 있다는 점도 확인합니다.","an":"7교시 STEP 5","src":"### STEP 5. 예측 — 근거를 요구하라 (7분)\n💬\n```\n월별 추세를 바탕으로 7월 매출을 예측해줘.\n단순평균과 추세선 두 방식으로 각각 구하고,\n어느 쪽을 왜 더 신뢰할지, 5월 급등이 예측을 어떻게 왜곡할 수 있는지 설명해줘.\n```\n✅ **체크포인트:** 두 방식의 값이 **다르게** 나오고, AI가 \"이상치(5월) 때문에 오차 가능\"을 인정하면 성공.\n⚠️ 예측치는 보고서에 \"참고 전망\"으로만 표기."},{"id":"t8-03","ty":"mc","lv":2,"game":true,"p":"<code>#DIV/0!<\/code> 오류의 원인은?","o":["찾는 값이 없음","참조 셀 삭제","0으로 나눔","동적 배열 자리 막힘"],"a":2,"h":"오류 해결표에서 #DIV/0!는 이름 그대로 DIVide by 0, 나누는 수가 0일 때 생기는 오류입니다. 해결 열에는 IFERROR로 0을 대신 보여 주는 수식이 적혀 있습니다.","w":"#DIV/0!은 0으로 나눌 때 나옵니다. <code>=IFERROR(수식,0)<\/code>으로 처리합니다. #N/A는 값 없음, #REF!는 참조 삭제, #SPILL!은 자리 막힘입니다.","an":"참고 · 오류 해결표","src":"## 오류 해결표\n| 증상 | 원인 | 해결 |\n|------|------|------|\n| `#N/A` | 찾는 값 없음·공백·형식 | TRIM·형식통일·IFERROR |\n| `#REF!` | 참조 셀 삭제 | 범위 재지정 |\n| `#VALUE!` | 텍스트를 숫자 연산 | 형식 변환 |\n| `#DIV/0!` | 0으로 나눔 | `=IFERROR(수식,0)` |\n| `#SPILL!` | 동적배열 자리 막힘 | 아래 칸 비우기 |\n| XLOOKUP 안 됨 | 구버전 엑셀 | INDEX-MATCH / VLOOKUP |\n| 매크로 사라짐 | `.xlsx`로 저장 | `.xlsm`으로 저장 |\n| 날짜 오인식 | 모호한 형식(yy.m.d) | \"2024로 해석\" 명시 + 검증 |"},{"id":"t8-04","ty":"mc","lv":2,"game":true,"p":"'매크로가 사라짐' 증상의 해결 방법은?","o":["IFERROR로 감싸기","아래 칸 비우기","범위 재지정",".xlsm으로 저장"],"a":3,"h":"오류 해결표에서 '매크로 사라짐'의 원인은 .xlsx로 저장한 것입니다. 실습 6-1 STEP 4에서도 매크로 사용 통합 문서 형식으로 저장하라고 경고했던 내용을 떠올리세요.","w":"매크로는 .xlsx로 저장하면 사라지므로 .xlsm(매크로 사용 통합 문서)으로 저장합니다.","an":"참고 · 오류 해결표","src":"## 오류 해결표\n| 증상 | 원인 | 해결 |\n|------|------|------|\n| `#N/A` | 찾는 값 없음·공백·형식 | TRIM·형식통일·IFERROR |\n| `#REF!` | 참조 셀 삭제 | 범위 재지정 |\n| `#VALUE!` | 텍스트를 숫자 연산 | 형식 변환 |\n| `#DIV/0!` | 0으로 나눔 | `=IFERROR(수식,0)` |\n| `#SPILL!` | 동적배열 자리 막힘 | 아래 칸 비우기 |\n| XLOOKUP 안 됨 | 구버전 엑셀 | INDEX-MATCH / VLOOKUP |\n| 매크로 사라짐 | `.xlsx`로 저장 | `.xlsm`으로 저장 |\n| 날짜 오인식 | 모호한 형식(yy.m.d) | \"2024로 해석\" 명시 + 검증 |"},{"id":"t8-05","ty":"mc","lv":3,"game":true,"p":"STEP 7 보고 메일의 수치를 검증하는 올바른 방법은?","o":["AI가 쓴 수치를 그대로 믿는다","원본 수치와 하나씩 대조한다","문장을 더 길게 다시 쓴다","숫자를 모두 빼고 보낸다"],"a":1,"h":"STEP 7 체크포인트는 총매출 9.78억, 5월 +93%/4월 −33%, 상위 2개 제품 87%가 요약과 메일에 정확히 들어갔는지 확인하라고 합니다. AI가 쓴 수치를 무엇과 하나씩 대조하라고 했는지 떠올리세요.","w":"요약과 메일에 들어간 총매출 9.78억, 5월 +93%/4월 −33%, 상위 2개 제품 87%를 원본 수치와 대조해야 합니다.","an":"7교시 STEP 7","src":"### STEP 7. 보고 — 요약문 + 메일 초안 (6분)\n💬\n```\n지금까지의 분석을 종합해서\n1) 경영진 보고용 3줄 요약 (수치 포함)\n2) 팀장에게 보낼 보고 메일 초안 (제목 포함, 정중하고 간결하게)\n을 작성해줘.\n```\n✅ **체크포인트:** 총매출 9.78억 · 5월 +93%/4월 −33% · 상위 2개 제품 87%가 요약과 메일에 정확히 들어가 있는지 **원본 수치와 대조**.\n🖥️ 이어서 체이닝으로 다듬기: `더 간결하게` `개조식으로` `숫자를 앞으로`."},{"id":"t8-06","ty":"ox","lv":1,"game":true,"p":"AI 예측치는 보고서에 '참고 전망'으로만 표기한다.","a":true,"h":"STEP 5 체크포인트는 두 예측 방식의 값이 다르게 나오고, AI가 5월 이상치 때문에 오차가 있을 수 있음을 인정하면 성공이라고 합니다. 그 아래 ⚠️가 예측치를 보고서에 어떻게 표기하라고 하는지 확인하세요.","w":"맞습니다. 예측은 이상치 등으로 왜곡될 수 있으니 확정 수치가 아닌 참고 전망으로 표기합니다.","an":"7교시 STEP 5 ⚠️","src":"✅ **체크포인트:** 두 방식의 값이 **다르게** 나오고, AI가 \"이상치(5월) 때문에 오차 가능\"을 인정하면 성공.\n⚠️ 예측치는 보고서에 \"참고 전망\"으로만 표기."},{"id":"t8-07","ty":"ox","lv":2,"game":true,"p":"프로젝트 정제 단계에서 날짜가 2007-01-24로 나와도 다음 단계로 넘어가면 된다.","a":false,"h":"프로젝트 STEP 2 체크포인트는 8행 → 5행과 함께 날짜가 2024-01-07로 나와야 한다고 합니다. 괄호 안에 2007로 나오면 어떻게 하라고 적혀 있는지 확인하세요. 5교시의 날짜 함정을 실전에서 검증하는 단계입니다.","w":"틀렸습니다. 2024-01-07이 나와야 하며, 2007로 나오면 다시 요청해야 합니다. 5교시 날짜 함정을 실전에서 검증하는 단계입니다.","an":"7교시 STEP 2","src":"### STEP 2. 정제 — 규칙을 명시하고 검증 (5분)\n💬\n```\n'정제실습' 시트를 정제해줘.\n1) 공백 제거 2) 날짜 YYYY-MM-DD 통일 (yy.m.d는 2024년으로 해석)\n3) 금액 숫자화(₩·콤마 제거) 4) 빈 행·완전 중복 제거.\n정제 전후 행 수와 정제된 표를 보여줘.\n```\n✅ **체크포인트:** 8행 → **5행** · 날짜에 **2024-01-07** 확인 (2007이면 재요청!)\n> 🔴 5교시의 날짜 함정을 실전에서 스스로 검증하는 단계다."},{"id":"t8-08","ty":"match","lv":2,"game":false,"p":"오류 증상과 해결 방법을 연결하세요.","pairs":[["#N/A","TRIM·형식 통일·IFERROR"],["#REF!","범위 재지정"],["#VALUE!","형식 변환"],["#SPILL!","아래 칸 비우기"]],"h":"오류 해결표를 보면 #N/A는 찾는 값이 없거나 공백·형식 문제, #REF!는 참조 셀이 삭제된 경우, #VALUE!는 텍스트를 숫자로 연산한 경우, #SPILL!은 동적 배열 자리가 막힌 경우입니다. 원인에 맞는 해결을 연결하세요.","w":"#N/A는 찾는 값 없음·공백·형식, #REF!는 참조 셀 삭제, #VALUE!는 텍스트를 숫자로 연산, #SPILL!은 동적 배열 자리 막힘이 원인입니다.","an":"참고 · 오류 해결표","src":"## 오류 해결표\n| 증상 | 원인 | 해결 |\n|------|------|------|\n| `#N/A` | 찾는 값 없음·공백·형식 | TRIM·형식통일·IFERROR |\n| `#REF!` | 참조 셀 삭제 | 범위 재지정 |\n| `#VALUE!` | 텍스트를 숫자 연산 | 형식 변환 |\n| `#DIV/0!` | 0으로 나눔 | `=IFERROR(수식,0)` |\n| `#SPILL!` | 동적배열 자리 막힘 | 아래 칸 비우기 |\n| XLOOKUP 안 됨 | 구버전 엑셀 | INDEX-MATCH / VLOOKUP |\n| 매크로 사라짐 | `.xlsx`로 저장 | `.xlsm`으로 저장 |\n| 날짜 오인식 | 모호한 형식(yy.m.d) | \"2024로 해석\" 명시 + 검증 |"},{"id":"t8-09","ty":"order","lv":2,"game":false,"p":"7교시 미니프로젝트 7단계의 순서를 맞추세요.","steps":["진단","정제","분석","시각화","예측","자동화","보고"],"h":"7교시 프로젝트 회고 프롬프트는 7단계를 화살표로 이어 적습니다. 데이터 상태를 먼저 보고, 지저분한 것을 정리하고, 분석해 차트로 그린 뒤, 앞날을 내다보고, 매크로로 만들고, 마지막에 보고합니다.","w":"진단 → 정제 → 분석 → 시각화 → 예측 → 자동화 → 보고. 회고에서 이 7단계를 다음 달용 프롬프트 체크리스트로 정리합니다.","an":"7교시 · 프로젝트 회고","src":"지금까지 우리가 한 7단계(진단→정제→분석→시각화→예측→자동화→보고)를\n다음 달에 재사용할 수 있는 '프롬프트 체크리스트'로 정리해줘.\n```"},{"id":"t8-10","ty":"multi","lv":1,"game":true,"p":"이 자료가 정리한 'AI 활용 3대 습관'을 <b>모두<\/b> 고르세요.","o":["맥락을 준다","검증한다","대화로 다듬는다","한 번에 완벽을 기대한다","숫자 확인은 생략한다"],"a":[0,1,2],"h":"AI 활용 3대 습관은 세 줄입니다. 데이터 구조·상황·형식을 함께 설명하고, 숫자·날짜·코드 결과를 눈으로 확인하며, 한 번에 완벽을 기대하지 말고 이어서 요청하는 것입니다.","w":"3대 습관은 ① 맥락을 준다 ② 검증한다(특히 숫자·날짜·코드) ③ 대화로 다듬는다입니다.","an":"참고 · AI 활용 3대 습관","src":"## AI 활용 3대 습관\n1. **맥락을 준다** — 데이터 구조·상황·원하는 형식을 함께 설명한다.\n2. **검증한다** — 특히 숫자·날짜·코드는 결과를 눈으로 확인한다. (날짜 함정을 기억!)\n3. **대화로 다듬는다** — 한 번에 완벽을 기대하지 말고 이어서 요청한다."}]}]};
const app=document.getElementById('app');
if(!BANK){app.innerHTML='<p>문제은행 데이터가 없습니다. <code>python develop/build.py</code>로 빌드한 파일을 여세요.</p>';return;}

/* ── 상수 · 인덱스 ─────────────────────── */
const TYPES={mc:['객관식','--ty-mc'],multi:['복수 선택','--ty-multi'],ox:['O / X','--ty-ox'],match:['짝 맞추기','--ty-match'],order:['순서 맞추기','--ty-order'],num:['계산','--ty-num']};
const GUIDE={mc:'알맞은 답을 하나 고르세요.',multi:'알맞은 것을 모두 고르세요.',ox:'맞으면 O, 틀리면 X를 고르세요.',
  match:'왼쪽 항목을 누른 뒤 짝이 되는 오른쪽 항목을 누르세요. 연결된 항목을 다시 누르면 풀립니다.',
  order:'첫 번째부터 순서대로 클릭하세요. 번호가 붙은 항목을 다시 누르면 그 번호부터 뒤 번호가 지워집니다.',num:'숫자만 입력하세요.'};
/* 게임 모드 목록 — 새 게임은 여기에 항목을 추가한다 (설정·출제 유형·규칙 문구를 모드별로) */
const GAME_MODES={
  timeattack:{title:'⚡ 타임어택',desc:'제한시간 안에 풀수록 점수가 커집니다. 시간이 다 되면 오답!',
    types:['mc','ox','multi'],times:[5,7,10,15],defaultTime:10},
};

const GAME_SLOTS=['timeattack',null,null];

const TABS=BANK.tabs, QMAP={}, QTAB={};
TABS.forEach((t,ti)=>{t.idx=ti;t.qs.forEach(q=>{QMAP[q.id]=q;QTAB[q.id]=t;});});
const ALLQ=TABS.flatMap(t=>t.qs);
const RM=matchMedia('(prefers-reduced-motion: reduce)');

/* ── 저장소 (실패해도 동작) ─────────────── */
const KEY='qb:'+BANK.id+':v1';
const blank=()=>({name:'',tabs:{},wrong:{},board:[],drafts:{}});  // drafts: 채점 전 탭별 풀던 답
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw));}catch(e){}
try{const u=window.QB&&QB.user();if(!S.name&&u&&u.name)S.name=u.name;}catch(e){}  // 로그인 이름 동기화(사용자가 동작하기 전엔 저장하지 않음)
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const gameUnlocked=()=>Object.keys(S.tabs).length>0;
const allGraded=()=>TABS.every(t=>S.tabs[t.id]);

/* 순위 저장소 — 공유 순위로 바꿀 때 이 객체만 교체 */
// 순위는 같은 조건(게임 모드 + 풀이 시간)끼리만 비교한다. key = 'timeattack:10'
const boardKey=r=>`${r.mode||'timeattack'}:${r.time||'-'}`;
const Leaderboard={
  load(key){return S.board.filter(r=>boardKey(r)===key).sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at);},
  add(rec){S.board.push(rec);
    const list=this.load(boardKey(rec)), rank=list.findIndex(r=>r.id===rec.id)+1;
    // 조건별 상위 50개만 보관
    const keep=new Set(Object.values(S.board.reduce((m,r)=>{(m[boardKey(r)]=m[boardKey(r)]||[]).push(r);return m;},{}))
      .flatMap(l=>l.sort((a,b)=>b.score-a.score||b.rate-a.rate||a.at-b.at).slice(0,50)).map(r=>r.id));
    S.board=S.board.filter(r=>keep.has(r.id));save();return rank;}
};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=n=>[...Array(n).keys()];
const derange=n=>{if(n<2)return range(n);let s;do{s=shuffle(range(n));}while(s.every((v,i)=>v===i));return s;};
const sortN=a=>a.slice().sort((x,y)=>x-y);
const today=()=>new Date().toLocaleDateString('ko-KR');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function say(msg){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=msg,30);}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('📋 클립보드에 복사했습니다');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'📋 클립보드에 복사했습니다':'복사하지 못했습니다. 인쇄 기능을 이용하세요.');
}

/* ── 채점 · 답 표시 ───────────────────── */
function isCorrect(q,a){
  if(a==null)return false;
  switch(q.ty){
    case 'mc':case 'ox':return a===q.a;
    case 'multi':{if(!Array.isArray(a)||a.length!==q.a.length)return false;const x=sortN(a),y=sortN(q.a);return x.every((v,i)=>v===y[i]);}
    case 'match':return q.pairs.every((_,i)=>a[i]===i);
    case 'order':return a.length===q.steps.length&&a.every((v,i)=>v===i);
    case 'num':return String(a).trim()!==''&&Math.abs(Number(a)-q.a)<=(q.tol??1e-6);
  }
  return false;
}
function correctText(q){
  switch(q.ty){
    case 'mc':return q.o[q.a];
    case 'multi':return q.a.map(i=>q.o[i]).join(', ');
    case 'ox':return q.a?'O':'X';
    case 'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ');
    case 'order':return q.steps.join(' → ');
    case 'num':return q.a+(q.unit||'');
  }
}
function answerText(q,a){
  if(a==null)return '(미응답)';
  switch(q.ty){
    case 'mc':return q.o[a]??'(미응답)';
    case 'multi':return a.length?sortN(a).map(i=>q.o[i]).join(', '):'(미응답)';
    case 'ox':return a?'O':'X';
    case 'match':return q.pairs.map((p,i)=>p[0]+' → '+(a[i]!=null?q.pairs[a[i]][1]:'?')).join(' / ');
    case 'order':return a.map(i=>q.steps[i]).join(' → ');
    case 'num':return a+(q.unit||'');
  }
}

function markSolved(id){if(S.wrong[id]&&!S.wrong[id].solved){S.wrong[id].solved=true;S.wrong[id].at=Date.now();}}

let cur=null;  // {mode,list,ans,touched,msel,shuf,graded,armed,tab}
function newSheet(mode,list,tab){
  const c={mode,list,tab,ans:{},touched:new Set(),msel:{},shuf:{},hints:new Set(),srcs:new Set(),graded:false,armed:false,onlyWrong:false};
  list.forEach(q=>{
    if(q.ty==='match')c.shuf[q.id]=derange(q.pairs.length);
    if(q.ty==='order')c.shuf[q.id]=derange(q.steps.length);  // 화면 배치(고정). 답 = 클릭한 순서의 단계 인덱스 배열
  });
  return c;
}
const answered=q=>isAnswered(q,cur.ans[q.id]);
function isAnswered(q,a){
  switch(q.ty){
    case 'mc':return Number.isInteger(a);
    case 'ox':return typeof a==='boolean';
    case 'multi':return Array.isArray(a)&&a.length>0;
    case 'match':return !!a&&Object.keys(a).length===q.pairs.length;
    case 'order':return Array.isArray(a)&&a.length===q.steps.length;
    case 'num':return a!=null&&String(a).trim()!==''&&!isNaN(Number(a));
  }
}
const finalAns=q=>answered(q)?cur.ans[q.id]:null;

    const m=a||{}, sel=cur.msel[q.id], linkedBy={};

    const left=q.pairs.map((p,i)=>{
      const linked=m[i]!=null, cls=(linked?' linked':'')+(sel===i?' sel':'')+(g?(m[i]===i?' okm':' nom'):'');

    }).join('');

      return `<button type="button" class="oitem${cls}" data-act="ord" data-q="${q.id}" data-s="${si}" data-fk="${q.id}-o${si}" aria-pressed="${on}"${lock}>`+
        `<span class="num">${on?pos+1:''}</span><span class="txt">${esc(q.steps[si])}</span>${fix}</button>`;
    }).join('')+'</div>'+(g&&!full?'<p class="guide">(순서를 끝까지 매기지 않아 미응답 처리)</p>':'');
  }else if(q.ty==='num'){
    const cls=g?(ok?'ans':'miss'):'';
    body=`<div class="numrow"><input class="${cls}" type="text" inputmode="decimal" data-act="num" data-q="${q.id}" value="${esc(a??'')}" aria-label="숫자 답"${lock}><span>${esc(q.unit||'')}</span></div>`;
  }

  const exp=g?`<div class="exp"><p><b>정답</b> ${numAns}${esc(correctText(q))}</p>${ok?'':`<p class="mine">내 답: ${esc(answerText(q,fa))}</p>`}<p>${q.w}</p><p class="an">📖 자료 위치: ${esc(q.an)}</p></div>`:'';
  const src=cur.mode==='retry'?`<span class="qsrc">${QTAB[q.id].idx+1}. ${esc(QTAB[q.id].title)}</span>`:'';
  return `<article class="q${g?(ok?' correct':' wrong')+' locked':''}" id="card-${q.id}" data-n="${n}" style="--tc:var(${color})">`+
    `<div class="qhead"><span class="qn">Q${n}</span><span class="tbadge">${label}</span>${lvHTML(q.lv)}${src}${g?`<span class="verdict">${ok?'✓ 정답':'✗ 오답'}</span>`:''}</div>`+
    `<div class="qt">${q.p}</div>${mediaHTML(q)}${hintHTML(q)}${g?'':`<p class="guide">${GUIDE[q.ty]}</p>${voiceRow(q,q.id)}`}${body}${exp}</article>`;

const LV_NAME=['쉬움','보통','어려움'];

const srcText=t=>esc(t).replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');

/* ── 음성 선택 · 문제 읽기 · 그림/오디오 (qb-voice.js가 없으면 모두 숨김) ── */

/* 학습 화면 상호작용 */
function onSheetClick(el){
  const q=QMAP[el.dataset.q];if(!q)return;
  if(el.dataset.act==='hint'){cur.hints.has(q.id)?cur.hints.delete(q.id):cur.hints.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(el.dataset.act==='src'){cur.srcs.has(q.id)?cur.srcs.delete(q.id):cur.srcs.add(q.id);refreshCard(q);return;}  // 채점 후에도 열고 닫기 가능
  if(cur.graded)return;
  const act=el.dataset.act;
  if(act==='ox'){cur.ans[q.id]=el.dataset.v==='1';}
  else if(act==='ml'){
    const i=+el.dataset.i, m=cur.ans[q.id]||(cur.ans[q.id]={});
    if(m[i]!=null){delete m[i];cur.msel[q.id]=null;}
    else cur.msel[q.id]=cur.msel[q.id]===i?null:i;
  }else if(act==='mr'){
    const j=+el.dataset.j, m=cur.ans[q.id]||(cur.ans[q.id]={}), sel=cur.msel[q.id];
    const by=Object.keys(m).find(l=>m[l]===j);
    if(by!=null)delete m[by];
    if(sel!=null){m[sel]=j;cur.msel[q.id]=null;}
  }else if(act==='ord'){
    const si=+el.dataset.s, seq=cur.ans[q.id]||(cur.ans[q.id]=[]), pos=seq.indexOf(si);
    if(pos>=0)seq.length=pos;  // 1번을 누르면 전부 리셋, 2번을 누르면 1번은 남고 2번부터 삭제
    else seq.push(si);
  }else return;
  cur.armed=false;
  refreshCard(q);
}
function onSheetChange(el){
  const q=QMAP[el.dataset.q];if(!q||cur.graded)return;
  if(el.dataset.act==='pick')cur.ans[q.id]=+el.dataset.i;
  else if(el.dataset.act==='tick'){
    cur.ans[q.id]=[...app.querySelectorAll(`input[data-act="tick"][data-q="${q.id}"]:checked`)].map(x=>+x.dataset.i);
  }

function viewStudy(tid,fresh){
  const tab=TABS.find(t=>t.id===tid)||TABS[0];
  cur=newSheet('study',tab.qs,tab);
  const rec=S.tabs[tab.id], draft=S.drafts[tab.id];
  if(fresh){delete S.drafts[tab.id];save();}
  else if(draft){Object.assign(cur.ans,JSON.parse(JSON.stringify(draft)));}  // 풀던 중이면 이어서
  else if(rec&&rec.answers){
    Object.assign(cur.ans,JSON.parse(JSON.stringify(rec.answers)));
    (rec.touched||[]).forEach(id=>cur.touched.add(id));
    cur.graded=true;
  }
  renderSheet();
}

function sheetResultHTML(){
  const n=cur.list.length, score=cur.list.filter(q=>isCorrect(q,finalAns(q))).length, p=pct(score,n);
  const msg=p===100?'만점입니다! 🎉':p>=80?'잘했어요. 틀린 문항의 해설과 자료 위치를 확인하세요.':p>=60?'절반 이상 이해했어요. 오답노트로 다시 풀어 보세요.':'자료를 한 번 더 읽고 다시 풀어 보세요.';
  return `<div class="panel"><div class="score">${score}<small> / ${n} · ${p}%</small></div><p class="msg">${msg}</p>
    ${cur.mode==='study'&&gameUnlocked()?'<a class="btn" href="#game">⚡ 게임 모드 도전</a>':''}</div>`;

function gradeSheet(){
  const miss=cur.list.map((q,i)=>answered(q)?0:i+1).filter(Boolean);
  if(miss.length&&!cur.armed){
    cur.armed=true;
    document.getElementById('warn').textContent=`미응답 ${miss.length}문항 (Q${miss.join(', Q')}). 한 번 더 누르면 미응답은 오답으로 채점합니다.`;
    return;
  }
  const firstUnlock=!gameUnlocked();
  cur.graded=true;
  const snap={};let score=0;
  cur.list.forEach(q=>{
    const a=finalAns(q);
    if(a!=null)snap[q.id]=a;
    if(isCorrect(q,a)){score++;markSolved(q.id);}
    else addWrong(q.id,answerText(q,a));
  });
  if(cur.mode==='study'){
    S.tabs[cur.tab.id]={score,total:cur.list.length,answers:snap,touched:[...cur.touched],at:Date.now()};
    delete S.drafts[cur.tab.id];
  }
  save();
  renderSheet();
  window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
  say(`채점 결과 ${score}점, ${cur.list.length}문항 중`);
  if(cur.mode==='study'&&firstUnlock)setTimeout(()=>toast('⚡ 게임 모드와 해설지가 열렸습니다!'),300);
  else if(cur.mode==='study'&&allGraded())setTimeout(()=>toast('★ 모든 탭 완료! 종합 결과를 확인하세요.'),300);
}

let G=null;
const gameSetup={mode:'timeattack',count:10,scope:'all',time:GAME_MODES.timeattack.defaultTime};
function gamePool(scope){
  const M=GAME_MODES[gameSetup.mode];
  const base=ALLQ.filter(q=>q.game&&!q.audio&&M.types.includes(q.ty));  // 오디오 문항은 제한시간 안에 들을 수 없어 제외
  if(scope==='played')return shuffle(base.filter(q=>S.tabs[QTAB[q.id].id]));
  if(scope==='wrong'){const w=new Set(wrongList(false));return shuffle(base.filter(q=>w.has(q.id))).concat(shuffle(base.filter(q=>!w.has(q.id))));}
  return shuffle(base);
}

  const pool=gamePool(gameSetup.scope).slice(0,gameSetup.count);
  if(!pool.length){toast('출제할 문항이 없습니다.');return;}
  G={qs:pool,i:0,score:0,combo:0,maxCombo:0,results:[],locked:false,mode:gameSetup.mode,time:gameSetup.time};
  renderGameQ();
}
function renderGameQ(){
  voiceReset();
  const q=G.qs[G.i];
  G.locked=false;G.elapsed=0;G.last=performance.now();G.limit=G.time*1000;G.warned=false;G.pick=[];
  G.view=q.ty==='ox'?[true,false]:shuffle(range(q.o.length));
  const opts=q.ty==='ox'
    ?`<div class="gox">${G.view.map((v,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}" aria-label="${v?'O 맞다':'X 틀리다'}">${v?'O':'X'}</button>`).join('')}</div>`
    :`<div class="gopts">${G.view.map((oi,k)=>`<button type="button" class="gopt" data-act="gans" data-k="${k}"${q.ty==='multi'?' aria-pressed="false"':''}><kbd>${k+1}</kbd><span>${esc(q.o[oi])}</span></button>`).join('')}</div>`;
  app.innerHTML=`
  <div class="game play">
    <div class="gtop"><div class="hud"><span>${G.i+1} / ${G.qs.length}</span><span class="combo${G.combo>=3?' hot':''}">🔥 콤보 ${G.combo}</span><span class="pts">${G.score.toLocaleString()}점</span></div>
    <div class="timer" id="timer"><div id="tbar"></div></div><div class="tleft" id="tleft"></div></div>
    <div class="gtype">${TYPES[q.ty][0]}${q.ty==='multi'?' · 모두 고른 뒤 제출':''}</div>
    <div class="gq">${q.p}</div>${mediaHTML(q)}
    <div class="gbottom">${voiceRow(q,'g')}${opts}
    <div class="gfloat" id="gfloat" aria-live="polite"></div>
    <div class="gsub"><button class="btn" type="button" data-act="gquit">그만하기</button>
      ${q.ty==='multi'?'<button class="btn primary" type="button" data-act="gsubmit">제출 (Enter)</button>':''}</div></div>
  </div>`;
  if(hasVoice())G.vc=QBVoice.attach({bind:false,button:()=>app.querySelector('.vmic'),live:()=>app.querySelector('.vstat'),
    getOptions:()=>G.view.length,getType:()=>q.ty,
    select:r=>gameAnswer(r.kind==='ox'?(r.v==='O'?0:1):r.i),submit:q.ty==='multi'?gameSubmit:null});  // 말하면 클릭과 같게 바로 선택(·제출)
  G.raf=requestAnimationFrame(tick);
}
function tick(now){
  if(!G||G.locked)return;
  G.elapsed+=now-G.last;G.last=now;
  const rem=Math.max(0,G.limit-G.elapsed), ratio=rem/G.limit;
  const shown=RM.matches?Math.ceil(rem/1000)*1000/G.limit:ratio;
  const bar=document.getElementById('tbar'), tm=document.getElementById('timer');
  if(bar){bar.style.width=(Math.min(1,shown)*100)+'%';tm.className='timer'+(ratio<.25?' lo':ratio<.5?' mid':'');
    document.getElementById('tleft').textContent=(rem/1000).toFixed(1)+'초';}
  if(!G.warned&&rem<=5000){G.warned=true;say('5초 남았습니다');}
  if(rem<=0){judge(null,true);return;}
  G.raf=requestAnimationFrame(tick);
}
function judge(ans,timeout){
  if(!G||G.locked)return;
  G.locked=true;cancelAnimationFrame(G.raf);
  const q=G.qs[G.i], used=Math.min(G.elapsed,G.limit), ok=!timeout&&isCorrect(q,ans);
  let gain=0;
  if(ok){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const mult=G.combo>=5?1.5:G.combo>=3?1.2:1;
    gain=Math.round((100+Math.floor((G.limit-used)/100))*mult);G.score+=gain;}
  else G.combo=0;
  G.results.push({id:q.id,ok,ans,timeout,ms:used,gain});
  // 판정 표시
  app.querySelectorAll('[data-act="gans"]').forEach(b=>{
    const k=+b.dataset.k, v=G.view[k];
    const right=q.ty==='ox'?q.a===v:q.ty==='mc'?q.a===v:q.a.includes(v);
    const picked=q.ty==='ox'||q.ty==='mc'?ans===v:(ans||[]).includes(v);
    if(right)b.classList.add('ans');else if(picked)b.classList.add('miss');
    b.disabled=true;
  });
  const f=document.getElementById('gfloat');
  f.className='gfloat pop '+(ok?'ok':'no');
  f.textContent=ok?`+${gain}${G.combo>=3?` 🔥×${G.combo>=5?'1.5':'1.2'}`:''}`:timeout?'⏰ 시간 초과':'✗ 오답';
  if(timeout){const tm=document.getElementById('timer');tm&&tm.classList.add('out');}
  const sb=app.querySelector('[data-act="gsubmit"]');if(sb)sb.disabled=true;
  app.querySelector('.pts').textContent=G.score.toLocaleString()+'점';
  const c=app.querySelector('.combo');c.textContent='🔥 콤보 '+G.combo;c.classList.toggle('hot',G.combo>=3);
  G.next=setTimeout(()=>{if(!G)return;G.i++;G.i<G.qs.length?renderGameQ():finishGame();},ok?900:1400);
}
function gameAnswer(k){
  if(!G||G.locked)return;
  const q=G.qs[G.i];if(k<0||k>=G.view.length)return;
  if(q.ty==='multi'){
    const v=G.view[k], i=G.pick.indexOf(v);
    i<0?G.pick.push(v):G.pick.splice(i,1);
    const b=app.querySelector(`[data-act="gans"][data-k="${k}"]`);b&&b.setAttribute('aria-pressed',i<0);
  }else judge(G.view[k],false);
}
function gameSubmit(){if(G&&!G.locked&&G.qs[G.i].ty==='multi')judge(G.pick.slice(),false);}
function stopGame(){if(G){cancelAnimationFrame(G.raf);clearTimeout(G.next);G=null;}}
function finishGame(){
  const R=G.results, correct=R.filter(r=>r.ok).length, M=GAME_MODES[G.mode];
  R.forEach(r=>{const q=QMAP[r.id];if(r.ok)markSolved(r.id);else addWrong(r.id,r.timeout?'(시간 초과)':answerText(q,r.ans));});
  const rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:(S.name||'').trim()||'익명',score:G.score,
    correct,total:R.length,rate:pct(correct,R.length),avg:Math.round(R.reduce((s,r)=>s+r.ms,0)/R.length/100)/10,combo:G.maxCombo,mode:G.mode,time:G.time,at:Date.now()};
  const rank=Leaderboard.add(rec);
  save();
  const board=Leaderboard.load(boardKey(rec)), top=board.slice(0,10), mine=board.find(r=>r.id===rec.id);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;
  const row=(r,i)=>`<tr class="${r.id===rec.id?'me':''}"><td>${medal(i)}</td><td>${esc(r.name)}</td><td class="r">${r.score.toLocaleString()}</td><td class="r">${r.rate}%</td><td class="r">${r.correct}/${r.total}</td><td class="r">${new Date(r.at).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}</td></tr>`;
  const wrong=R.filter(r=>!r.ok);
  G=null;
  setTopScore(`⚡ 게임 ${rec.score.toLocaleString()}점 <small>정답 ${correct}/${R.length}</small>`);
  app.innerHTML=`
  <div class="game">
    <div class="panel center">
      <p class="note-sm" style="margin:0">최종 점수</p>
      <div class="score xl">${rec.score.toLocaleString()}</div>
      <p class="msg">${M.title} · ${rec.time}초 — ${rank===1?'🏆 이 조건 최고 기록!':`이 조건 순위 ${rank}위`}</p>
      <div class="bignum"><div><b>${correct}/${rec.total}</b><span>정답</span></div><div><b>${rec.rate}%</b><span>정답률</span></div><div><b>${rec.avg}초</b><span>평균 응답</span></div><div><b>${rec.combo}</b><span>최고 콤보</span></div></div>
    </div>
    <div class="panel"><h2 class="ph">🏆 순위 · ${M.title.replace(/^\S+\s/,'')} ${rec.time}초 · 이 브라우저 기록</h2>
      <table class="board"><thead><tr><th>#</th><th>이름</th><th class="r">점수</th><th class="r">정답률</th><th class="r">정답</th><th class="r">날짜</th></tr></thead>
      <tbody>${top.map(row).join('')}${rank>10&&mine?row(mine,rank-1):''}</tbody></table></div>
    ${wrong.length?`<details class="more panel"><summary>틀린 문항 ${wrong.length}개 · 해설 보기 (오답노트에 저장됨)</summary>
      ${wrong.map(r=>{const q=QMAP[r.id];return `<div class="keyitem"><div class="kq">${q.p}</div><p class="mine" style="margin:4px 0">내 답: ${esc(r.timeout?'(시간 초과)':answerText(q,r.ans))}</p><p class="ka">정답: ${esc(correctText(q))}</p><p class="kw">${q.w}</p><span class="an">📖 ${esc(q.an)}</span></div>`;}).join('')}</details>`:''}
    <div class="actions"><button class="btn primary" type="button" data-act="gagain">↻ 다시 하기</button><a class="btn" href="#notes">📒 오답노트</a><a class="btn" href="#home">홈</a></div>
  </div>`;
}

/* ── 라우터 · 이벤트 ───────────────────── */
function route(){
  stopGame();voiceReset();cur=null;app.classList.remove('sheet');setTopScore('');
  const [v,arg]=(location.hash.slice(1)||'home').split('/');
  ({study:()=>viewStudy(arg),notes:viewNotes,retry:viewRetry,key:viewKey,game:()=>arg?viewGameSetup(arg):viewGamePick(),summary:viewSummary}[v]||viewHome)();
  window.scrollTo(0,0);
}
let resetArmed=false;
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act;
  if(cur&&['ox','ml','mr','ord','hint','src'].includes(act))return onSheetClick(el);
  switch(act){
    case 'grade':gradeSheet();break;
    case 'retab':viewStudy(cur.tab.id,true);window.scrollTo(0,0);break;  // 이전 점수는 다시 채점할 때까지 유지
    case 'onlywrong':cur.onlyWrong=!cur.onlyWrong;document.getElementById('cards').classList.toggle('onlywrong',cur.onlyWrong);el.textContent=cur.onlyWrong?'전체 보기':'오답만 보기';break;
    case 'copyreport':copy(reportMD());break;
    case 'copynotes':copy(`# ${BANK.title}\n\n- 이름: ${S.name||'-'} · ${today()}\n\n`+notesMD(false));break;
    case 'clearsolved':wrongList(true).forEach(id=>delete S.wrong[id]);save();viewNotes();break;
    case 'print':window.print();break;
    case 'reset':
      if(!resetArmed){resetArmed=true;el.textContent='정말 지울까요? 한 번 더 누르세요';setTimeout(()=>{resetArmed=false;if(el.isConnected)el.textContent='이 문제은행 기록 모두 지우기';},4000);break;}
      resetArmed=false;const nm=S.name;S=blank();S.name=nm;save();toast('기록을 지웠습니다');viewHome();break;
    case 'gset':gameSetup[el.dataset.g]=['count','time'].includes(el.dataset.g)?+el.dataset.v:el.dataset.v;viewGameSetup();break;
    case 'gstart':startGame();break;
    case 'gans':gameAnswer(+el.dataset.k);break;
    case 'vmic':{const q=G?null:QMAP[el.dataset.q];const c=G?G.vc:(q&&cur?studyVoice(q):null);if(c)c.toggle();break;}
    case 'vread':{
      if(G){const q=G.qs[G.i];readAloud(readText(q,0,q.ty==='ox'?null:G.view));break;}
      const q=QMAP[el.dataset.q], card=document.getElementById('card-'+el.dataset.q);
      if(q)readAloud(readText(q,card?card.dataset.n:0));break;}
    case 'gsubmit':gameSubmit();break;
    case 'gquit':stopGame();viewGameSetup(gameSetup.mode);break;
    case 'gagain':startGame();break;
  }
});
app.addEventListener('change',e=>{const el=e.target;if(cur&&el.dataset&&(el.dataset.act==='pick'||el.dataset.act==='tick'))onSheetChange(el);});
app.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.act==='name'){S.name=el.value;save();}
  else if(cur)onSheetInput(el);
});
document.addEventListener('keydown',e=>{
  if(!G||G.locked||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.target.matches&&e.target.matches('input,textarea'))return;
  const q=G.qs[G.i], k=e.key.toLowerCase();
  if(q.ty==='ox'){if(k==='o'||k==='1'){e.preventDefault();gameAnswer(0);}else if(k==='x'||k==='2'){e.preventDefault();gameAnswer(1);}return;}
  if(/^[1-9]$/.test(k)){e.preventDefault();gameAnswer(+k-1);}
  else if(k==='enter'&&q.ty==='multi'&&!(e.target.closest&&e.target.closest('.vrow'))){e.preventDefault();gameSubmit();}
});
window.addEventListener('pagehide',()=>{if(window.QBVoice){QBVoice.stopListening();QBVoice.cancelSpeak();}});
document.addEventListener('visibilitychange',()=>{if(G&&!document.hidden)G.last=performance.now();});
// 탭 바 좌우 화살표
app.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('.tabchip');if(!t||(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'))return;
  const n=e.key==='ArrowRight'?t.nextElementSibling:t.previousElementSibling;if(n){e.preventDefault();n.focus();}
});
/* 테마 */
let theme=null;try{theme=localStorage.getItem('qb:theme');}catch(e){}
const applyTheme=()=>{if(theme)document.documentElement.dataset.theme=theme;else delete document.documentElement.dataset.theme;};
applyTheme();
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  theme=dark?'light':'dark';try{localStorage.setItem('qb:theme',theme);}catch(e){}applyTheme();
});
document.title=BANK.title+' · 문제은행';
window.addEventListener('hashchange',route);
route();
})();
</script>
