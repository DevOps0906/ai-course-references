const BANK={"id":"go-d2","code":"GO2","title":"Go 언어 2일차 · 에러 처리·모듈·패키지·빌드 시스템","subtitle":"에러 처리 · 모듈·패키지 · 빌드·CLI·벤치마크","course":"10 · Go 언어 프로그래밍","source":"10-go_programming-main/Go언어프로그래밍_2일차.md + 솔루션 + go_cobra_step_by_step.md + go_benchmark_practice.md","salt":"go-d2","version":1,"updated":"2026-10-16","tabs":[{"id":"t1","title":"에러 처리 I · error 인터페이스","ref":"2일차 §1","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"Go 내장 <code>error<\/code> 인터페이스가 요구하는 메서드는?","o":["Error() string","String() string","Unwrap() error","Message() string"],"a":0,"h":"Go의 error는 내장 인터페이스이며 정의가 단 한 줄입니다. 그 한 줄에는 문자열을 돌려주는 메서드 하나만 선언되어 있고, 메서드 이름은 인터페이스 이름과 같습니다.","w":"<code>type error interface { Error() string }<\/code>가 내장 정의입니다. <code>Unwrap()<\/code>은 래핑 체인을 따라가게 할 때 추가로 구현하는 메서드이지 필수가 아닙니다.","an":"2일차 §1.3 error 인터페이스","src":"## 1.3 Go의 `error` 인터페이스\n\nGo에서 에러는 그냥 **인터페이스**입니다. 내장 정의는 이렇게 한 줄로 끝납니다.\n\n```go\ntype error interface {\n Error() string\n}\n```\n\n`Error() string` 메서드를 가진 모든 타입이 에러로 쓰일 수 있습니다. 1일차에서 배운 Duck Typing이 여기에 활용됩니다."},{"id":"t1-02","ty":"mc","lv":1,"game":true,"p":"Go 함수가 '에러 없음(성공)'을 알릴 때 err 자리에 돌려주는 값은?","o":["0","-1","nil","false"],"a":2,"h":"Go 함수는 결과값과 에러를 함께 반환하며, 성공일 때는 에러 자리에 '아무것도 없음'을 뜻하는 값을 넣습니다. C에서 errno가 0이면 정상이듯, Go에서는 err가 이 값과 같으면 정상입니다.","w":"성공하면 <code>return 결과값, nil<\/code>을 반환합니다. 0·-1 같은 정수 신호는 C 방식이며, Go는 에러 자체를 값으로 돌려줍니다.","an":"2일차 §1.3 nil은 에러 없음","src":"### `nil`은 \"에러 없음\"\n\n```go\nreturn 결과값, nil // 성공\nreturn 0, 에러 // 실패\n```\n\nC에서 `errno == 0`이 정상이듯, Go에서는 `err == nil`이 정상입니다."},{"id":"t1-03","ty":"mc","lv":1,"game":true,"p":"printf처럼 포맷 문자열과 인자로 에러 메시지를 만드는 함수는?","o":["errors.New","fmt.Errorf","errors.As","fmt.Println"],"a":1,"h":"교안은 고정 메시지는 errors.New로, 값이 섞인 메시지는 fmt 패키지의 함수로 만듭니다. 이 함수는 printf처럼 포맷 문자열과 인자를 받으며 이름 끝에 f가 붙습니다.","w":"<code>fmt.Errorf(format, args...)<\/code>는 포맷 문자열로 에러를 만듭니다. <code>errors.New<\/code>는 고정 문자열만 받는 단순한 에러 생성 함수입니다.","an":"2일차 §1.3 errors.New, fmt.Errorf","src":"### 가장 기본적인 사용 — `errors.New`, `fmt.Errorf`\n\n```go\npackage main\n\nimport (\n \"errors\"\n \"fmt\"\n)\n\nfunc sqrt(x float64) (float64, error) {\n if x < 0 {\n return 0, errors.New(\"음수의 제곱근을 계산할 수 없습니다\")\n }\n // 실제 계산...\n return 0, nil\n}\n\nfunc divide(a, b float64) (float64, error) {\n if b == 0 {\n return 0, fmt.Errorf(\"0으로 나눌 수 없습니다 (a=%v)\", a)\n }\n return a / b, nil\n}"},{"id":"t1-04","ty":"mc","lv":2,"game":true,"p":"교안이 C <code>errno<\/code>의 한계로 '타입 정보 없음'을 든 이유는?","o":["errno가 반환값이라서","errno가 문자열이라서","errno가 구조체라서","errno가 그저 정수라서"],"a":3,"h":"교안의 C errno 한계 표와 Go 비교 표를 보면, '타입 정보' 측면에서 C 쪽은 담을 수 있는 것이 한 가지 자료형뿐입니다. errno 변수가 어떤 자료형인지 떠올리면 메시지나 필드 같은 정보를 담을 수 없는 이유가 보입니다.","w":"errno는 그저 정수라서 어떤 필드에서 왜 실패했는지 같은 컨텍스트를 담을 수 없습니다. Go의 error는 임의의 타입이라 메시지·필드를 자유롭게 담습니다.","an":"2일차 §1.2 C errno의 한계 표","src":"## 1.6 `errno`와 Go 에러의 비교 정리\n\n| 측면 | C `errno` | Go `error` |\n|---|---|---|\n| 전달 방식 | 전역 변수 | 명시적 반환값 |\n| 무시 가능 여부 | 쉽게 무시됨 | 무시하면 변수 미사용으로 경고 (linter) |\n| 타입 정보 | 정수만 | 임의의 타입 |\n| 컨텍스트 | 없음 | 메시지, 필드 등 자유롭게 |\n| 스레드 안전성 | 스레드 로컬 의존 | 본질적으로 안전 (값 자체) |"},{"id":"t1-05","ty":"mc","lv":3,"game":false,"p":"<code>DivisionError<\/code>의 <code>Error()<\/code>가 <code>fmt.Sprintf(\"나눗셈 오류: %v / %v\", e.Dividend, e.Divisor)<\/code>를 반환할 때, <code>_, err := divide(10, 0); fmt.Println(err)<\/code>의 출력은?","o":["나눗셈 오류: 10 / 0","0으로 나눌 수 없습니다","에러: 10 / 0","<nil>"],"a":0,"h":"divide는 b가 0이면 &DivisionError{Dividend: a, Divisor: b}를 에러로 반환합니다. fmt.Println(err)는 에러의 Error() 결과를 출력하므로, Sprintf의 두 %v 자리에 a와 b 값이 차례로 들어간 문자열이 나옵니다.","w":"divide(10, 0)은 <code>&DivisionError{10, 0}<\/code>을 반환하고, <code>fmt.Println(err)<\/code>는 <code>Error()<\/code> 문자열인 '나눗셈 오류: 10 / 0'을 출력합니다. '0으로 나눌 수 없습니다'는 앞 예제의 <code>fmt.Errorf<\/code> 메시지입니다.","an":"2일차 §1.6 실습 코드 errors_basic.go","src":"type DivisionError struct {\n Dividend float64\n Divisor float64\n}\n\nfunc (e *DivisionError) Error() string {\n return fmt.Sprintf(\"나눗셈 오류: %v / %v\", e.Dividend, e.Divisor)\n}\n\nfunc divide(a, b float64) (float64, error) {\n if b == 0 {\n return 0, &DivisionError{Dividend: a, Divisor: b}\n }\n return a / b, nil"},{"id":"t1-06","ty":"ox","lv":1,"game":true,"p":"Go에서는 <code>if err == nil { ... }<\/code> 블록 안에 정상 경로를 깊이 중첩해 두는 방식이 권장된다.","a":false,"h":"교안은 if err != nil로 에러를 먼저 검사하고 바로 return하는 '얼리 리턴'을 Go 관용구로 소개합니다. 정상 경로는 들여쓰기 깊은 곳에 두지 않는 것이 Go 스타일이며, if err == nil 안에 중첩하는 방식은 '안 좋은 예'로 나옵니다.","w":"틀렸습니다. 교안은 이를 'C 스타일 중첩'으로 안 좋은 예로 들었습니다. <code>if err != nil { return err }<\/code>로 먼저 빠져나가고 정상 경로는 들여쓰기 없이 두는 것이 Go 스타일입니다.","an":"2일차 §1.4 if err != nil 관용구","src":"## 1.4 관용구(idiom): `if err != nil`\n\n```go\nresult, err := someFunction()\nif err != nil {\n // 에러 처리\n return err // 또는 적절한 대응\n}\n// 정상 흐름 계속\n```\n\n이 패턴을 **얼리 리턴(early return)**이라고도 부릅니다. 정상 경로를 들여쓰기 깊은 곳에 두지 않는 것이 Go 스타일입니다."},{"id":"t1-07","ty":"ox","lv":2,"game":true,"p":"<code>Error() string<\/code> 메서드만 구현하면 직접 만든 구조체도 <code>error<\/code>로 반환할 수 있다.","a":true,"h":"Go에서 에러는 단지 인터페이스이고, 그 인터페이스가 요구하는 것은 Error() string 메서드 하나뿐입니다. 1일차의 Duck Typing처럼 메서드만 갖추면 어떤 타입이든 그 인터페이스를 충족합니다.","w":"맞습니다. <code>Error() string<\/code>을 가진 모든 타입이 에러로 쓰일 수 있습니다. 그래서 <code>ValidationError<\/code>처럼 Field·Message를 담은 사용자 정의 에러를 만들 수 있습니다.","an":"2일차 §1.3 · §1.5 사용자 정의 에러 타입","src":"## 1.3 Go의 `error` 인터페이스\n\nGo에서 에러는 그냥 **인터페이스**입니다. 내장 정의는 이렇게 한 줄로 끝납니다.\n\n```go\ntype error interface {\n Error() string\n}\n```\n\n`Error() string` 메서드를 가진 모든 타입이 에러로 쓰일 수 있습니다. 1일차에서 배운 Duck Typing이 여기에 활용됩니다."},{"id":"t1-08","ty":"match","lv":2,"game":false,"p":"C <code>errno<\/code>와 비교한 Go <code>error<\/code>의 특징을 측면별로 연결하세요.","pairs":[["전달 방식","명시적 반환값"],["타입 정보","임의의 타입"],["컨텍스트","메시지·필드 등 자유롭게"],["스레드 안전성","값 자체라 본질적으로 안전"]],"h":"교안 §1.6 표는 C errno와 Go error를 측면별로 비교합니다. C는 전역 변수·정수만·컨텍스트 없음·스레드 로컬 의존이고, Go는 그 반대로 반환값으로 전달되며 어떤 타입이든 담을 수 있고 값 자체라서 안전합니다.","w":"Go 에러는 반환값으로 전달되고, 임의 타입이라 메시지·필드를 담을 수 있으며, 값 자체이므로 스레드 로컬 같은 장치에 기대지 않습니다.","an":"2일차 §1.6 errno와 Go 에러의 비교 정리","src":"## 1.6 `errno`와 Go 에러의 비교 정리\n\n| 측면 | C `errno` | Go `error` |\n|---|---|---|\n| 전달 방식 | 전역 변수 | 명시적 반환값 |\n| 무시 가능 여부 | 쉽게 무시됨 | 무시하면 변수 미사용으로 경고 (linter) |\n| 타입 정보 | 정수만 | 임의의 타입 |\n| 컨텍스트 | 없음 | 메시지, 필드 등 자유롭게 |\n| 스레드 안전성 | 스레드 로컬 의존 | 본질적으로 안전 (값 자체) |"},{"id":"t1-09","ty":"order","lv":3,"game":false,"p":"두 함수를 차례로 호출하는 코드를 '얼리 리턴' 스타일로 쓸 때의 흐름을 순서대로 배열하세요.","steps":["doSomething() 호출로 결과와 err 받기","첫 번째 err 검사 후 실패면 return","doOther() 호출로 결과와 err 받기","두 번째 err 검사 후 실패면 return","정상 경로를 들여쓰기 없이 진행"],"h":"얼리 리턴 예제는 함수를 호출해 결과와 err를 받은 직후 if err != nil이면 곧바로 return합니다. 두 번째 함수도 같은 방식으로 호출·검사한 뒤, 마지막에 정상 경로가 들여쓰기 없이 이어집니다.","w":"얼리 리턴은 호출 직후 <code>if err != nil { return err }<\/code>로 실패를 먼저 처리합니다. 덕분에 마지막 정상 경로가 중첩 없이 남습니다.","an":"2일차 §1.4 좋은 예 — 얼리 리턴","src":"### ✅ 좋은 예 — 얼리 리턴\n\n```go\nresult, err := doSomething()\nif err != nil {\n return err\n}\n\nother, err := doOther()\nif err != nil {\n return err\n}\n\n// 정상 경로는 들여쓰기 없이\n```"},{"id":"t1-10","ty":"multi","lv":1,"game":true,"p":"교안이 정리한 C 에러 처리의 문제점을 모두 고르세요.","o":["전역 변수 의존","반환값과 분리","놓치기 쉽다","버전 고정 어려움","타입 정보 없음"],"a":[0,1,2,4],"h":"교안 §1.2 표는 C 에러 처리의 문제로 전역 변수 의존, 반환값과의 분리(-1·NULL 등 비일관), 검사를 놓치기 쉬움, 정수뿐인 타입 정보, 에러 추적 불가를 듭니다. 라이브러리·의존성 관리 문제는 3교시의 다른 주제입니다.","w":"C 에러 처리의 문제는 전역 변수 의존, 반환값과 분리, 놓치기 쉬움, 타입 정보 없음, 에러 추적 불가입니다. '버전 고정 어려움'은 3교시에 나온 C 의존성 관리의 문제입니다.","an":"2일차 §1.2 C 에러 처리 문제 표","src":"C 에러 처리의 문제점은 명확합니다.\n\n| 문제 | 설명 |\n|---|---|\n| **전역 변수 의존** | `errno`는 스레드 로컬이지만 본질적으로 전역. 함수 호출 사이에 덮어쓰여질 수 있음 |\n| **반환값과 분리** | 어떤 함수는 -1, 어떤 함수는 NULL, 어떤 함수는 양수 → 일관성 없음 |\n| **놓치기 쉽다** | `fopen`의 반환값 체크 안 해도 컴파일러가 경고하지 않음 |\n| **타입 정보 없음** | `errno`는 그저 정수. 컨텍스트 정보 없음 |\n| **에러 추적 불가** | 어디서 발생했는지 추적 어려움 |"}]},{"id":"t2","title":"에러 래핑 · errors.Is/As","ref":"2일차 §2.1–2.4 · 2일차 솔루션 복습②","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"원본 에러 정보를 유지한 채 메시지를 덧붙일 때 <code>fmt.Errorf<\/code>에 쓰는 동사는?","o":["%v","%s","%w","%d"],"a":2,"h":"fmt.Errorf에서 에러를 포맷하는 동사는 두 가지로 나뉩니다. 하나는 원본 에러를 감싸(wrap) 정보를 유지하고, 다른 하나(%v)는 단순 문자열로 바꿔 원본 정보를 잃습니다. wrap의 첫 글자를 떠올려 보세요.","w":"<code>%w<\/code>는 에러를 래핑해 원본 정보를 유지합니다. <code>%v<\/code>는 단순 문자열로 출력해 원본 에러 정보가 사라집니다.","an":"2일차 §2.1 fmt.Errorf + %w","src":"func readConfig(path string) error {\n _, err := os.Open(path)\n if err != nil {\n // %w로 원본 에러를 래핑\n return fmt.Errorf(\"설정 파일 열기 실패 (%s): %w\", path, err)\n }\n return nil\n}\n\nfunc main() {\n err := readConfig(\"none.yaml\")\n if err != nil {\n fmt.Println(err)\n // 출력:\n // 설정 파일 열기 실패 (none.yaml): open none.yaml: no such file or directory\n }\n}\n```\n\n- `%w`: 에러를 래핑(wrap). 원본 에러 정보를 유지한 채 메시지를 추가"},{"id":"t2-02","ty":"mc","lv":1,"game":true,"p":"래핑된 에러 사슬에서 특정 sentinel 값과 같은지 확인하는 함수는?","o":["errors.As","errors.Is","errors.New","fmt.Errorf"],"a":1,"h":"errors 패키지에는 래핑된 에러 사슬을 따라가며 특정 sentinel 값(예: os.ErrNotExist)과 같은지 확인하는 함수가 있습니다. C의 errno == ENOENT 비교와 비슷하지만 래핑되어도 동작하며, 이름은 '~인가?'를 묻는 영어 동사입니다.","w":"<code>errors.Is(err, target)<\/code>는 특정 값과 같은지 비교하며 래핑되어도 동작합니다. <code>errors.As<\/code>는 값이 아니라 타입으로 꺼낼 때 씁니다.","an":"2일차 §2.2 errors.Is","src":"## 2.2 `errors.Is` — 특정 에러인지 확인\n\n래핑된 에러 사슬에서 **특정 에러**를 찾아 분기 처리합니다.\n\n```go\nimport (\n \"errors\"\n \"fmt\"\n \"os\"\n)\n\nfunc main() {\n _, err := os.Open(\"/nonexistent/file\")\n if err != nil {\n if errors.Is(err, os.ErrNotExist) {\n fmt.Println(\"파일이 없습니다\")\n } else if errors.Is(err, os.ErrPermission) {\n fmt.Println(\"권한 없음\")\n } else {\n fmt.Println(\"기타 에러:\", err)\n }\n }\n}\n```"},{"id":"t2-03","ty":"mc","lv":2,"game":true,"p":"사용자 정의 에러 타입의 Field 같은 필드 값을 꺼내 쓰려면 어떤 호출을 써야 하나요?","o":["errors.Is(err, target)","err.Error()","errors.New(msg)","errors.As(err, &target)"],"a":3,"h":"값 비교만 하는 함수로는 사용자 정의 에러 구조체의 필드에 접근할 수 없습니다. 교안은 타깃 타입의 포인터 변수(var ve *ValidationError)를 선언하고 그 주소를 넘겨 사슬에서 해당 타입을 꺼낸 뒤 ve.Field를 읽는 방식을 보여 줍니다.","w":"<code>errors.As<\/code>는 사슬에서 원하는 타입을 찾아 target 포인터에 담아 줍니다. <code>errors.Is<\/code>는 같은 값인지만 알려 주고, <code>Error()<\/code>는 문자열만 돌려줍니다.","an":"2일차 §2.3 errors.As 표","src":"## 2.3 `errors.As` — 특정 타입으로 추출\n\n사용자 정의 에러 타입에서 **필드 값**을 꺼내려면 `errors.As`를 씁니다.\n\n```go\ntype ValidationError struct {\n Field string\n Msg string\n}\n\nfunc (e *ValidationError) Error() string {\n return fmt.Sprintf(\"%s: %s\", e.Field, e.Msg)\n}\n\nfunc main() {\n var err error = fmt.Errorf(\"처리 실패: %w\",\n &ValidationError{Field: \"email\", Msg: \"형식 오류\"})\n\n var ve *ValidationError\n if errors.As(err, &ve) {"},{"id":"t2-04","ty":"mc","lv":3,"game":false,"p":"다음 코드에서 마지막 줄의 결과는? <code>err := fmt.Errorf(\"처리 중: %w\", fmt.Errorf(\"로딩 중: %w\", fmt.Errorf(\"열기: %w\", os.ErrNotExist)))<\/code> → <code>errors.Is(err, os.ErrNotExist)<\/code>","o":["true","false","컴파일 에러","panic 발생"],"a":0,"h":"errors.Is는 래핑된 에러 사슬을 한 단계씩 풀며 대상 값을 찾습니다. 교안은 '깊이 래핑되어도 OK'라고 설명하며, 각 단계가 모두 %w로 감싸졌다면 맨 안쪽의 os.ErrNotExist까지 도달할 수 있습니다.","w":"세 겹 모두 <code>%w<\/code>로 래핑했으므로 <code>errors.Is<\/code>가 사슬을 따라 내려가 <code>os.ErrNotExist<\/code>를 찾아 true를 돌려줍니다. 하나라도 %v였다면 사슬이 끊겼을 것입니다.","an":"2일차 §2.2 깊이 래핑되어도 OK","src":"C 스타일이라면 `errno == ENOENT`와 비슷한 비교지만, **래핑되어도 동작**한다는 차이가 있습니다.\n\n```go\n// 깊이 래핑되어도 OK\nerr := fmt.Errorf(\"처리 중: %w\",\n fmt.Errorf(\"로딩 중: %w\",\n fmt.Errorf(\"열기: %w\", os.ErrNotExist)))\n\nerrors.Is(err, os.ErrNotExist) // true\n```"},{"id":"t2-05","ty":"mc","lv":3,"game":false,"p":"<code>withdraw(\"ACC-001\", 5000, 1000)<\/code>의 에러에서 <code>errors.As(err, &we)<\/code> 후 <code>fmt.Printf(\"→ 부족액: %.2f\\n\", we.Requested-we.Available)<\/code>의 출력은?","o":["→ 부족액: 5000.00","→ 부족액: 4000.00","→ 부족액: 1000.00","→ 부족액: -4000.00"],"a":1,"h":"withdraw(\"ACC-001\", 5000, 1000)은 요청 금액 5000, 잔액 1000으로 WithdrawError를 만듭니다. errors.As로 꺼낸 we에서 Requested-Available을 %.2f(소수 둘째 자리)로 출력하므로 '요청 − 잔액'을 계산해 형식에 맞추면 됩니다.","w":"amount(5000) > balance(1000)이므로 <code>WithdrawError{Requested: 5000, Available: 1000}<\/code>가 반환되고 부족액은 5000 - 1000 = 4000.00입니다.","an":"2일차 §2.5 실습 코드 errors_advanced.go","src":"err := withdraw(\"ACC-001\", 5000, 1000)\n if err != nil {\n fmt.Println(err)\n // sentinel 검사\n if errors.Is(err, ErrInsufficientFunds) {\n fmt.Println(\"→ 잔액 부족으로 분류\")\n }\n // 타입 추출\n var we *WithdrawError\n if errors.As(err, &we) {\n fmt.Printf(\"→ 부족액: %.2f\\n\", we.Requested-we.Available)"},{"id":"t2-06","ty":"ox","lv":2,"game":true,"p":"<code>fmt.Errorf(\"X 실패: %v\", err)<\/code>로 감싸도 <code>errors.Is<\/code>로 원본 에러를 계속 찾을 수 있다.","a":false,"h":"%w는 원본 에러를 래핑해 정보를 유지하지만, %v는 원본 에러를 단순 문자열로 바꿔 넣을 뿐이라 원본 정보가 사라집니다. errors.Is가 사슬을 따라가려면 원본이 래핑되어 있어야 합니다.","w":"틀렸습니다. <code>%v<\/code>는 원본 에러 정보를 잃고 단순 문자열이 됩니다. 추후 분석하려면 <code>%w<\/code>로 래핑해야 합니다.","an":"2일차 §2.1 %w와 %v 비교","src":"- `%w`: 에러를 래핑(wrap). 원본 에러 정보를 유지한 채 메시지를 추가\n- `%v`: 단순 출력 (원본 에러 정보 손실)\n\n차이를 비교해봅시다.\n\n```go\nreturn fmt.Errorf(\"X 실패: %v\", err) // 원본 에러 정보 손실 — 단순 문자열\nreturn fmt.Errorf(\"X 실패: %w\", err) // 원본 에러 정보 유지 — 추후 분석 가능\n```"},{"id":"t2-07","ty":"ox","lv":1,"game":true,"p":"사용자 정의 에러 타입에 <code>Unwrap() error<\/code>를 구현하면 <code>errors.Is<\/code>·<code>errors.As<\/code>가 체인을 따라간다.","a":true,"h":"WithdrawError는 Unwrap() error 메서드에서 ErrInsufficientFunds를 반환해, errors.Is가 sentinel과 비교할 수 있게 합니다. 솔루션의 핵심 학습 포인트 표도 Unwrap() 구현의 효과를 정리해 두었습니다.","w":"맞습니다. <code>WithdrawError<\/code>는 <code>Unwrap()<\/code>이 <code>ErrInsufficientFunds<\/code>를 돌려주므로 <code>errors.Is(err, ErrInsufficientFunds)<\/code>가 true가 됩니다. DBError도 같은 방식으로 Original을 노출합니다.","an":"2일차 §2.5 errors_advanced.go · 2일차 솔루션 복습② 핵심 학습 포인트","src":"## 핵심 학습 포인트\n\n| 패턴 | 효과 |\n|---|---|\n| 구조체 + `Error()` 메서드 | 컨텍스트 풍부한 에러 |\n| `Unwrap()` 구현 | `errors.Is/As`가 체인을 따라감 |\n| `errors.As(err, &target)` | 타입 추출 → 필드 접근 |\n| `switch` + `errors.As` | 타입별 분기 처리 |\n\n---"},{"id":"t2-08","ty":"match","lv":1,"game":false,"p":"에러 처리 도구와 용도를 연결하세요.","pairs":[["errors.Is","특정 값(sentinel)과 같은지 비교"],["errors.As","특정 타입으로 추출해 필드 접근"],["%w","원본 에러를 유지하며 래핑"],["%v","단순 출력(원본 정보 손실)"]],"h":"errors.Is는 값(sentinel) 비교, errors.As는 타입 추출 후 필드 접근에 씁니다. fmt.Errorf의 %w는 원본을 유지하며 감싸고, %v는 단순 출력이라 원본 정보를 잃습니다.","w":"<code>errors.Is<\/code>는 값 비교, <code>errors.As<\/code>는 타입 추출입니다. <code>%w<\/code>는 래핑, <code>%v<\/code>는 문자열로만 남깁니다.","an":"2일차 §2.1 · §2.3 표","src":"## 2.3 `errors.As` — 특정 타입으로 추출\n\n사용자 정의 에러 타입에서 **필드 값**을 꺼내려면 `errors.As`를 씁니다.\n\n```go\ntype ValidationError struct {\n Field string\n Msg string\n}\n\nfunc (e *ValidationError) Error() string {\n return fmt.Sprintf(\"%s: %s\", e.Field, e.Msg)\n}\n\nfunc main() {\n var err error = fmt.Errorf(\"처리 실패: %w\",\n &ValidationError{Field: \"email\", Msg: \"형식 오류\"})\n\n var ve *ValidationError\n if errors.As(err, &ve) {"},{"id":"t2-09","ty":"order","lv":2,"game":false,"p":"textutil 솔루션에서 없는 파일을 열었을 때 에러가 처리되는 흐름을 순서대로 배열하세요.","steps":["os.Open이 OS 에러를 반환","fileio.Open이 errors.Is로 os.ErrNotExist 판별","%w로 ErrNotFound를 래핑해 반환","main의 handleError가 errors.Is로 분기","'에러: 파일 없음' 메시지 출력"],"h":"솔루션에서 os.Open이 먼저 OS 에러를 내면, pkg/fileio의 Open이 errors.Is로 os.ErrNotExist인지 판별해 %w로 자체 sentinel ErrNotFound를 감싸 반환합니다. 진입점 main의 handleError가 다시 errors.Is로 분기해 사용자 메시지를 출력합니다.","w":"fileio.Open은 OS 에러를 sentinel(ErrNotFound)로 바꿔 <code>%w<\/code>로 경로와 함께 래핑합니다. main은 <code>errors.Is(err, fileio.ErrNotFound)<\/code>로 분기해 친절한 메시지를 출력합니다.","an":"2일차 솔루션 복습① Step 1 fileio.go · Step 4 main.go","src":"// 미리 정의된 에러 (sentinel) - errors.Is로 비교 가능\nvar (\n ErrNotFound = errors.New(\"파일을 찾을 수 없음\")\n ErrNoPermission = errors.New(\"파일 접근 권한 없음\")\n)\n\n// Open은 OS 에러를 sentinel로 변환해 반환\nfunc Open(path string) (io.ReadCloser, error) {\n f, err := os.Open(path)\n if err != nil {\n switch {\n case errors.Is(err, os.ErrNotExist):\n return nil, fmt.Errorf(\"%w: %s\", ErrNotFound, path)"},{"id":"t2-10","ty":"multi","lv":1,"game":true,"p":"복습② 솔루션 <code>errors_demo.go<\/code>에서 정의한 사용자 정의 에러 타입을 모두 고르세요.","o":["ValidationError","NetworkError","DBError","WithdrawError","ErrNotFound"],"a":[0,1,2],"h":"복습② 솔루션 errors_demo.go는 '검증·네트워크·데이터베이스' 세 분류로 에러 타입을 만듭니다. 각 구조체 이름은 분류 이름 뒤에 Error가 붙은 형태이며, DB 쪽은 Unwrap으로 Original 에러를 노출합니다.","w":"복습②는 ValidationError·NetworkError·DBError 세 타입을 정의하고 <code>errors.As<\/code>로 분기합니다. WithdrawError는 2교시 실습 코드의 타입이고, ErrNotFound는 타입이 아니라 sentinel 값입니다.","an":"2일차 솔루션 복습② errors_demo.go","src":"// === 에러 타입 1: 검증 에러 ===\ntype ValidationError struct {\n Field string\n Value any\n Message string\n}\nfunc (e *ValidationError) Error() string {\n return fmt.Sprintf(\"필드 %q 검증 실패 (값=%v): %s\",\n e.Field, e.Value, e.Message)\n}\n// === 에러 타입 2: 네트워크 에러 ===\ntype NetworkError struct {\n URL string\n StatusCode int\n Timeout time.Duration\n Retryable bool\n}\nfunc (e *NetworkError) Error() string {"}]},{"id":"t3","title":"panic · recover · defer","ref":"2일차 §2.5","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"<code>defer<\/code>된 함수 안에서 호출해 진행 중인 panic을 멈추는 내장 함수는?","o":["recover","defer","errors.Is","os.Exit"],"a":0,"h":"panic이 나면 defer된 함수가 역순으로 실행되며 호출 스택을 거슬러 올라갑니다. 그 도중 defer 함수 안에서 특정 내장 함수를 호출하면 panic 전파가 멈추며, 이름은 '회복하다'라는 영어 단어입니다.","w":"<code>recover()<\/code>를 만나면 panic 전파가 중단됩니다. <code>defer<\/code>는 함수 종료 시 실행을 예약할 뿐 panic을 멈추지 않습니다.","an":"2일차 §2.5 동작 원리","src":"### 동작 원리\n\n1. `panic(\"...\")`이 호출되면 현재 함수 실행 중단\n2. `defer`된 함수들이 역순으로 실행\n3. 호출 스택을 거슬러 올라가며 panic 전파\n4. 도중에 `recover()`를 만나면 panic 중단\n5. `recover()`가 없으면 프로그램 종료 + 스택 트레이스 출력"},{"id":"t3-02","ty":"mc","lv":1,"game":true,"p":"교안이 Go의 <code>panic<\/code>/<code>recover<\/code>와 비교한 C의 기법은?","o":["goto cleanup","setjmp/longjmp","errno 검사","#include 매크로"],"a":1,"h":"교안은 C에서 '거의 안 씀, 매우 위험'한 방식으로 jmp_buf에 위치를 저장했다가 깊은 함수에서 그 위치로 점프하는 기법을 보여 주고, Go의 panic/recover를 '관리된 방식'으로 대비합니다.","w":"C의 <code>setjmp/longjmp<\/code>는 깊은 함수에서 저장 위치로 점프합니다. Go는 이를 panic/recover로 관리된 방식으로 제공합니다. goto cleanup은 defer와 비교된 패턴입니다.","an":"2일차 §2.5 C의 setjmp/longjmp와 비교","src":"jmp_buf env;\n\nvoid deep_function(void) {\n longjmp(env, 1); // env로 점프\n}\n\nint main(void) {\n if (setjmp(env) == 0) {\n deep_function();\n } else {\n printf(\"점프 후 복귀\\n\");\n }\n}\n```"},{"id":"t3-03","ty":"mc","lv":2,"game":true,"p":"교안의 panic 사용 가이드라인에 맞는 상황은?","o":["문자열 숫자 변환 실패","읽을 파일이 없음","초기화 중 치명적 오류","사용자 입력 형식 오류"],"a":2,"h":"교안은 panic을 일반 에러 처리에 쓰지 말라고 강조하며 사용 가이드라인 세 가지를 제시합니다. 프로그램 초기화 중 치명적 오류(regexp.MustCompile 예), 불변량이 깨진 가정 위반, 그리고 라이브러리 API에서는 거의 쓰지 말 것입니다.","w":"panic은 프로그램 초기화 중 치명적 오류나 불변량 위반처럼 일어나서는 안 되는 경우에만 씁니다. 변환 실패·파일 없음·입력 오류는 예측 가능한 에러이므로 error로 반환합니다.","an":"2일차 §2.5 panic 사용 가이드라인","src":"**`panic` 사용 가이드라인**:\n- 프로그램 초기화 중 치명적 오류 (예: `regexp.MustCompile`)\n- 절대로 일어나서는 안 되는 가정 위반 (불변량 깨짐)\n- 라이브러리 사용자 대상 API에서는 거의 쓰지 말 것"},{"id":"t3-04","ty":"mc","lv":3,"game":false,"p":"다음 코드의 출력 순서는? <code>defer fmt.Println(\"1\"); defer fmt.Println(\"2\"); defer fmt.Println(\"3\")<\/code>","o":["1, 2, 3","2, 3, 1","1, 3, 2","3, 2, 1"],"a":3,"h":"여러 defer 호출은 스택에 쌓였다가 함수가 끝날 때 LIFO 순서로 실행됩니다. 마지막에 등록한 것이 가장 먼저 실행된다는 점을 적용해 보세요.","w":"다중 defer는 LIFO(스택) 순서로 실행되므로 3, 2, 1이 출력됩니다. 등록 순서대로 실행된다고 착각하기 쉽습니다.","an":"2일차 §2.5 defer의 활용 — LIFO","src":"**다중 defer는 LIFO(스택) 순서로 실행됩니다**:\n\n```go\ndefer fmt.Println(\"1\")\ndefer fmt.Println(\"2\")\ndefer fmt.Println(\"3\")\n// 출력 순서: 3, 2, 1\n```"},{"id":"t3-05","ty":"mc","lv":3,"game":false,"p":"<code>safeCall()<\/code>은 <code>defer func(){ if r := recover(); r != nil { fmt.Println(\"패닉 복구:\", r) } }()<\/code> 후 <code>mayPanic()<\/code>을 호출하고 다음 줄에 '이 라인은 실행 안 됨'을 출력합니다. main이 <code>safeCall()<\/code> 후 '프로그램 계속'을 출력할 때 실제 출력 순서는?","o":["패닉 복구 → 프로그램 계속","프로그램 계속 → 패닉 복구","이 라인은 실행 안 됨 → 프로그램 계속","패닉 복구 → 이 라인은 실행 안 됨"],"a":0,"h":"mayPanic()이 panic하면 safeCall의 남은 줄('이 라인은 실행 안 됨')은 건너뛰고 defer된 함수가 실행되어 recover가 panic을 멈춥니다. safeCall이 정상 종료처럼 반환되므로 main은 다음 줄을 계속 실행합니다.","w":"mayPanic의 panic으로 safeCall의 나머지 줄은 실행되지 않고, defer 안의 recover가 '패닉 복구: 심각한 오류!'를 출력합니다. 복구되었으므로 main으로 돌아와 '프로그램 계속'이 출력됩니다.","an":"2일차 §2.5 Go — 관리된 방식 (panic.go)","src":"package main\n\nimport \"fmt\"\n\n// Go — 관리된 방식\nfunc mayPanic() {\n panic(\"심각한 오류!\")\n}\n\nfunc safeCall() {\n defer func() {\n if r := recover(); r != nil {\n fmt.Println(\"패닉 복구:\", r)\n }\n }()\n mayPanic()\n fmt.Println(\"이 라인은 실행 안 됨\")\n}\n\nfunc main() {\n safeCall()\n fmt.Println(\"프로그램 계속\")\n}"},{"id":"t3-06","ty":"ox","lv":2,"game":true,"p":"<code>strconv.Atoi<\/code> 실패처럼 예측 가능한 에러는 <code>panic(err)<\/code>으로 처리하는 것이 Go다운 방식이다.","a":false,"h":"교안은 parseAge 예제에서 strconv.Atoi 실패에 panic(err)을 쓰는 것을 '잘못된 사용'으로, (int, error)로 돌려주는 것을 '올바른 사용'으로 나눕니다. panic은 호출자가 처리할 기회를 빼앗기 때문입니다.","w":"틀렸습니다. panic은 너무 강력해 호출자가 처리할 기회를 빼앗습니다. <code>func parseAge(s string) (int, error)<\/code>처럼 error를 반환하는 것이 올바른 사용입니다.","an":"2일차 §2.5 panic은 일반적인 에러 처리에 쓰지 말 것","src":"### 🔥 중요: panic은 일반적인 에러 처리에 쓰지 말 것!\n\n```go\n// ❌ 잘못된 사용\nfunc parseAge(s string) int {\n n, err := strconv.Atoi(s)\n if err != nil {\n panic(err) // 너무 강력 — 호출자가 처리할 기회 박탈\n }\n return n\n}\n\n// ✅ 올바른 사용\nfunc parseAge(s string) (int, error) {\n return strconv.Atoi(s)\n}\n```\n\n**`panic` 사용 가이드라인**:\n- 프로그램 초기화 중 치명적 오류 (예: `regexp.MustCompile`)\n- 절대로 일어나서는 안 되는 가정 위반 (불변량 깨짐)\n- 라이브러리 사용자 대상 API에서는 거의 쓰지 말 것"},{"id":"t3-07","ty":"ox","lv":1,"game":true,"p":"<code>defer f.Close()<\/code>로 등록한 호출은 함수가 종료될 때 자동으로 실행된다.","a":true,"h":"defer는 호출을 예약해 두었다가 둘러싼 함수가 종료될 때 실행합니다. 교안은 os.Open 뒤에 defer f.Close()를 두어 C의 goto cleanup 패턴을 한 줄로 대신한다고 설명합니다.","w":"맞습니다. defer는 함수 종료 시 자동 호출되므로 파일을 연 직후 Close를 예약해 두면 정리 코드를 잊지 않습니다.","an":"2일차 §2.5 defer의 활용","src":"```go\nf, err := os.Open(\"data.txt\")\nif err != nil {\n return err\n}\ndefer f.Close() // 함수 종료 시 자동 호출\n\n// 파일 사용...\n```\n\nC에서 `goto cleanup` 패턴이나 try-finally(C에는 없음) 흉내를 위해 매크로를 만들던 일을 `defer` 한 줄로 해결합니다."},{"id":"t3-08","ty":"match","lv":1,"game":false,"p":"키워드·함수와 역할을 연결하세요.","pairs":[["panic","현재 함수 중단 후 호출 스택으로 전파"],["recover","defer 안에서 panic 전파를 멈춤"],["defer","함수 종료 시 LIFO 순서로 실행"],["regexp.MustCompile","초기화 중 치명적 오류 시 panic하는 예"]],"h":"panic은 현재 함수를 중단시키고 호출 스택을 따라 전파됩니다. recover는 defer 안에서 그 전파를 멈추고, defer는 함수 종료 시 LIFO로 실행되며, regexp.MustCompile은 초기화 중 치명적 오류에 panic하는 예입니다.","w":"panic은 실행을 중단하고 전파되며, recover는 defer 안에서 이를 멈춥니다. defer는 종료 시 역순 실행을 예약하고, regexp.MustCompile은 panic이 허용되는 초기화 단계의 예입니다.","an":"2일차 §2.5 동작 원리 · 가이드라인","src":"### 동작 원리\n\n1. `panic(\"...\")`이 호출되면 현재 함수 실행 중단\n2. `defer`된 함수들이 역순으로 실행\n3. 호출 스택을 거슬러 올라가며 panic 전파\n4. 도중에 `recover()`를 만나면 panic 중단\n5. `recover()`가 없으면 프로그램 종료 + 스택 트레이스 출력"},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"panic이 발생했을 때의 동작 원리를 순서대로 배열하세요.","steps":["panic 호출로 현재 함수 실행 중단","defer된 함수들이 역순으로 실행","호출 스택을 거슬러 올라가며 panic 전파","도중에 recover()를 만나면 panic 중단"],"h":"교안의 동작 원리는 다섯 단계입니다. panic 호출로 현재 함수가 멈추고, defer들이 역순 실행되며, 호출 스택을 거슬러 전파되다가 recover를 만나면 중단되고, 없으면 프로그램이 종료됩니다.","w":"panic → 현재 함수 중단 → defer 역순 실행 → 스택을 거슬러 전파 → recover를 만나면 중단됩니다. recover가 없으면 프로그램이 종료되고 스택 트레이스가 출력됩니다.","an":"2일차 §2.5 동작 원리","src":"### 동작 원리\n\n1. `panic(\"...\")`이 호출되면 현재 함수 실행 중단\n2. `defer`된 함수들이 역순으로 실행\n3. 호출 스택을 거슬러 올라가며 panic 전파\n4. 도중에 `recover()`를 만나면 panic 중단\n5. `recover()`가 없으면 프로그램 종료 + 스택 트레이스 출력"},{"id":"t3-10","ty":"multi","lv":2,"game":true,"p":"교안의 panic 사용 가이드라인에 맞는 상황을 모두 고르세요.","o":["초기화 중 치명적 오류","일어나선 안 되는 가정 위반","라이브러리 공개 API의 일반 에러","파일 없음 같은 예측 가능 에러","불변량이 깨진 상황"],"a":[0,1,4],"h":"panic 사용 가이드라인은 프로그램 초기화 중 치명적 오류와 절대로 일어나서는 안 되는 가정 위반(불변량 깨짐)을 듭니다. 입력 변환 실패처럼 예측 가능한 에러는 error로 반환해야 합니다.","w":"panic은 초기화 중 치명적 오류와 가정(불변량) 위반에만 씁니다. 라이브러리 사용자 대상 API에서는 거의 쓰지 말고, 예측 가능한 에러는 error로 반환합니다.","an":"2일차 §2.5 panic 사용 가이드라인","src":"**`panic` 사용 가이드라인**:\n- 프로그램 초기화 중 치명적 오류 (예: `regexp.MustCompile`)\n- 절대로 일어나서는 안 되는 가정 위반 (불변량 깨짐)\n- 라이브러리 사용자 대상 API에서는 거의 쓰지 말 것"}]},{"id":"t4","title":"Go 모듈 I · go mod","ref":"2일차 §3","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":true,"p":"빈 디렉터리에서 모듈을 초기화해 <code>go.mod<\/code>를 만드는 명령은?","o":["go mod tidy","go mod init","go get","go mod vendor"],"a":1,"h":"hello-mod 실습은 빈 디렉터리를 만든 뒤 go mod 하위 명령으로 모듈을 초기화하고, 그 결과 module 경로가 적힌 go.mod가 생깁니다. 하위 명령 이름은 '초기화(initialize)'의 약어입니다.","w":"<code>go mod init &lt;모듈 경로&gt;<\/code>가 go.mod를 생성합니다. <code>go mod tidy<\/code>는 이미 있는 go.mod의 의존성을 정리합니다.","an":"2일차 §3.3 Step 1","src":"# 모듈 초기화 — go.mod 파일 생성\ngo mod init github.com/myname/hellomod\n```\n\n> **모듈 이름은 보통 `github.com/계정/리포지토리` 형식**입니다. 비공개라도 미래에 공개 가능성을 고려해 이 컨벤션을 따릅니다.\n\n확인:\n```bash\ncat go.mod\n```\n\n```text\nmodule github.com/myname/hellomod\n\ngo 1.22\n```"},{"id":"t4-02","ty":"mc","lv":1,"game":true,"p":"Go가 모듈 시스템을 처음 도입한 버전은?","o":["Go 1.11","Go 1.13","Go 1.18","Go 1.22"],"a":0,"h":"교안 §3.2는 Go가 2018년에 모듈 시스템을 도입했다고 설명합니다. 에러 래핑(%w)이 들어온 1.13보다 앞선 1.x 버전이며, 이때부터 go.mod로 프로젝트 단위 의존성을 명시하게 되었습니다.","w":"모듈은 Go 1.11(2018년)에 도입되었습니다. 1.13은 에러 래핑이 추가된 버전입니다.","an":"2일차 §3.2 Go 모듈의 등장","src":"## 3.2 Go 모듈의 등장\n\nGo는 1.11부터 **모듈(modules)** 시스템을 도입했습니다(2018년). 핵심 아이디어:\n\n- **프로젝트 단위로 의존성 명시** (`go.mod`)\n- **버전 잠금**으로 재현 가능한 빌드 (`go.sum`)\n- **시스템 전역 설치 불필요** — 프로젝트별로 독립\n- **자동 다운로드** — `go get`이 알아서 가져옴"},{"id":"t4-03","ty":"mc","lv":1,"game":true,"p":"<code>go.mod<\/code>에서 의존하는 외부 모듈과 버전을 적는 지시어는?","o":["module","go","replace","require"],"a":3,"h":"go.mod는 module(모듈 경로), go(사용 버전), 그리고 의존하는 외부 모듈과 버전을 나열하는 블록으로 구성됩니다. 마지막 지시어는 '필요로 하다'라는 뜻의 영어 단어입니다.","w":"<code>require<\/code>에 의존 모듈과 버전이 적힙니다. <code>module<\/code>은 이 모듈의 경로, <code>go<\/code>는 사용하는 Go 버전입니다.","an":"2일차 §3.2 go.mod 파일의 구조","src":"### `go.mod` 파일의 구조\n\n```text\nmodule github.com/user/myproject\n\ngo 1.24\n\nrequire (\n github.com/gin-gonic/gin v1.9.1\n github.com/stretchr/testify v1.8.4\n)\n```\n\n- **module**: 이 모듈의 경로 (보통 git 저장소 URL과 일치)\n- **go**: 사용하는 Go 버전\n- **require**: 의존하는 외부 모듈과 버전\n\nC로 비유하면 `pkg-config --modversion`을 자동으로 기록해두는 셈입니다."},{"id":"t4-04","ty":"mc","lv":2,"game":true,"p":"다운로드된 모듈 캐시의 위치를 확인하는 명령은?","o":["go env GOCACHE","go env GOOS","go env GOMODCACHE","go env GOARCH"],"a":2,"h":"다운로드된 모듈은 ~/go/pkg/mod 아래에 저장되며, go env 명령으로 그 위치를 담은 환경 변수를 확인합니다. 빌드 캐시는 GOCACHE이고, 모듈 캐시는 MOD와 CACHE가 합쳐진 이름의 변수입니다.","w":"<code>go env GOMODCACHE<\/code>는 보통 ~/go/pkg/mod를 가리킵니다. GOCACHE는 빌드 결과 캐시이고, GOOS·GOARCH는 크로스 컴파일 대상입니다.","an":"2일차 §3.4 모듈 캐시의 위치","src":"# uuid@v1.6.0/\n\ngo env GOMODCACHE"},{"id":"t4-05","ty":"mc","lv":3,"game":false,"p":"main.go에 uuid 외부 라이브러리 import를 추가했습니다. go.mod에 require를 자동으로 추가하고 다운로드하려면 다음에 무엇을 실행하나요?","o":["go mod tidy","go build -v","go mod graph","go env"],"a":0,"h":"외부 패키지 import를 추가한 뒤에는 코드의 import를 분석해 go.mod에 require를 자동 추가하고 다운로드까지 해 주는 명령을 실행합니다. 사용하지 않는 의존성도 지워 go.mod를 '정돈'하는 명령입니다.","w":"<code>go mod tidy<\/code>는 import된 외부 패키지를 분석해 require를 추가하고 다운로드합니다. go mod graph는 이미 있는 의존성 그래프를 보여 줄 뿐입니다.","an":"2일차 §3.3 Step 2–3","src":"### Step 3. 의존성 다운로드\n\n```bash\ngo mod tidy\n```\n\n이 명령은:\n- 코드에서 `import`된 외부 패키지를 분석\n- `go.mod`에 `require` 자동 추가\n- 다운로드 후 캐시 저장 (`~/go/pkg/mod`)\n- 사용하지 않는 의존성은 제거\n\n`go.mod`를 다시 보면:\n\n```text\nmodule github.com/myname/hellomod\n\ngo 1.22\n\nrequire github.com/google/uuid v1.6.0\n```"},{"id":"t4-06","ty":"ox","lv":2,"game":true,"p":"Go 모듈 캐시는 프로젝트마다 복사되므로 같은 버전도 프로젝트 수만큼 저장된다.","a":false,"h":"교안은 모듈 캐시가 프로젝트별로 복사되지 않고, 한 번 다운로드하면 모든 프로젝트가 공유한다고 설명합니다. 대신 uuid@v1.6.0처럼 버전별 디렉터리로 분리되어 충돌이 없습니다.","w":"틀렸습니다. 모듈 캐시는 프로젝트별로 복사되지 않고 모든 프로젝트가 공유합니다. 대신 버전별로 디렉터리가 분리되어 충돌이 없습니다.","an":"2일차 §3.4 모듈 캐시의 위치","src":"# /home/사용자/go/pkg/mod\n```\n\n**프로젝트별로 복사되지 않습니다.** 한 번 다운로드하면 모든 프로젝트가 공유합니다. C의 시스템 전역 설치와 비슷해 보이지만, **버전별로 디렉터리가 분리**되어 충돌이 없습니다.\n\n```bash\nls ~/go/pkg/mod/github.com/google/uuid@*"},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"Go는 모듈 경로가 곧 다운로드 가능한 위치이므로 npm·pip 같은 별도 패키지 레지스트리가 필요 없다.","a":true,"h":"Go 툴체인은 import 경로 github.com/myname/hellomod를 보고 GitHub 저장소를 추론해 git clone으로 가져옵니다. 교안은 이를 '모듈 경로 = 다운로드 가능한 위치'라고 정리합니다.","w":"맞습니다. 툴체인은 모듈 경로로 저장소를 추론해 clone하고 하위 디렉터리에서 패키지를 찾습니다. 그래서 모듈 경로 = 다운로드 가능한 위치가 됩니다.","an":"2일차 §3.5 모듈 경로의 의미","src":"## 3.5 모듈 경로의 의미\n\n`module github.com/myname/hellomod`는 단순한 이름이 아닙니다.\n\n다른 프로젝트가 우리 모듈을 import한다고 가정해봅시다.\n\n```go\nimport \"github.com/myname/hellomod/utils\"\n```\n\nGo 툴체인은 이렇게 동작합니다:\n1. `github.com/myname/hellomod`를 보고 GitHub 저장소를 추론\n2. `git clone https://github.com/myname/hellomod`\n3. 그 안의 `utils` 하위 디렉터리에서 패키지 찾기\n\n**즉, 모듈 경로 = 다운로드 가능한 위치**가 됩니다. 별도의 패키지 레지스트리(npm, pip 같은)가 필요 없습니다."},{"id":"t4-08","ty":"match","lv":1,"game":false,"p":"<code>go.mod<\/code>의 항목과 의미를 연결하세요.","pairs":[["module","이 모듈의 경로"],["go","사용하는 Go 버전"],["require","의존하는 외부 모듈과 버전"]],"h":"go.mod 예시는 위에서부터 module, go, require 순서로 적혀 있습니다. module은 이 모듈 자신의 경로(git 저장소 URL), go는 사용하는 Go 버전, require는 외부 의존성과 버전을 뜻합니다.","w":"module은 모듈 경로(보통 저장소 URL과 일치), go는 Go 버전, require는 의존 모듈과 버전입니다.","an":"2일차 §3.2 go.mod 파일의 구조","src":"### `go.mod` 파일의 구조\n\n```text\nmodule github.com/user/myproject\n\ngo 1.24\n\nrequire (\n github.com/gin-gonic/gin v1.9.1\n github.com/stretchr/testify v1.8.4\n)\n```\n\n- **module**: 이 모듈의 경로 (보통 git 저장소 URL과 일치)\n- **go**: 사용하는 Go 버전\n- **require**: 의존하는 외부 모듈과 버전\n\nC로 비유하면 `pkg-config --modversion`을 자동으로 기록해두는 셈입니다."},{"id":"t4-09","ty":"order","lv":3,"game":false,"p":"첫 모듈 만들기 실습(hello-mod)의 단계를 순서대로 배열하세요.","steps":["빈 디렉터리에서 go mod init","main.go에 외부 라이브러리 import","go mod tidy로 의존성 다운로드","go run main.go로 실행"],"h":"hello-mod 실습은 Step 1 빈 디렉터리에서 모듈 초기화, Step 2 main.go에서 uuid 라이브러리 사용, Step 3 go mod tidy로 의존성 다운로드, 마지막으로 프로그램 실행 순서로 진행됩니다.","w":"go mod init으로 모듈을 만들고, 코드에서 import한 뒤 go mod tidy로 require 추가와 다운로드를 하고, 마지막에 실행합니다. pkg-config나 LD_LIBRARY_PATH를 만질 필요가 없습니다.","an":"2일차 §3.3 Step 1–4","src":"### Step 3. 의존성 다운로드\n\n```bash\ngo mod tidy\n```\n\n이 명령은:\n- 코드에서 `import`된 외부 패키지를 분석\n- `go.mod`에 `require` 자동 추가\n- 다운로드 후 캐시 저장 (`~/go/pkg/mod`)\n- 사용하지 않는 의존성은 제거\n\n`go.mod`를 다시 보면:\n\n```text\nmodule github.com/myname/hellomod\n\ngo 1.22\n\nrequire github.com/google/uuid v1.6.0\n```"},{"id":"t4-10","ty":"multi","lv":2,"game":true,"p":"<code>go mod tidy<\/code>가 하는 일을 모두 고르세요.","o":["import된 외부 패키지 분석","go.mod에 require 자동 추가","다운로드 후 캐시에 저장","사용하지 않는 의존성 제거","바이너리를 ~/go/bin에 설치"],"a":[0,1,2,3],"h":"교안 Step 3은 go mod tidy가 하는 일을 네 줄로 정리합니다. import 분석, go.mod에 require 추가, 다운로드 후 ~/go/pkg/mod 캐시 저장, 사용하지 않는 의존성 제거입니다. 실행 파일 설치는 go install의 몫입니다.","w":"go mod tidy는 import 분석, require 추가, 다운로드·캐시 저장, 미사용 의존성 제거를 합니다. ~/go/bin 설치는 <code>go install<\/code>의 역할입니다.","an":"2일차 §3.3 Step 3","src":"```bash\ngo mod tidy\n```\n\n이 명령은:\n- 코드에서 `import`된 외부 패키지를 분석\n- `go.mod`에 `require` 자동 추가\n- 다운로드 후 캐시 저장 (`~/go/pkg/mod`)\n- 사용하지 않는 의존성은 제거"}]},{"id":"t5","title":"모듈 II · go.sum·SemVer·replace","ref":"2일차 §4 · 2일차 솔루션 복습③","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"<code>go.sum<\/code> 파일에 저장되는 것은?","o":["의존성별 SHA-256 해시","모듈 경로와 Go 버전","빌드 캐시 위치","취약점 목록"],"a":0,"h":"go mod tidy 후 생기는 go.sum에는 각 의존성 버전마다 h1:로 시작하는 값이 기록됩니다. 교안은 이를 '무결성 보증서'라 부르며, 라이브러리가 변조되면 이 값이 달라져 빌드가 거부된다고 설명합니다.","w":"go.sum에는 각 의존성의 SHA-256 해시가 저장되어 라이브러리가 변조되면 빌드가 거부됩니다. 모듈 경로와 Go 버전은 go.mod에 있습니다.","an":"2일차 §4.1 go.sum — 무결성 보증서","src":"각 의존성의 **SHA-256 해시**가 저장됩니다. 누군가 라이브러리를 몰래 변조해도 빌드가 거부됩니다."},{"id":"t5-02","ty":"mc","lv":1,"game":true,"p":"시맨틱 버저닝 v MAJOR.MINOR.PATCH에서 호환성을 깨는 변경 시 올리는 자리는?","o":["PATCH","MINOR","MAJOR","BUILD"],"a":2,"h":"SemVer는 v MAJOR.MINOR.PATCH 세 부분으로 나뉩니다. MINOR와 PATCH는 호환성을 유지한 기능 추가·버그 수정이고, 호환성을 깨는 변경은 가장 앞자리를 올립니다.","w":"MAJOR는 호환성을 깨는 변경, MINOR는 호환성 유지 + 기능 추가, PATCH는 호환성 유지 + 버그 수정입니다.","an":"2일차 §4.3 SemVer 표","src":"## 4.3 Semantic Versioning (SemVer)\n\nGo 모듈은 **시맨틱 버저닝**을 따릅니다.\n\n```\nv MAJOR . MINOR . PATCH\nv 1 . 2 . 3\n```\n\n| 부분 | 의미 |\n|---|---|\n| MAJOR | 호환성을 깨는 변경 |\n| MINOR | 호환성 유지 + 기능 추가 |\n| PATCH | 호환성 유지 + 버그 수정 |"},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"Go에서 어떤 모듈의 v2.x.x를 import하는 올바른 경로 형태는?","o":["github.com/foo/bar","github.com/foo/bar/v2","github.com/foo/bar@v2","github.com/foo/v2/bar"],"a":1,"h":"C는 liblib1.so.2처럼 파일명에 버전을 넣지만, Go는 v2 이상을 모듈 경로 자체에 넣습니다. v1은 경로 그대로 쓰고, v2부터는 경로 끝에 /v2 같은 접미사를 붙여 v1과 동시에 쓸 수도 있습니다.","w":"v2 이상은 경로에 <code>/v2<\/code>를 붙입니다. 덕분에 한 프로그램이 같은 모듈의 v1과 v2를 동시에 쓸 수 있습니다. @v2는 go get에서 버전을 지정할 때 쓰는 표기입니다.","an":"2일차 §4.3 v2 이상은 모듈 경로에 명시","src":"### Go의 독특한 규칙: v2 이상은 모듈 경로에 명시\n\nC 라이브러리는 보통 `liblib1.so.2`처럼 파일명에 버전을 넣지만, Go는 **모듈 경로** 자체에 포함시킵니다.\n\n```text\n// v1.x.x\nimport \"github.com/foo/bar\"\n\n// v2.x.x — 경로에 /v2 붙임\nimport \"github.com/foo/bar/v2\"\n```\n\n이러면 한 프로그램이 같은 모듈의 v1과 v2를 **동시에** 쓸 수도 있습니다. C에서 OpenSSL 1.x와 3.x를 동시 사용하는 게 어려운 것과 대조적입니다."},{"id":"t5-04","ty":"mc","lv":3,"game":true,"p":"직접 import하지 않은 golang.org/x/sys가 왜 의존성에 들어왔는지 확인하려면?","o":["go mod verify","go mod vendor","go list -m -versions","go mod why"],"a":3,"h":"복습③ 솔루션은 특정 패키지가 '왜' 의존성에 들어왔는지 추적하는 go mod 하위 명령을 보여 줍니다. 결과에서 logrus가 golang.org/x/sys를 끌어왔음을 확인할 수 있으며, 하위 명령은 영어 의문사입니다.","w":"<code>go mod why golang.org/x/sys<\/code>는 logrus가 이 패키지를 끌어왔음을 보여 줍니다. go mod verify는 go.sum 검증, go list -m -versions는 사용 가능한 버전 확인입니다.","an":"2일차 §4.8 · 2일차 솔루션 복습③ ② go mod why","src":"# golang.org/x/sys\ngithub.com/sirupsen/logrus\ngolang.org/x/sys/unix\n```\n\n→ `logrus`가 `golang.org/x/sys`를 끌어왔음을 알 수 있습니다.\n\n```bash\ngo mod why github.com/stretchr/testify\n```\n\n`testify`는 우리 코드와 직접 연관이 없지만 의존성으로 들어왔습니다. 보통 테스트 의존성으로 같이 따라옵니다."},{"id":"t5-05","ty":"mc","lv":2,"game":true,"p":"라이브러리 버그를 고친 로컬 포크(../my-fork-of-bar)를 대신 쓰려면 go.mod에 어떤 지시어를 쓰나요?","o":["exclude","require","replace","module"],"a":2,"h":"라이브러리를 직접 고쳐 써야 할 때는 go.mod에 원래 모듈 => 로컬 경로(또는 다른 저장소) 형태의 지시어를 씁니다. 원래 모듈을 다른 경로로 '바꿔 끼우는' 뜻의 영어 단어입니다.","w":"<code>replace github.com/foo/bar =&gt; ../my-fork-of-bar<\/code>처럼 씁니다. exclude는 알려진 버그 버전을 제외할 때 씁니다.","an":"2일차 §4.5 replace","src":"라이브러리에 버그가 있어서 직접 수정해야 한다면, `replace` 지시어를 씁니다.\n\n```text\n// go.mod\nmodule github.com/myname/myapp\n\nrequire github.com/foo/bar v1.2.3\n\nreplace github.com/foo/bar => ../my-fork-of-bar\n// 또는 다른 저장소로\nreplace github.com/foo/bar => github.com/myname/bar-fork v1.2.4"},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"<code>go.sum<\/code>은 자동 생성되는 파일이므로 Git에 커밋하지 않는 편이 좋다.","a":false,"h":"go.sum에는 의존성별 SHA-256 해시가 저장되어 변조를 막습니다. 교안은 협업자와 CI에서 동일한 빌드를 보장하려면 이 파일을 반드시 Git에 커밋하라고 강조합니다.","w":"틀렸습니다. 교안은 go.sum을 반드시 Git에 커밋하라고 합니다. 그래야 협업자와 CI가 같은 해시로 검증된 의존성으로 빌드합니다.","an":"2일차 §4.1","src":"각 의존성의 **SHA-256 해시**가 저장됩니다. 누군가 라이브러리를 몰래 변조해도 빌드가 거부됩니다.\n\n> **C에는 이런 게 없습니다.** 시스템 패키지 매니저가 서명 검증을 하긴 하지만, 프로젝트 자체에 잠금 기능은 없습니다.\n\n**`go.sum`은 반드시 Git에 커밋하세요.** 협업자와 CI에서 동일한 빌드를 보장하는 핵심입니다."},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"go.mod의 <code>// indirect<\/code> 표시는 직접 import하지 않았지만 의존성의 의존성으로 들어온 모듈을 뜻한다.","a":true,"h":"httpdemo에서 logrus를 추가한 뒤 go.mod를 보면 golang.org/x/sys 줄에 // indirect 주석이 붙어 있습니다. 교안은 이 표시를 직접 import하지 않았지만 의존성의 의존성으로 들어온 패키지라고 설명합니다.","w":"맞습니다. httpdemo에서 logrus를 추가하자 golang.org/x/sys가 <code>// indirect<\/code>로 들어왔습니다. 우리 코드가 아니라 logrus가 필요로 하는 모듈입니다.","an":"2일차 §4.9 실전 워크플로","src":"```bash\ngo mod tidy # logrus 자동 추가\ngo run main.go\n```\n`go.mod` 확인:\n```text\nmodule httpdemo\ngo 1.22\nrequire github.com/sirupsen/logrus v1.9.3\nrequire golang.org/x/sys v0.0.0-... // indirect\n```\n`// indirect`는 직접 import하진 않았지만 의존성의 의존성으로 들어온 패키지입니다."},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"명령과 용도를 연결하세요.","pairs":[["go get -u=patch 모듈","패치 버전만 업데이트"],["go get -u 모듈","마이너 + 패치 업데이트"],["go get 모듈@v1.9.0","특정 버전으로 고정"],["go mod graph","의존성 트리 보기"],["govulncheck ./...","알려진 취약점 검사"]],"h":"go get -u는 마이너+패치 업데이트, -u=patch는 패치만, 모듈@버전은 특정 버전 고정입니다. go mod graph는 전체 의존성 그래프를, govulncheck ./...는 알려진 취약점을 검사합니다.","w":"-u=patch는 패치만, -u는 호환성 유지 범위(마이너+패치)까지 올립니다. @버전은 고정, go mod graph는 'A가 B에 의존' 목록, govulncheck는 CVE 점검입니다.","an":"2일차 §4.4 · §4.8 · 2일차 솔루션 복습③","src":"# 패치 버전 업데이트 (v1.9.3 → v1.9.5)\ngo get -u=patch github.com/sirupsen/logrus"},{"id":"t5-09","ty":"order","lv":3,"game":false,"p":"HTTP 클라이언트 실전 워크플로(httpdemo)의 단계를 순서대로 배열하세요.","steps":["go mod init httpdemo","표준 라이브러리만으로 main.go 작성·실행","logrus import 추가","go mod tidy로 logrus 자동 추가","go.mod의 require 확인"],"h":"httpdemo 실습은 go mod init으로 시작해 표준 라이브러리(net/http)만으로 main.go를 작성·실행합니다. 그 다음 logrus import를 추가하고 go mod tidy로 자동 추가한 뒤 go.mod의 require를 확인합니다.","w":"모듈을 만들고 표준 라이브러리만으로 먼저 실행한 뒤(go.mod 변화 없음), logrus를 import하고 tidy로 추가한 다음 go.mod에서 require와 indirect를 확인합니다.","an":"2일차 §4.9 실전 워크플로 — Step by Step","src":"# 1) 새 프로젝트\nmkdir -p ~/go-class/day2/http-demo\ncd ~/go-class/day2/http-demo\ngo mod init httpdemo\n```\n`main.go`:\n```go\npackage main\nimport (\n \"fmt\"\n \"io\"\n \"net/http\"\n)"},{"id":"t5-10","ty":"multi","lv":1,"game":true,"p":"교안에서 <code>go.mod<\/code> 안에 쓰는 지시어로 소개된 것을 모두 고르세요.","o":["require","replace","exclude","vendor","install"],"a":[0,1,2],"h":"교안 §4.5~4.7의 go.mod 예시 블록에는 의존성을 적는 지시어, 로컬 포크로 바꿔 끼우는 지시어, 알려진 버그 버전을 빼는 지시어가 등장합니다. vendor는 go mod vendor라는 명령이지 go.mod 지시어가 아닙니다.","w":"require·replace·exclude는 go.mod에 쓰는 지시어입니다. vendor는 <code>go mod vendor<\/code> 명령과 디렉터리, install은 <code>go install<\/code> 명령입니다.","an":"2일차 §4.5–4.7","src":"```text\n// go.mod\nmodule github.com/myname/myapp\n\nrequire github.com/foo/bar v1.2.3\n\nreplace github.com/foo/bar => ../my-fork-of-bar\n// 또는 다른 저장소로\nreplace github.com/foo/bar => github.com/myname/bar-fork v1.2.4"}]},{"id":"t6","title":"패키지 설계 · 가시성","ref":"2일차 §5","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"Go에서 패키지 밖으로 공개(exported)되는 식별자의 조건은?","o":["이름 첫 글자가 대문자","export 키워드를 붙임","이름 첫 글자가 소문자","헤더 파일에 선언"],"a":0,"h":"C는 static 키워드로 파일 스코프를 제한했지만, Go는 식별자 이름만 보고 공개 여부를 정합니다. 예제에서 Hello()는 외부에서 보이고 greeting()은 보이지 않았으며, 구조체 필드 Name/secret도 같은 규칙을 따릅니다.","w":"이름 첫 글자가 대문자면 공개, 소문자면 비공개입니다. Go에는 export 키워드나 헤더 파일이 없습니다.","an":"2일차 §5.2 가시성 규칙","src":"Go는 더 단순합니다. **이름의 첫 글자가 대문자면 외부 공개(exported), 소문자면 비공개(unexported)**.\n\n```go\npackage greeter\n\n// 외부에 노출됨 (대문자)\nfunc Hello() string {\n return greeting() + \", world!\"\n}\n\n// 패키지 내부 전용 (소문자)\nfunc greeting() string {\n return \"Hello\"\n}\n\n// 구조체 필드도 같은 규칙\ntype Config struct {\n Name string // 공개\n secret string // 비공개\n}\n```"},{"id":"t6-02","ty":"mc","lv":1,"game":true,"p":"부모 모듈 바깥에서는 import할 수 없도록 막는 특수 디렉터리는?","o":["pkg/","cmd/","internal/","vendor/"],"a":2,"h":"Go에는 디렉터리 이름만으로 접근을 막는 특수 디렉터리가 있습니다. 이 디렉터리 아래 패키지는 부모 모듈 외부에서 import하면 컴파일이 거부되어, 공개 API(pkg/)와 내부 구현을 구조로 분리합니다.","w":"<code>internal/<\/code> 아래 패키지는 외부 모듈이 import하면 컴파일이 거부됩니다. pkg/는 반대로 외부에 공개할 라이브러리를 두는 관례적 위치입니다.","an":"2일차 §5.4 internal/ — 강제 비공개","src":"## 5.4 `internal/` — 강제 비공개\n\n`internal/` 이라는 특수 디렉터리는 **부모 모듈 외부에서 import할 수 없습니다**.\n\n```\ngithub.com/myname/myapp/\n├── go.mod\n├── main.go\n├── internal/\n│ └── auth/\n│ └── token.go ← 외부 모듈에서 import 불가\n└── pkg/\n └── api/\n └── client.go ← 외부에 공개되는 API\n```\n\n다른 모듈이 `import \"github.com/myname/myapp/internal/auth\"`를 시도하면 컴파일 거부됩니다."},{"id":"t6-03","ty":"mc","lv":2,"game":true,"p":"교안의 좋은 패키지 이름 컨벤션에 맞는 것은?","o":["json_parser","userlib","httputil_v2","user"],"a":3,"h":"교안의 컨벤션은 패키지 이름을 짧은 소문자 한 단어로 짓는 것입니다. httputil_v2처럼 버전 접미사, json_parser처럼 언더바, userlib처럼 lib·pkg 접미사가 붙은 이름은 '나쁨' 열에 있습니다.","w":"패키지 이름은 짧은 소문자 한 단어가 좋습니다. json_parser는 군더더기, userlib는 불필요한 'lib' 접미사, httputil_v2는 길고 언더바가 있습니다.","an":"2일차 §5.3 좋은 패키지 이름","src":"## 5.3 좋은 패키지 이름\n\n| 좋음 | 나쁨 | 이유 |\n|---|---|---|\n| `http` | `httputil_v2` | 짧고 명확 |\n| `json` | `json_parser` | 동사 / 군더더기 제거 |\n| `user` | `userlib` | \"lib\", \"pkg\" 접미사 불필요 |\n\n> **컨벤션**: 패키지 이름은 **짧은 소문자 한 단어**. 언더바, 카멜케이스 피함."},{"id":"t6-04","ty":"mc","lv":3,"game":true,"p":"mathx 패키지의 소문자 함수 <code>abs<\/code>를 main.go에서 <code>fmt.Println(mathx.abs(-5))<\/code>로 호출하면?","o":["5가 출력된다","컴파일이 거부된다","-5가 출력된다","런타임 panic"],"a":1,"h":"mathx의 abs는 소문자로 시작하는 비공개 헬퍼라 GCD 안에서만 쓰입니다. 다른 패키지에서 비공개 이름을 참조하면 'cannot refer to unexported name' 오류가 나며, 교안은 C의 static 함수와 같은 효과라고 설명합니다.","w":"소문자 이름은 비공개라 'cannot refer to unexported name mathx.abs'로 컴파일이 거부됩니다. C의 static 함수와 같은 효과이지만 이름만 보고 구분됩니다.","an":"2일차 §5.7 Step 6 비공개 함수 접근 시도","src":"# ./main.go:11:21: cannot refer to unexported name mathx.abs\n```\n\n→ 컴파일 거부됨을 확인. C의 `static` 함수와 같은 효과지만 **이름만 보고도 구분**됩니다."},{"id":"t6-05","ty":"mc","lv":3,"game":true,"p":"rune 슬라이스로 뒤집는 <code>stringx.Reverse(\"안녕 Go\")<\/code>의 결과는?","o":["oG 녕안","oG 안녕","Go 녕안","깨진 바이트"],"a":0,"h":"stringx.Reverse는 문자열을 []rune으로 바꾼 뒤 양끝 인덱스를 맞바꿔 뒤집습니다. rune은 바이트가 아닌 글자 단위라 한글도 깨지지 않고, 공백도 하나의 글자로 자리만 바뀝니다.","w":"<code>[]rune(s)<\/code>로 바꿔 양 끝을 맞바꾸므로 글자 단위로 완전히 뒤집혀 'oG 녕안'이 됩니다. 바이트 단위로 뒤집었다면 한글이 깨졌을 것입니다.","an":"2일차 §5.7 Step 3–5","src":"### Step 3. `stringx/stringx.go`\n\n```go\npackage stringx\n\n// 문자열 뒤집기\nfunc Reverse(s string) string {\n r := []rune(s)\n for i, j := 0, len(r)-1; i < j; i, j = i+1, j-1 {\n r[i], r[j] = r[j], r[i]\n }\n return string(r)\n}\n```"},{"id":"t6-06","ty":"ox","lv":2,"game":true,"p":"한 디렉터리 안의 .go 파일들은 서로 다른 package 이름을 선언할 수 있다.","a":false,"h":"교안은 '한 디렉터리 = 한 패키지'를 절대적인 규칙으로 소개합니다. greeter/ 디렉터리의 english.go와 korean.go는 모두 같은 package greeter 선언을 공유합니다.","w":"틀렸습니다. 한 디렉터리 = 한 패키지 규칙은 절대적입니다. greeter/ 안의 english.go와 korean.go는 모두 <code>package greeter<\/code>를 선언합니다.","an":"2일차 §5.1 패키지란?","src":"**한 디렉터리 = 한 패키지** — 이 규칙은 절대적입니다.\n\n```\nmyapp/\n├── go.mod\n├── main.go ← package main\n└── greeter/\n ├── english.go ← package greeter\n └── korean.go ← package greeter\n```\n\n`greeter/` 디렉터리 안의 모든 `.go` 파일은 같은 `package greeter` 선언을 공유합니다."},{"id":"t6-07","ty":"ox","lv":1,"game":true,"p":"<code>init()<\/code> 함수는 인자도 반환값도 없고, 한 패키지에 여러 개 둘 수 있다.","a":true,"h":"init()은 C의 __attribute__((constructor))처럼 main 전에 패키지가 import될 때 자동 호출됩니다. 교안은 파일별로 따로 둘 수 있다는 점과 함수 시그니처의 특징(인자·반환값)을 함께 정리합니다.","w":"맞습니다. init()은 패키지가 import될 때 자동 호출되며 파일별로 여러 개 둘 수 있습니다. 다만 디버깅이 어려워 NewClient() 같은 명시적 초기화가 권장됩니다.","an":"2일차 §5.5 init 함수","src":"- 패키지가 import될 때 **자동 호출**\n- 한 패키지에 여러 `init()` 가능 (파일별로 따로 둘 수 있음)\n- 인자도 반환값도 없음"},{"id":"t6-08","ty":"match","lv":1,"game":false,"p":"추천 디렉터리와 역할을 연결하세요.","pairs":[["cmd/","실행 가능한 프로그램 진입점"],["internal/","이 프로젝트 전용 코드"],["pkg/","다른 프로젝트가 가져다 쓸 라이브러리"]],"h":"중간 규모 프로젝트 구조에서 cmd/ 아래에는 main.go 같은 실행 진입점이, internal/에는 이 프로젝트 전용 코드가, pkg/에는 외부에서 import 가능한 라이브러리가 들어갑니다. 이는 강제 규칙이 아닌 커뮤니티 컨벤션입니다.","w":"cmd/에는 main 진입점, internal/에는 프로젝트 전용 코드, pkg/에는 외부에서 import 가능한 라이브러리를 둡니다. 강제 규칙이 아니라 커뮤니티 컨벤션입니다.","an":"2일차 §5.6 추천 디렉터리 구조","src":"중간 규모:\n```\nmyapp/\n├── go.mod\n├── cmd/\n│ └── myapp/\n│ └── main.go ← 실행 진입점\n├── internal/\n│ ├── config/\n│ └── server/\n└── pkg/ ← 외부에서 import 가능한 라이브러리\n └── client/\n```\n\n- `cmd/`: 실행 가능한 프로그램들 (여러 개 가능)\n- `internal/`: 이 프로젝트 전용\n- `pkg/`: 다른 프로젝트가 가져다 쓸 수 있는 부분"},{"id":"t6-09","ty":"order","lv":2,"game":false,"p":"다중 패키지 미니 프로젝트(multipkg) 실습 단계를 순서대로 배열하세요.","steps":["go mod init으로 모듈 생성","mathx·stringx 디렉터리 만들기","mathx.go·stringx.go 작성","main.go에서 두 패키지 import","go run main.go 실행"],"h":"multipkg 실습은 Step 1에서 go mod init과 mathx·stringx 디렉터리를 만들고, Step 2~3에서 각 패키지 파일을 작성합니다. 그 다음 main.go에서 두 패키지를 import해 go run으로 실행합니다.","w":"모듈과 디렉터리를 먼저 만들고, 각 패키지를 작성한 뒤 main.go에서 '모듈경로/mathx'처럼 import해 실행합니다.","an":"2일차 §5.7 Step 1–5","src":"### Step 1. 구조 만들기\n\n```bash\nmkdir -p ~/go-class/day2/multipkg\ncd ~/go-class/day2/multipkg\ngo mod init github.com/myname/multipkg\n\nmkdir -p mathx\nmkdir -p stringx\n```"},{"id":"t6-10","ty":"multi","lv":2,"game":true,"p":"C와 비교한 Go 가시성 제어의 특징을 모두 고르세요.","o":["이름 대소문자로 제어","패키지(디렉터리) 단위","헤더 분리 불필요","static·extern 키워드 사용","파일 단위로 제어"],"a":[0,1,2],"h":"교안의 C vs Go 표에서 C는 static·extern 키워드, 파일 단위, .h 헤더 필요가 특징입니다. Go는 반대로 이름 대소문자로 제어하고, 패키지(디렉터리) 단위이며, 헤더 분리가 필요 없습니다.","w":"Go는 식별자 대소문자로, 패키지(디렉터리) 단위로 제어하며 헤더 파일이 필요 없습니다. static·extern 키워드와 파일 단위 제어는 C의 방식입니다.","an":"2일차 §5.2 C vs Go 표","src":"| 측면 | C | Go |\n|---|---|---|\n| 제어 방식 | `static`, `extern` 키워드 | 이름 대소문자 |\n| 단위 | 파일 단위 | 패키지(디렉터리) 단위 |\n| 헤더 분리 | 필요 (`.h`) | 불필요 |\n| 명시성 | 코드에 키워드 | 식별자에 내장 |"}]},{"id":"t7","title":"빌드 I · build·install·크로스","ref":"2일차 §6","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"<code>go install<\/code>이 빌드 결과를 설치하는 위치는?","o":["$GOPATH/bin","/usr/local/bin","$GOCACHE","./bin"],"a":0,"h":"go install은 빌드 결과를 GOPATH 아래의 bin 디렉터리(~/go/bin)에 설치합니다. 시스템 디렉터리가 아닌 사용자 디렉터리라 sudo가 필요 없고, PATH에 그 경로가 있으면 어디서든 실행됩니다.","w":"go install은 결과를 <code>$GOPATH/bin<\/code>(~/go/bin)에 설치합니다. 시스템 디렉터리가 아니라 sudo가 필요 없습니다. $GOCACHE는 빌드 캐시입니다.","an":"2일차 §6.4 go install","src":"## 6.4 `go install`\n\n```bash\ngo install\n```\n\n- 빌드 결과를 **`$GOPATH/bin`**에 설치 (`~/go/bin`)\n- PATH에 `$GOPATH/bin`이 있으면 어디서든 실행 가능\n\n```bash\nwhich multipkg"},{"id":"t7-02","ty":"mc","lv":1,"game":true,"p":"크로스 컴파일에서 대상 운영체제를 지정하는 환경 변수는?","o":["GOARCH","GOOS","GOARM","GOPATH"],"a":1,"h":"Go 크로스 컴파일은 환경 변수 두 개로 대상 플랫폼을 지정합니다. 하나는 아키텍처(GOARCH=amd64, arm64 등)이고, 다른 하나는 운영체제(linux, darwin, windows)를 지정하며 이름에 OS가 들어 있습니다.","w":"<code>GOOS<\/code>는 대상 OS(linux·windows·darwin), <code>GOARCH<\/code>는 아키텍처(amd64·arm64), <code>GOARM<\/code>은 ARM 버전입니다.","an":"2일차 §6.6 크로스 컴파일","src":".PHONY: build-linux\nbuild-linux:\n GOOS=linux GOARCH=amd64 go build $(LDFLAGS) -o bin/$(BINARY)-linux-amd64 ./cmd/$(BINARY)"},{"id":"t7-03","ty":"mc","lv":2,"game":true,"p":"<code>go build -ldflags=\"-s -w\"<\/code>의 효과는?","o":["완전 정적 링크","버전 정보 주입","심볼·디버그 정보 제거","경쟁 상태 검사"],"a":2,"h":"-ldflags로 링커에 넘기는 -s는 심볼 테이블 제거, -w는 DWARF 디버그 정보 제거입니다. 교안은 이렇게 하면 바이너리 크기가 30~40% 줄지만 스택 트레이스에서 라인 정보가 사라진다고 설명합니다.","w":"-s는 심볼 테이블, -w는 DWARF 디버그 정보를 제거해 크기가 30~40% 줄어듭니다. 대신 stack trace에 라인 정보가 사라집니다. 버전 주입은 -X입니다.","an":"2일차 §6.5 디버그 정보 제거","src":"# -w: DWARF 디버그 정보 제거\n```\n\n크기가 30~40% 줄어듭니다. 다만 stack trace 시 함수명만 남고 라인 정보는 사라집니다."},{"id":"t7-04","ty":"mc","lv":3,"game":false,"p":"main.go에 <code>Version = \"dev\"<\/code>, <code>BuildTime = \"unknown\"<\/code>이 있고 <code>fmt.Printf(\"v%s built at %s\\n\", Version, BuildTime)<\/code>를 출력합니다. <code>go build -ldflags=\"-X 'main.Version=1.0.0'\"<\/code>로만 빌드하면 출력은?","o":["vdev built at unknown","v1.0.0 built at dev","v1.0.0 built at 1.0.0","v1.0.0 built at unknown"],"a":3,"h":"-ldflags의 -X 'main.Version=1.0.0'은 링크 시점에 main 패키지의 Version 변수 값만 덮어씁니다. 덮어쓰지 않은 BuildTime은 소스에 적힌 초기값을 그대로 유지한 채 Printf 형식에 들어갑니다.","w":"-X는 지정한 패키지 변수만 바꾸므로 Version은 1.0.0, BuildTime은 기본값 unknown이 남습니다. C에서 -D 매크로로 하던 일을 링크 단계에서 합니다.","an":"2일차 §6.5 버전 정보 주입","src":"### 버전 정보 주입\n\n```go\n// main.go\npackage main\n\nvar (\n Version = \"dev\"\n BuildTime = \"unknown\"\n)\n\nfunc main() {\n fmt.Printf(\"v%s built at %s\\n\", Version, BuildTime)\n}\n```\n\n```bash\ngo build -ldflags=\"-X 'main.Version=1.0.0' -X 'main.BuildTime=$(date)'\" -o myapp\n./myapp"},{"id":"t7-05","ty":"mc","lv":2,"game":true,"p":"교안이 든 'Go 컴파일이 빠른 이유'가 <b>아닌<\/b> 것은?","o":["헤더 파일이 없음","헤더를 매번 재처리","단일 패스 컴파일러","링커 빌트인"],"a":1,"h":"교안은 Go 컴파일이 빠른 이유로 헤더 파일이 없어 텍스트 인클루드를 재처리하지 않음, 패키지 단위 컴파일과 캐싱, 단일 패스 컴파일러, 내장 링커를 듭니다. 보기 중 C/C++이 느린 원인에 해당하는 것을 찾으세요.","w":"Go는 헤더 파일이 없어 텍스트 인클루드를 재처리할 필요가 없습니다. 그 밖에 패키지 단위 캐싱, 단일 패스 컴파일러, 내장 링커가 이유입니다.","an":"2일차 §6.2 Go의 컴파일은 왜 빠른가?","src":"## 6.2 Go의 컴파일은 왜 빠른가?\n\nGo의 빌드 시간이 C/C++에 비해 매우 빠른 이유:\n\n1. **헤더 파일 없음** — 텍스트 인클루드를 재처리할 필요 없음\n2. **의존성 그래프 단순** — 패키지 단위로 한 번만 컴파일, 결과 캐싱\n3. **단일 패스 컴파일러** — 전방 선언이 필요 없는 설계\n4. **링커 빌트인** — 외부 ld 호출 없음\n\nGoogle 사내에서 \"C++로 1시간 걸리던 빌드가 Go로 1분\"이라는 일화가 자주 언급됩니다."},{"id":"t7-06","ty":"ox","lv":2,"game":false,"p":"<code>CGO_ENABLED=0 go build<\/code>로 만든 바이너리는 ldd 결과가 'not a dynamic executable'인 완전 정적 실행 파일이다.","a":true,"h":"CGO_ENABLED=0으로 CGO를 끄면 완전 정적 링크 바이너리가 만들어집니다. 교안은 ldd 결과가 '완전 독립 실행 파일'로 나오며, 그래서 FROM scratch 빈 Docker 이미지에서 시작할 수 있다고 설명합니다.","w":"맞습니다. CGO를 끄면 완전 정적 링크가 되어 외부 .so 없이 실행됩니다. 그래서 빈 베이스 이미지(FROM scratch)로 시작할 수 있습니다.","an":"2일차 §6.5 정적 링크 / 동적 링크 제어","src":"# not a dynamic executable ← 완전 독립 실행 파일\n```\n\nLinux Docker 이미지에서 `FROM scratch`(빈 베이스)로 시작할 수 있는 이유입니다."},{"id":"t7-07","ty":"ox","lv":2,"game":true,"p":"Go로 Linux ARM64용 바이너리를 만들려면 별도의 크로스 툴체인을 먼저 설치해야 한다.","a":false,"h":"Go는 GOOS·GOARCH 환경 변수만 바꿔 go build 한 줄로 다른 플랫폼용 바이너리를 만듭니다. 교안은 C에서 ARM 크로스 컴파일 환경을 세팅하던 고통과 비교하며 툴체인 추가 설치가 필요 없다고 강조합니다.","w":"틀렸습니다. Go는 툴체인 추가 설치 없이 환경 변수만으로 크로스 컴파일합니다. C에서 ARM 크로스 컴파일 환경을 세팅하던 일과 대비됩니다.","an":"2일차 §6.6 크로스 컴파일","src":"GOOS=linux GOARCH=arm GOARM=7 go build -o myapp-rpi\n```\n\n**툴체인 추가 설치 없이** 한 줄로 됩니다. C에서 ARM 크로스 컴파일 환경을 세팅하던 고통과 비교해보세요."},{"id":"t7-08","ty":"match","lv":1,"game":false,"p":"빌드 관련 명령과 의미를 연결하세요.","pairs":[["go build -o myapp","출력 파일 이름 지정"],["go build -v ./...","컴파일되는 패키지 목록 표시"],["go build -x ./...","내부 실행 명령까지 표시"],["go tool dist list","지원 OS/아키텍처 조합 목록"],["go clean -cache","빌드 캐시 모두 삭제"]],"h":"-o는 출력 파일 이름, -v는 컴파일되는 패키지 목록, -x는 내부에서 실행되는 명령까지 보여 줍니다. go tool dist list는 지원되는 OS/아키텍처 조합을, go clean -cache는 빌드 캐시를 비웁니다.","w":"-o는 출력 이름, -v는 패키지 목록, -x는 내부 명령까지 보여 줍니다. go tool dist list는 크로스 컴파일 조합, go clean -cache는 GOCACHE를 비웁니다.","an":"2일차 §6.3 · §6.6 · §6.7","src":"### 상세 출력\n\n```bash\ngo build -v ./... # 컴파일되는 패키지 목록 표시\ngo build -x ./... # 내부에서 실행되는 명령어까지 표시\n```"},{"id":"t7-09","ty":"order","lv":1,"game":false,"p":"C 프로그램 빌드의 4단계를 순서대로 배열하세요.","steps":["전처리(preprocess) → main.i","컴파일(compile) → main.s","어셈블(assemble) → main.o","링크(link) → 실행 파일"],"h":"C 빌드는 main.c → preprocess → main.i → compile → main.s(어셈블리) → assemble → main.o(오브젝트) → link → 실행 파일 순서입니다. 확장자가 .i, .s, .o로 바뀌는 흐름을 따라가세요.","w":"C는 전처리 → 컴파일(어셈블리) → 어셈블(오브젝트) → 링크를 거칩니다. Go는 이를 go build 한 명령으로 처리하고 링커도 내장합니다.","an":"2일차 §6.1 C의 컴파일 과정 복습","src":"C 프로그램 하나를 빌드하려면 보통 4단계를 거칩니다.\n\n```text\n[main.c] → preprocess → [main.i]\n ↓\n compile\n ↓\n [main.s] (어셈블리)\n ↓\n assemble\n ↓\n [main.o] (오브젝트)\n ↓\n link ← stdlib.o, libcurl.so, ...\n ↓\n [main] (실행 파일)"},{"id":"t7-10","ty":"multi","lv":3,"game":true,"p":"Raspberry Pi(ARM7)용 바이너리를 만들 때 설정하는 환경 변수를 모두 고르세요.","o":["GOOS=linux","GOARCH=arm","GOARM=7","GOARCH=arm64","GOOS=darwin"],"a":[0,1,2],"h":"Raspberry Pi(ARM7)용 빌드는 운영체제를 linux로, 아키텍처를 32비트 arm으로 지정하고, ARM 버전을 나타내는 환경 변수 하나를 더 붙여 7로 설정합니다. 세 변수를 go build 앞에 나란히 적습니다.","w":"교안 예시는 <code>GOOS=linux GOARCH=arm GOARM=7 go build<\/code>입니다. arm64는 Linux ARM64용, darwin은 macOS용입니다.","an":"2일차 §6.6 Raspberry Pi (ARM7)","src":"# Raspberry Pi (ARM7)\nGOOS=linux GOARCH=arm GOARM=7 go build -o myapp-rpi\n```\n\n**툴체인 추가 설치 없이** 한 줄로 됩니다. C에서 ARM 크로스 컴파일 환경을 세팅하던 고통과 비교해보세요.\n\n지원되는 조합 목록:\n```bash\ngo tool dist list"}]},{"id":"t8","title":"빌드 II · Makefile·calc 실습","ref":"2일차 §7–8 · 2일차 솔루션 도전①②","qs":[{"id":"t8-01","ty":"mc","lv":1,"game":true,"p":"Makefile에서 타깃을 <code>.PHONY<\/code>로 선언하는 이유는?","o":["같은 이름 파일이 있어도 실행","명령어 출력을 숨김","변수를 즉시 평가","병렬 빌드 활성화"],"a":0,"h":"make는 타깃 이름과 같은 파일이 이미 있으면 '최신'으로 보고 레시피를 건너뜁니다. .PHONY로 선언한 타깃은 실제 파일이 아니라고 알려 주므로, C에서 make clean이 clean 파일 때문에 멈추지 않게 하던 것과 같은 이유로 씁니다.","w":".PHONY로 선언하면 같은 이름의 파일이 있어도 항상 실행됩니다. 명령어 출력 숨김은 @, 즉시 평가는 :=의 역할입니다.","an":"2일차 §7.4 .PHONY의 중요성","src":"### `.PHONY`의 중요성\n\n```makefile\n.PHONY: build\nbuild:\n go build ...\n```\n\n`.PHONY`로 선언하면 **같은 이름의 파일이 있어도 항상 실행**됩니다. C Makefile에서도 `make clean`이 동작하려면 `clean`을 PHONY로 지정하던 것과 같은 이유입니다."},{"id":"t8-02","ty":"mc","lv":1,"game":true,"p":"Makefile 레시피 줄 앞에 붙여 명령어 자체가 출력되지 않게 하는 접두사는?","o":["#","@","$","."],"a":1,"h":"Makefile은 기본적으로 레시피의 각 명령을 실행 전에 화면에 찍습니다. 교안은 줄 맨 앞에 특정 기호 하나를 붙이면 명령어 자체가 출력되지 않아 로그가 깔끔해진다고 설명하며, help 타깃의 echo 줄마다 이 기호가 붙어 있습니다.","w":"<code>@<\/code>가 붙은 줄은 명령어 자체가 출력되지 않아 로그가 깔끔해집니다. #은 주석, $는 변수 참조입니다.","an":"2일차 §7.4 @ 접두사","src":"### `@` 접두사로 명령어 출력 숨기기\n\n```makefile\nfmt:\n @echo \"포맷팅 중...\"\n go fmt ./...\n```\n\n`@`가 붙은 줄은 명령어 자체가 출력되지 않습니다. 깔끔한 로그를 위해 유용합니다."},{"id":"t8-03","ty":"mc","lv":2,"game":true,"p":"<code>VERSION := $(shell git describe --tags)<\/code>에서 <code>:=<\/code>의 의미는?","o":["매번 평가(느림)","조건부 대입","즉시 평가(한 번만)","환경 변수로 내보내기"],"a":2,"h":"Makefile 변수 대입에는 =와 :=가 있습니다. 교안 주석에 따르면 =는 변수를 쓸 때마다 매번 평가해 shell 명령이 반복 실행되어 느리고, :=는 정의 시점에 평가가 끝나 Go Makefile에서 주로 씁니다.","w":":=는 즉시 한 번만 평가하고, =는 참조할 때마다 다시 평가해 느립니다. 그래서 Go Makefile에서는 보통 :=를 씁니다.","an":"2일차 §7.4 변수 평가 시점","src":"### 변수 평가 시점\n\n```makefile\nVERSION := $(shell git describe --tags) # := 즉시 평가 (한 번만)\nVERSION = $(shell git describe --tags) # = 매번 평가 (느림)\n```\n\nGo Makefile에서는 보통 `:=`를 씁니다."},{"id":"t8-04","ty":"mc","lv":3,"game":false,"p":"calc의 <code>Calculate<\/code>는 b == 0이면 <code>fmt.Errorf(\"a=%v, b=%v: %w\", a, b, ErrDivByZero)<\/code>를 반환하고, main은 <code>errors.Is(err, calculator.ErrDivByZero)<\/code>로 분기합니다. <code>./bin/calc div 10 0<\/code>의 출력은?","o":["10 ÷ 0 = +Inf","panic: integer divide by zero","에러: 지원하지 않는 연산","0으로 나눌 수 없습니다"],"a":3,"h":"Calculate는 b가 0이면 ErrDivByZero를 %w로 감싸 반환하므로 errors.Is가 사슬에서 sentinel을 찾아냅니다. main의 해당 분기는 errors.New에 넣었던 ErrDivByZero의 메시지를 출력합니다.","w":"ErrDivByZero가 %w로 래핑되어 main의 <code>errors.Is<\/code>가 true가 되므로 '0으로 나눌 수 없습니다' 메시지를 stderr에 출력하고 종료합니다. 0 나눗셈 전에 미리 검사하므로 +Inf나 panic은 나오지 않습니다.","an":"2일차 §8.5 calculator.go · §8.7 main.go · §8.9 실행","src":"// ErrDivByZero는 0으로 나눌 때 반환된다\nvar ErrDivByZero = errors.New(\"0으로 나눌 수 없습니다\")\n\n// Calculate는 연산자와 두 피연산자를 받아 결과를 반환한다\nfunc Calculate(op string, a, b float64) (float64, error) {\n switch op {\n case \"add\""},{"id":"t8-05","ty":"mc","lv":3,"game":true,"p":"도전① calc에 float64 피연산자용 mod(나머지) 연산을 추가할 때 솔루션이 사용한 것은?","o":["a % b 연산자","math.Mod(a, b)","strconv.ParseFloat","fmt.Sprintf"],"a":1,"h":"도전①은 float64 피연산자의 나머지를 구해야 하는데, Go의 % 연산자는 정수에만 쓸 수 있습니다. 그래서 솔루션은 import에 math 패키지를 추가하고, IEEE 754 규칙(피제수 부호를 따름)을 따르는 그 패키지의 함수를 씁니다.","w":"솔루션은 import에 math를 추가하고 <code>math.Mod(a, b)<\/code>를 반환합니다. math.Mod는 IEEE 754 규칙을 따라 피제수 부호를 따르므로 -7 mod 3은 -1입니다.","an":"2일차 솔루션 도전① mod 연산 추가","src":"## 테스트 추가\n\n```go\n{\"mod\", \"mod\", 10, 3, 1}, // 10 % 3 = 1\n{\"mod 음수\", \"mod\", -7, 3, -1}, // -7 % 3 = -1 (Go의 부호 규칙)\n```\n\n`math.Mod`는 IEEE 754 표준 규칙을 따릅니다 (피제수 부호 따라감)."},{"id":"t8-06","ty":"ox","lv":2,"game":true,"p":"Go Makefile에도 C처럼 소스 파일 간 의존성(.h 파일 등)을 일일이 적어야 한다.","a":false,"h":"C Makefile은 main.o: main.c util.h처럼 소스와 헤더 간 의존성을 일일이 적어야 했습니다. 교안은 Go 컴파일러가 의존성을 알아서 처리하므로 Go Makefile이 훨씬 단순하다고 설명합니다.","w":"틀렸습니다. Go 컴파일러가 의존성을 알아서 처리하므로 Go Makefile은 빌드·테스트·배포 자동화에 집중하고 훨씬 단순합니다.","an":"2일차 §7.2 · §7.6 C Makefile과의 차이","src":"Go에서는 **소스 파일 간 의존성을 Make에 적을 필요가 없습니다.** Go 컴파일러가 알아서 합니다. 그래서 Go Makefile은 훨씬 단순합니다."},{"id":"t8-07","ty":"ox","lv":1,"game":true,"p":"이름이 <code>_test.go<\/code>로 끝나는 파일은 별도 빌드 설정 없이 <code>go test<\/code>가 자동으로 인식한다.","a":true,"h":"calc 실습에서 parser_test.go를 만든 뒤 별도 설정 없이 go test ./pkg/parser를 실행해 ok가 나왔습니다. 교안은 파일 이름 규칙(_test.go)만으로 Go가 테스트 파일을 자동 인식한다고 설명합니다.","w":"맞습니다. _test.go 파일은 자동 인식되어 go test로 실행됩니다. calculator_test.go의 t.Run 표 형식은 테이블 드리븐 테스트 패턴입니다.","an":"2일차 §8.4 parser_test.go","src":"# ok github.com/myname/calc/pkg/parser 0.002s\n```\n\n> `_test.go` 파일은 Go에서 **자동 인식**됩니다. 별도 빌드 설정 없이 `go test`로 실행됩니다."},{"id":"t8-08","ty":"match","lv":2,"game":false,"p":"calc 프로젝트의 구성 요소와 역할을 연결하세요.","pairs":[["cmd/calc","main 진입점, 두 패키지 조합"],["internal/calculator","핵심 연산 로직(외부 import 불가)"],["pkg/parser","명령줄 인자 파싱"],["Makefile","빌드·테스트·설치 자동화"]],"h":"calc 요구사항은 cmd/calc, internal/calculator, pkg/parser 세 패키지와 Makefile로 구성됩니다. 외부 모듈이 쓰면 안 되는 핵심 연산은 internal/에, 인자 파싱은 pkg/에, 두 패키지를 조합하는 main은 cmd/에 둡니다.","w":"cmd/calc는 진입점, internal/calculator는 외부에서 쓰지 못하게 숨긴 연산 로직, pkg/parser는 공개 가능한 파서입니다. Makefile은 fmt·vet·test·build·install을 묶습니다.","an":"2일차 §8.1–8.8","src":"## 8.1 요구사항\n\n- 명령: `calc add 3 5`, `calc mul 4 7`, `calc div 10 3`\n- 지원 연산: add, sub, mul, div\n- 에러 처리: 0으로 나누기, 잘못된 인자 개수, 숫자 파싱 실패\n- 멀티 패키지: `cmd/calc`, `internal/calculator`, `pkg/parser`\n- Makefile로 빌드 / 테스트 / 설치"},{"id":"t8-09","ty":"order","lv":1,"game":false,"p":"calc 프로젝트의 <code>make all<\/code>이 실행하는 타깃을 순서대로 배열하세요.","steps":["fmt (코드 포맷)","vet (정적 분석)","test (테스트 실행)","build (바이너리 빌드)"],"h":"calc Makefile의 all 타깃은 의존 타깃 네 개를 적힌 순서대로 실행합니다. 코드를 다듬고(go fmt), 정적 분석으로 검사하고(go vet), 테스트를 돌린 뒤, 마지막에 바이너리를 만듭니다.","w":"Makefile의 <code>all: fmt vet test build<\/code> 순서입니다. 8.9절 실습도 make fmt → make vet → make test → make build 순으로 진행합니다.","an":"2일차 §8.8 Makefile · §8.9 빌드 및 테스트","src":"## Step 5 — Makefile\n\n```makefile\nBINARY := textutil\n\n.PHONY: all build test fmt vet clean run\n\nall: fmt vet test build\n\nbuild:\n go build -o bin/$(BINARY) ./cmd/$(BINARY)\n\ntest:\n go test -race ./...\n\nfmt:\n go fmt ./...\n\nvet:\n go vet ./...\n\nrun: build\n ./bin/$(BINARY) cmd/textutil/main.go\n\nclean:\n rm -rf bin/\n```"},{"id":"t8-10","ty":"multi","lv":2,"game":true,"p":"도전②(계산 이력 저장) 솔루션에서 사용한 API를 모두 고르세요.","o":["os.Getenv","os.UserHomeDir","filepath.Join","os.O_APPEND","regexp.MustCompile"],"a":[0,1,2,3],"h":"도전② 학습 포인트 표는 CALC_HISTORY 환경 변수 읽기, 홈 디렉터리 얻기, 경로 조합, 파일을 추가 모드로 여는 플래그를 정리합니다. 시간 포맷은 time 패키지의 Format을 씁니다.","w":"CALC_HISTORY는 os.Getenv로 읽고, os.UserHomeDir와 filepath.Join으로 ~/.calc-history 경로를 만들고, os.O_APPEND|O_CREATE|O_WRONLY로 엽니다. regexp.MustCompile은 panic 가이드라인의 예입니다.","an":"2일차 솔루션 도전② 학습 포인트 표","src":"| 기능 | API |\n|---|---|\n| 환경 변수 읽기 | `os.Getenv` |\n| 홈 디렉터리 | `os.UserHomeDir()` |\n| 경로 조합 | `filepath.Join` |\n| 파일 추가 모드 | `os.O_APPEND \\| os.O_CREATE \\| os.O_WRONLY` |\n| 시간 포맷"}]},{"id":"t9","title":"Cobra로 CLI 만들기","ref":"Cobra 가이드 §1–18 · 2일차 솔루션 도전③","qs":[{"id":"t9-01","ty":"mc","lv":1,"game":true,"p":"Cobra에서 서브커맨드를 루트 명령 아래에 등록하는 메서드는?","o":["AddCommand","Execute","Flags","ExactArgs"],"a":0,"h":"Cobra에서 helloCmd 같은 서브커맨드는 cmd/hello.go의 init() 안에서 rootCmd의 메서드로 등록됩니다. 교안은 그 의미를 'rootCmd 아래에 helloCmd를 등록한다'고 설명하며, 메서드 이름은 '명령을 더한다'는 뜻입니다.","w":"<code>rootCmd.AddCommand(helloCmd)<\/code>로 등록합니다. 보통 각 명령 파일의 <code>init()<\/code>에서 호출합니다. Execute는 CLI를 실행합니다.","an":"Cobra 가이드 §6 hello 서브커맨드 추가","src":"중요한 부분:\n\n```go\nfunc init() {\n rootCmd.AddCommand(helloCmd)\n}\n```\n\n의미:\n\n```text\nrootCmd 아래에 helloCmd를 등록한다\n```"},{"id":"t9-02","ty":"mc","lv":1,"game":true,"p":"<code>cobra.Command<\/code>에서 help 목록에 나오는 짧은 설명을 넣는 필드는?","o":["Use","Long","Short","Run"],"a":2,"h":"cobra.Command 표에서 Use는 명령어 이름, Long은 자세한 설명, Run은 실행할 코드입니다. help 목록에 한 줄로 나오는 짧은 설명은 Long의 반대말 이름을 가진 필드에 넣습니다.","w":"Use는 명령어 이름, Short는 짧은 설명, Long은 자세한 설명, Run은 실행할 코드입니다.","an":"Cobra 가이드 §5 Root Command 표","src":"| 항목 | 의미 |\n|---|---|\n| `Use` | 명령어 이름 |\n| `Short` | help에 나오는 짧은 설명 |\n| `Long` | 자세한 설명 |\n| `Run` | 명령어가 실행될 때 수행할 코드 |\n\n실행:\n\n```bash\ngo run .\n```\n\n출력:\n\n```text\nmycli 실행됨\n```\n\n도움말 확인:\n\n```bash\ngo run . --help\n```\n\n---"},{"id":"t9-03","ty":"mc","lv":2,"game":true,"p":"에러를 반환할 수 있는 실행 함수를 지정하는 필드는?","o":["Run","RunE","Use","Long"],"a":1,"h":"add 명령은 strconv.Atoi 실패 시 에러를 돌려줘야 해서 Run 대신 다른 필드를 썼습니다. 교안 표에 따르면 Run은 에러를 반환하지 않는 실행 함수이고, 에러를 반환할 수 있는 쪽은 Run 뒤에 Error의 첫 글자가 붙습니다.","w":"<code>RunE<\/code>는 <code>func(cmd, args) error<\/code> 형태로 에러를 반환합니다. 숫자 파싱처럼 실패할 수 있는 add 명령에 적합합니다. Run은 에러를 반환하지 않습니다.","an":"Cobra 가이드 §8 add 명령 — Run vs RunE","src":"여기서는 `Run` 대신 `RunE`를 사용했습니다.\n| 항목 | 의미 |\n|---|---|\n| `Run` | 에러를 반환하지 않는 실행 함수 |\n| `RunE` | 에러를 반환할 수 있는 실행 함수 |\n에러 처리가 필요한 명령은 `RunE`를 쓰면 좋습니다.\n실행:\n```bash\ngo run . add 10 20\n```\n출력:\n```text\n30\n```\n잘못된 값 입력:\n```bash\ngo run . add 10 abc\n```\n출력 예:"},{"id":"t9-04","ty":"mc","lv":2,"game":true,"p":"모든 명령에서 공통으로 쓰는 --verbose 같은 전역 옵션을 만들 때 쓰는 것은?","o":["Flags()","ExactArgs()","AddCommand()","PersistentFlags()"],"a":3,"h":"Flags()는 특정 명령 전용 옵션을 만들고, 모든 명령에서 공통으로 쓰는 전역 옵션은 하위 명령까지 '계속 유지되는(persistent)' 플래그로 만듭니다. 교안은 --verbose 예제로 이를 보여 줍니다.","w":"<code>rootCmd.PersistentFlags()<\/code>로 만든 옵션은 모든 서브커맨드에서 쓸 수 있습니다. <code>Flags()<\/code>는 특정 명령 전용 옵션입니다.","an":"Cobra 가이드 §10 전역 Flag 만들기","src":"5. `Flags()`로 특정 명령 전용 옵션을 만든다.\n6. `PersistentFlags()`로 모든 명령에서 쓰는 전역 옵션을 만든다."},{"id":"t9-05","ty":"mc","lv":3,"game":false,"p":"helloCmd에 <code>Args: cobra.ExactArgs(1)<\/code>과 <code>BoolVarP(&upper, \"upper\", \"u\", false, ...)<\/code>가 있고 upper면 이름을 <code>strings.ToUpper<\/code>로 바꿉니다. <code>go run . hello gopher -u<\/code>의 출력은?","o":["Hello, gopher","Hello, GOPHER","HELLO, GOPHER","인자 개수 에러"],"a":1,"h":"ExactArgs(1)이라 gopher가 name으로 들어가고, -u는 --upper의 짧은 이름이라 upper가 true가 됩니다. 그러면 name만 strings.ToUpper로 바뀌고 fmt.Println(\"Hello,\", name)이 쉼표 뒤 공백을 두고 출력합니다.","w":"-u가 upper를 true로 만들어 name만 대문자가 되므로 'Hello, GOPHER'가 출력됩니다. 인자는 정확히 1개라 ExactArgs(1)도 통과합니다.","an":"Cobra 가이드 §9 Flag 사용하기","src":"var upper bool\nvar helloCmd = &cobra.Command{\n Use: \"hello [name]\",\n Short: \"인사 메시지를 출력합니다\",\n Args: cobra.ExactArgs(1),\n Run: func(cmd *cobra.Command, args []string) {\n name := args[0]\n if upper {\n name = strings.ToUpper(name)\n }\n fmt.Println(\"Hello,\", name)\n },\n}\nfunc init() {\n rootCmd.AddCommand(helloCmd)\n helloCmd.Flags().BoolVarP(\n &upper,\n \"upper\",\n \"u\",\n false,\n \"이름을 대문자로 출력합니다\",\n )\n}"},{"id":"t9-06","ty":"ox","lv":2,"game":false,"p":"도전③ calc의 연산 명령은 <code>Args: cobra.ExactArgs(2)<\/code>이므로 <code>calc add 3<\/code>처럼 인자 1개만 주면 Cobra가 인자 개수 에러를 낸다.","a":true,"h":"Args: cobra.ExactArgs(n)은 인자를 정확히 n개 받아야 한다는 뜻입니다. 교안은 hello 명령을 인자 없이 실행하면 Cobra가 인자 개수가 맞지 않는다는 에러를 출력한다고 설명하며, 같은 규칙이 2개를 요구하는 연산 명령에도 적용됩니다.","w":"맞습니다. ExactArgs(n)은 인자 개수를 검사해 맞지 않으면 실행 함수까지 가지 않고 에러를 냅니다. 직접 len(os.Args)를 검사하던 코드가 필요 없어집니다.","an":"Cobra 가이드 §7 · 2일차 솔루션 도전③","src":"추가된 부분:\n\n```go\nArgs: cobra.ExactArgs(1),\n```\n\n의미:\n\n```text\n인자를 정확히 1개 받아야 한다\n```\n\n실행:\n\n```bash\ngo run . hello kim\n```\n\n출력:\n\n```text\nHello, kim\n```\n\n인자 없이 실행하면 Cobra가 인자 개수가 맞지 않는다는 에러를 출력합니다.\n\n```bash\ngo run . hello\n```\n\n---"},{"id":"t9-07","ty":"ox","lv":1,"game":true,"p":"Cobra로 만든 CLI는 --help 도움말 문구를 개발자가 직접 작성해야 한다.","a":false,"h":"Cobra 가이드의 학습 포인트는 마지막 단계로 go run . --help를 실행해 확인하는 것을 듭니다. 출력의 Available Commands 목록은 각 명령의 Use·Short 필드로부터 만들어지며, 교안은 이 도움말이 '자동 생성'된다고 설명합니다.","w":"틀렸습니다. Cobra는 Use·Short 정보로 도움말을 자동 생성하고 서브커맨드별 도움말도 제공합니다.","an":"Cobra 가이드 §13 도움말 · 2일차 솔루션 도전③ Cobra의 장점","src":"## 18. 학습 포인트\n\nCobra를 배울 때는 다음 순서로 이해하면 좋습니다.\n\n1. `rootCmd`가 전체 CLI의 시작점이다.\n2. `AddCommand()`로 서브커맨드를 붙인다.\n3. `Args`로 인자 개수를 검사한다.\n4. `Run` 또는 `RunE`에 실제 실행 코드를 작성한다.\n5. `Flags()`로 특정 명령 전용 옵션을 만든다.\n6. `PersistentFlags()`로 모든 명령에서 쓰는 전역 옵션을 만든다.\n7. `go run . --help`로 자동 생성된 도움말을 확인한다."},{"id":"t9-08","ty":"match","lv":1,"game":false,"p":"<code>helloCmd.Flags().BoolVarP(&upper, \"upper\", \"u\", false, \"설명\")<\/code>의 인자와 의미를 연결하세요.","pairs":[["&upper","옵션 값을 저장할 변수"],["'upper'","긴 옵션 이름 --upper"],["'u'","짧은 옵션 이름 -u"],["false","기본값"]],"h":"BoolVarP의 인자는 차례대로 값을 저장할 변수의 주소, 긴 옵션 이름(--upper), 짧은 옵션 이름(-u), 기본값, 설명입니다. 이름 끝의 P는 짧은 이름(shorthand)을 함께 받는다는 뜻입니다.","w":"BoolVarP는 값을 저장할 변수, 긴 이름, 짧은 이름(P = 짧은 옵션), 기본값, help 설명을 차례로 받습니다.","an":"Cobra 가이드 §9 BoolVarP 표","src":"핵심 부분:\n```go\nhelloCmd.Flags().BoolVarP(\n &upper,\n \"upper\",\n \"u\",\n false,\n \"이름을 대문자로 출력합니다\",\n)\n```\n| 값 | 의미 |\n|---|---|\n| `&upper` | 옵션 값을 저장할 변수 |\n| `\"upper\"` | 긴 옵션 이름 `--upper` |\n| `\"u\"` | 짧은 옵션 이름 `-u` |\n| `false` | 기본값 |\n| 설명 | help에 표시될 설명 |\n실행:"},{"id":"t9-09","ty":"order","lv":3,"game":false,"p":"Cobra 예제 CLI를 처음부터 만드는 순서로 배열하세요.","steps":["go mod init mycli","go get으로 Cobra 설치","cmd/root.go에 rootCmd와 Execute 작성","cmd/hello.go의 init()에서 AddCommand","go run . hello 실행"],"h":"Cobra 가이드는 go mod init으로 모듈을 만들고 go get으로 Cobra를 설치한 뒤, cmd/root.go에 rootCmd와 Execute를 작성합니다. 이어 cmd/hello.go의 init()에서 서브커맨드를 등록하고 go run . hello로 실행합니다.","w":"모듈을 만들고 Cobra를 설치한 뒤 루트 명령을 만들고, 서브커맨드를 init()에서 등록합니다. main.go는 cmd.Execute()만 호출합니다.","an":"Cobra 가이드 §3–6","src":"## 6. hello 서브커맨드 추가\n\n다음 명령을 만들겠습니다.\n\n```bash\ngo run . hello\n```\n\n`cmd/hello.go`\n\n```go\npackage cmd\n\nimport (\n \"fmt\"\n\n \"github.com/spf13/cobra\"\n)\n\nvar helloCmd = &cobra.Command{\n Use: \"hello\",\n Short: \"인사 메시지를 출력합니다\",\n Run: func(cmd *cobra.Command, args []string) {\n fmt.Println(\"Hello Cobra!\")\n },\n}\n\nfunc init() {\n rootCmd.AddCommand(helloCmd)\n}\n```\n\n중요한 부분:\n\n```go\nfunc init() {"},{"id":"t9-10","ty":"multi","lv":1,"game":true,"p":"Cobra 가이드가 '쉽게 만들 수 있게 돕는다'고 소개한 기능을 모두 고르세요.","o":["루트 명령어","서브커맨드","플래그 처리","도움말 자동 생성","크로스 컴파일"],"a":[0,1,2,3],"h":"Cobra 가이드 §1은 Cobra가 쉽게 만들 수 있게 돕는 기능으로 루트 명령어, 서브커맨드, 인자 처리, 플래그 처리, 도움말 자동 생성, 에러 처리를 나열합니다. 크로스 컴파일이나 바이너리 축소 같은 빌드 기능은 목록에 없습니다.","w":"Cobra는 루트 명령어, 서브커맨드, 인자·플래그 처리, 도움말 자동 생성, 에러 처리를 돕습니다. 크로스 컴파일은 GOOS·GOARCH로 go build가 담당합니다.","an":"Cobra 가이드 §1 Cobra란?","src":"Cobra는 다음 기능을 쉽게 만들 수 있게 도와줍니다.\n\n- 루트 명령어\n- 서브커맨드\n- 인자 처리\n- 플래그 처리\n- 도움말 자동 생성\n- 에러 처리\n\n---"}]},{"id":"t10","title":"벤치마크 테스트","ref":"벤치마크 실습 1–15단계 · 2일차 솔루션 도전④","qs":[{"id":"t10-01","ty":"mc","lv":1,"game":true,"p":"Go 벤치마크 함수 이름은 어떤 접두사로 시작해야 하나요?","o":["Benchmark","Test","Bench","Perf"],"a":0,"h":"Go 벤치마크 함수는 *testing.B를 인자로 받고, 이름이 정해진 접두사 뒤에 측정 대상 이름(Xxx)이 붙는 규칙을 따릅니다. 실습의 BenchmarkAdd, BenchmarkCalculate처럼 모두 같은 단어로 시작합니다.","w":"벤치마크 함수는 <code>func BenchmarkXxx(b *testing.B)<\/code> 형태입니다. Test 접두사는 *testing.T를 받는 일반 테스트입니다.","an":"벤치마크 실습 4단계 이름 규칙","src":"핵심 개념:\n\n| 개념 | 설명 |\n|---|---|\n| `BenchmarkXxx` | 벤치마크 함수 이름 규칙 |\n| `*testing.B` | 벤치마크용 객체 |\n| `b.N`"},{"id":"t10-02","ty":"mc","lv":1,"game":true,"p":"벤치마크 반복문 <code>for i := 0; i &lt; b.N; i++<\/code>에서 <code>b.N<\/code>은?","o":["CPU 코어 수","Go가 정하는 반복 횟수","측정 시간(초)","서브 벤치마크 개수"],"a":1,"h":"벤치마크 반복문의 b.N은 개발자가 정하는 값이 아닙니다. 실습 4단계는 이 값을 테스트 도구가 측정이 안정될 때까지 자동으로 정해 주는 반복 횟수라고 설명합니다.","w":"<code>b.N<\/code>은 Go가 자동으로 정하는 반복 횟수입니다. 결과의 1000000000 같은 숫자가 이 반복 횟수입니다.","an":"벤치마크 실습 4단계 · 15단계 핵심 개념","src":"핵심 반복문:\n\n```go\nfor i := 0; i < b.N; i++ {\n _ = Add(10, 20)\n}\n```\n\n`b.N`은 Go가 자동으로 정하는 반복 횟수입니다."},{"id":"t10-03","ty":"mc","lv":2,"game":true,"p":"반복문 전에 하는 준비 작업 시간을 측정에서 제외하려면 무엇을 호출하나요?","o":["b.Run()","b.N","b.ResetTimer()","t.Fatal()"],"a":2,"h":"9단계 예제는 op, a, c 같은 준비 변수를 만든 뒤 반복문 직전에 b의 메서드 하나를 호출합니다. 이 호출 이전의 준비 시간은 측정에서 제외되며, 이름은 타이머를 '초기화(reset)'한다는 뜻입니다.","w":"<code>b.ResetTimer()<\/code> 이전의 준비 시간은 측정에서 빠집니다. b.Run()은 서브 벤치마크를 실행합니다.","an":"벤치마크 실습 9단계 b.ResetTimer","src":"# 9단계. b.ResetTimer 사용하기\n\n준비 작업이 있는 경우 준비 시간은 측정에서 제외할 수 있습니다.\n\n```go\nfunc BenchmarkCalculateWithResetTimer(b *testing.B) {\n op := \"add\"\n a := 10\n c := 20\n\n b.ResetTimer()\n\n for i := 0; i < b.N; i++ {\n _, _ = Calculate(op, a, c)\n }\n}\n```\n\n`b.ResetTimer()` 의미:\n\n```text\n이 줄 이전의 준비 시간은 벤치마크 측정에서 제외한다.\n```\n\n---"},{"id":"t10-04","ty":"mc","lv":1,"game":true,"p":"일반 테스트는 건너뛰고 벤치마크만 실행하는 명령은?","o":["go test -v","go test -bench=.","go test -bench=Add","go test -run=^$ -bench=."],"a":3,"h":"-bench=.는 모든 벤치마크를 실행하지만 일반 테스트도 함께 돌립니다. 일반 테스트를 건너뛰려면 -run에 어떤 테스트 이름과도 맞지 않는 정규식(시작 직후 바로 끝)을 함께 넘깁니다.","w":"<code>-run=^$<\/code>는 빈 이름만 맞는 정규식이라 일반 테스트가 하나도 실행되지 않고, <code>-bench=.<\/code>로 모든 벤치마크만 돕니다.","an":"벤치마크 실습 11단계 · 13단계 명령 정리","src":"# 13단계. 실행 명령 정리\n\n| 명령 | 의미 |\n|---|---|\n| `go test` | 일반 테스트 실행 |\n| `go test -v` | 일반 테스트 자세히 보기 |\n| `go test -bench=.` | 모든 벤치마크 실행 |\n| `go test -bench=. -v` | 벤치마크 자세히 보기 |\n| `go test -bench=. -benchmem` | 메모리 할당 정보 포함 |\n| `go test -bench=BenchmarkAdd` | 특정 벤치마크만 실행 |\n| `go test -run=^$ -bench=.` | 일반 테스트 생략, 벤치마크만 실행 |\n\n---"},{"id":"t10-05","ty":"num","lv":3,"game":false,"p":"도전④ 출력에서 <code>BenchmarkCalculate/add<\/code>는 5.2 ns/op, <code>BenchmarkDirectAdd<\/code>는 0.3 ns/op입니다. Calculate 호출이 직접 덧셈보다 1회당 몇 ns 더 걸리나요?","a":4.9,"unit":"ns","tol":0.05,"h":"출력 예시에서 BenchmarkCalculate/add의 ns/op 값과 직접 덧셈의 ns/op 값을 찾습니다. 두 값의 차이(Calculate ns/op − DirectAdd ns/op)가 함수 호출과 switch 분기로 생기는 1회당 오버헤드입니다.","w":"5.2 − 0.3 = 4.9 ns로, 솔루션은 이를 '함수 호출 + switch 분기 오버헤드가 약 5ns'라고 해석합니다.","an":"2일차 솔루션 도전④ 실행 · 결과 해석","src":"## 실행\n\n```bash\nmake bench\n```\n\n출력 예시:\n```\ngoos: linux\ngoarch: amd64\nBenchmarkCalculate/add-8 200000000 5.2 ns/op 0 B/op 0 allocs/op\nBenchmarkCalculate/mul-8 200000000 5.1 ns/op 0 B/op 0 allocs/op\nBenchmarkCalculate/div-8 200000000 5.3 ns/op 0 B/op 0 allocs/op\nBenchmarkCalculate/mod-8 100000000 8.7 ns/op 0 B/op 0 allocs/op\nBenchmarkDirectAdd-8 1000000000 0.3 ns/op 0 B/op 0 allocs/op\n```"},{"id":"t10-06","ty":"ox","lv":2,"game":true,"p":"<code>Calculate(\"add\", 10, 20)<\/code>는 문자열 비교와 switch를 거치므로 <code>Add(10, 20)<\/code>보다 느릴 수 있다.","a":true,"h":"Calculate(\"add\", 10, 20)은 내부에서 문자열 \"add\"를 비교하고 switch 분기를 실행합니다. 실습 7단계는 이런 추가 작업 때문에 덧셈만 하는 Add()와 비교해 속도 차이를 확인하도록 합니다.","w":"맞습니다. Calculate는 내부에서 문자열 'add'를 비교하고 switch를 실행하므로 단순 Add()보다 느릴 수 있습니다.","an":"벤치마크 실습 7단계","src":"# 7단계. Calculate 함수 벤치마크하기\n\n```go\nfunc BenchmarkCalculateAdd(b *testing.B) {\n for i := 0; i < b.N; i++ {\n _, _ = Calculate(\"add\", 10, 20)\n }\n}\n```\n\n`Calculate()`는 내부에서 문자열 `\"add\"`를 비교하고 `switch`를 실행합니다. \n따라서 단순 `Add()`보다 느릴 수 있습니다.\n\n비교 대상:\n\n```go\nAdd(10, 20)\n```\n\n```go\nCalculate(\"add\", 10, 20)\n```\n\n---"},{"id":"t10-07","ty":"ox","lv":2,"game":true,"p":"<code>-benchmem<\/code> 결과가 '0 B/op 0 allocs/op'이면 메모리 할당이 많다는 뜻이다.","a":false,"h":"-benchmem 출력에서 B/op는 1회 실행당 사용한 메모리, allocs/op는 1회 실행당 메모리 할당 횟수입니다. 실습 10단계는 좋은 성능의 함수가 보통 두 값이 모두 0으로 나온다고 설명합니다.","w":"틀렸습니다. 1회 실행당 메모리 사용 0바이트, 할당 0회라는 뜻으로, 교안은 좋은 성능의 함수가 보통 이렇게 나온다고 설명합니다.","an":"벤치마크 실습 10단계 메모리 할당","src":"| 항목 | 의미 |\n|---|---|\n| `ns/op` | 1회 실행당 걸린 시간 |\n| `B/op` | 1회 실행당 사용한 메모리 |\n| `allocs/op` | 1회 실행당 메모리 할당 횟수 |\n\n좋은 성능의 함수는 보통 다음처럼 나옵니다.\n\n```text\n0 B/op 0 allocs/op\n```\n\n---"},{"id":"t10-08","ty":"match","lv":1,"game":false,"p":"벤치마크 출력·API 항목과 의미를 연결하세요.","pairs":[["ns/op","1회 실행당 걸린 시간"],["B/op","1회 실행당 사용한 메모리"],["allocs/op","1회 실행당 메모리 할당 횟수"],["b.Run()","서브 벤치마크 실행"]],"h":"op는 operation, 즉 1회 실행을 뜻합니다. ns/op는 1회당 시간, B/op는 1회당 메모리 바이트, allocs/op는 1회당 할당 횟수이며, b.Run()은 여러 연산을 하위 벤치마크로 나눠 측정합니다.","w":"ns/op는 시간, B/op는 메모리 양, allocs/op는 할당 횟수입니다. b.Run()은 add·mul처럼 연산별로 나눠 측정합니다.","an":"벤치마크 실습 5·8·10단계 표","src":"| 항목 | 의미 |\n|---|---|\n| `ns/op` | 1회 실행당 걸린 시간 |\n| `B/op` | 1회 실행당 사용한 메모리 |\n| `allocs/op` | 1회 실행당 메모리 할당 횟수 |\n\n좋은 성능의 함수는 보통 다음처럼 나옵니다.\n\n```text\n0 B/op 0 allocs/op\n```\n\n---"},{"id":"t10-09","ty":"order","lv":2,"game":false,"p":"벤치마크 실습 진행 순서를 배열하세요.","steps":["go mod init go-benchmark-practice","calculator.go 작성","calculator_test.go 작성 후 go test -v","calculator_benchmark_test.go 작성","go test -bench=. -benchmem 실행"],"h":"실습 체크리스트는 go mod init으로 모듈을 만들고 calculator.go를 작성한 뒤, calculator_test.go로 함수가 정상 동작하는지 먼저 확인합니다. 그 다음 벤치마크 파일을 작성하고 -bench, -benchmem 순으로 실행합니다.","w":"모듈과 대상 함수를 만들고, 일반 테스트로 정상 동작을 확인한 뒤 벤치마크 파일을 작성해 -bench와 -benchmem으로 측정합니다.","an":"벤치마크 실습 14단계 실습 체크리스트","src":"# 14단계. 실습 체크리스트\n\n- [ ] `go mod init go-benchmark-practice` 실행\n- [ ] `calculator.go` 작성\n- [ ] `calculator_test.go` 작성\n- [ ] `go test -v` 실행\n- [ ] `calculator_benchmark_test.go` 작성\n- [ ] `go test -bench=.` 실행\n- [ ] `go test -bench=. -benchmem` 실행\n- [ ] `BenchmarkAdd`와 `BenchmarkCalculateAdd` 결과 비교\n- [ ] `b.ResetTimer()` 사용\n- [ ] `go test -run=^$ -bench=.` 실행\n\n---"},{"id":"t10-10","ty":"multi","lv":3,"game":true,"p":"도전④ 벤치마크 결과 해석으로 솔루션이 제시한 내용을 모두 고르세요.","o":["Calculate 호출은 약 5ns","직접 덧셈은 약 0.3ns","호출+switch 오버헤드 약 5ns","mod가 add보다 빠르다","모든 연산이 메모리를 할당"],"a":[0,1,2],"h":"도전④ 솔루션의 결과 해석은 Calculate 호출 시간, 직접 덧셈 시간, 그리고 두 값의 차이로 본 함수 호출+switch 분기 오버헤드를 정리합니다. mod는 부동소수 연산이라 비용이 더 크다는 설명도 붙어 있습니다.","w":"Calculate는 약 5ns, 직접 덧셈은 0.3ns로 함수 호출+switch 오버헤드가 약 5ns입니다. mod는 8.7ns로 부동소수 모듈로 비용이 더 크며, 모든 항목이 0 allocs/op입니다.","an":"2일차 솔루션 도전④ 결과 해석","src":"## 결과 해석\n\n- `Calculate` 호출은 약 5ns\n- 직접 덧셈은 0.3ns\n- **함수 호출 + switch 분기 오버헤드가 약 5ns**\n- mod는 부동소수 모듈로 연산 비용이 더 큼"}]}]};
