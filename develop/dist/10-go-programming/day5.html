<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Go 언어 5일차 · net/http·JSON·테스트·디버깅·pprof·CGo · 문제은행</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Quiz Bank 디자인 토큰 v3 (3층: Primitive → Semantic → Component)
   다크 팔레트: day07 워크시트(#0b1220 남색 + 앰버·틸 포인트) / 라이트: 같은 구조의 중립 팔레트
   포인트색은 teal 하나(--color-brand). amber는 제목(다크)·경고·하이라이트 보조.
   v2 이름(--bg, --ink 등)은 파일 끝 Alias 블록이 시맨틱으로 연결한다.
   build.py가 이 파일을 엔진 <style> 맨 앞에 그대로 넣는다. */
:root{
  /* ── 1층 Primitive: 원시 값 ── */
  --white:#FFFFFF;--ink-900:#141A26;
  --slate-50:#F5F6F8;--slate-100:#F0F2F5;--slate-200:#E2E6EC;--slate-250:#D5DAE2;--slate-300:#CDD3DC;
  --slate-400:#8A93A4;--slate-500:#64748B;--slate-600:#5A6375;
  --navy-950:#0A0F1C;--navy-900:#0B1220;--navy-850:#0E1628;--navy-800:#111A2E;--navy-700:#16203A;--navy-650:#172239;
  --navy-600:#1F2B45;--navy-500:#2A3A5C;
  --ice-200:#DBE4F0;--steel-400:#8A9BB8;--steel-500:#5E6F8E;
  --teal-900:#123D33;--teal-700:#0B6F66;--teal-600:#0E8C80;--teal-400:#2DD4BF;
  --amber-900:#3A2A0C;--amber-700:#B45309;--amber-650:#D97706;--amber-600:#B7791F;--amber-400:#F5B942;--amber-100:#FEF3C7;
  --gold-600:#B7891F;
  --green-700:#15803D;--green-600:#16A34A;--green-400:#4ADE80;
  --red-650:#DC2626;--red-600:#D23B32;--red-400:#F87171;
  --yellow-500:#EAB308;--yellow-400:#FACC15;
  --violet-600:#7C3AED;--violet-400:#C084FC;
  --pink-700:#C2417A;--pink-400:#F472B6;
  --blue-600:#2563EB;--blue-400:#60A5FA;
  /* 과목 색: 흰 배경·남색 배경 모두 3:1 이상(아이콘·스트라이프용), 테마 공통 */
  --subject-it:#4F7FC0;--subject-korean:#B05A5A;--subject-english:#3F8F6E;
  --subject-science:#8A62B8;--subject-music:#B0762A;--subject-art:#C0508A;

  /* ── 2층 Semantic 고정부 ── */
  --font-sans:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","D2Coding",Consolas,"SF Mono",monospace;
  --fs-base:15px;--lh:1.55;
  --fs-h1:24px;--fs-h2:17px;--fs-q:15px;--fs-opt:14px;--fs-btn:13px;--fs-btn-pri:14px;
  --fs-sm:13px;--fs-xs:12px;--fs-2xs:11px;--fs-ox:22px;
  --radius-sm:6px;--radius-control:8px;--radius-card:10px;--radius-lg:12px;--maxw:880px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;
  --ease:cubic-bezier(.2,0,0,1);--dur-fast:120ms;--dur:200ms;

  /* ── 라이트 시맨틱 + 컴포넌트 ── */
  --color-background:var(--slate-50);--color-surface:var(--white);--color-surface-raised:var(--white);--color-surface-muted:var(--slate-100);--color-field:var(--white);
  --color-text:var(--ink-900);--color-text-muted:var(--slate-600);--color-text-faint:var(--slate-400);
  --color-border:var(--slate-200);--color-border-strong:var(--slate-300);
  --color-heading:var(--ink-900);--legacy-title:var(--ink-900);--color-brand:var(--teal-600);--color-brand-text:var(--teal-700);--color-on-brand:var(--white);
  --color-accent:var(--amber-600);--color-success:var(--green-700);--color-warning:var(--amber-700);--color-danger:var(--red-600);
  --color-highlight:var(--amber-100);--color-focus:var(--teal-600);
  --button-bg:var(--white);--button-border:var(--slate-250);--button-text:var(--ink-900);
  --button-primary-bg:var(--ink-900);--button-primary-border:var(--ink-900);--button-primary-text:var(--white);
  --combo:var(--violet-600);--gold:var(--gold-600);
  --ty-mc:var(--teal-600);--ty-multi:var(--violet-600);--ty-ox:var(--slate-500);--ty-match:var(--pink-700);--ty-order:var(--amber-600);--ty-num:var(--blue-600);
  --timer-hi:var(--green-600);--timer-mid:var(--amber-650);--timer-lo:var(--red-650);
  --lv1:var(--green-600);--lv2:var(--yellow-500);--lv3:var(--red-650);
  --shadow:0 1px 2px rgb(16 24 40 / .04);
  color-scheme:light;

  /* ── Alias (v2 이름 → 시맨틱). 엔진 페이지 호환용. 새 코드는 --color-* 사용 ── */
  --font:var(--font-sans);--mono:var(--font-mono);
  --r-sm:var(--radius-sm);--r:var(--radius-control);--r-md:var(--radius-card);--r-lg:var(--radius-lg);
  --bg:var(--color-background);--panel:var(--color-surface);--raised:var(--color-surface-raised);--field:var(--color-field);
  --soft:var(--color-surface-muted);
  --ink:var(--color-text);--muted:var(--color-text-muted);--faint:var(--color-text-faint);
  --line:var(--color-border);--line-2:var(--color-border-strong);
  --title:var(--legacy-title);--link:var(--color-brand);--accent:var(--color-accent);
  --ok:var(--color-success);--bad:var(--color-danger);
  --btn-bg:var(--button-bg);--btn-line:var(--button-border);
  --pri-bg:var(--button-primary-bg);--pri-line:var(--button-primary-border);--pri-ink:var(--button-primary-text);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --color-background:var(--navy-900);--color-surface:var(--navy-800);--color-surface-raised:var(--navy-850);--color-surface-muted:var(--navy-700);--color-field:var(--navy-950);
  --color-text:var(--ice-200);--color-text-muted:var(--steel-400);--color-text-faint:var(--steel-500);
  --color-border:var(--navy-600);--color-border-strong:var(--navy-500);
  --color-heading:var(--color-text);--legacy-title:var(--amber-400);--color-brand:var(--teal-400);--color-brand-text:var(--teal-400);--color-on-brand:var(--navy-900);
  --color-accent:var(--amber-400);--color-success:var(--green-400);--color-warning:var(--amber-400);--color-danger:var(--red-400);
  --color-highlight:var(--amber-900);--color-focus:var(--teal-400);
  --button-bg:var(--navy-650);--button-border:var(--navy-500);--button-text:var(--ice-200);
  --button-primary-bg:var(--teal-900);--button-primary-border:var(--teal-400);--button-primary-text:var(--teal-400);
  --combo:var(--violet-400);--gold:var(--amber-400);
  --ty-mc:var(--teal-400);--ty-multi:var(--violet-400);--ty-ox:var(--steel-400);--ty-match:var(--pink-400);--ty-order:var(--amber-400);--ty-num:var(--blue-400);
  --timer-hi:var(--green-400);--timer-mid:var(--amber-400);--timer-lo:var(--red-400);
  --lv1:var(--green-400);--lv2:var(--yellow-400);--lv3:var(--red-400);
  --shadow:none;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --color-background:var(--navy-900);--color-surface:var(--navy-800);--color-surface-raised:var(--navy-850);--color-surface-muted:var(--navy-700);--color-field:var(--navy-950);
  --color-text:var(--ice-200);--color-text-muted:var(--steel-400);--color-text-faint:var(--steel-500);
  --color-border:var(--navy-600);--color-border-strong:var(--navy-500);
  --color-heading:var(--color-text);--legacy-title:var(--amber-400);--color-brand:var(--teal-400);--color-brand-text:var(--teal-400);--color-on-brand:var(--navy-900);
  --color-accent:var(--amber-400);--color-success:var(--green-400);--color-warning:var(--amber-400);--color-danger:var(--red-400);
  --color-highlight:var(--amber-900);--color-focus:var(--teal-400);
  --button-bg:var(--navy-650);--button-border:var(--navy-500);--button-text:var(--ice-200);
  --button-primary-bg:var(--teal-900);--button-primary-border:var(--teal-400);--button-primary-text:var(--teal-400);
  --combo:var(--violet-400);--gold:var(--amber-400);
  --ty-mc:var(--teal-400);--ty-multi:var(--violet-400);--ty-ox:var(--steel-400);--ty-match:var(--pink-400);--ty-order:var(--amber-400);--ty-num:var(--blue-400);
  --timer-hi:var(--green-400);--timer-mid:var(--amber-400);--timer-lo:var(--red-400);
  --lv1:var(--green-400);--lv2:var(--yellow-400);--lv3:var(--red-400);
  --shadow:none;
  color-scheme:dark;}
@media (max-width:560px){:root{--fs-base:14.5px;--fs-h1:20px;--fs-h2:16px;--fs-q:14.5px;--fs-ox:20px}}

/* ── 기본 ───────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:110px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-base);line-height:var(--lh);
  -webkit-font-smoothing:antialiased;letter-spacing:-.003em;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
b,strong{font-weight:650}
code{font-family:var(--mono);font-size:.88em;color:var(--link);background:var(--soft);padding:1px 5px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px 56px}
.muted{color:var(--muted)}
/* 상단 바 */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:calc(52px + env(safe-area-inset-top,0px));margin:0 -20px 22px;padding:env(safe-area-inset-top,0px) 20px 0;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.brand{font-size:var(--fs-xs);color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;letter-spacing:.01em}
.brand b{color:var(--ink);font-weight:600}
.iconbtn{font:inherit;font-size:14px;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);width:32px;height:32px;border-radius:var(--r);cursor:pointer;flex:0 0 auto;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--muted)}
/* 제목 */
h1{font-size:var(--fs-h1);line-height:1.3;margin:0 0 6px;letter-spacing:-.02em;font-weight:700;color:var(--title)}
h2{font-size:var(--fs-h2);line-height:1.4;margin:0;font-weight:650;letter-spacing:-.01em}
.ph{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 10px;letter-spacing:0}
.sh{font-size:var(--fs-sm);color:var(--muted);font-weight:600;margin:16px 0 6px}
.sub{color:var(--muted);margin:0 0 4px}
.meta{font-size:var(--fs-xs);color:var(--faint);margin:0 0 18px;font-family:var(--mono);letter-spacing:-.01em}
.crumbs{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:var(--fs-sm);color:var(--faint)}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink)}
.part{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--link);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:1px 7px;white-space:nowrap;max-width:100%;font-weight:500;letter-spacing:0}
.tabhead .part,.ngroup .part{white-space:normal;overflow-wrap:anywhere}  /* 긴 자료 위치(예: voice-ai 교시 라벨)는 줄바꿈 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.center{text-align:center}
.note-sm{font-size:var(--fs-sm);color:var(--muted)}
.lbl{display:block;font-size:var(--fs-xs);color:var(--muted);margin-bottom:2px}
/* 버튼 */
.btn{font:inherit;font-size:var(--fs-btn);display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);
  padding:7px 12px;border-radius:var(--r);cursor:pointer;text-decoration:none;min-height:34px;line-height:1.3;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pri-bg);color:var(--pri-ink);border-color:var(--pri-line);font-weight:650;font-size:var(--fs-btn-pri);padding:8px 18px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.locked{opacity:.5}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--btn-line))}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn .cnt{font-family:var(--mono);font-size:var(--fs-2xs);background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;min-width:18px;line-height:16px;text-align:center}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
button:focus-visible,a:focus-visible,input:focus-visible,.opt:focus-within{outline:2px solid var(--link);outline-offset:2px}
/* 입력 */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;max-width:300px}
.field label{font-size:var(--fs-xs);color:var(--muted)}
.field input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--field);color:var(--ink)}
.field input::placeholder{color:var(--faint)}
/* 진행 바 */
.bar{flex:1;height:4px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--link);transition:width .25s}
.progress{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:8px 0;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.progress span,.homeprog span{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.homeprog{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
/* 홈 탭 카드 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:6px}
.tcard{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;text-decoration:none;color:var(--ink);transition:border-color .15s;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--line-2)}
.tcard .tn{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint)}
.tcard .tt{font-weight:600;font-size:14px;line-height:1.45}
.tcard .ts{margin-top:auto;padding-top:8px;font-size:var(--fs-xs);color:var(--faint);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono)}
.tcard.done .ts b{color:var(--ok);font-weight:600}
.tcard.perfect{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.lockmsg{font-size:var(--fs-xs);color:var(--faint);margin:-6px 0 16px}
/* 탭 바 */
/* 학습 탭 선택: 웹(≥1024) 자유 배치 · 태블릿(560~1023) 3개 · 모바일(<560) 2개 */
.tabbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
@media (max-width:1023px){.tabbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}}
.tabchip{min-width:0;display:flex;align-items:center;gap:6px;font-size:var(--fs-btn);padding:6px 10px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);text-decoration:none;color:var(--ink);line-height:1.35;word-break:keep-all}
.tabchip .tl{min-width:0}
.tabchip .qc{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--muted);white-space:nowrap;margin-left:auto}
.tabchip[aria-selected="true"] .qc{color:var(--link)}
.tabchip .sc{white-space:nowrap}
.btn .qc{font-family:var(--mono);font-weight:500;opacity:.85}
.tabchip b{font-family:var(--mono);font-weight:600;color:var(--faint)}
.tabchip:hover{border-color:var(--muted)}
.tabchip[aria-selected="true"]{border-color:var(--link);color:var(--link);background:color-mix(in srgb,var(--link) 9%,var(--btn-bg))}
.tabchip[aria-selected="true"] b{color:var(--link)}
.tabchip .sc{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--ok)}
.tabchip.sum{border-color:color-mix(in srgb,var(--gold) 60%,var(--btn-line));color:var(--gold)}
.tabhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 2px}
.tabhead h2{color:var(--title)}
/* 문항 카드 */
.q{background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:var(--r-md);padding:12px 14px;margin:0 0 10px;box-shadow:var(--shadow)}
.q.correct{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));border-left-color:var(--ok)}
.q.wrong{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));border-left-color:var(--bad)}
.qhead{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.qn{font-family:var(--mono);font-size:var(--fs-xs);color:var(--faint);font-weight:500}
.tbadge{font-size:var(--fs-2xs);font-weight:600;padding:0 7px;line-height:18px;border-radius:var(--r-sm);color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent);background:color-mix(in srgb,var(--tc) 8%,transparent);white-space:nowrap}
/* 난이도: 점 1 녹색 · 점 2 노랑 · 점 3 빨강 (쉬움 ●○○ / 보통 ●●○ / 어려움 ●●●) + 글자 */
.lv{display:inline-flex;align-items:center;gap:4px;line-height:1}
.lv .dots{font-size:9px;letter-spacing:1px}
.lv i{font-style:normal}
.lv .d1{color:var(--lv1)} .lv .d2{color:var(--lv2)} .lv .d3{color:var(--lv3)} .lv .off{color:var(--line-2)}
.lv em{font-style:normal;font-size:var(--fs-2xs);font-weight:600}
.lv1 em{color:var(--lv1)} .lv2 em{color:color-mix(in srgb,var(--lv2) 80%,var(--ink))} .lv3 em{color:var(--lv3)}
.verdict{margin-left:auto;font-weight:650;font-size:var(--fs-xs)}
.correct .verdict{color:var(--ok)} .wrong .verdict{color:var(--bad)}
.qsrc{margin-left:auto;font-size:var(--fs-2xs);color:var(--faint)}
.qt{font-size:var(--fs-q);font-weight:500;margin:4px 0 8px}
.guide{font-size:var(--fs-xs);color:var(--faint);margin:-4px 0 8px}
/* 음성 선택 · 문제 읽기 · 그림/오디오 */
.vrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px}
.vbtn{font:inherit;font-size:var(--fs-btn);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);border-radius:var(--r);padding:4px 10px;min-height:32px;cursor:pointer}
.vbtn:hover{border-color:var(--muted)}
.vbtn svg{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vbtn[data-state="listening"]{border-color:var(--link);color:var(--link);box-shadow:0 0 0 3px color-mix(in srgb,var(--link) 28%,transparent);animation:vpulse 1.2s ease-in-out infinite}
.vbtn[data-state="heard"]{border-color:var(--ok)}
.vbtn[data-state="error"]{border-color:var(--bad)}
@keyframes vpulse{50%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){.vbtn[data-state="listening"]{animation:none}}
.vstat{font-size:var(--fs-xs);color:var(--muted)}
.vstat:empty{display:none}
.vhint{font-size:var(--fs-xs);color:var(--faint)}
.qfig{margin:6px 0 10px}
.qfig img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.qfig figcaption{font-size:var(--fs-xs);color:var(--muted);margin-top:4px}
.qaud{margin:6px 0 10px}
.qaud audio{display:block;width:100%;max-width:420px}
.qaud details{font-size:var(--fs-sm);color:var(--muted);margin-top:4px}
.qaud summary{cursor:pointer}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--panel);font-size:var(--fs-opt);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--line-2)}
.opt input{margin:4px 0 0;accent-color:var(--link);flex:0 0 auto;width:14px;height:14px}
.opt:has(input:checked){border-color:var(--link);background:color-mix(in srgb,var(--link) 7%,var(--panel))}
.opt.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.opt.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--panel))}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:360px}
.ox button{font:inherit;font-size:var(--fs-ox);font-weight:700;padding:8px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);cursor:pointer;line-height:1.3}
.ox button:hover{border-color:var(--muted)}
.ox button[aria-pressed="true"]{border-color:var(--link);color:var(--link);background:color-mix(in srgb,var(--link) 10%,var(--btn-bg))}
.ox button.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--btn-bg));color:var(--ok)}
.ox button.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--btn-bg));color:var(--bad)}
/* 짝 맞추기 */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px 14px}
.mcol{display:flex;flex-direction:column;gap:6px}
.mitem{font:inherit;font-size:var(--fs-opt);text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);padding:7px 10px;cursor:pointer;min-height:38px;display:flex;align-items:center;gap:8px;line-height:1.45}
.mitem:hover{border-color:var(--line-2)}
.mitem .tag{flex:0 0 auto;width:20px;height:20px;border-radius:var(--r-sm);border:1px dashed var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);font-weight:600}
.mitem.linked{border-color:color-mix(in srgb,var(--pc) 70%,var(--line))}
.mitem.linked .tag{border:0;background:var(--pc);color:var(--bg)}
.mitem.sel{border-color:var(--link);box-shadow:0 0 0 3px color-mix(in srgb,var(--link) 18%,transparent)}
.mitem.okm{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.mitem.nom{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.mleft .mitem{font-weight:600}
/* 순서 */
.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.oitem{font:inherit;font-size:var(--fs-opt);text-align:left;width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);cursor:pointer;transition:border-color .12s,background .12s}
.oitem:hover{border-color:var(--line-2)}
.oitem .num{width:22px;height:22px;border-radius:50%;border:1px dashed var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);font-weight:600;color:var(--muted);flex:0 0 auto}
.oitem.on{border-color:var(--link);background:color-mix(in srgb,var(--link) 7%,var(--panel))}
.oitem.on .num{border:0;background:var(--link);color:var(--bg)}
.oitem .txt{flex:1;line-height:1.45}
.oitem .ofix{flex:0 0 auto;font-size:var(--fs-2xs);color:var(--ok);font-weight:600}
.oitem.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.oitem.ok .num{background:var(--ok)}
.oitem.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.oitem.no.on .num{background:var(--bad)}
.numrow{display:flex;align-items:center;gap:8px;font-size:var(--fs-opt)}
.numrow input{font-family:var(--mono);font-size:14px;width:120px;padding:6px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--field);color:var(--ink);text-align:right}
.numrow input.ans{border-color:var(--ok)} .numrow input.miss{border-color:var(--bad)}
.locked .mitem,.locked .ox button,.locked .opt{pointer-events:none}
.locked .oitem{pointer-events:none}
.opt .onum{flex:0 0 auto;min-width:18px;height:18px;padding:0 4px;border-radius:var(--r-sm);border:1px solid var(--line-2);display:inline-grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);color:var(--muted);margin-top:1px}
.opt:has(input:checked) .onum{border-color:var(--link);color:var(--link)}
.opt.ans .onum{border-color:var(--ok);color:var(--ok)} .opt.miss .onum{border-color:var(--bad);color:var(--bad)}
/* 힌트 토글 (빨간색 = Hint) */
.hintwrap{margin:-2px 0 8px}
.hintbtn{font:inherit;font-size:var(--fs-xs);font-weight:650;display:inline-flex;align-items:center;gap:4px;color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:var(--r-sm);padding:2px 9px;cursor:pointer;line-height:1.5}
.hintbtn:hover{background:color-mix(in srgb,var(--bad) 13%,transparent)}
.hintbtn .caret{font-size:.85em}
.srcwrap{margin-top:8px}
.srcbtn{font:inherit;font-size:var(--fs-xs);font-weight:600;display:inline-flex;align-items:center;gap:4px;color:var(--link);background:transparent;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:1px 8px;cursor:pointer;line-height:1.5}
.srcbtn:hover{border-color:var(--link)}
.src{margin:6px 0 0;padding:6px 10px;border-left:3px solid var(--link);background:var(--soft);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:var(--fs-xs);color:var(--muted)}
.src p{margin:0;white-space:pre-wrap;word-break:break-word}
.src cite{display:block;margin-top:4px;font-style:normal;font-size:var(--fs-2xs);color:var(--faint)}
.hint{margin-top:6px;padding:6px 10px;border-left:3px solid var(--bad);background:color-mix(in srgb,var(--bad) 6%,transparent);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:var(--fs-sm);color:var(--ink)}
/* 해설 */
.exp{margin-top:10px;padding:2px 0 2px 10px;border-left:3px solid var(--line-2);font-size:var(--fs-sm);color:var(--muted)}
.correct .exp{border-left-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.wrong .exp{border-left-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.exp p{margin:0 0 3px}
.exp b{color:var(--ink);font-weight:650;margin-right:4px}
.an{font-family:var(--mono);color:var(--link);font-size:var(--fs-xs);margin:4px 0 0}
.mine{color:var(--bad)}
.onlywrong .q.correct{display:none}
.warn{color:var(--bad);font-size:var(--fs-sm);min-height:1.3em;margin:4px 0 0}
/* 결과 */
.score{font-family:var(--mono);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--title);letter-spacing:-.02em}
.score small{font-family:var(--font);font-size:14px;color:var(--muted);font-weight:400;letter-spacing:0}
.score.xl{font-size:44px}
.msg{margin:6px 0 10px;color:var(--muted);font-size:var(--fs-sm)}
.bd{display:grid;gap:7px;margin:6px 0}
.bd div{display:grid;grid-template-columns:minmax(90px,190px) 1fr 44px;gap:10px;align-items:center;font-size:var(--fs-sm)}
.bd .b{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bd .b i{display:block;height:100%;background:var(--tc,var(--link));border-radius:99px}
.bd span:last-child{text-align:right;font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted)}
.rcode{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.06em;color:var(--accent);background:var(--soft);padding:2px 8px;border-radius:var(--r-sm)}
/* 오답노트 · 해설지 */
.ngroup{margin:18px 0 8px;font-size:14px;font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ngroup .ref{font-family:var(--mono);font-size:var(--fs-2xs);font-weight:400;color:var(--faint)}
.note{background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px}
.note.solved{border-left-color:var(--ok)}
.note .qt{margin:0 0 8px}
.note dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:var(--fs-sm)}
.note dt{color:var(--faint)}
.note dd{margin:0}
.note .foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:var(--fs-xs);color:var(--faint);font-family:var(--mono)}
.note .foot span:first-child{color:var(--link)}
details.more{margin-top:14px;font-size:var(--fs-sm)}
details.more summary{cursor:pointer;color:var(--muted);padding:4px 0}
.keyitem{padding:10px 0;border-bottom:1px solid var(--line)}
.keyitem .kq{font-weight:500;font-size:14px}
.keyitem .ka{margin:4px 0 2px;color:var(--ok);font-weight:600;font-size:var(--fs-sm)}
.keyitem .kw{font-size:var(--fs-sm);color:var(--muted);margin:0}
.keylock{padding:12px;border:1px dashed var(--line-2);border-radius:var(--r-md);color:var(--faint);text-align:center;margin:8px 0;font-size:var(--fs-sm)}
.printhead{display:none}
/* 게임 */
.game{max-width:620px;margin:0 auto}
.gpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;gap:4px;min-height:120px;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);color:var(--ink);text-decoration:none;transition:border-color .15s,background .15s}
a.gcard:hover{border-color:var(--link);background:color-mix(in srgb,var(--link) 6%,var(--panel))}
.gcard .gn{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint);letter-spacing:.05em}
.gcard b{font-size:15px}
.gcard .gd{font-size:var(--fs-xs);color:var(--muted);line-height:1.5}
.gcard.soon{border-style:dashed;opacity:.6;cursor:not-allowed}
@media (max-width:560px){.gpick{gap:6px}.gcard{min-height:84px;padding:10px 8px;align-items:center;text-align:center;justify-content:center}.gcard b{font-size:13px;word-break:keep-all}.gcard .gd{display:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.chip{font:inherit;font-size:var(--fs-btn);padding:6px 12px;border-radius:var(--r);border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--ink);cursor:pointer;min-height:32px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--link);color:var(--link);background:color-mix(in srgb,var(--link) 9%,var(--btn-bg));font-weight:600}
.chip:disabled{opacity:.4;cursor:not-allowed}
.rules{font-size:var(--fs-xs);color:var(--muted);border-left:3px solid var(--line-2);padding:2px 0 2px 10px;margin:4px 0 16px}
.rules p{margin:0 0 2px}
.play{display:flex;flex-direction:column;min-height:calc(100dvh - 130px)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--fs-sm);color:var(--muted);margin-bottom:8px}
.hud .pts{font-size:18px;font-weight:600;color:var(--title)}
.combo{font-family:var(--font);font-size:var(--fs-xs);padding:2px 9px;border-radius:var(--r-sm);border:1px solid var(--line-2);color:var(--muted)}
.combo.hot{border-color:var(--combo);color:var(--combo);background:color-mix(in srgb,var(--combo) 12%,transparent)}
.timer{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.timer>div{height:100%;width:100%;background:var(--timer-hi);border-radius:99px}
.timer.mid>div{background:var(--timer-mid)}
.timer.lo>div{background:var(--timer-lo)}
.timer.out{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tleft{font-family:var(--mono);font-size:var(--fs-xs);color:var(--faint);text-align:right;font-variant-numeric:tabular-nums;margin:4px 0 12px;min-height:1.2em}
.gtype{font-size:var(--fs-2xs);color:var(--faint);margin-bottom:4px;letter-spacing:.02em}
.gq{font-size:18px;font-weight:600;line-height:1.5;margin:0 0 16px;letter-spacing:-.01em}
.gbottom{margin-top:4px}
.gopts{display:grid;gap:8px}
.gopt{font:inherit;font-size:var(--fs-opt);text-align:left;display:flex;gap:12px;align-items:center;padding:10px 14px;min-height:46px;border:1px solid var(--btn-line);border-radius:var(--r-md);background:var(--panel);color:var(--ink);cursor:pointer;transition:background .12s,border-color .12s;line-height:1.45}
.gopt:hover{border-color:var(--muted)}
.gopt kbd{flex:0 0 auto;width:22px;height:22px;border-radius:var(--r-sm);border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-2xs);color:var(--faint)}
.gopt[aria-pressed="true"]{border-color:var(--link);background:color-mix(in srgb,var(--link) 9%,var(--panel))}
.gopt.ans{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.gopt.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.gox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gox .gopt{justify-content:center;font-size:28px;font-weight:700;min-height:76px}
.gfloat{text-align:center;font-weight:650;font-size:16px;min-height:1.6em;margin-top:10px;font-family:var(--mono)}
.gfloat.ok{color:var(--ok)} .gfloat.no{color:var(--bad)}
.gfloat.pop{animation:pop .45s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.gsub{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.board{width:100%;border-collapse:collapse;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.board th,.board td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.board th{font-size:var(--fs-xs);color:var(--faint);font-weight:500}
.board .r{text-align:right;font-family:var(--mono)}
.board tr.me td{background:color-mix(in srgb,var(--combo) 12%,transparent);font-weight:600}
.bignum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 2px}
.bignum div{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:left}
.bignum b{display:block;font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.bignum span{font-size:var(--fs-2xs);color:var(--faint)}
/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--panel);color:var(--ink);border:1px solid var(--line-2);
  padding:8px 14px;border-radius:var(--r);font-size:var(--fs-sm);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .18)}
.toast.show{opacity:1;transform:translateX(-50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* 문제풀이 페이지(학습·오답 재도전): 탭 제목(h2)을 뺀 모든 글자 10px — 사용자 지정 */
/* 문제풀이·오답노트·해설지 공통: 제목(h1·h2·탭 묶음 제목)을 뺀 글자 10px, 문제 11px, 자간 +0.03em, 행간 1.7 */
.sheet,.sheet :where(*:not(h1,h2,.ngroup,.ngroup *)){font-size:10px!important;letter-spacing:.03em!important}  /* :where = 명시도 0 → 아래 11px 규칙이 이김 */
.sheet :is(.qt,.opt,.exp,.exp p,.guide,.mitem,.oitem .txt,.hint,.warn,.msg,.sub,.note dt,.note dd,.note .foot,.kq,.ka,.kw,.keylock){line-height:1.7!important}
.sheet :is(.qt,.kq),.sheet :is(.qt,.kq) *{font-size:11px!important}  /* 문제 문장만 11px */
/* 한글이 섞인 숫자 요소는 mono 대신 본문 글꼴 + 고정폭 숫자 (mono 한글 자간이 벌어짐) */
.meta,.tcard .tn,.tcard .ts,.progress span,.homeprog span,.note .foot,.an,.hud,.tleft,.gfloat,.bignum b{font-family:var(--font);font-variant-numeric:tabular-nums;letter-spacing:0}
/* ── 반응형 ─────────────────────────────────────── */
@media (max-width:560px){
  .wrap{padding:0 16px 48px}
  .topbar{margin:0 -16px 18px;padding-left:16px;padding-right:16px}
  /* 홈 탭 카드: 모바일에서도 한 줄 3개 (사용자 지정) */
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .tcard{padding:8px 9px;gap:2px}
  .tcard .tn{font-size:10px}
  .tcard .tt{font-size:12px;line-height:1.35;word-break:keep-all}
  .tcard .ts{flex-direction:column;align-items:flex-start;gap:0;padding-top:6px;font-size:10px}
  .tabbar{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .tabchip{padding:6px 8px;gap:4px}
  .q{padding:12px}
  .match{grid-template-columns:1fr}
  .mright{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line-2)}
  .btn,.chip{min-height:40px}
  .actions .btn{flex:1 1 calc(50% - 8px)}
  .actions .btn.primary{flex-basis:100%}
  .ox{max-width:none}
  .ox button{min-height:48px}
  .oitem{min-height:40px}
  .bd div{grid-template-columns:96px 1fr 40px}
  .bignum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field{max-width:none}
  /* 게임: 보기를 엄지 영역(화면 아래)으로 */
  .play .gtop{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));background:var(--bg);padding:6px 0 0;z-index:4}
  .play .gbottom{margin-top:auto;padding-top:12px}
  .gq{font-size:17px}
  .gopt{min-height:50px}
  .board th:nth-child(6),.board td:nth-child(6){display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  :root{--bg:#fff;--panel:#fff;--raised:#fff;--ink:#000;--muted:#333;--faint:#555;--line:#bbb;--line-2:#999;--soft:#f1f1f1;--title:#000;--link:#055}
  body{background:#fff;color:#000;font-size:12.5px}
  .noprint,.topbar,.actions,.tabbar,.progress,.toast{display:none!important}
  .printhead{display:block;margin-bottom:12px;font-size:12px}
  .q,.note,.keyitem{break-inside:avoid;box-shadow:none}
}

<script>/* QB 공용 코어 — 저장 키, mock 로그인, 테마, 과목 목록. 비밀번호는 저장하지 않는다. */
(function(){
'use strict';
var KEY_USER='qb:user', KEY_UI='qb:ui:v1', KEY_THEME='qb:theme';
function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function del(k){try{localStorage.removeItem(k);}catch(e){}}
function json(k,d){try{var r=get(k);return r?JSON.parse(r):d;}catch(e){return d;}}
var QB=window.QB={};
QB.SUBJECTS=[
  {id:'it',label:'IT'},{id:'korean',label:'국어'},{id:'english',label:'영어'},
  {id:'science',label:'과학'},{id:'music',label:'음악'},{id:'art',label:'미술'}
];
QB.user=function(){var u=json(KEY_USER,null);return u&&u.v===1&&u.name?u:null;};
QB.login=function(o){
  o=o||{};var prev=json(KEY_USER,null),now=new Date().toISOString();
  var u={v:1,name:String(o.name||'').trim().slice(0,20),email:String(o.email||'').trim(),
    provider:o.provider||'email',createdAt:(prev&&prev.createdAt)||now,lastLoginAt:now};
  set(KEY_USER,JSON.stringify(u));return u;
};
QB.logout=function(){del(KEY_USER);};
QB.rename=function(n){
  var u=QB.user();n=String(n||'').trim().slice(0,20);if(!u||!n)return null;
  u.name=n;set(KEY_USER,JSON.stringify(u));return u;
};
QB.safeNext=function(n){
  n=String(n||'');return /^dashboard\.html(#[A-Za-z0-9\/=&_-]*)?$/.test(n)?n:'dashboard.html';
};
QB.requireUser=function(next){
  var u=QB.user();if(u)return u;
  next=QB.safeNext(next==null?'dashboard.html'+location.hash:next);
  location.replace('login.html?next='+encodeURIComponent(next));return null;
};
QB.theme={
  get:function(){return get(KEY_THEME);},
  apply:function(){var t=get(KEY_THEME),r=document.documentElement;if(t)r.dataset.theme=t;else delete r.dataset.theme;},
  toggle:function(){
    var t=get(KEY_THEME),dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    set(KEY_THEME,dark?'light':'dark');QB.theme.apply();
  }
};
QB.ui={
  get:function(){var d=json(KEY_UI,null);return d&&typeof d==='object'?d:{sidebar:true,subject:'it'};},
  set:function(p){var d=Object.assign(QB.ui.get(),p||{});set(KEY_UI,JSON.stringify(d));return d;}
};
QB.theme.apply();
})();
</script>
<script>/* qb-voice.js — 음성으로 보기 번호 고르기(Web Speech API) + 문제 읽기(speechSynthesis)
   window.QBVoice: supported · canSpeak · parse · attach · speak · cancelSpeak · isSpeaking · stopListening
   parse()는 순수 함수라 node에서도 테스트한다. */
(function(root){
'use strict';

/* ── 말 → 선택 해석 (순수 함수) ───────────────── */
const SINO={일:1,이:2,삼:3,사:4,오:5,육:6,칠:7,팔:8,구:9,십:10};
const NAT={하나:1,둘:2,셋:3,넷:4,다섯:5,여섯:6,일곱:7,여덟:8,아홉:9,열:10};
const DET={한:1,두:2,세:3,네:4,첫:1};  // 한/두/세/네/첫 은 '번'·'번째'·'째'가 붙을 때만 번호
// 보기 글자 A~H. '이'(E)는 숫자 2와 겹쳐 숫자를 우선하므로 영문 e로만 받는다
const LET={a:1,b:2,c:3,d:4,e:5,f:6,g:7,h:8,에이:1,비:2,씨:3,디:4,에프:6,지:7,에이치:8};

const alt=o=>Object.keys(o).sort((x,y)=>y.length-x.length).join('|');
const PRE='(?:정답은|정답이|정답|답은|답이|답|내답은|제답은|저는|나는|전|선택|번호)?';
const SUF='(?:이에요|이요|예요|이야|이죠|이다|입니다|이라고생각해요|이라고|선택할게요?|선택|할게요?|할래요?|고를게요?|고를래요?|정답|같아요|요|으로|로|을|를|이|가|은|는)*';
const R_DIGIT=new RegExp('^'+PRE+'(\\d{1,2})(?:번째|번|째)?'+SUF+'$');
const R_STD=new RegExp('^'+PRE+'('+alt(Object.assign({},SINO,NAT))+')(?:번째|번|째)?'+SUF+'$');
const R_DET=new RegExp('^'+PRE+'('+alt(DET)+')(?:번째|번|째)'+SUF+'$');
const R_LET=new RegExp('^'+PRE+'('+alt(LET)+')(?:번)?'+SUF+'$');
const R_X=/틀|아니|아닙|아닌|안맞|맞지않|엑스|가위|^x(?:요|입니다)?$/;
const R_O=/^(?:o|오|동그라미|오케이|ok|예|네|응|그래요?|맞.*)(?:요|입니다|이요|예요|야|라고생각해요)?$/;
const R_SUBMIT=/제출|채점|확인|다풀었|다했/;

function norm(s){
  return String(s==null?'':s).normalize('NFKC').toLowerCase().replace(/[\s.,!?'"“”‘’~…·\-_()\[\]]/g,'');
}
function numOf(t){
  let m;
  if((m=R_DIGIT.exec(t)))return +m[1];
  if((m=R_STD.exec(t)))return SINO[m[1]]||NAT[m[1]];
  if((m=R_DET.exec(t)))return DET[m[1]];
  if((m=R_LET.exec(t)))return LET[m[1]];
  return 0;
}
function parseOne(raw,count,type){
  const t=norm(raw);if(!t)return null;
  if(type==='ox'){
    if(R_X.test(t))return {kind:'ox',v:'X'};
    if(R_O.test(t))return {kind:'ox',v:'O'};
    const n=numOf(t);  // ox에서 1번 = O, 2번 = X (게임 모드 키와 같음)
    if(n===1)return {kind:'ox',v:'O'};
    if(n===2)return {kind:'ox',v:'X'};
    return R_SUBMIT.test(t)?{kind:'submit'}:null;
  }
  const n=numOf(t)||numOf(t.replace(/(?:제출|채점|확인).*$/,''));  // '3번 제출'은 번호 우선
  if(n)return n>=1&&n<=count?{kind:'index',i:n-1}:null;  // 범위 밖이면 다음 후보로
  return R_SUBMIT.test(t)?{kind:'submit'}:null;
}
/* text: 문자열 또는 후보 배열. 범위 안에서 해석되는 첫 후보를 돌려준다 */
function parse(text,opt){
  opt=opt||{};
  const count=opt.count>0?opt.count:4, type=opt.type||'mc';
  const list=Array.isArray(text)?text:[text];
  for(const s of list){const r=parseOne(s,count,type);if(r)return r;}
  return null;
}

/* ── 브라우저 부분 ────────────────────────── */
const hasWin=typeof window!=='undefined';
const SR=()=>hasWin?(window.SpeechRecognition||window.webkitSpeechRecognition):null;
const supported=()=>!!SR();
const canSpeak=()=>hasWin&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';

const ERR={
  'not-allowed':'마이크 권한이 꺼져 있습니다. 주소창의 마이크 아이콘에서 허용하세요.',
  'service-not-allowed':'마이크 권한이 꺼져 있습니다. 주소창의 마이크 아이콘에서 허용하세요.',
  'network':'음성 인식은 인터넷 연결이 필요합니다.',
  'no-speech':'소리가 들리지 않았습니다. 다시 눌러 말해 주세요.',
  'audio-capture':'마이크를 찾을 수 없습니다.'
};
let active=null;  // 지금 듣는 중인 컨트롤러 (동시에 하나만)
function stopListening(){if(active){active.stop();active=null;}}

function describe(r){
  if(r.kind==='index')return `'${r.i+1}번'으로 들었습니다`;
  if(r.kind==='ox')return `'${r.v}'로 들었습니다`;
  return "'제출'로 들었습니다";
}

/* o: {button, live, getOptions, getType, select, submit, lang, bind}
   button·live는 요소 또는 요소를 돌려주는 함수(카드를 다시 그려도 새 요소를 찾도록).
   select(r): r = {kind:'index',i} | {kind:'ox',v}. submit(): 제출. bind:false면 클릭 리스너를 달지 않는다(위임용) */
function attach(o){
  const get=x=>typeof x==='function'?x():x;
  const ctl={listening:false,toggle(){},stop(){}};
  const b0=get(o.button);
  if(!supported()){if(b0)b0.hidden=true;return ctl;}
  const lang=o.lang||'ko-KR';
  let rec=null, done=false;
  function ui(state,msg){
    const b=get(o.button), l=get(o.live);
    if(b){b.dataset.state=state;b.setAttribute('aria-pressed',state==='listening'?'true':'false');}
    if(l&&msg!=null)l.textContent=msg;
  }
  ctl.stop=function(){
    ctl.listening=false;done=true;
    if(rec){try{rec.abort();}catch(e){}rec=null;}
    ui('idle');
  };
  function finish(state,msg){if(done)return;done=true;ctl.listening=false;rec=null;if(active===ctl)active=null;ui(state,msg);}
  function onResult(alts){
    const count=o.getOptions?o.getOptions():4, type=o.getType?o.getType():'mc';
    let r=parse(alts,{count,type});
    if(r&&r.kind==='submit'&&!o.submit)r=null;
    if(!r){
      const heard=(alts[0]||'').trim().slice(0,24);
      const guide=type==='ox'?"'O' 또는 'X'로 말해 주세요.":`1~${count}번 중에서 말해 주세요.`;
      finish('error',heard?`'${heard}'로 들었습니다. ${guide}`:'소리가 들리지 않았습니다. 다시 눌러 말해 주세요.');
      return;
    }
    finish('heard');
    try{if(r.kind==='submit')o.submit();else o.select(r);}catch(e){}
    ui('heard',describe(r));  // select가 카드를 다시 그렸더라도 새 요소에 상태를 적는다
  }
  ctl.toggle=function(){
    if(ctl.listening){ctl.stop();return;}
    stopListening();cancelSpeak();
    const Ctor=SR();
    try{rec=new Ctor();}catch(e){ui('error','음성 인식을 시작할 수 없습니다.');return;}
    done=false;ctl.listening=true;active=ctl;
    rec.lang=lang;rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=5;
    rec.onresult=ev=>{
      const res=ev.results&&ev.results[0], alts=[];
      if(res)for(let i=0;i<res.length;i++)alts.push(res[i].transcript);
      onResult(alts);
    };
    rec.onerror=ev=>{
      if(ev.error==='aborted')return;
      finish('error',ERR[ev.error]||'음성 인식에 실패했습니다. 다시 눌러 주세요.');
    };
    rec.onend=()=>{if(!done)finish('error',ERR['no-speech']);};
    ui('listening','듣는 중…');
    try{rec.start();}catch(e){finish('error','음성 인식을 시작할 수 없습니다. 잠시 뒤 다시 눌러 주세요.');}
  };
  if(o.bind!==false&&b0)b0.addEventListener('click',ctl.toggle);
  return ctl;
}

/* ── 읽어 주기 ────────────────────────────── */
function pickVoice(lang){
  try{
    const vs=speechSynthesis.getVoices();
    return vs.find(v=>v.lang===lang)||vs.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang.slice(0,2).toLowerCase()))||null;
  }catch(e){return null;}
}
function speak(text,lang){
  if(!canSpeak()||!text)return false;
  lang=lang||'ko-KR';
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text));
    u.lang=lang;const v=pickVoice(lang);if(v)u.voice=v;
    speechSynthesis.speak(u);return true;
  }catch(e){return false;}
}
function cancelSpeak(){if(canSpeak()){try{speechSynthesis.cancel();}catch(e){}}}
function isSpeaking(){try{return canSpeak()&&speechSynthesis.speaking;}catch(e){return false;}}

const API={supported,canSpeak,parse,attach,speak,cancelSpeak,isSpeaking,stopListening};
if(hasWin)root.QBVoice=API;
if(typeof module!=='undefined'&&module.exports)module.exports=API;
})(typeof window!=='undefined'?window:globalThis);
</script>

(()=>{
'use strict';
const BANK={"id":"go-d5","code":"GO5","title":"Go 언어 5일차 · net/http·JSON·테스트·디버깅·pprof·CGo","subtitle":"net/http·JSON · 테스트·로깅·디버깅 · pprof·CGo","course":"10 · Go 언어 프로그래밍","source":"10-go_programming-main/Go언어프로그래밍_5일차.md + 솔루션 + 예제코드 + 예제소스/","salt":"go-d5","version":1,"updated":"2026-10-16","tabs":[{"id":"t1","title":"net/http 클라이언트·서버 기초","ref":"5일차 §1.1–1.3 · 예제코드 §1.2-A/B","qs":[{"id":"t1-01","ty":"mc","lv":1,"game":true,"p":"Go에서 HTTP 서버와 HTTP 클라이언트를 모두 제공하는 표준 패키지는?","o":["encoding/xml","net/http","database/sql","regexp"],"a":1,"h":"교안 §1.1 비교표는 C에서 HTTP 서버에 libmicrohttpd, HTTP 클라이언트에 libcurl을 따로 쓰던 것을 Go에서는 한 표준 패키지가 모두 맡는다고 정리합니다. 패키지 경로는 '네트워크' 아래 HTTP 하위 패키지입니다.","w":"<code>net/http<\/code> 하나가 서버와 클라이언트를 모두 제공합니다. <code>encoding/xml<\/code>은 XML, <code>database/sql<\/code>은 DB, <code>regexp<\/code>는 정규식 패키지입니다.","an":"5일차 §1.1 표준 라이브러리 철학 표","src":"| 기능 | C에서 흔한 선택 | Go 표준 라이브러리 |\n|---|---|---|\n| HTTP 서버 | libmicrohttpd, nginx-module | `net/http` |\n| HTTP 클라이언트 | libcurl | `net/http` |\n| JSON"},{"id":"t1-02","ty":"mc","lv":1,"game":true,"p":"<code>http.Get<\/code>으로 응답을 받은 뒤 연결 누수를 막기 위해 반드시 넣어야 하는 코드는?","o":["resp.Flush()","srv.Shutdown(ctx)","cancel()","defer resp.Body.Close()"],"a":3,"h":"http.Get으로 받은 응답의 Body는 네트워크 연결을 붙잡고 있는 스트림입니다. 교안은 에러 검사 직후 defer로 본문을 닫는 줄이 필수이며, 잊으면 연결 누수가 발생한다고 강조합니다.","w":"<code>defer resp.Body.Close()<\/code>는 필수이며 잊으면 연결 누수가 생깁니다. <code>srv.Shutdown<\/code>은 서버 종료, <code>cancel()<\/code>은 Context 취소 함수입니다.","an":"5일차 §1.2 HTTP 클라이언트 GET","src":"resp, err := http.Get(\"https://api.github.com\")\n if err != nil {\n fmt.Println(\"에러:\", err)\n return\n }\n defer resp.Body.Close()\n\n body, err := io.ReadAll(resp.Body)\n if err != nil {\n fmt.Println(\"읽기 실패:\", err)\n return\n }\n\n fmt.Println(\"상태:\", resp.StatusCode)\n fmt.Println(\"길이:\", len(body), \"바이트\")\n}\n```\n\nC로 같은 일을 libcurl로 해본 분이라면 이 짧음에 놀랄 겁니다. **`defer resp.Body.Close()`는 필수**입니다 — 잊으면 연결 누수가 발생합니다."},{"id":"t1-03","ty":"mc","lv":2,"game":true,"p":"핸들러 시그니처 <code>func(w http.ResponseWriter, r *http.Request)<\/code>에서 <code>w<\/code>의 역할은?","o":["요청 URL·헤더를 읽는 곳","서버 주소를 지정하는 곳","응답 본문·헤더·상태 코드를 쓰는 곳","라우팅 경로를 등록하는 곳"],"a":2,"h":"핸들러는 두 매개변수를 받습니다. r은 URL·헤더·본문·메서드·쿼리 같은 요청 정보이고, ResponseWriter 타입의 w는 이름 그대로 클라이언트에게 돌려줄 내용을 '쓰는' 대상입니다.","w":"<code>w<\/code>는 응답(본문, 헤더, 상태 코드)을 쓰는 곳이고, 요청 정보(URL, 헤더, 본문, 메서드, 쿼리)는 <code>r<\/code>에 들어 있습니다.","an":"5일차 §1.3 핸들러의 시그니처 표","src":"### 핸들러의 시그니처\n\n```go\nfunc(w http.ResponseWriter, r *http.Request)\n```\n\n| 매개변수 | 의미 |\n|---|---|\n| `w` | 응답을 쓸 곳 (응답 본문, 헤더, 상태 코드) |\n| `r` | 요청 정보 (URL, 헤더, 본문, 메서드, 쿼리) |\n\nC에서 직접 `accept()` 하고 `recv()` 하고 `send()` 하던 일들이 모두 추상화되어 있습니다."},{"id":"t1-04","ty":"mc","lv":2,"game":true,"p":"<code>http.Get<\/code> 대신 <code>http.Client<\/code>와 <code>http.NewRequest<\/code>를 쓰는 주된 이유는?","o":["타임아웃과 헤더를 제어하려고","JSON을 자동 변환하려고","서버를 함께 띄우려고","Body를 닫지 않아도 돼서"],"a":0,"h":"http.Get은 간단하지만 세부 설정을 할 수 없습니다. 예제는 http.Client{Timeout: 5 * time.Second}로 전체 요청 시간 제한을 두고, http.NewRequest로 만든 요청에 req.Header.Set으로 User-Agent·Authorization 헤더를 넣습니다.","w":"<code>http.Client{Timeout: 5 * time.Second}<\/code>로 타임아웃을 주고 <code>req.Header.Set<\/code>으로 User-Agent·Authorization 헤더를 넣습니다. 이 방식에서도 Body는 닫아야 합니다.","an":"5일차 §1.2 http.Client · 예제소스/p1_client","src":"func fetchWithClient(url, token string) error {\n client := &http.Client{\n Timeout: 5 * time.Second, // 전체 요청 타임아웃\n }\n req, err := http.NewRequest(http.MethodGet, url, nil)\n if err != nil {\n return fmt.Errorf(\"요청 생성 실패: %w\", err)\n }\n req.Header.Set(\"User-Agent\", \"MyApp/1.0\")"},{"id":"t1-05","ty":"mc","lv":3,"game":false,"p":"3초 타임아웃 Context로 5초 걸리는 <code>/slow<\/code>를 요청했습니다. 결과로 옳은 것은?","o":["5초 뒤 '늦은 응답'을 받는다","약 3초 뒤 context deadline exceeded 에러","즉시 404를 받는다","3초 뒤 상태 200을 받는다"],"a":1,"h":"fetchWithTimeout은 context.WithTimeout으로 3초 제한 ctx를 만들어 요청에 싣습니다. /slow는 5초가 걸리므로 ctx가 먼저 만료되어 요청이 자동 취소되며, 검증 결과에 경과 시간과 함께 에러 메시지가 찍힙니다.","w":"예제 실측에서 3.0초 후 <code>context deadline exceeded<\/code> 에러로 자동 취소되었습니다. 서버 핸들러도 <code>r.Context().Done()<\/code>을 보고 즉시 중단합니다.","an":"5일차_예제코드 §1.2-B · 예제소스/p1_client_ctx","src":"**검증 결과**:\n```\n--- 빠른 엔드포인트 (3초 제한) ---\n성공! 상태: 200\n--- 느린 엔드포인트 (3초 제한, 5초 걸림) ---\n3.0초 후 결과: Get \"http://localhost:8081/slow\": context deadline exceeded\n→ context.DeadlineExceeded로 자동 취소 확인!\n```\n> 💡 **강의 포인트**: 에러 비교에 `errors.Is(err, context.DeadlineExceeded)`를 쓰는 것은 4일차 에러 래핑(`%w`) 내용과 직결됩니다. `http.Client`가 ctx 에러를 `*url.Error`로 감싸서 반환하기 때문에 `==` 비교는 실패하고 `errors.Is`의 Unwrap 탐색이 필요합니다."},{"id":"t1-06","ty":"ox","lv":2,"game":true,"p":"<code>http.Client<\/code>가 돌려준 타임아웃 에러는 <code>err == context.DeadlineExceeded<\/code>로 비교하면 항상 참입니다.","a":false,"h":"http.Client는 ctx 만료 에러를 그대로 돌려주지 않고 'Get \"URL\": ...'처럼 다른 에러 타입으로 감싸서 반환합니다. 그래서 예제와 강의 포인트는 == 비교 대신 래핑 사슬을 따라가는 errors.Is를 쓰라고 강조합니다.","w":"<code>http.Client<\/code>는 Context 에러를 <code>*url.Error<\/code>로 감싸 반환하므로 <code>==<\/code> 비교는 실패합니다. Unwrap 탐색을 하는 <code>errors.Is(err, context.DeadlineExceeded)<\/code>를 써야 합니다.","an":"5일차_예제코드 §1.2-B 강의 포인트","src":"> 💡 **강의 포인트**: 에러 비교에 `errors.Is(err, context.DeadlineExceeded)`를 쓰는 것은 4일차 에러 래핑(`%w`) 내용과 직결됩니다. `http.Client`가 ctx 에러를 `*url.Error`로 감싸서 반환하기 때문에 `==` 비교는 실패하고 `errors.Is`의 Unwrap 탐색이 필요합니다."},{"id":"t1-07","ty":"ox","lv":1,"game":true,"p":"<code>http.ListenAndServe<\/code>로 서버를 띄우면 멀티스레딩과 연결 관리는 개발자가 직접 구현해야 합니다.","a":false,"h":"§1.3의 서버는 HandleFunc로 핸들러를 등록하고 http.ListenAndServe(\":8080\", nil) 한 줄로 시작합니다. 교안은 '이게 전부'라며 멀티스레딩, 비동기 I/O, 연결 관리는 net/http가 알아서 처리한다고 설명합니다.","w":"멀티스레딩, 비동기 I/O, 연결 관리는 <code>net/http<\/code>가 알아서 처리합니다. C에서 직접 <code>accept()<\/code>·<code>recv()<\/code>·<code>send()<\/code> 하던 일이 모두 추상화되어 있습니다.","an":"5일차 §1.3 HTTP 서버","src":"# Hello, Go!\n```\n\n**이게 전부입니다.** 멀티스레딩, 비동기 I/O, 연결 관리 모두 알아서 처리됩니다."},{"id":"t1-08","ty":"match","lv":1,"game":false,"p":"C에서 흔히 쓰던 외부 라이브러리와 이를 대신하는 Go 표준 패키지를 연결하세요.","pairs":[["libcurl","net/http"],["cJSON","encoding/json"],["libxml2","encoding/xml"],["OpenSSL","crypto/*"],["PCRE","regexp"]],"h":"§1.1 비교표를 기능별로 맞추면 됩니다. HTTP 클라이언트 libcurl, JSON cJSON, XML libxml2, 암호화 OpenSSL, 정규식 PCRE가 각각 net/http, encoding/json, encoding/xml, crypto/*, regexp에 대응합니다.","w":"Go는 'Batteries Included' 철학으로 HTTP, JSON, XML, 암호화, 정규식을 표준 라이브러리에 내장합니다. 외부 의존성을 최소화할 수 있다는 점이 큰 매력입니다.","an":"5일차 §1.1 표준 라이브러리 비교표","src":"| 기능 | C에서 흔한 선택 | Go 표준 라이브러리 |\n|---|---|---|\n| HTTP 서버 | libmicrohttpd, nginx-module | `net/http` |\n| HTTP 클라이언트 | libcurl | `net/http` |\n| JSON | cJSON, jansson | `encoding/json` |\n| XML | libxml2 | `encoding/xml` |\n| 암호화 | OpenSSL | `crypto/*` |\n| 압축 | zlib | `compress/*` |\n| 정규식 | PCRE | `regexp` |\n| 데이터베이스"},{"id":"t1-09","ty":"order","lv":2,"game":false,"p":"<code>http.Client<\/code>로 헤더를 넣어 요청하는 순서대로 나열하세요.","steps":["Timeout을 지정해 http.Client 생성","http.NewRequest로 요청 객체 생성","req.Header.Set으로 헤더 설정","client.Do(req)로 요청 전송","defer resp.Body.Close() 후 io.ReadAll"],"h":"fetchWithClient는 Timeout을 지정한 http.Client를 만들고, http.NewRequest로 요청 객체를 생성한 뒤 req.Header.Set으로 헤더를 넣습니다. 이어 client.Do(req)로 전송하고, 응답 Body를 defer로 닫은 다음 io.ReadAll로 읽습니다.","w":"클라이언트와 요청 객체를 먼저 만들고 헤더를 설정한 뒤 <code>client.Do<\/code>로 보냅니다. 응답을 받으면 Body 닫기를 예약하고 본문을 읽습니다.","an":"5일차_예제코드 §1.2-A · 예제소스/p1_client","src":"func fetchWithClient(url, token string) error {\n client := &http.Client{\n Timeout: 5 * time.Second, // 전체 요청 타임아웃\n }\n req, err := http.NewRequest(http.MethodGet, url, nil)\n if err != nil {\n return fmt.Errorf(\"요청 생성 실패: %w\", err)\n }\n req.Header.Set(\"User-Agent\", \"MyApp/1.0\")\n req.Header.Set(\"Authorization\", \"Bearer \"+token)\n resp, err := client.Do(req)\n if err != nil {"},{"id":"t1-10","ty":"multi","lv":3,"game":false,"p":"1.3절 서버에서 <code>curl 'http://localhost:8080/hello?name=Go'<\/code>를 실행했을 때의 설명으로 옳은 것을 모두 고르세요.","o":["쿼리 name 값을 읽어 응답에 쓴다","/hello 경로가 HandleFunc로 등록돼 있다","응답 본문은 Hello, Go!이다","핸들러가 값을 return해 응답한다","POST 요청만 처리된다"],"a":[0,1,2],"h":"helloHandler는 r.URL.Query().Get(\"name\")으로 쿼리 값을 읽어 fmt.Fprintf(w, \"Hello, %s!\", ...)로 응답에 씁니다. main은 /hello 경로를 HandleFunc로 등록하므로 name=Go를 넣으면 그 값이 %s 자리에 들어갑니다.","w":"<code>r.URL.Query().Get('name')<\/code>으로 값을 읽고 <code>fmt.Fprintf(w, ...)<\/code>로 응답에 써서 'Hello, Go!'가 나옵니다. 핸들러는 반환값 없이 <code>w<\/code>에 쓰고, 메서드 제한도 없습니다.","an":"5일차 §1.3 · 예제소스/p1_server","src":"func helloHandler(w http.ResponseWriter, r *http.Request) {\n fmt.Fprintf(w, \"Hello, %s!\", r.URL.Query().Get(\"name\"))\n}\n\nfunc main() {\n http.HandleFunc(\"/hello\", helloHandler)\n fmt.Println(\"서버 시작: http://localhost:8080\")\n http.ListenAndServe(\":8080\", nil)\n}"}]},{"id":"t2","title":"라우팅·미들웨어·Graceful Shutdown","ref":"5일차 §1.4–1.6 · 예제코드 §1.4–1.6","qs":[{"id":"t2-01","ty":"mc","lv":1,"game":true,"p":"Go 1.22+ 라우팅 <code>GET /users/{id}<\/code>에서 핸들러가 id 값을 꺼내는 방법은?","o":["r.PathValue('id')","r.URL.Query().Get('id')","r.Header.Get('id')","r.Context().Value('id')"],"a":0,"h":"Go 1.22+ 라우팅은 \"GET /users/{id}\"처럼 패턴에 경로 변수를 둘 수 있습니다. 핸들러는 *http.Request의 메서드로 그 값을 꺼내며, 메서드 이름은 '경로(Path)'의 '값(Value)'이라는 뜻입니다.","w":"path parameter는 <code>r.PathValue('id')<\/code>로 추출합니다. <code>URL.Query()<\/code>는 쿼리 문자열, <code>Header.Get<\/code>은 요청 헤더를 읽습니다.","an":"5일차 §1.4 · 예제소스/p1_routing","src":"func getUser(w http.ResponseWriter, r *http.Request) {\n id := r.PathValue(\"id\") // path parameter 추출\n fmt.Fprintf(w, \"User ID: %s\\n\", id)\n}\nfunc updateUser(w http.ResponseWriter, r *http.Request) {\n fmt.Fprintf(w, \"User %s 수정됨\\n\", r.PathValue(\"id\"))"},{"id":"t2-02","ty":"mc","lv":2,"game":true,"p":"<code>GET /users<\/code>와 <code>POST /users<\/code>만 등록된 ServeMux에 <code>PATCH /users<\/code>를 보내면 받는 상태 코드는?","o":["404","400","405","501"],"a":2,"h":"Go 1.22+ ServeMux에 GET·POST /users만 등록하면 경로는 존재하지만 PATCH 메서드는 매칭되지 않습니다. 강의 포인트는 이런 경우 404가 아니라 '메서드 허용 안 됨'을 뜻하는 상태 코드를 자동으로 반환한다고 설명합니다.","w":"새 라우팅은 경로가 있고 메서드만 다르면 404가 아닌 <b>405 Method Not Allowed<\/b>를 자동으로 반환합니다. 예전처럼 메서드 분기를 직접 짤 때 흔히 빠뜨리던 부분입니다.","an":"5일차_예제코드 §1.4 강의 포인트","src":"> 💡 **강의 포인트**: 마지막 405가 새 라우팅의 숨은 장점입니다. 경로는 있는데 메서드만 다르면 404가 아닌 **405를 자동으로** 반환합니다 — 예전처럼 `if r.Method != ...` 분기를 직접 짤 때 흔히 빠뜨리던 부분입니다."},{"id":"t2-03","ty":"mc","lv":1,"game":true,"p":"핸들러를 감싸 로깅·인증 같은 공통 로직을 처리하는 미들웨어는 어떤 패턴에 해당합니까?","o":["싱글턴 패턴","옵저버 패턴","팩토리 패턴","데코레이터 패턴"],"a":3,"h":"미들웨어는 func(http.Handler) http.Handler 타입으로, 기존 핸들러를 바꾸지 않고 바깥을 감싸 로깅·인증 같은 기능을 덧붙입니다. 객체를 감싸 책임을 추가하는 이 구조는 GoF 디자인 패턴 중 하나와 같습니다.","w":"미들웨어는 <code>http.Handler<\/code>를 받아 다른 <code>http.Handler<\/code>를 돌려주는 <b>데코레이터 패턴<\/b>입니다. 함수가 일급 객체인 Go의 특성을 활용합니다.","an":"5일차 §1.5 미들웨어 패턴","src":"핸들러를 감싸는 함수로 공통 로직(로깅, 인증, 압축 등)을 처리합니다.\n\n```go\ntype Middleware func(http.Handler) http.Handler\n\nfunc logging(next http.Handler) http.Handler {\n return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n start := time.Now()\n next.ServeHTTP(w, r)\n log.Printf"},{"id":"t2-04","ty":"mc","lv":3,"game":true,"p":"<code>handler := logging(auth(mux))<\/code> 서버에 Authorization 헤더 없이 요청하면 어떻게 됩니까?","o":["200 응답, 로그 기록됨","401 응답, 로그도 기록됨","401 응답, 로그는 없음","500 응답, 로그 기록됨"],"a":1,"h":"logging(auth(mux))에서 요청은 바깥 logging → auth → mux 순으로 들어갑니다. auth는 Authorization 헤더가 비면 http.Error로 Unauthorized를 쓰고 return하며, logging은 next.ServeHTTP가 끝난 뒤 로그를 남기므로 그 요청도 기록됩니다.","w":"auth가 401로 체인을 끊어도 바깥쪽 logging은 <code>next.ServeHTTP<\/code>가 돌아온 뒤 <code>log.Printf<\/code>를 실행합니다. 그래서 두 요청 모두 서버 로그에 기록됩니다.","an":"5일차_예제코드 §1.5 · 예제소스/p1_middleware","src":"// 2. 인증 미들웨어: 헤더에 Authorization 값이 있는지 검증합니다.\nfunc auth(next http.Handler) http.Handler {\n return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n token := r.Header.Get(\"Authorization\")\n if token == \"\" {\n // 토큰이 없으면 401 에러를 반환하고 체인을 중단합니다.\n http.Error(w, \"인증되지 않은 요청입니다. (Unauthorized)\", http.StatusUnauthorized)\n return\n }\n // 토큰이 있으면 다음 핸들러로 진행\n next.ServeHTTP(w, r)\n })\n}"},{"id":"t2-05","ty":"mc","lv":3,"game":false,"p":"Graceful Shutdown 예제에서 <code>srv.Shutdown(ctx)<\/code>를 <code>srv.Close()<\/code>로 바꾸고 2초짜리 요청 중에 SIGTERM을 보내면?","o":["요청이 끝난 뒤 종료된다","10초 뒤에만 종료된다","진행 중 요청이 connection reset으로 실패한다","새 연결을 계속 받는다"],"a":2,"h":"srv.Shutdown(ctx)은 새 연결을 거부하고 진행 중인 요청이 끝날 때까지 기다립니다. 예제코드의 검증 절차는 이를 srv.Close()로 바꾸면 2초짜리 요청을 기다리지 않고 즉시 연결을 끊어 curl이 실패한다고 설명합니다.","w":"<code>Close()<\/code>는 즉시 닫으므로 curl이 <code>connection reset<\/code>으로 실패합니다. <code>Shutdown<\/code>은 진행 중 요청이 끝날 때까지 기다린 뒤 종료합니다.","an":"5일차_예제코드 §1.6 · day5/GracefulShutdown.go","src":"`srv.Close()`로 바꿔서 다시 실행해 보면 curl이 `connection reset`으로 실패합니다 — Shutdown과 Close의 차이를 체감시키기 좋은 비교 실습입니다.\n\n---"},{"id":"t2-06","ty":"ox","lv":1,"game":true,"p":"Go 1.22+ 표준 ServeMux는 경로만 구분하므로 메서드 분기는 여전히 직접 작성해야 합니다.","a":false,"h":"Go 1.22+ 새 라우팅 문법은 mux.HandleFunc(\"GET /users\", listUsers)처럼 패턴 문자열 앞에 HTTP 메서드를 함께 적습니다. 그래서 같은 경로라도 메서드별로 다른 핸들러를 등록할 수 있습니다.","w":"Go 1.22부터 <code>'GET /users'<\/code>, <code>'POST /users'<\/code>처럼 메서드와 경로를 함께 등록할 수 있습니다. 그래서 gorilla/mux, chi 같은 외부 라이브러리 없이도 충분합니다.","an":"5일차 §1.4 Go 1.22+ 라우팅","src":"### Go 1.22+ — 새 라우팅 문법\n\n```go\nmux := http.NewServeMux()\n\nmux.HandleFunc(\"GET /users\", listUsers)\nmux.HandleFunc(\"POST /users\", createUser)\nmux.HandleFunc(\"GET /users/{id}\", getUser)\nmux.HandleFunc(\"PUT /users/{id}\", updateUser)\nmux.HandleFunc(\"DELETE /users/{id}\", deleteUser)\n\nhttp.ListenAndServe(\":8080\", mux)\n```\n\n핸들러 안에서 path parameter 추출:\n\n```go"},{"id":"t2-07","ty":"ox","lv":2,"game":false,"p":"Shutdown 뒤 <code>ListenAndServe<\/code>가 <code>http.ErrServerClosed<\/code>를 반환하는 것은 정상 종료이므로 <code>log.Fatal<\/code> 대상에서 뺍니다.","a":true,"h":"Graceful Shutdown 예제는 서버를 고루틴에서 시작하고, srv.ListenAndServe()의 에러가 nil이 아니면서 http.ErrServerClosed도 아닐 때만 log.Fatal합니다. Shutdown 후 돌아오는 ErrServerClosed는 의도한 종료이기 때문입니다.","w":"예제는 <code>err != http.ErrServerClosed<\/code>일 때만 <code>log.Fatal<\/code>을 호출합니다. Shutdown으로 닫힌 서버는 이 에러를 돌려주므로 정상 흐름으로 취급합니다.","an":"5일차 §1.6 Graceful Shutdown 코드","src":"// 서버를 고루틴에서 시작\n go func() {\n if err := srv.ListenAndServe(); err != nil && err != http.ErrServerClosed {\n log.Fatal(err)\n }\n }()\n log.Println(\"서버 시작\")"},{"id":"t2-08","ty":"match","lv":2,"game":false,"p":"미들웨어·종료 관련 요소와 역할을 연결하세요.","pairs":[["logging","메서드·경로·처리 시간 기록"],["auth","Authorization 없으면 401"],["chain 헬퍼","미들웨어를 역순으로 감싸 괄호 지옥 해소"],["signal.Notify","SIGINT·SIGTERM을 채널로 수신"],["srv.Shutdown","새 연결 거부 후 진행 요청 대기"]],"h":"logging은 메서드·경로·처리 시간을 기록하고, auth는 Authorization 헤더가 없으면 401을 반환합니다. chain 헬퍼는 미들웨어를 역순으로 감싸 중첩 괄호를 없애고, signal.Notify는 시그널을 채널로 받으며, srv.Shutdown은 새 연결을 거부하고 진행 요청을 기다립니다.","w":"logging은 처리 시간을, auth는 토큰 유무를 검사합니다. <code>chain(h, logging, auth)<\/code>는 <code>logging(auth(h))<\/code>와 같고, signal.Notify와 Shutdown은 운영 종료 흐름을 담당합니다.","an":"5일차 §1.5–1.6 · 예제소스/p1_middleware","src":"// 1. 로깅 미들웨어: 요청의 메서드, URL, 처리 시간을 기록합니다.\nfunc logging(next http.Handler) http.Handler {\n return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n start := time.Now()\n // 다음 핸들러(또는 미들웨어) 호출\n next.ServeHTTP(w, r)\n // 처리가 끝난 후 로그 출력\n log.Printf(\"[%s] %s - %v\", r.Method, r.URL.Path, time.Since(start))\n })\n}\n// 2. 인증 미들웨어: 헤더에 Authorization 값이 있는지 검증합니다."},{"id":"t2-09","ty":"order","lv":2,"game":false,"p":"Graceful Shutdown 예제 main 함수의 흐름을 순서대로 나열하세요.","steps":["고루틴에서 srv.ListenAndServe 시작","signal.Notify로 SIGINT·SIGTERM 등록","시그널 채널에서 수신 대기","context.WithTimeout으로 10초 제한 생성","srv.Shutdown(ctx) 호출"],"h":"GracefulShutdown.go는 서버를 고루틴에서 ListenAndServe로 시작하고, signal.Notify로 SIGINT·SIGTERM을 등록해 <-sigs로 기다립니다. 신호가 오면 context.WithTimeout으로 10초 제한을 만들고 srv.Shutdown(ctx)를 호출합니다.","w":"서버는 고루틴에서 돌고, main은 시그널을 기다립니다. 신호를 받으면 10초 제한 Context를 만들어 <code>Shutdown<\/code>에 넘기고, 시간이 넘으면 강제 종료됩니다.","an":"5일차 §1.6 · day5/GracefulShutdown.go","src":"// 서버를 고루틴에서 시작\n go func() {\n if err := srv.ListenAndServe(); err != nil && err != http.ErrServerClosed {\n log.Fatal(err)\n }\n }()\n log.Println(\"서버 시작\")\n\n // 종료 시그널 대기\n sigs := make(chan os.Signal, 1)\n signal.Notify(sigs, syscall.SIGINT, syscall.SIGTERM)\n <-sigs\n\n log.Println(\"종료 시작...\")\n ctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)\n defer cancel()"},{"id":"t2-10","ty":"multi","lv":1,"game":true,"p":"<code>srv.Shutdown(ctx)<\/code>가 하는 일을 모두 고르세요.","o":["새 연결을 거부한다","활성 요청 완료까지 기다린다","ctx가 만료되면 강제 종료한다","진행 중 연결을 즉시 끊는다","프로세스에 SIGTERM을 보낸다"],"a":[0,1,2],"h":"교안은 srv.Shutdown(ctx)의 동작을 세 줄로 정리합니다. 새 연결은 받지 않고, 이미 활성인 연결의 요청 처리가 끝날 때까지 기다리며, 넘겨준 ctx가 만료되면 그때는 강제로 종료합니다.","w":"Shutdown은 새 연결 거부, 활성 요청 완료 대기, ctx 만료 시 강제 종료를 합니다. 연결을 즉시 끊는 것은 Close의 동작이고, SIGTERM은 운영 환경이 보내는 신호입니다.","an":"5일차 §1.6 srv.Shutdown 설명","src":"- 새 연결 거부\n- 활성 연결의 요청 처리 완료까지 대기\n- ctx 만료되면 강제 종료"}]},{"id":"t3","title":"JSON 기본·구조체 태그·동적 JSON","ref":"5일차 §2.1–2.3 · 예제코드 §2.1–2.3","qs":[{"id":"t3-01","ty":"mc","lv":1,"game":true,"p":"Go 구조체 값을 JSON 바이트로 바꾸는 함수는?","o":["json.Unmarshal","json.Marshal","json.NewDecoder","decoder.Token"],"a":1,"h":"encoding/json은 두 방향 함수를 제공합니다. Go 구조체를 JSON 바이트로 바꾸는 직렬화 함수와, JSON 바이트를 Go 구조체로 되돌리는 역직렬화 함수(Unmarshal)이며, 예제는 u를 넘겨 받은 data를 string으로 출력합니다.","w":"<code>json.Marshal<\/code>은 Go 값을 JSON으로, <code>json.Unmarshal<\/code>은 JSON을 Go 값으로 바꿉니다. <code>NewDecoder<\/code>는 스트림 디코딩에 씁니다.","an":"5일차 §2.1 Marshal / Unmarshal","src":"// 1. Go 구조체 ➡️ JSON 문자열 (직렬화 / Marshal)\n u := User{ID: 1, Name: \"Alice\", Age: 30}\n data, _ := json.Marshal(u)\n fmt.Println(\"--- 1. Go 구조체를 JSON으로 변환 ---\")\n fmt.Println(string(data))\n // 출력: {\"id\":1,\"name\":\"Alice\",\"age\":30}"},{"id":"t3-02","ty":"mc","lv":2,"game":true,"p":"<code>Age int<\/code>에 <code>omitempty<\/code> 태그가 있고 Age가 0인 User를 Marshal하면 생략되는 키는?","o":["id","name","모두 출력된다","age"],"a":3,"h":"User 구조체의 Age 필드 태그는 `json:\"age,omitempty\"`입니다. omitempty는 필드가 zero value(int라면 0)일 때 JSON 출력에서 그 키를 빼라는 옵션이므로, Age가 0이면 해당 태그 이름의 키가 사라집니다.","w":"<code>omitempty<\/code>는 zero value면 키를 생략합니다. 예제에서 Age=0인 값을 다시 Marshal하면 <code>age<\/code> 없이 id와 name만 나옵니다.","an":"5일차_예제코드 §2.1 · 예제소스/p2_marshal","src":"type User struct {\n ID int `json:\"id\"`\n Name string `json:\"name\"`\n Age int `json:\"age,omitempty\"`"},{"id":"t3-03","ty":"mc","lv":1,"game":true,"p":"비밀번호처럼 JSON에서 <b>항상 제외<\/b>할 필드에 쓰는 json 태그 값은?","o":["-","omitempty",",string","private"],"a":0,"h":"§2.2 옵션 표는 json 태그 값별 효과를 정리합니다. 필드명 지정, omitempty(zero value면 생략), 숫자의 문자열 인코딩과 함께, 비밀번호처럼 JSON에 절대 나가면 안 되는 필드에 붙이는 한 글자 기호 태그가 있습니다.","w":"태그 값 <code>-<\/code>는 항상 제외합니다. <code>omitempty<\/code>는 zero value일 때만 생략하므로 값이 있으면 그대로 노출됩니다.","an":"5일차 §2.2 구조체 태그 표","src":"| 옵션 | 효과 |\n|---|---|\n| `\"name\"` | JSON 필드명을 `name`으로 |\n| `\"name,omitempty\"` | zero value면 생략 |\n| `\"-\"` | 항상 제외 (예: 비밀번호) |\n| `\",string\"` | 숫자를 문자열로 인코딩 (JS의 큰 정수 문제) |"},{"id":"t3-04","ty":"mc","lv":2,"game":true,"p":"json 태그의 <code>,string<\/code> 옵션을 쓰는 이유는?","o":["필드를 항상 제외하려고","필드명을 바꾸려고","큰 정수를 문자열로 보내려고","빈 값을 생략하려고"],"a":2,"h":"JavaScript의 Number는 2^53보다 큰 정수를 정확히 표현하지 못합니다. §2.2 표의 ,string 옵션은 숫자를 따옴표로 감싼 문자열로 인코딩해 'JS의 큰 정수 문제'를 피하며, 예제의 big_num도 그렇게 출력됩니다.","w":"<code>,string<\/code>은 숫자를 문자열로 인코딩합니다. 예제의 9007199254740993처럼 JS의 큰 정수 문제를 피하려고 따옴표로 감쌉니다.","an":"5일차 §2.2 · 예제소스/p2_tags","src":"| 옵션 | 효과 |\n|---|---|\n| `\"name\"` | JSON 필드명을 `name`으로 |\n| `\"name,omitempty\"` | zero value면 생략 |\n| `\"-\"` | 항상 제외 (예: 비밀번호) |\n| `\",string\"` | 숫자를 문자열로 인코딩 (JS의 큰 정수 문제) |"},{"id":"t3-05","ty":"mc","lv":3,"game":true,"p":"<code>map[string]any<\/code>로 <code>{'age':30}<\/code>을 디코딩한 뒤 <code>data['age'].(int)<\/code>를 실행하면?","o":["30이 int로 반환된다","0이 반환된다","컴파일 에러가 난다","panic이 발생한다"],"a":3,"h":"JSON 표준에는 정수·실수 구분이 없어서 map[string]any로 디코딩하면 모든 숫자가 float64로 들어갑니다. 실제 타입이 float64인 값을 .(int)로 단언하면 comma-ok 없이 쓸 때 interface conversion 오류가 납니다.","w":"동적 JSON의 숫자는 모두 <code>float64<\/code>로 디코딩되므로 <code>.(int)<\/code> 단언은 'interface conversion' panic을 냅니다. <code>.(float64)<\/code>로 받거나 comma-ok로 확인합니다.","an":"5일차 §2.3 float64 함정 · 예제소스/p2_dynamic","src":"**테스트 방법**: `go run .`. 함정을 직접 체험시키려면 comma-ok를 지우고 `data[\"age\"].(int)`로 바꿔 재실행 → `interface conversion: interface {} is float64, not int` panic을 관찰."},{"id":"t3-06","ty":"ox","lv":1,"game":true,"p":"소문자로 시작하는 구조체 필드도 json 태그를 붙이면 직렬화됩니다.","a":false,"h":"json 패키지는 외부 패키지라서 reflection으로 필드를 봅니다. Go 가시성 규칙상 소문자로 시작하는 필드는 다른 패키지에서 보이지 않으므로, 태그를 붙여도 Bad 예제의 name 필드는 출력에 나타나지 않습니다.","w":"소문자 필드는 unexported라 <code>json<\/code> 패키지가 볼 수 없어 태그가 있어도 빠집니다. 예제에서 <code>Bad<\/code>는 age만 출력됩니다.","an":"5일차 §2.2 가시성 규칙","src":"### 가시성 규칙\n\n`json` 패키지는 **외부 패키지**이므로 reflection으로 필드를 봅니다. **소문자 필드는 안 보입니다.**\n\n```go\ntype Bad struct {\n name string `json:\"name\"` // ❌ 직렬화 안 됨 (소문자)\n Age int `json:\"age\"` // ✅ OK\n}\n```\n\nC 코드에서 옮길 때 자주 빠지는 실수입니다."},{"id":"t3-07","ty":"ox","lv":2,"game":true,"p":"JSON 표준에는 정수와 실수 구분이 없어서 <code>map[string]any<\/code>로 받은 숫자는 <code>float64<\/code>가 됩니다.","a":true,"h":"§2.3 함정 절은 map[string]any로 받은 숫자를 .(float64)로 꺼내야 하고 .(int)는 panic이 난다고 보여 줍니다. 교안은 그 이유를 JSON 표준 자체에 정수와 실수의 구분이 없기 때문이라고 설명합니다.","w":"JSON 표준에 정수·실수 구분이 없기 때문에 모두 <code>float64<\/code>로 디코딩됩니다. 정수가 필요하면 변환하거나 구조체에 명시적 타입을 정의합니다.","an":"5일차 §2.3 함정","src":"### 🔥 함정 — 모든 숫자는 `float64`로 디코딩\n\n```go\nn := data[\"age\"].(float64) // ✅\nn := data[\"age\"].(int) // ❌ panic\n```\n\n이는 JSON 표준에 정수와 실수 구분이 없기 때문입니다. 정수가 필요하면 변환하거나, 구조체에 명시적 타입을 정의하세요."},{"id":"t3-08","ty":"match","lv":1,"game":false,"p":"json 태그 옵션과 효과를 연결하세요.","pairs":[["name","JSON 필드명을 name으로"],["name,omitempty","zero value면 생략"],["-","항상 제외"],[",string","숫자를 문자열로 인코딩"]],"h":"§2.2 옵션 표에서 \"name\"은 JSON 필드명 지정, \"name,omitempty\"는 zero value일 때 생략, \"-\"는 항상 제외(비밀번호 등), \",string\"은 숫자를 문자열로 인코딩하는 옵션입니다.","w":"이름만 쓰면 필드명 지정, omitempty는 zero value 생략, -는 항상 제외, ,string은 숫자를 문자열로 바꿉니다.","an":"5일차 §2.2 옵션 표","src":"| 옵션 | 효과 |\n|---|---|\n| `\"name\"` | JSON 필드명을 `name`으로 |\n| `\"name,omitempty\"` | zero value면 생략 |\n| `\"-\"` | 항상 제외 (예: 비밀번호) |\n| `\",string\"` | 숫자를 문자열로 인코딩 (JS의 큰 정수 문제) |"},{"id":"t3-09","ty":"order","lv":2,"game":false,"p":"JSON 문자열을 User 구조체로 바꾸는 과정을 순서대로 나열하세요.","steps":["JSON 문자열 준비","var u2 User로 변수 선언","json.Unmarshal([]byte(s), &u2) 호출","반환된 err 확인","%+v로 결과 출력"],"h":"Unmarshal 예제는 JSON 문자열 jsonStr을 준비하고 var u2 User로 받을 변수를 선언한 뒤, json.Unmarshal([]byte(jsonStr), &u2)처럼 변수의 주소를 넘깁니다. 반환된 err를 확인한 다음 %+v로 필드 이름과 값을 출력합니다.","w":"받을 변수를 먼저 선언하고 <code>[]byte<\/code>로 바꾼 JSON과 변수 주소를 <code>Unmarshal<\/code>에 넘깁니다. 에러를 확인한 뒤 <code>%+v<\/code>로 필드명을 포함해 출력합니다.","an":"5일차_예제코드 §2.1 · 예제소스/p2_marshal","src":"// 2. JSON 문자열 ➡️ Go 구조체 (역직렬화 / Unmarshal)\n jsonStr := `{\"id\":2,\"name\":\"Bob\"}`\n var u2 User\n _ = json.Unmarshal([]byte(jsonStr), &u2)\n fmt.Println(\"--- 2. JSON을 Go 구조체로 변환 ---\")\n fmt.Printf(\"%+v\\n\", u2)"},{"id":"t3-10","ty":"multi","lv":3,"game":true,"p":"구조체 태그 예제를 실행한 결과로 옳은 것을 모두 고르세요.","o":["password 키가 아예 없다","빈 email은 생략된다","big_num이 따옴표로 감싸진다","created_at 키가 생략된다","Bad 출력에 name이 포함된다"],"a":[0,1,2],"h":"구조체 태그 예제의 테스트 방법은 출력에서 확인할 네 가지를 나열합니다. \"-\" 태그 필드의 키 유무, omitempty가 붙은 빈 필드의 생략, ,string 옵션 필드의 따옴표, 그리고 소문자 필드의 누락입니다.","w":"Password는 <code>-<\/code>로 제외, 빈 Email은 omitempty로 생략, BigNum은 <code>,string<\/code>으로 문자열이 됩니다. created_at은 옵션이 없어 출력되고, Bad의 소문자 name은 빠집니다.","an":"5일차_예제코드 §2.2 · 예제소스/p2_tags","src":"**테스트 방법**: `go run .` — 출력에서 ① `password` 키 자체가 없음, ② `email` 생략, ③ `big_num`이 따옴표로 감싸짐, ④ `Bad`에서 `name` 누락, 4가지를 확인합니다.\n**검증 결과**:\n```json\n{\n \"id\": 1,\n \"name\": \"Alice\",\n \"created_at\": \"2026-01-01T00:00:00Z\",\n \"big_num\": \"9007199254740993\"\n}\n{\"age\":10}\n```"}]},{"id":"t4","title":"커스텀 직렬화·스트리밍·핸들러 JSON","ref":"5일차 §2.4–2.7 · 예제코드 §2.4–2.7","qs":[{"id":"t4-01","ty":"mc","lv":1,"game":true,"p":"기가바이트급 JSON 배열을 항목 단위로 읽어 메모리 부담을 줄일 때 쓰는 것은?","o":["json.Unmarshal","json.MarshalIndent","json.NewDecoder","base64.StdEncoding"],"a":2,"h":"json.Unmarshal은 입력 전체를 메모리에 올립니다. 큰 파일이나 스트림에는 json 패키지의 디코더 생성 함수로 Decoder를 만들고, Token()·More()·Decode()로 배열 항목을 하나씩 읽어 처리합니다.","w":"<code>json.Unmarshal<\/code>은 전체를 메모리에 올리므로 큰 파일이나 스트림에는 <code>json.NewDecoder<\/code>로 항목마다 Decode합니다.","an":"5일차 §2.5 스트리밍 디코딩","src":"## 2.5 스트리밍 디코딩 — 대용량 JSON\n\n`json.Unmarshal`은 전체를 메모리에 올립니다. 큰 파일이나 스트림에선 `json.Decoder`를 씁니다.\n\n```go\nfile, _ := os.Open(\"huge.json\")\ndefer file.Close()\n\ndecoder := json.NewDecoder(file)\n\n// 배열의 시작 토큰 읽기\ndecoder.Token() // [\n\nfor decoder.More() {\n var item Item\n if err := decoder.Decode(&item); err != nil {\n log.Fatal(err)\n }\n process(item)\n}\n```\n\n기가바이트급 JSON도 메모리 부담 없이 처리할 수 있습니다."},{"id":"t4-02","ty":"mc","lv":2,"game":true,"p":"<code>Money(1234)<\/code>를 Marshal하면 나오는 JSON 값은? (MarshalJSON이 cents를 달러 문자열로 바꿉니다)","o":["숫자 1234","문자열 '12.34'","숫자 12.34","문자열 '1234'"],"a":1,"h":"Money는 cents 단위 int64이고, MarshalJSON은 float64(m) / 100을 %.2f로 포맷한 뒤 백틱 문자열 안에서 따옴표로 감싸 반환합니다. 1234를 100으로 나눈 값이 소수점 둘째 자리까지, JSON 문자열 형태로 나옵니다.","w":"MarshalJSON은 1234 cents를 100으로 나눠 <code>'12.34'<\/code> 문자열로 만듭니다. 그래서 Product는 price가 '12.34'로 직렬화됩니다.","an":"5일차 §2.4 · 예제소스/p2_money","src":"// MarshalJSON: Go 구조체 ➡️ JSON 문자열\n// 내부 정수형 cents 데이터를 소수점이 있는 문자열 형태로 변환합니다. (예: 1234 ➡️ \"12.34\")\nfunc (m Money) MarshalJSON() ([]byte, error) {\n dollars := float64(m) / 100\n return []byte(fmt.Sprintf(`\"%.2f\"`, dollars)), nil\n}"},{"id":"t4-03","ty":"mc","lv":2,"game":true,"p":"2.6 createUser 핸들러가 정상 처리했을 때 응답 상태 코드는?","o":["201 Created","200 OK","204 No Content","400 Bad Request"],"a":0,"h":"createUser는 요청을 디코딩·검증한 뒤 응답 구조체를 만들고 Content-Type을 application/json으로 설정합니다. 그 다음 w.WriteHeader에 http.StatusCreated를 넘기는데, 새 자원을 '만들었다'는 의미의 2xx 상태 코드입니다.","w":"성공 시 <code>w.WriteHeader(http.StatusCreated)<\/code>로 201을 보냅니다. 400은 JSON 디코딩 실패나 name 누락일 때 보냅니다.","an":"5일차 §2.6 · 예제소스/p2_handler","src":"// 응답 인코딩하여 클라이언트에게 전송\n w.Header().Set(\"Content-Type\", \"application/json\")\n w.WriteHeader(http.StatusCreated) // 201 Created 응답 코드 설정\n json.NewEncoder(w).Encode(resp)"},{"id":"t4-04","ty":"mc","lv":1,"game":true,"p":"Go 전용의 효율적인 바이너리 인코딩 패키지는?","o":["encoding/csv","encoding/xml","encoding/base64","encoding/gob"],"a":3,"h":"§2.7은 JSON 외에 CSV, XML, Base64와 함께 Go 값끼리 주고받을 때 쓰는 바이너리 인코딩을 소개합니다. 예제는 gob.NewEncoder(&buf).Encode(Point{3, 4})로 인코딩해 크기를 찍고 gob.NewDecoder로 복원합니다.","w":"<code>encoding/gob<\/code>은 Go 전용 바이너리 형식입니다. 예제에서 Point{3, 4}를 39바이트로 인코딩한 뒤 복원했습니다.","an":"5일차 §2.7 · 예제소스/p2_encodings","src":"// --- Gob (Go 전용 바이너리) ---\n fmt.Println(\"--- Gob ---\")\n var buf bytes.Buffer\n type Point struct{ X, Y int }\n gob.NewEncoder(&buf).Encode(Point{3, 4})\n fmt.Println(\"gob 크기:\", buf.Len(), \"바이트\")\n var pt Point\n gob.NewDecoder(&buf).Decode(&pt)\n fmt.Printf(\"복원: %+v\\n\", pt)"},{"id":"t4-05","ty":"mc","lv":3,"game":true,"p":"<code>csv.NewWriter(os.Stdout)<\/code>로 두 줄을 Write한 뒤 <code>Flush()<\/code>를 빠뜨리면?","o":["출력이 사라질 수 있다","자동으로 XML로 바뀐다","컴파일 에러가 난다","두 번씩 출력된다"],"a":0,"h":"csv.Writer는 Write할 때마다 바로 출력하지 않고 내부 버퍼에 모아 둡니다. 강의 포인트는 마지막에 Flush()를 호출하지 않으면 버퍼에 남은 데이터가 쓰이지 않는다고 경고하며, CGo의 stdio 버퍼링 함정과 연결합니다.","w":"<code>csv.Writer<\/code>는 내부 버퍼링을 하므로 <code>Flush()<\/code>를 잊으면 출력이 사라집니다. Flush 뒤 <code>w.Error()<\/code>를 확인하는 습관도 예제에 나옵니다.","an":"5일차_예제코드 §2.7 강의 포인트","src":"> 💡 **강의 포인트**: `csv.Writer`는 내부 버퍼링을 하므로 `Flush()`를 잊으면 출력이 사라집니다 — 6교시 CGo의 stdio 버퍼링 함정과 같은 계열의 문제라 연결 지어 설명하면 좋습니다.\n---"},{"id":"t4-06","ty":"ox","lv":1,"game":true,"p":"<code>json.Unmarshal<\/code>은 입력 전체를 메모리에 올려서 처리합니다.","a":true,"h":"§2.5 스트리밍 디코딩 절의 첫 문장은 json.Unmarshal이 데이터를 어떻게 다루는지 설명합니다. 그래서 큰 파일이나 스트림에서는 Decoder로 항목 단위로 읽어 메모리 부담을 줄인다고 이어집니다.","w":"<code>json.Unmarshal<\/code>은 전체를 메모리에 올립니다. 그래서 대용량 파일이나 스트림에는 <code>json.Decoder<\/code>를 씁니다.","an":"5일차 §2.5","src":"`json.Unmarshal`은 전체를 메모리에 올립니다. 큰 파일이나 스트림에선 `json.Decoder`를 씁니다."},{"id":"t4-07","ty":"ox","lv":2,"game":true,"p":"Money 예제에서 MarshalJSON은 포인터 리시버, UnmarshalJSON은 값 리시버로 구현했습니다.","a":false,"h":"Money의 MarshalJSON은 값을 읽어 문자열로 바꾸기만 하면 되고, UnmarshalJSON은 *m = Money(f * 100)처럼 수신자 자체를 바꿔야 합니다. 값을 바꾸려면 포인터 리시버가 필요하다는 점으로 두 메서드의 리시버를 확인해 보세요.","w":"반대입니다. <code>func (m Money) MarshalJSON()<\/code>은 값 리시버, <code>func (m *Money) UnmarshalJSON()<\/code>은 <code>*m<\/code>에 값을 써야 하므로 포인터 리시버입니다.","an":"5일차 §2.4 커스텀 직렬화","src":"func (m Money) MarshalJSON() ([]byte, error) {\n // 1234 → \"12.34\"\n dollars := float64(m) / 100\n return []byte(fmt.Sprintf(`\"%.2f\"`, dollars)), nil\n}\n\nfunc (m *Money) UnmarshalJSON(data []byte) error {\n s := strings.Trim(string(data), `\"`)\n f, err := strconv.ParseFloat(s, 64)\n if err != nil {\n return err\n }\n *m = Money(f * 100)"},{"id":"t4-08","ty":"match","lv":1,"game":false,"p":"스트리밍·인코딩 API와 역할을 연결하세요.","pairs":[["decoder.Token()","배열 경계 [ ] 토큰 소비"],["decoder.More()","남은 요소가 있는지 확인"],["decoder.Decode(&item)","항목 하나를 구조체로 디코딩"],["json.NewEncoder(w).Encode","응답에 JSON 쓰기"]],"h":"스트리밍 예제에서 decoder.Token()은 배열 경계 [ 토큰을 소비하고, decoder.More()는 남은 요소가 있는지 확인하며, decoder.Decode(&item)은 항목 하나를 구조체로 읽습니다. 응답 쪽은 json.NewEncoder(w).Encode로 JSON을 씁니다.","w":"Token으로 '['를 소비하고, More로 반복 여부를 판단하며, Decode로 항목을 하나씩 읽습니다. 핸들러 응답은 <code>json.NewEncoder(w).Encode<\/code>로 씁니다.","an":"5일차 §2.5–2.6 · 예제소스/p2_stream","src":"decoder := json.NewDecoder(file)\n\n// 배열의 시작 토큰 읽기\ndecoder.Token() // [\n\nfor decoder.More() {\n var item Item\n if err := decoder.Decode(&item); err != nil {\n log.Fatal(err)\n }\n process(item)\n}"},{"id":"t4-09","ty":"order","lv":2,"game":false,"p":"HTTP 핸들러의 표준 JSON 처리 순서대로 나열하세요.","steps":["요청 본문을 Decode (실패 시 400)","name 필수 등 유효성 검사","응답 구조체 생성","Content-Type 헤더를 application/json으로","WriteHeader(201) 후 Encode"],"h":"createUser는 먼저 json.NewDecoder(r.Body).Decode로 요청을 읽고 실패하면 400을 반환합니다. 이어 name 필수 같은 유효성 검사를 하고, 응답 구조체를 만들어 Content-Type 헤더를 설정한 뒤 WriteHeader(201)과 Encode로 응답합니다.","w":"디코딩과 유효성 검사로 잘못된 요청을 먼저 걸러 내고, 응답을 만든 뒤 헤더와 상태 코드를 쓰고 마지막에 본문을 Encode합니다. 헤더는 WriteHeader보다 먼저 설정해야 합니다.","an":"5일차 §2.6 실전 패턴","src":"func createUser(w http.ResponseWriter, r *http.Request) {\n var req CreateUserRequest\n // 요청 본문 디코딩\n if err := json.NewDecoder(r.Body).Decode(&req); err != nil {\n http.Error(w, \"잘못된 요청\", http.StatusBadRequest)\n return\n }\n defer r.Body.Close()\n // 유효성 검사\n if req.Name == \"\" {\n http.Error(w, \"name 필수\", http.StatusBadRequest)\n return\n }\n // 비즈니스 로직 (DB 저장 등 생략)\n resp := CreateUserResponse{\n ID: 42,"},{"id":"t4-10","ty":"multi","lv":3,"game":false,"p":"Money 커스텀 직렬화와 테스트에 대한 설명으로 옳은 것을 모두 고르세요.","o":["Marshal·Unmarshal 왕복 테스트가 정석이다","float64 왕복은 큰 금액에서 오차 가능","cents 정수 유지가 실무 해법 중 하나","Money는 달러 단위 실수로 저장한다","'abc'를 넣으면 에러 없이 0이 된다"],"a":[0,1,2],"h":"Money 예제코드는 Marshal과 Unmarshal이 서로 되돌려지는지 확인하는 왕복(round-trip) 테스트를 추가합니다. 수강생 질문 대비 노트는 float64(m)/100 왕복이 큰 금액에서 오차를 낼 수 있어 cents 정수 유지가 실무 답이라고 설명합니다.","w":"커스텀 직렬화는 서로 역함수인지 round-trip으로 검증합니다. float 변환은 오차 위험이 있어 cents 정수를 유지합니다. Money는 int64 cents이고, 'abc'는 ParseFloat 에러를 반환합니다.","an":"5일차_예제코드 §2.4 · 예제소스/p2_money","src":"> ⚠️ **수강생 질문 대비**: `float64(m)/100` 왕복은 큰 금액에서 부동소수점 오차가 날 수 있습니다(\"왜 금액을 float로 안 다루나요\"의 역질문 소재). 실무 답은 ① cents 정수 유지(이 예제) ② `strconv` 기반 십진 파싱 ③ `shopspring/decimal` 같은 십진수 라이브러리입니다."}]},{"id":"t5","title":"테스트 기초·테이블 드리븐","ref":"5일차 §3.1–3.5","qs":[{"id":"t5-01","ty":"mc","lv":1,"game":true,"p":"<code>go test<\/code>가 자동으로 인식하는 테스트 파일 이름 규칙은?","o":["test_*.go","*_spec.go","*_test.go","*.test.go"],"a":2,"h":"교안 §3.1 규칙 표는 go test가 별도 설정 없이 자동 인식하는 파일 이름 패턴을 정리합니다. calc.go의 테스트가 calc_test.go인 것처럼, 원래 파일 이름 뒤에 특정 접미사가 붙은 .go 파일입니다.","w":"테스트 파일은 <code>*_test.go<\/code>로 끝나야 자동 인식됩니다. 예제도 <code>calc.go<\/code>와 <code>calc_test.go<\/code>로 나눕니다.","an":"5일차 §3.1 규칙 표","src":"| 규칙 | 내용 |\n|---|---|\n| 파일 이름 | `*_test.go` (자동 인식) |\n| 함수 이름 | `TestXxx`, `BenchmarkXxx`, `ExampleXxx`, `FuzzXxx` |\n| 매개변수 | `*testing.T`, `*testing.B`, `*testing.F` |\n| 위치 | 테스트 대상과 **같은 패키지** (또는 `_test` 패키지) |"},{"id":"t5-02","ty":"mc","lv":1,"game":true,"p":"실패를 표시하고 그 테스트를 <b>즉시 중단<\/b>하는 메서드는?","o":["t.Fatal","t.Error","t.Helper","t.Run"],"a":0,"h":"testing.T에는 실패를 표시하는 두 계열의 메서드가 있습니다. t.Error는 실패를 표시하고 계속 진행하지만, 다른 하나는 '치명적'이라는 뜻의 이름대로 실패를 표시한 뒤 그 테스트를 즉시 멈춥니다.","w":"<code>t.Fatal<\/code>은 표시 후 즉시 중단하고, <code>t.Error<\/code>는 표시하고 계속 진행합니다. <code>t.Helper<\/code>는 헬퍼 표시, <code>t.Run<\/code>은 서브테스트 실행입니다.","an":"5일차 §3.2 t.Error vs t.Fatal","src":"### `t.Error` vs `t.Fatal`\n\n```go\nt.Error(\"실패\") // 표시하고 계속\nt.Errorf(\"...\")\nt.Fatal(\"실패\") // 표시하고 즉시 중단\nt.Fatalf(\"...\")\n```\n\n**`Fatal`은 이후 단계가 의미 없을 때만**(설정 실패 등) 사용. 보통은 `Error`로 여러 검증을 한 번에 수행합니다."},{"id":"t5-03","ty":"mc","lv":2,"game":true,"p":"검증 헬퍼 함수 첫 줄에 <code>t.Helper()<\/code>를 넣으면 생기는 효과는?","o":["헬퍼가 병렬로 실행된다","실패 시 테스트가 즉시 중단된다","커버리지에서 제외된다","실패 줄 번호가 호출한 쪽으로 표시된다"],"a":3,"h":"assertEqual 같은 검증 헬퍼에서 t.Errorf가 호출되면 기본적으로 실패 위치가 헬퍼 함수 내부 줄로 찍힙니다. 첫 줄에 t.Helper()를 넣으면 이 함수를 헬퍼로 표시해 에러 줄 번호를 호출 측에 표시하게 됩니다.","w":"<code>t.Helper()<\/code>는 에러 줄 번호를 호출 측에 표시합니다. 없으면 실패 위치가 헬퍼 내부로 나와 디버깅이 어려워집니다.","an":"5일차 §3.5 테스트 헬퍼","src":"## 3.5 테스트 헬퍼 — `t.Helper()`\n\n공통 검증 로직을 함수로 분리할 때.\n\n```go\nfunc assertEqual(t *testing.T, got, want int) {\n t.Helper() // 에러 발생 시 줄 번호를 호출 측에 표시\n if got != want {\n t.Errorf(\"got %d, want %d\", got, want)\n }\n}\n\nfunc TestSomething(t *testing.T) {\n assertEqual(t, Add(2, 3), 5)\n assertEqual(t, Add(0, 0), 0)\n}\n```\n\n`t.Helper()` 없으면 실패 위치가 헬퍼 안으로 표시되어 디버깅이 어려워집니다."},{"id":"t5-04","ty":"mc","lv":3,"game":false,"p":"테이블 드리븐 TestAdd에서 '음수+음수' 케이스만 실행하려면?","o":["go test -v","go test -run TestAdd/음수+음수","go test ./...","go test -bench=."],"a":1,"h":"테이블 드리븐 테스트에서 t.Run(tc.name, ...)으로 만든 서브테스트는 '부모 테스트/서브테스트 이름' 형식의 경로를 갖습니다. go test의 -run 플래그에 TestAdd 뒤에 슬래시와 케이스 이름을 붙이면 그 케이스만 실행됩니다.","w":"<code>t.Run<\/code>은 각 케이스를 별도 서브테스트로 만들어 <code>-run TestAdd/음수+음수<\/code>처럼 골라 실행할 수 있습니다. <code>-v<\/code>는 상세 출력, <code>./...<\/code>는 전체 프로젝트입니다.","an":"5일차 §3.3 t.Run의 장점","src":"# 특정 서브테스트만\ngo test -run TestAdd/음수+음수\n```\n\n각 케이스가 별도 테스트로 인식되어, 실패 시점과 위치를 정확히 알 수 있습니다."},{"id":"t5-05","ty":"mc","lv":3,"game":true,"p":"Go 1.21 이하에서 <code>for _, tc := range tests<\/code> 안의 <code>t.Run<\/code>에 <code>t.Parallel()<\/code>을 쓸 때 꼭 추가할 코드는?","o":["t.Helper()","defer wg.Done()","tc := tc","t.Fatal(tc)"],"a":2,"h":"Go 1.21 이하에서는 for range의 tc가 반복마다 같은 변수라, t.Parallel()로 나중에 실행되는 클로저가 마지막 값을 볼 수 있습니다. 교안은 t.Run 앞에서 같은 이름의 변수를 반드시 재선언하라고 하며, 1.22+에서는 불필요합니다.","w":"1.22 미만
