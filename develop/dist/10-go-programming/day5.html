에서는 루프 변수가 공유되므로 <code>tc := tc<\/code>로 재선언해야 합니다. Go 1.22+에서는 이 재선언이 필요 없습니다.","an":"5일차 §3.4 루프 변수 캡처 함정","src":"### 함정 — 테이블 드리븐에서 루프 변수 캡처 (Go 1.21 이하)\n\n```go\nfor _, tc := range tests {\n tc := tc // 1.22 미만: 반드시 재선언\n t.Run(tc.name, func(t *testing.T) {\n t.Parallel()\n // tc 사용\n })\n}\n```\n\nGo 1.22+에서는 루프 변수 재선언이 불필요합니다(3일차 참고)."},{"id":"t5-06","ty":"ox","lv":1,"game":true,"p":"Go 테스트는 별도 프레임워크 설치 없이 <code>go test<\/code>만으로 실행됩니다.","a":true,"h":"교안 §3.1은 Go가 테스트를 언어 기본으로 다룬다고 설명합니다. 다른 언어처럼 테스트 프레임워크를 따로 설치할 필요 없이 표준 testing 패키지와 go test 명령만 알면 된다는 점을 강조합니다.","w":"Go는 테스트를 언어 기본으로 다루므로 <code>testing<\/code> 패키지와 <code>go test<\/code>만 알면 됩니다.","an":"5일차 §3.1 Go 테스트의 철학","src":"## 3.1 Go 테스트의 철학\n\nGo는 **테스트를 언어 기본**으로 다룹니다. 별도 프레임워크 설치 없이 `go test`만 알면 됩니다."},{"id":"t5-07","ty":"ox","lv":2,"game":true,"p":"보통은 검증 하나가 실패하면 <code>t.Fatal<\/code>로 바로 멈추는 것이 권장됩니다.","a":false,"h":"교안은 t.Fatal을 이후 단계가 의미 없을 때(설정 실패 등)만 쓰라고 합니다. 보통은 실패를 표시하고 계속 진행하는 t.Error로 여러 검증을 한 번에 수행해, 한 번의 실행으로 실패 항목을 모두 확인하는 편을 권장합니다.","w":"<code>Fatal<\/code>은 설정 실패처럼 이후 단계가 의미 없을 때만 씁니다. 보통은 <code>Error<\/code>로 여러 검증을 한 번에 수행합니다.","an":"5일차 §3.2 t.Error vs t.Fatal","src":"**`Fatal`은 이후 단계가 의미 없을 때만**(설정 실패 등) 사용. 보통은 `Error`로 여러 검증을 한 번에 수행합니다."},{"id":"t5-08","ty":"match","lv":2,"game":false,"p":"<code>go test<\/code> 명령과 의미를 연결하세요.","pairs":[["go test","현재 패키지 테스트"],["go test ./...","전체 프로젝트 테스트"],["go test -v","상세 출력"],["go test -run TestAdd","특정 테스트만 실행"]],"h":"go test는 현재 패키지, ./...는 하위 디렉터리까지 전체 프로젝트를 테스트합니다. -v는 verbose(상세 출력), -run 뒤에 이름을 주면 그 정규식에 맞는 테스트만 실행합니다.","w":"<code>./...<\/code>는 하위 패키지 전체, <code>-v<\/code>는 verbose, <code>-run<\/code>은 이름이 맞는 테스트만 실행합니다.","an":"5일차 §3.2 실행 명령","src":"```bash\ngo test # 현재 패키지\ngo test ./... # 전체 프로젝트\ngo test -v # 상세 출력\ngo test -run TestAdd # 특정 테스트만\n```"},{"id":"t5-09","ty":"order","lv":2,"game":false,"p":"테이블 드리븐 테스트의 작성 순서대로 나열하세요.","steps":["name·입력·want를 가진 구조체 슬라이스 정의","for range로 케이스 순회","t.Run(tc.name, ...)으로 서브테스트 생성","대상 함수를 호출해 got 계산","got != want면 t.Errorf"],"h":"테이블 드리븐 TestAdd는 name·a·b·want 필드를 가진 익명 구조체 슬라이스로 케이스를 정의합니다. for range로 순회하며 t.Run(tc.name, ...)으로 서브테스트를 만들고, Add를 호출해 got을 구한 뒤 want와 다르면 t.Errorf로 보고합니다.","w":"케이스 표를 만들고 반복하면서 각 케이스를 <code>t.Run<\/code>으로 감쌉니다. 함수 결과를 want와 비교해 다르면 <code>t.Errorf<\/code>로 보고합니다.","an":"5일차 §3.3 테이블 드리븐 테스트","src":"func TestAdd(t *testing.T) {\n tests := []struct {\n name string\n a, b int\n want int\n }{\n {\"양수+양수\", 2, 3, 5},\n {\"음수+음수\", -2, -3, -5},\n {\"부호 혼합\", -5, 3, -2},\n {\"0 포함\", 0, 7, 7},\n }\n\n for _, tc := range tests {\n t.Run(tc.name, func(t *testing.T) {\n got := Add(tc.a, tc.b)\n if got != tc.want {\n t.Errorf(\"Add(%d,%d) = %d; want %d\",\n tc.a, tc.b, got, tc.want)\n }\n })\n }\n}\n```"},{"id":"t5-10","ty":"multi","lv":1,"game":true,"p":"<code>go test<\/code>가 인식하는 테스트 함수 이름 형식을 모두 고르세요.","o":["TestXxx","BenchmarkXxx","ExampleXxx","CheckXxx","SpecXxx"],"a":[0,1,2],"h":"§3.1 규칙 표의 함수 이름 행에는 일반 테스트, 벤치마크, 예제(문서) 테스트, 퍼즈 테스트의 네 접두사가 있습니다. 각각 *testing.T, *testing.B, *testing.F 같은 매개변수를 받으며, 보기 중 이 형식에 맞는 것을 고르세요.","w":"함수 이름 규칙은 <code>TestXxx<\/code>, <code>BenchmarkXxx<\/code>, <code>ExampleXxx<\/code>, <code>FuzzXxx<\/code>입니다. CheckXxx, SpecXxx는 규칙에 없습니다.","an":"5일차 §3.1 규칙 표","src":"| 규칙 | 내용 |\n|---|---|\n| 파일 이름 | `*_test.go` (자동 인식) |\n| 함수 이름 | `TestXxx`, `BenchmarkXxx`, `ExampleXxx`, `FuzzXxx` |\n| 매개변수 | `*testing.T`, `*testing.B`, `*testing.F` |\n| 위치 | 테스트 대상과 **같은 패키지** (또는 `_test` 패키지) |"}]},{"id":"t6","title":"Mock·httptest·벤치마크·커버리지","ref":"5일차 §3.6–3.11 · 예제코드 §3.6–3.7","qs":[{"id":"t6-01","ty":"mc","lv":1,"game":true,"p":"핸들러 테스트에서 응답을 캡처하는 가짜 <code>http.ResponseWriter<\/code>를 만드는 함수는?","o":["httptest.NewServer","httptest.NewRecorder","httptest.NewRequest","http.NewServeMux"],"a":1,"h":"httptest 패키지는 HTTP 핸들러 테스트용 도구를 제공합니다. NewRequest로 가짜 요청을 만들고, 응답을 메모리에 '기록(record)'해 두는 가짜 ResponseWriter를 만든 뒤 w.Code와 w.Body로 결과를 검사합니다.","w":"<code>httptest.NewRecorder()<\/code>는 응답을 캡처하며 <code>w.Code<\/code>, <code>w.Body<\/code>로 검사합니다. <code>NewServer<\/code>는 진짜 서버, <code>NewRequest<\/code>는 가짜 요청을 만듭니다.","an":"5일차 §3.7 httptest","src":"func TestHelloHandler(t *testing.T) {\n req := httptest.NewRequest(\"GET\", \"/hello?name=Go\", nil)\n w := httptest.NewRecorder()\n\n helloHandler(w, req)\n\n if w.Code != http.StatusOK {\n t.Errorf(\"status = %d\", w.Code)\n }\n if !strings.Contains(w.Body.String(), \"Hello, Go\") {\n t.Errorf(\"body = %q\", w.Body.String())\n }\n}\n```\n\n`httptest.NewRecorder()`는 응답을 캡처하는 가짜 `http.ResponseWriter`입니다."},{"id":"t6-02","ty":"mc","lv":2,"game":false,"p":"mock 응답 Body에 <code>io.NopCloser(strings.NewReader(...))<\/code>를 쓰는 이유는?","o":["JSON을 자동 검증하려고","응답을 압축하려고","Body는 ReadCloser인데 Reader엔 Close가 없어서","연결 누수를 일부러 만들려고"],"a":2,"h":"mock 응답을 만들 때 http.Response.Body 필드의 타입은 io.ReadCloser입니다. strings.Reader에는 Read만 있고 Close가 없으므로, 강의 포인트는 아무것도 안 하는 Close를 붙여 인터페이스를 맞추는 어댑터가 필요하다고 설명합니다.","w":"<code>Body<\/code>는 <code>io.ReadCloser<\/code>인데 <code>strings.Reader<\/code>는 Close가 없습니다. NopCloser는 아무 일도 안 하는 Close를 붙여 인터페이스를 맞추는 어댑터입니다.","an":"5일차_예제코드 §3.6 강의 포인트 · 예제소스/p3_mock","src":"> 💡 **강의 포인트**: `io.NopCloser`가 왜 필요한가? — `http.Response.Body`는 `io.ReadCloser` 타입인데 `strings.Reader`는 `Close`가 없습니다. `NopCloser`는 아무것도 안 하는 `Close`를 붙여주는 어댑터입니다. \"인터페이스를 맞추기 위한 최소 어댑터\"라는 1일차 인터페이스 철학의 좋은 실례입니다."},{"id":"t6-03","ty":"mc","lv":2,"game":true,"p":"벤치마크 결과 <code>BenchmarkAdd-8 1000000000 0.32 ns/op 0 B/op<\/code>에서 <code>0.32 ns/op<\/code>의 의미는?","o":["실행된 총 횟수","1회당 할당 바이트","1회당 할당 횟수","1회당 평균 시간"],"a":3,"h":"§3.8 벤치마크 출력 컬럼 표는 각 숫자의 의미를 정리합니다. 1000000000은 실행 횟수, B/op는 1회당 할당 바이트, allocs/op는 1회당 할당 횟수이고, ns/op는 나노초 단위로 잰 1회(op) 실행의 평균 소요 시간입니다.","w":"<code>ns/op<\/code>는 1회당 평균 시간입니다. 1000000000은 실행 횟수, <code>B/op<\/code>는 할당 바이트, <code>allocs/op<\/code>는 할당 횟수입니다.","an":"5일차 §3.8 벤치마크 컬럼 표","src":"| 컬럼 | 의미 |\n|---|---|\n| `1000000000` | 실행된 횟수 |\n| `0.32 ns/op` | 1회당 평균 시간 |\n| `0 B/op` | 1회당 할당 바이트 |\n| `0 allocs/op` | 1회당 할당 횟수 |"},{"id":"t6-04","ty":"mc","lv":1,"game":true,"p":"벤치마크 함수의 반복 횟수 <code>b.N<\/code>은 누가 정합니까?","o":["Go가 자동으로 조정","개발자가 상수로 지정","-count 옵션 값","CPU 코어 수"],"a":0,"h":"벤치마크 함수는 for i := 0; i < b.N; i++ 루프 안에서 측정 대상을 반복합니다. 교안은 b.N을 개발자가 정하지 않으며, 측정이 충분히 안정될 때까지 테스트 도구가 반복 횟수를 조정한다고 설명합니다.","w":"<code>b.N<\/code>은 Go가 자동으로 조정합니다. <code>-count=10<\/code>은 벤치마크 전체를 몇 번 반복할지 정하는 옵션입니다.","an":"5일차 §3.8 벤치마크","src":"## 3.8 벤치마크\n\n```go\nfunc BenchmarkAdd(b *testing.B) {\n for i := 0; i < b.N; i++ {\n Add(2, 3)\n }\n}\n```\n\n`b.N`은 Go가 자동으로 조정합니다. 실행:\n\n```bash\ngo test -bench=."},{"id":"t6-05","ty":"mc","lv":3,"game":false,"p":"<code>http.Get<\/code>을 직접 호출하는 기존 함수 fetchStatus를 코드 수정 없이 테스트하려면?","o":["HTTPClient 인터페이스 mock 주입","t.Parallel 호출","httptest.NewServer로 가짜 API 기동","ExampleFetchStatus 작성"],"a":2,"h":"fetchStatus처럼 http.Get을 직접 호출하는 코드는 HTTPClient 인터페이스 mock을 주입할 수 없습니다. 선택 기준 표는 이런 코드도 그대로 테스트할 수 있도록 임의 포트에 진짜 TCP 서버를 띄우는 httptest의 다른 함수를 권합니다.","w":"<code>httptest.NewServer<\/code>는 임의 포트에 진짜 서버를 띄워 <code>server.URL<\/code>을 넘기면 됩니다. 인터페이스 mock은 코드가 HTTPClient로 추상화돼 있어야 씁니다.","an":"5일차_예제코드 §3.7 · 예제소스/p3_httptest","src":"| | 3.6 인터페이스 mock | 3.7 httptest.NewServer |\n|---|---|---|\n| 코드 요구사항 | `HTTPClient` 인터페이스로 추상화 필요 | `http.Get` 직접 호출 코드도 OK |\n| 속도 | 가장 빠름 (네트워크 없음) | 루프백 TCP — 충분히 빠름 |\n| 검증 범위 | 비즈니스 로직만 | URL/헤더/직렬화까지 실제 HTTP 경로 |\n| 권장 | 단위 테스트 | 통합 성격의 테스트 |\n---"},{"id":"t6-06","ty":"ox","lv":1,"game":true,"p":"Example 테스트는 <code>// Output:<\/code> 주석과 실제 출력이 일치해야 통과합니다.","a":true,"h":"Example 테스트는 함수 사용 예시를 코드로 작성하고, 함수 끝에 // Output: 주석으로 기대 출력을 적습니다. go test는 실제 출력이 이 주석과 일치하는지 비교하며, 같은 예시가 go doc에도 표시됩니다.","w":"Example 함수는 <code>// Output:<\/code> 주석과 실제 출력이 같아야 통과하며, <code>go doc<\/code>에 사용 예시로도 표시됩니다.","an":"5일차 §3.10 Example 테스트","src":"## 3.10 Example 테스트 — 문서 + 테스트 동시에\n\n```go\nfunc ExampleAdd() {\n fmt.Println(Add(2, 3))\n // Output: 5\n}\n```\n\n- 함수 사용 예시를 코드로 작성\n- `// Output:` 주석과 실제 출력이 일치해야 통과\n- `go doc`에서 자동으로 사용 예시로 표시됨\n\nC에는 없는 우아한 메커니즘입니다."},{"id":"t6-07","ty":"ox","lv":1,"game":true,"p":"Go에서 mock을 만들려면 반드시 testify/mock 같은 외부 라이브러리가 필요합니다.","a":false,"h":"교안 §3.6은 Go에서는 별도 mock 라이브러리 없이 인터페이스와 직접 구현으로 충분한 경우가 많다고 설명합니다. 예제의 mockClient는 Do 메서드만 구현해 HTTPClient 인터페이스를 만족시킵니다.","w":"Go에서는 인터페이스와 직접 구현만으로 충분한 경우가 많습니다. 간단한 경우는 직접 작성하는 편이 더 명확합니다.","an":"5일차 §3.6 Mock","src":"## 3.6 Mock — 인터페이스 활용\n\nGo에서는 별도 mock 라이브러리 없이 **인터페이스 + 직접 구현**으로 충분한 경우가 많습니다."},{"id":"t6-08","ty":"match","lv":2,"game":false,"p":"명령과 용도를 연결하세요.","pairs":[["go test -bench=. -benchmem","할당 바이트·횟수까지 측정"],["go test -cover ./...","커버리지 비율 측정"],["go tool cover -html=cover.out","줄별 색칠 HTML 보고서"],["benchstat old.txt new.txt","변화량과 통계적 유의성 비교"]],"h":"-benchmem은 벤치마크에 할당 정보를 더하고, -cover는 커버리지 비율을 측정합니다. go tool cover -html은 coverprofile 결과를 줄별로 색칠한 HTML 보고서로 만들고, benchstat은 두 측정 파일의 변화량과 통계적 유의성을 비교합니다.","w":"<code>-benchmem<\/code>은 메모리 할당을, <code>-cover<\/code>는 비율을, <code>go tool cover -html<\/code>은 상세 보고서를 만들고, benchstat은 두 결과를 통계적으로 비교합니다.","an":"5일차 §3.8–3.9","src":"# 상세 보고서\ngo test -coverprofile=cover.out ./...\ngo tool cover -html=cover.out -o cover.html\nxdg-open cover.html # 브라우저로 확인\n```\n\n각 줄이 실행됐는지 색칠된 HTML 보고서가 나옵니다."},{"id":"t6-09","ty":"order","lv":2,"game":false,"p":"benchstat으로 코드 변경 전후 성능을 비교하는 순서대로 나열하세요.","steps":["go test -bench=. -count=10 > old.txt","코드 수정","go test -bench=. -count=10 > new.txt","benchstat old.txt new.txt"],"h":"benchstat 비교는 변경 전에 go test -bench=. -count=10으로 여러 번 측정해 old.txt에 저장하는 것으로 시작합니다. 코드를 바꾼 뒤 같은 명령으로 new.txt를 만들고, 마지막에 benchstat old.txt new.txt로 비교합니다.","w":"여러 번(-count=10) 실행한 결과를 전후로 저장한 뒤 benchstat에 두 파일을 넘기면 변화량과 통계적 유의성이 나옵니다.","an":"5일차 §3.8 benchstat","src":"# 코드 변경 후\ngo test -bench=. -count=10 > new.txt\n\nbenchstat old.txt new.txt"},{"id":"t6-10","ty":"multi","lv":3,"game":true,"p":"인터페이스 mock(3.6)과 <code>httptest.NewServer<\/code>(3.7) 비교로 옳은 것을 모두 고르세요.","o":["mock은 HTTPClient 추상화가 필요","NewServer는 진짜 TCP 서버를 띄운다","mock은 네트워크가 없어 가장 빠르다","NewServer는 비즈니스 로직만 검증","mock은 URL·헤더 경로까지 검증"],"a":[0,1,2],"h":"선택 기준 표에서 인터페이스 mock은 HTTPClient 추상화가 필요하지만 네트워크가 없어 가장 빠르고, httptest.NewServer는 루프백 TCP로 진짜 서버를 띄웁니다. 검증 범위는 mock이 비즈니스 로직만, NewServer가 URL·헤더·직렬화까지입니다.","w":"mock은 인터페이스 추상화가 필요하고 가장 빠르며 비즈니스 로직만 검증합니다. NewServer는 루프백 TCP로 URL·헤더·직렬화까지 실제 HTTP 경로를 검증합니다.","an":"5일차_예제코드 §3.7 선택 기준 표","src":"| | 3.6 인터페이스 mock | 3.7 httptest.NewServer |\n|---|---|---|\n| 코드 요구사항 | `HTTPClient` 인터페이스로 추상화 필요 | `http.Get` 직접 호출 코드도 OK |\n| 속도 | 가장 빠름 (네트워크 없음) | 루프백 TCP — 충분히 빠름 |\n| 검증 범위 | 비즈니스 로직만 | URL/헤더/직렬화까지 실제 HTTP 경로 |\n| 권장 | 단위 테스트 | 통합 성격의 테스트 |\n---"}]},{"id":"t7","title":"log/slog 구조화 로깅","ref":"5일차 §4.1–4.5, §4.8 · 예제코드 §4.4","qs":[{"id":"t7-01","ty":"mc","lv":1,"game":true,"p":"Go 1.21부터 표준 라이브러리에 들어온 구조화 로깅 패키지는?","o":["log","runtime/debug","log/slog","fmt"],"a":2,"h":"교안 §4.2는 Go 1.21부터 표준 라이브러리에 structured logging(구조화 로깅)의 표준 패키지가 들어왔다고 소개합니다. 기존 log 패키지 아래 하위 경로로, 이름은 structured log를 줄인 형태입니다.","w":"<code>log/slog<\/code>는 Go 1.21+ 구조화 로깅 표준입니다. 옛 <code>log<\/code>는 평문·레벨 없음의 한계가 있습니다.","an":"5일차 §4.2 log/slog","src":"## 4.2 `log/slog` — Go 1.21+ 구조화 로깅\n\nGo 1.21부터 표준 라이브러리에 들어왔습니다. **structured logging**의 표준입니다.\n\n```go\nimport \"log/slog\"\n\nslog.Info(\"로그인\",\n \"user_id\", 42,\n \"ip\", \"192.168.1.1\",\n \"duration_ms\", 123)\n```"},{"id":"t7-02","ty":"mc","lv":2,"game":true,"p":"옛 <code>log<\/code> 패키지의 한계로 <b>아닌<\/b> 것은?","o":["로그 레벨 구분이 없다","평문이라 파싱이 불편하다","구조화 필드가 없다","표준 라이브러리에 없다"],"a":3,"h":"교안 §4.1은 import \"log\"로 바로 쓰던 옛 log 패키지의 문제를 네 가지로 정리합니다. 평문이라 파싱이 불편하고, DEBUG/INFO 같은 레벨 구분이 없으며, 구조화된 필드와 컨텍스트 통합이 불편하다는 점입니다. 표준 라이브러리 포함 여부는 문제로 꼽히지 않았습니다.","w":"<code>log<\/code>는 표준 라이브러리에 있지만 평문 로그, 레벨 없음, 구조화 필드 없음, 컨텍스트 통합 불편이라는 한계가 있습니다.","an":"5일차 §4.1 옛 log 패키지의 한계","src":"## 4.1 옛 `log` 패키지의 한계\n\n```go\nimport \"log\"\n\nlog.Printf(\"user=%s action=%s\", user, action)\n```\n\n문제:\n- 평문 로그 — 파싱 불편\n- 레벨 구분 없음 (DEBUG/INFO/WARN/ERROR)\n- 구조화된 필드 없음\n- 컨텍스트 통합 불편"},{"id":"t7-03","ty":"mc","lv":1,"game":true,"p":"slog 출력을 JSON 형식으로 바꿀 때 <code>slog.New(...)<\/code>에 넣는 핸들러는?","o":["slog.NewJSONHandler","slog.NewTextHandler","json.NewEncoder","slog.HandlerOptions"],"a":0,"h":"slog 기본 출력은 key=value 텍스트이고, slog.SetDefault(slog.New(...))에 넘기는 핸들러를 바꾸면 출력 형식이 바뀝니다. 운영 환경에서 Elasticsearch·Loki 등에 넣기 좋은 형식의 이름이 핸들러 생성 함수에 그대로 들어 있습니다.","w":"<code>slog.SetDefault(slog.New(slog.NewJSONHandler(os.Stdout, nil)))<\/code>로 JSON 출력을 씁니다. 운영 환경에서는 보통 JSON 핸들러를 씁니다.","an":"5일차 §4.2 JSON 출력 전환","src":"JSON 출력으로 전환:\n```go\nslog.SetDefault(slog.New(slog.NewJSONHandler(os.Stdout, nil)))\n\nslog.Info(\"로그인\", \"user_id\", 42)\n// {\"time\":\"2024-01-15T...\",\"level\":\"INFO\",\"msg\":\"로그인\",\"user_id\":42}\n```\n\n운영 환경에서는 보통 JSON 핸들러를 씁니다. Elasticsearch, Loki, CloudWatch 등에 그대로 인입됩니다."},{"id":"t7-04","ty":"mc","lv":2,"game":true,"p":"<code>HandlerOptions{Level: slog.LevelWarn}<\/code>로 설정하면 출력되는 레벨은?","o":["Debug만","Warn과 Error","Info 이상 전부","Error만"],"a":1,"h":"slog 레벨은 Debug < Info < Warn < Error 순입니다. HandlerOptions의 Level을 slog.LevelWarn으로 주면 주석대로 그 레벨 '이상'만 출력되고, 그보다 낮은 레벨의 로그는 걸러집니다.","w":"<code>LevelWarn<\/code>은 Warn 이상만 출력하므로 Warn과 Error가 나옵니다. Debug와 Info는 걸러집니다.","an":"5일차 §4.3 레벨 필터링","src":"레벨 필터링:\n```go\nopts := &slog.HandlerOptions{\n Level: slog.LevelWarn, // Warn 이상만 출력\n}\nslog.SetDefault(slog.New(slog.NewJSONHandler(os.Stdout, opts)))\n```"},{"id":"t7-05","ty":"mc","lv":3,"game":false,"p":"<code>logger := slog.With('service','api')<\/code> 후 <code>logger.With('user_id',42).Info('프로필 조회')<\/code>의 출력에 포함되는 필드는?","o":["user_id만","service만","필드 없이 msg만","service와 user_id 모두"],"a":3,"h":"slog.With는 기존 필드를 유지한 채 공통 필드를 덧붙인 새 로거를 돌려줍니다. 예제에서 service·version을 붙인 logger에 다시 With(\"user_id\", 42)를 하면, 출력 주석처럼 앞서 붙인 필드와 새 필드가 함께 찍힙니다.","w":"<code>With<\/code>로 만든 로거에 다시 <code>With<\/code>를 하면 공통 필드가 누적됩니다. 그래서 service와 user_id가 모두 붙습니다.","an":"5일차 §4.4 그룹과 컨텍스트","src":"## 4.4 그룹과 컨텍스트\n\n여러 로그에 공통 필드를 자동으로 붙이고 싶을 때.\n\n```go\nlogger := slog.With(\n \"service\", \"api\",\n \"version\", \"1.0.0\",\n)\n\nlogger.Info(\"요청 수신\", \"path\", \"/users\")\n// service=api version=1.0.0 path=/users msg=\"요청 수신\"\n\nuserLogger := logger.With(\"user_id\", 42)\nuserLogger.Info(\"프로필 조회\")\n// service=api version=1.0.0 user_id=42 msg=\"프로필 조회\"\n```"},{"id":"t7-06","ty":"ox","lv":1,"game":true,"p":"<code>slog.Debug<\/code> 로그는 보통 운영 환경에서 숨깁니다.","a":true,"h":"교안 §4.3 로그 레벨 예제는 Debug·Info·Warn·Error 네 호출을 보여 주며, slog.Debug 줄의 주석에 이 레벨을 운영 환경에서 어떻게 다루는지 적어 두었습니다. 레벨 필터링으로 낮은 레벨을 걸러낼 수 있습니다.","w":"Debug는 보통 운영 환경에서 숨기며, 레벨 필터링으로 출력 여부를 정합니다.","an":"5일차 §4.3 로그 레벨","src":"## 4.3 로그 레벨\n\n```go\nslog.Debug(\"디버그 정보\") // 보통 운영 환경에선 숨김\nslog.Info(\"일반 정보\")\nslog.Warn(\"경고\")\nslog.Error(\"에러\", \"err\", err)\n```\n\n레벨 필터링:\n```go\nopts := &slog.HandlerOptions{\n Level: slog.LevelWarn, // Warn 이상만 출력\n}\nslog.SetDefault(slog.New(slog.NewJSONHandler(os.Stdout, opts)))\n```"},{"id":"t7-07","ty":"ox","lv":2,"game":true,"p":"<code>LoggerFrom(ctx)<\/code>는 ctx에 로거가 없으면 nil을 돌려줍니다.","a":false,"h":"LoggerFrom은 ctx.Value(loggerKey)를 *slog.Logger로 타입 단언해 ok이면 그 로거를 돌려줍니다. 로거가 없을 때 nil을 돌려주면 호출 측에서 panic이 날 수 있으므로, 예제는 대신 slog 패키지의 기본 로거를 반환합니다.","w":"comma-ok로 꺼내 실패하면 <code>slog.Default()<\/code>를 돌려줍니다. 그래서 로거가 없어도 nil panic이 나지 않습니다.","an":"5일차 §4.4 · 예제소스/p4_ctxlog","src":"func LoggerFrom(ctx context.Context) *slog.Logger {\n if l, ok := ctx.Value(loggerKey).(*slog.Logger); ok {\n return l\n }\n return slog.Default() // 없으면 기본 로거 — nil panic 방지\n}\nfunc handler(w http.ResponseWriter, r *http.Request) {\n reqID := r.Header.Get(\"X-Request-ID\")\n logger := slog.With(\"request_id\", reqID)\n ctx := WithLogger(r.Context(), logger)\n doWork(ctx)\n w.Write([]byte(\"OK\"))\n}"},{"id":"t7-08","ty":"match","lv":1,"game":false,"p":"Context 로거 전달 패턴의 요소와 역할을 연결하세요.","pairs":[["slog.With","공통 필드를 붙인 로거 생성"],["context.WithValue","ctx에 로거 저장"],["r.WithContext(ctx)","새 ctx를 담은 요청 전달"],["X-Request-ID 헤더","요청 ID를 읽어 오는 곳"]],"h":"Context 로거 패턴은 slog.With로 request_id 같은 공통 필드를 붙인 로거를 만들고, context.WithValue로 ctx에 저장합니다. r.WithContext(ctx)로 새 ctx를 담은 요청을 다음 핸들러에 넘기며, 요청 ID는 X-Request-ID 헤더에서 읽습니다.","w":"헤더에서 요청 ID를 읽어 <code>slog.With<\/code>로 로거를 만들고, <code>context.WithValue<\/code>로 저장한 뒤 <code>r.WithContext<\/code>로 다음 핸들러에 넘깁니다.","an":"5일차 §4.4, §4.8 logging_demo","src":"func logMiddleware(next http.HandlerFunc) http.HandlerFunc {\n return func(w http.ResponseWriter, r *http.Request) {\n start := time.Now()\n reqID := r.Header.Get(\"X-Request-ID\")\n if reqID == \"\" {\n reqID = \"auto-\" + time.Now().Format(\"150405\")\n }\n logger := slog.With(\n \"request_id\", reqID,\n \"method\", r.Method,\n \"path\", r.URL.Path,\n )\n ctx := context.WithValue(r.Context(), ctxLoggerKey, logger)"},{"id":"t7-09","ty":"order","lv":2,"game":false,"p":"logging_demo의 logMiddleware 처리 순서대로 나열하세요.","steps":["시작 시각 기록","X-Request-ID 읽기 (없으면 auto- 생성)","request_id·method·path로 로거 생성","ctx에 로거를 넣고 '요청 수신' 로그","next 호출 후 '요청 완료'와 duration_ms 로그"],"h":"logMiddleware는 start := time.Now()로 시작 시각을 기록하고 X-Request-ID 헤더를 읽어 없으면 auto- 접두사로 생성합니다. request_id·method·path로 로거를 만들어 ctx에 넣고 '요청 수신'을 남긴 뒤, next 호출 후 duration_ms와 함께 '요청 완료'를 남깁니다.","w":"처리 시간을 재려면 시작 시각부터 기록하고, ID를 정해 로거를 만든 뒤 수신·완료 로그를 남깁니다. 모든 로그가 같은 request_id로 연결됩니다.","an":"5일차 §4.8 logging_demo.go · 예제소스/p4_logdemo","src":"func logMiddleware(next http.HandlerFunc) http.HandlerFunc {\n return func(w http.ResponseWriter, r *http.Request) {\n start := time.Now()\n reqID := r.Header.Get(\"X-Request-ID\")\n if reqID == \"\" {\n reqID = \"auto-\" + time.Now().Format(\"150405\")\n }\n logger := slog.With(\n \"request_id\", reqID,\n \"method\", r.Method,\n \"path\", r.URL.Path,\n )\n ctx := context.WithValue(r.Context(), ctxLoggerKey, logger)"},{"id":"t7-10","ty":"multi","lv":3,"game":false,"p":"구조화 로깅을 JSON으로 남길 때 얻는 이점으로 옳은 것을 모두 고르세요.","o":["jq로 level·user_id 조건 쿼리 가능","Loki 등 수집기에 그대로 인입","request_id로 요청 로그 연결","레벨 필터링을 쓸 수 없다","출력이 항상 평문이 된다"],"a":[0,1,2],"h":"JSON 로그는 필드 단위로 구조화되어 있어 jq 'select(.level==\"ERROR\" and .user_id==42)'처럼 조건 쿼리가 가능합니다. 교안은 JSON 핸들러 출력이 Elasticsearch·Loki·CloudWatch에 그대로 인입되며, request_id로 한 요청의 로그를 연결할 수 있다고 설명합니다.","w":"구조화 필드는 <code>jq 'select(.level==...)'<\/code>처럼 쿼리로 분석할 수 있고, JSON 로그는 Elasticsearch·Loki·CloudWatch에 그대로 들어갑니다. 레벨 필터링도 HandlerOptions로 가능합니다.","an":"5일차 §4.2, §4.5 에러 로깅 패턴","src":"JSON 출력으로 전환:\n```go\nslog.SetDefault(slog.New(slog.NewJSONHandler(os.Stdout, nil)))\n\nslog.Info(\"로그인\", \"user_id\", 42)\n// {\"time\":\"2024-01-15T...\",\"level\":\"INFO\",\"msg\":\"로그인\",\"user_id\":42}\n```\n\n운영 환경에서는 보통 JSON 핸들러를 씁니다. Elasticsearch, Loki, CloudWatch 등에 그대로 인입됩니다."}]},{"id":"t8","title":"디버깅 기법·Delve 첫 세션","ref":"5일차 §4.6–4.7.3 · 예제코드 §4.6","qs":[{"id":"t8-01","ty":"mc","lv":1,"game":true,"p":"<code>fmt.Printf<\/code> 디버깅에서 구조체를 <b>필드명까지 포함<\/b>해 출력하는 동사는?","o":["%v","%+v","%#v","%T"],"a":1,"h":"§4.6 fmt.Printf 동사 표에서 %v는 기본 표현, %#v는 Go 구문 형태, %T는 타입입니다. 구조체 출력 시 필드명까지 함께 보여 주는 동사는 %v에 기호 하나를 더한 형태입니다.","w":"<code>%+v<\/code>는 필드명을 포함합니다. <code>%v<\/code>는 기본 표현, <code>%#v<\/code>는 Go 구문 형태, <code>%T<\/code>는 타입을 출력합니다.","an":"5일차 §4.6 fmt.Printf 동사 표","src":"### `fmt.Printf` 기반 — 가장 기본\n\n```go\nfmt.Printf(\"DEBUG: x=%+v y=%#v\\n\", x, y)\n```\n\n| 동사 | 출력 |\n|---|---|\n| `%v` | 기본 표현 |\n| `%+v` | 구조체 필드명 포함 |\n| `%#v` | Go 구문 형태 |\n| `%T` | 타입 |"},{"id":"t8-02","ty":"mc","lv":2,"game":false,"p":"<code>dlv debug<\/code>가 빌드할 때 자동으로 적용하는 설정은?","o":["-ldflags='-s -w'로 심볼 제거","-race로 레이스 검사","-gcflags='all=-N -l'로 최적화·인라이닝 끄기","-cover로 커버리지 측정"],"a":2,"h":"최적화된 바이너리를 디버깅하면 변수가 optimized out으로 보이거나 줄 번호가 어긋납니다. 교안은 dlv debug가 빌드할 때 최적화(-N)와 인라이닝(-l)을 끄는 gcflags를 자동으로 적용한 뒤 디버거 셸을 띄운다고 설명합니다.","w":"<code>dlv debug<\/code>는 <code>-gcflags='all=-N -l'<\/code>을 자동 적용해 최적화(-N)와 인라이닝(-l)을 끄고 빌드합니다. <code>-s -w<\/code>는 운영 빌드에서 심볼을 지우는 플래그입니다.","an":"5일차 §4.7.2 첫 디버깅 세션","src":"`dlv debug`는 최적화/인라이닝을 끄고(`-gcflags=\"all=-N -l\"` 자동 적용) 빌드한 뒤 디버거 셸을 띄웁니다."},{"id":"t8-03","ty":"mc","lv":1,"game":true,"p":"GDB의 <code>finish<\/code>처럼 현재 함수 끝까지 실행하고 반환값을 보여 주는 Delve 명령은?","o":["next","step","continue","stepout"],"a":3,"h":"§4.7.2 대응표는 GDB 명령과 Delve 명령을 짝지어 보여 줍니다. GDB의 finish(현재 함수 끝까지 실행)에 해당하는 Delve 명령은 함수 '밖으로' 한 단계 나간다는 뜻의 이름이며, 줄여서 so로도 씁니다.","w":"<code>stepout<\/code>(so)은 현재 함수 끝까지 실행하고 'Values returned'로 반환값을 보여 줍니다. next는 한 줄, step은 함수 안으로 진입, continue는 다음 중단점까지 실행입니다.","an":"5일차 §4.7.2 GDB·Delve 대응표","src":"| GDB | Delve | 의미 |\n|---|---|---|\n| `break` / `b` | `break` / `b` | 중단점 설정 |\n| `run` | `continue` / `c` | 실행/재개 |\n| `next` / `n` | `next` / `n` | 한 줄 실행 (함수 위로) |\n| `step` / `s` | `step` / `s` | 함수 안으로 진입 |\n| `finish` | `stepout` / `so` | 현재 함수 끝까지 |\n| `print`"},{"id":"t8-04","ty":"mc","lv":3,"game":false,"p":"total() 루프에서 가격이 100000을 넘는 항목일 때만 멈추려면 어떻게 합니까?","o":["break main.go:14 if it.Price > 100000","break main.total 후 continue 반복","watch it.Price","goroutine 1 bt"],"a":0,"h":"조건부 중단점은 break main.go:14로 줄에 중단점을 걸고 condition 명령으로 조건을 붙일 수 있습니다. 교안은 한 줄 문법도 소개하는데, break 줄 번호 뒤에 if와 조건식(it.Price > 100000)을 이어 쓰면 됩니다.","w":"<code>break main.go:14 if ...<\/code> 또는 <code>condition 1<\/code>에 조건식을 주어 조건부 중단점을 겁니다. 그러면 모니터 항목에서만 멈춥니다.","an":"5일차 §4.7.3 조건부 중단점 · 예제소스/p4_dbg","src":"```\n(dlv) break main.go:14 # total()의 루프 내부 줄 번호\n(dlv) condition 1 it.Price > 100000 # 중단점 1번에 조건 부여\n(dlv) continue\n> main.total() ./main.go:14\n(dlv) print it\nmain.Item {Name: \"모니터\", Price: 200000, Qty: 1} # 조건 맞는 순간만 정지\n```\n\n한 줄로도 가능합니다: `break main.go:14 if it.Qty > 1`"},{"id":"t8-05","ty":"num","lv":3,"game":false,"p":"할인 버그를 고친 뒤(<code>rate*10<\/code> → <code>rate<\/code>) <code>applyDiscount(275000, 0.1)<\/code>의 반환값은?","a":247500,"unit":"원","h":"Delve 세션에서 버그 원인은 할인액 계산식의 *10이었습니다. 이를 rate로 고치면 할인액은 int(float64(sum)*rate)이고, 반환값은 sum − int(275000 × 0.1)로 계산한 결제 금액입니다.","w":"수정 후 <code>sum - int(float64(sum)*rate)<\/code>는 275000 − 27500 = 247500입니다. 버그 상태에서는 할인액이 합계 전체와 같아 0이 나왔습니다.","an":"5일차 §4.7.1–4.7.2 · 예제소스/p4_dbg","src":"(dlv) print int(float64(sum)*rate*10) # ⑤ 표현식 평가!\n275000 # ← 할인액이 합계 전체와 같다 = 버그 원인 발견\n(dlv) print float64(sum)*rate\n27500 # ← 이게 의도한 10% 할인액. \"*10\"이 범인\n```"},{"id":"t8-06","ty":"ox","lv":1,"game":true,"p":"<code>recover<\/code>와 <code>debug.Stack()<\/code>을 쓰면 죽기 전에 스택을 문자열로 꺼내 로깅할 수 있습니다.","a":true,"h":"p4_recover 예제는 defer 안에서 recover()로 panic을 잡고 debug.Stack()을 문자열로 바꿔 slog.Error로 남깁니다. C 비교 포인트는 segfault 후 코어덤프를 분석하던 것과 달리 Go는 죽기 전에 자기 스택을 꺼내 로깅할 수 있다고 설명합니다.","w":"<code>runtime/debug<\/code>의 <code>debug.Stack()<\/code>으로 스택을 문자열로 꺼내 <code>slog.Error<\/code>로 남길 수 있습니다.","an":"5일차 §4.6 runtime/debug · 예제소스/p4_recover","src":"> 💡 **C 비교 포인트**: C에서 segfault 후 코어덤프를 분석하던 것과 달리, Go는 **죽기 전에 자기 스택을 문자열로 꺼내 로깅**할 수 있습니다. 단, recover 남용은 금물 — HTTP 미들웨어(7교시 `RecoveryMiddleware`)처럼 \"요청 하나의 실패가 프로세스를 죽이면 안 되는 경계\"에서만 쓰는 것이 관례입니다.\n---"},{"id":"t8-07","ty":"ox","lv":2,"game":true,"p":"panic을 막기 위해 모든 함수에 <code>recover<\/code>를 넣는 것이 관례입니다.","a":false,"h":"예제코드의 C 비교 포인트는 recover 남용을 금물이라고 경고합니다. HTTP 미들웨어의 RecoveryMiddleware처럼 '요청 하나의 실패가 프로세스를 죽이면 안 되는 경계'에서만 쓰는 것이 관례라고 정리합니다.","w":"recover 남용은 금물이며, HTTP 미들웨어처럼 요청 하나의 실패가 프로세스를 죽이면 안 되는 경계에서만 쓰는 것이 관례입니다.","an":"5일차_예제코드 §4.6 C 비교 포인트","src":"> 💡 **C 비교 포인트**: C에서 segfault 후 코어덤프를 분석하던 것과 달리, Go는 **죽기 전에 자기 스택을 문자열로 꺼내 로깅**할 수 있습니다. 단, recover 남용은 금물 — HTTP 미들웨어(7교시 `RecoveryMiddleware`)처럼 \"요청 하나의 실패가 프로세스를 죽이면 안 되는 경계\"에서만 쓰는 것이 관례입니다.\n---"},{"id":"t8-08","ty":"match","lv":1,"game":false,"p":"GDB 명령과 같은 일을 하는 Delve 명령을 연결하세요.","pairs":[["run","continue"],["finish","stepout"],["info args","args"],["info locals","locals"],["backtrace","bt"]],"h":"§4.7.2 대응표에서 GDB의 run은 Delve에서 실행·재개 명령, finish는 함수 밖으로 나가는 명령입니다. GDB의 info args·info locals는 Delve에서 info를 뺀 짧은 이름으로, backtrace는 약어 bt로 씁니다.","w":"Delve는 run 대신 continue, finish 대신 stepout을 쓰고 info args·info locals는 args·locals로 줄였습니다. 호출 스택은 bt입니다.","an":"5일차 §4.7.2 GDB·Delve 대응표","src":"| GDB | Delve | 의미 |\n|---|---|---|\n| `break` / `b` | `break` / `b` | 중단점 설정 |\n| `run` | `continue` / `c` | 실행/재개 |\n| `next` / `n` | `next` / `n` | 한 줄 실행 (함수 위로) |\n| `step` / `s` | `step` / `s` | 함수 안으로 진입 |\n| `finish` | `stepout` / `so` | 현재 함수 끝까지 |\n| `print` / `p` | `print` / `p` | 변수/표현식 출력 |\n| `info args` | `args` | 함수 인자 |\n| `info locals` | `locals` | 지역 변수 전체 |"},{"id":"t8-09","ty":"order","lv":2,"game":false,"p":"할인 버그를 찾는 첫 Delve 세션의 순서대로 나열하세요.","steps":["dlv debug .","break main.applyDiscount","continue","args로 sum·rate 확인","print로 할인식 평가"],"h":"첫 Delve 세션은 dlv debug .로 디버거를 시작한 뒤 break main.applyDiscount로 함수에 중단점을 겁니다. continue로 중단점까지 실행하고, args로 sum·rate를 확인한 다음 print로 할인 계산식을 평가해 버그를 찾습니다.","w":"중단점을 건 뒤 continue로 멈추고 args로 인자를 봅니다. <code>print int(float64(sum)*rate*10)<\/code>이 275000이라 '*10'이 범인임을 찾습니다.","an":"5일차 §4.7.2 첫 디버깅 세션","src":"(dlv) break main.applyDiscount # ① 함수에 중단점\nBreakpoint 1 set at 0x... for main.applyDiscount() ./main.go:19\n(dlv) continue # ② 중단점까지 실행\n> main.applyDiscount() ./main.go:19 (hits goroutine(1):1 total:1)\n(dlv) args # ③ 함수 인자 확인\nsum = 275000\nrate = 0.1\n(dlv) next # ④ 한 줄 실행 (GDB의 n)\n(dlv) print int(float64(sum)*rate*10) # ⑤ 표현식 평가!\n275000 # ← 할인액이 합계 전체와 같다 = 버그 원인 발견\n(dlv) print float64(sum)*rate"},{"id":"t8-10","ty":"multi","lv":2,"game":true,"p":"p4_recover 예제에서 <code>mayPanic(data, 99)<\/code>를 호출했을 때 옳은 것을 모두 고르세요.","o":["ERROR 레벨 '패닉 복구' 로그가 남는다","named return으로 -1이 반환된다","이후 로그도 계속 출력된다","프로세스가 즉시 종료된다","0이 반환된다"],"a":[0,1,2],"h":"mayPanic(data, 99)은 길이 3인 슬라이스의 범위 밖 인덱스라 panic이 납니다. defer의 recover가 이를 잡아 slog.Error로 '패닉 복구'를 남기고 named return인 result에 -1을 넣으므로, 프로그램은 죽지 않고 다음 로그를 계속 출력합니다.","w":"범위 밖 접근 panic을 defer의 recover가 잡아 ERROR 로그를 남기고 named return <code>result<\/code>에 -1을 넣습니다. 프로그램은 죽지 않고 계속 실행됩니다.","an":"5일차_예제코드 §4.6 · 예제소스/p4_recover","src":"func mayPanic(data []int, idx int) (result int) {\n defer func() {\n if r := recover(); r != nil {\n slog.Error(\"패닉 복구\",\n \"panic\", r,\n \"stack\", string(debug.Stack()))\n result = -1 // named return으로 복구값 지정\n }\n }()\n return data[idx]"}]},{"id":"t9","title":"Delve 심화·레이스·디버깅 워크플로","ref":"5일차 §4.7.4–4.7.9","qs":[{"id":"t9-01","ty":"mc","lv":1,"game":true,"p":"Delve에서 모든 고루틴 목록을 보는 명령은?","o":["bt","goroutines","locals","list"],"a":1,"h":"§4.7.4 고루틴 디버깅에서 Delve는 실행 중인 모든 고루틴을 나열하는 명령을 제공합니다. 명령 이름은 고루틴의 영어 복수형이며, 단수형 goroutine 18은 특정 고루틴으로 전환할 때 씁니다.","w":"<code>goroutines<\/code>는 모든 고루틴을, <code>goroutines -with user<\/code>는 사용자 코드만 보여 줍니다. 특정 고루틴 스택은 <code>goroutine 18 bt<\/code>로 봅니다.","an":"5일차 §4.7.4 고루틴 디버깅","src":"```\n(dlv) goroutines # 모든 고루틴 목록\n* Goroutine 1 - ... main.main\n Goroutine 18 - ... main.worker (대기 중인 위치 표시)\n ...\n\n(dlv) goroutines -with user # 사용자 코드 고루틴만 필터\n(dlv) goroutine 18 # 18번 고루틴으로 전환\n(dlv) bt # 그 고루틴의 스택 추적\n(dlv) goroutine 18 bt # 전환 없이 한 번에"},{"id":"t9-02","ty":"mc","lv":2,"game":false,"p":"깨진 테스트 TestMemoryStore_CRUD 하나만 디버거로 실행하려면?","o":["dlv attach 12345","dlv exec bin/app","dlv test ./internal/user -- -test.run TestMemoryStore_CRUD","dlv debug ."],"a":2,"h":"테스트를 디버거로 실행할 때는 dlv의 테스트 전용 하위 명령에 패키지 경로를 주고, -- 뒤에 go test 바이너리 플래그를 넘깁니다. 특정 테스트만 고르려면 -test.run 뒤에 테스트 이름을 적습니다.","w":"<code>dlv test<\/code>에 <code>-- -test.run 이름<\/code>을 넘기면 특정 테스트만 디버깅합니다. attach는 실행 중 프로세스, exec는 미리 빌드한 바이너리용입니다.","an":"5일차 §4.7.5 dlv test","src":"dlv test ./internal/user -- -test.run TestMemoryStore_CRUD\n```"},{"id":"t9-03","ty":"mc","lv":2,"game":true,"p":"<code>dlv attach<\/code>로 붙었던 서버를 계속 살려 둔 채 quit하려면 '프로세스를 죽일까?' 물음에 어떻게 답합니까?","o":["y를 선택한다","restart를 입력한다","kill -TERM을 보낸다","n을 선택한다"],"a":3,"h":"dlv attach로 실행 중인 서버에 붙어 디버깅한 뒤 quit하면 Delve가 대상 프로세스를 함께 종료할지 묻습니다. 교안의 주석은 서버를 계속 살려 두려면 이 물음에 '아니오'를 고르라고 안내합니다.","w":"attach 종료 시 프로세스를 죽일지 물으면 <b>n<\/b>을 선택합니다. y를 고르면 실행 중이던 서버가 종료됩니다.","an":"5일차 §4.7.6 dlv attach","src":"```\n(dlv) print u # 디코딩된 요청 본문 확인\n(dlv) bt # net/http 내부부터 핸들러까지 전체 스택\n(dlv) continue # 요청 계속 처리\n(dlv) quit # ⚠️ attach 종료 시 \"프로세스를 죽일까?\" 물음 → n 선택\n```\n\n> ⚠️ **주의**: 중단점에 멈춘 동안 그 고루틴의 요청은 블록됩니다. 운영 트래픽에는 attach 대신 로깅/pprof를 우선하세요."},{"id":"t9-04","ty":"mc","lv":1,"game":true,"p":"운영 배포 바이너리에서 디버그 심볼을 제거할 때 보통 쓰는 플래그는?","o":["-ldflags='-s -w'","-gcflags='all=-N -l'","-race","-cover"],"a":0,"h":"운영 배포 바이너리는 크기를 줄이고 디버그 심볼을 없애려고 링커(ld)에 -s(심볼 테이블)와 -w(DWARF)를 넘깁니다. 교안은 이 플래그로 만든 바이너리는 Delve로 디버깅할 수 없으니 디버깅용 빌드를 따로 두라고 합니다.","w":"운영 빌드는 <code>-ldflags='-s -w'<\/code>로 디버그 심볼을 지웁니다. 이 바이너리는 Delve로 디버깅할 수 없으니 디버깅용 빌드를 따로 둡니다.","an":"5일차 §4.7.7 디버그 빌드와 운영 빌드","src":"반대로 운영 배포 바이너리는 보통 `-ldflags=\"-s -w\"`로 디버그 심볼을 제거합니다(8교시 Makefile 참고). **그 바이너리는 Delve로 디버깅할 수 없으니** 디버깅용 빌드를 따로 두세요."},{"id":"t9-05","ty":"mc","lv":3,"game":true,"p":"race_demo를 <code>go run -race<\/code>로 돌렸더니 counter = 1000과 함께 DATA RACE 경고가 나왔습니다. 올바른 해석은?","o":["결과가 맞으니 문제없다","-race 도구의 오탐이다","결과가 맞아 보여도 레이스가 있다","고루틴이 1000개라서 생긴 경고다"],"a":2,"h":"race_demo는 실행 결과가 우연히 1000으로 맞게 나올 수 있습니다. 하지만 -race는 실제로 동시에 같은 메모리에 접근한 흔적을 잡아 경고하므로, 교안은 출력 옆 주석에서 결과가 맞아 보여도 레이스라는 점을 강조합니다.","w":"여러 고루틴이 <code>counter++<\/code>를 동기화 없이 읽고 써서 데이터 레이스입니다. 이번에 결과가 맞아 보여도 레이스는 레이스입니다.","an":"5일차 §4.7.9 · 예제소스/p4_race","src":"# counter = 1000 ← 결과가 맞아 보여도 race는 race!\n```\n\n**디버깅 워크플로 정리**:\n\n1. 증상 재현 → `go run -race` / `go test -race` 먼저 (race 여부 확인)"},{"id":"t9-06","ty":"ox","lv":1,"game":true,"p":"중단점에 멈춘 동안 그 고루틴의 요청은 블록되므로, 운영 트래픽에는 attach보다 로깅·pprof를 우선합니다.","a":true,"h":"dlv attach 절의 주의 상자는 중단점에 멈춰 있는 동안 해당 고루틴이 처리하던 요청이 블록된다고 경고합니다. 그래서 실제 운영 트래픽을 다룰 때는 attach보다 로깅과 pprof를 먼저 쓰라고 권합니다.","w":"중단점에서 멈추면 해당 요청이 블록됩니다. 그래서 운영 트래픽에는 attach 대신 로깅과 pprof를 먼저 씁니다.","an":"5일차 §4.7.6 주의","src":"> ⚠️ **주의**: 중단점에 멈춘 동안 그 고루틴의 요청은 블록됩니다. 운영 트래픽에는 attach 대신 로깅/pprof를 우선하세요."},{"id":"t9-07","ty":"ox","lv":2,"game":true,"p":"최적화된 바이너리를 Delve로 디버깅해도 변수와 줄 번호가 정확히 보입니다.","a":false,"h":"최적화된 바이너리는 변수가 레지스터에만 있거나 인라인되어 사라질 수 있습니다. 교안은 이를 Delve로 디버깅하면 변수가 'optimized out'으로 보이거나 줄 번호가 어긋난다고 하며, C에서 -O2 빌드를 GDB로 볼 때와 같다고 설명합니다.","w":"최적화된 바이너리는 변수가 <code>optimized out<\/code>으로 보이거나 줄 번호가 어긋납니다. <code>dlv exec<\/code>용 바이너리는 <code>-gcflags='all=-N -l'<\/code>로 빌드합니다.","an":"5일차 §4.7.7","src":"최적화된 바이너리를 디버깅하면 변수가 `optimized out`으로 보이거나 줄 번호가 어긋납니다 — C에서 `-O2` 빌드를 GDB로 볼 때와 같은 현상입니다. 반대로 운영 배포 바이너리는 보통 `-ldflags=\"-s -w\"`로 디버그 심볼을 제거합니다(8교시 Makefile 참고). **그 바이너리는 Delve로 디버깅할 수 없으니** 디버깅용 빌드를 따로 두세요."},{"id":"t9-08","ty":"match","lv":1,"game":false,"p":"VS Code 디버깅 설정·단축키와 용도를 연결하세요.","pairs":[["mode: debug","프로그램 디버그 실행"],["mode: test","패키지 테스트 디버그"],["request: attach","실행 중 프로세스에 붙기"],["F10","next"],["F11","step"]],"h":"launch.json의 세 구성은 mode가 debug인 프로그램 디버그, mode가 test인 패키지 테스트 디버그, request가 attach인 실행 중 프로세스 연결입니다. 교안은 F5 시작, F10 next, F11 step으로 CLI 개념이 그대로 매핑된다고 설명합니다.","w":"launch.json은 debug·test·attach 구성을 두고, Go 확장이 내부적으로 Delve(DAP)를 씁니다. F10은 next, F11은 step에 대응합니다.","an":"5일차 §4.7.8 VS Code 그래픽 디버깅","src":"\"name\": \"현재 패키지 테스트 디버그\",\n \"type\": \"go\",\n \"request\": \"launch\",\n \"mode\": \"test\",\n \"program\": \"${workspaceFolder}/internal/user\"\n },\n {\n \"name\": \"실행 중 프로세스에 attach\",\n \"type\": \"go\",\n \"request\": \"attach\",\n \"mode\": \"local\",\n \"processId\": 0\n }\n ]\n}\n```\n\n줄 번호 왼쪽 클릭으로 중단점, F5 시작, F10 next, F11 step — CLI에서 익힌 개념이 그대로 매핑됩니다."},{"id":"t9-09","ty":"order","lv":2,"game":false,"p":"교안의 디버깅 워크플로를 순서대로 나열하세요.","steps":["-race로 레이스 여부 먼저 확인","로직 버그는 dlv debug와 중단점","특정 입력에서만 나면 조건부 중단점","동시성 흐름은 goroutines·bt","실행 중 프로세스는 dlv attach"],"h":"교안의 디버깅 워크플로 정리는 증상 재현 후 -race로 레이스 여부를 먼저 확인하는 것으로 시작합니다. 이어 로직 버그는 dlv debug와 중단점, 특정 입력은 조건부 중단점, 동시성 흐름은 goroutines·bt, 실행 중 프로세스는 dlv attach 순입니다.","w":"증상 재현 후 race 여부를 먼저 보고, 로직 버그 → 조건부 중단점 → 고루틴 → attach 순으로 좁힙니다. 성능 문제는 디버거가 아니라 pprof로 봅니다.","an":"5일차 §4.7.9 디버깅 워크플로 정리","src":"**디버깅 워크플로 정리**:\n\n1. 증상 재현 → `go run -race` / `go test -race` 먼저 (race 여부 확인)\n2. 로직 버그 → `dlv debug` + 중단점 + `print` 표현식 평가\n3. 특정 입력에서만 발생 → 조건부 중단점\n4. 동시성 흐름 문제 → `goroutines` / `goroutine N bt`\n5. 실행 중 프로세스 → `dlv attach` (운영은 신중히)\n6. 성능 문제 → 디버거가 아니라 5교시 **pprof**로"},{"id":"t9-10","ty":"multi","lv":3,"game":true,"p":"상황과 도구의 짝으로 옳은 것을 모두 고르세요.","o":["성능 문제 → pprof","데이터 레이스 → go run -race","미리 빌드한 바이너리 → dlv exec","-s -w 운영 바이너리 → Delve","고루틴 누수 → -ldflags"],"a":[0,1,2],"h":"워크플로 정리에 따르면 성능 문제는 디버거가 아니라 pprof로, 데이터 레이스는 -race 플래그로 다룹니다. 미리 빌드한 바이너리는 디버그 플래그로 빌드한 뒤 dlv exec로 띄우며, -s -w로 심볼을 지운 바이너리는 디버깅할 수 없습니다.","w":"성능은 pprof, 레이스는 -race, 미리 빌드한 디버그 바이너리는 dlv exec로 봅니다. 심볼을 지운 운영 바이너리는 Delve로 디버깅할 수 없고, 고루틴 누수는 goroutines 목록으로 찾습니다.","an":"5일차 §4.7.4–4.7.9","src":"# 디버깅용 빌드: 최적화(-N), 인라이닝(-l) 비활성화\ngo build -gcflags=\"all=-N -l\" -o bin/userapi-debug ./cmd/userapi\n\ndlv exec bin/userapi-debug\n```\n\n최적화된 바이너리를 디버깅하면 변수가 `optimized out`으로 보이거나 줄 번호가 어긋납니다 — C에서 `-O2` 빌드를 GDB로 볼 때와 같은 현상입니다. 반대로 운영 배포 바이너리는 보통 `-ldflags=\"-s -w\"`로 디버그 심볼을 제거합니다(8교시 Makefile 참고). **그 바이너리는 Delve로 디버깅할 수 없으니** 디버깅용 빌드를 따로 두세요."}]},{"id":"t10","title":"도전 과제 솔루션 · 인증·메트릭·배포","ref":"5일차_솔루션 도전 과제 ①–⑤","qs":[{"id":"t10-01","ty":"mc","lv":1,"game":true,"p":"인메모리 저장소를 PostgreSQL로 바꿔도 핸들러 로직을 거의 고치지 않아도 되는 이유는?","o":["Store 인터페이스로 설계했기 때문","pgx가 자동 변환해 주기 때문","JSON 태그를 바꿨기 때문","Graceful Shutdown 덕분"],"a":0,"h":"도전 ① 솔루션은 7교시에서 Store를 인터페이스로 정의해 둔 덕분에 PostgreSQL 구현체만 갈아끼우면 된다고 설명합니다. 핸들러는 구체 타입이 아니라 인터페이스 메서드만 호출하므로 거의 바뀌지 않습니다.","w":"7교시에서 <code>Store<\/code> 인터페이스를 정의해 두었기 때문에 구현체만 PostgresStore로 갈아 끼우면 됩니다. 이것이 인터페이스 기반 설계의 힘입니다.","an":"5일차_솔루션 도전 과제 ① 학습 포인트","src":"## 솔루션 — 인터페이스 그대로, 구현만 교체\n\n5일차 7교시에서 `Store` **인터페이스**를 정의해 둔 덕분에 구현체만 갈아끼우면 됩니다. 이것이 **인터페이스 기반 설계의 힘**입니다."},{"id":"t10-02","ty":"mc","lv":2,"game":true,"p":"JWT <code>Verify<\/code>의 키 함수에서 <b>반드시<\/b> 검사해야 하는 것은?","o":["토큰 길이","서명 알고리즘 종류","요청 IP 주소","Content-Type 헤더"],"a":1,"h":"Verify는 jwt.ParseWithClaims의 키 함수에서 t.Method가 *jwt.SigningMethodHMAC인지 먼저 확인합니다. 핵심 보안 포인트는 이 검사를 빼면 토큰 헤더의 alg를 'none'으로 바꾸는 공격에 노출된다고 경고합니다.","w":"<code>ParseWithClaims<\/code> 키 함수에서 <code>t.Method<\/code>가 HMAC인지 검증해야 합니다. 안 하면 'none' 알고리즘 공격에 노출됩니다.","an":"5일차_솔루션 도전 과제 ② 핵심 보안 포인트","src":"token, err := jwt.ParseWithClaims(tokenStr, &claims, func(t *jwt.Token) (any, error) {\n // 알고리즘 검증 — 가장 흔한 보안 함정\n if _, ok := t.Method.(*jwt.SigningMethodHMAC); !ok {\n return nil, fmt.Errorf(\"예상치 못한 서명 알고리즘: %v\", t.Header[\"alg\"])\n }\n return m.secret, nil"},{"id":"t10-03","ty":"mc","lv":2,"game":true,"p":"Prometheus 라벨에 <code>/users/1<\/code>, <code>/users/2<\/code>처럼 경로를 그대로 넣으면 생기는 문제는?","o":["요청이 405로 거부된다","메트릭이 하나로 합쳐진다","카디널리티가 폭발한다","Histogram이 Gauge로 바뀐다"],"a":2,"h":"Prometheus는 라벨 값 조합마다 별도 시계열을 만듭니다. /users/1, /users/2처럼 id가 들어간 경로를 그대로 쓰면 사용자 수만큼 시계열이 생기므로, 솔루션은 /users/:id 형태로 정규화하라고 경고합니다.","w":"id마다 별도 시계열이 생겨 카디널리티가 폭발합니다. 그래서 <code>normalizePath<\/code>로 <code>/users/:id<\/code> 형태로 정규화합니다.","an":"5일차_솔루션 도전 과제 ④ 메트릭 미들웨어","src":"> **중요**: **path를 그대로 라벨로 쓰면 안 됩니다.** `/users/1`, `/users/2`, ... 각각이 별도 시계열을 만들어 카디널리티 폭발. 반드시 `/users/:id` 형태로 정규화."},{"id":"t10-04","ty":"mc","lv":1,"game":true,"p":"실행 이미지로 <code>distroless/static:nonroot<\/code>를 쓰는 이유로 맞는 것은?","o":["Go 컴파일러가 들어 있어서","shell이 있어 디버깅이 쉬워서","root로 실행돼 권한이 넓어서","작고 shell 없고 root가 아니어서"],"a":3,"h":"Dockerfile 실행 스테이지는 gcr.io/distroless/static:nonroot를 베이스로 쓰고 USER nonroot:nonroot로 실행합니다. 솔루션은 이 이미지의 장점을 크기(5MB 미만), shell 부재, root 아닌 사용자라는 보안 관점으로 정리합니다.","w":"distroless/static:nonroot는 5MB 미만, shell 없음, root 아님이라 보안이 좋아집니다. 빌드는 앞 단계의 golang 이미지에서 합니다.","an":"5일차_솔루션 도전 과제 ⑤ Dockerfile 멀티 스테이지","src":"# === 실행 스테이지 ===\nFROM gcr.io/distroless/static:nonroot\n\nCOPY --from=builder /out/userapi /userapi\n\nEXPOSE 8080 6060\nUSER nonroot:nonroot\nENTRYPOINT [\"/userapi\"]\n```\n\n> **`distroless/static:nonroot`** 사용 이유: 5MB 미만, shell 없음, root 아님 → 보안 ↑"},{"id":"t10-05","ty":"mc","lv":3,"game":true,"p":"AuthMiddleware에 헤더 <code>Authorization: Token abc<\/code>로 요청하면 어떤 응답이 나옵니까?","o":["401 '인증 헤더 없음'","401 '잘못된 형식'","200 통과","401 '유효하지 않은 토큰'"],"a":1,"h":"AuthMiddleware는 Authorization 헤더가 비면 '인증 헤더 없음'을 반환하고, 있으면 strings.SplitN으로 공백 기준 두 부분으로 나눕니다. 첫 부분이 \"Bearer\"가 아니면 401과 함께 형식 오류 메시지를 씁니다.","w":"헤더는 있지만 <code>parts[0] != 'Bearer'<\/code>이므로 '잘못된 형식'으로 401을 보냅니다. 토큰 검증 단계까지 가지 않습니다.","an":"5일차_솔루션 도전 과제 ② Step 3 미들웨어","src":"parts := strings.SplitN(header, \" \", 2)\n if len(parts) != 2 || parts[0] != \"Bearer\" {\n writeError(w, http.StatusUnauthorized, \"잘못된 형식\")\n return\n }\n // 검증\n claims, err := mgr.Verify(parts[1])\n if err != nil {\n writeError(w, http.StatusUnauthorized, \"유효하지 않은 토큰\")\n return\n }"},{"id":"t10-06","ty":"ox","lv":1,"game":true,"p":"핸들러에서 넘기는 <code>r.Context()<\/code>는 클라이언트 연결이 끊기면 자동으로 취소됩니다.","a":true,"h":"도전 ① Step 5에서 핸들러는 s.Store.Create(r.Context(), &u)처럼 요청의 ctx를 저장소로 넘깁니다. 솔루션은 r.Context()가 HTTP 요청의 ctx라서 4일차에 배운 대로 클라이언트 연결이 끊기면 자동으로 취소된다고 설명합니다.","w":"<code>r.Context()<\/code>는 HTTP 요청의 ctx로, 클라이언트 연결이 끊어지면 자동 취소됩니다. 그래서 Store 인터페이스 메서드에 ctx를 추가합니다.","an":"5일차_솔루션 도전 과제 ① Step 5","src":"`r.Context()`는 HTTP 요청의 ctx입니다. 클라이언트 연결 끊어지면 자동 취소됩니다 (4일차 학습 응용)."},{"id":"t10-07","ty":"ox","lv":2,"game":true,"p":"Prometheus의 Gauge는 누적해서 증가만 하는 값을 나타냅니다.","a":false,"h":"도전 ④ 학습 포인트는 Prometheus 메트릭 타입을 Counter(누적), Gauge(현재값), Histogram(분포)로 구분합니다. 예제에서 사용자 수 메트릭은 생성 시 Inc, 삭제 시 Dec로 오르내렸다는 점을 떠올려 보세요.","w":"누적값은 Counter입니다. Gauge는 현재값이라 사용자 수처럼 <code>Inc()<\/code>와 <code>Dec()<\/code>로 오르내립니다.","an":"5일차_솔루션 도전 과제 ④ 학습 포인트","src":"### 학습 포인트\n\n1. **세 가지 메트릭 타입** — Counter(누적), Gauge(현재값), Histogram(분포)\n2. **카디널리티 관리** — 라벨에 무한히 다양한 값(id, IP 등) 넣지 말 것\n3. **`promauto`** — 자동 등록으로 코드 간결\n4. **레이블 정규화** — `/users/:id` 패턴화 필수\n\n---"},{"id":"t10-08","ty":"match","lv":1,"game":false,"p":"Prometheus 메트릭 타입과 예제 속 쓰임을 연결하세요.","pairs":[["Counter","HTTP 요청 총 수 (누적)"],["Gauge","현재 등록된 사용자 수"],["Histogram","요청 처리 시간 분포"]],"h":"세 메트릭 타입을 쓰임에 맞추면 됩니다. Counter는 계속 쌓이는 누적값(요청 총 수), Gauge는 오르내리는 현재값(등록된 사용자 수), Histogram은 값의 분포(요청 처리 시간)를 기록합니다.","w":"Counter는 누적, Gauge는 현재값, Histogram은 분포를 나타냅니다. 요청 수·사용자 수·처리 시간이 각각의 예입니다.","an":"5일차_솔루션 도전 과제 ④ 메트릭 정의","src":"### 학습 포인트\n\n1. **세 가지 메트릭 타입** — Counter(누적), Gauge(현재값), Histogram(분포)\n2. **카디널리티 관리** — 라벨에 무한히 다양한 값(id, IP 등) 넣지 말 것\n3. **`promauto`** — 자동 등록으로 코드 간결\n4. **레이블 정규화** — `/users/:id` 패턴화 필수\n\n---"},{"id":"t10-09","ty":"order","lv":2,"game":false,"p":"swag로 Swagger UI 문서를 노출하는 순서대로 나열하세요.","steps":["swag 도구 설치","main과 핸들러에 @Summary 등 주석 작성","/swagger/ 핸들러 등록","swag init으로 docs 생성","브라우저에서 /swagger/ 확인"],"h":"도전 ③은 swag 도구를 설치하고 main과 핸들러에 @Summary 같은 주석을 단 뒤, Swagger 핸들러를 등록합니다. 그 다음 swag init -g cmd/userapi/main.go -o docs로 docs.go·swagger.json을 생성하고 브라우저에서 /swagger/를 확인합니다.","w":"주석이 곧 문서이므로 주석을 단 뒤 <code>swag init -g cmd/userapi/main.go -o docs<\/code>로 docs를 만들고 빌드해 확인합니다. Makefile에 넣으면 빌드할 때마다 자동 갱신됩니다.","an":"5일차_솔루션 도전 과제 ③ Step 1–6","src":"### Step 4 — 문서 생성\n\n```bash\nswag init -g cmd/userapi/main.go -o docs\n```\n\n생성되는 파일:\n```\ndocs/\n├── docs.go\n├── swagger.json\n└── swagger.yaml\n```"},{"id":"t10-10","ty":"multi","lv":3,"game":false,"p":"JWT 솔루션의 공개/보호 라우트 분리에 대한 설명으로 옳은 것을 모두 고르세요.","o":["/healthz와 /login은 토큰 없이 접근","/users 계열은 AuthMiddleware를 거친다","인증 성공 시 클레임을 ctx에 넣는다","POST /login에도 토큰이 필요하다","토큰이 없으면 403을 보낸다"],"a":[0,1,2],"h":"Routes는 public mux에 GET /healthz와 POST /login을, protected mux에 /users 계열 CRUD를 등록합니다. protected는 AuthMiddleware(s.AuthMgr)로 감싸고, 미들웨어는 검증 성공 시 context.WithValue로 클레임을 ctx에 넣어 다음 핸들러에 넘깁니다.","w":"healthz와 login은 public mux에, users 계열은 <code>AuthMiddleware(s.AuthMgr)(protected)<\/code>로 감쌉니다. 인증되면 <code>context.WithValue<\/code>로 클레임을 넣고, 토큰이 없으면 401을 보냅니다.","an":"5일차_솔루션 도전 과제 ② Step 3–4","src":"func (s *Server) Routes() http.Handler {\n public := http.NewServeMux()\n public.HandleFunc(\"GET /healthz\", s.healthz)\n public.HandleFunc(\"POST /login\", s.login)\n protected := http.NewServeMux()\n protected.HandleFunc(\"POST /users\", s.createUser)\n protected.HandleFunc(\"GET /users\", s.listUsers)\n protected.HandleFunc(\"GET /users/{id}\", s.getUser)\n protected.HandleFunc(\"PUT /users/{id}\", s.updateUser)"}]},{"id":"t11","title":"pprof 기초·CPU 프로파일","ref":"5일차 §5.1–5.4 · 예제코드 §5.4","qs":[{"id":"t11-01","ty":"mc","lv":1,"game":true,"p":"채널·뮤텍스에서 기다린 시간을 측정하는 프로파일 종류는?","o":["CPU","Block","Heap","Goroutine"],"a":1,"h":"§5.1 프로파일 종류 표는 CPU(시간 소비 함수), Heap(메모리 할당), Goroutine(멈춘 위치), Mutex(락 경합)와 함께, 채널·뮤텍스에서 '막혀서(blocked)' 기다린 시간을 재는 종류를 소개합니다.","w":"Block 프로파일은 채널·뮤텍스 대기 시간을 봅니다. CPU는 함수별 시간, Heap은 메모리 할당, Goroutine은 고루틴이 멈춘 위치를 봅니다.","an":"5일차 §5.1 프로파일 종류 표","src":"| 종류 | 측정 대상 |\n|---|---|\n| CPU | 어느 함수에 시간을 가장 많이 썼는가 |\n| Heap | 어디서 메모리를 가장 많이 할당하는가 |\n| Goroutine | 어떤 고루틴이 어디서 멈춰있는가 |\n| Block | 채널/뮤텍스 대기 시간 |\n| Mutex | 락 경합 |"},{"id":"t11-02","ty":"mc","lv":1,"game":true,"p":"서버에 pprof HTTP 엔드포인트를 붙이려면 어떤 import를 씁니까?","o":["import 'runtime/trace'","import 'testing'","import _ 'net/http/pprof'","import 'log/slog'"],"a":2,"h":"net/http/pprof 패키지는 import되는 순간 init에서 /debug/pprof/ 핸들러를 기본 mux에 등록합니다. 패키지 이름을 코드에서 직접 쓰지 않으므로, 교안은 이름 대신 밑줄(_)을 붙여 부수 효과만 얻는 import로 씁니다.","w":"<code>_ 'net/http/pprof'<\/code>를 import하면 side effect로 <code>/debug/pprof/<\/code> 경로에 핸들러가 자동 등록됩니다. 예제는 6060 포트로 따로 띄웁니다.","an":"5일차 §5.2 HTTP pprof 엔드포인트","src":"## 5.2 가장 쉬운 방법 — HTTP `pprof` 엔드포인트\n\n```go\nimport (\n _ \"net/http/pprof\" // import side effect로 핸들러 등록\n \"net/http\"\n)\n\nfunc main() {\n // pprof는 /debug/pprof/ 경로에 자동 등록됨\n go http.ListenAndServe(\":6060\", nil)\n\n // 본 애플리케이션 로직\n runApplication()\n}\n```\n\n이제 브라우저에서:\n\n```\nhttp://localhost:6060/debug/pprof/\n```"},{"id":"t11-03","ty":"mc","lv":2,"game":true,"p":"pprof 셸에서 특정 함수의 소스 줄별 시간을 보는 명령은?","o":["top","web","png","list 함수명"],"a":3,"h":"pprof 셸에서 top은 비용 상위 함수 목록을, web·png는 그래프를 보여 줍니다. 특정 함수의 소스 코드를 줄 단위로 '나열'하며 각 줄의 비용을 보여 주는 명령은 뒤에 함수명을 붙여 씁니다.","w":"<code>list 함수명<\/code>은 해당 함수의 줄별 비용을 보여 줍니다. <code>top<\/code>은 상위 함수, <code>web<\/code>은 브라우저 그래프, <code>png<\/code>는 PNG 저장입니다.","an":"5일차 §5.2 pprof 셸","src":"`pprof` 셸에서:\n```\n(pprof) top\n(pprof) list 함수명\n(pprof) web # 그래프를 브라우저로\n(pprof) png # PNG 파일로 저장\n```\n\n`web` 명령은 graphviz가 필요합니다(`apt install graphviz`)."},{"id":"t11-04","ty":"mc","lv":2,"game":false,"p":"벤치마크를 실행하면서 CPU·메모리 프로파일 파일을 함께 만드는 명령은?","o":["go test -bench=. -cpuprofile=cpu.prof -memprofile=mem.prof","go test -race ./...","go test -cover ./...","go tool trace trace.out"],"a":0,"h":"§5.3은 벤치마크 실행 시 프로파일을 자동으로 만드는 방법을 보여 줍니다. go test -bench=.에 CPU 프로파일 파일과 메모리 프로파일 파일을 지정하는 옵션 두 개를 덧붙이고, 결과를 go tool pprof로 분석합니다.","w":"<code>-cpuprofile<\/code>과 <code>-memprofile<\/code>을 붙이면 벤치마크 실행 시 프로파일이 자동 생성되고, <code>go tool pprof cpu.prof<\/code>로 분석합니다.","an":"5일차 §5.3 벤치마크와 통합","src":"## 5.3 벤치마크와 통합\n\n벤치마크 실행 시 프로파일 자동 생성:\n\n```bash\ngo test -bench=. -cpuprofile=cpu.prof -memprofile=mem.prof\n\ngo tool pprof cpu.prof"},{"id":"t11-05","ty":"mc","lv":3,"game":true,"p":"BenchmarkSlowSort에서 매 반복 <code>slices.Clone(src)<\/code>로 원본을 복사하는 이유는?","o":["복사 비용을 측정하려고","정렬된 입력 재사용을 막으려고","레이스를 탐지하려고","GC를 끄려고"],"a":1,"h":"같은 슬라이스를 반복해서 정렬하면 2회차부터는 이미 정렬된 입력이 되어 최선 케이스만 측정됩니다. 예제코드의 벤치마크 작성 함정 노트는 그래서 매 반복 slices.Clone으로 원본을 복원하고, 복사 비용은 StopTimer/StartTimer로 뺀다고 설명합니다.","w":"같은 슬라이스를 반복 정렬하면 2회차부터 이미 정렬된 입력이라 최선 케이스만 측정됩니다. 복사 비용은 <code>b.StopTimer()<\/code>/<code>b.StartTimer()<\/code>로 측정에서 뺍니다.","an":"5일차_예제코드 §5.4 벤치마크 작성 함정 · 예제소스/p5_sort","src":"> ⚠️ **벤치마크 작성 함정 2가지** (조각코드를 그대로 벤치마크로 옮기면 빠지는 함정):\n> 1. **이미 정렬된 데이터 재사용** — 같은 슬라이스를 반복 정렬하면 2회차부터는 \"정렬된 입력\"이 되어 최선 케이스만 측정합니다. 그래서 매 반복 `slices.Clone`으로 원본을 복원합니다.\n> 2. **복사 비용 포함** — Clone 자체가 측정에 섞이지 않도록 `b.StopTimer()`/`b.StartTimer()`로 감쌉니다.\n>\n> 이는 본문 8.2의 `BenchmarkCreateUser` 점검 노트(중복 이메일로 409 경로만 측정)와 같은 종류의 함정입니다 — \"**벤치마크는 매 반복이 같은 작업을 수행하는지 의심하라**\"가 공통 교훈입니다."},{"id":"t11-06","ty":"ox","lv":1,"game":true,"p":"Go는 C의 gprof·perf 같은 프로파일링 도구를 표준 라이브러리로 제공합니다.","a":true,"h":"§5.1은 C에서 gprof, perf, Valgrind 같은 도구를 쓰던 경험을 언급한 뒤, Go도 비슷한 도구를 어디에서 제공하는지 설명합니다. 별도 설치 없이 runtime/pprof·net/http/pprof와 go tool pprof로 바로 쓸 수 있습니다.","w":"Go는 pprof 등 프로파일링 도구를 표준 라이브러리로 제공합니다. C에서 gprof, perf, Valgrind를 쓰던 일을 표준 도구로 할 수 있습니다.","an":"5일차 §5.1 프로파일링이란","src":"## 5.1 프로파일링이란?\n\nC에서 `gprof`, `perf`, Valgrind 같은 도구를 썼던 경험이 있을 겁니다. Go도 비슷한 도구를 **표준 라이브러리**로 제공합니다."},{"id":"t11-07","ty":"ox","lv":2,"game":true,"p":"pprof 셸의 <code>web<\/code> 명령은 추가 설치 없이 항상 동작합니다.","a":false,"h":"pprof 셸의 web 명령은 호출 그래프를 그림으로 그려 브라우저에 띄웁니다. 교안은 이 그림을 그리는 데 외부 도구 graphviz가 필요하며 apt install graphviz로 설치하라고 안내합니다.","w":"<code>web<\/code> 명령은 graphviz가 필요합니다(<code>apt install graphviz<\/code>). top·list는 그대로 쓸 수 있습니다.","an":"5일차 §5.2 CLI로 분석","src":"`pprof` 셸에서:\n```\n(pprof) top\n(pprof) list 함수명\n(pprof) web # 그래프를 브라우저로\n(pprof) png # PNG 파일로 저장\n```\n\n`web` 명령은 graphviz가 필요합니다(`apt install graphviz`)."},{"id":"t11-08","ty":"match","lv":1,"game":false,"p":"pprof 엔드포인트 URL과 수집 대상을 연결하세요.","pairs":[["/debug/pprof/profile?seconds=30","CPU 프로파일 30초 수집"],["/debug/pprof/heap","힙 메모리 할당"],["/debug/pprof/goroutine","고루틴 상태"],["/debug/pprof/","브라우저용 목록 페이지"]],"h":"pprof 엔드포인트는 경로 끝 단어가 측정 대상입니다. profile?seconds=30은 CPU를 30초 수집, heap은 힙 메모리 할당, goroutine은 고루틴 상태이며, /debug/pprof/ 자체는 브라우저에서 보는 목록 페이지입니다.","w":"profile은 CPU(seconds로 수집 시간 지정), heap은 메모리, goroutine은 고루틴을 봅니다. <code>/debug/pprof/<\/code>는 브라우저에서 여는 목록입니다.","an":"5일차 §5.2 CLI로 분석","src":"# 고루틴\ngo tool pprof http://localhost:6060/debug/pprof/goroutine\n```\n\n`pprof` 셸에서:\n```\n(pprof) top\n(pprof) list 함수명\n(pprof) web # 그래프를 브라우저로\n(pprof) png # PNG 파일로 저장\n```\n\n`web` 명령은 graphviz가 필요합니다(`apt install graphviz`)."},{"id":"t11-09","ty":"order","lv":2,"game":false,"p":"slowSort의 CPU 핫스팟을 찾는 순서대로 나열하세요.","steps":["go test -v -run TestSlowSort로 정확성 확인","go test -bench=. -cpuprofile=cpu.prof 실행","go tool pprof cpu.prof로 셸 진입","top으로 상위 함수 확인","list slowSort로 줄별 비용 확인"],"h":"p5_sort 테스트 방법은 먼저 go test -v -run TestSlowSort로 정확성을 확인하고, go test -bench=. -cpuprofile=cpu.prof로 프로파일을 만듭니다. 이어 go tool pprof로 분석해 top으로 상위 함수를 보고, list slowSort로 줄별 비용을 확인합니다.","w":"먼저 정확성을 확인하고 벤치마크로 프로파일을 만든 뒤, pprof에서 top으로 핫스팟을 찾고 list로 줄 단위로 좁힙니다.","an":"5일차_예제코드 §5.4 테스트 방법 · 5일차 §5.3","src":"**테스트 방법**:\n```bash\ngo test -v -run TestSlowSort . # 정확성\ngo test -bench=. -cpuprofile=cpu.prof . # 벤치마크 + 프로파일\ngo tool pprof -top -nodecount=5 cpu.prof # CLI로 핫스팟\ngo tool pprof -http=:8000 cpu.prof # Flame Graph (graphviz 필요)\n```\n**검증 결과** (실측):\n```\nBenchmarkSlowSort 544 2178706 ns/op ← 2.18ms\nBenchmarkStdSort 16392 68913 ns/op ← 0.07ms (약 32배 빠름)"},{"id":"t11-10","ty":"multi","lv":3,"game":true,"p":"p5_sort 실측 결과에 대한 설명으로 옳은 것을 모두 고르세요.","o":["slowSort는 약 2.18ms/op였다","표준 정렬이 약 32배 빨랐다","top에서 slowSort가 최대 핫스팟이었다","버블 정렬은 O(n log n)이다","표준 정렬이 더 느렸다"],"a":[0,1,2],"h":"p5_sort 검증 결과는 BenchmarkSlowSort와 BenchmarkStdSort의 ns/op를 ms로 환산해 보여 주고, 두 값을 비교한 배수를 주석으로 적었습니다. pprof top 출력에서도 단일 함수 최대 핫스팟이 표시됩니다.","w":"slowSort 2178706 ns/op, StdSort 68913 ns/op로 표준 정렬이 약 32배 빠릅니다. top에서도 sortdemo.slowSort가 단일 함수 최대 핫스팟입니다. 버블 정렬은 O(n²)입니다.","an":"5일차_예제코드 §5.4 검증 결과","src":"**검증 결과** (실측):\n```\nBenchmarkSlowSort 544 2178706 ns/op ← 2.18ms\nBenchmarkStdSort 16392 68913 ns/op ← 0.07ms (약 32배 빠름)"}]},{"id":"t12","title":"메모리·고루틴 누수·trace·Flame Graph","ref":"5일차 §5.5–5.10 · 예제코드 §5.9–5.10","qs":[{"id":"t12-01","ty":"mc","lv":1,"game":true,"p":"Flame Graph에서 시간을 가장 많이 쓴 함수는 어떻게 보입니까?","o":["가장 높은 막대","가장 짧은 막대","가장 넓은 막대","빨간색 막대"],"a":2,"h":"Flame graph는 함수 호출 스택을 가로로 펼친 막대 그림입니다. 교안은 막대의 '가로 폭'이 그 함수에서 쓴 시간에 비례하므로, 핫스팟을 직관적으로 찾을 수 있다고 설명합니다.","w":"Flame Graph는 호출 스택을 가로로 펼친 형태이며 <b>넓은 막대 = 시간 많이 씀<\/b>입니다.","an":"5일차 §5.8 flame graph","src":"# 좌측 메뉴: Top, Graph, Flame Graph, Source, Disassembly\n```\n\nFlame graph는 함수 호출 스택을 가로로 펼친 형태입니다. **넓은 막대 = 시간 많이 씀**."},{"id":"t12-02","ty":"mc","lv":2,"game":false,"p":"두 시점의 힙 프로파일에서 <b>차이만<\/b> 보려면 어떻게 합니까?","o":["go tool pprof -base heap1.prof heap2.prof","go tool pprof -http=:8000 heap2.prof","go test -memprofile=mem.prof","go tool trace heap1.prof"],"a":0,"h":"§5.5 누수 진단은 작업 전후로 heap1.prof, heap2.prof를 저장합니다. go tool pprof에 기준이 되는 첫 스냅샷을 -base 옵션으로 넘기고 두 번째 파일을 주면, 두 시점 사이의 차이만 표시됩니다.","w":"<code>-base heap1.prof heap2.prof<\/code>는 두 시점 사이의 차이만 표시합니다. GC 후에도 줄어들지 않은 부분이 누수 후보입니다.","an":"5일차 §5.5 누수 진단 방법","src":"# ... 작업 수행 후\ncurl http://localhost:6060/debug/pprof/heap > heap2.prof\n\ngo tool pprof -base heap1.prof heap2.prof"},{"id":"t12-03","ty":"mc","lv":2,"game":false,"p":"고루틴 누수를 의심할 때 모든 고루틴의 스택 트레이스를 출력하는 요청은?","o":["/debug/pprof/heap","/debug/pprof/profile","/debug/pprof/block","/debug/pprof/goroutine?debug=2"],"a":3,"h":"§5.6은 3일차에서 다룬 고루틴 누수를 실제로 잡는 방법으로, goroutine 엔드포인트에 상세 수준 쿼리 옵션을 붙여 요청합니다. 그러면 각 고루틴의 스택 트레이스가 모두 출력되어, 같은 위치에 수천 개가 멈춰 있는지 확인할 수 있습니다.","w":"<code>goroutine?debug=2<\/code>는 각 고루틴의 스택을 모두 출력합니다. 같은 위치에서 멈춘 고루틴이 수천 개라면 누수를 의심합니다.","an":"5일차 §5.6 고루틴 누수 탐지","src":"## 5.6 고루틴 누수 탐지\n\n3일차에서 다룬 고루틴 누수를 실제로 잡는 방법:\n\n```bash\ncurl http://localhost:6060/debug/pprof/goroutine?debug=2\n```\n\n각 고루틴의 스택 트레이스가 모두 출력됩니다. **같은 위치에서 멈춰있는 고루틴이 수천 개**라면 누수 의심."},{"id":"t12-04","ty":"mc","lv":1,"game":true,"p":"고루틴 생명주기·GC 이벤트·syscall을 시간순으로 시각화하는 도구는?","o":["runtime/debug","runtime/trace","net/http/pprof","log/slog"],"a":1,"h":"§5.9는 pprof보다 더 정밀한 추적 도구를 소개합니다. runtime 아래 '추적'이라는 이름의 패키지로 trace.Start/Stop 사이를 기록하면, go tool trace로 고루틴 생명주기·GC 이벤트·syscall을 시간순으로 볼 수 있습니다.","w":"<code>runtime/trace<\/code>로 trace.out을 만들고 <code>go tool trace<\/code>로 보면 고루틴, GC, syscall이 시간순으로 나옵니다.","an":"5일차 §5.9 runtime/trace","src":"## 5.9 `runtime/trace` — 더 정밀한 추적\n\n```go\nimport \"runtime/trace\"\n\nfunc main() {\n f, _ := os.Create(\"trace.out\")\n defer f.Close()\n\n trace.Start(f)\n defer trace.Stop()\n\n // 측정할 코드\n runApplication()\n}\n```\n\n```bash\ngo tool trace trace.out"},{"id":"t12-05","ty":"mc","lv":3,"game":true,"p":"leak.go를 실행해 몇 초 뒤 heap 프로파일의 top을 보면 어떤 결과가 나옵니까?","o":["main.main이 100%","runtime.mallocgc만 보인다","아무 함수도 안 보인다","main.leaker가 100%로 지목된다"],"a":3,"h":"leak.go의 leaker는 매초 100KB를 전역 슬라이스에 append해 해제되지 않게 합니다. 예제코드의 검증 결과는 몇 초 뒤 heap 프로파일의 top에서 이 함수가 flat%와 cum% 모두 전체를 차지한다고 보여 줍니다.","w":"<code>leaker<\/code>가 전역 슬라이스에 100KB씩 계속 append하므로 실측에서 <code>main.leaker<\/code>가 flat 100%로 지목되었습니다.","an":"5일차 §5.10 · 예제코드 §5.10 검증 결과","src":"**검증 결과** (실행 4초 후 실측):\n```\n flat flat% sum% cum cum%\n 565.76kB 100% 100% 565.76kB 100% main.leaker ← 누수 지점이 100%로 지목됨\n```\n\n---"},{"id":"t12-06","ty":"ox","lv":1,"game":true,"p":"모든 테스트는 <code>-race<\/code>로 돌리고, CI 파이프라인에도 포함하는 것이 권장됩니다.","a":true,"h":"§5.7은 3일차에서 본 -race를 다시 강조합니다. 교안은 모든 테스트를 go test -race ./...로 돌리라고 하며, 이 명령을 어디에 반드시 포함하라고 하는지가 핵심입니다.","w":"<code>go test -race ./...<\/code>는 CI에 반드시 포함시킬 명령으로 다시 강조됩니다.","an":"5일차 §5.7 go test -race 재강조","src":"## 5.7 `go test -race` 재강조\n\n3일차에서 봤지만 다시 강조: **모든 테스트는 `-race`로 돌리세요**.\n\n```bash\ngo test -race ./...\n```\n\nCI 파이프라인에 반드시 포함시킬 명령입니다."},{"id":"t12-07","ty":"ox","lv":2,"game":true,"p":"<code>GOMAXPROCS=1<\/code>로 trace를 찍어도 4개 고루틴은 여러 P 레인에 나뉘어 보입니다.","a":false,"h":"trace 화면의 P 레인은 G-M-P 스케줄러의 P를 그대로 보여 줍니다. 예제코드의 4일차 연결 노트는 GOMAXPROCS=1로 다시 찍으면 P가 하나뿐이라 4개 고루틴이 한 P에서 시분할되는 모습이 보인다고 설명합니다.","w":"trace의 P 레인은 G-M-P 스케줄러의 P입니다. GOMAXPROCS를 1로 줄이면 4개 고루틴이 한 P에서 시분할되는 모습이 보입니다.","an":"5일차_예제코드 §5.9 4일차 연결","src":"> 💡 **4일차 연결**: trace 화면의 P 레인은 3~4일차에서 다룬 **G-M-P 스케줄러**의 P를 그대로 시각화한 것입니다. GOMAXPROCS를 1로 줄여(`GOMAXPROCS=1 go run .`) 다시 trace를 찍으면 4개 고루틴이 한 P에서 시분할되는 것이 보입니다 — 스케줄러 강의의 결정적 시연 자료가 됩니다."},{"id":"t12-08","ty":"match","lv":1,"game":false,"p":"<code>go tool pprof -http=:8000<\/code> 웹 화면 메뉴와 쓰임을 연결하세요.","pairs":[["Top","비용 상위 함수 표"],["Graph","호출 관계 그래프"],["Flame Graph","스택을 가로로 펼친 막대"],["Source","소스 줄별 비용"]],"h":"go tool pprof -http=:8000으로 연 웹 화면의 좌측 메뉴는 Top, Graph, Flame Graph, Source, Disassembly입니다. 메뉴 이름이 보여 주는 형태 그대로 상위 함수 표, 호출 관계 그래프, 가로 막대 스택, 소스 줄별 비용을 보여 줍니다.","w":"웹 UI 좌측 메뉴에는 Top, Graph, Flame Graph, Source, Disassembly가 있습니다. 핫스팟은 Flame Graph의 넓은 막대로 찾는 것이 가장 직관적입니다.","an":"5일차 §5.8 flame graph","src":"# 좌측 메뉴: Top, Graph, Flame Graph, Source, Disassembly\n```\n\nFlame graph는 함수 호출 스택을 가로로 펼친 형태입니다. **넓은 막대 = 시간 많이 씀**."},{"id":"t12-09","ty":"order","lv":2,"game":false,"p":"교안의 메모리 누수 진단 절차를 순서대로 나열하세요.","steps":["시간 t1에 heap 스냅샷","작업 수행","GC 후 시간 t2에 heap 스냅샷","두 스냅샷 비교","줄어들지 않은 부분을 누수 후보로 판단"],"h":"교안 §5.5 누수 진단 방법은 네 단계입니다. 시간 t1에 heap 스냅샷, 작업 수행, GC 후 t2에 다시 스냅샷을 찍고 두 스냅샷을 비교해, GC 뒤에도 줄어들지 않은 부분을 누수 후보로 봅니다.","w":"두 시점의 힙을 찍어 <code>-base<\/code>로 비교하고, GC 뒤에도 줄지 않은 부분을 누수 후보로 봅니다.","an":"5일차 §5.5 누수 진단 방법","src":"### 누수 진단 방법\n\n1. 시간 t1에 heap 스냅샷\n2. 작업 수행\n3. GC 후 시간 t2에 heap 스냅샷\n4. 비교: 줄어들지 않은 부분이 누수 후보\n\n```bash\ncurl http://localhost:6060/debug/pprof/heap > heap1.prof"},{"id":"t12-10","ty":"multi","lv":3,"game":false,"p":"runtime/trace 예제(p5_trace)에 대한 설명으로 옳은 것을 모두 고르세요.","o":["trace.Start(f) 후 defer trace.Stop()","고루틴 4개가 CPU+I/O 작업을 한다","go tool trace로 브라우저에서 본다","분산 트레이싱 도구와 같다","trace.out 없이 콘솔에만 출력"],"a":[0,1,2],"h":"p5_trace의 main은 os.Create(\"trace.out\")으로 파일을 만들고 trace.Start(f)로 기록을 시작해 defer trace.Stop()으로 끝냅니다. worker 4개는 큰 루프(CPU)와 time.Sleep(I/O 흉내)을 섞어 일하며, 결과는 go tool trace로 브라우저에서 봅니다.","w":"trace.Start/Stop 사이를 기록해 trace.out을 만들고 <code>go tool trace<\/code>로 봅니다. 예제는 고루틴 4개의 CPU+I/O 혼합 작업입니다. 분산 트레이싱과는 다릅니다.","an":"5일차 §5.9 · 예제소스/p5_trace","src":"func worker(id int, wg *sync.WaitGroup) {\n defer wg.Done()\n sum := 0\n for i := 0; i < 50_000_000; i++ { // CPU 작업\n sum += i\n }\n time.Sleep(10 * time.Millisecond) // I/O 흉내\n _ = sum\n}\n\nfunc main() {\n f, err := os.Create(\"trace.out\")\n if err != nil {\n log.Fatal(err)\n }\n defer f.Close()\n\n if err := trace.Start(f); err != nil {\n log.Fatal(err)\n }\n defer trace.Stop()"}]},{"id":"t13","title":"CGo 기본 문법·링크·타입 변환","ref":"5일차 §6.1–6.5","qs":[{"id":"t13-01","ty":"mc","lv":1,"game":true,"p":"CGo에서 Go 파일 안의 C 코드는 어디에 씁니까?","o":["import 'C' 바로 위 주석 안","별도 .h 파일에만","func main 안의 문자열","go.mod 파일"],"a":0,"h":"CGo 핵심 규칙 1·2번은 C 코드를 Go 파일 안의 /* ... */ 블록에 쓰고, 그 블록 바로 다음 줄에 import \"C\"를 단독으로 둔다는 것입니다. 이 블록을 cgo 전문(preamble)이라고 부르며 C 함수와 #include를 여기에 둡니다.","w":"C 코드는 <code>/* ... */<\/code> 주석 안에 쓰고, 그 바로 다음 줄에 <code>import 'C'<\/code>를 둡니다. 코드가 길어지면 별도 .c 파일로 분리할 수도 있습니다.","an":"5일차 §6.2 핵심 규칙","src":"### 핵심 규칙\n\n1. **주석 안에 C 코드** — `/* ... */` 안에 C 함수, `#include` 등\n2. **`import \"C\"`** — 다른 import와 **반드시 분리된 단독 줄**, 주석 바로 다음\n3. **`C.함수명`, `C.타입명`** — Go 코드에서 C 호출\n4. **메모리 관리는 수동** — Go GC는 C가 할당한 메모리 추적 안 함"},{"id":"t13-02","ty":"mc","lv":2,"game":true,"p":"<code>C.CString('Go')<\/code>로 만든 문자열을 다 쓴 뒤 해야 할 일은?","o":["아무것도 안 해도 GC가 회수","C.GoString으로 변환","C.free로 해제","unsafe.Sizeof 호출"],"a":2,"h":"C.CString은 Go 문자열을 C 메모리에 복사해 *C.char를 만듭니다. Go GC는 C가 할당한 메모리를 추적하지 않으므로, 교안은 이 메모리를 C 표준 라이브러리의 해제 함수로 직접 풀어야 하며 보통 defer로 등록한다고 강조합니다.","w":"<code>C.CString<\/code>이 할당한 메모리는 반드시 <code>defer C.free(unsafe.Pointer(name))<\/code>로 해제해야 하며, 안 그러면 누수가 납니다.","an":"5일차 §6.2, §6.5 문자열 변환","src":"**중요**: `C.CString`이 할당한 메모리는 **반드시 `C.free`로 해제**. 안 그러면 누수."},{"id":"t13-03","ty":"mc","lv":2,"game":true,"p":"<code>C.free<\/code>를 쓰는데 'could not determine kind of name for C.free' 에러가 납니다. 빠진 것은?","o":["#include <stdio.h>","#include <stdlib.h>","#cgo LDFLAGS: -lm","import 'fmt'"],"a":1,"h":"C.free는 cgo가 C 쪽 free 선언을 찾아야 쓸 수 있는데, free는 C 표준 라이브러리 헤더에 선언되어 있습니다. 점검 노트 1은 그 헤더를 전문에 include하지 않으면 해당 컴파일 에러가 난다고 설명합니다.","w":"<code>C.free<\/code>를 쓰려면 <code>#include &lt;stdlib.h&gt;<\/code>가 반드시 필요합니다. <code>unsafe.Pointer<\/code>를 쓰므로 <code>import 'unsafe'<\/code>도 필요합니다.","an":"5일차 §6.2 점검 노트 1","src":"> ⚠️ **점검 노트 1**: `C.free`를 쓰려면 `#include <stdlib.h>`가 **반드시** 필요합니다. 빠뜨리면 `could not determine kind of name for C.free` 컴파일 에러. `unsafe.Pointer`를 쓰므로 `import \"unsafe\"`도 필요합니다."},{"id":"t13-04","ty":"mc","lv":1,"game":true,"p":"C의 <code>void *<\/code>에 대응하는 Go 쪽 타입은?","o":["*C.char","C.size_t","C.long","unsafe.Pointer"],"a":3,"h":"§6.5 타입 변환표는 C.int ↔ int, *C.char ↔ char * 처럼 대응을 정리합니다. C의 범용 포인터 void *에는 Go의 unsafe 패키지가 제공하는 '아무 포인터' 타입이 대응합니다.","w":"<code>unsafe.Pointer<\/code>는 <code>void *<\/code>에 대응합니다. <code>*C.char<\/code>는 <code>char *<\/code> 문자열, <code>C.size_t<\/code>는 <code>size_t<\/code>입니다.","an":"5일차 §6.5 타입 변환표","src":"## 6.5 타입 변환표\n\n| Go 타입 | C 타입 |\n|---|---|\n| `C.char` | `char` |\n| `C.int` | `int` |\n| `C.uint` | `unsigned int` |\n| `C.long` | `long` |\n| `C.size_t` | `size_t` |\n| `C.float`, `C.double` | `float`, `double` |\n| `*C.char` | `char *` (문자열) |\n| `unsafe.Pointer` | `void *` |"},{"id":"t13-05","ty":"mc","lv":3,"game":true,"p":"C 함수가 <code>printf<\/code>로 출력하는 프로그램을 <code>./demo | cat<\/code>으로 실행했더니 출력이 사라졌습니다. 해결책은?","o":["Go에서 fmt.Println 추가","import 'C'를 그룹 import로","C 코드에서 fflush(stdout) 호출","CGO_ENABLED=0으로 빌드"],"a":2,"h":"C의 printf는 터미널이 아닌 파이프로 출력할 때 전체 버퍼링되어, 프로세스가 끝날 때 버퍼가 비워지지 않으면 출력이 사라질 수 있습니다. 6.2 예제의 say_hello는 printf 직후 stdout 버퍼를 강제로 비우는 C 함수를 호출합니다.","w":"파이프·리다이렉트에서는 C stdio가 전체 버퍼링되는데 Go 런타임이 종료할 때 그 버퍼를 비우지 않아 출력이 사라질 수 있습니다. C 코드에서 <code>fflush(stdout)<\/code>을 호출합니다.","an":"5일차 §6.2 점검 노트 2 · 예제소스/p6_hello","src":"void say_hello(const char *name) {\n printf(\"Hello from C, %s!\\n\", name);\n fflush(stdout); // ⚠️ 아래 \"출력 유실 함정\" 참고\n}\n*/"},{"id":"t13-06","ty":"ox","lv":1,"game":true,"p":"<code>import 'C'<\/code>는 다른 패키지와 함께 그룹 import 괄호 안에 넣어도 됩니다.","a":false,"h":"CGo 핵심 규칙 2번은 import \"C\"를 다른 import와 반드시 분리된 단독 줄로, 주석 바로 다음에 두라고 합니다. §6.6 점검 노트도 그룹 import 괄호 안에 넣으면 전문 주석을 인식하지 못한다고 경고합니다.","w":"<code>import 'C'<\/code>는 다른 import와 분리된 단독 줄이어야 하고, cgo 전문 주석은 그 줄 바로 위에 있어야 인식됩니다.","an":"5일차 §6.2 핵심 규칙 2 · §6.6 점검 노트","src":"> ⚠️ **점검 노트**: `import \"C\"`는 그룹 import에 넣으면 안 됩니다(6.2 핵심 규칙 2). cgo 전문(preamble) 주석은 **단독 `import \"C\"` 줄 바로 위**에 있어야 인식됩니다."},{"id":"t13-07","ty":"ox","lv":2,"game":true,"p":"별도 .c 파일을 쓰면 <code>go build<\/code>가 자동으로 컴파일·링크하므로 Makefile이 따로 필요 없습니다.","a":true,"h":"§6.3은 C 코드가 길어지면 myadd.h·myadd.c로 분리하고 Go 전문에는 #include \"myadd.h\"만 둡니다. 교안은 같은 디렉터리의 .c 파일을 go build가 자동으로 컴파일해 링크한다고 설명합니다.","w":"<code>go build<\/code>가 같은 패키지의 .c 파일을 자동으로 컴파일해 링크합니다. 예제의 <code>C.my_add(C.int(3), C.int(4))<\/code>는 7을 돌려줍니다.","an":"5일차 §6.3 · 예제소스/p6_myadd","src":"`go build`가 자동으로 `.c` 파일을 컴파일해서 링크합니다. **별도 Makefile 불필요**."},{"id":"t13-08","ty":"match","lv":1,"game":false,"p":"<code>#cgo<\/code> 지시어와 의미를 연결하세요.","pairs":[["#cgo CFLAGS:","C 컴파일 플래그"],["#cgo LDFLAGS:","링크 플래그"],["#cgo pkg-config:","pkg-config 통합"]],"h":"§6.4 #cgo 지시어 표는 세 가지입니다. CFLAGS는 C 컴파일러에 넘기는 플래그(-I 등), LDFLAGS는 링커에 넘기는 플래그(-lm 등), pkg-config는 라이브러리 이름으로 필요한 플래그를 자동으로 가져오는 통합입니다.","w":"CFLAGS는 <code>-I/usr/include<\/code> 같은 컴파일 플래그, LDFLAGS는 <code>-lm<\/code> 같은 링크 플래그입니다. pkg-config는 openssl처럼 라이브러리 설정을 자동으로 가져옵니다.","an":"5일차 §6.4 #cgo 지시어 표","src":"| 지시어 | 의미 |\n|---|---|\n| `#cgo CFLAGS:` | C 컴파일 플래그 |\n| `#cgo LDFLAGS:` | 링크 플래그 |\n| `#cgo pkg-config:` | pkg-config 통합 |"},{"id":"t13-09","ty":"order","lv":2,"game":false,"p":"cgo 전문을 가진 Go 파일의 구성 순서대로 나열하세요.","steps":["package main","/* #include 등 C 코드 */ 주석","import 'C' 단독 줄","import 'unsafe' 등 다른 import","func main에서 C.함수 호출"],"h":"cgo 파일은 package main 다음에 /* #include 등 C 코드 */ 주석을 두고, 바로 다음 줄에 import \"C\"를 단독으로 씁니다. 그 뒤에 import \"unsafe\" 같은 다른 import를 따로 두고, func main에서 C.함수명으로 호출합니다.","w":"패키지 선언 뒤 C 코드 주석을 두고, 바로 다음 줄에 <code>import 'C'<\/code>를 단독으로 씁니다. 다른 import는 그 뒤에 따로 두고 Go 코드에서 <code>C.함수명<\/code>으로 호출합니다.","an":"5일차 §6.2 가장 단순한 CGo","src":"### 핵심 규칙\n\n1. **주석 안에 C 코드** — `/* ... */` 안에 C 함수, `#include` 등\n2. **`import \"C\"`** — 다른 import와 **반드시 분리된 단독 줄**, 주석 바로 다음\n3. **`C.함수명`, `C.타입명`** — Go 코드에서 C 호출\n4. **메모리 관리는 수동** — Go GC는 C가 할당한 메모리 추적 안 함"},{"id":"t13-10","ty":"multi","lv":3,"game":true,"p":"Go와 C 사이 문자열·바이트 변환 함수와 쓰임으로 옳은 것을 모두 고르세요.","o":["C.CString: Go → C 문자열","C.GoString: C → Go 문자열","C.GoBytes: C 메모리 → []byte","C.GoString 결과는 C.free로 해제","C.CString은 Go GC가 회수"],"a":[0,1,2],"h":"§6.5 문자열 변환 예제는 C.CString으로 Go → C 문자열(C 메모리 할당), C.GoString으로 C → Go 문자열, C.GoStringN으로 길이 지정 변환, C.GoBytes로 C 메모리를 []byte로 복사하는 방법을 보여 줍니다.","w":"CString은 C 메모리에 복사본을 할당하므로 직접 free해야 합니다. GoString, GoStringN, GoBytes는 Go 쪽 값으로 변환합니다.","an":"5일차 §6.5 문자열 변환","src":"```go\n// Go string → C string\ncstr := C.CString(\"Hello\")\ndefer C.free(unsafe.Pointer(cstr))\n\n// C string → Go string\ngostr := C.GoString(cstr)\n\n// 길이 지정 변환\ngostr := C.GoStringN(cstr, C.int(5))\n\n// 바이트 슬라이스\ngoBytes := C.GoBytes(unsafe.Pointer(cArr), C.int(length))"}]},{"id":"t14","title":"CGo 슬라이스·콜백·비용과 대안","ref":"5일차 §6.6–6.10 · 예제코드 §6.6, §6.10","qs":[{"id":"t14-01","ty":"mc","lv":1,"game":true,"p":"C 함수를 Go에서 부를 때(Go → CGo → C) 드는 대략적인 호출 비용은?","o":["~1ns","~50~150ns","~1ms","비용 없음"],"a":1,"h":"§6.8 함수 호출 오버헤드 표는 Go → Go 호출을 약 1ns로 둡니다. Go → CGo → C 호출은 그보다 100배 이상 느린 수십~백수십 ns 범위로, 교안은 호출 한 번에 많은 데이터를 처리하도록 설계하라고 권합니다.","w":"Go → Go 호출은 ~1ns, Go → CGo → C는 ~50~150ns입니다. 핫 루프에서 자주 부르면 병목이 되므로 한 번에 많은 데이터를 처리하게 설계합니다.","an":"5일차 §6.8 함수 호출 오버헤드 표","src":"### 함수 호출 오버헤드\n\n| 호출 종류 | 비용 |\n|---|---|\n| Go → Go | ~1ns |\n| Go → CGo → C | ~50~150ns |\n\n**Go 함수 호출보다 100배 이상 느립니다.** 핫 루프에서 자주 호출하면 병목입니다. 가능한 한 **호출 한 번에 많은 데이터를 처리**하는 형태로 설계하세요."},{"id":"t14-02","ty":"mc","lv":2,"game":false,"p":"Go 슬라이스 <code>data<\/code>를 C 배열 인자로 넘길 때 쓰는 포인터는?","o":["unsafe.Pointer(&data)","C.CString(data)","(*C.uchar)(unsafe.Pointer(&data[0]))","C.GoBytes(data)"],"a":2,"h":"Go 슬라이스를 C 배열로 넘길 때는 슬라이스의 첫 원소 주소 &data[0]을 unsafe.Pointer로 바꾼 뒤, C 함수가 받는 타입(const unsigned char *)에 맞게 *C.uchar로 캐스팅합니다. 길이는 C.size_t(len(data))로 함께 넘깁니다.","w":"<code>&amp;data[0]<\/code>으로 첫 원소 포인터를 얻고 <code>unsafe.Pointer<\/code>를 거쳐 <code>*C.uchar<\/code>로 바꿉니다. 길이는 <code>C.size_t(len(data))<\/code>로 함께 넘깁니다.","an":"5일차 §6.6 · 예제소스/p6_slice","src":"// Go 슬라이스 → C 배열로 전달\ndata := []byte{1, 2, 3, 4, 5}\nC.process_bytes(\n (*C.uchar)(unsafe.Pointer(&data[0])),\n C.size_t(len(data)),\n)\n```\n\n`&data[0]`은 슬라이스의 첫 원소 포인터. `unsafe.Pointer`로 변환 후 C 타입으로 캐스팅합니다."},{"id":"t14-03","ty":"mc","lv":2,"game":true,"p":"Go 함수를 C에서 호출할 수 있게 노출하는 주석은?","o":["//go:generate","//go:build cgo","// #cgo LDFLAGS","//export 함수명"],"a":3,"h":"C 라이브러리가 콜백을 요구할 때는 Go 함수를 C 쪽에 노출해야 합니다. 예제는 goCallback 함수 바로 위에 '내보내기'를 뜻하는 특수 주석을 달고, 전문에는 extern void goCallback(int);로 선언만 둡니다.","w":"<code>//export goCallback<\/code>처럼 쓰면 Go 함수가 C에 노출되고, C 쪽은 cgo가 생성한 <code>_cgo_export.h<\/code>를 include해 호출합니다.","an":"5일차 §6.7 콜백 · 예제소스/p6_callback","src":"# Go에서 호출됨: 2\n```\n\n**`//export 함수명`**으로 Go 함수를 C에 노출합니다."},{"id":"t14-04","ty":"mc","lv":3,"game":true,"p":"<code>//export<\/code>가 있는 Go 파일의 전문에 C 함수 정의(본문)를 넣으면 생기는 일은?","o":["multiple definition 링크 에러","정상 빌드된다","런타임 panic","함수가 자동 인라인"],"a":0,"h":"§6.7 점검 노트는 //export가 있는 Go 파일의 전문에는 C 함수의 선언만 둘 수 있다고 경고합니다. cgo가 전문을 두 개의 생성 파일에 복사하므로, 정의(본문)를 넣으면 같은 함수가 두 번 정의되어 링크 단계에서 실패합니다.","w":"전문이 두 생성 파일에 복사되어 'multiple definition' 링크 에러가 납니다. 전문에는 선언만 두고 정의는 별도 .c 파일로 분리합니다.","an":"5일차 §6.7 점검 노트","src":"> ⚠️ **점검 노트 (실측 확인)**: `//export`가 있는 Go 파일의 전문(preamble)에는 C 함수의 **선언만** 둘 수 있습니다. **정의(본문)를 넣으면 `multiple definition of 'run_with_callback'` 링크 에러**가 납니다 — cgo가 전문을 두 개의 생성 파일에 복사하기 때문입니다. 정의는 별도 `.c` 파일로 분리하세요."},{"id":"t14-05","ty":"num","lv":3,"game":false,"p":"p6_slice 예제에서 <code>processBytes([]byte{1, 2, 3, 4, 5})<\/code>가 반환하는 합계는?","a":15,"h":"p6_slice의 C 함수 process_bytes는 받은 바이트들의 합을 계산해 반환합니다. processBytes([]byte{1, 2, 3, 4, 5})는 다섯 원소를 C로 넘기므로 결과는 각 원소의 합(1 + 2 + 3 + 4 + 5)이며, 검증 결과에도 출력됩니다.","w":"C 함수 process_bytes가 받은 바이트를 모두 더해 15를 돌려줍니다. 빈 슬라이스는 가드 덕분에 C를 부르지 않고 0을 반환합니다.","an":"5일차_예제코드 §6.6 검증 결과 · 예제소스/p6_slice","src":"**검증 결과**:\n```\nC가 받은 데이터: 1 2 3 4 5\n합계(C에서 계산): 15\n빈 슬라이스: 0\n```"},{"id":"t14-06","ty":"ox","lv":1,"game":true,"p":"빈 슬라이스에서 <code>&data[0]<\/code>을 쓰면 panic이 나므로 길이를 먼저 확인해야 합니다.","a":true,"h":"&data[0]은 슬라이스의 0번 원소 주소를 구하는 식이라, 원소가 하나도 없으면 인덱스 범위를 벗어납니다. 교안 §6.6의 경고는 len(data) == 0일 때 이 식이 panic을 일으키므로 항상 길이를 먼저 확인하라고 합니다.","w":"<code>len(data) == 0<\/code>일 때 <code>&amp;data[0]<\/code>은 panic입니다. 예제는 빈 슬라이스면 바로 0을 반환하고, SHA-256 예제는 nil과 0을 넘깁니다.","an":"5일차 §6.6 경고 · §6.10","src":"**경고**: 슬라이스가 빈 슬라이스(`len(data) == 0`)일 때 `&data[0]`은 panic. 항상 확인."},{"id":"t14-07","ty":"ox","lv":2,"game":true,"p":"C에 넘긴 Go 포인터는 C 코드가 저장해 두고 나중에 써도 안전합니다.","a":false,"h":"§6.8 메모리 관리 규칙에 따르면 C로 전달된 Go 포인터는 C 함수 호출 동안만 유효합니다. 그 뒤에는 GC가 메모리를 옮기거나 회수할 수 있으므로, C 코드가 포인터를 저장하려면 별도로 복사해 두어야 합니다.","w":"C로 전달된 Go 포인터는 C 함수 호출 동안만 유효합니다. C가 포인터를 저장하려면 별도로 복사해야 합니다.","an":"5일차 §6.8 메모리 관리 규칙","src":"### 메모리 관리\n\n```go\n// ❌ 위험 — Go가 GC하면 C가 보고 있는 메모리가 사라짐\np := unsafe.Pointer(&goSlice[0])\nC.long_running_function(p) // 도중에 GC 발생하면 위험\n```\n\n**규칙**:\n- C로 전달된 Go 포인터는 **C 함수 호출 동안만 유효**\n- C 코드가 포인터를 **저장**하려면 별도 복사 필요\n- C에서 받은 메모리는 **반드시 C 방식으로 해제**"},{"id":"t14-08","ty":"match","lv":1,"game":false,"p":"CGo가 가져오는 비용과 구체적 증상을 연결하세요.","pairs":[["호출 오버헤드","핫 루프에서 병목"],["빌드 복잡도","크로스 컴파일에 C 툴체인 필요"],["CGO_ENABLED=0","빌드할 수 없음"],["디버깅 어려움","panic 스택이 C 부분에서 끊김"]],"h":"§6.8은 CGo 비용을 소제목별로 정리합니다. 호출 오버헤드는 핫 루프 병목, 빌드 복잡도는 크로스 컴파일에 C 툴체인이 필요하고 CGO_ENABLED=0으로는 빌드할 수 없다는 점, 디버깅 어려움은 panic 스택이 C 부분에서 끊긴다는 점입니다.","w":"CGo는 호출이 느리고, 크로스 컴파일·정적 링크가 까다롭고, CGO_ENABLED=0이면 빌드가 안 되며, Delve·race detector가 C 코드를 잘 못 봅니다.","an":"5일차 §6.8 CGo의 비용과 함정","src":"### 빌드 복잡도 증가\n\n- CGo가 있으면 **크로스 컴파일이 어려워짐** (C 툴체인 필요)\n- 정적 링크가 까다로워짐 — Docker `scratch` 이미지 사용 못 할 수 있음\n- 빌드 속도 저하\n- `CGO_ENABLED=0`으로 끄면 못 빌드됨"},{"id":"t14-09","ty":"order","lv":2,"game":false,"p":"CGo를 쓰기 전에 고민할 대안을 교안 순서대로 나열하세요.","steps":["순수 Go 라이브러리가 있는가","별도 프로세스로 분리 가능한가","호출 빈도가 적은가","C 코드 양이 적은가"],"h":"교안 §6.9는 CGo를 쓰기 전에 고민할 질문 네 가지를 번호 순으로 제시합니다. 순수 Go 라이브러리 존재 여부, gRPC/REST로 별도 프로세스 분리 가능성, 호출 빈도, 그리고 C 코드 양 순서입니다.","w":"순수 Go 포팅이 있는지, gRPC/REST로 프로세스를 나눌 수 있는지, 호출이 드문지, 한 번 포팅할 만큼 C 코드가 적은지 차례로 따져 봅니다.","an":"5일차 §6.9 대안","src":"## 6.9 대안 — 순수 Go 포팅 고려\n\nCGo를 쓰기 전에 다음을 고민하세요.\n\n1. **순수 Go 라이브러리가 있는가?** — 많은 C 라이브러리가 Go 포팅 존재\n2. **별도 프로세스로 분리 가능?** — gRPC/REST로 통신\n3. **호출 빈도가 적은가?** — 그렇다면 오버헤드 무시 가능\n4. **C 코드 양이 적은가?** — 한 번 포팅해버리는 게 장기적으로 유리"},{"id":"t14-10","ty":"multi","lv":1,"game":false,"p":"교안이 'CGo가 명백히 옳은 경우'로 든 것을 모두 고르세요.","o":["SQLite·OpenSSL 같은 큰 검증된 C 라이브러리 사용","하드웨어 SDK가 C로만 제공","C 자산을 단기간에 못 옮김","핫 루프에서 작은 C 함수 반복 호출","순수 Go 라이브러리가 이미 있음"],"a":[0,1,2],"h":"§6.9의 'CGo가 명백히 옳은 경우'는 세 가지입니다. SQLite·OpenSSL 같은 거대한 검증된 C 라이브러리를 그대로 쓸 때, 하드웨어 SDK가 C로만 제공될 때, 회사 C 자산을 단기간에 옮길 수 없을 때입니다.","w":"거대한 검증된 C 라이브러리, C로만 제공되는 하드웨어 SDK, 단기간에 옮길 수 없는 C 자산이 CGo가 옳은 경우입니다. 핫 루프 호출은 병목이 되고, 순수 Go가 있으면 그쪽이 낫습니다.","an":"5일차 §6.9 CGo가 명백히 옳은 경우","src":"### CGo가 명백히 옳은 경우\n\n- 거대한 검증된 C 라이브러리(SQLite, OpenSSL 등) 그대로 사용\n- 하드웨어 SDK가 C로만 제공\n- 회사 자산이 C로 되어 있고 단기적으로 못 옮김"}]},{"id":"t15","title":"도전 과제 ⑥ · 부하 테스트와 pprof","ref":"5일차_솔루션 도전 과제 ⑥","qs":[{"id":"t15-01","ty":"mc","lv":1,"game":true,"p":"<code>wrk -t10 -c100 -d30s<\/code>에서 <code>-c100<\/code>의 의미는?","o":["스레드 100개","100초 동안","동시 연결 100개","초당 요청 100개"],"a":2,"h":"wrk 옵션의 머리글자가 의미를 알려 줍니다. -t는 threads(스레드 수), -d는 duration(지속 시간)이고, -c는 connections로 솔루션 주석은 이를 '100 동시 연결'로 설명합니다.","w":"<code>-t10<\/code>은 10 스레드, <code>-c100<\/code>은 100 동시 연결, <code>-d30s<\/code>는 30초간입니다. /healthz는 약 43,000 RPS가 나왔습니다.","an":"5일차_솔루션 ⑥ Step 3","src":"# wrk: 10 스레드, 100 동시 연결, 30초간\nwrk -t10 -c100 -d30s http://localhost:8080/healthz\n```\n\n출력 예시:\n```\nRunning 30s test @ http://localhost:8080/healthz\n 10 threads and 100 connections"},{"id":"t15-02","ty":"mc","lv":2,"game":true,"p":"payload.json 하나로 vegeta POST 부하를 걸면 대부분 409가 나오는 이유는?","o":["이메일이 중복돼서","토큰이 없어서","JSON이 깨져서","포트가 달라서"],"a":0,"h":"vegeta POST 시나리오는 같은 payload.json({\"name\":\"Load Test\",\"email\":\"load@test.com\"})을 계속 보냅니다. 솔루션의 주의 문구는 이렇게 하면 같은 이메일로 사용자를 반복 생성하게 되어 대부분 409 Conflict가 나온다고 설명합니다.","w":"모든 요청이 같은 이메일이라 대부분 중복(409)으로 처리됩니다. 그래서 gen_targets.sh로 요청마다 다른 이메일을 만듭니다.","an":"5일차_솔루션 ⑥ Step 4 주의","src":"> **주의**: 위 시나리오는 이메일 중복으로 대부분 409 응답. 부하 측정용으로는 동적 이메일 생성 필요.\n\n동적 생성을 위한 스크립트:\n\n```bash\n#!/bin/bash"},{"id":"t15-03","ty":"mc","lv":2,"game":true,"p":"부하 중 CPU 프로파일의 <code>list createUser<\/code>에서 드러난 핫스팟은?","o":["DB 커넥션 대기","로그 출력","고루틴 생성","JSON 디코딩"],"a":3,"h":"부하 중 CPU 프로파일의 top10에서 encoding/json 관련 함수가 상위에 있고, list createUser는 핸들러의 줄별 비용을 보여 줍니다. 그중 요청 본문을 json.NewDecoder(r.Body).Decode(&u)로 해석하는 줄에 비용이 몰려 있습니다.","w":"Decode 줄이 cum 2.10s(26.25%)로 핫스팟이었습니다. 최적화 후보로 더 빠른 JSON 라이브러리 검토, 결과 캐싱, gzip 응답 압축이 제시됩니다.","an":"5일차_솔루션 ⑥ Step 5","src":"(pprof) list createUser\nTotal: 8.00s\nROUTINE ======================== userapi/internal/httpserver.(*Server).createUser\n 40ms 2.10s (flat, cum) 26.25%\n ...\n . . 30: var u user.User\n 40ms 2.10s 31: if err := json.NewDecoder(r.Body).Decode(&u); err != nil {\n . . 32: writeError(w, ...)\n ...\n```\n\n**JSON 디코딩이 핫스팟**임을 발견. 일반적 최적화 후보:\n- `json.NewDecoder(r.Body).Decode` → 더 빠른 `easyjson`/`sonic` 검토"},{"id":"t15-04","ty":"mc","lv":1,"game":true,"p":"솔루션이 꼽은 '가장 직관적으로 핫스팟을 찾는' pprof 화면은?","o":["top 표","Flame Graph","Disassembly","goroutine 목록"],"a":1,"h":"솔루션 Step 7은 go tool pprof -http=:8000으로 웹 화면을 연 뒤 좌측 메뉴에서 한 화면을 고르라고 합니다. 학습 포인트는 그 화면이 가장 직관적이며 '넓은 막대를 찾아라'라고 정리합니다.","w":"Flame Graph에서 가장 넓은 막대가 CPU를 가장 많이 쓴 곳이라 직관적으로 핫스팟을 찾을 수 있습니다.","an":"5일차_솔루션 ⑥ Step 7 · 학습 포인트","src":"# 좌측 메뉴 → Flame Graph\n```\n\n**가장 넓은 막대 = CPU 가장 많이 사용**. 직관적으로 핫스팟을 찾을 수 있습니다."},{"id":"t15-05","ty":"num","lv":3,"game":false,"p":"개선 후 보고서에서 POST /users RPS가 2,800에서 4,200으로 올랐습니다. 증가율은 몇 %입니까?","a":50,"unit":"%","h":"보고서 템플릿의 '개선 후' 항목은 POST /users RPS가 2,800에서 4,200으로 올랐다고 적습니다. 증가율은 (개선 후 − 개선 전) ÷ 개선 전 × 100으로 구합니다.","w":"증가분 1,400을 2,800으로 나누면 0.5, 즉 50%입니다. 보고서에도 +50%로 적혀 있습니다.","an":"5일차_솔루션 ⑥ Step 10 보고서 템플릿","src":"## 개선 후\n- POST /users RPS: 2,800 → 4,200 (+50%)\n```"},{"id":"t15-06","ty":"ox","lv":1,"game":true,"p":"pprof는 임시 sampling 방식이라 운영 환경에서도 비교적 안전하게 쓸 수 있습니다.","a":true,"h":"솔루션 ⑥의 학습 포인트 1번은 pprof를 운영 환경에서 어떻게 볼 수 있는지 설명합니다. 계속 계측하는 방식이 아니라 요청한 기간 동안 임시로 샘플링하기 때문에 부담이 적다는 것이 근거입니다.","w":"솔루션은 pprof가 임시 sampling이라 운영 환경에서도 안전하다고 정리합니다.","an":"5일차_솔루션 ⑥ 학습 포인트","src":"### 학습 포인트\n\n1. **pprof는 운영 환경에서도 안전** — 임시 sampling\n2. **Flame Graph가 가장 직관적** — 넓은 막대를 찾아라\n3. **부하 시나리오는 다양하게** — 단일 GET, 다양한 POST, 혼합 트래픽\n4. **DB와 앱 병목 구분** — DB 메트릭(`pg_stat_*`) 함께 확인\n5. **개선 → 측정 → 검증 사이클** — 추측이 아닌 측정 기반 최적화\n\n---"},{"id":"t15-07","ty":"ox","lv":2,"game":true,"p":"인메모리 모드보다 PostgreSQL 모드의 RPS가 낮다면 원인은 언제나 Go 코드의 비효율입니다.","a":false,"h":"Step 9는 인메모리와 PostgreSQL 모드의 RPS를 비교하며 PostgreSQL 결과 옆에 병목 위치를 괄호로 적어 둡니다. 학습 포인트도 DB 메트릭(pg_stat_*)을 함께 확인해 DB와 앱 병목을 구분하라고 합니다.","w":"인메모리 15000+ RPS 대비 PostgreSQL 2000~5000 RPS는 DB가 병목인 경우입니다. 그래서 DB 메트릭(pg_stat_*)을 함께 보고 앱 병목과 구분합니다.","an":"5일차_솔루션 ⑥ Step 9 · 학습 포인트","src":"# Requests/sec: 2000~5000 (DB가 병목)\n```\n\n**DB가 병목**일 때 다음을 검토:\n1. 인덱스 추가 (email, created_at)\n2. Connection Pool 크기 조정 (`MaxConns`)\n3. PreparedStatement 활용\n4. 읽기 복제본 분리"},{"id":"t15-08","ty":"match","lv":1,"game":false,"p":"부하 테스트 중 쓰는 명령과 목적을 연결하세요.","pairs":[["wrk","단순 GET 부하"],["vegeta attack","타깃 파일 기반 POST 부하"],["pprof/profile?seconds=30","부하 중 CPU 프로파일"],["pprof/goroutine?debug=2","부하 후 고루틴 누수 확인"]],"h":"wrk는 healthz 같은 단순 GET 부하에, vegeta attack은 타깃 파일과 payload로 POST 부하에 씁니다. pprof/profile?seconds=30은 부하 중 CPU 프로파일 수집, pprof/goroutine?debug=2는 부하를 멈춘 뒤 고루틴 누수 확인에 씁니다.","w":"wrk로 단순 GET, vegeta로 POST 시나리오를 돌리고, 부하 중에는 CPU 프로파일, 부하를 멈춘 뒤에는 goroutine?debug=2로 누수를 확인합니다.","an":"5일차_솔루션 ⑥ Step 3–8","src":"# 부하 멈춘 후 30초 대기\ncurl http://localhost:6060/debug/pprof/goroutine?debug=2 | head -100\n```\n\n같은 함수에서 멈춰 있는 고루틴이 **수백 개 이상**이라면 누수 의심.\n\n정상 상태에서는 보통 `net/http.(*conn).serve`가 활성 연결 수만큼 있고, idle 상태에서 빠르게 감소합니다."},{"id":"t15-09","ty":"order","lv":2,"game":false,"p":"솔루션의 부하 테스트·분석 진행 순서대로 나열하세요.","steps":["wrk·vegeta 설치","pprof를 켠 서버 실행","GET·POST 부하 시나리오 실행","부하 중 CPU·힙 프로파일 수집","결과 보고서 정리"],"h":"솔루션 ⑥은 wrk·vegeta 같은 도구를 설치하고 pprof를 켠 서버를 실행한 뒤, GET·POST 부하 시나리오를 돌립니다. 부하가 걸린 동안 CPU·힙 프로파일을 수집하고, 마지막 Step 10에서 결과 보고서를 정리합니다.","w":"도구를 설치하고 pprof가 켜진 서버에 부하를 걸면서 프로파일을 수집한 뒤 보고서로 정리합니다. 개선 → 측정 → 검증 사이클을 반복합니다.","an":"5일차_솔루션 ⑥ Step 1–10","src":"# wrk: 10 스레드, 100 동시 연결, 30초간\nwrk -t10 -c100 -d30s http://localhost:8080/healthz"},{"id":"t15-10","ty":"multi","lv":3,"game":false,"p":"DB가 병목일 때 솔루션이 제시한 검토 항목을 모두 고르세요.","o":["email·created_at 인덱스 추가","Connection Pool MaxConns 조정","PreparedStatement 활용","pprof 엔드포인트 제거","모든 로그를 Debug로 변경"],"a":[0,1,2],"h":"Step 9는 PostgreSQL 모드에서 DB가 병목일 때 검토할 항목을 번호로 나열합니다. 자주 조회하는 컬럼 인덱스, 커넥션 풀 크기(MaxConns), 미리 준비한 문장(PreparedStatement), 읽기 복제본 분리입니다.","w":"인덱스 추가, Pool 크기 조정, PreparedStatement, 읽기 복제본 분리가 제시됩니다. pprof 제거나 로그 레벨 변경은 DB 병목 해결책이 아닙니다.","an":"5일차_솔루션 ⑥ Step 9","src":"# Requests/sec: 2000~5000 (DB가 병목)\n```\n\n**DB가 병목**일 때 다음을 검토:\n1. 인덱스 추가 (email, created_at)\n2. Connection Pool 크기 조정 (`MaxConns`)\n3. PreparedStatement 활용\n4. 읽기 복제본 분리"}]}]};
