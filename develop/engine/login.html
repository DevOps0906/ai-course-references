<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인 · __TITLE__</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/*__TOKENS__*/
/*__COMPONENTS__*/
html,body{margin:0}
body{background:var(--color-background);color:var(--color-text);font-family:var(--font-sans);font-size:var(--fs-base);line-height:var(--lh)}
.login{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.login-main{display:flex;flex-direction:column;min-width:0;padding:var(--space-4)}
.login-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);min-height:40px}
.brand{display:inline-flex;white-space:nowrap;align-items:center;min-height:40px;font-weight:700;font-size:var(--fs-opt);color:var(--color-heading);text-decoration:none}
.brand:hover{color:var(--color-brand-text)}
.theme-btn{width:40px;padding:0;font-size:var(--text-xl)}
.theme-btn .i-moon{display:none}
:root[data-theme="dark"] .theme-btn .i-sun{display:none}
:root[data-theme="dark"] .theme-btn .i-moon{display:inline}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .theme-btn .i-sun{display:none}
  :root:not([data-theme="light"]) .theme-btn .i-moon{display:inline}
}
.login-body{flex:1;width:100%;max-width:400px;padding:var(--space-7) 0 var(--space-6)}
.login-body h1{margin:0 0 var(--space-2);font-size:var(--fs-h1);line-height:1.3;color:var(--color-heading)}
.lead{margin:0 0 var(--space-5);color:var(--color-text-muted);font-size:var(--fs-sm)}
form{display:flex;flex-direction:column;gap:var(--space-4)}
.pw-wrap{position:relative;display:flex}
.pw-wrap input{width:100%;padding-right:64px}
.pw-toggle{position:absolute;right:4px;top:4px;height:32px;padding:0 var(--space-2);border:0;border-radius:var(--radius-sm);background:transparent;color:var(--color-text-muted);font:inherit;font-size:var(--fs-xs);font-weight:600;cursor:pointer}
.pw-toggle:hover{color:var(--color-text);background:var(--color-surface-muted)}
.pw-toggle[aria-pressed="true"]{color:var(--color-brand-text)}
.field .error[hidden]{display:none}
.login .btn{width:100%;height:40px}
.divider{display:flex;align-items:center;gap:var(--space-3);margin:var(--space-4) 0;color:var(--color-text-faint);font-size:var(--fs-xs)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--color-border)}
.g-panel{margin-top:var(--space-3);padding:var(--space-4);border:1px solid var(--color-border);border-left:3px solid var(--color-brand);border-radius:var(--radius-control);background:var(--color-surface)}
.g-panel[hidden]{display:none}
.g-panel p{margin:0 0 var(--space-3);font-size:var(--fs-sm)}
.g-panel form{gap:var(--space-3)}
.foot-note{margin:var(--space-5) 0 0;color:var(--color-text-muted);font-size:var(--fs-xs)}
.login-art{display:none}
.art{width:100%;max-width:520px;height:auto;color:var(--color-text-muted)}
.art .ln{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.art .pg{fill:var(--color-surface);stroke:var(--color-border-strong);stroke-width:1.5}
.art .tx{stroke:var(--color-border-strong);stroke-width:3;stroke-linecap:round}
.art .card{fill:var(--color-surface);stroke:var(--color-border-strong);stroke-width:1.5}
.art .op{fill:var(--color-surface);stroke:var(--color-border-strong);stroke-width:1.5}
.art .op-on{fill:var(--color-brand);stroke:var(--color-brand)}
.art .scan{stroke:var(--color-brand);stroke-width:2;stroke-linecap:round}
.art .scan-soft{stroke:var(--color-brand);stroke-width:1.5;stroke-dasharray:3 5;stroke-linecap:round;opacity:.7}
.art .num{fill:var(--color-text-muted);font:600 var(--text-xs) var(--font-sans)}
.art .num-on{fill:var(--color-on-brand);font:600 var(--text-xs) var(--font-sans)}
@media (min-width:1024px){
  .login{grid-template-columns:minmax(440px,5fr) minmax(0,6fr)}
  .login-main{padding:var(--space-5) var(--space-7)}
  .login-body{padding-top:var(--space-8)}
  .login-art{display:flex;align-items:center;justify-content:center;padding:var(--space-7);background:var(--color-surface-muted);border-left:1px solid var(--color-border)}
}
</style>
</head>
<body>
<!--__ICONS__-->
<script>/*__CORE__*/</script>
<div class="login">
  <main class="login-main">
    <div class="login-top">
      <a class="brand" href="index.html" title="처음 화면으로" aria-label="디지털노마드연구소, 처음 화면으로">디지털노마드연구소</a>
      <button class="btn btn-ghost theme-btn" id="theme" type="button" aria-label="화면 밝기 바꾸기">
        <svg class="icon i-sun" aria-hidden="true"><use href="#i-sun"/></svg>
        <svg class="icon i-moon" aria-hidden="true"><use href="#i-moon"/></svg>
      </button>
    </div>

    <div class="login-body">
      <h1>로그인</h1>
      <p class="lead">체험용 로그인입니다. 기록은 이 브라우저에만 저장됩니다.</p>

      <form id="f" novalidate>
        <div class="field" id="em-f">
          <label for="em">이메일</label>
          <input id="em" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com" aria-describedby="em-err">
          <p class="error" id="em-err" hidden></p>
        </div>
        <div class="field" id="pw-f">
          <label for="pw">비밀번호</label>
          <div class="pw-wrap">
            <input id="pw" type="password" autocomplete="current-password" aria-describedby="pw-hint pw-err">
            <button class="pw-toggle" id="pw-t" type="button" aria-pressed="false" aria-controls="pw" aria-label="비밀번호 표시">표시</button>
          </div>
          <p class="hint" id="pw-hint">8자 이상</p>
          <p class="error" id="pw-err" hidden></p>
        </div>
        <button class="btn btn-primary" type="submit">로그인</button>
      </form>

      <div class="divider" aria-hidden="true">또는</div>

      <button class="btn btn-secondary" id="g" type="button" aria-expanded="false" aria-controls="g-panel">
        <svg class="icon" aria-hidden="true"><use href="#i-user"/></svg>Google로 계속
      </button>
      <div class="g-panel" id="g-panel" hidden>
        <p>체험판은 Google 계정과 연결하지 않습니다. 표시할 이름만 입력하세요.</p>
        <form id="gf" novalidate>
          <div class="field" id="gn-f">
            <label for="gn">이름</label>
            <input id="gn" type="text" autocomplete="nickname" aria-describedby="gn-err">
            <p class="error" id="gn-err" hidden></p>
          </div>
          <button class="btn btn-primary" type="submit">계속</button>
        </form>
      </div>

      <p class="foot-note">비밀번호는 저장하지 않습니다.</p>
    </div>
  </main>

  <aside class="login-art" aria-hidden="true">
    <svg class="art" viewBox="0 0 520 380" focusable="false">
      <!-- 쌓인 PDF 쪽 -->
      <rect class="pg" x="30" y="70" width="110" height="148" rx="8"/>
      <rect class="pg" x="46" y="86" width="110" height="148" rx="8"/>
      <rect class="pg" x="62" y="102" width="110" height="148" rx="8"/>
      <line class="tx" x1="80" y1="130" x2="152" y2="130"/>
      <line class="tx" x1="80" y1="148" x2="140" y2="148"/>
      <line class="tx" x1="80" y1="166" x2="150" y2="166"/>
      <line class="tx" x1="80" y1="184" x2="128" y2="184"/>
      <line class="tx" x1="80" y1="202" x2="146" y2="202"/>
      <!-- 스캔 선 -->
      <line class="scan" x1="204" y1="60" x2="204" y2="320"/>
      <line class="scan-soft" x1="186" y1="60" x2="186" y2="320"/>
      <line class="scan-soft" x1="222" y1="60" x2="222" y2="320"/>
      <!-- 문제 카드 -->
      <rect class="card" x="262" y="40" width="226" height="130" rx="10"/>
      <line class="tx" x1="282" y1="64" x2="440" y2="64"/>
      <line class="tx" x1="282" y1="80" x2="400" y2="80"/>
      <circle class="op" cx="294" cy="110" r="11"/><text class="num" x="294" y="114" text-anchor="middle">1</text>
      <circle class="op-on" cx="338" cy="110" r="11"/><text class="num-on" x="338" y="114" text-anchor="middle">2</text>
      <circle class="op" cx="382" cy="110" r="11"/><text class="num" x="382" y="114" text-anchor="middle">3</text>
      <circle class="op" cx="426" cy="110" r="11"/><text class="num" x="426" y="114" text-anchor="middle">4</text>
      <line class="tx" x1="282" y1="146" x2="350" y2="146"/>

      <rect class="card" x="262" y="190" width="226" height="130" rx="10"/>
      <line class="tx" x1="282" y1="214" x2="430" y2="214"/>
      <line class="tx" x1="282" y1="230" x2="380" y2="230"/>
      <circle class="op" cx="294" cy="260" r="11"/><text class="num" x="294" y="264" text-anchor="middle">1</text>
      <circle class="op" cx="338" cy="260" r="11"/><text class="num" x="338" y="264" text-anchor="middle">2</text>
      <circle class="op-on" cx="382" cy="260" r="11"/><text class="num-on" x="382" y="264" text-anchor="middle">3</text>
      <circle class="op" cx="426" cy="260" r="11"/><text class="num" x="426" y="264" text-anchor="middle">4</text>
      <line class="tx" x1="282" y1="296" x2="340" y2="296"/>
    </svg>
  </aside>
</div>

<script>
(()=>{
'use strict';
const next=QB.safeNext(new URLSearchParams(location.search).get('next'));
if(QB.user()){location.replace(next);return;}
const $=id=>document.getElementById(id);

$('theme').addEventListener('click',()=>QB.theme.toggle());

function setErr(inp,msg){
  const f=inp.closest('.field'), e=$(inp.id+'-err');
  if(msg){
    e.textContent=msg;e.hidden=false;f.classList.add('is-invalid');inp.setAttribute('aria-invalid','true');
  }else{
    e.textContent='';e.hidden=true;f.classList.remove('is-invalid');inp.removeAttribute('aria-invalid');
  }
  return !msg;
}
['em','pw','gn'].forEach(id=>$(id).addEventListener('input',()=>setErr($(id),'')));

const pwT=$('pw-t');
pwT.addEventListener('click',()=>{
  const show=pwT.getAttribute('aria-pressed')!=='true';
  pwT.setAttribute('aria-pressed',String(show));
  pwT.textContent=show?'숨김':'표시';
  pwT.setAttribute('aria-label',show?'비밀번호 숨기기':'비밀번호 표시');
  $('pw').type=show?'text':'password';
});

function done(o){QB.login(o);location.replace(next);}

$('f').addEventListener('submit',e=>{
  e.preventDefault();
  const em=$('em').value.trim(), pw=$('pw').value, bad=[];
  if(!setErr($('em'),/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)?'':'이메일 형식이 아닙니다. 예: name@example.com'))bad.push($('em'));
  if(!setErr($('pw'),pw.length>=8?'':'비밀번호는 8자 이상 입력하세요.'))bad.push($('pw'));
  if(bad.length){bad[0].focus();return;}
  done({email:em,name:em.split('@')[0],provider:'email'});  // 비밀번호는 저장하지 않는다
});

const g=$('g'), gp=$('g-panel');
g.addEventListener('click',()=>{
  const open=gp.hidden;
  gp.hidden=!open;g.setAttribute('aria-expanded',String(open));
  if(open)$('gn').focus();
});
$('gf').addEventListener('submit',e=>{
  e.preventDefault();
  const n=$('gn').value.trim();
  if(!setErr($('gn'),n?'':'표시할 이름을 입력하세요.')){$('gn').focus();return;}
  done({name:n,email:'',provider:'google-mock'});
});
})();
</script>
</body>
</html>
